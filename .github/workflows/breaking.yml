name: 미국 속보 알림

on:
  schedule:
    # 시간은 UTC 기준 (한국시간 = UTC + 9시간)
    # 미국 프리마켓~애프터마켓 시간대(한국 18:00 ~ 다음날 10:59)에 15분마다 확인
    - cron: "*/15 9-23 * * 1-5"   # 미국 월~금
    - cron: "*/15 0-1 * * 2-6"    # (UTC 자정 넘어가는 시간)
  workflow_dispatch:              # 직접 실행 버튼
  push:                           # 속보 설정을 고치면 바로 한 번 실행
    branches: [main]
    paths:
      - ".github/workflows/breaking.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: news-bot                 # 정기 뉴스 봇과 동시에 돌지 않게
  cancel-in-progress: false

jobs:
  breaking:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: 속보 확인
        id: check
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python news_bot.py breaking

      - name: 기록 저장
        if: always()
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add breaking.json docs NEWS.md
          if ! git diff --cached --quiet; then
            git commit -m "속보 기록"
            git pull --rebase origin main && git push
          fi

      # 새 속보가 있을 때만 목록 페이지 다시 올리기
      - name: 페이지 준비
        id: pages
        if: steps.check.outputs.deploy == 'true'
        continue-on-error: true
        uses: actions/configure-pages@v5

      - name: 페이지 파일 묶기
        if: steps.pages.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: 페이지 올리기
        id: deployment
        if: steps.pages.outcome == 'success'
        continue-on-error: true
        uses: actions/deploy-pages@v4
