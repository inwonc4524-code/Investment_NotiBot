name: 미국 속보 알림

# GitHub 의 15분 예약 실행은 실제로는 45~60분 간격으로만 돌아서,
# 1시간마다 한 번 시작해서 그 안에서 12분 간격으로 5번 확인하는 방식.
# GitHub 예약 실행이 자주 누락돼서, 작업이 끝날 때 다음 작업을 직접 이어서 시작함 (예약은 끊겼을 때 다시 잇는 예비용).
on:
  schedule:
    # 시간은 UTC 기준 (한국시간 = UTC + 9시간)
    # 미국 속보 + 해외(아시아·세계) 속보를 함께 확인하므로 평일 하루 종일 1시간마다 시작
    - cron: "3 * * * 1-5"      # 한국 월 09시 ~ 토 08시
    - cron: "3 0-1 * * 6"      # 한국 토 09~10시 (미국 금요일 장 마감 직후)
  workflow_dispatch:           # 직접 실행 버튼
    inputs:
      rounds:
        description: "몇 번 확인할지 (기본 5번, 12분 간격)"
        default: "5"
  push:                        # 속보 설정을 고치면 바로 한 번 실행
    branches: [main]
    paths:
      - ".github/workflows/breaking.yml"

permissions:
  contents: write
  actions: write               # 끝날 때 다음 확인 작업을 직접 이어서 시작하기 위해

concurrency:
  group: breaking              # 정기 뉴스 봇과는 따로 돌고, 속보 확인끼리는 겹치지 않게
  cancel-in-progress: false

jobs:
  breaking:
    runs-on: ubuntu-latest
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests trafilatura

      - name: 12분 간격으로 여러 번 속보 확인
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          ROUNDS: ${{ inputs.rounds || '5' }}
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          for i in $(seq 1 "$ROUNDS"); do
            start=$(date +%s)
            echo "===== 확인 $i/$ROUNDS ($(TZ=Asia/Seoul date '+%H:%M'))"
            git pull -q --rebase --autostash origin main || true
            rm -f .breaking_new
            python news_bot.py breaking || echo "확인 중 오류 (다음 회차에 다시 시도)"
            # 새 속보가 있을 때, 또는 마지막 회차에만 기록 저장 (12분마다 불필요한 저장 방지)
            if [ -f .breaking_new ] || [ "$i" -eq "$ROUNDS" ]; then
              git add breaking.json
              if ! git diff --cached --quiet; then
                git commit -q -m "속보 기록"
                for t in 1 2 3 4 5; do
                  git pull -q --rebase --autostash origin main && git push -q && echo "저장 완료" && break
                  echo "저장 재시도 $t/5"; sleep $((t * 5))
                done
              fi
            fi
            # 회차 시작 기준 12분 간격 유지 (확인이 오래 걸려도 전체 시간이 늘어나지 않게)
            if [ "$i" -lt "$ROUNDS" ]; then
              wait=$((720 - ($(date +%s) - start)))
              [ "$wait" -gt 0 ] && sleep "$wait"
            fi
          done

      - name: 다음 확인 작업 이어서 시작 (평일 운영 시간에만)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 운영 시간: 한국 월 09시 ~ 토 10시 (UTC 월 00시 ~ 토 01시)
          dow=$(date -u +%u); hour=$(date -u +%H)
          if [ "$dow" -le 5 ] || { [ "$dow" -eq 6 ] && [ "$hour" -lt 2 ]; }; then
            gh workflow run breaking.yml --ref main -R "$GITHUB_REPOSITORY" && echo "다음 확인 작업 예약됨"
          else
            echo "주말이라 이어서 시작하지 않음 (월요일 예약 실행부터 다시 시작)"
          fi
