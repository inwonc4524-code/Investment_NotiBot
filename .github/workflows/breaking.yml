name: 미국 속보 알림

# GitHub 의 15분 예약 실행은 실제로는 45~60분 간격으로만 돌아서,
# 1시간마다 한 번 시작해서 그 안에서 12분 간격으로 5번 확인하는 방식으로 바꿈.
on:
  schedule:
    # 시간은 UTC 기준 (한국시간 = UTC + 9시간)
    # 미국 프리마켓~애프터마켓 시간대(한국 18:00 ~ 다음날 11:00)
    - cron: "3 9-23 * * 1-5"   # 미국 월~금
    - cron: "3 0-1 * * 2-6"    # (UTC 자정 넘어가는 시간)
  workflow_dispatch:           # 직접 실행 버튼
  push:                        # 속보 설정을 고치면 바로 한 번 실행
    branches: [main]
    paths:
      - ".github/workflows/breaking.yml"

permissions:
  contents: write

concurrency:
  group: breaking              # 정기 뉴스 봇과는 따로 돌고, 속보 확인끼리는 겹치지 않게
  cancel-in-progress: false

jobs:
  breaking:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests trafilatura

      - name: 12분 간격으로 5번 속보 확인
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          for i in 1 2 3 4 5; do
            echo "===== 확인 $i/5 ($(TZ=Asia/Seoul date '+%H:%M'))"
            git pull -q --rebase origin main || true
            python news_bot.py breaking || echo "확인 중 오류 (다음 회차에 다시 시도)"
            git add breaking.json
            if ! git diff --cached --quiet; then
              git commit -q -m "속보 기록"
              for t in 1 2 3; do
                git pull -q --rebase origin main && git push -q && break
                sleep 5
              done
            fi
            if [ "$i" -lt 5 ]; then sleep 720; fi
          done
