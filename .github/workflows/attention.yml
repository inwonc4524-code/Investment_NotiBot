name: 테마 관심도 모으기 (위키백과·구글 트렌드)

# 하루 한 번: 테마별 위키백과 조회수(영·한·일·중)와 구글 트렌드 한국 검색량을 attention.json 에 저장
# → 통계 페이지의 '화제 테마 / 쟁점 테마' 판정에 씀
on:
  schedule:
    - cron: "47 3 * * *"     # 한국시간 12:47 무렵
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: attention
  cancel-in-progress: false

jobs:
  attention:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q requests pytrends
      - name: 관심도 모으기
        run: PYTHONUNBUFFERED=1 python attention.py
      - name: 저장
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add attention.json
          git diff --cached --quiet && echo "바뀐 것 없음" && exit 0
          git commit -q -m "테마 관심도 갱신"
          for t in 1 2 3 4 5 6 7 8; do
            git pull -q --rebase origin main && git push -q && echo "저장 완료" && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((t * 7))
          done
          exit 1
