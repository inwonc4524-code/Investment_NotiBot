name: 투자 테마 뉴스 알림 봇

on:
  schedule:
    # 시간은 UTC 기준 (한국시간 = UTC + 9시간)
    # GitHub 예약 실행은 보통 30~40분 늦게 시작돼서, 원하는 시간보다 30분 일찍 잡아 둠
    - cron: "10 22 * * *"   # 한국 07:10 예약 → 07:40 무렵 실행 (미국장 마감 후)
    - cron: "40 2 * * *"    # 한국 11:40 예약 → 12:10 무렵 실행 (점심)
    - cron: "40 7 * * *"    # 한국 16:40 예약 → 17:10 무렵 실행 (한국장 마감 후)
    - cron: "40 12 * * *"   # 한국 21:40 예약 → 22:10 무렵 실행 (미국장 열리기 전)
  push:                       # 코드를 고쳐서 올리면 바로 한 번 실행
    branches: [main]
    paths:                    # 봇이 기록만 저장할 때는 실행 안 됨
      - "news_bot.py"
      - ".github/workflows/news_bot.yml"
  workflow_dispatch:          # 직접 실행 버튼
    inputs:
      report:
        description: "점검 결과도 휴대폰으로 받기"
        type: boolean
        default: true

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: news-bot
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests trafilatura

      - name: 뉴스 모으기
        env:
          REPORT_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.report }}
        run: python news_bot.py

      - name: 기록 저장
        if: always()
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add seen.json docs NEWS.md sources.json
          if ! git diff --cached --quiet; then
            git commit -m "뉴스 업데이트"
            # 속보 확인이 동시에 기록을 저장했을 수 있어서, 실패하면 최신 내용 받아서 다시 시도
            for t in 1 2 3 4 5; do
              git pull -q --rebase origin main && git push -q && echo "저장 완료" && exit 0
              echo "저장 재시도 $t/5"; sleep $((t * 5))
            done
            exit 1
          fi

      # 뉴스 목록 페이지 올리기 (Settings → Pages 에서 Source 를 'GitHub Actions' 로 켜야 함)
      - name: 페이지 준비
        id: pages
        continue-on-error: true
        uses: actions/configure-pages@v5

      - name: 페이지 파일 묶기
        if: steps.pages.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: 페이지 올리기
        id: deployment
        if: steps.pages.outcome == 'success'
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: 휴대폰 알림 (한 번)
        if: always()
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          REPORT_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.report }}
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: python news_bot.py notify
