name: 투자 테마 뉴스 알림 봇

on:
  schedule:
    # 시간은 UTC 기준 (한국시간 = UTC + 9시간)
    - cron: "40 22 * * *"   # 한국 07:40 — 미국장 마감 후
    - cron: "10 3 * * *"    # 한국 12:10 — 점심
    - cron: "10 8 * * *"    # 한국 17:10 — 한국장 마감 후
    - cron: "10 13 * * *"   # 한국 22:10 — 미국장 열리기 전
  workflow_dispatch:          # 직접 실행 버튼
    inputs:
      report:
        description: "점검 결과도 휴대폰으로 받기"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: news-bot
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: 뉴스 확인
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          REPORT_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.report }}
        run: python news_bot.py

      - name: 기록 저장
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add seen.json
          git diff --cached --quiet || (git commit -m "기록 업데이트" && git push)
