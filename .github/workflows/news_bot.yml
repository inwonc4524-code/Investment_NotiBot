name: 투자 테마 뉴스 알림 봇

on:
  schedule:
    # 시간은 UTC 기준 (한국시간 = UTC + 9시간)
    # GitHub 예약 실행은 30~70분씩 늦어서 예비용. 평일에는 속보 확인 작업이 정시에 맞춰 대신 시작시킴
    - cron: "45 22 * * *"   # 한국 07:45 (미국장 마감 후)
    - cron: "15 3 * * *"    # 한국 12:15 (점심)
    - cron: "0 7 * * *"     # 한국 16:00 (한국장 마감 후)
    - cron: "15 13 * * *"   # 한국 22:15 (미국장 열리기 전)
  push:                       # 코드를 고쳐서 올리면 바로 한 번 실행
    branches: [main]
    paths:                    # 봇이 기록만 저장할 때는 실행 안 됨
      - "news_bot.py"
      - ".github/workflows/news_bot.yml"
  workflow_dispatch:          # 직접 실행 버튼
    inputs:
      report:
        description: "점검 결과도 휴대폰으로 받기"
        type: boolean
        default: true

permissions:
  contents: write
  pages: write
  id-token: write
  actions: read

concurrency:
  group: news-bot
  cancel-in-progress: false

jobs:
  # 예약 실행이 늦게 도착했을 때, 속보 확인 작업이 이미 정기 뉴스를 돌렸으면 건너뜀 (중복 알림 방지)
  guard:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.g.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q requests pillow fonttools
      - id: g
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then echo "skip=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          last=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/news_bot.yml/runs?per_page=5" \
                 --jq "[.workflow_runs[] | select(.id != ${{ github.run_id }})][0].created_at" 2>/dev/null || echo "")
          state=$(python3 news_bot.py slot "$last")
          echo "마지막 실행: $last → $state"
          if [ "$state" = "done" ]; then echo "skip=true" >> "$GITHUB_OUTPUT"; echo "이미 이번 정기 뉴스가 돌아서 건너뜀"; else echo "skip=false" >> "$GITHUB_OUTPUT"; fi

  check:
    needs: guard
    if: needs.guard.outputs.skip != 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main              # 실행이 밀려서 늦게 시작해도 항상 최신 기록에서 시작

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests trafilatura pillow fonttools

      - name: 뉴스 모으기
        env:
          REPORT_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.report }}
        run: python news_bot.py

      - name: 기록 저장
        if: always()
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add seen.json docs NEWS.md sources.json
          if ! git diff --cached --quiet; then
            git commit -m "뉴스 업데이트"
            # 속보 확인이 동시에 기록을 저장했을 수 있어서, 실패하면 최신 내용 받아서 다시 시도
            for t in 1 2 3 4 5; do
              git pull -q --rebase origin main && git push -q && echo "저장 완료" && exit 0
              git rebase --abort 2>/dev/null || true        # 충돌로 멈춘 상태면 정리하고 다시 시도
              echo "저장 재시도 $t/5"; sleep $((t * 5))
            done
            exit 1
          fi

      # 뉴스 목록 페이지 올리기 (Settings → Pages 에서 Source 를 'GitHub Actions' 로 켜야 함)
      - name: 페이지 준비
        id: pages
        continue-on-error: true
        uses: actions/configure-pages@v5

      - name: 페이지 파일 묶기
        if: steps.pages.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: 페이지 올리기
        id: deployment
        if: steps.pages.outcome == 'success'
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: 휴대폰 알림 (한 번)
        if: always()
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          REPORT_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.report }}
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: python news_bot.py notify
