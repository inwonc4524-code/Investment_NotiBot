name: probe (임시 점검)
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.cache/huggingface
          key: sentiment-probe-${{ runner.os }}-${{ github.run_id }}
          restore-keys: sentiment-
      - run: |
          pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          pip install -q "transformers>=4.40" sentencepiece protobuf accelerate
      - run: nproc; free -g; PYTHONUNBUFFERED=1 python probe_tmp.py
