name: 올해 기사 수 다시 모으기 (한 번)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "calib = 방법 점검 / run = 1월~11/14 다시 모으기"
        default: calib

permissions:
  contents: write

concurrency:
  group: count-backfill
  cancel-in-progress: false

jobs:
  calib:
    if: inputs.mode == 'calib'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q requests pillow fonttools
      - run: PYTHONUNBUFFERED=1 python count_backfill.py --calib

  month:
    if: inputs.mode == 'run'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 11
      matrix:
        r: [["2026-01-01","2026-01-31"],["2026-02-01","2026-02-28"],["2026-03-01","2026-03-31"],
            ["2026-04-01","2026-04-30"],["2026-05-01","2026-05-31"],["2026-06-01","2026-06-30"],
            ["2026-07-01","2026-07-31"],["2026-08-01","2026-08-31"],["2026-09-01","2026-09-30"],
            ["2026-10-01","2026-10-31"],["2026-11-01","2026-11-14"]]
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q requests pillow fonttools
      - name: 이어서 하기 (이미 모은 날은 건너뜀)
        run: mkdir -p count_bf && (git show origin/main:count_bf/${{ matrix.r[0] }}.json > count_bf/${{ matrix.r[0] }}.json 2>/dev/null || rm -f count_bf/${{ matrix.r[0] }}.json)
      - name: 다시 모으기
        timeout-minutes: 330
        run: PYTHONUNBUFFERED=1 python count_backfill.py ${{ matrix.r[0] }} ${{ matrix.r[1] }}
      - name: 저장
        if: always()
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add count_bf/${{ matrix.r[0] }}.json
          if ! git diff --cached --quiet; then
            git commit -q -m "올해 기사 수 다시 모으기 ${{ matrix.r[0] }}"
            for t in 1 2 3 4 5 6 7 8; do
              git pull -q --rebase origin main && git push -q && echo "저장 완료" && exit 0
              git rebase --abort 2>/dev/null || true
              sleep $((t * 7))
            done
            exit 1
          fi
