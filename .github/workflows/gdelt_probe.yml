name: GDELT 9~11월 다시 받기 시험 (한 번)
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q requests
      - run: PYTHONUNBUFFERED=1 python gdelt_probe.py
