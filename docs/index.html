그룹, 북미에서 EV 스마트 충전 플랫폼 개발","so":"AutoTechInsight","tm":"11/13 23:44","c":1,"r":"world","u":"https://autotechinsight.spglobal.com/news/5291468/weavegrid-and-hyundai-motor-group-to-develop-ev-smart-charging-platform-in-north-america","p":1794581052,"a":1794610411,"t":"WeaveGrid and Hyundai Motor Group to develop EV smart-charging platform in North America","su":"WeaveGrid와 현대 및 기아 차량의 승인된 통합을 통해 유틸리티 회사에 차량 모델 전반에 걸쳐 충전 및 배터리 데이터를 제공하게 됩니다."},{"s":"태국, 중국과 EV와 농업에서 협력 확대 \"2 플러스 2\"27년 초에 첫 개최","so":"日本経済新聞","tm":"11/13 23:26","c":1,"r":"jp","u":"https://www.nikkei.com/article/DGXZQOGS13C5J0T11C26A1000000/","p":1794580015,"a":1794610407,"t":"タイ、中国とEVや農業で協力拡大 「2プラス2」27年初に初開催","su":"[방콕=아카마 건재] 태국 아누틴 총리는 13일 방콕을 방문 중인 중국 이강 총리와 회담했다. 전기자동차(EV) 개발과 농산물 무역확대 등에 관한 8개의 협력문서를 나눴다. 투자 확대를 통해 양국의 경제관계를 강화한다. 2027년 초 양국의 외상과 국방상에 의한 ‘2플러스2’ 회의의 첫 회합을 열 방침에서도 일치했다. 양국은 7월 2플러스 2의 틀을 신설하기로 합의했다. 이씨가 23"},{"s":"리튬배터리 산업체인 주간일지 | 리튬 배터리 관련 수출 규제가 내년 1월까지 유예된다. '15차 5개년 계획'을 위한 새로운 에너지 저장 솔루션이 구현됩니다.","so":"Jiemian.com","tm":"11/13 23:24","c":1,"r":"cn","u":"https://www.jiemian.com/article/15332436.html","p":1794579852,"a":1794610396,"t":"锂电产业链周记 | 锂电池相关出口管制暂停实施至明年1月 “十五五”新型储能方案落地","su":"짐바브웨는 2027년 1월 리튬 정광 수출 금지 조치를 유지했고, 궈쉬안의 2GWh 전고체 대량 생산 라인이 가동됐으며, Tianci Materials는 50만 톤 전해질 프로젝트를 건설하기 위해 50억 위안 이하를 투자할 계획이다."},{"s":"온세미, AI·EV·에너지 애플리케이션 겨냥한 4세대 SiC 플랫폼 선보여","so":"AutoTechInsight","tm":"11/13 23:06","c":1,"r":"world","u":"https://autotechinsight.spglobal.com/news/5291465/onsemi-introduces-fourth-generation-sic-platform-targeting-ai-ev-and-energy-applications","p":1794578777,"a":1794610415,"t":"Onsemi introduces fourth-generation SiC platform targeting AI, EV and energy applications","su":"EliteSiC M4 750V 자동차 트랙션 베어 다이는 현재 사용 가능하며 2027년에는 최대 1,200V의 추가 전압 옵션이 예상됩니다."},{"s":"결산 : artience의 순이익 84% 증가 26년 12월기 EV 수요 감소로 하향 수정","so":"日本経済新聞","tm":"11/13 20:24","c":1,"r":"jp","u":"https://www.nikkei.com/article/DGXZQOUC135O50T11C26A1000000/","p":1794569088,"a":1794576135,"t":"決算:artienceの純利益84％増 26年12月期、EV需要減で下方修正","su":"artience(아티엔스, 구 동양 잉크 SC 홀딩스)는 13일, 2026년 12월기의 연결 결산은 순이익(모든 비용을 빼고 남은 돈)이 전기 대비 84% 증가한 190억엔이 될 것이라고 발표했다. 기존 예상을 20억엔 하향 수정한다. 전기자동차(EV) 수요 감속으로 리튬이온 전지 재료가 떨어지고 손상차손 92억엔을 계상한다. 매출은 11% 증가한 3880억엔, 영업이익(장사해서 남긴 돈)은 25% 증가한 260억엔을 전망한다. 종래 예상으로부터 각각 280억엔,"},{"s":"CATL은 이달 들어 eVTOL 기업 2개사 연속 계약을 맺었고, 배터리 제조사들은 저고도 분야 배치를 가속화했다.","so":"财新","tm":"11/13 20:13","c":1,"r":"cn","u":"https://companies.caixin.com/2026-11-13/102504602.html","p":1794568380,"a":1794576129,"t":"宁德时代月内连签两家eVTOL企业 电池厂商加速布局低空领域","su":"[카이신닷컴] 동력배터리 업체들이 저고도 항공기 고객 확대에 속도를 내고 있다. 11월 12일, CATL(300750.SZ)은 Yivit(Hangzhou) Aviation Technology Co., Ltd.와 유인 및 화물 차량용 전기 수직 이착륙 항공기(eVTOL)에 항공 전력 배터리를 제공하는 독점 배터리 파트너 역할을 하는 계약을 체결했다고 발표했습니다. CATL이 eVTOL 기업과의 협력을 발표한 것은 11월 이후 두 번째다. 첫 번째는 11월 2일이었습니다. 협력 파트너는 Blue Vector Aviation Technology (Shanghai) Co., Ltd.였으며 CATL은 SKYLA V30 순수 전기 틸트 로터 eVTOL용 배터리를 맞춤형으로 개발했습니다. 양 당사자는 또한 독점적인 협력 모델을 채택합니다."},{"s":"BESS 업계 소식: CATL 나트륨 이온 사양, BESS 가용성 및 전력 공급 속도 가격","so":"Energy-Storage.News","tm":"11/13 19:01","c":1,"r":"us","u":"https://www.energy-storage.news/bess-industry-buzz-catl-sodium-ion-specs-bess-availability-and-the-price-of-speed-to-power/","p":1794564102,"a":1794576126,"t":"BESS Industry Buzz: CATL sodium-ion specs, BESS availability and the price of speed-to-power"},{"s":"장안자동차 : 전고체 배터리는 파워 배터리 소재 시스템의 근본적인 변화","so":"36Kr","tm":"11/13 17:22","c":1,"r":"cn","u":"https://m.36kr.com/newsflashes/4067880412484740","p":1794558156,"a":1794576130,"t":"长安汽车：固态电池是动力电池材料体系的根本性变革"},{"s":"“에코프로 그룹, 내년 1분기 실적 회복·3분기 본격 반등 전망” [찐코노미]","so":"이투데이","tm":"11/13 16:38","c":1,"r":"kr","u":"https://www.etoday.co.kr/news/view/2648043","p":1794555480,"a":1794576125,"su":"2차전지(충전해서 다시 쓰는 배터리) 소재 기업 에코프로 그룹이 올해 4분기를 실적(회사가 번 돈 성적표) 저점으로 내년 1분기부터 회복세에 접어들어 3분기에는 본격적인 반등에 나설 것이라는 분석이"},{"s":"강원에너지, 이차전지 소재 성장에 실적 개선 본격화","so":"뉴스핌","tm":"11/13 16:34","c":1,"r":"kr","u":"https://www.newspim.com/news/view/20261113001315","p":1794555240,"a":1794576125,"su":"[서울=뉴스핌] 양태훈 기자 = 강원에너지가 이차전지 소재 사업 성장에 힘입어 올해 3분기 영업손실을 크게 줄이고 당기순이익(모든 비용을 빼고 남은 돈) 흑자전환에 성공했다. 주력인 무수수산화리튬 사업의 매출이 증가한 가운데 인공지능(AI) 데이터센터(컴퓨터 수만 대를 모아 둔 건물) 관련 설비 사업으로 영역을 확대하고"},{"s":"\"China News\" 두 부서: 에너지 저장 배터리 회사가 합리적이고 질서 있는 방식으로 프로젝트 건설을 촉진하고 맹목적인 확장 위험을 방지하도록 안내","so":"etnet 經濟通","tm":"11/13 16:30","c":1,"r":"hk","u":"https://www.etnet.com.hk/www/tc/news/news-article.php?section=categorized&category=china&newsid=20261113775","p":1794555000,"a":1794576133,"t":"《中國要聞》兩部門：指導儲能電池企業合理有序推進項目建設，防範盲目擴張風險","su":"2026/11/13 15:30 \"China News\"의 두 부서: 에너지 저장 배터리 회사가 합리적이고 질서 있는 방식으로 프로젝트 건설을 촉진하고 맹목적인 확장 위험을 방지하도록 안내 요약 면책 조항 이 내용은 기존 시장 데이터 및 뉴스 소스를 기반으로 인공 지능에 의해 생성되었으며 참고용입니다. 본 내용은 \"이코노믹스\"의 견해나 입장을 대변하지 않으며, 어떠한 투자조언도 구성하지 않습니다. AI가 생성한 정보에는 오류, 누락, 일탈 등이 있을 수 있으므로, 투자 결정을 내리기 전에 사용자가 직접 해당 내용을 확인하거나 전문가의 조언을 구해야 합니다. \"이코노믹스\"는 본 내용을 신뢰하여 발생하는 어떠한 손실이나 손해에 대해서도 책임을 지지 않습니다."},{"s":"CATL과 시드니 뉴사우스웨일스대학교, 에너지 전환 공동 추진을 위한 협력 양해각서 체결","so":"Jiemian.com","tm":"11/13 16:13","c":1,"r":"cn","u":"https://www.jiemian.com/article/15329814.html","p":1794553980,"a":1794576132,"t":"宁德时代与悉尼新南威尔士大学签署合作谅解备忘录 共促能源转型","su":"최근 2026년 호주 국제에너지쇼가 멜버른에서 열렸습니다. 남반구에서 가장 크고 가장 영향력 있는 청정 에너지 행사인 이 전시회는 효율적인 지식 공유 플랫폼일 뿐만 아니라 호주와 아시아 태평양 지역의 산업 자원을 연결하는 중요한 가교 역할을 합니다. 전시회 기간 동안 CATL은 시드니 뉴사우스웨일스 대학교(UNSW Sydney)와 협력 양해각서를 체결하여 공식적으로 전략적 파트너십을 구축했습니다. 양 당사자는 호주의 청정 에너지 전환에 필요한 전문 기술과 산업 역량을 공동으로 강화하여 혁신 결과, 기술 배당(회사가 주주에게 나눠주는 돈)금 및 산업 기회가 더 많은 사람들에게 혜택을 줄 수 있도록 할 계획입니다. 뉴 사우스 웨일즈는 호주의 재생 에너지 및 에너지 저장 인프라 개발의 최전선에 있습니다. 관련 산업의 확장이 가속화되면서 현지 전문인력에 대한 수요도 급속히 늘어나고 있다. 이를 위해 양 당사자는 에너지저장전지 인재양성, 기술 실증 및 검증, 공동과학연구 등 3대 방향을 중심으로 협력해 나갈 예정이다. 동시에 시드니 뉴사우스웨일스대학교의 50년 이상 축적된 재생에너지 혁신에 의존하여 학교의 장기간 축적된 과학 연구 보유량이 실용적인 산업 기술로 전환될 것입니다. 기술 혁신과 반복을 촉진하는 동시에 지역 고용 기회를 창출하고 지역 생산 능력의 기반을 강화하여 에너지 전환의 결과가 더 많은 어린 학생들, 지역 사회 생계 및 지역 경제에 도움이 될 것입니다."}]},{"name":"⚡ 전고체배터리·ESS","note":"보유: KODEX 전고체배터리ESS TOP2플러스","breaking":false,"items":[{"s":"국가에너지청 관계자들이 '15차 5개년 신에너지저장장치 이행계획' 기자들의 질의에 답변했다.","so":"Jiemian.com","tm":"11/13 21:26","c":7,"r":"cn","u":"https://www.jiemian.com/article/15332228.html","p":1794572762,"a":1794576145,"t":"国家能源局有关负责同志就《“十五五”新型储能实施方案》答记者问","su":"최근 국가발전개혁위원회와 국가에너지국은 공동으로 '15차 5개년 계획 신에너지저장 시행계획'(이하 '시행계획')을 발표했다. 기자는 국가 에너지 관리국의 관련 책임자 동지들과 인터뷰했습니다. 1. 실시계획을 발표하게 된 배경은 무엇입니까? 답변: 당 중앙위원회와 국무원은 새로운 에너지 저장 장치의 개발을 매우 중요하게 생각합니다. 신에너지저장장치 개발은 3년 연속 '정부사업보고서'에 포함됐다. '국가경제사회발전을 위한 15차 5개년 계획'에서는 신에너지저장장치 개발을 본격화할 것을 제안하고 있으며, 이는 '15차 5개년 계획'에서 신에너지저장장치 개발 방향을 제시한 바 있다."},{"s":"2030년까지 중국의 새로운 에너지 저장 장치 설치 용량은 3억 킬로와트에 도달할 계획입니다.","so":"中国新闻网","tm":"11/13 22:01","c":5,"r":"cn","u":"https://www.chinanews.com.cn/cj/2026/11-13/10731719.shtml","p":1794574910,"a":1794576145,"t":"到2030年中国新型储能装机规模计划达3亿千瓦","su":"2030년까지 중국의 새로운 에너지 저장 장치 설치 용량은 3억 킬로와트에 도달할 계획입니다. 중국신사서비스, 베이징, 11월 13일(왕멍야오 기자) 중국 국가에너지국이 13일 발표한 '15차 5개년 계획 신에너지저장 실행계획'에서는 2030년까지 신에너지저장이 대규모 개발단계에서 시장지향적 발전단계로 진입해 국가 신에너지저장 설치용량이 3억 킬로와트에 달하고 평균 에너지 저장시간은 약 3시간에 달한다는 목표를 세웠다. '이중 탄소' 목표의 지도 하에 중국의 신에너지는 급속히 발전했으며 시스템 피크 조절 및 전원 공급 보장에 대한 압력은 계속해서 높아지고 있습니다. 중요한 유연성 조정 자원으로서 새로운 에너지 저장 장치는 새로운 전력 시스템을 구축하기 위한 객관적인 요구 사항이 되었습니다. 2025년 말까지 중국은 1억 3,600만 킬로와트/3억 5,100만 킬로와트 시간에 달하는 새로운 에너지 저장 장치 설치 용량을 완료하고 가동했습니다."},{"s":"세계 최초 300MW 인공 챔버 압축 공기 에너지 저장 발전소가 그리드에 연결되어 전기를 생산합니다.","so":"Jiemian.com","tm":"11/16 11:44","c":3,"r":"cn","u":"https://m.jiemian.com/article/15335821.html","p":1794797063,"a":1794797222,"t":"世界首个300兆瓦人工硐室型压缩空气储能电站并网发电","su":"China Energy Construction에 따르면, 세계 최초의 300MW 인공 챔버 압축 공기 에너지 저장 발전소인 \"Yuanshu No. 1\"이 감숙성 그리드에 성공적으로 연결되어 인공 챔버 압축 공기 에너지 저장 기술이 실험적 검증에서 대규모 엔지니어링 적용에 이르기까지 획기적인 발전을 이루었으며 중국 압축 공기 에너지 저장 기술 경로의 다각적 개발을 위한 새로운 엔지니어링 사례를 제공했습니다. 압축공기 에너지저장장치는 전기에너지를 기압 위치에너지로 변환하고 필요할 때 다시 전기에너지로 변환하는 에너지 저장 기술이다. \"위안추 1호\" 발전소는 지하 110미터 암석층에 가스 저장실을 굴착하여 건설합니다. 챔버 그룹은 4개의 챔버로 구성됩니다. 발전소는 300MW의 전력과 1,800MWh의 에너지 저장 용량을 갖춘 발전 장치를 건설할 예정입니다. 전기-전기 변환 효율은 72%에 이릅니다. 한 번에 6시간 동안 장기간 발전할 수 있으며 연간 발전량은 6억kWh에 달할 수 있습니다."},{"s":"2개 부서: 그리드 측에서 독립적인 신에너지 저장 용량 전기 가격 메커니즘 구축","so":"36氪","tm":"11/13 16:58","c":3,"r":"cn","u":"https://36kr.com/newsflashes/4067858999317376","p":1794556730,"a":1794576147,"t":"两部门：建立电网侧独立新型储能容量电价机制"},{"s":"'네트워크 주식' 청화발전, 저궤도 위성과 에너지 저장장치 결합해 윈린 방재 통신망 구축","so":"中時新聞網","tm":"11/16 14:49","c":2,"r":"tw","u":"https://www.chinatimes.com/realtimenews/20261116002671-260410","p":1794808192,"a":1794809547,"t":"《通網股》中華電結合低軌衛星與儲能 打造雲林防災通訊網","su":"청화전력(2412)은 윈린현 소방서와 손잡고 '보호자 통신망'을 구축했다. 극한 기후 및 복잡한 재해 위험 증가에 대응하여 마이크로파 전송, 전문 디지털 라디오, 비디오 통신, 저궤도 위성 및 에너지 백업과 같은 기술을 통합하고 윈린현에 30개의 통신 스테이션을 구축하여 다단계 재해 예방 및 구호 통신 프레임워크를 구축합니다."},{"s":"\"한정된 시간의 전력 소비\"에 작별 인사, Donggao 그리드형 에너지 저장 장치가 인도네시아 외딴 섬의 2,000 가구를 밝힙니다.","so":"經濟日報","tm":"11/16 14:00","c":2,"r":"tw","u":"https://money.udn.com/money/story/123828/9881536","p":1794805255,"a":1794806449,"t":"告別「限時用電」 東高構網型儲能點亮印尼孤島兩千戶家庭","su":"자카르타, 인도네시아 2026년 11월 16일 /PRNewswire/ -- 최근 Donggao Future Energy가 인도네시아 남부 Pagerungan Kecil Island(이하 \"P Island\") 프로젝트에 제공한 지능형 네트워크 에너지 저장 시스템 및 에너지 관리 시스템이 가동에 들어갔습니다. Donggao Future Energy는 그리드 레벨 네트워크 에너지 저장 및 새로운 전력 시스템의 핵심 기술에 중점을 두고 있습니다. 이번에 가동되는 프로젝트의 설치 용량은 태양광 1MW + 2MW/4MWh 에너지 저장장치로, 메인 그리드와 연결되지 않은 이 고립된 섬에 안정적인 전력 지원을 제공하고, 동남아시아 섬 마이크로그리드 구축을 위한 복제 가능한 실제 샘플도 제공한다. DoGo의 그리드 형성 ESS(전기를 저장해 두는 큰 배터리)는 인도네시아 외딴 섬의 2,000가구에 24시간 전력을 공급합니다. P섬은 고립된 섬에 갇혀 있습니다: 디젤 발전과 시간 제한 전력 공급. P섬은 외진 곳에 위치하고 있어 주 전력망에 연결할 수 있는 바다 횡단 케이블이 없습니다. 기본적인 전력 수요를 유지하기 위해 오랫동안 디젤 발전에 의존해 왔습니다. 섬에는 어업으로 생계를 유지하는 영주권자가 2,000명 이상 있습니다. 원래 전원 공급 장치는 가구의 약 4분의 1에만 적용되며"},{"s":"엠플러스, '전고체 배터리' 양산시장 뚫었다…글로벌 기업서 200억대 수주","so":"파이낸셜뉴스","tm":"11/16 08:46","c":2,"r":"kr","u":"https://www.fnnews.com/news/202611160844070909","p":1794786411,"a":1794789736,"su":"이차전지 조립장비 전문기업 엠플러스가 글로벌 기업으로부터 200억원대 전고체 배터리(액체 대신 고체를 넣은 안전한 배터리) 장비를 수주(일감 주문을 받는 것)하며 차세대 배터리 시장 공략에 속도를 내고 있다."},{"s":"2개 부서: 리튬이온 배터리 에너지 저장 장치의 반복적 업그레이드를 가속화하고 나트륨 이온 배터리 에너지 저장 장치의 적용을 촉진합니다.","so":"第一财经","tm":"11/13 16:16","c":2,"r":"cn","u":"https://www.yicai.com/news/103439922.html","p":1794554168,"a":1794610448,"t":"两部门：加快锂离子电池储能迭代升级 推广钠离子电池储能应用","su":"국가 발전 개혁 위원회와 국가 에너지 관리국은 \"15차 5개년 계획 새로운 에너지 저장 구현 계획\"을 발표했습니다. 새로운 에너지 저장 혁신 방향의 과학적인 레이아웃을 제안합니다. 리튬이온 배터리 에너지 저장의 반복적 업그레이드를 가속화하고 나트륨 이온 배터리(리튬 대신 소금 성분을 쓰는 배터리) 에너지 저장의 적용을 촉진합니다. 압축공기 에너지 저장장치, 흐름전지 에너지 저장장치, 플라이휠 에너지 저장장치 등을 파일럿 애플리케이션에서 상용 애플리케이션으로 전환을 촉진합니다. 슈퍼커패시터, 압축 이산화탄소 에너지 저장, 액체 공기 에너지 저장, 중력 에너지 저장, 용융염 열 저장과 같은 기술의 시범 적용을 장려합니다. 전고체 배터리(액체 대신 고체를 넣은 안전한 배터리), 히트펌프 전력저장, 열에너지 저장, 수소 에너지 저장 등 첨단 기술 보유량을 지원합니다. 네트워크 기반 에너지 저장 장치의 개발을 더욱 촉진합니다. 시나리오 요구에 따라 네트워크형 에너지 저장 장치의 레이아웃 및 적용을 적극적이고 꾸준히 추진하고, 네트워크형 에너지 저장 기술의 신뢰성과 전력망 지원 능력을 검증하며, 네트워크형 에너지 저장 장치 계획 및 구성, 장비 기술 요구 사항 등 표준 및 사양을 점진적으로 개선합니다."},{"s":"2개 부서: 대용량 및 고출력 배터리 에너지 저장에 대한 연구와 고출력 배터리 에너지 저장 및 슈퍼커패시터의 시범 적용을 촉진합니다.","so":"第一财经","tm":"11/13 16:12","c":2,"r":"cn","u":"https://www.yicai.com/brief/103439907.html","p":1794553920,"a":1794576147,"t":"两部门：研究大容量高比功率电池储能 推动高比功率电池储能、超级电容器试点应用","su":"국가발전개혁위원회와 국가에너지국은 '신에너지저장 실시계획 15차 5개년 계획'을 발표했다. 단기 고주파 전력 에너지 저장 기술 개발을 언급했다. 저비용, 고강도 소재, 고성능 베어링, 실생활 플라이휠 에너지 저장 소재를 개발합니다."},{"s":"벌써 2031년 ESS 물량도 확보한 삼성SDI..내년엔 전고체 배터리 승부 - 머니투데이","so":"머니투데이","tm":"11/16 15:50","c":1,"r":"kr","u":"https://www.mt.co.kr/industry/2026/11/16/2026111613174278091","p":1794811800,"a":1794812212,"su":"삼성SDI가 미국 주피터파워와 3조~4조원 규모의 ESS(에너지저장장치)용 LFP(리튬인산철) 배터리 공급 물량을 추가로 확보하면서 중장기 수주(일감 주문을 받는 것) 확대의 신호탄을 쐈다. 삼성SDI는 늘어나는 ESS 수요에 대응하기 위해 미국 현지 생산능력 확대에도 속도를 내고 있다."},{"s":"에너지저장장치 세계 1위 기업 BYD, 유럽 최초 배터리셀 공장 건설로 포르투갈 선택","so":"21财经","tm":"11/16 14:20","c":1,"r":"cn","u":"https://www.21jingji.com/article/20261116/herald/cbeaa9178eb78165f3431db94c10dfe3.html","p":1794806400,"a":1794807054,"t":"全球储能第一的比亚迪，把欧洲第一家电芯工厂选在了葡萄牙","su":"Foresight Energy는 최근 포르투갈 언론인 \"Expresso\"에서 BYD가 포르투갈 정부 및 포르투갈 무역 투자청과 투자하여 포르투갈에 배터리 공장을 건설하기 위해 협상하고 있다고 보도했습니다. 후보 부지는 포르투 인근 마토지뉴스(Matosinhos)에 있는 옛 갈프(Galp) 정유공장 부지로 약 240헥타르 규모다. 2021년에 폐쇄될 예정이며, 철거 및 토양 복원 작업은 2026년 말까지 완료될 예정이다. BYD는 아직 해당 프로젝트에 대한 공식 확인서를 발행하지 않았다. 포르투갈 경제부 장관은 회사 이름을 직접 밝히지는 않았지만 정부가 중국 자동차 회사와 '생산적인 대화'를 진행하고 있음을 확인했습니다. 이 소식의 무게는 BYD Energy Storage의 글로벌 시장 좌표계에 다시 포함되어야만 명확하게 볼 수 있습니다. 2025년에 BYD의 전 세계 에너지 저장 시스템 출하량은 60GWh를 초과하고 시장 점유율 13%로 테슬라를 제치고 세계 1위가 되며, 2023년부터 2024년까지 2년 연속 1위 자리를 차지하게 됩니다. BYD의 에너지 저장 제품은 110개 이상의 국가 및 지역을 포괄하며 650개 이상의 대규모 에너지 저장 프로젝트에 시스템을 제공했습니다. 하지만 유럽에는 BYD가 아직 배터리 셀 공장을 갖고 있지 않다."},{"s":"보도자료 : [도시바] 태양광 발전소에 축전지 병설 프로젝트를 초완공 (Digital PR Platform)","so":"毎日新聞","tm":"11/16 14:00","c":1,"r":"jp","u":"https://mainichi.jp/articles/20261116/pls/00m/020/287000c","p":1794805200,"a":1794806618,"t":"プレスリリース：［東芝］太陽光発電所への蓄電池併設プロジェクトを初完工（Digital PR Platform）","su":"2026-11-16 주식회사 도시바 태양광발전소에 축전지 병설 프로젝트를 첫 완공"},{"s":"당신을 중심으로 구성된 Keeper Family: Sungrow의 종합 C&I 에너지 저장 솔루션 소개","so":"The Straits Times","tm":"11/16 13:23","c":1,"r":"sg","u":"https://www.straitstimes.com/paid-press-releases/keeper-family-shaped-around-you-introducing-sungrows-comprehensive-ci-energy-storage-solutions-20261116","p":1794802980,"a":1794806453,"t":"Keeper Family, Shaped Around You: Introducing Sungrow's Comprehensive C&I Energy Storage Solutions","su":"허페이, 중국, 2026년 11월 16일 /PRNewswire/ -- 전 세계적으로 선도적인 PV 인버터 및 에너지 저장 시스템 공급업체인 Sungrow가 전체 mo 제품군을 출시했습니다."},{"s":"조업은 설탕 생산기계의 제조…전고체 전지용 총력, 츠키시마 HD의 기술력","so":"ニュースイッチ by 日刊工業新聞社","tm":"11/16 12:01","c":1,"r":"jp","u":"https://newswitch.jp/p/50814","p":1794798060,"a":1794806451,"t":"祖業は砂糖生産機械の製造…全固体電池向け総力、月島HDの技術力","su":"츠키시마 홀딩스(HD)의 사업 자회사인 츠키시마 기계(도쿄도 주오구)는 전고체 전지의 정극재에서 중요한 미세한 전구체 제작에 빼놓을 수 없는 장치를 다루고 있다. 2010년경부터 개발에 착수하는 등 대처의 숨은 길다..."},{"s":"'15차 5개년 계획' 신에너지저장 실시계획 발표, 신전력시스템 구축 강화, 전력ETF 보시(561700) 추적지수 상승","so":"Jiemian.com","tm":"11/16 11:53","c":1,"r":"cn","u":"https://www.jiemian.com/article/15335787.html","p":1794797613,"a":1794806447,"t":"“十五五”新型储能实施方案印发，新型电力系统建设力度加大，电力ETF博时(561700)跟踪指数上涨","su":"전력 ETF(여러 주식을 묶어 파는 상품) Boshi(561700)는 CSI 전력 유틸리티 지수를 추적하며 \"15차 5개년 계획\" 신규 에너지 저장 정책의 혜택을 받았습니다. 11월 16일 지수는 0.31% 상승했고, 구성종목은 전반적으로 상승했다."},{"s":"삼성SDI, 주피터파워에 LFP 배터리 공급","so":"Yonhap News Agency","tm":"11/16 09:33","c":1,"r":"us","u":"https://en.yna.co.kr/view/AEN20261116002300320","p":1794789187,"a":1794789737,"t":"Samsung SDI to supply LFP batteries to Jupiter Power","su":"서울, 11월 16일(연합) -- 국내 2위 배터리 제조사인 삼성SDI가..."},{"s":"중국 메이커가 JC-STAR 대응에 고전하는 이유── 태양광·축전지 사업자가 취해야 할 대응은","so":"ITmedia","tm":"11/16 07:00","c":1,"r":"jp","u":"https://www.itmedia.co.jp/smartjapan/articles/2611/16/news007.html","p":1794780000,"a":1794784865,"t":"中国メーカーがJC-STAR対応に苦戦する理由──太陽光・蓄電池事業者がとるべき対応は","su":"2027년 4월 이후, 태양광 발전·축전지의 계통 연계의 필수 요건이 되는 JC-STAR 제도에 대해 해설하는 본 연재. 후편이 되는 이번은, 공개되고 있는 ★1 적합 라벨 취득 제품 리스트를 분석해, 중국 메이커의 ★1 취득 상황과 그 배경, 그리고 태양광·축전지 사업자가 지금 해야 할 대응의 포인트에 대해서 해설한다."},{"s":"이시카리에 「국산」특고 축전소, 재에너지산지소에 공헌도(4페이지째)","so":"日経クロステック","tm":"11/16 05:00","c":1,"r":"jp","u":"https://xtech.nikkei.com/atcl/nxt/column/18/02443/110600187/?P=4","p":1794772800,"a":1794784868,"t":"石狩に「国産」特高蓄電所、再エネ地産地消に貢献も（4ページ目）","su":"JR 삿포로역에서 자동차로 북쪽으로 30분이 걸리지 않고, 이시카리시와 오타루시에 걸친 ‘이시카리만 신항’은 인구 230만명을 보유한 삿포로 경제권의 바다 현관구가 된다. 항구에 면한 약 3000ha의 광대한 지역은 홋카이도를 대표하는 공업단지와 유통거점으로 되어 있으며, 공장 외에 상업시설이나 호텔, 데이터센터(컴퓨터 수만 대를 모아 둔 건물), 물류센터 등 약 760개사가 진출해 2만명 이상이 일하고 있다."},{"s":"ESS Tech, Inc.의 주가(GWHTQ)를 실시간으로 확인해보세요","so":"CNBC","tm":"11/16 04:10","c":1,"r":"us","u":"https://www.cnbc.com/quotes/GWHTQ","p":1794769806,"a":1794784861,"t":"Check out ESS Tech, Inc.'s stock price (GWHTQ) in real time","su":"ESS(전기를 저장해 두는 큰 배터리) Tech, Inc.(GWHTQ:OTCQB) CNBC에서 실시간 주가, 뉴스, 가격 및 금융 정보를 받아보세요."},{"s":"탄소 제로 커피 하우스부터 글로벌 에너지 저장 솔루션까지, Fujian Ningde는 탄소 제로 미래 도시를 건설하기 위해 협력하고 있습니다.","so":"中国新闻网","tm":"11/15 21:06","c":1,"r":"cn","u":"https://www.chinanews.com.cn/cj/2026/11-15/10732461.shtml","p":1794744376,"a":1794806844,"t":"从零碳咖啡屋到全球储能解决方案 福建宁德聚力打造零碳未来城","su":"从零碳咖啡屋到全球储能解决方案 福建宁德聚力打造零碳未来城 中新网宁德11月15日电 (吴允杰)漫步福建省宁德市，“零碳”早已从纸面理念落地为可感可触的日常场景：在搭载光伏储能建筑一体化技术的“宁时光·零碳空间”咖啡屋，市民晒着阳光享用下午茶；东湖之上，游客乘“东湖之星”“东湖之光”纯电动游船饱览湖光山色；赤鉴湖畔，形似游艇的全球首个eVTOL零碳水上机场科技感十足……山海之间，一个零碳未来城正在持续生长。 能源结构绿色转型，是“零碳宁德”的根基。在宁德福鼎市台山岛上，全国首个离网型兆瓦级海岛微电网项目建设正酣。该项目创新氢氨转换技术，实现零碳转化发电，与锂电池形成“短时调峰+长时保供”双储能体系，总装机容量1.505兆瓦，可脱离大陆电网独立运行。"},{"s":"테슬라 실적 발표 대본: 로봇 공학, 자율 주행 및 에너지 저장에 크게 투자하고 자본 지출이 계속 확대되고 있습니다.","so":"财联社","tm":"11/15 10:43","c":1,"r":"cn","u":"https://www.cls.cn/detail/2434633","p":1794707026,"a":1794727091,"t":"特斯拉财报会实录：大举押注机器人、自动驾驶与储能 资本开支持续扩张","su":"① 머스크는 실적(회사가 번 돈 성적표)발표에서 테슬라가 \"제2차 세계대전 이후 미국에서 가장 빠른 산업 규모 확장\"을 겪고 있다고 말하고, 올해 자본 지출이 250억 달러를 초과할 것으로 예상되며 향후 2~3년간 계속 증가할 것이라고 거듭 강조했다. ②테슬라 경영진은 휴머노이드(사람을 닮은 로봇) 로봇, 자율주행 택시, 에너지 저장장치, 자체 개발 칩 등 4대 주요 사업을 중심으로 자본 지출을 계속 늘릴 것이라고 밝히며 시장의 핵심 질문에 답했다. 차이롄서, 7월 23일(편집자 Liu Rui) 테슬라는 수요일 동부 표준시 시장 마감 후 2분기 재무 결과를 발표했습니다. 차량 납품 및 에너지저장장치 설치 데이터는 인상적이었지만 분기 매출총이익률 하락과 생산 확대에 대한 높은 투자로 시장 우려가 컸고, 장 마감 후 주가가 하락했다. 머스크 테슬라 최고경영자(CEO)는 실적 보고서 발표 후 컨퍼런스콜에서 “테슬라는 제2차 세계대전 이후 미국에서 가장 빠른 산업 규모 확장을 겪고 있다”며 “올해 자본 지출이 250억 달러를 넘어설 것으로 예상되며 향후 2~3년간 계속해서 성장할 것”이라고 거듭 강조했다."},{"s":"해외조사 및 선정 | 골드만삭스: 글로벌 배터리 수급 비율은 2029년 바닥을 칠 수 있고, 에너지 저장 성장은 초과분을 상쇄하기 어려울 것","so":"财联社","tm":"11/15 05:55","c":1,"r":"cn","u":"https://www.cls.cn/detail/2506034","p":1794689708,"a":1794727317,"t":"海外研选 | 高盛：全球电池供需比或2029年触底 储能增长难抵过剩","su":"① 미국은 전기차 배터리 과잉을 지속하고 있으나, 에너지 저장 배터리의 현지 생산 능력이 부족하다. ② 한국 배터리 업체들의 유럽 시장 점유율은 일부 안정됐지만, 중국의 수입 경쟁은 여전히 ​​치열하다. ③ 국내 배터리셀 제조사들은 2027년과 2028년 이익 전망치를 평균 10% 하향 조정했는데, CATL의 에너지 저장장치 전환이 유망하다. 차이롄서, 10월 15일(편집자 Xia Junxiong) 골드만삭스는 10월 14일 글로벌 배터리 산업 조사 보고서를 발표했습니다. 이는 에너지 저장 시장의 급속한 확장으로 배터리 수요 전망이 개선되고 있지만, 글로벌 배터리 산업은 여전히 ​​과잉 생산 능력, 지역 시장 수급 불균형 및 치열한 시장 경쟁에 직면해 있으며, 이는 업계가 사이클이 바닥을 쳤다는 것을 확인하기에 충분한 신호를 아직 보지 못했다는 것을 의미합니다. 은행은 중국 외 배터리 시장의 수급 공급률은 2027년을 바닥으로, 글로벌 시장은 2029년까지 수급 전환점이 이뤄지지 않을 것으로 내다봤다."},{"s":"화웨이, 새로운 20kW 가정용 배터리로 테슬라 파워월에 도전","so":"Electrek","tm":"11/15 01:25","c":1,"r":"us","u":"https://electrek.co/2026/11/14/huawei-set-to-challenge-tesla-powerwall-with-new-20-kw-home-battery/","p":1794673500,"a":1794698079,"t":"Huawei set to challenge Tesla Powerwall with new, 20 kW home battery","su":"이 하이테크 화웨이 홈 배터리 팩은 실리콘 카바이드 기술, AI 기반 에너지 관리 기능을 갖춘 테슬라의 최신 파워월을 저지하기를 희망합니다."},{"s":"에너지 저장 산업의 글로벌 협력을 촉진하기 위해 글로벌 에너지 저장 동맹 이니셔티브(Global Energy Storage Alliance Initiative) 발표","so":"财新","tm":"11/14 21:37","c":1,"r":"cn","u":"https://companies.caixin.com/2026-11-14/102504955.html","p":1794659820,"a":1794664813,"t":"全球储能联盟倡议发布 推动储能产业全球合作","su":"[Caixin.com] 글로벌 에너지 전환이 심화됨에 따라 새로운 전력 시스템의 핵심 인프라인 에너지 저장 장치는 글로벌 시장에서 꾸준히 수요가 증가하고 있습니다. 국제 교류와 협력을 촉진하는 방법은 중국의 에너지 저장 '세계화'의 다음 초점이 되었습니다. 이러한 배경에서 지난 11월 14일 제31차 유엔기후회의(COP31) 차이나코너에서 수력 및 물 보존 계획 및 설계 종합연구소, 중관촌 에너지저장산업기술연맹, 중국남방그리드에너지저장소(600995.SH)가 국내외 유수 기업들과 함께 글로벌 에너지 저장 동맹 이니셔티브(이하 이니셔티브)를 공동 출범시켰다. 동맹의 행동 방향에는 국제 대화 및 교환 플랫폼 구축, 글로벌 에너지 저장 데이터베이스 및 표준 시스템 구축, 첨단 기술의 연구 개발 및 홍보 강화, 시장 메커니즘 개선 및 비즈니스 모델 혁신 촉진, 공급망(부품·재료가 오가는 연결망) 협력 강화 및 글로벌 무역 발전 촉진, 투자, 자금 조달(사업에 쓸 돈을 모으는 것) 및 프로젝트 협력 촉진이 포함됩니다."},{"s":"에너지저장전지 ETF E펀드 순청약액은 11월 12일 기준 1,300만좌 감소해 전년 대비 36.09% 감소했다.","so":"经济观察网","tm":"11/14 11:49","c":1,"r":"cn","u":"http://www.eeo.com.cn/2026/1114/1092713.shtml","p":1794624540,"a":1794659877,"t":"储能电池ETF易方达11月12日净申购减少1300万份，近一年跌36.09%","su":"경제 관찰자 네트워크 에너지 저장 배터리 ETF(여러 주식을 묶어 파는 상품) E 펀드(159566)는 11월 12일 기준 -1,300만주의 순청약을 기록했으며 이는 이 ETF 펀드 지분의 0.55%를 차지합니다. 펀드의 최근 주식수는 23억5300만주로 상장(주식시장에 처음 들어오는 것) 이후 누적 증가액은 21억3200만주다. 최신 스케일 34...."},{"s":"본토는 새로운 에너지 저장 장치의 시장화를 촉진합니다.","so":"信報網站","tm":"11/14 03:26","c":1,"r":"hk","u":"https://www.hkej.com/dailynews/finnews/article/4565207/%E5%85%A7%E5%9C%B0%E6%8E%A8%E9%80%B2%E6%96%B0%E5%9E%8B%E5%84%B2%E8%83%BD%E5%B8%82%E5%A0%B4%E5%8C%96","p":1794594400,"a":1794610457,"t":"內地推進新型儲能市場化","su":"신흥 기간 산업을 적극적으로 육성하고 새로운 에너지 저장 장치를 적극적으로 개발하기 위해 국가 발전 개혁위원회와 국가 에너지 관리국은 공동으로 \"신 에너지 저장 장치 실행 계획을 위한 15차 5개년 계획\"(이하 \"계획\"이라고 함)을 발표했습니다. 15차 5개년 계획 기간 동안 신에너지 저장을 '대규모 개발'에서 '시장 지향적 개발' 단계로 추진하고 신 에너지 저장을 위한 다양한 응용 시나리오를 구축하며 신 에너지 저장 기술 혁신과 연구를 지원해야 한다고 제안되었습니다. 2030년까지 국가 신에너지 저장장치 설치 용량은 3억kW에 도달하고, 평균 에너지 저장 시간은 약 3시간이 되는 것이 목표다. 허베이의 설치 용량은 2030년까지 3억 킬로와트에 도달할 것으로 예상됩니다. \"계획\"에서는 15차 5개년 계획 기간 동안 새로운 에너지 저장 장치가 주로 시스템의 \"소스 네트워크\" 요구를 충족할 것이라고 지적합니다."},{"s":"美민주당 집권, 에너지저장산업 폭발 기대","so":"信報網站","tm":"11/14 03:20","c":1,"r":"hk","u":"https://www.hkej.com/dailynews/investment/article/4565313/%E7%BE%8E%E6%B0%91%E4%B8%BB%E9%BB%A8%E5%BE%97%E5%8B%A2+%E5%84%B2%E8%83%BD%E7%94%A2%E6%A5%AD%E6%96%99%E7%88%86%E7%99%BC","p":1794594007,"a":1794610460,"t":"美民主黨得勢 儲能產業料爆發","su":"미국 중간선거 이후 민주당은 상원과 하원을 다시 장악했다. 정치 판 전체가 바뀌었을 뿐만 아니라, 공화당의 본거지이자 미국 미래인공지능데이터센터(AIDC)의 중심지인 텍사스의 3선 주지사도 축출됐다. 시장에서는 다수의 AIDC 프로젝트가 전력 공급 계획을 재검토해야 하고 이로 인해 건설 속도가 위장 둔화될 수 있다는 점을 우려하고 있습니다. 중간선거가 시작된 뒤 필라델피아 반도체(전자기기의 두뇌 부품) 지수는 급락했고, AI주도 급락했다. 정책 기울기가 예상되어 많은 주에서 이를 배포하고 있습니다. 이번 중간선거 전체를 돌이켜보면 미국 국민들은 트럼프 대통령이 중동 전쟁을 촉발한 것뿐 아니라, 데이터센터를 대규모로 개발해 인구를 늘린 것에 대해 가장 불만을 품고 있다."},{"s":"퀀텀스케이프, 전고체 배터리 Osprey용 개방형 플랫폼 출시","so":"AutoTechInsight","tm":"11/14 02:49","c":1,"r":"world","u":"https://autotechinsight.spglobal.com/news/5291472/quantumscape-launches-open-platform-for-all-solid-state-batteries-osprey","p":1794592195,"a":1794610464,"t":"QuantumScape launches open platform for all-solid-state-batteries Osprey","su":"퀀텀스케이프는 1,000사이클 내구성과 5분 고속 충전, 저압 작동을 결합한 전고체 배터리(액체 대신 고체를 넣은 안전한 배터리) 플랫폼인 Osprey를 공개하여 QSE 셀을 넘어 기술 로드맵을 확장했습니다."},{"s":"ESS의 다음 단계, 진화하는 에너지 시장을 위한 LG에너지솔루션의 전략","so":"Energy-Storage.News","tm":"11/13 23:14","c":1,"r":"us","u":"https://www.energy-storage.news/the-next-phase-of-ess-lg-energy-solutions-strategy-for-an-evolving-energy-market/","p":1794579249,"a":1794610427,"t":"The next phase of ESS: LG Energy Solution’s strategy for an evolving energy market"},{"s":"납-탄소 에너지 저장 벤치마크 프로젝트가 품질 분쟁에 빠졌고 Jingwei Co., Ltd. 및 기타 자회사가 1억이 넘는 소송을 당했습니다 | 빠른 읽기 공지","so":"财联社电报","tm":"11/13 23:09","c":1,"r":"cn","u":"https://m.cls.cn/detail/2534236","p":1794578948,"a":1794628712,"t":"铅炭储能标杆项目陷质量纠纷 经纬股份子公司等被诉超1亿 | 速读公告","su":"중국금융신문(China Finance News)이 11월 13일 보도했다(뤄이첸 기자) 전력계획 컨설팅업체 징웨이유한공사(301390.SZ)가 소송으로 몸살을 앓고 있다. 수년 전 자사가 전액 출자한 자회사가 참여한 납-탄소 에너지 저장 벤치마크 프로젝트는 배터리 품질 문제로 기소되어 법원에 고소를 당했다. 이로 인해 2026년 1월 17일부터 현재까지 Jingwei Co., Ltd.와 그 두 자회사가 피고인으로 관련된 소송, 중재 및 기타 문제에 관련된 총액은 1억 8백만 위안에 달했습니다. 상장(주식시장에 처음 들어오는 것)회사는 자사의 전액 출자 자회사인 Hangzhou Hongsheng Electric Power Design Consulting Co., Ltd.(이하 \"Hongsheng Electric Power\")가 최근 \"피신청인 통지\"를 받았다고 오늘 발표했습니다. Power Investment Zhejiang Storage (Changxing) Smart Energy Co., Ltd. (이하 \"Power Investment Zhejiang Storage\")는 원고로서 Hongsheng Electric Power를 상대로 소송을 제기했으며 Zhejiang Taihu Energy Valley Technology Co., Ltd. (이하 \"Taihu Energy Valley\")와 Zhejiang Changxing Electrical Engineering Co., Ltd. (이하 \"Changxing Electric\")는 다음 사항으로 인한 방전 손실에 대해 공동으로 보상했습니다. 배터리 품질 문제, 자본 점유 기간 동안의 이자, 배터리 교체 손실, 이 사건으로 인해 지불된 법적 비용 및 기타 비용 총 1억 3백만 위안."},{"s":"저장성: 2026 이우 신에너지 및 에너지 저장 수출 박람회 개막","so":"中国新闻网","tm":"11/13 22:22","c":1,"r":"cn","u":"https://www.chinanews.com.cn/cj/2026/11-13/10731735.shtml","p":1794576155,"a":1794610431,"t":"浙江：2026义乌新能源与储能出口博览会启幕","su":"저장성: 2026 이우 신에너지 및 에너지 저장 수출 박람회가 중국 이우에서 11월 13일 개최됩니다. (Dong Yixin, Gong Shuhong) \"테스트 결과, 태양광 발전소를 5일 이상 청소하지 않으면 발전 수익이 20~30% 직접적인 영향을 받는 것으로 나타났습니다.\" 11월 13일, 2026년 이우 신에너지 및 에너지 저장 수출 박람회가 저장성 이우에서 개막했습니다. 현장에서 후베이의 광전지 지능형 청소 장비 전문 전시업체인 Fang Changsheng은 이렇게 말했습니다. 부스에서는 태양광 스마트 청소장비가 슬라이드레일을 타고 규칙적으로 앞뒤로 미끄러지는 모습을 보였다. 내장된 태양광 패널은 또한 에너지 자급자족을 달성할 수 있어 우간다와 파키스탄의 구매자를 빠르게 끌어 모았습니다. 우간다 바이어인 Sam은 \"이것은 확실히 태양광 발전을 위한 가장 중요한 지원 제품이 될 것이며 우리는 그것에 매우 관심이 있습니다\"라고 말했습니다."},{"s":"새로운 에너지 저장 장치는 새로운 시장화 단계에 진입했으며 '15차 5개년 계획'에서는 3억 kW의 개발 목표를 설정했습니다.","so":"第一财经","tm":"11/13 21:53","c":1,"r":"cn","u":"https://www.yicai.com/news/103440392.html","p":1794574403,"a":1794576149,"t":"新型储能迈入市场化新阶段，“十五五”方案划定3亿千瓦发展目标","su":"11월 13일 국가발전개혁위원회와 국가에너지청은 공동으로 '15차 5개년 계획 신에너지저장 구현계획'(이하 '계획')을 발표했는데, 이 계획에서는 2030년까지 신에너지저장장치가 대규모 개발단계에서 시장지향적 개발단계로 진입할 것임을 명시했다. 국가 신에너지 저장장치 설치 용량은 3억kW에 달하고, 평균 에너지 저장 시간은 약 3시간이 될 전망이다. \"계획\"은 \"15차 5개년 계획\" 기간 동안 신에너지 저장 장치가 주로 시스템의 \"소스, 그리드 및 부하\" 측면의 일중 조정 요구를 충족하고, 신에너지 소비 촉진, 전력 공급 보장, 전력 시스템의 안전하고 안정적인 운영 지원을 위한 신에너지 저장 장치의 적용을 심화하고, 혁신적인 응용 시나리오를 확장하고 신에너지의 비전기적 활용 실천을 지원한다는 전체 요구 사항을 명시합니다. 동시에, 제도적 메커니즘과 비즈니스 모델의 혁신을 가속화해야 하며, 새로운 에너지 저장 장치의 가치를 합리적으로 반영하는 전력 시장 메커니즘과 가격 메커니즘이 더욱 완전해지고, 새로운 에너지 저장 장치의 안정적인 용량 가치가 더 잘 반영될 수 있습니다."},{"s":"마켓 오픈 후 에너지저장 혜택이 옵니다!","so":"21财经","tm":"11/13 20:01","c":1,"r":"cn","u":"https://www.21jingji.com/article/20261113/herald/b9cce244c32cd152cb230552f8976edf.html","p":1794567700,"a":1794576152,"t":"盘后，储能利好来了！","su":"[소개] 국가발전개혁위원회와 국가에너지국은 '15차 5개년 계획 신에너지 저장 실시 계획'을 발표했습니다. 중국 기금 뉴스 기자 Chen Xi 신에너지 저장과 관련하여 좋은 소식이 다가오고 있습니다! 11월 13일 국가발전개혁위원회 공식 홈페이지에는 국가발전개혁위원회와 국가에너지청이 '15차 5개년 계획 신에너지저장 시행계획'(이하 '시행계획')을 발표했다고 밝혔다. \"구현 계획\"에서는 \"15차 5개년 계획\" 기간 동안 새로운 에너지 저장 장치가 전력 시스템, 소스, 그리드, 부하 및 저장의 모든 링크의 통합과 상호 작용을 효과적으로 촉진하고 더욱 다양한 가치를 발휘하며 새로운 전력 시스템 구축을 지원할 것이라고 지적합니다. 2030년까지 신에너지저장장치는 대규모 개발단계에서 시장지향적 개발단계로 전환될 것이다. 국가 신에너지 저장장치 설치 용량은 3억kW에 달하고, 평균 에너지 저장 시간은 약 3시간이 될 전망이다."},{"s":"쉬지 않고 은퇴하고 폐기물을 보물로 전환 - State Grid Nanjing Power Supply Company는 기업의 폐기된 에너지 저장 배터리 재활용을 촉진합니다.","so":"ThePaper.cn","tm":"11/13 19:55","c":1,"r":"cn","u":"https://www.thepaper.cn/newsDetail_forward_34468912","p":1794567324,"a":1794610435,"t":"退而不休 变废为宝——国网南京供电公司推动企业退役储能电池循环利用","su":"11월 11일, State Grid Nanjing Power Supply Company의 Liuhe 전원 공급 서비스 센터 주요 계정 관리자는 난징 공공 Ganfeng 폐기 리튬 배터리 종합 활용 프로젝트의 1단계에 참여하여 전기 안전 검사 및 기술을 수행했습니다."},{"s":"검사관리부터 ESS 진단까지…전기안전 혁신 관통하는 키워드 ‘AI’","so":"전기신문","tm":"11/13 19:17","c":1,"r":"kr","u":"https://www.electimes.com/news/articleViewAmp.html?idxno=374736","p":1794565020,"a":1794628711,"su":"검사관리부터 ESS(전기를 저장해 두는 큰 배터리) 진단까지…전기안전 혁신 관통하는 키워드 ‘AI’ 2026 KESCO 우수사례 경진대회 12-13일 개최…분야별 우수사례 대상 선정 업무 효율화부터 설비 진단·정보 전달까지…현장 개선 경험 공유·확산 우리 일상에 자리 잡은 인공지능(AI)이 이제 전기안전 현장의 혁신을 관통하는 핵심 키워드로 떠오르고 있다. 검사·점검 관리부터 설비 상태 분석, 고객에게 진단정보를 전달하는 방식까지 AI와 디지털 기술을 접목한 업무 개선 사례들이 주목받고 있다."},{"s":"두 부서는 '15차 5개년 계획을 위한 신에너지 저장 구현 계획'을 발표했으며, 전국 신에너지 저장 장치 설치 용량은 3억 킬로와트에 도달했습니다.","so":"Now 新聞","tm":"11/13 18:48","c":1,"r":"hk","u":"https://news.now.com/home/international/player?newsId=669495","p":1794563304,"a":1794576154,"t":"兩部門印發《「十五五」新型儲能實施方案》 全國新型儲能裝機規模達到3億千瓦","su":"[지금 뉴스 채널] 국가발전개혁위원회와 국가에너지국은 오늘(13일) '15차 5개년 계획' 신에너지저장 구현계획(이하 '시행계획')을 발표해 '15차 5개년 계획'이 신에너지저장장치를 대규모 개발 단계에서 시장지향적 개발 단계로 촉진하고 신에너지저장장치의 다각화된 응용 시나리오를 구축하며 신에너지저장 기술 혁신과 연구를 지원하고 개발의 주요 목표도 제시한다는 점을 명확히 했다. '15차 5개년 계획' 기간 동안 신에너지 저장장치를 구축한다."},{"s":"포시즈 HD[3726]：주식회사 넥스타와의 계통용 축전지 설비에 있어서의 포괄 매매 계약 체결 및 저압 계통용 축전소 사업에의 대처에 대한 공지 2026년 11월 13일(적시 공개)","so":"日本経済新聞","tm":"11/13 18:00","c":1,"r":"jp","u":"https://www.nikkei.com/nkd/disclosure/tdnr/20261113580245/","p":1794560400,"a":1794632188,"t":"フォーシーズＨＤ[3726]：株式会社ネクスタとの系統用蓄電池設備における包括売買契約締結及び 低圧系統用蓄電所事業への取り組みについてのお知らせ 2026年11月13日(適時開示) ：日経会社情報DIGITAL","su":"2026년 11월 13일 포시즈 HD[3726]의 공개 자료 “주식회사 넥스타와의 계통용 축전지 설비에 있어서의 포괄 매매 계약 체결 및 저압 계통용 축전소 사업에의 대처에 대한 알림”을 열람할 수 있습니다. 자료는 PDF로 다운로드 가능"},{"s":"신규 스토리지 관련 주요 정책을 공개합니다! Enjie 주가는 3% 이상 하락했고, 배터리 ETF China Universal(159796) 지수는 2% 이상 하락해 이틀 연속 약한 하락세를 보였습니다! 중국의 대규모 국내 보유고 가격이 상승하고 있으며, 신흥 시장에서는 가계 저축이 장악하고 있습니다.","so":"Jiemian.com","tm":"11/13 17:57","c":1,"r":"cn","u":"https://www.jiemian.com/article/15331355.html","p":1794560226,"a":1794610440,"t":"事关新型存储，重磅政策发布！恩捷股份跌超3%，电池ETF汇添富(159796)指数跌超2%，弱势两连阴！国内大储量价齐升，户储新兴市场接力","su":"11월 13일, A주 시장은 등락을 거듭하며 후퇴했으며, 상하이 증권 거래소 지수는 0.59% 하락했습니다. 시장심리는 다시 약화됐다. 두 도시에서 4,700개 이상의 주식이 하락했습니다. 오후 들어 배터리 업종의 하락 폭이 확대됐다. 장 마감 기준 배터리 ETF(여러 주식을 묶어 파는 상품) 차이나 유니버셜(159796)의 기초지수는 2% 이상 하락하며 2회 연속 마이너스 실적(회사가 번 돈 성적표)을 기록했다."},{"s":"Shaoyang Hydraulic : 컨소시엄이 4억 6200만 위안의 에너지 저장 프로젝트 계약을 체결했습니다.","so":"Jiemian.com","tm":"11/13 17:51","c":1,"r":"cn","u":"https://www.jiemian.com/article/15331419.html","p":1794559877,"a":1794610444,"t":"邵阳液压：联合体签署4.62亿元储能项目合同","su":"Shaoyang Hydraulic은 11월 13일, 회사가 Huazi Technology와 구성된 컨소시엄이 China Metallurgical Group II가 발행한 \"입찰 통지서\"를 받고 바오딩(Baoding)의 200MW/600MWh 네트워크 기반 독립 에너지 저장 프로젝트를 위한 에너지 저장 시스템 장비 및 부스터 스테이션 장비를 수주(일감 주문을 받는 것)했다고 밝혔습니다. 최근 회사는 China Metallurgical Group Co., Ltd.와 '의향금 계약'을 체결했습니다. 동시에 회사와 Huazi Technology가 구성한 컨소시엄은 China Metallurgical Group Co., Ltd.의 건설 엔지니어링 기술 지점과 \"자재 조달 계약\"을 체결했습니다. 계약 가격은 RMB 4억 6200만(세금 포함)으로 낙찰 금액과 일치했습니다. 회사는 약 1억 8천만 위안(세금 포함)의 공급 및 서비스 금액을 맡을 것으로 예상됩니다. Shaoyang Hydraulic: 컨소시엄은 4억 6200만 위안 규모의 에너지 저장 프로젝트 계약을 체결했습니다. 원래 뉴스 출처: Jiemian News Shaoyang Hydraulic - Institutional Vane | Shaoyang Hydraulic (301079)은 2026년 3분기에 5개의 지주 기관만 공개했습니다. - Shaoyang Hydraulic: 컨소시엄이 4억 6200만 위안 규모의 에너지 저장 시스템 장비 프로젝트 입찰에서 승리했습니다."},{"s":"2개 부서: 슈퍼커패시터, 압축 이산화탄소 에너지 저장, 액체 공기 에너지 저장, 중력 에너지 저장, 용융염 열 저장과 같은 기술의 시범 적용을 장려합니다.","so":"Jiemian.com","tm":"11/13 16:08","c":1,"r":"cn","u":"https://www.jiemian.com/article/15330777.html","p":1794553738,"a":1794610452,"t":"两部门：鼓励超级电容、压缩二氧化碳储能、液态空气储能、重力储能、熔盐储热等技术试点应用","su":"국가발전개혁위원회와 국가에너지국은 '신에너지저장 실시계획 15차 5개년 계획'을 발표했다. 이 계획은 새로운 에너지 저장 혁신 방향의 과학적인 레이아웃을 제안합니다. 리튬이온 배터리 에너지 저장의 반복적 업그레이드를 가속화하고 나트륨 이온 배터리(리튬 대신 소금 성분을 쓰는 배터리) 에너지 저장의 적용을 촉진합니다. 압축공기 에너지 저장장치, 흐름전지 에너지 저장장치, 플라이휠 에너지 저장장치 등을 파일럿 애플리케이션에서 상용 애플리케이션으로 전환을 촉진합니다. 슈퍼커패시터, 압축 이산화탄소 에너지 저장, 액체 공기 에너지 저장, 중력 에너지 저장, 용융염 열 저장과 같은 기술의 시범 적용을 장려합니다. 전고체 배터리(액체 대신 고체를 넣은 안전한 배터리), 히트펌프 전력저장, 열에너지 저장, 수소 에너지 저장 등 첨단 기술 보유량을 지원합니다."}]},{"name":"🏭 AI 전력","note":"보유: ACE 코리아AI전력TOP10","breaking":false,"items":[{"s":"효성중공업, SK텔레콤과 AI 데이터센터 전력 인프라 구축 맞손","so":"아시아경제","tm":"11/16 11:07","c":25,"r":"kr","u":"https://www.asiae.co.kr/article/2026111611072002951","p":1794794841,"a":1794795163,"su":"효성중공업, SK텔레콤과 AI 데이터센터(컴퓨터 수만 대를 모아 둔 건물) 전력 인프라 구축 맞손 345kV 변전소 핵심 설비 공급 800V 직류배전 기술 공동 실증 효성중공업 효성중공업 close 증권정보 298040 KOSPI 현재가 1,760,000 전일대비 47,000 등락률 -2.60% 거래량 13,631 전일가 1,807,000 2026.11.16 10:52 기준 관련기사 SKT-효성중공업, GW급 AI 데이터센터 구축 MOU 체결 3분기 어닝서프라이즈, 클라우드 성장 이끈 GPU 수요 조선·방산 물타기 고민…저점매수 타이밍은?"},{"s":"GE 베르노바(GE 버노바), SK온(SK On), 자이터(Xiter)가 AI 전력 인프라 구축 사업 기회 포착을 위한 전략적 협력 MOU 체결","so":"工商時報","tm":"11/16 11:56","c":4,"r":"tw","u":"https://www.c ":1,"r":"cn","u":"https://www.cls.cn/detail/2511045","p":1794661373,"a":1794713965,"t":"一天暴跌逾四成！澳数据中心运营商NextDC下调明年业绩指引","su":"① 호주 데이터센터(컴퓨터 수만 대를 모아 둔 건물) 운영업체인 NextDC는 멜버른 M3 데이터센터 전력 공급 지연으로 인해 2027회계연도 매출과 기본 EBITDA 실적 전망을 하향 조정했고 주가는 장중 44% 하락했다. ② M3의 그리드 전력 공급 증가의 다음 단계는 2028 회계연도로 연기될 것으로 예상됩니다. ③ 회사는 신규 프로젝트와 토지 취득을 중단했으며, 씨티그룹은 관련 문제가 수익에 미치는 영향이 2027 회계연도 이후까지 이어질 수 있다고 밝혔습니다. 차이롄서, 10월 21일(인턴 편집자 Xu Yuanjia/편집자 Qi Ling) 호주 데이터 센터 운영업체인 NextDC가 멜버른 M3 데이터 센터의 전력 공급이 지연되었습니다. 회사의 주가는 수요일 세션 동안 44% 하락하여 5.35 호주 달러로 마감했으며, 시가총액(회사 전체 몸값)은 40억 호주 달러(약 28억 달러)를 약간 넘는 수준으로 떨어졌습니다."},{"s":"기술 거대 기업은 민주당 산사태로 더 많은 전력망 비용 압박에 직면","so":"Bloomberg.com","tm":"11/14 22:00","c":1,"r":"us","u":"https://www.bloomberg.com/news/articles/2026-11-14/tech-giants-face-more-grid-cost-pressure-on-democratic-sweep","p":1794661200,"a":1794727100,"t":"Tech Giants Face More Grid Cost Pressure on Democratic Sweep"},{"s":"HD현대일렉트릭과 LG CNS가 15일 경기도 성남시에 위치한 HD현대 글로벌 R&D센터에서 '데이터센터 전력인프라 및 스마트팩토리 구축을 위한 상호협력 업무협약'을 체결했다. (사진 오른쪽부터) 김영기 HD현대일렉트릭 대표, 현신균 LG CNS 대표. HD현대일렉트","so":"전자신문","tm":"11/14 19:13","c":1,"r":"kr","u":"https://www.etnews.com/tools/image_popup.html?v=bjQ5VkNYY2dLZTZMZFBUbmNzandvWmpGcjBTK1pHYm1CUVRXR0pTMldlYVZkdE5JeGJVUFVVNURJN04rbmhKTXpEZ0VrRFJ1Z0UzZXBlTmtIMExTenhzMGtybmIxSXNKclBEVmFmUU1GWlBJWXluVHRIcVlJaTgzMzF4ckJXU21tNkZuQUpGOEMvRGtQRXBaemVXR1NjKzN1TXl0VGdSYlJleHNweGdVVXBXaWgvUWwyVXBWSkJoYXkwcDZkWDc2M3pQME9mQ1FRc1FIV0d3cEJrbm1GOFJPd21rODA0REErOEZCOHhaZXJ6VnAybW1KVm4wQ0RkRmtKc2tXMW5WTHNjMzUvZ0NXVjRGQXBHNFpIT295Q0NTbVA4T3BlWTRNdk0yU3BCaGJCQy9FNFBCUXNuR2xiSUttWGZOMzRhcHhyN0krY3IybVdaVzBWUURnUTZSemF0SFpZbVVMUFVEUWgwRnl0YmFDM1VsREVBOHN2cWtVS2IvTGoxVEtuenhtOWsyblIwVW13cHpwdGtuejQ5enFDZnJmZnFlb1ZrTFV4SndoOEpuM0l2MHh5ZVFYeEZIQVVDcGliU3pLOXZ4VEV5TkZNZ0hpb3NIT3UzNi8vZzBVZ1NuVEdvRW5LYWJ2UFJzdUlTSzZrblQxSjAvbE1OYmxObHlNVGx4dzNtdzg4ZjZkamFsTlNEM2FHWGphSWlyUnNJQ3RZRVBpU002WDdFajNsOGFTM0ZocXFPeXR5Qzhoczh2ZVhYNk01NTQ1Y1FZbFVuVkpiSHBueGI0T1V4TGRLN0ZEL1FhNWwxa0VoNWlBckhSUURkVC9xSHJhU BorgWarner Targets $300 Million in Turbine Revenue as It Expands Into Data Center Power","su":"보그워너(NYSE:BWA)는 자동차 공급업체가 데이터 센터 및 산업용 전력 시장용 장비로 확장함에 따라 새로운 터빈 발전기 사업이 2027년에 3억 달러의 수익을 창출할 것으로 예상하고 있습니다. CEO Joe Fadool은 회사가 자동차 제품용으로 개발된 기술을 사용하여"},{"s":"New Era 데이터센터 1단계 건설 비용은 기존 모듈식 개발 비용의 절반에도 미치지 못할 것으로 추산됩니다.","so":"鉅亨網","tm":"11/13 19:41","c":1,"r":"tw","u":"https://news.cnyes.com/news/print/6661281","p":1794566472,"a":1794628721,"t":"New Era資料中心改採模組化開發一期建置成本估低於傳統一半","su":"뉴에라(New Era) 데이터센터(컴퓨터 수만 대를 모아 둔 건물) 모듈화 1단계 건설비용은 기존 건설비용의 절반에도 미치지 못할 것으로 추산된다. 대규모 글로벌 기술 회사와 공식 임대 계약을 맺고 자체 팀에서 개발할 예정입니다. 회사의 초기 추정치는 모듈식 건설 비용이 동일한 규모의 기존 개발 프로젝트의 절반 미만일 수 있다는 것입니다. 그러나 아직 임대 계약이 체결되지 않았으며 최종 자금 요구 사항은 여전히 ​​프로젝트 범위, 지불 일정 및 배송 책임 분할에 따라 다릅니다."},{"s":"데이터 센터 신설에 암운? 소프트뱅크 G의 6000억엔 손실도 읽어 낸다","so":"日本経済新聞","tm":"11/13 19:30","c":1,"r":"jp","u":"https://www.nikkei.com/article/DGXZQOCD09B780Z01C26A1000000/","p":1794565800,"a":1794576166,"t":"データセンター新設に暗雲？ ソフトバンクGの6000億円損失も読み解く","su":"미국 중간선거 후 인공지능(AI) 관련주의 주가 움직임이 거칠어지고 있다. 시장이 경계하는 것은 AI에 대한 수요 자체만이 아닙니다. AI를 움직이기 위한 거대한 데이터 센터를 계획대로 건설할 수 있을까. 전력 부족이나 건설 규제, 부풀어 오르는 자금 조달(사업에 쓸 돈을 모으는 것) 비용이 새로운 우려 재료가 되고 있습니다. 11월 3일 미주지사선에서는 데이터센터(컴퓨터 수만 대를 모아 둔 건물) 건설계획이 집중되는 주에서 민주당 후보가 잇따라 승리했습니다. JP 모건 애셋 매니지"},{"s":"보고서에 따르면 데이터 센터 투자자들은 기후 위험을 과소평가합니다","so":"Bloomberg.com","tm":"11/13 16:00","c":1,"r":"us","u":"https://www.bloomberg.com/news/articles/2026-11-13/data-center-investors-underestimate-climate-risk-report-says","p":1794553200,"a":1794576165,"t":"Data Center Investors Underestimate Climate Risk, Report Says"}]},{"name":"🤖 로봇","note":"","breaking":false,"items":[{"s":"LG전자, 한국로봇산업진흥원과 휴머노이드 안전·품질 경쟁력 강화 나서","so":"비즈니스포스트","tm":"11/16 10:13","c":20,"r":"kr","u":"https://www.businesspost.co.kr/BP?command=article_view&num=452036","p":1794791611,"a":1794792488},{"s":"울산 남구, 中상하이 '휴머노이드 로봇 실증기지' 찾았다","so":"뉴시스","tm":"11/13 17:33","c":4,"r":"kr","u":"https://mobile.newsis.com/view_amp.html?ar_id=NISX20261113_0003867719 告","su":"① 국가통계국: 7월 CPI 전년 동기 대비 0.5% 상승 ② S&P500(미국 큰 회사 500곳 지수) 지수가 지난 금요일 최고치를 경신했고, 광통신 부문이 급등했다. ③ 베이징: 집을 구입하는 비베이징 가구의 사회보장 및 개인 납세 기간이 1년으로 단축되었다. ④ 애플 China 공식 웹사이트에서 애플 Smart Access 알리바바 큐원(Qwen) 매뉴얼을 삭제했다. ⑤ 캄브리콘, 롱시스, Wuxi AppTec이 중요한 발표를 했다. 매크로 뉴스 1. 국가통계국이 발표한 자료에 따르면 7월 소비자물가지수(CPI)는 국제 수입 요인의 영향으로 전월 대비 0.1% 하락하고 전년 대비 0.5% 상승한 것으로 나타났습니다. 식품과 에너지를 제외한 근원 CPI는 전월 대비 0.3%, 전년 동기 대비 0.9% 상승했다. CPI는 전반적으로 완만한 상승을 유지했습니다. 1~7월 평균 전국 소비자물가는 전년 동기 대비 0.9% 상승했다. 국내 일부 산업의 수요가 늘었지만, 수입·계절적 요인 등으로 산업생산자물가(공장에서 파는 물건값 수준)지수(PPI)는 전월 ​​대비 0.7% 하락, 전년 동기 대비 3.5% 상승, 전월 대비 0.6%포인트 하락했다."},{"s":"로봇 더블 일레븐 '시험장': 대규모 판매 이후 배송과 생산 라인이 실제 테스트 문제","so":"财联社","tm":"11/15 00:11","c":1,"r":"cn","u":"https://www.cls.cn/detail/2533342","p":1794669109,"a":1794730754,"t":"机器人双十一\"考场\"：大卖之后，交付和产线才是真考题","su":"① 더블 일레븐(Double Eleven) 기간 동안, 임바디드 AI(로봇처럼 몸을 가진 인공지능)형 로봇 배치가 처음으로 물류 최전선에서 \"작업\"했습니다. ② 더블일레븐 이후에는 주문한 상품이 제때에 배송될 수 있는지, 이용자가 이를 수령한 후 반품할 것인지, 사용할 것인지 여부 등 배송을 소비자측에서 부담하게 됩니다. 창고가 대답해야 할 것은 로봇이 일년 내내 가장 극심한 주문 피크 기간 동안 안정적으로 작동하고 계산 가능한 경제적 가치를 계산할 수 있는지 여부입니다. '극장반일보'가 11월 13일 보도했다(리밍밍 기자) 더블일레븐은 막을 내렸지만 올해 로봇 분야에는 새로운 변화가 있다. 먼저, 소비자 측면에서는 더블 일레븐 기간 동안 플랫폼 내 지능형 휴머노이드(사람을 닮은 로봇) 로봇 매출이 전년 대비 700% 증가했고, 로봇 팔, 손재주 등 트렌드 카테고리 매출도 전년 대비 10배 이상 증가했다. 반면, 소비자가 주문한 후 분류, 포장 및 배송 링크에서는 임바디드 AI형 로봇 그룹이 처음으로 물류 최전선에서 '작업'했습니다."},{"s":"최신 Caixin Weekly │ 휴머노이드 로봇이 임계점을 기다리고 있습니다","so":"财新周刊","tm":"11/14 23:16","c":1,"r":"cn","u":"https://weekly.caixin.com/2026-11-14/102504772.html","p":1794665765,"a":1794698097,"t":"最新财新周刊｜人形机器人等待临界点","su":"텍스트 | A주 '최초의 인간형 로봇 주식'인 Caixin Weekly Du Zhihang 유니트리(688836.SH)는 8월 19일 상장(주식시장에 처음 들어오는 것) 당일 발행 가격이 주당 150.80위안에서 1,100위안으로 급등했습니다. 이후 오르락내리락하며 등락을 거듭하며 시가총액(회사 전체 몸값)은 최고에서 최고로 상승했습니다. 4,449억 위안으로 최저치인 1,634억 위안을 기록했으나 10월 중순 이후 등락을 거듭하며 2,815억 1,000만 위안 안팎까지 올랐다. 이 시가총액을 기준으로 3개 분기별 보고서의 수익을 합산하면 PS(가격 대비 판매 비율)는 여전히 120배입니다. \"2027년은 로봇 산업이나 로봇 모델 발전에 있어서 중요한 시점이 될 가능성이 높다.\" 2026년 11월 4일 Wuzhen 인터넷 컨퍼런스에서 유니트리의 왕싱싱(Wang Xingx   return t.items.filter(function(n){ return S.region==='all' || n.r===S.region; });
}
function sorted(list, breaking){
  var k = breaking ? 'p' : S.sort;
  return list.slice().sort(function(x,y){
    var c = y.c - x.c, p = y.p - x.p; return k==='c' ? (c||p) : (p||c);
  });
}
function renderTabs(){
  $('tabs').innerHTML = D.themes.map(function(t, i){
    var dot = newest(t) > (S.seen[t.name] || 0) && i !== S.tab;
    return '<button class="tab'+(i===S.tab?' on':'')+'" onclick="openTab('+i+')">'+esc(t.name)+
           (t.stats ? '' : '<b>'+visible(t).length+'</b>')+(dot?'<span class="dot" title="새 뉴스"></span>':'')+'</button>';
  }).join('');
  var on = $('tabs').children[S.tab]; if(on && on.scrollIntoView) on.scrollIntoView({block:'nearest', inline:'center'});
}
function renderCtrl(){
  var br = D.themes[S.tab].breaking || D.themes[S.tab].stats;
  var h = '';
  if(!br){
    h += '<button class="'+(S.sort==='c'?'on':'')+'" onclick="setSort(\'c\')">🔥 화제순</button>';
    h += '<button class="'+(S.sort==='p'?'on':'')+'" onclick="setSort(\'p\')">🕒 최신순</button><span class="sep"></span>';
  }
  h += '<button class="'+(S.region==='all'?'on':'')+'" onclick="setRegion(\'all\')">전체</button>';
  D.regions.forEach(function(r){
    h += '<button class="'+(S.region===r.k?'on':'')+'" onclick="setRegion(\''+r.k+'\')">'+esc(r.l)+'</button>';
  });
  $('ctrl').innerHTML = h;
}
function card(n, prev){
  var hot = n.c > 1 ? '<span class="hot'+(n.c>=5?' big':'')+'">🔥 언론 '+n.c+'곳</span>' : '';
  var isNew = prev && n.a > prev ? ' <span class="new">NEW</span>' : '';
  return '<a class="card" href="'+esc(n.u)+'" target="_blank" rel="noopener" data-s="'+esc(n.su||'')+'" data-so="'+esc(n.so)+'">'+
    '<div class="meta">'+hot+esc(RL[n.r]||'')+' · '+esc(n.so)+' · '+esc(n.tm)+isNew+'</div>'+
    '<div class="title">'+esc(n.s)+'</div>'+(n.t?'<div class="orig">'+esc(n.t)+'</div>':'')+'</a>';
}
function renderMain(){
  if(D.themes[S.tab].stats){ renderStats(D.themes[S.tab]); return; }
  var t = D.themes[S.tab], list = sorted(visible(t), t.breaking), prev = S.prev[t.name] || 0;
  var h = '<h2>'+esc(t.name)+'</h2>' + (t.note ? '<p class="note">'+esc(t.note)+'</p>' : '');
  var fresh = prev ? list.filter(function(n){ return n.a > prev; }).length : 0;
  if(S.onlyNew){                                // '새 기사만 보기' 중
    list = list.filter(function(n){ return n.a > prev; });
    h += '<button class="newbar" onclick="onlyNew(false)">🆕 새 기사 '+list.length+'개만 보는 중 · 전체 보기</button>';
  } else if(fresh && !t.breaking){              // 새 기사가 정렬 때문에 아래로 밀려도 바로 찾을 수 있게
    h += '<button class="newbar" onclick="onlyNew(true)">🆕 새 기사 '+fresh+'개 · 새 기사만 보기</button>';
  }
  if(!list.length) h += '<p class="none">'+(S.region==='all' ? '최근 ' + (t.breaking?'속보':'기사') + ' 없음' : esc(RL[S.region])+' 기사 없음')+'</p>';
  h += list.slice(0, S.shown).map(function(n){ return card(n, prev); }).join('');
  var extra = list.length - S.shown;
  if(extra > 0) h += '<button class="more" onclick="more()">더보기 ▾  ('+extra+'개 더)</button>';
  else if(S.shown > D.show) h += '<button class="more" onclick="less()">접기 ▴</button>';
  var auto = Object.keys(D.auto);
  h += '<footer>업데이트 '+esc(D.updated)+' · 최근 3일 · 믿을 만한 언론사 기사만 · 기사를 누르면 한국어 요약 → 원문 보기<br>'+
       '🔥 언론 N곳 = 같은 소식을 보도한 언론사 수 (많을수록 화제) · <span style="color:var(--red)">●</span> = 새 뉴스'+
       '<br><br><b>자동으로 추가된 언론사</b> (주요 언론보다 먼저 보도하고, 주요 언론도 함께 다룬 소식이 많은 곳 · 최근 14일)'+
       (auto.length ? auto.map(function(k){ return '<div>'+esc(k)+': '+esc(D.auto[k].join(', '))+'</div>'; }).join('') : '<div>아직 없음</div>')+
       '</footer>';
  $('main').innerHTML = h;
}
function openTab(i){
  var t = D.themes[i];
  S.tab = i; S.shown = D.show; S.onlyNew = false; save('tabname', t.name);
  if(!(t.name in S.prev)) S.prev[t.name] = S.seen[t.name] || 0;     // 이 탭에서 NEW 로 보여줄 기준
  S.seen[t.name] = Math.max(S.seen[t.name] || 0, newest(t)); save('seen', S.seen);  // 탭에 들어오면 레드닷 지움
  history.replaceState(null, '', t.stats ? '#stats' : '#t'+i);
  renderTabs(); renderCtrl(); renderMain(); window.scrollTo(0, 0);
}
function setSort(k){ S.sort = k; save('sort', k); S.shown = D.show; renderCtrl(); renderMain(); }
function setRegion(k){ S.region = k; save('region', k); S.shown = D.show; renderTabs(); renderCtrl(); renderMain(); }
function more(){ S.shown += 20; renderMain(); }
function onlyNew(on){ S.onlyNew = on; S.shown = D.show; renderMain(); }
function less(){ S.shown = D.show; renderMain(); window.scrollTo(0, 0); }
$('upd').textContent = '업데이트 ' + D.updated + ' · 탭을 눌러 테마별 뉴스 보기';

// 🚨 미국 속보 · 🌏 해외 속보는 페이지를 새로 올리지 않아도 최신 내용을 바로 가져옴
function refreshBreaking(){
  if(!window.fetch) return;
  fetch(D.breaking_url + '?t=' + Date.now(), {cache:'no-store'}).then(function(r){ return r.json(); }).then(function(b){
    var all = b.items || [];
    D.themes.forEach(function(t, i){
      if(!t.breaking) return;
      var items = all.filter(function(n){ return n.theme === t.name; }).map(function(n){
        var d = {s:n.show, so:n.source||'', tm:n.time||'', c:n.count||1, r:n.rk||'us', u:n.url||n.link, p:Math.floor(n.pub), a:Math.floor(n.added||n.pub)};
        if(n.show !== n.title) d.t = n.title; if(n.sum) d.su = n.sum; return d;
      });
      if(!items.length && t.items.length) return;
      t.items = items;
      if(S.tab === i){ S.seen[t.name] = Math.max(S.seen[t.name]||0, newest(t)); save('seen', S.seen); renderMain(); }
    });
    renderTabs();
  }).catch(function(){});
}
// ───────── 📊 통계 탭 ─────────
var ST = null, STLOAD = false;
S.sp = load('sp', 'yday'); S.open = {};
function kdate(off){ var d = new Date(Date.now() + 9*3600e3 - off*86400e3); return d.toISOString().slice(0,10); }
function loadStats(){
  if(STLOAD) return; STLOAD = true;
  fetch(D.stats_url + '?t=' + Date.now(), {cache:'no-store'}).then(function(r){ return r.json(); })
    .then(function(j){ ST = j; if(D.themes[S.tab].stats) renderMain(); })
    .catch(function(){ ST = {err:1}; if(D.themes[S.tab].stats) renderMain(); });
}
function cnt(day, th){                     // 하루·테마의 뉴스 수 (국가 필터 반영)
  var v = ((ST.days||{})[day]||{})[th] || {}, n = 0;
  for(var k in v){ if(S.region==='all' || k===S.region) n += v[k]; }
  return n;
}
function period(){                         // [이번 기간 날짜들, 비교할 이전 기간 날짜들, 이름]
  var L = {today:[0,1,'오늘(진행 중)'], yday:[1,1,'어제'], w:[1,7,'최근 7일'], m:[1,30,'최근 30일'],
           h:[1,182,'최근 6개월'], y:[1,365,'최근 1년']}[S.sp] || [1,1,'어제'];
  var cur = [], prev = [];
  for(var i=0;i<L[1];i++){ cur.push(kdate(L[0]+i)); prev.push(kdate(L[0]+L[1]+i)); }
  return [cur, prev, L[2]];
}
function have(days){ var n=0; days.forEach(function(d){ if((ST.days||{})[d]) n++; }); return n; }   // 기간 안에 실제로 모인 날 수
function firstDay(){ var k = Object.keys(ST.days||{}).sort(); return k[0] || ''; }
function sum(days, th){ var n=0; days.forEach(function(d){ n += cnt(d, th); }); return n; }
function capped(days, th){
  var c = ST.capped || {}, hit = false;
  days.forEach(function(d){ (c[d]||[]).forEach(function(s){ var p = s.split('|');
    if(p[0]===th && (S.region==='all' || p[1]===S.region)) hit = true; }); });
  return hit;
}
function byN(a,b){ return b.n - a.n || (a.th < b.th ? -1 : 1); }        // 많은 순 (같으면 이름순으로 고정)
function ranks(rows, ok){                  // 이전 기간 순위 (r.pr) — 이전 기간 자료가 없으면 표시 안 함
  rows.forEach(function(r){ r.pr = null; });
  if(!ok) return;
  rows.slice().sort(function(a,b){ return b.p - a.p || (a.th < b.th ? -1 : 1); }).forEach(function(r, i){ r.pr = i; });
}
function mv(r, i){                         // 순위 변동: 🔺 빨강 몇 계단 오름 · 🔻 파랑 몇 계단 내림
  if(r.pr === null) return '<span class="mv"></span>';                       // 비교할 이전 기간 자료 없음
  if(!r.n && !r.p) return '<span class="mv same" title="두 기간 모두 0건">-</span>';
  var d = r.pr - i;
  if(d > 0) return '<span class="mv up" title="이전 기간 '+(r.pr+1)+'위 → '+d+'계단 상승">▲<i class="gap"></i>'+d+'</span>';
  if(d < 0) return '<span class="mv dn" title="이전 기간 '+(r.pr+1)+'위 → '+(-d)+'계단 하락">▼<i class="gap"></i>'+(-d)+'</span>';
  return '<span class="mv same" title="순위 그대로 ('+(i+1)+'위)">-</span>';   // 변동 없음
}
function chg(n, p, hc, hp){
  if(hp === 0) return '<span class="chg">·</span>';          // 비교할 이전 기간 자료가 아직 없음
  if(hc && hp && hc !== hp){ n = n/hc; p = p/hp; }            // 모인 날 수가 다르면 하루 평균끼리 비교
  if(!p) return n ? '<span class="chg">신규</span>' : '';
  var pct = Math.round((n-p)/p*100);
  if(pct > 0) return '<span class="chg up">▲'+pct+'%</span>';
  if(pct < 0) return '<span class="chg dn">▼'+(-pct)+'%</span>';
  return '<span class="chg">–</span>';
}
function spark(th, days){                  // 최근 14일 흐름 (작은 선)
  var vals = []; for(var i=days-1;i>=0;i--) vals.push(cnt(kdate(i+1), th));
  var mx = Math.max.apply(null, vals.concat([1])), w = 64, h = 20;
  var pts = vals.map(function(v,i){ return (i*(w/(days-1))).toFixed(1)+','+(h-2-(v/mx)*(h-4)).toFixed(1); }).join(' ');
  return '<svg class="spark" viewBox="0 0 '+w+' '+h+'" width="'+w+'" height="'+h+'" aria-hidden="true"><polyline points="'+pts+'" fill="none" stroke="var(--acc)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></svg>';
}
function detail(th){                       // 30일(또는 6개월·1년은 주별) 막대 그래프 + 나라별 구성
  var vals = [], labels = [], wk = (S.sp==='h' || S.sp==='y'), NB = wk ? (S.sp==='h' ? 26 : 52) : 30, nowLbl = wk ? '이번 주' : '오늘';
  if(wk){ for(var w=NB-1;w>=0;w--){ var v=0; for(var j=0;j<7;j++) v += cnt(kdate(w*7+j), th);
            vals.push(v); labels.push(kdate(w*7+6).slice(5).replace('-','/')+'~'+kdate(w*7).slice(5).replace('-','/')); } }
  else for(var i=29;i>=0;i--){ var d = kdate(i); vals.push(cnt(d, th)); labels.push(d.slice(5).replace('-','/')); }
  var mx = Math.max.apply(null, vals.concat([1])), W = 320, H = 110, bw = W/NB;
  var bars = vals.map(function(v,i){
    var bh = Math.max(v ? 2 : 0, (v/mx)*(H-30)), x = i*bw + 1, y = H-14-bh;
    return '<g class="bar"><rect x="'+x.toFixed(1)+'" y="0" width="'+(bw-2).toFixed(1)+'" height="'+(H-14)+'" fill="transparent"/>'+
      '<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+(bw-2).toFixed(1)+'" height="'+bh.toFixed(1)+'" rx="'+(wk?1:2)+'" fill="var(--acc)"'+(i===NB-1?' opacity=".55"':'')+'/>'+
      '<title>'+labels[i]+(i===NB-1?' ('+nowLbl+', 진행 중)':'')+' · '+v.toLocaleString()+'건</title></g>';
  }).join('');
  var axis = '<text x="0" y="'+(H-2)+'" class="ax">'+labels[0]+'</text><text x="'+W+'" y="'+(H-2)+'" class="ax" text-anchor="end">'+nowLbl+'</text>'+
             '<line x1="0" y1="'+(H-14)+'" x2="'+W+'" y2="'+(H-14)+'" stroke="var(--line)"/>'+
             '<text x="0" y="9" class="ax">최대 '+mx.toLocaleString()+'건'+(wk?' (1주)':'')+'</text>';
  if(wk) axis = axis.replace('>'+labels[0]+'<', '>'+labels[0].split('~')[0]+'<');
  var P = period(), parts = D.regions.map(function(r){
    var n = 0; P[0].forEach(function(d){ n += (((ST.days||{})[d]||{})[th]||{})[r.k] || 0; }); return [r, n];
  }).filter(function(x){ return x[1] > 0; }).sort(function(a,b){ return b[1]-a[1]; });
  var pm = parts.length ? parts[0][1] : 1;
  var rows = parts.map(function(x){
    return '<div class="crow"><span class="cl">'+esc(x[0].l)+'</span><span class="cb"><i style="width:'+Math.max(2, x[1]/pm*100)+'%"></i></span><span class="cn">'+x[1].toLocaleString()+'</span></div>';
  }).join('') || '<div class="note">이 기간 기사 없음</div>';
  return '<div class="det"><div class="dt">'+(wk ? '최근 '+(S.sp==='h'?'6개월':'1년')+' 주별 뉴스 수' : '최근 30일 하루 뉴스 수')+(S.region==='all'?'':' · '+esc(RL[S.region]))+'</div>'+
    '<svg class="bars" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" role="img" aria-label="'+esc(th)+' 뉴스 수 그래프">'+bars+axis+'</svg>'+
    '<div class="dt">'+esc(P[2])+' 나라별</div>'+rows+'</div>';
}
function renderStats(t){
  var h = '<h2>📊 테마별 뉴스 통계</h2>';
  h += '<div class="seg sm">' + [['d','📊 일별 집계'],['l','📈 장기 추이 (2021~)']].map(function(x){
    return '<button data-sm="'+x[0]+'" class="'+(S.sm===x[0]?'on':'')+'">'+x[1]+'</button>'; }).join('') + '</div>';
  if(S.sm === 'l') return renderLong(h);
  if(!ST){ loadStats(); $('main').innerHTML = h + '<p class="none">통계를 불러오는 중…</p>'; return; }
  if(ST.err || !ST.days){ $('main').innerHTML = h + '<p class="none">아직 모인 통계가 없어요. 3시간마다 모이니 잠시 후 다시 확인해 주세요.</p>'; return; }
  var P = period();
  if(S.sp==='yday' && !Object.keys((ST.days||{})[P[0][0]]||{}).length){ S.sp = 'today'; P = period(); }
  h += '<p class="note">기사 제목에 테마 단어가 들어간 뉴스 수 · 3시간마다 모아 같은 기사는 한 번만 셈 · 업데이트 '+esc(ST.updated||'')+'</p>';
  h += '<div class="seg sp">' + [['today','오늘'],['yday','어제'],['w','7일'],['m','30일'],['h','6개월'],['y','1년']].map(function(x){
    return '<button data-sp="'+x[0]+'" class="'+(S.sp===x[0]?'on':'')+'">'+x[1]+'</button>'; }).join('') + '</div>';
  var hc = have(P[0]), hp = have(P[1]), f = firstDay();
  var rows = (ST.themes||[]).map(function(th){ return {th:th, n:sum(P[0], th), p:sum(P[1], th), cap:capped(P[0], th)}; })
                            .sort(byN);
  ranks(rows, hp > 0);
  var mx = rows.length ? Math.max(1, rows[0].n) : 1, total = 0; rows.forEach(function(r){ total += r.n; });
  h += '<div class="tot">'+esc(P[2])+(S.region==='all'?' · 전체 나라':' · '+esc(RL[S.region]))+' · 총 <b>'+total.toLocaleString()+'</b>건 <span class="chgnote">'+(hp ? '(전 기간 대비)' : '')+'</span></div>';
  if(P[0].length > 1 && hc < P[0].length)
    h += '<div class="warn">⚠️ 통계는 '+f.slice(5).replace('-','/')+'부터 모으기 시작해서 이 기간은 아직 <b>'+hc+'일치</b>만 있어요 ('+P[0].length+'일 중). 날이 지나면 저절로 채워져요.'+
         (hp ? '' : ' 이전 기간 자료가 없어 ▲▼ 비교는 아직 안 나와요.')+'</div>';
  h += rows.map(function(r, i){
    var open = S.open[r.th];
    return '<div class="srow'+(open?' open':'')+'" data-th="'+esc(r.th)+'">'+
      '<div class="sline">'+mv(r, i)+'<span class="rk">'+(i+1)+'</span><span class="sn">'+esc(r.th)+'</span>'+
      '<span class="sb"><i style="width:'+Math.max(r.n?2:0, r.n/mx*100)+'%"></i></span>'+
      '<span class="sc">'+r.n.toLocaleString()+(r.cap?'+':'')+'</span>'+chg(r.n, r.p, hc, hp)+spark(r.th, 14)+'</div>'+
      (open ? detail(r.th) : '') + '</div>';
  }).join('');
  h += '<footer>· 순위 왼쪽 <span style="color:#f87171">▲</span>/<span style="color:#60a5fa">▼</span> = 바로 앞 같은 길이 기간보다 몇 계단 오르고 내렸는지<br>· 막대 = 이 기간 뉴스 수, 오른쪽 작은 선 = 최근 14일 흐름, 줄을 누르면 30일 그래프(6개월·1년은 주별)와 나라별 구성<br>'+
       '· 숫자 옆 + 는 검색 결과가 너무 많아 실제보다 적게 잡혔을 수 있다는 표시예요 (구글 뉴스는 한 번에 최대 100개)<br>'+
       '· ▲▼ 는 바로 앞 같은 길이 기간과 비교 (오늘은 진행 중이라 작게 나와요 · 모인 날 수가 다르면 하루 평균끼리 비교)<br>'+
       '· 통계는 '+esc(f)+'부터 모았어요 (첫날은 일부만 잡힘) · 2년치까지 보관 (1년 통계를 그 전 1년과 비교)</footer>';
  $('main').innerHTML = h;
}

function dIdx(s){ return Math.round((Date.parse(s+'T00:00:00Z') - Date.parse(HI.since+'T00:00:00Z'))/86400e3); }
function iDate(i){ return new Date(Date.parse(HI.since+'T00:00:00Z') + i*86400e3).toISOString().slice(0,10); }
function prepHist(){                       // 달 경계(배열 위치) 미리 계산
  if(!HI || !HI.s || !HI.end) return;
  HI.n = dIdx(HI.end) + 1; HI.months = []; HI.av = [];
  for(var i=0;i<HI.n;i++){ var ok = false;      // GDELT 자료가 있는 날 (서버가 멈춰 통째로 빠진 날은 false)
    for(var t in HI.s){ for(var k in HI.s[t]){ if(HI.s[t][k][i] != null){ ok = true; break; } } if(ok) break; }
    HI.av.push(ok); }
  var y = +HI.since.slice(0,4), m = +HI.since.slice(5,7), ey = +HI.end.slice(0,4), em = +HI.end.slice(5,7);
  while(y < ey || (y === ey && m <= em)){
    var a = dIdx(y+'-'+('0'+m).slice(-2)+'-01'), ny = m===12 ? y+1 : y, nm = m===12 ? 1 : m+1;
    var b = Math.min(HI.n, dIdx(ny+'-'+('0'+nm).slice(-2)+'-01'));
    HI.months.push({y:y, m:m, a:a, b:b, full: b - a === dIdx(ny+'-'+('0'+nm).slice(-2)+'-01') - a});
    y = ny; m = nm;
  }
}
function hsum(th, a, b, rk){               // [a, b) 날짜 칸의 합 (국가 필터 반영) · 자료 없는 날(null)은 건너뜀
  var s = (HI.s||{})[th] || {}, n = 0;
  for(var k in s){ if(rk ? k !== rk : !(S.region==='all' || k===S.region)) continue;
    var arr = s[k]; for(var i=Math.max(0,a); i<Math.min(b, arr.length); i++) if(arr[i] != null) n += arr[i]; }
  return n;
}
function avn(a, b){ var n=0; for(var i=Math.max(0,a); i<Math.min(b, HI.n); i++) if(HI.av[i]) n++; return n; }   // 자료 있는 날 수
function years(){ var a = [], y0 = +HI.since.slice(0,4), ty = +HI.end.slice(0,4); for(var y=ty-1; y>=y0; y--) a.push(y); return a; }   // 다 지난 해 (최근 먼저)
function pickYear(){ var ys = years(); return ys.indexOf(S.ly) >= 0 ? S.ly : (ys[0] || +HI.end.slice(0,4)); }
function lperiod(){                        // [이번 a,b] [비교 a,b 또는 null] 이름
  var M = HI.months, last = M[M.length-1], lf = last.full ? M.length-1 : M.length-2, ty = +HI.end.slice(0,4);
  if(S.lp === 'lm' && lf >= 0){ var x = M[lf], p = M[lf-1];
    return [[x.a, x.b], p ? [p.a, p.b] : null, x.y+'년 '+x.m+'월', '전달 대비']; }
  if(S.lp === 'ty'){ var a = dIdx(ty+'-01-01'), pa = dIdx((ty-1)+'-01-01'), len = HI.n - a;
    return [[a, HI.n], pa >= 0 ? [pa, pa+len] : null, ty+'년 (1월 1일~'+HI.end.slice(5).replace('-','/')+')', '작년 같은 기간 대비']; }
  if(S.lp === 'yr'){ var yy = pickYear(), ya = Math.max(0, dIdx(yy+'-01-01')), yb = Math.min(HI.n, dIdx((yy+1)+'-01-01')), pa = dIdx((yy-1)+'-01-01');
    return [[ya, yb], pa >= 0 ? [pa, ya] : null, yy+'년 전체', yy-1+'년 대비']; }
  return [[0, HI.n], null, HI.since.slice(0,7).replace('-','.')+' ~ '+HI.end.replace(/-/g,'.')+' 전체', ''];
}
function mspark(th){                       // 달별 흐름 (작은 선, 진행 중인 달은 빼고)
  var M = HI.months.filter(function(x){ return x.full; }), vals = M.map(function(x){ var d = avn(x.a, x.b); return d ? hsum(th, x.a, x.b)/d : 0; });
  if(vals.length < 2) return '';
  var mx = Math.max.apply(null, vals.concat([1])), w = 64, h = 20;
  var pts = vals.map(function(v,i){ return (i*(w/(vals.length-1))).toFixed(1)+','+(h-2-(v/mx)*(h-4)).toFixed(1); }).join(' ');
  return '<svg class="spark" viewBox="0 0 '+w+' '+h+'" width="'+w+'" height="'+h+'" aria-hidden="true"><polyline points="'+pts+'" fill="none" stroke="var(--acc)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></svg>';
}
function ldetail(th){                      // 달별 막대 + 나라별 구성
  var M = HI.months, dn = M.map(function(x){ return avn(x.a, x.b); });
  var vals = M.map(function(x, i){ return dn[i] ? hsum(th, x.a, x.b)/dn[i] : 0; });   // 하루 평균 (자료 빠진 날 영향 없게)
  var mx = Math.max.apply(null, vals.concat([1])), W = 320, H = 120, bw = W/M.length;
  var bars = vals.map(function(v,i){
    var x = M[i], bh = Math.max(v ? 2 : 0, (v/mx)*(H-32)), bx = i*bw + 1, y = H-14-bh;
    return '<g class="bar"><rect x="'+bx.toFixed(1)+'" y="0" width="'+(bw-2).toFixed(1)+'" height="'+(H-14)+'" fill="transparent"/>'+
      '<rect x="'+bx.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+(bw-2).toFixed(1)+'" height="'+bh.toFixed(1)+'" rx="2" fill="var(--acc)"'+(x.full?'':' opacity=".55"')+'/>'+
      '<title>'+x.y+'년 '+x.m+'월'+(x.full?'':' (진행 중)')+' · 하루 평균 '+Math.round(v).toLocaleString()+'건 · 한 달 '+hsum(th, x.a, x.b).toLocaleString()+'건'+
      (dn[i] < x.b - x.a ? ' (자료 '+dn[i]+'일치)' : '')+'</title></g>';
  }).join('');
  var ticks = M.map(function(x,i){ return x.m===1 ? '<line x1="'+(i*bw).toFixed(1)+'" y1="'+(H-14)+'" x2="'+(i*bw).toFixed(1)+'" y2="'+(H-9)+'" stroke="var(--sub)"/>'+
      '<text x="'+(i*bw+2).toFixed(1)+'" y="'+(H-1)+'" class="ax">'+x.y+'</text>' : ''; }).join('');
  var axis = ticks + '<line x1="0" y1="'+(H-14)+'" x2="'+W+'" y2="'+(H-14)+'" stroke="var(--line)"/>'+
             '<text x="0" y="9" class="ax">최대 하루 평균 '+Math.round(mx).toLocaleString()+'건</text>';
  var P = lperiod(), parts = D.regions.filter(function(r){ return (HI.regions||[]).indexOf(r.k) >= 0; }).map(function(r){
    return [r, hsum(th, P[0][0], P[0][1], r.k)]; }).filter(function(x){ return x[1] > 0; }).sort(function(a,b){ return b[1]-a[1]; });
  var pm = parts.length ? parts[0][1] : 1;
  var rows = parts.map(function(x){
    return '<div class="crow"><span class="cl">'+esc(x[0].l)+'</span><span class="cb"><i style="width:'+Math.max(2, x[1]/pm*100)+'%"></i></span><span class="cn">'+x[1].toLocaleString()+'</span></div>';
  }).join('') || '<div class="note">이 기간 기사 없음</div>';
  return '<div class="det"><div class="dt">달별 하루 평균 뉴스 수 ('+HI.since.slice(0,4)+'년 1월~)'+(S.region==='all'?'':' · '+esc(RL[S.region]))+'</div>'+
    '<svg class="bars" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" role="img" aria-label="'+esc(th)+' 달별 뉴스 수">'+bars+axis+'</svg>'+
    '<div class="dt">'+esc(P[2])+' 나라별</div>'+rows+'</div>';
}
function renderLong(h){
  if(!HI){ loadHist(); $('main').innerHTML = h + '<p class="none">장기 추이를 불러오는 중…</p>'; return; }
  if(HI.err || !HI.s || !HI.months || !HI.months.length){ $('main').innerHTML = h + '<p class="none">장기 추이를 아직 받는 중이에요. 처음 한 번은 몇 시간 걸려요. 조금 뒤에 다시 열어 주세요.</p>'; return; }
  if(S.region === 'world'){ $('main').innerHTML = h + '<p class="none">장기 추이는 나라별(한국·미국·중국·대만·홍콩·일본·싱가포르)로만 셀 수 있어요. 위에서 \'전체\'나 다른 나라를 골라 주세요.</p>'; return; }
  var P = lperiod();
  h += '<p class="note">GDELT(전 세계 뉴스 기록) 자료 · 본문에 테마 단어가 나온 기사 수 · 일주일에 한 번 갱신 · '+esc(HI.end.slice(5).replace('-','/'))+'까지 · 업데이트 '+esc(HI.updated||'')+'</p>';
  if(!HI.complete) h += '<div class="warn">⏳ '+HI.since.slice(0,4)+'년 1월부터 자료를 아직 받는 중이에요. 다 받기 전엔 일부 테마·나라·연도가 0이나 빈칸으로 보여요. 자료 서버가 느려서 하루쯤 걸려요 (봇이 알아서 이어 받음).</div>';
  h += '<div class="seg lp">' + [['all','전체'],['lm','지난달'],['ty','올해'],['yr','연도별']].map(function(x){
    return '<button data-lp="'+x[0]+'" class="'+(S.lp===x[0]?'on':'')+'">'+x[1]+'</button>'; }).join('') + '</div>';
  if(S.lp === 'yr') h += '<div class="seg ly">' + years().map(function(y){
    return '<button data-ly="'+y+'" class="'+(pickYear()===y?'on':'')+'">'+y+'</button>'; }).join('') + '</div>';
  var dc = avn(P[0][0], P[0][1]), dp = P[1] ? avn(P[1][0], P[1][1]) : 0, span = P[0][1] - P[0][0];
  if(span - dc > 0) h += '<div class="warn">ℹ️ 이 기간 중 '+(span-dc)+'일은 GDELT 서버 사정으로 자료가 비어 있어요 ('+span+'일 중 '+dc+'일치). 합계는 그만큼 적게 잡히고, ▲▼ 비교는 하루 평균끼리 해요.</div>';
  var rows = (HI.themes||[]).map(function(th){ return {th:th, n:hsum(th, P[0][0], P[0][1]), p: P[1] ? hsum(th, P[1][0], P[1][1]) : null}; })
                            .sort(byN);
  ranks(rows, !!P[1] && dp > 0);
  var mx = rows.length ? Math.max(1, rows[0].n) : 1, total = 0; rows.forEach(function(r){ total += r.n; });
  h += '<div class="tot">'+esc(P[2])+(S.region==='all'?' · 7개 나라':' · '+esc(RL[S.region]))+' · 총 <b>'+total.toLocaleString()+'</b>건 <span class="chgnote">'+(P[1]?'('+P[3]+')':'')+'</span></div>';
  h += rows.map(function(r, i){
    var open = S.open['L'+r.th];
    return '<div class="srow'+(open?' open':'')+'" data-th="'+esc(r.th)+'" data-l="1">'+
      '<div class="sline">'+mv(r, i)+'<span class="rk">'+(i+1)+'</span><span class="sn">'+esc(r.th)+'</span>'+
      '<span class="sb"><i style="width:'+Math.max(r.n?2:0, r.n/mx*100)+'%"></i></span>'+
      '<span class="sc">'+r.n.toLocaleString()+'</span>'+(r.p===null ? '<span class="chg"></span>' : chg(r.n, r.p, dc, dp))+mspark(r.th)+'</div>'+
      (open ? ldetail(r.th) : '') + '</div>';
  }).join('');
  h += '<footer>· 순위 왼쪽 <span style="color:#f87171">▲</span>/<span style="color:#60a5fa">▼</span> = 비교 기간(전달·작년 같은 기간·전년)보다 몇 계단 오르고 내렸는지<br>· 오른쪽 작은 선 = '+HI.since.slice(0,4)+'년 1월부터 달별 흐름(하루 평균), 줄을 누르면 달별 그래프와 나라별 구성<br>'+
       '· 일별 집계(기사 제목 기준, 구글 뉴스)와 세는 방법이 달라 숫자 크기는 서로 비교하지 말고 흐름만 보세요<br>'+
       '· 한국·중국·일본 기사도 GDELT 가 영어로 번역해 둔 것을 영어 검색어로 셉니다 · 자료가 빠진 날은 0이 아니라 빈칸으로 둠</footer>';
  $('main').innerHTML = h;
}

document.addEventListener('click', function(e){

    $('s-ct').dataset.q = "너는 어려운 경제 뉴스를 초등학생도 이해할 수 있게 풀어 주는 친절한 번역가야.\n이 페이지의 뉴스 기사 전체를 쉬운 한국어로 번역해 줘.\n\n[가장 중요한 규칙]\n- 쉽게 쓰더라도 기사 내용은 정확해야 해. 사실을 빼거나, 바꾸거나, 지어내지 마.\n- 기사 순서대로, 빠지는 내용 없이 번역해 줘.\n\n[쉽게 쓰는 방법]\n1. 한 문장에는 한 가지 내용만 써 줘. 문장은 짧게.\n2. \"~습니다/~해요\"체로 친절하게 써 줘.\n3. 어려운 말은 쉬운 말로 바꾸고, 꼭 필요한 전문 용어는 처음 나올 때 괄호로 뜻을 풀어 줘.\n   (예: 금리(돈을 빌릴 때 내는 이자의 비율), 실적(회사가 번 돈과 성과), 주가(회사 주식 한 주의 가격))\n4. 한자어·외래어보다 쉬운 우리말을 먼저 써 줘. (예: 하락 → 떨어졌어요, 상승 → 올랐어요)\n5. 큰 숫자는 읽기 쉽게 바꾸되 정확한 값은 지켜 줘. (예: $2.5 billion → 25억 달러(약 3조 5천억 원쯤))\n   환율로 바꾼 값은 \"약\"을 붙여서 대략이라는 걸 알려 줘.\n6. 회사·사람 이름은 한국에서 부르는 이름으로 쓰고, 처음 나올 때만 괄호에 영어 이름을 적어 줘. (예: 엔비디아(Nvidia))\n7. 누가 한 말인지 분명하게 써 줘. (예: 젠슨 황 대표는 \"…\"라고 말했어요.)\n\n[출력 형식]\n① 한 줄 요약: 이 기사가 무슨 이야기인지 한 문장으로\n② 쉬운 번역: 기사 순서대로\n③ 어려운 말 풀이: 기사에 나온 경제 용어 3~5개를 한 줄씩 쉽게 설명\n④ 그래서 무슨 뜻이야?: 이 소식이 주식 투자하는 사람에게 왜 중요한지 2~3줄\n   (기사에 나온 사실만 근거로, 내 생각이나 예측은 넣지 마)\n\n기사가 길어서 한 번에 다 못 하면, 어디까지 했는지 알려 주고 내가 \"계속\"이라고 하면 이어서 해 줘.";
  }
