<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#262624">
<title>투자 테마 뉴스</title>
<style>
@font-face{font-family:'ChosunIlboMyungjo';src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_one@1.0/Chosunilbo_myungjo.woff') format('woff');font-weight:normal;font-display:swap}
:root{color-scheme:dark;--bg:#262624;--card:#30302e;--card2:#3a3a37;--text:#faf9f5;--sub:#a6a39a;--line:#3e3e3a;--acc:#d97757;--red:#ef4444}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.55 'ChosunIlboMyungjo',Georgia,"Noto Serif KR",serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:760px;margin:auto}
header{padding:20px 16px 8px}
h1{font:600 22px/1.3 'ChosunIlboMyungjo',Georgia,serif;margin:0 0 4px}
.upd{color:var(--sub);font-size:12.5px}
/* 테마 탭 */
.tabs{position:sticky;top:0;z-index:3;background:rgba(38,38,36,.96);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.tabrow{display:flex;gap:8px;overflow-x:auto;padding:12px 16px 10px;scrollbar-width:none}.tabrow::-webkit-scrollbar{display:none}
.tab{position:relative;flex:none;padding:9px 15px;border-radius:12px;border:1px solid var(--line);background:var(--card);
  color:var(--sub);font:inherit;font-size:14px;cursor:pointer}
.tab b{margin-left:5px;color:var(--sub);font-weight:400;font-size:12px}
.tab.on{background:var(--acc);border-color:var(--acc);color:#1f1e1d;font-weight:600}.tab.on b{color:#1f1e1d}
.dot{position:absolute;top:-3px;right:-3px;width:11px;height:11px;border-radius:50%;background:var(--red);border:2px solid var(--bg)}
/* 정렬·국가 */
.ctrl{display:flex;gap:6px;overflow-x:auto;padding:0 16px 10px;scrollbar-width:none}.ctrl::-webkit-scrollbar{display:none}
.ctrl button{flex:none;border:1px solid var(--line);background:transparent;color:var(--sub);border-radius:8px;padding:5px 11px;font:inherit;font-size:12.5px}
.ctrl button.on{background:var(--card2);border-color:var(--card2);color:var(--text)}
.ctrl .sep{flex:none;width:1px;background:var(--line);margin:2px 4px}
main{padding:6px 12px 48px}
h2{font:600 19px/1.3 'ChosunIlboMyungjo',Georgia,serif;margin:16px 4px 2px}
.note{margin:0 4px 10px;color:var(--sub);font-size:12px}
.none{color:var(--sub);margin:24px 4px;text-align:center}
.card{display:block;background:var(--card);border-radius:12px;padding:12px 14px;margin:8px 0;color:var(--text);text-decoration:none;transition:background .15s}
.card:hover{background:var(--card2)}.card:active{opacity:.75}
.meta{color:var(--sub);font-size:12px}
.title{font-weight:500;margin-top:3px}
.orig{color:var(--sub);font-size:12px;margin-top:3px}
.new{margin-left:4px;color:var(--red);font-size:11px;font-weight:700;letter-spacing:.3px}
.hot{display:inline-block;margin-right:6px;padding:0 6px;border-radius:4px;background:rgba(217,119,87,.16);color:var(--acc);font-weight:600}
.hot.big{background:var(--acc);color:#1f1e1d}
.newbar{display:block;width:100%;margin:2px 0 6px;padding:9px;border:0;border-radius:10px;background:rgba(239,68,68,.14);color:#fca5a5;font:inherit;font-size:13px;text-align:left}
.more{display:block;width:100%;margin:4px 0 0;padding:10px;border:1px dashed var(--line);border-radius:12px;background:transparent;color:var(--sub);font:inherit;font-size:13px}
footer{margin:36px 4px 0;padding-top:14px;border-top:1px solid var(--line);color:var(--sub);font-size:12px;line-height:1.7}
footer b{color:var(--text);font-weight:600}
/* 요약 창 */
#dim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:5}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:6;max-width:760px;margin:auto;max-height:82vh;overflow-y:auto;
  background:var(--card);border-radius:16px 16px 0 0;padding:10px 18px calc(18px + env(safe-area-inset-bottom));box-shadow:0 -8px 30px rgba(0,0,0,.4)}
.grab{width:38px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 12px}
.s-title{font-size:17px;font-weight:600;margin:4px 0 2px;line-height:1.45}
.s-label{margin:16px 0 4px;color:var(--acc);font-size:12px;font-weight:700;letter-spacing:.5px}
.s-sum{font-size:15px;line-height:1.75}.s-sum.empty{color:var(--sub);font-size:13.5px}
.s-btns{display:flex;gap:8px;margin-top:20px}
.s-btns a{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;padding:11px 6px;border-radius:10px;font:inherit;font-size:13.5px;line-height:1.3;text-decoration:none;
  background:var(--acc);color:#1f1e1d;font-weight:600}
.s-btns a.cl{background:transparent;border:1px solid var(--acc);color:var(--acc)}
.s-close button{width:100%;margin-top:8px;padding:11px;border-radius:10px;background:transparent;border:1px solid var(--line);color:var(--sub);font:inherit;font-size:14px}
.s-cnote{margin-top:8px;color:var(--sub);font-size:11.5px;text-align:center}
#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);z-index:9;max-width:90%;padding:10px 16px;border-radius:10px;background:#faf9f5;color:#1f1e1d;font-size:13.5px;box-shadow:0 6px 20px rgba(0,0,0,.4)}
.seg{display:flex;gap:4px;margin:6px 4px 10px}.seg button{flex:1;min-width:0;border:1px solid var(--line);background:transparent;color:var(--sub);border-radius:8px;padding:7px 0;font:inherit;font-size:12.5px;white-space:nowrap}
.seg.ly{margin-top:-4px}.seg.ly button{padding:5px 0;font-size:12px}.seg.ly button.on{background:var(--card2);border-color:var(--acc);color:var(--text);font-weight:600}
.seg.sm{margin-bottom:8px}.seg.sm button{padding:9px 0;font-size:13px}.seg.sm button.on{background:var(--card2);border-color:var(--acc);color:var(--text)}
.warn{margin:0 4px 10px;padding:8px 10px;border-radius:8px;background:rgba(250,204,21,.08);color:var(--sub);font-size:12.5px;line-height:1.5}.warn b{color:var(--text)}
.seg button.on{background:var(--acc);border-color:var(--acc);color:#1f1e1d;font-weight:600}
.tot{margin:2px 4px 10px;color:var(--sub);font-size:13px}.tot b{color:var(--text)}.chgnote{font-size:11px}
.srow{background:var(--card);border-radius:12px;margin:6px 0;padding:10px 12px;cursor:pointer}.srow.open{background:var(--card2)}
.sline{display:flex;align-items:center;gap:8px}
.rk{width:18px;color:var(--sub);font-size:12px;text-align:right;flex:none}
.mv .gap{display:inline-block;width:3px}.mv{width:30px;flex:none;font-size:11px;font-weight:600;text-align:left;font-variant-numeric:tabular-nums;margin-right:-4px}.mv.up{color:#f87171}.mv.dn{color:#60a5fa}.mv.same{color:#a8a29e;font-size:15px;font-weight:700;line-height:1;padding-left:3px}
.sn{width:86px;flex:none;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb{flex:1;height:10px;background:rgba(255,255,255,.05);border-radius:5px;overflow:hidden;min-width:30px}.sb i{display:block;height:100%;background:var(--acc);border-radius:0 4px 4px 0}
.sc{width:54px;flex:none;text-align:right;font-size:14px;font-variant-numeric:tabular-nums}
.chg{width:48px;flex:none;text-align:right;font-size:11.5px;color:var(--sub)}.chg.up{color:#f87171}.chg.dn{color:#60a5fa}
.spark{flex:none}
.det{margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.dt{color:var(--sub);font-size:12px;margin:6px 0 4px}
.bars{width:100%;height:auto;display:block}.bars .ax{fill:var(--sub);font-size:10px}.bars .bar:hover rect+rect{opacity:.8}
.crow{display:flex;align-items:center;gap:8px;margin:3px 0;font-size:12.5px}.cl{width:86px;flex:none}.cb{flex:1;height:8px;background:rgba(255,255,255,.05);border-radius:4px;overflow:hidden}
.cb i{display:block;height:100%;background:var(--acc);opacity:.8;border-radius:0 3px 3px 0}.cn{width:50px;text-align:right;flex:none;font-variant-numeric:tabular-nums}
@media(max-width:400px){.spark{display:none}.sn{width:74px}}
</style></head><body>

角","su":"엔비디아 CEO 젠슨 황이 큰 어려움에 처해 있는 동안, 인공지능 스타트업 앤트로픽은 역사상 최대 규모의 기업공개(IPO) 중 하나를 준비하고 있습니다. Dario Amodei CEO가 이끄는 앤트로픽은 상장(주식시장에 처음 들어오는 것) 이후 거의 7차례 청약을 받았으며 시장 목표 가치는 1조 4천억 달러(약 NT$ 45조 9600억)에 달해 AI 투자에 대한 월스트리트의 새로운 베팅을 촉발시켰습니다. 투자로"},{"s":"엔비디아 실적, 인류 최초 공모(IPO) 테스트 기술 상승세 전에 아시아 주가 하락","so":"CNA","tm":"11/16 10:35","c":3,"r":"sg","u":"https://www.channelnewsasia.com/business/asian-shares-fall-nvidia-earnings-anthropic-ipo-test-tech-rally-6553841","p":1794792936,"a":1794794321,"t":"Asian shares fall before Nvidia earnings, Anthropic IPO test tech rally","su":"시드니, 11월 16일 : 엔비디아 CEO 젠슨 황의 충격적인 사임으로 인해 일주일 동안 아시아 증시는 하락세를 보였습니다. 이번 주 반도체(전자기기의 두뇌 부품) 회사의 수익과 앤트로픽의 기업공개(IPO)는 AI가 주도하는 강세(오르는 힘이 센 것)장이 아직 더 진행될지 테스트할 예정입니다. 또한 이번 주 후반에는 도널드 트럼프 미국 대통령이"},{"s":"[마켓무버]뉴욕증시 혼조 마감…엔비디아 리더십 공백에 기술주 약세","so":"이데일리","tm":"11/16 08:12","c":3,"r":"kr","u":"https://www.edaily.co.kr/News/Read?newsId=01341526645646376&mediaCodeNo=257","p":1794784332,"a":1794784750,"su":"11월16일 이데일리TV 마켓시그널지난 13일(현지시간) 뉴욕증시는 엔비디아의 경영 불확실성과 금리 부담 속에 혼조세로 마감했다. 다우지수는 0.10% 상승했지만 나스닥과 S&P500(미국 큰 회사 500곳 지수)지수는 각각 0.91%, 0.40% 하락했다. 필라델피아 반도체(전자기기의 두뇌 부품)지수도 3.43% 떨어지..."},{"s":"K뷰티 ETF, 뉴욕증시에 떴다","so":"매일경제 마켓","tm":"11/15 17:24","c":3,"r":"kr","u":"https://stock.mk.co.kr/news/view/1199134","p":1794731077,"a":1794784750,"su":"K뷰티 ETF(여러 주식을 묶어 파는 상품), 뉴욕증시에 떴다 문가영 기자(moon31@mk.co.kr) 입력 : 2026.11.15 17:24:37 기네스 앳킨슨 K-뷰티 ETF 한국콜마 등 25개 종목 투자 한국 화장품 산업이 가파른 성장세를 이어가면서 미국 월가에 한국 뷰티 기업에 집중 투자하는 상장(주식시장에 처음 들어오는 것)지수펀드(ETF)가 출시됐다. 미국 자산운용사 기네스 앳킨슨 자산운용에 따르면 지난 12일(현지시간) 한국 화장품 제조사 등 25개 기업으로 구성된 인덱스를 추종하는 '기네스 앳킨슨 K-뷰티 ETF'(KBTY)가 뉴욕증권거래소 아르카에 신규 상장됐다."},{"s":"Barr 연준 총재: AI 에이전트가 향후 은행 운영 위험을 증가시킬 수 있음","so":"36Kr","tm":"11/16 20:36","c":2,"r":"cn","u":"https://www.36kr.com/newsflashes/4072337885041800","p":1794829013,"a":1794830364,"t":"美联储理事巴尔：AI智能体或加大未来银行挤兑风险","su":"11월 16일, 마이클 바 연준 총재는 자율 인공지능 에이전트가 시장 신호나 금리 변화에 따라 고객 예금을 자동으로 이체함으로써 은행 운영을 가속화할 수 있다고 경고했습니다. 그는 대형 은행들이 소매 계좌에 대해 승인되지 않은 작업을 수행하려는 AI 에이전트를 발견했다고 말했습니다. Barr는 AI 에이전트가 은행이 전통적인 유동성(시장에 도는 돈의 양) 관리 및 규제 개입에 대응할 수 있는 속도를 초과하여 몇 분 안에 대규모로 자금을 이동할 수 있다고 지적했습니다. 그는 또한 3조 달러 이상의 부외 부채와 기술 대기업 간의 \"회전 자금 조달(사업에 쓸 돈을 모으는 것)\" 거래와 관련된 AI 인프라 투자 붐에 위험이 있다고 경고했습니다. (인터페이스)"},{"s":"\"국제 금융\" 인플레이션이 과열되고 있으며 연준 Schmid는 금리 인상이 \"필수적\"이라고 암시합니다.","so":"旺得富理財網","tm":"11/16 16:04","c":2,"r":"tw","u":"https://wantrich.chinatimes.com/news/20261116900246-420201","p":1794812651,"a":1794830371,"t":"《國際金融》通膨過熱 Fed施密德暗示升息「勢在必行」","su":"[Ke Wanxiu 및 The Times의 종합 외국 보고서 편집] 제프 슈미드 캔자스시티 연준 총재는 일요일 연준이 \"과열된\" 물가 압력에 대처할 수단과 책임이 있으며 연준은 인플레이션(물건값이 계속 오르는 것)에 대해 \"아직 해야 할 일이 있다\"고 말했습니다. 슈미드는 하와이에서 열린 신용조합 회의에서 추가 금리(돈을 빌릴 때 내는 이자 비율) 인상을 명시적으로 요구하지는 않았지만 \"인플레이션이 물가 안정 목표인 2%를 넘어서고 잘못된 방향으로 가고 있다\"고 강조했습니다."},{"s":"미국 증시의 급격한 하락 영향으로 대만 증시는 오늘 2,635포인트 급락해 역사상 두 번째로 큰 하락폭을 기록했다.","so":"經濟日報","tm":"11/16 15:01","c":2,"r":"tw","u":"https://money.udn.com/money/story/5607/9881677","p":1794808893,"a":1794809524,"t":"受美股重挫波及 台股今暴跌2635點 創史上第二大跌點紀錄","su":"오늘 대만 증시는 또 급락했습니다. 미국 반도체(전자기기의 두뇌 부품)주 폭락 영향으로 젠슨 엔비디아 CEO 황 회장 사임 논란 확산과 미국 물가·금리(돈을 빌릴 때 내는 이자 비율) 인상 우려가 닥치자 대만 증시는 하락세로 출발하고 매도압력이 계속 높아지며 4만3000포인트, 4만2000포인트를 연달아 돌파했다. 최종 가중지수는 2,635.04포인트(6.03%) 하락한 41,040포인트로 마감했다. 거래량은 NT$8,450억 6천만으로 증가했습니다. 이는 대만 주식 역사상 두 번째로 큰 마감점 하락폭으로, 올해 7월 17일의 2,953.71포인트 하락에 이어 두 번째입니다."},{"s":"【마츠이 증권】앤트로픽 상장 기념 「미국 주식 데뷔 CP」 개최","so":"株探","tm":"11/16 11:21","c":2,"r":"jp","u":"https://s.kabutan.jp/news/n202611160440/","p":1794795703,"a":1794797184,"t":"【松井証券】アンソロピック上場記念「米国株デビューCP」開催","su":"[마츠이 증권] 앤트로픽 상장(주식시장에 처음 들어오는 것) 기념 '미국 주식 데뷔 CP' 개최 마츠이 증권 <도쿄 P>는 미국 AI 개발 기업 앤트로픽 <ANT>의 상장을 기념하여 AI 관련 유명 상표를 대상으로 한 '미국 주식 데뷔 캠페인'을 개최하고 있다. 내년 1월 29일까지. 마츠이 증권으로 처음으로 미국 주식을 거래하고, 기간 중에 대상 종목을 현물로 매입해, 전용 폼으로부터 엔트리한 사람이 대상(거래와 엔트리의 순서는 불문). NISA 계좌에서의 매입이나 매각만은 대상외가 된다. 조건을 만족하면 약정대금(상한 2000달러)에 걸리는 거래수수료가 캐쉬백된다."},{"s":"미국 기술주의 큰 하락으로 대만 주식은 초반 거래에서 500포인트 이상 하락했습니다. 외환시장에서 외국자본에 대한 송금 압력이 완화되었습니다.","so":"經濟日報","tm":"11/16 10:45","c":2,"r":"tw","u":"https://money.udn.com/money/story/5607/9880985?from=udnamp-referralnews_ch1001artbottom","p":1794793536,"a":1794794317,"t":"美股科技股重挫拖累台股早盤跌逾500點　匯市外資匯出壓力趨緩","su":"미국 기술주는 계속해서 압박을 받고 있으며, 이로 인해 대만의 주식 시장과 외환 시장이 동시에 약세(내리는 흐름)를 보이고 있습니다. 대만 증시는 장 초반 43512.42포인트에 개장한 뒤 곧바로 매도 압력이 나타나 한때 700포인트 넘게 하락했다. 하락폭은 이후 수렴됐지만 하락폭은 여전히 ​​500포인트를 넘었다. 신대만달러는 미국 달러 대비 32.87대만달러로 출발한 후 32.9대만달러로 하락해 6.2센트 하락해 주식과 환차손이 모두 동반되는 패턴을 보였다."},{"s":"젠슨 황은 월스트리트에서 사임하고 엔비디아의 발언을 하향 조정했습니다. 소매 투자자들은 여전히 ​​바닥을 추측하기 위해 시장에 진입했습니다.","so":"自由時報","tm":"11/16 10:32","c":2,"r":"tw","u":"https://stock.ltn.com.tw/article/zryycxg2nxp8","p":1794792724,"a":1794792894,"t":"黃仁勳去職華爾街降輝達評價 散戶仍進場炒底","su":"엔비디아 주가는 젠슨 황 전 CEO의 갑작스러운 사임으로 급락했다. 그러나 미국 개인 투자자들은 딥을 매수하기 위해 시장에 진입할 기회를 잡았습니다. 단 30분 만에 엔비디아 주식 1억1100만 달러(약 36억4000만 달러)를 순매수(산 돈이 판 돈보다 많은 것)해 주식 개장 후 30분 동안 개인 투자자 순매수액 역대 최고 기록을 세웠다. 보고서는 미국의 일부 개인 투자자들이 여전히 주가 급락을 매수 기회로 여기고 있다는 점을 지적했는데, 이는 주로 인공지능(AI) 칩 시장에서 엔비디아의 지배력을 낙관하고 있기 때문이다."},{"s":"모건스탠리는 2027년 S&P500 지수 목표를 8,700포인트로 높이고 독일과 영국 채권에 대해 낙관적이다.","so":"21财经","tm":"11/16 10:25","c":2,"r":"cn","u":"https://www.21jingji.com/article/20261116/herald/dbc10d0ccf84109520190063df45283e.html","p":1794792300,"a":1794794316,"t":"摩根士丹利上调2027年标普500指数目标点位至8700点 看好德债和英债","su":"모건스탠리의 2027년 시장 전망에서 은행은 미국 주식과 일부 G10 국채에 대해 낙관적입니다. 마리나 자보록(Marina Zavolock)을 포함한 전략가들은 11월 15일 보고서에서 은행이 S&P500(미국 큰 회사 500곳 지수) 목표를 8,700으로 상향 조정했으며 이는 약 15%의 상승 여력을 암시한다고 썼습니다. 은행은 또한 일본 Topix 지수의 목표 지점을 약 22% 상승 여력에 해당하는 4,800포인트로 상향 조정했습니다. 금리 측면에서 모건스탠리는 독일 국채와 영국 국채에 대해 낙관적입니다. 매튜 혼바흐(Matthew Hornbach) 등 전략가들은 보고서에서 2028년 영란은행의 금리 인상에 대한 시장의 기대는 은행의 기대보다 높은 반면, 유럽중앙은행(ECB)의 완화 정책에 대한 기대는 은행의 기대보다 낮다고 밝혔습니다. 미국 10년 만기 국채 금리(나라가 돈 빌릴 때 내는 이자 비율)는 5% 안팎을 유지할 것으로 예상된다. 연준은 3월까지 금리를 4.375% 중반까지 인상하고 내년에도 이 수준을 유지할 것으로 예상된다."},{"s":"엔비디아, 해외 시장 뷰 & 미국 주식 픽업 ​​(11월 16일)","so":"日本経済新聞","tm":"11/16 10:17","c":2,"r":"jp","u":"https://www.nikkei.com/prime/veritas/article/DGXZQOKC1615K0W6A111C2000000","p":1794791871,"a":1794792895,"t":"エヌビディア、海外市場ビュー&米国株ピックアップ（11月16日）","su":"모든 기사를 무제한 1개월 무료 체험 실시중! 코어위브, 테라다인 해외시장 뷰&미국주 픽업(11월 12일) 엔비디아, 코어위브 해외시장 뷰&미국주 픽업(11월 11일) 해외시장뷰&미국주 픽업(9월 15일)"},{"s":"전략 미국 증시는 밤새 거래에서 8% 이상 하락했습니다.","so":"Jiemian.com","tm":"11/16 10:06","c":2,"r":"cn","u":"https://www.jiemian.com/article/15334977.html","p":1794791196,"a":1794792437,"t":"Strategy美股夜盘跌超8%"},{"s":"지난 금요일 미국 증시의 AI 스토리지 부문이 종합적으로 마감됐고, SK하이닉스는 4.30% 하락했다. 미국 주식 마감 리뷰","so":"21财经","tm":"11/16 09:33","c":2,"r":"cn","u":"https://www.21jingji.com/article/20261116/herald/42c51e2e94cff64565a6dc8b65aeb6c2.html","p":1794789180,"a":1794792440,"t":"美股AI存储板块上周五集体收跌，SK海力士跌4.30%丨美股复盘","su":"동부시간 11월 13일, AI 스토리지 부문이 일괄 폐쇄됐다. 엔비디아의 실적 영향으로 스토리지 부문 유명 테마주가 전반적으로 약세를 보였고, 메모리반도체(전자기기의 두뇌 부품) 주가도 전반적으로 하락했다. 마이크론는 2.52% 하락한 $778.31에 마감했습니다. SK하이닉스는 4.30% 하락한 131.79달러에 마감했다. 메모리반도체 주가는 전반적으로 하락했다. 금요일 동부시간에는 미국 3대 주가지수가 엇갈렸습니다. 마감 기준 다우지수는 0.1% 상승한 52,347.55포인트, 나스닥지수는 0.91% 하락한 25,136.27포인트, S&P500(미국 큰 회사 500곳 지수)지수는 0.4% 하락한 7,561.67포인트에 마감했습니다. 메모리반도체 주가는 전반적으로 하락했다. 마이크론 테크놀로지는 2% 이상, 샌디스크는 5% 이상, SK하이닉스는 4% 이상, 웨스턴디지털은 5%, 씨게이트 테크놀로지는 3% 이상 하락했다."},{"s":"연준이 12월에 금리를 0.25%포인트 인상할 확률은 95%입니다.","so":"Jiemian.com","tm":"11/16 08:42","c":2,"r":"cn","u":"https://www.jiemian.com/article/15334644.html","p":1794786126,"a":1794789703,"t":"美联储12月加息25个基点的概率为95%","su":"CME의 '페드워치'에 따르면 연준이 12월 금리(돈을 빌릴 때 내는 이자 비율)를 0.25%포인트(퍼센트끼리 뺀 차이) 인상할 확률은 95%, 0.5%포인트 인상 확률은 5%이다. 연준이 내년 1월까지 금리를 누적 0.25%포인트 인상할 확률은 25.2%, 누적 0.5%포인트 인상할 확률은 71.1%, 누적 0.75%포인트 인상할 확률은 3.7%이다."},{"s":"이익마진 초과한 S&P500 기업 수 감소 - 글로벌 금융 - Business Times","so":"中時新聞網","tm":"11/16 05:10","c":2,"r":"tw","u":"https://www.chinatimes.com/newspapers/20261116000213-260203","p":1794773400,"a":1794784778,"t":"標普500企業獲利超標家數急縮- 全球財經- 工商時報","su":"미국 기업들의 3분기 실적 보고서가 전반적으로 시장 기대치를 상회했지만, 이익 초과 폭이 크게 줄어들면서 기업 이익 성장 모멘텀(값이 움직이는 기세)이 점차 줄어들 수도 있다. 금융 데이터 조사 기관인 팩트셋(FactSet)이 발표한 보고서에 따르면 현재 S&P500(미국 큰 회사 500곳 지수) 지수 기업 중 88%가 3분기 실적 보고서를 발표했고, 그 중 84%가 3분기 실적 보고서를 발표했다."},{"s":"미국 증시 동향 | 인텔은 시장이 열리기 전에 5% 하락했습니다. 주주들은 PC 수요 부진을 은폐했는지 의문을 제기하며 소송을 제기했다.","so":"etnet 經濟通","tm":"11/16 22:55","c":1,"r":"hk","u":"https://www.etnet.com.hk/www/tc/us-stocks/news-article/416899/%E7%BE%8E%E8%82%A1%E5%8B%95%E5%90%91+%7C+%E8%8B%B1%E7%89%B9%E7%88%BE%E7%9B%A4%E5%89%8D%E8%B7%8C5%25%EF%BC%8C%E9%81%AD%E8%82%A1%E6%9D%B1%E5%85%A5%E7%A8%9F%E7%B4%A2%E5%84%9F%EF%BC%8C%E8%B3%AA%E7%96%91%E9%9A%B1%E7%9E%9EPC%E9%9C%80%E6%B1%82%E7%96%B2%E5%BC%B1","p":1794837300,"a":1794838033,"t":"美股動向 | 英特爾盤前跌5%，遭股東入稟索償，質疑隱瞞PC需求疲弱"},{"s":"미국 증시 개장 전 | 미국 3대 주가지수 선물이 하락했고, 나스닥 선물도 1% 이상 하락했다.","so":"etnet 經濟通","tm":"11/16 22:52","c":1,"r":"hk","u":"https://www.etnet.com.hk/www/tc/us-stocks/news-article/416898/%E7%BE%8E%E8%82%A1%E7%9B%A4%E5%89%8D+%7C+%E7%BE%8E%E8%82%A1%E4%B8%89%E5%A4%A7%E6%8C%87%E6%95%B8%E6%9C%9F%E8%B2%A8%E5%90%91%E4%B8%8B%EF%BC%8C%E7%B4%8D%E6%8C%87%E6%9C%9F%E8%B2%A8%E8%B7%8C%E9%80%BE1%25","p":1794837158,"a":1794838035,"t":"美股盤前 | 美股三大指數期貨向下，納指期貨跌逾1%"},{"s":"테이크 투, 시간외로 상승 = 미국 주식 개별","so":"株探","tm":"11/16 22:37","c":1,"r":"jp","u":"https://s.kabutan.jp/news/n202611161395/","p":1794836220,"a":1794838036,"t":"テイクツー、時間外で上昇＝米国株個別","su":"【당 사이트에서 제공하는 정보에 대해】 당 사이트 「주탐(카부탄)」에서 제공하는 정보는 투자 권유 또는 투자에 관한 조언을 하는 것을 목적으로 하고 있지 않습니다. 투자 결정은 자신의 판단으로 이루어지도록 부탁드립니다. 당 사이트에 있어서의 데이터는, 도쿄 증권 거래소, 오사카 거래소, 나고야 증권 거래소, JPX 총연, 재팬 넥스트 증권, 도지마 거래소, China Investment Information Services, CME Group Inc. 등으로부터의 정보의 제공을 받고 있습니다. 닛케이평균주가의 저작권은 일본경제신문사에 귀속됩니다."},{"s":"연준 Barr는 AI 에이전트가 고속으로 돈을 이동시키면 은행 운영이 가속화될 수 있다고 경고합니다.","so":"鉅亨網","tm":"11/16 22:30","c":1,"r":"tw","u":"https://news.cnyes.com/news/id/6664291","p":1794835834,"a":1794838029,"t":"聯準會巴爾示警：AI代理高速搬錢恐讓銀行擠兌加速","su":"Barr 연준 총재는 AI 에이전트가 고속으로 자금을 이동하여 은행 운영을 가속화할 수 있다고 경고했습니다. Uanalyze 2026년 11월 16일(Uanalyze/Industry Data Center 보고서) ⸺ Michael Barr 연준 총재는 AI 에이전트가 스트레스를 받는 동안 은행이 예금을 더 빨리 잃게 만들 수 있다고 말했습니다. 시스템이 금리(돈을 빌릴 때 내는 이자 비율)차이나 금융안정 신호를 자동으로 감지해 신속하게 고객에게 자금을 이체할 경우 은행의 기존 유동성(시장에 도는 돈의 양) 관리 및 규제 당국이 제때 대응하지 못할 수도 있다. Barr는 밀라노에서 열린 금융 AI 컨퍼런스에서 대형 은행들이 AI 에이전트가 개별 고객 계좌를 운영하려고 시도하지만 실제 신원, 고객의 동의 여부, 운영이 고객의 지시를 준수하는지 여부를 확인할 수 없다는 사실을 발견했다고 지적했습니다. 그는 AI 에이전트를 금융 서비스에 도입하려면 신원 확인을 강화하고 개인 운영 권한을 확인하며 에이전트의 권한을 제한하는 기술을 사용해야 한다고 주장했습니다."},{"s":"연준 관계자는 인플레이션이 \"잘못된 방향으로 가고 있다\"고 경고했습니다! 시장은 12월 금리를 0.25%포인트 인상할 것이라는 점에 전적으로 베팅하고 있으며, 내년 1월에도 금리를 인상할 가능성이 있다.","so":"鉅亨網","tm":"11/16 22:10","c":1,"r":"tw","u":"https://news.cnyes.com/news/id/6663647","p":1794834605,"a":1794838031,"t":"Fed官員示警通膨「走錯方向」！市場完全押注12月升息1碼、明年1月也可能升息","su":"슈미드는 9월 연간 인플레이션(물건값이 계속 오르는 것)율 3.6%가 여전히 목표인 2%보다 높고 추세가 연준의 방향에서 벗어났으며 가격 통제를 위해 해야 할 일이 아직 남아 있다고 말했다.\n시장은 연준이 12월에 0.25% 포인트 금리(돈을 빌릴 때 내는 이자 비율)를 인상할 것이라는 기대를 충분히 반영했으며, 0.5% 포인트 금리 인상 가능성도 약간 있습니다. 콜린스는 내년에는 정책금리가 더 높아질 수도 있다고 말했다.\nSchmid는 인플레이션 압력은 에너지, 관세, AI 건설 및 의료 비용에서 비롯되며 연준은 여전히 ​​수요를 억제하고 가격 안정성을 유지할 수 있는 도구를 보유하고 있다고 지적했습니다."},{"s":"S&P500의 거의 5분의 1이 뚜렷한 후임자가 없는 3명의 남성에게 묶여 있습니다.","so":"The Washington Post","tm":"11/16 22:02","c":1,"r":"us","u":"https://www.washingtonpost.com/technology/2026/11/16/probably-biggest-fear-elon-has-why-huangs-exit-looms-over-musk/","p":1794834179,"a":1794834696,"t":"Nearly a fifth of the S&P 500 is tied to three men with no clear successors"},{"s":"유럽주 미주 선물에 경계감, 나스닥은 1.49%","so":"株探","tm":"11/16 21:47","c":1,"r":"jp","u":"https://s.kabutan.jp/news/n202611161362/","p":1794833220,"a":1794838037,"t":"欧州株 米株先物に警戒感、ナスダックは１．４９％安","su":"유럽주 미주 선물에 경계감, 나스닥(미국 기술 회사들이 많은 주식시장)은 1.49% 하락 유럽주 미주 선물에 경계감, 나스닥은 1.49% 하락 도쿄 시간 21:35 현재 영국 FTSE100 10944.10 -0.11%) 부처 CAC40 8390.32(+21.41 +0.26%) 스위스 SMI 15223.84(+117.72 +0.78%) ※불 CAC40, 스위스 SMI는 15분 지연 미주가 지수 선물 26월한계 52380.00(-38.00 -0.07%) S&P500(미국 큰 회사 500곳 지수)선물 DEC 26월한계 7531.00(-52.00 -0.69%) NASDAQ100선물 DEC 26월한계 27618.09(-41"},{"s":"워렌 버핏, 가족 재단에 버크셔 해서웨이 주식 54억 달러 기부","so":"WSJ","tm":"11/16 21:46","c":1,"r":"us","u":"https://www.wsj.com/business/warren-buffett-donating-5-4-billion-of-berkshire-hathaway-stock-to-family-foundations-9efe0458", ,"t":"黃仁勳辭職衝擊輝達！華爾街至少10名分析師降評、目標價最低下看200美元","su":"젠슨 황이 돌연 사임하며 혼외 불륜 논란에 휩싸였다. 월스트리트 애널리스트 10명 이상이 엔비디아의 신용등급을 하향 조정했고, 시장은 불분명한 승계를 우려하고 있다.\n번스타인은 엔비디아를 목표주가(전문가가 예상한 앞날의 주가) $200와 \"동일\" 수준으로 낮췄습니다. 오펜하이머도 이를 '보류'로 낮췄다.\n화요일 엔비디아의 실적(회사가 번 돈 성적표) 보고서 이전에는 CFO Kress가 CEO로 활동했습니다. 애널리스트들은 주가가 압박을 받을 것을 우려해 기술 소프트웨어/정보보안주로 눈을 돌릴 것을 제안했다."},{"s":"월스트리트와 경쟁하다 - Wen Jie | AI 주가 급락해 시장 하락, 마이크로소프트는 그 수정을 활용해 단계별 배포(동영상 포함)","so":"etnet 經濟通","tm":"11/16 12:33","c":1,"r":"hk","u":"https://www.etnet.com.hk/www/tc/news/news-article.php?section=features&category=interview&newsid=416833","p":1794799980,"a":1794806412,"t":"比拼華爾街－溫傑 | AI股重挫拖累大市，微軟趁回調分段部署（有片）","su":"월스트리트와 경쟁하다 - Wen Jie | AI주 폭락하며 시장 하락세, 마이크로소프트는 조정을 틈타 단계적 전개(일부)로 지난주 금요일(13일) 시장이 인공지능(AI) 부문 조정과 미 연방준비제도(연준)의 정책 전망에 촛점을 맞추는 가운데 미국 증시 실적이 양분됐다. AI주 매도 압력으로 필라델피아 반도체지수와 나스닥 종합지수는 각각 3.4%, 0.9% 하락했고, S&P500(미국 큰 회사 500곳 지수) 지수도 0.4% 하락했다. 그러나 10월 미국 생산자물가(공장에서 파는 물건값 수준)지수(PPI) 증가율이 시장 전망보다 낮아 연준의 추가 긴축 통화정책에 대한 일부 투자자들의 우려가 완화되었습니다. 다우존스 산업평균지수는 추세를 거스르고 0.1% 상승했습니다. 또한 고평가 성장주에서 금융, 유틸리티 등 방어 부문에 이르기까지 자본 흐름에 상당한 변화가 있었습니다."},{"s":"AI 열풍이 흔들리고 있다. 6월에 데이터 센터 컨셉 주식이 4조 2천억 달러 증발했습니다 | 미국 증시 동향 | 국제적인","so":"經濟日報","tm":"11/16 12:32","c":1,"r":"tw","u":"https://money.udn.com/money/story/123398/9881307?from=edn_newestlist_rank","p":1794799962,"a":1794830380,"t":"AI熱潮動搖 資料中心概念股6月來蒸發4.2兆美元 | 美股動態 | 國際","su":"인공지능(AI) 열풍에 대한 현재 시장의 신뢰가 흔들리고, 데이터센터(컴퓨터 수만 대를 모아 둔 건물) 구축과 자주 연관되는 기업들이 최근 매도세(팔려는 힘)에 타격을 입었다. 글로벌 제조, 유틸리티 및 광업..."},{"s":"충격 걱정은 NO! 모건스탠리, 글로벌 주식시장에 '최대 비중 확대' 외침, AI 지출 낙관, 안정적, S&P 15% 추가 상승","so":"經濟日報","tm":"11/16 12:22","c":1,"r":"tw","u":"https://money.udn.com/money/story/123398/9881266","p":1794799368,"a":1794806410,"t":"無懼震盪！大摩高喊「最大加碼」全球股市 看好 AI 支出穩 標普再漲15%","su":"모건스탠리는 AI 자본 지출 사이클이 견조하게 유지되고 경제 및 기업 이익 성장의 회복력이 내년까지 연장될 것이라는 점을 근거로 글로벌 주식에 '최대 비중확대' 배분을 권고했다."},{"s":"[월스트리트 오리지널 보이스] 연방준비제도(연준)가 AI 자금조달 리스크를 우려하면서 시장의 우려도 크게 높아졌다.","so":"财新数据","tm":"11/16 12:17","c":1,"r":"cn","u":"https://database.caixin.com/2026-11-16/102505178.html","p":1794799020,"a":1794806401,"t":"【华尔街原声】美联储关注AI融资风险，市场担忧显著升温","su":"설문 조사에 따르면 응답자의 87%가 AI를 잠재적 위험으로 꼽았으며 민간 신용의 투명성 부족이 우려의 원인인 것으로 나타났습니다."},{"s":"반도체 중심 증시 약세 속 연준 금리 전망까지 이시각 주요뉴스","so":"연합인포맥스","tm":"11/16 11:39","c":1,"r":"kr","u":"https://news.einfomax.co.kr/news/articleView.html?idxno=4444937","p":1794796746,"a":1794797179,"su":"반도체(전자기기의 두뇌 부품) 불확실성이 국내 증시에 미친 영향은 무엇일까요? 코스피(한국 대표 주식시장 지수)·코스닥 동향과 알리안츠의 미국 금리 전망, 은행연합회장 선출, 엔비디아 지분 이슈, 자동차 수출 실적을 살펴봅니다. 주요 경제 흐름을 놓치지 않도록 구독해 주세요."},{"s":"연준의 금리 인상 속도가 바뀌었나요? 보스턴 연준 총재 \"내년 금리 예상보다 높아질 수도\"","so":"鉅亨網","tm":"11/16 11:10","c":1,"r":"tw","u":"https://m.cnyes.com/news/id/6662743","p":1794795004,"a":1794795237,"t":"聯準會升息步調有變？波士頓聯準銀行總裁：未來一年利率恐高於預期","su":"콜린스 보스턴 연준 총재는 경제 전망의 불확실성에 대응하여 연준이 안정적이고 점진적인 속도로 금리를 약간 인상할 것을 지지합니다.\n그녀는 미국의 인플레이션(물건값이 계속 오르는 것)이 여전히 높고 고용도 안정적이라고 지적했습니다. 시장에서는 9월 이후 12월 8일과 9일 금리를 4~4.25%로 0.25%포인트(퍼센트끼리 뺀 차이) 더 인상할 것으로 예상하고 있다.\n콜린스는 올해 초 중장기 금리 인상이 수요를 억제할 수는 있지만 여전히 금리 인상 속도를 높일 이유가 없다고 말했다. 내년 정책 금리는 이전에 예상했던 것보다 약간 높을 수 있습니다."},{"s":"젠슨 황의 사임 논란이 확산됩니다! 엔비디아의 실적 보고서는 미국 상위 50개 주식에 배치된 8%, 0.09813백만 위안에 충격을 줄 수 있습니다.","so":"UDN","tm":"11/16 11:09","c":1,"r":"tw","u":"https://udn.com/news/story/123006/9881046","p":1794794985,"a":1794797181,"t":"黃仁勳卸任風波延燒！輝達財報恐震8％ 009813萬元布局美股50強","su":"뉴스 듣기 0:00 / 0:00 젠슨 황의 사임이 논란을 불러일으켰습니다! 엔비디아의 실적(회사가 번 돈 성적표) 보고서는 8%에 충격을 줄 수 있습니다. NT$0.09813백만은 미국 상위 50개 주식에 배치됩니다. 엔비디아는 대만 시간으로 11월 18일 이른 아침에 3분기 실적 보고서를 발표하고 기자 회견을 가질 예정입니다. 창업자인 젠슨 황이 사임한 후 처음으로 분기 실적을 발표하는 만큼 시장의 위험회피 성향이 급격히 높아졌다. 옵션시장에서는 엔비디아 주가가 최대 8%까지 등락할 수 있다고 전망하고 있다. 이러한 불확실성의 영향으로 오늘(16일) 대만 증시는 장 초반 1,450포인트 이상 하락했고, 미국 기술주도 최근 높은 변동성(값이 크게 출렁이는 정도)을 보이며 블랙록 S&P 엑설런트 50(009813)이 오늘 장 초반 소폭 하락세를 보였다. , 장중 최저가는 NT$11.35를 기록했고 오전 10시 현재 NT$11.37(지난주 종가는 NT$11.47)에 거래되어 최근 52주 최고가인 NT$11.85에서 보기 드문 되돌림 공간을 남겼습니다."},{"s":"미국-이란 협상 불확실성으로 인해 루피와 채권에 부담; 연준, RBI 금리경로 주목","so":"Reuters","tm":"11/16 10:32","c":1,"r":"us","u":"https://www.reuters.com/world/india/us-iran-deal-uncertainty-weigh-rupee-bonds-fed-rbi-rate-paths-eyed-2026-11-16/","p":1794792720,"a":1794834699,"t":"US-Iran deal uncertainty to weigh on rupee and bonds; Fed, RBI rate paths eyed"},{"s":"또 다른 연준 관계자는 \"매파적\"이다.","so":"21财经","tm":"11/16 10:24","c":1,"r":"cn","u":"https://www.21jingji.com/article/20261116/herald/5448135692bec7d5fb6aa6c8c1a1a5b1.html","p":1794792240,"a":1794806402,"t":"又一美联储官员“放鹰”","su":"제프 슈미드 캔자스시티 연은총재는 \"연준은 과열된 가격 압력에 대처할 수 있는 도구와 책임을 갖고 있으며 중앙은행은 여전히 ​​인플레이션(물건값이 계속 오르는 것)에 대해 할 일이 남아 있다\"고 말했다. 슈미드는 하와이에서 열린 신용조합 회의에서 인플레이션이 \"물가안정 목표인 2%를 충격적으로 초과했으며 잘못된 방향으로 움직이고 있다\"고 말했다. 그는 추가 금리(돈을 빌릴 때 내는 이자 비율) 인상을 명시적으로 요구하지 않았습니다. 슈미드는 최근 인플레이션의 현재 성격과 연준의 이를 억제할 수 있는 능력에 대해 형성된 지배적인 견해가 현실과는 거리가 멀다고 말했습니다. 그는 높은 인플레이션이 반복되는 공급 충격으로 인해 발생한다는 생각은 요점을 놓치고 있다고 말했습니다. 인플레이션은 항상 공급과 수요의 불균형의 결과입니다. 수요가 강하기 때문에 공급 측면의 충격으로 인해 가격이 상승할 수 있습니다. 수요는 항상 인플레이션에서 핵심적인 역할을 해왔으며, 연준은 수요에 미치는 영향을 통해 인플레이션을 처리할 수 있는 도구와 책임을 항상 갖고 있었습니다."},{"s":"알리안츠 \"연준, 금리 세 번 더 올린 뒤 2028년 말 3.75%까지 인하\"","so":"연합인포맥스","tm":"11/16 10:17","c":1,"r":"kr","u":"https://news.einfomax.co.kr/news/articleView.html?idxno=4444905","p":1794791855,"a":1794792435,"su":"알리안츠그룹은 미국 연방준비제도(Fed·연준(미국의 중앙은행))가 올해 12월과 내년 1월 및 3월에 세 차례 금리(돈을 빌릴 때 내는 이자 비율)를 더 인상해 최종 금리 범위가 4.50~4.75%가 될 것이라고 16일 예상했다.알리안츠는"},{"s":"미국 증시는 혼합되어 있습니다! 대만 증시는 하락세로 출발하며 500포인트 이상 하락했습니다. TSMC는 NT$2,340로 하락했습니다.","so":"TVBS新聞網","tm":"11/16 10:08","c":1,"r":"tw","u":"https://news.tvbs.com.tw/money/4051109","p":1794791280,"a":1794792443,"t":"美股漲跌互見！台股開低一度跌逾500點 台積電下跌報2340元","su":"금요일 미국 증시는 혼조세를 보였습니다. 대만 증시는 오늘(16일) 162.7포인트 하락세로 출발했다. 이후 가중지수는 하락세를 확대해 500포인트 이상 하락했고 최저점은 43126.73포인트에 이르렀다. TSMC는 NT$10에서 NT$2,340로 개장했습니다."},{"s":"미국 주식│자금 대규모 이동, AI주 급락, 금융소비주 반등 강세 - 국제","so":"工商時報","tm":"11/16 10:01","c":1,"r":"tw","u":"https://www.ctee.com.tw/news/20261116700468-430702","p":1794790860,"a":1794792444,"t":"美股｜資金大挪移AI股重挫金融消費股逆勢走強- 國際","su":"11월 미국 증시는 큰 변화를 보였다. AI 기술주가 시장 매도 압력의 주요 원천이 되면서 자본 순환 조짐이 나타났습니다. 통계에 따르면 11월 1일부터 13일까지 엔비디아는 20.42% 하락했습니다. 마벨, 씨게이트(Seagate), 마이크론 등 AI 공급망도 동시에 약화됐다. 반도체(전자기기의 두뇌 부품) ETF(여러 주식을 묶어 파는 상품)는 6.84% 하락했다. 반면 금융ETF는 추세를 거스르며 3.84% 상승했다. 다우존스산업지수 ETF도 1.16% 상승해 미국 주식이 과거 AI 기술과 달라진 모습을 보였다."},{"s":"모건스탠리 Wealth Management Shalett: AI 자본 지출이 주도하는 강세장 논리는 여전히 견고합니다 | 미국 증시 동향 | 국제적인","so":"經濟日報","tm":"11/16 09:51","c":1,"r":"tw","u":"https://money.udn.com/money/story/123398/9880835","p":1794790277,"a":1794797183,"t":"摩根士丹利財富管理 Shalett：AI 資本支出驅動的牛市邏輯依然穩固 | 美股動態 | 國際","su":"[블룸버그] -- 엔비디아 리더십의 격동과 중간 선거에서 민주당의 승리는 인공 지능 붐에 대한 우려를 고조시켰지만 모건 스탠리 웰스 매니지먼트의 리사 샬렛은 이러한 요인들이 이 강세(오르는 힘이 센 것)장의 주요 동인인 AI 인프라 자본 지출을 흔들리지 않을 것이라고 말했다."},{"s":"'아침해석' 미국 증시는 더 많이 하락하고 덜 올랐습니다. 대만 주식 주식이 지지를 받고 있습니다 - 상장 OTC 주식","so":"旺得富理財網","tm":"11/16 09:47","c":1,"r":"tw","u":"https://wantrich.chinatimes.com/news/20261116900072-420101","p":1794790069,"a":1794792447,"t":"《晨間解盤》美股跌多漲少台股權值股有撐- 上市櫃","su":"[타임스-타이페이] 미국의 인플레이션(물건값이 계속 오르는 것)이 여전히 높은 수준을 유지하고 있다. 미국 증시는 상승보다 하락이 더 컸습니다. 대만 증시는 반등세를 이어갈 것으로 예상된다. 미국의 인플레이션 압력은 여전히 ​​높으며 연준이 12월에 금리를 인상할 것이라는 기대를 계속해서 높이고 있습니다. 10년 만기 미국 국채 금리(나라가 돈 빌릴 때 내는 이자 비율)는 10월 중순 이후 최고치를 경신했다. 기술주는 다시 한번 매도 압력을 받았습니다. 미국 4대 주요 주가지수는 -3.43%에서 0.10%까지 상승보다 하락폭이 더 컸다. TSMC ADR은 1.67% 하락했고, 대만지수선물도 1% 하락했습니다."},{"s":"홍콩 주식 모닝 포스트 | 엔비디아는 CEO 후계자 소문에 대응하고 연준은 AI 데이터 센터 활용 위험을 상기시킵니다.","so":"财联社","tm":"11/16 09:36","c":1,"r":"cn","u":"https://www.cls.cn/detail/2534866","p":1794789360,"a":1794792439,"t":"港股早报 | 英伟达回应CEO继任者传闻 美联储提示AI数据中心杠杆风险","su":"①엔비디아는 헤드헌팅 에이전시를 선정 중이며 아직 CEO 후보자들과 공식적으로 접촉하지 않았다고 말했습니다. ②연준(미국의 중앙은행)의 블록버스터 보고서: “AI 열풍”이 자산 가치 평가를 높이고 있으며 금융 시스템에 위험을 초래할 수 있습니다. ③테슬라 Cybercab은 개별 구독이 가능하며 가격은 US$30,000입니다. ④마이크로소프트의 글로벌 서비스 장애는 다음날까지 이어졌고, 일부 서비스는 점차 복구됐다. 핫스팟 1. 젠슨 황의 후임자 선정에 대한 소문을 둘러싸고 엔비디아 이사회는 지난 금요일 언론에 대한 답변에서 \"우리는 엔비디아의 CEO 자리에 적합한 헤드헌팅 회사를 선택하는 과정 중입니다. 우리는 아직 잠재적인 후보자와 공식적으로 접촉하지 않았습니다.\"라고 말했습니다. 이전 언론 보도에 따르면 엔비디아 이사회가 Arm CEO Rene 하스에게 연락한 것으로 나타났습니다. 하스는 엔비디아에서 7년 동안 근무했으며 컴퓨팅 제품 부문 부사장을 역임했습니다. 현재 엔비디아는 CFO 콜레트 크레스가 임시 CEO로 이끌고 있습니다."},{"s":"연준의 Schmid : 인플레이션은 여전히 ​​​​너무 높으며 연준는 여전히해야 할 일이 있습니다","so":"Jiemian.com","tm":"11/16 09:12","c":1,"r":"cn","u":"https://www.jiemian.com/article/15334770.html","p":1794787927,"a":1794789702,"t":"美联储施密德：通胀仍过高，美联储还有工作要做","su":"슈미드 캔자스시티 연준(미국의 중앙은행) 총재는 현지 시간으로 일요일 현지 시간으로 연준이 \"과열\" 가격 압력에 대처할 수 있는 정책 도구를 갖고 있으며 조치를 취할 책임도 있다고 말했습니다. 연준은 현재 “인플레이션(물건값이 계속 오르는 것)을 통제하기 위해 아직 해야 할 일이 남아 있습니다.” 슈미드는 인플레이션 수준이 \"물가 안정 목표인 2%를 불편할 정도로 높게 유지하고 있으며 잘못된 방향으로 움직이고 있다\"고 말했다. 현재 인플레이션의 성격과 이를 통제하는 연준의 능력에 관해 최근 형성된 지배적인 견해 중 일부는 현실과 일치하지 않습니다. (신화금융)"},{"s":"연준은 정말로 지속적으로 금리를 인상할 것인가? 월스트리트는 오늘밤 워시 연설에 집중합니다!","so":"财联社","tm":"11/16 09:11","c":1,"r":"cn","u":"https://www.cls.cn/detail/2534854","p":1794787860,"a":1794792441,"t":"美联储真会连续加息吗？华尔街聚焦今晚沃什讲话！","su":"① 다음 주에 발표되는 주요 미국 경제 데이터가 거의 없기 때문에 투자자들의 관심은 전적으로 후속 관리들의 성명에 쏠릴 것입니다. ② 케빈 워시 연준 의장, 존 윌리엄스 뉴욕 연은 총재, 닐 카슈카리 미니애폴리스 연은 총재의 연설이 모두 큰 관심을 끌었습니다. 차이롄서, 11월 16일(Editor Xiaoxiang) 비참한 한 주를 보낸 후 월스트리트 채권 거래자들은 향후 금리 경로에 대한 단서를 찾기 위해 연준의 집중적인 공식 연설과 최근 회의록에 관심을 돌리고 있습니다. 앞서 시장에서는 이번 금리 인상이 장기화될 것이라는 기대감이 크게 높아졌다. 지난 주, 많은 연준 관리들의 강경한 매파주의와 결합된 놀라운 인플레이션(물건값이 계속 오르는 것) 데이터는 이전에 미국 부채를 AI 위험을 피하기 위한 \"안전한 피난처\"로 보았던 투자자들에게 심각한 피해를 입혔습니다. 이에 따라 미국 2년만기 국채수익률은 일주일 만에 무려 0.37%포인트(퍼센트끼리 뺀 차이)나 급등했고, 벤치마크인 10년만기 미국 국채수익률도 5%대로 복귀했다."},{"s":"젠슨 황 사퇴로 월스트리트 '집단적 체면 변화'. 이번 주 엔비디아의 실적 보고서가 압박을 견딜 수 있을까요?","so":"财联社","tm":"11/16 09:11","c":1,"r":"cn","u":"https://www.cls.cn/detail/2534856","p":1794787860,"a":1794792442,"t":"华尔街因黄仁勋离职“集体变脸”，本周英伟达财报能否顶住压力？","su":"① 젠슨 황이 CEO직을 사임하면서 최소 10명의 월스트리트 최고 분석가들이 엔비디아 주식의 '매수' 등급을 '보유'로 하향 조정했습니다. ② 엔비디아는 현지 시간으로 다음 주 화요일 시장이 개장한 후 2027회계연도 3분기 실적(회사가 번 돈 성적표)을 발표할 예정입니다. 차이롄서, 11월 16일(황준지 편집장) 최근 글로벌 칩 리더 엔비디아의 주가는 '젠슨 황 스캔들'로 인해 계속 압박을 받고 있다. 젠슨 황이 CEO직을 사임하면서 엔비디아 주식에 대한 월스트리트 분석가들의 견해가 바뀌었습니다. 통계에 따르면 시장이 이 극적인 사건을 소화함에 따라 최소 10명의 월스트리트 최고 분석가들이 엔비디아 주식의 '매수' 등급을 '보유'로 하향 조정했습니다. 골드만삭스, JP모건, RBC 및 기타 여러 기관이 목표주가(전문가가 예상한 앞날의 주가)를 낮췄습니다."},{"s":"현재 미국 증시: S&P500, 나스닥, 다우 Jones, Russell 2000을 결정하는 요인; 엔비디아, 기타 W","so":"The Economic Times","tm":"11/16 09:05","c":1,"r":"us","u":"https://m.economictimes.com/news/international/us/us-stock-market-today-factors-that-will-dictate-sp-500-nasdaq-dow-jones-russell-2000-nvidia-other-wall-street-ai-stocks-under-scanner/articleshow/135868576.cms","p":1794787528,"a":1794789700,"t":"US Stock Market today: Factors that will dictate S&P 500, Nasdaq, Dow Jones, Russell 2000; Nvidia, other W","su":"S&P500(미국 큰 회사 500곳 지수), 나스닥(미국 기술 회사들이 많은 주식시장), 다우존스 투자자들은 화요일 실적 발표를 발표할 예정인 엔비디아에 모든 시선이 쏠릴 것이기 때문에 월요일부터 긍정적인 출발을 보일 것입니다."},{"s":"지난 금요일 밤 미국 주요 주식의 성과를 살펴보세요","so":"etnet 經濟通","tm":"11/16 08:56","c":1,"r":"hk","u":"https://www.etnet.com.hk/www/tc/news/news-article.php?section=categorized&category=latest&newsid=2026111631","p":1794786960,"a":1794789708,"t":"主要美股上周五晚表現一覽","su":"2026-11-16 07:56 지난 금요일 밤 미국 주요 주식의 성과 개요 요약 면책조항 이 내용은 기존 시장 데이터 및 뉴스 소스를 기반으로 인공지능에 의해 생성되었으며 참고용입니다. 본 내용은 \"이코노믹스\"의 견해나 입장을 대변하지 않으며, 어떠한 투자조언도 구성하지 않습니다. AI가 생성한 정보에는 오류, 누락, 일탈 등이 있을 수 있으므로, 투자 결정을 내리기 전에 사용자가 직접 해당 내용을 확인하거나 전문가의 조언을 구해야 합니다. \"이코노믹스\"는 본 내용을 신뢰하여 발생하는 어떠한 손실이나 손해에 대해서도 책임을 지지 않습니다. ▷ 지난 금요일 미국 주식 종가와 증감자료가 공개되었습니다 ▷ 홍콩달러에 대한 미국달러 환율(다른 나라 돈과 바꾸는 비율)은 7.8455 였습니다"},{"s":"\"National Finance Headlines\" 미국 3대 주가지수가 지난주 상승세를 기록했습니다. 젠슨 황 사건으로 인해 엔비디아는 일주일 동안 13% 급락했으며 시가총액은 일주일 만에 5,700억 달러 이상 증발했습니다.","so":"etnet 經濟通","tm":"11/16 08:55","c":1,"r":"hk","u":"https://www.etnet.com.hk/www/tc/news/news-article.php?section=categorized&category=daily&newsid=2026111610","p":1794786900,"a":1794789710,"t":"《國金頭條》美股三大指數上周錄升幅，黃仁勳事件令英偉達全周大跌13%，一周市值蒸發逾5700億美元","su":"2026/11/16 07:55 \"National Finance Headlines\" 미국 3대 주가지수가 지난주 상승세를 기록했습니다. 젠슨 황 사건으로 인해 엔비디아는 일주일 동안 13% 급락했으며 시가총액(회사 전체 몸값)은 일주일 만에 5,700억 달러 이상 증발했습니다. 요약 면책 조항 이 콘텐츠는 기존 시장 데이터 및 뉴스 소스를 기반으로 인공 지능에 의해 생성되었으며 참고용으로만 사용됩니다. 본 내용은 \"이코노믹스\"의 견해나 입장을 대변하지 않으며, 어떠한 투자조언도 구성하지 않습니다. AI가 생성한 정보에는 오류, 누락, 일탈 등이 있을 수 있으므로, 투자 결정을 내리기 전에 사용자가 직접 해당 내용을 확인하거나 전문가의 조언을 구해야 합니다. \"이코노믹스\"는 본 내용을 신뢰하여 발생하는 어떠한 손실이나 손해에 대해서도 책임을 지지 않습니다. ▷ 미국 3대 주가지수는 모두 일주일 내내 상승세를 기록했습니다. ▷ 엔비디아 주가는 일주일 내내 13% 하락했고, 시가총액은 5,700억 달러 이상 증발했습니다. ▷ 미국 달러는 한때 엔화 대비 160을 돌파했습니다. 다우지수는 50.46포인트(0.1%) 소폭 상승한 52347.55포인트로 마감했습니다. S&P500(미국 큰 회사 500곳 지수)은 30.73포인트, 즉 0.4% 하락한 7561.67포인트를 기록했습니다. 나스닥은 229.82포인트(0.91%) 하락한 25136.27포인트에 거래됐다."},{"s":"KB운용, 'RISE 미국S&P500·나스닥100' 매수 인증 이벤트","so":"아시아경제","tm":"11/16 08:49","c":1,"r":"kr","u":"https://core.asiae.co.kr/article/2026111608494917408","p":1794786540,"a":1794789699,"su":"KB자산운용은 미국 대표지수 상장지수펀드(ETF(여러 주식을 묶어 파는 상품))인 'RISE 미국S&amp;P500'과 'RISE 미국나스닥(미국 기술 회사들이 많은 주식시장)100'을 대상으로 매수 인증 이벤트를 진행한다고 16일 밝혔다. 이번 이벤트는 17일부터 다음 달 31일까지 진행된다. 자녀 계좌 개설과 증여, 연금계좌 납입이 집중되는 연말을 맞아 미국 대표지수 ETF를 활용한 세대별 장기투자를 제안하기 위해 마련됐다. 단기적인 시장 흐름에 일희일비하기보다 장기적인 관점에서 투자 원칙을 세우고 꾸준히 실천하는 투자 문화를 확산한다는 취지다. 이벤트 기간 중 대상 ETF를 1주 이상 매수"},{"s":"올해 미국 주식에 크리스마스 시장이 열릴까? 골드만삭스는 인플레이션이 아직 가라앉지 않았으며 내년 1월부터 가격 재설정이 시작될 수 있다고 경고했다.","so":"鉅亨網","tm":"11/16 08:42","c":1,"r":"tw","u":"https://news.cnyes.com/news/id/6662478","p":1794786179,"a":1794789707,"t":"美股今年還有聖誕行情嗎？高盛警告通膨未退、明年1月恐掀價格重訂潮","su":"골드만삭스, 모건스탠리, JP모건 등은 디레버리징, 밸류에이션 하락, 계절적 상승 등이 도움이 될 것으로 믿으며 연말 미국 증시의 반등을 낙관하고 있다.\n골드만삭스는 AI 주식이 15년 만에 가장 긴 부채 축소를 겪었다고 지적했다. MSCI 글로벌 지수의 선도 주가수익비율은 15.6배로 떨어졌고, S&P500(미국 큰 회사 500곳 지수)은 약 17.9배로 떨어졌다.\n그러나 글로벌 상류 인플레이션(물건값이 계속 오르는 것)이 가열되고 있어 수입 가격이 연평균 약 24%에 이르고, 내년 1분기에는 그 비용이 소비자에게 전가될 수도 있다."},{"s":"이번 주 시장이 열리기 전에 알아야 할 5가지 국제 사항 | 미국 증시 동향 | 국제적인","so":"經濟日報","tm":"11/16 08:22","c":1,"r":"hk","u":"https://money.udn.com/money/story/123398/9880789?from=edn_related_storybottom","p":1794784923,"a":1794789712,"t":"本周開盤前 五件國際事不可不知 | 美股動態 | 國際","su":"금요일 미국 증시는 필라델피아 반도체(전자기기의 두뇌 부품) 지수가 3.4% 급락하면서 하락세로 마감했는데, 이는 엔비디아 CEO 젠슨 황의 해임이 동료들에게 영향을 미쳤음을 반영합니다. 오늘 아시아 주식이 개장했으며 반도체주에 대한 매도 압력에 주목해야 합니다."},{"s":"MPF 관리丨미국 주식 매수의 지름길: MPF 미국 주식 펀드 챔피언 보유 노출 | 홍콩경제신문","so":"香港經濟日報HKET","tm":"11/16 08:10","c 전 계획' 발표 ② A주 자사주 재매입 물결이 오고 있다 ③ 미국 광통신주 폭락과 스토리지주 엇갈림 ④ 한국이 반도체(전자기기의 두뇌 부품) 소재·부품·장비 분야 투자에 집중해 35억 달러 이상의 펀드를 조성할 예정 ⑤ 스토리지 선두주자의 상반기 순이익(모든 비용을 빼고 남은 돈)이 100억 달러를 넘어섰다. 매크로 뉴스 1. 국가발전개혁위원회와 국가에너지국은 '석탄산업 발전을 위한 15차 5개년 계획'을 발표했습니다. 2030년까지 석탄 순익 보장 능력을 더욱 강화하고 생산 및 개발 레이아웃을 지속적으로 최적화하며 고품질 선진 생산 능력 비율을 더욱 높이고 생산, 공급, 저장 및 마케팅 시스템을 더욱 완벽하게 하고 전국 대규모 현대 탄광 생산 능력 비율을 87%로 늘릴 것이라고 지적했습니다. 2. 중앙은행은 최근 '중국인민은행의 '15차 5개년 계획' 개혁 발전 계획'을 발표하고 관련 부문에서 9개 행동 계획을 수립, 발표했다. 과학적이고 건전한 통화정책체계와 종합적인 거시건전성 관리체계를 구축해야 한다고 언급했습니다. 실물 경제에 대한 금융 서비스의 품질과 효율성을 지속적으로 향상합니다. 개방적이고 포용적이며 역동적이고 탄력적인 현대 금융시장을 지속적으로 구축합니다. 외부 세계에 대한 높은 수준의 금융 개방을 꾸준히 추진합니다. 금융 인프라와 중앙은행 서비스 시스템을 최적화합니다."},{"s":"위기에 빠져도 엔비디아는 역시 사다 Even in Crisis, 엔비디아 Stock Is Still a Buy | 【WEEKLY】2026년 11월 15일호","so":"バロンズ・ダイジェスト","tm":"11/15 10:06","c":1,"r":"jp","u":"https://barrons.jiji.com/article/9088","p":1794704780,"a":1794784811,"t":"危機に陥っても、エヌビディアはやはり買い Even in Crisis, Nvidia Stock Is Still a Buy｜【WEEKLY】2026年11月15日号","su":"나쁜 소식이 나오고 조사가 모두 끝나고 새로운 리더가 선정된 새벽에는 엔비디아 <NVDA>는 반도체(전자기기의 두뇌 부품) 제조로 돌아갈 것이다. 지난주도 그랬지만, 세계는 엔비디아의 반도체를 필요로 할 것이다. 엔비디아가 세계의 톱에 올라간 이유의 대부분은 카리스마적인 창업자인 젠슨 황씨에 의한 것이다. 후안씨가 생성 인공지능(AI)의 경이적인 대두에 큰 영향을 준 것에 이의를 제기할 자는 없다. 대규모 언어 모델(LLM)은 컴퓨팅…"}]},{"name":"🧬 나스닥 바이오","note":"보유: TIGER 미국나스닥바이오","breaking":false,"items":[{"s":"새로운 최고 기록 달성, 51종의 1급 신약이 새 버전의 국민의료보험 의약품 목록에 등재되었습니다.","so":"第一财经","tm":"11/14 11:50","c":5,"r":"cn","u":"https://www.yicai.com/news/103440686.html","p":1794624638,"a":1794628689,"t":"再创新高，51个一类新药进入新版国家医保药品目录","su":"국민의료보험청과 인사사회보장부는 오늘(14일) '국민기본의료보험·모성보험·산재보험 의약품 카탈로그'와 '상업건강보험 혁신 의약품 카탈로그'(2026)를 공개했다. 국민의료보험청 출범 이후 국민기본의료보험 약품목록의 9번째 조정이다. 이번 조정에는 총 107개 신약이 추가됐으며, 이 중 카테고리 1 혁신신약(세상에 처음 나온 새로운 약)은 51개로 역대 최고치를 경신했다. 이번 국가 기본의료보험 의약품 목록이 조정되어 신품종은 종양, 희귀질환, 만성질환, 정신질환 등 긴급하게 필요한 임상 치료 분야를 포괄합니다. 동시에 임상적 가치가 제한적이거나 더 나은 대안이 있거나 지침에 대한 정보가 누락되어 사용할 수 없는 34개 의약품이 목록에서 삭제되었습니다. 포괄적인 이전, 이전 및 제형 병합을 거쳐 2026년판 국민기본의료보험 의약품 목록의 총 의약품 수는 3,331개에 달합니다."},{"s":"[시판 전 팁: 새로운 의료보험 카탈로그! 혁신신약 'C-포지션' 공개 새로운 에너지 저장 블록버스터 계획 발표; 광칩 리더, 대규모 주문 수주","so":"第一财经","tm":"11/16 08:16","c":4,"r":"cn","u":"https://www.yicai.com/vip/news/103441088.html","p":1794784610,"a":1794784823,"t":"[ 盘前点金 医保目录上新！创新药“C位”亮相；新型储能重磅方案发布；光芯片龙头拿下大单","su":"[오늘의 상식] ① 2026년 의료보험 카탈로그가 출시되었습니다! 51개 카테고리 1 혁신신약(세상에 처음 나온 새로운 약)이 포함돼 CAR-T가 최초로 의료보험에 진입한다(아래첨부). ② 인산염의 새로운 에너지 저장 여정: 인산철리튬에 대한 수요가 급증하고 있으며, 주요 제조업체의 이익이 향상될 것으로 예상됩니다(주제 첨부). ③ 중국 증권감독관리위원회 위원장 우칭(Wu Qing)이 최근 성명을 발표했는데, 이는 2억 명이 넘는 주식 투자자들에게 영향을 미칩니다. ④ 본 회사는 3억 6백만 위안의 자산을 인수하고 \"광학 저장 및 컴퓨팅\" 테스트를 늘릴 계획입니다. ⑤ 소속사가 지적한"},{"s":"12가지 새로운 유형의 약물이 추가되어 2026년 상업 건강 보험 혁신 약물 카탈로그에 총 28가지 유형이 추가되었습니다.","so":"Jiemian.com","tm":"11/14 11:43","c":4,"r":"cn","u":"https://www.jiemian.com/article/15333030.html","p":1794624194,"a":1794628691,"t":"新增12种药品，2026年商业健康保险创新药品目录共有28种","su":"국민의료보험청 관계자는 11월 14일 2026년 시행 예정인 상업건강보험 혁신의약품 목록 조정에 12개 신약이 추가된다고 밝혔다. 상업 건강 보험 혁신 약물 카탈로그의 새 버전에는 세계 최초의 고형 종양 CAR-T, 중국 최초의 혈우병 유전자 치료 약물 및 기타 주요 혁신 약물이 포함됩니다. 이와 동시에 상업 보험 혁신 의약품 목록과 기본 의료 보험 목록 간의 연계 메커니즘을 구축했으며 2025년 상업 보험 혁신 의약품 2종을 의료 보험 목록에 포함했습니다. 조정을 거쳐 2026년 상업건강보험에는 총 28종의 혁신의약품이 포함될 예정이다."},{"s":"상업보험 혁신의약품 카탈로그에 12개 신약 신규 추가, 가격협상 성공률 100%","so":"经济观察网","tm":"11/14 13:39","c":3,"r":"cn","u":"http://www.eeo.com.cn/2026/1114/1092864.shtml","p":1794631140,"a":1794642669,"t":"12款药新入商保创新药目录，价格协商成功率100%","su":"경제 관찰자 팔로우 2026-11-14 12:39 경제 관찰자 기자 Liu Xiaonuo 11월 14일, 2026년 국가 의료 보험 약품 목록과 상업 보험 혁신 약품 목록이 소주에서 발표되었습니다. 국민의료보험청 약품서비스관리국 황신위 국장은 현장에서 11개 기업의 12개 혁신의약품이 상업적으로 보장되는 혁신의약품 목록에 포함됐다고 발표했다. 2026년 9월 경제옵저버는 상업보험 혁신의약품 카탈로그 현장에서 이번에 가격협상에 총 11개사, 12개 의약품이 참여했다는 사실을 알게 됐다. 이는 상업적으로 보장되는 혁신적인 의약품 카탈로그의 가격 협상에 참여하는 모든 의약품이 카탈로그에 성공적으로 포함되었음을 나타냅니다. 2025년에 국민의료보험청은 처음으로 상업적으로 보장되는 혁신의약품 목록에 대한 가격 협상을 시작했습니다. 정식심사를 통과한 의약품은 총 121개이며, 특별협상에는 24개 의약품이 참여했다. 결국 19개 의약품이 성공적으로 협상돼 약 80%의 성공률을 보였다(1개 의약품은 이후 시장에서 퇴출됐다). 2026년에는 신청 건수가 감소할 예정이다. 총 62개 의약품이 상업 보험 혁신 의약품 목록에 제출되었으며, 그 중 58개가 정식 검토를 통과했다. 하지만 결국 협상 성공률은 100%로 높아졌다."},{"s":"시장은 2,600포인트 넘게 폭락했지만 이 생명공학 주식은 추세를 거스르고 상한가를 뛰어올랐습니다 | 업계 핫스팟 | 산업","so":"經濟日報","tm":"11/16 17:05","c":2,"r":"tw","u":"https://money.udn.com/money/story/5612/9881979?from=edn_newest_index","p":1794816321,"a":1794830407,"t":"大盤崩超過2,600點 這檔生技股卻逆勢跳空漲停 | 產業熱點 | 產業","su":"엔비디아 젠슨 황 전 CEO의 사임이 미국 정계와 재계의 갈등으로 확대됐다. 대만증시는 16일 2,635.04포인트 급락해 6.03% 하락한 41,040.08포인트로 저점을 마감했다. 그러나 생명공학 주식인 Haoding(4174)은 추세를 거스르고 한도를 뛰어올라 지난 2년 만에 최고치인 NT$71.3으로 마감했습니다."},{"s":"보령·셀트리온제약, 年 처방액 517억 당뇨병 치료제 공동판매 - 머니투데이","so":"머니투데이","tm":"11/16 15:48","c":2,"r":"kr","u":"https://www.mt.co.kr/thebio/2026/11/16/2026111615403821339","p":1794811712,"a":1794812192,"su":"보령과 셀트리온제약이 지난해 국내 처방액 517억원을 기록한 당뇨병 치료제 6종의 공동판매에 나선다. 내년 1월 출범하는 보령의 영업·마케팅 전문 자회사 보령파마솔루션은 기존 당뇨병 치료제에 오리지널 의약품을 추가하며 제품군을 확대하게 됐다."},{"s":"특이한 주식丨강팡바이오로직스가 20% 넘게 투자했는데, 미국과 제휴한 항암제가 FDA 승인을 받지 못했다.","so":"信報網站","tm":"11/16 10:52","c":2,"r":"hk","u":"https://m.hkej.com/landing/mobarticle2/id/4565963/%E7%95%B0%E5%8B%95%E8%82%A1%E4%B8%A8%E5%BA%B7%E6%96%B9%E7%94%9F%E7%89%A9%E6%8F%92%E9%80%BE%E5%85%A9%E6%88%90%20%E8%88%87%E7%BE%8E%E5%90%88%E4%BD%9C%E5%A4%A5%E4%BC%B4%E6%8A%97%E7%99%8C%E8%97%A5%E6%9C%AA%E7%8D%B2FDA%E6%89%B9%E5%87%86","p":1794793934,"a":1794794329,"t":"異動股丨康方生物插逾兩成 與美合作夥伴抗癌藥未獲FDA批准","su":"강팡바이오로직스(09926)와 미국 파트너의 항암제인 FDA가 승인을 거부했다. 주가는 일시적으로 31.8%나 하락해 최저치인 56.1위안까지 떨어졌다. 오전 9시 46분 현재 24.2% 하락한 62.35위안에 거래되고 있으며 거래액은 15억 2천만 위안 이상이다. 강팡바이오로직스(Kangfang Biologics)의 전략적 파트너인 미국 제약회사 서밋 테라퓨틱스(Summit Therapeutics)는 미국 식품의약국(FDA)이 폐암치료제 출시 신청을 거부했다고 밝혔다. Kangfang Biologics는 중국 내 ivonescimab 약물의 최초 개발 및 유통업체입니다."},{"s":"혁신의약품에 대한 지불 병목 현상이 완화되었습니다. Southern Fund의 자회사인 Southbound Innovative Drug ETF Southern(159297)은 하루 거래액이 약 1억 2400만 위안에 달하는 활발히 거래되고 있습니다.","so":"Jiemian.com","tm":"11/16 10:50","c":2,"r":"cn","u":"https://www.jiemian.com/article/15335093.html","p":1794793849,"a":1794795137,"t":"创新药支付瓶颈松动，南方基金旗下港股通创新药ETF南方(159297)交投活跃，单日成交额约1.24亿元","su":"11월 13일 홍콩 주식은 전반적인 조정을 겪었고 이후 혁신 의약품 부문은 약세(내리는 흐름)를 보였습니다. National Securities Hong Kong Stock Connect Innovative Drug Index(987018)는 2.60% 하락한 1717.41포인트로 마감했습니다. Southbound Innovative Drug ETF(여러 주식을 묶어 파는 상품) South(159297)가 그 뒤를 따르고 있으며 거래량은 약 1억 2400만 위안, 회전율은 5.74%입니다."},{"s":"CITIC 증권: 국가 의료 보험 협상은 계속해서 혁신적인 의약품을 지원하고 2027년 상업화 성장에 초점을 맞추고 있습니다.","so":"第一财经","tm":"11/16 09:12","c":2,"r":"cn","u":"https://www.yicai.com/news/103441152.html","p":1794787939,"a":1794794328,"t":"中信证券：国家医保谈判持续支持创新药 关注2027年商业化增量","su":"제일재경 2026-11-16 08:08:38 편집자: Tang Yanbei CITIC 증권 연구 보고서에 따르면 국가 의료 보험 협상은 혁신의 정책 방향을 지속적으로 지원하고 새로운 품종, 확장된 적응증 및 병원 지불 패키지를 포함하여 2027년 상업적 성장을 공동으로 촉진할 것이라고 밝혔습니다. 2026년 11월 14일에 발표된 새 카탈로그 버전에는 카테고리 1 혁신 51개를 포함하여 107개의 신약이 추가되었습니다. 의약품의 수가 사상 최고치를 경신했고, 처음으로 기본의료보험에 CAR-T가 포함됐다. 이러한 조정은 사전 신고 및 상업 보험에서 기본 의료 보험으로의 전환을 개선하고, 장기 갱신 규칙을 더욱 명확하게 하며, 병원에 의약품 도입 및 \"이중 채널\" 공급을 촉진합니다."},{"s":"상위 8개 생명공학주, 첫 3분기에 엄청난 이익 기록 - 파이낸셜 뉴스 - 산업 및 상업 타임스","so":"中時新聞網","tm":"11/16 05:10","c":2,"r":"tw","u":"https://www.chinatimes.com/newspapers/20261116000239-260202","p":1794773400,"a":1794784830,"t":"生技股8強前三季獲利噴發- 財經要聞- 工商時報","su":"생명공학 주식은 첫 3분기 동안 엄청난 수익을 냈으며 총 8개 회사가 1주 이상의 자본을 보유했습니다. 그러나 주당순이익(주식 한 주가 번 돈) 순위는 대대적인 개편을 겪었다. 징숴(Jingshuo)가 20.09대만달러로 1위를 차지했고, 야오화제약(Yaohua Pharmaceutical)이 18.43대만달러, 타이보(Taibo)가 18.06대만달러로 뒤를 이었다. BenQ Medical은 16.65대만달러로 처음으로 1위 그룹에 진입했습니다. Bao Rui는 톱 10에 진입했고 Lamex는 예상치 못하게 하락했습니다."},{"s":"BenQ Medical, 생명공학 부문 1분기 이익 제왕을 차지, 3분기 세후 주당순이익이 15.05위안으로 급증","so":"中時新聞網","tm":"11/16 05:10","c":2,"r":"tw","u":"https://www.chinatimes.com/newspapers/20261116000242-260202","p":1794773400,"a":1794784834,"t":"明基醫 奪生技單季獲利王寶座 Q3每股稅後純益飆至15.05元","su":"3분기 생명공학주 이익순위가 개편됐다. BenQ Medical은 자산 매각 및 비산업 이익 인식으로 이익을 얻었으며, 단일 분기 세후 주당순이익(주식 한 주가 번 돈)이 15.05위안으로 치솟았습니다. 뜻밖의 징숴(Jingshuo)와 야오화제약(Yaohua Pharmaceutical)을 물리치고 다크호스로서 1분기 실적(회사가 번 돈 성적표) 왕좌를 차지했다. Baorui 및 Lai Fung-KY 운영은 사탕수수를 먹고 있으며 단일 분기의 주당 수익이 상위 10위 안에 들었습니다."},{"s":"상용보험 혁신신약부터 국가협상의약품까지, 밀리언급 CAR-T가 최초로 기본의료보험에 진입","so":"第一财经","tm":"11/14 15:06","c":2,"r":"cn","u":"https://www.yicai.com/news/103440735.html","p":1794636362,"a":1794642666,"t":"从商保创新药变为国谈药，百万级CAR-T首次进入基本医保","su":"\"National Talk\" 듀얼 카탈로그의 새 버전이 오늘 공식적으로 출시되었습니다. 국내 혁신신약(세상에 처음 나온 새로운 약) 2종은 상용보험 혁신의약품 목록에 선정된 지 1년 만에 국가기본의료보험 목록에 성공적으로 편입됐다. '초고가 항암제'로 알려진 CAR-T 제품이 기본의료보험에 들어간 것도 이번이 처음이다. 14일, 쑤저우에서는 2026년 국민의료보험 약품 목록과 상업건강보험 혁신 약품 목록이 발표됐다. 국민의료보험 의약품목록 새 버전에는 1급 신약 51종을 포함해 107종의 신약이 추가돼 최고 기록을 경신했다. 상업 건강 보험 혁신 의약품 카탈로그에는 12개의 신약이 있습니다. 조정 후 2026년 상업 건강보험 혁신의약품 카탈로그에는 총 28종의 품목이 포함될 예정이다."},{"s":"엘리 릴리(일라이릴리): 종양학 분야의 혁신적 약물 3개에 대한 새로운 적응증이 국가 의료보험 카탈로그에 포함되었습니다.","so":"Jiemian.com","tm":"11/14 12:56","c":2,"r":"cn","u":"https://www.jiemian.com/article/15333120.html","p":1794628575,"a":1794628688,"t":"礼来：三款肿瘤领域创新药物新增适应症纳入国家医保目录","su":"11월 14일, 일라이릴리는 Jepali®(피투브루티닙 정제), Tyvyt®(신틸리맙 주사제) 및 Aiute®(프루퀸티닙 캡슐)를 포함하여 종양학 분야의 세 가지 혁신 약물의 새로운 적응증이 국민 기본 의료 보험, 산재 보험 및 산모 보험 의약품 카탈로그(2026) 새 버전에 성공적으로 포함되었다고 발표했습니다. 국민의료보험목록 새 버전이 2027년 1월 1일 정식 시행됩니다."},{"s":"하오딩 신약, 노바티스 승인 및 계약금 9억 8천만 지급","so":"UDN","tm":"11/14 03:09","c":2,"r":"tw","u":"https://udn.com/news/story/7241/9877816","p":1794593352,"a":1794610375,"t":"浩鼎新藥授權諾華 9.8億簽約金入袋","su":"룬타이그룹 산하 생명공학신약기업 하오딩(Haoding)이 대형 다국적 제약회사 노바티스와 협력 및 라이선스 계약을 체결했다고 어제(13일) 밝혔다. 하이딩의 다중 독점 항체-약물 접합체(ADC) 플랫폼 기술을 사용해 신약 페이로드를 탑재한 차세대 ADC 약물을 공동 개발할 예정이다."},{"s":"Yuandong Biotechnology: 대상포진후 신경통 적응증에 대한 EP-0226 정제의 2상/3상 임상 시험에서 첫 번째 대상자가 투여되었습니다.","so":"Jiemian.com","tm":"11/16 22:15","c":1,"r":"cn","u":"https://www.jiemian.com/article/15338582.html","p":1794834922,"a":1794838048,"t":"苑东生物：EP-0226片带状疱疹后神经痛适应症II/III期临床试验完成首例受试者给药","su":"Yuandong Bio는 Shanghai Institute of Materia Medica, 중국과학원, Zhongshan Institute of Drug Innovation이 공동 개발한 1급 화학 혁신 약물인 EP-0226 정제가 현재 중국 대상포진 후 신경통 환자를 대상으로 다기관, 무작위 배정, 이중 맹검, 이중 더미, 위약 및 프레가발린 캡슐 대조 2/3상 임상 시험을 진행하고 있다고 밝혔습니다. 최근 첫 번째 주제가 관리되었습니다."},{"s":"Biocon, Perjeta®의 바이오시밀러인 Pebrilzo™(pertuzumab-qcay) 주사제에 대해 미국 FDA 승인을 획득하여 종양학 포트폴리오 확장 – 회사 발표 - FT.com","so":"Financial Times","tm":"11/16 22:10","c":1,"r":"world","u":"https://markets.ft.com/data/announce/detail?dockey=600-202611160810BIZWIRE_USPRX____20261116_BW435734-1","p":1794834600,"a":1794838049,"t":"Biocon Gets U.S. FDA Approval for Pebrilzo™ (pertuzumab-qcay) Injection, a Biosimilar to Perjeta®, Expanding Its Oncology Portfolio – Company Announcement - FT.com"},{"s":"영국 제약회사, 미국 내 에스트로겐 패치 공급 확대 논의 중","so":"Bloomberg.com","tm":"11/16 21:45","c":1,"r":"us","u":"https://www.bloomberg.com/news/articles/2026-11-16/uk-drugmaker-in-talks-to-boost-estrogen-patch-supply-in-us","p":1794833100,"a":1794834714,"t":"UK Drugmaker in Talks to Boost Estrogen Patch Supply in US"},{"s":"선두 혁신의약품은 22% 급락했다. 집중적으로 투자한 펀드의 '트라우마'는 얼마나 깊을까?","so":"21财经","tm":"11/16 20:44","c":1,"r":"cn","u":"https://www.21jingji.com/article/20261116/herald/c3d9441060a75d7b5315fbd9fe05c6a2.html","p":1794829440,"a":1794830397,"t":"创新药龙头大跌22%，重仓基金“创伤”多深？","su":"파이낸셜뉴스, 11월 16일 (천용휘 기자) 지난 11월 16일, 미국 FDA의 회신서한으로 홍콩 제약업계가 소용돌이에 휘말렸다. Kangfang Biology(09926.HK)는 이날 약 32% 하락하여 개장하여 2025년 2월 이후 최저치인 HK$56.1에 도달했습니다. 22% 하락했으며 시가총액(회사 전체 몸값)은 HK$603억으로 줄었습니다. 같은 기간 항셍생명공학지수는 2.21% 하락했다. 방아쇠는 지난 주말에 왔습니다. Kangfang의 해외 파트너인 Summit은 백금 함유 화학요법과 결합된 evocilimab(AK112, PD-1/VEGF 이중 항체)의 시판 신청에 대한 미국 FDA로부터 완전한 응답 편지(CRL)를 받았다고 11월 15일 발표했습니다. 해당 신청은 승인되지 않았으며, 타깃 적응증은 EGFR-TKI 치료 이후 진행된 비편평 비소세포폐암이다."},{"s":"혁신신약의 '중국 속도': 승인부터 의료보험 포함까지 1년 미만","so":"中国新闻网","tm":"11/16 18:41","c":1,"r":"cn","u":"https://www.chinanews.com.cn/cj/2026/11-16/10732912.shtml","p":1794822071,"a":1794830400,"t":"创新药的“中国速度”：从获批到纳入医保不到一年","su":"혁신신약(세상에 처음 나온 새로운 약) '차이나 스피드' 허가부터 의료보험 편입까지 1년 이내 혁신신약 '중국 스피드' 허가부터 의료보험 편입까지 1년 이내 환자들이 '건선' 퇴치를 돕는 국산의약품 기자 | 진제 \"제가 건선 환자인 걸 깜빡할 뻔했어요. 이제 몸에 피부병변도 없어요.\" 11월 13일, 왕루광은 '매일경제뉴스' 기자(이하 '미징기자')에게 담담하게 말했다. 마치 다른 사람의 이야기를 하는 것 같았습니다. 오직 그만이 이 문장의 무게를 알고 있었습니다. 왕루광 씨는 30년 넘게 건선을 앓고 있으며 현재 건선 환자 커뮤니티를 운영하고 있다. 건선은 치료할 수 없습니다. 중국에는 그와 같은 건선 환자가 845만명에 이른다. 11월 14일, 국내 최초로 생산된 IL-23p19 단클론 이어들의 선호를 받아 국제 라이선스, 임상 진행 및 신약 상용화를 통해 시장 초점이 AI에서 생명공학 기업으로 이동하고 있음을 부각시켰습니다.美 중간선거 민주당 압승, 트럼프…"},{"s":"미국 FDA가 항암제 바이오시밀러를 승인한 후 바이오콘 주가 상승","so":"CNBC TV18","tm":"11/16 14:23","c":1,"r":"sg","u":"https://www.cnbctv18.com/market/biocon-share-price-usfda-approval-pebrilzo-fifth-oncology-biosimilar-her2-positive-breast-cancer-drug-20034624.htm","p":1794806592,"a":1794807039,"t":"Biocon shares gain after US FDA approves cancer drug biosimilar","su":"Biocon 주가는 HER2 양성 유방암 치료를 확대하는 다섯 번째 종양학 바이오시밀러인 Pebrilzo에 대한 미국 FDA 승인을 획득한 후 주목을 받았습니다."},{"s":"로슈의 가지바/가지바로(Gazyva/Gazyvaro)가 원발성 막성 신병증에 대한 최초의 FDA 승인 치료제가 되었습니다.","so":"Financial Times","tm":"11/16 14:00","c":1,"r":"world","u":"https://markets.ft.com/data/announce/detail?dockey=1330-1001303720en-7E5IHST4P922M2E2PSATRO9GMM","p":1794805200,"a":1794812195,"t":"Roche’s Gazyva/Gazyvaro becomes the first FDA-approved treatment for primary membranous nephropathy"},{"s":"혁신 의약품 분야의 변동 및 약화, Tonghua Jinma 제한 다운","so":"Jiemian.com","tm":"11/16 12:01","c":1,"r":"cn","u":"https://m.jiemian.com/article/15335955.html","p":1794798091,"a":1794806422,"t":"创新药板块震荡走弱，通化金马跌停","su":"등록/로그인 개인 센터 홈 세계 중국 매크로 엔터테인먼트 스포츠 패션 문화 여행 생활 게임 비뚤어진 건물 데이터 정오 예술 비즈니스 기술 자동차 부동산 증권 금융 소비 산업 운송 투자 마케팅 직장 관리 기업가 정신 해외 부동산 시장 부 건강 광역 지역 주류 산업 블록체인 ESG 싱크탱크 더 많은 뉴스 인기 기사 비디오 사진 주문 특별 주제 라이브 앱 다운로드 원본 뉴스 혁신적인 의약품 부문이 변동하고 약해지면서 Tonghua Jinma 한도가 감소했습니다. 혁신적인 의약품 분야가 변동하고 약해지면서 Tonghua Jinma의 한계가 낮아졌습니다. Northland는 10% 이상 하락했으며 Sansheng Guojian, Junshi Bio-U, Rongchang Biological, Laimei Pharmaceutical, Guilin Sanjin 등이 그 뒤를 이었습니다."},{"s":"Haisike: 1종 신약 크리가발린 베실레이트 캡슐과 콜라글립틴 정제가 국가 의료 보험 목록에 포함되었습니다.","so":"第一财经","tm":"11/16 11:10","c":1,"r":"cn","u":"https://www.yicai.com/news/103442074.html","p":1794795004,"a":1794830404,"t":"海思科：1类新药苯磺酸克利加巴林胶囊和考格列汀片被纳入国家医保目录","su":"제일재경 2026-11-16 16:07:52 편집자: Yin Qingyan HiSco는 회사의 1급 신약인 크리가발린 베실레이트 캡슐과 콜라글립틴 정제가 \"국가 의료 보험 목록(2026년 판)\"에 포함되었다고 발표했습니다. 크리가발린 베실레이트 캡슐은 성인의 당뇨병성 말초 신경병성 통증 및 대상포진 후 신경통의 치료에 적합합니다. 콜라글립틴 정제는 제2형 당뇨병이 있는 성인의 혈당 조절을 개선하는 데 적합합니다. 한 가지 평가: 의료 보험 카탈로그는 2026년에 조정 및 출시되어 혁신적인 약물 쪽으로 더욱 기울어질 것입니다. 2025년판 상업보험 혁신의약품 카탈로그의 18개 의약품 중 2개가 기본의료보험 카탈로그에 진입해 '상업보험을 통한 혁신의약품 최초 발굴 및 기본의료보험 연계'라는 변혁의 길을 실현하는 데 앞장섰다. 51종의 1급 신약이 국가의료보험 의약품 목록 새 버전에 등재되면서 새로운 최고 기록을 경신했습니다. 의료보험과 상업보험의 '이중 카탈로그' 업데이트 후 6개월 이내에 관련 카테고리 1 신약의 임상약물 가이드라인을 업데이트하도록 권장합니다. 희귀질환 신약의 시장공급이 중단될 경우 국가식품약품감독관리국은 해당 의약품의 시장독점기간을 종료할 수 있다."},{"s":"미 FDA, 중국산 유망 폐암 치료제 '이보네시맙' 승인 거부","so":"매일경제 마켓","tm":"11/16 10:28","c":1,"r":"kr","u":"https://stock.mk.co.kr/news/view/1199355","p":1794792529,"a":1794794327,"su":"미 FDA, 중국산 유망 폐암 치료제 '이보네시맙' 승인 거부 \"환자 수명 연장에 유의미한 효과 없어\" 주종국 입력 : 2026.11.16 10:28:49 I 수정 : 2026.11.16 10:40:38 (서울=연합뉴스) 주종국 기자 = 미국 식품의약국(FDA)이 중국산 유망 폐암 치료제 '이보네시맙(ivonescimab)'의 승인을 거부했다. 15일(현지시간) 뉴욕타임스(NYT)에 따르면 이 신약의 미국 내 판권을 보유한 미국 제약기업 서밋 테라퓨틱스는 FDA가 이보네시맙에 대해 보완요구서한(CRL)을 발행하며 승인을 거부했다고 발표했다."},{"s":"한 가지 평가: 의료 보험 카탈로그는 2026년에 조정 및 출시되어 혁신적인 약물 쪽으로 더욱 기울어질 것입니다.","so":"第一财经","tm":"11/16 10:28","c":1,"r":"cn","u":"https://www.yicai.com/news/103441253.html","p":1794792517,"a":1794792903,"t":"壹评级：2026年医保目录调整发布，进一步向创新药倾斜","su":"국민의료보험청이 2026년 의료보험목록 조정 결과를 발표했는데, 1급 혁신신약(세상에 처음 나온 새로운 약) 51개 품목이 사상 최대치를 기록했다. China Business Network의 \"One Rating\"은 정책 방향이 단순히 연구 개발 장려에서 상업화 지원으로 바뀌었고 임상 가치가 있는 혁신적인 약물이 결정론적인 성장 주기를 가져올 것이라고 믿습니다."},{"s":"9년 동안 14개의 카테고리 1 혁신 약물이 등장했습니다. 광둥성 이 지역은 무엇을 제대로 했나요? | 광둥성의 경제 생태를 해독하다","so":"21财经","tm":"11/16 08:43","c":1,"r":"cn","u":"https://www.21jingji.com/article/20261116/herald/13d02f47a0f5495600207da8c686e65e.html","p":1794786187,"a":1794789721,"t":"九年跑出14个1类创新药，广东这个区做对了什么？| 解码广东经济生态","su":"최근 국가식품의약국은 광저우웨캉바이오제약유한회사에 '약품등록증'을 발급했고, 1급 혁신적 중의약인 자화문비지추과립이 공식적으로 판매 승인을 받았다. 이 신약은 광둥성 중의학병원 루추안젠 교수의 장기간 임상적으로 입증된 경험적 공식을 바탕으로 개발됐다. 6가지 약재로 구성되어 있으며 3~6주간 지속되는 감염후 기침, 풍한폐애증후군에 사용된다. 신약이 임상처방에서 현대중의학으로 발전하기 위해서는 약리연구, 임상시험, 등록심사, 생산검증 등의 과정을 거쳐야 한다. 광저우 황푸구의 경우, 이 등록증은 또 다른 무게감을 갖고 있습니다. 이는 올해 황푸가 승인한 두 번째 카테고리 1 혁신 약물이다. 2018년부터 황푸는 총 14개의 카테고리 1 혁신 의약품에 대해 승인을 받았으며 이는 광저우시 전체의 93.3%, 광둥성 전체의 43.8%를 차지한다. 6년 연속 카테고리 1 혁신 의약품을 시장에 출시했습니다."},{"s":"중국 혁신의약품의 구조적 장점이 드러난다. 2027년에는 '데이비스 더블클릭'이 일어날까?","so":"财联社","tm":"11/16 08:21","c":1,"r":"cn","u":"https://www.cls.cn/detail/2535143","p":1794784860,"a":1794806423,"t":"中国创新药结构性优势显现 2027年能否迎来“戴维斯双击”？","su":"① 2026년 상하이 증권거래소 국제 투자자 회의에서 Zhu Yi는 중국 혁신 의약품의 경쟁 우위가 단일 제품 및 플랫폼에서 R&D 시스템으로 확장되고 구조적 우위가 전 세계의 관심을 끌고 있다고 믿었습니다. ② 중국 국내 접근 정책이 개선되고 해외 가치가 실현됐다. 2027년에 \"Davis Double Click\"이 도입될지는 아직 테스트가 필요합니다. ③AI는 분자 생성을 가속화하며, 습식 실험 검증과 과학자 의사 결정은 여전히 ​​R&D 성공률을 높이는 열쇠입니다. 파이낸셜뉴스는 11월 16일(루아펑 기자) \"우리는 플랫폼 BD를 하는 것이 아니라 구조적 BD를 하면서 중국의 구조적 장점을 매수하고 있다\"고 보도했다. 2026년 상하이 증권거래소 국제 투자자 컨퍼런스에서 \"다음부터 정의까지: 중국 제약회사가 글로벌 혁신 리더가 되고 있습니까?\" 원탁 포럼에서 Bailey Tianheng(688506.SH)의 설립자이자 회장인 Zhu Yi는 지난 6개월 동안 중국 혁신 제약 산업의 변화를 요약했습니다."},{"s":"기술주 평가를 개정하고 자금을 생명공학 분야로 편입했다. 관련지수는 지난달 7.1% 가까이 상승했다.","so":"UDN","tm":"11/16 04:39","c":1,"r":"tw","u":"https://udn.com/news/story/123006/9880478","p":1794771560,"a":1794784837,"t":"科技股評價修正資金轉進生技 相關指數近一月上漲近7.1%","su":"최근 시중자금의 순환이 빠르게 진행되고 있습니다. 기존 강세를 보인 기술주에 대한 평가를 수정하고, 합리적인 평가와 탄탄한 펀더멘털을 갖춘 바이오·의료주에 일부 자금을 편입했다. 가장 대표적인 NBI 생명공학지수를 보면 지난 한 달간 7.1% 가까이 상승했다. 기술주를 대표하는 나스닥 지수와 비교하면 최근 몇 달간 6.7% 하락했다. 더욱 돋보입니다. 지난 한 달 동안 미국 S&P500(미국 큰 회사 500곳 지수)의 다양한 주식들의 성과를 살펴보면, 헬스케어 주식들도 가장 좋은 성과를 냈습니다. 투자자들은 생명공학 ETF(여러 주식을 묶어 파는 상품)를 통해 시장을 확인하고 싶을 수도 있습니다."},{"s":"Jingshuo 및 Yaohua Pharmaceutical과 같은 생명공학 주식은 첫 3분기 동안 폭발적인 이익을 경험했습니다. 주당순이익 순위가 대대적으로 개편되고 있습니다. 법인들은 2027년 성장 모멘텀이 새로운 최고치에 도달할 것으로 예상합니다.","so":"工商時報","tm":"11/16 04:00","c":1,"r":"tw","u":"https://www.ctee.com.tw/news/20261116700124-439901","p":1794769200,"a":1794806426,"t":"晶碩、藥華藥等生技股前三季獲利噴發EPS排行大洗牌法人看2027成長動能再創高- 日報","su":"첫 3분기 동안 생명공학 주식의 주당 수익입니다. 상위 10개 생명공학 주식은 첫 3분기 동안 엄청난 이익을 냈습니다. 총 8개 회사가 1주 이상의 자본금을 창출했습니다. 다만, 세후주당순이익(주식 한 주가 번 돈)주) 순위는 대대적인 개편을 겪었다. 징숴(Jingshuo)가 20.09위안으로 1위를 차지했고, 야오화제약(Yaohua Pharmaceutical)이 18.43위안, 타이보(Taibo)가 18.06위안으로 뒤를 이었다. BenQ Medical은 16.65위안으로 처음으로 상위권에 진입했습니다. Baorui는 상위 10위에 진입했고 Lamex는 예상치 못하게 30위로 떨어졌습니다. 전체적으로 의료소재, 의약품, 미용·건강제품 3대군으로 구성되어 있습니다."},{"s":"의료보험이 적용되는 혁신적인 의약품을 최대한 빨리 사용하는 방법은 무엇입니까? 다학과 협업으로 '입학의 어려움' 해결","so":"央视网","tm":"11/16 02:06","c":1,"r":"cn","u":"https://news.cctv.com/2026/11/16/ARTIgQCII4pqN5iNGHDqvJyN261115.shtml","p":1794762390,"a":1794784826,"t":"进了医保的创新药如何尽快用上？多部门联动破解“入院难”","su":"최근 국민의료보험청은 기본 보장과 수익성 보호를 바탕으로 혁신의약품에 대한 보호를 지속적으로 강화해 왔으며, 임상적 이점이 명확한 혁신의약품을 포함하고 치료 공백을 보험 범위에 채워 일반 국민이 새롭고 좋은 의약품을 사용할 수 있도록 하는 데 중점을 두고 있다. 현재 의료보험으로 인해 협상된 약품 판매액이 매년 170억 위안을 초과하고 있으며 이는 5년 전의 4배입니다. '14차 5개년 계획' 기간 의료보험 기금 누적 지출은 13조 위안에 달했다."},{"s":"\"지능형 혁신 약물이 건강에 힘을 실어줍니다\" 2026년 혁신 약물 고품질 개발 회의가 장쑤성 쑤저우에서 개최되었습니다.","so":"央视网","tm":"11/15 15:14","c":1,"r":"cn","u":"https://local.cctv.com/2026/11/15/ARTIJUUOS3gCb1NM4LmCttey261115.shtml","p":1794723251,"a":1794727069,"t":"“智创新药 赋能健康” 2026年创新药高质量发展大会在江苏苏州举行","su":"\"지능형 혁신 약물이 건강에 힘을 실어줍니다\" 2026년 혁신 약물 고품질 개발 컨퍼런스가 장쑤성 쑤저우에서 개최되었습니다."},{"s":"수백만 달러의 가격을 돌파한 후, 카탈로그로 이전된 첫 번째 혁신 의약품의 판매량이 폭발적으로 증가할 수 있을까요?","so":"第一财经","tm":"11/15 10:27","c":1,"r":"cn","u":"https://www.yicai.com/news/103440856.html","p":1794706024,"a":1794751323,"t":"击穿百万价格后，首批转目录的创新药销量能大爆发吗？","su":"\"혁신적인 약물이 곧 등장할 예정이며, 내년에는 이 CAR-T의 매출(물건을 판 돈 전체)이 급증할 것입니다!\" 한 선임 의료인은 오늘 CAR-T 세포치료제 레기올란자가 기본의료보험에 포함됐다는 소식을 듣고 흥분을 감추지 못했다. 우시준누오의 루이구이오렌제주가 녹시나신나트륨에 이어 의료보험 협상을 통해 '순환을 깨는' 또 하나의 스타 고부가가치 의약품으로 자리 잡았다. 이 사람은 100만 달러에 달하는 CAR-T 의약품의 '고가' 장벽이 허물어지면서, 혁신의약품이 지불한도를 깨기 위한 새로운 상상의 공간을 열고 있다고 직설적으로 말했다. 올해 의료보험 카탈로그 조정으로 처음으로 '이중 카탈로그' 연결 메커니즘이 구축되어 상업 보험 상품에 기본 의료 보험을 신청할 수 있게 되었습니다. 국민의료보험청은 고부가가치 혁신신약(세상에 처음 나온 새로운 약)이 출시 초기 단계에서 상용보험 목록에 진입하고 임상 활용을 통해 데이터를 축적해 비용을 절감한 뒤 기본의료보험으로 전환하도록 장려하고 있다."},{"s":"2026년 11월 주목해야 할 영국 생명공학 주식 상위 3개","so":"Yahoo Finance","tm":"11/15 08:09","c":1,"r":"us","u":"https://finance.yahoo.com/healthcare/articles/top-3-british-biotech-stocks-230940445.html","p":1794697780,"a":1794702385,"t":"Top 3 British Biotech Stocks To Watch In November 2026","su":"미국의 도매 인플레이션(물건값이 계속 오르는 것) 상승과 추가 금리(돈을 빌릴 때 내는 이자 비율) 인상 기대로 인해 글로벌 투자자들이 불안해하고 있습니다. 그러나 이런 종류의 압력은 종종 금리가 아닌 돌파구가 결과를 주도하는 부문으로 돈을 밀어 넣습니다. 영국의 생명공학 주식은 바로 그 진영에 속해 있습니다. 이 기사에서는 영국 생명공학 기업을 필터링하는 집중 선별기의 세 가지 후보자를 볼 수 있습니다."},{"s":"신약 출시 경쟁 속에서 강소성의 '좋은 처방'은 무엇일까?","so":"人民网－江苏频道","tm":"11/15 07:57","c":1,"r":"cn","u":"http://js.people.com.cn/n2/2026/1115/c360301-41751166.html","p":1794697020,"a":1794713936,"t":"新药竞发，江苏有何“良方”？","su":"11월 14일, 장쑤성 쑤저우에서 2026년 혁신의약품 고품질 개발 컨퍼런스가 개최되었습니다. 이날 회의에서는 2026년판 국민의료보험 의약품 카탈로그가 공개됐다. 107개 신약 중 51개가 카테고리 1 혁신의약품으로 혁신의약품에 대한 명확한 지원 신호를 보냈다. 이번 컨퍼런스는 장쑤성에서 개최되었으며 장쑤성의 바이오제약 산업과 밀접한 관련이 있습니다."},{"s":"Vita Life Sciences 및 기타 2개의 호주 생명공학 주식 소유","so":"Yahoo Finance","tm":"11/15 01:08","c":1,"r":"us","u":"https://finance.yahoo.com/healthcare/articles/vita-life-sciences-2-other-160842530.html","p":1794672522,"a":1794698059,"t":"Vita Life Sciences And 2 Other Australian Biotech Stocks To Own","su":"미국에서는 10월 소비자물가지수와 생산자물가(공장에서 파는 물건값 수준)가 모두 중앙은행 목표치를 상회하는 등 인플레이션(물건값이 계속 오르는 것)이 과열되고 있으며, 주요 중앙은행들은 금리를 더 오랫동안 유지할 준비가 되어 있다는 신호를 보내고 있습니다. 그런 배경에서는 무거운 자산보다는 연구, 지적재산권, 과학에서 가치가 나오는 기업이 상대적으로 더 나은 입장일 수 있습니다."},{"s":"세계 주요 라이센스 프로젝트의 절반이 중국에서 나옵니다. 혁신신약 황금시대의 혁신과 투자 논리는 무엇일까?","so":"财联社电报","tm":"11/15 00:54","c":1,"r":"cn","u":"https://m.cls.cn/detail/2534664","p":1794671640,"a":1794746294,"t":"全球半数重磅license-in项目来自中国 创新药“黄金时代”的创新与投资逻辑是什么？","su":"AP통신은 11월 15일(유미아오 기자) \"우리는 바이오의약품 산업의 황금시대에 있다\"며 \"혁신적 신약에 대한 투자 기회가 많다\"고 보도했다. 2026 진지호 생명건강 투자 컨퍼런스에서 컨퍼런스에 참석한 많은 귀빈들은 중국의 바이오의약품 산업이 큰 진전을 이루었지만 여전히 중국 제약회사와 세계 선두 기업 사이에는 격차가 있다고 말했다. 산업 발전이 본격화되고, 중국 파이프라인이 글로벌 바이어들의 '보통 옵션'이 된다면 2.0 시대의 혁신은 무엇일까? 선도적인 글로벌 기업의 발전을 따라잡는 방법은 무엇입니까? 자본은 어떻게 선택되고 가격이 책정될 것인가? 혁신 격차를 해소하는 방법 글로벌 구매자가 중요하게 생각하는 것은 무엇입니까? 바이오의약 황금시대에 중국 제약회사의 발전은 누구에게나 명백하지만, 세계 선두 기업과의 격차는 여전히 존재한다. Innovent Biologics(01801.HK)의 창립자이자 회장 겸 CEO인 Yu Dechao는 이러한 격차를 좁히려면 FIC(First in class)와 BIC(Best in class)가 혁신에 필요한 옵션이지만 기업이 FIC만 하는 것만으로는 충분하지 않으며 FIC를 기반으로 BIC를 추구해야 한다고 믿습니다."},{"s":"중국 혁신 의약품의 '쑤저우 모멘트' 개막: JHC 진지호 생명건강 투자 컨퍼런스가 성공적으로 개최되었습니다.","so":"央视网","tm":"11/14 23:09","c":1,"r":"cn","u":"https://local.cctv.com/2026/11/14/ARTIF0JYprRz9gfgmZyNiJZk261114.shtml","p":1794665394,"a":1794698061,"t":"开启中国创新药的“苏州时刻”：JHC金鸡湖生命健康投资大会顺利举行","su":"이 회의에서는 최첨단 과학 세력, 선도적인 투자 자본 및 주요 산업 신호를 모아 ​​자본의 물로 혁신의 원천에 물을 공급하고 생명 및 건강 산업을 위한 매우 중요한 \"연간 자본 좌표\"를 설정합니다."},{"s":"의료보험목록에 의약품 107종 신규 포함, 혁신의약품 지급한도 개방","so":"第一财经","tm":"11/14 17:38","c":1,"r":"cn","u":"https://www.yicai.com/news/103440767.html","p":1794645535,"a":1794659855,"t":"107种药品新纳入医保目录，创新药支付天花板打开","su":"2025년판 상업보험 혁신의약품 카탈로그의 18개 의약품 중 2개가 기본의료보험 카탈로그에 편입돼 '상업보험을 통한 혁신의약품 최초 발굴 및 기본의료보험 연계'라는 변혁의 길을 실현하는 데 앞장서고 있다."},{"s":"pMN 적응증에 대한 최초의 혁신 약물이 의료 보험에 포함됩니다. 전문가들이 베이젝신 이중 적응증 약물의 임상적 의의를 설명하다","so":"新华网上海","tm":"11/14 16:14","c":1,"r":"cn","u":"http://sh.news.cn/20261114/354598b1859f4f2982434c33fd1e51db/c.html","p":1794640448,"a":1794659857,"t":"首个pMN适应症创新药纳入医保 专家解读倍捷欣双适应症药物临床意义","su":"최초의 pMN 적응증 혁신신약(세상에 처음 나온 새로운 약)이 의료보험에 포함되었습니다. 전문가들은 이중 적응증 약물인 Betexin®의 임상적 중요성을 설명합니다. Tianguangshi Biological의 오리지널 CD20 단일클론 항체인 Betexin® 이중 적응증은 2026년 의료 보험 카탈로그에 포함되어 원발성 막성 신병증 및 시신경척수염 스펙트럼 질환을 포함하여 환자의 약물 접근성을 향상시킬 것입니다."},{"s":"수익 최대 11%의 생명공학 주식 3개","so":"Yahoo Finance","tm":"11/14 15:15","c":1,"r":"us","u":"https://finance.yahoo.com/healthcare/articles/3-biotech-stocks-revenue-11-061542278.html","p":1794636900,"a":1794642663,"t":"3 Biotech Stocks With Revenue Up To 11%","su":"AI 인프라와 관련된 복잡한 부채가 급증하면서 AI 관련 위험이 연준(FRB)의 금융 안정성 우려 중 최고 수준으로 올라섰습니다. 이러한 종류의 호황과 정밀한 조사는 투자자들이 다른 최첨단 분야를 보도록 유도할 수 있습니다. 탄탄한 대차대조표를 갖춘 신중하게 선택된 생명공학 주식은 잠재적인 높은 상승 여력의 다른 원천을 제공할 수 있습니다. 이 기사에서는 이러한 세 가지 생명공학 oppo에 대해 설명합니다."},{"s":"전문가들, 혁신적인 ALS 약물이 상업 보험의 새 창을 열다: 유전자 검사는 가족력에만 초점을 맞춰서는 안 됩니다","so":"ThePaper.cn","tm":"11/14 15:12","c":1,"r":"cn","u":"https://www.thepaper.cn/newsDetail_forward_34475772","p":1794636762,"a":1794642664,"t":"渐冻症创新药迎来商保新窗口，专家：基因检测不应只盯家族史","su":"11월 14일, 2026년 전국 상업 보험 혁신 의약품 카탈로그가 공식적으로 발표되었습니다. 이번 국가 \"이중 카탈로그\" 조정은 혁신 수준이 높고, 임상 가치가 높으며, 환자 혜택이 상당한 품종에 초점을 맞추고 있으며, 보다 다양한 보호 방법을 통해 혜택을 받을 수 있는 혁신적인 약물을 홍보하는 것을 목표로 하고 있습니다."},{"s":"Jikeshu는 의료 보험에 들어갑니다 : 인플루엔자 A와 B에 맞서 싸우기 위해 한 번의 복용량으로 일반 가족에게 혜택을주는 혁신적인 약물","so":"中国新闻网","tm":"11/14 14:44","c":1,"r":"cn","u":"https://www.chinanews.com.cn/jk/2026/11-14/10731967.shtml","p":1794635077,"a":1794642667,"t":"济可舒进医保：一剂对抗甲流乙流，创新药惠及普通家庭","su":"Jikeshu는 의료 보험에 가입합니다. 인플루엔자 A와 B에 대해 한 번의 접종으로 혁신적인 약물이 일반 가족에게 도움이 됩니다. 국민의료보험청은 11월 14일 2026년 '국민기본의료보험, 출산보험, 산재보험 약품 목록'(이하 국민의료보험 목록)을 발표했다. Jichuan Pharmaceutical과 Zhengxiang Pharmaceutical의 전략적 협력인 국내 1급 항인플루엔자 혁신 약물인 Maseloseloxavir 정제(Jikeshu®)가 공식적으로 의료 보험에 포함되었습니다. 이 혁신적인 약물은 인플루엔자 치료에 새로운 선택을 제시하고, 일반 국민들은 국산의 좋은 약물을 보다 저렴하게 사용할 수 있게 되었습니다. 인플루엔자를 치료하려면 전체 치료 과정에서 한 가지 약물만 필요하며 하루 정도 지나면 열이 내려갈 수 있습니다. 독감에 걸리면 매일 약을 복용해야 한다는 것을 기억해야 합니까? Jikeshu®는 다중 약물 치료 모델을 깨뜨립니다. 전체 독감 치료 주기 동안 한 번만 복용하면 진정한 \"1회 복용량 완화\"를 달성할 수 있습니다."},{"s":"2027년에 생명공학 주식이 이익 턴어라운드를 볼 수 있을까요? 한다, 타이허 등 6개 유명 의약품의 허가, 허가, 판매가 핵심이 됐다","so":"工商時報","tm":"11/14 11:35","c":1,"r":"tw","u":"https://www.ctee.com.tw/news/20261114700362-430504","p":1794623700,"a":1794628693,"t":"生技股2027年迎獲利轉機？漢達、泰合等6檔受矚藥證、授權與銷售成關鍵- 產業","su":"생명공학 주식은 2027년에 이익 턴어라운드를 볼 것입니다! 신약 인증, 국제라이센싱, 해외판매가 지속적으로 진행되면서 시장의 초점은 연구개발에서 실제 수익으로 옮겨가고 있습니다. 그 중 한다(6620)의 항암신약은 이미 미국 의약품 허가를 취득했고, 타이허(6467)의 항혈전신약은 이미 검토 단계에 돌입했다. TLC-KY(7924), Renxin(6696), Taikang(6589), Yi'an(6499) 등 상용화 테마로 내년 영업 성장…"},{"s":"주사형 나노바디, 중증 근무력증에 대한 FDA 승인 획득","so":"MedPage Today","tm":"11/14 07:24","c":1,"r":"sg","u":"https://www.medpagetoday.com/neurology/generalneurology/123885","p":1794608648,"a":1794610378,"t":"Injectable Nanobody Wins FDA Approval for Myasthenia Gravis","su":"FDA는 금요일 항아세틸콜린 수용체(AChR) 항체 양성인 성인의 전신성 중증 근무력증을 치료하기 위해 보체 성분 5(C5) 활성화를 차단하는 이중 결합 나노바디인 주사형 게푸룰리맙(Klygefa)을 승인했습니다."}]},{"name":"🔋 2차전지","note":"보유: TIGER 2차전지테마 · KODEX 2차전지산업 · TIGER 2차전지소재Fn","breaking":false,"items":[ 니다. ② 리튬과 황산염은 영향이 달랐으며 민물 생물이 바다 생물보다 대체로 더 민감했습니다. ③ 연구진은 리튬을 우선 제거하고 여러 처리 기술을 단계적으로 결합해 물 재이용과 자원 회수를 함께 하도록 제시했습니다."},{"s":"이차전지 양산 설비 도면 빼돌려 부당 이득…전 직원들 벌금형·집유","so":"파이낸셜뉴스","tm":"11/15 10:00","c":2,"r":"kr","u":"https://www.fnnews.com/news/202611151000366860","p":1794704436,"a":1794713947,"su":"(청주=뉴스1) 임양규 기자 = 자신이 근무했던 이차전지 양산용 공정 자동화 장비업체에서 빼돌린 설비 설계 도면을 이용해 사업을 벌이고 부당이득을 챙긴 2명이 나란히 벌금형을 선고받았다."},{"s":"CATL, Baidu, Unitree, 선전에서 열리는 APEC CEO 서밋에 참석","so":"Bloomberg.com","tm":"11/16 22:40","c":1,"r":"us","u":"https://www.bloomberg.com/news/articles/2026-11-16/catl-baidu-unitree-to-attend-apec-ceo-summit-in-shenzhen","p":1794836412,"a":1794838060,"t":"CATL, Baidu, Unitree to Attend APEC CEO Summit in Shenzhen"},{"s":"쓰촨성 신에너지 자동차 및 전력 배터리 산업 체인의 첫 3분기 매출이 5000억 위안을 초과했습니다.","so":"中国新闻网","tm":"11/16 22:11","c":1,"r":"cn","u":"https://www.chinanews.com.cn/cj/2026/11-16/10733078.shtml","p":1794834684,"a":1794838061,"t":"四川新能源汽车及动力电池产业链前三季度营收超5000亿元","su":"쓰촨성 신에너지 차량 및 전력 배터리 산업 체인의 첫 3분기 매출(물건을 판 돈 전체)이 5000억 위안을 초과했습니다. China News Service, 청두, 11월 16일(Wang Liwen) 쓰촨성 신에너지 차량 및 전력 배터리 산업 체인의 수급 도킹 활동에 대한 언론 브리핑이 16일 쓰촨성 경제정보기술부에서 열렸습니다. 쓰촨성 경제정보기술부 자동차 및 철도 운송 장비 부서 부국장 Li Yan은 회의에서 올해 상반기 쓰촨성 '15+N' 핵심 산업 체인 평가에서 신에너지 차량 및 전력 배터리 산업 체인의 종합 발전 지수가 119.3으로 1위를 차지했다고 소개했습니다. 상위 3개 분기에 성의 신에너지 차량 생산량은 310,000대로 전년 동기 대비 45% 증가했고, 동력 배터리 생산량은 약 260GWh로 전년 동기 대비 53% 증가했으며, 업계 체인 매출은 전년 동기 대비 28% 증가한 5000억 위안을 초과했습니다. 연간 업계 체인 수익은 6000억 위안을 초과할 것으로 예상됩니다."},{"s":"르노는 프랑스에서 사무직 최대 1000명을 해고하고 EV 생산 역할을 추가할 것이라고 소식통은 전했습니다.","so":"Reuters","tm":"11/16 20:43","c":1,"r":"us","u":"https://www.reuters.com/business/world-at-work/renault-cut-up-1000-white-collar-jobs-france-add-roles-ev-production-say-sources-2026-11-16/","p":1794829423,"a":1794830417,"t":"Renault to cut up to 1,000 white-collar jobs in France, add roles for EV production, say sources"},{"s":"허난 상무부 답변 21: BYD에서 CATL까지, 투자 유치 및 효율성 향상을 위한 세 가지 주요 조치","so":"21财经","tm":"11/16 20:41","c":1,"r":"cn","u":"https://www.21jingji.com/article/20261116/herald/4f81f2c967b1df5f6d333ab91a9de546.html","p":1794829260,"a":1794830422,"t":"河南商务厅答21：从比亚迪到宁德时代，三大举措招商提效","su":"21세기 비즈니스 헤럴드 기자 Zhou Hui가 베이징에서 보도합니다. 제14회 중국 중부 투자 무역 박람회가 11월 21일부터 23일까지 허난성 정저우시에서 개최됩니다. 11월 16일 국무원 신문판공실에서 열린 기자회견에서 장다싱(張大興) 허난성 상무부장은 21세기 비즈니스 헤럴드 기자들의 질문에 답하면서 투자 촉진과 산업 발전 촉진을 위한 허난성의 조치를 소개했다. 사진: 기자회견 현장 사진: Zhou Hui 장다싱(Zhang Daxing)에 따르면, 최근 몇 년 동안 허난성은 전국 통일 시장 건설을 심화하고 지방 투자 촉진 행위를 규제하는 것에 대한 당 중앙위원회와 국무원의 결정과 배치를 철저히 시행했으며, 지역 여건에 따라 투자 촉진을 위한 새로운 길과 새로운 모델을 모색했습니다."},{"s":"중국, 최초로 19인승 배터리 구동 항공기 비행: 얼마나 멀리 비행할 수 있나요?","so":"Livemint","tm":"11/16 19:43","c":1,"r":"us","u":"https://www.livemint.com/technology/china-flies-19-seater-battery-powered-aircraft-for-first-time-how-far-can-it-travel-11794824476909.html","p":1794825825,"a":1794830418,"t":"China flies 19-seater battery-powered aircraft for first time: How far can it travel?","su":"COMAC과 CATL을 포함한 파트너가 개발한 중국의 19좌석 CE-25A 전기 여객기가 산둥에서 첫 번째 조종 비행을 완료했습니다. 무게가 10톤인 이 항공기는 약 400km의 항속거리와 300kmph의 순항 속도를 제공합니다."},{"s":"리튬 이온 배터리를 대체하는 본명? 오래 지속되는 '공기 배터리'란?","so":"www.tv-tokyo.co.jp","tm":"11/16 18:35","c":1,"r":"jp","u":"https://www.tv-tokyo.co.jp/plus/business/entry/202611/20470_image.html","p":1794821712,"a":1794830423,"t":"リチウムイオン電池に代わる本命？長持ちする「空気電池」とは：アンパラレルドの画像","su":"11월 4일(수), 11월 11일(수)에 방송한 「앰퍼럴드~닛폰발, 세계에~」(MC：오드리 와카바야시 정교 매주 수요일 밤 11시 06분)을, 「텔레히가시 BIZ」로 전달중! 【동영상】리튬 이온 배터리를 대체하는 본명? 오래..."},{"s":"헝가리, 중국과 한국 배터리 공장에 대한 감독 강화","so":"Nikkei Asia","tm":"11/16 18:30","c":1,"r":"us","u":"https://asia.nikkei.com/business/automobiles/electric-vehicles/hungary-tightens-oversight-of-chinese-south-korean-battery-plants","p":1794821400,"a":1794830420,"t":"Hungary tightens oversight of Chinese, South Korean battery plants","su":"일대일로 철도 캐노피 재해 이후 차기 세르비아 정부도 뒤따를 수 있음"},{"s":"EQS-News: Vulcan은 상업용 리튬 추출 공장 현장에서 토목 공사를 시작합니다.","so":"Financial Times","tm":"11/16 17:54","c":1,"r":"world","u":"https://markets.ft.com/data/announce/detail?dockey=600-202611160354DGAP____CORPNEWS_corporate_2435458_en-1","p":1794819240,"a":1794830424,"t":"EQS-News: Vulcan commences civil construction works at its commercial Lithium Extraction Plant site"},{"s":"포항TP, '국제 배터리 엑스포 2026 포항' 성료…에코프로·포스코퓨처엠 등 48개 기업 및 기관 참여","so":"전자신문","tm":"11/16 16:47","c":1,"r":"kr","u":"https://www.etnews.com/20261116000467","p":1794815238,"a":1794830415,"su":"경북도와 포항시가 주최하고 포항테크노파크(원장 송경창)가 주관한 '국제 배터리 엑스포 2026 포항'이 지난 13일부터 15일까지 사흘간 포항종합운동장 만인당에서 열렸다. '일상을 충전하다, 미래를 향한 움직임'을 주제로 열린 이번 행사는 이차전지 산업의 최신 기술과 미래 비전을 공유하고, 기업과 시민이 함께 참여하는 산업 교류의 장으로 마련됐다. 특히 이차전지 산업의 핵심 거점인 포항의 산업 경쟁력을 대내외에 알리고, 기업 간 기술 교류와 협력 가능성을 모색하는 한편, 시민들이 배터리 산업을 보다"},{"s":"리오토: '파워 배터리 리콜' 문제와 '4000위안 배상' 문제는 범죄자들이 자동차 회사의 이름으로 만들어 유포한 허위 공지입니다.","so":"Jiemian.com","tm":"11/16 16:38","c":1,"r":"cn","u":"https://m.jiemian.com/article/15337188.html","p":1794814690,"a":1794830423,"t":"理想汽车：“动力电池召回”事项、“4000元赔偿”为不法分子冒用车企名义制作、传播的虚假通知","su":"11월 16일, @IDEAL 자동차 법무팀은 최근 일부 자동차 소유자가 자동차 회사의 이름으로 범죄자들이 작성하고 유포한 허위 리콜 통지를 받았다는 기사를 발표했습니다. 그들은 '파워 배터리 리콜'을 근거로 자동차 소유자가 '보상금 4,000위안'을 받을 수 있다고 주장하고 자동차 소유자에게 첨부된 웹사이트를 방문하거나 QR 코드를 스캔하여 소위 '온라인 고객 서비스'에 연락하여 정보를 등록하도록 안내합니다. 앞서 회사는 '에어백 리콜' 사기 문자 메시지와 '이상적인 i6 공동구매 리베이트' 관련 채용 정보에 대해 별도의 알림을 발송한 바 있다. 사실을 명확히 하고 자동차 소유자의 정당한 권익을 보호하기 위해 회사는 Li Auto라는 이름을 사용한 허위 통지에 대해 다시 한 번 엄숙히 선언합니다. 관련 통지에 언급된 Li Auto의 '파워 배터리 리콜'과 '4,000위안 보상'은 모두 허구입니다. 위 공지는 Li Auto의 공식 공지가 아닙니다. 첨부된 URL은 사기성 웹사이트입니다. 관련 QR 코드 및 소위 \"온라인 고객 서비스\"는 Li Auto의 공식 서비스 채널이 아닙니다."},{"s":"[2026 강소특구] 충북청주 강소특구 “개방형 혁신으로 반도체·이차전지·양자 리더로”","so":"동아일보","tm":"11/16 16:16","c":1,"r":"kr","u":"https://www.donga.com/news/It/article/all/20261116/135033078/1","p":1794813360,"a":1794830415,"su":"※2019년부터 강소특구는 지역 주도의 혁신성장을 지원하기 위해 탄생했습니다. 현재 지역 혁신 거점으로서 강소특구 내 기술 창업과 연구소기업 등이 지역 경제성장을 견인하는 유니콘 기업으로 성장하도록 성장단계별 맞춤형 기술사업화를 지원해 나가고 있습니다. IT동아는 과…"},{"s":"리튬값 4분기 들어 35% 넘게 하락…K배터리 수익성 변수로","so":"이투데이","tm":"11/16 15:58","c":1,"r":"kr","u":"https://www.etoday.co.kr/news/view/2648729","p":1794812280,"a":1794830415,"su":"4분기 리튬 가격 35% 하락셀 판가·양극재 재고 부담 확대▲호주 미네랄 리소스가 보유·운영 중인 서호주 워지나(Wodgina) 리튬 광산 (사진제공=포스코"},{"s":"‘이차전지 전주기’ 한눈에… 포항서 48개사 참가한 에너지 축제 성황리 종료","so":"이투데이","tm":"11/16 15:53","c":1,"r":"kr","u":"https://www.etoday.co.kr/news/view/2648792?trc=right_categori_news","p":1794811980,"a":1794812202,"su":"13일부터 사흘간 포항종합운동장 만인당서 개최…에코프로·포스코퓨처엠 등 참여휴머노이드(사람을 닮은 로봇) 로봇부터 배터리팩 분해까지…기술 교류와 시민 체험 두 마"},{"s":"목표는 3억 킬로와트이며, 주요 에너지 저장 정책이 구현되었습니다! 배터리 부문은 배터리 ETF 차이나 유니버셜(159796) 지수가 1% 이상 하락하는 등 약세를 보이고 변동성이 크다. 전 세계적으로 전력 부족 현상이 발생하고 있습니다. 에너지 저장 기회에 대해 어떻게 생각하시나요?","so":"Jiemian.com","tm":"11/16 15:41","c":1,"r":"cn","u":"https://www.jiemian.com/article/15336863.html","p":1794811312,"a":1794812205,"t":"目标3亿千瓦，储能重磅政策落地！电池板块弱势震荡，电池ETF汇添富(159796)指数跌超1%，全球缺电，储能机遇怎么看？","su":"11월 16일 A주 시장은 등락세를 보이며 약세(내리는 흐름)를 보였습니다. 기술 부문이 다시 큰 폭으로 하락했습니다. 상하이증권거래소 지수는 1% 이상 하락했다. 배터리 부문은 수중에서 변동했습니다. 배터리 ETF(여러 주식을 묶어 파는 상품) 차이나유니버설(159796)의 기초지수는 1% 이상 하락했다. 3일 연속으로 계속해서 약해지고 떨어질 수도 있습니다."},{"s":"KTR, 광양에 189억 투입…‘이차전지 소재 실증센터’ 구축","so":"중앙일보","tm":"11/16 15:35","c":1,"r":"kr","u":"https://www.joongang.co.kr/article/25479020","p":1794810900,"a":1794812202,"su":"한국화학융합시험연구원(KTR·원장 이승렬)이 11월 12일 광양시청에서 광양시와 이차전지 소재 실증 인프라 구축을 위한 업무협약을 체결했다. 이번 협약은 산업통상부의 ‘미래 이차전지 원료소재 실증 플랫폼 기반 구축 사업’을 추진하기 위해 마련됐다. KTR은 지난 5월 해당 사업의 주관기관으로 선정됐다. KTR은 2029년 말까지 약 189억원을 투입해 광양청사에 ‘미래 이차전지 소재 실증센터’를 구축할 계획이다. 실증센터는 이차전지 소재의 개발부터 제작, 성능 검증까지 전 과정을 지원하는 시설이다."},{"s":"4천번 급속 충전에도 거뜬…국내 연구진, 차세대 배터리 개발","so":"연합뉴스","tm":"11/16 15:30","c":1,"r":"kr","u":"https://www.yna.co.kr/view/AKR20261116125400053","p":1794810609,"a":1794812202,"su":"포스텍-서강대, 차세대 듀얼이온전지 개발 흑연에 초박막 보호막, 저장량 3배로 향상 급속 충전 4천번 반복에도 성능 유지 전체 내용을 이해하기 위해서는 기사 본문과 함께 읽어야 합니다. 송고 2026년11월16일 15시30분 구글 검색에서 연합뉴스 기사를 우선적으로 보여줍니다. (포항=연합뉴스) 손대성 기자 = 국내 연구진이 잦은 충전에도 오래 사용할 수 있는 이차전지를 개발했다. 포스텍(POSTECH)은 화학과 박수진 교수, 강지은 박사, 지윤아 석사, 기계공학과 안지환 교수, 박사과정 조성은씨 연구팀이 서강대 화공생명공학과 류재건 교수 연구팀과 함께 충전 속도와 수명을 모두 높인 듀얼이온전지용 흑연 양극을 개발했다고 16일 밝혔다."},{
