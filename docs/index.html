<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#262624">
<title>투자 테마별 뉴스</title>
<style>
@font-face{font-family:'ChosunIlboMyungjo';src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_one@1.0/Chosunilbo_myungjo.woff') format('woff');font-weight:normal;font-display:swap}
:root{color-scheme:dark;--bg:#262624;--card:#30302e;--card2:#3a3a37;--text:#faf9f5;--sub:#a6a39a;--line:#3e3e3a;--acc:#d97757;--red:#ef4444}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.55 'ChosunIlboMyungjo',Georgia,"Noto Serif KR",serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:760px;margin:auto}
header{padding:20px 16px 8px}
h1{font:600 22px/1.3 'ChosunIlboMyungjo',Georgia,serif;margin:0 0 4px}
.upd{color:var(--sub);font-size:12.5px}
/* 테마 탭 */
.tabs{position:sticky;top:0;z-index:3;background:rgba(38,38,36,.96);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.tabrow{display:flex;gap:8px;overflow-x:auto;padding:12px 16px 10px;scrollbar-width:none}.tabrow::-webkit-scrollbar{display:none}
.tab{position:relative;flex:none;padding:9px 15px;border-radius:12px;border:1px solid var(--line);background:var(--card);
  color:var(--sub);font:inherit;font-size:14px;cursor:pointer}
.tab b{margin-left:5px;color:var(--sub);font-weight:400;font-size:12px}
.tab.on{background:var(--acc);border-color:var(--acc);color:#1f1e1d;font-weight:600}.tab.on b{color:#1f1e1d}
.dot{position:absolute;top:-3px;right:-3px;width:11px;height:11px;border-radius:50%;background:var(--red);border:2px solid var(--bg)}
/* 정렬·국가 */
.ctrl{display:flex;gap:6px;overflow-x:auto;padding:0 16px 10px;scrollbar-width:none}.ctrl::-webkit-scrollbar{display:none}
.ctrl button{flex:none;border:1px solid var(--line);background:transparent;color:var(--sub);border-radius:8px;padding:5px 11px;font:inherit;font-size:12.5px}
.ctrl button.on{background:var(--card2);border-color:var(--card2);color:var(--text)}
.ctrl .sep{flex:none;width:1px;background:var(--line);margin:2px 4px}
main{padding:6px 12px 48px}
h2{font:600 19px/1.3 'ChosunIlboMyungjo',Georgia,serif;margin:16px 4px 2px}
.note{margin:0 4px 10px;color:var(--sub);font-size:12px}
.none{color:var(--sub);margin:24px 4px;text-align:center}
.card{display:block;background:var(--card);border-radius:12px;padding:12px 14px;margin:8px 0;color:var(--text);text-decoration:none;transition:background .15s}
.card:hover{background:var(--card2)}.card:active{opacity:.75}
.meta{color:var(--sub);font-size:12px}
.title{font-weight:500;margin-top:3px}
.orig{color:var(--sub);font-size:12px;margin-top:3px}
.new{margin-left:4px;color:var(--red);font-size:11px;font-weight:700;letter-spacing:.3px}
.hot{display:inline-block;margin-right:6px;padding:0 6px;border-radius:4px;background:rgba(217,119,87,.16);color:var(--acc);font-weight:600}
.hot.big{background:var(--acc);color:#1f1e1d}
.newbar{display:block;width:100%;margin:2px 0 6px;padding:9px;border:0;border-radius:10px;background:rgba(239,68,68,.14);color:#fca5a5;font:inherit;font-size:13px;text-align:left}
.more{display:block;width:100%;margin:4px 0 0;padding:10px;border:1px dashed var(--line);border-radius:12px;background:transparent;color:var(--sub);font:inherit;font-size:13px}
footer{margin:36px 4px 0;padding-top:14px;border-top:1px solid var(--line);color:var(--sub);font-size:12px;line-height:1.7}
footer b{color:var(--text);font-weight:600}
/* 요약 창 */
#dim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:5}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:6;max-width:760px;margin:auto;max-height:82vh;overflow-y:auto;
  background:var(--card);border-radius:16px 16px 0 0;padding:10px 18px calc(18px + env(safe-area-inset-bottom));box-shadow:0 -8px 30px rgba(0,0,0,.4)}
.grab{width:38px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 12px}
.s-title{font-size:17px;font-weight:600;margin:4px 0 2px;line-height:1.45}
.s-label{margin:16px 0 4px;color:var(--acc);font-size:12px;font-weight:700;letter-spacing:.5px}
.s-sum{font-size:15px;line-height:1.75}.s-sum.empty{color:var(--sub);font-size:13.5px}
.s-btns{display:flex;gap:8px;margin-top:20px}
.s-btns a{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;padding:11px 6px;border-radius:10px;font:inherit;font-size:13.5px;line-height:1.3;text-decoration:none;
  background:var(--acc);color:#1f1e1d;font-weight:600}
.s-btns a.cl{background:transparent;border:1px solid var(--acc);color:var(--acc)}
.s-close button{width:100%;margin-top:8px;padding:11px;border-radius:10px;background:transparent;border:1px solid var(--line);color:var(--sub);font:inherit;font-size:14px}
.s-cnote{margin-top:8px;color:var(--sub);font-size:11.5px;text-align:center}
#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);z-index:9;max-width:90%;padding:10px 16px;border-radius:10px;background:#faf9f5;color:#1f1e1d;font-size:13.5px;box-shadow:0 6px 20px rgba(0,0,0,.4)}
.seg{display:flex;gap:4px;margin:6px 4px 10px}.seg button{flex:1;min-width:0;border:1px solid var(--line);background:transparent;color:var(--sub);border-radius:8px;padding:7px 0;font:inherit;font-size:12.5px;white-space:nowrap}
.seg.ly{margin-top:-4px}.seg.ly button{padding:5px 0;font-size:12px}.seg.ly button.on{background:var(--card2);border-color:var(--acc);color:var(--text);font-weight:600}
.seg.sm{margin-bottom:8px}.seg.sm button{padding:9px 0;font-size:13px}.seg.sm button.on{background:var(--card2);border-color:var(--acc);color:var(--text)}
.warn{margin:0 4px 10px;padding:8px 10px;border-radius:8px;background:rgba(250,204,21,.08);color:var(--sub);font-size:12.5px;line-height:1.5}.warn b{color:var(--text)}
.seg button.on{background:var(--acc);border-color:var(--acc);color:#1f1e1d;font-weight:600}
.tot{margin:2px 4px 10px;color:var(--sub);font-size:13px}.tot b{color:var(--text)}.chgnote{font-size:11px}
.srow{background:var(--card);border-radius:12px;margin:6px 0;padding:10px 12px;cursor:pointer}.srow.open{background:var(--card2)}
.sline{display:flex;align-items:center;gap:8px}
.rk{width:18px;color:var(--sub);font-size:12px;text-align:right;flex:none}
.mv .gap{display:inline-block;width:3px}.mv{width:30px;flex:none;font-size:11px;font-weight:600;text-align:left;font-variant-numeric:tabular-nums;margin-right:-4px}.mv.up{color:#f87171}.mv.dn{color:#60a5fa}.mv.same{color:#a8a29e;font-size:15px;font-weight:700;line-height:1;padding-left:3px}
.sn{width:86px;flex:none;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb{flex:1;height:10px;background:rgba(255,255,255,.05);border-radius:5px;overflow:hidden;min-width:30px}.sb i{display:block;height:100%;background:var(--acc);border-radius:0 4px 4px 0}
.sc{width:54px;flex:none;text-align:right;font-size:14px;font-variant-numeric:tabular-nums}
.sent{flex:none;display:flex;gap:4px;font-size:10.5px;font-variant-numeric:tabular-nums;width:104px;justify-content:flex-start}.sent i{font-style:normal;white-space:nowrap}
.sent i::before{content:'●';font-size:8px;margin-right:1px;vertical-align:1px}.s-p::before{color:#4ade80}.s-n::before{color:#f87171}.s-u::before{color:#a8a29e}
.sentot{margin-top:-4px}.sentot .sent{display:inline-flex;font-size:12px;gap:8px;width:auto}
@media(max-width:520px){.srow .spark{display:none}.srow .sent{flex-direction:column;gap:0;font-size:9.5px;line-height:1.15;width:36px}}
.chg{width:48px;flex:none;text-align:right;font-size:11.5px;color:var(--sub)}.chg.up{color:#f87171}.chg.dn{color:#60a5fa}
.spark{flex:none}
.det{margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.dt{color:var(--sub);font-size:12px;margin:6px 0 4px}
.bars{width:100%;height:auto;display:block}.bars .ax{fill:var(--sub);font-size:10px}.bars .bar:hover rect+rect{opacity:.8}
.crow{display:flex;align-items:center;gap:8px;margin:3px 0;font-size:12.5px}.cl{width:86px;flex:none}.cb{flex:1;height:8px;background:rgba(255,255,255,.05);border-radius:4px;overflow:hidden}
.cb i{display:block;height:100%;background:var(--acc);opacity:.8;border-radius:0 3px 3px 0}.cn{width:50px;text-align:right;flex:none;font-variant-numeric:tabular-nums}
@media(max-width:400px){.spark{display:none}.sn{width:74px}}
</style></head><body>

M지수는 3.54%, 과학기술혁신종합지수는 5.23%, 베이신50지수는 4.85% 하락했다."},{"s":"대만 주식에 대한 외국인 투자자들은 NT$94억이라는 소액을 매도했고, 현지 투자자들은 더욱 치열하게 매도했습니다. 3개의 주요 기관 투자자가 NT$522억 4,600만 이상을 판매했습니다.","so":"中時新聞網","tm":"11/20 16:57","c":3,"r":"tw","u":"https://www.chinatimes.com/realtimenews/20261120003150-260410","p":1795161447,"a":1795161818,"t":"台股外資小賣94億元、本土殺更兇 三大法人賣超522.46億元","su":"앤트로픽의 기록적인 기업공개(IPO)는 AI의 모멘텀(값이 움직이는 기세)을 되살리는 데 실패했고, 단기제한명령 2.0도 매도압력을 막을 수 없었다. 대만 증시는 역사상 세 번째로 큰 폭으로 급락하며 최저치를 기록했습니다. 현재 외국인 투자자(외국인 자체 운영 거래자 제외)는 NT$94억 1,307억 이상을 판매했고, 투자 신탁은 NT$ 87억 4,930억 이상을 판매했으며, 자체 운영 거래자는 NT$ 340억 8,376억 이상을 판매했으며, 3대 기관 투자가는 NT$ 522억 4,600만 달러 이상을 판매했습니다. 밖의"},{"s":"양승조 수공 사장, 호남 반도체 클러스터 물 공급 현장 점검","so":"연합뉴스","tm":"11/20 16:23","c":3,"r":"kr","u":"https://www.yna.co.kr/view/AKR20261120139500063","p":1795159432,"a":1795160345,"su":"(대전=연합뉴스) 김소연 기자 = 양승조 한국수자원공사 사장이 '3대 메가프로젝트'가 진행될 반도체(전자기기의 두뇌 부품) 클러스터를 잇달아 찾아 용수 공급 계획을 점..."},{"s":"코스피·코스닥 5% 하락 마감…\"시장 참여자 매수 의지 약해져\"","so":"아시아경제","tm":"11/20 15:59","c":3,"r":"kr","u":"https://core.asiae.co.kr/article/2026112015594961221","p":1795157940,"a":1795158153},{"s":"[속보]원·달러 환율, 6.2원 오른 1336.2원 마감","so":"뉴시스","tm":"11/20 15:35","c":3,"r":"kr","u":"https://www.newsis.com/view/NISX20261120_0003877016","p":1795156512,"a":1795157424,"su":"[속보]원·달러 환율(다른 나라 돈과 바꾸는 비율), 6.2원 오른 1336.2원 마감"},{"s":"일본 소프트뱅크, 장중 16% 폭락…아시아 증시 매도세 주도","so":"SBS 뉴스","tm":"11/20 14:58","c":3,"r":"kr","u":"https://news.sbs.co.kr/news/endPage.do?news_id=N1008855864","p":1795154297,"a":1795155234,"su":"미국 인공지능 기업 앤트로픽이 전날 미국 나스닥(미국 기술 회사들이 많은 주식시장)시장에 데뷔한 이후 AI 투자 회의론이 가라앉지 않으면서 AI 관련주 매도세(팔려는 힘)가 아시아 증시로 번졌습니다."},{"s":"【속보】닛케이 평균의 하강폭이 3000엔을 넘었다","so":"時事ドットコム","tm":"11/20 14:46","c":1,"r":"jp","u":"https://www.jiji.com/jc/article?k=2026112000730&g=flash","p":1795153560,"a":1795155240,"t":"【速報】日経平均の下げ幅が３０００円を超えた","su":"닛케이 평균의 하강폭이 3000엔을 넘었다"}]},{"name":"🇺🇸 미국 S&P500","note":"보유: TIGER 미국S&P500","breaking":false,"items":[{"s":"월가 강세론자 야데니, 연말 S&P500 전망치 또 하향…\"약세장 가능성은 낮아\"","so":"뉴스핌","tm":"11/23 08:07","c":13,"r":"kr","u":"https://www.newspim.com/news/view/20261123000031","p":1795388820,"a":1795389861,"su":"[서울=뉴스핌] 최원진 기자= 월가의 대표적 시장 전략가인 에드 야데니가 뉴욕증시의 급락세로 스탠더드앤드푸어스(S&P) 500 지수가 기술적 조정 국면(고점에서 10% 넘게 내린 상태)에 진입하자 약 두 달 만에 연말 지수 전망치를 재차 하향 조정했다고 블룸버그통신이 22일(현지시간)"},{"s":"뉴욕증시 급락에 코스피 '검은 월요일' 우려…정부, 증시 안정 대책 가동","so":"국제뉴스","tm":"11/22 22:01","c":4,"r":"kr","u":"https://www.gukjenews.com/news/articleView.html?idxno=3759676","p":1795352519,"a":1795356482,"su":"미국 증시 급락으로 23일 국내 증시 불안이 커지자, 정부와 금융당국 수장들이 시장 안정 대책을 내놨다.이형일 부총리 겸 재정경제부 장관 등 이른바 ‘F4’는 22일 정부서울청사에서 관계기관 합동 긴급 시장상황점검회의를 열고 대응 방향을 논의했다. 앞서 지난 20일 뉴욕 증시에서는 3대 지수가 일제히 하락했다. 참석자들은 AI·반도체(전자기기의 두뇌 부품) 산업과 미국 금리 인상 등을 둘러싼 불확실성 탓에 국내외 증시 변동성(값이 크게 출렁이는 정도)이 크게 확대됐다고 평가했다.가장 먼저 증권시장안정펀드(증안펀드)는 시장 상황에 따라 바로 가동할 수 있도록 발동 체계 등 준비 작업"},{"s":"미국 증시 필라델피아 반도체 지수는 10% 하락했다. 투자 주의: 단기 금지와 국가 안보 기금 보호에주의하십시오.","so":"經濟日報","tm":"11/23 09:21","c":3,"r":"tw","u":"https://money.udn.com/money/story/5612/9895530","p":1795393282,"a":1795403749,"t":"美股費半重挫10%　投顧：關注禁空令與國安基金護盤","su":"인공지능(AI) 관련 종목에 대한 매도압력이 계속됐다. 미국 증시는 20일 야간거래에서 필라델피아 반도체(전자기기의 두뇌 부품)지수가 10.73%, 대만지수 선물(미래 값을 미리 정해 사고파는 거래)이 1,881포인트 하락하는 등 급락세를 보였다. 오늘 금융감독위원회..."},{"s":"AI 매도세가 아시아 증시를 뒤흔들면서 미국 선물은 반등했습니다.","so":"Reuters","tm":"11/23 08:44","c":3,"r":"us","u":"https://www.reuters.com/world/china/global-markets-global-markets-2026-11-22/","p":1795391040,"a":1795403736,"t":"US futures bounce as AI rout rattles Asian stocks"},{"s":"'미국 부채' 미국 증시 급락에 위험회피 물결 촉발, 수익률 5% 밑으로 하락 - 뉴스콘텐츠-펀드","so":"MoneyDJ","tm":"11/23 08:11","c":3,"r":"tw","u":"https://www.moneydj.com/funddj/ya/yp050000.djhtm?a=116BD32F-B713-4C65-AA44-730E6FAD43EC","p":1795389060,"a":1795389875,"t":"《美債》美股重挫引發避險潮 殖利率跌破5%-新聞內容-基金","su":"'미국 부채' 미국 주식이 폭락하면서 위험 회피 심리가 촉발되고 수익률이 5% 미만으로 떨어졌습니다. oneyDJ News 2026-11-23 06:22:28 리옌진은 20일 미국 증시가 급락했다고 발표했다. 특히 기술주 매도 압력이 심해 안전을 위해 채권시장으로 자금이 유입됐고, 미국 국채 금리(나라가 돈 빌릴 때 내는 이자 비율)가 급락하는 등 10년 만기 국채 금리가 0.12%포인트(퍼센트끼리 뺀 차이) 하락했다."},{"s":"Liu Siming: 미국 주식이 매도세를 보이고 있으며, 2018년 중간선거에서 교훈을 얻었습니다. - 20261123 - Newspaper content","so":"明報財經網","tm":"11/23 05:33","c":3,"r":"hk","u":"https://finance.mingpao.com/fin/daily/20261123/1795366390216/%E5%8A%89%E6%80%9D%E6%98%8E-%E7%BE%8E%E8%82%A1%E6%8D%B1%E6%B2%BD-%E5%80%9F%E9%8F%A12018%E5%B9%B4%E4%B8%AD%E6%9C%9F%E9%81%B8%E8%88%89","p":1795379600,"a":1795389880,"t":"劉思明：美股捱沽 借鏡2018年中期選舉 - 20261123 - 報章內容"},{"s":"미국 주가지수 선물은 상승세로 출발","so":"Jiemian.com","tm":"11/22 23:09","c":3,"r":"cn","u":"https://m.jiemian.com/article/15359480.html","p":1795356587,"a":1795389868,"t":"美股股指期货高开","su":"등록/로그인 개인 센터 홈 세계 중국 매크로 엔터테인먼트 스포츠 패션 문화 여행 생활 게임 비뚤어진 건물 데이터 정오 예술 비즈니스 기술 자동차 부동산 증권 금융 소비 산업 운송 투자 마케팅 직장 관리 기업가 정신 해외 부동산 시장 부 건강 광역 베이지역 주류 산업 블록체인 ESG 싱크탱크 더 많은 뉴스 인기 기사 비디오 사진 주문 요청 특별 주제 라이브 앱 원본 뉴스 다운로드 미국 주가 지수 선물이 상승세(오르는 흐름)를 보였습니다. 미국 주가지수 선물은 나스닥(미국 기술 회사들이 많은 주식시장) 선물이 2%까지 상승폭을 확대하면서 상승세를 보였습니다. 광고 등 상업적 협력을 원하시면 여기를 클릭해주세요. 공식 승인 없이 이 기사를 재인쇄하는 것은 엄격히 금지되며, 침해할 경우 기소될 것입니다."},{"s":"“이미 속이 시커먼데 또 검은 월요일?”…주말 美증시 투매에 ‘벌벌’","so":"매일경제 마켓","tm":"11/22 17:48","c":3,"r":"kr","u":"https://stock.mk.co.kr/news/view/1203789","p":1795337288,"a":1795351379,"su":"“이미 속이 시커먼데 또 검은 월요일?”…주말 美증시 투매에 ‘벌벌’ 정석환 기자(hwani84@mk.co.kr) 입력 : 2026.11.22 17:48:08 글로벌 증시 AI發 쇼크 美반도체지수 10.7% 와르르 S&P500(미국 큰 회사 500곳 지수) 코로나 후 최장 하락 고점 대비 10% 빠져 조정 국면(고점에서 10% 넘게 내린 상태) 증권가 “미국發 유동성 악재에 외국인 코스피 매도 지속될것” 인공지능(AI) 거품 경계론이 지속되면서 지난 주말 뉴욕 증시에서 반도체주 투매가 일어났다."},{"s":"골드만삭스 \"지금은 미국 주식에 투자하기 좋은 시기지만 위험 경고\"","so":"自由時報","tm":"11/23 13:36","c":2,"r":"tw","u":"https://stock.ltn.com.tw/article/3vmxhmq0wdpz","p":1795408575,"a":1795408820,"t":"高盛：現在是美股進場好時機 但警告有風險","su":"골드만삭스 Group Inc의 트레이딩 데스크는 지난주 매도세(팔려는 힘)가 미국 주식을 매수할 수 있는 매력적인 기회를 만들었다고 말했습니다. 그러나 은행은 또한 전체 투자자 보유량이 여전히 너무 높다고 경고했는데, 이는 시장이 아직 상당한 반등을 촉발할 만큼 충분히 큰 매도세를 보지 못했을 수도 있음을 나타냅니다. 블룸버그통신은 골드만삭스의 변동성 공포지수가 20일 금요일 9.8포인트(10포인트 만점)까지 급등해 역사적 극한 수준에 근접했다고 보도했다. 헤지펀드(큰손들 돈을 모아 굴리는 투자 회사)는 투자 익스포저를 대폭 줄였고, 은행의 프라임 브로커들은"},{"s":"\"장중 분석\" 미국 주식 선물 반등, 정부 지원으로 바닥 깨고 포인트 상장 OTC 주식 수천 급등","so":"旺得富理財網","tm":"11/23 13:15","c":2,"r":"tw","u":"https://wantrich.chinatimes.com/news/20261123900185-420101","p":1795407311,"a":1795408824,"t":"《盤中解析》美股期指彈、政府護盤破底翻噴千點- 上市櫃","su":"[타임즈 장한기 기자 타이페이 보도] 미국 주가지수는 장내 장 초반 급반등(내렸다가 다시 오르는 것) + 정부 장세를 보였으며, 대만 주가지수는 하락을 멈추고 장중 1,000포인트 이상 상승했습니다! 지난 금요일 미국 증시는 여전히 비참한 상황이었고, 이로 인해 대만 주식시장은 계속해서 공황 상태에 빠졌고, 지난주 역사상 최대 주간 하락폭을 기록했습니다. 금융당국도 연휴 기간 동안 여러 차례 단기 주문을 내며 긴축(돈줄을 죄는 것)에 나섰다. 본토와 우리 정부도 구제 대책을 내놨다. 게다가 오늘 미국 증시 지수도 장중 크게 반등해 주식시장에 안도의 한숨을 쉬게 했습니다. 오늘 대만 주식은 지난 금요일 미국 달러화에 의해 타격을 입었지만..."},{"s":"코스피, 장중 4,600대로 후퇴...미국 증시 급락 여파","so":"YTN","tm":"11/23 11:26","c":2,"r":"kr","u":"https://www.ytn.co.kr/_ln/0102_202611231126463706","p":1795400760,"a":1795403731,"su":"우리 시간으로 지난 주말 미국 증시가 큰 폭으로 내리는 등의 여파로 우리 증시가 급락세로 장을 열었습니다. 코스피(한국 대표 주식시장 지수)는 장중 낙폭을 키우며 4,600대로 내려앉기도 했는데요. 취재기자 연결해 알아보겠습니다. 윤태인 기자! 네, 한국거래소입니다. 앵커] 우리 증시가 오늘 약세(내리는 흐름)를 보이고 있죠? 네, 코스피는 오늘 2."},{"s":"트럼프와 Bessant 모두 이야기를 나누며 젠슨 황이 엔비디아로 돌아올 가능성을 높였습니다. 미국 주식 선물, 전자 거래에서 반등 - 국제","so":"旺得富理財網","tm":"11/23 11:01","c":2,"r":"tw","u":"https://wantrich.chinatimes.com/news/20261123900112-420201","p":1795399297,"a":1795403745,"t":"川普、貝森特都說話再添黃仁勳重返輝達可能性？美股期貨電子盤反彈- 國際","su":"지난 금요일(20일) 미국 증시에 '블랙프라이데이'가 터졌다. 필라델피아 반도체(전자기기의 두뇌 부품) 지수는 10.73%, 나스닥(미국 기술 회사들이 많은 주식시장) 지수는 5.28%, 엔비디아는 14.01% 급락했습니다. AI 디레버리징 폭풍이 글로벌 기술주를 휩쓸었다. 그러나 트럼프 미국 대통령이 젠슨 황이 사과 후 엔비디아로 복귀할 것이라는 희망을 공개적으로 밝히자 베센트 미 재무장관도 젠슨 황이 엔비디아로 복귀할 가능성을 배제하지 않았다. 미국 주식선물 전자거래 23일 개시…"},{"s":"힘든 한 주를 보낸 후 S&P500 선물 상승","so":"The New York Times","tm":"11/23 10:17","c":2,"r":"us","u":"https://www.nytimes.com/2026/11/22/business/ai-stocks-sp500.html","p":1795396666,"a":1795403735,"t":"S&P 500 Futures Rise After Tough Week"},{"s":"거래자들이 단기 미국 연방준비제도(연준) 금리 인상에 베팅하면서 금은 반등했습니다.","so":"The Straits Times","tm":"11/23 10:13","c":2,"r":"sg","u":"https://www.straitstimes.com/business/gold-rebounds-as-traders-pare-bets-on-near-term-us-fed-rate-hikes","p":1795396380,"a":1795403763,"t":"Gold rebounds as traders pare bets on near-term US Fed rate hikes","su":"금괴는 온스당 약 3,582달러로 1.3%나 상승했습니다."},{"s":"미국 주식형 펀드 방향이 바뀌고, 성장주가 삭감되고, 가치주의 방향이 바뀌었다.","so":"工商時報","tm":"11/23 09:59","c":2,"r":"tw","u":"https://www.ctee.com.tw/news/20261123700745-430702","p":1795395540,"a":1795403747,"t":"美股資金風向變了砍成長股、價值股迎輪動行情- 國際","su":"미국 증시는 20일 극심한 매도압력을 겪었고, AI 컨셉주가 가장 큰 타격을 입었다. 투자자들은 가치가 높은 기술주에서 철수하고 상대적으로 가치가 낮은 미국 국채와 가치주(제값보다 싸 보이는 주식)로 이동했습니다. AI 투자 열풍이 식으면서 월스트리트의 자본순환 추세가 점점 뚜렷해지고, 가치주가 시장의 새로운 선호주로 떠올랐다. 로이터는 나스닥(미국 기술 회사들이 많은 주식시장) 지수가 20일 5% 이상 폭락해 2020년 3월 이후 최대 주간 하락폭을 기록했다고 보도했다. 올해도 2% 이상 하락해 10월 초보다 급등했다."},{"s":"미국 증시는 비참한 한 주를 마감하고 나스닥 전자 거래는 700 포인트 이상 상승","so":"自由財經","tm":"11/23 09:52","c":2,"r":"tw","u":"https://ec.ltn.com.tw/article/breakingnews/5650100","p":1795395151,"a":1795403747,"t":"美股結束慘澹一週 那斯達克電子盤漲逾700點","su":"[금융채널/종합보고서] 지난 금요일(20일) 미국 증시가 하락세를 이어가며 시장의 암울한 한 주를 마감했습니다. 전자거래는 아시아시간 월요일(23일) 오전 저점에서 반등(내렸다가 다시 오르는 것)하며 나스닥(미국 기술 회사들이 많은 주식시장)이 700포인트 이상 상승했다. 다우존스 지수는 AI 주식에 대한 매도 압력이 커지면서 1.0포인트 하락했습니다."},{"s":"월스트리트 베테랑 Yardeni가 S&P500 목표를 다시 낮췄습니다. 골드만삭스는 반등 조건이 아직 준비되지 않았다고 말했습니다 | 미국 증시 동향 | 국제","so":"經濟日報","tm":"11/23 09:13","c":2,"r":"tw","u":"https://money.udn.com/money/story/123398/9895518?from=edn_newestlist_rank","p":1795392792,"a":1795408819,"t":"華爾街資深老將雅德尼再下修標普500目標 高盛稱反彈條件未齊備 | 美股動態 | 國際","su":"미국 증시가 급락하자 월스트리트 전략가 에드 야데니는 S&P500(미국 큰 회사 500곳 지수)의 연말 목표치를 약 두 달 만에 두 번째로 9월 추정 7,900포인트에서 7,500포인트로 낮췄다. 하지만 이는 여전히 지난 금요일 종가보다 8% 이상 높은 수준이다. 골드만삭스는 헤지펀드(큰손들 돈을 모아 굴리는 투자 회사)의 매도 압력으로 인해 시장이 단기 매수 지점에 가까워졌다고 믿습니다. 그러나 투자자들의 전반적인 포지션은 여전히 높으며 반등 조건은 아직 완성되지 않았습니다."},{"s":"뉴욕증시 급락…엔비디아 회계 조사에 AI 투매 확산","so":"마켓인","tm":"11/23 08:54","c":2,"r":"kr","u":"https://marketin.edaily.co.kr/News/ReadE?newsId=01492406645648672","p":1795391674,"a":1795392882,"su":"11월 23일 이데일리TV 마켓시그널지난 금요일 뉴욕증시가 AI 투자 불안과 엔비디아 회계 조사 소식에 급락했다. 다우지수는 2% 가까이, S&P500(미국 큰 회사 500곳 지수)은 3.7%가량 하락했으며 나스닥은 5% 넘게 떨어졌다. 필라델피아 반도체(전자기기의 두뇌 부품)지수도 10% 이상 급락했다. 나스닥은 올해 상승분을 모두 반납했고, S&P500은 7거래일 연속 하락하며 투자심리 위축을 드러냈다.로..."},{"s":"미국 주식 선물은 개장 전 반등했고, 나스닥 선물은 2.5% 상승했지만, 삼성SK하이닉스는 개장 전 여전히 5% 하락했다.","so":"經濟日報","tm":"11/23 08:48","c":2,"r":"tw","u":"https://money.udn.com/money/story/123398/9895497?from=edn_next_story","p":1795391309,"a":1795392889,"t":"美股期指開盤反彈 那斯達克期貨大漲2.5% 但三星SK海力士盤前仍大跌5%","su":"미국 주식 지수 선물(미래 값을 미리 정해 사고파는 거래)은 월요일 아시아 이른 아침에 상승세(오르는 흐름)로 출발하여 지난 금요일 AI 개념 주식 거래가 쇠퇴하고 미국 주식이 심한 매도 압력을 받은 후 투자자들에게 숨쉴 공간을 제공했습니다. 그러나 한국 메모리 주가는 개장 전 하락했고, 이는 개장 후에도 아시아 증시는 여전히 매도 압력에 직면할 것임을 시사합니다."},{"s":"\"미국 주식\" AI 붕괴, VIX 40 이상 급등, 필라델피아 반도체 지수 하락/나스닥 올해 하락 - 뉴스와이어","so":"MoneyDJ","tm":"11/23 07:32","c":2,"r":"tw","u":"https://www.moneydj.com/kmdj/news/newsviewer.aspx?a=512ce83a-5552-45de-831c-5db97756372f","p":1795386720,"a":1795389879,"t":"《美股》AI崩、VIX飆破40 費半瀉/那指今年翻黑- 新聞","su":"많은 기대를 모았던 AI 첨단 연구실 앤쓰로픽(앤트로픽)의 기업공개(IPO)가 시장 부양에 실패했다. 대신, 이는 투자자들이 AI가 주도하는 강세장(주가가 오랫동안 오르는 시기)에서 이익을 얻도록 유도했습니다. 미국 4대 지수가 20일 혈투를 벌이며 전 손실로 마감됐다. 그 중 나스닥(미국 기술 회사들이 많은 주식시장)지수는 올해(2026년) 상승폭을 모두 포기하고 하락세로 돌아섰는데…"},{"s":"골드만삭스 \"미국 증시는 전술적으로 진입할 수 있지만 궁극적인 매도는 아직 오지 않았다\"","so":"信報網站","tm":"11/23 06:57","c":2,"r":"hk","u":"https://www.hkej.com/instantnews/international/article/4571459/%E9%AB%98%E7%9B%9B%E6%8C%87%E7%BE%8E%E8%82%A1%E5%8F%AF%E6%88%B0%E8%A1%93%E6%80%A7%E5%85%A5%E5%A0%B4+%E6%83%9F%E7%B5%82%E6%A5%B5%E6%8B%8B%E5%94%AE%E6%9C%AA%E5%88%B0","p":1795384679,"a":1795389883,"t":"高盛指美股可戰術性入場 惟終極拋售未到","su":"골드만삭스 트레이딩 데스크는 지난주 매도세(팔려는 힘)로 인해 미국 주식을 매수할 수 있는 매력적인 기회가 생겼다는 보고서를 발표했습니다. 헤지펀드(큰손들 돈을 모아 굴리는 투자 회사)의 주식 청산 규모가 꽤 커서 '전술적 진입' 지점에 가까워지고 있다. 그럼에도 불구하고 전체 투자자 보유액은 여전히 너무 높으며 이는 급격한 반등을 촉진하는 데 필요한 대규모 매도가 아직 발생하지 않을 수 있음을 의미합니다. 보고서는 또한 몇 가지 주요 부정적인 요인이 여전히 존재하고, 전반적인 주식시장 포지션이 여전히 너무 높으며, 연준이 금리를 계속 인상할 것으로 예상되며, 인공지능 투자의 미래 수익이 여전히 불투명하다고 언급했습니다. 골드만삭스는 미국 주식이"},{"s":"미국 증시는 이번 주 3일 하프타임에 마감한다. 시장은 PCE 데이터와 쇼핑 판매에 중점을 둘 것입니다.","so":"RTHK News","tm":"11/23 06:55","c":2,"r":"hk","u":"https://news.rthk.hk/rthk/ch/component/k2/1878863-20261123.htm","p":1795384500,"a":1795389884,"t":"美股本周3日半市 市場關注PCE數據及購物銷情","su":"지난주 미국 3대 주가지수는 8~10% 이상 하락했다. 이번주는 거래일이 3일 반밖에 안 남았습니다. 미국 증시는 목요일 추수감사절 연휴로 휴장하고 금요일에는 반나절 동안 휴장합니다. '블랙 프라이데이'는 금요일에 전통적인 쇼핑 성수기를 시작하며, 소매업체가 발표하는 고객 흐름, 온라인 판매 및 할인의 변화에 시장이 주목하고 있습니다. 명절을 앞두고 각종 경제지표가 발표됩니다. 미국, 10월 개인소비량 수요일 발표…"},{"s":"나스닥 100이 약세장에 가까워짐에 따라 Dip 매수자들은 진입을 주저합니다.","so":"Bloomberg.com","tm":"11/23 05:31","c":2,"r":"us","u":"https://www.bloomberg.com/news/articles/2026-11-22/dip-buyers-hesitate-to-step-in-as-nasdaq-100-nears-a-bear-market","p":1795379504,"a":1795389863,"t":"Dip Buyers Hesitate to Step In as Nasdaq 100 Nears a Bear Market"},{"s":"야르데니, 미국 증시 목표 다시 낮춰 약세장 진입 가능성 낮아","so":"信報網站","tm":"11/23 05:27","c":2,"r":"hk","u":"https://www.hkej.com/instantnews/international/article/4571455/Yardeni%E5%86%8D%E9%99%8D%E7%BE%8E%E8%82%A1%E7%9B%AE%E6%A8%99+%E9%99%B7%E5%85%A5%E7%86%8A%E5%B8%82%E6%A9%9F%E6%9C%83%E4%BD%8E","p":1795379223,"a":1795389888,"t":"Yardeni再降美股目標 陷入熊市機會低","su":"대형 월스트리트 애널리스트이자 야데니 리서치(Yardeni Research)의 사장 겸 최고 투자 전략가인 에드 야데니(Ed Yardeni)는 S&P500(미국 큰 회사 500곳 지수)의 2026년 연말 목표를 지난 두 달 동안 두 번째로 낮췄으며, 9월 예측치 7,900포인트보다 낮은 7,500포인트로 마감할 것으로 예상된다. 하지만 지난 금요일 종가와 비교하면 여전히 8% 이상의 반등 여지가 남아 있다. Yardeni의 견해는 여전히 낙관적입니다. 예상보다 매수 기회가 많다고 설명했다. 그는 시장에 조정이 있을 것이라고 예측했지만 이는 조정일 뿐인 것으로 보인다. 현재 경기 침체(나라 경제가 쪼그라드는 것) 위험이 없는 상황에서 S&P500이 약세장에 빠질 가능성은 낮습니다."},{"s":"연준이 다음 달 금리를 인상할 가능성이 높고, 시장위험 기피 현상이 높아지고 있으며, 미국 단기채권 거래도 활발하다 | 자금 | 주식 시장","so":"UDN","tm":"11/23 04:21","c":2,"r":"tw","u":"https://udn.com/news/story/10103/9895075","p":1795375262,"a":1795389871,"t":"Fed下月升息機率高市場避險情緒升溫短天期美債交投熱絡| 基金 | 股市","su":"부정적인 뉴스가 국제 시장을 잇달아 강타했습니다. 연준 관계자들의 매파적인 연설은 12월 금리 인상에 대한 시장의 기대를 더욱 강화시켰습니다. 투자 분위기가 더욱 조심스러워지면서 일부 자금이 안정적인 수익 특성을 지닌 채권 자산으로 이동하는 현상도 발생했습니다. 11월 이후 투자신탁 통계 채권ETF(여러 주식을 묶어 파는 상품) 성과를 보면 총 32개 종목이 추세를 역행하며 플러스 수익률(넣은 돈에 비해 얻는 이익 비율)을 기록했다. 11월 이후 일평균 거래량 기준으로 듀레이션이 짧고 금리 민감도가 낮으며 인컴이 좋은 비투자채권, 단기채권, 투자등급 산업채 ETF 등이 활발하게 거래됐다."},{"s":"S&P500 지수가 사상 최고치에 근접했습니다. 내가 판매하는 것이 아니라 기대치를 낮추는 이유는 다음과 같습니다.","so":"Yahoo Finance","tm":"11/23 02:46","c":2,"r":"us","u":"https://finance.yahoo.com/markets/stocks/articles/p-500-just-whipsawed-near-174621152.html","p":1795369581,"a":1795392885,"t":"The S&P 500 Just Whipsawed Near a Record High. Here’s Why I’m Lowering My Expectations, Not Selling.","su":"S&P500(SNPINDEX:^GSPC)의 변동성(값이 크게 출렁이는 정도)은 중간선거 이후 더욱 높아졌습니다. 그 주에는 2025년 4월 이후 지수가 최악이었고, 현재는 사상 최고치보다 약 10% 낮은 수준에 머물고 있습니다. 이러한 변동성은 S&P500이 사상 최고치에 근접할 때 일반적으로 발생하지 않습니다."},{"s":"지난 금요일 미국 주식이 폭락했습니다. 오늘 아시아 금융시장은 총력을 다하고 있습니다. 대만과 한국은 주말 동안 긴급 대책을 논의하고 있다.","so":"經濟日報","tm":"11/23 02:35","c":2,"r":"tw","u":"https://money.udn.com/money/story/5599/9895213","p":1795368927,"a":1795389872,"t":"美股上周五崩跌 亞洲金融市場今日全面戒備 台、韓周末緊急研商對策","su":"미국 증시는 지난 금요일(20일) 폭락했고, 아시아 금융시장은 오늘(23일) 시장 동향을 예의주시하고 있다. 주식시장이 AI 공급에 크게 의존하는 대만과 한국은 주말에 긴급 회의를 열어 시장 상황을 논의하고 시장 안정화 대책을 도입했습니다. 본토 규제당국은 어제(22일) '시장 안정을 위한 세 가지 화살'을 내놓기도 했다."},{"s":"미국 주식이 폭락했어요! 법인: \"단기 금지\"는 대만 주식의 유동성에 해를 끼칩니다. 기다려서 보는 것이 좋습니다.","so":"自由財經","tm":"11/22 16:17","c":2,"r":"tw","u":"https://ec.ltn.com.tw/article/breakingnews/5649562","p":1795331860,"a":1795334498,"t":"美股重挫！法人：「禁空令」不利台股流動性 建議觀望","su":"[왕멍룬 기자/타이베이리포트] 최근 대만 증시가 급락세를 보이고 있다. 시차로 인해 대만 시간 토요일 이른 아침에 마감한 '필라델피아 반도체(전자기기의 두뇌 부품) 지수'가 하루 만에 10.73% 급락해 11월 23일(월) 대만 증시를 '폭락'시켰습니다! 법인은 과거 금융감독위원회가 항공제한명령을 내린 후,"},{"s":"미국 주식에 대한 팁 | 빅스(VIX)가 폭발한다! 공황 매도가 시장을 휩쓸고 있는데, 나스닥은 '곰의 문 두드리는 소리'를 견딜 수 있을까?","so":"第一财经","tm":"11/22 15:27","c":2,"r":"cn","u":"https://www.yicai.com/news/103449207.html","p":1795328875,"a":1795334496,"t":"美股点金丨VIX爆表！恐慌抛售席卷市场，纳指能否顶住“熊敲门”","su":"이번주 미국 증시는 크게 하락했다. 엔비디아는 강력한 수익을 발표했고 인공지능 스타트업인 앤트로픽은 역사상 최대 규모의 기업공개(IPO)를 기록했지만 여전히 연준의 매파적인 태도로 인한 우려를 상쇄하지 못했습니다. S&P500(미국 큰 회사 500곳 지수)과 다우존스 산업평균지수는 조정 국면에 진입했고, 나스닥은 기술적 약세장에 접근하고 있었습니다. 시장 변동성을 측정하는 패닉지수 VIX는 한때 40을 돌파하기도 했다. 투자자들은 반도체 회사와 소프트웨어 인프라 주식의 급격한 매도 속에서 미국 부채로 피난처를 찾았습니다. 다음 주에 발표되는 개인소비지출(PCE) 데이터는 지난 주의 10월 인플레이션(물건값이 계속 오르는 것) 보고서가 예상보다 높았던 이후 연준의 통화 정책 방향을 더욱 명확하게 반영할 수 있습니다. 단기 급락 이후 시장 심리가 회복되기까지는 시간이 걸릴 수 있다."},{"s":"6조 달러의 시가총액이 사라졌습니다! 트럼프 \"미국 증시 100% 하락 책임은 민주당에 있다\"","so":"财联社","tm":"11/22 14:12","c":2,"r":"cn","u":"https://www.cls.cn/detail/2541103","p":1795324320,"a":1795392888,"t":"6万亿美元市值灰飞烟灭！特朗普发声：美股下跌100%怪民主党","su":"① 트럼프 미국 대통령은 최근 미국 증시 하락세를 민주당의 중간선거 승리 탓으로 돌렸다. ② 그는 11월 3일 민주당의 승리 이후 시장이 6조 달러 이상 하락했다고 지적했다. ③ 베센트 미국 재무장관은 미국 증시의 하락이 초지능(SI)에 대한 민주당의 불안한 입장과 매파적(금리를 올리자는 쪽)인 연준을 포함한 \"요인들의 조합\"일 수 있다고 말했다. 차이롄서, 11월 23일(편집자 Bian Chun) 트럼프 미국 대통령은 6조 달러에 달하는 미국 증시 가치 손실을 민주당의 중간선거 승리 탓으로 돌렸다. 이번 선거 결과로 당은 하원과 상원을 다시 장악하게 됐다. 트럼프 대통령은 일요일 트루스소셜(Truth Social)에 “11월 3일 민주당의 다소 기이한 승리 이후 시장은 6조 달러 이상 하락했다”고 썼다. \"나스닥(미국 기술 회사들이 많은 주식시장)만 해도 20% 하락했습니다. 민주당이 반성장, 보복 정책 등을 추구하기 때문에 '나쁘기' 때문에 이는 100%입니다.\" \"빨리 변화하지 않으면 상황은 더욱 악화될 뿐입니다. 하지만 두려워하지 마세요. 중국는 곧 다시 강해질 것입니다. 좋은 일이 많이 일어나고 있습니다.\" 트럼프는 말했다."},{"s":"앤트로픽의 상장은 주식시장의 급락을 막지 못했습니다. 월스트리트는 AI 투자를 절약할 수 있는 것이 무엇인지 묻는다 | 미국 증시 동향 | 국제","so":"經濟日報","tm":"11/22 11:49","c":2,"r":"tw","u":"https://money.udn.com/money/story/123398/9893972","p":1795315764,"a":1795334505,"t":"Anthropic 上市未能止住股市暴跌 華爾街追問什麼能拯救 AI 交易 | 美股動態 | 國際","su":"이 글은 총 2,750 단어로 구성되어 있습니다. 블룸버그경제신문은 블룸버그와 손잡고 글로벌 실시간 금융뉴스, 시사분석, 연예인 칼럼을 제공합니다. 원스톱 독서와 세상과의 동기화. 독점 콘텐츠를 무료로 시청하세요. 남은 기사는 회원으로 로그인하세요. ※ 기사 링크를 다시 게시하거나 다시 게시할 수 있습니다. 무단으로 기사 내용을 복사 및 재게시하지 마세요. 디지털 구독🎉 5주년 기념 ✨신규 구독자는 구독 시 100위안을 받고 iPhone 18 Pro를 받습니다. ✨기존 구독자는 완자푸에서 NT$1,000를 보너스로 받습니다. 앞으로도 모든 변동에 계속 함께하겠습니다👍 페이지로 이동"},{"s":"[뉴스프레소] 다우·S&P500 조정장 진입… 나스닥 5% 폭락, 추가 하락 가능성도? - 머니투데이","so":"머니투데이","tm":"11/23 14:10","c":1,"r":"kr","u":"https://www.mt.co.kr/world/2026/11/23/2026112312167073113","p":1795410602,"a":1795411358,"su":"▶ 나스닥 하루 5% 넘게 급락…연초 수익률도 마이너스로 나스닥은 지난주 약 10% 하락하며 연초 대비 수익률이 ?2.7%로 돌아섰습니다. S&P500(미국 큰 회사 500곳 지수)도 7거래일 연속 내리며 고점 대비 10% 이상 하락한 조정 국면(고점에서 10% 넘게 내린 상태)에 진입했습니다."},{"s":"사상 최대 규모의 기업공개(IPO)도 구할 수 없다! 나스닥은 4조 달러 손실을 입혔는데, 미국 증시는 왜 완전히 통제 불능 상태인가?","so":"商業周刊","tm":"11/23 14:08","c":1,"r":"tw","u":"https://www.businessweekly.com.tw/business/blog/3023627","p":1795410489,"a":1795411363,"t":"史上最大IPO也救不了！那斯達克蒸發4兆美元，美股為何全面失控？","su":"월스트리트의 인공지능(AI) 강세장(주가가 오랫동안 오르는 시기)은 최근 몇 주 동안 변동성이 심했습니다. AI 산업의 가치 평가, 데이터센터(컴퓨터 수만 대를 모아 둔 건물) 구축, 실적 전망에 대한 투자자들의 우려가 커지고 있다. 미국 증시를 최고치까지 끌어올리던 'AI 트레이딩 붐'이 시장을 휩쓸고 있는 격렬한 매도 물결로 진화했다."},{"s":"美 증시 패닉지수 9.8 급등…골드만삭스 반등 가능성 진단","so":"스페셜경제","tm":"11/23 13:56","c":1,"r":"kr","u":"https://www.speconomy.com/news/articleView.html?idxno=420316","p":1795409772,"a":1795411358,"su":"스페셜경제=박숙자 기자 | 미국 증시가 급락하면서 투자심리가 극도로 위축된 가운데 글로벌 투자은행 골드만삭스가 주식시장의 단기 매수 기회가 가까워졌다는 분석을 내"},{"s":"젠슨 황과 그의 아내는 8억 7천만 개의 엔비디아 주식을 보유하고 있습니다! 눈에 띄지 않는 아내가 중요한 역할을 하고 세금 절감 비법이 드러났습니다 | 미국 증시 동향 | 국제","so":"經濟日報","tm":"11/23 13:31","c":1,"r":"tw","u":"https://money.udn.com/money/story/123398/9896111?from=edn_newest_index","p":1795408294,"a":1795408822,"t":"黃仁勳夫婦握8.7億股輝達！低調妻扮關鍵角色 節稅手法曝光 | 美股動態 | 國際","su":"월스트리트저널은 22일 엔비디아 창업주 젠슨 황이 혼외 관계 폭로로 사임한 뒤 주가가 28% 급락해 그와 아내 롤리의 재산 수십억 달러가 손실됐다고 보도했다. 그러나 부부는 여전히 신탁, 회사, 자선 재단을 통해 약 8억 7천만 개의 엔비디아 주식을 직간접적으로 통제하고 있습니다. 최근 시가총액(회사 전체 몸값)은 1,090억 달러(대략 NT$ 3조 4천억)를 넘어섰습니다. 조사 결과, 항상 조용히 지내던 롤리가 실제로는 이 거대한 가족 부 제국의 핵심 인물이라는 사실이 밝혀졌습니다. 부부는 이르면 희이다 창업 2년 만에 재산을 다음 세대에 물려줄 계획을 세우기 시작했고, 앞으로 발생할 수 있는 막대한 세금 부담을 줄이기 위해 주가 급등 전에 미리 준비를 했다."},{"s":"아시아 증시는 S&P500이 조정으로 3.7% 하락한 후 대부분 하락","so":"Yahoo! Finance Canada","tm":"11/23 13:27","c":1,"r":"us","u":"https://ca.finance.yahoo.com/news/asian-shares-mostly-fall-p-042755048.html","p":1795408020,"a":1795408813,"t":"Asian shares mostly fall after S&P 500 drops 3.7% into a correction","su":"금요일 인공지능(AI) 주식의 잔혹한 매도로 S&P500(미국 큰 회사 500곳 지수)이 3.7% 하락한 후 월요일 아시아 증시는 대부분 하락세를 보였습니다."},{"s":"젠슨 황의 최악의 주식 시장 붕괴는 끝났습니까? 전문가들이 밝히는 월스트리트 매각의 내막: 어떤 사람들은 가만히 있을 수 없다 - 금융","so":"中時新聞網","tm":"11/23 13:22","c":1,"r":"tw","u":"https://www.chinatimes.com/realtimenews/20261123002262-260410","p":1795407721,"a":1795411364,"t":"黃仁勳引爆股災最壞已過？專家揭華爾街拋售內情：有人快坐不住- 財經","su":"대만 증시는 하락세를 이어갔다. 오늘(23일) 오전 거래에서는 35,442.41포인트까지 하락했습니다. 올해 10월 6일 최고치인 49,968.92에서 점점 멀어지고 있다. 불과 한 달여 만에 14,500포인트 가량의 폭락이 꽤 무섭습니다. 일반 경제학자 Wu Jialong은 페이스북에 대만과 미국 기술주의 지속적인 하락세는 주로 엔비디아의 처형에 따른 것이라고 게시했습니다."},{"s":"현지 규제 당국이 매도세를 막기 위해 서두르면서 아시아 주식은 다시 하락했습니다.","so":"The Business Times","tm":"11/23 13:05","c":1,"r":"sg","u":"https://www.businesstimes.com.sg/companies-markets/capital-markets-currencies/stocks-asia-drop-again-local-regulators-rush-stem-rout","p":1795406700,"a":1795408832,"t":"Stocks in Asia drop again as local regulators rush to stem rout"},{"s":"대만 주식 시장 보호 2/AI 영구 운동 기계가 실패합니다. 전문가들은 왜 미국 증시가 회복되지 않으면 대만 주식시장도 좋아지기 어려울 것이라고 말하는가? | 심층보고 | 특별 주제","so":"經濟日報","tm":"11/23 12:58","c":1,"r":"tw","u":"https://money.udn.com/money/story/124480/9895883","p":1795406293,"a":1795408825,"t":"台股護盤2／AI 永動機失靈 為什麼專家說美股不回神 台股也難有好氣色？ | 深度報導 | 專題","su":"젠슨 황 사건은 AI 업계의 투자 의구심을 더욱 심화시켰고, 앤트로픽의 영광스러운 상장(주식시장에 처음 들어오는 것)도 매도 압력을 막을 수는 없었습니다. 미국 증시는 큰 손실을 입었습니다. 대만은 미국 AI 산업 공급망(부품·재료가 오가는 연결망)의 핵심 도시이며 가장 큰 타격을 입었습니다. 정부는 증시 보호 대책을 잇따라 내놨다. 하지만 AI 버블이 깨지면 정책적 지원이 미국 AI 산업을 살릴 수 있을까? 미국 주식을 살릴 수 있을까?"},{"s":"Juheng Investment Radar》AI 파이낸싱에 변수 추가, 대만·미국 증시 급락에 투자 줄여야 하나?","so":"鉅亨網","tm":"11/23 12:11","c":1,"r":"tw","u":"https://news.cnyes.com/news/id/6670037","p":1795403489,"a":1795403751,"t":"鉅亨投資雷達》AI 融資添變數，台美股急跌後該減碼嗎？","su":"엔비디아는 금융 기관과 협력하여 5,000억 달러가 넘는 AI 금융 플랫폼을 구축했지만, 모금된 자금 규모는 아직 발표되지 않았습니다.\n대출이 지연되면 클라우드 기업은 칩 조달과 자본 지출(공장·장비 등에 쓰는 큰돈)을 지연시킬 수 있다. 브로드컴은 구글용 칩을 설계하고 있으며 출하량이 하향 조정될 수 있다는 보고가 있습니다.\n시장에서는 AI 확산 둔화가 미국과 대만의 반도체(전자기기의 두뇌 부품) 수주와 이익을 위축시킬 것을 우려하고 있어 매도 압력이 두 곳 모두 주식시장으로 확산됐다."},{"s":"미국 증시는 변동성이 더 클 수 있습니다! VIX는 40 가까이 급등해 2025년 4월 이후 최고치를 기록했다. 옵션 거래자들은 적극적으로 전쟁을 준비하고 있다.","so":"鉅亨網","tm":"11/23 12:00","c":1,"r":"tw","u":"https://news.cnyes.com/news/id/6669975","p":1795402808,"a":1795403754,"t":"美股恐更震盪！VIX飆近40創2025年4月來最高 選擇權交易員積極備戰","su":"나스닥 100은 목요일과 금요일에 약 8% 하락했고, S&P500(미국 큰 회사 500곳 지수)은 고점 대비 10% 이상 하락했으며, VIX는 2025년 4월 관세 폭풍 이후 최고 수준으로 상승했습니다.\n이번 매도세(팔려는 힘)는 미국 채권수익률 상승, 민주당 중간선거 승리에 따른 AI 규제 강화 전망, 앤트로픽의 기업공개(IPO) 이후 시장의 AI 투자 냉각에 의해 주도됐다.\n뱅크오브아메리카는 0DTE 매도와 낮은 상관관계가 평온함을 뒷받침했지만 완충 장치가 실패했으며 개별 주식 위험이 지수 위험으로 확대될 수 있다고 말했습니다."},{"s":"나스닥은 이틀 만에 8% 하락, VIX 급등, 월스트리트는 교차 자산 매도를 유발할 수 있는 \"시장 취약성\" 경고","so":"香港經濟日報HKET","tm":"11/23 11:54","c":1,"r":"hk","u":"https://inews.hket.com/article/4229251/us-stocks-selloff-nasdaq-vix-spike-0dte-options-ai","p":1795402452,"a":1795403754,"t":"納指兩日插8%VIX飈升華爾街警告「市場脆弱性」恐掀跨資產拋售"},{"s":"항셍지수는 400포인트 하락하며 22,000을 넘었습니다. 미국 증시 폭락으로 패닉이 급증했다. 알리바바와 메이투안은 4% 이상 하락했다.","so":"etnet 經濟通","tm":"11/23 11:45","c":1,"r":"hk","u":"https://www.etnet.com.hk/www/tc/news/categorized_news_detail.php?newsid=202611230005&category=push","p":1795401920,"a":1795403756,"t":"恒指挫400點穿22000，美股崩跌拖累恐慌急升，阿里美團挫逾4%","su":"2026/11/23 10:41 항셍지수는 400포인트 하락하며 22,000을 넘었습니다. 미국 증시 폭락으로 패닉이 급증했고, 알리바바 메이투안은 4% 이상 하락했다. 미국 주식 종가: 11월 26일, 11월 27일(오후 1시) 1075억 1500만 941억 7000만(87.529%) 26억 7700만(2.490%) 107억 3100만(9.981%) 즉시 업데이트: 2458억 8200만 691억 4700만(28.122%) 최신 인기 에넷 TV 파이낸셜 뉴스 댓글 주제 통찰력 Life DIVA Healthy Life 홍콩의 좋은 장소 면책 조항: 이 콘텐츠는 기존 시장 데이터 및 뉴스 소스를 기반으로 인공 지능에 의해 생성되었으며 참고용입니다. 해당 내용은 \"Economics\"의 견해나 입장을 대변하지 않으며, 어떠한 투자 조언도 구성하지 않습니다. AI가 생성한 정보에는 오류, 누락, 일탈 등이 있을 수 있으므로, 투자 결정을 내리기 전에 사용자가 직접 해당 내용을 확인하거나 전문가의 조언을 구해야 합니다. \"이코노믹스\"는 본 내용을 신뢰하여 발생하는 어떠한 손실이나 손해에 대해서도 책임을 지지 않습니다."},{"s":"중국, 주식 유동성 강화를 위해 증거금 요건을 80%로 낮춤","so":"Bloomberg.com","tm":"11/23 11:42","c":1,"r":"us","u":"https://www.bloomberg.com/news/articles/2026-11-22/china-lowers-margin-requirement-to-80-to-boost-stock-liquidity","p":1795401720,"a":1795403732,"t":"China Lowers Margin Requirement to 80% to Boost Stock Liquidity"},{"s":"월스트리트와 경쟁하다 - Wen Jie | AI 풀기 물결이 미국 주식을 강타했지만 월마트의 밸류에이션은 매력적이지 않습니다(영상)","so":"etnet 經濟通","tm":"11/23 11:40","c":1,"r":"hk","u":"https://www.etnet.com.hk/www/tc/news/news-article.php?section=features&category=interview&newsid=417745","p":1795401600,"a":1795403757,"t":"比拼華爾街－溫傑 | AI拆倉潮重挫美股，沃爾瑪估值未見吸引（有片）","su":"월스트리트에서의 경쟁 - Wen Jie | AI 풀기 물결이 미국 주식을 강타했지만 월마트의 밸류에이션이 매력적이지 않다(일부) 지난 금요일(20일) 미국 주식이 급락했고, 인공지능(AI) 컨셉주도 매도됐다. 나스닥은 5.28% 하락했고, 나스닥 100 지수는 5.61% 하락해 역사적 최고치보다 거의 20% 하락했습니다. S&P500(미국 큰 회사 500곳 지수)과 다우지수는 각각 3.7%, 949포인트 하락했고, 필라델피아 반도체 지수는 10.73% 하락했다. 시장에서는 AI 분야 포지션 청산파가 확대될 것을 우려하며 금리 인상 기대감이 한때 뜨거워졌다. 기술주는 시장에서 가장 큰 타격을 입은 분야가 되었습니다. 시장은 엔비디아에 대해 계속해서 우려하고 있습니다. 엔비디아가 계속해서 시장의 초점이 되고 있습니다. 그룹은 젠슨 황이 CEO직을 사임한 후 첫 결과를 발표했습니다. 2027회계연도 3분기(10월 말 기준) 매출은 전년 동기 대비 103% 급증한 1,158억 달러, 순이익은 2배 이상 증가한 653억 달러로 모두 시장 기대치를 뛰어넘었다. 또한 경영진은 AI 인프라에 대한 수요가 여전히 강하다는 점을 반영하여 다음 회계연도 매출 성장 전망을 70%에서 75%로 높이고 자사주 매입(회사가 자기 주식을 다시 사는 것) 계획을 1,500억 달러로 늘리겠다고 발표했습니다."},{"s":"미국 증시는 마지막 거래일에 '블랙프라이데이'를 만났다. 나스닥은 하루 만에 5.28% 하락했다. 주요 3개 지수 모두 기술적 조정에 들어갔습니다. 서던자산운용 서던투자컨설팅이 AI 트레이딩 리프라이싱의 글로벌 전파에 주목하고 있다.","so":"Jiemian.com","tm":"11/23 11:39","c":1,"r":"cn","u":"https://www.jiemian.com/article/15360381.html","p":1795401555,"a":1795403738,"t":"美股上一交易日遭遇“黑色星期五”，纳指单日跌5.28%，三大指数均进入技术性回调，南方基金司南投顾关注AI交易重定价的全球传导","su":"중국남방펀드의 자회사인 신안투자컨설팅은 외부 충격에 따른 스타일 전환 속도에 주목하고, 포트폴리오 배분을 통해 배당(회사가 주주에게 나눠주는 돈)금과 성장 익스포저의 균형을 맞춰 투자자들이 변동성(값이 크게 출렁이는 정도)이 심화될 때 자신의 위험 허용 범위에 맞는 속도를 유지할 수 있도록 돕습니다."},{"s":"‘AI 패닉셀’ 美증시 조정 진입…월가, 연준 추가 금리인상 베팅","so":"헤럴드경제","tm":"11/23 11:37","c":1,"r":"kr","u":"https://biz.heraldcorp.com/article/10946066","p":1795401455,"a":1795403731,"su":"미국 증시가 인공지능(AI) 투자 과열에 대한 회의론과 연방준비제도(Fed·연준)의 추가 금리(돈을 빌릴 때 내는 이자 비율)인상 우려가 맞물리며 급격한 조정 국면(고점에서 10% 넘게 내린 상태)에 들어섰다. AI 산업의 수익성에 대한"},{"s":"아시아에서 기술주 매도세 심화","so":"Financial Times","tm":"11/23 11:17","c":1,"r":"world","u":"https://www.ft.com/content/0f5a7285-fbf1-4120-86df-c9cca29644fc?syn-25a6b1a6=1","p":1795400229,"a":1795403764,"t":"Tech stock sell-off deepens in Asia"},{"s":"'국제금융' 역사적 경험: 미국 주식 버블은 위험하지만 AI 버블은 아니다","so":"工商時報","tm":"11/23 11:16","c":1,"r":"tw","u":"https://www.ctee.com.tw/news/20261123700885-430701","p":1795400160,"a":1795408826,"t":"《國際金融》歷史經驗：美股泡沫有危險 但非AI泡沫","su":"[타임즈 장차오친 외신종합보도] 2022년 약세장(주가가 오랫동안 내리는 시기)이 바닥을 친 이후 지난 4년 동안 다우존스 지수는 지금까지 90% 상승했고, 벤치마크 S&P와 나스닥(미국 기술 회사들이 많은 주식시장)도 2배 이상 상승했다. AI 인프라가 이러한 주식 시장 상승의 주요 원인이지만 이것이 유일한 이유는 아닙니다. 역사적으로 낮은 한계 법인세율이 기업 주식 환매 활동, 주식 분할 및 기록적인 기업공개(IPO)를 자극했으며, 이 모든 것이 소매 투자자의 열정을 불러일으켰습니다."},{"s":"청와대 \"조희대 탄핵, 국회 사안…증시 불안은 미국 증시와 연동\"","so":"뉴스핌","tm":"11/23 11:12","c":1,"r":"kr","u":"https://www.newspim.com/news/view/20261123000520","p":1795399920,"a":1795403731,"su":"[서울=뉴스핌] 김미경 기자 = 청와대는 23일 더불어민주당 주도로 진행되는 조희대 대법원장 탄핵과 관련해 \"국회에서 논의할 사안\"이라고 선을 그었다. 또 코스피(한국 대표 주식시장 지수) 하락세와 관련해서는 \"이번 증시 불안정은 미국 증시와 연동된 측면이 있는 것으로 안다\"고"},{"s":"신흥 시장 주식은 2026년 AI 매도 이익을 지울 예정","so":"Bloomberg.com","tm":"11/23 11:12","c":1,"r":"us","u":"https://www.bloomberg.com/news/articles/2026-11-23/emerging-market-stocks-set-to-erase-2026-gains-on-ai-selloff","p":1795399920,"a":1795408814,"t":"Emerging-Market Stocks Set to Erase 2026 Gains on AI Selloff"},{"s":"미국 증시, AI 거품 붕괴 논쟁에 투자 위험 재평가…기업이익 호조에도 주가 급락","so":"아시아투데이","tm":"11/23 11:02","c":1,"r":"kr","u":"https://www.asiatoday.co.kr/kn/view.php?key=20261123010008710","p":1795399346,"a":1795403731,"su":"【기사 요약】▲ WSJ는 데이터센터(컴퓨터 수만 대를 모아 둔 건물)와 관련 공급업체의 ‘미니 거품’이 꺼졌지만, AI 시장 전체의 붕괴 여부는 불확실하다고 분석했다.▲ 블룸버그는 S&P500(미국 큰 회사 500곳 지수) 기업의 3분기 이익이 33.3% 늘었는데도 실적 발표 기간 지수가 8.1% 하락했다고 보도했다.▲ FT는 AI.."},{"s":"대만 주식, 최소 30년 만에 가장 큰 레버리지 해소","so":"Bloomberg.com","tm":"11/23 10:55","c":1,"r":"us","u":"https://www.bloomberg.com/news/articles/2026-11-23/taiwan-stocks-see-biggest-leverage-unwind-in-at-least-30-years","p":1795398900,"a":1795411359,"t":"Taiwan Stocks See Biggest Leverage Unwind in at Least 30 Years"},{"s":"[미국 증시 대지진] 미국 증시의 추수감사절 연휴 거래 단축으로 변동성 증폭될 수도, 나스닥100 변동성 지표가 6년여 만에 최고치 기록","so":"etnet 經濟通","tm":"11/23 10:49","c":1,"r":"hk","u":"http://www.etnet.com.hk/www/tc/news/news-article.php?section=categorized&category=macro&expert=&newsid=20261123936","p":1795398540,"a":1795403759,"t":"【美股大地震】美股感恩節假期交易縮短恐放大波動，納指100波幅指標創逾六年高","su":"2026년 11월 23일 09:49 [미국. 주식시장 지진] 미국 주식의 추수감사절 연휴 거래 단축으로 변동성이 증폭될 수 있어 나스닥 100 변동성 지표가 6년여 만에 최고치를 기록했다. 월스트리트는 이번 주 추수감사절 연휴에 돌입했고, 미국 증시는 격렬한 자본 순환을 겪은 뒤 엄청난 압박을 받고 있다. 젠슨 황 엔비디아 CEO 사임과 민주당의 중간선거 압승이 잇따라 시장을 강타하면서 기술주가 지배하는 나스닥 100 지수가 약세장(주가가 오랫동안 내리는 시기)에 접어들면서 예상 변동성 지표가 2020년 4월 이후 최고 수준으로 올랐다. 지난 금요일(20일) S&P500(미국 큰 회사 500곳 지수) 지수와 다우존스 산업평균지수가 모두 기술적 조정 범위, 즉, 최고점에서 최소 10% 되돌림; 흔히 '공포지수'로 알려진 시카고보드 옵션거래소 변동성지수(VIX)는 지난 금요일 35를 넘어 마감해 2025년 이후 최고치를 기록했다."},{"s":"미국 증시 지진 | 워시가 금리를 올리는 데 큰 실수를 저질렀나요? 베선트는 연준이 매파적이며 경제를 위험에 빠뜨리고 있으며 금융 환경이 크게 강화되었다고 직접 비난했습니다.","so":"etnet 經濟通","tm":"11/23 10:45","c":1,"r":"hk","u":"https://www.etnet.com.hk/mobile/tc/news/topic_news_detail.php?category=focus&newsid=417735","p":1795398300,"a":1795403761,"t":"美股大地震 | 沃什加息犯大錯？貝森特直斥聯儲局鷹派危及經濟，金融環境大幅收緊","su":"2026년 11월 23일 09:45 미국 증시 지진 | 워시가 금리 인상에 큰 실수를 저질렀다고? 베선트는 연준이 매파적이며 경제를 위험에 빠뜨리고 금융 상황을 심각하게 긴축하고 있다고 직접 비난했습니다. 베선트 미국 재무장관은 일요일(22일) 인터뷰에서 연준이 최근 인플레이션(물건값이 계속 오르는 것) 지표에 맞춰 통화정책을 과도하게 긴축할 경우 정책 실수를 저지르고 미국 경제를 위험에 빠뜨릴 수 있다고 경고했다. 그는 또한 금융 시스템이 취약한 징후를 보이고 있다고 지적했습니다. (etnet 사진) 베선트는 최근 몇 주 동안 중앙은행 총재들이 일련의 매파적 발언을 해왔다고 언급했으며, 지난 몇 달 동안 금융 상황이 상당히 긴축되었다는 점을 지적했습니다. 현재 많은 연준 관계자들은 계속되는 물가 압력을 이유로 12월에 금리를 다시 인상하는 것에 대한 지지를 표명했습니다. 그 중 크리스토퍼 월러(Christopher Waller) 연준 총재는 최근 당국이 12월에 금리를 0.5%포인트(퍼센트끼리 뺀 차이) 인상하는 것을 고려해야 한다고 반복했습니다. 다른 관료들은 규모는 작지만 지속적인 금리 인상을 옹호했습니다."},{"s":"Ed Yardeni가 두 달 만에 두 번째로 S&P500 목표를 하향 조정했습니다. 그 이유는 다음과 같습니다.","so":"CNBC TV18","tm":"11/23 10:30","c":1,"r":"us","u":"https://www.cnbctv18.com/market/ed-yardeni-cuts-sp-500-target-for-second-time-in-just-over-two-months-20039498.htm","p":1795397449,"a":1795403733,"t":"Ed Yardeni cuts S&P 500 target for second time in just over two months - Here's why","su":"Yardeni Research의 Ed Yardeni 사장은 기술주 매도세 속에서 2026년 S&P500(미국 큰 회사 500곳 지수) 전망치를 7,500으로 낮추었지만 앞으로 경기 침체(나라 경제가 쪼그라드는 것)는 없을 것으로 내다봤습니다."},{"s":"[미국 증시시장 지진] 트럼프는 유가를 올리기 위해 이란과 협력했다며 미국 주식에서 6조 달러 이상의 증발을 초래했다고 민주당을 비난했다.","so":"etnet 經濟通","tm":"11/23 10:23","c":1,"r":"hk","u":"http://www.etnet.com.hk/www/tc/news/home_categorized_news_detail.php?newsid=ETN361123933","p":1795396980,"a":1795403762,"t":"【美股大地震】特朗普歸咎民主黨致美股蒸發逾6萬億美元，指與伊朗合力推高油價","su":"2026년 11월 23일 09:23 [미국. 주식시장 지진] 트럼프는 자신이 이란과 협력해 유가를 끌어올렸다며 미국 주식 6조 달러 이상 증발의 책임을 민주당에 돌렸다. 트럼프 미국 대통령은 22일(현지시간) 소셜미디어 플랫폼에 최근 미국 증시 급락의 책임을 전적으로 민주당 탓으로 돌리는 글을 잇따라 올렸다. 트럼프 대통령은 지난 11월 3일 의회 중간선거에서 민주당이 다소 이상한 '승리'를 거둔 이후 미국 증시에서 6조 달러 이상이 사라졌고, 나스닥(미국 기술 회사들이 많은 주식시장) 지수만 해도 20%나 하락했다고 지적했다. 민주당이 반성장·보복 정책을 펼치고 있기 때문에 이를 전적으로 비판했다. 그는 상대방이 빨리 바뀌지 않으면 상황은 더욱 악화될 뿐이라고 경고했지만, 나라는 곧 다시 강해질 것이라고 강조했다."},{"s":"주식 상승으로 피난처에 대한 수요가 감소함에 따라 국채 선물 하락","so":"Bloomberg.com","tm":"11/23 10:22","c":1,"r":"us","u":"https://www.bloomberg.com/news/articles/2026-11-22/treasury-futures-fall-as-rising-stock-futures-damp-haven-demand","p":1795396920,"a":1795403734,"t":"Treasury Futures Fall as Rising Stocks Damp Demand for Havens"},{"s":"미국 주식 선물은 강하게 반등했고, 나스닥은 거의 3% 상승했고, 금과 은은 동시에 반등했으며, 아시아 주식은 하락세로 출발했고, 한국 주식은 4% 하락해 4,700포인트 아래로 떨어졌습니다.","so":"鉅亨網","tm":"11/23 10:18","c":1,"r":"tw","u":"https://news.cnyes.com/news/id/6669940","p":1795396732,"a":1795411365,"t":"美股期指強彈那指漲近3%金銀同步回升 亞股開低韓股挫4%失守4700點","su":"미국 주식 선물은 강하게 반등했고 나스닥은 거의 3% 상승했으며 금과 은은 동시에 반등했습니다. 아시아 증시는 하락세로 출발했고, 한국 증시는 4% 하락해 4,700포인트 아래로 떨어졌습니다. 거형망(Anue) 편집 Chen Weiting 미국 3대 주가지수 선물이 월요일(23일) 아시아 시장에서 오전 거래에서 상승세로 출발했습니다. 대만 시간 월요일 오전 8시 52분 기준 나스닥 100 선물은 2.83%, S&P500(미국 큰 회사 500곳 지수) 선물은 2.11%, 다우 선물은 1.4% 상승했다. 금 현물은 하루 동안 1% 이상 상승하여 온스당 미화 36,000달러 선을 회복했고, 현물 은은 2% 상승하여 미화 42달러 선으로 회복했습니다. 올해 7월 중순부터 미국 3대 주가지수 선물은 하락세를 이어갔다. 기술주와 반도체(전자기기의 두뇌 부품)주가 급락했다. 지정학적 리스크와 AI 투자 수익에 대한 의구심이 주요 걸림돌로 떠올랐다. 나스닥 선물이 하락세를 주도했고 하락폭은 다우선물보다 훨씬 컸습니다."},{"s":"시판 전 전략 | 미국 증시 폭락, VIX 반년 최고치 기록, 아시아 증시는 암울하지만 홍콩 증시는 좋은 성과를 낼 것으로 기대, 지지 수준에 주목","so":"etnet 經濟通","tm":"11/23 10:15","c":1,"r":"hk","u":"https://www.etnet.com.hk/www/tc/news/news-article.php?newsid=417732","p":1795396500,"a":1795408828,"t":"盤前攻略 | 美股崩盤VIX創年半高，亞股愁雲密布惟盼港股跑贏留意一支持位","su":"시판 전 전략 | 미국 증시는 폭락했고 VIX는 1년 반 최고치를 기록했으며 아시아 주식은 우울하지만 홍콩 주식이 좋은 성과를 거두고 지지 수준에 주목하기를 바라고 있습니다. 미국 증시는 포괄적이고 심층적인 조정을 거쳤으며 엔비디아는 계속해서 시장 하락의 촉매제 역할을 하고 있습니다. 미국 규제 기관이 엔비디아의 잠재적인 회계 문제를 조사하고 있는 것으로 알려졌습니다. 지난 금요일(20일) 주가가 14% 급락하며 반도체(전자기기의 두뇌 부품) 업종 전체를 끌어내렸다. 필라델피아 반도체 지수는 1011포인트(10.73%) 하락했다. VIX 패닉 지수는 28에서 35로 상승했습니다. 미국 증시는 전반적으로 급락했으며 다우와 S&P가 조정 국면(고점에서 10% 넘게 내린 상태)에 들어갔습니다. 다우지수는 949포인트(1.93%) 하락한 48,147에, 나스닥은 1,261포인트(5.28%) 하락한 22,617에, S&P는 265포인트(3.70%) 하락한 6,910에 장을 마감했습니다. 다우존스 산업평균지수는 일주일 내내 8% 하락했고, 나스닥 지수는 10%, S&P 지수는 9% 하락했습니다. 세 가지 주요 지수 모두 1년여 만에 최악의 주간 실적을 기록했습니다."},{"s":"[속보]靑 \"증시 불안정, 미국 증시와 연동 측면…경제부총리, 간담회서 증안펀드 관련 설명할 것\" - 머니투데이","so":"머니투데이","tm":"11/23 10:08","c":1,"r":"kr","u":"https://www.mt.co.kr/politics/2026/11/23/2026112310075337414","p":1795396125,"a":1795403731,"su":"글자크기 23일 김성완 청와대 대변인 브리핑. <저작권자 © ‘돈이 보이는 리얼타임 뉴스’ 머니투데이. 무단전재 및 재배포, AI학습 이용 금지> 안녕하세요! 머니투데이 김성은 기자입니다. '빛과 빛 사이의 어둠을 보라' 공유"},{"s":"실적이 저조한 일부 일본 주식은 강한 결과 이후 상승을 시작할 수 있습니다.","so":"WSJ","tm":"11/23 10:07","c":1,"r":"us","u":"https://www.wsj.com/finance/stocks/some-underperforming-japan-stocks-may-start-rising-after-strong-results-e6e3f434","p":1795396044,"a":1795408814,"t":"Some Underperforming Japan Stocks May Start Rising After Strong Results"},{"s":"시장 개방 초점. 한 장의 사진으로 명확하게 확인해보세요 | 미국 주식 급락, 아시아에 비상 경고, 홍콩 주식은 100포인트 이상 하락할 것으로 예상","so":"TVB","tm":"11/23 09:44","c":1,"r":"hk","u":"https://news.tvb.com/tc/1207825-%E9%96%8B%E5%B8%82%E7%84%A6%E9%BB%9E%E4%B8%80%E5%9C%96%E7%9C%8B%E6%B8%85%E7%BE%8E%E8%82%A1%E6%80%A5%E7%80%89%E4%BA%9E%E6%B4%B2%E6%88%92%E5%82%99%E6%B8%AF%E8%82%A1%E6%96%99%E8%B7%8C%E9%81%8E%E7%99%BE%E9%BB%9E","p":1795394640,"a":1795408829,"t":"開市焦點．一圖看清｜美股急瀉亞洲戒備 港股料跌過百點","su":"지난 주 미국 증시는 급락했고 아시아 시장은 비상에 걸렸습니다. 홍콩 증시는 100포인트 이상 하락할 것으로 예상됐다. 미국 증시 선물이 반등했고, 시장은 트럼프 대통령의 정책과 이란 상황, 아시아 시장 안정 조치에 주목했다. 지난 금요일 미국 증시가 급락한 후 선물은 반등했습니다. 지난 금요일 미국 증시는 나스닥이 5%, S&P500(미국 큰 회사 500곳 지수)이 3% 하락하며 7,000포인트를 하회하는 등 폭락했습니다. 홍콩 증시는 100포인트 이상 하락할 것으로 예상되는 등 아시아 시장이 비상에 걸렸다. 그러나 미국 증시 선물은 반등했다. 트럼프 대통령은 미국 기업이 해외에 데이터센터(컴퓨터 수만 대를 모아 둔 건물)를 짓는 것을 제한할 계획이다. 트럼프 대통령은 미국 기업이 해외에 데이터센터를 짓는 것을 제한할 계획이다. 황러(황 Le)도 보도됐다."},{"s":"AI주 폭락 후 반격에 직면하다! 미국 주식 선물은 월요일 오전 거래에서 2% 반등했습니다. 대만 주식시장도 이에 따라 하락세를 멈출 것으로 예상됩니까?","so":"工商時報","tm":"11/23 09:39","c":1,"r":"tw","u":"https://www.ctee.com.tw/news/20261123700515-430702","p":1795394340,"a":1795411367,"t":"AI股血崩後迎反攻！美股期貨周一早盤強彈2％ 台股有望跟進止跌？","su":"글로벌 AI 기술주는 지난주 극심한 매도세(팔려는 힘)를 보였으며 시장 신뢰도는 한때 바닥을 쳤습니다. 그러나 월요일(23일) 미국 증시 선물이 주도적으로 반격을 촉구했다. 나스닥 100 지수선물은 장초반 약 2% 반등했고, S&P500(미국 큰 회사 500곳 지수) 지수선물도 약 1% 상승하며 며칠째 침체됐던 글로벌 증시에 한 줄기 빛을 비추고 있다. 지난주를 돌이켜보면 AI버블에 대한 우려가 기술주 매도압력을 촉발시켰다. 나스닥 지수는 일주일 만에 10% 하락했고, 대만 증시는 17% 급락해 1990년 최고 기록을 세웠다."},{"s":"'국제 금융' 미국 주식 선물 반등, 지수 선물 2.8% 상승","so":"工商時報","tm":"11/23 09:34","c":1,"r":"tw","u":"https://www.ctee.com.tw/news/20261123700665-430701","p":1795394040,"a":1795411368,"t":"《國際金融》美股期貨強彈 那指期大漲2.8%","su":"[타임즈 류지강·외신 종합보도] 미국 3대 주가지수 선물이 22일 큰 폭으로 반등했다. 다가오는 추수감사절로 인해 이번 주 미국 주식의 거래일이 짧아졌습니다. 하지만 3대 지수가 20일 마감하면서 모두 조정 국면(고점에서 10% 넘게 내린 상태)에 돌입했다. 현재 다우존스 선물은 1.35%, S&P500(미국 큰 회사 500곳 지수) 선물은 2%, 나스닥 선물은 2.8% 상승했습니다. 아시아 시장에서 홍콩항셍지수 선물의 최신 호가는 22,238입니다..."},{"s":"미국 주식의 가격 책정 논리가 바뀌었고 QDII 펀드의 순 가치가 압박을 받고 있습니다.","so":"21财经","tm":"11/23 09:32","c":1,"r":"cn","u":"https://www.21jingji.com/article/20261123/herald/93d2016312b1a640c0e4bec5033e8626.html","p":1795393920,"a":1795411360,"t":"美股定价逻辑生变 QDII基金净值承压","su":"점점 더 많은 주식 중심 펀드 매니저들이 채권(나라나 회사에 돈 빌려준 증서) 투자에 대한 듀레이션 전략을 도입하기 시작하면 미국 주식 가격 책정 시스템에는 어떤 일이 일어날까요? 기관들이 듀레이션 전략을 주식 거래에 통합하는 것을 가속화한 이후, 즉각적인 현금 흐름이 없는 AI 기업의 주식은 장기 자산이 되었습니다. 이러한 논리의 변화는 미국 기술주에 압력을 가했습니다. 베이징 시간으로 11월 21일 이른 아침, 미국 증시는 엄청난 폭락세를 보였습니다. 장기 성장성 자산은 집중 매도로 부진했고, 이익 확실성이 강한 단기 자산에 자금이 쏟아졌다. 많은 펀드사들은 펀드 종목 선정이 “장기적인 것보다는 단기적으로 보는 것”이라는 특성이 뚜렷하다고 말한다. 기술주, 장기채권, 구리 및 기타 상품은 모두 장기 논리에 따라 가격이 재조정됩니다. 기관은 채권 기간 아이디어를 사용하여 주식을 선택합니다. 본질은 현재현금흐름의 확실성을 최대한 추구하는 것이다. 선도이익의 비중이 높을수록 할인율 변동에 민감한 자산이 됩니다."},{"s":"[주간 뉴욕증시] AI 거품 공포 속 추수감사절…美 물가지표에 촉각","so":"뉴시스","tm":"11/23 09:30","c":1,"r":"kr","u":"https://www.newsis.com/view/NISX20261123_0003878573","p":1795393846,"a":1795403731,"su":"[서울=뉴시스]박미선 기자 = 미국 뉴욕증시가 인공지능(AI) 투자 거품 우려로 급락한 가운데 이번 주에는 연방준비제도(Fed·연준(미국의 중앙은행))가 선호하는 물가(물건값 전체의 수준) 지표인 개인소비지출(PCE) 물가지수에 투자자들의 관심이 집중될 전망이다. 추수감사절 연휴로 거래일이 줄어드는 만큼 물가 지표와 주요 기술기업 실적이 증시 향방을 가를 변수로 꼽힌다.22일(현지 시간) 야후파.."},{"s":"미국 증시는 육류 단백질, 석유 및 가스 저장 및 운송 분야에서 좋은 성과를 거두었습니다. 어느 A주가 호황을 누릴 것으로 예상됩니까?丨 은행 전체에서 상승세를 지켜보십시오","so":"21财经","tm":"11/23 09:22","c":1,"r":"cn","u":"https://www.21jingji.com/article/20261123/herald/0acc247a4a634d310e52f11e345713d1.html","p":1795393320,"a":1795403740,"t":"美股肉类蛋白与油气储运方向表现亮眼，哪些A股有望共享景气传导？丨隔岸观涨","su":"미국 증시는 육류 단백질, 석유 및 가스 저장 및 운송 분야에서 좋은 성과를 거두었습니다. 어떤 A주가 호황을 누릴 것으로 예상됩니까?丨국경 너머에서 상승세(오르는 흐름)를 지켜보세요 1. 디스크익스프레스 미국 증시는 11월 20일 마감되면서 시장 전체가 약한 조정 패턴을 보였습니다. 3개 주요 지수는 모두 하락 마감했습니다. 다우존스 산업평균지수는 1.93% 하락한 48147.33포인트로 마감했습니다. S&P500(미국 큰 회사 500곳 지수)은 3.70% 하락한 6910.39포인트로 마감했으며 지난 5일간 누적 하락폭은 8.61%입니다. 나스닥종합지수는 5.28% 하락한 22617.73포인트로 마감했고, 지난 20일간 누적 하락폭은 12.86%로 3대 지수 중 1위에 올랐다. 기술 성장 부문은 분명한 압박을 받고 있으며 자금은 방어 자산과 실물 자산으로 이동하고 있습니다."},{"s":"엔비디아는 지난 금요일에 14% 하락했으며 주식 시장은 인공 지능 부문의 가격을 조정하고 있습니다 | 미국 주식 마감 리뷰","so":"21财经","tm":"11/23 09:21","c":1,"r":"cn","u":"https://www.21jingji.com/article/20261123/herald/ad0b559876fbc06013c1aadda7e5179f.html","p":1795393260,"a":1795403742,"t":"英伟达上周五大跌14%，股市正在对人工智能板块进行重新定价丨美股复盘","su":"11월 20일(동부시간) 미국 증시는 3대 지수가 전반적으로 급락하는 '블랙프라이데이'를 맞이했다. 다우존스 산업평균지수는 1.93%, S&P500(미국 큰 회사 500곳 지수) 지수는 3.7%, 나스닥 종합지수는 5.28% 하락했다. 다우존스 산업평균지수와 S&P500 지수는 모두 이전 고점 대비 10% 하락하며 조정 범위에 진입했습니다. 이 중 엔비디아는 14.01% 하락한 125.53달러로 마감해 7일 연속 하락세를 이어갔다. 엔비디아의 회계 문제가 정밀 조사를 받았습니다. 엔비디아의 주가는 이번 주 거의 23% 하락해 2008년 10월 이후 최대 주간 하락폭을 기록했고, 7주 연속 하락세를 기록해 2012년 이후 가장 긴 연속 하락세를 기록했습니다. 최근 총 시가총액(회사 전체 몸값)은 약 3조 0300억 달러로 떨어졌습니다."},{"s":"크로스마켓 게임丨미국 주식의 18년 강세장 이후의 주식-채권 게임","so":"信報網站","tm":"11/23 09:01","c":1,"r":"hk","u":"https://www.hkej.com/instantnews/stock/article/45 신호를 발행합니다.","so":"鉅亨網","tm":"11/23 07:41","c":1,"r":"tw","u":"https://news.cnyes.com/news/id/6669874","p":1795387304,"a":1795389876,"t":"美股賣壓恐持續？標普500進入修正區間、分析師揭逢低買進訊號","su":"S&P500(미국 큰 회사 500곳 지수)은 10월 6일 고점 대비 11.6% 하락해 7일 연속 하락하며 공식적으로 기술적 조정 범위에 진입했습니다.\nAI 투자, 데이터센터(컴퓨터 수만 대를 모아 둔 건물) 지출, 연준의 금리 인상 압력에 대한 우려로 인해 기술주가 하락했고, 나스닥은 2026년 현재까지 2.7% 하락했습니다.\n분석가들은 12월 8~9일 연준 회의와 MU의 12월 17일 실적 보고서를 앞두고 VIX가 35.89까지 상승하고 내부 시장 지표를 관찰하고 있습니다."},{"s":"월가 스타 전략가 야데니, S&P500 목표치 7500으로 하향｜Global Money Club","so":"중앙일보","tm":"11/23 07:17","c":1,"r":"kr","u":"https://www.joongang.co.kr/gmc/article/25480964","p":1795385857,"a":1795389861,"su":"월스트리트의 스타 전략가 에드 야데니가 S&amp;P500 지수 연말 전망치를 다시 하향했습니다. 매도세(팔려는 힘)로 증시가 기술적 조정 국면(고점에서 10% 넘게 내린 상태)에 들어서..."},{"s":"BASF의 인수 노력 종료 후 Evonik 주가 하락","so":"WSJ","tm":"11/23 07:13","c":1,"r":"us","u":"https://www.wsj.com/business/evonik-shares-tumble-after-basf-ends-takeover-efforts-7cae3722","p":1795385587,"a":1795389862,"t":"Evonik Shares Tumble After BASF Ends Takeover Efforts"},{"s":"[월가프리뷰]AI주 폭락한 뉴욕증시, 블랙프라이데이 소비에 반등 기대","so":"뉴스1","tm":"11/23 07:00","c":1,"r":"kr","u":"https://www.news1.kr/world/international-economy/6362187","p":1795384800,"a":1795389861},{"s":"[마켓 브리핑] 앤트로픽 상장도 못 살린 뉴욕증시 일제히 하락","so":"SBS Biz","tm":"11/23 06:58","c":1,"r":"kr","u":"https://biz.sbs.co.kr/article/20000348066","p":1795384680,"a":1795389861,"su":"모닝벨 '마켓 브리핑' - 최주연엔비디아 제국이 무너지고, 그나마 믿었던 앤트로픽까지 시장 분위기를 살리는데 실패하면서 금요일장 뉴욕증시는 그야말로 파랗게 질렸습니다.새로운 반등(내렸다가 다시 오르는 것) 동력이 없다는 것도 현재 시장의 불안감을 더욱 키우고 있습니다.토요일에 계좌 열어보기 쉽지 않았을 것 같은데요.마감 상황보면 다우지수1.…"},{"s":"\"더 큰 매수 기회\"…반도체 쇼크에 S&P500 눈높이 낮춘 월가 거물","so":"이데일리","tm":"11/23 06:35","c":1,"r":"kr","u":"https://www.edaily.co.kr/News/Read?newsId=01239846645648672&mediaCodeNo=257","p":1795383320,"a":1795392882,"su":"미국 월가의 대표 전략가 에드 야데니 야데니리서치 대표 겸 최고투자책임자(CIO)가 연말 스탠더드앤드푸어스(S&P)500 지수 전망치를 하향 조정했다. 미국 뉴욕증권거래소(NYSE) 전경. (사진=로이터 연합뉴스)22일(현지시간) 블룸버그통신에 따르면 야데니 대표는..."},{"s":"〈파이낸셜 위클리 - 투자 관점〉 연준이 금리 인상을 재개하고 대부분의 주식시장 상승세들은 마지막 댄스를 시작할 준비를 하고 있다.","so":"自由時報","tm":"11/23 06:30","c":1,"r":"tw","u":"https://stock.ltn.com.tw/article/xpy3swl7d6qj","p":1795383000,"a":1795392892,"t":"〈財經週報-投資觀點〉Fed重啟升息 股市大多頭準備開始最後一舞","su":"FOMC 회의 후 연준은 0.25%포인트(퍼센트끼리 뺀 차이)의 금리 인상을 발표했다. FOMC 위원들의 후속 성명에서는 올해 12월에 다시 금리를 인상할 것이 거의 확실합니다. 연준은 여전히 최근 금리 인상을 무시하려고 노력하고 있지만 내년을 내다보고 있습니다. 금리를 금리의 미세조정으로 정의하는데, 저자는 이것이 새로운 금리인상 사이클의 시작이라고 판단한다. FED가 금리를 인상하기 시작하면서 2009년 3월 9일부터 시작된 미국 주식의 강세 추세는 2020년 AI 자본 지출(공장·장비 등에 쓰는 큰돈) 및 적용을 동반하게 될 것입니다."},{"s":"엔비디아의 수장 교체 + AI 자금 조달 동결, 월스트리트는 \"연준 매파적 논리\" 가격 조정 시작","so":"鉅亨網","tm":"11/23 06:01","c":1,"r":"tw","u":"https://news.cnyes.com/news/id/6669878","p":1795381299,"a":1795392894,"t":"輝達換帥＋AI融資急凍 華爾街開始重新定價「Fed鷹派邏輯」","su":"엔비디아 이사회는 17일 젠슨황을 복직시킬 의사가 없다고 밝혔다. 일시적으로 전 최고재무책임자(CFO)인 크리스(Chris)로 교체되었으며 외부 선정 프로세스에 착수했습니다.\n젠슨 황은 재임 기간 동안 AI 인프라 자금 조달(사업에 쓸 돈을 모으는 것)에 미화 5000억 달러 이상을 촉진하고 오픈AI 데이터 센터에 미화 1050억 달러의 보증을 제공했습니다. 크레스는 취임 후 보증 한도를 약 2,500억 달러에서 1,050억 달러로 낮췄습니다.\n분석가들은 AI 인프라의 새로운 거래가 더 느리고 조건도 더 높아질 것이라고 지적하며, AI 붐도 인플레이션(물건값이 계속 오르는 것) 압력의 원인 중 하나로 간주됩니다."},{"s":"'S&P500 몰빵'도 위험 구간…ETF 장기투자 '분산'이 답","so":"www.ebn.co.kr","tm":"11/23 06:00","c":1,"r":"kr","u":"https://www.ebn.co.kr/news/articleView.html?idxno=1732456","p":1795381200,"a":1795392882,"su":"퇴직연금 등 장기투자에서 미국 스탠더드앤드푸어스(S&P)500 상장(주식시장에 처음 들어오는 것)지수펀드(ETF(여러 주식을 묶어 파는 상품))의 인기가 이어지고 있지만, 대표지수에만 의존하는 전략을 재점검해야 한다는 조언"},{"s":"Li Shengyang : 미국 주식 조정은 저렴하지 않으며 홍콩 기술주 배분을 다양화하십시오 - 20261123 - 경제","so":"明報新聞網","tm":"11/23 05:30","c":1,"r":"hk","u":"https://news.mingpao.com/pns/%E7%B6%93%E6%BF%9F/article/20261123/s00004/1795363394295/%E6%9D%8E%E8%81%B2%E6%8F%9A-%E7%BE%8E%E8%82%A1%E5%9B%9E%E8%AA%BF%E6%9C%AA%E7%AE%97%E4%BE%BF%E5%AE%9C-%E5%88%86%E6%95%A3%E9%83%A8%E7%BD%B2%E6%B8%AF%E7%A7%91%E6%8A%80%E8%82%A1","p":1795379400,"a":1795389886,"t":"李聲揚：美股回調未算便宜 分散部署港科技股 - 20261123 - 經濟"},{"s":"S&P500이 5,600에? 중국의 AI 야망 분쇄에는 대가가 따른다","so":"Bloomberg.com","tm":"11/23 05:01","c":1,"r":"us","u":"https://www.bloom 는 모순되는 것처럼 보입니다. AI 역량은 계속 비약적으로 발전하고 있지만, 투자자들은 'AI 버블 붕괴'에 대한 우려가 점점 커지고 있다. 결국, 이전에는 AI 투자가 너무 붐비고 수학 문제도 일반 사람들에게는 너무 멀었습니다. 미국 증시가 다시 모멘텀(값이 움직이는 기세)을 얻으려면 의학, 기계 등 'AI 추측'에 대한 보다 구체적인 증거가 나올 때까지 기다려야 한다."},{"s":"나스닥 5.3% ↓… '검은 월요일' 공포, 고개 드는 'AI 회의론' - 머니투데이","so":"머니투데이","tm":"11/23 03:00","c":1,"r":"kr","u":"https://www.mt.co.kr/world/2026/11/23/2026112219572889784","p":1795370400,"a":1795392882,"su":"지난주 반도체(전자기기의 두뇌 부품)종목을 중심으로 나스닥이 급락, 국내 증시에 미칠 영향이 우려된다. 사상 최대 IPO(기업공개(주식시장에 처음 들어오는 것)) 실적을 갈아치운 앤트로픽의 상장도 AI 투자회수 우려를 씻어내지 못했다."},{"s":"그림과 잠재력이 있습니다 | 미국 주식의 공황 매도, 나스닥은 5% 이상 하락, HSI는 낮은 개장 및 22,000 테스트 가능(지속적으로 업데이트됨) | 홍콩경제신문","so":"香港經濟日報HKET","tm":"11/23 02:29","c":1,"r":"hk","u":"https://invest.hket.com/article/4229073/%E6%9C%89%E5%9C%96%E6%9C%89%E5%8B%A2%EF%BD%9C%E7%BE%8E%E8%82%A1%E6%81%90%E6%85%8C%E6%8B%8B%E5%94%AE%E7%B4%8D%E6%8C%87%E6%8C%AB%E9%80%BE5-%20HSI%E4%BD%8E%E9%96%8B%E6%81%90%E4%B8%8B%E8%A9%A622000%E9%97%9C%EF%BC%88%E6%8C%81%E7%BA%8C%E6%9B%B4%E6%96%B0%EF%BC%89","p":1795368540,"a":1795392905,"t":"有圖有勢｜美股恐慌拋售納指挫逾5% HSI低開恐下試22000關（持續更新）|香港經濟日報"},{"s":"베선트, 미국 시장 급락에 따른 연준의 과도한 긴축 위험 경고","so":"Bloomberg.com","tm":"11/23 01:08","c":1,"r":"world","u":"https://www.bloomberg.com/news/articles/2026-11-22/bessent-warns-fed-risks-overtightening-as-us-markets-swoon","p":1795363700,"a":1795389889,"t":"Bessent Warns Fed Risks Overtightening as US Markets Swoon"},{"s":"[모닝포스트] 3년여 만에 연준이 금리 인상을 재개했다. 미국 주식, 원유, 금이 전반적으로 급락했습니다. 많은 A주 회사들이 자사주 매입 진행 상황을 공개했습니다.","so":"财联社","tm":"11/23 01:06","c":1,"r":"cn","u":"https://www.cls.cn/detail/2485626","p":1795363578,"a":1795403743,"t":"【早报】时隔3年多，美联储重启加息；美股、原油、黄金全线跳水；多家A股公司，披露回购进展","su":"① 왕이(王毅) 이란 외무장관 아라그치와 회담 ② '문화관광 발전을 위한 15차 5개년 계획' 발표 ③ 연방준비제도(연준(미국의 중앙은행))가 3년 만에 금리(돈을 빌릴 때 내는 이자 비율)를 인상했고, 미국 증시는 폭락했다. ④ CATL은 관련 자동차 회사들이 가까운 시일 내에 다른 공급업체를 선택할 것이라는 소문에 대응할 것이다 ⑤ 삼이중공업: 어제 1662만6000주를 환매하고 2억9900만 위안을 지불했다. 매크로 뉴스 1. 2026년 9월 16일 왕이(王毅) 중국공산당 중앙정치국 위원 겸 외교부장이 베이징에서 아라그치 이란 외무부장과 회담을 가졌습니다. 왕이 부장은 중국은 이란에 대한 정책의 연속성과 안정성을 견지하고 안보리와 다자간 플랫폼에서 정의를 수호하며 무력 사용을 반대하고 국제 관계 규범을 수호한다고 말했습니다. 중국은 이란과의 소통과 조율을 강화해 중국-이란 관계의 새로운 진전을 추동할 의향이 있다."},{"s":"미국 증시 반등의 꿈은 이뤄지기 힘든 걸까? 골드만삭스 경고: 다음 매도 물결이 다가오고 있을 수 있습니다 - 금융","so":"中時新聞網","tm":"11/23 00:58","c":1,"r":"tw","u":"https://www.chinatimes.com/realtimenews/20261122003465-260410","p":1795363133,"a":1795392896,"t":"美股反彈夢難圓？ 高盛示警：下一波拋售潮恐已在路上- 財經","su":"최근 미국 증시에 대한 매도압력이 계속 높아지고 있고, 골드만삭스는 시장이 주가 하락으로 매도세(팔려는 힘)를 촉발하는 악순환에 빠질 수 있다고 경고했다. 은행의 패닉지수는 9포인트(10포인트 만점)까지 올랐고, 체계적 투자자들의 베팅은 계속해서 줄어들고 있다. 상품거래자문기금(CTA)이 다음 주 최대 806억 달러 규모의 주식을 매도할 것으로 추산된다."},{"s":"[미국 증시 주간 미리보기] 이번 주에는 인플레이션 데이터에 초점을 맞췄습니다. 10월 PCE는 전월 대비 0.3% 상승할 것으로 예상됩니다. 미국 증시는 목요일 추수감사절 연휴로 휴장합니다.","so":"香港經濟日報HKET","tm":"11/23 00:24","c":1,"r":"hk","u":"https://inews.hket.com/article/4229055/%E3%80%90%E7%BE%8E%E8%82%A1%E4%B8%80%E5%91%A8%E5%89%8D%E7%9E%BB%E3%80%91%E6%9C%AC%E5%91%A8%E8%81%9A%E7%84%A6%E9%80%9A%E8%84%B9%E6%95%B8%E6%93%9A%E3%80%80%E6%96%9910%E6%9C%88PCE%E6%8C%89%E6%9C%88%E5%8D%870.3-%E3%80%80%E7%BE%8E%E8%82%A1%E5%91%A8%E5%9B%9B%E6%84%9F%E6%81%A9%E7%AF%80%E5%81%87%E6%9C%9F%E4%BC%91%E5%B8%82","p":1795361079,"a":1795392907,"t":"【美股一周前瞻】本周聚焦通脹數據 料10月PCE按月升0.3% 美股周四感恩節假期休市"},{"s":"Yardeni, S&P500 목표 다시 하향 조정, 약세장은 가능성 낮음","so":"Bloomberg.com","tm":"11/23 00:18","c":1,"r":"us","u":"https://www.bloomberg.com/news/articles/2026-11-22/yardeni-cuts-s-p-500-target-again-says-bear-market-is-unlikely","p":1795360693,"a":1795392886,"t":"Yardeni Cuts S&P 500 Target Again, Says Bear Market Is Unlikely"},{"s":"투자자들은 AI 투자가 흔들리면서 주식 시장의 '취약성'을 용감하게 여깁니다.","so":"Bloomberg.com","tm":"11/23 00:00","c":1,"r":"us","u":"https://www.bloomberg.com/news/articles/2026-11-22/investors-brave-stock-market-fragility-as-ai-trade-falters","p":1795359600,"a":1795392886,"t":"Investors Brave Stock Market ‘Fragility’ as AI Trade Falters"},{"s":"[모닝 포스트] 연준은 보류를 유지했고 워시는 금리 논의 빈도를 줄일 것이라고 발표했습니다. 미국 주식 메모리 칩 부문이 전반적으로 폭발적으로 성장했습니다. 구글의 실적은 기대에 못 미쳤고, 벨 이후 급락했다.","so":"财联社","tm":"11/22 23:38","c":1,"r":"cn","u":"https://www.cls.cn/detail/2518583","p":1795358317,"a":1795411361,"t":"【早报】美联储按兵不动，沃什宣布：减少议息频次；美股存储芯片板块，全线爆发；谷歌业绩不及预期，盘后大跌","su":"① 8,000억 위안 규모의 신규 정책금융상품 출시 완료 ② 중앙은행: 3분기 말 위안화 부동산 대출 잔액 전년 동기 대비 5.2% 감소 ③ 연준은 기준금리(중앙은행이 정하는 기본 이자 비율)를 그대로 유지했고, 중도인 Cook은 매파적으로 변했다. ④ CATL과 Wuliangye가 자사주 매입(회사가 자기 주식을 다시 사는 것) 진행 상황을 공개했다. ⑤ Century Huatong, 메타엑스, Guanghe Technology 등이 자사주 매입을 계획하고 있다. 매크로뉴스 1. 중국개발은행, 수출입은행, 중국농업개발은행 등 3개 정책은행으로부터 10월 28일 현재 2026년 모든 신규 정책금융상품이 출시돼 총 8000억 위안에 달하는 것으로 전해졌다. 이 중 CDB의 신규 정책금융상품은 3,650억 위안, 진인의 신규 정책금융상품, 농업개발의 신규 정책금융상품은 각각 3,650억 위안, 1,200억 위안, 3,150억 위안을 투자했다."},{"s":"미국 증시 전망: 다우존스와 나스닥이 하락하면 S&P500이 10,000을 돌파할 것인가? 무슨 모건스탠리,","so":"The Economic Times","tm":"11/22 22:39","c":1,"r":"us","u":"https://m.economictimes.com/world/us/us-stock-market-forecast-will-the-sp-500-hit-10000-as-dow-jones-and-nasdaq-slide-what-morgan-stanley-goldman-sachs-and-ubs-predict-for-2027/articleshow/136074286.cms","p":1795354793,"a":1795356483,"t":"US Stock Market Forecast: Will the S&P 500 hit 10,000 as Dow Jones and Nasdaq slide? What Morgan Stanley,","su":"월스트리트 예측: Federated Hermes Steve Chiavarone에 따르면 S&P500(미국 큰 회사 500곳 지수)은 2027년에 10,000에 도달할 수 있다고 합니다. Federated Hermes Steve Chiavarone은 이번 달 매도세에도 불구하고 AI 인프라 붐이 또 다른 시장 상승세를 뒷받침할 것으로 보고 있습니다. 모건스탠리와 골드만삭스는 지수를 8,700으로 예상하고 UBS와 Wells Fargo는 8,200을 예상합니다. 다우와 나스닥도 조정 국면(고점에서 10% 넘게 내린 상태)에 진입했지만 월스트리트는 대체로 강세를 유지하고 있습니다."},{"s":"강력한 수익은 무너져가는 AI 투자에 상대가 되지 않음을 입증","so":"Bloomberg.com","tm":"11/22 22:30","c":1,"r":"us","u":"https://www.bloomberg.com/news/articles/2026-11-22/strong-earnings-prove-no-match-for-the-crumbling-ai-trade","p":1795354200,"a":1795392886,"t":"Strong Earnings Prove No Match for the Crumbling AI Trade"},{"s":"연준의 \"AI 인플레이션\" 서술이 느슨해지고 있다","so":"第一财经","tm":"11/22 22:15","c":1,"r":"cn","u":"https://www.yicai.com/news/103449335.html","p":1795353345,"a":1795356487,"t":"美联储的“AI通胀”叙事正在松动","su":"11월 12일, 엔비디아는 젠슨 황이 CEO직을 즉시 사임한다고 발표했습니다. 이 소식이 발표된 후, 세계에서 가장 가치 있는 칩 회사는 개장 당시 13% 급락하여 시가총액(회사 전체 몸값)이 약 5000억 달러 손실되었습니다. 엔비디아 이사회 의장인 Harvey Jones는 11월 17일 엔비디아의 3분기 회계연도 결과 투자자 컨퍼런스 콜에서 황 Jensen을 CEO로 복귀시킬 계획이 없음을 분명히 했습니다. 임시 CEO이자 전 CFO인 크레스(Kress)가 그 자리를 맡았지만 이사회도 외부 선정 절차에 착수했습니다. 젠슨 황이 한동안 돌아올 가능성은 극히 낮습니다."},{"s":"대만, 주식시장 지원을 위해 증거금 요건 인하 고려 중","so":"Bloomberg.com","tm":"11/22 21:35","c":1,"r":"world","u":"https://www.bloomberg.com/news/articles/2026-11-22/taiwan-mulls-lowering-margin-requirement-to-support-stock-market","p":1795350915,"a":1795389890,"t":"Taiwan Mulls Lowering Margin Requirement to Support Stock Market"},{"s":"주식 시장은 이번 세기에만 5번째로 뭔가를 하고 있으며, 역사에 따르면 주식의 다음 단계는 분명합니다.","so":"The Globe and Mail","tm":"11/22 21:27","c":1,"r":"us","u":"https://www.theglobeandmail.com/investing/markets/markets-news/motley/8955410/the-stock-market-is-doing-something-for-only-the-5th-time-this-century-and-history-says-it-s-obvious-what-comes-next-for-stocks/","p":1795350457,"a":1795351379,"t":"The Stock Market Is Doing Something for Only the 5th Time This Century, and History Says It's Obvious What Comes Next for Stocks","su":"요점 - 올해는 인공지능(AI) 인프라 구축에 힘입어 다우존스 산업평균지수, S&P500(미국 큰 회사 500곳 지수), 나스닥(미국 기술 회사들이 많은 주식시장) 종합지수가 사상 최고치를 기록하며 눈부신 한 해였습니다. - 주식 시장 가치 평가는 희박하고 지속 불가능한 영역에 진입했습니다."},{"s":"수정인가 아니면 더 깊은 계산인가? 투자자들은 미국 주식 매도가 줄어들 것이라는 징후를 찾고 있습니다.","so":"Reuters","tm":"11/22 21:22","c":1,"r":"us","u":"https://www.reuters.com/business/finance/correction-or-deeper-reckoning-investors-seek-signs-us-stock-selling-will-abate-2026-11-22/","p":1795350132,"a":1795356484,"t":"Correction or deeper reckoning? Investors seek signs US stock selling will abate"},{"s":"AI 미국 주식이 글로벌 자산 하락을 주도하고, 앤트로픽이 유동성 압박을 강화하고, 비트코인이 60,000달러 아래로 떨어집니다.","so":"鉅亨網","tm":"11/22 21:18","c":1,"r":"tw","u":"https://news.cnyes.com/news/id/6669868","p":1795349928,"a":1795392897,"t":"AI美股領跌全球資產，Anthropic加劇流動性壓力，比特幣失守6萬美元大關","su":"BlockBeats 리듬 금융 BlockBeats 뉴스, 어젯밤과 오늘 아침, 11월 21일 글로벌 리스크 시장에 블랙 프라이데이가 시작되었습니다. 미국 주식과 금속은 전반적으로 급락했습니다. S&P500(미국 큰 회사 500곳 지수)은 3.70% 하락한 6,910.39포인트로 7일 연속 하락했으며 200일 이동평균선 아래로 떨어졌습니다. 나스닥(미국 기술 회사들이 많은 주식시장) 종합지수는 5.28% 하락한 22,617.73포인트를 기록했고, 다우존스 지수도 하락했습니다. 48,147.33포인트로 1.93%. 주가가 폭락하면서 시장 패닉을 측정하는 VIX 지수는 지난해 관세 혼란 이후 VIX 지수 종가 중 가장 높은 35.89까지 치솟았다."},{"s":"금세기에 5번 등장! 미국 증시는 강세를 보여주는 흔치 않은 신호를 보내고 있다. 시장 전망은 역사를 어떻게 기반으로 합니까?","so":"财联社电报","tm":"11/22 20:59","c":1,"r":"cn","u":"https://m.cls.cn/detail/2541371","p":1795348740,"a":1795408816,"t":"本世纪惊现5次！美股罕见信号“发威”，以史为鉴后市如何？","su":"차이롄서, 11월 23일(황준지 편집장) 2026년이 6주도 채 남지 않은 가운데, 미국 주식 투자자들은 1년 동안 상승과 하락을 경험했습니다. AI 열풍, 예상보다 나은 기업 수익, 일련의 대규모 기업공개(IPO)에 힘입어 미국 3대 주가지수는 올해 여러 역사적 기록을 세웠습니다. 이 기간 동안 많은 '에피소드'가 있었지만 월스트리트의 주요 주가 지수가 장기적으로 계속 상승하는 것은 정상인 것 같습니다. 그러나 역사를 통해 강세장이 영원히 지속되지 않는다는 점을 분명히 알 수 있다는 점을 기억하는 것이 중요합니다. 특히 주식 가치가 극도로 높고 지속 불가능한 영역에 진입하는 경우 더욱 그렇습니다. 대부분의 투자자는 개별 주식이나 시장 전체를 평가할 때 검증된 주가수익률(P/E)에 의존합니다. P/E 비율은 지난 12개월 동안의 주당순이익(주식 한 주가 번 돈)을 기준으로 계산되며, 성숙한 기업의 강점을 빠르게 평가하는 데 유용하지만 경기 침체(나라 경제가 쪼그라드는 것)가 발생하고 주당순이익이 마이너스로 변하면 그 효율성이 완전히 상실됩니다."},{"s":"미국 증시 급락, 시장 패닉, AI 급등이 전환점 왔나? ｜사전","so":"香港01","tm":"11/22 20:41","c":1,"r":"hk","u":"https://www.hk01.com/%E5%9C%8B%E9%9A%9B%E5%88%86%E6%9E%90/60413735/%E7%BE%8E%E8%82%A1%E6%9A%B4%E8%B7%8C%E5%B8%82%E5%A0%B4%E6%81%90%E6%85%8C-ai%E7%8B%82%E9%A3%86%E9%80%B2%E5%85%A5%E8%BD%89%E6%8A%98%E9%BB%9E%E4%BA%86%E5%97%8E-%E9%BB%9E%E7%B6%93","p":1795347682,"a":1795408831,"t":"美股暴跌市場恐慌 AI狂飆進入轉折點了嗎？｜點經","su":"지난 11월 20일 금요일, 미국 주식이 폭락했습니다. 다우지수는 1.9% 이상 하락했고, S&P500(미국 큰 회사 500곳 지수) 지수는 3.7%, 나스닥 지수는 약 5.3% 하락하는 등 3대 주요 지수 모두 급락했다. 반도체(전자기기의 두뇌 부품)주가 혈전을 벌이는 등 필라델피아 반도체 지수는 약 10.7% 하락했다."},{"s":"연준의 금리 인상은 AI 퇴각에 반향을 일으키고 글로벌 자산 가격이 재조정됩니다","so":"第一财经","tm":"11/22 20:35","c":1,"r":"cn","u":"https://www.yicai.com/news/103449341.html","p":1795347352,"a":1795356489,"t":"美联储加息与AI退潮共振，全球资产定价再校准","su":"실리콘 밸리에서 런던, 서울, 도쿄에 이르기까지 글로벌 금융 시장은 일련의 격렬한 조정을 경험했습니다. 앤트로픽은 지난 주 나스닥(미국 기술 회사들이 많은 주식시장)에서 역사상 최대 규모의 기업공개(IPO)를 완료했지만 시장 심리를 무너뜨린 마지막 지푸라기가 되었습니다. 주식, 귀금속, 암호화폐 등이 거의 동시에 집중 매도로 어려움을 겪었습니다. 11월 20일 거래 마감 현재 다우존스 산업평균지수는 주당 8.02%, S&P500(미국 큰 회사 500곳 지수) 지수는 주당 8.61%, 나스닥 100 지수는 한 주 만에 10% 이상 하락해 최근 고점 대비 20% 하락했다. 세션 동안 대규모 기술주가 종합적으로 하락했습니다. VIX 패닉지수는 장중 한때 40을 넘어 2025년 4월 이후 최고치를 기록했다. 귀금속 측면에서는 금과 은 선물 가격도 급락했다."},{"s":"미국 증시의 붕괴 물결은 언제 끝날 것인가? 골드만삭스: 세 가지 바닥 신호 관찰 가능 | 글로벌 금융 | 글로벌","so":"UDN","tm":"11/22 19:47","c":1,"r":"tw","u":"https://udn.com/news/story/6811/9894867","p":1795344428,"a":1795351392,"t":"這波美股重挫何時休？ 高盛：可觀察三個觸底訊號| 全球財經| 全球","su":"뉴스를 들어보세요 0:00 / 0:00 미국 증시의 급격한 하락은 언제 끝날까요? 골드만삭스: 세 가지 바닥 신호가 관찰되었습니다. 글로벌 금융시장에 매도 압력이 가중됐다. 골드만삭스는 주식시장이 바닥을 쳤는지 이해하기 위해 관찰할 수 있는 세 가지 신호가 있다고 지적했습니다. 지난 금요일(20일) BMP파리바가 투자자들이 '패닉 매도' 모드에 돌입했다는 소식이 전해지면서 글로벌 증시는 유혈사태를 겪었다. 그러나 지난 목요일(19일) 골드만삭스가 발표한 보고서에는 관측 가능한 시장 바닥 신호 3가지가 나와 있다. 그 중 어느 하나라도 시장 회복에 도움이 될 것입니다. AI의 이익 전망에 대한 시장의 신뢰가 안정화되었는지 여부입니다. 인공지능(AI) 스타트업 앤쓰로픽(앤트로픽)과 오픈AI의 가격 전쟁이 서로에게 상처를 주고 있다. 앤트로픽은 지난 주에 기업공개(IPO)를 완료했습니다. (IPO)), 지난 19일 상장(주식시장에 처음 들어오는 것) 첫날 17% 급등했지만, 20일에는 급락해 발행가를 거의 밑도는 수준까지 떨어졌다. 이는 AI 투자를 부활시키는 데 실패했으며 지출 대비 수익에 대한 투자자의 높은 우려를 부각시켰습니다."},{"s":"GTA 6가 판매 기록을 경신하고 있습니다! ISA를 위해 S&P500 주식을 구매해야 합니까?","so":"Yahoo Finance UK","tm":"11/22 19:17","c":1,"r":"us","u":"https://uk.finance.yahoo.com/news/gta-6-breaking-sales-records-101729835.html","p":1795342649,"a":1795351380,"t":"GTA 6 is breaking sales records! Should I buy this S&P 500 stock for my ISA?","su":"Grand Theft Auto 6 제작사 뒤에 있는 S&P500(미국 큰 회사 500곳 지수) 회사가 게임에서 돈을 벌 것으로 예상됩니다."},{"s":"월스트리트저널: 민주당은 트럼프 수사에 집중할 계획, 백악관은 정치적 사기 비난하며 협조 거부","so":"鉅亨網","tm":"11/22 19:00","c":1,"r":"tw","u":"https://m.cnyes.com/news/id/6669857","p":1795341605,"a":1795351395,"t":"華爾街日報：民主黨擬定針對川普調查重點 白宮批政治騙局拒配合","su":"월스트리트저널(WSJ)에 따르면 미국 하원 감시위원장을 맡을 것으로 예상되는 로버트 가르시아 캘리포니아 민주당 의원은 최근 트럼프 전 대통령 가족과 정부 관료들에게 기록보존 통지서 12통을 보내 민주당이 내년 새 의회에서 소환권을 얻은 뒤 집중 조사에 나설 것이라고 경고했다. 가르시아는 \"이것은 시작에 불과하다\"고 공개적으로 선언했다. 민주당이 계획한 조사는 네 가지 주요 영역에 초점을 맞추고 있습니다. 1. 가족 사업 이익: 이 서한은 도널드 트럼프 주니어와 에릭 트럼프가 가족 암호화폐 회사인 월드 리버티 파이낸셜(World Liberty Financial)을 이익을 위해 이용하고 있다고 비난합니다. 이에 대해 회사 대변인은 이번 조사를 '근거 없는 마녀사냥'이라고 일축하며 회사가 모든 법률을 준수하고 있다고 강조했다. 이 밖에도 트럼프의 사위 재러드 쿠슈너가 부과한 높은 수수료와 킴벌리 길포일 전 대사의 수수료 징수 의혹도 사례금을 위장한 것이라는 의혹이 제기됐다."},{"s":"CITIC증권 : 2027년 미국 증시 AI 산업 체인은 연초 밸류에이션 압박, 연말 밸류에이션 회복, 연말 실적 차별화 등 단계적 특성을 보일 것으로 예상된다.","so":"Jiemian.com","tm":"11/22 18:56","c":1,"r":"cn","u":"https://www.jiemian.com/article/15359079.html","p":1795341375,"a":1795351382,"t":"中信证券：美股2027年AI产业链预计呈现年初估值承压、年中估值修复、年末表现分化的阶段性特征"},{"s":"AI가 주도하는 트럼프 강세장에 주식시장 붕괴가 임박한 걸까? 역사는 불쾌한 대답으로 가득 차 있습니다.","so":"The Globe and Mail","tm":"11/22 18:33","c":1,"r":"us","u":"https://www.theglobeandmail.com/investing/markets/markets-news/motley/8955033/is-a-stock-market-crash-imminent-for-the-ai-driven-trump-bull-market-history-weighs-in-with-an-unpleasant-answer/","p":1795340037,"a":1795351380,"t":"Is a Stock Market Crash Imminent for the AI-Driven Trump Bull Market? History Weighs In With an Unpleasant Answer.","su":"요점 - 도널드 트럼프 대통령 집권 후 다우존스 산업평균지수, S&P500(미국 큰 회사 500곳 지수), 나스닥(미국 기술 회사들이 많은 주식시장) 종합지수는 좋은 성적을 거두었지만 주식시장은 흔들리는 모습을 보이고 있습니다. - 인공 지능(AI)의 채택은 차트에서 벗어나 있지만 획기적인 기술은 성숙하는 데 오랜 시간이 걸리는 경우가 많습니다."},{"s":"[뉴욕채권-주간] 연준 긴축 증시가 대신 해주나…다가오는 '침묵 기간' |","so":"연합인포맥스","tm":"11/22 18:15","c":1,"r":"kr","u":"https://news.einfomax.co.kr/news/articleViewAmp.html?idxno=4445897","p":1795338910,"a":1795351379,"su":"[뉴욕채권(나라나 회사에 돈 빌려준 증서)-주간] 연준(미국의 중앙은행) 긴축 증시가 대신 해주나…다가오는 '침묵 기간' 증시 급락 속 '빅스텝' 사그라드는 듯…뉴욕 연은 총재 발언 주목 추수감사절로 거래일 짧아져…23~25일 사흘 연속 국채 입찰 (서울=연합인포맥스) 김성진 기자 = 이번 주(23~27일) 뉴욕 채권시장은 뉴욕증시의 반등 여부를 최대 화두로 삼을 것으로 전망된다. 미국 추수감사절 주간을 맞아 거래일은 1.5일 단축된다. 뉴욕증시 대표지수인 S&P 500은 지난주 마지막 거래일인 20일까지 7거래일 연속 밀렸다."},{"s":"구글, 월스트리트 주식 끌어내려","so":"AFP.com","tm":"11/22 16:13","c":1,"r":"world","u":"https://www.afp.com/pt/node/3849984","p":1795331625,"a":1795389890,"t":"Google drags down Wall Street stocks"},{"s":"미국 증시는 대규모 기업공개(IPO) 이후 급락했다. 역사적 현상이 또 반복되는 걸까?","so":"21财经","tm":"11/22 15:39","c":1,"r":"cn","u":"https://www.21jingji.com/article/20261122/herald/6b9fb1314f51f4741476f4d5ef6cb05b.html","p":1795329540,"a":1795351384,"t":"巨型IPO之后美股大跌，历史现象又一次复现？","su":"해설자 Du Hengfeng에 따르면 11월 19일 앤트로픽은 발행가 83달러로 나스닥에 상장되었습니다. 첫날 17.07% 상승률을 기록했고 935억 달러(과잉 할당 포함)를 모금했습니다. 사모를 포함해 총 자금조달 규모는 약 1,195억 달러에 달해 역사상 최대 규모의 기업공개(IPO)가 됐다. 그러나 종소리의 여운은 아직 사라지지 않았고 미국 증시는 하락세로 돌아섰습니다. 19일 미국 3대 주가지수는 모두 2% 이상 하락했습니다. 다음날 매도세(팔려는 힘)는 더욱 거세졌고, 나스닥은 하루 만에 5.28% 하락한 22,617.73포인트로 마감해 2026년 이후 상승세를 모두 청산했다. '공포지수' VIX는 한때 35를 넘기며 급등했다. 기술주, 특히 AI 하드웨어 산업체인이 가장 큰 타격을 입었다. 필라델피아 반도체(전자기기의 두뇌 부품) 지수는 20일 하루 만에 10.73% 하락했고, 30개 구성종목 모두 하락했다. 엔비디아는 7일 연속 하락세인 14.01% 하락했고, 이번 주 누적 하락폭은 22.92%로 2008년 10월 이후 최대 주간 하락폭이다. AMD, 마이크론, 브로드컴 등은 모두 12% 이상 하락했고, TSMC ADR은 9.48% 하락했다. 앤트로픽도 상장 둘째 날 8.5% 하락해 장중 발행가 83달러에 가까웠다."},{"s":"미국 주식이 폭락하면 연준이 퇴임하게 될까요? 뱅크오브아메리카의 Hartnett는 연준의 금리 인상 중단 결정의 핵심을 밝힙니다.","so":"工商時報","tm":"11/22 15:14","c":1,"r":"tw","u":"https://www.ctee.com.tw/news/20261122700452-430702","p":1795328040,"a":1795334501,"t":"美股崩跌逼宮Fed？美銀Hartnett揭聯準會升息喊停關鍵- 國際","su":"미국 주식의 급격한 조정은 연준이 계속해서 금리(돈을 빌릴 때 내는 이자 비율)를 인상하는 것을 막는 가장 빠른 방법이 될 수 있습니다! 뱅크오브아메리카의 수석 투자 전략가인 Michael Hartnett는 최신 \"Flow Show\" 보고서에서 S&P500(미국 큰 회사 500곳 지수)이 2026년 이후 모든 상승폭을 포기하고 6,845포인트로 떨어지면 연준이 긴축 정책을 재평가하게 될 수 있다고 지적했습니다. S&P는 지난 금요일 6,910포인트로 마감했는데, 이는 이 주요 bp에서 불과 65포인트 떨어져 있습니다."},{"s":"2018년 대본의 반복인가요? 미 증시는 투자자들이 연준의 긴축 정책에 의문을 제기하면서 급락했습니다.","so":"鉅亨網","tm":"11/22 14:00","c":1,"r":"tw","u":"https://news.cnyes.com/news/id/6669834","p":1795323603,"a":1795334502,"t":"2018年劇本重演？美股暴跌 投資人質疑聯準會緊縮政策","su":"미국 증시는 6일 연속 하락했고, S&P500(미국 큰 회사 500곳 지수) 지수는 200일선 아래로 떨어졌습니다. 골드만삭스는 매도 압력이 '포괄적 청산'이라며 금융 여건이 급속히 긴축되고 있다고 말했다.\n연준 관계자들은 매파적인 신호를 보냈고 월러는 금리를 0.5%포인트(퍼센트끼리 뺀 차이) 인상할 가능성을 언급했으며 골드만삭스는 여전히 12월에 0.25% 포인트 금리를 인상하고 2027년 3월에 또 한 번 금리를 인상할 것으로 예상하고 있습니다.\n금은 온스당 미화 3,600달러 아래로 떨어졌고, 구리 가격은 하루 만에 약 5% 하락했습니다. 골드만삭스는 금 주식의 동일한 하락은 유동성 위축을 의미하며 채권 시장은 단기 국채에 편향되어 있다고 말했습니다."},{"s":"나스닥은 하루 23시간 거래되는데, A주와 H주는 어떤 영향을 미칠까? 투자자들은 이러한 점을 주의해야 합니다.","so":"21财经","tm":"11/22 13:48","c":1,"r":"cn","u":"https://www.21jingji.com/article/20261122/herald/41e463756f48643ee80e4390600451a0.html","p":1795322880,"a":1795351387,"t":"纳斯达克一天交易23小时，A股H股影响几何？这几点投资者留意","su":"21세기 비즈니스 헤럴드 기자 최원징(Cui Wenjing) 나스닥(미국 기술 회사들이 많은 주식시장)은 12월 6일부터 매일 거래 시간을 6.5시간에서 23시간으로 늘려 거의 '전천후 거래'를 달성할 예정이다. 그때쯤이면 A주(중국 본토 주식시장 주식)와 H주가 거래될 때 미국 주식도 동시에 거래될 것입니다. 선완홍위안증권의 수석시장전문가 구이하오밍은 거래시간 연장은 “시장 활성화와 시장 효율성 제고를 고려한 것이 아니라 대부분 글로벌 경쟁을 고려한 것”이라고 분석했다. 시행 이후의 영향은 아직 두고 봐야 한다고 판단했지만, 이제 한 가지 영향을 예상해볼 수 있다. A주와 H주의 장중 등락폭이 커질 가능성이 높다는 점이다. Gui Haoming은 세 가지 측면에서 관찰할 것을 제안했습니다. ① A주는 원래 시장 개장 전 밤새 미국 주식의 추세에 대해서만 배웠으며, 그 상승 및 하락은 향후 A주에 실시간 영향을 미칠 것입니다. ② A주의 국제화 정도는 그다지 높지 않으며, 그 영향은 '심리적 수준'에 가깝습니다. ③H주 자금은 전 세계적으로 배분되며, 미국 주식의 운용이 이에 직접적인 영향을 미칩니다."},{"s":"미국 부채의 다른 측면은 “더 이상 호의적이지 않다”는 것입니다. 외국인 투자자들이 미국 주식을 사상 최고치에 매수하고 있습니다!","so":"财联社","tm":"11/22 13:37","c":1,"r":"cn","u":"https://www.cls.cn/detail/2493797","p":1795322225,"a":1795351388,"t":"美债“不香了”的另一面：外资创纪录爆买美股！","su":"① 7월까지 12개월 동안 외국인 투자자의 미국 주식 및 투자 펀드 주식 순매수(산 돈이 판 돈보다 많은 것)액은 9,420억 달러로 사상 최대치를 기록했다. ② 이는 해외자금이 미국 채권(나라나 회사에 돈 빌려준 증서)시장에서 미국 증시으로 이동하는 추세를 어느 정도 반영한다. 차이롄서, 9월 28일(Editor Xiaoxiang) 지난 금요일 발표된 최신 데이터에 따르면 7월까지 12개월 동안 외국인 투자자의 미국 주식 및 투자 펀드 주식 순매수액은 9,420억 달러로 사상 최고치를 기록했습니다. 이는 해외자금이 미국 채권시장에서 미국 증시으로 이동하는 추세를 어느 정도 반영한다. 1985년 이후 미국 재무부 데이터에 따르면 이러한 유입은 12개월 연속 새로운 기록을 세웠습니다."},{"s":"[모닝포스트] 미국 나스닥 지수가 500포인트 넘게 하락했고, 반도체와 스토리지주도 전반적으로 급락했다. 젠슨 황은 \"AI 시장 충격\"에 대해 이야기했습니다. 국제유가가 급등했다. Shenghong Technology, OmniVision Group 등이 자사주 매입 예정","so":"财联社","tm":"11/22 13:35","c":1,"r":"cn","u":"https://www.cls.cn/detail/2507382","p":1795322144,"a":1795351390,"t":"【早报】美股纳指大跌超500点，半导体、存储股全线跳水；黄仁勋谈“AI市场震荡”；国际油价大涨；胜宏科技、豪威集团等计划回购股份"},{"s":"미국 증시가 무너지고 있나요? AI 산업은 버블 붕괴인가, 가격 재평가인가?","so":"鉅亨網","tm":"11/22 13:10","c":1,"r":"tw","u":"https://news.cnyes.com/news/id/6669832","p":1795320609,"a":1795334504,"t":"美股慘崩 AI產業是泡沫破裂還是價格重估？","su":"나스닥은 이번 주에 10% 하락했고 고점 대비 약 18% 하락했습니다. S&P500(미국 큰 회사 500곳 지수)과 다우존스 지수도 기술적 조정 범위에 진입했습니다.\n엔비디아는 일주일 만에 약 23% 하락했으며 시가총액(회사 전체 몸값)은 2조 7천억 달러 증발했습니다. 코어위브, AMD, 알파벳과 같은 AI 공급망은 동시에 압박을 받았습니다.\n시장에서는 AI의 높은 자본지출이 수익으로 전환되기 어렵고, 금리와 자금조달 비용의 상승으로 가치평가 재평가가 심화될 것이라고 우려하고 있다."},{"s":"앤트로픽 급락에 월가 '책임 공방'...패닉지수 10점 만점에 9점","so":"YTN","tm":"11/22 12:09","c":1,"r":"kr","u":"https://www.ytn.co.kr/_ln/0104_202611221209256822","p":1795316940,"a":1795334494,"su":"지난주 사상 최대 규모 상장(주식시장에 처음 들어오는 것)으로 주목을 끌었던 AI 기업 앤트로픽이 데뷔 이틀 만에 급락하자 월가에서는 책임 공방이 벌어지고 있습니다. 앤트로픽 상장이 AI 거품에 대한 불안감을 되레 키우면서 이번 주 증시 전망도 어두울 거란 관측이 나오고 있습니다. 국제부 연결해 자세한 내용 알아보겠습니다."},{"s":"[중국뉴스] 기술주 급락으로 미국 증시 전체가 조정 국면에 진입","so":"央视网","tm":"11/22 11:08","c":1,"r":"cn","u":"https://tv.cctv.com/2026/11/22/VIDEE8PTcQrgp4dJmf3zQFfV261122.shtml","p":1795313280,"a":1795351391,"t":"[中国新闻]科技股暴跌拖累美股整体进入回调区间","su":"프로그램 공식 홈페이지 Collection Playlist 현재 재생 중 Hot 목록 현재 재생 중 현재 재생 중 [중국 뉴스] 기술주 급락으로 미국 증시 전체가 조정 범위에 진입했습니다. 출처 : CCTV.com 2026-11-22 10:08 내용 소개 영상 소개 팔로우 기술주 급락으로 미국 증시 전체가 조정 범위에 들어갔습니다. 칼럼 정보 칼럼명 : 칼럼 소개 : [중국뉴스] 기술주 급락으로 미국 증시 전체가 조정 범위에 진입했습니다. 서문 출처 : CCTV.com 업데이트 시간 : 2026년 11월 22일 10:08 영상 소개 기술주 급락으로 미국 증시 전체가 조정 범위에 진입했습니다. 칼럼 정보 재생목록 더보기 > 지난 쿼리 > 하이라이트 더보기 > 지난 프로그램 더보기 > 재생목록 닫기 5월 4월 3월 2월 더보기 Loading..."},{"s":"미국 주식의 3분기 실적 시즌이 다음 주에 시작됩니다! Deutsche Bank: 세 가지 핵심 원동력이 놀라움을 가져올 수 있습니다","so":"财联社","tm":"11/22 07:26","c":1,"r":"cn","u":"https://www.cls.cn/detail/2501252","p":1795300003,"a":1795356492,"t":"美股Q3财报季下周拉开帷幕！德银：三大核心动力或带来惊喜","su":"① 도이체방크는 3분기 S&P500(미국 큰 회사 500곳 지수) 구성종목 이익 증가율이 시장 컨센서스(전문가들의 평균 예상) 기대치를 크게 웃도는 전년 동기 대비 34%로 사상 최고치를 기록할 것으로 전망했다. ② 도이체방크는 인공지능에 대한 수요가 계속 강하고, 미국 경제의 순환적 성장이 가속화되고, 에너지 및 원자재 가격이 계속 강세를 보이고, 관세 환급이 기업 이익으로 계속 유입되고 있다는 점을 지적했는데, 이는 모두 낙관적인 전망을 뒷받침한다. 차이롄서, 10월 10일(Liu Rui 편집자) 미국 증시의 세 번째 재무 보고 시즌이 다음 주에 시작되면서 월스트리트 투자 은행들도 이번 재무 보고 시즌에 대한 전망을 밝혔습니다. 월스트리트는 인공지능의 강력한 힘에 힘입어 일반적으로 미국 주식이 또 한 번 강한 실적 시즌을 맞이할 것으로 예상하고 있습니다. 하지만 그 중에서도 도이체방크의 실적시즌 기대감이 가장 낙관적일 수 있다. 도이체방크는 3분기 S&P500 구성종목 이익성장률이 전년 동기 대비 사상 최고치인 34%에 달할 것으로 내다봤다. 이는 현재 시장 컨센서스인 26.7%를 크게 웃도는 수준이다."},{"s":"앤트로픽이 나스닥 상장 17% 높은 시가총액 280조엔 NY다우는 5개월 만에 5만 달러 균열","so":"テレ東BIZ","tm":"11/22 04:42","c":1,"r":"jp","u":"https://txbiz.tv-tokyo.co.jp/hiru/news/post_352898","p":1795290131,"a":1795351396,"t":"アンソロピックがナスダック上場 17％高 時価総額280兆円 NYダウは5カ月ぶり5万ドル割れ","su":"미국의 AI 개발 기업 앤트로픽이 19일 나스닥(미국 기술 회사들이 많은 주식시장) 시장에 상장했다. 첫날은 기업공개(IPO) = 신규 주식공개 공개가격을 약 17% 상회 거래를 마쳤습니다. 첫 가격은 공개 가격을 34% 웃도는 111달러 50센트, 종가는 17% 상승한 97달러 17센트였다. 종가를 기준으로 한 시가총액(회사 전체 몸값)은 약 1조7600억 달러 = 280조엔에 이릅니다. 다만, AI 투자에 대한 우려는 뿌리 깊고, 19일 뉴욕 주식시장의 다우 평균은 전날보다 1101달러 내린 4만9097달러와 약 5개월 만에 5만달러의 고비를 끼어들어 거래를 마쳤습니다."},{"s":"S&P500은 일주일 만에 9% 급락했다. 찰리 멍거는 2년 만에 53% 손실을 본 적이 있습니다. 200만 달러를 가진 66세 노인에 대한 그의 테스트는 다음과 같습니다.","so":"Yahoo Finance","tm":"11/22 01:47","c":1,"r":"us","u":"https://finance.yahoo.com/markets/stocks/articles/p-500-just-plunged-9-164700486.html","p":1795279620,"a":1795334494,"t":"The S&P 500 Just Plunged 9% in a Week. Charlie Munger Once Lost 53% in Two Years. Here’s His Test for a 66-Year-Old With $2 Million"},{"s":"CrowdStrike, 보안 업계 최대 인수합병 규모가 될 라이벌 Zscaler 인수 계획 | 미국 증시 동향 | 국제","so":"經濟日報","tm":"11/22 00:26","c":1,"r":"tw","u":"https://money.udn.com/money/story/123398/9893882?from=edn_hotestlist_storybottom","p":1795274807,"a":1795356493,"t":"將成資安業最大併購案 CrowdStrike 擬收購同業 Zscaler | 美股動態 | 國際","su":"이 문제에 정통한 소식통에 따르면 네트워크 보안 회사인 CrowdStrike는 동료 Zscaler 인수를 위해 협상 중이며 가까운 시일 내에 거래가 완료될 수 있습니다. 이번 협상이 성사되면 정보보안 업계 역사상 최대 규모의 인수합병(M&A)이 이뤄지고, 세계 최대의 네트워크 보안 서비스 전문 공급업체 중 하나가 탄생할 것으로 예상된다."}]},{"name":"🧬 나스닥 바이오","note":"보유: TIGER 미국나스닥바이오","breaking":false,"items":[{"s":"혁신적인 약물 구현을 촉진하기 위해 첫 번째 '의학 및 교육 대면' 스테이션이 광저우에서 개최되었습니다.","so":"中国新闻网","tm":"11/21 21:19","c":2,"r":"cn","u":"https://www.chinanews.com.cn/sh/2026/11-21/10735862.shtml","p":1795263543,"a":1795265090,"t":"“医药保学面对面”首站在穗举办 推动创新药落地","su":"혁신적인 약물의 구현을 촉진하기 위해 첫 번째 '학교 보호를 위한 대면 의학' 행사가 광저우에서 개최되었습니다. 중국신보사, 광저우, 11월 21일(채민제 기자) 21일 광저우에서 2026년 의료보험약품 카탈로그 신품종 대상 '학교보호를 위한 대면의학' 행사(제1차)가 열렸다. 이번 행사에서 발표된 신호는 더욱 명확합니다. 국민의료보험청은 혁신적인 의약품 접근의 초점을 \"카탈로그 입력\"에서 \"병원 입력, 처방전 입력, 강의실 입력\"으로 확대하여 신약이 환자의 실제 요구에 더 빨리 혜택을 줄 수 있도록 하고 있습니다. 혁신적인 의약품의 경우 카탈로그에 포함되는 것은 단지 \"임신 증명서\"일 뿐입니다. 실제 접근성은 해당 약물이 임상(새 약을 사람에게 시험하는 것)적으로 알려져 있는지, 사용할 수 있는지, 환자가 찾을 수 있는지에 따라 달라집니다. 국민의료보험국 약품서비스관리부 황신위 국장은 2026년 의료보험 약품 목록에 신품종과 관련 정책이 추가될 것이라고 소개했다. 2026년판 의료보험 약품 목록에는 총 3,331종의 약품이 있는데, 그중 신규 약품이 107개이고 이전된 약품이 34개이다. 신약 중 103개는 5년 이내에 새로 출시된 신약이고, 51개는 카테고리 1 신약으로 모두 새로운 최고치입니다. 60개 신약에는 화학약품, 36개 생물의약품, 11개 중국전통특허의약품이 포함된다. 신약 중 종양분야는 29개, 만성질환은 21개, 희귀질환은 18개다."},{"s":"강력한 위험 회피, 신흥 생명공학 및 구리 주식 상승","so":"中時新聞網","tm":"11/21 05:10","c":2,"r":"tw","u":"https://www.chinatimes.com/newspapers/20261121000274-260206","p":1795205400,"a":1795215144,"t":"避險情緒濃 興櫃生技、銅板股崛起","su":"대만 증시 폭락이 계속되는 가운데 가치주(제값보다 싸 보이는 주식)들이 공매도(주식을 빌려서 먼저 파는 것)자들의 피바다를 겪고 있다. 시장펀드는 보수적으로 변했고, 신흥시장에서는 생명공학과 저가주가 추세를 거스르고 있다. 이번 주 주간 상승률 상위 10개 기업의 통계에 따르면, 생명공학 주식은 단숨에 7계단 하락했습니다. 시지바이오메디칼(7595)이 주간 15.3% 상승하며 우승을 차지했다. 공황상태의 매도 압력으로 인해 전자는"},{"s":"홍콩 혁신 의약품 ETF Invesco(513780) 추적 지수 CSI Hong Kong Stock Connect Innovative Drug Index는 1.29% 상승했으며 추적 지수는 지난 1년 동안 최저 평가에 도달했습니다.","so":"Jiemian.com","tm":"11/23 12:37","c":1,"r":"cn","u":"https://www.jiemian.com/article/15360892.html","p":1795405055,"a":1795408841,"t":"港股创新药ETF景顺(513780)跟踪指数中证港股通创新药指数上涨1.29%，跟踪指数已处近1年估值低位","su":"2026년 11월 23일 11시 22분 기준, 홍콩 혁신의약품 ETF(여러 주식을 묶어 파는 상품) Invesco(513780) 추적지수 CSI Hong Kong Stock Connect Innovative Drug Index는 1.29% 상승했으며, 지난 1년간 추적지수는 낮은 평가를 받았습니다."},{"s":"Hong Kong Stock Connect Pharmaceutical ETF Penghua(513700)와 항셍 Biotech ETF Penghua(159130)가 활발하게 거래되고 있으며, 정책 및 산업 공조가 부문 시장을 촉진합니다.","so":"Jiemian.com","tm":"11/23 12:01","c":1,"r":"cn","u":"https://www.jiemian.com/article/15360535.html","p":1795402887,"a":1795408844,"t":"港股通医药ETF鹏华(513700)、恒生生物科技ETF鹏华(159130)交投活跃，政策产业共振催化板块行情","su":"뉴스에 따르면 11월 23일 2026년 의료보험과 상업보험의 '이중 카탈로그'가 공식 발표되어 결제 시스템이 '다층 결제, 가치 중심'으로 실질적 전환을 나타냈다. 또한, 글로벌 뇌-컴퓨터 인터페이스 기업 수는 2026년 800개 이상에서 1,175개로 증가해 2025년 대비 빠른 성장을 이룰 전망이다. 중국의 뇌-컴퓨터 인터페이스 산업은 베이징-천진-허베이, 장강 삼각주, 광둥, 홍콩, 마카오 등 3대 도시 집합체에 집중되어 있으며, 총 190개 이상의 기업이 전체 시장의 77.4%를 차지한다. 나라 전체. 종타이증권은 연준의 금리 인상에 대한 기대가 높아지고 임상 데이터 검증의 차이로 인해 장기 혁신의약품 자산의 가치 평가가 압박을 받았지만 업계의 번영은 근본적으로 변하지 않았다고 밝혔다. 현재 수익 예측 데이터를 활용해 계산하면 우시앱텍 등 일부 선두 CDMO의 벤치마크 시장가치 PER(주가가 이익의 몇 배인지)은 약 14.1배에 불과해 조정 밸류에이션(주가가 비싼지 싼지 따진 값) 수준이 매력적이다. 해외 금리 변동의 주기적 교란을 무시하고, 세계 최고의 역량을 갖춘 선도적인 CDMO와 거래량 및 가격 회복 리듬이 뚜렷한 선도적인 임상 CRO에 집중하고, 과매도 이후 가치 회복의 기회를 포착하는 것이 좋습니다."},{"s":"혁신신약 개념 일부 변화","so":"第一财经","tm":"11/23 11:16","c":1,"r":"cn","u":"https://www.yicai.com/brief/103449765.html","p":1795400160,"a":1795403778,"t":"创新药概念局部异动","su":"2026/11/23 10:16 [혁신신약(세상에 처음 나온 새로운 약) 개념 일부 변경] 라이메이제약과 Nearshore Protein이 10% 이상 상승했으며, Bepsis, Yaokang Biotech, Wanbang Pharmaceuticals, Medicilon이 상승세(오르는 흐름)를 주도했습니다."},{"s":"평가 1점: TROP2 ADC가 다시 임상 3상 성공을 달성하며, Kelun의 글로벌 약물 로직이 확고해졌습니다.","so":"第一财经","tm":"11/23 10:36","c":1,"r":"cn","u":"https://www.yicai.com/news/103449638.html","p":1795397812,"a":1795403779,"t":"壹评级：TROP2 ADC再获临床三期成功，科伦全球大药逻辑夯实","su":"11월 20일, 머크는 콜롬보트의 허가를 받은 TROP2 ADC 약물 sac-TMT가 위식도 선암종에 대한 3상 연구에서 전체 생존율(OS)의 1차 평가변수를 달성했다고 발표했습니다. 중국 비즈니스 네트워크(China Business Network)의 'One Rating'은 자궁내막암에 이어 난치성 위장관 종양에 대한 하드 엔드포인트를 통해 약효가 다시 한 번 검증되었으며, 이는 '글로벌 의약품'으로서의 잠재력이 확률적 판단에서 사실 확인으로 더욱 전환되었으며, 가치 평가의 확실성이 크게 향상되었음을 의미한다고 믿습니다. 원레이팅(One Rating)은 3차 위식도 선암종 환자들이 다제제 내성을 경험한 사례가 있으며, 중앙생존기간은 일반적으로 1년 미만이라고 지적했다. 이처럼 매우 이질적인 집단에서 임상(새 약을 사람에게 시험하는 것)적으로 의미 있는 전체 생존(OS) 이점을 달성하는 것은 sac-TMT가 강력하고 광범위한 항종양 활성을 가지고 있음을 입증합니다. 특정 바이오마커에 의존하지 않고 종양 유형 전반에 걸쳐 전체 생존(OS)을 개선하는 이러한 능력은 적응증 경계를 확장하는 혁신적인 약물에 대한 핵심 지원입니다. 본 연구의 2차 평가변수인 무진행 생존율(PFS)은 통계적으로 유의미한 수준에 도달하지 못했지만, 후기 치료와 의사의 화학요법 대조군 선택 측면에서 OS는 규제 기관에서 가장 중요하게 여기는 최적 기준이며, 긍정적인 결과는 핵심 적용 논리를 확립하기에 충분합니다."},{"s":"큐리언트 아드릭세티닙, 급성 골수성 백혈병 1차 치료로 임상 확대… FDA 승인 - 머니투데이","so":"머니투데이","tm":"11/23 08:50","c":1,"r":"kr","u":"https://www.mt.co.kr/index.php/stock/2026/11/23/2026112308460781755","p":1795391403,"a":1795392914,"su":"혁신신약(세상에 처음 나온 새로운 약) 개발기업 큐리언트는 미국 MD앤더슨 암센터가 주관하는 급성 골수성 백혈병(AML) 임상의 임상시험(새 약을 사람에게 시험하는 것)계획 변경이 미국 식품의약국(FDA)으로부터 승인됐다고 23일 밝혔다. 앞선 용량증가 단계에서는 베네토클락스를 포함한 표준 치료에 실패한 R/R AML 환자를 대상으로 Ven/Aza에 아드릭세티닙을 더한 3중 병용요법을 평가했으며, 연구진은 Ven/Aza와 병용할 때 아드릭세티닙의 임상 2상 권장용량을 120mg(1주 투여·1주 휴약)으로 결정했다."},{"s":"주가 방어 위해 생명공학업계, 자사주 희생 - Daily News","so":"工商時報","tm":"11/23 04:00","c":1,"r":"tw","u":"https://www.ctee.com.tw/news/20261123700180-439901","p":1795374000,"a":1795389899,"t":"捍衛股價生技業祭出庫藏股- 日報","su":"3분기부터 자사주(회사가 가진 자기 회사 주식)를 도입한 바이오기업들이 주가를 방어하는 모습을 보였다. 잇따라 자사주를 공모하거나 대주주들이 적극적으로 지분을 늘리고, 경영진이 지분 보유 락업 기간을 연장하는 등의 조치를 취하고 있다. 이로 인해 시장 보호의 물결이 시작되었습니다! 3분기 이후 Kangpei*, Handa, Quanyu-KY, Changjia 등 8개 회사가 자사주를 공모했으며, 총 계획 자사주는 12,814주, 최대 자사주 매입(회사가 자기 주식을 다시 사는 것) 규모는 약 11억 7천만 위안입니다. 또 라멕스 회장은 지분을 늘리기 위해 약 820만 위안을 투자한 한강KY..."},{"s":"16개 바이오기업 대주주, 2개월 연속 자사주 매입 - 매일경제","so":"工商時報","tm":"11/23 04:00","c":1,"r":"tw","u":"https://www.ctee.com.tw/news/20261123700183-439901","p":1795374000,"a":1795389900,"t":"16家生技公司大股東連兩月買進自家股票- 日報","su":"최근 생명공학주 하락세가 심화되고 있으며, 대주주들은 시장 수호에 만만치 않습니다! 9월과 10월 거래통계에 따르면 생명공학기업 주주는 총 16명이다. 청예메디칼의 리디아잉 회장이 누적 1,208주를 매입해 1위에 올랐고, 우딩의 대주주인 산양공업이 766주를 매입해 뒤를 이었다. 이 밖에도 린옌성 공동회장과 린더젠 총지배인은 총 544장의 티켓을 추가했고, 바오타이 투자회사와 송호린 회장 등 3명이 총 166장의 티켓을 구매해 향후 운영에 대한 낙관적인 입장을 내비쳤다."},{"s":"보고서: 희민보험 시장은 규모 확대에서 구조 조정으로 전환했으며, 혁신적인 약품 보호 구현은 여전히 청구 막힘을 해소해야 합니다.","so":"ThePaper.cn","tm":"11/22 19:31","c":1,"r":"cn","u":"https://www.thepaper.cn/newsDetail_forward_34534647","p":1795343515,"a":1795351405,"t":"报告：惠民保市场由规模扩张转向结构调整，创新药保障落地仍需打通理赔堵点","su":"희민바오 시장은 초기 급격한 성장을 경험한 후 주가조정 단계에 진입하고 있다. 11월 21일, 푸단대학교 경제대학 부학장이자 위험 관리 및 보험학과장인 Xu Xian 교수팀이 '2026년 도시 맞춤형 상업 의료'를 발표했습니다."},{"s":"생명공학 개척자, 상장 시작을 위해 영국 자본 이득세 감면 요구","so":"Financial Times","tm":"11/22 14:00","c":1,"r":"world","u":"https://www.ft.com/content/01e128fd-58b4-44e9-8c31-c9d0a909b9b7?syn-25a6b1a6=1","p":1795323606,"a":1795334526,"t":"Bi
