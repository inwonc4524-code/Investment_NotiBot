<style>
@font-face{font-family:'ChosunIlboMyungjo';src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_one@1.0/Chosunilbo_myungjo.woff') format('woff');font-weight:normal;font-display:swap}
:root{color-scheme:dark;--bg:#262624;--card:#30302e;--card2:#3a3a37;--text:#faf9f5;--sub:#a6a39a;--line:#3e3e3a;--acc:#d97757;--red:#ef4444}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.55 'ChosunIlboMyungjo',Georgia,"Noto Serif KR",serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:760px;margin:auto}
header{padding:20px 16px 8px}
h1{font:600 22px/1.3 'ChosunIlboMyungjo',Georgia,serif;margin:0 0 4px}
.upd{color:var(--sub);font-size:12.5px}
/* 테마 탭 */
.tabs{position:sticky;top:0;z-index:3;background:rgba(38,38,36,.96);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.tabrow{display:flex;gap:8px;overflow-x:auto;padding:12px 16px 10px;scrollbar-width:none}.tabrow::-webkit-scrollbar{display:none}
.tab{position:relative;flex:none;padding:9px 15px;border-radius:12px;border:1px solid var(--line);background:var(--card);
  color:var(--sub);font:inherit;font-size:14px;cursor:pointer}
.tab b{margin-left:5px;color:var(--sub);font-weight:400;font-size:12px}
.tab.on{background:var(--acc);border-color:var(--acc);color:#1f1e1d;font-weight:600}.tab.on b{color:#1f1e1d}
.dot{position:absolute;top:-3px;right:-3px;width:11px;height:11px;border-radius:50%;background:var(--red);border:2px solid var(--bg)}
/* 정렬·국가 */
.ctrl{display:flex;gap:6px;overflow-x:auto;padding:0 16px 10px;scrollbar-width:none}.ctrl::-webkit-scrollbar{display:none}
.ctrl button{flex:none;border:1px solid var(--line);background:transparent;color:var(--sub);border-radius:8px;padding:5px 11px;font:inherit;font-size:12.5px}
.ctrl button.on{background:var(--card2);border-color:var(--card2);color:var(--text)}
.ctrl .sep{flex:none;width:1px;background:var(--line);margin:2px 4px}
main{padding:6px 12px 48px}
h2{font:600 19px/1.3 'ChosunIlboMyungjo',Georgia,serif;margin:16px 4px 2px}
.note{margin:0 4px 10px;color:var(--sub);font-size:12px}
.none{color:var(--sub);margin:24px 4px;text-align:center}
.card{display:block;background:var(--card);border-radius:12px;padding:12px 14px;margin:8px 0;color:var(--text);text-decoration:none;transition:background .15s}
.card:hover{background:var(--card2)}.card:active{opacity:.75}
.meta{color:var(--sub);font-size:12px}
.title{font-weight:500;margin-top:3px}
.orig{color:var(--sub);font-size:12px;margin-top:3px}
.new{margin-left:4px;color:var(--red);font-size:11px;font-weight:700;letter-spacing:.3px}
.hot{display:inline-block;margin-right:6px;padding:0 6px;border-radius:4px;background:rgba(217,119,87,.16);color:var(--acc);font-weight:600}
.hot.big{background:var(--acc);color:#1f1e1d}
.newbar{display:block;width:100%;margin:2px 0 6px;padding:9px;border:0;border-radius:10px;background:rgba(239,68,68,.14);color:#fca5a5;font:inherit;font-size:13px;text-align:left}
.more{display:block;width:100%;margin:4px 0 0;padding:10px;border:1px dashed var(--line);border-radius:12px;background:transparent;color:var(--sub);font:inherit;font-size:13px}
footer{margin:36px 4px 0;padding-top:14px;border-top:1px solid var(--line);color:var(--sub);font-size:12px;line-height:1.7}
footer b{color:var(--text);font-weight:600}
/* 요약 창 */
#dim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:5}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:6;max-width:760px;margin:auto;max-height:82vh;overflow-y:auto;
  background:var(--card);border-radius:16px 16px 0 0;padding:10px 18px calc(18px + env(safe-area-inset-bottom));box-shadow:0 -8px 30px rgba(0,0,0,.4)}
.grab{width:38px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 12px}
.s-title{font-size:17px;font-weight:600;margin:4px 0 2px;line-height:1.45}
.s-label{margin:16px 0 4px;color:var(--acc);font-size:12px;font-weight:700;letter-spacing:.5px}
.s-sum{font-size:15px;line-height:1.75}.s-sum.empty{color:var(--sub);font-size:13.5px}
.s-btns{display:flex;gap:8px;margin-top:20px}
.s-btns a{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;padding:11px 6px;border-radius:10px;font:inherit;font-size:13.5px;line-height:1.3;text-decoration:none;
  background:var(--acc);color:#1f1e1d;font-weight:600}
.s-btns a.cl{background:transparent;border:1px solid var(--acc);color:var(--acc)}
.s-close button{width:100%;margin-top:8px;padding:11px;border-radius:10px;background:transparent;border:1px solid var(--line);color:var(--sub);font:inherit;font-size:14px}
.s-cnote{margin-top:8px;color:var(--sub);font-size:11.5px;text-align:center}
#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);z-index:9;max-width:90%;padding:10px 16px;border-radius:10px;background:#faf9f5;color:#1f1e1d;font-size:13.5px;box-shadow:0 6px 20px rgba(0,0,0,.4)}
</style></head><body>

내는 이자 비율) 인상에 대한 기대를 약화시켰습니다."},{"s":"달러화, 연준 금리 인상 기대감에 19개월 최고치 기록","so":"财联社","tm":"11/12 20:46","c":2,"r":"cn","u":"https://www.cls.cn/detail/2533064","p":1794483960,"a":1794489606,"t":"美元触及19个月新高 美联储加息预期持续升温","su":"① 미국의 핵심 CPI는 10월 3개월 연속 0.3% 상승했습니다. 연준 관계자들은 매파적인 신호를 내놓았고 시장은 12월에 금리를 0.5%포인트(퍼센트 숫자 자체의 차이) 인상할 가능성을 고려하기 시작했습니다. ② 유럽중앙은행은 12월 이후 금리 인상을 중단할 가능성이 있으며, 미국과 유럽의 금리격차는 더욱 확대될 것으로 예상된다. ③ 일본 엔화가 160선에 가까워지고 있고, 일본 관계자들은 통화시장 개입의 위험성을 경고하고 있다. Financial Associated Press, 11월 12일자(편집자 Xia Junxiong) 목요일 미국 달러 지수는 약 19개월 만에 최고치를 기록한 후 평탄선 근처에서 거래되었습니다. 강력한 인플레이션(물건값이 계속 오르는 것) 데이터로 인해 시장은 연준의 금리 정책 경로를 재평가하게 되었고, 기대감은 상당히 매파적으로 바뀌었고, 이로 인해 미국 단기 국채 수익률이 급격하게 상승했습니다. 연준 관계자들은 최근 매파적인 신호를 잇달아 내놓으며 금리 인상에 대한 시장의 기대를 더욱 강화했다."},{"s":"미국의 두 주식은 강력한 성장세를 보이며 공격과 수비 모두 | 모 하오난","so":"Sing Tao Daily 星島日報加拿大","tm":"11/12 19:07","c":2,"r":"hk","u":"https://www.singtao.ca/7682347/2026-11-12/news-%E5%85%A9%E7%BE%8E%E8%82%A1%E9%A1%AF%E9%95%B7%E5%92%8C%E6%94%BB%E5%AE%88%E5%85%BC%E5%82%99+%7C+%E8%8E%AB%E7%81%9D%E6%A5%A0/","p":1794478050,"a":1794489625,"t":"兩美股顯長和攻守兼備 | 莫灝楠","su":"앞서 AI 주식 폭락으로 포스트시즌 가치투자 바람이 불면서 많은 사람들이 시장에 반등해 국제 사업에 욕심을 낸 창허(0001)를 떠올린다. 허치슨 파마슈티컬스(HCM, 0013)와 캐나다 에너지 기업 세노부스 에너지(CVE) 두 시스템이 미국 주식에 상장(주식시장에 처음 들어오는 것)됐다. Changhe는 Hehuang Medical의 약 38%를 보유하고 있으며 Cenovus에서는 Changhe가 약 16.4%, Lee Family Trust가 약 12.3%를 보유하여 총 30%에 가까운 최대 주주 캠프를 보유하고 있습니다."},{"s":"엔비디아 CEO 사임 이후 북미 주가 지수는 하락세를 기록했습니다.","so":"The Globe and Mail","tm":"11/12 19:05","c":2,"r":"us","u":"https://www.theglobeandmail.com/investing/markets/inside-the-market/market-news/article-premarket-nasdaq-futures-fall-as-nvidia-turmoil-rattles-ai-stocks/","p":1794477945,"a":1794496094,"t":"North American stock indexes open lower after Nvidia CEO steps down","su":"엔비디아(NVDA-Q)가 젠슨 황(Jensen Huang) CEO가 사임하고 AI 산업이 가장 큰 챔피언 없이 물러난다고 발표한 후 목요일 월스트리트의 주요 지수는 하락세로 출발했습니다. 다우존스 산업평균지수는 58.5포인트(0.11%) 하락한 52,427.94를 기록했습니다."},{"s":"미국 인플레이션이 예상보다 높으며, 중국 은행은 연준이 연말까지 금리를 인상할 것으로 예상하고 있습니다.","so" m/money/story/12040/9875378","p":1794489822,"a":1794496108,"t":"那斯達克改了，白天也能買美股！24小時股市正在改變投資人的風險 | 個人理財 | 理財","su":"첫째, 현재는 비전통기 거래량 비중이 적지만, 지정학적 혼란의 시대에 들어 거래량이 확실히 늘어나고 있다는 점이다. 2025년 4월 트럼프 미국 대통령이 세계 여러 나라에 관세(수입품에 붙이는 세금) 조치를 부과했는데, 이는 그해 시장에서 가장 크고 불안정한 위험 요인이 됐다. 투자자들은 위험을 피하기 위해 전통적인 거래 시간 외에 주식을 사고 팔기 시작해야 했습니다. 미국 증권사 로빈후드(Robinhood)의 통계에 따르면 트럼프 대통령의 관세 '해방일' 다음 달에는 회사 거래량의 4분의 1이 정규 거래 시간 외에 발생했다. 중개 사업 책임자인 Steve입니다. 스티브 쿼크는 언제든지 발생할 수 있는 이러한 위험에 대처하기 위해서는 즉시 거래하는 것이 가장 좋은 방법이라고 지적했습니다. \"반응을 다음날 아침까지 기다리면 너무 늦을 것입니다.\" 이 때문에 로빈후드는 주중에 일부 주식과 원자재(물건의 재료(석유·구리 등))에 대해 24시간 거래를 제공했을 뿐만 아니라, 거래 서비스 시간을 주중에서 주말까지 연장하는 방안도 검토 중이다."},{"s":"달러 완화, 단기 국채 수익률 상승","so":"WSJ","tm":"11/12 22:15","c":1,"r":"us","u":"https://www.wsj.com/finance/jgb-yields-fall-as-hopes-for-accelerated-boj-tightening-eases-3eeccda2","p":1794489300,"a":1794496095,"t":"Dollar Eases, Short-End Treasury Yields Rise"},{"s":"21:13:03 파이낸셜 뉴스 에이전시(Financial News Agency), 11월 12일, Nebius 미국 주식은 시장 개장 전 5% 이상 상승한 후 15% 이상 하락했습니다.","so":"财联社","tm":"11/12 22:13","c":1,"r":"cn","u":"https://www.cls.cn/detail/2533090","p":1794489183,"a":1794489607,"t":"21:13:03 财联社11月12日电，Nebius美股盘前跌超15%，此前一度涨超5%。","su":"회사 소개 웹사이트 성명 연락처 사용자 피드백 사이트 맵 도움말 홈 텔레그램 주제 시장 VIP FM 투자 연구 다운로드 모두 추가 Red Company 시청 홍콩 및 미국 주식 펀드 알림 2026년 11월 12일 21:13:03 파이낸셜 뉴스 에이전시(Financial News Agency)는 11월 12일에 Nebius 미국 주식이 5% 이상 상승한 후 시장 개장 전 15% 이상 하락했다고 보도했습니다. 조회수 9847 관련 항목 글로벌 시장 정보 17.41W 팔로우한 미국 주식 동향 7.12W 팔로우한 사람 회사 소개 | 웹사이트 성명 | 문의 | 사용자 피드백 | 사이트맵 | 친절한 링크 | 신고 핫라인: 021-54679377 내선 617 신고 이메일: editor@cls.cn 금융 연합 협회 ©2018-2026 Shanghai Jiemian Financial Union Society Technology Co., Ltd. All Rights Reserved Shanghai ICP No. 14040942-9 Shanghai Public Network Security No. 31010402006047 인터넷 뉴스 정보 서비스 라이센스: 31120170007 Shanghai Jin Xin No. [2021] No. 2"},{"s":"연방준비제도(Fed) 금리 인상 기대로 인해 달러 지원이 유지되어야 함","so":"WSJ","tm":"11/12 22:12","c":1,"r":"us","u":"https://www.wsj.com/finance/currencies/yen-hitting-160-to-dollar-again-wo 서 하락합니다. Brookfield 인프라, Corteva Lag","so":"Barron's","tm":"11/12 21:30","c":1,"r":"us","u":"https://www.barrons.com/articles/s-p-500-futures-fall-in-premarket-trading-brookfield-infrastructure-corteva-lag-8e3cc249","p":1794486600,"a":1794489602,"t":"S&P 500 Futures Fall in Premarket Trading; Brookfield Infrastructure, Corteva Lag"},{"s":"엔비디아는 6% 이상 하락했습니다! 미국 스토리지 및 광통신 주가 약세, SK하이닉스는 3% 이상 하락. 소매 투자자들은 앤트로픽의 상장 첫날 순매수했습니다.","so":"21财经","tm":"11/12 21:12","c":1,"r":"cn","u":"https://www.21jingji.com/article/20261112/herald/04df79314f1a01bcdc46d1029143583a.html","p":1794485573,"a":1794489610,"t":"英伟达跌超6%！美股存储、光通信股走弱，SK海力士跌超3%；Anthropic上市首日散户净买","su":"① [3대 선물지수 혼재 하락] 보도시간 현재 다우선물은 0.05% 상승, S&P500(미국 큰 회사 500곳 지수) 선물은 0.39% 하락, 나스닥(미국 기술 회사들이 많은 주식시장) 선물은 0.82% 하락했다. ②[스토리지·광통신주 하락, SK하이닉스 3% 이상 하락] 스토리지·광통신주 일괄 하락. 보도 시간 현재 스토리지 주식 기준으로 샌디스크, 웨스턴 디지털, 마이크론 테크놀로지, SK하이닉스, 희롱 테크놀로지는 3% 이상 하락했고 씨게이트 테크놀로지는 3% 가까이 하락했다. 광통신 종목별로는 AXT Inc와 Applied Optoelectronics가 5% 이상 하락했고, Coherent는 4% 이상 하락했고, Lumentum, Credo Technology, Marvel Technology, Astera Labs, Viavi Solutions, Ciena, MaxLinear는 3% 이상 하락했고, Corning은 2% 이상 하락했습니다."},{"s":"월스트리트 규제 당국의 공개 기업에 대한 집행 소송이 16년 만에 최저 수준으로 감소","so":"36Kr","tm":"11/12 21:11","c":1,"r":"cn","u":"https://36kr.com/newsflashes/4066720735106179","p":1794485463,"a":1794489611,"t":"华尔街监管机构针对上市公司的执法案件降至16年低点"},{"s":"오피니언: AI 투자 붐이 미국 경제를 다시 과열로 몰아넣고 연준의 금리 인상 압력을 가중시킬 수도 있다.","so":"鉅亨網","tm":"11/12 21:05","c":1,"r":"tw","u":"https://news.cnyes.com/news/id/6660764","p":1794485106,"a":1794489616,"t":"觀點：AI投資熱潮可能推動美國經濟再次升溫，增加美聯儲升息壓力","su":"오피니언: AI 투자 붐은 미국 경제를 다시 과열시키고 연준의 금리(돈을 빌릴 때 내는 이자 비율) 인상 압력을 가중시킬 수 있다. BlockBeats Rhythmic Finance BlockBeats News는 11월 12일 미국의 10월 인플레이션(물건값이 계속 오르는 것) 데이터가 예상보다 높았으며, 이는 소비자가 직면한 가격 압력이 여전히 광범위하고 지속적임을 보여주며 일부 연준 관계자는 인플레이션을 억제하기 위해 보다 급진적인 조치가 필요할 수 있다고 우려하게 했습니다. 지난 3개월 동안 소비자가 컴퓨터와 주변기기에 지불한 가격은 연간 기준으로 25% 상승했습니다. 지난달 스마트폰 가격은 사상 최대 폭의 상승을 기록했는데, 이는 애플의 새로운 아이폰 듀오 출시와 동시에 일어났다. 한편, 데이터 센터에 대한 수요 증가로 인해 전력 수요가 증가하고 있으며, 미국의 10월 전력 가격은 0.9% 상승해 6개월 만에 가장 큰 상승폭을 기록했습니다. TD Securities와 모건스탠리의 분석가들은 이러한 가격 인상이 칩 및 기타 전자제품에 대한 수요 증가를 주도하는 인공지능 관련 수요와 일치한다고 말했습니다."},{"s":"Yuanta 00646은 이러한 추세를 거스르고 배당금을 받아 미국 주식 ETF 정기 할당량 1위를 차지했습니다. - Listing Cabinet","so":"旺得富理財網","tm":"11/12 20:24","c":1,"r":"tw","u":"https://wantrich.chinatimes.com/news/20261112900537-420101","p":1794482675,"a":1794489618,"t":"元大00646逆勢收紅穩居美股ETF定期定額冠軍- 上市櫃","su":"미국 기술주 이슈의 영향으로 12일 대만 증시의 반등이 주춤했다. 미국 증시 S&P500(미국 큰 회사 500곳 지수)지수 유안타 S&P500(00646)이 추세를 뒤집고 상승했다. 10월 증권거래소 자료에 따르면 정기예금계좌 00646개는 계속해서 최고치를 경신하며 해외 ETF(여러 주식을 묶어 파는 상품) 중 1위를 기록했다. 법률 분석에 따르면 장기 투자자의 경우 기술주는 시장 심리로 인해 단기적으로 급격하게 등락할 수 있는 반면, S&P500 지수는 미국 주식 시장의 11개 주요 산업을 광범위하게 포괄하며 더욱 다양화되어 있습니다."},{"s":"State Street SPDR 포트폴리오 S&P500(SPYM), 화요일에 애플 주식 1,520만 달러 추가 매입","so":"Yahoo! Finance Canada","tm":"11/12 20:05","c":1,"r":"us","u":"https://ca.finance.yahoo.com/news/state-street-spdr-portfolio-p-110516169.html","p":1794481516,"a":1794489603,"t":"State Street SPDR Portfolio S&P 500 (SPYM) Buys $15.2 Million More Apple on Tuesday","su":"이 펀드는 화요일에 501개 포지션에 1억 9,600만 달러를 추가했으며 애플, 엔비디아 및 마이크로소프트가 매수를 주도했습니다."},{"s":"SPDR 포트폴리오 S&P500 성장(SPYG)이 판매한 것: 11월 10일 엔비디아가 주도","so":"Yahoo Finance","tm":"11/12 20:05","c":1,"r":"us","u":"https://finance.yahoo.com/markets/stocks/articles/spdr-portfolio-p-500-growth-110508974.html","p":1794481508,"a":1794489604,"t":"What SPDR Portfolio S&P 500 Growth (SPYG) Sold: NVIDIA Leads on Nov. 10","su":"이 펀드는 2억 5,220만 달러의 주식을 매도하고 아무것도 사지 않았으며, 152개의 포지션을 줄이면서 아무것도 올리지 않았습니다."},{"s":"iShares Core S&P500 ETF(IVV), 화요일에 2,660만 달러 규모의 애플 주식 매도","so":"Yahoo Finance","tm":"11/12 20:04","c":1,"r":"us","u":"https://finance.yahoo.com/markets/stocks/articles/ishares-core-p-500-etf-110450403.html","p":1794481490,"a":1794489605,"t":"iShares Core S&P 500 ETF (IVV) Sells $26.6 Million of Apple on Tuesday","su":"이 기사는 GuruFocus에 처음 게재되었습니다. iShares Core S&P500(미국 큰 회사 500곳 지수) ETF(IVV)는 보고된 일일 보유량 변동에 따라 화요일 세션에서 3억 3,750만 달러의 순유출을 기록했으며 총 거래액은 3억 3,750만 달러에 달했습니다."},{"s":"골드만삭스, 연준 금리 전망 상향 조정…내년 12월과 3월 금리 인상 예상","so":"鉅亨網","tm":"11/12 20:00","c":1,"r":"tw","u":"https://news.cnyes.com/news/id/6658686","p":1794481204,"a":1794489619,"t":"高盛上修Fed利率預測 估12月、明年3月各升息一碼","su":"골드만삭스는 연준 금리(돈을 빌릴 때 내는 이자 비율) 전망을 상향 조정해 12월 금리 1포인트 인상을 유지하고 2027년 3월 금리 1포인트 인상을 추가했다.\n골드만삭스는 미국의 10월 인플레이션(물건값이 계속 오르는 것)이 예상보다 높았으며 전망이 3개월 연속 악화됐다고 밝혔다. 내년 1월 가격 인상은 기업에 대한 압박을 가중시킬 수 있다.\n골드만삭스는 연준이 2027년 말부터 금리를 3.25~3.50%로 네 차례 인하할 것으로 추정했다. 인플레이션이 냉각되면서 미국 부채는 압박을 받아왔습니다."},{"s":"국회의사당 '블루 턴'이 미국 은행주에 영향을 미치는데, 이것이 핵심 변수다.","so":"第一财经","tm":"11/12 19:25","c":1,"r":"cn","u":"https://www.yicai.com/news/103438452.html","p":1794479132,"a":1794489612,"t":"国会山“翻蓝”冲击美股银行股，关键变量还有这些","su":"{{aisd}} AI가 면책 조항을 생성했습니다. 민주당은 의회 양원을 모두 \"휩쓸었습니다\". 인공지능(AI) 컨셉주처럼 미국 은행주도 영향을 받았다. 선거 결과가 최초 발표된 이후 KBW 나스닥(미국 기술 회사들이 많은 주식시장) 은행지수는 전체적으로 1.7% 하락했고, S&P500(미국 큰 회사 500곳 지수) 은행지수는 2.5% 하락했다. 애널리스트들은 당선 후 두 정당의 정치 이슈 선호 차이가 미국 은행주에 영향을 미칠 것으로 보고 있다. 아울러 AI 구축 열풍의 영향과 연준의 규제 태도도 미국 은행주 동향의 핵심 변수다. 정치적 의제 전망과 AI 구축 물결이 은행주에 영향을 미칠 것이다. 2008년 금융위기 이후 매사추세츠주 엘리자베스 워런 상원의원, 이번에 오하이오주 상원의원에 당선된 셰로드 브라운 등 민주당 의원들은 월스트리트 대형은행들을 가장 노골적으로 비판해 왔다."},{"s":"미국 주식 시장 전/후이다 7% 하락, AI 주식 나스닥 선물 0.79% 하락","so":"鉅亨網","tm":"11/12 19:00","c":1,"r":"tw","u":"https://news.cnyes.com/news/id/6660670","p":1794477614,"a":1794489621,"t":"美股盤前／輝達跌7%拖累AI股那指期貨下挫0.79%","su":"미국 주식 시판 전/Huida 7% 하락, AI주 하락 나스닥(미국 기술 회사들이 많은 주식시장) 선물 0.79% 하락 Uanalyze 2026년 11월 12일(Uanalyze/Industrial Data Center 보고서) ⸺ 목요일(12일) 미국 증시 개장 전, Huida 엔비디아(NVDA-US) 경영진 사임에 대한 불확실성이 다시 한번 AI 주식을 억제했습니다. 현재 나스닥 100 지수 선물은 0.79% 하락했고, S&P500(미국 큰 회사 500곳 지수) 지수 선물은 0.38% 하락했으며, 다우존스 선물은 20포인트(0.04%) 상승했습니다. 기술주는 매도 압력이 심합니다. Huida는 시장 개장 전 7% 하락했으며, 이사회가 Huang Renxun CEO의 잔류 여부를 평가하고 있다는 보도에 시장이 주목하고 있습니다. Huida는 AI 칩 공급망의 핵심이기 때문에 리더십의 변화 가능성은 관련 회사에 대한 투자자의 신뢰에도 영향을 미칠 것입니다. 회사는 아직 CEO 교체 결정을 발표하지 않았습니다."},{"s":"미국 주식기술 부문의 엄청난 혼란이 AI 업계의 기업공개(IPO) 속도에 영향을 미칠까? 씨티임원들 “아직 속도는 변하지 않았으며 내년 상장 주제는 더욱 다양해질 것”","so":"财联社电报","tm":"11/12 18:07","c":1,"r":"cn","u":"https://m.cls.cn/detail/2532669","p":1794474426,"a":1794496102,"t":"美股科技板块巨震会否影响AI产业IPO节奏？花旗高管：节奏暂未变，明年上市主题将更多元","su":"파이낸셜 뉴스 에이전시, 11월 12일 (궈즈숴 기자) 미국 중간선거가 끝난 뒤 나스닥과 필라델피아 반도체(전자기기의 두뇌 부품)지수로 대표되는 기술주 주가가 크게 요동쳤다. 반도체 기업공개(IPO)와 국경간 인수합병(M&A) 속도가 조심스러워졌는지가 시장의 촛점이 됐다. 지난 11월 11일 열린 Citi 2026 중국 서밋의 언론 교류 세션에서 Zhuo Jianxun 씨티 일본, 북아시아, 호주 기업 금융 사업 책임자와 Yuan Zhengyi 씨티 투자 은행 중국 시장 사업 책임자가 Financial Associated Press를 포함한 언론의 질문에 답변했습니다. AI 산업의 초점이 유동성(시장에 도는 돈의 양)으로 옮겨갔고, 기업공개(IPO) 속도에는 아직 영향이 미치지 않았다. “중간선거 이후 미국 증시, 특히 필라델피아 반도체지수를 비롯한 나스닥의 변동성이 매우 심했습니다.” Yuan Zhengyi는 이번 조정 뒤에는 여러 가지 잠재적인 이유가 있다고 말했습니다. 첫째, 시장에서는 민주당이 새로운 데이터 센터와 같은 AI 인프라에 대해 상대적으로 보수적일 것으로 예상하고 AI 자본 투자가 둔화되고 중요한 요소인 반도체가 영향을 받을 수 있다고 예상합니다. 둘째, 일부 사람들은 초기 가격이 너무 높다고 생각합니다."},{"s":"해외조사 및 선정일보 1112 | ANZ: 연준은 예상보다 금리를 더 많이 인상할 수 있으며 50bp의 단일 금리 인상도 배제하지 않습니다.","so":"财联社","tm":"11/12 17:50","c":1,"r":"cn","u":"https://www.cls.cn/detail/2532763","p":1794473456,"a":1794496103,"t":"海外研选日报1112 | 澳新银行：美联储加息力度或超预期 不排除单次加息50基点","su":"① Bank of America: TSMC의 자본 지출은 내년에 900억 달러에 달할 수 있으며 첨단 프로세스 확장이 가속화되고 있습니다. ② JP모건 Chase: AI채권(돈을 빌려주고 받는 차용증) 발행이 전년 대비 160% 급증, 자산운용사가 주요 매수자로 자리매김. ③ 골드만삭스: 미국 기업 자본지출은 AI 투자가 주요 원동력이 되면서 내년 8% 증가할 것으로 예상된다. ④모건스탠리 : AI 금융규모가 6,460억 달러에 달하고, 신용위험 차별화도 심화됐다. 편집자 주: Financial Associated Press는 글로벌 매크로, 기업 및 산업, 상품 및 기타 측면에 대한 주요 투자 은행의 최신 연구 의견을 매일 수집하여 투자자의 투자 결정에 대한 포괄적인 지원을 제공합니다. Macro 골드만삭스: AI 투자가 내년에도 미국 경제 성장을 계속 주도할 것이며 자본 지출 증가율은 8%에 이를 수 있습니다. 골드만삭스는 11월 11일 연구 보고서를 발표해 2027년에도 인공지능(AI) 투자가 미국 기업 자본 지출 성장의 주요 원동력이 되어 실제 상업용 고정 투자가 시장 컨센서스 4.2%보다 훨씬 높은 8% 증가하고 미국 실질 GDP 성장률 2.4%를 뒷받침할 것이라고 전망했다."},{"s":"주항투자레이더》미국 증시 급락은 경기침체 때문인가 아니면 주식시장의 실수 때문인가? 주식을 팔아야 하나?","so":"鉅亨網","tm":"11/12 17:45","c":1,"r":"tw","u":"https://news.cnyes.com/news/id/6660626","p":1794473106,"a":1794496109,"t":"鉅亨投資雷達》美股大跌是衰退使然還是股市錯殺？手中股票該賣嗎？","su":"나스닥(미국 기술 회사들이 많은 주식시장)은 10월 6일 최고치에서 약 8% 하락했고, 연준(미국의 중앙은행)은 거의 20% 하락했습니다. 대만 주식과 기타 기술주가 동시에 조정되었습니다.\n백테스팅 결과, 기술주는 급격한 하락 이후 3개월/6개월/1년 만에 평균 4.3%/6.6%/11.8% 반등한 것으로 나타났습니다.\n미국이 불황에 빠지지 않았다면 대만의 연평균 수익률은 18.3%였을 것입니다. 패닉 상태에서 빠져나오면 리바운드를 쉽게 놓칠 수 있습니다."},{"s":"Jen-Hsun Huang은 다시 음식을 훔친 후 사임하겠다고 위협합니다. 월스트리트가 패닉에 빠졌나요? 주요 기관의 최신 의견 요약","so":"鉅亨網","tm":"11/12 16:30","c":1,"r":"tw","u":"https://news.cnyes.com/news/id/6660374","p":1794468611,"a":1794489622,"t":"黃仁勳再爆偷吃恐下台 華爾街到底慌不慌？各大機構最新看法彙總","su":"Jen-Hsun Huang의 혼외정사 스캔들이 퍼지고 있습니다. 월스트리트저널은 후이다 이사회가 그를 해고할 계획이라고 전했다. 시장은 그를 위험과 거버넌스 위기의 핵심 인물로 여긴다.\nBernstein과 Baird는 각각 등급을 중립/보통으로 하향 조정하고 목표 가격을 200달러로 낮췄습니다. 모건스탠리는 불확실성으로 인해 위험수익률이 악화됐다며 상위 종목을 제외했다.\nMizuho, Citigroup 및 Wells Fargo는 여전히 AI 수요에 대해 낙관적입니다. 많은 투자자들은 황런쉰이 교체하기 어렵고 그가 떠날 경우 주가가 25~30% 하락할 수 있다고 말한다."},{"s":"미국 고용 및 인플레이션 데이터는 모두 예상을 뛰어넘었고, 연준의 금리 인상에 대한 기대가 높아져 귀금속의 단기 성과가 억제되었습니다(Wan Liang).","so":"第一财经","tm":"11/12 16:12","c":1,"r":"cn","u":"https://www.yicai.com/video/103438116.html","p":1794467563,"a":1794496104,"t":"美就业与通胀数据双超预期，美联储加息预期升温压制贵金属短期表现（万亮）","su":"차이나비즈니스뉴스 공식 홈페이지에서는 주식시장 상황, 경제동향, 금융정책, 산업동향, 전문가 분석 등 금융정보를 24시간 365일 제공하고 있다. 또한 주식 토크 및 금융, 오늘의 주식 시장, 기업 및 산업, 금융 해독, 브레인스토밍 등 중국 비즈니스 네트워크 TV 프로그램의 독점 생방송을 방송합니다."},{"s":"엔비디아는 5.47% 하락했고, 엔비디아와 Huang Renxun은 주주 집단 소송으로 고소당했습니다. 丨 미국 주식 거래 재개","so":"21财经","tm":"11/12 15:38","c":1,"r":"cn","u":"https://m.21jingji.com/article/20261111/herald/b70e7d6c7765c8e9448b3e38ef44d5b5_zaker.html","p":1794465522,"a":1794467064,"t":"英伟达大跌5.47%，英伟达、黄仁勋遭股东集体诉讼丨美股复盘","su":"동부 표준시 기준 11월 10일, 엔비디아는 5.47% 하락한 US$168.89를 기록했습니다. 엔비디아 이사회는 황런순 CEO의 개인 문제에 대한 비난에 대해 독립적인 조사에 착수한다고 8일 발표했습니다. 관련 혼란의 영향을 받아 Huang Renxun의 이탈이 시장의 초점이 되었습니다. Securities Times에 따르면 엔비디아의 주가는 미국의 주요 주가 지수와 같이 뚜렷한 추세에서 거의 벗어난 적이 없습니다. S&P500(미국 큰 회사 500곳 지수) 지수에서 엔비디아의 비중은 6.7%에 이릅니다. 2001년 11월 9일을 포함해 S&P500 지수에 편입된 이후 엔비디아 주가가 4% 이상 하락한 반면 S&P500 지수가 2% 이상 상승한 경우는 단 세 번뿐이다. 현지 시간으로 9일 엔비디아 주가는 하락해 결국 주당 178.67달러로 4.27% 하락해 마감했고, 시장 가치는 약 1930억 달러(약 1조2882억 위안) 감소했다. 미국 증시가 마감된 지 5분 만에 엔비디아와 황젠슨이 주주사취 혐의로 주주집단소송을 당했다."},{"s":"유럽 ​​기업 심리가 회복되고 인플레이션 우려가 커지고 조사 결과","so":"Reuters","tm":"11/12 15:03","c":1,"r":"world","u":"https://www.reuters.com/business/european-business-sentiment-picks-up-inflation-worries-grow-survey-finds-2026-11-12/","p":1794463380,"a":1794489631,"t":"European business sentiment picks up, inflation worries grow, survey finds"},{"s":"엔비디아는 이사회가 Jensen Huang의 미래를 고려하면서 슬라이드를 공유합니다.","so":"Financial Times","tm":"11/12 14:07","c":1,"r":"world","u":"https://www.ft.com/content/a93307a7-e2cd-4abd-bd89-c38832d8c40e?syn-25a6b1a6=1","p":1794460051,"a":1794467084,"t":"Nvidia shares slide as board considers Jensen Huang’s future"},{"s":"엔비디아 주식, 시간외에서 급락 엔비디아 Stock Tumbles. Jensen Huang Could Be Out Soon.","so":"バロンズ・ダイジェスト","tm":"11/12 13:59","c":1,"r":"jp","u":"https://barrons.jiji.com/article/9084","p":1794459557,"a":1794467082,"t":"エヌビディア株、時間外で急落 Nvidia Stock Tumbles. Jensen Huang Could Be Out Soon.｜【日刊】2026年11月12日号","su":"미국 반도체(전자기기의 두뇌 부품) 대기업 엔비디아 <NVDA>의 젠슨 후안 최고경영 책임자(CEO)가 톱 자리를 쫓을 가능성이 나왔다. 미국 종이 월 스트리트 저널은 11일 밤, 엔비디아의 이사회가 후안 씨의 해임을 위한 준비를 진행하고 있다고 보도했다. 해임의 가능성은 미국 종이 뉴욕 타임즈가 후안 CEO에 대해 2건의 불륜 문제가 있었다고 잇따라 보도한 뒤 부상했다. 이 중 11일 밤 보도에서는 후안 CEO가 회사 직원 중 한 명과 친밀한 관계에 있었다고 한다."},{"s":"4가지 주요 신호로 인해 내년 미국 주식의 변동성이 커질 것으로 예상됩니다.","so":"信報網站","tm":"11/12 13:41","c":1,"r":"hk","u":"https://www.hkej.com/dailynews/investment/article/4563412/%25E5%259B%259B%25E5%25A4%25A7%25E8%25A8%258A%25E8%2599%259F%25E9%25A0%2590%25E7%25A4%25BA%25E6%2598%258E%25E5%25B9%25B4%25E7%25BE%258E%25E8%2582%25A1%25E9%259C%2587%25E7%259B%25AA","p":1794458475,"a":1794489626,"t":"四大訊號預示明年美股震盪","su":"지난주 미국 중간선거 결과가 '푸른 쓰나미'를 일으켰다. 이틀 뒤인 11월 5일 월스트리트 주식시장에는 또 다른 '붉은 쓰나미'가 터졌다. 이날 4000개 이상의 주식이 폭락해 전체 시장의 약 83%를 차지했다. 미국 주식의 전체 시장 가치는 하루 만에 2조8000억 달러 증발해 사상 최대치를 기록했다. 필라델피아 반도체(전자기기의 두뇌 부품) 지수와 나스닥 종합 지수는 각각 12.2%와 6.4% 급락해 둘 다 2020년 코로나19 발병 이후 최악의 일일 실적을 기록했습니다. 시장에서는 일반적으로 이러한 시장 하락을 민주당이 하원과 상원의 장악력을 되찾은 결과로 보고 있습니다. AI 데이터센터(컴퓨터 수만 대를 모아 둔 건물) 구축이 둔화되거나 심지어 중단될 수도 있다는 우려가 나온다. 또한, AI 규제가 강화되어 시장에 타격을 줄 수도 있습니다."},{"s":"미국 중간선거 변화에도 여전히 기술주, 미국주식, 신흥시장주, 비투자부채펀드로 자금이 유입되고 있다.","so":"經濟日報","tm":"11/12 13:37","c":1,"r":"tw","u":"https://money.udn.com/money/story/5607/9873994?from=udnamp-referralnews_ch1001artbottom","p":1794458246,"a":1794467067,"t":"美期中選舉變天 資金仍流向科技、美股、新興市場股票及非投等債基金","su":"자금 흐름을 보면 많은 미국 민주당 의원들이 AI, 미국 국내 석유 및 가스 생산, 금융 산업에 적대적임에도 불구하고 기술, 미국 주식, 신흥 시장 주식, 비투자 등급 채권(돈을 빌려주고 받는 차용증) 펀드로 자금이 계속 유입되고 있음을 알 수 있습니다. 공매도(주식을 빌려서 먼저 파는 것) 펀드는 7월 말 이후 최대 규모의 자금 유출을 경험했다."},{"s":"아시아 주식은 취약하고 엔비디아는 CEO의 운명을 결정하기 위해 이사회에서 급락했습니다.","so":"The Straits Times","tm":"11/12 13:06","c":1,"r":"sg","u":"https://www.straitstimes.com/business/asian-stocks-fragile-nvidia-plummets-as-board-to-decide-ceos-fate?ref=latest-headlines","p":1794456360,"a":1794459119,"t":"Asian stocks fragile, Nvidia plummets as board to decide CEO’s fate","su":"엔비디아가 Jensen Huang의 운명을 둘러싼 이사회에 급락하면서 아시아 주식은 취약해졌습니다. straitstimes.com에서 자세한 내용을 읽어보세요."},{"s":"연준은 계속해서 매파적인 입장을 보이고 있으며 금값은 4,000달러 선 아래로 떨어졌습니다! 투자은행, 추가 하락 위험 경고","so":"财联社电报","tm":"11/12 12:38","c":1,"r":"cn","u":"https://m.cls.cn/detail/2532321","p":1794454680,"a":1794459093,"t":"美联储鹰声不断，黄金失守4000美元大关！投行警告进一步下行风险","su":"Financial Associated Press, 11월 12일(편집자 Bian Chun) 국제 금 가격이 온스당 4,000달러라는 임계 수준 아래로 떨어졌습니다. 분석가들은 지속적인 인플레이션(물건값이 계속 오르는 것) 압력으로 인해 연준이 긴축 기조를 유지하게 되면서 귀금속이 추가적인 매도 압력에 직면할 수 있다고 경고했습니다. 최근 매도 압력이 금 시장의 최근 상승세를 위협하고 있습니다. 분석가들은 금 가격이 주요 지지선인 4,000달러 아래로 떨어지면 새로운 매도세(팔려는 힘)가 촉발될 수 있다고 경고합니다. 목요일 아시아 거래에서 국제 금 가격은 미화 4,000달러를 밑돌며 이틀 연속 하락세를 이어갔습니다. 전날 예상보다 높은 미국 인플레이션 데이터와 연준 정책 입안자들의 매파적 논평으로 달러 강세가 이어지고 다음 달 더 큰 금리 인상 가능성이 높아지면서 금값은 이틀 연속 하락했다. 현물 금은 온스당 3,987.29달러로 1% 넘게 하락했다. 12월 인도분 미국 금 선물은 온스당 4,000.50달러에 0.7% 하락했다."},{"s":"무료강의' 푸른 파도 쓰나미가 두 집을 삼켰다! 월스트리트의 승자와 패자가 하룻밤 사이에 개편됐다.","so":"自由評論網","tm":"11/12 12:30","c":1,"r":"tw","u":"https://talk.ltn.com.tw/article/breakingnews/5637338","p":1794454200,"a":1794459104,"t":"自由開講》藍潮海嘯吞兩院！華爾街贏家輸家一夜重洗","su":"◎ 조셉 차이 2026년 11월 3일 미국 중간선거에서 민주당은 하원과 상원을 모두 탈환해 2006년 이후 처음으로 중간선거에서 양원을 모두 석권한 야당이 됐다. 이번 선거 결과는 공화당이 최소 1석은 유지할 것이라는 시장의 기대를 깨뜨렸고, 월스트리트는 도널드 트럼프와 민주당이 집권한 의회의 새로운 지형을 재평가하게 만들었다. 의회에서는 민주당이 주도권을 잡았지만 트럼프 미국 대통령이 여전히 거부권을 쥐고 있어 주요 법안이 순조롭게 통과되지 못할 수도 있다. . (AFP 파일사진) 민주당이 의회 장악력을 얻었지만 트럼프는 여전히 거부권을 쥐고 있어 주요 법안이 순조롭게 통과되지 못할 수도 있다. 그러나 민주당이 장악하고 있는 수사·청문·소환 권한으로 인해 기업들은 더욱 엄격한 의회 감독을 받게 될 것이다."},{"s":"월스트리트 자금이 불고 있습니다! Citi, 기술 등급 인하 및 헬스케어 투자 확대: 이 생명공학 펀드는 한 달 만에 13% 급등 | 자금 | 주식 시장","so":"udn","tm":"11/12 12:22","c":1,"r":"tw","u":"http://udn.com/news/story/10103/9873712?from=udn-catebreaknews_ch2","p":1794453734,"a":1794459106,"t":"華爾街資金大風吹！花旗砍科技評等加碼醫療保健：這檔生技基金單月飆漲13% | 基金 | 股市","su":"최근 글로벌 주식시장에 자본순환 조짐이 나타나고 있습니다! AI 기술주가 과도한 자본지출과 가치평가 조정 우려에 직면하자 월스트리트가 헬스케어 산업으로 눈을 돌리기 시작했다. 씨티그룹은 11월 9일 미국 주식과 글로벌 기술주에 대한 투자 등급을 하향 조정하는 동시에 글로벌 헬스케어 주식을 '중립'에서 '비중 확대'로 상향 조정했습니다. 구글의 의료 전문 AI 플랫폼 공식 출시와 대형 제약사들의 생명공학 기업 인수가 활발해지면서 생명공학 산업은 다양한 혜택을 누리고 있다. 최근 펀드 성과를 보면 프랭클린 화메이 생명공학 펀드(NTD)가 10월 16일부터 11월 10일까지 13.28% 상승해 글로벌 생명공학 관련 4개 펀드 중 1위에 올랐다. 지난 몇 년간 AI 칩, 서버, 클라우드 컴퓨팅 등이 많은 자금을 유치했고, 기술주가 글로벌 시장의 중심이 됐다. 그러나 기업의 자본지출이 지속적으로 증가하면서 시장에서는 투자회복 속도와 이익 증가 속도에 대한 재평가가 시작됐다."},{"s":"달러 가치가 19개월 만에 최고치로 치솟았습니다! 글로벌 시장은 새로운 폭풍에 직면해 있습니다. 연준이 12월에 금리를 인상할 것이라는 점에는 의심의 여지가 거의 없습니다.","so":"鉅亨網","tm":"11/12 12:19","c":1,"r":"tw","u":"https://news.cnyes.com/news/id/6660175","p":1794453561,"a":1794459108,"t":"美元飆上19個月高點！全球市場迎新風暴 聯準會12月升息幾無懸念","su":"미국 인플레이션(물건값이 계속 오르는 것)이 과열되고 있고 연준 관계자들은 매파적이며 시장은 12월 금리(돈을 빌릴 때 내는 이자 비율)를 2포인트 인상할 것으로 예상하고 있습니다. ICE 미국 달러 지수는 한때 19개월 최고치인 102.96까지 올랐습니다.\nLSEG는 12월 한자리 금리 인상 확률이 88%, 두 자리 금리 인상 확률은 12%로 나타났다. 골드만삭스와 Deutsche Bank는 모두 연준의 후속 금리 인상에 대한 전망을 상향 조정했습니다.\n유로화는 1.11 아래로 떨어져 5월 이후 최저치를 기록했습니다. 프랑스 부채와 정치적 불확실성이 계속해서 유로화를 압박하고 있으며 Rabobank는 1.10을 기록하고 있습니다."},{"s":"엔비디아 CEO 위기에도 불구하고 기술 반등으로 다우, S&P500, 나스닥 선물 혼합: AMD, CSCO, AMAT 집중","so":"Yahoo Finance","tm":"11/12 12:15","c":1,"r":"us","u":"https://finance.yahoo.com/markets/stocks/articles/dow-p-500-nasdaq-futures-031512683.html","p":1794453300,"a":1794467062,"t":"Dow, S&P 500, Nasdaq Futures Mixed As Tech Rebounds Despite Nvidia CEO Crisis: AMD, CSCO, AMAT In Focus","su":"언론 보도에 따르면 엔비디아 이사회는 젠슨 황 CEO가 회사 임원과 불륜을 저질렀다는 추가 소식이 나온 후 CEO를 교체할 방안을 모색하고 있다고 합니다."},{"s":"Huang Renxun은 사임을 두려워합니다! 업계는 BBC에 \"그는 끝났다\"고 직설적으로 전했고 월스트리트 거물들도 경고했다.","so":"中時新聞網","tm":"11/12 12:14","c":1,"r":"tw","u":"https://www.chinatimes.com/realtimenews/20261112002215-260408","p":1794453291,"a":1794467068,"t":"黃仁勳恐下台！業界向BBC直言「他完了」 華爾街大咖也示警- 國際","su":"Huida CEO Huang Renxun은 혼외정사에 연루되어 그의 리더십 위치가 시험대에 직면했습니다. 영국방송공사(BBC)는 기술업계 관계자의 말을 인용해 \"그는 끝났다\"고 직설적으로 말했다. CNN은 월스트리트의 유명한 기술 분석가인 Dan Ives가 Huang Renxun이 주도권을 쥐고 있다고 믿고 있다고 보도했습니다."},{"s":"승계 위험이 급증했습니다! 월스트리트 경고: Huang Jen-Hsun이 사임할 경우 Huida의 주가는 최소 20% 급락할 수 있습니다.","so":"鉅亨網","tm":"11/12 12:00","c":1,"r":"tw","u":"https://news.cnyes.com/news/id/6660172","p":1794452409,"a":1794453334,"t":"接班風險遽升！華爾街示警：黃仁勳若被迫離職 輝達股價恐暴跌至少20%","su":"黃仁勳陷個人醜聞風暴，《華爾街日報》稱輝達董事會考慮罷免他並找接班人。&#10;消息衝擊股價，輝達周三盤後一度再跌近10%；Baird將評等降至中立、目標價砍至200美元。&#10;分析師估若黃仁勳突然離職，股價恐跌20%或更多，但若接班安排妥當，長期營運未必受實質影響。"},{"s":"미국 AI 주식은 강하게 반등했지만, 3대 기술 대기업은 추세를 거스르고 적자로 마감했습니다. Huida는 시장 개장 후 9% 급락했습니다.","so":"旺得富理財網","tm":"11/12 11:55","c":1,"r":"tw","u":"https://wantrich.chinatimes.com/news/20261112900153-420101","p":1794452112,"a":1794496109,"t":"美股AI股強彈 惟三大科技巨頭逆勢收黑 輝達盤後暴跌9％","su":"NVDA(NVDA) 미국 증시는 11월 11일 장 마감 이후 약 8~9% 급락했다. 주된 원인은 갑작스러운 재무 보고서 악화나 AI 칩 수요 때문이 아니라, 황런순 CEO가 두 건의 혼외 관계에 연루돼 이사회가 교체될 수 있다는 주요 뉴스에 직면할 수 있다는 월스트리트저널의 폭로였다. NVDA 이사회가 황런순의 퇴임을 논의할 준비를 하고 있다는 소문이 돌았습니다. 그러나 미국 증시는 11일 강한 반등을 보이며 좋은 성적을 냈다. AI 반도체(전자기기의 두뇌 부품) 그룹이 장기 전략의 주도권을 되찾았고, 자금은 명백히 메모리 쪽으로 편향됐는데…"},{"s":"'미국 주식' 분석 : 휘다 장 마감 후 또 폭락, 황 해임 위기가 닥쳐 애널리스트들 \"해결책 없다\" 외쳐 - 국제","so":"工商時報","tm":"11/12 11:42","c":1,"r":"tw","u":"https://www.ctee.com.tw/news/20261112701099-430701","p":1794451320,"a":1794496111,"t":"《美股》分析：輝達盤後又狂瀉黃罷免危機、分析師齊喊毋湯- 國際","su":"[타임즈 장차오친 외신종합보도] 미국 주식시장 분석: ●U.S. d+AI%E5%AD%A3%E7%B8%BE%E9%81%9C%E9%A0%90%E6%9C%9F%EF%BC%8C%E8%82%A1%E5%83%B9%E6%80%A5%E6%8C%AB","p":1794420600,"a":1794489628,"t":"美股異動｜SoundHound AI季績遜預期，股價急挫"},{"s":"월스트리트 은행, 3년 연속 보너스 인상","so":"信報網站","tm":"11/12 03:06","c":1,"r":"hk","u":"https://www.hkej.com/dailynews/international/article/4563398/%E8%8F%AF%E7%88%BE%E8%A1%97%E9%8A%80%E8%A1%8C%E9%80%A3%E7%BA%8C3%E5%B9%B4%E5%A2%9E%E8%8A%B1%E7%B4%85","p":1794420397,"a":1794489629,"t":"華爾街銀行連續3年增花紅","su":"미국 주요 은행들의 이익이 정점에 도달함에 따라 월스트리트 실무자들은 올해 또 한 번의 큰 보너스를 받을 것으로 예상된다. 보상 컨설팅 회사인 Johnson Associates의 보고서에 따르면 투자자를 위해 주식 거래를 수행하는 거래자와 주식 시장에서 기업의 자본 조달을 지원하는 은행가의 연말 보너스가 20%~30% 또는 그 이상 증가할 수 있다고 예측합니다. 주식 거래자들은 30% 더 많은 보너스를 지불할 것으로 예상됩니다. 금융기관이 보너스를 인상한 것은 올해로 3년 연속이다. Johnson Associates의 전무이사인 Alan Johnson은 은행 산업의 성과가 최근 몇 달간 시장 동향에 의해 주도되었다고 말했습니다."},{"s":"인플레이션 보고서는 또 다른 경보를 울리고 연준 관계자는 가격 데이터를 \"교란적\"이라고 직설적으로 부릅니다.","so":"财联社","tm":"11/12 02:55","c":1,"r":"cn","u":"https://www.cls.cn/detail/2532030","p":1794419756,"a":1794467065,"t":"通胀报告再敲警钟 美联储官员直言物价数据“令人不安”","su":"① Goolsby는 인터뷰에서 \"인플레이션(물건값이 계속 오르는 것) 문제가 한동안 심화되어 왔고 이제 정말 우리 앞에 닥쳤으며 우리는 그것을 처리해야 한다\"고 말했습니다. ② Goolsby는 원래 관세와 같은 요인으로 인해 가격이 상승할 것으로 예상했지만 시간이 지남에 따라 점차 가라앉을 것으로 예상했지만 지금까지 이러한 조짐은 보이지 않는다고 말했습니다. 계속되는 서비스 가격의 높은 상승도 그를 걱정하게 한다. Financial News Agency, 11월 12일(자오 하오 편집자) 오스탄 굴스비 시카고 연준 총재는 미국의 최근 인플레이션 지표가 \"불안한 경계선에 도달했다\"고 말했습니다. Goolsby는 인터뷰에서 \"이것은 또 다른 걱정스러운 보고서입니다. 심지어 약간 불안하기도 합니다\"라고 말했습니다. \"인플레이션 문제는 한동안 격화되어 왔으며 이제는 정말로 우리 앞에 와 있습니다. 우리는 이를 해결해야 합니다.\" 미국 노동통계국이 화요일 발표한 자료에 따르면 10월 소비자물가지수(CPI)는 전월 ​​대비 0.4% 상승해 경제학자들의 예상보다 높았고, 미국 물가가 3개월 연속 상승세(오르는 흐름)를 나타냈다."},{"s":"미국 주식 동향 | 마이크로소프트와 Tianwu는 직원 매수 계획을 시작하고 노동 변호사는 퇴직 보상의 세 가지 핵심 사항을 분석합니다.","so":"etnet 經濟通","tm":"11/12 02:55","c":1,"r":"hk","u":"https://www.etnet.com.hk/www/tc/us-stocks/news-article/416396/%E7%BE%8E%E8%82%A1%E5%8B%95%E5%90%91%7C%E5%BE%AE%E8%BB%9F%E5%8F%8A%E5%A4%A9%E8%88%9E%E6%8E%A8%E5%93%A1%E5%B7%A5%E8%B2%B7%E6%96%B7%E8%A8%88%E5%8A%83%EF%BC%8C%E5%8B%9E%E5%B7%A5%E5%BE%8B%E5%B8%AB%E6%8B%86%E8%A7%A3%E9%9B%A2%E8%81%B7%E8%A3%9C%E5%84%9F%E4%B8%89%E8%A6%81%E9%BB%9E","p":1794419700,"a":1794489630,"t":"美股動向｜微軟及天舞推員工買斷計劃，勞工律師拆解離職補償三要點"},{"s":"미국 주식 동향 | AMD, 삼성과 협력하여 차세대 임베디드 프로세서 개발","so":"etnet 經濟通","tm":"11/12 02:50","c":1,"r":"hk","u":"https://www.etnet.com.hk/www/tc/us-stocks/news-article/416395/%E7%BE%8E%E8%82%A1%E5%8B%95%E5%90%91+%7C+AMD%E5%A4%A5%E4%B8%89%E6%98%9F%E9%96%8B%E7%99%BC%E6%96%B0%E4%B8%80%E4%BB%A3%E5%B5%8C%E5%85%A5%E5%BC%8F%E8%99%95%E7%90%86%E5%99%A8","p":1794419400,"a":1794489631,"t":"美股動向 | AMD夥三星開發新一代嵌入式處理器"},{"s":"미국 주식 최악의 상황은 끝났는가? 4대 지표 반등 테스트, 애널리스트들은 여전히 ​​감히 바닥을 찍지 못하고 있다","so":"鉅亨網","tm":"11/12 02:39","c":1,"r":"tw","u":"https://news.cnyes.com/news/id/6659121","p":1794418744,"a":1794437294,"t":"美股最壞時刻過了？四大指標檢驗反彈 分析師仍不敢喊底","su":"미국 기술주와 AI 컨셉주는 큰 손실 이후 안정을 찾았으나 포지션, 상관관계, 옵션, 기술지표 4개 지표 중 2개만 긍정적이고 바닥을 입증할 증거가 아직 부족하다.\nFundstrat은 하루 급락 후 반등한 것만으로는 시장이 공식적으로 바닥을 쳤다는 것을 증명하기에 충분하지 않다고 말했습니다.\nDeutsche Bank, Barclays 및 Carrick Lane의 데이터에 따르면 기술 보유가 냉각되고 주가 상관관계가 낮으며 AI 호출에 대한 수요가 감소하고 QQQ의 반등이 차단되었으며 단기적으로 몇 주 동안 변동성(값이 크게 출렁이는 정도)이 있을 수 있습니다."},{"s":"Bank of America는 S&P500 지수가 2027년에 역풍에 직면할 수 있다고 경고합니다! 투자자의 포지션은 포화상태이고 자본유출 위험은 증가하고 있습니다.","so":"鉅亨網","tm":"11/12 02:32","c":1,"r":"tw","u":"https://news.cnyes.com/news/id/6657939","p":1794418373,"a":1794437295,"t":"美銀警告標普500指數2027年恐遇逆風！投資人持倉飽和、資金流出風險升高","su":"Bank of America는 투자자의 포지션이 포화되고 지속적인 자금 유입이 역전될 수 있기 때문에 2027년 S&P500(미국 큰 회사 500곳 지수) 지수가 상승 저항에 직면할 수 있다고 경고했습니다.\n은행은 시장이 아직 대규모 인덱스 펀드 순유출을 경험하지 못했다고 말했다. 투자자들이 소득 지급이나 기타 필요를 늘리기 위해 자금을 인출한다면 S&P500의 장기적인 상승이 시험대에 오를 것입니다.\n올해 유가는 한때 배럴당 100달러를 넘어섰고, 연준은 지난 9월 금리를 3.75~4%로 인상했고, S&P500은 현재까지 9.5% 상승세(오르는 흐름)를 유지하고 있다."},{"s":"연준은 다시 매파를 방출하고 미국 채권 황소는 공격을 받고 있습니다","so":"經濟日報","tm":"11/12 02:06","c":1,"r":"tw","u":"https://money.udn.com/money/story/5599/9872991","p":1794416794,"a":1794437297,"t":"Fed 又放鷹 美債多頭部位慘遭狙擊","su":"최근 미국 채권시장에는 강세 포지션이 많이 등장했다. 미국 연방준비제도(Fed) 관계자들이 매파적 발언을 내놓고, 최근 자료에서 물가(물건값 전체의 수준)상승률이 여전히 높은 것으로 나타나 금리(돈을 빌릴 때 내는 이자 비율) 인상에 대한 시장의 기대가 높아졌다. 이에 따라 미국 채권수익률은 다시 상승했고, 가격은 급락했다. 미국 채권에 대한 투자자들의 장기 투자는 큰 타격을 입었고 방심했습니다."},{"s":"월스트리트는 12월 금리를 1% 인상할지 2% 인상할지 주목한다! CPI가 예상을 뛰어넘는 연준의 대변자: 연준의 금리 인상 속도가 시험대에 직면해 있습니다.","so":"鉅亨網","tm":"11/12 01:10","c":1,"r":"tw","u":"https://m.cnyes.com/news/id/6658383","p":1794413424,"a":1794437297,"t":"華爾街聚焦12月升息1碼還是2碼！CPI超預期、Fed傳聲筒：聯準會升息節奏面臨考驗","su":"10월 미국 CPI는 월간 0.4% 상승했고, 핵심 CPI는 월간 0.3% 상승해 3개월 연속 예상보다 높았습니다. BLS는 정부 폐쇄로 인해 연간 성장률을 발표하지 않았습니다.\n월러는 핵심 CPI가 0.3%에 도달하면 12월에 금리를 2%포인트(퍼센트 숫자 자체의 차이) 인상하는 것을 고려할 것이라고 말했다. 데이터가 기준치에 도달하면 시장에서는 2포인트 금리 인상에 대한 베팅이 뜨거워질 것입니다.\n대부분의 월스트리트 내부자들은 여전히 ​​12월에 1%의 금리 인상을 예상하고 있습니다. 경직된 인플레이션(물건값이 계속 오르는 것)과 탄력적인 고용은 채권 수익률을 높이고 주식 시장 가치를 하락시킬 수 있습니다."},{"s":"미국 반도체 칩 주가는 폭등했고, 샌디스크는 13% 급등했고, 마이크론은 9% 이상 올랐으며, 중국 컨셉주는 약세를 보였고, 금과 은은 단기적으로 급락했다.","so":"21财经","tm":"11/12 00:55","c":1,"r":"cn","u":"http://www.21jingji.com/article/20261111/herald/f7e1153d3c5ddeea77b500229c2cec0b.html","p":1794412546,"a":1794437285,"t":"美股半导体芯片股爆发，闪迪狂飙13%，美光涨超9%，中概股走弱，黄金白银短线跳水","su":"21 Financial Radar에 따르면, 베이징 시간으로 11월 11일 미국 3대 주가지수는 엇갈린 상승과 하락을 보였습니다. 22시 49분 현재 나스닥은 1% 이상 상승했고 다우존스는 0.17% 하락했으며 S&P500(미국 큰 회사 500곳 지수)은 0.73% 상승했다. 대형 기술주 중에서는 테슬라와 엔비디아가 거의 2% 상승했고 애플은 1% 이상 상승했으며 메타, 아마존, 마이크로소프트는 하락했습니다. 필라델피아 반도체(전자기기의 두뇌 부품) 지수가 개장 당시 4.5% 급등해 11월 5일 12% 폭락을 모두 만회하는 등 반도체 칩 부문이 돌풍을 일으켰습니다. 샌디스크는 13%, 코히런트와 루멘텀은 약 10%, 마이크론 테크놀로지와 씨게이트 테크놀로지는 9% 이상, SK하이닉스는 8% 이상, 인텔은 6% 이상, 브로드컴은 5% 이상, 트리플 롱 반도체 ETF는 상승했습니다. (SOXL)은 14% 이상 상승했습니다."},{"s":"연준은 윌리엄스 뉴욕 연준 총재의 사임 시기를 둘러싸고 분열됐다.","so":"第一财经","tm":"11/12 00:41","c":1,"r":"cn","u":"https://www.yicai.com/news/103437148.html","p":1794411699,"a":1794437287,"t":"美联储就纽约联储主席威廉姆斯何时离任存在分歧","su":"WeChat을 열고 하단의 \"검색\"을 클릭한 다음 \"스캔\"을 사용하여 웹페이지를 친구들과 공유하세요. 중국 비즈니스 뉴스 2026-11-11 23:38:26 편집자: Gao Mingyan 보도에 따르면 윌리엄스 뉴욕 연준 총재가 퇴임하는 시간을 둘러싸고 연준 내에서 의견 차이가 있습니다. 논쟁의 초점은 2027년이나 2028년에 퇴임할지 여부이다. 워시는 AI가 첫 번째 수요 측면과 공급 측면의 경로를 통해 세계 경제를 재편하고, 통화 정책 실행 방식을 바꾸고, 고통을 겪은 후 엄청난 생산성 향상과 사회적 부의 증가를 가져올 것이라고 말했다. 많은 당국자들은 이번 금리(돈을 빌릴 때 내는 이자 비율) 인상을 경직적인 인플레이션(물건값이 계속 오르는 것)을 막기 위한 예방적 조치로 보고 있다. \"Wash의 사전 지침에 대한 정의는 많은 정책 분석가의 이해보다 더 넓습니다.\" 시장에서는 워시 총리가 잭슨홀 연차총회에서 데뷔하면서 인플레이션 위험을 거듭 강조하고 금리 인상 옵션을 유지하면서도 연준의 시장 정책 직접 개입을 줄이겠다는 장기 제안도 계속해서 거듭 밝힐 것으로 예상하고 있습니다."},{"s":"23:28:36 [미국 반도체 업종 야간거래에서 강한 상승, 필라델피아 반도체 지수 5% 상승, 마이크론과 샌디스크 11% 이상 상승]","so":"财联社","tm":"11/12 00:28","c":1,"r":"cn","u":"https://www.cls.cn/detail/2531983","p":1794410916,"a":1794437288,"t":"23:28:36【美股半导体板块夜盘强势拉升 费城半导体指数涨5% 美光、闪迪涨超11%】","su":"필라델피아 반도체(전자기기의 두뇌 부품) 지수는 5%, 마이크론과 샌디스크는 11% 이상 상승하는 등 미국 반도체 부문이 장 후반 강한 상승세(오르는 흐름)를 보였다. 11일 AP통신에 따르면 필라델피아 반도체 지수는 5% 오른 1만500.83포인트를 기록했다. 미국 반도체 업종은 메모리칩, 광통신, 반도체 장비주 등이 활발한 상승세를 보이면서 장 후반 거래에서 상승폭이 더욱 확대됐다. 메모리칩과 광통신 컨셉주가 가장 좋은 성적을 냈다. 이 중 샌디스크는 14.7% 이상, 루멘텀은 12.6% 이상, 마이크론 테크놀로지는 11.2%, 코히런트는 11%, 씨게이트 테크놀로지는 10.2% 이상 상승했다. 이 밖에도 SK하이닉스가 9.6% 이상, 마벨 테크놀로지가 9.1% 이상, 암홀딩스가 9.0% 이상, 인텔이 6.9% 이상, 램그룹, 브로드컴, 어플라이드 머티리얼즈, AMD(어드밴스드 마이크로 디바이스)가 5% 이상, TSMC가 3.4%, 엔비디아가 3.0% 이상 상승했다. 레버리지 종목으로는 3배 긴 반도체 ETF(SOXL)가 15.48% 급등했다."},{"s":"미국 주식 동향 | 퀄컴의 글로벌 해고가 공식적으로 시작되었으며 인도 방갈로르가 가장 먼저 영향을 받았습니다.","so":"etnet 經濟通","tm":"11/12 00:28","c":1,"r":"hk","u":"https://www.etnet.com.hk/www/tc/us-stocks/news-article/416365/%E7%BE%8E%E8%82%A1%E5%8B%95%E5%90%91+%7C+%E9%AB%98%E9%80%9A%E5%85%A8%E7%90%83%E8%A3%81%E5%93%A1%E6%AD%A3%E5%BC%8F%E5%95%9F%E5%8B%95%EF%BC%8C%E5%8D%B0%E5%BA%A6%E7%8F%AD%E5%8A%A0%E7%BE%85%E7%88%BE%E7%8E%87%E5%85%88%E5%8F%97%E5%BD%B1%E9%9F%BF","p":1794410880,"a":1794411512,"t":"美股動向 | 高通全球裁員正式啟動，印度班加羅爾率先受影響"},{"s":"23:27:08 [미국 클라우드 서비스 제공업체 및 스토리지 분야의 지속적인 강화]","so":"财联社","tm":"11/12 00:27","c":1,"r":"cn","u":"https://www.cls.cn/detail/2531982","p":1794410828,"a":1794411502,"t":"23:27:08【美股云服务商、存储板块持续走强】","su":"회사 소개 웹사이트 성명 연락처 사용자 피드백 사이트 맵 도움말 홈 텔레그램 주제 모니터 VIP FM 투자 연구 다운로드 모두 추가 Red Company 모니터 홍콩 및 미국 주식 펀드 알림 2026년 11월 11일 23:27:08 미국 주식 클라우드 서비스 제공업체 및 스토리지 부문이 계속 강화되고 있습니다. "kr","u":"https://www.newspim.com/news/view/20261111001573","p":1794403980,"a":1794411493,"su":"[서울=뉴스핌] 고인원 기자= 11일(현지시간) 뉴욕 증시 개장 전 거래에서 인공지능(AI) 관련주가 일제히 상승하고 있다. AI 클라우드 기업 코어위브가 시장 예상을 웃도는 분기 실적(회사가 번 돈 성적표)과 낙관적인 성장 전망을 발표하면서 대규모 AI 인프라 투자에 대한 우려가 일부 완화"},{"s":"AI 전기 사용에 대한 서사는 차가워졌고, 월스트리트는 건설 계정을 계산하기 시작합니다.","so":"财联社","tm":"11/11 22:31","c":1,"r":"cn","u":"https://www.cls.cn/detail/2531971","p":1794403860,"a":1794411507,"t":"AI用电叙事遇冷 华尔街开始算建设账","su":"① 최근 몇 달 동안 시장이 점점 더 조심스러워지면서 일부 AI 관련 에너지 기업은 특히 중간 선거에서 미국 민주당의 승리 이후 취약점을 드러냈습니다. ② Oklo는 2030년 말 이전에 첫 번째 원자로를 배치할 계획입니다. 회사의 현재 순현금은 30억 달러를 초과하지만 전력을 생산하려면 여전히 높은 건설 비용을 부담해야 합니다. Financial News Agency, 11월 11일(자오 하오 편집자) 인공 지능(AI)에 대한 투자 붐은 한때 소형 모듈형 원자로, 지열 에너지 및 연료 전지와 같은 신기술에 대한 시장의 관심을 크게 높여 수십억 달러의 투자를 유치했으며, 세계 최대 기술 기업 중 일부가 투자 또는 구매 약속을 하게 만들었습니다. 그러나 최근 몇 달간 시장이 점점 조심스러워지면서 일부 AI 관련 에너지 기업들이 취약점을 드러내고 있다. 미국 중간선거에서 민주당이 승리하기 전부터 이들 기업의 주가는 압박을 받고 있었다. 그 후 민주당은 데이터 센터 프로젝트를 제한하기 위해 법적 장벽을 추진할 수도 있습니다."},{"s":"오늘 미국 주식 시장: S&P500 선물은 완고한 인플레이션으로 인해 반등했습니다.","so":"Yahoo Finance","tm":"11/11 22:14","c":1,"r":"us","u":"https://finance.yahoo.com/markets/stocks/articles/us-stock-market-today-p-131416924.html","p":1794402856,"a":1794411498,"t":"US Stock Market Today: S&P 500 Futures Rebound On Stubborn Inflation Higher-For-Longer Risk","su":"아침 상승세(오르는 흐름) - 미국 시장 아침 업데이트 2026년 11월 11일 수요일 미국 주식은 조심스럽지만 더욱 확고한 개장을 앞두고 있으며, 심리는 거의 전적으로 또 다른 뜨거운 인플레이션(물건값이 계속 오르는 것)에 의해 주도되었습니다. 투자자들은 선물의 반등을 장기 금리에 대한 마지못해 높은 금리를 받아들이는 것으로 읽고 있습니다. 10월 CPI 보고서는 헤드라인 가격이 전월 대비 0.4%, 핵심 인플레이션이 0.3% 상승한 것으로 나타났습니다. 그 수치, 알"},{"s":"AI 낙관론이 돌아오면서 나스닥 선물 상승세","so":"WSJ","tm":"11/11 22:14","c":1,"r":"us","u":"https://www.wsj.com/finance/commodities-futures/nasdaq-futures-rally-as-ai-optimism-returns-af100e62","p":1794402840,"a":1794411498,"t":"Nasdaq Futures Rally as AI Optimism Returns"},{"s":"오늘의 주식 시장: 엔비디아 주가 반등으로 나스닥 선물이 급등하고 CoreWeave가 수익 후 급등; 다우, S&P500도 상승","so":"Yahoo Finance","tm":"11/11 22:12","c":1,"r":"us","u":"h t-stocks-gain-as-coreweave-reignites-ai-trade/","p":1794392793,"a":1794411523,"t":"North American stock index rise as strong CoreWeave results revive AI trade","su":"캐나다 주요 주가 지수는 미국 클라우드 기업인 CoreWeave의 강한 실적(회사가 번 돈 성적표)이 AI 무역에 대한 열정을 되살리고 유가 상승으로 에너지 주가 상승함에 따라 수요일 상승세(오르는 흐름)로 출발했습니다. S&P/TSX 종합지수는 오전 9시 31분 기준 0.46% 상승한 36,335.81포인트를 기록했다."},{"s":"투자자들이 연방 준비 은행 금리 인상 기대를 평가함에 따라 금 가격은 $ 4,040 이상 회복","so":"Yahoo Finance","tm":"11/11 19:13","c":1,"r":"us","u":"https://finance.yahoo.com/markets/commodities/articles/gold-prices-recover-above-4-101349286.html","p":1794392029,"a":1794459091,"t":"Gold Prices Recover Above $4,040 as Investors Assess Federal Reserve Rate Hike Expectations","su":"투자자들이 예상보다 강한 미국 인플레이션(물건값이 계속 오르는 것) 데이터와 중앙은행 관계자의 논평에 따라 연방준비제도(Fed)의 추가 금리(돈을 빌릴 때 내는 이자 비율) 인상 가능성을 평가함에 따라 금 가격은 수요일 소폭 상승하여 이전 세션 손실의 일부를 만회했습니다. 04:56 GMT에 현물 금은 0으로 상승했습니다."},{"s":"CoreWeave 결과가 AI 낙관론을 부채질한 후 유럽 반도체주 상승","so":"WSJ","tm":"11/11 18:25","c":1,"r":"us","u":"https://www.wsj.com/finance/stocks/nikkei-flat-supported-by-bank-pharma-stocks-2c6e1b38","p":1794389100,"a":1794459091,"t":"European Chip Stocks Climb After CoreWeave Results Fuel AI Optimism"},{"s":"해외조사 및 선정일보 1111 | JP모건: 미국 주식 디레버리징이 끝나가고 있으며 S&P500은 연말까지 여전히 8,000포인트에 도달할 것으로 예상됩니다.","so":"财联社","tm":"11/11 17:57","c":1,"r":"cn","u":"https://www.cls.cn/detail/2531562","p":1794387458,"a":1794411508,"t":"海外研选日报1111 | 小摩：美股去杠杆接近尾声 标普500年底仍看至8000点","su":"① 모건스탠리: S&P500(미국 큰 회사 500곳 지수) 기업 중 44%가 정량화 가능한 AI 혜택을 공개했습니다. ②골드만삭스: 연준이 내년 3월 금리(돈을 빌릴 때 내는 이자 비율)를 인상할 수도 있고, 금리 인하는 연말로 연기될 것으로 예상된다. ③ING: 브렌트유의 평균 가격은 2027년에 미화 77달러가 될 수 있고, 유럽의 가스 가격은 40유로 아래로 떨어질 것으로 예상됩니다. ④골드만삭스: 향후 6년 동안 유럽 데이터 센터에 대한 투자는 1,700억 유로에 이를 수 있습니다. 편집자 주: Financial Associated Press는 글로벌 매크로, 기업 및 산업, 상품 및 기타 측면에 대한 주요 투자 은행의 최신 연구 의견을 매일 수집하여 투자자의 투자 결정에 대한 포괄적인 지원을 제공합니다. 매크로 골드만삭스: 미국 소비는 내년에도 회복세를 유지할 것으로 예상됩니다. AI 주식의 조정은 부의 효과를 약화시킬 수 있습니다. 골드만삭스는 11월 9일 연구 보고서를 발표하면서 에너지 가격 상승과 높은 이자율에도 불구하고 미국 소비가 내년에도 회복세를 유지할 것이라고 예측했습니다. 4분기 전년 동기 대비 실질 소비자 지출 증가율은 2027년 2.2%로 2026년 2.5%보다 소폭 낮아 잠재성장률에 근접할 것으로 전망됐다. 그러나 주식시장 조정으로 부의 효과가 약화될 수 있다."},{"s":"CICC: 인플레이션 경직성이 남아 있어 연준이 계속해서 금리를 인상할 수 있도록 지원","so":"第一财经","tm":"11/11 09:14","c":1,"r":"cn","u":"https://www.yicai.com/news/103435298.html","p":1794356061,"a":1794411508,"t":"中金：通胀粘性未退，支持美联储继续加息","su":"{{aisd}} AI가 생성한 면책조항 CICC 연구 보고서에 따르면 10월 미국 CPI는 전월 대비 0.4%(지난달 0.6%) 상승했고, 핵심 CPI는 전월 대비 0.3%(지난달 0.3%) 상승했는데, 이는 모두 시장 예상보다 높았습니다. 미국 정부가 지난해 10월 문을 닫고 경제 데이터를 공개하지 않아 전년 대비 데이터가 누락됐다. 전반적으로 인플레이션(물건값이 계속 오르는 것)은 매우 높은 경직성을 유지하고 있으며, 핵심 CPI는 3개월 연속 전월 대비 0.3% 상승하여 연준의 지속적인 금리 인상을 뒷받침하고 있습니다. 최근 월러 연준 총재는 12월에 0.5%포인트(퍼센트 숫자 자체의 차이) 금리 인상이 배제되지 않을 것이라고 제안했습니다. 그러나 우리는 연준의 정책이 크게 \"뒤쳐진\" 수준은 아니며, 금융 여건도 소폭 긴축되었기 때문에 금리 인상을 가속화할 필요는 거의 없다고 생각합니다. 우리는 12월 금리를 0.25%포인트 인상한다는 벤치마크 판단을 유지하며, 이번 긴축정책의 속도는 여전히 완만한 수준입니다."},{"s":"이번 주 수익 일정 및 분석(11월 9~13일)","so":"Kiplinger","tm":"11/11 06:25","c":1,"r":"world","u":"https://www.kiplinger.com/investing/stocks/17494/next-week-earnings-calendar-stocks","p":1794345947,"a":1794411524,"t":"Earnings Calendar and Analysis for This Week (November 9-13)","su":"이번 주 수익 달력과 더 주목할만한 보고서에 대한 미리보기 및 요약을 확인하세요."}]},{"name":"🧬 나스닥 바이오","note":"보유: TIGER 미국나스닥바이오","breaking":false,"items":[{"s":"Guangshengtang: B형 간염 삼중 경구 요법으로 2상 임상 시험 등록 완료","so":"Jiemian.com","tm":"11/12 17:20","c":2,"r":"cn","u":"https://www.jiemian.com/article/15326347.html","p":1794471629,"a":1794489642,"t":"广生堂：乙肝三联全口服方案完成II期临床试验入组","su":"Guangshengtang은 11월 12일 회사의 혁신적인 약물 보유 자회사인 Guangsheng Zhonglin이 개발 중인 GST-Peak-Triple 경구용 제한적 치료 요법이 6개월간 진행된 2상 임상 시험의 모든 참가자 등록을 완료했으며 총 176건이 등록되었다고 발표했습니다. 본 프로그램은 병용요법을 통해 만성 B형 간염 환자의 기능적 완치 여부를 평가하는 것을 목표로 하며 관련 약물이 혁신치료제 목록에 포함됐다."},{"s":"이 생명공학 주식의 1분기 주당순이익은 1.85위안인데 무려 4위안이에요! 올해 배당금 8위안 지급, 주가 4% 이상 상승","so":"udn","tm":"11/12 11:38","c":2,"r":"tw","u":"https://udn.com/news/story/7252/9873563","p":1794451130,"a":1794453340,"t":"這檔生技股單季 EPS 1.85元卻豪發4元！今年已配息8元 股價漲逾4%","su":"達爾膚（6523）公布第3季財報，單季每股純益（EPS）1.85元，董事會卻大手筆決議單季每股配發現金4元，配發金額超過單季EPS兩倍，累計今年每股已配息8元，激勵12日股價走揚，盤中來到85.1元，上漲3.8元、漲幅4.67%。"},{"s":"6가지 \"고가 항암제\"를 포함하여 상업적으로 보험이 적용되는 혁신 약물 권장 목록의 업계 버전이 여기에 있습니다.","so":"Jiemian.com","tm":"11/11 13:41","c":2,"r":"cn","u":"https://www.jiemian.com/article/15320099.html","p":1794372090,"a":1794377538,"t":"行业版商保创新药推荐清单来了，纳入6款“天价抗癌药”","su":"국가의료보험국의 상업 보험 혁신 의약품 목록 업데이트 전날, 중국 보험 협회(이하 '중국 보험 협회')가 편찬한 '상업 보험 의약품 권장 목록'의 산업판이 1년의 준비 끝에 마침내 발표되었습니다. 1차 배치에는 58개 의료기기가 포함됐는데, 이 중 의료보험 외 자기부담 의약품이 약 60%를 차지했고, 혁신 의약품이 전체의 거의 절반을 차지했다. 이 산업별 목록은 상업적으로 보장되는 혁신 의약품 목록과 다릅니다. 양 당사자 모두 기본 의료 보험 이외의 자체 자금 조달 혁신 제품에 초점을 맞추고 있지만 중국 보험 협회의 목록에는 혁신 및 임상 가치와 같은 차원 외에도 약물의 임상 적용, 보험 청구 경험 및 약물 수요 변화와 같은 시장 지향 변수가 추가로 포함됩니다. 이로 인해 선택된 품종의 첫 번째 배치는 \"종양학 약물 함량이 더 높다\"는 특징을 갖습니다. 더 많은 오리지널 약물과 CAR-T 제품이 포함되며, 신경퇴행성 질환 및 일부 희귀 질환 분야에서는 보다 신중한 선택 기준이 유지됩니다."},{"s":"신약 상업화, 국제 라이선스 매출, 제품 포트폴리오 확장, 상위 5개 제약사 첫 10개월간 좋은 소식 보고, 4분기 호황 - 파이낸셜뉴스 - Business Times","so":"中時新聞網","tm":"11/11 05:10","c":2,"r":"tw","u":"https://www.chinatimes.com/newspapers/20261111000240-260202","p":1794341400,"a":1794350725,"t":"新藥商業化、國際授權收益、產品組合擴張製藥五強前十月報喜Q4唱旺- 財經要聞- 工商時報","su":"生技股製藥五強10月營收報喜，藥華藥交出年增翻倍續創歷史新高佳績，台康生、逸達有授權收入挹注，美時前十月營收年增59％，保瑞則維持雙位數成長，分別受惠新藥商業化、國際授權收益、產品組合擴張，第四季營運動能"},{"s":"4개 부서에서 문서 발행: 혁신적 약물의 안전하고 합리적인 배포 및 사용 강화","so":"Jiemian.com","tm":"11/10 13:40","c":2,"r":"cn","u":"https://m.jiemian.com/article/15315560.html","p":1794285619,"a":1794298357,"t":"四部门发文：加强创新药安全合理配备使用","su":"첫째, 2급 이상 의료기관은 혁신의약품의 입회제도와 업무프로세스를 최적화·개선하고, 약학관리치료위원회 회의를 적시에 개최하며, 사업역량과 진단·치료 수요를 바탕으로 혁신의약품을 기관의 의약품 카탈로그에 적시에 포함시켜야 한다. 도립병원이 선도적인 역할을 할 수 있도록 단계적으로 추진한다. 두 번째는 의료지식과 의료보험지급정책에 대한 정기적인 조직과 훈련을 요구하는 것이다. 혁신적인 약물의 임상적 사용에 대한 전문가 합의를 적시에 수집 및 발표하고 충분한 증거 기반 의학을 갖춘 약물을 임상 진단 및 치료 지침에 적시에 포함시킵니다. 세 번째는 의약품 관련 의료서비스 가격 항목을 실시하고 지원 및 보장 조치를 더욱 강화하며 혁신 의약품 사용을 위한 정책 환경을 최적화하는 것입니다. 넷째, 의료기관 내 약품종수 및 규제에 대한 제한이 없음을 강조하고, 평균 외래약가 인상, 평균 입원약가 인상 등 공공의료기관 성과모니터링 지표에 해당 혁신신약이 포함되지 않음을 명확히 하겠다."},{"s":"홍콩 증권 연계 혁신 의약품 및 의료 ETF Fu su":"11월 12일 오후 3대 A주 지수가 녹색으로 변했지만, 혁신 의약품 부문은 하락세를 보이며 상승세(오르는 흐름)를 보였습니다. 보도 시간 현재 20CM의 탄력성이 높은 '혁신 신약종'인 과학기술혁신의약품 ETF(여러 주식을 묶어 파는 상품) 차이나 유니버셜(589120)의 기초지수가 1% 이상 상승했다."},{"s":"GenScript와 텐센트 Health는 AIDD를 대규모 애플리케이션으로 확장하기 위해 전략적 협력을 체결했습니다. 홍콩 혁신 약물 ETF Boshi(520690) 추적 지수는 세션 동안 1% 이상 상승했습니다.","so":"Jiemian.com","tm":"11/12 14:15","c":1,"r":"cn","u":"https://www.jiemian.com/article/15325218.html","p":1794460500,"a":1794467096,"t":"金斯瑞与腾讯健康达成战略合作，推动AIDD向规模化应用延伸，港股创新药ETF博时(520690)跟踪指数盘中最高涨超1%","su":"홍콩 혁신 약물 ETF(여러 주식을 묶어 파는 상품) Boshi(520690)는 Hang Seng Hong Kong Stock Connect Innovative Drug Select Index를 추적하여 지난 23일 동안 4271.36만 위안의 순유입으로 세션 동안 1% 이상 상승했습니다. AIDD의 가속화된 개발은 산업 기회를 창출합니다."},{"s":"해외일보｜허유약품 베티마, 미국 FDA 승인, 신쯔그룹, 태국 생산거점 건설 추진","so":"Jiemian.com","tm":"11/12 10:41","c":1,"r":"cn","u":"https://www.jiemian.com/article/15323507.html","p":1794447704,"a":1794453340,"t":"出海日报｜和誉医药贝捷迈获美国FDA批准，信质集团推进泰国生产基地建设","su":"和誉医药贝捷迈获美国FDA批准治疗腱鞘巨细胞瘤 和誉－B公告，其附属公司上海和誉生物医药科技有限公司的CSF-1R小分子抑制剂贝捷迈（盐酸匹米替尼胶囊）于11月11日获得美国FDA批准，用于系统性治疗手术切除可能导致功能受限加重或严重并发症的症状性腱鞘巨细胞瘤成年患者。 此次获批是贝捷迈继中国、加拿大和瑞士监管机构批准后的第四项上市批准。该药物的全球商业化权益已授予德国默克。和誉医药将在贝捷迈于美国实现首次商业化销售时获得2000万美元里程碑付款，并将基于全球净销售额获得两位数百分比的特许权使用费。"},{"s":"Breakingviews - 논평: 중국이 거대 제약회사의 비만치료제 연구실로 떠오름","so":"Reuters","tm":"11/12 07:00","c":1,"r":"us","u":"https://www.reuters.com/commentary/breakingviews/china-emerges-obesity-drug-lab-big-pharma-2026-11-11/","p":1794434440,"a":1794453340,"t":"Breakingviews - COMMENTARY: China emerges as obesity drug lab for Big Pharma"},{"s":"CIIE Story丨AstraZeneca Guan Dongmei: 혁신적인 약물부터 전체 과정 관리까지, 더 많은 암 환자에게 혜택을 제공","so":"新华网","tm":"11/11 20:05","c":1,"r":"cn","u":"http://www.news.cn/health/20261111/d56fca15de754ae4b0283693f6894bfb/c.html","p":1794395120,"a":1794403012,"t":"进博故事丨阿斯利康关冬梅：从创新药物到全病程管理，让更多肿瘤患者获益","su":"CIIE 스토리 | AstraZeneca Guan Dongmei: 혁신적인 약물부터 풀 코스 관리까지, 더 많은 암 환자에게 혜택을 제공하는 일련의 긍정적인 혁신 협력 진행은 중국의 현지 혁신을 글로벌 시장과 연결하고 혁신 결과를 촉진하여 더 많은 환자에게 혜택을 주는 AstraZeneca의 능력을 더욱 입증합니다."},{"s":"'입학 장벽' 완화 및 4개 학과로 혁신 신약 장애물 제거","so":"21财经","tm":"11/11 19:54","c":1,"r":"cn","u":"https://www.21jingji.com/article/20261111/herald/a36fa05400a321e8324c95b263f44bfa.html","p":1794394440,"a":1794403013,"t":"松绑“入院关”，四部门为创新药拆障","su":"21세기 비즈니스 헤럴드 기자 Yan Shuo 2026년 버전의 의료 보험 카탈로그와 상업 보험이 적용되는 혁신 의약품 카탈로그('2개 카탈로그'라고 함)가 곧 출시될 예정이므로 4개 부서가 입원 시 혁신 의약품의 막힘을 해결하기 위한 문서를 공동으로 발행했습니다. 11월 10일, 국가위생건강위원회, 국가의료보험국, 국가중의약국, 국가질병통제예방총국은 공동으로 \"혁신 약물의 안전하고 합리적인 유통 및 사용을 더욱 개선하기 위한 고시\"(\"고시\"로 통칭)를 발표했습니다. 혁신적인 의약품의 안전하고 합리적인 유통과 사용이라는 핵심 측면에 초점을 맞춰 합리적 배치 촉진, 교육 및 지도 강화, 사용 조건 최적화, 관리 조치 개선 등의 구체적인 정책과 조치를 제안했습니다. 상하이 시 위생 및 건강 개발 연구 센터 소장 Jin Chunlin은 21세기 비즈니스 헤럴드 기자에게 이 \"고시\"가 혁신적인 약물의 승인을 막는 행정 및 평가 장애물을 제거했다고 지적했습니다. 이 문서에는 제품 규정 제한, 단일 제품 및 2개 규정, 비용 평가, 로컬 디렉터리 보호 등의 문제가 언급되어 있습니다. 또한 결제 측면에서는 특별한 단일 협상 정책을 도입합니다. 그러나 이는 여전히 본질적으로 '카드 허용 불가' 문제를 해결하는 지침 문서일 뿐 긍정적인 홍보 메커니즘을 확립하지 못하고 있습니다."},{"s":"Abbott, 이식형 심장율동전환기 제세동기 리드에 대해 FDA 승인 및 CE 마크 획득","so":"Fierce Biotech","tm":"11/11 15:25","c":1,"r":"us","u":"https://www.fiercebiotech.com/medtech/abbott-nabs-fda-approval-ce-mark-implantable-cardioverter-defibrillator-lead","p":1794378304,"a":1794378681,"t":"Abbott nabs FDA approval, CE Mark for implantable cardioverter-defibrillator lead","su":"Abbott는 UltiSynq 제세동 리드 기술에 대해 FDA와 CE 마크 승인을 모두 받았습니다. 이 기술은 | Abbott는 전도 시스템 조율 및 제세동 치료를 모두 제공하도록 설계된 UltiSynq 제세동 리드 기술에 대해 FDA 및 CE 마크 승인을 받았습니다."},{"s":"[너겟ETF] 통신ETF의 물량과 가격 모두 상승세를 보이고 있으며, 홍콩혁신신약ETF는 주로 저가 사냥을 하고 있다. 어느 것이 더 중요합니까?","so":"第一财经","tm":"11/11 15:06","c":1,"r":"cn","u":"https://www.yicai.com/vip/news/103436063.html","p":1794377185,"a":1794377537,"t":"[ 掘金ETF ] 通信ETF量价齐升，港股创新药ETF主力抄底，孰轻孰重？","su":"[오늘의 퀵뷰] 시장 스타일이 극단적으로 순환하고 있습니다. 자금은 방어적 소비, 의료, 고급 반도체(전자기기의 두뇌 부품)에서 저급 기술 성장(AI, 통신, 컴퓨팅 파워)으로 전환되고 있습니다. 대중적인 커뮤니케이션 ETF의 자본 흐름을 추적한 결과, 대부분의 ETF가 거래량 및 가격 조정 추세를 보이는 것으로 나타났습니다. 반면 GEM 인공지능 ETF는 대부분 상승세(오르는 흐름)를 통해 현금화하는 추세를 보입니다. 혁신의약품 홍콩주와 의료 ETF 홍콩주도 차별화를 보인다. 비교하면,"},{"s":"독일 머크 힘줄 윤활막 거대 세포종 신약 FDA 승인","so":"약업신문","tm":"11/11 13:16","c":1,"r":"kr","u":"http://www.yakup.com/news/index.html?mode=view&cat=16&nid=335072","p":1794370560,"a":1794377535,"su":"독일 머크社는 자사의 새로운 1일 1회 경구용 집락형성 촉진인자-1 수용체(CSF-1R) 저해제의 일종인 ‘핌젯미’(Pimjetmi: 피미코티닙)가 FDA의 허가를 취득했다고 10일 공표했다.‘핌젯미’는 외과적 절제수술..."},{"s":"PIMJETMI®(피미코티닙)는 Abbisko Therapeutics에서 개발하고 Merck KGaA(독일 다름슈타트 소재)에서 라이선스를 받아 TGCT에 대해 미국 FDA 승인을 받았습니다. - 회사 발표 - FT.com","so":"Financial Times","tm":"11/11 13:05","c":1,"r":"world","u":"https://markets.ft.com/data/announce/detail?dockey=600-202611102305PR_NEWS_USPRX____CN94839-1","p":1794369900,"a":1794377539,"t":"PIMJETMI® (pimicotinib) Developed by Abbisko Therapeutics and Licensed by Merck KGaA, Darmstadt, Germany Receive U.S. FDA Approval for TGCT – Company Announcement - FT.com"},{"s":"등급 1점: 타이거메드, 해외 실험실 사업 매각하고 주요 임상 CRO 사업 집중","so":"第一财经","tm":"11/11 10:29","c":1,"r":"cn","u":"https://www.yicai.com/news/103435407.html","p":1794360589,"a":1794361870,"t":"壹评级：泰格医药剥离海外实验室业务，聚焦临床CRO主业","su":"{{aisd}} AI生成 免责声明 泰格医药近日公告，拟联合查尔斯河等主体先将控股子公司方达控股私有化，再实施分拆交易。第一财经“壹评级”认为，此举旨在剥离重资产海外实验室业务，将资源集中至具备比较优势的临床CRO主业，优化全球业务布局。 “壹评级”指出，海外实验室业务与临床CRO在运营模式、资产属性和资源投入上差异明显。在地缘环境复杂的背景下，单纯依靠项目交付难以快速提升海外市占率。公司选择保留境内业务及Acme Bioscience, Inc.，体现了对海外扩张路径的理性取舍。本次交易预计产生一次性收益，金额超过公司最近一个会计年度经审计净利润50%；其中，公司直接持股对应税费前现金对价约4.61亿元人民币。公司计划将约60%的交易所得用于海外业务拓展及潜在收购，以增强临床业务的获客能力。"},{"s":"FDA는 GLP-1 약물이 안과 질환의 위험을 증가시키고 시력을 영구적으로 손상시킬 수 있음을 의약품 제조업체에 표시하도록 요구합니다(Donnie Yen 보고).","so":"Now 新聞","tm":"11/11 08:38","c":1,"r":"hk","u":"https://news.now.com/home/international/player?newsId=669101","p":1794353905,"a":1794361870,"t":"FDA要求藥廠標明GLP-1藥物或增眼疾風險 可能令視力永久受損(甄子慧報道)","su":"【Now新聞台】美國食品及藥物管理局宣布，包括俗稱「瘦瘦針」的GLP-1藥物，必須標明可能引致罕見副作用，有機會令視力永久受損。"},{"s":"머크 KGaA, 희귀 종양 질환에 대해 FDA 승인을 받아 오노와 다이이치의 대결이 예고됨","so":"Fierce Pharma","tm":"11/11 07:45","c":1,"r":"us","u":"https://www.fiercepharma.com/pharma/merck-kgaa-lands-fda-nod-rare-tumor-disorder","p":1794350736,"a":1794362980,"t":"Merck KGaA lands FDA nod in rare tumor disorder, portending Ono, Daiichi showdown","su":"Merck KGaA just secured an FDA approval for its new once-daily oral colony stimulating factor-1 receptor (CSF-1R) inhibitor, adding to a growing list of regulatory checkmarks around the globe. | The FDA’s decision was based on Merck’s phase 3 Maneuver trial and follows similar approvals by other global regulators, including in China, Canada and Switzerland."},{"s":"혁신적인 약물의 \"컴퓨팅 파워\"가 위험에 처해 있습니까? '몽키 브라더'의 단가가 20만 원에 도달했습니다. 누가 이러한 추세를 추진하고 있습니까?","so":"财联社","tm":"11/11 07:32","c":1,"r":"cn","u":"https://www.cls.cn/detail/2427627","p":1794349927,"a":1794380460,"t":"创新药“算力”告急？“猴哥”单价冲至20万 谁在推高这股风","su":"① 현재 시장에서 실험용 원숭이의 전반적인 가격이 상승하고 있습니다. 3~5세의 적정 연령의 게잡이원숭이 한 마리의 가격은 일반적으로 15만 이상에서 20만 마리 정도인 반면, 붉은털원숭이 한 마리의 가격은 약 12만 위안이다. ② 실험용 원숭이의 이번 가격 인상은 단순한 순환적 변동이 아니라 공급 측면의 '기존 계정'과 수요 측면의 '새 불'이 충돌한 결과입니다. '커추앙반일보'는 7월 15일 보도했다(시시윤 기자) 지난 이틀 동안 의료계에서 여름 복날 가장 많이 거론된 것은 기온 상승이 아니라, 단일 가격이 중형차 수준인 실험용 원숭이의 치솟는 가치였다. 바이오의약 분야에 오랫동안 관심을 가져온 한 투자자는 과학기술혁신위원회일보 기자에게 \"지난해 말 산업계에서 다들 실험용 원숭이 가격 인상에 대해 논의를 했고, 최근 며칠 사이 자주 이야기가 오갔다\"며 \"원숭이 개체수, 예약 일정, 각 기업의 가격 인상률 등이 모두 우려스러운 부분이다. 업계도 걱정이 좀 있다. 실험용 원숭이 공급이 부족하면 전임상 R&D 비용이 늘어나는 걸까\"라고 말했다. 혁신적인 약물을 개발하고 신약 개발 주기를 연장합니다.\" 공급 측면에서는 '원숭이를 찾기 어렵다'고 한다."},{"s":"의료기기 매출 ‘0’…5년만에 신약사업 포기도","so":"서울경제","tm":"11/11 07:00","c":1,"r":"kr","u":"https://www.sedaily.com/article/20112519","p":1794348006,"a":1794377535,"su":"의료기기 매출(물건을 판 돈 전체) ‘0’…5년만에 신약사업 포기도 ■바이오 신사업 진출기업 ‘빨간불’ 일진, 신약개발 계열사 철수 수순 웰리시스는 3년 영업손실 124억 KT도 6년전 진입에도 성과 없어 “ODM 협업 등 전략 없인 어려워” 바이오·헬스케어를 미래 성장동력으로 내세웠던 기업들의 신사업에 경고등이 켜졌다. 신약 개발 계열사의 직원이 7명에 그쳐 사업 정리를 검토하거나 수백억 원의 투자금을 유치하고도 적자를 벗어나지 못하는 사례가 잇따르고 있기 때문이다."},{"s":"희귀 양성 연조직 종양에 대한 또 다른 옵션이 FDA 승인을 받았습니다.","so":"MedPage Today","tm":"11/11 05:22","c":1,"r":"sg","u":"https://www.medpagetoday.com/hematologyoncology/othercancers/123817","p":1794342175,"a":1794350725,"t":"Another Option for Rare Benign Soft-Tissue Tumor Wins FDA Approval","su":"Pimicotinib achieved 54% objective response rate in unresectable tenosynovial giant cell tumor"},{"s":"바이엘, 2차 뇌졸중 위험 감소제로 선하보(Sunharbo) FDA 승인 획득","so":"Yahoo Finance","tm":"11/11 03:39","c":1,"r":"us","u":"https://finance.yahoo.com/healthcare/articles/bayer-wins-fda-approval-sunharbo-183900909.html","p":1794335940,"a":1794350725,"t":"Bayer Wins FDA Approval for Sunharbo for Secondary Stroke Risk Reduction","su":"Bayer gains FDA approval for Sunharbo, the first Factor XIa inhibitor approved worldwide, opening new growth opportunities in stroke prevention."},{"s":"이러한 유형의 혁신적인 약물은 더 이상 병원 약물 평가 지표의 대상이 아닙니다.","so":"21财经","tm":"11/10 22:28","c":1,"r":"cn","u":"https://www.21jingji.com/article/20261110/herald/94f08eb3082d0ddc7b9f459735fdfa0e.html","p":1794317280,"a":1794350725,"t":"这类创新药，不再受医院药品考核指标约束","su":"11月10日，国家卫生健康委、国家医保局、国家中医药局和国家疾控局联合印发《关于进一步做好创新药安全合理配备使用工作的通知》，围绕创新药安全合理配备使用的重点环节，从促进合理配备、加强培训指导、优化使用条件、完善管理举措等方面提出了具体政策措施。 ●二级以上医疗机构要优化完善创新药进院制度和工作流程，及时召开药事管理与药物治疗学委员会会议，讨论本机构基本用药供应目录更新调整事项，根据本机构业务能力和诊疗工作需要，及时将相关创新药纳入本机构用药目录。"},{"s":"Shanghai RAAS Xu Jun: 중국의 혁신적인 의약품의 고품질 개발에는 R&D와 제조 간의 협력 노력이 필요합니다.","so":"新华网上海","tm":"11/10 22:13","c":1,"r":"cn","u":"http://sh.news.cn/20261110/fe45aa1826e2431d99d9e3fde244c5cf/c.html","p":1794316427,"a":1794350725,"t":"上海莱士徐俊：中国创新药高质量发展，需要研发与制造协同发力","su":"第九届进博会 | 上海莱士徐俊：中国创新药高质量发展，需要研发与制造协同发力-﻿视频链接：https:vodpub1.v.news.cnoriginal20261110567f98c952284e85ae05c3521a960afd.mp4新华网上海11月10日电（史依灵）第九届中国国际进口博览会期间，上海莱士副董事长、总经理徐俊在接受新华网专访时表示，公司正以“拓浆+脱浆”双轮驱动，在拓展血液制品品种及临床应用的同时，向创新药研发延伸，持续布局出凝血、炎症和免疫三大领域。"},{"s":"GenScript Biotech (01548) 기타-사업개발 최신","so":"信報網站","tm":"11/10 21:46","c":1,"r":"hk","u":"https://m.hkej.com/landing/mobarticle2/id/4562530/%25E9%2587%2591%25E6%2596%25AF%25E7%2591%259E%25E7%2594%259F%25E7%2589%25A9%25E7%25A7%2591%25E6%258A%2580%252801548%2529%2520%25E5%2585%25B6%25E4%25BB%2596-%25E6%25A5%25AD%25E5%258B%2599%25E7%2599%25BC%25E5%25B1%2595%25E6%259C%2580%25E6%2596%25B0%25E6%2583%2585%25E6%25B3%2581","p":1794314797,"a":1794316523,"t":"金斯瑞生物科技(01548) 其他-業務發展最新情況","su":"GenScript Biotech (01548) 자발적 발표: 상장(주식시장에 처음 들어오는 것) 계열사 Legend Biotech Co., Ltd.의 2026년 9월 30일 마감 3분기 재무 결과(238KB, pdf)"},{"s":"중국보험협회는 상업용 보험 약품 목록의 첫 번째 버전을 출시했으며, 의료보험국은 상업용 건강보험에 9가지 혁신적인 약품을 포함시켰습니다.","so":"财新","tm":"11/10 21:09","c":1,"r":"cn","u":"https://finance.caixin.com/2026-11-10/102503176.html","p":1794312540,"a":1794350725,"t":"中保协推出首版商业保险药品清单 医保局商业健康险创新药纳入9种","su":"【财新网】在医保的基础上，商业保险如何保障消费者在基本医保外的保障需求？11月10日，中国保险行业协会（下称“中保协”）针对商业医疗保险发布了三个示范条款和一份配套使用的药品清单，为短期、长期医疗险以及“惠民保”三类商业保险产品提供了条款和药品的基本“样板”。 中保协表示，近年来，商业医疗保险成为行业发展的主要增长点，也是服务民生保障的重要支撑，但与人民群众日益增长的健康保障需求相比仍有差距。一是各公司条款表述差异较大，免责条款、理赔材料等内容要求各异，免赔额等常用概念口径不一。二是行业已承担了相当数量的创新药保障，但离人民群众实际需求仍有差距，社会公众对相关保障的了解也比较有限，为将更多创新药纳入保障范围、更好管控风险、提升经营可持续性，亟需制定符合行业实际、契合商保经营规律的商保药品推荐清单。"},{"s":"Novocure는 효능 문제로 인해 Optune Mya 암 장치에 대한 FDA 승인을 거부했습니다.","so":"Fierce Biotech","tm":"11/10 19:52","c":1,"r":"us","u":"https://www.fiercebiotech.com/medtech/novocure-denied-fda-approval-optune-mya-cancer-device-after-efficacy-concerns","p":1794307924,"a":1794350725,"t":"Novocure denied FDA approval for Optune Mya cancer device after efficacy concerns","su":"Novocure has been hit with a relatively rare “not approvable” letter from the FDA for its tumor-treating electric fields device. | Novocure has been hit with a relatively rare “not approvable” letter from the FDA for its tumor-treating electric fields device."},{"s":"판밍: 시장은 점차 바닥을 치고 반등을 준비하고 있습니다. 소비 및 혁신 의약품 분야에 주목하십시오.","so":"第一财经","tm":"11/10 16:41","c":1,"r":"cn","u":"https://www.yicai.com/video/103434373.html","p":1794296514,"a":1794316522,"t":"凡明：大盘逐渐筑底 酝酿反弹 关注消费和创新药板块"},{"s":"혁신신약, 바이오의약품, 생명과학서비스산업(1편)","so":"21财经","tm":"11/10 16:29","c":1,"r":"cn","u":"https://www.21jingji.com/article/20261110/herald/4a19459e97353085071bfc4147a5773d.html","p":1794295740,"a":1794298355,"t":"创新药、生物制品与生命科学服务行业（上）","su":"혁신적인 의약품, 생물학 제품 및 생명과학 서비스 산업(1부) M&A 연구 보고서(2026) \"파이프라인 거래\"에서 \"플랫폼 수준 M&A\"로: 중국 혁신 자산 및 통제 거래 창구의 글로벌 가격 재편 저자: Qianji Investment Banking Research Institu "u":"https://www.hankookilbo.com/news/article/A2026111023060003621","p":1794355200,"a":1794361879,"su":"① 정부는 차세대 센서와 액추에이터 및 휴머노이드용 이차전지를 신산업 핵심 과제로 선정했습니다. ② 정부는 2027년부터 온센서 기술 개발과 실증 체계를 로봇과 방산 및 모빌리티 중심으로 추진할 계획입니다. ③ 정부는 2030년까지 로봇 부품 국산화율을 80%로 높이고 2031년까지 배터리 개발에 2714억 원을 투입하기로 했습니다."},{"s":"SP삼화, 이차전지 전해액용 '염소화 공정없는 제조법' 특허 취득","so":"연합뉴스 한민족센터","tm":"11/10 16:18","c":3,"r":"kr","u":"https://www.koreancenter.or.kr/news/articleView.html?idxno=1437379","p":1794295097,"a":1794298368,"su":"(서울=연합뉴스) 강태우 기자 = SP삼화는 리튬이온 배터리 전해액 소재로 활용되는 '설포닐 플루오라이드 화합물'의 제조 방법에 관한 특허를 취득했다고 10일 공시했다. 이번 특허는 촉매를 활용해 기존 제조 과정에 필요했던 염소화 공정을 생략하면서도 높은 수율로 설포닐 플루오라이드 화합물을 생산할 수 있는 기술이다. 설포닐 플루오라이드 화합물은 배터리의 화학적 안정성과 내구성을 높이는 데 활용되는 소재다."},{"s":"LG에너지솔루션, 사용후 배터리 진단 ‘리.펄스’로 CES 혁신상 수상","so":"경향신문","tm":"11/10 10:36","c":3,"r":"kr","u":"https://www.khan.co.kr/article/202611101036001","p":1794274560,"a":1794281005,"su":"LG에너지솔루션이 전기차에서 다 쓴 배터리 상태를 10분 안에 진단하는 소프트웨어 기술로 ‘CES 2027 혁신상’을 수상했다. LG에너지솔루션은 소프트웨어 기반 사용 후 배터리 진단 솔루션 ‘리.펄스(Re.Pulse)’가 CES 2027 혁신상을 받았다고 9일(현지시간) 밝혔다. 미국소비자기술협회(CTA)가 선정하는 상으로, 첨단 모빌리티 부문에서 받았다. 리.펄스는 배터리에 특정 전류 펄스를 흘려 전압 변화를 측정한다."},{"s":"에비타항공, CATL과 전략적 협력 체결","so":"Jiemian.com","tm":"11/12 20:24","c":2,"r":"cn","u":"https://m.jiemian.com/article/15327228.html","p":1794482695,"a":1794489658,"t":"亿维特航空与宁德时代达成战略合作","su":"최근 Yivit (Hangzhou) Aviation Technology Co., Ltd.와 CATL은 공식적으로 전략적 협력 계약을 체결했습니다. Evitate의 독점 배터리 파트너인 CATL은 항공 유인/화물 eVTOL에 높은 에너지 밀도, 긴 내구성 및 높은 안전성을 갖춘 항공 전력 배터리를 제공합니다."},{"s":"광양 이차전지 소재 업체서 화염…70대 노동자 화상","so":"연합뉴스","tm":"11/12 19:35","c":2,"r":"kr","u":"https://www.yna.co.kr/view/AKR20261112177700054","p":1794479708,"a":1794489657,"su":"(광양=연합뉴스) 손상원 기자 = 12일 오후 4시 44분께 전남광주 광양시 금호동 모 이차전지 소재 업체에서 화염이 발생했다는 신고가 접수됐다..."},{"s":"용귀전기: 지주 자회사, 2,145만 위안 규모의 전력 배터리 조달 프로젝트 입찰에서 낙찰","so":"Jiemian.com","tm":"11/12 17:20","c":2,"r":"cn","u":"https://www.jiemian.com/article/15326346.html","p":1794471629,"a":1794489660,"t":"永贵电器：控股子公司中标2145万元动力电池采购 購，展現投資人對公司經營團隊、表後儲能業務及智慧能源發展策略的支持。公司將運用募集資金加速儲能案場開發、能源管理系統（EMS）升級及虛擬電廠（VPP）平台布局，持續擴大服務規模。 曜衡能源表示，此次募資順利完成，將有助於強化資本實力與專案執行能力，支持公司邁入下一階段成長。未來將以表後儲能為核心，結合能源管理技術與長期能源服務模式，協助企業提升用電效率、控制能源成本，並創造可持續的營運價值。 表後儲能是設置於企業用戶電表後端的儲能系統，可依據用電需求與電價時段進行充放電調度。隨著企業更加重視電費管理、用電穩定性及減碳目標，表後儲能可透過尖離峰電價差管理、契約容量與需量控制、尖峰負載調節等方式，提供更具彈性的能源管理工具；搭配適當的系統設計，也有助於提升企業能源韌性。實際效益仍取決於各案場的用電型態、電價條件及系統配置。 相較於單純設備"},{"s":"「나의 꿈은…","so":"毎日新聞","tm":"11/12 09:45","c":1,"r":"jp","u":"https://mainichi.jp/articles/20261111/k00/00m/310/335000c","p":1794444300,"a":1794453356,"t":"「私の夢は…」 ペロブスカイト太陽電池開発者ら、京都賞で講演","su":"稲盛財団が科学や芸術分野での優れた功績をたたえる「京都賞」の第41回（2026年）記念講演会が11日、京都市左京区の国立京都国際会館であった。次世代の再生可能エネルギーと期待される「ペロブスカイト太陽電池」を開発し、先端技術部門で選ばれた宮坂力（つとむ）・桐蔭横浜大特任教授（73）ら受賞者3人がそ"},{"s":"신한자산운용, 아일랜드 ESS 개발 참여…투자도 추진","so":"뉴스핌","tm":"11/12 09:33","c":1,"r":"kr","u":"https://www.newspim.com/news/view/20261112000216","p":1794443580,"a":1794489674,"su":"[서울=뉴스핌] 이정아 기자 = 신한자산운용이 아일랜드에서 추진하는 대규모 장주기 에너지저장장치(ESS) 개발 사업에 금융 파트너로 참여한다. 사업 초기부터 금융구조를 설계하고 펀드를 통한 지분 투자에 나서는 방식으로 해외 에너지 인프라 투자 확대를 추진한다.12일 신"},{"s":"JR 서쪽과 중국 전 축전지 사업 참가 공동 개발 임무 / 시마네","so":"毎日新聞","tm":"11/12 05:01","c":1,"r":"jp","u":"https://mainichi.jp/articles/20261112/ddl/k32/020/179000c","p":1794427308,"a":1794437335,"t":"JR西と中国電 蓄電池事業参入 共同開発取り組む ／島根","su":"JR 서일본과 중국전력은 축전지 사업에서 공동 개발에 임한다고 발표했다. 중국지방에서의 축전소 전개를 내다보고 전력공급의 안정화와 재생가능에너지 도입 확대를 목표로 한다. JR 서쪽이 축전지 사업에 임하는 것은 처음."},{"s":"영국·축전지 개발자가 일본 진출, 규슈에서 운전 개시","so":"日経クロステック","tm":"11/12 05:00","c":1,"r":"jp","u":"https://xtech.nikkei.com/atcl/nxt/column/18/02443/110600185/","p":1794427200,"a":1794437337,"t":"英・蓄電池デベロッパーが日本進出、九州で運転開始","su":"후쿠오카현의 북부 치쿠호 지역은 메이지 이후 탄광으로 번성했지만 에너지의 주체가 석유가 됨에 따라 쇠퇴해 1976년에 모든 탄광이 폐산했다. 그럼 50년. 이 지역은 신재생에너지를 주력으로 한 새로운 에너지혁명에 의해 메가 솔라(대규모 태양광발전소)와 축전소가 급증하고 지금 신에너지의 집적지가 되고 있다."},{"s":"Terra-Gen California의 9억 5천만 달러 규모의 태양광 에너지 저장 프로젝트는 배터리 에너지 저장 장치로 365MW의 태양 에너지를 전송합니다.","so":"鉅亨網","tm":"11/11 22:00","c":1,"r":"tw","u":"https://news.cnyes.com/news/id/6659556","p":1794402033,"a":1794403038,"t":"Terra-Gen加州9.5億美元光電儲能案商轉365MW太陽能搭配電池儲能","su":"9억 5천만 달러 규모의 캘리포니아 태양광 에너지 저장 프로젝트인 Terra-Gen은 365MW의 태양 에너지 및 배터리 에너지 저장 장치 이전을 협상합니다. 캘리포니아주 샌버나디노 카운티에 위치한 9억 5천만 달러 규모의 이 프로젝트는 365MW의 태양광 발전과 173.7MW의 배터리 에너지 저장 장치를 갖추고 있어 새로운 친환경 전력 공급 장치가 건설 단계부터 실제 가동에 들어갈 수 있습니다. Terra-Gen은 11월 10일 해당 부지의 연간 발전 용량이 약 350,000개의 주택과 기업에 공급할 수 있다고 밝혔습니다. Lockhart는 기업 구매자와 전력 공급 계약을 체결했으며 캘리포니아 전력 공급 회사와 장기 전력 구매 계약도 체결했습니다. 상업양도 이후 전력판매는 이미 계약을 통해 지원되고 있다."},{"s":"BESS용 반고체 배터리: 잠재력과 과제","so":"Energy-Storage.News","tm":"11/11 21:22","c":1,"r":"us","u":"https://www.energy-storage.news/semi-solid-state-batteries-for-bess-potential-and-challenges/","p":1794399779,"a":1794403037,"t":"Semi-solid state batteries for BESS: potential and challenges"},{"s":"SON은 배터리 저장에 적합한 Saugeen Shores 부지를 제안했다고 밝혔습니다.","so":"Windsor News Today","tm":"11/11 19:21","c":1,"r":"sg","u":"https://windsornewstoday.ca/midwestern/news/2026/11/11/son-says-proposed-saugeen-shores-site-suitable-for-battery-storage","p":1794392488,"a":1794403041,"t":"SON says proposed Saugeen Shores site suitable for battery storage","su":"Neoen Ontario는 Port Elgin 바로 남쪽에 있는 752 Concession 2에 배터리 에너지 저장 시스템 시설 설립을 신청했습니다."},{"s":"\"DJ Insight\" 주거용 태양광 수요 약세, Enphase가 상업용 교체 및 에너지 저장 시장 진출 - 뉴스","so":"MoneyDJ","tm":"11/11 14:39","c":1,"r":"tw","u":"https://www.moneydj.com/kmdj/news/newsviewer.aspx?a=5ff7c63d-aa5b-44af-b608-3967b1711177","p":1794375540,"a":1794377558,"t":"《DJ Insight》住宅太陽能需求疲弱，Enphase搶進商用汰換與儲能市場- 新聞","su":"미국의 주거용 태양 에너지에 대한 수요 감소로 인해 마이크로 인버터 및 에너지 저장 장비 제조업체인 Enphase Energy(ENPH.US)는 새로운 수익원 찾기를 가속화했습니다. 새로운 가정용 배터리 제품 출시를 준비하고 기존 사용자의 에너지 저장 시스템 설치를 유도하는 것 외에도 산업용 및 상업용 태양광 시스템의 인버터 교체 요구 사항을 겨냥하고 AI 데이터 센터를 개발하고 있습니다."},{"s":"'외국인 투자 하이라이트' 골드만삭스: 중국 배터리 산업 수요는 2027년 최소 20% 증가할 것이다. Zhengli New Energy는 매수 등급을, China New Aviation과 Ruipu Lanjun은 중립 등급을 부여했다.","so":"etnet 經濟通","tm":"11/11 12:06","c":1,"r":"hk","u":"https://www.etnet.com.hk/www/tc/news/news-article.php?section=categorized&category= 1","c":1,"r":"tw","u":"https://money.udn.com/money/story/11799/9868992","p":1794297714,"a":1794316547,"t":"工研院攜手產學實證雙向充放電 打造移動式儲能新模式 | 產業動態 | 商情","su":"전기 버스는 승객을 태울 수 있을 뿐만 아니라 주차 및 휴식 시 '이동형 에너지 저장 장치'로 전환될 수 있으며, 버스의 전력을 마이크로그리드로 역전송하여 전력 부하 조절에 도움을 줄 수 있습니다. 산업기술연구원은 경제부 에너지청 지원으로 지난 11월 6일 국립중성대학교에서 '전기차 양방향 충방전 및 마이크로그리드 통합 포럼 및 시연회'를 개최했다. 양방향 충전 및 방전 기술을 통해 전기 버스가 지역 마이크로그리드 시스템과 통합되어 차량이 주차 중에 현장 전력 소비를 지원할 수 있도록 하고 미래 피크 전력 조절, 비상 백업 및 그리드 복원력을 위한 새로운 적용 방향을 제시하는 것을 성공적으로 시연했습니다. 경제부 에너지 관리 국장 Wu Zhiwei는 \"에너지 전환 2.0\"이라는 국가 정책 방향과 전력망의 탄력성 강화에 따라 정부가 최근 몇 년간 재생 에너지 적용, 심층적인 에너지 절약, 분산형 마이크로그리드와 가상 발전소(VPP) 통합을 적극적으로 추진했다고 말했습니다. 전기차와 스마트자동차가 대중화되면서 차량에 장착되는 대용량 배터리는 구동력을 제공할 뿐만 아니라 유연한 분산전원이 될 가능성도 있다. Wu Zhiwei는 양방향 충전 및 방전 기술과 스마트 에너지 관리 시스템(EMS)을 통해 전기 버스가"},{"s":"'무브먼트 주식' 준신간주 위안신에너지스토리지(09621)는 40% 이상 상승해 현재 21.92위안에 거래되고 있다.","so":"etnet 經濟通","tm":"11/10 16:37","c":1,"r":"hk","u":"https://www.etnet.com.hk/www/tc/news/news-article.php?section=categorized&category=latest&newsid=20261110133","p":1794296220,"a":1794298386,"t":"《異動股》半新股遠信儲能(09621)漲逾四成，現報21.92元","su":"2026/11/10 15:37 \"Movement Stocks\" 준신주 Farsonic Energy Storage(09621)는 40% 이상 상승하여 현재 21.92위안에 거래되고 있습니다. 준신주 Yuanxin Energy Storage(09621)는 한때 41% 이상 상승했으며 최고 가격은 21.98위안입니다. 현재 41% 상승한 21.92위안, 최저 가격은 15.55위안입니다. 28908만 주가 거래되었으며 거래 금액은 5715만 위안입니다. 활성 매수-매도 비율은 58:42, 순 활성 펀드 구매액은 790.62만 위안입니다. 현재 최대 순 패시브 구매 브로커는 IMC ASIA PACIFIC으로 금액은 874,100위안, 가중 평균 거래 가격은 18,798위안입니다. 현재 최대 순 수동 판매 브로커는 Futu Securities International이며 금액은 229.22만 위안, 가중 평균 거래 가격은 19.784 위안입니다. 이 주식 1랏에는 500주가 있습니다. IPO 투자자들이 지금까지 주식을 보유하면 거래비용과 관계없이 랏당 6070위안을 벌게 된다."},{"s":"삼성·현대차, '원팀' 협력 강화…삼성SDI, 전기차 넘어 로봇 배터리 교두보 역할","so":"뉴시스","tm":"11/10 15:22","c":1,"r":"kr","u":"https://mobile.newsis.com/view_amp.html?ar_id=NISX20261110_0003862141","p":1794291769,"a":1794298382,"su":"[서울=뉴시스]이창훈 기자 = 삼성그룹과 현대차그룹이 이른바 '원팀' 수준의 전방위 협력에 나서면서 배터리 분야 협력 확대 기대감이 커지고 있다"},{"s":"[산업이(異)면]LG 빠지자 ESS 배터리값 상승?…‘팔 곳’ 찾던 배터리, 이젠 ‘살 사 - 國際","su":"馬斯克(Elon Musk)旗下SpaceX計畫在美國德州Starbase基地興建天然氣發電廠及超級運算設施，初期投資估計達240億美元。透過自行掌握電力供應，SpaceX可望減少對德州主要電網的依賴，避開資料中心接入電網可能長達數年的等待期，也為天然氣發電設備及資料中心基礎設施供應商帶來潛在商機。..."},{"s":"데이터 센터 전력 공급업체는 연료 전지 거래와 함께 백로그 및 지침 업데이트를 게시합니다.","so":"Financial Times","tm":"11/12 21:11","c":1,"r":"world","u":"https://markets.ft.com/data/announce/detail?dockey=600-202611120711PR_NEWS_USPRX____LN96156-1","p":1794485460,"a":1794489693,"t":"Data Center Power Suppliers Post Backlog and Guidance Updates Alongside a Fuel Cell Deal"},{"s":"블루앤화이트는 조언 듣기를 거부하고 대기오염법을 부과합니다. 관리자: 필연적으로 전력 부족이 발생하므로 바람직하지 않습니다.","so":"自由時報","tm":"11/12 21:06","c":1,"r":"tw","u":"https://stock.ltn.com.tw/article/m5vqzkmnkgqj","p":1794485208,"a":1794489691,"t":"藍白不聽勸強修空污法 經長：勢必釀電力吃緊非所願","su":"국민당 입법원과 인민당 의원들은 석탄화력발전소의 조기 해체를 직접적으로 규정하고, 해체된 석탄화력발전기를 비상 백업으로 전환하는 것을 제한하는 대기오염법 개정법 제28조와 제30조를 이달 10일 발의했다. Gong Mingxin 경제부 장관은 오늘 인터뷰에서 특정 장치를 조기에 폐기해야 한다면 필연적으로 전력 공급 부족 문제가 발생할 것이라고 말했습니다. 이는 경제부와 업계가 원하는 바가 아니며, 새로운 유닛 건설에는 시간이 걸릴 것입니다. \"오늘 그렇게 하면 내일 전기가 나올 것입니다.\""},{"s":"중국, AI 전력 수요 폭발로 글로벌 가스 터빈 시장 공략","so":"Crude Oil Prices Today | OilPrice.com","tm":"11/12 19:00","c":1,"r":"sg","u":"https://oilprice.com/Latest-Energy-News/World-News/China-Targets-Global-Gas-Turbine-Market-as-AI-Power-Demand-Explodes.amp.html","p":1794477600,"a":1794489692,"t":"China Targets Global Gas Turbine Market as AI Power Demand Explodes","su":"중국은 글로벌 AI 데이터센터(컴퓨터 수만 대를 모아 둔 건물) 붐으로 인한 기록적인 수요와 공급 부족을 활용하기 위해 가스터빈 개발과 해외 진출을 가속화하고 있습니다."},{"s":"변압기 회사는 선물 도구를 사용하여 정확한 정책을 구현하여 원자재 가격 변동에 효과적으로 대응할 수 있습니다.","so":"21财经","tm":"11/12 18:33","c":1,"r":"cn","u":"https://www.21jingji.com/article/20261112/herald/b3e514236fc708844bf7dfee890f3095.html","p":1794475980,"a":1794489689,"t":"运用期货工具精准施策 变压器企业有效应对原料价格波动","su":"지난 2년간 국내외 구리 가격의 등락이 계속돼 구리 산업 하류 기업의 생산원가와 영업이익(장사해서 남긴 돈)에 직접적인 영향을 미쳤다. 일부 기업은 성숙하고 효과적인 위험 관리 시스템이 부족하여 여러 가지 문제에 직면하고 있습니다. 방문 기간 동안 기자는 중국 동부 지역의 한 변압기 제조 회사가 파생상품 위험 관리 도구의 과학적이고 합리적인 사용을 통해 올해 약 300만 위안의 조달 비용을 절감하고 원자재(물건의 재료(석유·구리 등)) 가격 변동의 영향에 효과적으로 대응하며 안정적인 운영을 달성했다는 사실을 알게 되었습니다. 구리 가격이 오르고 기업에는 위험 관리 도구가 시급히 필요합니다. 인터뷰에서 기자는 변압기 제조를 핵심으로 하고 송전 및 변전 장비 분야에 깊이 있는 중국 동부의 국가 수준의 전문화되고 새로운 \"작은 거인\" 기업이 다량의 구리를 사용하고 원자재 비용의 높은 비율을 차지한다는 사실을 알게 되었습니다. 그러나 현물 조달 및 판매를 담당하는 전문 선물팀이 없습니다. 팀은 선물의 기본 이론, 헤징 운영 절차, 위험 예방 및 통제의 핵심 사항 등 전문적인 내용에 대한 지식이 제한되어 있습니다. 이들은 금융파생상품 상품을 “이해하지 못하고, 사용할 용기가 없고, 사용 방법을 모른다”는 공통된 업계 특성을 갖고 있어 매일 독립적이고 효과적인 헤징 사업을 수행하기가 어렵습니다."},{"s":"AI 전력소비 줄일 차세대 반도체… 제주대서 '멤리스터' 기술 주목","so":"파이낸셜뉴스","tm":"11/12 16:36","c":1,"r":"kr","u":"https://www.fnnews.com/news/202611121631184362","p":1794469002,"a":1794489688,"su":"인공지능 확산으로 데이터센터(컴퓨터 수만 대를 모아 둔 건물)의 전력 수요가 급증하는 가운데 전력 소모를 줄일 차세대 반도체(전자기기의 두뇌 부품) 기술이 제주대학교에서 소개됐다."},{"s":"586GW가 199GW로! 북미 데이터센터 계획 3분의 2가 할인돼 외신에 '잔혹한 현실' 노출","so":"自由時報","tm":"11/12 15:22","c":1,"r":"tw","u":"https://stock.ltn.com.tw/article/p2dndfbng3cw","p":1794464555,"a":1794467131,"t":"586GW變199GW！北美資料中心2/3規劃遭打折 外媒曝「殘酷現實」","su":"인공지능(AI) 투자 붐이 계속되면서 데이터센터(컴퓨터 수만 대를 모아 둔 건물) 구축 규모가 계속해서 커지고 있는 가운데, 이 거대한 확장 청사진 중 실제로 구현 가능한 것은 과연 몇 개나 될까? 월스트리트 투자은행 번스타인(Bernstein)은 건설 예정인 북미 데이터센터 용량이 586GW(기가와트)에 달했다는 연구 보고서를 발표했다. 그러나 \"건설 진행 상황, 고객 신용, 개발자 강도 및 규제 위험\"을 종합적으로 평가한 결과 약 199GW만이 구현에 대한 높은 신뢰도를 갖고 있습니다."},{"s":"야당은 대기오염법을 개정해 석탄발전소를 조기에 해체하도록 요구하고 있다. 경제부, 2028년 예비력 마이너스로 전환할 것 경고 - 업계","so":"工商時報","tm":"11/12 12:48","c":1,"r":"tw","u":"https://www.ctee.com.tw/news/20261112701234-430503","p":1794455280,"a":1794467133,"t":"在野黨修空污法要燃煤提前除役經濟部警告2028年電力備用轉負- 產業","su":"입법원 국민당 의원과 인민당 그룹은 최근 대기오염법 제28조와 제30조를 개정하여 석탄발전소를 직접 조기 해체하고, 해체된 석탄발전소를 비상 대기 상태로 전환하는 것을 제한할 것을 제안했습니다. 이에 경제부는 다음 단계로 도약해 오늘(12일) 4대 전력수급 리스크를 발표했다. 가장 심각한 문제는 4개 발전소 총 9.7GW의 석탄화력발전소가 예정보다 일찍 가동을 중단해 2028년과 2029년 전력예비능력률이 마이너스로 돌아선다는 점이다. 경제부는 AI와 반도체(전자기기의 두뇌 부품)에 대응해…"},{"s":"AI 전력 수요 급증으로 반발 촉발 엔비디아 옹호 커뮤니티 포함","so":"DIGITIMES","tm":"11/12 11:51","c":1,"r":"tw","u":"https://www.digitimes.com.tw/tech/dt/n/shwnws.asp?id=0000774492_AYY3F4OBLVM67H15M0YCG&cf=A21","p":1794451860,"a":1794453363,"t":"AI電力需求激增引發反彈 NVIDIA倡議社區共融","su":"隨AI算力擴張引發歐美地方社區抗議與電網負荷壓力，NVIDIA永續發展主管Josh Parker於聯合國氣候變遷大會（COP 31）相關論壇強調，資料中心應該成為地方社區的實質..."},{"s":"앤트로픽 Inks, 블록버스터 기업 공개(IPO) 전 데이터 센터 전력에 대한 대규모 34억 달러 거래","so":"Yahoo Finance","tm":"11/12 09:02","c":1,"r":"us","u":"https://finance.yahoo.com/technology/ai/articles/anthropic-inks-massive-3-4-000234047.html","p":1794441720,"a":1794467127,"t":"Anthropic Inks Massive $3.4 Billion Deal for Data Center Power Before Blockbuster IPO","su":"앤트로픽은 공개 데뷔가 가까워지면서 1.7GW의 발전량에 34억 달러를 지출했습니다."},{"s":"AI 전력 확보에 과잉 베팅한 소프트뱅크, 주가 55% 급락","so":"한국경제","tm":"11/12 08:27","c":1,"r":"kr","u":"https://www.hankyung.com/article/202611121662i","p":1794439639,"a":1794453363,"su":"- 기사 스크랩 - 댓글 - 공유 - 글자크기 - 프린트 Google 검색에서 한국경제 기사를 더 자주 볼 수 있습니다. 소프트뱅크그룹이 AI 데이터센터(컴퓨터 수만 대를 모아 둔 건물) 전력 확보를 위해 과도하게 선점했던 가스터빈 계약을 취소·조정하며 37억 달러의 손실을 입은 가운데, 공격적인 AI 인프라 투자에 따른 재무 부담과 수익성 우려가 커지고 있습니다. 한경 프리미엄9의 모든 콘텐츠는 한국경제신문의 저작물로 저작권법의 보호를 받습니다."},{"s":"마이크로소프트는 데이터 센터에 전력을 공급하기 위해 자체 비용을 지불하겠다고 맹세합니다.","so":"Bloomberg.com","tm":"11/12 05:33","c":1,"r":"us","u":"https://www.bloomberg.com/news/articles/2026-11-11/microsoft-vows-to-pay-its-own-way-to-power-data-centers","p":1794429196,"a":1794437345,"t":"Microsoft Vows to Pay Its Own Way to Power Data Centers"},{"s":"인피니언, 데이터 센터에 SiC 및 GaN 전원 신수요","so":"日本経済新聞","tm":"11/12 05:00","c":1,"r":"jp","u":"https://www.nikkei.com/prime/tech-foresight/article/DGXZQOUC114CG0R11C26A1000000","p":1794427200,"a":1794437355,"t":"インフィニオン、データセンターにSiCとGaN 電源新需要","su":"인피니언은 AI 데이터 센터의 배전 시스템을 향해 SiC나 GaN의 파워 반도체(전자기기의 두뇌 부품) 제품을 확충한다. 사진은 SiC 파워 모듈의 목업 독일 Infineon Technologies(인피니언 테크놀로지스)는 AI(인공지능) 데이터 센터의 배전 시스템을 향해 탄화규소(SiC)나 질화갈륨(GaN)의 파워 반도체 제품을 확충한다. 향후 수요가 높아지는 반도체 변압기(SST)를 향해 SiC 파워 모듈을 2026년 내에 양산한다. 양방향형이라고 불리는 새로운 GaN 파워 반도체도 개발하고 있어 급성장을 전망하는 SST 시장을"},{"s":"중부 전력, 영국에서 해상 풍력의 해저 송전선 우선 협상권","so":"日本経済新聞","tm":"11/12 05:00","c":1,"r":"jp","u":"https://www.nikkei.com/prime/gx/article/DGXZQOUC1188C0R11C26A1000000","p":1794427200,"a":1794437356,"t":"中部電力、英で洋上風力の海底送電線 優先交渉権","su":"중부전력은 영국 동부에 있는 해저송전선 등 운영사업에서 우선협상권을 취득했다고 발표했다. 해상풍력발전소용 송전선으로 우선협상권은 현지기업과 공동으로 취득했다. 영국에서의 해저 송전 사업은 3번째가 된다. 대상이 되는 송전선은 영국의 동부 앞바다 약 130킬로미터로 운전중의 약 120만킬로와트의 해상 풍력 발전소 「도거・뱅크 B」에 접속한다. 연간 실적(회사가 번 돈 성적표) 전망(회사가 내놓은 앞으로의 실적 예상)은 공개되지 않았다. 사업권을 얻으면 운영을 위한 특별목적회사(SP"},{"s":"미국은 정책을 환영하고 비즈니스 기회를 가져오기 위해 Hon Hai 및 Huacheng과 같은 AI 전력 인프라 건설을 가속화합니다 | 기술산업 | 산업경제","so":"UDN","tm":"11/12 03:48","c":1,"r":"tw","u":"https://udn.com/news/story/7240/9873035","p":1794422883,"a":1794437351,"t":"美加速AI電力基建鴻海、華城等迎政策利多商機| 科技產業| 產經","su":"미국 상원은 초당적인 에너지 라이센스 개혁 법안의 토론 과정을 통과시켜 건설 속도를 높이고 AI 데이터 센터가 더 많은 에너지 비용을 부담하도록 요구하기 위해 에너지 계획 검토 과정을 대폭 완화할 준비를 하고 있습니다."},{"s":"컨스텔레이션에너지의 배당금은 적습니다. AI 전력 수요가 이를 변화시킬 수 있다","so":"Yahoo Finance","tm":"11/12 03:17","c":1,"r":"us","u":"https://finance.yahoo.com/energy/articles/constellation-energy-dividend-small-ai-181715518.html","p":1794421035,"a":1794437346,"t":"Constellation Energy’s Dividend Is Small. AI Power Demand Could Change That","su":"컨스텔레이션 Energy는 올해 두 번째로 전망을 높였지만 지불금은 거의 기록되지 않았습니다. 기술 대기업들은 수십 년에 걸친 전력 계약을 체결하고 있지만 경영진은 배당(회사가 주주에게 나눠주는 돈)금이 아닌 다른 곳에 현금을 지출하고 있습니다. 소득 투자자들이 주목해야 할 사항은 다음과 같습니다."},{"s":"1분 안에 세계를 보세요/말레이시아는 에너지 소비량이 많은 사용자에게 서비스를 제공하기 위해 독립적인 도매 전력 시장을 설립할 계획입니다.","so":"經濟日報","tm":"11/12 02:47","c":1,"r":"tw","u":"https://money.udn.com/money/story/5599/9872929","p":1794419260,"a":1794437353,"t":"1分鐘看世界／馬來西亞擬設獨立批發電力市場 服務高耗能用戶","su":"말레이시아는 데이터 센터와 같이 전력 소비가 높은 사용자에게 서비스를 제공하기 위해 독립적인 도매 전력 시장을 설립할 계획입니다. 가정, 공장, 상점에 전력을 공급하는 기존 시장은 변함이 없을 것이다. 이러한 움직임은 데이터 센터에서 사용되는 대량의 전력으로 인한 영향을 줄이기 위한 것입니다. 관계자들은 정부는 데이터 센터 개발을 허용해야 하지만 다른 산업의 에너지 비용에 직접적인 영향을 주어서는 안 된다고 생각한다고 설명했습니다."},{"s":"Delta, SC26에서 AI 인프라와 새로운 800 VDC, ±400 VDC 아키텍처를 위한 '그리드에서 칩까지' 냉각 혁신 공개 - 회사 발표 - FT.com","so":"Financial Times","tm":"11/11 23:00","c":1,"r":"world","u":"https://markets.ft.com/data/announce/detail?dockey=600-202611110900PR_NEWS_USPRX____SF94807-1","p":1794405600,"a":1794411561,"t":"Delta Unveils 'From-Grid-to-Chip' Cooling Innovations for AI Infrastructure and for New 800 VDC, ±400 VDC Architectures at SC26 – Company Announcement - FT.com"},{"s":"오하이오주 클리블랜드의 Union Trust Building 내에 데이터 센터 제안","so":"Data Center Dynamics","tm":"11/11 20:47","c":1,"r":"us","u":"https://www.datacenterdynamics.com/en/news/data-center-proposed-within-clevelands-union-trust-building-ohio/","p":1794397659,"a":1794403050,"t":"Data center proposed within Cleveland's Union Trust Building, Ohio","su":"차압 매각 및 현지 유예 조치에도 불구하고 소유자는 Hyperscape Digital과의 파트너십을 모색합니다."},{"s":"간사이 전력과 간사이 전력 송배전, 37년 만에 작업복 쇄신 BEAMS가 감수","so":"日本経済新聞","tm":"11/11 20:42","c":1,"r":"jp","u":"https://www.nikkei.com/article/DGXZQOUF116DW0R11C26A1000000/","p":1794397334,"a":1794403055,"t":"関西電力と関西電力送配電、37年ぶりに作業服刷新 BEAMSが監修","su":"간사이 전력과 간사이 전력 송배전은 빔스의 유니폼 브랜드 'Uniform Circus BEAMS'가 감수한 새로운 작업복을 발표했다. 37년만이 되는 기본 디자인의 쇄신으로, 12월 1일부터 착용한다. 안전성과 품질을 유지하면서 통기성이나 움직이기 쉬움 등의 기능성을 개선했다. 실제 시험을 통해"},{"s":"키옥시아 「10세대」, 전력 효율 2배 추론이 촉구하는 혁신","so":"日本経済新聞","tm":"11/11 19:33","c":1,"r":"jp","u":"https://www.nikkei.com/prime/gx/article/DGXZQOUC076H70X01C26A0000000","p":1794393204,"a":1794403056,"t":"キオクシア「第10世代」、電力効率2倍 推論が促す革新","su":"반도체(전자기기의 두뇌 부품) 메이저 기업인 키옥시아는 이르면 2027년 양산할 예정이다. 낸드플래시 메모리는 데이터를 읽을 때 이전 세대 제품보다 전력 효율이 2배 이상 높다. 인공지능(AI)이 확산되면서 데이터센터(컴퓨터 수만 대를 모아 둔 건물)의 환경부담이 사회적 문제로 대두됐고, 미국 중간선거에서도 이슈가 됐다. 엔비디아, 데이터센터 사업자 등 대형 고객들은 전력 소모 자체를 줄일 수 있는 신제품에 대한 기대가 크다. AI가 빠르게 확산되면서 전력 수요도 늘어나고 있다. 전력계통의 왜곡과 탈탄소화에 어떻게 대처할 것인가? 기업의 최첨단 활동에 대한 비정기 연재 기사를 게재합니다."},{"s":"LITEON, electronica 2026에서 고속 광 인터커넥트 및 핵심 광전자 기술 선보여 지능형 포토닉스로 AI 데이터센터 인프라 발전 – 회사 발표 - FT.com","so":"Financial Times","tm":"11/11 19:13","c":1,"r":"world","u":"https://markets.ft.com/data/announce/detail?dockey=600-202611110513PR_NEWS_EURO_ND__EN95071-1","p":1794391980,"a":1794403059,"t":"LITEON Showcases High-Speed Optical Interconnect and Key Optoelectronic Technologies at electronica 2026, Advancing AI Data Center Infrastructure with Intelligent Photonics – Company Announcement - FT.com"},{"s":"해외 컴퓨팅 파워 체인이 \"결산\"을 시작하면 A-share AI에 어떤 기회가 있을까요?","so":"21财经","tm":"11/11 18:19","c":1,"r":"cn","u":"https://www.21jingji.com/article/20261111/herald/443b250d9e22d16bddd37ead3ac05e9a.html","p":1794388740,"a":1794459155,"t":"当海外算力链开始“算账”，A股AI机会何在？","su":"지난 몇 년간 AI 분야의 투자 논리는 단일 체인과 매우 유사했다. 해외 주요 제조업체의 자본 지출 증가 → 컴퓨팅 칩 부족 → 광 모듈, PCB, 서버 주문 폭발 → A 주 하드웨어 체인이 전반적으로 상승했습니다. 하지만 2026년 4분기에 접어들면서 이 사슬은 복잡해지기 시작합니다. 글로벌 시장은 더 이상 \"AI의 무한한 증가\"에 대한 일방적인 기대에 직면하지 않고 또 다른 모순에 직면해 있습니다. 최근 미국 채권(돈을 빌려주고 받는 차용증) 금리(돈을 빌릴 때 내는 이자 비율)의 하락은 기술주의 가치 평가에 좋을 수 있지만 북미 AI 건설은 재무 견제와 균형 및 규제 조사를 받고 하드웨어 체인의 수익성 확실성이 재조정되었습니다. 동시에 광학 모듈, 구리 연결, 액체 냉각 및 기타 방향은 초기 기관 위치의 집중으로 인해 매우 혼잡하며 반등 시 판매 압력을 과소평가할 수 없습니다. 즉, AI 산업체인은 끝나지 않았지만 '눈을 감고 북미 지도를 구매하는 단계'는 지나갔을 수도 있고, 기회는 '자본 지출 기대 거래'에서 '산업 실현 속도 검증'으로 전환될 수도 있다."},{"s":"순환 자산 변환으로 그리드 안정성 향상","so":"POWER Magazine","tm":"11/11 18:01","c":1,"r":"us","u":"https://www.powermag.com/partner-content/enhance-grid-stability-with-rotating-asset-conversions/","p":1794387698,"a":1794403051,"t":"Enhance Grid Stability with Rotating Asset Conversions","su":"폐기되거나 활용도가 낮은 터빈 발전기를 개조하여 지역 전력망 안정성을 제공함으로써 수익을 창출할 수 있습니다. 이것은 POWER 매거진 시리즈의 다섯 번째 기사입니다. 첫 번째 기사인 미래 보장형 가스 발전소 투자에서는 기존 시설의 수명을 연장하기 위한 다양한 기술에 대해 논의했습니다. 두 번째 기사, 자율 발전 – 미래는 […]"},{"s":"[트렌드의 비밀 열쇠: 글로벌 전기화가 가속화되고 있으며, 국내 투자가 RMB 5조에 달해 전력망 장비 부문이 호황을 누리고 있습니다.","so":"第一财经","tm":"11/11 17:31","c":1,"r":"cn","u":"https://www.yicai.com/vip/news/103436343.html","p":1794385881,"a":1794403053,"t":"[ 风口秘钥 全球电气化提速叠加国内迎五万亿投资 电网设备板块景气上行","su":"11월 11일에도 전력망 장비 부문의 활발한 활동이 이어졌습니다. 마감 현재 Huashengchang은 일일 한도에 도달했으며 Jiangsu Huachen은 8.24% 상승했으며 Sanhui Electric, Hangzhou Kelin, Tianzheng Electric 및 Zhongchen 주가는 5% 이상 상승했습니다. 뉴스에 따르면, 제31차 유엔기후변화회의에서는 2035년까지 전 세계 최종 에너지 소비에서 전력이 차지하는 비중을 35%로 높이는 것을 제안했습니다. 동시에 글로벌 가스터빈 거대 기업인 GE 버노바1"},{"s":"다이킨 공업, 미국 자회사가 엔비디아의 설계 기반에 대응한 대규모 데이터 센터용 냉각 레퍼런스 아키텍처를 발표","so":"日本経済新聞","tm":"11/11 15:51","c":1,"r":"jp","u":"https://www.nikkei.com/article/DGXZRSP715129_R11C26A1000000/","p":1794379868,"a":1794403058,"t":"ダイキン工業、米子会社がNVIDIAの設計基盤に対応した大規模データセンター向け冷却リファレンス・アーキテクチャを発表","su":"【프레스 릴리스】발표일:2026년 11월 11일 엔비디아의 설계 기반에 대응한 대규모 데이터 센터용 냉각 레퍼런스·아키텍쳐를 발표 미국 캘리포니아주 산타클라라)의 AI 팩토리(※1)(대규모 데이터 센터"},{"s":"\"현장기회 넓히다\" … 창원특례시, 특성화고 대상 두산에너빌리티 등 견학 실시","so":"아시아경제","tm":"11/11 15:09","c":1,"r":"kr","u":"https://www.asiae.co.kr/article/2026111115094707096","p":1794377388,"a":1794377567,"su":"경남 창원특례시가 11일 특성화고 학생들을 대상으로 두산에너빌리티와 대호아이앤티를 찾아 &#039;직무특강 및 기업."},{"s":"풍력 및 태양광 이용률은 3년 연속 하락했습니다. 전력 시장은 어떻게 높은 비율의 새로운 에너지 소비를 지원할 수 있습니까?","so":"第一财经","tm":"11/11 15:00","c":1,"r":"cn","u":"https://www.yicai.com/news/103435911.html","p":1794376820,"a":1794377570,"t":"风光利用率连续三年回落，电力市场何以支撑高比例新能源消纳","su":"{{aisd}} AI 생성 면책조항 \"국가 통합 전력 시장 구축으로 '이용 가능 여부' 단계의 작업이 완료되었으며 다음 단계의 핵심 문제는 사용 가능 여부와 관리 가능 여부입니다.\" 11월 10일에 열린 중국 전력 위원회의 제4차(2026년) 전력 시장 개발 포럼에서 Datang Group의 운영 및 관리 부서 이사인 Pang Xiaojin은 이러한 견해를 제시했습니다. 현재 전국 통합 전력 시장의 규모는 지속적으로 확대되고 있으며, 전력 자원 배분은 지방 차원의 자체 균형에서 전국적인 최적화 주기로 전환되고 있습니다. 그린파워 가치 실현도 점차 정책 중심에서 시장 중심으로 전환되고 있다. 2025년 말 기준 전국 시장 기반 거래 전력량은 6조6400억kWh로 사회 전체 전력 소비량의 64%를 차지한다. 그 중 성, 지역 간 거래되는 전력량은 1조 6천억kWh에 육박하며, 녹색 전력 거래량은 전년 대비 38% 이상 증가한 3,285억kWh에 달했다."},{"s":"이기학 두산에너빌리티 팀장 \"해상풍력, 국산 터빈·인프라 함께 키워야\"","so":"뉴스1","tm":"11/11 14:26","c":1,"r":"kr","u":"https://www.news1.kr/economy/trend/6350548","p":1794374765,"a":1794403049},{"s":"글로벌 정책은 데이터 센터 그리드 지연, 탄소 배출 감소를 목표로 합니다.","so":"Bloomberg.com","tm":"11/11 13:08","c":1,"r":"us","u":"https://www.bloomberg.com/news/articles/2026-11-11/global-policies-target-data-center-grid-delays-lower-emissions?srnd=homepage-asia","p":1794370129,"a":1794377567,"t":"Global Policies Target Data-Center Grid Delays, Lower Emissions"},{"s":"\"AI 전력 수요 잡는다\"…두산퓨얼셀, 9분기 연속 적자 딛고 북미 공략 지속","so":"뉴시스","tm":"11/11 11:40","c":1,"r":"kr","u":"https://mobile.newsis.com/view_amp.html?ar_id=NISX20261111_0003863299","p":1794364819,"a":1794377567,"su":"[서울=뉴시스]박현준 기자 = 수소연료전지 전문기업 두산퓨얼셀의 적자가 계속되는 가운데 북미 전력 수요 확대에 대응한 공급계약 확보와 생산체계 정비가 실적(회사가 번 돈 성적표) 반등의 과제로 떠올랐다"},{"s":"기후부, AI 전력 병목 대응…\"수요 분산·송전망 선제 구축\"","so":"뉴스1","tm":"11/11 11:30","c":1,"r":"kr","u":"https://www.news1.kr/economy/env-policy/6350321","p":1794364233,"a":1794367486},{"s":"‘K-전력기기’ 수출 날개단다…전기硏, 글로벌 시험인증 표준 선도","so":"헤럴드경제","tm":"11/11 11:22","c":1,"r":"kr","u":"https://biz.heraldcorp.com/article/10933534","p":1794363747,"a":1794367486,"su":"[헤럴드경제=구본혁 기자] 전 세계 단 11개 시험기관만 정회원 자격을 보유한 전력기기 시험인증 분야 최고 권위의 국제회의가 한국에서 열린다. 한국전기연구원(KERI)은 1"},{"s":"데이터센터 못 지으면 한국으로 오세요…랠리 펼친 네이버, 시총 20위 ‘각축’","so":"매일경제 마켓","tm":"11/11 11:06","c":1,"r":"kr","u":"https://stock.mk.co.kr/news/view/1195994","p":1794362762,"a":1794363244,"su":"데이터센터(컴퓨터 수만 대를 모아 둔 건물) 못 지으면 한국으로 오세요…랠리 펼친 네이버, 시총 20위 ‘각축’ 김송현 기자(kim.songhyun@mk.co.kr) 입력 : 2026.11.11 11:06:02 네이버 등 시총 20위 경쟁 美 데이터센터 규제에 희비 금리 부담에 산업주 약세 미국의 데이터센터 건설 규제 우려가 커지면서 국내 증시의 시가총액(회사 전체 몸값) 순위에도 변화가 나타나고 있다. 해외 인공지능(AI) 연산 수요를 겨냥한 네이버가 강세를 보인 반면 두산에너빌리티와 HD현대중공업 등 기존 산업주는 약세를 보이며 시총 20위 자리를 놓고 치열한 순위 경쟁이 벌어지고 있다."},{"s":"KERI, 고전압 전력기기 시험인증 최고권위 'STL 기술위원회' 김해서 개최","so":"전자신문","tm":"11/11 11:05","c":1,"r":"kr","u":"https://www.etnews.com/20261111000020","p":1794362700,"a":1794363006,"su":"한국전기연구원(KERI·원장 강상희)이 11일부터 사흘간 일정으로 경남 김해 롯데호텔앤리조트에서 '제73차 세계단락시험협의체(STL) 기술위원회 회의'를 개최한다. STL은 글로벌 고전압 전력기기 시험기관이 참여하는 최고 권위의 국제 협력체다. 발전소에서 만들어진 전기가 가정과 산업 현장으로 안전하게 공급되려면 수많은 전력기기를 거치는데 이 기기들이 낙뢰 등 극한의 환경을 고장 없이 견뎌내는지 평가하는 엄격한 국제 기준을 STL에서 다룬다."},{"s":"KERI, 세계 전력기기 시험기관 11곳과 국제표준 논의","so":"데일리안","tm":"11/11 11:00","c":1,"r":"kr","u":"https://www.dailian.co.kr/news/view/1713407/KERI-%EC%84%B8%EA%B3%84-%EC%A0%84%EB%A0%A5%EA%B8%B0%EA%B8%B0-%EC%8B%9C%ED%97%98%EA%B8%B0%EA%B4%80-11-2026","p":1794362400,"a":1794377798,"su":"세계 주요 전력기기 시험기관 전문가들이 경남 김해에 모여 고전압 전력기기 시험기술과 국제표준 발전 방향을 논의한다.한국전기연구원(KERI)은 오는 13일까지 경남 김해 롯데호텔앤리조트에서 ‘제73차 세계단락시험협의체 기술위원회(STL TC) 회의’를 개최한다고 11일 밝혔다.세계단락시험협의체(STL)는 고전압
