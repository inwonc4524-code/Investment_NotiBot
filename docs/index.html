建：巩固电化学储能技术与制造优势，拓展多元化储能技术","su":"푸젠성 인민정부는 최근 '푸젠성 '15차 5개년 계획' 에너지 개발 계획을 발표했습니다. 에너지 분야의 핵심 기술을 육성 및 개발하기 위해 제안되었습니다. 3세대 원자력 기술을 최적화하고 4세대 원자력을 개발 및 실증하며 원자력의 포괄적 이용을 확대합니다. 고효율 해상 풍력 발전 장치, 새로운 기반, 유연한 DC 송전과 같은 기술에 대한 연구를 진행합니다. 신에너지의 정확한 예측, 대규모 전력망의 안전하고 안정적인 운영을 위한 적극적 지원, 전기화학적 에너지 저장 기술 및 제조 장점을 통합하고 다양한 에너지 저장 기술을 확대합니다. 해양 에너지 및 지열 에너지 발전 기술을 탐구하고 석탄 발전+탄소 포집, 활용 및 저장(BECCS) 등 탄소 배출 저감 기술을 마련하고 생태학적 흡수원 강화 기술을 탐구합니다."},{"s":"테스HD---축전지 EPC의 매출계상이 2Q 이후 본격화","so":"株探","tm":"11/17 09:39","c":1,"r":"jp","u":"https://s.kabutan.jp/news/n202611170477/","p":1794875980,"a":1794885865,"t":"テスＨＤ---蓄電池EPCの売上計上が2Q以降本格化へ 通期業績予想は据え置き、豊富なパイプラインの受注転換を目指す","su":"테스HD---축전지 EPC의 매출(물건을 판 돈 전체)계상이 2Q 이후 본격화에 통기 실적(회사가 번 돈 성적표) 예상은 거두고, 풍부한 파이프라인의 수주 전환을 목표로 한다 테스 홀딩스 <5074>는 11월 13일, 2027년 6월기 1분기(2026년 7월-9월). 매출액이 전년 동기 대비 6.6% 감소한 118.76억엔, 영업손실이 0.98억엔(전년 동기는 9.95억엔의 이익), 경상손실이 5.52억엔(동 5.77억엔의 이익), 모회사 주주에 귀속하는 분기 순손실이 5.65억엔(동 0.25억엔)."},{"s":"Stem과 Copec, 라틴 아메리카 전역의 에너지 저장 및 지능형 에너지 관리 발전을 위해 파트너십 확대 - 회사 발표 - FT.com","so":"Financial Times","tm":"11/17 06:12","c":1,"r":"world","u":"https://markets.ft.com/data/announce/detail?dockey=600-202611161612BIZWIRE_USPRX____20261116_BW847996-1","p":1794863520,"a":1794869041,"t":"Stem and Copec Expand Partnership to Advance Energy Storage and Intelligent Energy Management Across Latin America – Company Announcement - FT.com"},{"s":"로손 점포에서 재에너지, 32점에서 융통 축전지 사용 수급 조정","so":"日本経済新聞","tm":"11/17 05:00","c":1,"r":"jp","u":"https://www.nikkei.com/prime/gx/article/DGXZQOUC305FT0Q6A930C2000000","p":1794859200,"a":1794869039,"t":"ローソン店舗で再エネ、32店で融通 蓄電池使い需給調整","su":"로손이 설치하는 수직 양면 태양광 로손은 점포에 설치한 태양광 패널에서 발전한 재생 가능 에너지 유래의 전력을 점포를 넘어 융통하는 대처를 연도 내에도 시작한다. KDDI의 기술을 활용하여 송전량 등을 원격제어하여 잉여전력을 다른 점포에 융통한다. 32 점포의 전력을 일체적으로 관리함으로써 효율적으로 재에너지를 활용하고 이산화탄소(CO2) 배출량의 삭감과 함께 전력계통의 조정력으로 활용한다. 26 점포에 태양광 패널과 축전지를 설치 군마현 내의 32 점포에서 전력"},{"s":"충칭│중국 본토 최초의 완전 자동화 배터리급 리튬금속 공장 준공 - 양안","so":"工商時報","tm":"11/17 03:00","c":1,"r":"tw","u":"https://www.ctee.com.tw/news/20261117700034-430805","p":1794852000,"a":1794874155,"t":"重慶│陸首個全自動電池級金屬鋰工廠完工- 兩岸","su":"중국 본토 최초의 완전 자동화된 배터리급 리튬 금속 공장이 12일 충칭시 퉁량구에 공식적으로 완공되었습니다. 리튬 배터리 거대 기업인 Tianqi Lithium이 소유한 이 공장은 60kA의 고효율 및 에너지 절약형 금속 리튬 전기분해 장비를 구축했으며, 총 생산 능력을 연간 1,600톤으로 늘릴 것으로 예상됩니다. Tianqi Lithium은 전기 자동차, 전자 제품, 신에너지 저장 장치 등을 다루는 세계 최대의 리튬 배터리 생산 대기업 중 하나입니다. 조사 회사인 Farmonaut는 Tianqi Lithium의 글로벌 시장 점유율이 2026년 약 15.3%가 될 것으로 추정합니다."},{"s":"청두│광전자 기술이 우주를 공격하다! 중국 본토 산업 회의는 페로브스카이트와 새로운 에너지 저장에 중점을 둡니다.","so":"工商時報","tm":"11/17 03:00","c":1,"r":"tw","u":"https://www.ctee.com.tw/news/20261117700030-430805","p":1794852000,"a":1794869037,"t":"成都│光電技術搶攻太空！陸產業大會聚焦鈣鈦礦、新型儲能- 兩岸","su":"제9회 국제 광전자공학 및 에너지 저장 산업 컨퍼런스가 17일부터 20일까지 청두에서 우주 태양광 발전, 페로브스카이트, 신에너지 저장 등 첨단 기술을 중심으로 개최됩니다. 주최측은 올해 행사에는 유럽, 미국, 동남아시아, 중동 등 전 세계 80개 이상의 국가 및 지역에서 600명 이상의 해외 바이어가 참여할 것으로 예상하고, 본토 광스토리지 기업을 홍보해 해외 사업 기회를 확대할 것이라고 밝혔다."},{"s":"DoGo의 그리드포밍형 축전시스템(ESS)이 인도네시아 낙도의 2,000가구에 24시간 전력을 공급","so":"時事ドットコム","tm":"11/17 00:40","c":1,"r":"jp","u":"https://www.jiji.com/jc/article?k=rmkKOUkZ&g=prn","p":1794843600,"a":1794869040,"t":"DoGoのグリッドフォーミング型蓄電システム（ESS）が、インドネシアの離島の2,000世帯に24時間電力を供給","su":"자카르타, 인도네시아, 2026년 11월 16일 /PRNewswire/--DoGoPower의 스마트 그리드 포밍형 축전 시스템(ESS(전기를 저장해 두는 큰 배터리))과 에너지 관리 시스템(EMS)이 인도네시아 남부 해안의 낙도, 파게른간 케틸섬(P섬)에서 정식으로 가동을 시작했습니다. 1MW의 태양광 발전과 2MW/4MWh의 ESS에 의한 본 프로젝트는 오프 그리드의 지역사회에 안정적이고 신뢰성 높은 전력을 공급하고 동남아시아 전역의 섬도부에서 마이크로 그리드를 전개하기 위한 재현 가능한 모델이 됩니다."},{"s":"왜 \"5kWh의 전력\"이 발코니 에너지 저장 장치 C 위치에 있습니까?","so":"36氪出海","tm":"11/16 23:36","c":1,"r":"cn","u":"https://letschuhai.com/4c218db6","p":1794839804,"a":1794840871,"t":"“5度电”缘何坐上阳台储能C位？","su":"2년 전만 해도 발코니 에너지 저장 장치의 라벨은 여전히 \"1.6kWh의 전기, 손잡이 포함\"이었습니다. 2026년에는 트랙의 주 용량이 3배로 증가합니다. 첨단산업에너지저장연구소(GGII) 자료에 따르면 발코니 광스토리지는 2026년 성장률 100%를 넘어 올해 유럽에서 가장 뜨거운 트랙이 될 것으로 예상된다. 독일에서는 2026년 3월 현재 발코니 태양광 발전 누적 설치 수가 200만 대를 초과했으며, 1분기에 새로 설치된 그리드 수가 전년 대비 140% 증가했습니다. 네덜란드에서는 2분기에 37,600개 이상의 발코니 에너지 저장 배터리가 판매되어 전 분기보다 거의 두 배, 전년 동기 대비 47배 증가했습니다. 한 분기의 판매량이 지난 3년의 총 재고를 초과했습니다. 모든 용량 부문에서 5kWh의 전력(5kWh)은 “아무도 돌아다닐 수 없는” 수치가 되어가고 있습니다."},{"s":"드론 분야의 선두 기업은 에너지 저장 장치로 전환한 후에도 배터리를 계속 만들까요? DJI가 '배터리 회사'를 등록했습니다.","so":"ThePaper.cn","tm":"11/16 22:30","c":1,"r":"cn","u":"https://www.thepaper.cn/newsDetail_forward_34490432","p":1794835848,"a":1794838071,"t":"无人机龙头切入储能后还要造电芯？大疆注册了一家“电池公司”","su":"시장의 주목을 받은 일부 제품의 가격 인상 발표에 이어, 최근 드론 분야 선두주자인 DJI의 또 다른 행보가 리튬 배터리 업계에서 논의를 촉발시켰다. 산업 및 상업 정보에 따르면 Shenzhen DJI Yaowo New Energy Technology Co., Ltd.(이하 \"Yaowo New Energy\")는 일본에서 운영됩니다."},{"s":"삼성SDI, 2029년부터 3년만에 16GWh 에너지저장전지 미국 수주","so":"鉅亨網","tm":"11/16 22:30","c":1,"r":"tw","u":"https://news.cnyes.com/news/id/6664290","p":1794835833,"a":1794838074,"t":"三星SDI拿下美國16GWh儲能電池訂單2029年起分三年交貨","su":"삼성SDI가 2029년부터 3년 만에 미국에서 16GWh 에너지저장전지를 수주했다. 유애널라이즈(Uanalyze) 2026년 11월 16일(Uanalyze/산업데이터센터(컴퓨터 수만 대를 모아 둔 건물) 리포트) ⸺ 삼성SDI는 미국 에너지저장장치(전기를 저장해 두는 큰 배터리) 개발업체 주피터파워(Jupiter Power)와 16GWh급 리튬인산철(LFP) 배터리 공급계약을 체결했는데, 이는 2029년부터 2031년까지 납품 예정이다. 미국에서 개발된 Jupiter Power의 대규모 에너지 저장 프로젝트에 사용됩니다. 양 당사자가 체결한 이전 계약을 포함하여 Jupiter Power는 삼성SDI로부터 약 27GWh의 배터리 용량을 구매했습니다. 이번 주문은 미국 인디애나주에 위치한 삼성SDI 스타플러스 에너지 공장에서 생산될 예정이다. 이 공장은 최근 LFP 배터리 대량 생산을 시작했으며, 이번 주문으로 향후 몇 년간 공장 출하가 뒷받침될 것입니다."},{"s":"세계 최대의 납탄소 에너지 저장 발전소가 배터리 품질 소송에 연루됐고, SPIC 회사들은 1억 위안 이상의 배상금을 청구했습니다.","so":"ThePaper.cn","tm":"11/16 22:27","c":1,"r":"cn","u":"https://www.thepaper.cn/newsDetail_forward_34490396","p":1794835656,"a":1794838072,"t":"全球最大铅碳储能电站陷电池质量诉讼，国家电投旗下企业索赔超1亿元","su":"불과 3년 전에 가동을 시작한 세계 최대의 납탄소 에너지 저장 발전소에서 소송으로 인해 배터리 품질 문제가 제기되었습니다. Jingwei Co., Ltd.(301390.SZ)는 11월 13일 저녁 자사의 전체 지분(회사를 나눠 가진 몫)을 소유한 자회사 Hangzhou Hongsheng Electric Power Design Consulting Co., Ltd.(이하"},{"s":"COP31은 자금 문제에 중점을 둡니다. 향후 5년간 새로운 에너지 저장 솔루션 출시 | 탄소 중립 주간 보고서","so":"21财经","tm":"11/16 21:30","c":1,"r":"cn","u":"https://www.21jingji.com/article/20261116/herald/e198303f2eb48ae188bd2b8ebe707a4c.html","p":1794832200,"a":1794834730,"t":"COP31聚焦资金问题；未来五年新型储能方案印发｜碳中和周报","su":"21세기 비즈니스 헤럴드 기자 레이예(Lei Ye)와 리더상위(Li Deshangyu)가 베이징에서 보도했습니다. Carbon Neutral Weekly는 탄소 중립 정책, 지역 역학, 기업 관행 등을 포함한 \"이중 탄소\" 분야의 최신 최첨단 개발에 중점을 둡니다. 매주 탄소 중립 분야의 주요 이벤트를 선택하고 논평하여 시의적절하고 포괄적인 탄소 중립 정보 플랫폼을 구축할 것입니다. 1. 탄소 중립 정책 1. COP31이 진행되는 동안 글로벌 기후 거버넌스는 이행을 향해 나아가고 있습니다. 지난 11월 11일 터키 안탈리아에서 열린 제31차 유엔기후변화협약 당사국총회(COP31)가 실질적인 협의 단계에 돌입했다. 올해는 파리협정 이행을 위한 새로운 10년이 시작되는 해이며, 글로벌 기후 거버넌스는 약속에서 이행까지 중요한 전환점에 있습니다. 회의 의장국인 터키는 '대화, 합의, 행동'이라는 회의 슬로건을 제시하고, 다자간 협상 과정의 보완책으로 '전력화', '폐기물 제로' 등 자발적 행동 계획을 내놨다."},{"s":"Xitel, GE 버노바 및 SK On과 손잡고 AI 에너지 저장 공급망 구축","so":"DIGITIMES","tm":"11/16 19:51","c":1,"r":"tw","u":"https://www.digitimes.com.tw/tech/dt/n/shwnws.asp?id=0000774973_XQOL74UD63QJ5K47MIWB7&cf=A21","p":1794826260,"a":1794830445,"t":"熙特爾攜手GE Vernova、SK On 布局AI儲能供應鏈","su":"글로벌 AI 데이터센터(컴퓨터 수만 대를 모아 둔 건물) 구축이 가속화되면서 안정성이 높은 전력공급과 대규모 에너지 저장 인프라에 대한 수요가 급증하고 있으며, 초국적 에너지 공급망(부품·재료가 오가는 연결망) 재편이 업계의 화두가 되고 있다. 대만의 에너지 저장 시스템 통합업체인 자이텔(Xitel)이 미국의 주요 에너지 장비 제조사와 협력했다고 16일 밝혔다."},{"s":"SPIC는 설계연구소에 1억 청구서를 발행했고, 이제 에너지 저장 EPC의 연대책임과 여러 책임을 다시 계산해야 할 때다.","so":"36氪","tm":"11/16 18:35","c":1,"r":"cn","u":"https://m.36kr.com/p/4072626513811329","p":1794821700,"a":1794898859,"t":"国家电投开出1亿索赔单砸向设计院，储能EPC的连带责任该重新算账了"},{"s":"Kaizhi Green Energy 11/20 Dengxing 캐비닛, 태양광 EPC/에너지 저장/마이크로그리드 사업 기회 확보 - 뉴스","so":"MoneyDJ","tm":"11/16 16:54","c":1,"r":"tw","u":"https://www.moneydj.com/z/DJA/News/DJANewsDetail_39D80C3D-4EDE-4421-A806-83787344509E.djhtm","p":1794815640,"a":1794830446,"t":"凱智綠能11/20登興櫃搶太陽能EPC/儲能/微電網商機- 新聞","su":"MoneyDJ News 2026-11-16 15:54:13 게시자: Wan Huiwen 녹색 에너지 시스템 통합업체 Kaizhi Green Energy(7961)가 11월 20일에 시장에 상장(주식시장에 처음 들어오는 것)됩니다. 주요 사업은 태양광 발전 엔지니어링 턴키(EPC), 스마트 에너지 저장 및 에너지 관리 시스템을 포함합니다. Li Juncheng 회장(사진)은 최근 몇 년 동안 태양광 EPC 사업을 지속적으로 확장하는 것 외에도 스마트 마이크로그리드, AI 유지 관리 및 분산 에너지 애플리케이션을 적극적으로 배포했다고 말했습니다. 앞으로는 국내외 기업과의 협력을 확대해 운영 규모의 성장을 촉진할 예정이다. 하반기는 태양광 프로젝트 건설이 가속화되고 인지도가 가속화되는 시기이기 때문에 상반기와 하반기 수익 배분은 4:6으로 추산되며, 4분기에 집중될 것으로 보인다. 법인은 Kaizhi의 연간 주당 수익이 NT$7~8 정도라고 추정합니다."},{"s":"CESC2026 제4차 에너지저장 컨퍼런스가 닝샤에서 개최되었습니다. 학계 및 전문가들이 '15차 5개년 계획' 동안 에너지저장장치의 고품질 개발에 대해 논의했습니다.","so":"Jiemian.com","tm":"11/16 16:38","c":1,"r":"cn","u":"https://www.jiemian.com/article/15337079.html","p":1794814695,"a":1794830441,"t":"CESC2026 第四届储能大会在宁举行 院士专家共议“十五五”储能高质量发展","su":"11월 4일, CESC2026의 네 번째 에너지 저장 컨퍼런스가 난징 국제 엑스포 센터에서 열렸습니다. 약 600명이 참석했으며 남동대학교의 젊은 주임교수이자 박사 지도교수인 Zhu Zhi가 주최했습니다. 이번 컨퍼런스의 주제는 '기술적 혁신·생태적 시너지'였습니다. 정부 부처, 대학 과학 연구 기관, 기업, 산업 협회 및 금융 기관의 대표자들은 \"15차 5개년 계획\" 동안 에너지 저장 개발 경로에 대해 논의했습니다. 규모 확장에서 가치 창출로의 전환이 컨퍼런스 전체의 주요 주제가 되었습니다."}]},{"name":"🏭 AI 전력","note":"보유: ACE 코리아AI전력TOP10","breaking":false,"items":[{"s":"두산에너빌리티, 연구 현장 안전 최우선…우수연구실 인증 결실","so":"파이낸셜포스트","tm":"11/19 15:07","c":10,"r":"kr","u":"https://www.financialpost.co.kr/news/articleView.html?idxno=301965","p":1795068433,"a":1795071815,"su":"두산에너빌리티는 기술혁신연구원 산하 연구실 3곳이 과학기술정보통신부 주관 '안전관리 우수연구실' 신규 인증을 획득했다고 19일 밝혔다. 두산에너빌리티는 이날 청원"},{"s":"Formosa Plastics New Intelligence는 Liqi와 손을 잡고 전원 공급 장치 탄력성을 강화하고 대만 전역의 마이크로그리드 레이아웃 및 구축을 확장합니다.","so":"鉅亨網","tm":"11/18 12:20","c":9,"r":"tw","u":"https://m.cnyes.com/news/id/6665994","p":1794972041,"a":1794972204,"t":"台塑新智能攜手立碁強化供電韌性 擴大全台微電網布局建置","su":"Formosa Plastics New Intelligence와 Liqi Electronics는 대만의 마이크로그리드 건설을 공동으로 촉진하고 지역 전력 공급 탄력성을 강화하기 위한 협력 계약을 체결했습니다.\nFormosa Plastics New Intelligence의 올해 재해 방지 마이크로그리드는 9개 캠퍼스와 공공 시설을 대상으로 하며 100kW/219kWh 에너지 저장 장치를 도입했으며 모두 거의 완료되었습니다.\n디젤 소비를 줄이기 위해 100kW/109kWh 에너지 저장 장치, 160.23kW 태양광 발전 및 500kW 디젤 엔진을 사용하는 Taiping Island 마이크로그리드가 출시되었습니다."},{"s":"효성중공업, 영등포 문래동3가 '해링턴 플레이스 문래' 20일 견본주택 개관","so":"뉴스핌","tm":"11/17 10:35","c":7,"r":"kr","u":"https://www.newspim.com/news/view/20261117000478","p":1794879300,"a":1794885899,"su":"[서울=뉴스핌] 오경진 기자 = 효성중공업이 서울특별시 영등포구 문래동3가 일원에 시공하는 공동주택 단지 &apos;해링턴 플레이스 문래&apos;가 오는 20일 견본주택을 개관하고 일반분양 공고에 따른 입주자 모집 절차를 진행한다.[사진=해링턴 플레이스 문래"},{"s":"가오슝 동광초등학교 지하 변압기에서 연기가 났습니다. 문이 열리기 전에 경보음이 울려 교사와 학생들이 교실에 들어갈 수 없게 되었습니다. ,"t":"彭啓明：台灣減碳就是全球 AI 減碳；彭双浪：算力中心不缺電，缺的是全時段無碳電力"},{"s":"변압기 오작동으로 인해 North Point 전기 조명 센터에서 화재가 발생했습니다. 홍콩전기 직원 1명이 부상을 입어 의식을 갖고 병원으로 후송됐다.","so":"TVB","tm":"11/19 00:53","c":1,"r":"hk","u":"https://news.tvb.com/en/1207138-%E5%8C%97%E8%A7%92%E9%9B%BB%E7%87%88%E4%B8%AD%E5%BF%83%E6%9C%89%E8%AE%8A%E5%A3%93%E5%99%A8%E6%95%85%E9%9A%9C%E8%B5%B7%E7%81%AB%E4%B8%80%E5%90%8D%E6%B8%AF%E7%87%88%E5%93%A1%E5%B7%A5%E8%A2%AB%E7%87%92%E5%82%B7%E6%B8%85%E9%86%92%E9%80%81%E9%99%A2","p":1795017180,"a":1795042010,"t":"北角電燈中心有變壓器故障起火 一名港燈員工被燒傷清醒送院","su":"노스 포인트 전기 조명 센터(North Point Electric Lighting Centre)에서 변압기가 오작동하여 화재가 발생했습니다. 홍콩전기 직원 1명이 화상을 입어 의식을 잃은 채 병원으로 이송됐다. 사건 발생 후 경찰은 경찰을 현장에 파견해 조사에 나섰고, HK전기도 직원을 파견해 상황을 파악했다. 경찰은 오후 5시쯤 신고를 접수했다. 시티가든로드 전기조명센터 변압기실에서 화재가 발생했다는 소식입니다. 소방대원들이 현장에 도착해 불을 진압했고, 200여명이 스스로 대피했다. 28세 남성 직원은 손과 얼굴에 화상을 입어 의식이 있는 상태로 병원으로 이송돼 치료를 받았다. 그는 변압기가 갑자기 폭발하자 도구를 가지러 변압기실에 간 것으로 전해졌다. ..."},{"s":"Huarong, 전력망 업그레이드 사업 기회 포착","so":"經濟日報","tm":"11/19 00:19","c":1,"r":"tw","u":"https://money.udn.com/money/story/5710/9887322?from=edn_related_storybottom","p":1795015198,"a":1795042009,"t":"華榮搶電網升級商機","su":"화용(1608)은 어제(18일) 기자회견을 열어 대전력의 전력망 강화 계획, 전력 인프라 수요, 높은 구리 가격 등의 혜택을 받아 꾸준한 운영 성장을 견인했다. 이 중 초고압 전력케이블 누적 계약금액은 118억1900만 위안에 달했다. 2027년 생산 일정은 일단 완료됐다. 현재 검토 및 입찰을 위해 3건의 사례가 더 제출되었으며 그들은 계속해서 Taipower의 전력망 업그레이드를 위한 사업 기회를 포착하고 있습니다."},{"s":"FingerMotion, 극한 기후에서 작동하도록 설계된 모듈형 데이터 센터 개념 공개","so":"Data Center Dynamics","tm":"11/18 22:39","c":1,"r":"us","u":"https://www.datacenterdynamics.com/en/news/fingermotion-unveils-modular-data-center-concept-designed-to-operate-in-extreme-climates/","p":1795009179,"a":1795058077,"t":"FingerMotion unveils modular data center concept designed to operate in extreme climates","su":"싱가포르에 본사를 둔 기술 회사 FingerMotion은 극한 기후에서 작동하도록 설계된 새로운 모듈형 AI 데이터 센터 개념을 공개했습니다. 이 개념은 캘거리에 본사를 둔 비하인드 발전 및 모듈형 데이터 센터의 개발자이자 운영자인 BlueFlare에 의해 설계되고 있습니다."},{"s":"새로운 전력망, 무엇이 달라졌나?","so":"21财经","tm":"11/18 22:21","c":1,"r":"cn","u":"https://www.21jingji.com/article/20261118/herald/aa6a92579b3fa0400d42a9d940b3c1c8.html","p":1795008100,"a":1795042007,"t":"新型电网，新在哪？","su":"초원 깊은 곳에 있는 유르트, 사막 끝자락에 있는 마을, 깊은 산속의 집들… 한때 전력망에서 멀리 떨어져 있던 거리에 전깃불이 차례로 켜지며 중국 전력 발전의 생생한 각주가 됩니다. 현재 중국은 세계 최대 규모의 전력 공급 시스템을 구축했다. 올해 9월까지 사회 전체의 전력 소비량은 8조 734억kWh에 달해 전년 대비 3.9% 증가했다. 동시에, 중국의 전력 시스템도 일련의 새로운 변화를 겪고 있습니다. 발전 측면에서 신에너지는 주변부에서 주력으로 이동했으며, 중국 전력 구조에서 신에너지의 지배적 위치가 점점 더 두드러지고 있습니다. 2026년 9월 말 현재 중국의 풍력 및 태양광 발전 누적 설치 용량은 20억 1천만 킬로와트에 달했다. 기존의 안정적이고 제어 가능한 화력에 비해 새로운 에너지는 \"불안정\"하며 전력망에 변동성(값이 크게 출렁이는 정도)과 불확실성을 가져옵니다."},{"s":"히타치 에너지, 태국에서 27년 초부터 변압기 증산 AI 수요 확대에 대응","so":"日本経済新聞","tm":"11/18 21:40","c":1,"r":"jp","u":"https://www.nikkei.com/article/DGXZQOGS128V10S6A111C2000000/","p":1795005600,"a":1795006785,"t":"日立エナジー、タイで27年初めから変圧器増産 AI需要拡大に対応","su":"[방콕=이와모토 케이고] 송배전 설비 대기업의 히타치 에너지는 18일 태국 중부 사무트프라칸현의 변압기 공장에서 2027년 초부터 증산 체제에 들어갈 방침을 밝혔다. 아시아에서 인공지능(AI)의 보급에 따른 전력수요 확대에 대응한다. 변압기 비즈니스 유닛의 최고 경영 책임자(CEO)를 맡은 브루노 멜레스 씨가 18일 방콕에서 기자 회견을 열었다. 이 회사는 세계에서 총액 90억 달러(약 1조4000억엔)의 투자 계획을 진행"},{"s":"Shi Zhenrong의 \"Smile Curve\"가 새로운 왕으로 진화하고 대만은 컴퓨팅 파워에서 AI 스마트 공동 창작으로 이동합니다.","so":"UDN","tm":"11/18 17:16","c":1,"r":"tw","u":"https://udn.com/news/story/7240/9886899","p":1794989769,"a":1795071823,"t":"施振榮「微笑曲線」進化新王道 台灣從算力走向AI智慧共創","su":"최근 몇 년 동안 글로벌 정치, 경제 상황이 급격하게 변화하고 글로벌 공급망(부품·재료가 오가는 연결망)도 과거의 '효율성 우선'에서 '안보 및 탄력성 우선'으로 전환되어 모든 국가가 직면한 새로운 과제가 되었습니다. 그러나 글로벌 첨단기술 공급망의 핵심 위치와 지정학의 최전선에 있는 대만은 지난 몇 년간의 변화 속에서 소외되었을 뿐만 아니라 국제적인 관심을 끌 만큼 경제적 회복력과 번영을 보여주었습니다. 올해 APEC 경제 리더 대표이자 Acer(2353) 창립자인 Shi Zhenrong은 \"Smile Curve\"에서 \"New King's Way\"까지 비즈니스 철학을 제안하고 계속 발전시키고 있습니다. 기업 변화에서 파생된 이러한 일련의 경영 지혜는 글로벌 변화 속에서도 대만의 지속적인 성장을 뒷받침하는 대만의 경제적 성과와 발전 사고를 반영합니다."},{"s":"미쓰비시 중공과 사쿠라 인터넷, 국산 AI 데이터 센터에서 협업 검토","so":"日本経済新聞","tm":"11/18 13:02","c":1,"r":"jp","u":"https://www.nikkei.com/article/DGXZQOUC1834Z0Y6A111C2000000/","p":1794974563,"a":1795007796,"t":"三菱重工とさくらインターネット、国産AIデータセンターで協業検討","su":"미쓰비시중공업과 사쿠라 인터넷은 18일 국산 인공지능(AI) 데이터센터(컴퓨터 수만 대를 모아 둔 건물) 등 디지털 인프라 기반 구축으로 협업을 검토한다고 발표했다. 이렇게 전략적 제휴를 향한 각서를 나누었다. 미쓰비시 중공은 냉각이나 전원, 제어 기술을, 사쿠라 인터넷은 데이터 센터와 클라우드의 운영 노하우를 가져온다. 생성 AI의 보급으로 데이터 센터는 중요한 사회 인프라가 되는 한편, 일본 국내의 AI 처리의 대부분은 해외 사업자의 클라우드상에서 움직인다"},{"s":"AI가 똑똑할수록 전기요금은 더 비싸진다? 구글은 50만 가구의 전력을 소비하는 데이터 센터를 구축합니다. 미국 소도시 주민들, 치솟는 전기요금 걱정","so":"TVBS新聞網","tm":"11/18 12:00","c":1,"r":"tw","u":"https://news.tvbs.com.tw/tech/4052246","p":1794970800,"a":1795003497,"t":"AI越聰明電費越貴？Google蓋資料中心吃掉50萬戶電力 美小鎮居民憂電費飆漲","su":"인공지능은 점점 똑똑해지고 있지만 전기요금은 저렴해지지 않습니다. 거대 기술기업 구글이 인구 4000명 남짓한 미국 미네소타주 작은 마을에 대규모 데이터센터(컴퓨터 수만 대를 모아 둔 건물)를 건설할 계획이다. 이 엄청난 전력 소비량은 50만 가구 전체의 전력 소비량과 맞먹는 것으로 추산됩니다. 전기에 굶주린 거대한 괴물들이 도래하면서 지역 주민들은 이로 인해 전기요금이 오르고, 이는 일상생활에도 영향을 미칠 것이라고 우려하고 있다. 업계 관계자들이 전력망에 투자하고, 재생 가능 에너지를 개발하고, 피크 시간 동안 부하 차단에 기꺼이 협력하겠다고 약속했지만 AI 컴퓨팅 성능을 위한 경쟁은 더욱 심화되었습니다. 이에 따른 막대한 전력 비용을 누가 부담해야 하는가가 지역 내에서 치열한 논쟁을 불러일으켰다."},{"s":"백본부터 터미널까지 Taipower는 전반적인 그리드 탄력성을 종합적으로 구축합니다.","so":"自由時報","tm":"11/18 10:00","c":1,"r":"tw","u":"https://market.ltn.com.tw/article/19080","p":1794963600,"a":1794972206,"t":"從主幹到末梢 台電全面建構整體電網韌性","su":"AI 기술로 인한 막대한 전력 수요와 부하 밀도의 고도로 집중된 변화에 직면하여 Taipower는 전력망의 탄력성을 적극적으로 강화했습니다. 진정으로 강력한 전력망을 구축하려면 초고압 백본의 안정성과 더불어 말초신경과 마이크로 유닛이 충분한 재해저항성과 독자적인 복구능력을 갖추는 것도 중요하다."},{"s":"추론 컴퓨팅 능력은 끝이 없는 강입니다. Silicon 기반 Flow의 창립자 Yuan Jinhui: AI 인프라가 \"적절한 시기\"를 안내하고 있습니다.","so":"中证网","tm":"11/18 09:29","c":1,"r":"cn","u":"https://jnzstatic.cs.com.cn/zzb/htmlInfo/e86bef6551894fd7be3a23deb07daf3d.html","p":1794961740,"a":1794972203,"t":"推理算力是奔涌不息的河流 硅基流动创始人袁进辉：AI基础设施迎来“生逢其时” 窗口","su":"추론 컴퓨팅 능력은 끝이 없는 강입니다. Silicon-based Flow: AI 인프라의 창립자 Yuan Jinhui는 \"기회\"의 창을 열었습니다. \"대형 모델 훈련에 필요한 컴퓨팅 파워가 수영장과 같다면, 모델 추론 서비스에 필요한 컴퓨팅 파워는 강과 같습니다. 명확한 '경계'가 없고 끝없이 돌진하고 있습니다.\" Beijing Silicon Mobile Technology Co., Ltd.의 창립자 겸 CEO인 Yuan Jinhui는 China Securities Journal의 기자와 단독 인터뷰에서 현재 상황을 다음과 같이 설명했습니다. 지능형 에이전트의 대규모 적용이 컴퓨팅 전력 수요의 성장 모멘텀(값이 움직이는 기세)을 변화시키고 있습니다. 모델이 일상적으로 사용되면 토큰(단어 요소)은 날마다 소비되며 추론 컴퓨팅 성능에 대한 수요는 멈출 수 없습니다. 훈련에 사용되는 컴퓨팅 성능은 단계적으로 이루어집니다. 그는 추론 컴퓨팅 파워에 대한 수요 공급 곡선은 여전히 가파르며 “앞으로 2~3년 동안 공급 부족 상황이 지속될 가능성이 높다”고 말했다."},{"s":"Big US Grid는 데이터 센터 연결 속도를 높이기 위해 정밀 검사를 제안합니다.","so":"Bloomberg.com","tm":"11/18 04:11","c":1,"r":"us","u":"https://www.bloomberg.com/news/articles/2026-11-17/pjm-proposes-grid-overhaul-to-speed-up-data-center-connections","p":1794942716,"a":1794955487,"t":"Big US Grid Proposes Overhaul to Speed Data Center Hook Ups"},{"s":"Vertiv의 빅 AI 데이터 센터 성능 혁신으로 현재 재고를 절약할 수 없는 이유","so":"Barron's","tm":"11/18 03:08","c":1,"r":"us","u":"https://www.barrons.com/articles/vertiv-new-power-system-ai-data-center-stock-ca8a28c7","p":1794938880,"a":1794955488,"t":"Why Vertiv’s Big AI Data Center Power Breakthrough Couldn’t Save the Stock Today"},{"s":"미국 전력회사의 신속한 소형 원자로 승인은 개발자에게 교훈을 제공합니다","so":"Reuters","tm":"11/18 01:45","c":1,"r":"us","u":"https://www.reuters.com/business/energy/rapid-small-reactor-approval-by-us-utility-offers-lessons-developers--reeii-2026-11-17/","p":1794933936,"a":1794957026,"t":"Rapid small reactor approval by US utility offers lessons for developers"},{"s":"영국 서식스(Sussex)에 100MW 데이터 센터 계획","so":"Data Center Dynamics","tm":"11/18 01:25","c":1,"r":"us","u":"https://www.datacenterdynamics.com/en/news/100mw-data-center-planned-in-sussex-uk/","p":1794932741,"a":1794955488,"t":"100MW data center planned in Sussex, UK","su":"한 개발자가 영국 브라이튼 외곽에 100MW 규모의 데이터 센터를 계획하고 있습니다. 한편, 영국에 본사를 둔 재생 에너지 개발자는 Bedfordshire에 4개 건물 캠퍼스를 계획하고 있습니다. Sussex Meridian One에 예정된 100MW 프로젝트는 Hickstead의 Northlands Enterprise Park에 있는 단계별 데이터 센터 캠퍼스에 대한 제안입니다."},{"s":"데이터 센터 빌더는 미국 최대 그리드의 규칙에 대한 명확성을 추구합니다.","so":"Reuters","tm":"11/18 01:16","c":1,"r":"us","u":"https://www.reuters.com/business/energy/data-center-builders-seek-clarity-rules-largest-us-grid--reeii-2026-11-17/","p":1794932173,"a":1794972201,"t":"Data center builders seek clarity on rules in largest US grid"},{"s":"데이터센터 채권, 영국 HSBC가 손실각오의 대폭할인으로 매각","so":"日本経済新聞","tm":"11/18 00:00","c":1,"r":"jp","u":"https://www.nikkei.com/article/DGXZQOCD17C2H0X11C26A1000000/","p":1794927631,"a":1795007796,"t":"データセンター債権、英HSBCが損失覚悟の大幅割引で売却","su":"[런던=야마시타 아키라]영은 HSBC 홀딩스가 미국 오라클이 주도하는 인공지능(AI)용 데이터센터(컴퓨터 수만 대를 모아 둔 건물)의 대출채권(나라나 회사에 돈 빌려준 증서) 약 3억 달러(분)를 할인 가격으로 매각한 것으로 17일 알려졌다. 사업 지연 위험에 대해 경계를 강화한 것으로 보인다. 미국 블룸버그 통신이 보도했다. 오라클이 미국 뉴멕시코주에서 계획 중인 데이터 센터를 둘러싸고는 총액 약 180억 달러의 대출이 실행되고 있다. HSBC는 이 대출에 참여"},{"s":"Giga Energy는 클라우드 제공업체와 10억 달러 규모의 텍사스 AI 데이터 센터 임대 계약을 체결했습니다.","so":"Reuters","tm":"11/17 23:08","c":1,"r":"us","u":"https://www.reuters.com/business/energy/giga-energy-signs-1-billion-lease-texas-ai-data-center-with-cloud-provider-2026-11-17/","p":1794924489,"a":1794955488,"t":"Giga Energy signs $1 billion lease for Texas AI data center with cloud provider"},{"s":"전력망 건설에 대한 수요가 공개되고 해외 시장 확장이 가속화되며 상하이 전력 장비 회사의 운영 및 개발에 많은 하이라이트가 있습니다.","so":"第一财经","tm":"11/17 22:10","c":1,"r":"cn","u":"https://www.yicai.com/news/103444147.html","p":1794921054,"a":1794921321,"t":"电网建设需求释放 海外市场拓展提速 沪市电力设备企业经营发展亮点纷呈","su":"올해 초부터 새로운 전력 시스템 건설의 심층적인 발전, 중국 국내 전력망 투자의 지속적인 발전, 글로벌 에너지 인프라 업그레이드로 인해 상하이 증권거래소에 상장(주식시장에 처음 들어오는 것)된 전력 장비 회사는 적극적으로 산업 발전 기회를 포착하고 송전 및 변전 장비, 스마트 그리드, 저탄소 에너지 및 전력 전자 분야에서 지속적으로 노력을 심화해 왔습니다. 산업 체인의 여러 선두 기업의 영업 실적(회사가 번 돈 성적표)은 꾸준히 성장했으며 일부 기업의 이익 성장률은 더욱 향상되었습니다. 동시에 해외 주문이 지속적으로 확대되고 핵심 기술 혁신의 변화가 가속화되고 있습니다. 전력 장비 회사는 중국 국내외 시장의 조화로운 발전과 전통적 우세 기업과 신흥 기업의 공동 성장이라는 긍정적인 추세를 보여줍니다. 전력망 투자는 지속적으로 발전하고 있으며 산업 체인 기업의 운영 품질과 효율성은 꾸준히 향상되었습니다. 중국의 국내 UHV 프로젝트 건설, 주요 배전망 업그레이드 및 새로운 전력 시스템 투자가 계속해서 발전하여 송전 및 변전 장비, 스마트 그리드 및 지원 산업을 위한 시장 공간을 제공하고 있습니다. 상하이 증권 거래소에 상장된 전력 장비 회사는 기술 축적과 산업 체인의 이점을 활용하여 시장 기회를 적극적으로 포착했으며 운영 성과의 하이라이트가 계속해서 등장했습니다."},{"s":"최대 전력 소비를 피함으로써 데이터 센터가 1년에 얼마나 많은 전기를 절약할 수 있습니까? 미국 전력망 비용 공유 논란 촉발","so":"鉅亨網","tm":"11/17 22:00","c":1,"r":"tw","u":"https://news.cnyes.com/news/id/6665447","p":1794920418,"a":1794927746,"t":"資料中心避開尖峰用電，一年可省多少電費？美國電網成本分攤引發爭議","su":"최대 전력 소비를 피함으로써 데이터 센터가 1년에 얼마나 많은 전기를 절약할 수 있습니까? 미국 전력망 비용 공유로 논란 촉발 Uanalyze 2026년 11월 17일(Uanalyze/산업 데이터 센터 보고서) ⸺ 미국의 일부 데이터 센터와 대규모 전력 사용자는 전력 수요가 가장 높은 기간 동안 전기 요금의 용량 또는 전송 비용을 줄이기 위해 전력 소비를 줄일 것입니다. 이 관행을 '피크 클리핑'이라고 하며 현행 규칙과 일치하지만 논란을 촉발하기도 합니다. 대규모 사용자의 과소 지불을 다른 사용자가 부담하게 될까요? 텍사스를 예로 들면, 일부 대규모 사용자의 연중 전송 요금은 여름철 4개월 동안 매회 최대 전력 소비량 15분을 기준으로 계산됩니다. 기업이 이 4개 기간 동안 전력 소비를 줄일 수 있다면 일년 내내 전송 요금을 줄일 수 있습니다."},{"s":"멕시코, 에너지 위기로 인해 AI 데이터 센터 붐을 놓칠 위험","so":"Bloomberg.com","tm":"11/17 22:00","c":1,"r":"us","u":"https://www.bloomberg.com/news/features/2026-11-17/mexico-is-missing-out-on-ai-data-center-boom-as-energy-crunch-bites","p":1794920406,"a":1794955488,"t":"Mexico Risks Missing Out on AI Data Center Boom as Energy Crunch Bites"},{"s":"X-Energy CEO J. Clay 역사적인 원자력 승인, 아마존 및 AI 전력 수요에 대해 매도","so":"CNBC","tm":"11/17 21:30","c":1,"r":"us","u":"https://news.google.com/rss/articles/CBMiwAFBVV95cUxOS2k2S2FGWFBPcUU3NzVfSGpjNWlSUFZXejFjN1lIMGlZMDdYX2h4TkR0WG9PRmJrTGNUUkI5SjJJSVBRaGE5V0ZpaXN0ZV9EMHJlQWJnTEVFMTZhd2FlVzZaeXQ3Z18wQ1VPLWNJMmF3UU5fWDRDR0pWUzBxeXdacTJVb3NQWmN6VU9JOW9IdDZCenBCdEFzVmlqTVdsNnFocGxibmxqcDFTbUhvYWxwenVGMm9LT05KNlc2a1FoVUo?oc=5","p":1794918601,"a":1794921319,"t":"X-Energy CEO J. Clay Sell on historic nuclear approval, Amazon and AI power demand"},{"s":"FOCUS 글로벌 뉴스/우크라이나 전력망에 불이 붙었습니다! 아일랜드 공장이 미사일 원자재를 러시아로 수송하다 적발됐다.","so":"TVBS新聞網","tm":"11/17 21:00","c":1,"r":"tw","u":"https://news.tvbs.com.tw/world/4051910","p":1794916800,"a":1794916997,"t":"FOCUS全球新聞／烏克蘭電網狂挨轟！愛爾蘭廠卻遭揭運飛彈原料入俄","su":"겨울이 다가오자 러시아는 우크라이나 발전소를 향해 대규모 미사일을 발사해 나라 절반에 정전을 일으켰다. 수도 키예프의 많은 가족들은 러시아 미사일이 곧 고갈되기를 바라며 어둠과 추위 속에서 생존을 위해 고군분투하고 있습니다. 그러나 외신들은 EU 회원국인 아일랜드에 있는 러시아 소유의 정유공장이 여전히 제재를 회피하며 미사일 제조에 사용될 수 있는 핵심 원자재(물건의 재료(석유·구리 등))를 러시아에 계속 공급하고 있다고 보도했다."},{"s":"DCD 강연: UL Solutions의 Ken Boyce와 함께하는 AI 시대의 데이터 센터 안전","so":"Data Center Dynamics","tm":"11/17 19:44","c":1,"r":"world","u":"https://www.datacenterdynamics.com/en/video-interviews/talks/dcd-talks-data-center-safety-in-the-age-of-ai-with-ken-boyce-ul-solutions/","p":1794912248,"a":1794917004,"t":"DCD Talks: Data center safety in the age of AI with Ken Boyce, UL Solutions","su":"DatacenterDynamics는 세계 최대의 데이터 센터 간행물입니다. 우리는 하이퍼스케일 및 클라우드, 코로케이션 및 도매, 생성 인공 지능(AI), 반도체(전자기기의 두뇌 부품), 엣지 컴퓨팅, 투자 및 REIT, 데이터 센터 회사 등에 대한 뉴스, 잡지 특집, 팟캐스트를 게시합니다. 또한 방송, 컨퍼런스, 시상식 및 기타 라이브 이벤트도 제공됩니다. 엔비디아, 구글, AWS, 코어위브의 이야기를 들어보세요."},{"s":"알리바바, 글로벌 확장 가속화하고 내년에 9개의 새로운 데이터 센터 구축 예정","so":"工商時報","tm":"11/17 19:21","c":1,"r":"tw","u":"https://www.ctee.com.tw/news/20261117701864-430804","p":1794910860,"a":1794916999,"t":"阿里雲加速全球擴張未來一年新建9座資料中心- 兩岸","su":"알리바바 자회사 알리바바 클라우드가 지난 17일 홍콩에서 연례 서밋을 열고 앞으로 12개월 안에 홍콩, 말레이시아, 터키, 브라질, 유럽 등 9개 시장에 신규 데이터센터(컴퓨터 수만 대를 모아 둔 건물)를 구축하겠다고 밝혔다. 공사 기간을 100일로 단축하고, 각 캐비닛의 컴퓨팅 성능 밀도를 5~10배 높이는 것이 목표다. 알리바바 클라우드는 향후 5년간 관련 투자가 이전에 발표한 3,800억 위안을 훨씬 초과해 글로벌 인공지능(AI) 인프라 레이아웃을 지속적으로 확장할 것이라고 밝혔습니다."},{"s":"Pimco는 데이터 센터 붐이 둔화되면서 AI 채권 스프레드가 강화될 수 있다고 말합니다.","so":"Bloomberg.com","tm":"11/17 18:33","c":1,"r":"us","u":"https://www.bloomberg.com/news/articles/2026-11-17/pimco-says-ai-bond-spreads-may-tighten-as-data-center-boom-slows","p":1794908028,"a":1794972201,"t":"Pimco Says AI Bond Spreads May Tighten as Data Center Boom Slows"},{"s":"[빅뱅크 오피니언] 美 데이터센터, 건설산업 지원 위해 지출 90% 급증, 알리안츠 트레이드, 확장 방해할 3가지 주요 결점 밝혀","so":"香港經濟日報HKET","tm":"11/17 18:01","c":1,"r":"hk","u":"https://inews.hket.com/article/4226488/%E3%80%90%E5%A4%A7%E8%A1%8C%E7%9C%8B%E6%B3%95%E3%80%91%E7%BE%8E%E5%9C%8B%E6%95%B8%E6%93%9A%E4%B8%AD%E5%BF%83%E9%96%8B%E6%94%AF%E9%A3%8790-%E6%92%90%E8%B5%B7%E5%BB%BA%E9%80%A0%E6%A5%AD%E3%80%80%E5%AE%89%E8%81%AF%E8%B2%BF%E6%98%93%E6%8F%AD3%E5%A4%A7%E7%A1%AC%E5%82%B7%E6%81%90%E7%AA%92%E7%A4%99%E6%93%B4%E5%BC%B5","p":1794906078,"a":1794917002,"t":"【大行看法】美國數據中心開支飇90%撐起建造業 安聯貿易揭3大硬傷恐窒礙擴張"},{"s":"발전소 넘어 미사일까지...두산에너빌리티, 신성장 동력 방산 엔진 정조준","so":"아주경제","tm":"11/17 18:00","c":1,"r":"kr","u":"https://www.ajunews.com/amp/20261117135634072","p":1794906000,"a":1794916992,"su":"두산에너빌리티가 원전과 발전용 가스터빈에 이어 방산 엔진으로 사업 영역을 넓히고 있다. 발전설비 개발 과정에서 확보한 설계·소재·제조 기..."},{"s":"AI 전력 수요를 충족하는 데 중요한 그리드 활용","so":"ET Datacenters","tm":"11/17 16:37","c":1,"r":"us","u":"https://datacenters.economictimes.indiatimes.com/news/energy-cooling-sustainability/grid-utilisation-crucial-for-meeting-ai-electricity-demand/135909015","p":1794901060,"a":1794916993,"t":"Grid utilisation crucial for meeting AI electricity demand","su":"대부분의 에너지 산업 의사결정자들은 인공지능(AI)으로 인한 전력 수요가 현재 예측을 초과할 것으로 예상하고 있습니다. 향상된 활용도와 유연한 상호 연결을 통해 기존 그리드 인프라를 최적화하는 것은 새로운 라인을 구축하는 것보다 더 빠르게 이러한 수요를 충족하는 데 중요합니다. 이 접근 방식은 데이터 센터 전력 전략에 영향을 미칩니다."},{"s":"기업 공개(IPO) 계획에 데이터 센터 전력 장치를 추가하는 것을 고려 중이라고 구상","so":"Bloomberg.com","tm":"11/17 16:00","c":1,"r":"us","u":"https://www.bloomberg.com/news/articles/2026-11-17/envision-said-to-consider-adding-data-center-power-to-ipo-plan","p":1794898800,"a":1794916995,"t":"Envision Said to Weigh Adding Data Center Power Unit to IPO Plan"},{"s":"[리포트 브리핑]두산에너빌리티, '수주로 구체화되는 중장기 성장' 목표가 85,000원 - 상상인증권","so":"뉴스핌","tm":"11/17 15:03","c":1,"r":"kr","u":"https://www.newspim.com/news/view/20261117001012","p":1794895380,"a":1794898930,"su":"[서울=뉴스핌] 로보뉴스 = 상상인증권에서 17일 두산에너빌리티(034020)에 대해 '수주(일감 주문을 받는 것)로 구체화되는 중장기 성장'라며 투자의견 'BUY(신규)'의 신규 리포트를 발행하였고, 목표가 85,000원을 내놓았다. 전일 종가 기준으로 볼 때, 이 종목의 주가는 목표가 대비 89.3%의 추가 상승여력이 있다는 해석이 가능하다. ◆ 두산에너빌리티 리포트 주요내용 상상인증권에서 두산에너빌리티(034020)에 대해 '최근 체고 원전 시공계약 불확실성과 SMR 사업 지연 우려로 동사의 주가가 조정되었으나, 중장기 이익 성장성을 감안하면 매수 관접 접근은 유효할 전망이다."},{"s":"중국 최초의 해양 고전력 무접점 변압기, 성공적으로 생산 라인 출시","so":"上海新闻","tm":"11/17 13:41","c":1,"r":"cn","u":"https://www.sh.chinanews.com.cn/kjjy/2026-11-17/151279.shtml","p":1794890460,"a":1794927745,"t":"中国首台船用大功率固态变压器成功下线","su":"중국 뉴스 네트워크(China News Network)는 잘 알려진 중국 뉴스 포털이자 글로벌 인터넷에서 중국 뉴스 정보를 제공하는 가장 중요한 원본 콘텐츠 제공업체 중 하나입니다. 중국뉴스서비스의 글로벌 편집 네트워크를 바탕으로 네티즌과 온라인 매체에 문자, 사진, 동영상 등 다양한 정보 서비스를 24시간 빠르고 정확하게 제공하고 있습니다. 뉴스 보도 측면에서 중국 뉴스 서비스의 역동적인 뉴스는 시의적절하고 정확하며 설명 보도 각도는 독특합니다. 해당 기사는 중국 국내외 온라인 매체를 통해 널리 복제됐다."},{"s":"삼성전자, 유럽 전력기기 회사 임원 영입…HVAC으로 가전 부진 돌파 ‘승부수’","so":"헤럴드경제","tm":"11/17 12:00","c":1,"r":"kr","u":"https://biz.heraldcorp.com/article/10939412","p":1794884400,"a":1794885899,"su":"[헤럴드경제=김현일 기자] 삼성전자가 미래 먹거리로 키우고 있는 냉난방공조(HVAC) 사업 강화를 위해 부사장급 외부 인사를 영입한 것으로 나타났다. 최근 인공지능(AI)"},{"s":"UHV 배송은 최초의 1조 수준의 성 및 지역을 환영합니다! 전력망 장비 부문 폭발, 모엔전기 리미트업","so":"21财经","tm":"11/17 11:37","c":1,"r":"cn","u":"https://news.google.com/rss/articles/CBMijwFBVV95cUxQYXBuOHN5LVlYODJYVF9wMWtmTzN5SVpFMlJPN3VKSWYzQ1czbU44VGQ5UVdSdXJSTWwtYXZncXo3ZllXZndSZF96YklXQ3d6ODg5MU02Z3Fkc2NqMDlhdUpROS1reHI5MlNPbnhfRVJWRWYxRldGSklqY3E5Y2diN0gyNklBS1FPenVULTNmZw?oc=5","p":1794883020,"a":1794885906,"t":"特高压外送迎首个万亿级省区！电网设备板块大爆发，摩恩电气涨停"},{"s":"'본토 주식 시장' 3대 지수 모두 하락, 전력망 장비, 칩 산업이 추세를 거스르고 강세를 보임 - 국제","so":"旺得富理財網","tm":"11/17 11:09","c":1,"r":"tw","u":"https://wantrich.chinatimes.com/news/20261117900103-420201","p":1794881360,"a":1794885910,"t":"《大陸股市》三大指數齊跌電網設備、芯片產業逆勢走強- 國際","su":"[타임즈-타이베이] 중국 본토 증시가 17일 개장했다. 3개 주요 지수가 종합적으로 하락세로 출발했습니다. 상하이증권거래소지수는 0.87% 하락한 3571.284포인트를 기록했다. 선전 구성요소 지수는 1.00% 하락한 10583.863포인트를 기록했습니다. ChiNext 지수는 1.28% 하락한 2290.214포인트를 기록했습니다. 업종 테마별로는 게임 업종이 대성문화(Dasheng Culture)와 디안훈 네트워크(Dianhun Network)가 하락세를 기록하는 등 급락세를 보였고, 시저스 컬처(Caesars Culture), 중칭바오(Zhongqingbao), 바오통테크놀로지(Baotong Technology)도 뒤를 이었다. 영화 및 TV 극장 부문은 문화 투자 홀딩스..."},{"s":"AIDC \"에너지 효율성 전투\": ZTE가 컴퓨팅 성능 \"에너지 기반\"을 재구성하는 방법","so":"經濟日報","tm":"11/17 11:00","c":1,"r":"tw","u":"https://money.udn.com/money/story/123828/9883215","p":1794880842,"a":1794885915,"t":"AIDC「能效之戰」：中興通訊如何重構算力「能量底座」","su":"선전, 2026년 11월 17일 /PRNewswire/ -- 단일 캐비닛의 전력 소비가 10kW에서 600kW로 급증하면 기존 데이터 센터의 전원 공급 장치 및 냉각 로직으로는 더 이상 충분하지 않습니다. AI 컴퓨팅 성능의 급속한 확장에 직면한 ZTE의 대답은 점진적인 업그레이드가 아니라 AIDC의 '에너지 기반'을 체계적으로 재구성하는 것입니다. AIDC \"에너지 효율성 전투\": ZTE가 컴퓨팅 성능의 \"에너지 기반\"을 재구성하는 방법. 컴퓨팅 능력은 폭발적으로 발전하고 있으며 전기는 \"희소한 자원\"이 되었습니다. 인공지능 시대를 맞이하여 컴퓨팅 파워에 대한 수요가 폭발적으로 증가하고 있습니다. 통계청에 따르면 2025년 말 기준 전국에서 사용 중인 컴퓨팅 파워 시설 랙 수는 표준 랙 1,373만 개를 넘어섰고, 완카 지능형 컴퓨팅 클러스터는 42개 구축됐으며, 지능형 컴퓨팅 파워 규모는 159만 PFLOPS에 달해 세계 2위를 기록했다. 2026년에도 이러한 성장 모멘텀(값이 움직이는 기세)은 줄어들지 않고 계속됩니다. 7월 말 현재 국가 지능형 컴퓨팅의 총 규모는 245만 PFLOPS에 도달했습니다. 컴퓨팅 파워의 급증으로 인한 피할 수 없는 결과는 컴퓨팅 파워 센터의 전력 소비가 급격히 증가한다는 것입니다. 국가에너지청(National Energy Administration)의 관련 데이터에 따르면 전국 컴퓨팅 파워 센터의 총 전력 소비량은 2025년에 1,700억 킬로와트시에 도달하여 사회 총 전력 소비량의 1.6%를 차지할 것으로 예상됩니다. 2030년까지 컴퓨팅 파워 센터의 전력 소비 규모는 8000억 킬로와트를 초과할 것으로 예상됩니다."},{"s":"글로벌 원전기업 경남 집결…SMR 국제 콘퍼런스 개막","so":"연합뉴스","tm":"11/17 10:15","c":1,"r":"kr","u":"https://www.yna.co.kr/view/AKR20261117029000052","p":1794878100,"a":1794885899,"su":"(창원=연합뉴스) 이정훈 기자 = 글로벌 소형모듈원자로(SMR) 기업들이 원자력산업 중심지 경남에 대거 모였다."},{"s":"월스트리트가 데이터 센터를 철수하고 전력 주식에 관한 약 6,400개의 문서에서 자본 개편이 드러났습니다 - 국제","so":"工商時報","tm":"11/17 10:01","c":1,"r":"tw","u":"https://www.ctee.com.tw/news/20261117700616-430702","p":1794877260,"a":1794885919,"t":"華爾街大舉撤出資料中心、電力股近6400份文件揭資金大洗牌- 國際","su":"인공지능(AI) 인프라에 대한 투자는 계속 확대되고 있지만 월스트리트 기관의 자본 배치는 조용히 바뀌었습니다. 미국 규제 문서에 따르면 3분기 들어 데이터센터(컴퓨터 수만 대를 모아 둔 건물) 관련 주식에 대한 기관투자자들의 열의가 식었다. 보유 종목을 완전히 매진한 펀드의 수가 신규 진입자 수를 넘어섰습니다. 특히, 공공 유틸리티 및 전력 관련 주식이 상당한 매각을 겪었습니다. 하지만 여전히 기관펀드가 반도체(전자기기의 두뇌 부품)와 AI 컨셉주를 선호하는 모습은 투자자들이 AI 산업에 전반적으로 약세를 보이지 않고 재투자에 나섰다는 점을 보여준다."},{"s":"가장 큰 데이터 센터가 미국 전력 사용량의 약 2%를 차지한다는 연구 결과가 나왔습니다.","so":"The Washington Post","tm":"11/17 09:00","c":1,"r":"us","u":"https://www.washingtonpost.com/technology/2026/11/16/data-centers-take-up-almost-2-percent-us-electricity-use-study-shows/","p":1794873600,"a":1794955489,"t":"Largest data centers take up about 2 percent of U.S. electricity use, study says"},{"s":"전력기기/풍력 (Positive)","so":"한국경제","tm":"11/17 08:52","c":1,"r":"kr","u":"https://www.hankyung.com/koreamarket/consensus/pdf/2026-11-744e70f05dd9b2874e2e9cafc3e33b5b","p":1794873130,"a":1794874181},{"s":"HSBC, 3억 달러 부실 데이터센터 대출 할인 판매","so":"Bloomberg.com","tm":"11/17 07:01","c":1,"r":"us","u":"https://www.bloomberg.com/news/articles/2026-11-16/hsbc-sold-300-million-troubled-data-center-loan-at-discount","p":1794866487,"a":1794869078,"t":"HSBC Sold $300 Million Troubled Data Center Loan at Discount"},{"s":"타이파워: AI 데이터센터 전용 구역 계획해야","so":"自由時報","tm":"11/17 06:30","c":1,"r":"tw","u":"https://news.ltn.com.tw/news/life/paper/1778766","p":1794864600,"a":1794869083,"t":"台電：AI資料中心應規劃專區","su":"AI 산업은 우리나라의 경제 발전을 주도하고 있으며 대만도 전력 문제에 직면해 있습니다. 특히, 다량의 전력을 소비하는 AI 데이터센터(컴퓨터 수만 대를 모아 둔 건물) 구축으로 인해 타이파워는 향후 전국 전력 소비량이 연간 2%씩 증가할 것으로 추정하고 있다. 5~4%에 달하는 Taipower 부사장 Zheng Qinghong은 AI 데이터 센터에 필요한 것은 마이크로그리드이며 자체 전원 공급 장치와 에너지 저장 장치도 제공해야 하며 컴퓨팅 성능도 보다 적절하게 관리해야 한다고 말했습니다. 최근 유럽과 미국에서도 AI 데이터센터 구축에 반발이 시작됐다. 이는 주로 지역 전기 가격 때문입니다. AI 데이터센터의 높은 전력 소비로 인해 지역 전력 가격이 상승했다. 국민들의 상대적 박탈감은 높아졌고, AI 데이터센터 구축에 대한 불만도 높아졌다."},{"s":"Macquarie, Capex Super Cycle 속에서 데이터 센터의 활기를 경고","so":"Bloomberg.com","tm":"11/17 04:00","c":1,"r":"us","u":"https://www.bloomberg.com/news/articles/2026-11-16/macquarie-warns-of-data-center-exuberance-amid-capex-super-cycle","p":1794855600,"a":1794874182,"t":"Macquarie Warns of Data Center Exuberance Amid Capex Super Cycle"},{"s":"가장 빠른 새로운 용량은 이미 보유하고 있는 그리드입니다","so":"POWER Magazine","tm":"11/17 03:20","c":1,"r":"us","u":"https://www.powermag.com/the-fastest-new-capacity-is-the-grid-you-already-have/","p":1794853216,"a":1794869079,"t":"The Fastest New Capacity Is the Grid You Already Have","su":"그리드 활용 규칙, 유연한 상호 연결 및 고급 전송 기술은 새로운 라인을 구축하는 것보다 더 빠르게 유휴 용량을 확보할 수 있습니다."},{"s":"일본 유틸리티, PJM을 지원하는 버지니아 BESS 프로젝트 지분 인수","so":"POWER Magazine","tm":"11/17 01:51","c":1,"r":"us","u":"https://www.powermag.com/japanese-utility-takes-stake-in-virginia-bess-project-serving-pjm/","p":1794847905,"a":1794869081,"t":"Japanese Utility Takes Stake in Virginia BESS Project Serving PJM","su":"일본 오사카에 본사를 둔 간사이 전력(Kansai Electric Power)은 150MW/600MWh 배터리 에너지 저장 장치인 Prospect Power Storage의 소수 지분(회사를 나눠 가진 몫)을 인수했습니다."},{"s":"기본 부하를 넘어서: 유연한 가스 생성이 재생 가능 전력망의 중추가 되는 이유","so":"POWER Magazine","tm":"11/17 00:24","c":1,"r":"us","u":"https://www.powermag.com/webinars/beyond-baseload-why-flexible-gas-generation-is-becoming-the-backbone-of-the-renewable-grid/","p":1794842687,"a":1794869082,"t":"Beyond Baseload: Why Flexible Gas Generation Is Becoming the Backbone of the Renewable Grid"},{"s":"독점: 올 겨울 우크라이나의 원자력 사고 위험이 증가한다고 원자력 안전 규제 기관이 밝혔습니다.","so":"Reuters","tm":"11/16 23:08","c":1,"r":"us","u":"https://www.reuters.com/business/energy/risk-nuclear-accident-ukraine-increasing-this-winter-atomic-safety-regulators-2026-11-16/","p":1794838085,"a":1794885902,"t":"EXCLUSIVE: Risk of nuclear accident in Ukraine increasing this winter, atomic safety regulators say"},{"s":"중동 AI 데이터센터, 전력 공급 병목 현상에 직면하다! 변압기 배송에 최대 4년이 소요되어 사우디아라비아가 2030년 재생 에너지 목표를 달성하기가 어렵습니다.","so":"鉅亨網","tm":"11/16 22:00","c":1,"r":"tw","u":"https://news.cnyes.com/news/id/6664275","p":1794834011,"a":1794834739,"t":"中東AI資料中心搶電遇瓶頸！變壓器交期長達4年沙國2030年再生能源目標恐難達成","su":"중동 AI 데이터센터(컴퓨터 수만 대를 모아 둔 건물), 전력 공급 병목 현상에 직면하다! 변압기 납품 기간은 최장 4년으로, 사우디아라비아의 2030년 재생에너지 목표는 달성하기 어려울 수 있다. 유애널라이즈 2026년 11월 16일 (유애널라이즈/산업데이터센터 보고서) ⸺ 중동 국가들이 AI 데이터센터와 신재생에너지에 대한 투자를 가속화하고 있지만, 전력기기 납품 시간이 건설 병목 현상이 되고 있다. 연구기관인 글로벌인피니티랩스는 사우디아라비아의 초고압 변압기 납품 기간이 최대 3~4년이라고 지적했다. 발전소 자금이 마련되더라도 장비가 예정대로 배송되지 않을 수 있으며, 이로 인해 새로운 전력이 그리드에 연결되는 시간이 느려질 수 있습니다. 사우디아라비아는 2030년 재생에너지 설비용량을 130GW로 늘릴 계획이지만, 2025년 말 기준 실제 가동용량은 12.3GW에 불과해 목표에 비해 117.7GW가 부족하다. 예정대로 목표를 달성하려면 향후 5년 동안 매년 평균 23.5GW를 추가해야 하는데, 이는 현재 건설 속도보다 훨씬 높은 수준이다."},{"s":"블랙스톤 REIT, 50억 달러 규모의 거래로 아마존 데이터 센터 구매","so":"Bloomberg.com","tm":"11/16 20:53","c":1,"r":"us","u":"https://www.bloomberg.com/news/articles/2026-11-16/blackstone-reit-to-buy-amazon-data-centers-in-5-billion-deal","p":1794830037,"a":1794834737,"t":"Blackstone REIT to Buy Amazon Data Centers in $5 Billion Deal"},{"s":"태국 푸켓의 유명 관광지에서 치명적인 화재가 발생해 수십명이 숨졌고, 오토바이 바닥에 있던 변압기가 폭발한 것으로 추정된다(키티양 제보)","so":"Now 新聞","tm":"11/16 20:20","c":1,"r":"hk","u":"https://news.now.com/home/international/player?newsId=669785&home=1","p":1794828039,"a":1794830464,"t":"泰國布吉知名遊客區致命火釀幾十人死傷 疑電單車地舖變壓器爆炸導致（楊潔儀報道）","su":"[나우뉴스채널] 이른 아침, 태국 푸켓의 유명 관광지 빠통에서 대여 오토바이 바닥에서 화재가 발생했습니다. 이는 위층 주거지로 퍼져 최소 11명이 사망하고 연기 흡입으로 사망한 것으로 추정되며 12명이 부상을 입었다. 당국은 처음에 화재가 변압기 폭발로 인해 발생한 것으로 의심했습니다."},{"s":"친핵은 재가동의 3대 원칙을 말한다. 원전을 반대한다고 해서 바로 가동할 수 있는 것은 아니다 | 정치","so":"中央社 CNA","tm":"11/16 20:20","c":1,"r":"tw","u":"https://www.cna.com.tw/news/aipl/202611160178.aspx","p":1794828000,"a":1794830458,"t":"擁核指重啟3原則已具備反核批核電廠不是說開就開| 政治","su":"중앙선거관리위원회가 비핵 조국폐지 국민투표 제3차 의견회의를 개최한다. 긍정적인 측면은 대만이 이미 원전 재가동을 위한 3대 원칙을 갖고 있고, 원전을 폐쇄하면 천연가스 사용량이 늘어날 것이라는 점이다. 부정적인 측면에서는 원전이 대규모 이동식 전력원이 아니고 마음대로 켜지지 않는다는 점을 비판한다."},{"s":"Box2Bit은 150MW 그리드 연결을 블랙스톤으로 이전하고 Épila를 종료합니다.","so":"Data Center Dynamics","tm":"11/16 19:48","c":1,"r":"world","u":"https://www.datacenterdynamics.com/en/news/box2bit-sells-150-mw-to-blackstone-and-lets-epila-take-the-lead-in-aragon/","p":1794826132,"a":1794869084,"t":"Box2Bit transfers 150MW grid connection to Blackstone and exits Épila","su":"Capital Energy의 자회사인 Box2Bit이 스페인 Epilon 데이터 센터 프로젝트에서 철수했습니다. 회사는 이 프로젝트를 위해 확보한 150MW의 그리드 연결 용량을 블랙스톤에 판매하고 있습니다. 아라곤 정부는 2026년 초에 이 프로젝트가 대중의 관심을 끌 것이라고 선언했으며, 1단계는 2029년에 가동될 예정입니다."},{"s":"프랑스 감사원, 낮은 전력 가격이 EDF 원자로 프로그램을 위협한다고 경고","so":"Reuters","tm":"11/16 19:30","c":1,"r":"us","u":"https://www.reuters.com/business/energy/french-court-auditors-warns-low-power-prices-threaten-edf-reactor-programme-2026-11-16/","p":1794825030,"a":1794898930,"t":"French court of auditors warns low power prices threaten EDF reactor programme"},{"s":"AI 데이터 센터 및 전력망에 대한 투자로 구리 수요 증가 골드만삭스는 2027년 말까지 구리 가격이 상승할 가능성을 13%로 보고 있습니다.","so":"鉅亨網","tm":"11/16 19:30","c":1,"r":"tw","u":"https://news.cnyes.com/news/id/6664079","p":1794825004,"a":1794830460,"t":"AI資料中心與電網投資推升銅需求高盛看2027年底銅價有13%上漲空間","su":"AI 데이터 센터 및 전력망에 대한 투자는 구리 수요를 증가시킵니다. 골드만삭스는 2027년 말까지 구리 가격이 13% 상승할 여지가 있다고 봅니다. Uanalyze 2026년 11월 16일(Uanalyze/산업 데이터 센터 보고) ⸺ AI 데이터 센터 및 전력 인프라에 대한 투자가 계속 증가하여 전 세계 구리 수요 증가를 주도하지만, 광산 생산량을 동시에 확장하기는 어렵습니다. 골드만삭스(GS-US)는 런던금속거래소(LME) 구리 가격이 2027년 12월까지 미터톤당 미화 15,600달러까지 오를 것이라고 예측했는데, 이는 주로 공급 제약과 수요 증가로 인한 가격 지지에 대해 낙관적이었습니다. LME 3개월 구리 선물(미래 값을 미리 정해 사고파는 거래)은 11월 13일 미터톤당 $13,399에 마감되었습니다. 골드만삭스의 예상 목표는 당시 현물 가격보다 약 13% 높습니다."},{"s":"닛신 전기가 마에바시에 신공장, 변전소용 부품 제조 전력 수요 전망 능력 증강","so":"日本経済新聞","tm":"11/16 18:30","c":1,"r":"jp","u":"https://www.nikkei.com/article/DGXZQOCC163BT0W6A111C2000000/","p":1794821446,"a":1794830465,"t":"日新電機が前橋に新工場、変電所向け部品製造 電力需要見据え能力増強","su":"닛신전기(교토시)는 16일, 마에바시 제작소(마에바시시) 내에 건설하는 공장의 안전 기원제를 열었다. 변전소 등에 대한 절연장치 부품의 생산성을 높이기 위해 45억엔을 들여 기존 공장의 개수와 용접공장의 건설을 추진한다. 인공지능(AI)의 보급에 따른 데이터센터(컴퓨터 수만 대를 모아 둔 건물)의 가동에 따른 전력수요의 고조를 내다보고 생산능력을 늘린다. 용접공장 완성은 2027년 12월을 전망한다. 신설하는 용접공장의 바닥면적은 약 4930제곱미터. 수변전 설비의"},{"s":"아시아 데이터 센터 대출 신디케이션이 희귀 거래 일시 중지로 지연됨","so":"Bloomberg.com","tm":"11/16 18:04","c":1,"r":"us","u":"https://www.bloomberg.com/news/articles/2026-11-16/asian-data-center-loan-syndication-is-delayed-in-rare-deal-pause","p":1794819862,"a":1794874183,"t":"Asian Data Center Loan Syndication Is Delayed in Rare Deal Pause"},{"s":"노르웨이의 데이터 센터 장비, 자동차 수입 기록 기록","so":"Bloomberg.com","tm":"11/16 17:55","c":1,"r":"us","u":"https://www.bloomberg.com/news/articles/2026-11-16/norway-s-imports-hit-record-on-data-center-equipment-cars","p":1794819327,"a":1794830455,"t":"Norway’s Imports Hit Record on Data Center Equipment, Cars"},{"s":"Kangshu Supercomputing은 고밀도 컴퓨팅 성능 레이아웃을 향상시키는 다양한 액체 냉각 솔루션을 선보입니다.","so":"經濟日報","tm":"11/16 17:01","c":1,"r":"tw","u":"https://money.udn.com/money/story/5612/9881959","p":1794816076,"a":1794830462,"t":"康舒 Supercomputing 展出多元液冷解決方案強化高密度運算電力布局","su":"전원공급장치 제조사 강슈(6282)가 11월 17일부터 19일까지 미국 시카고에서 열리는 슈퍼컴퓨팅 2026(Supercomputing 2026)에 참가한다. 지난 10월 OCP 글로벌 서밋에서 선보인 업계 최고의 고전력 밀도 전원 공급 장치 기술을 이어가는 것 외에도 이번에는 수냉식 플레이트와 유전체 액체 냉각 기술을 결합한 전원 공급 장치 제품을 추가로 선보일 예정이며, AI 및 고성능 컴퓨팅(HPC) 시스템의 증가하는 전원 공급 장치 및 냉각 요구 사항에 대처하기 위해 전력 변환, 배전, 열 관리 분야에서 회사의 통합 설계 역량을 입증할 예정입니다."},{"s":"AI 전력 수요에 날개 단 LS…3Q 영업익 4882억 90% 증가","so":"뉴스1","tm":"11/16 16:22","c":1,"r":"kr","u":"https://www.news1.kr/industry/general-industry/6355657","p":1794813752,"a":1794830454}]},{"name":"🤖 로봇","note":"","breaking":false,"items":[{"s":"美 보스턴 다이내믹스 '아틀라스', 2027년 반도체 공장서 현장 시험","so":"로봇신문","tm":"11/18 10:50","c":4,"r":"kr","u":"https://www.irobotnews.com/news/articleView.html?idxno=49656","p":1794966657,"a":1794972218,"su":"보스턴 다이내믹스(Boston Dynamics)가 미국 반도체(전자기기의 두뇌 부품) 제조업체 '글로벌파운드리(GlobalFoundries, 약칭 GF)'와 협력해 2027년 초부터 반"},{"s":"케이엔알시스템, 2톤급 '슈퍼휴머노이드' 이족보행 구현","so":"뉴스핌","tm":"11/18 08:45","c":4,"r":"kr","u":"https://www.newspim.com/news/view/20261118000133","p":1794959100,"a":1794959402,"su":"[서울=뉴스핌] 이나영 기자= 로봇 전문기업 케이엔알시스템은 개발 중인 초대형 산업용 로봇 '슈퍼휴머노이드(사람을 닮은 로봇)'의 하체 보행 테스트에서 이족보행을 구현했다고 18일 밝혔다. 회사는 연말까지 상·하체 통합을 마무리하고 고중량물을 운반할 수 있는 산업용 휴머노이드 완성체를 선보일 계획이다. 케이엔알시스템은 지난 9월 초 로봇다리 개발과 기본동작 검증을 마친 뒤 10월 2일 보행기를 활용한 초기 보행에 성공했다."},{"s":"NEXCOM, RoboWIZ AI 로봇 개방형 생태계 확장 | 기술산업 | 산업경제","so":"UDN","tm":"11/19 15:03","c":3,"r":"tw","u":"https://udn.com/news/story/7240/9888946","p":1795068232,"a":1795071834,"t":"新漢擴大RoboWIZ AI 機器人開放生態系| 科技產業| 產經","su":"넥스컴(8234)그룹 자회사 넥스코봇(NexCOBOT)은 지난달 엔비디아 베를린 GTC 컨퍼런스에서 독일, 미국 로봇 생태계 파트너들과 힘을 합쳐 로보위즈(RoboWIZ) AI 로봇 오픈 플랫폼을 공동 출시했다. 이는 지난 8월 타이베이 자동화 전시회에서 공식 출시된 이후 플랫폼의 첫 해외 시리즈 연결이다. 해외 시장과 로봇 관련 분야에서 단숨에 주목을 받았고, 업계 전문가들의 문의가 꾸준히 이어지고 있다. NEXCOM은 물리적 AI(Physical AI) 및 임바디드 AI(Embodied AI) 기술의 적용을 가속화하기 위해 'RoboWIZ AI 로봇 개방형 생태계' 호출 계획의 확장을 공식 발표했습니다. 이를 통해 더 많은 기술 혁신가, 시스템 통합자, 소프트웨어 및 하드웨어 개발자가 참여할 수 있게 되었으며, 분야 전반에 걸쳐 스마트 로봇 개발을 공동으로 촉진하고 다양한 유형의 현장 애플리케이션을 만들 수 있게 되었습니다."},{"s":"휴머노이드 로봇 부문 변동 및 약화, Fulai 신소재 제한","so":"Jiemian.com","tm":"11/18 15:43","c":3,"r":"cn","u":"https://www.jiemian.com/article/15346162.html","p":1794984200,"a":1794985320,"t":"人形机器人板块震荡走弱，福莱新材跌停"},{"s":"한세실업, '휴머노이드 의류 제작'으로 한국PR대상 최우수상","so":"연합뉴스","tm":"11/18 09:43","c":3,"r":"kr","u":"https://www.yna.co.kr/amp/view/AKR20261118046600030","p":1794962601,"a":1794972218,"su":"(서울=연합뉴스) 구정모 기자 = 한세실업과 지주사 한세예스24홀딩스가 휴머노이드(사람을 닮은 로봇) 로봇을 위한 미래 의류를 디자인하고 제작해 선보인 '웨어 더 ..."},{"s":"Youzhishi︱디지털 휴머노이드 로봇 'Youzhobao'가 춤을 추며 쿵푸를 선보이고, 친구들은 기쁨과 칭찬으로 춤을 춥니다.","so":"星島頭條","tm":"11/16 20:04","c":3,"r":"hk","u":"https://www.stheadline.com/society/3637773/%E5%8F%8B%E6%99%BA%E8%AD%98%E6%95%B8%E5%AD%97%E8%BE%A6%E4%BA%BA%E5%BD%A2%E6%A9%9F%E6%A2%B0%E4%BA%BA%E5%8F%8B%E6%99%BA%E5%AF%B6%E8%B7%B3%E8%88%9E%E6%89%93%E5%8A%9F%E5%A4%AB-%E8%80%81%E5%8F%8B%E8%A8%98%E7%9C%89%E9%A3%9B%E8%89%B2%E8%88%9E%E8%AE%9A%E5%8F%BB","p":1794827048,"a":1794830486,"t":"友智識︱數字辦人形機械人「友智寶」跳舞打功夫 老友記眉飛色舞讚叻","su":"디지털오피스는 오늘(16일) '친절한 지식' 커뮤니티 디지털 포용 프로그램 2차와 '로봇을 커뮤니티 속으로' 시범 프로그램 론칭식을 가졌다. Sun Dong 혁신기술산업국 국장은 더 많은 사람들에게 혜택을 제공하기 위해 서비스 규모가 확대될 것이라고 말했습니다. 디지털 오피스와 사회혁신기금은 2024년에 2년간의 '친절한 지식' 디지털 포용 프로그램을 시작하여 노인과 기타 도움이 필요한 사람들이 디지털 기술을 습득할 수 있도록 지원합니다. 여기에는 스마트폰 및 디지털 서비스 사용을 돕기 위한 지원 지점 설정, 디지털 서비스 및 기술 과정 설정, 온라인 기술 학습 플랫폼 설정 등이 포함됩니다. 우정 지식 프로젝트 기술 및 산업 혁신을 통해 커뮤니티 디지털 지원 포인트가 두 배로 증가했습니다."},{"s":"한라캐스트, 휴머노이드 로봇 부품 양산 시작…내년 성장 본격화-IBK","so":"이데일리","tm":"11/19 07:54","c":2,"r":"kr","u":"https://www.edaily.co.kr/News/Read?newsId=01813846645647360&mediaCodeNo=257","p":1795042489,"a":1795046364,"su":"IBK투자증권은 19일 한라캐스트(125490)에 대해 글로벌 인공지능(AI) 기업을 대상으로 휴머노이드(사람을 닮은 로봇) 로봇 부품 양산을 시작하면서 새로운 성장 국면에 진입했다고 평가했다. 기존 자동차 전장 부품에서 축적한 경량화 기술력과 대규모 수주(일감 주문을 받는 것)잔고, 생산능력 확대를 바탕으로..."},{"s":"선전에서 열리는 APEC 회의를 준비하면서 151대의 휴머노이드 로봇이 룽강구에서 동시에 춤을 추며 기네스 세계 신기록을 세웠습니다.","so":"etnet 經濟通","tm":"11/18 14:03","c":2,"r":"hk","u":"http://www.etnet.com.hk/www/tc/news/news-article.php?section=photonews&newsid=417209","p":1794978180,"a":1794985329,"t":"為迎接APEC會議在深圳舉行，龍崗區有151部人形機械人同步跳舞，刷新了健力士世界紀錄","su":"2026년 11월 18일 13:03 선전에서 열리는 APEC 회의를 환영하기 위해 151대의 휴머노이드(사람을 닮은 로봇) 로봇이 룽강구에서 일제히 춤을 추며 기네스 세계 신기록을 세웠습니다. 2026년 11월 17일 화요일 선전에서 열리는 APEC 회의를 환영하기 위해 151대의 휴머노이드 로봇이 룽강구에서 일제히 춤을 추며 기네스 세계 신기록을 세웠습니다. Longgang District Bantian Street에 위치한 중국 최초의 스마트 로봇 구현 블록인 Galaxy WORLD에서는 151개의 휴머노이드 로봇이 순서대로 배열되어 한국 그룹 BIGBANG의 노래 배경 음악에 맞춰 동시에 춤을 추며 모션 알고리즘, 그룹 스케줄링 및 전반적인 기계 안정성과 같은 많은 하드 코어 기술에서 본토 휴머노이드 로봇의 역량을 보여주었습니다. 로봇은 균일한 방식으로 이동하여 고도로 조정된 작업 수준을 테스트했습니다. 또한 151대의 휴머노이드 27762,"t":"工信部发布5项人形机器人标准，涉及智能化能力分级、灵巧手及训练数据等","su":"더페이퍼테크놀로지는 지난 11월 17일 산업정보기술부가 발표한 휴머노이드(사람을 닮은 로봇) 로봇 및 체화지능표준화기술위원회(MIIT/TC8, 이하 'TC8 표준화위원회') 사무국으로부터 20일 밝혔다."},{"s":"아티언스대전 개막 축하공연 선보이는 휴머노이드 로봇","so":"뉴스1","tm":"11/17 18:27","c":2,"r":"kr","u":"https://www.news1.kr/photos/8218896","p":1794907625,"a":1794917012},{"s":"AI의 다음 목적지는 물리적 세계를 겨냥한 레이준: 휴머노이드 로봇 산업의 규모는 자동차를 넘어선다 | 기술산업 | 산업경제학","so":"UDN","tm":"11/17 17:15","c":2,"r":"tw","u":"https://udn.com/news/story/7240/9884410","p":1794903348,"a":1794917025,"t":"AI 落地下一站瞄準物理世界雷軍：人形機器人產業規模超越汽車| 科技產業| 產經","su":"인공지능(AI) 산업은 소프트웨어 애플리케이션에서 물리적 세계로 이동하고 있으며, 휴머노이드(사람을 닮은 로봇) 로봇, AI 자동차, 스마트 제조가 차세대 비즈니스 기회의 물결이 되고 있습니다. 샤오미 그룹 창업자이자 회장 겸 CEO인 레이쥔(Lei Jun)은 AI 기술이 지난 4년 동안 빠르게 발전했다고 말했다. 업계에서는 많은 자원을 투자했지만 실제로 구현하고 수익을 창출할 수 있는 애플리케이션은 여전히 제한적입니다. 그는 AI가 물리적 세계에 진입함으로써 가져올 새로운 기회, 특히 휴머노이드 로봇이 향후 자동차 산업을 뛰어넘는 거대한 시장으로 발전할 것으로 기대하고 있다고 낙관하고 있다."},{"s":"현대차, 보스턴다이내믹스 지분 100% 인수","so":"The Korea Herald","tm":"11/17 15:31","c":2,"r":"us","u":"https://www.koreaherald.com/article/10940043","p":1794897083,"a":1794898995,"t":"Hyundai Motor takes full ownership of Boston Dynamics","su":"현대자동차그룹이 미국 로봇 자회사 보스턴다이내믹스의 지분(회사를 나눠 가진 몫) 100%를 인수하며 휴머노이드(사람을 닮은 로봇) 로봇 아틀라스(Atlas) 상용화에 박차를 가하고 있다."},{"s":"영남대, 'HuMAN 제조특화 휴머노이드 사업단' 개소…휴머노이드AI로 지역 정주형 최고급 AI 신진연구자 양성","so":"전자신문","tm":"11/17 14:27","c":2,"r":"kr","u":"https://www.etnews.com/20261117000298","p":1794893262,"a":1794898995,"su":"영남대학교(총장 최외출)가 최근 천마아트센터 이시원글로벌컨벤션홀에서 'HuMAN(Humanoid Manufacturing AI Nexus) 제조특화 휴머노이드(사람을 닮은 로봇) 사업단' 개소식을 가졌다. 이번 개소식에는 김삼수 영남대 산학연구부총장, 김재홍 산학협력단장을 비롯해 정종혁 경북도 인공지능산업과 팀장, 이상협 경산시 신성장산업과장을 비롯해 참여기업 관계자 등 100여 명이 참석했다. 영남대는 지난 7월 과학기술정보통신부와 정보통신기획평가원(IITP)의 'AI최고급신진연구자지원사업' 지역주도형 산학협력 트랙에 선정, 2031년까지 국비 110억 원 등 총 123억여 원을 투입해 사업을 추진한다."},{"s":"유니트리는 10% 이상 하락했습니다.","so":"第一财经","tm":"11/17 11:18","c":2,"r":"cn","u":"https://www.yicai.com/brief/103443111.html","p":1794881880,"a":1794885947,"t":"宇树科技跌超10%","su":"2026/11/17 10:18 [유니트리 10% ,"r":"hk","u":"https://news.now.com/home/international/player?newsId=669976&home=1","p":1794968520,"a":1794972225,"t":"有片｜人形機械人KPOP勁歌熱舞迎APEC 大跳BIGBANG舞蹈","su":"[지금 뉴스 채널] 심천에서 열리는 APEC 회의의 성대한 개막을 준비하면서, 중국 최초의 임바디드 AI(로봇처럼 몸을 가진 인공지능)형 로봇 시연 블록인 룽강구 반티엔 거리에 있는 갤럭시 월드(Galaxy WORLD)는 최근 한국 팝 그룹 빅뱅(BIGBANG)의 노래를 배경 음악으로 151대의 휴머노이드(사람을 닮은 로봇) 로봇을 배치하여 본토 휴머노이드 로봇의 혁신적 강점과 연구 개발 결과를 보여주었습니다. 또한 151대의 휴머노이드 로봇이 1시간 만에 거리에서 동시에 춤을 추는 장면도 기네스 기록을 경신했다."},{"s":"사람 말에 척척 움직인다…휴머노이드 동작 성공률 20%↑","so":"YTN 사이언스","tm":"11/18 11:04","c":1,"r":"kr","u":"https://science.ytn.co.kr/program/view.php?mcd=0082&key=202611181104042723","p":1794967444,"a":1795003511,"su":"[앵커] 스마트폰의 AI는 말로 명령을 수행하지만, 두 발로 움직이며 물건을 다루는 휴머노이드(사람을 닮은 로봇)는 이를 구현해내기가 쉽지 않습니다. 국내 연구팀이 사람의 언어를 휴머노이드가 명령으로 연결하는 기술을 앞당길 방법을 개발했는데요. 김은별 기자입니다. [기자] 로봇에게 먹을 것을 달라고 명령하자 앞에 놓인 사과를 인식하고 집은 후 전달합니다. \"Can I have something to eat?\" \"먹을 것 좀 줄래?\" \"Sure thing.\" \"물론이죠\" 로봇이 카메라로 주변 환경을 인식하고, 사람의 언어 명령을 이해해 적절한 동작을 생성하는 'VLA' 기술입니다."},{"s":"평균연령은 22세로 글로벌 로봇시장에 도전장을 내밀고 있다. 대만 청년, 바이브로보틱스 창업, YC 투자 유치 | 핫 하이라이트 | 사업정보","so":"經濟日報","tm":"11/18 11:02","c":1,"r":"tw","u":"https://money.udn.com/money/story/5635/9884240","p":1794967376,"a":1794972222,"t":"平均22歲挑戰全球機器人市場 台灣青年創辦Vibe Robotics獲YC投資 | 熱門亮點 | 商情","su":"글로벌 AI 로봇산업은 새로운 경쟁의 물결을 타고 있다. 대만 청년 린치(Lin Qi), 천웨이한(Chen Weihan) 등이 공동 창업한 바이브 로보틱스(Vibe Robotics)는 19~24세의 창업자가 4명이다. 실리콘밸리의 유명 창업 액셀러레이터인 와이콤비네이터(YC)로부터 투자를 받아 2027년 겨울반(W27)에 선정됐다. 글로벌 로봇 시장에 도전하기 위해 미국 힐튼 브랜드 호텔의 수건부터 시작하고 있다."},{"s":"물리학 AI 선두주자 Siling Robotics는 시리즈 F 자금 조달에서 5억 달러를 완료했습니다.","so":"經濟日報","tm":"11/18 11:00","c":1,"r":"tw","u":"https://money.udn.com/money/story/123828/9885717?from=edn_related_storybottom","p":1794967241,"a":1794972224,"t":"物理AI領軍企業思靈機器人完成5億美元F輪融資","su":"회사 가치는 85억 달러로 세계화를 가속화하고 있습니다. 뮌헨, 2026년 11월 17일 /PRNewswire/ -- 뮌헨에 본사를 둔 물리학 AI 회사인 Agile Robots는 융자 금액 5억 달러, 사후 가치 평가 85억 달러로 시리즈 F 자금 조달(사업에 쓸 돈을 모으는 것)을 완료했습니다. 이번 자금 조달은 소프트뱅크 그룹이 주도했으며 엔비디아, Hitachi 그룹(Hitachi 및 Hitachi Ventures), T.Capital 및 기타 기관이 참여했습니다. 지금까지 회사의 총 자금 조달 규모는 20억 달러에 달했습니다. Siling Robot의 5억 달러 규모의 시리즈 F 자금 조달 발표가 뉴욕 증권 거래소(NYSE)의 대형 화면에 나타났습니다. Siling Robot은 물리적 AI 기술을 개발하고 배포합니다. 해당 제품에는 휴머노이드(사람을 닮은 로봇) 로봇, 모바일 로봇, 로봇 팔, 능숙한 손은 물론 지원 소프트웨어와 AI 모델이 포함되어 있어 산업 고객이 이전에 능숙한 작업과 수동 판단에 의존했던 작업을 자동화할 수 있도록 지원합니다. 회사 창립자 겸 CEO인 Chen Zhaopeng 박사는 이렇게 말했습니다. \"물리 AI는 글로벌 생산, 재료 이전 및 제조 모델을 근본적으로 변화시킬 것입니다. 우리는 물리 AI를 실험실에서 벗어나 물류, 자동차, 전자 및 제조 분야의 산업 생산 라인으로 확대하고 있습니다. 이번 자금 조달은 우리의 글로벌 확장을 가속화하는 데 도움이 될 것입니다."},{"s":"미라콤아이앤씨·레인보우로보틱스, 제조 RX 통합 서비스로 시장 공략","so":"로봇신문","tm":"11/18 10:30","c":1,"r":"kr","u":"https://www.irobotnews.com/news/articleView.html?idxno=49655","p":1794965459,"a":1795006792,"su":"미라콤아이앤씨가 제조IT·MES·AI 역량과 레인보우로보틱스의 로봇 기술을 결합해 제조 RX(Robotics Transformation) 사업 전반을 아우르는 통"},{"s":"에브리봇, 피지컬 AI 사업본부 출범…중국 애지봇·DDT와 휴머노이드·사족보행 로봇사업 확대","so":"인공지능신문","tm":"11/18 09:28","c":1,"r":"kr","u":"https://www.aitimes.kr/news/articleView.html?idxno=42775","p":1794961736,"a":1794972218,"su":"로봇 전문기업 에브리봇(대표 정우철)이 중국 휴머노이드(사람을 닮은 로봇) 및 사족보행 로봇 기업과 협력해 피지컬 AI 사업 확대에 나선다. 기존 로봇청소기 중심의 사업구조를 다변화하고, 2027년부터 기업간거래(B2B) 로봇시장 진출을 본격화한다는 전략이다.에브리봇은 지난 3월 설립한"},{"s":"유비테크 Zhang Ju: 로봇 회사는 실제 공장 시나리오에서 학습해야 합니다.","so":"财新","tm":"11/18 08:06","c":1,"r":"cn","u":"https://topics.caixin.com/2026-11-18/102506031.html","p":1794956760,"a":1794972219,"t":"优必选张钜：机器人企业必须在工厂实际场景中学习","su":"[더 많은 정상회담 보고서를 보시려면 이번 차이신 정상회담 홈페이지를 방문해 주세요. 여기를 클릭하여 열기] [Caixin] 최근 몇 년간 휴머노이드(사람을 닮은 로봇) 로봇 산업이 급속도로 발전했지만 여전히 공장 진출과 대규모 적용에는 어려움을 겪고 있습니다. 11월 17일에 열린 제17차 Caixin Summit Shenzhen APEC 특별 세션에서 Zhang Ju 유비테크 최고재무책임자(CFO) 겸 이사회 비서는 병목 현상을 극복하는 열쇠는 산업 시나리오에서 실제 데이터를 획득하여 모델 역량을 개선하고 기술 성숙도와 대규모 적용을 촉진하는 데 있다고 말했습니다. 방대한 역사적 텍스트와 이미지를 사용하여 훈련할 수 있는 기본 대형 모델과 달리 산업 시나리오에 진입하는 임바디드 AI(로봇처럼 몸을 가진 인공지능)는 회사의 내부 생산 환경 및 독점 데이터에 대한 액세스가 필요하며 이러한 데이터는 특정 회사의 손에 있으며 외부 세계에 공개되지 않습니다."},{"s":"\"디케이티, 비수기에도 영업익 168% 늘어…휴머노이드 주목\" [클릭 e종목]","so":"아시아경제","tm":"11/18 07:05","c":1,"r":"kr","u":"https://www.asiae.co.kr/article/2026111718460203649","p":1794953100,"a":1794955496,"su":"하나증권은 스마트폰 OLED 부품과 배터리관리시스템(BMS)을 만드는 디케이티가 스마트폰 비수기인 3분기에 예상보."},{"s":"화려한 퍼포먼스 中 휴머노이드 로봇, 현장 사업화까지 곳곳 장애물","so":"주간동아","tm":"11/18 07:00","c":1,"r":"kr","u":"https://weekly.donga.com/List/Series/article/all/11/6462859/1","p":1794952802,"a":1794955496,"su":"중국 로봇산업은 퍼포먼스가 화려하지만 동시에 구조적 한계도 드러내고 있다. 중국 대표 휴머노이드(사람을 닮은 로봇) 로봇 기업 유니트리의 왕싱싱 최고경영자(CEO)는 8월 20일 베이징에서 열린 2…"},{"s":"Wi-Fi 접속한 로봇 청소기를 스마트폰으로 원격 조작, 진입 금지 에리어의 설정도","so":"日経クロステック","tm":"11/18 05:00","c":1,"r":"jp","u":"https://xtech.nikkei.com/atcl/nxt/column/18/03775/092800015/","p":1794945600,"a":1794972226,"t":"Wi-Fi接続したロボット掃除機をスマホで遠隔操作、進入禁止エリアの設定も","su":"로봇 청소기는 등장 이래 큰 진화를 이룬 가전 중 하나. 당초는 벽에 부딪히거나 같은 장소를 반복 청소하거나 하는 등 효율이 나빴지만 최근 모델은 배치를 파악하고 원활하게 돌아다닐 수 있게 되었다. 특히 Wi-Fi 기능을 탑재한 로봇 청소기는 스마트폰에서 원격 조작이나 음성으로 지시할 수 있는 기종이 많다."},{"s":"TDK는 감지 및 수동 구성 요소를 통합하여 휴머노이드 로봇 솔루션을 만듭니다.","so":"DIGITIMES","tm":"11/18 04:15","c":1,"r":"tw","u":"https://www.digitimes.com.tw/tech/dt/n/shwnws.asp?id=0000774663_V6359RAQ7WGEXT2J7UCBW","p":1794942922,"a":1794955503,"t":"TDK整合感測與被動元件 打造人形機器人方案","su":"휴머노이드(사람을 닮은 로봇) 로봇 기술은 계속 발전하고 있지만 실제 현장 적용을 위해서는 자세 인식, 관절 제어 및 시스템 신뢰성과 같은 과제를 극복해야 하며 제한된 기관 공간 내에서 전력 소비, 열 방출 및 간섭 방지 기능을 고려해야 합니다. 협동 로봇 제조업체가 위의 기술적 문제를 극복할 수 있도록 TDK는 기존 센서, 능동 및 수동 구성 요소, 소프트웨어 알고리즘을 결합하여 일련의 휴머노이드 로봇 솔루션을 출시합니다."},{"s":"분위기: 중국 베이징에서 열린 세계 휴머노이드 로봇 게임의 로봇","so":"The Straits Times","tm":"11/18 04:09","c":1,"r":"us","u":"https://www.straitstimes.com/videos/6403947356112","p":1794942592,"a":1794955497,"t":"Mood: Robots at the World Humanoid Robot Games in Beijing, China","su":"The Straits Times - straitstimes.com에서 싱가포르, 아시아 및 기타 지역의 최신 속보, 비즈니스, 스포츠, 라이프스타일, 기술 및 멀티미디어 및 기타 뉴스를 받아보세요."},{"s":"Wang Xingxing: 로봇은 일반화의 임계점에 접근하고 있으며 생산 능력과 컴퓨팅 능력은 큰 시험에 직면해 있습니다.","so":"第一财经","tm":"11/17 23:36","c":1,"r":"cn","u":"https://www.yicai.com/video/103444274.html","p":1794926201,"a":1794927760,"t":"王兴兴：机器人逼近泛化临界点 产能与算力迎来大考"},{"s":"Dong Mingzhu는 Zhou Jian에게 소리쳤습니다. Gree는 10년 넘게 로봇을 개발해 왔으며 그것이 좋은 파트너가 될 것이라고 믿습니다. 원하시는 부품을 제공해드리겠습니다.","so":"ThePaper.cn","tm":"11/17 23:34","c":1,"r":"cn","u":"https://www.thepaper.cn/newsDetail_forward_34493465","p":1794926079,"a":1794927762,"t":"董明珠喊话优必选周剑：格力已经研发机器人十几年，相信会成为很好的合作伙伴，你要什么部件提供什么部件","su":"11월 17일 Dong Mingzhu는 APEC 비즈니스 리더 정상 회담에서 Zhou Jian이 선택되어야 한다고 발표했습니다. 그녀는 Gree가 10년 넘게 로봇을 개발해 왔으며 좋은 파트너가 될 것이라고 믿고 있다고 말했습니다. \"원하시는 부품을 제공해드리겠습니다.\""},{"s":"Congtai의 수주에는 내년 1분기에 스프린트 로봇, 무인 차량, 스마트 의료 등 신제품이 나올 예정이다.","so":"UDN","tm":"11/17 23:03","c":1,"r":"tw","u":"https://udn.com/news/story/7252/9885053","p":1794924215,"a":1794927766,"t":"聰泰訂單看到明年第1季 衝刺機器人、無人載具與智慧醫療等新品","su":"이미지 캡쳐카드 제조사 콩타이(5474)가 17일 역매수 실적(회사가 번 돈 성적표)설명회에 참석했다. Lin Hongpei 총책임자는 주문 가시성이 내년 1분기까지 연장되었으며 현재 주문 접수 상황은 양호하다고 말했습니다. 기존 이미지 캡쳐카드 외에도 로봇, 무인차량, 스마트 의료 등 기타 신규 애플리케이션과 신제품의 레이아웃도 확대해 내년 실적 성장을 낙관하고 있다."},{"s":"ETU의 피아노 연주 로봇은 53개의 손가락으로 정확하게 연주합니다. 음악에 대한 인간의 해석의 감정 표현을 대체하는 것은 여전히 어렵습니다.","so":"公視新聞","tm":"11/17 21:32","c":1,"r":"tw","u":"https://news.pts.org.tw/article/836180","p":1794918773,"a":1794921331,"t":"義大彈琴機器人以53指精準演奏 人類詮釋樂章流露情感仍難取代","su":"이탈리아가 53개의 손가락으로 피아노를 연주하고 같은 무대에서 인간 피아니스트와 경쟁할 수 있는 피아노 연주 휴머노이드(사람을 닮은 로봇) 로봇을 개발했습니다. 하지만 인간과 로봇의 가장 큰 차이점은 인간이 공연에 감정적 해석을 접목하고 관객과 소통할 수 있다는 점인데, 이는 로봇이 대체할 수 없는 부분이다."},{"s":"유비테크 CEO Zhou Jian: 휴머노이드 로봇이 아시아 태평양에 진출하는 길은 “하나의 도메인, 하나의 전략”이 될 것입니다","so":"21财经","tm":"11/17 20:30","c":1,"r":"cn","u":"https://www.21jingji.com/article/20261117/herald/f357d50e0437ad01778f036b9d611b7b.html","p":1794915000,"a":1794927764,"t":"优必选CEO周剑：人形机器人进入亚太的路径将是“一域一策”","su":"21세기 비즈니스 헤럴드 기자 Shi Enze가 선전에서 보도했습니다. 11월 17일, 2026년 아시아태평양경제협력체(APEC) 비즈니스 리더 정상회의가 선전에서 열렸습니다. 광둥-홍콩-마카오 그레이터 베이 지역 및 아시아 태평양 개발 기회 포럼에서 유비테크 설립자 겸 CEO인 Zhou Jian은 휴머노이드(사람을 닮은 로봇) 로봇이 아시아 태평양 경제에 진정으로 통합되기 위해서는 특정 시나리오 및 시나리오 데이터와 깊이 통합되어야 한다고 말했습니다. Greater Bay Area의 성숙한 공급망과 광둥, 홍콩, 마카오에 연결된 자본 및 과학 연구 자원은 이 프로세스를 위한 견고한 기반을 제공합니다. Zhou Jian은 휴머노이드 로봇과 임바디드 AI(로봇처럼 몸을 가진 인공지능)가 물리적 세계로 가속화되고 있다고 믿습니다. 그는 향후 20~30년 안에 휴머노이드 로봇이 용접, 스프레이, 자동차 조립 외에도 수많은 유연한 작업을 처리할 수 있다면 “글로벌 환경에 큰 변화가 있을 수 있다”고 예측합니다."}]}],"auto":{"🇰🇷 한국":["CNB뉴스","www.ebn.co.kr","국제뉴스","글로벌경제신문","뉴스락","더페어","데일리안","디지털데일리","매일일보","메트로신문","블루밍비트","서울경제TV","아시아투데이","아주경제","인공지능신문","파이낸셜포스트","한스경제"]},"breaking_url":"https://raw.githubusercontent.com/inwonc4524-code/Investment_NotiBot/main/breaking.json","show":8,"stats_url":"https://raw.githubusercontent.com/inwonc4524-code/Investment_NotiBot/main/stats.json","history_url":"https://raw.githubusercontent.com/inwonc4524-code/Investment_NotiBot/main/history.json"}</script>

function prepHist(){                       // 달 경계(배열 위치) 미리 계산
  if(!HI || !HI.s || !HI.end) return;
  HI.n = dIdx(HI.end) + 1; HI.months = []; HI.av = [];
  for(var i=0;i<HI.n;i++){ var ok = false;      // GDELT 자료가 있는 날 (서버가 멈춰 통째로 빠진 날은 false)
    for(var t in HI.s){ for(var k in HI.s[t]){ if(HI.s[t][k][i] != null){ ok = true; break; } } if(ok) break; }
    HI.av.push(ok); }
  var y = +HI.since.slice(0,4), m = +HI.since.slice(5,7), ey = +HI.end.slice(0,4), em = +HI.end.slice(5,7);
  while(y < ey || (y === ey && m <= em)){
    var a = dIdx(y+'-'+('0'+m).slice(-2)+'-01'), ny = m===12 ? y+1 : y, nm = m===12 ? 1 : m+1;
    var b = Math.min(HI.n, dIdx(ny+'-'+('0'+nm).slice(-2)+'-01'));
    HI.months.push({y:y, m:m, a:a, b:b, full: b - a === dIdx(ny+'-'+('0'+nm).slice(-2)+'-01') - a});
    y = ny; m = nm;
  }
}
function hsum(th, a, b, rk){               // [a, b) 날짜 칸의 합 (국가 필터 반영) · 자료 없는 날(null)은 건너뜀
  var s = (HI.s||{})[th] || {}, n = 0;
  for(var k in s){ if(rk ? k !== rk : !(S.region==='all' || k===S.region)) continue;
    var arr = s[k]; for(var i=Math.max(0,a); i<Math.min(b, arr.length); i++) if(arr[i] != null) n += arr[i]; }
  return n;
}
function avn(a, b){ var n=0; for(var i=Math.max(0,a); i<Math.min(b, HI.n); i++) if(HI.av[i]) n++; return n; }   // 자료 있는 날 수
function years(){ var a = [], y0 = +HI.since.slice(0,4), ty = +HI.end.slice(0,4); for(var y=ty-1; y>=y0; y--) a.push(y); return a; }   // 다 지난 해 (최근 먼저)
function pickYear(){ var ys = years(); return ys.indexOf(S.ly) >= 0 ? S.ly : (ys[0] || +HI.end.slice(0,4)); }
function lperiod(){                        // [이번 a,b] [비교 a,b 또는 null] 이름
  var M = HI.months, last = M[M.length-1], lf = last.full ? M.length-1 : M.length-2, ty = +HI.end.slice(0,4);
  if(S.lp === 'lm' && lf >= 0){ var x = M[lf], p = M[lf-1];
    return [[x.a, x.b], p ? [p.a, p.b] : null, x.y+'년 '+x.m+'월', '전달 대비']; }
  if(S.lp === 'ty'){ var a = dIdx(ty+'-01-01'), pa = dIdx((ty-1)+'-01-01'), len = HI.n - a;
    return [[a, HI.n], pa >= 0 ? [pa, pa+len] : null, ty+'년 (1월 1일~'+HI.end.slice(5).replace('-','/')+')', '작년 같은 기간 대비']; }
  if(S.lp === 'yr'){ var yy = pickYear(), ya = Math.max(0, dIdx(yy+'-01-01')), yb = Math.min(HI.n, dIdx((yy+1)+'-01-01')), pa = dIdx((yy-1)+'-01-01');
    return [[ya, yb], pa >= 0 ? [pa, ya] : null, yy+'년 전체', yy-1+'년 대비']; }
  return [[0, HI.n], null, HI.since.slice(0,7).replace('-','.')+' ~ '+HI.end.replace(/-/g,'.')+' 전체', ''];
}
function mspark(th){                       // 달별 흐름 (작은 선, 진행 중인 달은 빼고)
  var M = HI.months.filter(function(x){ return x.full; }), vals = M.map(function(x){ var d = avn(x.a, x.b); return d ? hsum(th, x.a, x.b)/d : 0; });
  if(vals.length < 2) return '';
  var mx = Math.max.apply(null, vals.concat([1])), w = 64, h = 20;
  var pts = vals.map(function(v,i){ return (i*(w/(vals.length-1))).toFixed(1)+','+(h-2-(v/mx)*(h-4)).toFixed(1); }).join(' ');
  return '<svg class="spark" viewBox="0 0 '+w+' '+h+'" width="'+w+'" height="'+h+'" aria-hidden="true"><polyline points="'+pts+'" fill="none" stroke="var(--acc)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></svg>';
}
function ldetail(th){                      // 달별 막대 + 나라별 구성
  var M = HI.months, dn = M.map(function(x){ return avn(x.a, x.b); });
  var vals = M.map(function(x, i){ return dn[i] ? hsum(th, x.a, x.b)/dn[i] : 0; });   // 하루 평균 (자료 빠진 날 영향 없게)
  var mx = Math.max.apply(null, vals.concat([1])), W = chartW(), H = 120, bw = W/M.length;
  var bars = vals.map(function(v,i){
    var x = M[i], bh = Math.max(v ? 2 : 0, (v/mx)*(H-32)), bx = i*bw + 1, y = H-14-bh;
    return '<g class="bar"><rect x="'+bx.toFixed(1)+'" y="0" width="'+(bw-2).toFixed(1)+'" height="'+(H-14)+'" fill="transparent"/>'+
      '<rect x="'+bx.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+(bw-2).toFixed(1)+'" height="'+bh.toFixed(1)+'" rx="2" fill="var(--acc)"'+(x.full?'':' opacity=".55"')+'/>'+
      '<title>'+x.y+'년 '+x.m+'월'+(x.full?'':' (진행 중)')+' · 하루 평균 '+Math.round(v).toLocaleString()+'건 · 한 달 '+hsum(th, x.a, x.b).toLocaleString()+'건'+
      (dn[i] < x.b - x.a ? ' (자료 '+dn[i]+'일치)' : '')+'</title></g>';
  }).join('');
  var ticks = M.map(function(x,i){ return x.m===1 ? '<line x1="'+(i*bw).toFixed(1)+'" y1="'+(H-14)+'" x2="'+(i*bw).toFixed(1)+'" y2="'+(H-9)+'" stroke="var(--sub)"/>'+
      '<text x="'+(i*bw+2).toFixed(1)+'" y="'+(H-1)+'" class="ax">'+x.y+'</text>' : ''; }).join('');
  var axis = ticks + '<line x1="0" y1="'+(H-14)+'" x2="'+W+'" y2="'+(H-14)+'" stroke="var(--line)"/>'+
             '<text x="0" y="9" class="ax">최대 하루 평균 '+Math.round(mx).toLocaleString()+'건</text>';
  var P = lperiod(), parts = D.regions.filter(function(r){ return (HI.regions||[]).indexOf(r.k) >= 0; }).map(function(r){
    return [r, hsum(th, P[0][0], P[0][1], r.k)]; }).filter(function(x){ return x[1] > 0; }).sort(function(a,b){ return b[1]-a[1]; });
  var pm = parts.length ? parts[0][1] : 1;
  var rows = parts.map(function(x){
    return '<div class="crow"><span class="cl">'+esc(x[0].l)+'</span><span class="cb"><i style="width:'+Math.max(2, x[1]/pm*100)+'%"></i></span><span class="cn">'+x[1].toLocaleString()+'</span></div>';
  }).join('') || '<div class="note">이 기간 기사 없음</div>';
  return '<div class="det"><div class="dt">달별 하루 평균 뉴스 수 ('+HI.since.slice(0,4)+'년 1월~)'+(S.region==='all'?'':' · '+esc(RL[S.region]))+'</div>'+
    '<svg class="bars" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(th)+' 달별 뉴스 수">'+bars+axis+'</svg>'+
    '<div class="dt">'+esc(P[2])+' 나라별</div>'+rows+'</div>';
}
function renderLong(h){
  if(!HI){ loadHist(); $('main').innerHTML = h + '<p class="none">장기 추이를 불러오는 중…</p>'; return; }
  if(HI.err || !HI.s || !HI.months || !HI.months.length){ $('main').innerHTML = h + '<p class="none">장기 추이를 아직 받는 중이에요. 처음 한 번은 몇 시간 걸려요. 조금 뒤에 다시 열어 주세요.</p>'; return; }
  if(S.region === 'world'){ $('main').innerHTML = h + '<p class="none">장기 추이는 나라별(한국·미국·중국·대만·홍콩·일본·싱가포르)로만 셀 수 있어요. 위에서 \'전체\'나 다른 나라를 골라 주세요.</p>'; return; }
  var P = lperiod();
  h += '<p class="note">GDELT(전 세계 뉴스 기록) 자료 · 본문에 테마 단어가 나온 기사 수 · 일주일에 한 번 갱신 · '+esc(HI.end.slice(5).replace('-','/'))+'까지 · 업데이트 '+esc(HI.updated||'')+'</p>';
  if(!HI.complete) h += '<div class="warn">⏳ '+HI.since.slice(0,4)+'년 1월부터 자료를 아직 받는 중이에요. 다 받기 전엔 일부 테마·나라·연도가 0이나 빈칸으로 보여요. 자료 서버가 느려서 하루쯤 걸려요 (봇이 알아서 이어 받음).</div>';
  h += '<div class="seg lp">' + [['all','전체'],['lm','지난달'],['ty','올해'],['yr','연도별']].map(function(x){
    return '<button data-lp="'+x[0]+'" class="'+(S.lp===x[0]?'on':'')+'">'+x[1]+'</button>'; }).join('') + '</div>';
  if(S.lp === 'yr') h += '<div class="seg ly">' + years().slice().reverse().map(function(y){   // 옛날 → 최근 순서로 (기본 선택은 최근 해)
    return '<button data-ly="'+y+'" class="'+(pickYear()===y?'on':'')+'">'+y+'</button>'; }).join('') + '</div>';
  var dc = avn(P[0][0], P[0][1]), dp = P[1] ? avn(P[1][0], P[1][1]) : 0, span = P[0][1] - P[0][0];
  if(span - dc > 0) h += '<div class="warn">ℹ️ 이 기간 중 '+(span-dc)+'일은 GDELT 서버 사정으로 자료가 비어 있어요 ('+span+'일 중 '+dc+'일치). 합계는 그만큼 적게 잡히고, ▲▼ 비교는 하루 평균끼리 해요.</div>';
  var rows = (HI.themes||[]).map(function(th){ return {th:th, n:hsum(th, P[0][0], P[0][1]), p: P[1] ? hsum(th, P[1][0], P[1][1]) : null}; })
                            .sort(byN);
  ranks(rows, !!P[1] && dp > 0);
  var mx = rows.length ? Math.max(1, rows[0].n) : 1, total = 0; rows.forEach(function(r){ total += r.n; });
  h += '<div class="tot">'+esc(P[2])+(S.region==='all'?' · 7개 나라':' · '+esc(RL[S.region]))+' · 총 <b>'+total.toLocaleString()+'</b>건 <span class="chgnote">'+(P[1]?'('+P[3]+')':'')+'</span></div>';
  h += rows.map(function(r, i){
    var open = S.open['L'+r.th];
    return '<div class="srow'+(open?' open':'')+'" data-th="'+esc(r.th)+'" data-l="1">'+
      '<div class="sline">'+mv(r, i)+'<span class="rk">'+(i+1)+'</span><span class="sn">'+esc(r.th)+'</span>'+
      '<span class="sb"><i style="width:'+Math.max(r.n?2:0, r.n/mx*100)+'%"></i></span>'+
      '<span class="sc">'+r.n.toLocaleString()+'</span>'+(r.p===null ? '<span class="chg"></span>' : chg(r.n, r.p, dc, dp))+mspark(r.th)+'</div>'+
      (open ? ldetail(r.th) : '') + '</div>';
  }).join('');
  h += '<footer>· 순위 왼쪽 <span style="color:#f87171">▲</span>/<span style="color:#60a5fa">▼</span> = 비교 기간(전달·작년 같은 기간·전년)보다 몇 계단 오르고 내렸는지<br>· 오른쪽 작은 선 = '+HI.since.slice(0,4)+'년 1월부터 달별 흐름(하루 평균), 줄을 누르면 달별 그래프와 나라별 구성<br>'+
       '· 일별 집계(기사 제목 기준, 구글 뉴스)와 세는 방법이 달라 숫자 크기는 서로 비교하지 말고 흐름만 보세요<br>'+
       '· 한국·중국·일본 기사도 GDELT 가 영어로 번역해 둔 것을 영어 검색어로 셉니다 · 자료가 빠진 날은 0이 아니라 빈칸으로 둠</footer>';
  $('main').innerHTML = h;
}
document.addEventListener('click', function(e){
  var b = e.target.closest('.seg.lp button');
  if(b){ S.lp = b.dataset.lp; save('lp', S.lp); renderMain(); return; }
  var yb = e.target.closest('.seg.ly button');
  if(yb){ S.ly = +yb.dataset.ly; save('ly', S.ly); renderMain(); return; }
  var m = e.target.closest('.seg.sm button');
  if(m){ S.sm = m.dataset.sm; save('sm', S.sm); renderMain(); return; }
}, true);

openTab(S.tab);
refreshBreaking();
setInterval(refreshBreaking, 5 * 60 * 1000);
document.addEventListener('visibilitychange', function(){ if(!document.hidden) refreshBreaking(); });

// 기사를 누르면 먼저 한국어 요약 → 원문 볼지 선택
document.addEventListener('click', function(e){
  var c = e.target.closest('a.card'); if(!c) return;
  if(e.ctrlKey||e.metaKey||e.shiftKey) return;
  e.preventDefault();
  $('s-meta').innerHTML = c.querySelector('.meta').innerHTML;
  $('s-title').textContent = c.querySelector('.title').textContent;
  var o = c.querySelector('.orig'); $('s-orig').textContent = o ? o.textContent : '';
  var sm = c.dataset.s || '';
  $('s-sum').textContent = sm || '이 기사는 요약을 가져오지 못했어요. (사이트가 자동 접속을 막았거나 아직 준비 중)';
  $('s-sum').className = 's-sum' + (sm ? '' : ' empty');
  $('s-go').href = c.href;
  // 외국어 기사면 ✦ Gemini 버튼 보이기 (한국어 기사는 숨김)
  var foreign = !!o || !/[가-힣]/.test(c.querySelector('.title').textContent);   // 번역이 안 됐어도 외국 기사면 버튼 표시
  $('s-cs').hidden = $('s-ct').hidden = $('s-cnote').hidden = !foreign;
  if(foreign){
    // 원문을 열고, Gemini 가 '지금 화면'의 기사를 읽고 답하도록 요청 문장만 복사
    $('s-cs').href = $('s-ct').href = c.href;
    $('s-cs').dataset.q = '이 페이지의 기사 전체를 처음부터 끝까지 읽고 한국어로 요약해 줘. 핵심 내용 3~5줄, 그리고 투자자 입장에서 중요한 숫자와 의미를 짧게 정리해 줘.';
    $('s-ct').dataset.q = "너는 어려운 경제 뉴스를 초등학생도 이해할 수 있게 풀어 주는 친절한 번역가야.\n이 페이지의 뉴스 기사 전체를 쉬운 한국어로 번역해 줘.\n\n[가장 중요한 규칙]\n- 쉽게 쓰더라도 기사 내용은 정확해야 해. 사실을 빼거나, 바꾸거나, 지어내지 마.\n- 기사 순서대로, 빠지는 내용 없이 번역해 줘.\n\n[쉽게 쓰는 방법]\n1. 한 문장에는 한 가지 내용만 써 줘. 문장은 짧게.\n2. \"~습니다/~해요\"체로 친절하게 써 줘.\n3. 어려운 말은 쉬운 말로 바꾸고, 꼭 필요한 전문 용어는 처음 나올 때 괄호로 뜻을 풀어 줘.\n   (예: 금리(돈을 빌릴 때 내는 이자의 비율), 실적(회사가 번 돈과 성과), 주가(회사 주식 한 주의 가격))\n4. 한자어·외래어보다 쉬운 우리말을 먼저 써 줘. (예: 하락 → 떨어졌어요, 상승 → 올랐어요)\n5. 큰 숫자는 읽기 쉽게 바꾸되 정확한 값은 지켜 줘. (예: $2.5 billion → 25억 달러(약 3조 5천억 원쯤))\n   환율로 바꾼 값은 \"약\"을 붙여서 대략이라는 걸 알려 줘.\n6. 회사·사람 이름은 한국에서 부르는 이름으로 쓰고, 처음 나올 때만 괄호에 영어 이름을 적어 줘. (예: 엔비디아(Nvidia))\n7. 누가 한 말인지 분명하게 써 줘. (예: 젠슨 황 대표는 \"…\"라고 말했어요.)\n\n[출력 형식]\n① 한 줄 요약: 이 기사가 무슨 이야기인지 한 문장으로\n② 쉬운 번역: 기사 순서대로\n③ 어려운 말 풀이: 기사에 나온 경제 용어 3~5개를 한 줄씩 쉽게 설명\n④ 그래서 무슨 뜻이야?: 이 소식이 주식 투자하는 사람에게 왜 중요한지 2~3줄\n   (기사에 나온 사실만 근거로, 내 생각이나 예측은 넣지 마)\n\n기사가 길어서 한 번에 다 못 하면, 어디까지 했는지 알려 주고 내가 \"계속\"이라고 하면 이어서 해 줘.";
  }
  $('dim').hidden = false; $('sheet').hidden = false; $('sheet').scrollTop = 0;
  document.body.style.overflow = 'hidden';
});
// ✦ 버튼: Gemini 요청 문장을 복사하고 원문을 엶 → 원문 화면에서 Gemini 를 불러 붙여넣기
function askAI(a){
  var q = a.dataset.q || '';
  try { if(navigator.clipboard) navigator.clipboard.writeText(q); } catch(e){}
  toast('요청 문장을 복사했어요 · 원문에서 측면 버튼 길게 → 「이 페이지에 관해 질문하기」 → 붙여넣기');
  setTimeout(closeSheet, 50);
}
function toast(msg){ var t = $('toast'); t.textContent = msg; t.hidden = false; clearTimeout(toast._t); toast._t = setTimeout(function(){ t.hidden = true; }, 4000); }
function closeSheet(){ $('dim').hidden = true; $('sheet').hidden = true; document.body.style.overflow = ''; }
document.addEventListener('keydown', function(e){ if(e.key==='Escape') closeSheet(); });
