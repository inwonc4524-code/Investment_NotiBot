oc=5","p":1794883020,"a":1794885906,"t":"特高压外送迎首个万亿级省区！电网设备板块大爆发，摩恩电气涨停"},{"s":"'본토 주식 시장' 3대 지수 모두 하락, 전력망 장비, 칩 산업이 추세를 거스르고 강세를 보임 - 국제","so":"旺得富理財網","tm":"11/17 11:09","c":1,"r":"tw","u":"https://wantrich.chinatimes.com/news/20261117900103-420201","p":1794881360,"a":1794885910,"t":"《大陸股市》三大指數齊跌電網設備、芯片產業逆勢走強- 國際","su":"[타임즈-타이베이] 중국 본토 증시가 17일 개장했다. 3개 주요 지수가 종합적으로 하락세로 출발했습니다. 상하이증권거래소지수는 0.87% 하락한 3571.284포인트를 기록했다. 선전 구성요소 지수는 1.00% 하락한 10583.863포인트를 기록했습니다. ChiNext 지수는 1.28% 하락한 2290.214포인트를 기록했습니다. 업종 테마별로는 게임 업종이 대성문화(Dasheng Culture)와 디안훈 네트워크(Dianhun Network)가 하락세를 기록하는 등 급락세를 보였고, 시저스 컬처(Caesars Culture), 중칭바오(Zhongqingbao), 바오통테크놀로지(Baotong Technology)도 뒤를 이었다. 영화 및 TV 극장 부문은 문화 투자 홀딩스..."},{"s":"AIDC \"에너지 효율성 전투\": ZTE가 컴퓨팅 성능 \"에너지 기반\"을 재구성하는 방법","so":"經濟日報","tm":"11/17 11:00","c":1,"r":"tw","u":"https://money.udn.com/money/story/123828/9883215","p":1794880842,"a":1794885915,"t":"AIDC「能效之戰」：中興通訊如何重構算力「能量底座」","su":"선전, 2026년 11월 17일 /PRNewswire/ -- 단일 캐비닛의 전력 소비가 10kW에서 600kW로 급증하면 기존 데이터 센터의 전원 공급 장치 및 냉각 로직으로는 더 이상 충분하지 않습니다. AI 컴퓨팅 성능의 급속한 확장에 직면한 ZTE의 대답은 점진적인 업그레이드가 아니라 AIDC의 '에너지 기반'을 체계적으로 재구성하는 것입니다. AIDC \"에너지 효율성 전투\": ZTE가 컴퓨팅 성능의 \"에너지 기반\"을 재구성하는 방법. 컴퓨팅 능력은 폭발적으로 발전하고 있으며 전기는 \"희소한 자원\"이 되었습니다. 인공지능 시대를 맞이하여 컴퓨팅 파워에 대한 수요가 폭발적으로 증가하고 있습니다. 통계청에 따르면 2025년 말 기준 전국에서 사용 중인 컴퓨팅 파워 시설 랙 수는 표준 랙 1,373만 개를 넘어섰고, 완카 지능형 컴퓨팅 클러스터는 42개 구축됐으며, 지능형 컴퓨팅 파워 규모는 159만 PFLOPS에 달해 세계 2위를 기록했다. 2026년에도 이러한 성장 모멘텀(값이 움직이는 기세)은 줄어들지 않고 계속됩니다. 7월 말 현재 국가 지능형 컴퓨팅의 총 규모는 245만 PFLOPS에 도달했습니다. 컴퓨팅 파워의 급증으로 인한 피할 수 없는 결과는 컴퓨팅 파워 센터의 전력 소비가 급격히 증가한다는 것입니다. 국가에너지청(National Energy Administration)의 관련 데이터에 따르면 전국 컴퓨팅 파워 센터의 총 전력 소비량은 2025년에 1,700억 킬로와트시에 도달하여 사회 총 전력 소비량의 1.6%를 차지할 것으로 예상됩니다. 2030년까지 컴퓨팅 파워 센터의 전력 소비 규모는 8000억 킬로와트를 초과할 것으로 예상됩니다."},{"s":"효성중공업, 영등포 문래동3가 '해링턴 플레이스 문래' 20일 견본주택 개관","so":"뉴스핌","tm":"11/17 10:35","c":1,"r":"kr","u":"https://www.newspim.com/news/view/20261117000478","p":1794879300,"a":1794885899,"su":"[서울=뉴스핌] 오경진 기자 = 효성중공업이 서울특별시 영등포구 문래동3가 일원에 시공하는 공동주택 단지 &apos;해링턴 플레이스 문래&apos;가 오는 20일 견본주택을 개관하고 일반분양 공고에 따른 입주자 모집 절차를 진행한다.[사진=해링턴 플레이스 문래"},{"s":"글로벌 원전기업 경남 집결…SMR 국제 콘퍼런스 개막","so":"연합뉴스","tm":"11/17 10:15","c":1,"r":"kr","u":"https://www.yna.co.kr/view/AKR20261117029000052","p":1794878100,"a":1794885899,"su":"(창원=연합뉴스) 이정훈 기자 = 글로벌 소형모듈원자로(SMR) 기업들이 원자력산업 중심지 경남에 대거 모였다."},{"s":"월스트리트가 데이터 센터를 철수하고 전력 주식에 관한 약 6,400개의 문서에서 자본 개편이 드러났습니다 - 국제","so":"工商時報","tm":"11/17 10:01","c":1,"r":"tw","u":"https://news.google.com/rss/articles/CBMiX0FVX3lxTE81X0tMLVM5NDEtY2xkU1V5S0VkbTN2YWFONUkzU19hdmFIb3dwZGdfeE5hRGl2cWdBMlJ5UWZZbzJaT2RrdkZlT1VFcm1qOVNrREtzclNDNVptdzdSaENZ?oc=5","p":1794877260,"a":1794885919,"t":"華爾街大舉撤出資料中心、電力股近6400份文件揭資金大洗牌- 國際"},{"s":"전력기기/풍력 (Positive)","so":"한국경제","tm":"11/17 08:52","c":1,"r":"kr","u":"https://www.hankyung.com/koreamarket/consensus/pdf/2026-11-744e70f05dd9b2874e2e9cafc3e33b5b","p":1794873130,"a":1794874181},{"s":"HSBC, 3억 달러 부실 데이터센터 대출 할인 판매","so":"Bloomberg.com","tm":"11/17 07:01","c":1,"r":"us","u":"https://www.bloomberg.com/news/articles/2026-11-16/hsbc-sold-300-million-troubled-data-center-loan-at-discount","p":1794866487,"a":1794869078,"t":"HSBC Sold $300 Million Troubled Data Center Loan at Discount"},{"s":"타이파워: AI 데이터센터 전용 구역 계획해야","so":"自由時報","tm":"11/17 06:30","c":1,"r":"tw","u":"https://news.ltn.com.tw/news/life/paper/1778766","p":1794864600,"a":1794869083,"t":"台電：AI資料中心應規劃專區","su":"AI 산업은 우리나라의 경제 발전을 주도하고 있으며 대만도 전력 문제에 직면해 있습니다. 특히, 다량의 전력을 소비하는 AI 데이터센터(컴퓨터 수만 대를 모아 둔 건물) 구축으로 인해 타이파워는 향후 전국 전력 소비량이 연간 2%씩 증가할 것으로 추정하고 있다. 5~4%에 달하는 Taipower 부사장 Zheng Qinghong은 AI 데이터 센터에 필요한 것은 마이크로그리드이며 자체 전원 공급 장치와 에너지 저장 장치도 제공해야 하며 컴퓨팅 성능도 보다 적절하게 관리해야 한다고 말했습니다. 최근 유럽과 미국에서도 AI 데이터센터 구축에 반발이 시작됐다. 이는 주로 지역 전기 가격 때문입니다. AI 데이터센터의 높은 전력 소비로 인해 지역 전력 가격이 상승했다. 국민들의 상대적 박탈감은 높아졌고, AI 데이터센터 구축에 대한 불만도 높아졌다."},{"s":"Macquarie, Capex Super Cycle 속에서 데이터 센터의 활기를 경고","so":"Bloomberg.com","tm":"11/17 04:00","c":1,"r":"us","u":"https://www.bloomberg.com/news/articles/2026-11-16/macquarie-warns-of-data-center-exuberance-amid-capex-super-cycle","p":1794855600,"a":1794874182,"t":"Macquarie Warns of Data Center Exuberance Amid Capex Super Cycle"},{"s":"가장 빠른 새로운 용량은 이미 보유하고 있는 그리드입니다","so":"POWER Magazine","tm":"11/17 03:20","c":1,"r":"us","u":"https://www.powermag.com/the-fastest-new-capacity-is-the-grid-you-already-have/","p":1794853216,"a":1794869079,"t":"The Fastest New Capacity Is the Grid You Already Have","su":"그리드 활용 규칙, 유연한 상호 연결 및 고급 전송 기술은 새로운 라인을 구축하는 것보다 더 빠르게 유휴 용량을 확보할 수 있습니다."},{"s":"일본 유틸리티, PJM을 지원하는 버지니아 BESS 프로젝트 지분 인수","so":"POWER Magazine","tm":"11/17 01:51","c":1,"r":"us","u":"https://www.powermag.com/japanese-utility-takes-stake-in-virginia-bess-project-serving-pjm/","p":1794847905,"a":1794869081,"t":"Japanese Utility Takes Stake in Virginia BESS Project Serving PJM","su":"일본 오사카에 본사를 둔 간사이 전력(Kansai Electric Power)은 150MW/600MWh 배터리 에너지 저장 장치인 Prospect Power Storage의 소수 지분(회사를 나눠 가진 몫)을 인수했습니다."},{"s":"기본 부하를 넘어서: 유연한 가스 생성이 재생 가능 전력망의 중추가 되는 이유","so":"POWER Magazine","tm":"11/17 00:24","c":1,"r":"us","u":"https://www.powermag.com/webinars/beyond-baseload-why-flexible-gas-generation-is-becoming-the-backbone-of-the-renewable-grid/","p":1794842687,"a":1794869082,"t":"Beyond Baseload: Why Flexible Gas Generation Is Becoming the Backbone of the Renewable Grid"},{"s":"독점: 올 겨울 우크라이나의 원자력 사고 위험이 증가한다고 원자력 안전 규제 기관이 밝혔습니다.","so":"Reuters","tm":"11/16 23:08","c":1,"r":"us","u":"https://www.reuters.com/business/energy/risk-nuclear-accident-ukraine-increasing-this-winter-atomic-safety-regulators-2026-11-16/","p":1794838085,"a":1794885902,"t":"EXCLUSIVE: Risk of nuclear accident in Ukraine increasing this winter, atomic safety regulators say"},{"s":"중동 AI 데이터센터, 전력 공급 병목 현상에 직면하다! 변압기 배송에 최대 4년이 소요되어 사우디아라비아가 2030년 재생 에너지 목표를 달성하기가 어렵습니다.","so":"鉅亨網","tm":"11/16 22:00","c":1,"r":"tw","u":"https://news.cnyes.com/news/id/6664275","p":1794834011,"a":1794834739,"t":"中東AI資料中心搶電遇瓶頸！變壓器交期長達4年沙國2030年再生能源目標恐難達成","su":"중동 AI 데이터센터(컴퓨터 수만 대를 모아 둔 건물), 전력 공급 병목 현상에 직면하다! 변압기 납품 기간은 최장 4년으로, 사우디아라비아의 2030년 재생에너지 목표는 달성하기 어려울 수 있다. 유애널라이즈 2026년 11월 16일 (유애널라이즈/산업데이터센터 보고서) ⸺ 중동 국가들이 AI 데이터센터와 신재생에너지에 대한 투자를 가속화하고 있지만, 전력기기 납품 시간이 건설 병목 현상이 되고 있다. 연구기관인 글로벌인피니티랩스는 사우디아라비아의 초고압 변압기 납품 기간이 최대 3~4년이라고 지적했다. 발전소 자금이 마련되더라도 장비가 예정대로 배송되지 않을 수 있으며, 이로 인해 새로운 전력이 그리드에 연결되는 시간이 느려질 수 있습니다. 사우디아라비아는 2030년 재생에너지 설비용량을 130GW로 늘릴 계획이지만, 2025년 말 기준 실제 가동용량은 12.3GW에 불과해 목표에 비해 117.7GW가 부족하다. 예정대로 목표를 달성하려면 향후 5년 동안 매년 평균 23.5GW를 추가해야 하는데, 이는 현재 건설 속도보다 훨씬 높은 수준이다."},{"s":"블랙스톤 REIT, 50억 달러 규모의 거래로 아마존 데이터 센터 구매","so":"Bloomberg.com","tm":"11/16 20:53","c":1,"r":"us","u":"https://www.bloomberg.com/news/articles/2026-11-16/blackstone-reit-to-buy-amazon-data-centers-in-5-billion-deal","p":1794830037,"a":1794834737,"t":"Blackstone REIT to Buy Amazon Data Centers in $5 Billion Deal"},{"s":"태국 푸켓의 유명 관광지에서 치명적인 화재가 발생해 수십명이 숨졌고, 오토바이 바닥에 있던 변압기가 폭발한 것으로 추정된다(키티양 제보)","so":"Now 新聞","tm":"11/16 20:20","c":1,"r":"hk","u":"https://news.now.com/home/international/player?newsId=669785&home=1","p":1794828039,"a":1794830464,"t":"泰國布吉知名遊客區致命火釀幾十人死傷 疑電單車地舖變壓器爆炸導致（楊潔儀報道）","su":"[나우뉴스채널] 이른 아침, 태국 푸켓의 유명 관광지 빠통에서 대여 오토바이 바닥에서 화재가 발생했습니다. 이는 위층 주거지로 퍼져 최소 11명이 사망하고 연기 흡입으로 사망한 것으로 추정되며 12명이 부상을 입었다. 당국은 처음에 화재가 변압기 폭발로 인해 발생한 것으로 의심했습니다."},{"s":"친핵은 재가동의 3대 원칙을 말한다. 원전을 반대한다고 해서 바로 가동할 수 있는 것은 아니다 | 정치","so":"中央社 CNA","tm":"11/16 20:20","c":1,"r":"tw","u":"https://www.cna.com.tw/news/aipl/202611160178.aspx","p":1794828000,"a":1794830458,"t":"擁核指重啟3原則已具備反核批核電廠不是說開就開| 政治","su":"중앙선거관리위원회가 비핵 조국폐지 국민투표 제3차 의견회의를 개최한다. 긍정적인 측면은 대만이 이미 원전 재가동을 위한 3대 원칙을 갖고 있고, 원전을 폐쇄하면 천연가스 사용량이 늘어날 것이라는 점이다. 부정적인 측면에서는 원전이 대규모 이동식 전력원이 아니고 마음대로 켜지지 않는다는 점을 비판한다."},{"s":"Box2Bit은 150MW 그리드 연결을 블랙스톤으로 이전하고 Épila를 종료합니다.","so":"Data Center Dynamics","tm":"11/16 19:48","c":1,"r":"world","u":"https://www.datacenterdynamics.com/en/news/box2bit-sells-150-mw-to-blackstone-and-lets-epila-take-the-lead-in-aragon/","p":1794826132,"a":1794869084,"t":"Box2Bit transfers 150MW grid connection to Blackstone and exits Épila","su":"Capital Energy의 자회사인 Box2Bit이 스페인 Epilon 데이터 센터 프로젝트에서 철수했습니다. 회사는 이 프로젝트를 위해 확보한 150MW의 그리드 연결 용량을 블랙스톤에 판매하고 있습니다. 아라곤 정부는 2026년 초에 이 프로젝트가 대중의 관심을 끌 것이라고 선언했으며, 1단계는 2029년에 가동될 예정입니다."},{"s":"AI 데이터 센터 및 전력망에 대한 투자로 구리 수요 증가 골드만삭스는 2027년 말까지 구리 가격이 상승할 가능성을 13%로 보고 있습니다.","so":"鉅亨網","tm":"11/16 19:30","c":1,"r":"tw","u":"https://news.cnyes.com/news/id/6664079","p":1794825004,"a":1794830460,"t":"AI資料中心與電網投資推升銅需求高盛看2027年底銅價有13%上漲空間","su":"AI 데이터 센터 및 전력망에 대한 투자는 구리 수요를 증가시킵니다. 골드만삭스는 2027년 말까지 구리 가격이 13% 상승할 여지가 있다고 봅니다. Uanalyze 2026년 11월 16일(Uanalyze/산업 데이터 센터 보고) ⸺ AI 데이터 센터 및 전력 인프라에 대한 투자가 계속 증가하여 전 세계 구리 수요 증가를 주도하지만, 광산 생산량을 동시에 확장하기는 어렵습니다. 골드만삭스(GS-US)는 런던금속거래소(LME) 구리 가격이 2027년 12월까지 미터톤당 미화 15,600달러까지 오를 것이라고 예측했는데, 이는 주로 공급 제약과 수요 증가로 인한 가격 지지에 대해 낙관적이었습니다. LME 3개월 구리 선물(미래 값을 미리 정해 사고파는 거래)은 11월 13일 미터톤당 $13,399에 마감되었습니다. 골드만삭스의 예상 목표는 당시 현물 가격보다 약 13% 높습니다."},{"s":"닛신 전기가 마에바시에 신공장, 변전소용 부품 제조 전력 수요 전망 능력 증강","so":"日本経済新聞","tm":"11/16 18:30","c":1,"r":"jp","u":"https://www.nikkei.com/article/DGXZQOCC163BT0W6A111C2000000/","p":1794821446,"a":1794830465,"t":"日新電機が前橋に新工場、変電所向け部品製造 電力需要見据え能力増強","su":"닛신전기(교토시)는 16일, 마에바시 제작소(마에바시시) 내에 건설하는 공장의 안전 기원제를 열었다. 변전소 등에 대한 절연장치 부품의 생산성을 높이기 위해 45억엔을 들여 기존 공장의 개수와 용접공장의 건설을 추진한다. 인공지능(AI)의 보급에 따른 데이터센터(컴퓨터 수만 대를 모아 둔 건물)의 가동에 따른 전력수요의 고조를 내다보고 생산능력을 늘린다. 용접공장 완성은 2027년 12월을 전망한다. 신설하는 용접공장의 바닥면적은 약 4930제곱미터. 수변전 설비의"},{"s":"아시아 데이터 센터 대출 신디케이션이 희귀 거래 일시 중지로 지연됨","so":"Bloomberg.com","tm":"11/16 18:04","c":1,"r":"us","u":"https://www.bloomberg.com/news/articles/2026-11-16/asian-data-center-loan-syndication-is-delayed-in-rare-deal-pause","p":1794819862,"a":1794874183,"t":"Asian Data Center Loan Syndication Is Delayed in Rare Deal Pause"},{"s":"노르웨이의 데이터 센터 장비, 자동차 수입 기록 기록","so":"Bloomberg.com","tm":"11/16 17:55","c":1,"r":"us","u":"https://www.bloomberg.com/news/articles/2026-11-16/norway-s-imports-hit-record-on-data-center-equipment-cars","p":1794819327,"a":1794830455,"t":"Norway’s Imports Hit Record on Data Center Equipment, Cars"},{"s":"Kangshu Supercomputing은 고밀도 컴퓨팅 성능 레이아웃을 향상시키는 다양한 액체 냉각 솔루션을 선보입니다.","so":"經濟日報","tm":"11/16 17:01","c":1,"r":"tw","u":"https://money.udn.com/money/story/5612/9881959","p":1794816076,"a":1794830462,"t":"康舒 Supercomputing 展出多元液冷解決方案強化高密度運算電力布局","su":"전원공급장치 제조사 강슈(6282)가 11월 17일부터 19일까지 미국 시카고에서 열리는 슈퍼컴퓨팅 2026(Supercomputing 2026)에 참가한다. 지난 10월 OCP 글로벌 서밋에서 선보인 업계 최고의 고전력 밀도 전원 공급 장치 기술을 이어가는 것 외에도 이번에는 수냉식 플레이트와 유전체 액체 냉각 기술을 결합한 전원 공급 장치 제품을 추가로 선보일 예정이며, AI 및 고성능 컴퓨팅(HPC) 시스템의 증가하는 전원 공급 장치 및 냉각 요구 사항에 대처하기 위해 전력 변환, 배전, 열 관리 분야에서 회사의 통합 설계 역량을 입증할 예정입니다."},{"s":"AI 전력 수요에 날개 단 LS…3Q 영업익 4882억 90% 증가","so":"뉴스1","tm":"11/16 16:22","c":1,"r":"kr","u":"https://www.news1.kr/industry/general-industry/6355657","p":1794813752,"a":1794830454},{"s":"중부 전력 PG, 철탑 작업자의 구조 훈련 현지 소방과 조립 시간 단축 목표","so":"日本経済新聞","tm":"11/16 15:22","c":1,"r":"jp","u":"https://www.nikkei.com/article/DGXZQOFD163U30W6A111C2000000/","p":1794810152,"a":1794812220,"t":"中部電力PG、鉄塔作業者の救助訓練 地元消防と組み時間短縮目指す","su":"중부전력 송배전자회사인 중부전력 파워그리드(PG)는 16일 아이치현 히진시에서 철탑 공사 고소 작업자를 구조하는 훈련을 현지 소방으로 열었다. 감전 위험을 피하면서 신속하게 구조할 수 있도록 과제를 정리. 직장의 안전성을 높여 인재 확보로 연결한다. 중부 전력 PG의 연수 시설 내에 있는 철탑을 본뜬 구조물로, 높이 약 15미터의 장소에서 작업자가 감전이나 급병으로 움직일 수 없게 되었다고 상정. 닛신시나 토요아키시 등을 관할하는 오미소방 조합의 오미소"},{"s":"한전 'AI 전력설비 고장분석' 교육, 공공 HRD 콘테스트 대통령상","so":"파이낸셜뉴스","tm":"11/16 14:35","c":1,"r":"kr","u":"https://www.fnnews.com/news/202611161434110593","p":1794807316,"a":1794809555,"su":"한국전력은 지난 11~12일 국가공무원인재개발원 주최로 열린 '2026 공공 HRD 콘테스트' 교육과정 분야에서 대통령상을 받았다고 16일 밝혔다. 올해 44회째인 이 대회는 교수학습, 교육과정, 연구개발 3개 분야로 나뉜다."},{"s":"HD현대, '발전부터 전력망까지' 북미 에너지시장 공략","so":"연합뉴스","tm":"11/16 11:53","c":1,"r":"kr","u":"https://www.yna.co.kr/view/AKR20261116082400003","p":1794797606,"a":1794806461,"su":"(서울=연합뉴스) 김윤구 기자 = HD현대[267250]가 태양광 발전과 배터리에너지저장장치(BESS(전기를 저장해 두는 큰 배터리)), 전력기기 기술을 앞세워 북미 에너지 시..."},{"s":"LS일렉트릭, 9380만 달러 규모 미국 AI 계약 성사","so":"Korea JoongAng Daily","tm":"11/16 11:24","c":1,"r":"us","u":"https://www.koreajoongangdaily.com/business/ls-electric-lands-938-million-us-ai-deal/12974394","p":1794795858,"a":1794830456,"t":"LS Electric lands $93.8 million U.S. AI deal","su":"한국 회사는 미국의 주요 AI 데이터 센터 확장을 위한 고전압 및 저전압 배전 시스템을 공급할 예정입니다."},{"s":"블록체인 개발 및 충전, 마이크로그리드 레이아웃 | 핫 하이라이트 | 사업정보","so":"經濟日報","tm":"11/16 11:04","c":1,"r":"tw","u":"https://money.udn.com/money/story/5635/9880824?from=edn_subcatelist_cate","p":1794794665,"a":1794795164,"t":"區塊證發展充電 布局微電網 | 熱門亮點 | 商情","su":"블록체인 기술은 충전 및 마이크로그리드를 배치하고, 프랜차이즈 관리를 개선하기 위해 \"Ajin AI\" 시스템을 출시하며, California Energy 및 Weiqian Technology와 협력하여 EMS 표준의 상호 운용성을 촉진하기 위한 재해 예방 및 커뮤니티 마이크로그리드를 개발합니다."},{"s":"LS일렉트릭, 美 AI 데이터센터 전력장비 1300억원 수주 - 36Kr","so":"www.36kr.com","tm":"11/16 10:53","c":1,"r":"cn","u":"https://www.36kr.com/newsflashes/4071729157641095","p":1794794007,"a":1794797360,"t":"韩国LS电气斩获1300亿韩元美国AI数据中心电力设备订单-36氪","su":"회사 성명에 따르면 LS일렉트릭은 미국 내 하이퍼스케일 AI 데이터센터(컴퓨터 수만 대를 모아 둔 건물)용 배전 시스템 공급을 위해 글로벌 대형 기술기업으로부터 약 1300억원 규모의 수주(일감 주문을 받는 것)를 받았다. 이 회사는 데이터센터에 38킬로볼트(kV) 고전압 및 저전압 스위치기어를 공급할 예정이다. LS일렉트릭은 이 사업 초기부터 참여해 이번 증설사업에도 재수주했다. 회사는 최근 또 다른 대형 기술업체와 장기공급계약을 체결했으며, 사업 규모를 지속적으로 확대해 나갈 계획이라고 밝혔다. (시나파이낸스)"},{"s":"LS일렉트릭, 미국서 AI 데이터센터 전력시스템 9383만달러 수주","so":"Yonhap News Agency","tm":"11/16 09:50","c":1,"r":"us","u":"https://en.yna.co.kr/view/AEN20261116002700320","p":1794790209,"a":1794792480,"t":"LS Electric wins US$93.83 mln order for AI data center power systems in U.S.","su":"서울, 11월 16일(연합) -- LS일렉트릭(LS Electric Co.)은 9,383만 달러 규모의 계약을 체결했다고 16일 밝혔다...."},{"s":"LS일렉트릭, 美 빅테크에 AI 전력설비 공급…1300억 추가 수주 - 머니투데이","so":"머니투데이","tm":"11/16 09:38","c":1,"r":"kr","u":"https://www.mt.co.kr/industry/2026/11/16/2026111609124644288","p":1794789537,"a":1794792480,"su":"LS ELECTRIC(일렉트릭)이 미국 글로벌 빅테크 기업의 하이퍼스케일 AI(인공지능) 데이터센터(컴퓨터 수만 대를 모아 둔 건물) 전력 인프라 사업을 추가 수주(일감 주문을 받는 것)했다. 해당 빅테크 고객이 현지에서 추진 중인 대형 데이터센터 프로젝트 초기 단계부터 참여한 이후 확장 사업까지 고압 배전반 물량을 확보했다."},{"s":"중국과 티베트가 내려다보이는 곳 | 나그취(Nagqu)의 고지대 3개 현에서 태양광발전소 가동, 전력 불안정에 작별 인사","so":"TVB","tm":"11/16 09:00","c":1,"r":"hk","u":"https://news.tvb.com/tc/1206208-%E4%BF%AF%E7%9E%B0%E7%A5%9E%E5%B7%9E%E8%A5%BF%E8%97%8F%E9%82%A3%E6%9B%B2%E9%AB%98%E6%B5%B7%E6%8B%94%E4%B8%89%E7%B8%A3%E5%85%89%E4%BC%8F%E6%8A%95%E9%81%8B%E5%91%8A%E5%88%A5%E9%9B%BB%E5%8A%9B%E4%B8%8D%E7%A9%A9","p":1794787200,"a":1794789745,"t":"俯瞰神州‧西藏｜那曲高海拔三縣光伏投運 告別電力不穩","su":"최근 티베트 나그쿠(Nagqu)의 3개 고지대 태양광 프로젝트가 완료되어 지역 주민들에게 보다 안정적인 녹색 전력 공급을 제공하고 있습니다. Shuanghu, Bangor 및 Rui 카운티는 과거의 극심한 기후로 인한 전력 불안정에 작별을 고할 것이며 안정적인 녹색 전력으로 난방, 의료, 교육 등 사람들의 생계 요구를 계속 충족할 것입니다. Shuanghu 태양광 발전소가 연간 발전량 1,559만kWh로 가동됩니다. 솽후(雙湖)현은 해발 약 5,000m로 중국에서 해발이 가장 높은 현이다. 새로운 10MW 태양광 발전소는 16,000개 이상의 발전소로 구성됩니다..."},{"s":"북미 데이터 센터 전력 부족이 거의 두 배로 늘었고, 마이크로그리드는 전력 칩에 대한 기회의 창을 촉발했습니다.","so":"DIGITIMES","tm":"11/16 03:18","c":1,"r":"tw","u":"https://www.digitimes.com.tw/tech/dt/n/shwnws.asp?id=774736","p":1794766680,"a":1794784884,"t":"北美資料中心電力缺口近1倍 微電網激起功率晶片機會之窗","su":"AI 데이터센터(컴퓨터 수만 대를 모아 둔 건물)의 확장 속도는 '전원 공급'의 상한선에 도달했다. 이는 현재 업계 컨센서스(전문가들의 평균 예상)일 뿐만 아니라, 2026 SEMICON 유로파 시장트렌드포럼에서도 뜨겁게 논의된 주제입니다."},{"s":"전 세계가 AI 데이터센터 구축을 서두르고 있는데, 국내 반발은 왜 이렇게 많은 걸까요? 문제는 물과 전기의 부족뿐만 아니라 그 뒤에 숨은 선형적 사고에도 있습니다.","so":"獨立評論@天下","tm":"11/16 01:00","c":1,"r":"tw","u":"https://opinion.cw.com.tw/blog/profile/584/article/17973","p":1794758400,"a":1794806466,"t":"全球搶蓋 AI 資料中心，為何地方反彈聲四起？問題不只缺水缺電，更在背後的線性思維"},{"s":"AI 데이터 센터 전력 및 냉각 구축에 편승하는 미국 주식 3개","so":"Yahoo Finance","tm":"11/15 22:07","c":1,"r":"us","u":"https://finance.yahoo.com/markets/stocks/articles/3-us-stocks-riding-ai-130750054.html","p":1794748070,"a":1794751351,"t":"3 US Stocks Riding The AI Data Center Power And Cooling Buildout","su":"AI는 컴퓨팅과 성능을 통해 불타오르고 있으며, 앤트로픽 IPO(초기 공모), 엔비디아 리더십 질문, 새로운 규제 조사로 인해 이러한 현실이 투자자들에게 큰 관심을 끌게 되었습니다. 돈을 쫓는 AI는 모델 개발자에게만 흘러들어가는 것이 아니다. 그것은 그들 뒤에 있는 디지털 배관에 관심을 끌고 있습니다. 이 기사에서는 해당 이야기에 노출된 3개의 미국 주식이 어떻게 이익을 얻을 수 있는지 설명합니다."},{"s":"AI 투자 위축 우려…국내 반도체·전력기기 영향은","so":"연합뉴스TV","tm":"11/15 11:04","c":1,"r":"kr","u":"https://www.yonhapnewstv.co.kr/news/MYH202611151104044M7","p":1794708240,"a":1794713963,"su":"[앵커] 미국 중간선거 이후 AI 투자 위축 우려가 커지면서 국내 산업계에도 긴장감이 감돌고 있습니다. 특히 AI 호황을 누려온 반도체(전자기기의 두뇌 부품)와 전력기기 업계에 어떤 파장이 있을지 주목됩니다. 정다예 기자입니다. [기자] 미국 중간선거 직후 국내 증시는 크게 출렁였습니다. 삼"},{"s":"포스코·효성중공업·한화오션 하청까지…중공업계 '동투' 장기화 조짐","so":"이투데이","tm":"11/15 10:44","c":1,"r":"kr","u":"https://www.etoday.co.kr/news/view/2648009","p":1794707040,"a":1794713963,"su":"협상 난항에 노사 갈등 연말까지 이어져임금·성과급 갈등에 동투 장기화 조짐파업·집회 잇따라…생산 차질 우려▲효성중공업 창원공장 전경. (사진제공="},{"s":"AI 데이터센터가 벽에 부딪혔다! 미국 내 38개 지역이 금지령을 통과시키고 확장을 요구했습니다. 마이크로소프트와 구글은 강제로 다른 탈출구를 찾아야 하는가?","so":"工商時報","tm":"11/15 08:37","c":1,"r":"tw","u":"https://www.ctee.com.tw/news/20261115700014-430701","p":1794699420,"a":1794702410,"t":"AI資料中心踢到鐵板！美國38地通過禁令喊卡擴建 微軟、Google被迫另尋出路？","su":"미국 민주당이 2026년 중간선거에서 큰 승리를 거두며 상하원 장악력을 탈환했다. 유권자들은 높은 인플레이션(물건값이 계속 오르는 것)과 생활비에 대한 불관용, 해외 전쟁 개입에 대한 강한 반대, 의료 안보와 풀뿌리 사회복지 수호, 젊은 세대와 소수민족의 변화 요구 등 현 정부의 정책에 대해 강력한 항의와 불만을 투표를 통해 표현했다. AI 데이터센터(컴퓨터 수만 대를 모아 둔 건물)로 인해 전력 수요가 급증하고, 주민들은 시설 확충에 따른 전이효과를 우려하고 있다. 경제와 민생은 유권자들이 가장 우려하는 페인포인트다. 건담..."},{"s":"팬과 함께 떠나지 않는 현실 AI 데이터센터 과열투자에 한 홀","so":"日本経済新聞","tm":"11/15 05:00","c":1,"r":"jp","u":"https://www.nikkei.com/article/DGXZQOUC132SG0T11C26A1000000/","p":1794686400,"a":1794698087,"t":"「ファンと共に去りぬ」の現実味 AIデータセンター過熱投資に一穴","su":"인공지능(AI) 붐을 선도해온 미국 엔비디아 젠슨 황씨가 최고경영책임자(CEO)를 전격 사임했습니다. 영향은 엔비디아의 경영에 그치지 않고, 과열하는 AI 데이터 센터의 투자 붐의 조정을 초래하는 「황 퇴진이라는 작은 균열」에 퍼질 수 있습니다. 「수평형 조직」. 엔비디아의 경영 체제는 다음과 같습니다. 엔비디아 간부는 “한 사람의 시끄럽고 무서운 아버지가 있고, 그 아래에 만명의 아이들이 줄지어 있다. 아버지가 결"},{"s":"하루 만에 40% 이상 급락했습니다! 호주 데이터센터 운영업체 NextDC, 내년 실적 전망 하향","so":"财联社","tm":"11/14 22:02","c":1,"r":"cn","u":"https://www.cls.cn/detail/2511045","p":1794661373,"a":1794713965,"t":"一天暴跌逾四成！澳数据中心运营商NextDC下调明年业绩指引","su":"① 호주 데이터센터(컴퓨터 수만 대를 모아 둔 건물) 운영업체인 NextDC는 멜버른 M3 데이터센터 전력 공급 지연으로 인해 2027회계연도 매출과 기본 EBITDA 실적 전망을 하향 조정했고 주가는 장중 44% 하락했다. ② M3의 그리드 전력 공급 증가의 다음 단계는 2028 회계연도로 연기될 것으로 예상됩니다. ③ 드 로봇 구현","so":"아시아경제","tm":"11/17 09:04","c":2,"r":"kr","u":"https://www.asiae.co.kr/article/2026111709042479186","p":1794873864,"a":1794874215,"su":"수술 도구와 의료진의 동작을 인식하는 수준을 넘어 수술이 어떤 단계에 있고 어떤 상황이 진행 중인지 파악하는 ."},{"s":"Youzhishi︱디지털 휴머노이드 로봇 'Youzhobao'가 춤을 추며 쿵푸를 선보이고, 친구들은 기쁨과 칭찬으로 춤을 춥니다.","so":"星島頭條","tm":"11/16 20:04","c":2,"r":"hk","u":"https://www.stheadline.com/society/3637773/%E5%8F%8B%E6%99%BA%E8%AD%98%E6%95%B8%E5%AD%97%E8%BE%A6%E4%BA%BA%E5%BD%A2%E6%A9%9F%E6%A2%B0%E4%BA%BA%E5%8F%8B%E6%99%BA%E5%AF%B6%E8%B7%B3%E8%88%9E%E6%89%93%E5%8A%9F%E5%A4%AB-%E8%80%81%E5%8F%8B%E8%A8%98%E7%9C%89%E9%A3%9B%E8%89%B2%E8%88%9E%E8%AE%9A%E5%8F%BB","p":1794827048,"a":1794830486,"t":"友智識︱數字辦人形機械人「友智寶」跳舞打功夫 老友記眉飛色舞讚叻","su":"디지털오피스는 오늘(16일) '친절한 지식' 커뮤니티 디지털 포용 프로그램 2차와 '로봇을 커뮤니티 속으로' 시범 프로그램 론칭식을 가졌다. Sun Dong 혁신기술산업국 국장은 더 많은 사람들에게 혜택을 제공하기 위해 서비스 규모가 확대될 것이라고 말했습니다. 디지털 오피스와 사회혁신기금은 2024년에 2년간의 '친절한 지식' 디지털 포용 프로그램을 시작하여 노인과 기타 도움이 필요한 사람들이 디지털 기술을 습득할 수 있도록 지원합니다. 여기에는 스마트폰 및 디지털 서비스 사용을 돕기 위한 지원 지점 설정, 디지털 서비스 및 기술 과정 설정, 온라인 기술 학습 플랫폼 설정 등이 포함됩니다. 우정 지식 프로젝트 기술 및 산업 혁신을 통해 커뮤니티 디지털 지원 포인트가 두 배로 증가했습니다."},{"s":"동운아나텍, 휴머노이드 로봇 '손발'용 구동 반도체 육성","so":"전자신문","tm":"11/16 10:15","c":2,"r":"kr","u":"https://www.etnews.com/20261116000128","p":1794791735,"a":1794792488,"su":"동운아나텍이 스마트폰 카메라에서 검증된 정밀 구동 기술을 자동차, 더 나아가 로봇 관절과 전력 제어 분야로 확장한다. 동운아나텍은"},{"s":"153세 건축가 타이세이, AI와 로봇공학에 투자하기 위해 펀드 조성","so":"Bloomberg.com","tm":"11/16 08:01","c":2,"r":"us","u":"https://www.bloomberg.com/news/articles/2026-11-15/taisei-launches-150-million-ai-robotics-fund-with-pegasus-tech-ventures","p":1794783715,"a":1794789755,"t":"153-Year-Old Builder Taisei Sets Up Fund to Invest in AI and Robotics"},{"s":"\"2080년 휴머노이드 로봇 100억대 넘어 세계인구보다 많아진다\"","so":"뉴스1","tm":"11/17 12:00","c":1,"r":"kr","u":"https://www.news1.kr/world/general-world/6356581","p":1794884443,"a":1794885942},{"s":"유니트리는 10% 이상 하락했습니다.","so":"第一财经","tm":"11/17 11:18","c":1,"r":"cn","u":"https://www.yicai.com/brief/103443111.html","p":1794881880,"a":1794885947,"t":"宇树科技跌超10%","su":"2026/11/17 10:18 [유니트리 10% 이상 하락] 유니트리는 장중 10% 이상 하락하여 현재 636위안으로 거래되고 있으며 매출(물건을 판 돈 전체)액은 17억 4,700만 위안입니다."},{"s":"허샤오펑 : 11월 처음으로 월 판매량 6만대 돌파 예상, 내년 2분기에는 휴머노이드 로봇 출시","so":"第一财经","tm":"11/17 11:16","c":1,"r":"cn","u":"https://www.yicai.com/news/103442684.html","p":1794881763,"a":1794885951,"t":"何小鹏：预计11月月销将首次超6万辆，人形机器人明年二季度对外发布","su":"11월 16일 Xpeng Group은 2026년 3분기 실적(회사가 번 돈 성적표) 보고서를 발표하고 전화 회의를 가졌습니다. 3분기 차량 인도량이 11만 대를 돌파해 분기별 인도 사상 최고치를 기록했다. 총 수입은 242.8억 위안으로 단일 분기 수입 사상 최고치를 기록했습니다. MONA L03과 글로벌 확장으로 인해 자동차 수요가 성장기로 접어들었습니다. He Xiaopeng은 수익 컨퍼런스 콜에서 회사의 단기 및 중기 운영 목표는 자동차 사업에서 긍정적인 현금 흐름과 수익성을 달성하여 물리적 AI에 대한 전략적 투자를 보장하는 것이라고 말했습니다. Xpeng의 물리 AI 혁신 사업은 2C와 2B에 대한 다양한 수익원을 열어주고 있습니다. 동시에 He Xiaopeng은 내년에 전반적인 운영 개선에 더 많은 에너지를 쏟고, 회사의 자가 조혈 능력을 강화하는 동시에 고급 로봇의 대량 생산 및 납품을 촉진할 계획입니다."},{"s":"뉴빌리티 “배달·순찰 로봇으로 쌓은 공간 지능, 휴머노이드·제조 부문까지 확장”","so":"동아일보","tm":"11/17 10:32","c":1,"r":"kr","u":"https://news.google.com/rss/articles/CBMib0FVX3lxTE1YUVVPTnU0QUlMYmZjRWpoeVJ3WE5BWW54aTlpbWpGNkxIWTBHZjBZdno3VThRVENFWFNPcVd2R21vSlpPLWdUcHdockh6U243Qi13ZklVZVBWa0RFWFlrUjRDZ3MteDE2TGNQX3lSY9IBZkFVX3lxTE85WEdtQkxVZFh0cVhRbElQckNLWHNEUzhkbFlLMzNvdlI2TXgwdUp4MWpTSjZvdnVZY0ZWVHZwZ1ZWR3dqazIzQTBZbVhkZFVoeWhXSWJDSXQ3Z1BrMm56MVFwd1ZEdw?oc=5","p":1794879126,"a":1794885942},{"s":"학습 없어도 ‘척척’ 해내는 휴머노이드… “로봇 AI 기술 또 진화했다”","so":"Chosunbiz","tm":"11/17 10:25","c":1,"r":"kr","u":"https://news.google.com/rss/articles/CBMihAFBVV95cUxNbTJNSkVwUW1MbWI5WUc0RTZqbTl1QzE2ZmJNaXdnNFMtWjlNdy1FS3hubUgxS2tWU3JGZ1pCYzlDcENRMm5xd3JQNkZoZW1XV1VQMUduTHd1MjlhZVJzRVNZOXpURVNlTVVkcEwtZzhkbHdIX3Y0XzRpNUlBT1YycXpBb0_SAZgBQVVfeXFMTXJPZE91eHJoQVhMWkd1bkNUNk1WYkNnT1JsMDAtTElwdmlXbzZOZ2xPcU4yM09UeC1GTmxyZlJfMTRDWjJDSU9CQXR0dzNVSVBCQ0d1ZERVc0JJUlNUdlNDcXVacTI4bEpGOGZ5Yi1uWlp1c2ZMZGtzR1dTZVlsalhOaUQ1Y3FXUG1lNFVGRENxbWdBc1B4dzk?oc=5","p":1794878700,"a":1794885942},{"s":"[모닝 리포트] \"로보티즈, 유럽 공급 확대·휴머노이드 출하 기대\"","so":"뉴스핌","tm":"11/17 08:27","c":1,"r":"kr","u":"https://w 03442633.html","p":1794838848,"a":1794869116,"t":"公司互动丨这些公司披露在机器人等方面最新情况"},{"s":"10월에는 산업용 로봇과 집적회로 생산 증가율이 20%를 넘어섰고, 신운동에너지의 지원 역할도 계속해서 높아졌다.","so":"21财经","tm":"11/16 20:52","c":1,"r":"cn","u":"https://www.21jingji.com/article/20261116/herald/35a348029c0464373fc004d7f9ceb32c.html","p":1794829920,"a":1794834748,"t":"10月工业机器人、集成电路产量增速均超20% 新动能支撑作用继续提升","su":"1월부터 10월까지 첨단제조와 스마트제조로 대표되는 새로운 원동력은 산업부가가치가 일정 규모 이상으로 성장하는 데 50% 이상 기여했다. 10월에는 첨단기술제품과 '3대 신제품' 수출액이 전년 동기 대비 50% 이상 증가했다. 3D 프린팅 장비, 리튬이온 배터리, 산업용 로봇의 생산량은 전년 동기 대비 각각 85.9%, 30.0%, 26.0% 증가했다. 국가통계국이 16일 발표한 국가경제실적(회사가 번 돈 성적표)에 따르면, 다양한 분야에서 새로운 생산력 배양이 가속화되고, 새로운 운동에너지의 추진력이 지속적으로 강화되며, 국가경제 운영이 전반적으로 안정되고 새롭고 더 나은 성과를 향해 발전하고 있다. 새로운 운동에너지의 축적은 컴퓨팅 파워에 대한 수요에 새로운 기회를 가져왔습니다. \"기술 혁신과 산업 혁신이 깊이 통합되고, 새로운 과학 기술 성과가 지속적으로 나타나고 있으며, 새로운 산업, 새로운 비즈니스 형식 및 신제품이 더 나은 방향으로 개발되고 있으며, 전통 산업의 변화와 업그레이드 속도가 가속화되고, 디지털화와 지능이 통합 및 발전하고 있습니다. 이는 고품질 경제 발전을 강력하게 지원했습니다.\" 중국 국가통계국 국민경제종합통계국 대변인이자 수석경제학자인 푸 링후이(Fu Linghui)는 10월 경제 성과를 분석하면서 이렇게 말했습니다."},{"s":"탄민: 본토 휴머노이드 로봇 '백연대 전투' 적자생존","so":"信報網站","tm":"11/16 20:33","c":1,"r":"hk","u":"https://www.hkej.com/multimedia/view/id/4566083","p":1794828813,"a":1794830484,"t":"譚旻: 內地人形機械人「百團大戰」 優勝劣汰","su":"최근에는 임바디드 AI(Embodied AI)과 휴머노이드(사람을 닮은 로봇) 로봇의 물결이 전 세계를 휩쓸며 공상과학의 장면을 현실로 가져오고 있습니다. 구현지능의 상용화 과정은 '기술 실증'에서 대규모 구현으로 진화하고 있다. 유비테크놀로지(09880)는 휴머노이드 로봇 최초의 주식으로 하드 기술을 자본 시장에 도입하는 데 성공적으로 앞장섰습니다. 회사의 최고 브랜드 책임자인 Tan Min(Michael)은 \"경제 저널\"을 수락했으며 현재 TV \"A Word for Money\" 시리즈 2에서 공동 제작한 \"홍콩 혁신 및 기술\"과의 독점 인터뷰를 통해 임바디드 AI 뒤에 있는 과제를 공유하고 로봇이 진정으로 자율적인 의사 결정을 달성할 수 있는 시기와 본토 산업의 발전을 분석합니다."},{"s":"포토 갤러리 | 상하이 하버 시티에서 로봇 패션쇼 개막, 휴머노이드 로봇이 고전 댄스 스텝 재현","so":"财新","tm":"11/16 20:25","c":1,"r":"cn","u":"https://photos.caixin.com/2026-11-16/102505444.html","p":1794828300,"a":1794874217,"t":"图集｜机器人时装秀开上海港城 人形机器人重现经典舞步","su":"[카이신] 2026년 11월 16일, 지드래곤이 소속된 갤럭시 코퍼레이션(Galaxy Corporation)은 홍콩 침사추이에서 'MACH 33: Physical AI Fashion Show Hong Kong' 로봇 패션쇼를 개최했다. 이번 행사는 중국 로봇기업 유니트리(68 ."},{"s":"연속보드주 추적丨오늘 총 33개의 A주 주식 한도가 상향되었습니다. 이 로봇 컨셉 스톡에는 4개의 연속 보드가 있습니다.","so":"第一财经","tm":"11/16 17:17","c":1,"r":"cn","u":"https://www.yicai.com/news/103442076.html","p":1794817043,"a":1794830481,"t":"连板股追踪丨A股今日共33只个股涨停 这只机器人概念股4连板","su":"제일재경 2026-11-16 16:08:13 뉴스 듣기 저자: Gao Mingyan 편집자: Gao Mingyan 11월 16일 Wind 데이터에 따르면 A주 시장에서 총 33개 주식이 한도 상승을 보였습니다. 그 중 로봇 컨셉 주식인 Northern Wei Technology는 4회 연속 보드를 획득했고, 소매 부문 Guangbai Co., Ltd.는 3회 연속 보드를 획득했습니다. 오늘의 상장(주식시장에 처음 들어오는 것)주식을 하나의 차트로 간단히 살펴보기 >> Gao Mingyan 발전부문 민동전력은 6개의 연속보드가 있고, PCB 컨셉주인 아오홍전자는 4개의 보드가 연속되어 있습니다. 오늘의 커넥티드주식을 한장의 사진으로 간략히 살펴보기 >> 전력분야의 4연결주인 민동전력과 PCB 컨셉주에서의 3연결보드인 초음파전자. 주식이 상장된 오늘의 주식 간략히 살펴보기 >> 농업 부문 Yasheng Group은 4주 연속 주식을 보유하고 있으며 Dunhuang Seed Industry는 3주 연속 주식을 보유하고 있습니다. 주식이 상장된 오늘의 주식 간략히 살펴보기>> 농업주 Wanxiang Denong이 6회 연속 상승했고, Xinsai Stock이 4회 연속 상승했습니다. AI 단편드라마 컨셉주 망고슈퍼미디어가 2회 연속 보드를 기록했다. 오늘 상장주식을 하나의 차트로 간략히 살펴보기 >> 혁신신약(세상에 처음 나온 새로운 약) 컨셉주 한센제약이 4보드 연속 상승을 기록했고, 골드 컨셉주 심천중화A가 3보드 연속 상승을 기록했습니다. 오늘의 상장주식을 한 장의 사진으로 간단히 살펴보기 >>"},{"s":"야스카와 전기, 경영 인력 육성","so":"日経ビジネス電子版","tm":"11/16 17:00","c":1,"r":"jp","u":"https://business.nikkei.com/atcl/gen/19/00961/","p":1794816000,"a":1794830489,"t":"安川電機、経営人材の育成","su":"오가와 마사히로 전 사장의 급속한 일을 받아 경영 톱에 재등판한 오가사와라 히로시 회장 겸 사장. 함께 그린 노선을 완수하고 그 뜻을 연결하기 위한 가장 큰 초점이 경영인력 육성이다. 컨설턴트와 AI가 “그러한 정답”을 내는 시대에 스스로의 머리로 회사의 미래를 그려내는 차대의 톱을 어떻게 판별하고 키워나갈 것인가. 수많은 위기를 극복해 온 톱의 각오를 듣는다."},{"s":"아이엘, '로봇손' 사업 진출…'아이엘핸드' 상표출원","so":"데일리안","tm":"11/16 15:19","c":1,"r":"kr","u":"https://www.dailian.co.kr/news/view/1715624/%EC%95%84%EC%9D%B4%EC%97%98-%EB%A1%9C%EB%B4%87%EC%86%90-%EC%82%AC%EC%97%85-%EC%A7%84%EC%B6%9C%EC%95%84%EC%9D%B4%EC%97%98%ED%95%B8%EB%93%9C-%EC%83%81-2026","p":1794809940,"a":1794812228,"su":"피지컬 인공지능(AI) 데이터 플랫폼 기업 아이엘은 아이엘이 휴머노이드(사람을 닮은 로봇) 로봇핸드 사업 강화를 위해 신규 브랜드 '아이엘핸드(ILHAND)'의 상표출원을 마쳤다고 16일 밝혔다. 이번 브랜드는 휴머노이드 로봇의 핵심 부품인 로봇핸드 분야에 특화돼 있다. 아이엘은 지난해 11월 휴머노이드 로봇 브랜드 '아이엘봇(ILBOT)' 상표출원을 통해 로봇 사업의 방향성"},{"s":"아이엘, 피지컬AI 핵심 부품 ‘로봇핸드’로 사업 ":"【早报】宇树科技，今日申购；伊方批准霍尔木兹海峡安全纲要；寒武纪、江波龙、药明康德发布重要公告","su":"① 국가통계국: 7월 CPI 전년 동기 대비 0.5% 상승 ② S&P500(미국 큰 회사 500곳 지수) 지수가 지난 금요일 최고치를 경신했고, 광통신 부문이 급등했다. ③ 베이징: 집을 구입하는 비베이징 가구의 사회보장 및 개인 납세 기간이 1년으로 단축되었다. ④ 애플 China 공식 웹사이트에서 애플 Smart Access 알리바바 큐원(Qwen) 매뉴얼을 삭제했다. ⑤ 캄브리콘, 롱시스, Wuxi AppTec이 중요한 발표를 했다. 매크로 뉴스 1. 국가통계국이 발표한 자료에 따르면 7월 소비자물가지수(CPI)는 국제 수입 요인의 영향으로 전월 대비 0.1% 하락하고 전년 대비 0.5% 상승한 것으로 나타났습니다. 식품과 에너지를 제외한 근원 CPI는 전월 대비 0.3%, 전년 동기 대비 0.9% 상승했다. CPI는 전반적으로 완만한 상승을 유지했습니다. 1~7월 평균 전국 소비자물가는 전년 동기 대비 0.9% 상승했다. 국내 일부 산업의 수요가 늘었지만, 수입·계절적 요인 등으로 산업생산자물가(공장에서 파는 물건값 수준)지수(PPI)는 전월 대비 0.7% 하락, 전년 동기 대비 3.5% 상승, 전월 대비 0.6%포인트 하락했다."},{"s":"로봇 더블 일레븐 '시험장': 대규모 판매 이후 배송과 생산 라인이 실제 테스트 문제","so":"财联社","tm":"11/15 00:11","c":1,"r":"cn","u":"https://www.cls.cn/detail/2533342","p":1794669109,"a":1794730754,"t":"机器人双十一\"考场\"：大卖之后，交付和产线才是真考题","su":"① 더블 일레븐(Double Eleven) 기간 동안, 임바디드 AI(로봇처럼 몸을 가진 인공지능)형 로봇 배치가 처음으로 물류 최전선에서 \"작업\"했습니다. ② 더블일레븐 이후에는 주문한 상품이 제때에 배송될 수 있는지, 이용자가 이를 수령한 후 반품할 것인지, 사용할 것인지 여부 등 배송을 소비자측에서 부담하게 됩니다. 창고가 대답해야 할 것은 로봇이 일년 내내 가장 극심한 주문 피크 기간 동안 안정적으로 작동하고 계산 가능한 경제적 가치를 계산할 수 있는지 여부입니다. '극장반일보'가 11월 13일 보도했다(리밍밍 기자) 더블일레븐은 막을 내렸지만 올해 로봇 분야에는 새로운 변화가 있다. 먼저, 소비자 측면에서는 더블 일레븐 기간 동안 플랫폼 내 지능형 휴머노이드(사람을 닮은 로봇) 로봇 매출이 전년 대비 700% 증가했고, 로봇 팔, 손재주 등 트렌드 카테고리 매출도 전년 대비 10배 이상 증가했다. 반면, 소비자가 주문한 후 분류, 포장 및 배송 링크에서는 임바디드 AI형 로봇 그룹이 처음으로 물류 최전선에서 '작업'했습니다."},{"s":"최신 Caixin Weekly │ 휴머노이드 로봇이 임계점을 기다리고 있습니다","so":"财新周刊","tm":"11/14 23:16","c":1,"r":"cn","u":"https://weekly.caixin.com/2026-11-14/102504772.html","p":1794665765,"a":1794698097,"t":"最新财新周刊｜人形机器人等待临界点","su":"텍스트 | A주 '최초의 인간형 로봇 주식'인 Caixin Weekly Du Zhihang 유니트리(688836.SH)는 8월 19일 상장(주식시장에 처음 들어오는 것) 당일 발행 가격이 주당 150.80위안에서 1,100위안으로 급등했습니다. 이후 오르락내리락하며 등락을 거듭하며 시가총액(회사 전체 몸값)은 최고에서 최고로 상승했습니다. 4,449억 위안으로 최저치인 1,634억 위안을 기록했으나 10월 중순 이후 등락을 거듭하며 2,815억 1,000만 위안 안팎까지 올랐다. 이 시가총액을 기준으로 3개 분기별 보고서의 수익을 합산하면 PS(가격 대비 판매 비율)는 여전히 120배입니다. \"2027년은 로봇 산업이나 로봇 모델 발전에 있어서 중요한 시점이 될 가능성이 높다.\" 2026년 11월 4일 Wuzhen 인터넷 컨퍼런스에서 유니트리의 왕싱싱(Wang Xingxing) CEO는 2027년에는 어떤 현장에서도 작동할 수 있는 로봇을 배치할 가능성이 높다며 두 달 전 기업공개(IPO) 때보다 조금 더 낙관적인 목소리를 냈습니다."},{"s":"2026~2030 휴머노이드 로봇 브레인용 D램 수요 전망(사진=카운터포인트리서치)","so":"전자신문","tm":"11/14 22:30","c":1,"r":"kr","u":"https://www.etnews.com/tools/image_popup.html?v=bjQ5VkNYY2dLZTZMZFBUbmNzandvWmpGcjBTK1pHYm1CUVRXR0pTMldlYVZkdE5JeGJVUFVVNURJN04rbmhKTXpEZ0VrRFJ1Z0UzZXBlTmtIMExTejVCeTJrc0pTeDdtRld1cnQ3Yi9BbWhSaTVjb0VObnNFZndkeDNYcGw4UEY1K0xQNVQvQlNwaUVLSko4a0E3aXFPSk9xemFzdGpKV0ltS1NSaGczSm85VzlHaEo2blpZRjJuQW0yZmlRSmdjZWo3R0o5NHoyUzlxMk5wOFhhaWJkL09zblpXVXkwVG5YVG01Z3hpTU9XMXN2b0Nzc1BPU1d1RlBqUmQ5azRmZzJISzRWNWpEWDFqVmRsNk1iTEw0eW4vUEdNTVNtZnBrdVhTdGtqTWlSVFFnSEVnNFZVTHRsL0tGZDJEb1l5aExVNE1iVmpWNlMrTzA3UXFKTmw2dFBlTXFIMzJCSjFZVDNYa3k5YXZ2OWtRREpoRjZ4TWlJeEFYdFFlcFljeXdrNm1OaGhKd1BhbENmdUdON3BQZTZ0Vkx1bTVZYXZVUGlHT1lQVjJWNEk0ST0","p":1794663016,"a":1794698095},{"s":"에릭 트럼프가 지원하는 로봇 군인 스타트업은 창업자가 집을 구입하기 위해 회사로부터 460만 달러를 빌린 후 직원에게 급여를 지급할 수 없습니다","so":"CNBC","tm":"11/14 21:00","c":1,"r":"us","u":"https://www.cnbc.com/2026/11/14/foundation-payroll-ceo-loan.html","p":1794657601,"a":1794659895,"t":"Eric Trump-backed robot soldier startup can't pay staff after founder borrowed $4.6 million from company to buy home","su":"에릭 트럼프가 지원하는 로봇 스타트업 Foundation Future Industries는 CEO Sankaet Pathak이 460만 달러의 회사 대출에 대한 조사를 받자 현금이 부족하고 급여도 누락되었습니다."},{"s":"중국의 휴머노이드 로봇 생산량은 올해 100,000대를 초과할 것으로 예상되며, 임바디드 AI의 대규모 개발을 지원하기 위해 산업 표준이 시행될 예정입니다.","so":"财联社","tm":"11/14 20:48","c":1,"r":"cn","u":"https://www.cls.cn/detail/2429801","p":1794656919,"a":1794713975,"t":"今年我国人形机器人产量或超10万台，行业标准落地护航具身智能规模化发展","su":"①산업정보기술부 휴머노이드(사람을 닮은 로봇) 로봇 및 임바디드 AI(로봇처럼 몸을 가진 인공지능) 표준화 기술 위원회의 2026년 연례 총회 및 \"표준 주간\" 행사가 최근 저장성 소흥시 상위구에서 열렸습니다. ② 공업정보화부 커직신(Ke Jixin) 차관은 연설을 통해 중국의 휴머노이드 로봇 생산량이 지난해 약 2만대 수준이었고, 올해 상반기에는 4만대를 넘어섰으며, 올해에는 10만대를 넘어설 것으로 예상된다고 밝혔다. '커창반일보'가 7월 17일 보도했다(궈휘 기자) 7월 15일부터 17일까지 공업정보화부 휴머노이드 로봇 및 체화지능 표준화 기술위원회(이하 '표준위원회')의 2026년 정기총회와 '표준주간' 활동이 저장성 소 <script>
var D = JSON.parse(document.getElementById('data').textContent);
var RL = {}; D.regions.forEach(function(r){ RL[r.k] = r.l; });
function $(id){ return document.getElementById(id); }
function esc(t){ return String(t==null?'':t).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
// 휴대폰에 기억해 두는 값 (마지막 탭, 탭별로 마지막에 본 시각, 정렬, 국가)
function load(k, d){ try { var v = localStorage.getItem('nb_'+k); return v===null ? d : JSON.parse(v); } catch(e){ return d; } }
function save(k, v){ try { localStorage.setItem('nb_'+k, JSON.stringify(v)); } catch(e){} }
var S = { tab: (D.themes[0] && D.themes[0].stats && D.themes.length > 1) ? 1 : 0, seen: load('seen', null), sort: load('sort', 'c'), region: load('region', 'all'), shown: D.show, prev: {} };
function newest(t){ var m = 0; t.items.forEach(function(n){ if(n.a > m) m = n.a; }); return m; }
if(S.seen === null){ S.seen = {}; D.themes.forEach(function(t){ S.seen[t.name] = newest(t); }); save('seen', S.seen); }  // 처음 방문: 레드닷 없이 시작
(function(){ var nm = load('tabname', ''); D.themes.forEach(function(t, i){ if(t.name === nm) S.tab = i; }); })();  // 마지막에 본 탭 (이름으로 기억)
if(location.hash && /^#t\d+$/.test(location.hash)) S.tab = +location.hash.slice(2);
if(location.hash === '#stats') D.themes.forEach(function(t, i){ if(t.stats) S.tab = i; });
if(S.tab >= D.themes.length) S.tab = D.themes.length > 1 ? 1 : 0;

function visible(t){
  return t.items.filter(function(n){ return S.region==='all' || n.r===S.region; });
}
function sorted(list, breaking){
  var k = breaking ? 'p' : S.sort;
  return list.slice().sort(function(x,y){
    var c = y.c - x.c, p = y.p - x.p; return k==='c' ? (c||p) : (p||c);
  });
}
function renderTabs(){
  $('tabs').innerHTML = D.themes.map(function(t, i){
    var dot = newest(t) > (S.seen[t.name] || 0) && i !== S.tab;
    return '<button class="tab'+(i===S.tab?' on':'')+'" onclick="openTab('+i+')">'+esc(t.name)+
           (t.stats ? '' : '<b>'+visible(t).length+'</b>')+(dot?'<span class="dot" title="새 뉴스"></span>':'')+'</button>';
  }).join('');
  var on = $('tabs').children[S.tab]; if(on && on.scrollIntoView) on.scrollIntoView({block:'nearest', inline:'center'});
}
function renderCtrl(){
  var br = D.themes[S.tab].breaking || D.themes[S.tab].stats;
  var h = '';
  if(!br){
    h += '<button class="'+(S.sort==='c'?'on':'')+'" onclick="setSort(\'c\')">🔥 화제순</button>';
    h += '<button class="'+(S.sort==='p'?'on':'')+'" onclick="setSort(\'p\')">🕒 최신순</button><span class="sep"></span>';
  }
  h += '<button class="'+(S.region==='all'?'on':'')+'" onclick="setRegion(\'all\')">전체</button>';
  D.regions.forEach(function(r){
    h += '<button class="'+(S.region===r.k?'on':'')+'" onclick="setRegion(\''+r.k+'\')">'+esc(r.l)+'</button>';
  });
  $('ctrl').innerHTML = h;
}
function card(n, prev){
  var hot = n.c > 1 ? '<span class="hot'+(n.c>=5?' big':'')+'">🔥 언론 '+n.c+'곳</span>' : '';
  var isNew = prev && n.a > prev ? ' <span class="new">NEW</span>' : '';
  return '<a class="card" href="'+esc(n.u)+'" target="_blank" rel="noopener" data-s="'+esc(n.su||'')+'" data-so="'+esc(n.so)+'">'+
    '<div class="meta">'+hot+esc(RL[n.r]||'')+' · '+esc(n.so)+' · '+esc(n.tm)+isNew+'</div>'+
    '<div class="title">'+esc(n.s)+'</div>'+(n.t?'<div class="orig">'+esc(n.t)+'</div>':'')+'</a>';
}
function renderMain(){
  if(D.themes[S.tab].stats){ renderStats(D.themes[S.tab]); return; }
  var t = D.themes[S.tab], list = sorted(visible(t), t.breaking), prev = S.prev[t.name] || 0;
  var h = '<h2>'+esc(t.name)+'</h2>' + (t.note ? '<p class="note">'+esc(t.note)+'</p>' : '');
  var fresh = prev ? list.filter(function(n){ return n.a > prev; }).length : 0;
  if(S.onlyNew){                                // '새 기사만 보기' 중
    list = list.filter(function(n){ return n.a > prev; });

}
function avn(a, b){ var n=0; for(var i=Math.max(0,a); i<Math.min(b, HI.n); i++) if(HI.av[i]) n++; return n; }   // 자료 있는 날 수
function years(){ var a = [], y0 = +HI.since.slice(0,4), ty = +HI.end.slice(0,4); for(var y=ty-1; y>=y0; y--) a.push(y); return a; }   // 다 지난 해 (최근 먼저)
function pickYear(){ var ys = years(); return ys.indexOf(S.ly) >= 0 ? S.ly : (ys[0] || +HI.end.slice(0,4)); }
function lperiod(){                        // [이번 a,b] [비교 a,b 또는 null] 이름
  var M = HI.months, last = M[M.length-1], lf = last.full ? M.length-1 : M.length-2, ty = +HI.end.slice(0,4);
  if(S.lp === 'lm' && lf >= 0){ var x = M[lf], p = M[lf-1];
    return [[x.a, x.b], p ? [p.a, p.b] : null, x.y+'년 '+x.m+'월', '전달 대비']; }
  if(S.lp === 'ty'){ var a = dIdx(ty+'-01-01'), pa = dIdx((ty-1)+'-01-01'), len = HI.n - a;
    return [[a, HI.n], pa >= 0 ? [pa, pa+len] : null, ty+'년 (1월 1일~'+HI.end.slice(5).replace('-','/')+')', '작년 같은 기간 대비']; }
  if(S.lp === 'yr'){ var yy = pickYear(), ya = Math.max(0, dIdx(yy+'-01-01')), yb = Math.min(HI.n, dIdx((yy+1)+'-01-01')), pa = dIdx((yy-1)+'-01-01');
    return [[ya, yb], pa >= 0 ? [pa, ya] : null, yy+'년 전체', yy-1+'년 대비']; }
  return [[0, HI.n], null, HI.since.slice(0,7).replace('-','.')+' ~ '+HI.end.replace(/-/g,'.')+' 전체', ''];
}
function mspark(th){                       // 달별 흐름 (작은 선, 진행 중인 달은 빼고)
  var M = HI.months.filter(function(x){ return x.full; }), vals = M.map(function(x){ var d = avn(x.a, x.b); return d ? hsum(th, x.a, x.b)/d : 0; });
  if(vals.length < 2) return '';
  var mx = Math.max.apply(null, vals.concat([1])), w = 64, h = 20;
  var pts = vals.map(function(v,i){ return (i*(w/(vals.length-1))).toFixed(1)+','+(h-2-(v/mx)*(h-4)).toFixed(1); }).join(' ');
  return '<svg class="spark" viewBox="0 0 '+w+' '+h+'" width="'+w+'" height="'+h+'" aria-hidden="true"><polyline points="'+pts+'" fill="none" stroke="var(--acc)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></svg>';
}
function ldetail(th){                      // 달별 막대 + 나라별 구성
  var M = HI.months, dn = M.map(function(x){ return avn(x.a, x.b); });
  var vals = M.map(function(x, i){ return dn[i] ? hsum(th, x.a, x.b)/dn[i] : 0; });   // 하루 평균 (자료 빠진 날 영향 없게)
  var mx = Math.max.apply(null, vals.concat([1])), W = chartW(), H = 120, bw = W/M.length;
  var bars = vals.map(function(v,i){
    var x = M[i], bh = Math.max(v ? 2 : 0, (v/mx)*(H-32)), bx = i*bw + 1, y = H-14-bh;
    return '<g class="bar"><rect x="'+bx.toFixed(1)+'" y="0" width="'+(bw-2).toFixed(1)+'" height="'+(H-14)+'" fill="transparent"/>'+
      '<rect x="'+bx.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+(bw-2).toFixed(1)+'" height="'+bh.toFixed(1)+'" rx="2" fill="var(--acc)"'+(x.full?'':' opacity=".55"')+'/>'+
      '<title>'+x.y+'년 '+x.m+'월'+(x.full?'':' (진행 중)')+' · 하루 평균 '+Math.round(v).toLocaleString()+'건 · 한 달 '+hsum(th, x.a, x.b).toLocaleString()+'건'+
      (dn[i] < x.b - x.a ? ' (자료 '+dn[i]+'일치)' : '')+'</title></g>';
  }).join('');
  var ticks = M.map(function(x,i){ return x.m===1 ? '<line x1="'+(i*bw).toFixed(1)+'" y1="'+(H-14)+'" x2="'+(i*bw).toFixed(1)+'" y2="'+(H-9)+'" stroke="var(--sub)"/>'+
      '<text x="'+(i*bw+2).toFixed(1)+'" y="'+(H-1)+'" class="ax">'+x.y+'</text>' : ''; }).join('');
  var axis = ticks + '<line x1="0" y1="'+(H-14)+'" x2="'+W+'" y2="'+(H-14)+'" stroke="var(--line)"/>'+
             '<text x="0" y="9" class="ax">최대 하루 평균 '+Math.round(mx).toLocaleString()+'건</text>';
  var P = lperiod(), parts = D.regions.filter(function(r){ return (HI.regions||[]).indexOf(r.k) >= 0; }).map(function(r){
    return [r, hsum(th, P[0][0], P[0][1], r.k)]; }).filter(function(x){ return x[1] > 0; }).sort(function(a,b){ return b[1]-a[1]; });
  var pm = parts.length ? parts[0][1] : 1;
  var rows = parts.map(function(x){
    return '<div class="crow"><span class="cl">'+esc(x[0].l)+'</span><span class="cb"><i style="width:'+Math.max(2, x[1]/pm*100)+'%"></i></span><span class="cn">'+x[1].toLocaleString()+'</span></div>';
  }).join('') || '<div class="note">이 기간 기사 없음</div>';
  return '<div class="det"><div class="dt">달별 하루 평균 뉴스 수 ('+HI.since.slice(0,4)+'년 1월~)'+(S.region==='all'?'':' · '+esc(RL[S.region]))+'</div>'+
    '<svg class="bars" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(th)+' 달별 뉴스 수">'+bars+axis+'</svg>'+
    '<div class="dt">'+esc(P[2])+' 나라별</div>'+rows+'</div>';
}
function renderLong(h){
  if(!HI){ loadHist(); $('main').innerHTML = h + '<p class="none">장기 추이를 불러오는 중…</p>'; return; }
  if(HI.err || !HI.s || !HI.months || !HI.months.length){ $('main').innerHTML = h + '<p class="none">장기 추이를 아직 받는 중이에요. 처음 한 번은 몇 시간 걸려요. 조금 뒤에 다시 열어 주세요.</p>'; return; }
  if(S.region === 'world'){ $('main').innerHTML = h + '<p class="none">장기 추이는 나라별(한국·미국·중국·대만·홍콩·일본·싱가포르)로만 셀 수 있어요. 위에서 \'전체\'나 다른 나라를 골라 주세요.</p>'; return; }
  var P = lperiod();
  h += '<p class="note">GDELT(전 세계 뉴스 기록) 자료 · 본문에 테마 단어가 나온 기사 수 · 일주일에 한 번 갱신 · '+esc(HI.end.slice(5).replace('-','/'))+'까지 · 업데이트 '+esc(HI.updated||'')+'</p>';
  if(!HI.complete) h += '<div class="warn">⏳ '+HI.since.slice(0,4)+'년 1월부터 자료를 아직 받는 중이에요. 다 받기 전엔 일부 테마·나라·연도가 0이나 빈칸으로 보여요. 자료 서버가 느려서 하루쯤 걸려요 (봇이 알아서 이어 받음).</div>';
  h += '<div class="seg lp">' + [['all','전체'],['lm','지난달'],['ty','올해'],['yr','연도별']].map(function(x){
    return '<button data-lp="'+x[0]+'" class="'+(S.lp===x[0]?'on':'')+'">'+x[1]+'</button>'; }).join('') + '</div>';
  if(S.lp === 'yr') h += '<div class="seg ly">' + years().slice().reverse().map(function(y){   // 옛날 → 최근 순서로 (기본 선택은 최근 해)
    return '<button data-ly="'+y+'" class="'+(pickYear()===y?'on':'')+'">'+y+'</button>'; }).join('') + '</div>';
  var dc = avn(P[0][0], P[0][1]), dp = P[1] ? avn(P[1][0], P[1][1]) : 0, span = P[0][1] - P[0][0];
  if(span - dc > 0) h += '<div class="warn">ℹ️ 이 기간 중 '+(span-dc)+'일은 GDELT 서버 사정으로 자료가 비어 있어요 ('+span+'일 중 '+dc+'일치). 합계는 그만큼 적게 잡히고, ▲▼ 비교는 하루 평균끼리 해요.</div>';
  var rows = (HI.themes||[]).map(function(th){ return {th:th, n:hsum(th, P[0][0], P[0][1]), p: P[1] ? hsum(th, P[1][0], P[1][1]) : null}; })
                            .sort(byN);
  ranks(rows, !!P[1] && dp > 0);
  var mx = rows.length ? Math.max(1, rows[0].n) : 1, total = 0; rows.forEach(function(r){ total += r.n; });
  h += '<div class="tot">'+esc(P[2])+(S.region==='all'?' · 7개 나라':' · '+esc(RL[S.region]))+' · 총 <b>'+total.toLocaleString()+'</b>건 <span class="chgnote">'+(P[1]?'('+P[3]+')':'')+'</span></div>';
  h += rows.map(function(r, i){
    var open = S.open['L'+r.th];
    return '<div class="srow'+(open?' open':'')+'" data-th="'+esc(r.th)+'" data-l="1">'+
      '<div class="sline">'+mv(r, i)+'<span class="rk">'+(i+1)+'</span><span class="sn">'+esc(r.th)+'</span>'+
      '<span class="sb"><i style="width:'+Math.max(r.n?2:0, r.n/mx*100)+'%"></i></span>'+
      '<span class="sc">'+r.n.toLocaleString()+'</span>'+(r.p===null ? '<span class="chg"></span>' : chg(r.n, r.p, dc, dp))+mspark(r.th)+'</div>'+
      (open ? ldetail(r.th) : '') + '</div>';
  }).join('');
  h += '<footer>· 순위 왼쪽 <span style="color:#f87171">▲</span>/<span style="color:#60a5fa">▼</span> = 비교 기간(전달·작년 같은 기간·전년)보다 몇 계단 오르고 내렸는지<br>· 오른쪽 작은 선 = '+HI.since.slice(0,4)+'년 1월부터 달별 흐름(하루 평균), 줄을 누르면 달별 그래프와 나라별 구성<br>'+
       '· 일별 집계(기사 제목 기준, 구글 뉴스)와 세는 방법이 달라 숫자 크기는 서로 비교하지 말고 흐름만 보세요<br>'+
       '· 한국·중국·일본 기사도 GDELT 가 영어로 번역해 둔 것을 영어 검색어로 셉니다 · 자료가 빠진 날은 0이 아니라 빈칸으로 둠</footer>';
  $('main').innerHTML = h;
}
document.addEventListener('click', function(e){
  var b = e.target.closest('.seg.lp button');
  if(b){ S.lp = b.dataset.lp; save('lp', S.lp); renderMain(); return; }
  var yb = e.target.closest('.seg.ly button');
  if(yb){ S.ly = +yb.dataset.ly; save('ly', S.ly); renderMain(); return; }
  var m = e.target.closest('.seg.sm button');
  if(m){ S.sm = m.dataset.sm; save('sm', S.sm); renderMain(); return; }
}, true);

openTab(S.tab);
refreshBreaking();
setInterval(refreshBreaking, 5 * 60 * 1000);
document.addEventListener('visibilitychange', function(){ if(!document.hidden) refreshBreaking(); });

// 기사를 누르면 먼저 한국어 요약 → 원문 볼지 선택
document.addEventListener('click', function(e){
  var c = e.target.closest('a.card'); if(!c) return;
  if(e.ctrlKey||e.metaKey||e.shiftKey) return;
  e.preventDefault();
  $('s-meta').innerHTML = c.querySelector('.meta').innerHTML;
  $('s-title').textContent = c.querySelector('.title').textContent;
  var o = c.querySelector('.orig'); $('s-orig').textContent = o ? o.textContent : '';
  var sm = c.dataset.s || '';
  $('s-sum').textContent = sm || '이 기사는 요약을 가져오지 못했어요. (사이트가 자동 접속을 막았거나 아직 준비 중)';
  $('s-sum').className = 's-sum' + (sm ? '' : ' empty');
  $('s-go').href = c.href;
  // 외국어 기사면 ✦ Gemini 버튼 보이기 (한국어 기사는 숨김)
  var foreign = !!o || !/[가-힣]/.test(c.querySelector('.title').textContent);   // 번역이 안 됐어도 외국 기사면 버튼 표시
  $('s-cs').hidden = $('s-ct').hidden = $('s-cnote').hidden = !foreign;
  if(foreign){
    // 원문을 열고, Gemini 가 '지금 화면'의 기사를 읽고 답하도록 요청 문장만 복사
    $('s-cs').href = $('s-ct').href = c.href;
    $('s-cs').dataset.q = '이 페이지의 기사 전체를 처음부터 끝까지 읽고 한국어로 요약해 줘. 핵심 내용 3~5줄, 그리고 투자자 입장에서 중요한 숫자와 의미를 짧게 정리해 줘.';
    $('s-ct').dataset.q = "너는 어려운 경제 뉴스를 초등학생도 이해할 수 있게 풀어 주는 친절한 번역가야.\n이 페이지의 뉴스 기사 전체를 쉬운 한국어로 번역해 줘.\n\n[가장 중요한 규칙]\n- 쉽게 쓰더라도 기사 내용은 정확해야 해. 사실을 빼거나, 바꾸거나, 지어내지 마.\n- 기사 순서대로, 빠지는 내용 없이 번역해 줘.\n\n[쉽게 쓰는 방법]\n1. 한 문장에는 한 가지 내용만 써 줘. 문장은 짧게.\n2. \"~습니다/~해요\"체로 친절하게 써 줘.\n3. 어려운 말은 쉬운 말로 바꾸고, 꼭 필요한 전문 용어는 처음 나올 때 괄호로 뜻을 풀어 줘.\n   (예: 금리(돈을 빌릴 때 내는 이자의 비율), 실적(회사가 번 돈과 성과), 주가(회사 주식 한 주의 가격))\n4. 한자어·외래어보다 쉬운 우리말을 먼저 써 줘. (예: 하락 → 떨어졌어요, 상승 → 올랐어요)\n5. 큰 숫자는 읽기 쉽게 바꾸되 정확한 값은 지켜 줘. (예: $2.5 billion → 25억 달러(약 3조 5천억 원쯤))\n   환율로 바꾼 값은 \"약\"을 붙여서 대략이라는 걸 알려 줘.\n6. 회사·사람 이름은 한국에서 부르는 이름으로 쓰고, 처음 나올 때만 괄호에 영어 이름을 적어 줘. (예: 엔비디아(Nvidia))\n7. 누가 한 말인지 분명하게 써 줘. (예: 젠슨 황 대표는 \"…\"라고 말했어요.)\n\n[출력 형식]\n① 한 줄 요약: 이 기사가 무슨 이야기인지 한 문장으로\n② 쉬운 번역: 기사 순서대로\n③ 어려운 말 풀이: 기사에 나온 경제 용어 3~5개를 한 줄씩 쉽게 설명\n④ 그래서 무슨 뜻이야?: 이 소식이 주식 투자하는 사람에게 왜 중요한지 2~3줄\n   (기사에 나온 사실만 근거로, 내 생각이나 예측은 넣지 마)\n\n기사가 길어서 한 번에 다 못 하면, 어디까지 했는지 알려 주고 내가 \"계속\"이라고 하면 이어서 해 줘.";
  }
  $('dim').hidden = false; $('sheet').hidden = false; $('sheet').scrollTop = 0;
  document.body.style.overflow = 'hidden';
});
// ✦ 버튼: Gemini 요청 문장을 복사하고 원문을 엶 → 원문 화면에서 Gemini 를 불러 붙여넣기
function askAI(a){
  var q = a.dataset.q || '';
  try { if(navigator.clipboard) navigator.clipboard.writeText(q); } catch(e){}
  toast('요청 문장을 복사했어요 · 원문에서 측면 버튼 길게 → 「이 페이지에 관해 질문하기」 → 붙여넣기');
  setTimeout(closeSheet, 50);
}
function toast(msg){ var t = $('toast'); t.textContent = msg; t.hidden = false; clearTimeout(toast._t); toast._t = setTimeout(function(){ t.hidden = true; }, 4000); }
function closeSheet(){ $('dim').hidden = true; $('sheet').hidden = true; document.body.style.overflow = ''; }
document.addEventListener('keydown', function(e){ if(e.key==='Escape') closeSheet(); });
