times.com/news/industry/tesla-in-talks-with-chinas-catl-for-rechargeable-batteries-report/68357867?next=1","p":1795247229,"a":1795270287,"t":"Tesla in talks with China's CATL for rechargeable batteries: Report"}]},{"name":"⚡ 전고체배터리·ESS","note":"보유: KODEX 전고체배터리ESS TOP2플러스","breaking":false,"items":[{"s":"중국 손해보험과 Xiqing Energy는 에너지 저장 보험을 '경험 가격 책정'에서 '데이터 가격 책정'으로 촉진하기 위한 전략적 협력에 도달했습니다.","so":"經濟日報","tm":"11/23 21:00","c":2,"r":"tw","u":"https://money.udn.com/money/story/123828/9897045?from=edn_next_story","p":1795435231,"a":1795440104,"t":"中意財險與西清能源達成戰略合作，推動儲能保險從「經驗定價」邁向「數據定價」","su":"홍콩, 2026년 11월 23일 /PRNewswire/ -- 최근 중국그룹 손해보험유한공사(이하 '중국그룹 손해보험')와 베이징시칭에너지기술유한회사(이하 '시칭에너지')가 공식적으로 전략적 협력 계약을 체결했다. 이번 협력은 중국 최고의 에너지 저장 보안 기술 회사와 세계적으로 유명한 보험 그룹 간의 심층적인 협력을 의미합니다. Xiqing Energy의 능동 안전 기술은 GICC의 에너지 저장 발전소 인수 및 위험 가격 책정 프로세스에 깊이 통합될 것입니다. 양 당사자는 에너지 저장 자산 위험 관리를 위한 새로운 표준을 공동으로 확립하고, \"RaaS(Risk as a Service)\"를 핵심으로 하는 \"수동적 청구\" 모델에서 \"능동적 방어\"로 업계의 전환을 촉진하고, 업계를 선도하여 고품질, 저위험 개발 모델을 구축하고 글로벌 지속 가능한 개발에 힘을 실어줄 것입니다. AI 기반 언더라이팅 양 당사자는 실제 발전소 운영 정보와 배터리 안전 등급을 기반으로 지능형 언더라이팅 플랫폼을 공동 개발할 예정입니다. 플랫폼은 인수 양식을 기반으로 구조화된 자금 수집을 수행합니다. 과거 경험적 결함 라이브러리의 배터리 안전 위험 평가, 발전소 운영 정보의 비정형 특징 재구성, 도메인 수직형 대형 모델을 기반으로 한 포괄적인 위험 진화 추세 분석 및 판단과 같은 기술적 수단을 통해 에너지 저장 발전소의 주요 위험 매개변수를 표준화되고 비교 가능한 위험 점수로 변환하고 맞춤형 인수 계획을 동적으로 생성합니다. 해야 한다"},{"s":"에너지 저장 정책은 장기적으로 좋습니다. Southern Fund의 신에너지 ETF Southern(516160)은 이전 거래일에 3.00% 하락한 기초 지수 CSI New Energy Index(399808.SZ)를 추적합니다.","so":"财联社","tm":"11/23 15:45","c":2,"r":"cn","u":"https://www.cls.cn/detail/2541481","p":1795416359,"a":1795417562,"t":"储能政策长期利好，南方基金旗下新能源ETF南方(516160)跟踪标的指数中证新能源指数(399808.SZ) 前一交易日收跌3.00%"},{"s":"Jinlang Technology는 태양 에너지 저장에 5억 4400만 위안을 투자하여 태양광 발전소의 오래된 장부를 찢었습니다. 에너지 저장이 모든 것에 대한 답이 될까요? -36Kr","so":"www.36kr.com","tm":"11/23 11:48","c":2,"r":"cn","u":"https://www.36kr.com/p/4080484433974919","p":1795402092,"a":1795403803,"t":"锦浪科技5.44亿弃光投储，撕开光伏电站的旧账本，储能成为一切的答案？-36氪","su":"Jinlang Technology는 태양 에너지 저장에 5억 4400만 위안을 투자하여 태양광 발전소의 오래된 장부를 찢었습니다. 에너지 저장이 모든 것에 대한 답이 될까요? 소득 모델에 따라 태양광 에너지 저장 트랙 사이에 새로운 에너지 자금이 흐릅니다. Foresight Energy는 11월 20일 저녁 Jinlang Technology가 이사회에서 \"분산형 태양광 발전소 프로젝트\"를 종료했다고 발표했다는 사실을 알게 되었습니다. 본 프로젝트는 당초 3억 5400만 위안을 투자할 계획이었으나 11월 13일 현재 한 푼도 투자하지 않았다. 회사는 2개의 인버터 프로젝트에서 1억 8900만 위안을 추가로 조정하여 8GWh 에너지 저장 시스템의 연간 생산량에 5억 4400만 위안을 투자했습니다. 이에 앞서 GCL Energy Technology도 유사한 자금 재분배를 수행했지만 에너지 저장 절감액을 다시 태양광 발전으로 이전한 회사도 있었습니다. 돈이 두 선로 사이를 오가며 그 이유는 송풍구의 순환만큼 단순하지 않습니다. 전기 가격 메커니즘, 그리드 연결 규칙 및 수익 모델이 동시에 다시 작성되었습니다. 지붕은 여전히 그대로인데 계산대에서 결제방법이 바뀌었습니다."},{"s":"세계 최대의 액체 공기 에너지 저장 프로젝트를 방문해 보세요","so":"中国新闻网","tm":"11/22 15:17","c":2,"r":"cn","u":"https://www.chinanews.com.cn/cj/shipin/cns-d/2026/11-22/news1075696.shtml","p":1795328220,"a":1795334544,"t":"探访全球最大液态空气储能项目","su":"세계 최대 액체 공기 에너지 저장 프로젝트 방문 출시 시간: 2026년 11월 22일 14:17 출처: 중국 뉴스 네트워크 11월 22일 기자들은 칭하이 성 하이시 몽골 및 티베트 자치주 거얼무시에 위치한 세계 최대 60메가와트 액체 공기 에너지 저장 국가 시범 프로젝트를 방문했습니다. 이 프로젝트는 중국의 액체 공기 에너지 저장 기술에 대한 포괄적인 숙달을 의미하며 장비 국산화율은 100%에 달하고 에너지 저장 전력 및 용량은 세계 1위를 차지합니다. 올해 10월 30일 전력망에 성공적으로 연결됐다. 공기에너지저장장치(전기를 저장해 두는 큰 배터리)는 공기를 영하 194도까지 냉각해 액체 상태로 만든 뒤 저장했다가 전력이 필요할 때 방출해 전기를 생산하는 방식이다. 풍력과 태양광발전은 급속도로 발전하고 있지만 날씨에 따라 변동폭이 크고 변동폭이 크다. 그것들은 저장될 수도 없고 양도될 수도 없습니다. 이 프로젝트는 신에너지 전력의 \"낮은 계곡 저장 및 피크 사용\"을 실현하여 풍력 및 태양열 소비 문제를 효과적으로 해결합니다."},{"s":"전고체 전지의 금속 이물질, 영향 시각화의 신기술 : 재료 기술","so":"MONOist","tm":"11/24 14:00","c":1,"r":"jp","u":"https://monoist.itmedia.co.jp/mn/articles/2611/24/news025.html","p":1795496400,"a":1795499067,"t":"全固体電池の金属異物、影響可視化の新技術：材料技術","su":"차세대 EV의 낙찰 「전고체 전지」의 양산화에 착수하는, 제조시의 「금속 이물 혼입」에 의한 품질 리스크. 히타치와 히타치 하이테크는 이물질의 종류나 크기에 따른 성능에 미치는 영향을 체계적으로 해석하는 신기술을 개발했다."},{"s":"지속 가능한 방법론 │ \"Echelon Utilization\"이 나왔습니다. 전원 배터리의 순환 경제를 만드는 방법","so":"ThePaper.cn","tm":"11/24 13:19","c":1,"r":"cn","u":"https://www.thepaper.cn/newsDetail_forward_34540216","p":1795493942,"a":1795499065,"t":"可持续方法论｜“梯次利用”退场，动力电池循环经济怎么做","su":"한때 중국의 전력 배터리 재활용 정책과 산업 관행에서 중요한 위치를 차지했던 개념인 '사다리 활용'이 산업 관리 시스템에서 사라지고 있습니다. 2026년 7월 30일 산업정보기술부는 2026년 20호 공고를 발표했습니다."},{"s":"선그로우, 단독으로 해당 분야를 지원합니다! 배터리지수와 태양광지수 모두 2% 이상 상승했다. 반전이 다가오고 있나요?","so":"Jiemian.com","tm":"11/24 12:42","c":1,"r":"cn","u":"https://www.jiemian.com/article/15366790.html","p":1795491760,"a":1795499066,"t":"阳光电源，以一己之力撑起板块！电池、光伏指数双双涨超2%，反转来了吗？","su":"11월 24일 배터리와 태양광발전이 동시에 강화되면서 배터리도 강해졌다. 11시 30분 기준 CS전지는 2.62%, 국민에너지저장전지는 3.52%, 태양광산업은 2.00% 상승했다. 배터리 ETF(여러 주식을 묶어 파는 상품) 투자(561910)가 크게 늘었고, 태양광 ETF 투자(516230)도 뒤를 이었다."},{"s":"[일본 축전지 주식회사] 시즈오카현 후지시에서 계통용 축전 시설 “NC 후지시 오부치 축전소” 축전지 설치 개시(PR TIMES)","so":"毎日新聞","tm":"11/24 11:53","c":1,"r":"jp","u":"https://mainichi.jp/articles/20261124/pr2/00m/020/236000c","p":1795488795,"a":1795490319,"t":"［日本蓄電池株式会社］静岡県富士市にて系統用蓄電施設「NC富士市大渕蓄電所」蓄電池設置開始（PR TIMES）","su":"일본 축전지 주식회사(본사:도쿄도 치요다구, 대표 이사 사장:칠원 히데이치)는, 개발을 진행하고 있는 NC 후지시 오부치 축전소(소재지:시즈오카현 후지시)에 계통용 축전지를 설치한 것을 알려 드리겠습니다. 탄소 중립의 추진과 재생 가능 에너지의 도입 확대가 요구되는 가운데, 전력의 안정적인 공급에 필수적인"},{"s":"선저우 23호 승무원은 상반기에 여러 단계적인 성과를 달성하고 새로운 에너지 저장 배터리 궤도 검증 플랫폼을 구축했습니다.","so":"Now 新聞","tm":"11/24 11:03","c":1,"r":"hk","u":"https://news.now.com/home/international/player?newsId=670693&home=1","p":1795485813,"a":1795490317,"t":"神舟二十三號乘組在軌半年取得多項階段性成果 建造新型儲能電池在軌驗證平台","su":"[나우뉴스채널] 선저우 23호는 올해 5월 24일 늦은 밤 발사됐다. 우주비행사 3명 중 중국 우주정거장에 계속 주둔하는 주양주 사령관을 제외한 우주비행사 장즈위안과 홍콩 최초의 우주비행사 라이자잉이 다음주 지구로 귀환할 예정이다. 중국 유인 우주 공학 사무국 대변인은 화요일 Shen-23의 우주 비행사 3명이 궤도에 반년 동안 머물렀다고 말했습니다. 지상팀의 지원을 받아 일련의 우주과학 실험과 기술 테스트를 진행해 우주생명과학, 우주재료과학, 항공우주의학, 항공우주 신기술 분야에서 단계별 성과를 달성했다."},{"s":"나가노현에서 잇따르는 축전지나 태양광 발전 시설 계획 현이 신고 기준을 엄격화에","so":"信濃毎日新聞デジタル","tm":"11/24 06:03","c":1,"r":"jp","u":"https://www.shinmai.co.jp/news/article/gf01dc21008vbt4um9igs1eg","p":1795467780,"a":1795474296,"t":"長野県で相次ぐ蓄電池や太陽光発電施設計画 県が届け出基準を厳格化へ","su":"현의 새로운 경관 계획에서는, 사업자가 전기 공급 시설이나 태양광 발전 시설을 설치할 때, 사전의 신고를 의무화하는 대상을 확대했다=그림. 현내를 포함한 각지에서 전기 공급 시설의 설치 계획이 잇따르는 등, 최근의 시설 정비의 동향을 근거로 엄격화한다. 2027년 4월 1일에 운용을 시작해 5월 2일 이후에 착수하는 공사로부터 적용한다. 축전지 시"},{"s":"해외조사 및 선정 | 골드만삭스: 글로벌 배터리 수급 비율은 2029년 바닥을 칠 수 있고, 에너지 저장 성장은 초과분을 상쇄하기 어려울 것","so":"财联社","tm":"11/24 05:26","c":1,"r":"cn","u":"https://www.cls.cn/detail/2506034","p":1795465591,"a":1795503278,"t":"海外研选 | 高盛：全球电池供需比或2029年触底 储能增长难抵过剩","su":"① 미국은 전기차 배터리 과잉을 지속하고 있으나, 에너지 저장 배터리의 현지 생산 능력이 부족하다. ② 한국 배터리 업체들의 유럽 시장 점유율은 부분적으로 안정됐지만, 중국의 수입 경쟁은 여전히 치열하다. ③ 국내 배터리셀 제조사들은 2027년과 2028년 이익 전망치를 평균 10% 낮췄는데, CATL의 에너지 저장장치 전환이 유망하다. 차이롄서, 10월 15일(편집자 Xia Junxiong) 골드만삭스는 10월 14일 글로벌 배터리 산업 조사 보고서를 발표했습니다. 이는 에너지 저장 시장의 급속한 확장으로 배터리 수요 전망이 개선되고 있지만, 글로벌 배터리 산업은 여전히 과잉 생산 능력, 지역 시장 수급 불균형 및 치열한 시장 경쟁에 직면해 있으며, 이는 업계가 사이클이 바닥을 쳤다는 것을 확인하기에 충분한 신호를 아직 보지 못했다는 것을 의미합니다. 은행은 중국 외 배터리 시장의 수급 공급률은 2027년을 바닥으로, 글로벌 시장은 2029년까지 수급 전환점이 이뤄지지 않을 것으로 내다봤다."},{"s":"에너지 인허가 개편안 美상원 통과에 태양광·ESS 수혜 가속화 - 머니투데이","so":"머니투데이","tm":"11/24 05:20","c":1,"r":"kr","u":"https://www.mt.co.kr/amp/industry/2026/11/24/2026112314435883552","p":1795465200,"a":1795490316,"su":"미국 상원의 에너지 인허가 개편안 통과로 국내 태양광·배터리 업계의 수혜 기대감이 커지고 있다. 데이터센터(컴퓨터 수만 대를 모아 둔 건물) 전력 공급과 전력망 확충 비용 부담을 사업자에게 부과하고 신재생에너지 발전사업의 인허가 절차를 간소화하는 내용이 담기면서 미국 내 발전·ESS(에너지저장장치(전기를 저장해 두는 큰 배터리)) 프로젝트 확대와 기자재 수요 증가로 이어질 수 있다는 분석이다."},{"s":"지역 경제의 지금 (34) 도쿠시마 배터리 밸리 구상 축전지 산업, 성장의 기둥에","so":"日刊工業新聞","tm":"11/24 05:00","c":1,"r":"jp","u":"https://www.nikkan.co.jp/articles/view/797784","p":1795464000,"a":1795474297,"t":"地域経済の今（34）徳島バッテリーバレイ構想 蓄電池産業、成長の柱に"},{"s":"인도 올라 전기(Ola Electric)는 중장기적으로 배터리 셀 용량을 6GWh에서 20GWh로 확장하는 것을 목표로 하고 있다.","so":"AutoTechInsight","tm":"11/23 23:51","c":1,"r":"world","u":"https://autotechinsight.spglobal.com/news/5291559/indias-ola-electric-aims-to-scale-battery-cell-capacity-from-6-gwh-to-20-gwh-in-mid-to-long-term","p":1795445496,"a":1795478670,"t":"India’s Ola Electric aims to scale battery-cell capacity from 6 GWh to 20 GWh in mid- to long-term","su":"이번 확장은 인도의 첨단 화학 셀 생산 연계 인센티브 프로그램에 따라 Ola가 최대 20GWh를 할당한 것과 일치합니다."},{"s":"[Q&A룸] 당성기술(Dangsheng Technology): 다양한 고체전해질이 주요 고객들로부터 검증을 거쳐 소량으로 구현되었습니다.","so":"中证网","tm":"11/23 21:07","c":1,"r":"cn","u":"https://jnzstatic.cs.com.cn/zzb/htmlInfo/138993.html","p":1795435620,"a":1795440102,"t":"【答疑室】当升科技： 多款固态电解质已通过头部客户验证并实现小批量应用","su":"[Q&A룸] 당성기술(Dangsheng Technology): 다수의 고체 전해질이 주요 고객들로부터 검증을 거쳐 소량으로 구현되었습니다. 최근 한 투자자가 대화형 플랫폼에서 Dangsheng Technology에 질문했습니다. 회사의 전고체 양극재 연구 개발 및 마케팅에 새로운 진전이 있습니까? 에너지 저장을 위한 15차 5개년 계획은 회사에 어떤 개발 기회를 제공합니까?"},{"s":"Tonghe Technology: 10억 3천만 위안을 투자하여 컴퓨팅 전력 및 에너지 저장 통합 전력 장비 프로젝트 구축 계획","so":"第一财经","tm":"11/23 20:12","c":1,"r":"cn","u":"https://www.yicai.com/brief/103450754.html","p":1795432320,"a":1795435007,"t":"通合科技：拟投资10.03亿元建设算力储能一体化电源装备项目","su":"Tonghe Technology는 회사가 스자좡시 하이테크 구역 과학 기술 기업 단지 관리 사무실과 구역 진입 계약을 체결하고 총 투자액 10.0의 통합 컴퓨팅 성능 및 에너지 저장 지능형 완전 전원 공급 장치 산업화 프로젝트 건설에 투자할 계획이라고 발표했습니다."},{"s":"포스코 AI데이터센터·ESS용 새 철강재 개발 박차, '지속가능소재 포럼'서 협약 26건 체결","so":"비즈니스포스트","tm":"11/23 16:44","c":1,"r":"kr","u":"https://www.businesspost.co.kr/BP?command=article_view&num=452684","p":1795419882,"a":1795424019,"su":"포럼에는 포스코의 국내외 고객사 450여 곳의 관계자 1000여 명이 참석했다. 포럼에서는 AI 데이터센터(컴퓨터 수만 대를 모아 둔 건물), 전력 인프라, 에너지저장장치(전기를 저장해 두는 큰 배터리) 등에 요구되는 고내식성, 전자파 차폐, 고효율, 저탄소 배출 등의 요건을 충족하는 철강재 사업과 관련한 현황과 전략이 제시됐다. 조너선 브릴 스페셜프로젝트에이전시 대표이사의 기조강연을 시작으로 구글 클라우드, 유비테크 로보틱스 등의 기업 관계자들까지 총 31건의 강연이 진행됐다."},{"s":"오늘 1차 액티브 ETF가 상장됐고, 배터리 리더는 12개 ETF로 공동배분됐다 - 배터리 ETF에 주목하고 영원히 승리하라(158019)","so":"21财经","tm":"11/23 16:40","c":1,"r":"cn","u":"https://www.21jingji.com/article/20261123/herald/c93a35e27a33056579250b5814ea5f3c.html","p":1795419600,"a":1795447031,"t":"首批主动ETF今日挂牌、电池龙头获12家ETF共同配置——关注电池ETF永赢（158019）","su":"11월 23일, 첫 번째 18개 활성 ETF(여러 주식을 묶어 파는 상품)가 상하이 및 선전 증권거래소에 공식 상장되어 총 360억 위안을 모금했습니다. 신청 및 환매 목록에 따르면 목록의 예상 포지션 규모를 기준으로 Kweichow 마오타이, Midea Group 및 CATL이 상위 3대 비중 주식에 속합니다. ETF 배정수량은 CATL이 12개 ETF로 배정돼 전체 종목 중 1위를 기록했다(자료출처: Wind, 2026/11/20 기준). 지수 가중치에 따라 기계적으로 구매되는 패시브 상품과 달리 액티브 ETF 포지션은 펀드매니저가 독립적으로 선택합니다. 배터리 리더는 서로 다른 전략을 가진 12개의 액티브 ETF로 공동 할당되었습니다. 이는 가치, 배당(회사가 주주에게 나눠주는 돈), 균형 및 성장과 같은 다양한 스타일을 가진 액티브 운용 펀드가 배터리 산업 체인의 핵심 리더에 대해 공동으로 낙관적이라는 것을 의미합니다."},{"s":"전고체전지 안전표준사업이 정식 제정되어 서던펀드의 저가제품배터리 ETF 서던(159147)이 시장에서 활발히 활동하고 있습니다.","so":"Jiemian.com","tm":"11/23 16:30","c":1,"r":"cn","u":"https://www.jiemian.com/article/15362130.html","p":1795419035,"a":1795424020,"t":"固态电池安全标准正式立项，南方基金旗下低费率产品电池ETF南方(159147)盘中活跃","su":"14시 45분 현재 배터리 ETF(여러 주식을 묶어 파는 상품) Southern(159147)은 장중 거래량이 3705.69만위안으로 2.83% 변동되었습니다. 추적지수 CSI 배터리테마지수(931719)는 한때 3.13% 이상 상승했다가 현재 2.12% 상승 중이다."},{"s":"[기고] 1조달러 수출 강국 도약, 다음 10년 주역은 K배터리다","so":"전자신문","tm":"11/23 16:00","c":1,"r":"kr","u":"https://www.etnews.com/20261123000183","p":1795417200,"a":1795417560,"su":"대한민국 경제가 마침내 세계 네 번째로 '수출 1조달러'라는 금자탑을 쌓아 올렸다. 1964년 수출 1억달러를 달성한 지 62년 만에 이뤄낸 1만 배의 성장이자, 세계 4대 수출 강국으로 우뚝 선 역사적 쾌거다. 이번 성과는 일제 강점기의 아픔을 딛고 한국전쟁의 잿더미 속에서 맨손으로 일어나 '한강의 기적'을 일궈낸 대한민국이기에 더욱 벅찬 감동으로 다가온다. 1조달러 고지를 밟은 국가 중 식민 지배와 전쟁의 폐허를 모두 경험하고 이처럼 눈부신 성장을 이룬 나라는 대한민국이 유일하다."},{"s":"Puyuan Energy x QPO Energy, 글로벌 레이아웃을 위해 에너지 저장 소프트웨어와 하드웨어 통합 | 녹색산업 | 사업정보","so":"經濟日報","tm":"11/23 11:00","c":1,"r":"tw","u":"https://money.udn.com/money/story/5722/9891959","p":1795399233,"a":1795403805,"t":"普元能源x QPO Energy 整合儲能軟硬體 布局全球 | 綠色產業 | 商情","su":"이 글은 총 1,383개의 단어로 구성되어 있습니다. 전 세계적으로 에너지 전환이 가속화되고 있으며, 에너지 저장 산업은 전력 시스템에서 없어서는 안 될 부분이 되었습니다. Puyuan Energy Technology와 미국 회사인 QPO Energy는 소프트웨어 및 하드웨어 분야에서 각각의 기술적 이점을 결합하여 전략적 파트너가 되었습니다. 에너지 저장 시스템 통합, 에너지 관리 기술 및 국제 시장 자원을 통해 대만 및 해외 시장을 적극적으로 확장하고 경쟁이 치열한 에너지 저장 시장에서 시장 입지를 확립할 것입니다. QPO Energy 창립자 Joseph Lu는 그리드 에너지 저장 분야의 거인입니다. 그는 세계적으로 유명한 에너지 저장 시스템 통합업체인 포윈(Powin)을 설립하고 회장을 맡고 있다. 7년 연속 성공적인 창업 경험을 쌓은 그는 4년 전 QPO에너지를 창업해 에너지 저장 사업의 새 장을 열었다."},{"s":"ASX 배터리 주식, 그리드 스토리지 지출 변화에 따라 자세히 살펴보기","so":"Yahoo Finance","tm":"11/23 10:07","c":1,"r":"us","u":"https://finance.yahoo.com/energy/articles/asx-battery-stocks-getting-closer-010751113.html","p":1795396020,"a":1795478669,"t":"ASX Battery Stocks Getting A Closer Look As Grid Storage Spending Shifts","su":"Snowy 2.0의 예산은 약 A$20억에서 A$250억에 달하며 그리드 규모 스토리지를 뉴스) 장보인 기자 = 체코 두코바니 원전 5·6호기 건설 사업을 진행하는 '팀코리아' 기업들이 적기 준공을 약속했다."},{"s":"LS일렉트릭 송·배전 수주잔고 7조 육박…AI 투자 둔화는 '변수' - 머니투데이","so":"머니투데이","tm":"11/23 16:20","c":2,"r":"kr","u":"https://www.mt.co.kr/amp/industry/2026/11/23/2026112313483428648","p":1795418400,"a":1795474306,"su":"LS일렉트릭(LS ELECTRIC)이 북미 AI(인공지능) 데이터센터(컴퓨터 수만 대를 모아 둔 건물) 전력기기 수요 확대에 힘입어 송·배전 사업 수주(일감 주문을 받는 것)잔고를 1년새 76% 넘게 늘렸다. 납품 규모 확대에도 신규 수주가 더 빠르게 증가한 결과다."},{"s":"AI 반도체가 전력 인재 전쟁을 시작했다. 전력공학회 엘리트 표창, 학생 53명 수상 | 업계 뉴스 | 사업정보","so":"經濟日報","tm":"11/23 11:01","c":2,"r":"tw","u":"https://money.udn.com/money/story/11799/9892202","p":1795399308,"a":1795403819,"t":"AI半導體掀電力人才爭奪戰 電力工程協會表揚菁英、53人次學生獲獎 | 產業動態 | 商情","su":"인공지능(AI)과 반도체(전자기기의 두뇌 부품) 산업의 급속한 발전으로 대만의 전력 수요는 지속적으로 증가하고 있으며, 전력 산업 역시 인재 확보를 위한 산업 간 경쟁의 도전에 직면해 있습니다. 대만 전력 에너지 공학 협회는 전력 공학 분야의 뛰어난 인재를 표창하는 주요 축으로 \"권력 상속, 인재 육성 및 유지\"를 주제로 11월 20일 제8회 \"전력망 인재 개발 연합 장학금\"과 제7회 \"류수성 기념상\" 시상식을 개최했습니다. 그 중 39개 그룹과 53명의 학생이 전력망 인재 장학금을 수여받아 대만의 전력 인재 양성 성과를 입증했습니다. 총통부 참사관 심롱진(Shen Rongjin)은 전기는 국력이라고 말했다. AI 시대에는 컴퓨팅 파워의 발전을 위해서는 안정적인 전력 지원이 필요하다. AI 데이터센터(컴퓨터 수만 대를 모아 둔 건물)와 반도체 산업이 성장하는 가운데 정부는 전력 개발, 저탄소 에너지, 그리드 탄력성 구축을 지속적으로 추진하고 있다. 그러나 건전한 에너지 정책은 여전히 전문 인재에 의해 구현되어야 합니다. 기업과 산학계가 함께 인재양성에 투자해 주기를 바랍니다. Taipower의 Kuo Tianhe 총책임자는 AI와 반도체 산업이 전력 소비의 수요와 패턴을 변화시키고 있다고 지적했습니다. Taipower는 전력망의 탄력성을 강화하고 장비를 업그레이드하며 재생 가능 에너지를 통합하는 것 외에도 시스템의 디지털화를 적극적으로 추진하고 있습니다. 산업 간 인재 경쟁이 심화되는 가운데, 앞으로도 전문전수와 산학협력을 심화해 청년들이 전력분야에 투자할 수 있도록 유치해 나가겠습니다. 협회 명예회장 Liu Wenxiong은 전기가 지원뿐만 아니라"},{"s":"노무라투자신탁은 2027년 미국 데이터센터 사업 기회에 대해 낙관하고 있으며, 대만 공장 공급망이 수혜를 입을 것으로 전망","so":"自由時報","tm":"11/24 15:53","c":1,"r":"tw","u":"https://stock.ltn.com.tw/article/cwjbdsqjdsut","p":1795503232,"a":1795504104,"t":"野村投信看好2027美國資料中心商機 台廠供應鏈受惠","su":"노무라투자신탁은 오늘(24일) 대만 주식 투자 전망 기자간담회를 열었습니다. 국내 주식 투자 부서 Yao Yuru 부사장은 내년에도 세계 경제가 계속 성장할 것으로 예상되며, 제조업 붐의 개선과 함께 대만의 수출은 여전히 전자 제품에 의해 뒷받침될 것이며 기업 흑자(번 돈이 쓴 돈보다 많은 것)는 계속 증가할 것으로 예상된다고 지적했습니다. 단기적으로는 정책 불확실성과 자본 비용, AI 투자 회복 우려 등이 있지만 AI 애플리케이션 확대와 하드웨어 사양 업그레이드 추세에는 변함이 없다. 2027년 미국 데이터센터(컴퓨터 수만 대를 모아 둔 건물) 전원공급장치"},{"s":"‘AI 거품론’ 비웃듯…K-변압기 美 수출 하반기 78% 급증","so":"에너지경제신문","tm":"11/24 14:46","c":1,"r":"kr","u":"https://www.ekn.kr/web/view.php?key=20261124023133895","p":1795499198,"a":1795503066,"su":"국내 전력기기 업계의 대형변압기 수출이 하반기 들어 가파른 증가세를 보이는 것으로 나타났다. 특히 인공지능 데이터센터(AIDC) 건설이 활발한 미국 시장에서 수출금액과 물량이 동반.."},{"s":"젠슨황 돌아왔다…반도체·기판·전력기기 전방위 랠리","so":"한국경제","tm":"11/24 09:37","c":1,"r":"kr","u":"https://www.hankyung.com/article/2026112460386","p":1795480670,"a":1795490329,"su":"AI 추천 뉴스 젠슨황 돌아왔다…반도체(전자기기의 두뇌 부품)·기판·전력기기 전방위 랠리 젠슨 황 엔비디아 최고경영자(CEO)의 복귀 소식 이후 국내 증시에서 반도체·기판·전력기기 등 인공지능(AI) 인프라 관련주가 일제히 급등하고 있다. 황 CEO가 주도한 '순환금융' 구조가 연속성을 가지면서 AI 생태계의 자본 병목이 해소되고 인프라 수요가 계속될 것이란 기대감이 반영된 것으로 풀이된다. 이날 오전 9시11분 현재 유가증권시장에서 반도체 대장주 삼성전자는 전 거래일 대비 1만2600원(7.1%) 오른 19만100원을 기록하고 있다."},{"s":"APLD, 잠재적 매출 127억 달러로 또 다른 18년 AI 컴퓨팅 전력 계약 체결 - 국제","so":"工商時報","tm":"11/24 08:54","c":1,"r":"tw","u":"https://www.ctee.com.tw/news/20261124700563-430702","p":1795478040,"a":1795503291,"t":"APLD再簽18年AI算力長約潛在營收上看127億美元- 國際","su":"미국 AI 데이터센터(컴퓨터 수만 대를 모아 둔 건물) 운영업체인 어플라이드디지털(APLD.US)이 투자등급 신용등급을 갖춘 초대형 클라우드 제공업체와 150MW 규모의 데이터센터 IT 용량을 제공하는 장기 임대 계약을 체결했다고 23일 밝혔다. 18년 기본 임대 계약의 총 가치는 54억 달러로, AI 인프라에 대한 수요가 지속적으로 증가하고 있음을 강조합니다. 로이터 통신은 어플라이드 디지털이 고객의 신원을 공개하지 않았지만..."},{"s":"KCL-부천시, AI 전력반도체 산업 육성 위한 전략적 협력 본격화","so":"전기신문","tm":"11/24 08:50","c":1,"r":"kr","u":"https://www.electimes.com/news/articleView.html?idxno=375180","p":1795477830,"a":1795478679,"su":"KCL과 부천시가 AI 전력반도체(전자기기의 두뇌 부품) 산업 육성에 손을 맞잡았다.한국건설생활환경시험연구원(원장 천영길, 이하 ‘KCL’)은 23일 경기 부천시 부천아트벙커B39에서 부천시(시장 조용익)와 전력반도체 산업 육성 및 지역기업 지원을 위한 업무협약을 체결하고, ‘AI 전력반도체 산업기술연구조합’ 창립총회를 개최했다고 밝혔다.이번 행사는 AI 데이터센터(컴퓨터 수만 대를 모아 둔 건물), 미래 모빌리티 등 첨단산업의 핵심 부품인 전력반도체 분야 기술경쟁력을 강화하고, 산·학·연 공동연구 및 시험·평가 기반을 구축하기 위해 마련됐다.KCL과 부천시는 이번 협약을 통해 부천시의"},{"s":"케이티이, 해군과 이지스함 전력기기 기술 교류회 개최","so":"아시아경제","tm":"11/24 08:13","c":1,"r":"kr","u":"https://www.asiae.co.kr/article/2026112408131163432","p":1795475592,"a":1795478679,"su":"케이티이가 해군과 기술 교류회를 열었다. 24일 케이티이에 따르면 이번 행사는 올해 초 HD현대중공업에 공급한 '이지스함 주파수변환기'의 후속 협력 차원에서 마련됐으며 장비의 기술적 특성을 공유하고 운용∙유지보수에 필요한 지원 방안을 논의하기 위해 진행됐다. 방문단은 주파수변환기 생산∙시험 설비를 둘러보고 국산화 장비의 주요 기술 사양과 함정 전력 시스템 운용에 관한 의견을 교환했다. 특히 해상 운용 환경에서의 요구 사항과 향후 유지보수(MRO) 효율화 방안 등 실무 협력 과제를 논의했다."},{"s":"효성중공업, 신사L타워 책임준공 후폭풍…3천억 PF 채권 회수 막히나","so":"뉴스핌","tm":"11/24 06:00","c":1,"r":"kr","u":"https://www.newspim.com/news/view/20261123001011","p":1795467600,"a":1795474306,"su":"[서울=뉴스핌] 박우진 기자 = 서울 강남구 잠원동 개발사업에서 3000억원대 프로젝트파이낸싱(PF) 채무를 떠안은 효성중공업이 토지·건물 취득을 계기로 채권(나라나 회사에 돈 빌려준 증서) 회수에 나선다.부지 취득을 통해 채권 회수 기반을 마련했지만 여전히 1000억원에 가까운"},{"s":"기상 예측 AI, 일사량을 고정밀도로 중국 신흥이 전력 거래 지원","so":"日本経済新聞","tm":"11/24 05:00","c":1,"r":"jp","u":"https://www.nikkei.com/prime/gx/article/DGXZQOUC10BA70Q6A111C2000000","p":1795464000,"a":1795474312,"t":"気象予測AI、日射量を高精度に 中国新興が電力取引支援","su":"세계 최대 태양광발전소(중국 국유건설회사 SNS 공식 사이트에서) 기상 예측 AI를 개발하는 중국 스타트업 '천서지능(Tianxu Ai)'이 최근 추가 프리시리즈 A로 후유설 자본(Houxue Capital)에서 수천만 위안(수억~십수억엔)을 조달했다. 자금은 자사의 위성 콘스텔레이션(위성군)의 구축, AI 모델의 개량, 주요 고객의 개척, 해외 전개를 향한 조사 등에 충당한다. 천서지능은 2024년 10월에 설립되었다. 창업자 리유 씨는 중국 과학원 대학에서 기상학 박사"},{"s":"AI 데이터센터 투자액은 4조 달러에 이를 것으로 예상되며, 글로벌 전력망 확장 압력을 받고 있다.","so":"DIGITIMES","tm":"11/24 02:08","c":1,"r":"tw","u":"https://www.digitimes.com.tw/tech/dt/n/shwnws.asp?id=775520","p":1795453715,"a":1795474308,"t":"AI資料中心投資上看4兆美元 全球電網面臨擴建壓力","su":"인공 지능(AI) 데이터 센터의 가속화된 확장은 글로벌 전력 공급 및 수요 구조를 변화시키고 있으며 오래되고 느리게 확장되는 전력망에 전례 없는 압력을 가하고 있습니다. 최근 국제에너지기구(IEA)는 2030년까지 전 세계 데이터센터(컴퓨터 수만 대를 모아 둔 건물) 전력 소비량이 현재 수준의 거의 두 배인 연간 1,000TWh에 육박하고, 데이터센터 관련 투자 규모도 4조 달러에 달할 것이라고 경고했다. <b..."},{"s":"이튼(ETN), AI 분야로 반등, 데이터센터 관련 사업 밝게 성장","so":"经济观察网","tm":"11/24 01:26","c":1,"r":"cn","u":"https://www.eeo.com.cn/2026/1124/1100572.shtml","p":1795451160,"a":1795490331,"t":"伊顿（ETN）随AI板块反弹 数据中心相关业务增长亮眼","su":"경제관측망 이튼(ETN) 주가는 최근 AI 분야 전반의 반등으로 상승세(오르는 흐름)를 보이고 있다. 데이터센터(컴퓨터 수만 대를 모아 둔 건물) 사업이 급속히 성장했지만, 기관들은 여전히 업계의 장기적인 수요와 회사의 부채에 대해 우려하고 있다. 부문 변경 11월 23일, 엔비디아 이사회는 만장일치로 젠슨 황을 사장, CEO 및 이사로 복귀시키기로 결정했습니다."},{"s":"Taipower의 강력한 전력망 사업 기회를 활용하여 Spectrum Electrician의 주문 가시성은 2H27에 도달합니다.","so":"DIGITIMES","tm":"11/24 01:24","c":1,"r":"tw","u":"https://www.digitimes.com.tw/tech/dt/n/shwnws.asp?id=775768","p":1795451069,"a":1795474309,"t":"搭上台電強韌電網商機 光譜電工訂單能見度達2H27","su":"옵토일렉트로닉스(Optoelectronics) 자회사 스펙트럼 일렉트리컬(Spectrum Electrical)은 지난 23일 기자간담회를 열고 대형 트랜스포머를 중심으로 PCB 소모품을 보완하는 듀얼 엔진 운영 구조를 형성했다고 밝혔다. 매출(물건을 판 돈 전체) 비중은 변압기 사업이 75%, PCB 소모품이 25%를 차지한다. 연초에도 여전히 존재하던 뷰티 제품 매출이 '0'으로 돌아왔다. 2026년 첫 3분기에는 매출총이익률이 30%로 증가하고, 주당순이익(주식 한 주가 번 돈)은 0.86위안으로 2위안을 넘어설 예정이다."},{"s":"COP31 반대 의견…펑치밍: 원자력을 재가동하면 전력 탄소 배출을 줄일 수 있다","so":"UDN","tm":"11/24 01:02","c":1,"r":"tw","u":"https://udn.com/news/story/7314/9897383","p":1795449769,"a":1795474310,"t":"COP31分歧…彭啓明：重啟核電 可降電力排碳","su":"제31차 유엔기후변화협약 당사국총회(COP31)가 어제 끝났습니다. 다만 화석연료라는 단어는 삭제됐고, 구체적인 조정자금 규모도 명시되지 않았다. 협상이 결렬되었습니다. 초안에서는 \"35×35\" 전기화 목표를 유지했습니다. Peng Qiming 환경부 장관은 어제 국제 사회가 화석 연료로의 전환을 둘러싸고 분열되어 있으며 대만은 기다리지 않을 것이라고 말했습니다. 화석연료로부터의 전환은 변하지 않는 방향이다."},{"s":"AI 전력 수요 급증: API CEO, 에너지 수요 증가 경고","so":"Fox Business","tm":"11/24 00:16","c":1,"r":"us","u":"https://www.foxbusiness.com/video/6408768385112","p":1795447007,"a":1795474307,"t":"AI power demand is surging: API CEO warns of growing energy needs","su":"American Petroleum Institute의 회장 겸 CEO인 Mike Sommers는 UN 기후 회담의 결렬, 화석 연료 분쟁 및 미국 에너지 정책의 미래에 대해 논의합니다."},{"s":"친환경 전력에서 친환경 전력망까지: Bauma Shanghai 첫날 SANY Group은 신에너지와 건설 기계 간의 긴밀한 협력을 위한 친환경 답안지를 제공했습니다.","so":"經濟日報","tm":"11/23 23:00","c":1,"r":"tw","u":"https://money.udn.com/money/story/123828/9897249","p":1795442444,"a":1795447040,"t":"從一度綠電到一張綠色電網：上海寶馬展開展首日，三一集團交出新能源與工程機械深度協同的綠色答卷","su":"상하이, 2026년 11월 23일 /PRNewswire/ -- 11월 23일부터 27일까지 bauma CHINA 2026이 상하이의 이중 전시관에서 공동으로 개최됩니다. Sany Group은 \"길을 선도하고 함께 미래를 건설하는 스마트 전기\"라는 주제로 데뷔했습니다. 세계 엑스포 전시 컨벤션 센터의 마이크로그리드 전시관에 위치한 \"스마트 전기 에너지 스테이션\"은 광전지 모듈, 풍력 터빈 모델, 수소 전해조, 대형 트럭 배터리 에너지 저장 장치 및 디젤 발전기 세트로 구성된 완전한 하드웨어 매트릭스를 선보입니다. 일회성 녹색 전기 생산부터 완전한 마이크로그리드 네트워크 세트의 구현 및 제공에 이르기까지 전체 체인 디스플레이를 실현합니다. \"마이크로그리드 + 풍력, 태양광, 수소 및 장작 저장: 하나의 네트워크에 있는 \"5가지 작업\" 전시장에서는 5가지 유형의 에너지 장치가 \"풍력, 태양광, 수소 및 장작 저장\" 다중 에너지 보완 시스템을 구성합니다. 태양광은 기본 전원으로 낮 동안 주요 부하를 지원하고, 풍력 터빈은 위치를 채우고 밤과 비오는 날에 전력 공급을 지속하는 역할을 담당하며, 수소 에너지는 잉여 전기를 전기분해하여 수소를 생산하고 저장하는 \"곡물 저장소\" 역할을 합니다. 오랫동안 새로운 에너지의 변동을 완화하는 에너지 저장 장치는 비상 백업 전력을 고려하여 피크 방전 및 밸리 충전 기능을 갖추고 있으며 극한의 작업 조건에서 \"예비 타이어\"이며 에너지 저장과 밀접한 관련이 있습니다."},{"s":"데이터 센터 전력이 그리드를 초과함에 따라 전기 유틸리티 노출에 대한 3개 자금","so":"Yahoo Finance","tm":"11/23 21:09","c":1,"r":"us","u":"https://finance.yahoo.com/energy/articles/3-funds-electric-utility-exposure-120915255.html","p":1795435755,"a":1795447039,"t":"3 Funds With Electric Utility Exposure As Data Center Power Outruns The Grid","su":"전력 사용량이 많은 세 가지 펀드는 실제로 얼마나 다를 수 있으며, 실제로 전력 스토리에서 원하는 조합은 무엇입니까? 이제 데이터 센터 전력 수요가 연간 약 19% 증가하고 그리드가 약 2% 증가하고 있기 때문에 이 질문은 더욱 중요해졌습니다. 규제 기관이 더 빠른 그리드 업그레이드를 통해 유틸리티가 수익을 얻도록 허용하고 고객이 그리드 전력을 현장 발전기로 완전히 교체하지 않는 경우"},{"s":"삼성전기: 2억 7,800만 위안 규모의 국가 전력망 입찰 및 조달 프로젝트 예비 수주","so":"第一财经","tm":"11/23 16:45","c":1,"r":"cn","u":"https://m.yicai.com/news/103450373.html","p":1795419927,"a":1795424027,"t":"三星电气：预中标2.78亿元国家电网招标采购项目","su":"삼성전기는 최근 2026년 중국 동부 지역에서 10kV 변압기와 10kV 주상 변압기 세트의 2차 공동 조달을 위한 중국 국가 전력망 공사의 2차 공동 조달 기본 협약(계약 재고)에서 삼성전기의 100% 자회사인 닝보옥스 인텔리전트 테크놀로지(Ningbo Oaks Intelligent Technology Co., Ltd.)가 낙찰자로 추천됐다고 밝혔습니다. 총 낙찰가는 약 2억 7,800만 위안(약 2억 7,800만 위안)이 될 것으로 예상됩니다."},{"s":"전력기기 40여년 한우물…태양광· SMR도 공략","so":"매일경제","tm":"11/23 15:29","c":1,"r":"kr","u":"https://www.mk.co.kr/news/business/12216164","p":1795415377,"a":1795417568,"su":"이재광 이엔에스일렉트릭 회장 신입서 오너까지 오른 주역 수배전반 등 주요 기기 생산 공공·민간에서 경쟁력 확보 전력 저장~송전 통합 솔루션 태양광·SMR 시대 대비나서 “3년내 매출(물건을 판 돈 전체) 500억원 목표”"},{"s":"수주잔고 38조 쌓은 전력기기 3사…AI 고점론에 수익성 시험대","so":"이데일리","tm":"11/23 15:04","c":1,"r":"kr","u":"https://www.edaily.co.kr/News/Read?newsId=02689606645648672&mediaCodeNo=257","p":1795413846,"a":1795414363,"su":"인공지능(AI) 데 519,"a":1795403812,"su":"[뉴스락] 효성중공업이 서울 영등포구 문래동에 공급하는 해링턴 플레이스 문래가 특별공급을 시작으로 본격적인 청약(새로 사겠다고 신청하는 것) 일정에 들어간다.효성중공업은 해링턴 플레이스 문래의 특별공급 청약을 23일 시작한다고 밝혔다.지난 20일 개관한 견본주택에는 주말 동안 방문객들의 발길이 이어졌으며 청약 관련 문의도 계속됐다는 것이 회사 측 설명이다.단지는 서울 지하철 2호선 문래역과 1호선·KTX 영등포역, 2·5호선 영등포구청역, 5호선 영등포시장역 인근에 들어선다. 여의도 업무지구와 구로·가산디지털단지 등 주요 업무지역으로 이동할 수 있다.주변에는"},{"s":"한수원, 대우건설·두산에너빌리티와 체코 원전 시공 협약 종료","so":"한스경제","tm":"11/23 09:02","c":1,"r":"kr","u":"http://www.hansbiz.co.kr/news/articleView.html?idxno=885984","p":1795392159,"a":1795403812,"su":"| 서울=한스경제 김혜지 기자 | 한국수력원자력(한수원)이 대우건설·두산에너빌리티 컨소시엄과 체결한 체코 두코바니 원전사업 시공분야 공동협력 협약을 종료했다.한수원은 지난 20일 대우건설·두산에너빌리티 컨소시엄과의 시공분야 공동협력 협약을 종료했다고 밝혔다.한수원과 컨소시엄은 지난해 6월 체코 발주사와 본계약을 체결한 이후 원전 주설비공사 시공계약 체결을 위한 협상을 진행해 왔다.그러나 계약 조건에 대한 최종 합의에 이르지 못하면서 지난 10월 말 협상을 마무리했다. 이번 공동협력 협약 종료는 협상 중단에 따른 후속 조치다.한수원은"},{"s":"트럼프, 또 관세 부과…해외 데이터센터 짓는 미국 기업에 과중한 세금 부과 - 국제투데이","so":"工商時報","tm":"11/23 08:53","c":1,"r":"tw","u":"https://www.ctee.com.tw/news/20261123700557-430702","p":1795391580,"a":1795403821,"t":"川普又揮關稅大刀美企海外蓋資料中心恐挨重稅- 國際","su":"트럼프 미국 대통령은 20일 인공지능(AI) 분야 미국의 경쟁력 강화를 위해 미국 기업의 해외 데이터센터(컴퓨터 수만 대를 모아 둔 건물) 구축을 제한할 계획이라고 밝혔다. 기업이 해외 진출을 고집할 경우 높은 세금 부담을 안게 될 수 있어 시장의 주목을 받고 있다. 로이터 등 외신들은 트럼프 대통령이 지난 20일 백악관 기자회견에서 미국은 데이터센터 투자에 힘써야 하며 기업이 AI 인프라를 해외로 이전하는 것을 허용할 수 없다고 밝혔다고 보도했다. 이에 해외에 데이터센터를 짓는 미국 기업에 대한 제재를 검토하고 있다."},{"s":"[전일 주요공시] 롯데관광개발·금호건설·효성중공업·롯데케미칼 등","so":"이투데이","tm":"11/23 08:29","c":1,"r":"kr","u":"https://www.etoday.co.kr/news/view/2651440","p":1795390140,"a":1795403812,"su":"△마스턴프리미어리츠, 종속회사인 해외 투자기구 보유 투자부동산 매각(2026년 10월) 관련 예상 손실을 당기 투자부동산손상차손으로 인식△롯데관광개"},{"s":"[단독] 효성重, AI 전력난 뚫을 '게임 체인저'⋯반도체 변압기 전담팀 띄웠다 [차세대 전력망戰]","so":"이투데이","tm":"11/23 05:00","c":1,"r":"kr","u":"https://www.etoday.co.kr/news/view/2650523","p":1795377600,"a":1795389932,"su":"중공업연구소 내 SST TFT 신설, 핵심 인력 재배치22.9kV급 개발 이어 고압 대응 제품 연구개발 추진전력기기·ESS(전기를 저장해 두는 큰 배터리) 연계해 AI 데이터센터(컴퓨터 수만 대를 모아 둔 건물) 종합 솔루션"},{"s":"공장 적용부터 고객 선정까지…국내외 SST 사업화 경쟁 [차세대 전력망戰]","so":"이투데이","tm":"11/23 05:00","c":1,"r":"kr","u":"https://www.etoday.co.kr/news/view/2650526","p":1795377600,"a":1795389932,"su":"LS일렉트릭 DC팩토리 운영…HD현대일렉트릭도 개발 나서GE버노바, 옥외형 공급업체 선정…이튼·지멘스도 상용화 가세AI 데이터센터(컴퓨터 수만 대를 모아 둔 건물)용 반도체(전자기기의 두뇌 부품) 변압기(SST"},{"s":"Formosa Plastics의 Four Treasures 전략은 전자 및 반도체로 확장되었으며 다양한 신에너지 및 전력망 프로젝트도 이에 따랐습니다. - Daily News","so":"工商時報","tm":"11/23 04:00","c":1,"r":"tw","u":"https://www.ctee.com.tw/news/20261123700093-439901","p":1795374000,"a":1795403823,"t":"台塑四寶大布局搶進電子、半導體不稀奇各式新能源、電網項目也跟上- 日報","su":"Formosa Plastics Group은 에너지 수요와 공급 탄력성의 비즈니스 기회를 목표로 삼고 새로운 에너지 레이아웃을 가속화하고 있습니다. Nanya 및 Formosa New Intelligence에서 태양열 및 풍력 발전 투자와 중전력, 배터리, 에너지 저장 및 기타 비즈니스 프로젝트 개시 외에도 Formosa Plastics는 13억 2,600만 위안의 투자를 예상하면서 신에너지 확대를 위한 노력을 강화했습니다. Mailiao Automobile and Electric Company와 협력하여 자본금 26억 위안의 Taihua Maidian Renewable Energy Company를 설립할 예정이며 Taihua의 지분(회사를 나눠 가진 몫)율은 51%입니다. Taihua Maidian Renewable Energy의 초기 계획 투자 프로젝트에는 다음이 포함되는 것으로 알려졌습니다."},{"s":"미국 AI 데이터센터, 전력 연결 가속화 계획, 2개 주요 전력망 개혁 검토 제출","so":"DIGITIMES","tm":"11/23 03:40","c":1,"r":"tw","u":"https://www.digitimes.com.tw/tech/dt/n/shwnws.asp?id=0000775529_PVC63JJ716H7UNLAMJUTT","p":1795372800,"a":1795389935,"t":"美AI資料中心拚加快接電 兩大電網改革送審","su":"미국에서는 인공지능(AI) 데이터센터(컴퓨터 수만 대를 모아 둔 건물) 구축에 대한 수요가 계속 늘어나고 있지만, 일부 지역에서는 전력망 확장과 신규 전력공급 속도가 이를 따라가지 못해 산업 확장의 중요한 병목 현상이 되고 있다. 미국 지역전력망 운영업체인 PJM과 캘리포니아독립시스템배치기구(CAISO)는 최근 대규모 전력시설에 대한 전력망 연결 개혁을 제안했다. 그리드 연결 연구 기간을 단축하고 조건부 전력 연결을 사전에 개방함으로써 속도를 높일 수 있기를 희망합니다."},{"s":"'타이밍 불일치': 데이터 센터 전력 수요는 매년 19% 증가하고 있습니다. 그리드는 2% 성장하고 있다","so":"Fortune","tm":"11/23 01:34","c":1,"r":"us","u":"https://fortune.com/2026/11/22/ai-data-centers-power-grid-capacity/","p":1795365240,"a":1795389933,"t":"A ‘mismatch in timing’: Data center power demand is growing 19% a year. The grid is growing 2%","su":"보험 중개인인 Howden은 데이터 센터의 전력 수요가 2000년 이후 그리드보다 10배 빠르게 증가했다는 사실을 발견했습니다. 유권자들은 압박을 강화했고 Big Tech는 자체 가스 공장으로 눈을 돌리고 있습니다."},{"s":"AI 데이터센터 전력 증강에 편승한 3가지 주식","so":"Yahoo Finance","tm":"11/23 01:07","c":1,"r":"us","u":"https://finance.yahoo.com/markets/stocks/articles/3-stocks-riding-ai-data-160704018.html","p":1795363624,"a":1795389934,"t":"3 Stocks Riding The AI Data Center Power Buildout","su":"스페이스X는 740억 달러 이상의 AI 중심 데이터 센터 캠퍼스를 계획하면서 전력, 물, 그리드 용량을 주목받게 되었고 이는 상장(주식시장에 처음 들어오는 것) 유틸리티에 곧바로 파급됩니다. AI 컴퓨팅을 공급하기 위한 경쟁은 누가 주스를 공급하고 누가 정치적 열기를 전달하는지에 따라 승자와 후발자를 만들 수 있습니다. 이 글은 해당 스토리에 노출된 세 가지 주식을 분석하고 해당 주식의 역할이 무엇인지 설명합니다."},{"s":"전기가 곧 경쟁력이다! Taipower: 타이난 시가 \"Greater Nanke\"의 전력 소비 증가를 지원하기 위해 자체 전력을 강화할 수 있기를 바랍니다 | 금융 포커스 | 산업경제학","so":"UDN","tm":"11/22 22:59","c":1,"r":"tw","u":"https://udn.com/news/story/7238/9895106","p":1795355989,"a":1795356526,"t":"電力是競爭力！台電：盼台南市增加自有電力支撐「大南科」用電成長| 財經焦點| 產經","su":"첨단 제조 공정의 도입으로 '대타이난 과학단지'의 전력 소비량은 계속해서 증가하고 있습니다. 타이파워는 “전력은 국가의 힘이자 도시의 경쟁력”이라고 주장한다. 그러나 타이난시는 현재 Nanke의 안정적인 전력 공급의 중추로서 총 110만 킬로와트에 달하는 센바 1단계와 2단계만 보유하고 있습니다. 나머지는 Xingda 발전소의 자금 지원에 의존합니다. Taipower는 계획된 Senba 3단계 민간 발전소(IPP)를 포함하여 타이난 시에서 자체적으로 안정적인 전력 공급을 개발하기 위해 노력하고 있습니다."},{"s":"백악관은 '현지화'를 추진하고 싶어하지만 지방선거에서 적신호가 켜졌다. 미국의 AI 데이터센터 구축이 곧 제동을 걸 것인가?","so":"第一财经","tm":"11/22 19:02","c":1,"r":"cn","u":"https://www.yicai.com/news/103449268.html","p":1795341764,"a":1795351430,"t":"白宫欲推“本土化”，地方选举却亮红灯：美国AI数据中心建设要踩刹车了吗？","su":"시장은 미국의 인공지능(AI) 인프라 개발이 직면한 역풍을 재현하고 있습니다. 현지 시간으로 지난 11월 20일, 트럼프 미국 대통령은 APEC 정상회담을 마친 뒤 백악관 기자회견에서 미국 기업이 해외에 데이터센터(컴퓨터 수만 대를 모아 둔 건물)를 짓는 것이 허용되지 않고, 그렇지 않으면 '거대한 세금'이나 '거대한 벌금'을 물게 될 것이라고 밝혔다. 그러나 트럼프 대통령은 이 아이디어가 그의 팀과 충분히 논의되지 않았으며 현재 공식적인 행정 명령이나 구체적인 세율 세부 사항이 없다는 점도 인정했습니다. 지난 11월 초 미국 중간선거 결과가 발표된 뒤 미국 증시 AI 부문은 지역 차원의 데이터센터에 대한 거센 반발로 급격한 조정을 겪었다. 지난 한 달간 11월 22일 기준 나스닥(미국 기술 회사들이 많은 주식시장) 지수는 13% 하락했고, 엔비디아 주가는 41% 가까이 하락했고, AMD 주가는 16% 이상 하락했다."},{"s":"AI 전력망 호황에 대형 변압기 수출 31% 증가…소형은 39% 급감","so":"한국경제","tm":"11/22 18:10","c":1,"r":"kr","u":"https://www.hankyung.com/article/2026112224611","p":1795338615,"a":1795351428,"su":"AI 전력망 호황에 대형 변압기 수출 31% 증가…소형은 39% 급감, 한경Aicel K변압기 수출 양극화 데이터센터(컴퓨터 수만 대를 모아 둔 건물)發 초고압 수요 폭증 북미 변전소에 2030년까지 납품 대형 수출, 이미 작년 실적(회사가 번 돈 성적표) 넘어서 소형 변압기 가격&middot;납기 경쟁 격화 제룡전기 상반기 美매출 41% 감소"},{"s":"회장님 한마디/2027년에는 AI 붐이 거세질까? Delta Electronics의 Zheng Ping: 데이터 센터는 한두 시즌 동안 구축되지 않았지만 주문 가시성은 여전히 높습니다.","so":"經濟日報","tm":"11/22 10:00","c":1,"r":"tw","u":"https://money.udn.com/money/story/124921/9892511","p":1795309250,"a":1795351432,"t":"董事長的一句話／2027年AI景氣還能旺？台達電鄭平：資料中心不是蓋一兩季 訂單能見度仍高","su":"Delta Electronics(2308)는 AI 서버 전원 공급 장치 분야의 세계 선두 기업입니다. Zheng Ping 회장은 최근 몇 년간 Delta Electronics의 주요 성장 모멘텀(값이 움직이는 기세)은 AI 데이터 센터의 지속적인 확장에서 비롯되었다고 말했습니다. 하지만 데이터센터(컴퓨터 수만 대를 모아 둔 건물) 구축은 1~2분기가 아니라 수년이 소요된다. 자재 부족, 전력 부족, 인력 부족 등의 요인으로 인해 \"전체적인 주문 가시성은 여전히 매우 높습니다.\""},{"s":"美 설비 부족…HD현대·효성·LS, K-전력기기 '동맹국 프리미엄' 정조준","so":"파이낸셜포스트","tm":"11/22 08:05","c":1,"r":"kr","u":"https://www.financialpost.co.kr/news/articleView.html?idxno=302346","p":1795302300,"a":1795303173,"su":"인공지능(AI) 데이터센터(컴퓨터 수만 대를 모아 둔 건물) 및 전기자동차(EV) 확산으로 미국의 전력 수요가 급증하면서 내년부터 전력망 지원 설비(GSE) 공급난이 본격화할 것이라는 경고가 나왔"},{"s":"대동(Tatung)의 9월 매출은 전년 동기 대비 13% 감소했으며 전력 인프라 건설에서 AI 컴퓨팅 성능을 지속적으로 심화하고 있습니다.","so":"經濟日報","tm":"11/22 02:14","c":1,"r":"tw","u":"https://money.udn.com/money/story/5612/9810044?from=edn_next_story","p":1795281296,"a":1795334553,"t":"大同9月營收年減13%　持續深化電力基礎建設AI算力","su":"대동(Tatung)은 오늘 9월 연결 매출(물건을 판 돈 전체)이 NT$36억 8,700만으로 전년 동기 대비 13.29% 감소했다고 발표했습니다. 첫 9개월 동안의 통합 수익은 NT$362.5억으로 연간 NT$2.1 감소했습니다."},{"s":"데이터 센터와 그리드 간의 조화 추구","so":"POWER Magazine","tm":"11/21 23:47","c":1,"r":"us","u":"https://www.powermag.com/blog/seeking-harmony-between-data-centers-and-the-grid/","p":1795272470,"a":1795278567,"t":"Seeking Harmony Between Data Centers and the Grid","su":"2024년 7월, 북부 버지니아의 송전선에 결함이 발생한 후 약 1,500MW의 데이터 센터 부하가 한꺼번에 그리드에서 떨어졌습니다. 걱정스럽기는 했지만 각 측의 보호 기능은 설계된 대로 작동했습니다. 전력회사의 자동 재폐로가 회선 복원을 반복적으로 시도했고, 시도할 때마다 전압 강하가 발생했습니다."},{"s":"터빈 보안은 전투의 절반에 불과합니다. 데이터 센터 전원에 대한 배출 모니터링 경로입니다.","so":"Data Center Dynamics","tm":"11/21 20:05","c":1,"r":"us","u":"https://www.datacenterdynamics.com/en/opinions/securing-the-turbine-is-only-half-the-battle-the-emissions-monitoring-path-to-data-center-power/","p":1795259149,"a":1795259728,"t":"Securing the turbine is only half the battle: the emissions monitoring path to data center power","su":"데이터 센터 전력 이야기는 일반적으로 부족 이야기로 전달됩니다. AI 및 클라우드 수요로 인해 개발자와 대규모 운영자는 주로 천연 가스 터빈 및 왕복 엔진과 같은 비현실적(회사가 번 돈 성적표)인 세대로 이동했으며 대부분의 적용 범위는 장비를 충분히 빠르게 구축할 수 있는지 여부에 따라 수정되었습니다."},{"s":"데이터센터 전기│앨라배마주, 전기요금 1억6천만달러 절감 계획 대규모 사용자는 전력망 비용을 어떻게 공유합니까?","so":"鉅亨網","tm":"11/21 19:13","c":1,"r":"tw","u":"https://news.cnyes.com/news/id/6669774","p":1795256016,"a":1795303174,"t":"資料中心用電｜阿拉巴馬州擬降電費1.6億美元，大用戶如何分攤電網成本？","su":"데이터센터(컴퓨터 수만 대를 모아 둔 건물) 전기│앨라배마주, 전기요금 1억6천만달러 절감 계획 대규모 사용자는 전력망 비용을 어떻게 공유합니까? Uanalyze 2026년 11월 21일(Uanalyze/산업 데이터 센터 보고서) ⸺ Southern Company(SO-US)의 자회사인 Alabama Power는 2027년 1월 청구서부터 사용자 요금을 인하할 계획이며 연간 총 1억 6천만 달러의 수익이 감소할 것이라고 주 규제 기관에 보고했습니다. 회사는 월 1,000kWh의 전기를 사용하는 가구가 연간 50달러 이상을 절약할 수 있을 것으로 추정하고 있으며, 이는 주로 내년에 대규모 데이터 센터의 전기 판매 수익이 증가할 것으로 예상되는 데 기인합니다."},{"s":"3개의 데이터 센터 전력 주식이 기록 대비 1/3 이상 하락하여 지금 구매하고 2030년까지 보유","so":"Yahoo Finance","tm":"11/21 18:03","c":1,"r":"us","u":"https://finance.yahoo.com/markets/stocks/articles/3-data-center-power-stocks-090302581.html","p":1795251782,"a":1795259729,"t":"3 Data Center Power Stocks Down More Than a Third From Their Records to Buy Now and Hold Through 2030","su":"그 중 한 회사의 수익은 지난 분기에 두 배 이상 증가했습니다. 그렇다면 왜 세 주식 모두 지금까지 최고점보다 훨씬 낮은 걸까요?"},{"s":"李대통령, AI 전력·인력 확보 강조…\"AIDC·메모리 수요 더 늘 것\" (종합)","so":"아시아경제","tm":"11/21 16:19","c":1,"r":"kr","u":"https://www.asiae.co.kr/article/2026112116192801624","p":1795245569,"a":1795248156,"su":"이재명 대통령은 21일 인공지능(AI) 기술이 발전할수록 AI데이터센터(컴퓨터 수만 대를 모아 둔 건물)와 메모리 반도체(전자기기의 두뇌 부품)에 대한 수요가 더욱 늘어날 ."}]},{"name":"🤖 로봇","note":"","breaking":false,"items":[{"s":"[특징주] 에이엘로봇, 피지컬 AI·휴머노이드 모멘텀 속 전일 급락 딛고 반등","so":"와이드경제","tm":"11/23 13:06","c":6,"r":"kr","u":"https://www.widedaily.com/news/articleView.html?idxno=304447","p":1795406814,"a":1795408891,"su":"내년 초 열리는 세계 최대 가전·정보기술(IT) 전시회 'CES 2027'을 앞두고 로봇 관련주에 매수세(사려는 힘)가 유입되면서 신규 상장사 에이엘로봇이 장중 급등세를 보이고 있다. 23일 오후 1시 기준 코스닥(한국 중소·기술 회사 주식시장) 시장에서 에이엘로봇은 전 거래일 대비 1440원(13.47%) 오른 1만2130원에"},{"s":"타이중에서 열린 Dongyouda의 전시회는 반도체 자동화에 초점을 맞추고 휴머노이드 로봇과 CPO 비즈니스 기회를 완벽하게 전개합니다.","so":"經濟日報","tm":"11/24 14:10","c":5,"r":"tw","u":"https://money.udn.com/money/story/5612/9898491?from=edn_related_storybottom","p":1795497056,"a":1795499092,"t":"東佑達台中參展聚焦半導體自動化 全力布局人形機器人與 CPO 商機","su":"'2026 타이중 무인 차량 및 로봇 응용 전시회'가 오늘(24일) 타이중 국제 컨벤션 및 전시 센터에서 성대하게 개막되었습니다. 정밀 자동화 솔루션 제조사 동유다(7942)가 이번 전시회에 처음으로 참가해 반도체(전자기기의 두뇌 부품) 자동화, 휴머노이드(사람을 닮은 로봇) 로봇 부품, 코패키지 광학(CPO) 3대 제품군을 중심으로 전시했다."},{"s":"[특징주] 아이씨에이치, 글로벌 휴머노이드 공급망 합류 소식에 이틀째 상승세","so":"와이드경제","tm":"11/24 11:14","c":5,"r":"kr","u":"https://www.widedaily.com/news/articleView.html?idxno=304526","p":1795486445,"a":1795490341,"su":"24일 코스닥(한국 중소·기술 회사 주식시장) 시장에서 첨단 전자소재 전문기업 아이씨에이치가 글로벌 전기차 기업의 휴머노이드(사람을 닮은 로봇) 로봇손에 적용되는 관절용 소재를 공급하고 있다는 소식에 급등세를 보이고 있다.한국거래소에 따르면 이날 오전 10시 59분 기준 아이씨에이치는 전 거래일 대비 12.54%(395원) 오른 3,5"},{"s":"빅웨이브로보틱스, 엔비디아 연동 이족보행 휴머노이드 ’국내 최초‘ 자동차 부품 공장 실증 성공","so":"파이낸셜포스트","tm":"11/24 09:49","c":4,"r":"kr","u":"https://www.financialpost.co.kr/news/articleView.html?idxno=302710","p":1795481360,"a":1795490341,"su":"글로벌 피지컬 인공지능(AI)과 휴머노이드(사람을 닮은 로봇) 로봇의 산업 현장 도입 경쟁이 본격화되는 가운데 빅웨이브로보틱스가 엔비디아의 로보틱스 생태계와 연동한 자체 플랫폼을 기"},{"s":"A주 휴머노이드 로봇 부문은 리미트업 추세를 겪고 있습니다! 유니트리 기술 급증","so":"21财经","tm":"11/23 11:47","c":4,"r":"cn","u":"https://www.21jingji.com/article/20261123/herald/5bf7c5f65d187a053136473a1ccd6243.html","p":1795402020,"a":1795403832,"t":"A股人形机器人板块上演涨停潮！宇树科技大涨","su":"21일 파이낸셜레이더에 따르면 11월 23일 A주 휴머노이드(사람을 닮은 로봇) 로봇 컨셉이 등락을 거듭하며 상승세를 보였다. Fenglong Co., Ltd., Guangyang Co., Ltd., Ningbo Dongli Co., Ltd. 등은 한도액이 증가했습니다. Shanwei New Materials는 11% 이상 상승했고 유니트리는 8% 이상 상승했으며 시가총액(회사 전체 몸값)은 2,500억 위안으로 회복되었습니다. (면책조항: 이 기사의 내용은 참고용일 뿐이며 투자 조언이 아닙니다. 투자자는 그에 따라 위험을 감수하고 운영해야 합니다.) Xiji 83257,"a":1795503078,"su":"삼성전자가 2027년 정기 임원 인사에서 모바일·가전·TV 사업을 맡는 디바이스경험(DX)부문 임원 61명을 승진·선임했다. 로봇과 인공지능(AI) 분야 인재를"},{"s":"휴머노이드 로봇은 상용화의 중요한 시기에 접어들었고 다양한 이점으로 인해 업계의 기대가 높아졌습니다.","so":"Jiemian.com","tm":"11/24 09:00","c":2,"r":"cn","u":"https://m.jiemian.com/article/15364882.html","p":1795478415,"a":1795478689,"t":"人形机器人步入商业化关键期，多重利好推动产业预期升温","su":"휴머노이드(사람을 닮은 로봇) 로봇 산업은 기술 혁신에서 대규모 상용화로의 전환기를 맞이하고 있으며, 산업 상용화 전망이 계속해서 주목받고 있습니다. 최근 여러 가지 유리한 요인이 합쳐져 업계 기대치가 높아졌습니다. 11월 23일 국가발전개혁위원회, 민정부, 국가보건위원회, 교육부는 ''노인 한 아이' 서비스 시스템 구축을 위한 구현 계획을 발표하여 노인 돌봄 및 보육 기관이 지능형 관리 서비스, 스마트 화재 보안 및 기타 시스템을 적용하여 관리 수준을 향상할 수 있도록 지원할 것을 제안했습니다. 노인 돌봄 기관에 지능형 건강 모니터링, 보조 장치 및 기타 장비를 갖추도록 장려합니다. 인공 지능 기관, 서비스 등 신제품 개발을 장려합니다. 노인 돌봄 시나리오에 적합한 로봇, 스마트 웨어러블 장치 및 외골격을 노인 돌봄 기관, 커뮤니티 및 기타 시나리오에 적용하거나 체험 영역을 설정하도록 지원합니다."},{"s":"[단독]삼성 첫 휴머노이드, 한손당 모터 20개 탑재 ‘초정밀 작업’ 가능","so":"동아일보","tm":"11/24 04:30","c":2,"r":"kr","u":"https://www.donga.com/news/Economy/article/all/20261124/135077423/2","p":1795462200,"a":1795474321,"su":"삼성전자가 내년 초 첫 자체 개발 휴머노이드(인간형 로봇)를 선보인다. 양손 각각 20개씩 총 40개의 모터를 탑재해 ‘정밀한 손’에 방점을 둘 것으로 알려졌다. 스마트폰 조립 수준의 정밀한 손동작 구현이 궁극적인 목표다. 반복적으로 접고 펴도 견디는 폴더블 스마트폰…"},{"s":"2-Link Changhua Group: 완전한 인간형 로봇 사업에 종사하고 있지 않으며 유성 롤러 스크류 제품은 아직 연구 개발 단계에 있습니다.","so":"Jiemian.com","tm":"11/23 21:04","c":2,"r":"cn","u":"https://www.jiemian.com/article/15363971.html","p":1795435444,"a":1795440125,"t":"2连板长华集团：不从事人形机器人整机业务，行星滚柱丝杠产品仍处于研发阶段","su":"장화그룹은 2026년 11월 20일과 11월 23일 연속 2거래일 주식의 일일 종가 상승 편차가 20%를 초과했다고 23일 발표했다. '상하이 증권거래소 거래규칙' 관련 규정에 따르면 이는 주식 거래의 비정상적인 변동을 의미합니다. 검증 결과 회사는 최근 일부 언론에서 자사를 휴머노이드(사람을 닮은 로봇) 로봇 컨셉주로 상장한 사실을 알아냈다. 회사는 현재 다음과 같이 명시됩니다. 회사는 상장된 자동차 부품 회사로서 주로 자동차 금속 부품의 연구 개발, 생산 및 판매에 종사합니다. 핵심 제품은 패스너, 스탬핑 및 용접 부품입니다. 휴머노이드 로봇 완성기계 사업에는 종사하지 않습니다. 고객에게 액추에이터 특수 구조 부품 및 기타 관련 부품 제품만 제공합니다. 현재까지 약 88,000위안의 영업이익(장사해서 남긴 돈)을 달성했습니다. 위 제품은 회사의 주요 비즈니스 제품의 응용 시나리오 확장을 기반으로 합니다. 이는 회사 전체 영업이익에서 아주 작은 부분을 차지하며 순이익에 큰 영향을 미치지 않습니다. 유성 롤러 스크류 제품에 관해서는 아직 연구 개발 단계에 있습니다. 아직 고객 승인을 받지 못했고, 영업이익도 달성하지 못한 상태여서 실적에 영향은 없을 것으로 보인다."},{"s":"Kelai Electromechanical: 현재 휴머노이드 로봇 분야와 관련된 제품은 포함되어 있지 않습니다.","so":"Jiemian.com","tm":"11/23 19:27","c":2,"r":"cn","u":"https://www.jiemian.com/article/15363669.html","p":1795429627,"a":1795435025,"t":"克来机电：目前不涉及人形机器人领域相关产品","su":"클레이전기기계는 자사 주식 거래가 2026년 11월 20일과 2026년 11월 23일 연속 2거래일 동안 일일 종가 상승률을 20% 이상 벗어나 비정상적인 주식 거래 변동이 발생했다고 23일 밝혔다. 현재의 생산 및 운영 활동은 정상적이며, 시장 환경 및 업계 정책에 큰 변동은 없으며, 생산비 및 매출(물건을 판 돈 전체)에 큰 변동은 없으며, 내부 생산 및 운영 순서도 정상적인 것으로 확인되었습니다. 산업용 로봇 분야의 주요 제품은 자동화 물류 분야에서 사용되는 밴 컨테이너 내 물품을 위한 완전 자동 지능형 하역 기계 운영 시스템입니다. 2025년 매출액과 비중은 극히 낮다. 현재 휴머노이드(사람을 닮은 로봇) 로봇 분야와 관련된 제품은 포함되어 있지 않습니다."},{"s":"A주 마감 코멘트: GEM 지수가 3% 이상 상승했고, 전체 시장이 100개 주식 한도를 초과했으며, 영화 및 텔레비전 극장, 감속기, 휴머노이드 로봇 등 부문이 강화되었습니다.","so":"Jiemian.com","tm":"11/23 16:08","c":2,"r":"cn","u":"https://www.jiemian.com/article/15362236.html","p":1795417731,"a":1795424039,"t":"A股收评：创业板指涨超3%，全市场超百股涨停，影视院线、减速器、人形机器人等板块走强","su":"11월 23일, 중국 3대 A주(중국 본토 주식시장 주식) 지수가 종합적으로 상승했습니다. 마감 기준 상하이종합지수는 0.15%, 선전종합지수는 1.93%, GEM지수는 3.08%, 노스증권50은 4.67% 상승했다. 상하이와 선전 증시 거래액은 약 1조5528억8000만 위안으로 전 거래일보다 약 1306억8000만 위안 증가했다. 시장에서는 4,658개 종목이 상승했고, 783개 종목이 하락했는데, 그 중 한도상향 종목은 151개, 하락 종목은 7개였다."},{"s":"13:33:52 [초기 거래에서 영화 및 TV 극장, 귀금속, 휴머노이드 로봇 부문이 강세를 보였으며, A500 ETF E 펀드(159361)는 반나절 만에 2억 건 이상의 순청약을 받았습니다]","so":"财联社","tm":"11/23 14:33","c":2,"r":"cn","u":"https://www.cls.cn/detail/2541421","p":1795412032,"a":1795414373,"t":"13:33:52【影视院线、贵金属、人形机器人板块早盘走强，A500ETF易方达（159361）半日获超2亿份净申购】","su":"영화 및 TV 극장, 귀금속, 휴머노이드(사람을 닮은 로봇) 로봇 부문이 장 초반 강세를 보였습니다. A500 ETF E 펀드(159361)는 반나절 만에 2억 건 이상의 순청약을 받았습니다. 11월 23일 오전 거래에서는 하락세를 보이다 다시 상승세(오르는 흐름)를 보였다. 중국 3대 A주 지수는 상승과 하락을 반복했습니다. 전체 시장의 반나절 매출액은 9000억 위안을 넘어섰다. 업종별로는 영화와 텔레비전 극장, 귀금속, 부품, 휴머노이드 로봇, 감속기가 가장 많이 상승한 반면, 부동산, 물류, 석유 및 가스 탐사 및 서비스, 전력 부문은 가장 많이 하락했습니다. 홍콩 주요 지수는 엔터테인먼트, 통신 장비, 의료 서비스 부문이 상승세를 주도하는 등 조정을 이어갔습니다. 정오 마감 기준으로 CSI A500 지수는 0.5%, CSI 300 지수는 0.6%, GEM 지수는 1.2%, 과학 기술 혁신 50 지수는 2.7%, 항셍 중국 기업 지수는 0.8% 하락했다. Flush iFinD 데이터에 따르면 A500 ETF E 펀드(159361, 피더 펀드 A/C/Y: 022459/022460/022930)는 반나절 만에 2억 건 이상의 순 청약을 받았습니다."},{"s":"슈퍼브에이아이, ‘마트 환경 기반 휴머노이드 로봇 경진대회’ 은상 수상","so":"한스경제","tm":"11/23 14:04","c":2,"r":"kr","u":"https://www.hansbiz.co.kr/news/articleView.html?idxno=885972","p":1795410262,"a":1795414372,"su":"| 서울=한스경제 김종효 기자 | 슈퍼브에이아이는 14일 대구 엑스코에서 개최된 '제21회 국제로봇콘테스트(2026 IRC)' 세부 대회인 '마트 환경 기반 휴머노이드(사람을 닮은 로봇) 로봇 경진대회'에서 은상을 받았다고 23일 밝혔다. 국제로봇콘테스트는 산업통상부와 대구광역시가 주최하고 한국로봇산업진흥원이 주관하는 행사다. 13일부터 이틀 동안 대구 엑스코에서 12개 세부 대회가 진행됐다. 이 가운데 마트 환경 기반 휴머노이드 로봇 경진대회는 숭실대학교와 카이로바가 주관하고 로보티즈가 후원해, 참가팀들이 휴머노이드 로봇에 AI 기술을 도입해 마트 환경 임무 수행 능력을 겨뤘다."},{"s":"아이엘, 中 로봇핸드 유니콘과 독점 공급계약…휴머노이드 부품사업 진출","so":"한국경제","tm":"11/23 13:19","c":2,"r":"kr","u":"https://www.hankyung.com/article/202611234083i","p":1795407581,"a":1795408891,"su":"AI 추천 뉴스 아이엘, 中 로봇핸드 유니콘과 독점 공급계약…휴머노이드(사람을 닮은 로봇) 부품사업 진출 코스닥(한국 중소·기술 회사 주식시장) 상장사 아이엘이 중국 로봇핸드 전문기업 자이노바(XYNOVA)와 국내 독점 공급계약을 체결하고 휴머노이드 핵심부품 사업에 진출한다. 아이엘은 자이노바의 로봇핸드 전 제품군과 휴머노이드 관절 구동장치(액추에이터)에 대한 국내 독점 공급권을 확보했다고 23일 밝혔다. 지난 20일 열린 계약식에는 송성근 아이엘 의장과 샤위쉬안 자이노바 창업자 겸 최고경영자(CEO)가 참석했다."},{"s":"휴머노이드 로봇 컨셉이 계속해서 상승하고 있으며, 서던펀드의 로봇 ETF 서던(159258)의 기초지수가 2% 이상 상승했습니다.","so":"Jiemian.com","tm":"11/23 11:39","c":2,"r":"cn","u":"https://www.jiemian.com/article/15360344.html","p":1795401555,"a":1795403836,"t":"人形机器人概念持续拉升，南方基金旗下机器人ETF南方(159258)标的指数涨超2%","su":"10시 6분 현재, Robot ETF(여러 주식을 묶어 파는 상품) Southern(159258)은 장중 거래량이 1,892.57만 위안으로 1.58% 변동되었습니다. 추적지수인 CSI 로봇지수(H30590)는 한때 2.15% 넘게 올랐고, 현재는 1.45% 상승 중이다."},{"s":"유니트리 급등, 주가 600위안 이상 회복","so":"第一财经","tm":"11/23 11:01","c":2,"r":"cn","u":"https://www.yicai.com/news/103449720.html","p":1795399306,"a":1795403832,"t":"宇树科技大涨 股价重回到600元以上","su":"제일재경 2026-11-23 09:58:55 편집자: Zhang Xiao 유니트리 기술이 급등했습니다. 보도 시간 현재 주가는 600위안 이상으로 회복되었으며 장중 최대 상승률은 8% 이상이다."},{"s":"미국/중국 제조사 야스카와 전기(Yaskawa Electric) 따라잡기: 2030년 AI 휴머노이드 로봇 출시 - 국제","so":"工商時報","tm":"11/23 10:53","c":2,"r":"tw","u":"https://www.ctee.com.tw/news/20261123700818-430702","p":1795398780,"a":1795403837,"t":"追趕美/中廠安川電機：2030年推AI人形機器人- 國際","su":"일본 산업용 로봇 제조사 야스카와전기(Yaskawa Electric)가 미국, 중국 제조사를 따라잡기 위해 2030년 AI를 탑재한 휴머노이드(사람을 닮은 로봇) 로봇을 출시해 시장 점유율을 선점할 예정이다. 교도통신은 야스카와전기의 AI 로봇 사업 코디네이터 구보타 유미가 인터뷰에서 개발 중인 AI 휴머노이드 로봇이 \"2030년에 출시될 것\"이라고 말했다고 20일 보도했다. 구보타 유미 씨는 고객 수요에 따라 사전 출시도 고려할 것이라고 지적했다. ..."},{"s":"Ant Group은 중국의 휴머노이드 경쟁에서 성공하기 위해 Simplexity에 투자했습니다.","so":"Bloomberg.com","tm":"11/23 08:00","c":2,"r":"us","u":"https://www.bloomberg.com/news/articles/2026-11-22/ant-group-bets-on-simplexity-to-thrive-in-china-s-humanoid-race","p":1795388400,"a":1795403831,"t":"Ant Group Bets on Simplexity to Thrive in China’s Humanoid Race"},{"s":"ASUS의 첫 번째 휴머노이드 로봇 공개 - Financial News - Business Times","so":"中時新聞網","tm":"11/23 05:10","c":2,"r":"tw","u":"https://www.chinatimes.com/newspapers/20261123000212-260202","p":1795378200,"a":1795389945,"t":"華碩首款人形機器人曝光- 財經要聞- 工商時報","su":"ASUS의 첫 번째 휴머노이드(사람을 닮은 로봇) 로봇이 공개되었습니다. 최근 외국 언론과의 인터뷰에서 ASUS 공동 CEO Xu Xianyue는 ASUS의 첫 번째 인간형 로봇 Gallop을 공개하고 첫 번째 작업인 ASUS 자체 스마트 공장에서 마더보드 액세서리를 포장하는 작업을 소개했습니다. 쉬셴웨(Xu Xianyue) 역시 갤럽이 이르면 내년 하반기 오픈할 것으로 예상했다."},{"s":"'특징주' 유비소프트는 약 4% 상승했고, JP모건은 등급을 상향 조정해 업계가 성과 중심의 새로운 단계로 전환했음을 알렸다.","so":"etnet 經濟通","tm":"11/24 15:53","c":1,"r":"hk","u":"https://www.etnet.com.hk/mobile/tc/news/categorized_news_detail.php?newsid=20261124325","p":1795503180,"a":1795504116,"t":"《異動股》優必選升近4%，摩通上調評級指行業轉向實績主導新階段","su":"2026년 11월 24일 14:53 \"Movement Stocks\" YoubiSelect는 거의 4% 상승했으며, JP모건의 등급 업그레이드는 업계가 성과 중심 성과의 새로운 단계로 전환했음을 나타냅니다. 요약 면책 조항 이 콘텐츠는 기존 시장 데이터 및 뉴스 소스를 기반으로 인공 지능에 의해 생성되었으며 참고용입니다. 해당 내용은 \"Economics\"의 견해나 입장을 대변하지 않으며, 어떠한 투자 조언도 구성하지 않습니다. AI가 생성한 정보에는 오류, 누락, 일탈 등이 있을 수 있으므로, 투자 결정을 내리기 전에 사용자가 직접 해당 내용을 확인하거나 전문가의 조언을 구해야 합니다. \"이코노믹스\"는 본 내용을 신뢰하여 발생하는 어떠한 손실이나 손해에 대해서도 책임을 지지 않습니다. ▷ 유비텍 주가는 3.7% 상승, 전체 7.9% 상승 ▷ JP모건은 유브텍에 대해 투자의견 비중확대(더 많이 사 두라는 의견), 목표주가(전문가가 예상한 앞날의 주가)는 HK$77로 상향 ▷ JP모건은 유니트리 등 공급망 목표주가 동시 상향 JP모건은 UBS(09880)에  위해 사용됩니다. 이전 발표에 따르면 Haomei New Materials는 2023년, 2024년, 2025년에 3차례의 중앙 집중식 입찰 환매를 완료했으며 누적 거래량은 약 4억 5600만 위안에 달합니다. Haomei New Materials는 주로 알루미늄 합금 경량 소재 및 자동차 부품 사업에 종사하고 있으며 자동차 경량 사업을 '자재 배송'에서 '부품 운송'으로 전환을 지속적으로 추진하고 있습니다. 해당 연도 동안 회사의 특정 대상에 대한 주식 발행 신청은 중국 증권감독관리위원회의 승인 및 등록을 거쳤습니다. 조달 계획 총액은 16억 2100만 위안을 초과할 수 없으며, 이는 화동 및 화남 지역의 자동차 경량화 생산 능력 확장, R&D 혁신 센터 건설, 화남 생산 기지의 지능적 전환 및 운전 자본 보충에 사용됩니다."},{"s":"열혈 메카! 홍콩에서 휴머노이드 로봇이 '살을 맞대고 싸우는' 격투 쇼를 선보입니다.","so":"中国新闻网","tm":"11/23 21:53","c":1,"r":"cn","u":"https://www.chinanews.com.cn/ga/shipin/cns-d/2026/11-23/news1075804.shtml","p":1795438380,"a":1795447051,"t":"热血机甲！人形机器人在香港上演“拳拳到肉”格斗秀","su":"열혈 메카! 휴머노이드(사람을 닮은 로봇) 로봇이 홍콩에서 '주먹 맞대결' 전투 쇼를 선보였습니다. 출시 시간: 2026년 11월 23일 20:53 출처: 중국 뉴스 네트워크 11월 23일 제16회 홍콩 국제 금융 포럼과 제7회 파일럿 \"9+2\" 광둥-홍콩-마카오 그레이터 베이 지역 개발 포럼이 홍콩 컨벤션 및 전시 센터에서 열렸습니다. 행사장에서는 독특한 인간형 로봇 격투 쇼가 펼쳐졌다. 두 인간형 로봇은 땅에 떨어진 후 펀치, 킥, 블록, 퀵 리셋을 완료했고, 공격과 수비의 전환도 부드럽고 매끄러웠다. 중칭로봇 담당자는 이번 전시회에 참가한 휴머노이드 로봇의 키는 1.73m, 무게는 75kg이라고 밝혔다. 뛰어난 운동능력과 폭발력을 자랑합니다. 조인트의 최대 토크는 450Nm에 달할 수 있습니다. 그 육체적 능력은 일반 성인 남성의 수준을 넘어섰습니다. 전투 시연 외에도 이 로봇은 과학 연구, 운송 및 분류와 같은 많은 실제 응용 시나리오에 사용되었습니다."},{"s":"KAIST, 피지컬 AI·제조 AI 에이전트 산업 적용 논의…휴머노이드부터 자율제조까지 제조혁신 전략 공유","so":"인공지능신문","tm":"11/23 21:46","c":1,"r":"kr","u":"https://www.aitimes.kr/news/articleView.html?idxno=42861","p":1795437961,"a":1795440121,"su":"한국과학기술원(KAIST)이 피지컬 인공지능(Physical AI)과 제조 AI 에이전트, 제조현장의 암묵지 활용 기술을 중심으로 산업계의 인공지능 전환(AX) 전략을 논의하는 자리를 마련한다. 제조업에 축적된 경험과 노하우를 AI가 활용할 수 있는 지식으로 전환하고, 실제 생산 현장에서 적용 가능한 기술과 사례를 공유하는 것이 주요 목적이다.KAIST 김재철AI대학원 성남연구센터(센터장 최재식 교수)는 오는 12월 2일 서울 코엑스 컨퍼런스룸 남측 3층 317호에서 ‘제조AI 커넥트 데이’를 개최한다. 행사는 제조 AI 기술의 발"},{"s":"이 휴머노이드 로봇은 모든 과대 광고에 명확성을 가져올 것입니다","so":"Bloomberg.com","tm":"11/23 21:30","c":1,"r":"us","u":"https://www.bloomberg.com/opinion/articles/2026-11-23/agility-s-humanoid-robots-will-bring-clarity-to-industry-hype","p":1795437010,"a":1795447049,"t":"These Humanoid Robots Will Bring Clarity to All the Hype"},{"s":"머스크는 \"테이블을 옮기면\" 로봇 데모가 실패한다고 인정합니다. 테슬라의 Optimus Bet는 이를 해결하기 위해 노력합니다.","so":"Yahoo Finance","tm":"11/23 20:20","c":1,"r":"us","u":"https://finance.yahoo.com/markets/stocks/articles/musk-admits-robot-demos-fail-112022101.html","p":1795432822,"a":1795440122,"t":"Musk Admits Robot Demos Fail if You “Move the Table.” Tesla’s Optimus Bet Rides on Fixing That","su":"주요 사항Elon 머스크는 누군가가 테이블을 옮기면 로봇 데모가 실패한다고 말했으며 \"한두 달\" 안에 진정한 Optimus 데모를 약속했습니다. 테슬라의 가치 평가는 Optimus가 그 격차를 줄일 수 있다고 확신하고 있으며 로봇에는 아직 외부 고객이 없습니다."},{"s":"ETF 마감의 해석 | 시장 반등, 로봇이 이익 주도","so":"Jiemian.com","tm":"11/23 19:27","c":1,"r":"cn","u":"https://www.jiemian.com/article/15363294.html","p":1795429626,"a":1795435027,"t":"ETF收盘解读 | 市场反弹，机器人领涨","su":"오늘날 규제 당국은 시장을 안정화하기 위한 여러 가지 조치를 취했고 강세(오르는 힘이 센 것)론자들의 자신감은 크게 높아졌습니다. 장초반에는 광모듈을 중심으로 GEM지수가 주도권을 잡았고, 오후에는 소형주와 초소형주 등 테마주가 크게 회복됐다. 두 도시의 거래액은 약 1조 5600억 위안에 달하며, 광학모듈, CRO, 군수산업 등이 상대적으로 활발하다."},{"s":"[11.23 ETF리뷰] 4000억은 아직 자리가 안잡혀서 스몰캡과 로봇이 먼저 떠오를거에요! 4,600개 이상의 주식이 적자로 변했고, 웃음이 돌아왔다","so":"Jiemian.com","tm":"11/23 19:27","c":1,"r":"cn","u":"https://www.jiemian.com/article/15363104.html","p":1795429625,"a":1795435030,"t":"【11.23 ETF综述】4000亿还没就位，小盘与机器人先涨为敬！4600余股飘红，欢声笑语又回来了","su":"11월 23일 A주(중국 본토 주식시장 주식)는 하락세로 출발하여 바닥을 확인한 후 성장주(앞으로 크게 클 회사 주식)와 소형주가 주도하면서 V자 형태로 반전했습니다. 상하이종합지수는 0.15% 소폭 상승한 3538.95포인트, 선전종합지수는 1.93% 오른 10454.37포인트, GEM지수는 3.08% 오른 2280.20포인트, 과학기술혁신50지수는 0.26% 하락, 베이징증권50지수는 4.67% 상승했다."},{"s":"로봇 컨셉으로 단기 수익 창출 효과 폭발, 성장 궤도로 수리 시장 개척 기대","so":"财联社","tm":"11/23 18:43","c":1,"r":"cn","u":"https://www.cls.cn/detail/2542496","p":1795426980,"a":1795490341,"t":"机器人概念引爆短线赚钱效应，成长赛道有望开启修复行情","su":"주요 섹터의 전체 수명주기 추적 서론: ① 미국 증시는 밤새 급등했고, A주는 장 초반 반등을 이어갈 것으로 예상됩니다. 자금 조달(사업에 쓸 돈을 모으는 것)은 반등 지속 가능성의 핵심입니다. ② 휴머노이드(사람을 닮은 로봇) 로봇 부문은 강세를 촉발하는 업종으로 아직 단기적으로 상승 가능성은 있으나 지나친 일관성으로 인한 또 다른 분기 가능성에 주목해야 한다. ③ 컴퓨팅 하드웨어의 강화가 동시에 이루어지고 있으며, 대규모 시가총액 목표를 위한 시장은 지속적인 자금 증분에 의존하고 있습니다. 용량이 부족할 경우 자금은 중소 시장 가치 PCB 목표로 전환될 수 있습니다. 시장은 어제 반등했고, 3개 주요 지수가 모두 적자로 마감했습니다. GEM 지수는 100개 이상의 종목이 제한되는 등 3% 이상 상승했습니다. 단기적인 심리가 크게 회복되었습니다. 밤새 미국 증시가 동시에 급등하면서 위험 선호도도 더욱 높아졌습니다. 오늘도 여전히 더 높은 개장을 할 수 있는 기반이 있을 것으로 예상됩니다. 더 높은 개방 이후에는 현장 자본 수용 강도와 거래량 및 용량의 지속 가능성이 이번 반등 라운드의 질을 결정하는 핵심 관찰 지표가 될 것입니다."},{"s":"창업 1년 반도 채 안 돼…루로봇 신생 스타트업 '지스간플리파이드 파워(Zhisimplified Power)' 기업가치 16억 달러, 앤트그룹이 투자 주도","so":"UDN","tm":"11/23 18:32","c":1,"r":"tw","u":"https://udn.com/news/story/7333/9896803","p":1795426374,"a":1795435032,"t":"成立不到1年半…陸機器人新創「至簡動力」估值16億美元 螞蟻集團領投","su":"본토 로봇 스타트업 '심플렉시티 로보틱스(Simplexity Robotics)'는 최근 Ant Group이 주도하는 1억 달러(약 NT$33억)의 새로운 자금 조달(사업에 쓸 돈을 모으는 것)을 완료했으며, 회사 가치는 16억 달러(약 NT$526억)에 달합니다. Zhijian Dynamics도 오늘 두 번째 휴머노이드(사람을 닮은 로봇) 로봇인 'iX'를 출시했습니다. 이 로봇은 음료를 만들어 배달하고, 물건을 집고 배달하고, 내비게이션 서비스를 제공할 수 있습니다."},{"s":"유니트리 회장 Wang Xingxing이 항저우 신세대 기업가 협회 회장직을 맡고 있습니다.","so":"ThePaper.cn","tm":"11/23 18:04","c":1,"r":"cn","u":"https://www.thepaper.cn/newsDetail_forward_34539826","p":1795424654,"a":1795447052,"t":"宇树科技董事长王兴兴出任杭州市新生代企业家联谊会会长","su":"항저우 신세대 기업가 협회 공식 WeChat 공개 계정의 최근 트윗에 따르면 유니트리의 회장, 창립자 겸 CEO인 Wang Xingxing이 항저우 신세대 기업가 협회 회장으로 임명되었습니다. 이전에는 항저우에서 신입생으로 재직했습니다."},{"s":"허샤오펑: 2027년은 고급 범용 휴머노이드 로봇이 대량 생산되는 원년이다","so":"21财经","tm":"11/23 18:02","c":1,"r":"cn","u":"https://www.21jingji.com/article/20261123/herald/0e51eb3cfde2a6fce58e2673b5972d1c.html","p":1795424520,"a":1795435032,"t":"何小鹏：2027年是高阶通用人形机器人的量产元年","su":"11월 23일, 샤오펑 그룹 부사장 '토마스 전기 열차'가 소셜 플랫폼에 공개한 정보에 따르면, 허샤오펑은 이코노미스트 연례 특별호에 사인한 기사를 게재하여 휴머노이드(사람을 닮은 로봇) 로봇 대량 생산에 대한 자신의 판단을 공유했습니다. 현재 외부 세계에서 널리 우려되는 로봇 적용 시나리오와 관련하여 He Xiaopeng은 기사에서 휴머노이드 로봇이 수천 가구에 들어오려면 세 가지 조건이 충족되어야 한다고 지적했습니다. 첫 번째는 하드웨어 우선으로, 풀스택 자체 연구를 통해 소프트웨어와 하드웨어의 협업을 촉진하여 로봇이 실제 환경에서 안정적이고 안전하게 작업할 수 있도록 합니다. 두 번째는 실시간 운영 제어, 액션 상호 작용, 추론 등의 작업을 각각 담당하는 초고속, 고속, 저속 모델을 갖춘 다중 모델 협업입니다. 세 번째는 품질과 다양성을 고려한 데이터 폐쇄 루프를 구축하여 실제 시나리오에서 로봇의 인식, 작동 및 피드백이 지속적으로 모델 개선을 촉진할 수 있도록 하는 것입니다. 그는 2027년이 고급 범용 휴머노이드 로봇 양산의 원년이 될 것이라고 내다봤다. 11월 25일 Xiaopeng은 제8회 기술의 날을 개최하여 실제 시나리오에 물리적 AI를 적용하고 휴머노이드 로봇 대량 생산의 최신 진행 상황을 공유할 예정입니다."},{"s":"현대차 로보틱스 R&D 거점 구축… '힐스테이트 송파더그리드' 주목","so":"한경매거진","tm":"11/23 17:34","c":1,"r":"kr","u":"https://magazine.hankyung.com/business/article/202611234953b","p":1795422840,"a":1795435023,"su":"업계에 따르면 현대자동차그룹은 보스턴다이내믹스 지분(회사를 나눠 가진 몫) 100% 확보를 마친 뒤 휴머노이드(사람을 닮은 로봇) '아틀라스' 고도화에 나서고 있다. 삼성전자는 지난 7월 대표이사 직속 RX(Robotics eXperience)사업추진실을 신설한 뒤, 100개 이상 공장·생산라인 데이터를 학습시킨 이족보행 휴머노이드 시제품을 이번 CES에서 공개하는 방안을 추진 중이다. LG전자 역시 CEO 직속 로보틱스사업센터를 중심으로 엔비디아와 협업한 이족보행 휴머노이드 신모델 개발 및 현장 실증을 이어가고 있으며, 내년 1분기 공개를 목표로 하고 있다."},{"s":"ETF 선택 | 3대 지수는 충격에 마감했고, 로봇, 인공지능, 금주 등 ETF도 좋은 성과를 냈다.","so":"Jiemian.com","tm":"11/23 17:14","c":1,"r":"cn","u":"https://www.jiemian.com/article/15362451.html","p":1795421676,"a":1795424037,"t":"ETF甄选 | 三大指数震荡收涨，机器人、人工智能、黄金股等ETF表现亮眼","su":"2026년 11월 23일 A주 시장은 하루 종일 등락을 거듭하며 상승했고, 3개 주요 지수가 종합적으로 상승세(오르는 흐름)로 마감했습니다. 마감 기준 상하이증권거래소지수는 0.15%, 선전부품지수는 1.93%, 차이넥스트지수는 3.08% 상승했다. ETF(여러 주식을 묶어 파는 상품)로는 로봇공학, 인공지능, 금주 등 관련 ETF가 눈부신 성과를 냈습니다!"},{"s":"'춤만 추는' 휴머노이드…상용화 지연에 로봇株 주가 1년 전으로 회귀","so":"한국경제","tm":"11/23 16:27","c":1,"r":"kr","u":"https://www.hankyung.com/article/202611234584i","p":1795418876,"a":1795424035,"su":"- 기사 스크랩 - 댓글 - 공유 - 글자크기 - 프린트 Google 검색에서 한국경제 기사를 더 자주 볼 수 있습니다. 휴머노이드(사람을 닮은 로봇) 로봇의 상용화 및 양산 지연으로 국내 로봇 업종 주가가 1년 전 수준으로 회귀한 가운데, 증권가에서는 본격적인 시장 확산 시기를 2030년 이후로 전망하며 실적(회사가 번 돈 성적표) 중심의 선별적 투자를 권고하고 있습니다. 한경 프리미엄9의 모든 콘텐츠는 한국경제신문의 저작물로 저작권법의 보호를 받습니다."},{"s":"[중국증시 마감] 촹예반지수 3% 급등…휴머노이드 로봇·AI 테마가 견인","so":"뉴스핌","tm":"11/23 16:19","c":1,"r":"kr","u":"https://www.newspim.com/news/view/20261123000980","p":1795418340,"a":1795424035,"su":"[서울=뉴스핌] 배상희 기자 = 23일 중국 본토 A주(중국 본토 주식시장 주식) 증시 4대 대표지수가 혼조 마감했다.상하이종합지수는 0.15% 상승한 3538.95, 선전성분지수는 1.93% 오른 10454.37, 촹예반(創業板)지수는 3.08% 뛴 2280.20 포인트를 기록했다."},{"s":"산업정보기술부는 R&D, 테스트, 응용을 위한 '공통 언어'를 제공하기 위해 휴머노이드 로봇에 대한 5가지 표준을 발표했습니다.","so":"21财经","tm":"11/23 16:04","c":1,"r":"cn","u":"https://www.21jingji.com/article/20261123/herald/164af93a7be56a5656e8547d13d480fa.html","p":1795417496,"a":1795424042,"t":"工信部发布5项人形机器人标准 为研发、测试与应用提供“共同语言”","su":"최근 산업정보기술부는 2026년 고시 제30호를 발표했다. 산업정보기술부 산하 휴머노이드(사람을 닮은 로봇) 로봇 및 구현지능표준화기술위원회(MIIT/TC8)에서 관리하는 휴머노이드 로봇 분야의 5개 표준을 공식 발표하고 시행했다. 이 표준 배치는 지능형 기능 평가, 핵심 구성 요소, 휴머노이드 로봇 교육이라는 세 가지 주요 방향을 다루며 휴머노이드 로봇의 연구 개발, 테스트 및 적용에 대한 방향 지침을 제공합니다. 이 배치의 5개 표준에는 \"인간형 로봇 전기 구동 통합 관절에 대한 기술 사양\"(SJ/T 12356-2026), \"인간형 로봇 및 임바디드 AI(로봇처럼 몸을 가진 인공지능)형 손재주 손에 대한 기술 사양\"(SJ/T 12357-2026), \"휴머노이드 로봇 훈련장 건설을 위한 기술 사양\"(SJ/T)이 포함됩니다. 12353-2026), \"휴머노이드 로봇 훈련 데이터 관리 요구 사항\"(SJ/T 12354-2026) 및 \"휴머노이드 로봇 지능형 기능 분류\"(SJ/T 12355-2026)는 모두 출시일부터 구현됩니다."},{"s":"Qinglang Intelligent Li Tong: 휴머노이드 로봇의 대규모 채용은 여전히 여러 문턱을 넘어야 합니다.","so":"财新","tm":"11/23 16:03","c":1,"r":"cn","u":"https://companies.caixin.com/2026-11-23/102507860.html","p":1795417380,"a":1795424043,"t":"擎朗智能李通：人形机器人规模化上岗仍需跨越多重门槛","su":"[Caixin.com] 휴머노이드(사람을 닮은 로봇) 로봇이 이미 춤추고 달리고 물건을 옮기는 등 복잡한 동작을 수행할 수 있지만, 호텔, 공장, 심지어 가정에 진출해 지속적이고 안정적으로 일할 수 있는 인력이 되기 위해서는 기술적 신뢰성, 경제적 비용 등 여러 문턱을 넘어야 한다. \"고객은 더 이상 '스토리텔링'에 비용을 지불하지 않고 '실질적인 가치 생산'에 대해서만 비용을 지불합니다.\" 상업 서비스 로봇 회사인 Qinglang Intelligence의 설립자이자 CEO인 Li Tong은 최근 Caixin과의 독점 인터뷰에서 2026년은 임바디드 AI(로봇처럼 몸을 가진 인공지능) 산업 발전의 중요한 노드라고 말했습니다. 본질적인 변화는 업계의 평가 기준이 기술 실증에서 실제 적용으로 전환되기 시작했다는 점이다. 로봇이 실제 작업 요구 사항을 충족할 수 있는지 여부는 고객의 핵심 문제가 되었습니다."},{"s":"테슬라의 Optimus 로봇에는 또 다른 큰 소식이 있습니다. 어떤 로봇 테마 ETF를 선택할 것인가? 저수수료 로봇ETF 인베스코(159559) 3일 연속 순유입","so":"Jiemian.com","tm":"11/23 15:16","c":1,"r":"cn","u":"https://www.jiemian.com/article/15361855.html","p":1795414589,"a":1795417587,"t":"特斯拉Optimus机器人再传大消息，机器人主题类ETF选哪个？低费率机器人ETF景顺(159559)连续3天净流入","su":"휴머노이드(사람을 닮은 로봇) 로봇 산업은 정책과 생산 능력 측면에서 중요한 진전을 가져오고 있습니다. 베이징은 '체체형 지능형 로봇 산업의 고품질 발전을 위한 행동 계획(2026~2028)'을 발표했는데, 이는 체형형 지능형 로봇을 고정밀 산업의 중요한 영역이자 미래 산업의 핵심 돌파구로 분명히 간주하는 것입니다."},{"s":"'본토 주식시장' 3대 지수 상승, CPO, 휴머노이드 로봇 1위 - 국제","so":"旺得富理財網","tm":"11/23 15:07","c":1,"r":"tw","u":"https://wantrich.chinatimes.com/news/20261123900249-420201","p":1795414036,"a":179541437 <script>
var D = JSON.parse(document.getElementById('data').textContent);
var RL = {}; D.regions.forEach(function(r){ RL[r.k] = r.l; });
function $(id){ return document.getElementById(id); }
function esc(t){ return String(t==null?'':t).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
// 휴대폰에 기억해 두는 값 (마지막 탭, 탭별로 마지막에 본 시각, 정렬, 국가)
function load(k, d){ try { var v = localStorage.getItem('nb_'+k); return v===null ? d : JSON.parse(v); } catch(e){ return d; } }
function save(k, v){ try { localStorage.setItem('nb_'+k, JSON.stringify(v)); } catch(e){} }
var S = { tab: (D.themes[0] && D.themes[0].stats && D.themes.length > 1) ? 1 : 0, seen: load('seen', null), sort: load('sort', 'c'), region: load('region', 'all'), shown: D.show, prev: {} };
function newest(t){ var m = 0; t.items.forEach(function(n){ if(n.a > m) m = n.a; }); return m; }
if(S.seen === null){ S.seen = {}; D.themes.forEach(function(t){ S.seen[t.name] = newest(t); }); save('seen', S.seen); }  // 처음 방문: 레드닷 없이 시작
(function(){ var nm = load('tabname', ''); D.themes.forEach(function(t, i){ if(t.name === nm) S.tab = i; }); })();  // 마지막에 본 탭 (이름으로 기억)
if(location.hash && /^#t\d+$/.test(location.hash)) S.tab = +location.hash.slice(2);
if(location.hash === '#stats') D.themes.forEach(function(t, i){ if(t.stats) S.tab = i; });
if(S.tab >= D.themes.length) S.tab = D.themes.length > 1 ? 1 : 0;

function visible(t){
  return t.items.filter(function(n){ return S.region==='all' || n.r===S.region; });
}
function sorted(list, breaking){
  var k = breaking ? 'p' : S.sort;
  return list.slice().sort(function(x,y){
    var c = y.c - x.c, p = y.p - x.p; return k==='c' ? (c||p) : (p||c);
  });
}
function renderTabs(){
  $('tabs').innerHTML = D.themes.map(function(t, i){
    var sn = S.seen[t.name] || 0;           // 지금 고른 나라에서 보이는 기사 중 새 기사가 있을 때만 (0개인데 레드닷 뜨던 문제)
    var dot = i !== S.tab && !t.stats && visible(t).some(function(n){ return n.a > sn; });
    return '<button class="tab'+(i===S.tab?' on':'')+'" onclick="openTab('+i+')">'+esc(t.name)+
           (t.stats ? '' : '<b>'+visible(t).length+'</b>')+(dot?'<span class="dot" title="새 뉴스"></span>':'')+'</button>';
  }).join('');
  var on = $('tabs').children[S.tab]; if(on && on.scrollIntoView) on.scrollIntoView({block:'nearest', inline:'center'});
}
function renderCtrl(){
  var br = D.themes[S.tab].breaking || D.themes[S.tab].stats;
  var h = '';
  if(!br){
    h += '<button class="'+(S.sort==='c'?'on':'')+'" onclick="setSort(\'c\')">🔥 화제순</button>';
    h += '<button class="'+(S.sort==='p'?'on':'')+'" onclick="setSort(\'p\')">🕒 최신순</button><span class="sep"></span>';
  }
  h += '<button class="'+(S.region==='all'?'on':'')+'" onclick="setRegion(\'all\')">전체</button>';
  D.regions.forEach(function(r){
    h += '<button class="'+(S.region===r.k?'on':'')+'" onclick="setRegion(\''+r.k+'\')">'+esc(r.l)+'</button>';
  });
  $('ctrl').innerHTML = h;
}
function card(n, prev){
  var hot = n.c > 1 ? '<span class="hot'+(n.c>=5?' big':'')+'">🔥 언론 '+n.c+'곳</span>' : '';
  var isNew = prev && n.a > prev ? ' <span class="new">NEW</span>' : '';
  return '<a class="card" href="'+esc(n.u)+'" target="_blank" rel="noopener" data-s="'+esc(n.su||'')+'" data-so="'+esc(n.so)+'">'+
    '<div class="meta">'+hot+esc(RL[n.r]||'')+' · '+esc(n.so)+' · '+esc(n.tm)+isNew+'</div>'+
    '<div class="title">'+esc(n.s)+'</div>'+(n.t?'<div class="orig">'+esc(n.t)+'</div>':'')+'</a>';
}
function renderMain(){
  if(D.themes[S.tab].stats){ renderStats(D.themes[S.tab]); return; }
  var t = D.themes[S.tab], list = sorted(visible(t), t.breaking), prev = S.prev[t.name] || 0;
  var h = '<h2>'+esc(t.name)+'</h2>' + (t.note ? '<p class="note">'+esc(t.note)+'</p>' : '');
  var fresh = prev ? list.filter(function(n){ return n.a > prev; }).length : 0;
  if(S.onlyNew){                                // '새 기사만 보기' 중

      (dn[i] < x.b - x.a ? ' (자료 '+dn[i]+'일치)' : '')+'</title></g>';
  }).join('');
  var ticks = M.map(function(x,i){ return x.m===1 ? '<line x1="'+(i*bw).toFixed(1)+'" y1="'+(H-14)+'" x2="'+(i*bw).toFixed(1)+'" y2="'+(H-9)+'" stroke="var(--sub)"/>'+
      '<text x="'+(i*bw+2).toFixed(1)+'" y="'+(H-1)+'" class="ax">'+x.y+'</text>' : ''; }).join('');
  var axis = ticks + '<line x1="0" y1="'+(H-14)+'" x2="'+W+'" y2="'+(H-14)+'" stroke="var(--line)"/>'+
             '<text x="0" y="9" class="ax">최대 하루 평균 '+Math.round(mx).toLocaleString()+'건</text>';
  var P = lperiod(), parts = D.regions.filter(function(r){ return (HI.regions||[]).indexOf(r.k) >= 0; }).map(function(r){
    return [r, hsum(th, P[0][0], P[0][1], r.k)]; }).filter(function(x){ return x[1] > 0; }).sort(function(a,b){ return b[1]-a[1]; });
  var pm = parts.length ? parts[0][1] : 1;
  var rows = parts.map(function(x){
    return '<div class="crow"><span class="cl">'+esc(x[0].l)+'</span><span class="cb"><i style="width:'+Math.max(2, x[1]/pm*100)+'%"></i></span><span class="cn">'+x[1].toLocaleString()+'</span></div>';
  }).join('') || '<div class="note">이 기간 기사 없음</div>';
  return '<div class="det"><div class="dt">달별 하루 평균 뉴스 수 ('+HI.since.slice(0,4)+'년 1월~)'+(S.region==='all'?'':' · '+esc(RL[S.region]))+'</div>'+
    '<svg class="bars" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(th)+' 달별 뉴스 수">'+bars+axis+'</svg>'+
    '<div class="dt">'+esc(P[2])+' 나라별</div>'+rows+'</div>';
}
function renderLong(h){
  if(!HI){ loadHist(); $('main').innerHTML = h + '<p class="none">장기 추이를 불러오는 중…</p>'; return; }
  if(HI.err || !HI.s || !HI.months || !HI.months.length){ $('main').innerHTML = h + '<p class="none">장기 추이를 아직 받는 중이에요. 처음 한 번은 몇 시간 걸려요. 조금 뒤에 다시 열어 주세요.</p>'; return; }
  if(S.region === 'world'){ $('main').innerHTML = h + '<p class="none">장기 추이는 나라별(한국·미국·중국·대만·홍콩·일본·싱가포르)로만 셀 수 있어요. 위에서 \'전체\'나 다른 나라를 골라 주세요.</p>'; return; }
  var P = lperiod();
  h += '<p class="note">GDELT(전 세계 뉴스 기록) 자료 · 본문에 테마 단어가 나온 기사 수 · 일주일에 한 번 갱신 · '+esc(HI.end.slice(5).replace('-','/'))+'까지 · 업데이트 '+esc(HI.updated||'')+'</p>';
  if(!HI.complete) h += '<div class="warn">⏳ '+HI.since.slice(0,4)+'년 1월부터 자료를 아직 받는 중이에요. 다 받기 전엔 일부 테마·나라·연도가 0이나 빈칸으로 보여요. 자료 서버가 느려서 하루쯤 걸려요 (봇이 알아서 이어 받음).</div>';
  h += '<div class="seg lp">' + [['all','전체'],['lm','지난달'],['ty','올해'],['yr','연도별']].map(function(x){
    return '<button data-lp="'+x[0]+'" class="'+(S.lp===x[0]?'on':'')+'">'+x[1]+'</button>'; }).join('') + '</div>';
  if(S.lp === 'yr') h += '<div class="seg ly">' + years().slice().reverse().map(function(y){   // 옛날 → 최근 순서로 (기본 선택은 최근 해)
    return '<button data-ly="'+y+'" class="'+(pickYear()===y?'on':'')+'">'+y+'</button>'; }).join('') + '</div>';
  var dc = avn(P[0][0], P[0][1]), dp = P[1] ? avn(P[1][0], P[1][1]) : 0, span = P[0][1] - P[0][0];
  if(span - dc > 0) h += '<div class="warn">ℹ️ 이 기간 중 '+(span-dc)+'일은 GDELT 서버 사정으로 자료가 비어 있어요 ('+span+'일 중 '+dc+'일치). 합계는 그만큼 적게 잡히고, ▲▼ 비교는 하루 평균끼리 해요.</div>';
  var rows = (HI.themes||[]).map(function(th){ return {th:th, n:hsum(th, P[0][0], P[0][1]), p: P[1] ? hsum(th, P[1][0], P[1][1]) : null}; })
                            .sort(byN);
  ranks(rows, !!P[1] && dp > 0);
  var mx = rows.length ? Math.max(1, rows[0].n) : 1, total = 0; rows.forEach(function(r){ total += r.n; });
  h += '<div class="tot">'+esc(P[2])+(S.region==='all'?' · 7개 나라':' · '+esc(RL[S.region]))+' · 총 <b>'+total.toLocaleString()+'</b>건 <span class="chgnote">'+(P[1]?'('+P[3]+')':'')+'</span></div>';
  h += rows.map(function(r, i){
    var open = S.open['L'+r.th];
    return '<div class="srow'+(open?' open':'')+'" data-th="'+esc(r.th)+'" data-l="1">'+
      '<div class="sline">'+mv(r, i)+'<span class="rk">'+(i+1)+'</span><span class="sn">'+esc(r.th)+'</span>'+
      '<span class="sb"><i style="width:'+Math.max(r.n?2:0, r.n/mx*100)+'%"></i></span>'+
      '<span class="sc">'+r.n.toLocaleString()+'</span>'+(r.p===null ? '<span class="chg"></span>' : chg(r.n, r.p, dc, dp))+mspark(r.th)+'</div>'+
      (open ? ldetail(r.th) : '') + '</div>';
  }).join('');
  h += '<footer>· 순위 왼쪽 <span style="color:#f87171">▲</span>/<span style="color:#60a5fa">▼</span> = 비교 기간(전달·작년 같은 기간·전년)보다 몇 계단 오르고 내렸는지<br>· 오른쪽 작은 선 = '+HI.since.slice(0,4)+'년 1월부터 달별 흐름(하루 평균), 줄을 누르면 달별 그래프와 나라별 구성<br>'+
       '· 일별 집계(기사 제목 기준, 구글 뉴스)와 세는 방법이 달라 숫자 크기는 서로 비교하지 말고 흐름만 보세요<br>'+
       '· 한국·중국·일본 기사도 GDELT 가 영어로 번역해 둔 것을 영어 검색어로 셉니다 · 자료가 빠진 날은 0이 아니라 빈칸으로 둠</footer>';
  $('main').innerHTML = h;
}
document.addEventListener('click', function(e){
  var b = e.target.closest('.seg.lp button');
  if(b){ S.lp = b.dataset.lp; save('lp', S.lp); renderMain(); return; }
  var yb = e.target.closest('.seg.ly button');
  if(yb){ S.ly = +yb.dataset.ly; save('ly', S.ly); renderMain(); return; }
  var m = e.target.closest('.seg.sm button');
  if(m){ S.sm = m.dataset.sm; save('sm', S.sm); renderMain(); return; }
}, true);

openTab(S.tab);
refreshBreaking();
setInterval(refreshBreaking, 5 * 60 * 1000);
document.addEventListener('visibilitychange', function(){ if(!document.hidden) refreshBreaking(); });

// 기사를 누르면 먼저 한국어 요약 → 원문 볼지 선택
document.addEventListener('click', function(e){
  var c = e.target.closest('a.card'); if(!c) return;
  if(e.ctrlKey||e.metaKey||e.shiftKey) return;
  e.preventDefault();
  $('s-meta').innerHTML = c.querySelector('.meta').innerHTML;
  $('s-title').textContent = c.querySelector('.title').textContent;
  var o = c.querySelector('.orig'); $('s-orig').textContent = o ? o.textContent : '';
  var sm = c.dataset.s || '';
  $('s-sum').textContent = sm || '이 기사는 요약을 가져오지 못했어요. (사이트가 자동 접속을 막았거나 아직 준비 중)';
  $('s-sum').className = 's-sum' + (sm ? '' : ' empty');
  $('s-go').href = c.href;
  // 외국어 기사면 ✦ Gemini 버튼 보이기 (한국어 기사는 숨김)
  var foreign = !!o || !/[가-힣]/.test(c.querySelector('.title').textContent);   // 번역이 안 됐어도 외국 기사면 버튼 표시
  $('s-cs').hidden = $('s-ct').hidden = $('s-cnote').hidden = !foreign;
  if(foreign){
    // 원문을 열고, Gemini 가 '지금 화면'의 기사를 읽고 답하도록 요청 문장만 복사
    $('s-cs').href = $('s-ct').href = c.href;
    $('s-cs').dataset.q = '이 페이지의 기사 전체를 처음부터 끝까지 읽고 한국어로 요약해 줘. 핵심 내용 3~5줄, 그리고 투자자 입장에서 중요한 숫자와 의미를 짧게 정리해 줘.';
    $('s-ct').dataset.q = "너는 어려운 경제 뉴스를 초등학생도 이해할 수 있게 풀어 주는 친절한 번역가야.\n이 페이지의 뉴스 기사 전체를 쉬운 한국어로 번역해 줘.\n\n[가장 중요한 규칙]\n- 쉽게 쓰더라도 기사 내용은 정확해야 해. 사실을 빼거나, 바꾸거나, 지어내지 마.\n- 기사 순서대로, 빠지는 내용 없이 번역해 줘.\n\n[쉽게 쓰는 방법]\n1. 한 문장에는 한 가지 내용만 써 줘. 문장은 짧게.\n2. \"~습니다/~해요\"체로 친절하게 써 줘.\n3. 어려운 말은 쉬운 말로 바꾸고, 꼭 필요한 전문 용어는 처음 나올 때 괄호로 뜻을 풀어 줘.\n   (예: 금리(돈을 빌릴 때 내는 이자의 비율), 실적(회사가 번 돈과 성과), 주가(회사 주식 한 주의 가격))\n4. 한자어·외래어보다 쉬운 우리말을 먼저 써 줘. (예: 하락 → 떨어졌어요, 상승 → 올랐어요)\n5. 큰 숫자는 읽기 쉽게 바꾸되 정확한 값은 지켜 줘. (예: $2.5 billion → 25억 달러(약 3조 5천억 원쯤))\n   환율로 바꾼 값은 \"약\"을 붙여서 대략이라는 걸 알려 줘.\n6. 회사·사람 이름은 한국에서 부르는 이름으로 쓰고, 처음 나올 때만 괄호에 영어 이름을 적어 줘. (예: 엔비디아(Nvidia))\n7. 누가 한 말인지 분명하게 써 줘. (예: 젠슨 황 대표는 \"…\"라고 말했어요.)\n\n[출력 형식]\n① 한 줄 요약: 이 기사가 무슨 이야기인지 한 문장으로\n② 쉬운 번역: 기사 순서대로\n③ 어려운 말 풀이: 기사에 나온 경제 용어 3~5개를 한 줄씩 쉽게 설명\n④ 그래서 무슨 뜻이야?: 이 소식이 주식 투자하는 사람에게 왜 중요한지 2~3줄\n   (기사에 나온 사실만 근거로, 내 생각이나 예측은 넣지 마)\n\n기사가 길어서 한 번에 다 못 하면, 어디까지 했는지 알려 주고 내가 \"계속\"이라고 하면 이어서 해 줘.";
  }
  $('dim').hidden = false; $('sheet').hidden = false; $('sheet').scrollTop = 0;
  document.body.style.overflow = 'hidden';
});
// ✦ 버튼: Gemini 요청 문장을 복사하고 원문을 엶 → 원문 화면에서 Gemini 를 불러 붙여넣기
function askAI(a){
  var q = a.dataset.q || '';
  try { if(navigator.clipboard) navigator.clipboard.writeText(q); } catch(e){}
  toast('요청 문장을 복사했어요 · 원문에서 측면 버튼 길게 → 「이 페이지에 관해 질문하기」 → 붙여넣기');
  setTimeout(closeSheet, 50);
}
function toast(msg){ var t = $('toast'); t.textContent = msg; t.hidden = false; clearTimeout(toast._t); toast._t = setTimeout(function(){ t.hidden = true; }, 4000); }
function closeSheet(){ $('dim').hidden = true; $('sheet').hidden = true; document.body.style.overflow = ''; }
document.addEventListener('keydown', function(e){ if(e.key==='Escape') closeSheet(); });
