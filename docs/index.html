:root{color-scheme:dark;--bg:#262624;--card:#30302e;--card2:#3a3a37;--text:#faf9f5;--sub:#a6a39a;--line:#3e3e3a;--acc:#d97757;--red:#ef4444}

.upd{color:var(--sub);font-size:12.5px}

.tabs{position:sticky;top:0;z-index:3;background:rgba(38,38,36,.96);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}

.tab{position:relative;flex:none;padding:9px 15px;border-radius:12px;border:1px solid var(--line);background:var(--card);

.tab.on{background:var(--acc);border-color:var(--acc);color:#1f1e1d;font-weight:600}.tab.on b{color:#1f1e1d}
.dot{position:absolute;top:-3px;right:-3px;width:11px;height:11px;border-radius:50%;background:var(--red);border:2px solid var(--bg)}

.ctrl .sep{flex:none;width:1px;background:var(--line);margin:2px 4px}
main{padding:6px 12px 48px}

.note{margin:0 4px 10px;color:var(--sub);font-size:12px}
.none{color:var(--sub);margin:24px 4px;text-align:center}
.card{display:block;background:var(--card);border-radius:12px;padding:12px 14px;margin:8px 0;color:var(--text);text-decoration:none;transition:background .15s}
.card:hover{background:var(--card2)}.card:active{opacity:.75}
.meta{color:var(--sub);font-size:12px}
.title{font-weight:500;margin-top:3px}
.orig{color:var(--sub);font-size:12px;margin-top:3px}
.new{margin-left:4px;color:var(--red);font-size:11px;font-weight:700;letter-spacing:.3px}
.hot{display:inline-block;margin-right:6px;padding:0 6px;border-radius:4px;background:rgba(217,119,87,.16);color:var(--acc);font-weight:600}
.hot.big{background:var(--acc);color:#1f1e1d}
.newbar{display:block;width:100%;margin:2px 0 6px;padding:9px;border:0;border-radius:10px;background:rgba(239,68,68,.14);color:#fca5a5;font:inherit;font-size:13px;text-align:left}
.more{display:block;width:100%;margin:4px 0 0;padding:10px;border:1px dashed var(--line);border-radius:12px;background:transparent;color:var(--sub);font:inherit;font-size:13px}
footer{margin:36px 4px 0;padding-top:14px;border-top:1px solid var(--line);color:var(--sub);font-size:12px;line-height:1.7}
footer b{color:var(--text);font-weight:600}
/* 요약 창 */
#dim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:5}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:6;max-width:760px;margin:auto;max-height:82vh;overflow-y:auto;
  background:var(--card);border-radius:16px 16px 0 0;padding:10px 18px calc(18px + env(safe-area-inset-bottom));box-shadow:0 -8px 30px rgba(0,0,0,.4)}
.grab{width:38px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 12px}
.s-title{font-size:17px;font-weight:600;margin:4px 0 2px;line-height:1.45}
.s-label{margin:16px 0 4px;color:var(--acc);font-size:12px;font-weight:700;letter-spacing:.5px}
.s-sum{font-size:15px;line-height:1.75}.s-sum.empty{color:var(--sub);font-size:13.5px}
.s-btns{display:flex;gap:8px;margin-top:20px}
.s-btns a{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;padding:11px 6px;border-radius:10px;font:inherit;font-size:13.5px;line-height:1.3;text-decoration:none;
  background:var(--acc);color:#1f1e1d;font-weight:600}
.s-btns a.cl{background:transparent;border:1px solid var(--acc);color:var(--acc)}
.s-close button{width:100%;margin-top:8px;padding:11px;border-radius:10px;background:transparent;border:1px solid var(--line);color:var(--sub);font:inherit;font-size:14px}
.s-cnote{margin-top:8px;color:var(--sub);font-size:11.5px;text-align:center}
#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);z-index:9;max-width:90%;padding:10px 16px;border-radius:10px;background:#faf9f5;color:#1f1e1d;font-size:13.5px;box-shadow:0 6px 20px rgba(0,0,0,.4)}
.seg{display:flex;gap:4px;margin:6px 4px 10px}.seg button{flex:1;min-width:0;border:1px solid var(--line);background:transparent;color:var(--sub);border-radius:8px;padding:7px 0;font:inherit;font-size:12.5px;white-space:nowrap}
.seg.ly{margin-top:-4px}.seg.ly button{padding:5px 0;font-size:12px}.seg.ly button.on{background:var(--card2);border-color:var(--acc);color:var(--text);font-weight:600}
.seg.sm{margin-bottom:8px}.seg.sm button{padding:9px 0;font-size:13px}.seg.sm button.on{background:var(--card2);border-color:var(--acc);color:var(--text)}
.notes{margin:0 4px 10px}.helpl{margin:4px 0 0;padding:8px 10px 8px 26px;border-radius:8px;background:var(--card2);font-size:12.5px;line-height:1.6;color:var(--text)}.helpl li{margin:2px 0}.notes summary{cursor:pointer;font-size:13px;color:var(--sub);padding:6px 10px;border-radius:8px;background:rgba(250,204,21,.08);list-style:none}.notes summary::-webkit-details-marker{display:none}.notes summary:before{content:"▸ ";}.notes[open] summary:before{content:"▾ ";}.notes[open] summary{margin-bottom:6px}.notes .warn{margin:0 0 6px}.warn{margin:0 4px 10px;padding:8px 10px;border-radius:8px;background:rgba(250,204,21,.08);color:var(--sub);font-size:12.5px;line-height:1.5}.warn b{color:var(--text)}
.seg button.on{background:var(--acc);border-color:var(--acc);color:#1f1e1d;font-weight:600}
.tot{margin:2px 4px 10px;color:var(--sub);font-size:13px}.tot b{color:var(--text)}.chgnote{font-size:11px}
.srow{background:var(--card);border-radius:12px;margin:6px 0;padding:10px 12px;cursor:pointer}.srow.open{background:var(--card2)}
.sline{display:flex;align-items:center;gap:8px}
.rk{width:18px;color:var(--sub);font-size:12px;text-align:right;flex:none}

.spark{flex:none}
.det{margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.dt{color:var(--sub);font-size:12px;margin:6px 0 4px}
.bars{width:100%;height:auto;display:block}.bars .ax{fill:var(--sub);font-size:10px}.bars .bar:hover rect+rect{opacity:.8}

@media(max-width:400px){.spark{display:none}.sn{width:74px}}

,"su":"메모리 반도체(전자기기 속에서 계산하고 기억하는 작은 부품) 확보 경쟁이 치열해지며 일론 머스크 테슬라 최고경영자(CEO(회사의 가장 높은 책임자))가 삼성전자에 장기 구매와 신규 공장 자금조달 보증을 제안했다가 추가 조건을 요구받았다는 일화가 알려졌다. 이재용 삼성전자 회장이 2023년 5월 10일 미국 실리콘밸리에 위치한 삼성전자 북..."},{"s":"머스크도 퇴짜 맞은 메모리 확보 전쟁…JY \"뭘 더 해줄건데\"","so":"조선일보","tm":"11/26 20:41","c":3,"r":"kr","u":"https://www.chosun.com/economy/tech_it/2026/11/26/3UELRQCP2RGPFJQN2TKPBFHSIU/","p":1795693260,"a":1795694185,"su":"머스크도 퇴짜 맞은 메모리(정보를 기억하는 반도체) 확보 전쟁JY 뭘 더 해줄건데"},{"s":"미, 반도체 겨냥 \"과잉생산 징후\"...관세 이어 투자 압박?","so":"YTN","tm":"11/26 19:13","c":3,"r":"kr","u":"https://www.ytn.co.kr/_ln/0102_202611261913285422","p":1795687980,"a":1795689094,"su":"미 무역대표부는 우리 반도체(전자기기 속에서 계산하고 기억하는 작은 부품) 산업 등을 겨냥해 과잉생산 징후가 두드러진다고 지적했습니다. 3대 메가프로젝트 등 정부 정책을 빌미로 추가 관세(수입품에 붙이는 세금) 인상이나 투자 압박 가능성이 있다는 분석도 나옵니다. 김대근 기자가 보도합니다. 미 무역대표부는 한국의 반도체와 자동차, 석유화학 산업에서 구조적인 과잉생산 징후가 두드러진다고 지적했습니다."},{"s":"홍콩 주식의 기술적 반등으로 즉시 213억 달러의 남쪽 자금이 인출되었고 항셍 지수의 하루 상승폭은 260포인트 하락한 22226을 기록했습니다.","so":"etnet 經濟通","tm":"11/26 17:47","c":3,"r":"hk","u":"https://www.etnet.com.hk/www/tc/news/news-article.php?section=features&category=financenews&newsid=418314","p":1795682820,"a":1795683288,"t":"港股技術反彈即引213億北水退出，恒指全日升幅收窄至260點報22226","su":"홍콩 주식의 기술적 반등은 즉시 213억 달러의 남향 펀드의 인출로 이어졌고, 항셍지수의 하루 상승 폭은 260포인트인 22226으로 좁혀졌습니다. 다음날 밤 미국 증시는 V자 반등을 보였습니다. 홍콩 증시는 7연속 하락세를 보이며 22,000선을 돌파했습니다. 전날 14일 RSI 지수는 27까지 하락해 시장이 심각한 과매도(너무 많이 팔려 값이 지나치게 내려간 상태) 상태임을 나타냈다. 항셍지수는 오늘 오전 최대 577포인트 상승하며 강력한 기술적 반등을 촉발했습니다. 그러나 남향 펀드는 상승세(오르는 흐름)를 보이다가 오후에는 압박을 받으며 매도했습니다. 더욱 심화되면서 하루 동안 213억 위안 이상의 순유출이 기록되었는데, 이는 올해 4월 8일 이후 가장 높은 일일 남향 자본 흐름으로 시장의 이익을 끌어내리고 점차 좁아졌습니다. 하루 종일 260포인트(1.2%) 늘어난 22,226건으로 마감했고, 메인보드 거래량은 거의 2,125억 위안에 달했습니다. 항셍중국기업지수는 108포인트(1.5%) 상승한 7,493으로 마감했다. 항셍테크지수는 39포인트(1.2%) 상승한 3417로 마감했다."},{"s":"한은, 금리 3.25%로 인상…내년 1~2차례 더 올릴 듯, ‘이중 긴축’ 우려","so":"중앙일보","tm":"11/26 16:37","c":3,"r":"kr","u":"https://www.joongang.co.kr/article/25482301","p":1795678651,"a":1795678912,"su":"올해 세 차례 금리를 올린 한국은행이 긴축의 출구를 더 멀리 잡았다. 반도체 호황을 등에 업고 내년 경제성장률 전망치를 4.1%로 높이면서, 내년 상반기에만 한두 차례 추가 금리 인상(이자 비율을 올리는 것) 가능성을 열어뒀다. 반도체 호황의 온기가 경제 전반에 퍼지기도 전에 증시 급락과 이자 부담 증가라는 ‘이중 긴축’의 냉기도 밀려오고 있다. 한은 금융통화위원회는 26일 기준금리(중앙은행이 정하는 기본 이자 비율)를 연 3.0%에서 3.25%로 0.25%포인트 올렸다. 지난 7월과 8월에 이어 올해 세 번째 인상이다."},{"s":"[기준금리 3.25%] 반도체 호황 내년 성장률 4.1%…한은 \"성장 한 단계 높일 기회\"","so":"글로벌이코노믹","tm":"11/26 16:30","c":3,"r":"kr","u":"https://www.g-enews.com/article/Finance/2026/11/20261126155929966cd0bfacc1c_1","p":1795678236,"a":1795678915,"su":"한국은행이 글로벌 반도체(전자기기 속에서 계산하고 기억하는 작은 부품) 경기 호조가 적어도 내년 상반기까지 이어질 것으로 전망했다. 반도체 등 정보기술(IT) 제조업이 경제 전체에서 차지하는 비중이 확대되면서 우리 경제의 성장률을 한 단계 끌어올릴 기회가 될 것으로 평가했다. 올해 수출 중심이었던 성장 흐름도 내년에는 반도체 경기"},{"s":"3개의 주요 기관 투자자가 대만 주식을 NT$132.65억 이상 매도했습니다.","so":"經濟日報","tm":"11/26 16:30","c":3,"r":"tw","u":"https://money.udn.com/money/story/5612/9903780?from=edn_related_storybottom","p":1795678220,"a":1795678949,"t":"三大法人賣超台股132.65億元","su":"台股今天漲956.38點，收在39151.81點，成交值新台幣8174.67億元。三大法人外資及陸資賣超，投信、自營商買..."},{"s":"[증시-마감] 저가 매수에 코스피 4,700선 회복…4,711.21 마감","so":"연합인포맥스","tm":"11/26 16:07","c":4,"r":"kr","u":"https://news.einfomax.co.kr/news/articleView.html?idxno=4446806","p":1795676859,"a":1795677441,"su":"코스피(한국 큰 회사들 주가를 합쳐 만든 점수)가 저가 매수세(사려는 힘) 속에서 전일의 급락분을 일부 되돌리고 4,700선을 회복했다.26일 코스피는 전 거래일보다 13.70포인트(0.29%) 상승한 4,711.21에 거래를 마쳤다.지수는 이날 1.01% 상승한 4,745.10에 출발해 개장 초 4,800선까지 오르기도 했으나 이내 상승 폭을 축소하고 현 레벨에서 마감했다.전일 삼성전자와 SK하이닉스가 나란히 10% 안팎 급락하면서 코스피가 6% 넘게 하락했던 터라 이날은 저가 매수세 유입으로 그간의 하락분을 일부 되돌렸다. 간밤 미국 증시에서는 인공지능(AI) 관련주 급락으로 출"},{"s":"[속보] 원·달러 환율, 0.5원 내린 1342.7원","so":"Chosunbiz","tm":"11/26 15:36","c":1,"r":"kr","u":"https://biz.chosun.com/policy/policy_sub/2026/11/26/PENYN6DR6JHAXLDU76YGOUP4MU/","p":1795674960,"a":1795675279,"su":"입력 2026.11.26. 15:36업데이트 2026.11.26. 15:39 조선비즈 구글 검색 먼저 보기 서울 중구 하나은행 위변조대응센터에서 직원이 달러를 정리하고 있다. /연합뉴스 미 달러화 대비 원화 환율(원·달러 환율)은 26일 오후 3시 30분 1342.7원으로 주간 거래를 마쳤다. 직전 거래일 주간 종가보다 0.5원(0.03%) 내렸다. 같은 기준으로 지난 23일 1340원을 돌파한 뒤 5거래일 연속 1340원대를 유지하고 있는 것이다."},{"s":"대만 증시는 956포인트 상승하며 39,000포인트 651219,"su":"한국수출입은행이 ㈜두산 등 국내 인공지능(AI) 소재․부품 분야 기업의 수출, 해외투자 확대를 위한 지원에 나선다.26일 금융권에 따르면 한국수출입은행은 두산의 고성능 동박적층판(CCL) 중국 생산거점 구축을 위해 1800억 원을 지원한다.CCL은 반도체(전자기기 속에서 계산하고 기억하는 작은 부품) 칩이 서로 신호를 주고받도록 미"},{"s":"美, 호남 반도체 클러스터 정조준…관세 최대 25% 검토","so":"한스경제","tm":"11/26 08:47","c":3,"r":"kr","u":"https://www.hansbiz.co.kr/news/articleView.html?idxno=887426","p":1795650450,"a":1795651949,"su":"| 서울=한스경제 고예인 기자 | 미국 도널드 트럼프 행정부가 한국의 반도체(전자기기 속에서 계산하고 기억하는 작은 부품) 산업 육성 정책을 정조준했다. 이재명 정부가 추진 중인 호남 반도체 클러스터 조성 계획을 과잉생산의 근거로 지목한 데 이어 삼성전자와 SK하이닉스의 글로벌 메모리(정보를 기억하는 반도체) 시장 지배력까지 문제 삼았다. 한국산 제품에 대한 합산 관세율을 최대 25%까지 높이는 방안도 검토하면서 국내 반도체 업계의 통상 불확실성이 커지고 있다.25일(현지시간) 미국 무역대표부(USTR)가 공개한 무역법 제301조 조사보고서에 따르면 미국 정부는 한국의 반도체 생산능력 확대 정책을 정부"},{"s":"[AI MY 증시전망] 코스피, 반도체주 저가매수세 유입 전망…금통위·증안펀드 주목","so":"뉴스핌","tm":"11/26 08:25","c":4,"r":"kr","u":"https://www.newspim.com/news/view/20261126000053","p":1795649100,"a":1795649776,"su":"SK하이닉스 주가, 앞으로 오를까? SK하이닉스 지금 사도 될까? SK하이닉스 1년 뒤 주가는 얼마일까? SK하이닉스 주가에 영향을 줄 변수는? 본 콘텐츠는 투자 결과에 대한 법적 책임의 근거로 사용될 수 없습니다. AI 핵심 요약 beta 분석 중... - 26일 국내 증시는 전날 급락에 따른 저가매수세로 반등을 시도한다 - 삼성전자·SK하이닉스 등 반도체(전자기기 속에서 계산하고 기억하는 작은 부품) 대형주와 외국인 수급에 주목한다 - 금통위 기준금리(중앙은행이 정하는 기본 이자 비율)와 증시안정 대책이 반등 강도와 변동성을 좌우한다"},{"s":"관세로 미 증시 부담 주더니…트럼프, 주가 하락에 또 \"중간선거 때문\"","so":"SBS 뉴스","tm":"11/26 08:19","c":3,"r":"kr","u":"https://news.sbs.co.kr/news/endPage.do?news_id=N1008864090","p":1795648751,"a":1795649777,"su":"트럼프 대통령은 이날 소셜미디어 트루스소셜에서 \"11월 3일 선거 결과로 인해 주가가 급락했다\"고 말했습니다. 이어 \"나는 투표용지에 오르지 않았지만 만약 출마했다면 이전 세 번과 마찬가지로 결과가 완전히 달라졌을 것이고 주식시장과 여러분의 401K 계좌는 호황을 누리고 있을 것\"이라고 주장했습니다."},{"s":"[속보]美증시, 장중 급락 딛고 낙폭 대부분 만회…다우는 상승 마감","so":"이데일리","tm":"11/26 06:02","c":1,"r":"kr","u":"https://www.edaily.co.kr/News/Read?newsId=01298886645649656&mediaCodeNo=257","p":1795640552,"a":1795641056,"su":"뉴욕증시가 25일(현지시간) 장 초반 급락했다가 낙폭을 대부분 만회하며 엇갈린 채 마감했다. 인공지능(AI)주 매도세(팔려는 힘)에 물가 지표와 관세안 발표가 겹치며 크게 밀렸지만, 추수감사절 연휴를 앞두고 저가 매수세(사려는 힘)가 유입됐다. 사진=로이터이날 뉴욕증권거래소(NYSE)에서 ..."},{"s":"한은, 오늘 금통위…韓경제  다우존스 선물은 1.33% 상승했습니다. 뉴욕증권거래소와 나스닥은 이날 조기 마감된다. 시장 개장 전 NVDA(엔비디아)가 4.7% 상승하고, AMD(AMD-US)가 7% 상승하고, 브로드컴(AVGO-US)이 4.7% 상승하는 등 반도체주가 상승세를 주도했습니다. 코어위브(CRWV-US)가 7.9%, 네비우스(NBIS-US)가 9.5% 상승하는 등 컴퓨팅 파워 임대 회사에도 매수가 확대되었습니다. 그러나 최근 거래일 종가를 기준으로 보면 엔비디아의 가격은 10월 최고치보다 여전히 37% 이상 낮다."},{"s":"<제1금융이론> 중앙은행은 연말에 금리를 인상할 것인가? 중국 은행은 대만이 금리를 계속 유지할 것으로 예상하지만 연준은 내년 1분기 이전에 금리를 두 번 인상할 것으로 예상됩니다.","so":"鉅亨網","tm":"11/27 20:44","c":1,"r":"tw","u":"https://news.cnyes.com/news/id/6674022","p":1795779893,"a":1795780821,"t":"〈第一金法說〉央行年底升息？一銀估台灣按兵不動 惟Fed明年Q1前有望升息2次","su":"퍼스트파이낸셜홀딩스는 내년 세계 경제성장률을 3.4%, 대만은 6% 안팎으로 전망해 경제가 플러스 성장을 유지할 것으로 내다봤다. 연준은 시장 컨센서스에 맞춰 12월과 내년 3월 금리를 각각 0.25%포인트씩 인상할 여지를 가질 것으로 예상된다. 대만 중앙은행은 12월 기준금리를 변동 없이 유지하지만, 대만과 미국 간의 금리 격차가 확대되고 수입 인플레이션(물건값이 계속 오르는 것)이 과열될 경우 금리 인상(이자 비율을 올리는 것)을 배제하지 않습니다."},{"s":"뉴욕증시 프리뷰, AI·반도체주 저가 매수에 나스닥 선물 2% 상승…금리 인상 우려 여전","so":"뉴스핌","tm":"11/27 20:34","c":1,"r":"kr","u":"https://www.newspim.com/news/view/20261127001366","p":1795779240,"a":1795780802,"su":"[서울=뉴스핌] 고인원 기자= 미국 주가지수 선물(미래 값을 미리 정해 사고파는 거래)이 27일(현지시간) 일제히 급등하고 있다. 추수감사절 연휴를 마치고 돌아온 투자자들이 최근 급락한 인공지능(AI) 관련주를 중심으로 저가 매수에 나서면서 나스닥(미국 기술 회사들이 많이 모인 주식시장)100지수 선물이 3% 가까이 상승하고 있다.다만"},{"s":"165,000개의 새로운 추가! 미국의 10월 비농업 고용이 예상을 뛰어넘었습니다. 연준이 다음 달 금리를 인상하는 것이 안전한가요?","so":"第一财经","tm":"11/27 20:24","c":1,"r":"cn","u":"https://www.yicai.com/news/103430479.html","p":1795778665,"a":1795785155,"t":"新增16.5万！美国10月非农大超预期，美联储下月加息稳了？","su":"미국의 10월 비농업 고용(농업을 뺀 일자리 수)은 예상보다 더 많이 증가했고 실업률(일하고 싶은데 일자리가 없는 사람 비율)은 역사적으로 낮은 수준으로 떨어졌습니다. 최신 데이터에 따르면 노동 시장은 여전히 탄력적이며 연준이 12월에 금리를 인상할 것이라는 기대가 높아졌습니다. 미국 노동부 노동통계국은 지난달 일자리가 16만5000개 늘었다고 29일 밝혔다. 경제학자들은 취업자가 6만5000명 늘어날 것으로 예상했다. 10월 고용 증가폭이 컸을 뿐만 아니라 이전 두 달의 데이터도 크게 상향 수정되었습니다. 8월 데이터는 53,000에서 186,000으로 상향 수정되었습니다. 9월 데이터는 31,000에서 60,000으로 상향 수정되었습니다. 초기 수치와 비교해 두 달 동안 총 84,000개의 일자리가 추가되었습니다."},{"s":"격렬한 변동이 있는 한 주가 끝날 때 주식이 반등할 예정","so":"The New York Times","tm":"11/27 20:13","c":1,"r":"us","u":"https://www.nytimes.com/2026/11/27/business/stocks-tech-stocks-ai.html","p":1795778037,"a":1795780804,"t":"Stocks Set to Rally at End of a Week of Wild Swings"},{"s":"뱅크오브아메리카는 2027년 S&P500이 8% 상승할 것으로 예상합니다. 귀하의 ETF는 연착륙할 준비가 되어 있습니까?","so":"Yahoo Finance","tm":"11/27 20:08","c":1,"r":"us","u":"https://finance.yahoo.com/markets/stocks/articles/bofa-sees-p-500-rising-110800608.html","p":1795777680,"a":1795785151,"t":"BofA Sees S&P 500 Rising 8% in 2027: Are Your ETFs Ready for a Soft Landing?","su":"뱅크오브아메리카는 2027년까지 S&P500(미국 큰 회사 500곳의 주가를 합쳐 만든 점수)의 상승여력을 8.3%로 예측하지만 자사주 매입(회사가 자기 주식을 다시 사는 것)이 줄어들고 위험이 증가함에 따라 이 세 가지 저비용 ETF를 자세히 살펴볼 가치가 있습니다."},{"s":"월스트리트 주간 하락하는 주식 시장은 고용 데이터, 다음 테스트로 금리 전망에 직면","so":"Reuters","tm":"11/27 20:03","c":1,"r":"us","u":"https://www.reuters.com/business/wall-st-week-ahead-sliding-stock-market-confronts-jobs-data-rate-view-next-tests-2026-11-27/","p":1795777426,"a":1795785152,"t":"Wall St Week Ahead Sliding stock market confronts jobs data, rate view as next tests"},{"s":"샌디스크가 11% 이상, 광통신 주가가 10% 이상 오르는 등 미국 칩 주가는 시장 개장 전부터 급등했다.","so":"21财经","tm":"11/27 19:41","c":1,"r":"cn","u":"https://www.21jingji.com/article/20261127/herald/322f1bb78f9862a6a1c1f9515a626a01.html","p":1795776060,"a":1795780808,"t":"美股芯片股盘前飙升，闪迪涨超11%，光通信多股涨超10%","su":"21파이낸셜레이더(21 Financial Radar)에 따르면 베이징 시간으로 11월 27일 오후 미국 3대 주가지수 선물이 종합적으로 상승했다. 17시 20분 현재 다우 선물은 1.3%, 나스닥 선물은 2.8%, S&P500(미국 큰 회사 500곳의 주가를 합쳐 만든 점수) 선물은 1.94% 상승했습니다. 시장 개장 전 반도체(전자기기 속에서 계산하고 기억하는 작은 부품)주가 급등했다. 샌디스크는 11% 이상, 마이크론는 8% 이상, SK하이닉스는 7.7%, AMD Semiconductor 및 Western Digital은 7%, 인텔은 약 6%, 엔비디아는 5%, 앤트로픽은 5% 이상 상승했습니다. 대규모 기술주는 시장이 열리기 전에 상승했습니다. 아마존과 메타는 3% 이상, 테슬라와 구글은 거의 3%, 스페이스X와 오라클은 5% 이상, 마이크로소프트는 2% 이상, 애플은 약 1% 상승했습니다. 광통신주는 시장 개장 전부터 일제히 급등했다. 루멘텀, 코히런트 및 어플라이드 옵토일렉트로닉스는 10% 이상 상승했고 마벨 Technology는 8% 이상 상승했으며 코닝은 6% 이상 상승했습니다."},{"s":"엔비디아 AI 제국은 혼자 싸우지 않습니다! 새로운 미국 주식 ETF는 미국 이외의 반도체 공급망을 목표로 합니다.","so":"鉅亨網","tm":"11/27 19:30","c":1,"r":"tw","u":"https://m.cnyes.com/news/id/6673832","p":1795775403,"a":1795780822,"t":"輝達AI帝國非單打獨鬥！美股新ETF瞄準非美半導體供應鏈","su":"엔비디아 AI 제국은 혼자 싸우지 않습니다! 새로운 미국 주식 ETF(여러 주식을 묶어 파는 상품)는 미국 이외의 반도체(전자기기 속에서 계산하고 기억하는 작은 부품) 공급망을 대상으로 합니다. 거형망(Anue) 뉴스 센터 엔비디아 CEO 젠슨 황의 복귀로 전체 인공 지능(AI) 산업에 낙관론이 다시 불붙었습니다. 그러나 반도체 산업의 다음 호황을 활용하기를 희망하는 투자자들은 미국 이외의 반도체 회사에 눈을 돌리고 싶어할 수도 있습니다. 벤징가의 보고서에 따르면 엔비디아의 거대한 AI 제국은 엔비디아만으로는 지원되지 않습니다. 해외 공급망 기업도 중요한 역할을 한다. 새로 출시된 xETFs International Semiconductor Index ETF(ISMH-US)는 이러한 투자 논리를 확증해 줍니다."},{"s":"트럼프의 관세는 무겁고, 연준은 12월에 금리를 인상할 확률이 90% 이상입니다! 금리 인상이 기술주 강세장의 종말을 의미하는 것은 아닙니다. UBS 채권펀드 운용사 종준창(Zhong Junchang)","so":"工商時報","tm":"11/27 19:30","c":1,"r":"tw","u":"https://www.ctee.com.tw/news/20261127701475-430301","p":1795775400,"a":1795780824,"t":"川普關稅重槌、Fed 12月升息機率逾9成！升息不等於科技股牛市終點 Ft.瑞銀投信固定收益基金經理人 鍾君長","su":"미국 정부는 8개월 간의 과잉 생산 조사 끝에 25일 14개 교역 상대국에 최대 20%의 관세를 부과하겠다고 제안했는데, 이는 인플레이션(물건값이 계속 오르는 것) 압력을 가중시키고 연준이 금리(돈을 빌릴 때 내는 이자 비율)를 더 인상하고 금리를 더 오랫동안 높은 수준으로 유지할 위험을 높일 수 있다. 시장에서는 일반적으로 연준이 금리를 12월에 한 포인트, 내년 1분기에는 적어도 한 포인트 더 인상할 것으로 예상하고 있습니다. 이날 공개된 베이지북에 따르면 연준 12개 관할권 중 8개 지역의 경제가 소폭 하락한 것으로 나타났다."},{"s":"AI 부채 위험이 급격히 증가합니다! 스페이스X 우주 데이터 센터 승인! 메모리칩은 차별화될까? | 20261127월스트리트에서 루자쭈이까지","so":"第一财经","tm":"11/27 19:22","c":1,"r":"cn","u":"https://m.yicai.com/video/103456830.html","p":1795774955,"a":1795785157,"t":"AI债务风险骤升！SpaceX太空数据中心获批！存储芯片将出现分化？丨20261127从华尔街到陆家嘴"},{"s":"State Street SPDR S&P500 ETF Trust(SPY)가 귀하의 투자 레이더에 포함되어야 합니까?","so":"Yahoo Finance","tm":"11/27 19:20","c":1,"r":"us","u":"https://finance.yahoo.com/markets/stocks/articles/state-street-spdr-p-500-102002352.html","p":1795774802,"a":1795780805,"t":"Should State Street SPDR S&P 500 ETF Trust (SPY) Be on Your Investing Radar?","su":"State Street SPDR S&P500(미국 큰 회사 500곳의 주가를 합쳐 만든 점수) ETF(여러 주식을 묶어 파는 상품) Trust(SPY)는 1993년 1월 29일에 출시되었으며, 미국 증시의 대형주 혼합 부문에 대한 폭넓은 노출을 제공하도록 설계된 수동적으로 관리되는 상장지수 펀드입니다. 이 펀드는 State Street Investment Management의 후원을 받습니다."},{"s":"두바이의 벤치마크 주가 지수는 은행과 부동산 주가 상승으로 전쟁 손실을 지웁니다.","so":"WSJ","tm":"11/27 19:16 터의 정보의 제공을 받고 있습니다. 닛케이 평균 주가의 저작권은 일본 경제 신문사에 귀속됩니다."},{"s":"미국 주식 전망 : 성장 고민이나 계약 정책에 기대","so":"株探","tm":"11/27 13:33","c":1,"r":"jp","u":"https://s.kabutan.jp/news/n202611270638/","p":1795754035,"a":1795780843,"t":"米国株見通し：伸び悩みか、引き締め政策に思惑","su":"미국 주식 전망 : 성장 고민이나 긴축 정책에 의지 미국 주식 선물 시장에서 S&P500(미국 큰 회사 500곳의 주가를 합쳐 만든 점수) 선물, 나스닥(미국 기술 회사들이 많이 모인 주식시장) 100 선물은 강 포함, 뉴욕 다우 선물은 517달러 높다. 장기 금리는 떨어지고 오늘날 미국 증시는 구매 선행이 될 것 같다. 전 영업일 NY 주식시장에서 주요 3지수는 마을. 다우는 한때 1000달러 초안에서 되돌려 164달러 높이인 50182달러로 연일 상승, S&P와 나스닥은 낮추어 폭축소도 연일 마이너스로 가라앉았다. 인공지능(AI) 개발의 불투명감으로부터 하이테크를 중심으로 한 판매가 선행해, 관련 섹터에 파급. 다만, 생활필수품 관련으로의 자금 시프트로 다우는 반발했다. 또 이날 주목받은 코어 PCE 가격지수는 전월 대비 평평해지며 긴축된 금융정책을 경계한 분위기는 일복했다."},{"s":"[월스트리트 원음] UBS 전략가: 전력 공급 부족으로 데이터센터 건설 차질 생길 수도","so":"财新数据","tm":"11/27 13:33","c":1,"r":"cn","u":"https://database.caixin.com/2026-11-27/102509213.html","p":1795753980,"a":1795762589,"t":"【华尔街原声】瑞银策略师：电力供应不足或拖累数据中心建设","su":"2027~2028년 데이터센터(컴퓨터 수만 대를 모아 둔 건물) 납품 기대치를 낮추고 합리적인 가치로 성장주(앞으로 크게 클 회사 주식) 매수를 권장"},{"s":"기술주는 변동성이 큰 거래 주간이 끝나면 다시 회복됩니다.","so":"Financial Times","tm":"11/27 13:31","c":1,"r":"world","u":"https://www.ft.com/content/fedc6392-ad25-43e4-9d9f-20216cbf331e?syn-25a6b1a6=1","p":1795753917,"a":1795762607,"t":"Tech stocks regain ground at end of volatile trading week"},{"s":"미국 증시 지배 시대는 끝났는가? 아시아 주식에서 AI 배당금을 받기 위해 00420A로 명명된 Zhimei: 대만, 일본 및 한국의 지도자들을 포장 | 주식 예금자는 ETF를 좋아합니다 | 주식 시장","so":"UDN","tm":"11/27 12:52","c":1,"r":"tw","u":"https://udn.com/news/story/123006/9905388","p":1795751532,"a":1795762601,"t":"美股獨強時代結束？知美點名00420A搶攻亞股AI紅利：打包台日韓龍頭| 存股族愛ETF | 股市","su":"글로벌 AI 물결은 기술 산업의 지형을 완전히 바꿔 놓았습니다. 과거 시장 투자는 주로 칩 설계와 단말기 브랜드를 마스터한 미국 기업에 집중됐으나 이제는 아시아 기술주에 자금이 쏟아지고 있다. 금융 유튜버 Zhimei는 \"미친 미국 주식에서 미친 아시아 주식으로\" 이러한 구조적 변화의 물결을 분석했습니다. 그는 과거 저마진 '월드 파운드리(남의 반도체를 대신 만들어 주는 공장)'라는 별명을 얻었던 아시아 기업들이 AI 시대가 도래하면서 없어서는 안 될 핵심 공급망(부품·재료가 오가는 연결망)으로 변모했다고 직설적으로 말했다. 오늘날 미국의 거대 기술 기업들은 전기와 컴퓨팅 성능을 구입하기 위해 많은 돈을 지출해야 하며, 이로 인해 최근 몇 년간 대만, 일본, 한국의 주가 상승률이 미국의 동종 기업보다 크게 높아졌습니다. Zhimei는 2020년에 막 석사 학위를 취득하고 기술 산업에 진출할 준비를 했던 시절을 되돌아봅니다. 시장에서는 일반적으로 미국의 IC 설계, 운영 체제 및 단말기 브랜드에 고부가가치 기업이 집중되어 있다고 믿었습니다. 신입생들이 취업을 위해 가장 먼저 선택한 곳은 대부분 IC 설계업체나 외국계 기업이었다. 하드웨어 OEM과 부품 제조를 담당하는 아시아 전자산업은 총이익이 낮아 지원 역할로 여겨지는 경우가 많았다. 그러나 2022년 ChatGPT가 등장한 이후 모든 AI 질문과 답변은 아시아 기업이 수십 년 동안 축적한 제조 강점에 걸맞는 엄청난 전력과 컴퓨팅 성능 지원에 의존해 왔습니다. 엔비디아 AI 서버를 예로 들어보겠습니다. IC 설계는 미국에서 왔지만 웨이퍼 파운드리는 대만에서 왔습니다."},{"s":"주식 상승으로 피난처에 대한 수요가 줄어들면서 국채가 후퇴합니다.","so":"Bloomberg.com","tm":"11/27 12:49","c":1,"r":"world","u":"https://www.bloomberg.com/news/articles/2026-11-27/treasuries-retreat-as-gains-in-equities-sap-demand-for-havens","p":1795751340,"a":1795762608,"t":"Treasuries Retreat as Gains in Equities Sap Demand for Havens"},{"s":"도이체방크는 기술주 매도가 끝날 것이라고 예측하고 S&P가 9,000포인트까지 상승할 것이라고 낙관했습니다.","so":"MoneyDJ","tm":"11/27 12:48","c":1,"r":"tw","u":"https://www.moneydj.com/kmdj/news/newsviewer.aspx?a=a505856b-f859-4aac-9cab-7e765162abfe","p":1795751280,"a":1795762603,"t":"德銀估科技股拋售潮近尾聲 看好標普上攻9000點","su":"도이체방크는 최근 기술주 하락세가 몇 주 안에 진정될 것으로 믿고 있다. 기업 이익이 증가하고 자금이 미국 주식으로 계속 유입됨에 따라 S&P500(미국 큰 회사 500곳의 주가를 합쳐 만든 점수) 지수는 2027년 말까지 9,000포인트에 도달할 것입니다. 마켓워치는 도이체방크의 미국 주식 수석이자 글로벌 전략가인 Chad가 ..."},{"s":"연준의 베이지북은 가격 압력의 범위가 확대되었음을 보여줍니다. 미국은 선도적인 칩 기업들의 경영 안정을 지지한다는 뜻을 표명했습니다. 서던자산운용 서던투자컨설팅은 해외정책과 산업거버넌스의 교차영향에 주목하고 있다.","so":"Jiemian.com","tm":"11/27 12:46","c":1,"r":"cn","u":"https://www.jiemian.com/article/15381750.html","p":1795751203,"a":1795762592,"t":"美联储褐皮书显示物价压力范围扩大，美国方面表态支持芯片龙头企业稳定管理层，南方基金司南投顾关注海外政策与产业治理的交叉影响","su":"서던펀드의 자회사(다른 회사가 주인인 회사)인 신안투자컨설팅은 해외 정책과 산업 거버넌스의 교차 영향력에 주목하고, 펀드(여러 사람 돈을 모아 전문가가 굴리는 것) 선택과 시장 간 다각화를 통해 투자자들이 단일 정책과 단일 이벤트에 대한 과다 노출을 줄일 수 있도록 돕습니다."},{"s":"미국 증시는 추수감사절 009813에 마감했지만 여전히 1% 이상 상승했습니다! 블랙 프라이데이 쇼핑 시즌이 시작되었으며 애플과 아마존이 선두를 달리고 있습니다 | 주식 예금자는 ETF를 좋아합니다 | 주식 시장","so":"UDN","tm":"11/27 12:22","c":1,"r":"tw","u":"https://udn.com/news/story/123006/9905338","p":1795749779,"a":1795762604,"t":"美股感恩節休市009813照樣漲逾1％！黑五購物季開跑打包蘋果、亞馬遜搶先走高| 存股族愛ETF | 股市","su":"뉴스 듣기 0:00 / 0:00 추수감사절을 맞아 미국 증시가 마감되었습니다. 009813 여전히 1% 이상 상승했습니다! 애플과 아마존이 주도하는 블랙프라이데이 쇼핑시즌 개막 어제(26일) 미국 증시는 추수감사절로 휴장하고 현물시장 실적 전망도 없었으나, 오늘(27일) 대만 증시에 미국 대형주 ETF(여러 주식을 묶어 파는 상품) 블랙록 S&P500(미국 큰 회사 500곳의 주가를 합쳐 만든 점수) 엑설런트 50(009813)이 상장했으나 장중 기세를 거스르며 강세를 보였다. 초기 거래에서 NT$10.79에 개장한 후 계속해서 상승했습니다. 장중 최고가는 NT$0.12(1.11%) 증가한 NT$10.93을 기록했으며 거래량은 2,800계약을 초과했습니다. 시장 분석가들은 이러한 추세가 주로 미국 주식 선물의 전자 거래 급증과 오늘 밤 자금이 사전 차단되면서 미국의 '블랙 프라이데이' 연말 소비 성수기를 반영한 것이라고 지적했습니다."},{"s":"AI 주식이 나쁜가? 월스트리트 예언자: AI 투자는 아직 살아있지만 \"절름발이\"입니다. 연말에도 턴어라운드 어려울 듯, 아직 변수는 크게 2가지 - 국제투데이","so":"工商時報","tm":"11/27 12:22","c":1,"r":"tw","u":"https://www.ctee.com.tw/news/20261127700749-430702","p":1795749720,"a":1795780827,"t":"AI股不妙？華爾街先知：AI交易還活著但「瘸了」 年底難V轉、仍有2大變數- 國際","su":"미국 증시는 지난 금요일의 공황 매도 이후 잠시 숨을 돌렸습니다. 25일 필라델피아 반도체(전자기기 속에서 계산하고 기억하는 작은 부품)지수는 다시 하락 마감했다. AI주에 대한 매도압력은 멈추지 않은 것으로 보인다. 이에 대해 '월스트리트 예언자'이자 강세론으로 유명한 야르데니 리서치(Yardeni Research)의 에드 야데니 사장은 미국 증시가 지난 금요일 급락 이후 바닥을 쳤을 수도 있지만 AI 트레이딩은 '절뚝거리는' 모습을 보여 연말 V자 반등을 보기 어렵다고 직설적으로 말했다. 게다가 인플레이션(물건값이 계속 오르는 것)이 여전히 높기 때문에 그는 연준이..."},{"s":"뱅크오브아메리카의 2027년 미국 주식에 대한 3가지 주요 시나리오가 공개되었습니다! S&P는 8,888포인트까지 급등해 '이 스크립트'가 최악의 경우 6,666포인트까지 떨어질 수 있다고 경고했다.","so":"自由財經","tm":"11/27 12:17","c":1,"r":"tw","u":"https://ec.ltn.com.tw/article/breakingnews/5654893","p":1795749477,"a":1795785168,"t":"美銀2027美股3大劇本出爐！標普最狂衝8888點 示警「這劇本」最慘恐下探6666點","su":"[금융채널/종합리포트] 2027년 미국 증시는 본격적인 버블을 향해 나아갈 것인가, 아니면 경착륙(경제가 갑자기 크게 나빠지는 것)을 맞이할 것인가? 뱅크오브아메리카의 수석 투자 전략가인 Hartnett는 세 가지 주요 시장 시나리오, 즉 S&P500(미국 큰 회사 500곳의 주가를 합쳐 만든 점수) 지수가 8,888포인트인 \"전체 시나리오\"를 제안했습니다."},{"s":"BofA \"내년에도 주식 공급 증가…美 증시 상승폭 제한될 것\" - 머니투데이","so":"머니투데이","tm":"11/27 12:09","c":1,"r":"kr","u":"https://www.mt.co.kr/world/2026/11/27/2026112711305519233","p":1795748955,"a":1795749509,"su":"뱅크 오브 아메리카의 미국 주식 전략 책임자인 사비타 수브라마니안은 최근 기본적인 시나리오에서 S&P500(미국 큰 회사 500곳의 주가를 합쳐 만든 점수)지수가 내년 말 7800까지 상승할 것으로 예상했다. 마켓워치에 따르면 주요 투자은행들의 내년 말 S&P500지수 목표치 평균은 8700이다."},{"s":"AI 관련 주식 하락은 크리스마스 선물 93,"t":"美股AI风向变了：软件>硬件？","su":"① 인공지능 붐 속에서 승자와 패자를 바라보는 시장의 시각이 급격하게 변화하면서, 올해 들어 반도체(전자기기 속에서 계산하고 기억하는 작은 부품)주와 소프트웨어주의 시장 성과는 '일방적'에서 '균등 일치'로 바뀌었다. ② 이러한 추세 변화는 투자자들의 높은 관심을 받을 만하다. 차이롄서, 11월 27일(샤오샹 편집장) 인공지능 붐 속에서 승자와 패자를 바라보는 시장의 시각이 급격하게 변화하면서 올해 들어 반도체주와 소프트웨어주의 시장 성과는 '일방적'에서 '균등 일치'로 바뀌었고, 이러한 추세 변화는 투자자들의 높은 관심을 받을 만하다. 이번 달 미국 기술 부문은 피바다를 겪었지만 소프트웨어 주식에 미치는 영향은 상대적으로 제한적이었습니다. 이번 매도는 주로 반도체주에 집중되어 있는데, 얼마 전까지만 해도 여전히 자본의 선호를 받았던 종목이었습니다."},{"s":"미국 증시는 마감되고 장단기 시소, 지수 선물 변동 - 증권","so":"工商時報","tm":"11/27 11:21","c":1,"r":"tw","u":"https://www.ctee.com.tw/news/20261127700636-430202","p":1795746060,"a":1795749523,"t":"美股休市多空拉鋸台指期震盪- 證券","su":"대만 지수 선물(미래 값을 미리 정해 사고파는 거래)은 27일에 고점을 시가하고 하락세로 등락했습니다. 장중 최고치는 39,577포인트를 기록했고 최저치는 39,050포인트까지 떨어졌습니다. 고점과 저점(가장 낮았던 값)의 차이가 500점 이상이었습니다. 대만지수선물은 51포인트 하락한 39,441포인트로 잠정 보고됐고, 거래 건수는 2.4건이었다. 20,000; 전자 기간은 5.75포인트 상승한 2,449포인트였습니다. 재정 기간은 27.4포인트 하락한 3,235포인트였습니다. 마이크로 대만 지수는 47포인트 하락해 일시적으로 39,445포인트를 기록했습니다. 단기 대만 지수는 51포인트 하락한 39를 기록했습니다."},{"s":"대행사: S&P500 지수는 2027년 말까지 10,000포인트까지 오를 가능성이 있으며, AI 지출 둔화에 대한 우려는 지나치다","so":"AAstocks","tm":"11/27 11:14","c":1,"r":"hk","u":"https://www.aastocks.com/tc/usq/news/comment.aspx?source=GLH&id=GLH2782343L&catg=1","p":1795745640,"a":1795749533,"t":"機構：標普500指數有機會在2027年底升至1萬點，AI支出放緩擔憂過度","su":"11월 27일 | Federated Hermes Global Equity의 최고 투자 책임자인 Steve Chiavarone은 S&P500(미국 큰 회사 500곳의 주가를 합쳐 만든 점수) 지수가 2027년 말까지 10,000포인트에 도달할 기회가 있다고 말했습니다."},{"s":"미국 증시 급락은 미·중 분리가 큰 해악을 끼칠 것이라는 점을 보여준다｜C씨의 견해","so":"TVB","tm":"11/27 11:10","c":1,"r":"hk","u":"https://news.tvb.com/tc/1208714-%E7%BE%8E%E8%82%A1%E5%A4%A7%E8%B7%8C%E9%A1%AF%E7%A4%BA%E7%BE%8E%E4%B8%AD%E5%88%87%E5%89%B2%E5%82%B7%E5%AE%B3%E5%A4%A7C%E8%A7%80%E9%BB%9E","p":1795745400,"a":1795749535,"t":"美股大跌 顯示美中切割傷害大｜C觀點","su":"젠슨 황의 이탈은 사람들이 예상했던 것보다 미국 증시에 더 큰 충격을 가져올 것입니다. 원래 많은 수익을 냈던 많은 투자자들이 결국 돈을 잃고 그 기쁨을 무산시켰습니다. 표면적으로 혼란은 젠슨 황이 엔비디아를 떠나면서 발생했습니다. 그러나 더 근본적인 이유는 미국 정치계의 반중세력이 중국을 완전히 단절해 중국의 급부상을 견제하겠다는 결의를 갖고 있기 때문이다. 트럼프는 비교적 실용주의자다."},{"s":"[모닝포스트] 10월 연준이 금리를 인상할 확률이 급격히 떨어졌다. 원유와 금 모두 상승했습니다. 마이크론 테크놀로지(마이크론)의 4분기 매출과 이익이 기대치를 초과했습니다.","so":"财联社","tm":"11/27 10:57","c":1,"r":"cn","u":"https://www.cls.cn/detail/2496760","p":1795744645,"a":1795785161,"t":"【早报】美联储10月加息概率，大幅回落；原油、黄金双双上涨；美光科技，Q4营收利润双超预期","su":"① 시진핑: 포용적·기초적·기본적 민생 건설 강화 ② 중앙은행(나라의 돈과 이자를 관리하는 은행): 10월 8일 3개월간 1조2000억 위안 규모의 매입 역환매 작업을 실시할 예정이다. ③ 미국 최대 기술주가 3% 이상 상승했고, 인텔은 3% 이상 상승했다. ④ 애플이 스마트 홈 시장에 진출할 계획이다. ⑤ 하이얼 스마트홈과 몽타주 테크놀로지가 환매 진행을 발표했다. 매크로 뉴스 1. 10월 1일 발행되는 '치시' 잡지 19호에는 시진핑 중공중앙 총서기, 국가주석, 중앙군사위원회 위원장이 쓴 '보편적, 기본적, 기본적 민생 건설 강화'라는 중요한 글이 게재될 예정입니다. 2012년 11월부터 2026년 1월까지 시진핑 총서기가 한 중요한 발언에서 발췌한 내용이다. 기사에서는 중국식 현대화는 민생을 최우선으로 생각한다는 점을 강조하고 있다. 더 나은 삶을 향한 국민의 열망이 우리의 목표입니다. 우리의 목표는 야심적이고 단순합니다. 결국 사람들이 더 나은 삶을 살 수 있도록 돕는 것입니다. 우리는 발전 과정에서 인민의 생활을 보장하고 개선하는 것을 견지해야 하며 더 나은 삶을 창조하기 위한 공동 노력을 장려하고 더 나은 삶에 대한 인민의 열망을 끊임없이 실현해야 합니다."},{"s":"메모리주 폭락, 전환점이 있을까? KIOXIA의 주가수익비율은 1.7배이며, 월스트리트의 18개 기업이 매수를 요구하고 있으며, 골드만삭스는 50% 할인을 추정하고 있습니다.","so":"工商時報","tm":"11/27 10:54","c":1,"r":"tw","u":"https://www.ctee.com.tw/news/20261127700558-430704","p":1795744440,"a":1795749525,"t":"記憶體股崩盤藏轉機？鎧俠本益比剩1.7倍 華爾街18家喊買、高盛估報酬衝5成","su":"일본의 주요 메모리(정보를 기억하는 반도체) 제조사인 키옥시아 주가가 최근 이달 들어 40% 이상 급락하는 등 급격한 조정을 겪었다. AI 투자 붐이 지속될 수 있을지에 대한 시장의 의구심이 메모리그룹에 대규모 매도세(팔려는 힘)를 불러일으켰다. 그러나 주가 폭락으로 인해 키옥시아의 가치는 니케이 225 지수 구성종목 중 가장 낮은 수준으로 떨어졌고, 예상치 못한 월스트리트 분석가들의 큰 관심을 끌었습니다. 블룸버그 보고서를 인용한 \"월가 Insights\"에 따르면, 월스트리트는 현재 Kioxia 18에 매수 등급을 부여하고 있습니다."},{"s":"금은 안정되었지만 $3,600 미만으로 유지되었습니다! 시장은 연준의 금리 인상을 기다리고 있으며, 전문가들은 바닥을 치기에는 너무 이르다고 우려한다.","so":"TVBS新聞","tm":"11/27 10:50","c":1,"r":"tw","u":"http://news.tvbs.com.tw/money/4056803","p":1795744200,"a":1795749526,"t":"黃金回穩仍低於3600美元！市場觀望Fed升息 專家憂觸底還早","su":"트레이더들이 연준(미국의 중앙은행)의 금리 인상(이자 비율을 올리는 것) 전망과 미국 기술주 반등에 따른 전반적인 시장 회복을 저울질하는 가운데 금 가격은 27일 안정세를 유지했다. 일부 전문가들은 연준이 금리 인상 주기를 곧 종료할 것이라는 점을 시장이 감지하지 않는 한 금이 지속적으로 반등하기 어려울 수 있다고 인정했습니다."},{"s":"\"3주간 9% 오른 S&P500랠리 지속 힘들다\"…'조정 경고음' 고조","so":"매일경제 마켓","tm":"11/27 10:43","c":1,"r":"kr","u":"https://stock.mk.co.kr/news/view/288374","p":1795743838,"a":1795780802,"su":"\"3주간 9% 오른 S&P500(미국 큰 회사 500곳의 주가를 합쳐 만든 점수)랠리 지속 힘들다\"…'조정 경고음' 고조 블룸버그 \"지표 약세…美 대형·중소형주(몸집이 작거나 중간인 회사의 주식) 상승세 이어가기 어렵다\"\"대형주는 경기둔화가, 중소형주는 부채 부담이 발목 잡을 것\" 주종국 입력 : 2023.11.20 09:54:06 (서울=연합뉴스) 주종국 기자 = 3주 만에 9% 넘게 상승한 미국 스탠더드 앤드 푸어스(S&P) 500지수가 앞으로도 상승세를 이어가기는 힘들 것이라는 전망이 나왔다."},{"s":"시판 전 전략 | 미국 주가지수 선물은 소폭 반등했지만, 홍콩증시 자본흐름은 여전히 약해 큰 반등을 기대하기는 어렵다.","so":"etnet 經濟通","tm":"11/27 10:15","c":1,"r":"hk","u":"https://www.etnet.com.hk/www/tc/news/news-article.php?section=features&category=focus&newsid=418360","p":1795742100,"a":1795749536,"t":"盤前攻略 | 美股指數期貨略見反彈，港股資金流仍弱難望大反彈","su":"2026년 11월 27일 09:15 사전 시판 전략 | 미국 주가지수 선물은 소폭 반등했지만 홍콩 주식자금 흐름은 여전히 약해 큰 반등을 기대하기는 어렵다. 미국은 목요일(26일)이 추수감사절 연휴로, 다음날 밤 미국 증시는 하루 동안 휴장한다. 미국 증시는 오늘 밤 블랙 프라이데이에 반나절 동안 개장합니다. 미국 증시는 다음날 밤 장을 마감했지만 며칠간 하락세를 보인 끝에 선물시장에서는 일정 규모의 자금이 바닥을 치는 모습을 보였다. 오늘 아침부터 미국 3대 주가지수 선물이 반등했습니다. 다우지수는 250포인트 오른 50,478에, 나스닥(미국 기술 회사들이 많이 모인 주식시장) 선물은 141포인트 오른 26,241에, S&P 선물은 47포인트 오른 7,243에 마감했습니다. (Shutterstock 사진) *홍콩 주식의 자본 유출 규모가 엄청나며 단기적인 반등은 여전히 어려울 것으로 예상됩니다. 22,000* 이전에 통합되기를 희망합니다. 어젯밤 항셍 지수는 현물 가격보다 110포인트 낮은 84포인트 하락한 22,117을 기록했습니다. 오늘 아침 미국 지수선물은 반등했고, 아시아 증시는 엇갈린 성과를 보였습니다. 일본 증시와 한국 증시는 상승 후 하락세를 보인 후 소폭 회복했습니다. 한국 증시는 0.5% 상승한 반면, 일본 증시는 0.1% 미만 상승하며 거의 보합세를 보였다. 홍콩 증시 실적(회사가 번 돈 성적표)에 대한 기대감을 반영하는 '암흑기' 싱가포르 HS50 지수는 현재 89포인트 하락한 22157을 기록하고 있다. 항셍지수는 개장시 약 100포인트 하락할 것으로 예상된다."},{"s":"젠슨 황. 01 오피니언｜한 사람의 체류가 미국 증시의 생사를 결정한다. 카니발이 많을수록 더 무섭습니다.","so":"香港01","tm":"11/27 10:00","c":1,"r":"hk","u":"https://www.hk01.com/article/60414478","p":1795741238,"a":1795749538,"t":"黃仁勳．01觀點｜一人去留定美股生死 愈是狂歡愈令人心驚","su":"미국 시간으로 11월 23일, 젠슨 황이 엔비디아의 수장 복귀를 발표하면서 며칠 동안 월스트리트를 뒤덮었던 어둠이 걷혔습니다. 엔비디아 주가는 33% 상승하며 장중(주식시장이 열려 있는 동안) 최대 상승폭이 36%를 넘으며 최종 마감됐다."},{"s":"S&P500 기업, 2022년 4분기 이후 최저 수익 서프라이즈 비율 보고","so":"FactSet Insight","tm":"11/27 09:45","c":1,"r":"us","u":"https://insight.factset.com/sp-500-companies-are-reporting-lowest-earnings-surprise-percentage-since-q4-2022","p":1795740346,"a":1795749512,"t":"S&P 500 Companies Are Reporting Lowest Earnings Surprise Percentage Since Q4 2022","su":"FactSet 정량 보고서를 통해 S&P500(미국 큰 회사 500곳의 주가를 합쳐 만든 점수) 수익 동향을 미리 파악해 보세요. 부문을 포함한 3분기 실적(회사가 번 돈 성적표)-서프라이즈 비율과 과거 비교를 살펴보세요."},{"s":"Japan Tobacco, 임페리얼 지분 인수 논의로 주가 급등","so":"Reuters","tm":"11/27 09:40","c":1,"r":"world","u":"https://www.reuters.com/markets/europe/japan-tobacco-up-2-imperial-brands-takeover-talk-2026-11-27/","p":1795740000,"a":1795780844,"t":"Japan Tobacco shares surge on talk it may acquire part of Imperial"},{"s":"미국증시 마감, 독일 DAX 2% 상승, 프랑스 CAC 40 1.6% 상승, 영국 FTSE 100 1.7% 상승 (08:19) - 20261127 - 실시간 금융뉴스","so":"明報財經網","tm":"11/27 09:24","c":1,"r":"hk","u":"https://finance.mingpao.com/fin/instantf/20261127/1795739037830/%E7%BE%8E%E8%82%A1%E4%BC%91%E5%B8%82-%E5%BE%B7%E5%9C%8Bdax%E5%8D%872-%E6%B3%95%E5%9C%8Bcac-40%E5%8D%871-6-%E8%8B%B1%E5%9C%8B%E5%AF%8C%E6%99%82100%E5%8D%871-7","p":1795739080,"a":1795749539,"t":"美股休市德國DAX升2% 法國CAC 40升1.6% 英國富時100升1.7% (08:19) - 20261127 - 即時財經新聞"},{"s":"트럼프는 다시 한번 젠슨 황에 대한 지지를 표명하고 미국 증시 하락이 우려된다고 인정했다.","so":"财联社","tm":"11/27 09:09","c":1,"r":"cn","u":"https://www.cls.cn/detail/2546152","p":1795738140,"a":1795749517,"t":"特朗普再次发声力挺黄仁勋 坦言一度对美股下跌感到担忧","su":"① 트럼프 미국 대통령은 목요일에 시장이 젠슨 황의 엔비디아 CEO(회사의 가장 높은 책임자) 복귀에 긍정적으로 반응했지만 수요일 오전 거래의 주식 시장 하락으로 인해 그를 \"다소 걱정\"하게 만들었다고 말했습니다. ② 그는 또한 젠슨 황의 '2기'가 그의 '1기'보다 더 나을 것이라며 다시 한 번 젠슨 황을 지지했고, 조만간 젠슨 황을 만날 수도 있다고 말했다. 차이롄서, 11월 27일(편집자 Bian Chun) 목요일, 트럼프 미국 대통령은 황 젠슨의 엔비디아 CEO 복귀에 시장이 긍정적인 반응을 보였지만 수요일 오전 거래에서 주식 시장이 하락하면서 그를 \"다소 걱정하게 만들었다\"고 말했습니다. 트럼프 대통령은 황과 엔비디아 기자들에게 \"시장은 이에 대해 매우 좋게 생각하고 있다\"고 말했다. \"어제 꽤 큰 손실을 보고 조금 걱정했지만, 장 마감이 되자 시장은 반등했습니다.\" 수요일, 기술주 중심의 나스닥(미국 기술 회사들이 많이 모인 주식시장)은 거래 첫 몇 시간 동안 4% 이상 하락한 후 대부분의 손실을 만회하고 약간 낮은 수준으로 마감했습니다."},{"s":"'국가 재정 헤드라인' 미국 주식 폐쇄, 사우디 정유소가 후티 군대의 공격을 받아 일부 운영이 중단되고 유가가 1% 이상 상승","so":"etnet 經濟通","tm":"11/27 09:08","c":1,"r":"hk","u":"https://www.etnet.com.hk/www/tc/news/categorized_news_detail.php?newsid=2026112710&category=push","p":1795738080,"a":1795749541,"t":"《國金頭條》美股休市，沙特煉油廠遭胡塞武裝襲擊致部分運營中斷，油價漲逾1%","su":"2026년 11월 27일 08:08 \"National Finance Headlines\" 미국 증시 마감: 사우디 정유소가 후티 군대의 공격을 받아 일부 운영이 중단되었습니다. 유가는 1% 넘게 올랐다. 미국 증시는 추수감사절 연휴로 인해 목요일(26일) 휴장했다. 예멘 후티 반군은 미국 연휴 기간 동안 홍해 연안에 있는 사우디아라비아 지잔 정유소를 공격해 일부 운영을 방해하고 중동 원유 수출 회복을 위협했습니다. 브렌트유(유럽 석유 값의 기준) 선물(미래 값을 미리 정해 사고파는 거래)은 1.94% 상승한 배럴당 96.44달러를 기록했습니다. 뉴욕 원유 선물은 1.54% 상승한 배럴당 84.97달러를 기록했습니다. 외환시장에서 달러화는 기본적으로 엔화 대비 보합세를 보이며 마지막으로 달러당 159.26엔에 거래되었습니다. 미국 달러 지수는 0.11% 상승한 103.78을 기록했습니다. 유로화는 달러 대비 $1.0972로 거의 변하지 않았습니다."},{"s":"간밤 미국 증시 휴장...\"저가 매수세 유입 기대\"","so":"YTN","tm":"11/27 09:00","c":1,"r":"kr","u":"https://www.ytn.co.kr/_ln/0102_202611270900495334","p":1795737600,"a":1795749509,"su":"증시 보겠습니다. 뉴욕 증시가 추수감사절로 휴장했지만선물 시장 분위기는 좋았습니다. 우리 증시는 오늘 어떨지 주목되는데요. 개장 상황 바로 보겠습니다. 조금 전 개장한 우리 시장. 이제 숫자가 곧 반영될 텐데요. 추수감사절로 휴장한 뉴욕증시, 하지만 선물(미래 값을 미리 정해 사고파는 거래)시장의 분위기는 나쁘지 않았습니다."},{"s":"블랙록: 시장에서는 연준이 향후 12개월 동안 금리를 세 번 인상할 것으로 예상하는데, 이는 너무 공격적인 것입니다. 단기 및 중기 미국 채권에 대해 낙관적입니다.","so":"AAstocks","tm":"11/27 09:00","c":1,"r":"hk","u":"https://www.aastocks.com/tc/usq/news/comment.aspx?source=GLH&id=GLH2781959L&catg=1","p":1795737600,"a":1795762607,"t":"貝萊德：市場預期未來12個月美聯儲累計加息三次過於激進 看好中短期美債","su":"게롱희 뉴스 추천 0 긍정 0 부정 0 공매도 주가 11월 27일 | 블랙록 싱크탱크는 성명을 통해 현재 시장이 연준의 12월 금리 인상 기대를 기본적으로 소화했지만, 시장은 연준이 향후 12개월 동안 총 3차례 금리를 인상할 수 있다고 가격을 책정하고 있다고 밝혔다. 은행은 이러한 기대가 너무 공격적이라고 생각합니다. 배분 수준에서는 2년물과 10년물 미국 국채 금리(나라가 돈 빌릴 때 내는 이자 비율)가 올해 수년래 최고치로 올랐고, 금리의 구조적 상승이라는 장기적 논리가 가격에 크게 반영됐다. 블랙록 싱크탱크는 상당한 쿠폰 수입을 보유하고 금리 상승에도 불구하고 더 강력한 방어 완충 장치를 갖춘 단기 및 중기 미국 채권에 대해 낙관적입니다. 동시에, 공급측면 인플레이션(물건값이 계속 오르는 것) 위험을 헤지하기 위해 인플레이션 연계 채권의 전략적 비중확대 범위를 더욱 늘립니다."},{"s":"미국 증시 마감, 유럽 주식 상승, 터키 중앙은행은 외환 보유고 부족 발표 | 인스턴트 뉴스 - 뉴스","so":"etnet 經濟通","tm":"11/27 08:55","c":1,"r":"hk","u":"https://www.etnet.com.hk/www/tc/news/news-article.php?section=categorized&category=daily&newsid=2026112700","p":1795737300,"a":1795780840,"t":"美股休市歐股上揚，土耳其央行宣布外匯儲備不足 | 即時新聞 - 新聞","su":"\"외부 초점\" 주요 유럽 및 미국 증시 지수 마감: (포인트) (포인트) (%) 다우 존스 산업 평균 50182.95---표준..."},{"s":"미국 증시 마감, TSMC 선물 상승, 대만 주식 천천히 상승 | 증권","so":"中央社 CNA","tm":"11/27 08:53","c":1,"r":"tw","u":"https://www.cna.com.tw/news/afe/202611270018.aspx","p":1795737180,"a":1795749528,"t":"美股休市台積電期貨上揚台股拚緩步墊高| 證券","su":"미국 증시는 추수감사절을 맞아 장을 마감했고, 대만 증시는 개장 이후 39,492포인트로 보합세로 마감했다. TSMC 선물(미래 값을 미리 정해 사고파는 거래)은 NT$9 상승했습니다. 미국 301조 조사 관세(수입품에 붙이는 세금)에 대한 시장의 우려가 완화됐다. 대만증시는 26일 956.38포인트 상승한 39,151.81포인트로 마감했다. 투자자문 분석에 따르면 법인의 조정력이 둔화되면서 대만증시는 범위통합에서 완만하게 상승하는 패턴으로 전환할 수 있는 기회를 갖게 됐다."},{"s":"아시아 주식 선물 신호 상승, 유가 다시 상승: 시장 요약","so":"Bloomberg","tm":"11/27 08:30","c":1,"r":"us","u":"https://www.bloomberg.com/news/articles/2026-11-26/asian-stock-futures-signal-gains-oil-climbs-again-markets-wrap","p":1795735815,"a":1795737857,"t":"Asian Stock Futures Signal Gains, Oil Climbs Again: Markets Wrap"},{"s":"\"미국 주식\" 마감 발표: 미국 증시는 추수감사절 연휴로 목요일에 마감하고 금요일 일찍 마감합니다 - 국제","so":"工商時報","tm":"11/27 08:29","c":1,"r":"tw","u":"https://www.ctee.com.tw/news/20261127700448-430701","p":1795735740,"a":1795749531,"t":"《美股》休市公告：感恩節假期美股周四休市周五提前收盤- 國際","su":"[더타임스 및 외신종합보도 커완시우 편집] 미국 증시는 추수감사절 연휴로 인해 동부 표준시 기준 11월 26일 목요일에 휴장하며, 11월 27일(블랙 프라이데이) 오후 1시(대만 시간 토요일 오전 2시) 조기 마감한다."},{"s":"인플레이션 경보음 울리고 연준의 '금리 인상' 악몽 현실이 될 수도","so":"21财经","tm":"11/27 08:00","c":1,"r":"cn","u":"https://www.21jingji.com/article/20261127/adeb88dd2c433e2d254d85883028492b.html","p":1795734000,"a":1795737862,"t":"通胀警铃大作，美联储“加息复加息”梦魇恐成真","su":"연준이 선호하는 인플레이션(물건값이 계속 오르는 것) 지수는 3년 만에 최고치를 기록했고, 2% 목표 달성을 향한 길은 예상보다 험난했습니다. 동부 표준시 기준 11월 25일 발표된 데이터에 따르면 10월 미국 핵심 PCE 물가지수의 전년 동기 대비 성장률은 3.1%에서 3.3%로 가속화되어 2023년 11월 이후 최고 수준에 도달했습니다. 이는 예상 3.2%보다 높았습니다. 전월 성장률은 0.3%로 변함이 없었다. 이를 반영해 이날 발표된 연준의 베이지북(Beige Book)에서는 11월 미국 전역의 물가압력 범위가 더욱 확대된 것으로 나타났다. 11월 첫 2주 동안 미국의 에너지, 운송, 의료, 보험 및 관세 관련 지출에 대한 \"비용 압박이 계속 존재\"했습니다. 원자재(물건의 재료(석유·구리 등)), 금속, 화물 및 특수 수입품도 기업 운영 비용을 증가시킵니다."},{"s":"유럽 증시는 전반적으로 상승세로 마감했고, 미국 증시 선물도 상승했습니다. 머스크는 매년 아이들에게 또 다른 스페이스X 지분을 주겠다고 말했습니다 | 글로벌 시장","so":"财联社","tm":"11/27 07:56","c":1,"r":"cn","u":"https://www.cls.cn/detail/2545971","p":1795733762,"a":1795780814,"t":"欧股全线收涨美股期货走高 马斯克称每年向儿童再赠一份SpaceX股 | 环球市场","su":"① 유럽의 주요 주가지수는 전반적으로 상승세로 마감했습니다. ② 트럼프는 정부가 의도적으로 GDP 성장을 과소보고했다고 비난했다. ③ SAP는 \"AI 우선\" 전략을 내걸고 최소 10,000명의 인력을 감축할 계획인 것으로 밝혀졌습니다. ④ Decos는 Lagarde로부터 유럽중앙은행(나라의 돈과 이자를 관리하는 은행)의 새로운 총재를 맡았습니다. 파이낸셜 뉴스, 11월 27일(리잉 편집장) 밤새 미국 증시가 추수감사절 연휴로 휴장했고, 유럽 주식시장이 전 세계의 이목을 집중시켰다. 기술주와 은행주 반등에 힘입어 유럽 주요 주가지수는 전반적으로 상승 마감하며 전날 하락세를 만회했습니다. 전 거래일 하락세를 주도했던 은행과 기술 업종이 반등의 주역이 됐다. 도이체방크는 2.56% 상승했고, 스탠다드 차타드 그룹은 1.32% 상승했습니다. 반도체(전자기기 속에서 계산하고 기억하는 작은 부품) 소재업체 소이텍은 6.94%, 독일 반도체 대기업 인피니언은 3.57% 상승했다."},{"s":"[미국 증시선물] 미국 증시는 추수감사절 연휴로 휴장합니다. 사우디 정유소가 공격을 받아 브렌트유 선물이 2.1% 상승했습니다(지속 업데이트).","so":"香港經濟日報HKET","tm":"11/27 07:33","c":1,"r":"hk","u":"https://inews.hket.com/article/4229385/%E3%80%90%E7%BE%8E%E8%82%A1%E6%9C%9F%E8%B2%A8%E3%80%91%E7%BE%8E%E5%9C%8B%E6%84%9F%E6%81%A9%E7%AF%80%E5%81%87%E6%9C%9F%E4%BC%91%E5%B8%82%E3%80%80%E6%B2%99%E7%89%B9%E7%85%89%E6%B2%B9%E5%BB%A0%E9%81%87%E8%A5%B2%E3%80%81%E5%B8%83%E8%98%AD%E7%89%B9%E6%9C%9F%E6%B2%B9%E5%8D%872.1-%EF%BC%88%E4%B8%8D%E6%96%B7%E6%9B%B4%E6%96%B0%EF%BC%89","p":1795732389,"a":1795733561,"t":"【美股期貨】美國感恩節假期休市 沙特煉油廠遇襲、布蘭特期油升2.1%（不斷更新）"},{"s":"미국 증시는 휴장 (아침 재료 체크)","so":"QUICK Money World","tm":"11/27 07:20","c":1,"r":"jp","u":"https://moneyworld.jp/news/detail?id=223805","p":1795731600,"a":1795749543,"t":"米国株は休場 (朝の材料チェック)","su":"11월 26일, 미국 시장은 추수 감사절 휴일 때문에 휴장이었다. 11월 27일은 단축 거래가 됩니다. ※본 기사는 생성 AI를 활용해, 당사 편집자가 내용을 확인·수정 후 게재하고 있습니다. 기사의 이용에 있어서는, 사이트 하부의 면책사항을 […]"},{"s":"월스트리트 레버리지 ETF에는 새로운 트릭이 있습니다. 레버리지 재설정 주기는 몇 시간 단위로만 측정됩니다.","so":"财联社","tm":"11/27 06:55","c":1,"r":"cn","u":"https://www.cls.cn/detail/2478652","p":1795730153,"a":1795780816,"t":"华尔街杠杆ETF又有新花样：杠杆重置周期仅以小时计","su":"① 디파이언스 ETF(여러 주식을 묶어 파는 상품)는 16개의 \"시간별 재설정\" 2x 레버리지 ETF(지수 움직임의 2~3배로 움직이는 ETF) 출시에 적용됩니다. 이 ETF는 스왑, 옵션 및 기타 도구를 통해 매일 거래일에 6회 레버리지를 재설정합니다. ② 잦은 재설정으로 인해 제품 반품이 일중 경로에 크게 의존하게 되고 변동적인 시장 상황으로 인해 심각한 마모가 발생할 수 있습니다. 동시에 미국 SEC는 레버리지 ETF에 대한 규제 검토를 강화하고 있습니다. 차이롄서, 9월 9일(Shi Zhengcheng 편집자) 미국 규제 당국이 레버리지 ETF를 검토하고 있는 것처럼 월스트리트도 다시 한번 금융 상품에 참여할 수 있는 능력을 보여주었습니다. 보도에 따르면 미국 ETF 발행사인 Defiance ETFs는 최근 미국 SEC에 등록 서류를 제출하고 \"시간별 재설정\" 2배 레버리지 ETF 출시를 신청했습니다."},{"s":"미국 채권수익률 급등! 월스트리트는 경고를 울린다: 9월 연준이 금리를 인상할 위험은 아직 제거되지 않았다","so":"财联社","tm":"11/27 06:53","c":1,"r":"cn","u":"https://www.cls.cn/detail/2456665","p":1795730031,"a":1795749518,"t":"美债收益率飙升！华尔街拉响警报：美联储9月加息风险并未解除","su":"① Castle Securities는 오랫동안 정책 목표를 초과한 미국 인플레이션(물건값이 계속 오르는 것) 상황에서 연준이 긴축 통화 정책을 꺼려 장기 미국 국채 금리(나라가 돈 빌릴 때 내는 이자 비율)를 수년 최고 수준으로 유지했다고 경고했습니다. ② 최근 인플레이션 개선과 고용시장 완화 등을 금리리스크가 해소됐다는 신호로 받아들여서는 안된다는 것이다. 다음 달 연준의 금리 회의 결과는 예측할 수 없다. 차이롄서, 8월 18일(편집자 Bian Chun) 최근 몇 달 동안 미국 국채 금리가 지속적으로 급등하여 광범위한 시장 우려를 불러일으켰습니다. 월스트리트의 최고 시장조성자인 시타델증권은 최근 미국의 인플레이션이 오랫동안 정책 목표를 초과하고 있는 상황에서 연준이 통화 긴축 정책을 꺼려 왔다고 경고했습니다. 이로 인해 미국 장기 채권 수익률이 수년간 최고 수준으로 유지되어 전체 시장에 더 광범위한 위험을 초래했습니다."},{"s":"월스트리트 베테랑은 AI 건설의 둔화는 실제로 좋은 것이며 전반적인 발전은 정치에 영향을 받지 않을 것이라고 강조합니다.","so":"财联社","tm":"11/27 06:10","c":1,"r":"cn","u":"https://www.cls.cn/detail/2526960","p":1795727404,"a":1795780818,"t":"华尔街老兵强调AI建设放缓实际上是利好 整体发展不会受政治影响","su":"① 목요일 미국 기술주는 민주당이 인공지능 구축을 제한할 것이라는 우려로 인해 급격한 매도세(팔려는 힘)를 보였습니다. ② Yardeni Research의 Ed Yardeni 사장은 인공 지능 구축의 둔화는 실제로 좋은 소식이라고 지적했습니다. 왜냐하면 데이터 센터 운영자가 확장을 늦추면 잉여 현금 흐름이 긍정적으로 바뀔 수 있기 때문입니다. 차이롄서, 11월 6일 (마란 편집자) 목요일, 민주당이 인공지능(AI) 구축을 제한할 것이라는 우려로 인해 미국 기술주들이 전체 시장의 신뢰를 흔들 정도로 급격한 매도세를 보였습니다. 그러나 Yardeni Research의 Ed Yardeni 사장은 인공 지능 구축의 둔화는 실제로 좋은 소식이라고 지적했습니다. 왜냐하면 하이퍼스케일 데이터 센터 운영자가 확장을 늦추면 잉여 현금 흐름이 더 이상 마이너스가 아니고 플러스로 바뀔 수도 있기 때문입니다."},{"s":"미국 증시 전망: 다우 존스가 월스트리트 반등을 주도하고 S&P500과 나스닥은 큰 저항에 직면","so":"The Economic Times","tm":"11/27 05:28","c":1,"r":"us","u":"https://m.economictimes.com/world/us/us-stock-market-forecast-dow-jones-leads-wall-street-rebound-while-sp-500-and-nasdaq-face-major-resistance-can-decembers-recovery-avoid-a-bull-trap/articleshow/136199117.cms","p":1795724898,"a":1795733494,"t":"US stock market forecast: Dow Jones leads Wall Street rebound, while S&P 500 and Nasdaq face major resista","su":"다우존스 S&P500(미국 큰 회사 500곳의 주가를 합쳐 만든 점수) 나스닥 예측:월스트리트의 반등은 입증되지 않았습니다. 다우존스가 회복세를 주도하고 있지만 50,339와 51,049 근방의 저항으로 인해 상승세(오르는 흐름)가 둔화될 수 있습니다. S&P500은 7,250 부근에서 시험대에 올랐고, 나스닥은 2025년 상승세를 깨고 여전히 압박을 받고 있습니다. 지난 주 최저치 이하로 떨어지면 매도 우려가 다시 살아날 것입니다. 다음 주 일자리와 ISM 보고서가 12월 거래에 영향을 미칠 수 있습니다."},{"s":"전 IMF 수석 이코노미스트: 워시가 9월 금리 인상의 문을 열면 연준은 엄청난 정치적 압력에 직면할 수 있습니다","so":"财联社","tm":"11/27 04:37","c":1,"r":"cn","u":"https://www.cls.cn/detail/2468655","p":1795721844,"a":1795785162,"t":"前IMF首席经济学家：沃什为9月加息打开大门 美联储或面临巨大政治压力","su":"① 워시의 잭슨 홀 연설은 매파적 신호를 강화했고, 9월 금리 인상에 대한 시장의 베팅은 35%에서 60%로 증가했습니다. ② Rogoff는 연준이 금리 인상을 선택하면 연준의 독립성을 더욱 시험하게 될 것이며 트럼프로부터 격렬한 비판을 받을 수 있다고 믿습니다. ③ 그는 또한 장기 미국 국채 금리에 여전히 상승 압력이 있을 것이라고 예상하고 자금 조달(사업에 쓸 돈을 모으는 것)을 단기로 전환하려는 Bessant의 부채 관리 전략에 의문을 제기했습니다. 차이롄서, 8월 30일(편집자 Xia Junxiong) 하버드 대학교 교수이자 전 국제통화기금(IMF) 수석 이코노미스트였던 켄 로고프는 금요일 잭슨 홀 회의에서 워시 연준 의장의 연설이 분명히 신호를 보냈다고 말했습니다. 인플레이션(물건값이 계속 오르는 것) 지표가 개선되지 않으면 그는 금리를 인상할 것입니다."},{"s":"연준, 베이지북 공개, 매파톤 더욱 높아져! 12월 금리 인상은 거의 기정사실","so":"經濟日報","tm":"11/27 04:03","c":1,"r":"tw","u":"https://money.udn.com/money/story/5599/9904619","p":1795719829,"a":1795733544,"t":"Fed 揭褐皮書 鷹調更高了！12月升息幾成定局","su":"25일 미 연방준비제도(연준(미국의 중앙은행))가 발표한 베이지북에 따르면 최근 몇 주 동안 12개 연준 관할권 중 8개 국가가 소폭 내지 중간 수준의 경제성장을 보였고 기업들의 임금 압박도 증가하는 것으로 나타나 연방준비제도(연준)가 12월 금리(돈을 빌릴 때 내는 이자 비율)를 인상할 것이 거의 확실시되는 것으로 나타났다."},{"s":"미국 증시는 폭락하고 '대규모 공매도' 물결이 일었다. 포지션을 롱 포지션으로 변경하고 엔비디아가 US$200에 가까워지는 것을 지켜본 후 매도 | 글로벌 금융 | 글로벌","so":"UDN","tm":"11/27 03:57","c":1,"r":"tw","u":"https://udn.com/news/story/6811/9904686?from=udn-relatednews_ch2","p":1795719470,"a":1795733549,"t":"美股崩一波「大賣空」本尊改做多盯輝達接近200美元再出手| 全球財經| 全球","su":"기술주는 이미 하락했다. 공매도(주식을 빌려서 먼저 파는 것)로 유명한 마이클 버리는 이제 공매도 주문을 줄이고 현재는 매수 포지션에 집중하고 있다. 그는 나스닥(미국 기술 회사들이 많이 모인 주식시장) 100 지수에 대한 풋옵션을 매도했지만 여전히 공매도 기회를 찾고 있으며 시장이 낙관적으로 변하고 엔비디아의 주가가 200달러에 도달할 때까지 기다렸다가 움직일 계획이라고 말했습니다."},{"s":"미국 증시, 연휴 전 반등, 비가 그칠 때까지 기다리지 마세요","so":"信報網站","tm":"11/27 03:38","c":1,"r":"hk","u":"https://www.hkej.com/dailynews/investment/article/4575537/%E7%BE%8E%E8%82%A1%E7%AF%80%E5%89%8DV%E5%BD%88+%E5%8B%BF%E7%95%B6%E9%9B%A8%E9%81%8E%E5%A4%A9%E9%9D%92","p":1795718294,"a":1795733565,"t":"美股節前V彈 勿當雨過天青","su":"추수감사절을 앞두고 미국 증시는 극적인 반전을 보였습니다. 나스닥은 수요일 세션 동안 거의 5% 급락했고 다우지수는 기껏해야 1,100포인트 이상 증발했으며 시장 심리는 거의 통제 불능 상태였습니다. 그러나 시장이 끝나갈 무렵 갑자기 매수세가 돌아왔습니다. 다우존스 산업평균지수는 0.3% 상승했고, 나스닥 종합지수 하락폭은 0.6%로 좁혀졌으며, S&P500(미국 큰 회사 500곳의 주가를 합쳐 만든 점수) 지수는 0.3% 하락에 그쳤습니다. 목요일 미국 증시는 추수감사절로 장을 마감했고, 항셍지수 역시 이 모멘텀을 살려 1% 이상 반등하며 22,226포인트로 마감했습니다. 같은 날 골드만삭스는 홍콩 주식에 대한 신용등급을 '비중확대(더 많이 사 두라는 의견)'로 상향 조정했다. 표면적으로 시장은 일시적으로 안도하는 것처럼 보였다. 저자는 이런 식으로 보는 것을 선호하지 않습니다. 주식 시장은 엉망이 될 수 있지만 신용 시장은 거짓말을 하는 경우가 거의 없습니다. 신용 거래"},{"s":"연준은 예상대로 보류를 유지했으며 회원 중 4분의 1이 반대표를 던졌습니다.","so":"财联社","tm":"11/27 03:29","c":1,"r":"cn","u":"https://www.cls.cn/detail/2440646","p":1795717794,"a":1795737863,"t":"美联储如预期按兵不动 1/4成员投下反对票","su":"① 연준은 전반적인 시장 기대에 맞춰 연방기금 금리 목표 범위를 3.5~3.75% 사이에서 유지하겠다고 밝혔다. 마지막 금리 인하(이자 비율을 낮추는 것)는 2025년 12월로 거슬러 올라갑니다. ② 이 결의안에는 3명의 반대표가 있었고, 3명은 긴축 정책에 대한 내부 지지가 높아지는 것을 반영하여 금리를 0.25%포인트(퍼센트끼리 뺀 차이) 인상하는 것을 선호했습니다. 차이롄서, 7월 30일(자오하오 편집자) 베이징 시간으로 목요일(7월 30일) 이른 아침, 연준은 전반적인 시장 기대에 맞춰 연방기금 금리 목표 범위를 3.5~3.75%로 유지할 것이라고 발표했습니다. 이번 결정은 연준이 아무런 조치도 취하지 않은 5번째 연속 결정이다. 마지막으로 금리를 인하한 때는 2025년 12월이었다. 결의안 발표 전 시장에서는 금리를 0.25%포인트 인상할 확률을 약 30%로 예상했다."},{"s":"이해할 수 있는 표! 월스트리트는 “완전히 확신”한다: 연준이 이번 주에 금리를 인상할 것이다","so":"财联社","tm":"11/27 03:23","c":1,"r":"cn","u":"https://www.cls.cn/detail/2481857","p":1795717424,"a":1795733512,"t":"一张表看懂！华尔街“彻底信了”：美联储本周加息","su":"① \"신연준 뉴스 서비스\"에 따르면, 이전에 9월 금리 인상(이자 비율을 올리는 것)을 예상하지 않았던 거의 모든 연준 관측자들은 8월 CPI 데이터가 예상보다 약간 높자 예측을 변경했습니다. ② 티미라오스가 집계한 20개 주요 투자은행 기관 중 무려 17개 기관이 현재 연준이 이번 달 금리를 인상할 것 .cn/detail/2518554","p":1795708769,"a":1795785164,"t":"美股收盘：三大指数小幅收涨 甲骨文现金流指引提振AI云计算股","su":"① 연준은 예정대로 기준금리를 동결했다. ②워시는 내년부터 금리 회의 조정을 발표했다. ③오라클의 현금 흐름 지침은 AI 지출에 대한 우려를 완화합니다. ④마이크로소프트와 구글 Cloud의 비즈니스 성과는 기대치를 뛰어 넘었습니다. 차이롄서, 10월 29일자(Li Ying 편집자) 수요일 동부 시간에 연준은 예정대로 금리를 동결했지만 12월 금리 인상(이자 비율을 올리는 것) 여부에 대해서는 명확한 신호를 보내지 않았습니다. 미국 증시는 결의안 발표와 워시 기자회견 동안 등락을 거듭하다 결국 소폭 상승세로 마감했다. 마감 기준 S&P500(미국 큰 회사 500곳의 주가를 합쳐 만든 점수) 지수는 0.28% 상승한 7743.98포인트를 기록했습니다. 나스닥 종합지수는 0.27% 상승한 26549.85 포인트를 기록했습니다. 다우존스 산업평균지수는 0.19% 상승한 52475.1포인트를 기록했습니다."},{"s":"국제 유가가 상승하고 미국 주식 선물과 유럽 주식이 대부분 상승했으며 비트코인은 60,000달러 이상 상승했습니다.","so":"21财经","tm":"11/27 00:42","c":1,"r":"cn","u":"http://www.21jingji.com/article/20261126/herald/b379317917cd401e99927e76ffe187fd.html","p":1795707771,"a":1795733515,"t":"国际油价拉升，美股期货、欧股多数上涨，比特币涨破6万美元","su":"11월 26일 저녁, 미국 주가지수 선물은 전반적으로 상승했습니다. 베이징 시간 23시 27분 현재 다우 선물은 0.62%, 나스닥 선물은 0.82%, S&P500(미국 큰 회사 500곳의 주가를 합쳐 만든 점수) 선물은 0.81% 상승했습니다. 유럽 증시는 전체적으로 급등했습니다. 미국 증시가 11월 26일(목) 하루 동안 휴장한다는 점에 주목할 필요가 있습니다. 11월 27일(금) 거래는 정상적으로 오픈되며, 오후 1시에 조기 마감됩니다. 동부 시간. 금과 은의 추세는 서로 달랐으며 현물 금은 온스당 3,574.32달러로 0.4% 하락했습니다. 현물 은은 0.82% 상승했습니다. 국제유가는 브렌트유(유럽 석유 값의 기준)와 미국산 원유 모두 1% 이상 오르는 등 상승세를 보였다. 비트코인은 거의 4% 상승해 $60,000를 넘어섰고, 이더리움은 2% 이상 상승하는 등 대부분의 인기 암호화폐가 상승했습니다."},{"s":"최대 649% 수익률: 2026년에 엄청난 수익을 올린 월스트리트 주식 10개","so":"The Economic Times","tm":"11/27 00:42","c":1,"r":"us","u":"https://m.economictimes.com/markets/us-stocks/wall-street-guide/up-to-649-returns-10-wall-street-stocks-that-have-delivered-staggering-gains-in-2026/articleshow/136197077.cms","p":1795707724,"a":1795733507,"t":"Up to 649% returns: 10 Wall Street stocks that have delivered staggering gains in 2026","su":"모더나 Inc.는 648.86%의 놀라운 수익률(넣은 돈에 비해 얻는 이익 비율)로 선두를 달리고 있으며 보고된 시가총액(회사 전체 몸값)은 894억 달러에 이릅니다. 이 의료 회사는 순위에 포함된 다른 모든 주식보다 훨씬 뛰어난 성과를 거두었습니다. 에라스카 주식회사"},{"s":"KODEX 미국S&P500ETF, 개인 누적 순매수 3兆 돌파","so":"조선일보","tm":"11/27 00:34","c":1,"r":"kr","u":"https://www.chosun.com/special/special_secti  if you’d invested £10,000 in the S&P 500 just 1 month ago…","su":"투자자들이 잠재적인 AI 버블(실제 값어치보다 너무 부푼 값)에 대해 불안해하면서 S&P500(미국 큰 회사 500곳의 주가를 합쳐 만든 점수)은 반전세를 보이고 있습니다. Harvey Jones는 자신을 더 유혹하는 FTSE 100 주식을 발견했습니다. 게시물은 불과 한 달 전에 S&P500에 £10,000를 투자했다면 오늘 얻게 될 결과입니다. The Twelfth Magpie에 처음 등장했습니다."},{"s":"UBS S&P500 ESG Elite UCITS ETF USD acc (AW1C.F) 계절별 수익률 차트","so":"Yahoo Finance UK","tm":"11/26 21:59","c":1,"r":"us","u":"https://uk.finance.yahoo.com/quote/AW1C.F/seasonality/","p":1795697989,"a":1795749514,"t":"UBS S&P 500 ESG Elite UCITS ETF USD acc (AW1C.F) Seasonal returns chart"},{"s":"ECB는 이미 10월 금리 인상을 크게 지지한 것으로 나타났습니다.","so":"Reuters","tm":"11/26 21:50","c":1,"r":"world","u":"https://www.reuters.com/markets/europe/ecb-already-had-large-support-rate-hike-oct-accounts-show-2026-11-26/","p":1795697456,"a":1795749544,"t":"ECB already had large support for rate hike in Oct, accounts show"},{"s":"\"연준 대변인\": 2주 안에 워시는 2018년에 자기 자신과 반대될 수도 있습니다","so":"财联社","tm":"11/26 21:18","c":1,"r":"cn","u":"https://www.cls.cn/detail/2545779","p":1795695514,"a":1795749518,"t":"“美联储传声筒”：两周后，沃什或将反对2018年的自己","su":"① 2018년에 워시는 미국 증시가 하락할 때 긴축을 중단하라고 연준에 요청했습니다. 이제 그가 경영권을 쥐고 있기 때문에 목표치를 계속 초과하는 인플레이션(물건값이 계속 오르는 것)으로 인해 브레이크를 밟는 것이 어려워지고 있습니다. ② Timilaus는 다음 달 연준(FRB)가 발표하는 전망에서 앞으로 더 많은 금리 인상(이자 비율을 올리는 것)이 있을 것임을 보여줄 수 있다고 예측합니다. 차이롄서, 11월 26일(편집자 Shi Zhengcheng) 최근 미국 증시의 급격한 변동에 직면한 케빈 워시 연준 의장은 2주 후 금리 회의에서 다소 극적인 질문에 직면할 수 있습니다. 2018년에 자신의 입장을 거스르게 해야 할까요? \"연준의 대변자\"로 알려진 Nick Timilaus 기자는 최신 보고서에서 최근 기술주 매각으로 인해 워시가 객관식 질문에 직면하게 되었다고 지적했습니다. 계속해서 금리를 인상하고 인플레이션 방지 약속을 이행해야 합니다. 또는 그가 오랫동안 옹호해 온 시장 신호에 귀를 기울이고 자산 가격 하락이 연준의 긴축 과제의 일부를 완료하도록 하십시오."},{"s":"이번에는 다른가요? Schroder Investments: 미국 증시 급락으로 인해 연준이 완화 정책으로 전환할 수 있지만 반등은 지속 가능하지 않을 수 있음","so":"财联社","tm":"11/26 21:13","c":1,"r":"cn","u":"https://www.cls.cn/detail/2545777","p":1795695180,"a":1795699335,"t":"这次不一样？施罗德投资：美联储或因美股暴跌转向宽松 但反弹恐难持续","su":"①Schroders 투자 경제학자들은 연준이 다시 시장 압력에 타협할 수도 있지만 이번에는 상황이 다르다고 말했습니다. ② 미국의 강력한 경제성장과 인플레이션(물건값이 계속 오르는 것) 압력이 높아지는 상황에서 연준이 완화 조치를 취하더라도 주식시장을 계속 부양하지 못할 수도 있습니다. 차이롄서, 11월 26일자(편집자 Niu Zhanlin) 최근 AI 투자의 냉각으로 인해 글로벌 금융 시장에 충격이 가해졌습니다. 나스닥 100 지수와 S&P500(미국 큰 회사 500곳의 주가를 합쳐 만든 점수) 지수가 기술적 조정 범위에 진입해 이전 고점 대비 10% 이상 하락했습니다. 아시아 태평양 및 기타 시장도 영향을 받았습니다. 슈로더 투자 이코노미스트 데이비드 리스(David Rees)는 수요일에 최근 시장 매도세로 인해 연준이 정책 입장을 조정하게 될 수도 있다는 기사를 썼습니다. 그러나 과거와 달라진 점은 미국 경제의 강한 성장과 인플레이션 압력이 높아지는 상황에서 연준이 양적완화로 전환하더라도 증시를 계속 부양하지 못할 수도 있다는 점이다. 대신 인플레이션과 통화정책에 대한 시장의 우려가 다시 불붙을 수 있습니다."},{"s":"도이체방크: 기술주 매도세가 바닥을 칠 수도 있습니다. S&P500은 내년에 25% 더 상승해 9,000포인트까지 오를 것으로 예상되며, 연준은 금리를 세 번 인상할 수도 있습니다.","so":"36Kr","tm":"11/26 21:01","c":1,"r":"cn","u":"https://m.36kr.com/p/4087451115075976","p":1795694460,"a":1795762594,"t":"德银：科技股抛售或将见底，预计明年标普500再涨25%至9000点，美联储或再加息三次"},{"s":"워렌 버핏은 저축자들에게 \"시장이 하락할 때 기뻐하라\"고 말했습니다. 2000~2002년 약세장 이후 S&P500은 5년 만에 두 배로 올랐습니다.","so":"Yahoo Finance","tm":"11/26 20:49","c":1,"r":"us","u":"https://finance.yahoo.com/markets/stocks/articles/warren-buffett-told-savers-rejoice-114902826.html","p":1795693742,"a":1795699332,"t":"Warren Buffett Told Savers to \"Rejoice When Markets Decline.\" After the 2000-2002 Bear Market, the S&P 500 Doubled in 5 Years.","su":"시간이 충분하다면 주식시장의 손실 회복 실적(회사가 번 돈 성적표)은 여전히 완벽하다."},{"s":"트럼프 대통령이 좋지 않은 시기에 나쁜 소식으로 주식시장 투자자들을 강타했다","so":"The Globe and Mail","tm":"11/26 20:14","c":1,"r":"us","u":"https://www.theglobeandmail.com/investing/markets/markets-news/Motley%20Fool/9016543/president-trump-just-hit-stock-market-investors-with-bad-news-at-a-bad-time/","p":1795691691,"a":1795749514,"t":"President Trump Just Hit Stock Market Investors With Bad News at a Bad Time","su":"요점 - 트럼프 대통령은 주식 시장이 이미 압박을 받고 있는 상황에서 14개 주요 무역 파트너를 대상으로 새로운 관세(수입품에 붙이는 세금)를 제안했습니다. - 경제학자들은 관세가 인플레이션(물건값이 계속 오르는 것)에 의미 있는 기여를 하고, 심지어 국내 생산 상품의 가격도 인상시킨다는 사실을 발견했습니다."},{"s":"대행사 : 연준의 금리 인하는 미국 주식을 구할 수 없습니다","so":"AA Stock","tm":"11/26 20:09","c":1,"r":"hk","u":"https://www.aastocks.com/tc/usq/news/comment.aspx?source=GLH&id=GLH2781391L 디오 프로그램에서 대만 지수 선물(미래 값을 미리 정해 사고파는 거래)이 어제 밤새 거래에서 2,000포인트 하락했다가 오늘 상승하여 시가를 더 높게 이끌었다고 솔직하게 말했습니다. 주된 이유는 추수감사절 연휴를 앞두고 미국 증시에서 '숏 커버링' 매수 주문이 있었던 것뿐이며, 대만 주식시장은 현재 대선을 앞두고 정부의 적극적인 시장 보호 단계에 있으며, 헤아릴 수 없는 반등으로 외국인 투자자들이 상황을 이용해 주식을 매도할 수 있게 됐다. 그는 27일이 선거 전 마지막 거래일이자 투자자들이 탈출할 수 있는 마지막 기회이기도 한다고 경고했다. 선거가 끝나면 12월에는 나쁜 소식이 뒤따를 것이고, 시장은 하락세를 가속화하여 이전 최저치인 35,542포인트 아래로 떨어질 수도 있습니다."},{"s":"오늘 미국 주식과 미국 채권은 마감되었으며, 금, 은, 원유 선물 거래도 조기 종료되었습니다.","so":"AA Stock","tm":"11/26 16:25","c":1,"r":"hk","u":"https://www.aastocks.com/tc/stocks/news/glh-news/GLH2780882L/1","p":1795677900,"a":1795733574,"t":"美股美債今日休市 金銀油期貨交易提前結束","su":"11월 26일 | 미국 추수감사절 연휴(11월 26일) 영향으로 미국 주식 및 채권(나라나 회사에 돈 빌려준 증서)시장이 오늘 하루 동안 휴장합니다. CME 그룹의 귀금속 및 미국 원유 선물 계약 거래는 베이징 시간으로 27일 오전 3시 30분에 사전 종료되며, 미국 주가 지수 및 미국 채권 선물 계약 거래는 베이징 시간으로 앞서 27일 오전 2시에 종료됩니다. 대륙간거래소(ICE)의 브렌트유(유럽 석유 값의 기준) 선물계약 거래가 베이징 시간으로 27일 오전 2시 30분에 사전 종료됩니다. 투자자들은 관련 위험에 주의를 기울이는 것이 좋습니다."},{"s":"[뉴욕증시 전략] 10월 근원 PCE 3.3%…2023년 이후 최고","so":"SBS Biz","tm":"11/26 16:04","c":1,"r":"kr","u":"https://biz.sbs.co.kr/article/20000349133","p":1795676640,"a":1795733488,"su":"오늘 경제 안녕하십니까? '뉴욕증시 전략' - 안자은뉴욕증시 하루 동안 천당과 지옥을 오갔습니다.나스닥(미국 기술 회사들이 많이 모인 주식시장)은 장중 4% 넘게 빠지기도 했죠.다만 분위기는 오후 들어 바뀌었습니다.연휴를 앞두고 거래량(하루 동안 사고판 주식 수)이 적은 가운데, 저가매수가 들어왔고요.마이클 버리가 포지션을 바꾼 점도 힘…"},{"s":"연준 Beige Book: 미국 소비는 거의 변동이 없으며 데이터 센터는 칩 배송 시간을 연장합니다.","so":"鉅亨網","tm":"11/26 15:00","c":1,"r":"tw","u":"https://news.cnyes.com/news/id/6672727","p":1795672815,"a":1795699346,"t":"聯準會褐皮書：美國消費近乎持平資料中心拉長晶片交期","su":"연준(미국의 중앙은행) Beige Book: 미국 소비는 거의 정체 상태이고, 데이터 센터는 칩 배송 시간을 연장하고 있습니다. Uanalyze 2026년 11월 26일(Uanalyze/Industrial Data Center 보고서) ⸺ 연방준비제도(연준)는 25일 11월 베이지북을 발표했는데, 12개 지역 중 8개 지역에서 경제 성장이 보고되었는데 이는 이전 기간에 9 미만이었고 나머지 4개 지역은 대략 동일했습니다. 미국 전역의 소비자 지출은 크게 변하지 않았으며, 가계는 여전히 가격에 민감합니다. 대조적으로, 데이터 센터 건설은 일부 지역에서 제조 수요를 주도했습니다. 클리블랜드 지역 고객들은 칩 및 전기 부품의 배송 시간 연장으로 인해 미리 주문을 해왔습니다. 베이지북은 11월 16일 이전에 수집된 정보를 바탕으로 작성됐다. 전체 제조업 부문은 소폭 성장했는데, 일부 산업 부문의 강한 수요가 소비재와 주택 관련 제품의 약세를 상쇄했다. 리치몬드 연방준비제도(Richmond 연준) 관할 항구의 전체 화물량은 소폭 감소했지만, 데이터센터(컴퓨터 수만 대를 모아 둔 건물) 건설에 필요한 전기 장비, 컴퓨터 하드웨어, 특수 자재 수입은 올해 9% 증가해 지역 전체 수입에서 작은 비중을 차지했다."},{"s":"\"미국 주식\" 분석: AI에 대한 투자 수익에 대한 우려가 커지고 있으며 시장은 투자자 신뢰를 반복적으로 테스트했습니다.","so":"旺得富理財網","tm":"11/26 11:52","c":1,"r":"tw","u":"https://wantrich.chinatimes.com/news/20261126900137-420201","p":1795661575,"a":1795699347,"t":"《美股》分析：AI投資報酬率疑慮升溫市場反覆考驗投資人信心- 國際","su":"[타임즈 장차오친 외신종합보도] 미국 증시 분석: ●미국 증시는 새로운 관세 제안의 영향으로 수요일 개장 후 급락세를 보였지만 점차 하락세를 수렴하며 혼조세(오르는 것과 내리는 것이 섞인 모습)로 마감했다. 다우존스 지수는 1,100포인트 하락을 반전하고 소폭 상승세(오르는 흐름)로 마감했습니다. 기타주가지수는 1% 미만 하락했다. ..."},{"s":"'이동주' 알리바바 4% 이상 상승, 텐센트 3% 상승, 미국 증시는 연휴 전 약세를 보이다 안정세를 보였으며 홍콩 증시는 반등했다.","so":"etnet 經濟通","tm":"11/26 11:50","c":1,"r":"hk","u":"https://www.etnet.com.hk/mobile/tc/news/categorized_news_detail.php?newsid=20261126321","p":1795661400,"a":1795699349,"t":"《異動股》阿里升逾4%騰訊升3%，美股節前偏軟後回穩港股見反彈","su":"2026년 11월 26일 10:50 \"특징주\" 알리바바는 4% 이상 상승했고, 텐센트는 3% 상승했습니다. 미국 증시는 연휴 전에 약세를 보인 후 안정세를 보였습니다. 홍콩 증시는 반등했습니다. 알리바바(09988)는 4.4% 상승한 84.8위안을 기록했다. 텐센트(00700)는 3.1% 오른 347.8위안을 기록했다. 다른 기술주와 인터넷 주식도 좋은 성과를 냈습니다. 샤오미(01810)는 2.9% 상승한 27.34위안을 기록했다. 징둥닷컴(09618)은 2.2% 상승한 102.5위안을 기록했습니다. 콰이쇼우(01024)는 4.1% 상승했다. 목요일은 미국의 추수감사절로, 미국 증시는 하루 종일 휴장합니다. 금요일(27일) 시장은 정상 오픈되나, 3시간 일찍 마감, 즉 오후 1시에 거래가 종료됩니다. 금요일 동부 표준시(홍콩 시간 토요일 오전 2시). 미국 증시는 먼저 하락했다가 수요일(25일) 안정세를 보였다. 다우존스 산업평균지수는 장중 한때 1,100포인트 이상 급락한 뒤, 낮은 수준의 매수세(사려는 힘)에 힘입어 하락폭을 만회해 결국 164포인트 상승했습니다. S&P500(미국 큰 회사 500곳의 주가를 합쳐 만든 점수) 지수와 나스닥 종합지수는 여전히 하락세를 보였지만 손실액 대부분을 회복했습니다."},{"s":"미국 증시는 혼조세","so":"第一财经","tm":"11/26 11:14","c":1,"r":"cn","u":"https://www.yicai.com/news/103454491.html","p":1795659246,"a":1795733523,"t":"美股涨跌互现","su":"제일재경 2026-11-26 05:10:48 편집자: 판즈징 다우지수는 0.33% 상승했고, S&P500(미국 큰 회사 500곳의 주가를 합쳐 만든 점수) 지수는 0.25% 하락했으며, 나스닥(미국 기술 회사들이 많이 모인 주식시장) 지수는 0.62% 하락했습니다. Lam Group은 5.71% 하락했고 샌디스크는 5.57% 하락했으며 HP는 11.44% 상승, Charter Communications는 8.39% 상승, Axon Enterprise는 7.43% 상승했습니다. '세븐 시스터즈' 기준으로는 메타플랫폼이 3.39%, 애플이 0.37%, 테슬라가 1.18%, 마이크로소프트가 1.26%, 구글이 2.13%, 아마존이 3.14%, 엔비디아가 4.00% 하락했다."},{"s":"미국 증시는 변동했습니다. 홍콩 주식은 초반 300포인트 이상 반등했고, 리오토는 손실을 줄이고 10% 이상 상승했다.","so":"AA Stock","tm":"11/26 10:43","c":1,"r":"hk","u":"https://www.aastocks.com/tc/stocks/news/aafn-con/IC5045859/positive-news/INFOCAST","p":1795657380,"a":1795733578,"t":"美股波動 港股早段曾彈逾300點、理想汽車減虧升逾一成","su":"희희강뉴스 추천 25 긍정적 51 나쁨 11 공매도(주식을 빌려서 먼저 파는 것) 주가 <희희강뉴스> 미국 증시는 먼저 하락했다가 밤새 상승하는 등락을 거듭했습니다. 오늘 오전 7거래일 연속 1,787포인트 하락한 홍콩 증시는 목요일 긍정적인 출발을 보였습니다. 268.88포인트로 상승한 후 상승 폭은 300포인트 이상으로 더욱 확대되어 현재 343포인트 상승한 22,309포인트를 기록하고 있습니다. S&T지수는 1.85% 상승한 3,440포인트를 기록했고, S주지수는 1.64% 상승한 7,503포인트를 기록했습니다. AI 주가 전반적으로 반등(내렸다가 다시 오르는 것), ATM 반등, 알리바바(09988)가 2.59% 반등, 메이투안(03690)이 4.48% 반등, 샤오미그룹(01810)이 2.79% 상승했다. 즈푸AI(02513)는 8.561% 반등했고, Lenovo Group(00992)은 3.206% 반등했습니다."},{"s":"연준의 베이지북은 복잡한 신호를 내놓는다: 인플레이션은 줄이기 어렵고, 소비는 차별화되고, AI 투자는 여전히 뜨겁다","so":"财联社","tm":"11/26 09:53","c":1,"r":"cn","u":"https://www.cls.cn/detail/2472527","p":1795654388,"a":1795733527,"t":"美联储褐皮书释放复杂信号：通胀难降、消费分化，AI投资仍火热","su":"① 연준이 발표한 최신 베이지북은 미국 경제가 여전히 완만하게 확장되고 있고 고용이 크게 정체되지 않았지만 인플레이션(물건값이 계속 오르는 것)의 경직성이 아직 가라앉지 않았음을 보여줍니다. ② 고급 소비가 여전히 강세를 보이고, 할인과 비용 효율적인 제품을 찾는 소비자가 늘어나는 등 소비자 측면의 차별화가 더욱 심화되었습니다. ③ 동시에 AI 데이터센터(컴퓨터 수만 대를 모아 둔 건물)는 제조업과 비주거용 건설 분야의 중요한 성장 원천이 되었습니다. 차이롄서, 9월 3일(편집자 Shi Zhengcheng) 베이징 시간 목요일 오전 이른 시간, 연준이 발표한 8월 경제 상황 보고서 '베이지북'에서는 미국 경제가 여전히 완만하게 확장되고 있지만 성장이 AI 데이터 센터와 같은 일부 프로젝트에 점점 더 의존하고 있음을 보여주었습니다. 동시에 물가상승 압력은 여전히 완고하고, 주민에 대한 압박은 점차 누적되고 있으며, 소비의 'K형 차별화'가 점점 더 중요해지고 있습니다."},{"s":"\"아침해석\" 미국 증시 하락세가 수렴되고 대만 증시는 바닥을 치고 안정 - OTC 주식 시장 상장","so":"旺得富理財網","tm":"11/26 09:46","c":1,"r":"tw","u":"https://wantrich.chinatimes.com/news/20261126900086-420101","p":1795654005,"a":1795737867,"t":"《晨間解盤》美股跌幅收斂台股築底回穩- 上市櫃","su":"[Times-Taipei] 연준의 베이지북이 회복력을 보였고 미국 증시는 하락세를 줄였으며 대만 지수 선물은 추세를 거스르고 익일 거래에서 상승 마감하여 대만 주식이 바닥을 치고 안정되는 데 도움이 되었습니다. 미국의 인플레이션(물건값이 계속 오르는 것)과 관세에 대한 우려가 높아지면서 나스닥(미국 기술 회사들이 많이 모인 주식시장) B2FDA%E6%89%B9%E5%87%86%E3%80%80%E5%95%9F%E5%8B%95%E7%BE%8E%E9%A6%96%E5%80%8B%E6%A4%8D%E5%85%A5%E5%BC%8F%E8%85%A6%E6%A9%9F%E4%BB%8B%E9%9D%A2%E9%97%9C%E9%8D%B5%E7%A0%94%E7%A9%B6?mtc=20040","p":1795684230,"a":1795694289,"t":"醫療科技｜Neuralink獲FDA批准 啟動美首個植入式腦機介面關鍵研究"},{"s":"Neuralink, 뇌 임플란트에 대한 중요한 ALS 시험에 대해 FDA 승인 획득","so":"Startup Fortune","tm":"11/26 17:25","c":2,"r":"us","u":"https://startupfortune.com/neuralink-wins-fda-approval-for-a-pivotal-als-trial-of-its-brain-implant/","p":1795681521,"a":1795694278,"t":"Neuralink Wins FDA Approval for a Pivotal ALS Trial of Its Brain Implant","su":"가까운 사람이 ALS를 앓고 있는 경우, 이 임플란트가 판매하기에 충분한지 알아보기 위한 미국 연구가 현재 진행 중입니다. 여기에 참여하는 것은 완성된 제품을 얻는 것과 같지 않으며 답변을 받는 데 몇 년이 걸릴 것입니다."},{"s":"초기 거래에서 조정된 혁신적인 약물 개념","so":"第一财经","tm":"11/26 10:49","c":2,"r":"cn","u":"https://www.yicai.com/brief/103454869.html","p":1795657740,"a":1795662990,"t":"创新药概念早盘调整","su":"2026/11/26 09:49 [초기 거래 혁신신약(세상에 처음 나온 새로운 약) 개념 조정] 니어쇼어 단백질이 10% 이상 하락했고, 완방제약, 시야오징펑, 계림산진, 라이메이제약, 포인세티아도 5% 이상 하락했다."},{"s":"Balaji Amines, 제약 산업용 프로필렌 글리콜 제조에 대한 FDA 승인 획득","so":"CNBC TV18","tm":"11/27 21:58","c":1,"r":"sg","u":"https://www.cnbctv18.com/market/stocks/balaji-amines-share-price-gets-fda-approval-to-manufacture-propylene-glycol-for-pharma-industry-20043254.htm","p":1795784286,"a":1795785182,"t":"Balaji Amines gets FDA approval to manufacture Propylene Glycol for pharma industry","su":"이 허가는 2031년 11월 26일까지 유효하며 Schedule C, C(1) 및 X에 명시된 것 이외의 약물의 제조, 판매 또는 유통에 대한 양식 25를 다룹니다."},{"s":"노바티스: 류마티스성 다발근통 치료용으로 미국 FDA 승인을 받은 Cosentyx®","so":"Jiemian.com","tm":"11/27 19:17","c":1,"r":"cn","u":"https://m.jiemian.com/article/15384702.html","p":1795774668,"a":1795785180,"t":"诺华：可善挺®获美国FDA批准用于治疗风湿性多肌痛","su":"노바티스는 최근 미국 식품의약국(FDA(미국에서 약을 허가해 주는 정부 기관))이 글루코코르티코이드에 대한 반응이 부적절하거나 글루코코르티코이드 감소를 견딜 수 없는 성인 류마티스성 다발근통증(PMR) 환자의 치료제로 코센틱스(세쿠키누맙) 150mg을 승인했다고 발표했다. 이는 FDA가 PMR에 대해 승인한 최초이자 현재 유일한 인터루킨-17(IL-17) 억제제이다. 제몐뉴스는 독립적으로 생각하는 사람들에게만 서비스를 제공합니다. 광고 등 상업적 협력을 원하시면 여기를 클릭하세요"},{"s":"1세대 스타 혁신신약 PD-1, 새로운 경쟁시대 돌입","so":"Jiemian.com","tm":"11/27 19:13","c":1,"r":"cn","u":"https://www.jiemian.com/article/15383801.html","p":1795774432,"a":1795780853,"t":"初代明星创新药PD-1进入竞争新时代","su":"지몐 뉴스 기자 | Jiemian 뉴스 편집자 | Xie Xin 종양학 분야에서 로슈의 오래된 '트로이카'인 베바시주맙, 리툭시맙, 트라스투주맙과 '글로벌 약물왕' 아달리무맙 및 기타 블록버스터 약물 세대에 이어 종양 면역치료제의 랜드마크 약물인 PD-1 단클론 항체가 바이오시밀러(특허 끝난 바이오 약의 복제약) 경쟁 시대에 돌입하고 있습니다. 홍콩 상장사인 보안바이오텍은 11월 26일 시장이 마감된 후 니볼루맙 바이오시밀러 BA1104에 대한 시판신청이 국가식품의약국으로부터 승인을 받았으며 비소세포폐암, 대장암, 위암 등 다양한 종양 치료에 사용될 예정이라고 밝혔다. 회사는 이것이 중국에서 마케팅 신청서를 제출한 최초의 니볼루맙 바이오시밀러라고 말했다. 지미안뉴스는 지난 11월 27일 보안바이오텍 공식 홈페이지에 전화해 회사 IR 이메일로 인터뷰 질문을 보내 BA1104 승인 이후 회사의 상용화(실제로 팔고 쓰이기 시작하는 것) 계획과 기대, 해외 바이오시밀러 시장에 대한 판단 등에 대해 물었다. 보도 당시 현재까지 답변은 없었다."},{"s":"미국 FDA가 차단한 신약! 한강KY는 제한적 삼키고 회장은 시장 지키기 위해 3천만 달러 지출","so":"TVBS新聞","tm":"11/27 12:00","c":1,"r":"tw","u":"https://news.tvbs.com.tw/money/4056853","p":1795748400,"a":1795749563,"t":"新藥遭美FDA喊卡！漢康-KY苦吞跌停 董座砸3千萬護盤","su":"생명공학주 한강KY(7827)가 하락 제한! 자체 개발 신약 'HCB301'이 미국 FDA(미국에서 약을 허가해 주는 정부 기관)로부터 '완전 임상 보류' 시행 통지를 받아 주가가 며칠째 급락했다. 오늘(24일) 거래장에서 다시 한도 하락을 기록했습니다. 주가는 급락하여 NT$67.3에 고정되었으며, 거래량(하루 동안 사고판 주식 수)은 약 600건이었으며, 여전히 매도 주문이 160건 이상 있었습니다. 주가의 급격한 변동에 직면한 Liu Shigao 회장은 회사에 대한 자신감을 보여주었습니다. 지난 며칠 동안 그는 보유 자산을 늘리기 위해 자신의 자금 중 NT$3000만를 시장에 투자했습니다."},{"s":"항셍 Biotechnology ETF 펑화(159130)의 기본 지수는 모두 2.8% 이상 상승했으며 허치메드의 Vorissa 및 Osimertinib 상장 신청이 승인되었습니다 | 인터페이스 뉴스","so":"Jiemian.com","tm":"11/27 11:32","c":1,"r":"cn","u":"https://www.jiemian.com/article/15381078.html","p":1795746720,"a":1795749557,"t":"恒生生物科技ETF鹏华(159130)标的指数均涨超2.8%，和黄医药沃瑞沙联合奥希替尼上市申请获受理| 界面新闻","su":"이 소식을 통해 허치메드는 표피성장인자수용체(EGFR)에 민감한 돌연변이 및 MET 과발현을 동반한 치료되지 않은 국소 진행성 또는 전이성 비소세포폐암 환자 치료를 위한 오시머티닙과 오시머티닙을 결합한 오파시스®(사볼리티닙)에 대한 신약 마케팅 신청이 중국 국가약품관리국(China 중국 국가약품감독관리국)에 의해 승인되었다고 발표했습니다. 갤럭시증권은 2027년 제약업계가 압박에서 구조적 회복으로 전환하고 혁신신약(세상에 처음 나온 새로운 약)이 수확기에 진입할 것이라고 지적했다. 고금리 환경으로 인해 밸류에이션(주가가 비싼지 싼지 따진 값)이 억제되었지만, 중국 국내 의료보험 기금의 지급 능력 향상과 인구 노령화 수요가 내수 개선을 뒷받침했습니다. 배분 측면에서는 글로벌 경쟁력을 갖춘 혁신신약과 국내 대체가 확실한 선도기기의 핵심 자산에 집중하고, CXO, 혁신신약 파마 등 안정적인 자산에 대해서는 낙관하는 것이 좋다. 업계에서는 정책 변동이 해소되는 경향이 있는 이후 가격 균형을 재조정할 것으로 예상된다."},{"s":"CAR-T는 처음으로 기본 의료 보험에 포함되었으며, Southern Fund의 Southbound 혁신신약 ETF Southern(159297)의 기본 지수는 세션 중에 하락했습니다.","so":"Jiemian.com","tm":"11/27 10:42","c":1,"r":"cn","u":"https://m.jiemian.com/article/15380040.html","p":1795743726,"a":1795749558,"t":"CAR-T首次纳入基本医保、南方基金旗下港股通创新药ETF南方(159297)标的指数盘中回调","su":"2026년 11월 26일 국립증권 홍콩증권연계 혁신의약품지수(987018)는 장중 0.01% 하락한 1536.56포인트를 기록했다. Southbound 혁신신약(세상에 처음 나온 새로운 약) ETF(여러 주식을 묶어 파는 상품) South(159297)의 거래량은 2억 6,690만 위안, 회전율은 13.78%였습니다."},{"s":"Bright Minds Biosciences 및 기타 캐나다 생명공학 주식 2개 보유","so":"Yahoo Finance","tm":"11/27 10:27","c":1,"r":"us","u":"https://finance.yahoo.com/healthcare/articles/bright-minds-biosciences-2-other-012754864.html","p":1795742820,"a":1795749555,"t":"Bright Minds Biosciences And 2 Other Canadian Biotech Stocks To Own","su":"이제 반도체(전자기기 속에서 계산하고 기억하는 작은 부품) 칩은 석유 및 가스보다 더 큰 글로벌 수출 무역을 대표하며, 고급 컴퓨팅에 대한 수요 급증은 조용히 캐나다 생명공학에 반영됩니다. 약물 발견, 진단, 유전자 편집은 모두 막대한 데이터 처리에 달려 있습니다. 첨단 기술에 자본이 유입되면 의료 혁신에 초점을 맞춘 연구도 지원할 수 있습니다. 이 기사에서는 캐나다 생명공학 매장 3곳을 소개합니다."},{"s":"갤럭시증권: 혁신신약 수확기에 돌입, 업계 압박에서 구조적 회복으로 전환할 것","so":"Jiemian.com","tm":"11/27 09:47","c":1,"r":"cn","u":"https://www.jiemian.com/article/15379753.html","p":1795740475,"a":1795749560,"t":"银河证券：创新药进入收获期，行业将从承压转向结构性复苏"},{"s":"Cogent Biosciences, 첫 번째 약물에 대한 FDA 승인 획득, 월 $49,000 출시 계획","so":"Yahoo Finance","tm":"11/27 08:12","c":1,"r":"us","u":"https://finance.yahoo.com/healthcare/articles/cogent-biosciences-wins-fda-approval-231205074.html","p":1795734725,"a":1795737881,"t":"Cogent Biosciences Wins FDA Approval for First Drug, Plans $49,000-a-Month Launch","su":"Cogent Biosciences(NASDAQ:COGT)는 미국 식품의약국(FDA(미국에서 약을 허가해 주는 정부 기관))이 이전에 이마티닙을 투여받은 진행성 위장기질종양(GIST) 환자를 위해 EKITNA를 승인했다고 밝혔습니다. 기존 표준치료제인 수니티닙과 병용해 출시할 예정이다."},{"s":"이익기반 생명공학 ETF 2가지가 주목받는다 - 데일리","so":"工商時報","tm":"11/27 04:00","c":1,"r":"tw","u":"https://www.ctee.com.tw/news/20261127700345-439901","p":1795719600,"a":1795733599,"t":"2大利多加持生技ETF吸睛- 日報","su":"글로벌 주식 시장은 극심한 혼란을 겪었고 거의 모든 주식 ETF(여러 주식을 묶어 파는 상품)가 그 뒤를 따랐습니다. 하지만 해외주식 ETF 145개 중 반대 방향으로 상승한 데 이어 바이오 ETF도 이러한 추세에 반하는 상승세(오르는 흐름)를 보였다. 법률대리인은 생명공학 및 의료지수의 성과가 상대적으로 내진성이 뛰어나며, 관련 생명공학 ETF의 성과가 뛰어났다고 말했다. 산업 발전은 꾸준하고 긍정적이며 투자 테마는 풍부합니다. 관련 바이오 ETF를 통한 투자 기회에 참여하는 것이 좋습니다. Qunyi 나스닥 Biotechnology(00678) ETF 매니저 Qiu Yuru는 의료..."},{"s":"화하이제약(Huahai Pharmaceutical): 시타글립틴정이 미국 FDA 승인번호를 획득했습니다.","so":"第一财经","tm":"11/27 02:54","c":1,"r":"cn","u":"https://www.yicai.com/news/103455479.html","p":1795715657,"a":1795733596,"t":"华海药业：西格列汀片获得美国FDA批准文号","su":"제일재경 2026-11-26 15:45:28 편집자: 장샤오화하이제약(Zhang 샤오 Huahai Pharmaceutical)은 자사가 미국 FDA(미국에서 약을 허가해 주는 정부 기관)에 제출한 시타글립틴정에 대한 단축신약신청(ANDA, 미국 제네릭(특허가 끝난 약을 똑같이 만든 복제약) 의약품 신청)이 공식 승인되었다고 밝혔다. 시타글립틴 정제는 주로 제2형 당뇨병 치료에 사용됩니다. 생명을 구하는 의학이 더 이상 우연한 발견이나 소수의 행운에만 의존하지 않게 해주세요. 인공지능 기술을 숙달한 기업가 그룹도 이 탐구에 동참했습니다. WTO 추산에 따르면, 협정 이행으로 글로벌 FDI가 9% 증가할 것으로 예상된다. 중국 내 국내 의류 브랜드가 주요 해외 크리에이티브 디렉터와 심도 깊은 결속을 맺은 것은 이번이 처음이다."},{"s":"하오하이바이오테크놀로지(06826) 해외규제 고시-기타","so":"信報網站","tm":"11/26 19:04","c":1,"r":"hk","u":"https://www2.hkej.com/instantnews/hkex/article/4575241/%E6%98%8A%E6%B5%B7%E7%94%9F%E7%89%A9%E7%A7%91%E6%8A%80%2806826%29+%E6%B5%B7%E5%A4%96%E7%9B%A3%E7%AE%A1%E5%85%AC%E5%91%8A-%E5%85%B6%E4%BB%96","p":1795687445,"a":1795694287,"t":"昊海生物科技(06826) 海外監管公告-其他","su":"Haohai Biotechnology (06826) 해외 규제 발표 - Shanghai Haohai Biotechnology 2026년 3분기 실적(회사가 번 돈 성적표) 브리핑 개최 발표(201KB, pdf)"},{"s":"세계 최초 B형간염 기능성 신약 '베프로버젠' 중국 허가","so":"第一财经","tm":"11/26 18:57","c":1,"r":"cn","u":"https://www.yicai.com/news/103455676.html","p":1795687077,"a":1795694280,"t":"全球首个乙肝功能性治愈新药贝普若韦生中国获批","su":"제일재경 2026-11-26 17:56:48 편집자: Gao Mingyan 11월 26일, 국가식품의약국은 만성 B형 간염 바이러스 감염의 기능적 치료를 위해 뉴클레오시드(산) 유사체(NAS)와 결합된 Bepirovirsen(영어명: Bepirovirsen, 상품명: Hesuke)의 목록을 승인했습니다. 베프로비르센은 올해 일본, 미국, 캐나다에서 승인을 받아 여러 나라 규제당국으로부터 공동 인정을 받고 '기능적 완치'를 치료 목표로 하는 세계 최초이자 유일한 B형간염 신약(새로 만든 약)이 됐다. (제일재경 기자 Lin Zhiyin) 기능적 치료를 달성할 확률은 35~61%입니다."},{"s":"Fosun Pharma: HLX109 주사제 임상시험 승인","so":"Jiemian.com","tm":"11/26 17:48","c":1,"r":"cn","u":"https://www.jiemian.com/article/15378202.html","p":1795682937,"a":1795694281,"t":"复星医药：HLX109注射液临床试验获批","su":"Fosun Pharma는 최근 회사의 지배 자회사(다른 회사가 주인인 회사)인 Shanghai Henlius Biotechnology와 그의 지배 자회사가 국가 의약품 관리국(중국 국가약품감독관리국)이 발행한 \"약물 임상(새 약을 사람에게 시험하는 것) 시험 승인 통지\"를 받았으며, 이는 전신 농포성 건선 치료를 위해 HLX109 주사(즉, IL1RAP를 표적으로 하는 단일클론 항체)의 1상 임상 시험을 수행하기로 합의했다고 발표했습니다."},{"s":"'생각'만으로 물건 움직인다…머스크 뇌 이식칩 임상평가 돌입 - 머니투데이","so":"머니투데이","tm":"11/26 17:04","c":1,"r":"kr","u":"https://www.mt.co.kr/amp/world/2026/11/26/2026112616150525617","p":1795680294,"a":1795694277,"su":"일론 머스크 스페이스X·테슬라 최고경영자(CEO(회사의 가장 높은 책임자))가 세운 스타트업 뉴럴링크가 뇌-컴퓨터 연결장치(BCI) 임상(새 약을 사람에게 시험하는 것) 시험 승인을 받았다. 뉴럴링크는 마비 환자들이 생각만으로 전자 기기를 쓸 수 있는 뇌 이식 장치를 개발해 왔다."},{"s":"3년간의 운영, 글로벌 데뷔: 인내심 있는 자본과 혁신적인 제약회사 간의 양방향 여정","so":"21财经","tm":"11/26 16:51","c":1,"r":"cn","u":"https://www.21jingji.com/article/20261126/herald/54ab6a3b75d7741200c382a02ec220d4.html","p":1795679460,"a":1795694283,"t":"三年陪跑、全球首发：耐心资本与创新药企的双向奔赴","su":"홍반성 루푸스, 류마티스 관절염...장기적인 약물 치료가 필요한 이러한 자가면역 질환은 수천만 가족을 괴롭혔습니다. '면역치료의 이정표'로 알려진 CAR-T 기술을 통해 일부 환자는 약물 중단 후 장기간 관해를 달성할 수 있었지만 대부분의 환자에게는 수십만에서 수백만의 가격이 감당하기 어려울 정도였습니다. 2021년 12월 설립된 선전 기업 홍신바이오테크놀로지(Hongxin Biotechnology)는 이 문턱을 '허물기' 위해 노력하고 있다. 그들은 인간 임상(새 약을 사람에게 시험하는 것) 시험에 들어간 세계 최초의 \"세포 표적 LNP 약물\"을 개발했습니다. 기존 CAR-T의 '고도화된 민간 맞춤화'를 언제든지 복용하고 사용할 수 있는 '표준화된 대량생산 의약품'으로 탈바꿈할 것으로 예상되며, 치료비도 1만원 수준으로 인하될 전망이다."},{"s":"다이이치산쿄(Daiichi Sankyo)의 혁신신약 Viftai®(퀴자티닙 염산염 정제)가 중국에서 공식 출시되었습니다.","so":"Jiemian.com","tm":"11/26 15:48","c":1,"r":"cn","u":"https://www.jiemian.com/article/15377277.html","p":1795675716,"a":1795676824,"t":"第一三共创新药物维复泰®（盐酸奎扎替尼片）正式在中国商业上市","su":"11월 26일, Daiichi Sankyo China의 소식에 따르면, Daiichi Sankyo의 혁신적인 약물 Vivotec®(퀴자티닙 염산염 정제)이 FLT3-ITD 돌연변이가 있는 새로 진단된 급성 골수성 백혈병(AML) 성인 환자의 치료를 위해 중국에서 공식 출시되었습니다. Weifutai®는 곧 전국의 병원과 약국에 공급되어 중국 의사와 AML 환자에게 새로운 치료 옵션(정해진 값에 사거나 팔 권리)을 제공할 예정입니다."},{"s":"의료보험의 이중 카탈로그가 공식적으로 출시되었으며 혁신 의약품의 지불 측면이 집중적으로 현금화되었습니다. 홍콩 스톡커넥트 혁신신약 ETF인 Harvest(520970)는 홍콩 혁신 의약품 산업의 발전 기회를 포착합니다.","so":"Jiemian.com","tm":"11/26 13:00","c":1,"r":"cn","u":"https://www.jiemian.com/article/15376335.html","p":1795665620,"a":1795694284,"t":"医保双目录正式落地，创新药支付端兑现密集，港股通创新药ETF嘉实(520970)把握港股创新药产业发展机会","su":"2026년 11월 26일 10시 45분 현재 CSI 홍콩 스톡커넥트(홍콩과 중국 본토 주식을 서로 사고팔 수 있게 한 길) Innovative Drug Index는 2.71% 크게 상승했으며, 구성주인 Zhaoyan New Drug은 5.27%, GenScript Biotech은 5.26%, China Biopharmaceutical은 5.14% 상승하고 우시앱텍 및 Insilicon Intelligent와 같은 주식이 뒤따랐습니다."},{"s":"Cipla, Teva, FDA 승인 천식 흡입기 Flovent 획득","so":"ETPharma","tm":"11/26 12:07","c":1,"r":"us","u":"https://pharma.economictimes.indiatimes.com/amp/news/drug-approvals-and-launches/cipla-teva-win-fda-nod-asthma-inhaler-flovent/136177077","p":1795662465,"a":1795694279,"t":"Cipla, Teva win FDA nod asthma inhaler Flovent","su":"- 약물 승인 및 출시 - 1분 읽기 Cipla, Teva, FDA(미국에서 약을 허가해 주는 정부 기관) 천식 흡입기 Flovent 승인 이스라엘의 Teva Pharmaceuticals와 협력하여 개발된 이 제품은 GSK의 Flovent와 동등한 최초의 제네릭(특허가 끝난 약을 똑같이 만든 복제약) 제품으로 명시되어 있습니다."},{"s":"NASDAQ Biotechnology Total Retu (^XNBIJPY) 계절별 수익률 차트 - 야후 파이낸스","so":"Yahoo! Finance Canada","tm":"11/26 01:54","c":1,"r":"us","u":"https://ca.finance.yahoo.com/quote/%5EXNBIJPY/seasonality/","p":1795625657,"a":1795694279,"t":"NASDAQ Biotechnology Total Retu (^XNBIJPY) Seasonal Returns Chart - Yahoo Finance","su":"NASDAQ Biotechnology Total Retu(^XNBIJPY) 계절 수익률(넣은 돈에 비해 얻는 이익 비율) 차트는 투자 전략을 알리기 위해 월별 평균 및 중간 수익률을 제공합니다."},{"s":"410억 달러 규모의 사노피/인스메드 거래가 M&A 희망을 되살리면서 주목해야 할 5개 생명공학 주식","so":"Yahoo Finance","tm":"11/26 00:31","c":1,"r":"us","u":"https://finance.yahoo.com/healthcare/articles/5-biotech-stocks-watch-41b-153100426.html","p":1795620660,"a":1795647062,"t":"5 Biotech Stocks to Watch as $41B Sanofi/Insmed Deal Revives M&A Hopes","su":"인스메드를 인수하기로 한 사노피의 합의는 생명공학에 대한 투자자의 관심을 다시 불러일으켰고 잠재적인 인수 목표에 대한 광범위한 부문 상승세(오르는 흐름)와 추측을 촉진하는 데 도움이 되었습니다. 이번 거래는 대형 제약사의 성장 전망을 강화할 수 있는 차별화된 의약품과 유망 파이프라인(개발하고 있는 신약 후보 목록)의 전략적 가치를 강조합니다."},{"s":"'중국 혁신' 해외 진출 | 생명을 지키는 의학의 '새로운 힘'","so":"新华网","tm":"11/25 22:58","c":1,"r":"cn","u":"https://www.news.cn/tech/20261125/a77a0741fd924d98b82a3b4452c699ec/c.html","p":1795615135,"a":1795647069,"t":"“中国创新”出海记丨守护生命的医药“新力量”","su":"혁신적인 의약품과 같은 신제품은 빠르게 해외 시장을 개척하고 있으며 중국의 대외 무역을 위한 새로운 명함이 되고 있습니다. 데이터에 따르면 올해 3분기까지 중국의 혁신 의약품에 대한 외부 라이센스 거래는 약 1,300억 달러로 지난해 전체 수준에 가깝습니다. 혁신신약(세상에 처음 나온 새로운 약)의 외부 라이센싱은 혁신제약사가 특허나 기술, 제품 등을 해외 기업에 라이센싱하는 거래 형태다. 이는 중국의 지적재산권과 독창적인 연구개발 역량의 특별한 수출이다. 실험실에서의 독립적 연구개발부터 글로벌 시장에서의 협력과 경쟁에 이르기까지 점점 더 많은 중국 혁신 의약품이 해외 시장에 진출하고 글로벌 의약품 연구 개발 협력에 참여하며 혁신 의약품 해외 진출의 새로운 이야기를 쓰고 있습니다. Rongchang Biopharmaceutical (Yantai)가 독자적으로 개발한 새로운 항종양 약물은 전 세계적으로 3상 임상시험(새 약을 사람에게 시험하는 것)을 진행하고 있습니다. 현재 Rongchang Biotechnology는 다양한 핵심 제품에 대한 외부 라이센스 협력을 완료했으며 종양, 자가면역, 안과 등 분야를 포함하여 총 협력 금액이 126억 달러가 넘습니다."},{"s":"ETF 선택 | 3대 지수는 등락세를 보이며 약세를 보인 반면, 한약, 홍콩 소비재, 홍콩 혁신의약품 등 ETF는 추세를 거스르며 강세를 보였다.","so":"Jiemian.com","tm":"11/25 21:44","c":1,"r":"cn","u":"https://www.jiemian.com/article/15373949.html","p":1795610664,"a":1795612518,"t":"ETF甄选 | 三大指数震荡走弱，中药、港股消费、港股创新药等ETF逆势走强","su":"2026년 11월 25일 A주 시장은 하루 종일 등락과 약세(내리는 흐름)를 보이며 3대 지수가 종합적으로 마감됐다. 장을 마감한 현재 상하이증권거래소지수는 2.03%, 선전부품지수는 3.24%, 차이넥스트지수는 4.19% 하락했다. ETF(여러 주식을 묶어 파는 상품) 측면에서는 한의학, 홍콩소비자주, 홍콩혁신의약품 등 관련 ETF가 추세를 거스르고 강세를 보였습니다!"},{"s":"410억 달러 규모로 최근 몇 년간 제약 업계 최대 규모의 인수합병이 완료되었습니다! 520880 기초 지수가 3% 이상 상승하고 주요 가중치가 공동 노력을 기울이는 등 홍콩 증시 연계의 혁신 의약품에 대한 분위기가 뜨거워지고 있습니다.","so":"Jiemian.com","tm":"11/25 20:02","c":1,"r":"cn","u":"https://www.jiemian.com/article/15373502.html","p":1795604521,"a":1795608159,"t":"410亿美元，制药行业近年最大并购落定！港股通创新药情绪升温，520880标的指数摸高逾3%，权重龙头集体发力","su":"11월 25일(수요일) 홍콩 증시는 상승했다가 하락하며 항셍지수가 1.14% 하락했습니다. 혁신적인 약물은 시장 추세를 거스르는 몇 안 되는 약물 중 하나였습니다. 100% 혁신의약품 연구개발 목표인 홍콩주식연계 혁신약품 ETF(여러 주식을 묶어 파는 상품) 화바오(520880) 추적지수(항셍홍콩주식연계 혁신약물선택지수)가 0.4% 상승을 마감했다."},{"s":"넥셀라가 상가 지향 강화해 연초 고가 갱신, 금기 영업 흑자 예상 바이오 주식에 개인 투자자가 매입 공세","so":"株探","tm":"11/25 19:30","c":1,"r":"jp","u":"https://kabutan.jp/news/marketnews/?b=n202611250709","p":1795602659,"a":1795676825,"t":"ネクセラが上値指向強め年初来高値更新、今期営業黒字予想のバイオ株に個人投資家が買い攻勢"},{"s":"방금 생명공학주로 1억 6천만 달러를 벌었습니다! 장준닝(Junning Chang)은 대만 증시 충격에 직면해 AI 주식을 알아보고 '오로라'를 보았다.","so":"噓！星聞","tm":"11/25 18:12","c":1,"r":"tw","u":"https://stars.udn.com/star/story/10089/9901613","p":1795597967,"a":1795608162,"t":"才靠生技股賺1.6億！張鈞甯遇台股震盪認了AI股慘見「極光」","su":"2022년에는 장준닝이 생명공학 주식 '야오화제약(Yaohua Pharmaceutical)'을 NT$6016만에 매입한 것으로 밝혀졌습니다. 그녀는 최소 NT$1억 6천만 달러를 벌어들인 것으로 알려졌고, 그녀는 단번에 \"여성 주식의 신\"이라는 별명을 얻었습니다. 그러나 그녀는 지난달 한 행사에서 자신의 주식을 모두 매진했고 여전히 일부 AI 주식을 보유하고 있다고 담담하게 밝혔다. 최근 대만 증시는 지속적인 변동세를 보이고 있습니다. 그녀는 어제 한 금 주얼리 브랜드 행사에 참석해 현재 투자 상황에 대한 질문을 받았다. 그녀는 최근 주식시장이 '오로라'(증시 붕괴의 청신호)였다고 인정했다. 그녀는 “다른 사람들도 마찬가지”라며 웃었다. 그녀는 자신의 투자 생각도 밝혔습니다."},{"s":"Jiuzhitang: 전액 출자 자회사가 개발한 신약이 중국에서 임상 시험 승인을 받았습니다.","so":"第一财经","tm":"11/25 17:16","c":1,"r":"cn","u":"https://www.yicai.com/news/103453853.html","p":1795594596,"a":1795647073,"t":"九芝堂：全资子公司研发新药在国内获得临床试验批准","su":"제일재경 2026-11-25 16:13:57 편집자: Gao Mingyan Jiuzhitang은 자사의 전액 출자 자회사(다른 회사가 주인인 회사)인 Youbo Pharmaceutical에서 개발한 신약 재조합 MG53 돌연변이 단백질 젤(YB001 젤)이 최근 국가 식품의약국으로부터 승인 및 발행된 \"약물 임상 시험 승인 고시\"를 받았으며 적응증 범위 내에서 임상 시험을 수행하는 데 동의했다고 발표했습니다. \"조기 상처 치유를 촉진하고 다양한 유형의 만성 치유가 어려운 상처(당뇨병성 족부 궤양, 정맥 정체 궤양, 욕창 등 포함)에 사용됩니다.\" 드디어 상장(주식시장에 처음 들어오는 것) 신청 단계에 이르렀으나 과정이 순조롭지는 않았습니다."},{"s":"‘먹는 유방암약’ 美 FDA 승인…100조 시장 노린 신약 쏟아진다","so":"Chosunbiz","tm":"11/25 16:11","c":1,"r":"kr","u":"https://biz.chosun.com/science-chosun/science/2026/11/25/HBSWEODEGJRGGOLGGZRGEY3GHE/?outputType=amp","p":1795590660,"a":1795608158,"su":"먹는 유방암약 美 FDA 승인(미국에서 이 약을 팔아도 된다는 허가)100조 시장 노린 신약 쏟아진다 먹는 약부터 ADC(암세포만 골라 약을 전달하는 항암제) 치료제까지 中 기업도 맹추격"},{"s":"ST 렌푸가 19년 넘게 개발한 신약은 폐기됐고, 4억 달러의 자금이 낭비됐다.","so":"第一财经","tm":"11/25 15:08","c":1,"r":"cn","u":"https://www.yicai.com/news/103454004.html","p":1795586935,"a":1795612520,"t":"ST人福研发了19年以上的新药宣告放弃，4亿资金打水漂了","su":"19년 넘게 개발해온 신약, ST 렌푸(600079.SH)가 결국 무산됐다. 11월 25일 저녁, ST Renfu는 R&D 프로젝트 종료 및 자산 손상 조항 제공에 대한 발표를 발표했습니다. 이번에 종료된 연구개발은 생체치료제 1종 신약인 재조합 플라스미드-간세포 성장인자 주사제(이하 'pUDK-HGF')이다. 에스티휴먼푸의 자회사(다른 회사가 주인인 회사)인 우한옵틱스밸리휴먼푸바이오팜(이하 '옵티컬밸리휴먼푸', 지분 81.30% 보유)이 개발한 제품으로, 중증 하지 허혈성 질환으로 인한 사지 안정 통증 치료에 사용된다. 이 약은 2007년 4월 '의약품임상시험(새 약을 사람에게 시험하는 것) 승인'을 획득하고 1상 임상시험이 허가됐다. 2013년 3월에는 '의약품 임상시험 승인'을 획득하고 2상 임상시험을 실시할 수 있게 되었습니다. 2017년 9월에는 '의약품 임상시험 승인'을 획득해 3상 임상시험을 실시할 수 있게 됐다. 2024년 12월 Optics Valley Renfu는 국가 식품의약국에 판매 등록 신청서를 제출하고 승인되었습니다."},{"s":"바이오의약품에 대한 정책 지원이 크게 늘었고, 과학기술제약 ETF Harvest(588700)도 계속 수혜를 입을 것으로 예상된다.","so":"Jiemian.com","tm":"11/25 14:31","c":1,"r":"cn","u":"https://www.jiemian.com/article/15372010.html","p":1795584660,"a":1795589883,"t":"政策端对生物医药的支持力度显著增强，科创医药ETF嘉实(588700)有望持续受益","su":"2026년 11월 25일 13시 31분 현재 상하이 과학기술혁신위원회 생물의학지수는 0.74% 하락했다. Baili Tianheng이 5.54% 상승을 주도하고 Shengxiang Biotech이 1.52% 상승하고 Zejing Pharmaceutical이 1.51% 상승하는 등 구성 종목이 혼조세(오르는 것과 내리는 것이 섞인 모습)를 보였습니다. 메디실론이 하락세를 주도했고, MGI와 하이타이싱광이 그 뒤를 이었다."},{"s":"직장‧결장 수술부위 감염증 항생제 FDA 승인","so":"약업신문","tm":"11/25 14:01","c":1,"r":"kr","u":"http://m.yakup.com/news/?mode=view&cat=16&cat2=&cat3=0&nid=335707","p":1795582860,"a":1795589880},{"s":"FDA 승인으로 BridgeBio 주식에 대한 사례가 바뀔 수 있음","so":"Yahoo Finance","tm":"11/25 12:19","c":1,"r":"us","u":"https://finance.yahoo.com/healthcare/articles/fda-approval-may-change-case-031915636.html","p":1795576740,"a":1795582099,"t":"FDA Approval May Change The Case For BridgeBio Stock","su":"브리지바이오는 1차 및 주요 2차 평가변수를 충족한 3상 FORTIFY 시험 데이터를 기반으로 체중이 30kg 이상인 LGMD2I/R9 성인 및 소아 환자를 위한 경구 치료제인 Welgemda에 대해 기존 FDA 승인(미국에서 이 약을 팔아도 된다는 허가)을 받았습니다. Welgemda는 모든 형태의 사지 근이영양증에 대해 최초로 승인된 치료법이며 BridgeBio에 희귀 소아 질환 우선 검토 바우처를 제공합니다."},{"s":"美브릿지, '경구 리비톨' LGMD 첫 치료제 \"FDA 승인\"","so":"바이오스펙테이터","tm":"11/25 10:56","c":1,"r":"kr","u":"https://www.biospectator.com/news/view/30508","p":1795571760,"a":1795574626,"su":"미국 브릿지바이오파마(Brid 인수했습니다. 11월 24일 저녁, 톈치리튬(002466.SZ)은 전액 출자 자회사(다른 회사가 주인인 회사) 및 자회사를 통해 Runfeng Mining 지분 76.53%, Tianqi Xingyu 지분 100% 및 Shangdubu 탐사권을 인수할 계획이라고 발표했습니다. 총 거래금액은 약 68억7200만 위안이다. 위에서 언급한 거래 대상에는 Tianqi Group, Tianqi Minmetals 및 Ying'anjia가 포함됩니다. 처음 두 개는 톈치리튬의 실제 컨트롤러인 Jiang Weiping이 제어합니다. Ying'anjia는 톈치리튬의 회장인 Jiang Anqi가 통제합니다. 본 거래는 관련 거래를 구성합니다. 올해 상반기 기준으로 Tianqi Xingyu는 Tianqi Group에 9억 2100만 위안의 대출금 원금과 이자를 갚아야 합니다. 합의 후 톈치리튬은 대출금을 상환해야 하므로 이번 거래에 대한 실제 대가는 77억 9300만 위안으로 증가했습니다."},{"s":"'Broker Insights' CITIC Lyon은 CATL(03750)의 4분기 실적이 부진하다고 지적하며 내년 실적에 대한 회사의 견해에 주목","so":"etnet 經濟通","tm":"11/26 11:30","c":2,"r":"hk","u":"https://www.etnet.com.hk/www/tc/news/news-article.php?section=categorized&category=latest&newsid=20261121382","p":1795660200,"a":1795663002,"t":"《券商精點》中信里昂指寧德時代(03750)第四季績弱，關注公司對明年業績看法","su":"2026-11-26 10:30 \"Broker Focus\" CITIC Lyon은 CATL(03750)이 4분기 실적(회사가 번 돈 성적표)이 부진하다고 지적하며 내년 실적에 대한 회사의 견해에 주목했습니다. CITIC Lyon은 CATL(03750)의 \"우수\" 등급을 유지했으며 H주와 A주의 목표 주가는 각각 HK$585와 RMB 400입니다. CATL의 2026년 4분기 실적이 예상보다 나쁠 수 있다는 우려가 시장에서 다시 불붙자 최근 CATL의 주가가 다시 조정을 받았다. 은행은 비용 전달 지연과 연말 컴퓨팅 비용 집중으로 인해 회사의 4분기 실적이 하락할 수 있다는 연구 보고서를 발표했습니다. 하지만 은행은 현 단계에서 더 중요한 것은 CATL이 2027년 단위당 순이익(모든 비용을 빼고 남은 돈) 실적을 어떻게 보는가라고 지적했다. 불행하게도 시장은 회사로부터 보다 명확한 지침을 얻기 위해 2027년 1분기까지 기다려야 할 수도 있다. 그럼에도 불구하고 은행은 CATL에 대한 투자등급을 재차 밝혔습니다."},{"s":"[특징주] 美, 한국 관세 15% 유지 전망에…이차전지주 동반 강세","so":"Chosunbiz","tm":"11/26 09:48","c":2,"r":"kr","u":"https://biz.chosun.com/stock/stock_general/2026/11/26/IC5DVVTVNZGPZOKZ5CMYNY55AI/","p":1795654080,"a":1795663000,"su":"미국이 한국에 대한 관세(수입품에 붙이는 세금) 상한을 기존 15%로 유지할 것이란 소식에 국내 이차전지 관련주가 장 초반 강세를 보이고 있다. 추가 관세 부과에 대한 우려가 완화되면서 투자심리가 개선된 것으로 풀이된다. 26일 오전 9시 44분 삼성SDI(006400)는 유가증권시장(한국 큰 회사들이 모인 주식시장(코스피))에서 전 거래일 대비 1만4000원(3.35%) 오른 43만2000원에 거래되고 있다. 포스코퓨처엠도 5800원(3.54%) 오른 16만9500원을 기록 중이다."},{"s":"LG에너지솔루션, 북미 ESS 시장 공략…AI 에너지 플랫폼 기업 도약","so":"전자신문","tm":"11/26 09:27","c":2,"r":"kr","u":"https://www.etnews.com/20261126000087","p":1795652840,"a":1795676835,"su":"“이제는 사실상 모든 고객들이 저희 쪽으로 들어오고 있습니다.” LG에너지솔루션 에너지저장장치(ESS(전기를 저장해 두는 큰 배터리)) 사업 전문 법인 버텍의 트리스탄 도허티 최고제품책임자(CPO)는 최근 미국 라스베이거스에서 열린 신재생에너지(햇빛·바람처럼 다시 쓸 수 있는 에너지) 전시회"},{"s":"도쿠시마현 현내 6시읍면에서 리튬 이온 전지 회수의 실증 사업","so":"NHKニュース","tm":"11/26 06:00","c":2,"r":"jp","u":"https://news.web.nhk/newsweb/na/nd-20261126de81555","p":1795640418,"a":1795647101,"t":"徳島県 県内6市町村でリチウムイオン電池回収の実証事業","su":"【NHK】리튬(배터리에 꼭 들어가는 아주 가벼운 금속) 이온 전지가 관계하는 화재가 뒤를 끊지 않는 가운데, 도쿠시마현은, 11월부터 현내의 공공 시설 내에 전용의 박스를 설치해 전지의 회수를 실시하는 실증(실제 현장에서 써 보며 확인하는 것) 사업을 실시하고 있습니다. 리튬 이온 배터리 등으로부터의 출화에 의한 화재"},{"s":"본토와 대만 기업인들이 새로운 기회를 위해 싸우다 / 광시 기반, 동남아시아를 바라보며 화후이 신소재, 배터리 분리막 공격","so":"UDN","tm":"11/26 03:54","c":2,"r":"tw","u":"https://udn.com/news/story/7333/9902306","p":1795632847,"a":1795647097,"t":"大陸台商拚新局／立基廣西、放眼東南亞 華徽新材強攻電池隔膜","su":"대만의 젊은 사업가 천민푸(Chen Minfu)가 이끄는 화후이신소재(Huahui New Materials)는 배터리 분리막(배터리 양쪽이 서로 닿지 않게 막는 얇은 막)에 주력하고 있다. 그는 본토의 지역 산업 정책과 기술적 이점을 활용하여 광시에 기지를 설립했습니다. 현지 주요 제조업체에 공급하는 것 외에도 광시핑루 운하와 정책 파급효과도 활용해 동남아시아에서의 발전도 기대된다."},{"s":"CATL: 약 9999만 7천 위안을 지출하여 474,400A주(크립톤 36주)를 재매입했습니다.","so":"www.36kr.com","tm":"11/25 21:56","c":2,"r":"cn","u":"https://www.36kr.com/newsflashes/4085134970415749","p":1795611374,"a":1795612530,"t":"宁德时代：斥资约9999.7万元回购47.44万股A股-36氪","su":"36Kr은 CATL이 11월 25일 선전증권거래소에서 A주(중국 본토(상하이·선전) 주식시장의 주식) 474,400주를 환매하기 위해 약 9999만7000위안을 지출할 것이라고 발표했다는 사실을 알게 됐다. 환매된 주식의 가격 범위는 주당 210.13~212.22위안이었다."},{"s":"\"반도체서 거둔 성과… 이차전지·디스플레이로 이어갈 것\" [인터뷰]","so":"파이낸셜뉴스","tm":"11/25 18:13","c":2,"r":"kr","u":"https://www.fnnews.com/news/202611251813225164","p":1795598006,"a":1795608186,"su":"저스템 김용진 사장은 25일 \"올해는 반도체(전자기기 속에서 계산하고 기억하는 작은 부품) 슈퍼사이클을 맞아 습도제어 솔루션 판매가 활발히 이뤄지면서 급성장했다\"라며 \"내년에는 이차전지와 디스플레이 장비 매출(물건을 판 돈 전체)이 더해지면서 올해보다 최소 30% 이상 성장이 가능할 것\"이라며 이같이 밝혔다."},{"s":"주가는 하루 만에 8% 이상 하락했고, CATL의 시가총액은 1조 위안 아래로 떨어졌다.","so":"Jiemian.com","tm":"11/25 17:57","c":2,"r":"cn","u":"https://www.jiemian.com/article/15373101.html","p":1795597044,"a":179560
