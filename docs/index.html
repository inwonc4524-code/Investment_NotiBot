.ctrl button.on{background:var(--card2);border-color:var(--card2);color:var(--text)}
.ctrl .sep{flex:none;width:1px;background:var(--line);margin:2px 4px}
main{padding:6px 12px 48px}

.note{margin:0 4px 10px;color:var(--sub);font-size:12px}
.none{color:var(--sub);margin:24px 4px;text-align:center}
.card{display:block;background:var(--card);border-radius:12px;padding:12px 14px;margin:8px 0;color:var(--text);text-decoration:none;transition:background .15s}
.card:hover{background:var(--card2)}.card:active{opacity:.75}
.meta{color:var(--sub);font-size:12px}
.title{font-weight:500;margin-top:3px}
.orig{color:var(--sub);font-size:12px;margin-top:3px}
.new{margin-left:4px;color:var(--red);font-size:11px;font-weight:700;letter-spacing:.3px}
.hot{display:inline-block;margin-right:6px;padding:0 6px;border-radius:4px;background:rgba(217,119,87,.16);color:var(--acc);font-weight:600}
.hot.big{background:var(--acc);color:#1f1e1d}
.more{display:block;width:100%;margin:4px 0 0;padding:10px;border:1px dashed var(--line);border-radius:12px;background:transparent;color:var(--sub);font:inherit;font-size:13px}
footer{margin:36px 4px 0;padding-top:14px;border-top:1px solid var(--line);color:var(--sub);font-size:12px;line-height:1.7}
footer b{color:var(--text);font-weight:600}

#dim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:5}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:6;max-width:760px;margin:auto;max-height:82vh;overflow-y:auto;

.grab{width:38px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 12px}
.s-title{font-size:17px;font-weight:600;margin:4px 0 2px;line-height:1.45}
.s-label{margin:16px 0 4px;color:var(--acc);font-size:12px;font-weight:700;letter-spacing:.5px}
.s-sum{font-size:15px;line-height:1.75}.s-sum.empty{color:var(--sub);font-size:13.5px}
.s-btns{display:flex;gap:8px;margin-top:20px}
.s-btns button,.s-btns a{flex:1;text-align:center;padding:12px;border-radius:10px;font:inherit;font-size:14.5px;text-decoration:none}
.s-btns button{background:transparent;border:1px solid var(--line);color:var(--sub)}
.s-btns a{background:var(--acc);color:#1f1e1d;font-weight:600}

","su":"대만 주식시장은 지난 주 엄청난 폭락을 겪었고, 일주일 만에 5,500포인트 이상 급락해 연간선 아래로 떨어졌습니다. 시장 패닉이 빠르게 커지고 있다. 그러나 지난 금요일 미국 증시는 거센 반격을 펼쳤고 국가안보기금(National Security Fund)도 시장에 진입할 예정이다. 다음주 대만 증시는 안정될까? 수석 분석가 Cai Minghan은 현재 대만 주식에 대한 가장 큰 압력의 원인은 여전히 ​​​​미국 기술주의 급격한 변동이라고 지적했습니다. 다음 주에 시장이 일시적으로 반등할 수도 있지만, 단기적으로 완전히 안정되려면 아직 시간이 좀 걸릴 수 있습니다."},{"s":"미국 증시, 급락 후 반전? 월스트리트 투자은행, 헐값 사냥 요구, S&P 연말 목표주가 노출 - 국제","so":"工商時報","tm":"11/08 11:41","c":1,"r":"tw","u":"https://www.ctee.com.tw/news/20261108700329-430702","p":1794105660,"a":1794109980,"t":"美股暴跌後反轉？華爾街投行喊抄底標普年底目標價曝光- 國際","su":"미국 중간선거에서 민주당이 승리하면서 AI 데이터센터 규제와 거대 기술기업의 자본지출 감소에 대한 시장의 우려가 촉발됐다. 미국 기술주가 극심한 매도세를 보였습니다. 지난 목요일(5일) S&P 500 지수는 하루 만에 4.4%, 나스닥 100 지수는 6.4% 급락했다. 하루 만에 시장 가치가 3조 달러 이상 증발했습니다. 그러나 이런 엄청난 조정의 물결에도 월스트리트의 주요 투자기관들은 완전히 마이너스로 전환하지 않고 오히려 바닥매수 신호를 잇달아 내놨다. 이번엔 미국 증시가 무겁다…"},{"s":"\"손절하고 도망쳐?\" 괴로운 개미들…美 물가·코어위브 실적 주목하라는데 - 머니투데이","so":"머니투데이","tm":"11/08 11:34","c":1,"r":"kr","u":"https://www.mt.co.kr/stock/2026/11/08/2026110811240385851","p":1794105273,"a":1794145920,"su":"블루웨이브 여진이 남아있는 상황에서 증시에 영향을 줄 수 있는 AI 기업 실적 발표, 미국 물가 지표 등에 시장의 관심이 쏠리고 있다. 지난주 AI 수익성 논란이 커진 상황에서 미국 중간선거 결과 민주당이 승리하며 AI주 투자심리가 악화했다."},{"s":"미국 증시 급락, 아시아 증시도 뒤따르며 급락 후 '주항매입펀드' 투자 기회 밝아","so":"經濟日報","tm":"11/08 11:33","c":1,"r":"hk","u":"https://money.udn.com/money/story/5607/9864675","p":1794105236,"a":1794109980,"t":"美股暴跌、亞股跟殺 「鉅亨買基金」揭急跌後投資機會","su":"11월 5일 미국 증시는 극심한 매도 압력을 받았습니다. 나스닥 지수는 5.5%, 필라델피아 반도체 지수는 12.3% 급락했습니다. 패닉은 빠르게 아시아로 퍼졌다. 지난 6일 대만, 일본, 한국 증시가 동시에 폭락하면서 글로벌 기술주들이 심각한 시험대에 올랐다. AI 투자 붐, 과연 바뀔 것인가? '주행바이펀드'는 미국 중간선거 이후 AI 규제에 대한 우려가 시장 신뢰도에 영향을 미친 것은 사실이지만 주가가 전반적으로 하락했다고 해서 기업 이익이 동시에 악화된 것은 아니라고 지적했다. 최근 재무 보고서에 따르면 미국 기업 이익은 여전히 ​​28% 크게 증가했는데, 이는 시장의 비관론과 뚜렷한 대조를 이룹니다. 투자자들은 단기적인 패닉과 펀더멘털의 변화를 구분해야 하며, 주식시장 급락으로 인해 성급하게 빠져나가서는 안 된다."},{"s":"\"취임식 끝나면 만납시다\"…미 중간선거가 데이터센터에 던진 숙제 [취재파일]","so":"SBS 뉴스","tm":"11/08 11:17","c":1,"r":"kr","u":"https://news.sbs.co.kr/news/endPage.do?news_id=N1008835796","p":1794104235,"a":1794109980,"su":"그 팻말의 바람은 이틀 뒤 투표함에서 현실이 됐습니다. 지난 3일 치러진 중간선거에서 민주당은 연방 상·하원 다수당을 모두 차지했습니다. 주지사 당선인 36명 가운데 34명이 데이터센터 규제를 하나 이상 지지했습니다."},{"s":"버크셔는 3분기 영업이익이 6% 감소함에 따라 새 CEO 그렉 아벨(Greg Abel) 아래 자사주 매입을 늘렸습니다.","so":"The Business Times","tm":"11/08 10:53","c":1,"r":"sg","u":"https://www.businesstimes.com.sg/companies-markets/berkshire-ramps-buybacks-under-new-ceo-greg-abel-q3-operating-profit-falls-6","p":1794102780,"a":1794148466,"t":"Berkshire ramps up buybacks under new CEO Greg Abel as Q3 operating profit falls 6%","su":"버크셔는 7월과 9월 사이에 96억 달러 규모의 자사주를 매입했다고 밝혔습니다. The Business Times에서 자세히 알아보세요."},{"s":"중간선거는 AI 열풍의 마지막 지푸라기에 불과할까? JP Morgan은 순환 자금 조달 위험을 밝힙니다.","so":"鉅亨網","tm":"11/08 10:40","c":1,"r":"tw","u":"https://news.cnyes.com/news/id/6652032","p":1794102005,"a":1794128040,"t":"期中選舉只是AI熱潮最後一根稻草？摩根大通揭循環融資風險","su":"미국 중간선거 이후 AI 붐의 구조적 리스크가 대두됐다. 나스닥과 S&P 500이 동시에 급락했고, 기술펀드는 올해 상승세를 반납했다.\nJ.P. Morgan Adler는 대규모 클라우드 기업이 외부 자금 조달로 전환하고 있으며 AI 순환 자금 조달 및 공급망 위험을 더 이상 무시하기 쉽지 않다고 경고했습니다.\nAI 공급망이 매각되고 헤지펀드가 압박을 받고 있다. 그러나 타일러는 AI 투자의 냉각이 GDP를 하락시킬 뿐 경기침체를 촉발하지 않을 수 있다고 말했다."},{"s":"투자자들이 주택 건설업자에게 희망을 찾는 이유","so":"WSJ","tm":"11/08 10:02","c":1,"r":"us","u":"https://www.wsj.com/finance/stocks/why-investors-are-searching-for-hope-in-home-builders-07a525bd","p":1794099764,"a":1794109980,"t":"Why Investors Are Searching for Hope in Home Builders"},{"s":"블루쓰나미 후폭풍…TIGER 미국S&P500, 국내 1위 ETF 등극","so":"한국경제","tm":"11/08 09:35","c":1,"r":"kr","u":"https://www.hankyung.com/article/202611061620i","p":1794098152,"a":1794109980,"su":"- 기사 스크랩 - 댓글 - 공유 - 글자크기 - 프린트 Google 검색에서 한국경제 기사를 더 자주 볼 수 있습니다. 미국 선거 이후 AI 데이터센터 투자 둔화 우려로 국내 반도체주와 코스피가 급락하면서, 'TIGER 미국S&P500' ETF가 'KODEX 200'을 제치고 국내 ETF 순자산 1위를 차지했습니다. 한경 프리미엄9의 모든 콘텐츠는 한국경제신문의 저작물로 저작권법의 보호를 받습니다."},{"s":"시장이 중간 선거 결과를 기다리면서 미국 주식은 오전 거래에서 혼조세를 보였습니다.","so":"經濟日報","tm":"11/08 09:30","c":1,"r":"tw","u":"https://money.udn.com/money/story/123398/9855581","p":1794097832,"a":1794109980,"t":"市場靜待期中選舉結果 美股早盤漲跌 화로 위치를 추적한 결과 그가 태국 방콕에 있는 것으로 확인됐다. 그러다가 그는 밀수꾼 단체로부터 20만 위안에서 60만 위안 사이의 몸값을 요구하는 메시지를 받았다. 이제 가난에서 탈출한 또 다른 사람은 미얀마 공원에서 수상한 십대의 모습을 봤다며 어머니를 걱정하게 만들고 관련 부서에서 사람들을 구출할 수 있기를 바란다고 말했습니다."},{"s":"Li Sichuan은 Lao Fu의 법률에 반대 서명하지 않은 Zhuo Rongtai를 비난했습니다. Su Qiaohui는 이를 강제로 통과시키는 것은 위헌이라고 말했습니다.","so":"公視新聞","tm":"11/08 20:06","c":1,"r":"tw","u":"https://news.pts.org.tw/article/834807","p":1794136001,"a":1794148492,"t":"李四川批卓榮泰不副署老福法 蘇巧慧稱強行通過違憲","su":"9대 1 총선이 막바지에 접어들면서 곳곳에서 총리 선거에도 연기가 피어오르고 있다. 신베이시 국민당 리 쓰촨(Li Sichuan) 인민당 주석과 황궈창(Huang Guochang) 인민당 주석이 다시 한 번 연합하여 청백의 기세를 만들어냈습니다. DPP Su Qiaohui는 오늘 밤 Xiao Meiqin 부주석에게 투표 통합을 도와달라고 요청할 것입니다. 그러나 Zhuo Rongtai 행정주석은 노인복지법 개정안에 반대 서명하지 않았습니다. Li Sichuan은 Zhuo Rongtai에게 말을 할 수 없다고 Su Qiaohui를 비난했습니다. 두 사람 모두 신베이시 원로들에게 사과해야 합니다. 쑤차오후이는 이에 맞서 법안이 위헌적으로 통과되도록 강요하고 거버넌스를 몰아내며 예산 논의가 헌법 정신으로 돌아갈 것을 촉구했습니다."},{"s":"침대 센서 시스템의 개발 PM【후지사와】◆대형 종합 부품 메이커/연봉 1,000만엔～","so":"日経転職版","tm":"11/08 18:20","c":1,"r":"jp","u":"https://career.nikkei.com/agent/170/jobdetail5420406/","p":1794129621,"a":1794148486,"t":"ベッドセンサーシステムの開発PM【藤沢】◆大手総合部品メーカー／年収1,000万円～"},{"s":"칫솔은 상자에 넣어도 괜찮나요? 전문가들이 밝히는 \"3가지 규칙\": 최대 1개월 동안 휴대용 칫솔을 사용하세요 - 국제","so":"中時新聞網","tm":"11/08 18:01","c":1,"r":"tw","u":"https://www.chinatimes.com/realtimenews/20261108002190-260408","p":1794128467,"a":1794148494,"t":"牙刷放進盒子就沒事？專家揭「3大守則」 攜帶型牙刷最多用1個月- 國際","su":"휴대가 간편한 칫솔로 이동 중에 사용할 때나 직장에서 점심 식사 후 이를 닦을 때 매우 실용적입니다. 그런데 이런 종류의 칫솔을 제대로 세척하고 있나요? 어떤 사람들은 집에서 사용하는 칫솔을 정기적으로 바꾸지만, 휴대용 칫솔은 자주 사용하지 않고 더 오래 사용할 수 있다고 생각합니다. 일본 마이니치방송(MBS) 투데이"},{"s":"투자 넘어 수주·양산으로…LFP 양극재 사업화 속도","so":"이투데이","tm":"11/08 17:34","c":1,"r":"kr","u":"https://www.etoday.co.kr/news/view/2645037","p":1794126840,"a":1794128040,"su":"엘앤에프, 국내 셀 3사 고객사 확보…9월부터 양산포스코퓨처엠, 기존 설비 전환·전용공장 건설 병행북미 ESS 성장에 비중국산 소재 확보 수요 확대▲엘"},{"s":"금주의 사건/행정부는 '노인복지법'에 반대하지 않고 민주당이 미국 중간선거에서 승리(2026.11.2~11.8)","so":"公視新聞","tm":"11/08 17:13","c":1,"r":"tw","u":"https://news.pts.org.tw/article/834805","p":1794125585,"a":1794128040,"t":"一週大事／行政院不副署《老人福利法》 美期中選舉民主黨勝選（2026.11.2-11.8）","su":"\"PSTV 뉴스 네트워크\"는 이번 주 국내외 주요 행사를 선정해 드립니다. 초점은 다음과 같습니다: 정치 위안부가 \"노인복지법\" 개정안에 반대 서명하지 않음, 두 번째 F-16V 전투기가 대만에 도착함, Gao Jin Sumei가 공산당 간첩 사건에 연루되어 기소되어 14년 형을 선고받았음, 대만 주식 시장이 시장에서 최대 하락세를 기록함, Yongfeng 은행 계좌가 해킹됨, 대만 64호선 패킷 손실 사건의 운전사가 형을 선고받았음. 13년 만에 미국 중간선거에서 민주당이 승리했다."},{"s":"9년 전 산시성(陝西省)에서 호주로 가던 음식 배달 기사가 노숙자에게 칼에 찔려 사망했다. 중국 커뮤니티는 충격을 받았습니다 | 본토 팩스 | 양안","so":"UDN","tm":"11/08 16:57","c":1,"r":"tw","u":"https://udn.com/news/story/7332/9864712?from=udn-catelistnews_ch2","p":1794124641,"a":1794128040,"t":"9年前從陝西赴澳洲外賣騎手被流浪漢捅死華人圈震驚| 大陸傳真| 兩岸","su":"중국 음식 배달 기사 펑젠밍(47)씨가 호주 멜버른에서 음식을 배달하던 중 51세 노숙자에게 칼을 찔려 숨진 혐의를 받고 있다. 이번 사건은 국내외 중국인 커뮤니티를 충격에 빠뜨렸다. 많은 현지 중국인들이 고인을 추모하며 꽃을 바쳤습니다. 멜버른 주재 중국 총영사관은 호주가 이번 사건에 대해 철저한 조사를 실시하고 엄중히 처벌할 것을 요구했다. 사건이 발생한 빅토리아 주지사도 충격을 표하며 살인범을 엄중히 처벌할 것이라고 말했다. Feng Nan은 중국에 있는 가족의 생계를 유지하기 위해 호주에서 9년 동안 열심히 일했습니다. 그는 아침부터 밤까지 음식을 배달하는 일을 한다. 지역 상점에서는 모금 행사를 시작했습니다. 한 점원은 너무 겁에 질려 현지 치안 환경이 불안하다며 중국으로 돌아가기 위해 밤새 비행기표를 샀다."},{"s":"이스라엘 대통령, 야당 지도자 아이센코트에게 정부 구성 승인 발표","so":"公視新聞","tm":"11/08 14:23","c":1,"r":"tw","u":"https://news.pts.org.tw/article/834797","p":1794115412,"a":1794128040,"t":"以色列總統宣布 授權反對派領袖艾森科特組閣","su":"이스라엘 총선 이후 여당은 과반수 확보 없이 교착상태에 빠졌다. 헤르조그 현 이스라엘 대통령은 지난 7일 새 정부 구성을 위해 전 참모총장인 야당 지도자 아이젠코트에게 우선권을 주겠다고 공식 발표했다. 네타냐후 총리는 즉각 긴급성명을 발표해 연립정부 수립을 촉구하고, 야당이 정부를 구성하면 국가안보를 위협할 것이라고 경고했다."},{"s":"일본의 새로운 세금 환급 시스템 | 새로운 절차는 아직 조정이 필요합니다. 최종 세금 환급금이 현금으로 손실되어 승객이 불만을 나타냄","so":"Now 新聞","tm":"11/08 14:18","c":1,"r":"hk","u":"https://news.now.com/home/international/player?newsId=668776","p":1794115118,"a":1794128040,"t":"日本退稅新制｜新手續尚待適應 旅客不滿現金退稅蝕尾數","su":"[나우뉴스채널] 일본의 새로운 세금환급 제도가 시행된 지 일주일이 지났지만 여권, 신용카드 인증 실패 등 운영상의 문제가 여전히 많다. 많은 관광객들은 새로운 시스템 하에서 높은 처리 수수료와 나머지 금액에서 현금 환불이 차감된다는 사실에 불만을 갖고 있습니다."},{"s":"COP31明登場 環境部將舉辦系列論壇","so":"自由時報","tm":"11/08 14:11","c":1,"r":"tw","u":"https://news.ltn.com.tw/news/life/breakingnews/5633488","p":1794114706,"a":1794177868,"su":"COP31將於明天登場，環境部將同步啟動「氣候脈動．台灣同行」系列論壇，每場論壇將特別安排COP31現場快報，將自土耳其連線傳回最新動態，以讓國人掌握最新情報，將國際氣候議題實質轉化為國內政策與產業轉型契機。2026年第31屆聯合國氣候變化綱要公約締約方大會 （UNFCCC COP31） 將於9日至20日在土耳其安塔利亞舉行，環境部表示，今年COP31將以「從承諾走向落實」為核心，推動各國執行國家自定貢獻，並提出2035年量化目標，包括全球電氣化比例達35%；全球廢棄物產生量的成長幅度減半；建築部門能源消耗密集度至少降低25%。"},{"s":"타이중에서 SUV 차량 운전자가 정지하지 않아 사고를 냈습니다. 한 여성이 줄을 건너던 중 부상을 입어 심각한 부상을 입어 사망했습니다.","so":"公視新聞","tm":"11/08 14:09","c":1,"r":"tw","u":"https://news.pts.org.tw/article/834798","p":1794114594,"a":1794128040,"t":"台中休旅車駕駛未停讓肇事 婦人行穿線遭輾傷重不治","su":"어제(7일) 저녁 6시쯤, 타이중시 시툰구에서 치명적인 교통사고가 발생했습니다. 61세 여성이 횡단보도를 건너다가 신호등이 녹색으로 바뀌자 좌회전하는 SUV 차량에 치였습니다. 운전자도 눈치 채지 못한 것 같습니다. 그 결과 앞바퀴와 뒷바퀴가 차례로 여성을 덮쳐 심각한 부상을 입어 사망했다. 경찰 예비 조사 결과, 운전자의 음주 및 약물 검사에서는 이상이 없는 것으로 나타났으며, 자세한 사고 원인은 아직 밝혀지지 않았다."},{"s":"펑지아 야시장에서 한 관광객의 배낭에 불이 붙었고, 모바일 전원 공급 장치의 리튬 배터리가 사고 원인으로 의심됩니다.","so":"公視新聞","tm":"11/08 14:06","c":1,"r":"tw","u":"https://news.pts.org.tw/article/834799","p":1794114387,"a":1794128040,"t":"逢甲夜市遊客背包起火 疑行動電源鋰電池肇禍","su":"타이중 펑지아 야시장에서는 어젯밤(7일) 한 관광객의 배낭에 불이 붙었는데, 내부에 있던 리튬 배터리가 불탔던 것으로 의심됩니다. 다행히 인근 상인이 공용 건조분말소화기를 가져와 진화에 성공해 인명피해는 없었다. 그러나 일부 전문가들은 건조 분말 소화기가 리튬 배터리나 이동식 전원 공급 장치로 인한 화재를 진압하는 데 적합하지 않다는 점을 상기시킵니다. 연소열을 중화시키기 위해 다량의 물을 사용하는 것이 화재를 진압하는 데 더 적절한 방법입니다."},{"s":"가오슝 냐오송 양철집 화재, 두 형제 탈출 전 사망","so":"公視新聞","tm":"11/08 14:04","c":1,"r":"tw","u":"https://news.pts.org.tw/article/834800","p":1794114240,"a":1794148496,"t":"高雄鳥松鐵皮屋民宅火警 2兄弟逃生不及身亡","su":"가오슝시 냐오송구 중청로의 한 주택에서 화재가 발생했습니다. 불은 삽시간에 옆집 다경간 철제 건물까지 번졌다. 그 결과 왕아무개(19세, 17세) 형제 2명이 금속 건물 2층에 갇혀 탈출할 시간도 없이 불동굴에서 사망했다. 8일 이른 아침에도 링야구 5층 티안추 빌딩에서 화재가 발생했다. 건물 전체가 임대아파트였기 때문에 여러 세입자가 한꺼번에 갇혔습니다. 경찰이 도착한 뒤 13명이 대피했고, 이 중 11명은 질식 등 신체적 불편을 호소해 병원으로 이송됐다."},{"s":"레독스 플로우 전지는 왜 장시간 방전을 향하는가――탱크를 크게 하면 용량이 늘어나는 발상을 해독하는 웨비나를 개최","so":"時事ドットコム","tm":"11/08 13:10","c":1,"r":"jp","u":"https://www.jiji.com/jc/article?k=000000090.000181124&g=prt","p":1794111000,"a":1794148488,"t":"レドックスフロー電池はなぜ長時間放電に向くのか――タンクを大きくすれば容量が増える発想を読み解くウェビナーを開催","su":"[재팬 브랜딩 주식회사]~홋카이도·미나미하야시 변전소에서 출력 1.5만 kW·용량 6만 kWh, 1년 경과 후에도 현저한 열화 없음. 출력과 용량을 따로 설계할 수 있는 특성을, 재팬 브랜딩 대표·마에다 유요시가 해설~축전 시스템의 기획·설계로부터 운영까지를 다루는 재팬 브랜딩 주식회사(본점:아이치현 이누야마시, 대표 이사:마에다 유요시, 이하 “당사”)는, GUS Technology(격대과기) 축전지의 일본 총대리점으로서 재생가능에너지의 보급에 따라 도입이 급증하는 「계통용 축전지」를 테마로 한 웨비나를, 20…"},{"s":"칠레 도로서 버스·트럭 충돌해 12명 사망","so":"公視新聞","tm":"11/08 12:00","c":1,"r":"tw","u":"https://news.pts.org.tw/article/834787","p":1794106849,"a":1794148498,"t":"智利公路車禍 巴士與貨車相撞已知12死","su":"칠레 교통사고: 버스와 트럭이 충돌해 12명이 사망. 출시 시간: 업데이트 시간: 칠레 중부 발파라이소 지역에서 심각한 교통사고가 발생해 최소 12명이 사망했습니다. 이번 대형 교통사고는 토요일 오전 9시경 산토도밍고 고속도로에서 발생했습니다. 여성과 어린이를 태운 버스가 트럭과 정면으로 충돌했고, 승용차도 피해를 입었습니다. 충돌한 두 차량의 앞부분은 심하게 변형되고 손상되었습니다. 현재 병원에서는 부상자 15명이 치료를 받고 있다. 사고 이후 당국은 사고 원인을 조사하는 동안 해당 구간의 통행을 중단했다. 우시찬/편집자"},{"s":"호주 열대 과일은 시장 수요를 공급하기 위해 남쪽으로 운송됩니다. 소셜 미디어가 구매 심리를 높인다","so":"公視新聞","tm":"11/08 11:58","c":1,"r":"tw","u":"https://news.pts.org.tw/article/834778","p":1794106696,"a":1794148500,"t":"澳洲熱帶水果南運供應市場需求 社群媒體助漲買氣","su":"잭프루트, 망고스틴과 같은 열대 과일은 주로 호주 퀸즈랜드 북부에서 재배되었습니다. 이제 그들은 주요 도시의 시장에 진출했습니다. 고향의 맛을 찾아 떠나는 이민자들에 더해, 커뮤니티에 올라온 짧은 영상의 도움으로 많은 사람들이 구매하고 맛보게 되면서 열대과일의 인기가 뜨겁게 달아오르고 있다."},{"s":"그만 물어보세요! 비행기를 탈 때 '1가지 요구 사항', 승무원이 정말 도와줄 수 없는 3가지 팁 - Life","so":"中時新聞網","tm":"11/08 11:41","c":1,"r":"tw","u":"https://www.chinatimes.com/realtimenews/20261108001098-260405","p":1794105698,"a":1794109980,"t":"別再問了！搭飛機「1要求」空姐真幫不了3招自救- 生活","su":"너무 춥거나 더운 기내에서 비행할 때 많은 승객들이 승무원에게 온도를 조절할 수 있는지 문의하지만 실제로 승무원이 할 수 있는 일은 없습니다. 한 고위 승무원은 모든 승객이 기내 온도에서 편안함을 느끼기는 어렵다고 말했습니다. 승객들은 추위를 두려워하기 때문에 기내 온도 변화에 따라 쉽게 옷을 추가하거나 벗을 수 있도록 탑승 시 양파 스타일의 옷을 입는 것이 좋습니다."},{"s":"J.P. Morgan, Contemporary Amperex Technology Co., Limited Class H(3750)에 대한 보유 등급 유지","so":"The Globe and Mail","tm":"11/08 10:38","c":1,"r":"us","u":"https://www.theglobeandmail.com/investing/markets/markets-news/Tipranks/8722089/j-p-morgan-sticks-to-their-hold-rating-for-contemporary-amperex-technology-co-limited-class-h-3750/","p":1794101894,"a":1794109980,"t":"J.P. Morgan Sticks to Thei 적 협력을 체결했습니다. 태국 촌부리에서 열린 Zhida Technology 기자간담회. 이번 기자간담회에는 인도네시아, 말레이시아, 라오스, 스리랑카, 캄보디아 및 기타 동남아시아 및 중동 국가의 고객과 파트너가 참석했습니다. 회사는 시나리오 솔루션과 신제품 출시를 위해 태국을 선택한 것은 태국을 깊이 육성하고 현지 녹색 에너지 전환에 봉사하겠다는 의지를 반영한다고 밝혔습니다. Zhida는 보다 완벽한 제품 매트릭스와 \"가정 + 공공\" 전체 시나리오 적용 범위 기능을 통해 현지 가족, 운영자, 공원 및 상업 단체를 위한 통합 녹색 에너지 솔루션을 제공하고 더 많은 파트너와 협력하여 태국의 녹색 여행 생태계를 구축할 것입니다. 태국 최초의 전문 충전 파일 공장으로 이중 카테고리 시장 점유율 1위를 차지했습니다. Zhida의 태국 현지 레이아웃은 2022년부터 시작됩니다. 중국과 태국의 신에너지 산업 간의 시너지를 배경으로 Zhida는 태국을 최초의 종합 해외 목적지로 만들 것입니다."},{"s":"SNE리서치: 중국 OEM이 글로벌 EV 배터리 시장 장악","so":"electrive.com","tm":"11/06 22:30","c":1,"r":"us","u":"https://www.electrive.com/2026/11/06/sne-research-chinese-oems-increasingly-dominate-global-ev-battery-market/","p":1793971800,"a":1793974680,"t":"SNE Research: Chinese OEMs increasingly dominate global EV battery market","su":"올해 첫 9개월 동안 중국 제조업체는 중국 이외의 전기 및 하이브리드 차량용 배터리 시장의 절반 이상을 확보했습니다."},{"s":"닝더타임스 03750 샤오미 01810 ｜ 대가족들은 추세를 거스르고 2억 상당의 물품을 구입하여 베이수이와 철수 및 유통 경쟁을 벌였다 | 홍콩경제신문","so":"香港經濟日報HKET","tm":"11/06 20:17","c":1,"r":"hk","u":"https://invest.hket.com/article/4218872/01810-xiaomi-03750-catl-northbound-capital-flow","p":1793963820,"a":1793974680,"t":"寧德時代03750小米01810 ｜ 大戶逆勢掃貨2億對決北水撤退派發|香港經濟日報"},{"s":"현대 아틀라스에 삼성SDI 배터리 70개 탑재","so":"디일렉","tm":"11/06 19:32","c":1,"r":"kr","u":"https://www.thelec.kr/news/articleView.html?idxno=65065","p":1793961162,"a":1794007140,"su":"삼성SDI가 현대차그룹의 로봇 전문 계열사 보스턴 다이내믹스의 휴머노이드 로봇 '아틀라스'에 배터리를 공급한다. LG에너지솔루션과 함께 공급하지만, 물량이 많지"},{"s":"[홍콩증시 마감] 항셍지수 315포인트 하락, 5연속 상승세 중단","so":"Now 新聞","tm":"11/06 18:14","c":1,"r":"hk","u":"https://news.now.com/home/finance/player?newsId=668614","p":1793956463,"a":1794041640,"t":"【港股收市】恒指跌315點 5連升斷纜","su":"죄송합니다. 사용 중인 브라우저는 지원되지 않습니다. 최상의 시청 환경을 위해 최신 브라우저 버전으로 업데이트하시기 바랍니다. 질문이 있으시면 pccwmediaiapps@pccw.com으로 이메일을 보내주세요. [나우 뉴스 채널] 외부 주식시장은 급락했고 홍콩 증시는 5일간의 상승세를 마감했으며 항셍지수는 300포인트 이상 하락했습니다. 항셍지수는 392포인트 하락하며 무려 447포인트 하락한 24,349포인트로 마감했다. 이후 추세는 개선됐고 하락폭도 수십 포인트로 좁혀졌다. 그러나 여전히 315포인트 하락한 24,481포인 :"hk","u":"https://inews.hket.com/article/4221573/%E3%80%90SPCX%E3%80%91SpaceX%E6%98%9F%E8%89%A6%E7%AC%AC15%E6%AC%A1%E8%A9%A6%E9%A3%9B%E6%9C%AC%E5%91%A8%E4%BA%94%E5%8D%87%E7%A9%BA%E3%80%80%E9%A6%96%E5%BA%A6%E6%B8%AC%E8%A9%A6%E3%80%8C%E7%AD%B7%E5%AD%90%E3%80%8D%E5%A4%BE%E5%9B%9E%E6%95%B4%E5%A5%97%E7%81%AB%E7%AE%AD?mtc=20033","p":1794111161,"a":1794128040,"t":"【SPCX】SpaceX星艦第15次試飛本周五升空 首度測試「筷子」夾回整套火箭"},{"s":"'켄텍 총장 선임, 공공기관 이전'…신정훈, 지역 현안 건의","so":"뉴시스","tm":"11/08 11:45","c":1,"r":"kr","u":"https://mobile.newsis.com/view_amp.html?ar_id=NISX20261108_0003859269","p":1794105922,"a":1794128040,"su":"[나주·화순=뉴시스]이창우 기자 = 신정훈 더불어민주당 의원(전남광주 나주·화순)이 한국에너지공과대학교(켄텍·KENTECH) 정상화와 나주 에너지산업 기반 확충, 공공기관 이전을 통한 전남광주 성장거점 구축을 위해 청와대와 당 지도부를 잇달아 찾았다"},{"s":"“코스피 5000도 위태롭다”…4500선 추락 가능성까지 경고","so":"전자신문","tm":"11/08 11:40","c":1,"r":"kr","u":"https://www.etnews.com/20261108000033","p":1794105600,"a":1794109980},{"s":"1주 배포 | AI에 대한 미국 민주당의 입장이 핵심이며 본토는 블록버스터 데이터를 다수 공개합니다.","so":"etnet 經濟通","tm":"11/08 11:30","c":1,"r":"hk","u":"https://www.etnet.com.hk/www/tc/news/news-article.php?section=features&category=financenews&newsid=415792","p":1794105000,"a":1794109980,"t":"一周部署 | 美民主黨對AI取態成關鍵，內地公布多項重磅數據","su":"주간 배포 | AI에 대한 미국 민주당의 입장이 핵심인데, 본토에서는 블록버스터급 데이터를 대거 공개했다. \"주간 배포\" 다음 주에 주목해야 할 금융 이벤트: 고용 데이터는 다음 달 미국 준비은행의 금리 인상을 지원하기 위해 상향 조정되었습니다. 미국은 10월 신규 비농업 고용이 예상 6만5000명을 크게 웃도는 16만5000명에 달했다고 발표했다. 더 중요한 것은 8월과 9월을 합친 데이터가 최대 84,000명으로 크게 수정되었다는 점입니다(이 중 9월은 원래 매우 낮은 수치인 29,000명에서 60,000명으로 수정되었습니다). 이는 기업의 최근 채용 노력이 이전에 평가했던 것보다 더 탄력적임을 나타냅니다. 최근 실업률도 4.1%로 예상이나 이전 수치보다 낮다. 일자리 증가는 주로 전문 및 비즈니스 서비스 산업과 의료 산업이 주도했으며 AI 인프라 및 데이터 센터 구축이 주도했습니다. 컴퓨터 및 전자제품 제조업이 4년 만에 월간 최대 성장률을 기록했다. 이 데이터는 연준이 12월에 금리를 인상할 것이라는 시장의 강력한 베팅을 다시 불러일으켰습니다. 미국 채권수익률이 전반적으로 상승했고, 달러지수 역시 강한 반등세를 기록했다. 금리선물시장에서는 다음 달 금리 인상 확률이 75%를 넘는 것으로 나타났다. 다음에 발표되는 소비자물가지수(CPI)에서 인플레이션이 다시 가속세를 보이고 있는 것으로 나타나면 시장은 추가 금리 인상을 예상할 수밖에 없을 것이며, 이는 조정권에 진입한 미국 증시에 하락 압력을 더 가중시킬 수 있다."},{"s":"AI넷제로/COP31, 환경부 출석해 정보 파악 포럼 동시 개최 | 삶","so":"中央社 CNA","tm":"11/08 11:16","c":1,"r":"tw","u":"https://www.cna.com.tw/news/ahel/202611080023.aspx","p":1794104160,"a":1794109980,"t":"AI淨零／COP31將登場環境部同步啟動論壇掌握資訊| 生活","su":"COP31이 내일 공식적으로 데뷔합니다. 환경부는 회의 기간 동안 일련의 포럼이 시작될 것이라고 밝혔습니다. 국제 기후 문제의 본질은 실시간 정보 파악은 물론, 국내 정책과 산업 변혁의 기회로도 전환될 것입니다."},{"s":"Yantian에서 Lantian까지 학교 교장은 토지에 있습니다 | 잡지","so":"UDN","tm":"11/08 11:14","c":1,"r":"tw","u":"https://udn.com/news/story/6966/9857372","p":1794104062,"a":1794109980,"t":"從鹽田到藍田一所學校長在土地上| 雜誌","su":"인터뷰 당일, 벽이 없는 캠퍼스를 한눈에 살펴보면 사파이어 블루색의 운동장이 눈에 띄었다. 학교에 도착을 알리기 전, 사진가는 학교 가장자리 분리섬에 서서 운동장에서 아이들의 활동을 촬영할 준비를 하고 있었다. 뜻밖에도 그가 가만히 서있자마자 바로 경보음이 울렸고, 보안요원들이 곧바로 도착했다. 겉보기에 개방적인 캠퍼스에는 실제로 언제든지 활성화될 수 있는 일련의 안전 보호 메커니즘이 숨겨져 있는 것으로 밝혀졌습니다."},{"s":"우리은행, 한국형 녹색채권 발행 우수기업 선정…시중은행 최대 규모","so":"뉴스핌","tm":"11/08 10:00","c":1,"r":"kr","u":"https://www.newspim.com/news/view/20261106001188","p":1794099600,"a":1794109980,"su":"[서울=뉴스핌] 박가연 기자 = 우리은행이 '2026년 녹색금융 우수기업 시상식'에서 민간부문 한국형 녹색채권 발행 우수기업으로 선정돼 기후에너지환경부 장관상을 받았다. 지난 5일 열린 '2026년 녹색금융 우수기업 시상식'에서 오일영 기후에너지환경부 정책실장(왼쪽)과 김홍익 우리은행 본부장(오른쪽)이 기후에너지환경부 장관상 수상 후 기념촬영을 하고 있다. 우리은행은 올해 시중은행 최대 규모인 3000억원의 한국형 녹색채권을 발행하는 등 녹색금융 활성화에 기여한 공로를 인정받았다."},{"s":"배터리 열폭주·데이터센터 마비…신산업 화재 경고[내일을 지키는 안전망②]","so":"뉴시스","tm":"11/08 10:00","c":1,"r":"kr","u":"https://mobile.newsis.com/view_amp.html?ar_id=NISX20261106_0003858695","p":1794099600,"a":1794109980,"su":"[서울=뉴시스]권안나 기자 = 전기차와 에너지저장장치(ESS), 데이터센터 등 신산업 시설이 빠르게 발전하면서 화재 안전관리의 중요성도 높이지고 있다"},{"s":"[SPCX] 머스크는 스페이스X의 연간 매출이 내년 말까지 5000억 달러를 초과할 것으로 예상하고 있습니다. 내년 발사 예정 우주 AI 컴퓨터 칩 생산능력 목표는 전 세계 30배","so":"香港經濟日報HKET","tm":"11/08 06:16","c":1,"r":"hk","u":"https://inews.hket.com/article/4221561/%E3%80%90SPCX%E3%80%91%E9%A6%AC%E6%96%AF%E5%85%8B%E6%96%99SpaceX%E6%98%8E%E5%B9%B4%E5%BA%95%E5%B9%B4%E5%8C%96%E6%94%B6%E5%85%A5%E7%A0%B45000%E5%84%84%E7%BE%8E%E5%85%83%E3%80%80%E5%A4%AA%E7%A9%BAAI%E9%9B%BB%E8%85%A6%E6%98%8E%E5%B9%B4%E7%99%BC%E5%B0%84%E3%80%80%E8%8A%AF%E7%89%87%E7%94%A2%E8%83%BD%E7%9B%A 對仍續建數據中心"},{"s":"항셍지수 야간 세션丨은 165포인트 상승한 24647에 마감되었습니다.","so":"信報網站","tm":"11/07 04:42","c":1,"r":"hk","u":"https://www.hkej.com/instantnews/stock/article/4560615/%E6%81%92%E6%8C%87%E5%A4%9C%E6%9C%9F%E4%B8%A8%E6%94%B6%E5%A0%B124647+%E9%AB%98%E6%B0%B4165%E9%BB%9E","p":1793994132,"a":1794007140,"t":"恒指夜期丨收報24647 高水165點","su":"항셍 지수 선물은 야시장에서 24,647포인트로 마감했는데, 이는 어제 종가 24,481포인트보다 165포인트 높은 148포인트 상승한 수치이며, 21,168계약이 거래되었습니다. 전국지수선물은 야시장에서 어제 종가보다 57포인트 오른 8,331포인트에 마감했다. 현물 선물 지수에 대한 자세한 내용은 \"홍콩 주식 360\" 선물 지수 페이지를 참조하세요."},{"s":"UBS는 국내 은행에 대해 낙관적이며 주요 국영은행을 선호한다. 순이자마진은 안정적이며, 이익과 배당금도 증가할 것으로 예상됩니다.","so":"信報網站","tm":"11/07 04:38","c":1,"r":"hk","u":"https://www.hkej.com/dailynews/finnews/article/4560152/%E7%91%9E%E9%8A%80%E7%9C%8B%E5%A5%BD%E5%85%A7%E9%8A%80+%E9%A6%96%E9%81%B8%E5%9C%8B%E6%9C%89%E5%A4%A7%E8%A1%8C","p":1793993924,"a":1794007140,"t":"瑞銀看好內銀 首選國有大行淨息差穩定 利潤及派息料齊升","su":"많은 대형 본토 은행들이 앞서 3분기 실적을 발표했습니다. UBS의 아시아 금융산업 연구 책임자인 Yan Meizhi는 본토 은행주에 대해 계속해서 낙관적인 입장을 취하고 있습니다. 그는 순이자 마진이 안정적으로 유지되는 동시에 수익 증가로 이익과 배당금이 증가할 것으로 기대하고 있습니다. 주가순자산비율(P⁄B)은 현재 평균 0.6배에서 0.8배로 상승할 것으로 예상된다. 그 중에서도 대형 국책은행을 선호하는 이유는 기업 대출 사업이 빠르게 성장하고 있기 때문이다. 시가총액비율은 0.8배까지 상승할 것으로 예상된다. Yan Meizhi는 올해 은행의 순이자 마진이 안정되었다고 언급했는데, 이는 주로 3년 만기 예금이 많이 만기되어 주요 은행 예금 비용이 감소했기 때문이라고 말했습니다. 내년에는 만기규모가 줄어들겠지만 이자지급비용은 여전히 ​​감소할 것으로 보인다."},{"s":"대만시멘트, 재건축 사업 기회 모색 위해 COP31 참가 - Daily News","so":"工商時報","tm":"11/07 04:00","c":1,"r":"tw","u":"https://www.ctee.com.tw/news/20261107700120-439901","p":1793991600,"a":1794007140,"t":"台泥赴COP31 爭取重建商機- 日報","su":"제31차 유엔기후변화총회(COP31)가 9일 터키 안탈리아에서 개최된다. TCC는 유럽 자회사 CIMPOR 및 터키 자회사 OYAK Cement와 손잡고 실내외 이중 전시장을 마련하고, 유럽에서 대규모 3D 건축 프린팅 장비를 컨퍼런스 현장으로 운송해 현재 터키 지진 피해 주택 재건축에 활용되고 있는 혁신 기술을 선보이고 재건축 사업 기회를 위해 노력할 것이라고 6일 밝혔다. 대만 시멘트가 개발한 시멘트 에너지 저장 시스템..."},{"s":"AI위기는 금융에 새로운 변화를 가져온다》미국 기술주, 법인 직격탄: 중장기적으로 너무 비관하지 말라 - 일간투데이","so":"工商時報","tm":"11/07 04:00","c":1,"r":"tw","u":"https://www.ctee.com.tw/news/20261107700059-439901","p":1793991600,"a":1794007140,"t":"AI風雲起金融新變局》美科技股重災法人：中長線不必太悲觀- 日報","su":"시장은 미국 민주당의 '블루 웨이브'가 불러온 AI 규제 패닉에 계속 빠져들고 있다. 미국과 대만 증시가 '고통받는 형제'가 됐다. 미국 4대 증시가 5일 흑자세로 마감했고, 필라델피아 반도체지수는 하루 기준 역사상 두 번째로 큰 하락폭을 기록했다. 기술주가 가장 큰 타격을 입었고 후이다, 마이크론 등 거대 기업은 하루 만에 1000억 달러 이상의 시장 가치를 잃었다. 법무법인은 장기적으로 봤을 때 여전히 AI가 최고의 투자 대상이라고 지적했다. 적당히 다각화된 레이아웃 외에도 민주당의 정책이 주도하는 산업 기회에도 주목할 수 있습니다."},{"s":"'파괴증명서' 불법 폐기 의혹! 우산터우 저수지 옆에서 파낸 쓰레기, 지독한 냄새…물 사용에 미칠 영향 우려","so":"UDN","tm":"11/07 03:50","c":1,"r":"tw","u":"https://udn.com/news/story/7326/9863020","p":1793991011,"a":1794007140,"t":"疑非法棄置「覆土滅證」！烏山頭水庫旁挖出廢棄物飄刺鼻臭味…環團憂影響用水","su":"환경 단체는 신고를 받고 항공사진을 통해 타이난 우샨터우 저수지 보호 구역 옆 옛 매장지 주변 지역이 불법 폐기물 투기로 의심되어 밤새 굴착기로 은폐된 사실을 발견했습니다. 어제 환경부 남부지구 환경관리센터, 타이난시 환경보호국과 함께 깊이가 약 4m인 6개 유적지를 발굴했습니다. 그 중 4곳에서는 건설폐기물과 장식폐기물이 묻혀 있는 채 발견됐고, 유기휘발성 화합물의 톡 쏘는 화학적 냄새가 났다. 검사를 위해 샘플을 채취하고, 주변 모니터와 협의해 불법 폐기의 출처와 가해자를 추적했다."},{"s":"상장부동산신탁은 인지세가 면제되며 해당 부동산을 2년 동안 보유해야 합니다.","so":"信報網站","tm":"11/07 03:35","c":1,"r":"hk","u":"https://www.hkej.com/dailynews/finnews/article/4560150/%E4%B8%8A%E5%B8%82%E6%88%BF%E8%A8%97%E5%85%8D%E5%8D%B0%E8%8A%B1%E7%A8%85+%E9%A0%88%E6%8C%81%E7%89%A9%E6%A5%AD%E5%85%A9%E5%B9%B4","p":1793990134,"a":1794007140,"t":"上市房託免印花稅 須持物業兩年","su":"금융 서비스국과 재무국은 상장될 부동산 투자 신탁 기금에 대해 인지세 면제를 제공하는 법안을 제안했습니다. 재무국 부국장 Chen Haolian은 금요일(6일) 입법회 금융서비스위원회에서 지역 주거용 부동산 시장에 영향을 미치지 않기 위해 제안된 인지세 면제가 주거용 부동산 양도에 적용되지 않을 것이라고 말했습니다. 남용을 방지하기 위해 REIT는 해당 부동산을 최소 2년 동안 보유해야 하며 최소 2년 동안 증권 거래소에 상장을 유지해야 합니다. 양도방법으로는 부동산을 REIT로 직접 양도하거나 특수목적투자기구에 주식을 양도하는 경우 인지세가 면제됩니다. 주거용 부동산 양도에는 적용되지 않습니다."},{"s":"SpaceXAI는 애리조나에 데이터 센터를 계획하고 있으며 Musk의 회사는 6GW 용량을 보유할 것이라고 주장합니다.","so":"Data Center Dynamics","tm":"11/07 02:36","c":1,"r":"us","u":"https://www.datacenterdynamics.com/en/news/spacexai-data-center-arizona-cochise-county-elon-musk/","p":1793986565,"a":1794007140,"t":"SpaceXAI plans data center in Arizona, Musk's firm claims it will have 6GW capacity","su":"SpaceXAI는 애리조나 주 코치스 카운티에 새로운 데이터 센터 단지를 계획하고 있으며 Elon Musk의 회사는 전체 구축에 6GW의 전력이 필요할 수 r":"tw","u":"https://money.udn.com/money/story/5603/9864920","p":1794112419,"a":1794128040,"t":"報告稱陸2026年能源投資逾9000億美元 科技企業為重要力量","su":"중국기업개혁발전연구협회가 최근 발표한 자료에 따르면 올해 상반기 중국 석탄화력 발전 비중은 처음으로 50% 아래로 떨어진 49.7%로 떨어졌다. 석탄화력발전은 주전원에서 백업전원, 계통제어전원으로 전환되고 있습니다. 2026년 중국 본토의 총 에너지 투자액은 9,400억 달러에 달해 세계 1위를 차지할 것으로 예상된다. 그 중 기술 기업은 에너지 투자에서 중요한 세력이 되고 있다."},{"s":"미국 중간 선거는 청정 에너지에 대한 전망을 바꾸었고, 대만의 태양광 발전소는 내년에 빛을 보게 될 것입니다.","so":"自由時報","tm":"11/08 11:50","c":2,"r":"tw","u":"https://stock.ltn.com.tw/article/nbk14b7nxbbk","p":1794106200,"a":1794128040,"t":"美期中選舉變天潔淨能源大漲 台太陽能廠明年迎曙光","su":"미국 중간선거 결과가 발표됐고, 민주당이 상하원을 모두 장악하게 됐다. 시장에서는 내년 민주당이 공식 집권한 이후 태양광, 풍력 등 신재생에너지 산업에 대한 투자 환경이 크게 개선될 것으로 기대하고 있다. 미국 청정에너지 주가 급등했다. 11월 6일 대만 주식은 급락했다. 하지만 Yuanjing(6443), United Renewables(3576), Motech(6244), Canghe(6538) 등 국내 태양광 주식은 흑자에서 적자로 전환하는 데 어려움을 겪었다. 위안징과 다논(36)"},{"s":"Fei Ban의 폭락으로 AI 가격 조정 시작 | 시장 포커스 | 증권","so":"經濟日報","tm":"11/08 11:33","c":2,"r":"tw","u":"https://money.udn.com/money/story/5607/9864674?from=edn_newestlist_rank","p":1794105225,"a":1794109980,"t":"費半重挫揭開 AI 重新定價序幕 | 市場焦點 | 證券","su":"미국의 정치적 동향이 기술주의 새로운 진원지가 되었습니다! 시장에서는 민주당이 의회를 장악한 후 AI 규제 강도가 높아져 데이터센터 건립과 기술산업 자본지출에 영향을 미칠 수 있다고 우려하고 있다. 11월 5일 미국 증시는 폭락했습니다. S&P 500 지수는 하루 만에 4.4% 하락했고, 500개 구성종목 중 무려 430개 종목이 흑자로 마감했다. 나스닥 지수는 5.5% 하락했고 필라델피아 반도체 지수는 12.3% 급락했다. 안전자산인 미국 국채가 몰리면서 미국 10년만기 국채수익률이 하루 만에 5bp 하락했다."},{"s":"미국 AI 정책 변수가 중전기산업에 영향을 미칠까? 전문가들은 공장의 두 가지 주요 장점을 지적합니다.","so":"自由財經","tm":"11/07 11:35","c":2,"r":"tw","u":"https://ec.ltn.com.tw/article/breakingnews/5632438","p":1794018906,"a":1794023400,"t":"美國AI政策變數衝擊重電業？專家點出台廠具2大優勢","su":"[린징화 기자/타이베이 취재] 미국 중간선거가 막을 내렸지만 이어진 AI 데이터센터 제한 우려로 글로벌 증시는 폭락할 뻔했다. 이 가운데 대만의 중전기 산업이 미국 수출을 지향하고 있어 주가도 급락했다. 하지만 전문가들은 단기적으로 미국의 정책에 큰 변화가 없을 것으로 보고 있다."},{"s":"Huaxin은 주당 1.78위안을 벌고 있으며 강력한 주문을 받고 있습니다.","so":"UDN","tm":"11/07 03:51","c":2,"r":"tw","u":"https://udn.com/news/story/7252/9862958","p":1793991068,"a":1794007140,"t":"華新每股賺1.78元 訂單強勁","su":"Taipowe 락, 주주들"},{"s":"최신","so":"POWER Magazine","tm":"11/07 19:02","c":1,"r":"us","u":"https://www.powermag.com/latest/page/1413/","p":1794045743,"a":1794059580,"t":"Latest","su":"최신 - 폐기물을 에너지로 재활용 폐기물 압력을 전기로 재활용 대부분의 현대 증기 발전소에서 열병합 발전 옵션은 기회가 기다리고 있습니다. 미국의 대학, 공장, 병원의 에너지 절약은 전구와 온도 조절기 설정값을 바꾸는 것 이상입니다."},{"s":"Winbond는 직원 보너스가 평균 30개월로 올해 좋은 성과를 거두었습니다 | 업계 핫스팟 | 산업","so":"經濟日報","tm":"11/07 16:31","c":1,"r":"tw","u":"https://money.udn.com/money/story/5612/9863862","p":1794036670,"a":1794041640,"t":"華邦電今年業績佳 員工獎金平均30個月 | 產業熱點 | 產業","su":"이 글은 총 705개의 단어로 구성되어 있습니다. 메모리 제조업체인 Winbond는 오늘 Jianhushan World에서 Family Day 행사를 개최했습니다. Jiao Youjun 회장은 올해 성과가 매우 좋았으며 직원 보너스도 매우 넉넉했다고 말했습니다. 평균 보너스는 약 30개월로 추정됩니다. 이날 윈본드의 패밀리데이 행사에는 약 2,600여명의 직원이 참가했는데, 가족까지 포함하면 5,000명이 넘는 인원이 참석했다. Jiao Youjun은 참가자 수가 새로운 최고치를 기록했다고 말했습니다. 직원들이 마음 편히 회사에 근무할 수 있도록 격려해 주시고, 성실히 일하셔서 좋은 성과를 낼 수 있도록 도와주신 가족 여러분께 감사드립니다. 중간선거가 끝나자 시장에서는 미국의 인공지능(AI) 정책 변화가 우려된다. Jiao Youjun은 이것이 데이터 센터 건설에 확실히 영향을 미칠 것이지만 영향의 정도는 더 지켜봐야 한다고 말했습니다."},{"s":"전국 20개 대학의 EMBA 엘리트들이 타오위안에서 기량을 뽐내고, 비즈니스 리더들은 공으로 농구를 펼칩니다.","so":"自由時報","tm":"11/07 15:47","c":1,"r":"tw","u":"https://news.ltn.com.tw/news/life/breakingnews/5632688","p":1794034048,"a":1794093180,"t":"全國20所大學EMBA菁英桃園尬球技 企業領袖換上球拚籃球","su":"平日在商場上運籌帷幄的企業領袖，今天換上球衣在籃球場上較勁，由國立中央大學主辦「115年全國EMBA運動籃球聯誼賽」今登場，吸引全國20所大學EMBA企業菁英、歷屆校友齊聚桃園，以球會友，不僅較量球技，也藉由運動促進企業界與學術界交流，展現不同於商場競爭的團隊精神。中央大學也將象徵該校的「松勁」精神融入賽事，以松樹堅毅挺拔、四季常青的特質，象徵企業領袖面對挑戰的韌性與堅持，球場上除了比拚體力、球技，更考驗團隊默契、戰術運用及臨場應變能力，與企業經營管理所需的領導、溝通及決策能力有不少共通之處。"},{"s":"최초의 핵융합 발전소 건설 경쟁이 진행되고 있으며 유럽은 일본에 도움을 요청하고 있습니다.","so":"CNBC","tm":"11/07 15:00","c":1,"r":"us","u":"https://www.cnbc.com/2026/11/07/proxima-fusion-power-japan-supply-chain.html","p":1794031201,"a":1794041640,"t":"The race is on to build the first fusion power plant — and Europe is looking to Japan for help","su":"핵융합 에너지는 풍부하고 깨끗한 전력을 제공할 수 있는 잠재력을 가지고 있습니다. 이제 세계 최초의 상업용 플랜트 개발 경쟁이 시작되었습니다."},{"s":"OpenAI, 첫 번째 110억 달러 자금 조달 완료 CFO: 중간 선거는 IPO 계획에 영향을 미치지 않습니다.","so":"星島頭條","tm":"11/07 13:00","c":1,"r":"hk","u":"https://www.stheadline.com/realtime-finance/3634501/OpenAI%E5%AE%8C%E6%88%90110%E5%84%84%E7%BE%8E%E5%85%83%E9%A6%96%E6%89%B9%E8%9E%8D%E8%B3%87-CFO%E4%B8%AD%E6%9C%9F%E9%81%B8%E8%88%89%E7%84%A1%E5%BD%B1%E9%9F%BFIPO%E8%A8%88%E5%8A%83","p":1794024029,"a":1794041640,"t":"OpenAI完成110億美元首批融資 CFO：中期選舉無影響IPO計劃","su":"Bloomberg는 이 문제에 정통한 소식통을 인용하여 OpenAI가 약 110억 달러에 달하는 새로운 1차 자금 조달을 완료했으며 회사의 최근 가치는 1조 2500억 달러에 달했다고 보도했습니다. 또한 OpenAI 재무 이사 Sarah Friar는 중간 선거가 OpenAI의 IPO 계획을 변경하지 않았다고 말했습니다. 앞으로 몇 주 안에 전체 자금 조달이 완료될 예정입니다. 자금 조달 라운드의 나머지 부분은 앞으로 몇 주 안에 완료될 것으로 예상되며, 총 자금 조달 규모는 결국 최대 200억 달러까지 늘어날 수 있다고 이 문제에 정통한 소식통이 말했습니다. 이전 보고서에서는 목요일 AI 주가가 폭락하기 전 OpenAI의 초기 목표는 1을 추구하는 것이라고 지적했습니다."},{"s":"COP31에서는 글로벌 전기화 목표를 35%로 설정했습니다! IEA는 2035년 기준 충족의 핵심 분석: 전력망 확장 속도를 40% 가속화해야 함","so":"ESG永續台灣","tm":"11/07 12:39","c":1,"r":"tw","u":"https://esg.businesstoday.com.tw/article/category/190807/post/202611050035/COP31%E8%A8%82%E5%85%A8%E7%90%83%E9%9B%BB%E6%B0%A3%E5%8C%9635%EF%BC%85%E7%9B%AE%E6%A8%99%EF%BC%81IEA%E8%A7%A3%E6%9E%902035%E5%B9%B4%E9%81%94%E6%A8%99%E9%97%9C%E9%8D%B5%EF%BC%8C%E9%9B%BB%E7%B6%B2%E6%93%B4%E5%BB%BA%E9%80%9F%E5%BA%A6%E9%A0%88%E5%8A%A0%E5%BF%AB40%EF%BC%85","p":1794022770,"a":1794041640,"t":"COP31訂全球電氣化35％目標！IEA解析2035年達標關鍵，電網擴建速度須加快40％","su":"글로벌 전기화는 COP31의 중요한 논의 주제 중 하나입니다. COP31 의장단은 2035년 전 세계 전화율을 35%로 높이겠다는 목표를 제시했다. 국제에너지기구(IEA)의 '전기화' 특별 보고서는 현행 정책을 따르면 2035년까지 전 세계 전화율이 30% 안팎에 달할 것으로 예상하고 있지만 이는 아직 목표와는 거리가 멀다. 보고서는 또한 에너지 안보, 탄소 감소 및 경제에 대한 전기화의 이점뿐만 아니라 촉진 과정에서 다양한 국가가 직면한 과제를 분석합니다. 본 보고서는 COP31 의장단과 IEA의 파트너십을 통해 터키와 호주의 요청으로 작성되었으며, 글로벌 전기화 개발의 현재 상태, 잠재력 및 정책 권장 사항을 제안합니다."},{"s":"녹색 에너지 발전과 체육 교육을 고려한 Miaoli Zhaonan 중학교 광전자 경기장 개장","so":"自由時報","tm":"11/07 11:52","c":1,"r":"tw","u":"https://news.ltn.com.tw/news/life/breakingnews/5632462","p":1794019927,"a":1794023400,"t":"苗栗照南國中光電球場啟用 兼顧綠能發電與體育教學","su":"Miaoli County Zhaonan 중학교 태양광 경기장이 공식적으로 개장되었습니다. 태양광 경기장은 건축면적은 약 1,203.4㎡, 태양광 설치용량은 261.36kW이다. 캠퍼스 공간이 다양한 기능을 수행할 수 있도록 스포츠 경기장과 재생 에너지 응용 프로그램을 결합합니다. Miaoli 현 치안 Zhong Dongjin은 완벽한 스포츠 시설이 체육 교육 증진을 위한 중요한 기반이라고 말했습니다. 그는 태양광 경기장이 설치된 후 학교의 스포츠 및 훈련 자원이 풍부해지고, 학생들이 운동 기회를 늘리고, 규칙적인 습관을 개발하고, 신체적, 정신적 건강을 증진할 수 있기를 바라고 있습니다. 교육 책임자인 Ye Xinhui는 태양광 발전 경기장은 발전 기능 외에도 녹색 에너지, 에너지 절약 및 탄소 감소 적용을 구현하고 환경 보호 개념을 학습에 통합하는 생활 중심 교육 자료라고 지적했습니다."},{"s":"Lumai는 광학 AI 서버를 테스트하여 데이터 센터 전력을 절감합니다.","so":"ET Datacenters","tm":"11/07 11:34","c":1,"r":"us","u":"https://datacenters.economictimes.indiatimes.com/news/ai-compute-infrastructure/lumai-tests-optical-ai-servers-to-cut-data-center-power/135624664","p":1794018862,"a":1794023400,"t":"Lumai tests optical AI servers to cut data center power","su":"Lumai는 영국 연구소에 Iris Nova 광학 AI 추론 서버를 배포하고 있습니다. 이는 GPU에서 사전 채우기 AI 워크로드를 오프로드하여 데이터 센터 전력 소비를 줄이는 것을 목표로 합니다."},{"s":"祥碩, 樺漢, 전 태담 전망","so":"經濟日報","tm":"11/07 10:00","c":1,"r":"tw","u":"https://money.udn.com/money/story/5612/9864236","p":1794013200,"a":1794093180,"t":"祥碩、樺漢、元太談展望","su":"科技指標廠法說會下周接力登場，祥碩、樺漢、元太將依序於10日、11日及12日舉行，市場聚焦高速傳輸晶片新品進度、工業電腦零組件供需，以及電子紙跨足AI材料的新布局，三家公司對第4季與明年營運看法，將成為掌握科技產業需求的重要風向球。"},{"s":"Vistra: 데이터 센터 전력 수요는 텍사스 그리드에서 벗어나지 않았으며 여전히 주요 병목 현상으로 남아 있습니다.","so":"鉅亨網","tm":"11/07 06:32","c":1,"r":"tw","u":"https://news.cnyes.com/news/id/6651766","p":1794000755,"a":1794007140,"t":"Vistra：資料中心用電需求未轉離德州併網仍是主要瓶頸","su":"Vistra: 데이터 센터 전력 수요는 텍사스에서 벗어나지 않았고 그리드 연결은 여전히 ​​주요 병목 현상입니다. Uanalyze 2026년 11월 7일(Uanalyze/Industrial Data Center Report) ⸺ 미국 발전 회사인 Vistra(VST-US)는 11월 6일 중간 선거 이후 대규모 전력 고객이 텍사스에서 미국 동부의 PJM 전력 시장으로 수요를 이동하는 것을 보지 못했다고 말했습니다. 클라우드 거대 기업과 데이터센터 운영자는 여전히 전력공급 협상을 활발히 진행하고 있다. 프로젝트 진행에 실제로 영향을 미치는 것은 전력망에 연결될 수 있을 때입니다. Vistra 경영진은 3분기 입법 회의에서 텍사스가 여전히 매력적인 시장이라고 언급했습니다. 데이터 센터는 물 사용, 토지 및 세금 부담에 대한 조사를 받고 있으며 이는 텍사스에만 국한되지 않습니다. 고객이 위치를 평가할 때 가장 중요하게 생각하는 것은 전력 확보 속도와 지역 사회 및 정부의 지원 여부입니다. 이 회사는 기존 및 신규 가스 화력 발전소를 포괄하는 텍사스의 대규모 전력 프로젝트를 위해 PJM과 계속해서 협상하고 있습니다. 또한 후속 원자력 구매 계약의 기회에 대해 낙관하고 있지만 서명 일정을 확정하지는 않았습니다."},{"s":"Anthropic의 가치는 7조 8천억으로 줄어들 수도 있고, IPO도 차갑고, 의구심으로 자금조달도 20% 줄여야 한다","so":"信報網站","tm":"11/07 04:38","c":1,"r":"hk","u":"https://www.hkej.com/dailynews/international/article/4560214/Anthropic%E4%BC%B0%E5%80%BC%E6%81%90%E5%89%8A%E8%87%B37.8%E8%90%AC%E5%84%84","p":1793993924,"a":1794007140,"t":"Anthropic估值恐削至7.8萬億 IPO遇冷 受質疑集資應縮兩成","su":"월스트리트저널은 인공지능(AI) 스타트업 앤트로픽(Anthropic)이 당초 기업가치 1조5000억 달러(약 11조7000억 홍콩달러)로 기업을 공개하고 최대 1000억 달러를 조달할 계획이었다고 보도했다. 그런데 최근 AI 관련 주식이 매도됐다. 매각 후 일부 주요 투자자들은 평가 목표에 대해 의문을 제기했습니다. 일부에서는 가치 평가액이 미화 1조 달러(약 HK$ 7조 8000억)에 가까워야 한다고 믿었고, 다른 투자자들은 조달 자금 규모가 약 800억 달러(약 HK$ 6240억)로 20% 감소해야 한다고 믿었습니다. 결정을 내리기 전에 10월에 결과를 기다려 보십시오. Anthropic은 미국 추수감사절 일주일 전에 상장할 계획입니다."},{"s":"'27조' 원전 수출 잭팟 뒤집은 '1조' 공사비…비상등 켜진 '팀코리아' - 머니투데이","so":"머니투데이","tm":"11/07 04:30","c":1,"r":"kr","u":"https://www.mt.co.kr/amp/estate/2026/11/07/2026110610091294957","p":1793993400,"a":1794059580,"su":"체코 두코바니 원전 수주로 유럽 원전 시장 진출의 교두보를 마련한 한국 원전업계가 뜻 밖의 암초를 만났다. 사업을 함께 준비해 온 한국수력원자원(한수원)과 대우건설·두산에너빌리티 컨소시엄이 공사비와 위험 분담 문제를 놓고 충돌하면서 '팀코리아'가 해체 위기에 내몰렸다."},{"s":"Wistron과 Wiwynn의 10월 매출은 같은 기간 동안 최고치를 기록했습니다.","so":"UDN","tm":"11/07 03:51","c":1,"r":"tw","u":"https://udn.com/news/story/7252/9862954","p":1793991078,"a":1794007140,"t":"緯創、緯穎10月營收創同期新高","su":"주요 파운드리 제조사인 위스트론(Wistron)과 위윙(Wiwing)은 6일 10월 연결 매출을 동시에 발표해, 두 회사 모두 같은 기간 최고치를 경신했고, 한 달 역사상 두 번째로 높은 실적을 기록했다. 법률 관계자는 Wistron과 Wiwynn의 4분기 합산 매출이 AI 서버 출하의 지속적인 지원으로 계속 이익을 얻었으며 새로운 단일 분기 최고치를 설정하여 연간 실적을 최고점에 도전할 수 있다고 낙관하고 있다고 지적했습니다."},{"s":"야마토, 선제공격하고 신화목표주가 하향","so":"UDN","tm":"11/07 03:32","c":1,"r":"tw","u":"https://udn.com/news/story/7252/9862918","p":1793989931,"a":1794007140,"t":"大和開第一槍 調降信驊目標價","su":"대만 주식은 어제(6일) 왕신화 주가가 한계점까지 떨어지는 등 큰 매도압력을 받았다. 신화통신이 3분기 재무보고서를 발표한 후 다이와캐피털은 첫 번째 시도에 나서 목표주가를 26,660위안에서 21,800위안으로 18.2% 하락한 수준으로 낮췄다. '매수' 등급을 유지했지만 AI 데이터센터 자본 지출의 미래에 대한 시장의 우려가 커지고 있음을 반영했습니다."},{"s":"에어비앤비, 세 번째로 매출 전망 상향 조정","so":"信報網站","tm":"11/07 03:26","c":1,"r":"hk","u":"https://www.hkej.com/dailynews/international/article/4560216/Airbnb%E7%AC%AC%E4%B8%89%E5%BA%A6%E4%B8%8A%E8%AA%BF%E6%94%B6%E5%85%A5%E9%A0%90%E6%B8%AC","p":1793989586,"a":1794007140,"t":"Airbnb第三度上調收入預測","su":"단기 숙소 임대 플랫폼 에어비앤비(Airbnb)의 3분기 매출은 전년 동기 대비 19% 증가해 3년 만에 최대 증가율인 48억7000만 달러를 기록해 시장 기대치인 47억5000만 달러를 넘어섰다. 회사는 세 번째로 연간 매출 전망을 상향 조정하고 최대 120억 달러에 달하는 새로운 자사주 매입 계획을 발표했습니다. 이에 따라 미국 금요일 오전에 주가는 8.6% 반등한 미화 184,825달러를 기록했습니다. 지난 분기에 38% 더 많은 수익을 올렸고 새로운 자사주 매입을 시작했습니다. 강력한 여행 수요와 결제 지연, 보다 유연한 취소 정책 등 지난 해 도입된 기타 상품 기능 덕분에 에어비앤비의 총 주문 금액은 지난 분기에 21% 증가한 27건이 되었습니다."},{"s":"캐나다는 그리드 산림 채굴에 대한 투자를 늘릴 계획입니다","so":"信報網站","tm":"11/07 03:26","c":1,"r":"hk","u":"https://www.hkej.com/dailynews/international/article/4560215/%E5%8A%A0%E6%8B%BF%E5%A4%A7%E6%93%AC%E5%A2%9E%E6%8A%95%E8%B3%87%E9%9B%BB%E7%B6%B2%E6%9E%97%E6%A5%AD%E6%8E%A1%E7%A4%A6","p":1793989586,"a":1794007140,"t":"加拿大擬增投資電網林業採礦","su":"프랑수아-필립 샴페인 캐나다 재무장관(사진)은 5일(현지시간) 예산안을 발표해 투자 슈퍼사이클을 시작하고 유가 상승으로 인한 세금 인상을 일부 활용해 경제적 자립을 강화하고 미국에 대한 의존도를 낮추겠다는 계획을 밝혔다. 경제적 독립을 강화하고 미국에 대한 의존도를 줄입니다. 예산에 따르면 캐나다 정부는 전력망, 원자력 발전소, 광업 및 임업에 수십억 달러를 투자하는 동시에 일부 기업가와 소규모 회사 투자에 대해 양도소득세 면제를 제공할 계획입니다. 캐나다 정부는 이전에 \"생산성 초과 공제\"를 발표했습니다."},{"s":"미국산 강철로 더욱 강력한 그리드 구축","so":"POWER Magazine","tm":"11/07 03:25","c":1,"r":"us","u":"https://www.powermag.com/white-papers/building-a-stronger-grid-with-american-made-steel/","p":1793989520,"a":1794007140,"t":"Building a Stronger Grid with American-Made Steel","su":"미국 송전선의 약 70%는 25년 이상 된 것입니다. 이제 공공 시설에서는 데이터 센터, 첨단 제조 및 운송 전기화를 위한 새로운 용량을 구축하는 동시에 노후된 자산을 교체하고 있습니다. 강철 전송 및 배전 폴은 목재보다 더 긴 서비스 수명, 더 큰 내구성 및 더 낮은 유지 관리 요구 사항을 제공할 수 있습니다."},{"s":"Formosa Plastics는 4분기 실적이 호조를 보일 것으로 예상합니다. Formosa Plastics, Nanya의 매출은 성장할 것으로 예상됩니다.","so":"UDN","tm":"11/07 02:53","c":1,"r":"tw","u":"https://udn.com/news/story/7252/9862950","p":1793987607,"a":1794007140,"t":"台塑看旺第4季營運 台塑、南亞營收可望成長","su":"포모사플라스틱그룹의 주요 4개사가 어제(6일) 11월과 4분기 영업전망을 발표했다. Formosa Plastics는 4분기가 일부 제품의 최고 수요 시즌을 맞이할 것이며 매출도 증가할 것으로 예상하고 있습니다. 난야는 전자재료 모멘텀에 대해 계속 낙관하고 있으며, 11월과 4분기에도 매출은 계속 증가할 것으로 예상된다. Formosa Plastics는 정제 스프레드가 계속해서 높아질 것으로 예측합니다. 대만화학은 국제유가 하락으로 단기 재고가격 하락 리스크가 발생했지만, 방향족 탄화수소 제품은 여전히 ​​스프레드를 유지할 것으로 예상되며, 변화에 대응하기 위해 신중하게 재고를 규제할 것이라고 강조했다."},{"s":"구조적 장점, 중국과 미국의 대형 모델 간 격차 축소 | 홍콩경제신문","so":"香港經濟日報HKET","tm":"11/07 01:28","c":1,"r":"hk","u":"https://invest.hket.com/article/4221405/","p":1793982480,"a":1794007140,"t":"結構性優勢 中美大模型差距收窄|香港經濟日報"},{"s":"Morgan Asset Management: 아시아 태평양 하드웨어 가치는 4년 만에 최저 수준이며 중국, 일본, 대만 및 한국의 장기적인 기회에 대해 낙관적입니다 | 홍콩경제신문","so":"香港經濟日報HKET","tm":"11/07 01:28","c":1,"r":"hk","u":"https://invest.hket.com/article/4221404/","p":1793982480,"a":1794007140,"t":"摩根資管：亞太硬件估值4年低 看好中日台韓長綫機會|香港經濟日報"},{"s":"회사 생일 축하합니다/Zhitong 지퍼 산업은 꾸준한 변화를 겪고 있습니다","so":"經濟日報","tm":"11/07 01:18","c":1,"r":"tw","u":"https://money.udn.com/money/story/5612/9862582","p":1793981926,"a":1794007140,"t":"企業生日快樂／智通拉鍊業轉型 穩步向上","su":"Zhitong은 올해 창립 48주년을 맞이했습니다. 원래 지퍼 사업에서 현재는 소프트웨어 및 정보통신 서비스에 주력하고 있습니다. 그 핵심 인물 중 하나가 다름 아닌 차이쿤황 단장이다. Zhitong의 향후 운영 방향과 관련하여 Cai Huanghuang은 회사가 정보 통신 서비스 분야에서 Zhitong의 운영을 계속 확장하고 Zhitong의 미래 운영 역량을 위한 성장을 위한 탄탄한 기반을 마련할 것으로 기대합니다."},{"s":"Shuotian Q3 EPS는 8.06위안으로 급등했습니다.","so":"UDN","tm":"11/07 01:03","c":1,"r":"tw","u":"https://udn.com/news/story/7252/9862658","p":1793981018,"a":1794059580,"t":"碩天Q3 EPS衝上8.06元","su":"무정전전원공급장치(UPS) 브랜드 제조사 Shuotian(3617)은 올해 3분기 세후 순이익이 7억 5,800만 위안으로 분기 대비 15%, 연간 증가율 14.6%로 단일 분기 최고치를 기록했다고 어제(6) 밝혔다. 세후 주당 순이익(EPS)은 8.06위안이었습니다. 올해 첫 3분기 세후 누적 순이익은 18억 500만 위안으로 연간 증가율 65%로 지난해 전체 연도를 능가했으며 주당 세후 순이익은 19.18위안이었다."},{"s":"상업 수요가 주도하는 경우: 새로운 부하 시대를 위한 전력망 계획 재고","so":"POWER Magazine","tm":"11/07 00:48","c":1,"r":"us","u":"https://www.powermag.com/when-commercial-demand-takes-the-lead-rethinking-grid-planning-for-a-new-load-era/","p":1793980100,"a":1794007140,"t":"When Commercial Demand Takes the Lead: Rethinking Grid Planning for a New Load Era","su":"수십 년 동안 전력회사는 인구 증가, 경제 활동, 날씨 및 환경 간의 상대적으로 예측 가능한 관계를 계획해 왔습니다."},{"s":"아일랜드의 데이터 센터에 에너지 탄력성에 대한 새로운 접근 방식이 필요한 이유","so":"Data Center Dynamics","tm":"11/07 00:30","c":1,"r":"us","u":"https://www.datacenterdynamics.com/en/opinions/why-irelands-data-centers-need-a-new-approach-to-energy-resilience/","p":1793979055,"a":1794023400,"t":"Why Ireland’s data centers need a new approach to energy resilience","su":"데이터 센터와 신기술 부하는 2024년 아일랜드 전력 수요의 약 24%를 차지했습니다. 이 비율은 2032년까지 30%에 이를 것으로 예상됩니다. 수요가 계속 증가함에 따라 데이터 센터와 전력 시스템 간의 관계가 변화하고 있습니다."},{"s":"주요 태양광 발전, 에너지 저장 회사가 전주 거래로 합병","so":"POWER Magazine","tm":"11/07 00:13","c":1,"r":"us","u":"https://www.powermag.com/major-solar-power-energy-storage-companies-merge-in-all-stock-deal/","p":1793978000,"a":1794007140,"t":"Major Solar Power, Energy Storage Companies Merge in All-Stock Deal","su":"유틸리티 규모의 태양광을 위한 구조적 시스템 균형(SBOS) 솔루션 제공업체인 ARRAY Technologies와 공급업체인 Shoals Technologies Group"},{"s":"DTE Energy는 데이터 센터 수요를 언급하며 5개년 유틸리티 투자 계획을 440억 달러로 늘립니다.","so":"Data Center Dynamics","tm":"11/06 23:51","c":1,"r":"us","u":"https://www.datacenterdynamics.com/en/news/dte-energy-ups-five-year-utility-investment-plan-to-44bn-cites-data-center-demand/","p":1793976702,"a":1794023400,"t":"DTE Energy ups five-year utility investment plan to $44bn, cites data center demand","su":"미시간 전력회사인 DTE Energy는 데이터 센터 수요가 중요한 요인이라는 점을 이유로 5개년 전력회사 투자 계획을 약 100억 달러에서 약 440억 달러로 늘렸습니다. 전력회사는 3분기 실적 발표에서 이러한 증가세를 보고했습니다."},{"s":"디지털 애플리케이션과 AI가 발전소 및 차량의 \"시장 내 가용성\"을 향상시키는 방법","so":"POWER Magazine","tm":"11/06 22:25","c":1,"r":"us","u":"https://www.powermag.com/webinars/how-digital-applications-and-ai-can-improve-the-in-market-availability-of-power-generating-stations-and-fleets/","p":1793971521,"a":1793974680,"t":"How Digital Applications and AI can Improve the “In-Market Availability” of Power Generating Stations and Fleets"},{"s":"Rongchang: 캘리포니아와 텍사스의 Netcom 인프라 시장을 목표로 IoT 및 기타 스마트 애플리케이션에 대해 낙관적","so":"經濟日報","tm":"11/06 21:45","c":1,"r":"tw","u":"https://money.udn.com/money/story/5612/9862721","p":1793969140,"a":1793974680,"t":"榮昌：看好IoT等智能應用　攻加州、德州網通基建市場","su":"Rongchang Technology의 Hong Jianwen 총책임자는 오늘 미국 민주당이 중간 선거에서 승리했으며 시장은 AI 데이터 센터 건설 지연이 대만의 공급망에 영향을 미칠 것이라고 우려했지만 사물 인터넷(IOT)은..."}]},{"name":"🤖 로봇","note":"","breaking":false,"items":[{"s":"Innodisk 재무 보고서/AI 서버는 3분기 이익을 13배 이상 늘렸고 EPS는 93.09위안이라는 새로운 최고치를 기록했습니다.","so":"UDN","tm":"11/06 19:54","c":4,"r":"tw","u":"https://udn.com/news/story/7252/9862585","p":1793962476,"a":1793974680,"t":"宜鼎財報／AI 伺服器推升第3季獲利年增逾13倍、EPS 93.09元 再創新高","su":"메모리 모듈 제조사 이노디스크(5289)가 6일 3분기 재무보고서를 발표했다. AI 서버가 주도하는 고급 메모리 및 스토리지 수요에 힘입어 해당 분기 세후 순이익은 90억 6천만 위안으로 연간 1,310.7% 증가했습니다. 주당 순이익은 93.09위안으로 영업 최고치를 경신했습니다. 회사 측은 그룹 AI 관련 애플리케이션 매출이 40% 이상을 차지하며 글로벌 클라우드 서비스 제공업체(CSP), AI 서버 공급망, 휴머노이드 로봇 고객사를 성공적으로 확대했다고 밝혔다. 고급 컴퓨팅 비즈니스 기회를 포착하기 위해 AI 인프라와 엣지 AI 시스템의 이중 트랙 레이아웃을 이어갈 것입니다."},{"s":"신화통신, 세계 최초의 AI 생체공학 로봇 앵커 출시, 장이모우가 이미지 디자인","so":"星島頭條","tm":"11/06 16:39","c":4,"r":"hk","u":"https://www.stheadline.com/realtime-china/3634227/%E6%96%B0%E8%8F%AF%E7%A4%BE%E6%8E%A8%E5%85%A8%E7%90%83%E9%A6%96%E5%80%8BAI%E4%BB%BF%E7%94%9F%E6%A9%9F%E6%A2%B0%E4%BA%BA%E4%B8%BB%E6%92%AD-%E5%BC%B5%E8%97%9D%E8%AC%80%E6%93%8D%E5%88%80%E8%A8%AD%E8%A8%88%E5%BD%A2%E8%B1%A1","p":1793950797,"a":1793955540,"t":"新華社推全球首個AI仿生機械人主播 張藝謀操刀設計形象","su":"기술 및 미디어 애플리케이션은 최근 새로운 혁신을 가져왔습니다. 신화통신과 인공지능(AI) 기업 'Ubtech'가 공동 개발한 세계 최초의 생체 공학 휴머노이드 로봇 뉴스 앵커 'Xinyan'과 'Xinyu'가 11월 5일 제7회 세계 미디어 서밋에서 공식 공개되었습니다. 두 로봇은 실제 사람을 1:1 비율로 채택했으며 본토의 유명 감독인 Zhang Yimou가 이미지 크리에이티브 디자이너로 활동하며 현장 보도 능력도 갖추고 있습니다. AI 환상을 피하기 위해 실시간으로 정보를 추출합니다. 신화통신은 이번에 출연한 여성 앵커 '신옌'과 남성 앵커 '신위'의 이름이 '새로운 말이 새로운 지식을 열고, 신옌이 정직하게 말한다'는 의미를 갖고 있어 뉴스 전달에 대한 신뢰를 갖고 있다고 지적했다."},{"s":"지드래곤 마음도 훔친 차였는데…테슬라 '사이버트럭' 3년 만에 단종 수순","so":"전자신문","tm":"11/07 08:16","c":3,"r":"kr","u":"https://www.etnews.com/20261107000006","p":1794006979,"a":1794023400,"su":"테슬라가 야심 차게 내놓은 전기 픽업트럭 사이버트럭의 생산을 단계적으로 축소한다. 당초 연간 50만대 판매를 목표로 내세웠지만 실제 판매량이 기대에 크게 못 미친 데다, 회사가 자율주행 사업에 생산 역량을 집중하면서다. 일론 머스크 테슬라 최고경영자(CEO)는 6일(현지시간) 소셜미디어 엑스(X)를 통해 내년 중반부터 텍사스 기가팩토리에서 사이버트럭 생산을 단계적으로 줄일 계획이라고 밝혔다. 생산 공간은 차세대 자율주행 차량인 사이버캡 제조에"},{"s":"[로보월드 2026] 나우로보틱스, 경제형 취출로봇으로 매출 확대 정조준","so":"더벨","tm":"11/06 07:50","c":3,"r":"kr","u":"https://www.thebell.co.kr/front/newsview.asp?code=0101&key=202611051806066880102022","p":1793919012,"a":1793944200,"su":"나우로보틱스가 가격을 낮춘 경제형 취출로봇을 선보였다. 한양로보틱스 합병으로 확보한 취출로봇 고객 기반에 가격 경쟁력을 더해 판매량을 늘린다는 전략이다. 판매 확대에 따른 규모의 경제로 수익성 개선도 기대하고 있다. 나우로보틱스는 4일부터 경기도 고양시 킨텍스에서..."},{"s":"[다시보기] 휴머노이드 빅뱅 1회","so":"programs.sbs.co.kr","tm":"11/09 00:43","c":2,"r":"kr","u":"https://programs.sbs.co.kr/programTemplate/amp/vod/humanoidbigbang/22000639386","p":1794152602,"a":1794177888,"su":"1회 휴머노이드 빅뱅 육체를 얻은 AI, 공존의 조건 방송일 2026.11.08 (월) 로봇의 관절인 액추에이터와 손가락에 숨겨진 비밀부터, 중국의 600만 원짜리 보급형 로봇 공세, 한국 기업들의 숨겨진 무기까지! “로봇이 내 노동을 대신해 줄 때, 인간은 무엇을 하며 살아야 하는가” 라는 질문에 유쾌하지만 묵직한 답을 찾아 나선다."},{"s":"Snow Man 무카이 야스지&M!","so":"朝日新聞","tm":"11/08 19:00","c":2,"r":"jp","u":"https://www.asahi.com/and/entertainment/17033534","p":1794132000,"a":1794148524,"t":"Snow Man向井康二＆M!LK山中柔太朗、岡田准一と“神対応”ファンサ連発 “踊るロボット”とのダンスコラボも実現","su":"Mr.마릭의 “핸즈 파워”초마술에는 일동 대흥분 9일 방송의 TBS계 버라이어티 “오카다 준이치와 로버트 아키야마의 지금조차 시로! 」(후 10:00)에 Snow Man의 무카이 야스지, M!LK의 야마나카 유타로, YOU가 게스트 출연한다. 【사진】귀중 쇼…"},{"s":"파키스탄에서 제작한 로봇이 카라치 식당에 미래의 맛을 선사합니다","so":"France 24","tm":"11/08 11:09","c":2,"r":"us","u":"https://www.france24.com/en/live-news/20261108-pakistan-built-robots-serve-taste-of-future-to-karachi-diners","p":1794103796,"a":1794109980,"t":"Pakistan-built robots serve taste of future to Karachi diners"},{"s":"경제사설/AI 시장 열기는 가라앉고, 가치 테스트는 이제 시작됐다","so":"UDN","tm":"11/07 04:05","c":2,"r":"tw","u":"https://udn.com/news/story/7338/9862908","p":1793991915,"a":1794007140,"t":"經濟日報社論／AI行情退燒 價值考驗才開始","su":"미국 기술주는 5일 나스닥 지수가 전 고점 대비 5% 이상 급락, 10% 이상 하락하며 공식적으로 중기 조정권에 진입하는 등 전반적으로 폭락했다. 필라델피아 반도체 지수는 하루 만에 10% 이상 급락했다. 판매 압력은 즉시 아시아로 퍼졌습니다. 대만 증시는 지난 6일 장중 한때 3,700포인트 이상 급락한 뒤 결국 1,873포인트 하락한 39,701포인트로 마감해 역대 4번째로 큰 종가인 4만선 아래로 떨어졌다. 한국증시에도 서킷브레이커가 발동됐다. AI 시장이 거품이 됐는지 여부는 글로벌 주식시장에 가혹한 시험대가 됐다."},{"s":"Guangyu의 10월 매출은 연간 성장을 위해 노력하면서 전월 대비 18.22% 감소했습니다.","so":"自由時報","tm":"11/06 20:06","c":2,"r":"tw","u":"https://stock.ltn.com.tw/article/hcvrbbuutkfq","p":1793963172,"a":1793974680,"t":"廣宇10月營收月減18.22％ 力拚全年成長","su":"Hon Hai Group의 자회사인 Guangyu(2328)는 10월 연결 수익이 19억 9,600만 위안으로 월간 18.22% 감소, 연간 27.82% 증가했습니다. 올해 10월 누적 수입은 182억8200만 위안으로 연간 0.66% 감소했다. 광위는 10월이 자동차 제품 모멘텀 둔화, 핵심 소재 납품 지연, 일부 부품 제품 성수기 등 요인의 영향을 받아 9월에 비해 매출이 감소했다고 지적했다. 그러나 지난해 같은 기간의 기준기간 감소로 인해 연간 성장률은 여전히 ​​둔화됐다."},{"s":"브이디에스, '딥테크 팁스' 선정…휴머노이드 핸즈용 액추에이터 기술 개발 본격화","so":"아시아경제","tm":"11/06 17:10","c":2,"r":"kr","u":"https://www.asiae.co.kr/article/2026110617013294029","p":1793952600,"a":1793955540,"su":"로봇용 정밀 감속기 전문기업 브이디에스(VDS, 대표 정창훈)가 중소벤처기업부의 &#039;딥테크 팁스(Deep Tech TIPS)&#039; 프로그."},{"s":"'전자부품그룹' 판웨이머티리얼즈, 미국 휴머노이드 로봇 공급망 진출, 내년 매출총이익 증가 예상 - 상장카운터","so":"旺得富理財網","tm":"11/06 14:48","c":2,"r":"tw","u":"https://wantrich.chinatimes.com/news/20261106900179-420101","p":1793944101,"a":1793944200,"t":"《電零組》汎瑋材料打入美系人形機器人供應鏈明年毛利獲利看升- 上市櫃","su":"[타임즈 장한기 기자가 타이페이에서 보도했다] 판웨이 재료(6967)가 휴머노이드 로봇을 추구하는 데 있어 좋은 소식을 전했고 미국의 주요 제조업체에 휴머노이드 로봇을 공급하는 데 성공했다. 휴머노이드 로봇 출하량이 점차 증가함에 따라 Fanwei의 총괄 관리자인 Li Huixiang은 내년에 휴머노이드 로봇이 매출의 3~5%를 차지할 것으로 예상하고, AI 서버와 휴머노이드 로봇이 매출의 20% 이상을 차지할 것으로 예상한다고 말했습니다. 2027년 매출총이익과 수익성은 올해보다 좋아질 것이다. Fanwei는 AI 서버와 고성능 운영을 적극적으로 배포합니다..."},{"s":"〈財經週報-投資趨勢〉算力即投資力 市場震盪為長線布局點","so":"自由時報","tm":"11/09 06:30","c":1,"r":"tw","u":"https://stock.ltn.com.tw/article/chkaf3qhvazp","p":1794173400,"a":1794177888,"su":"特斯拉日前推出新世代電動車Roadster，採用火箭推進技術與AI運算概念，炒熱飛天車話題。對於投資人而言，這項創新不僅代表汽車產業轉變，而是AI科技浪潮擴張下所孕育的新一輪投資機會。從Roadster的火箭技術，到Robotaxi、自駕系統、人形機器人，以及支撐龐大模型訓練需求的Dojo超級電腦，"},{"s":"다섯 손가락·두 다리 진짜 가능해? 휴머노이드 상용화 왜 안될까[김창영의 실리콘밸리 룩]","so":"서울경제","tm":"11/09 06:20","c":1,"r":"kr","u":"https://www.sedaily.com/article/20111712","p":1794172803,"a":1794177888,"su":"다섯 손가락·두 다리 진짜 가능해? 휴머노이드 상용화 왜 안될까[김창영의 실리콘밸리 룩] ■휴머노이드 상용화 도전과제 다섯 가지는 입력2026-11-09 06:20 범용인공지능(AGI) 시대가 얼마 남지 않았다는 관측 속에 용 전자장비) 협력을 넘어 휴머노이드 로봇과 자율주행차 등 피지컬 인공지능(AI) 신사업에서도 양 그룹간 시너지를 발휘할 공동 전선이 빠르게 넓어지고 있어서다. 삼성·현대차그룹 CEO(최고경영자)들이 대거 부부 동반 행사를 통해 협력의 폭과 깊이를 확대하면서 현대차그룹 휴머노이드 ‘아틀라스’의 메모리 공급과 차세대 칩 개발 등 신사업 협력에 속도가 붙을 전망이다."},{"s":"숙련공 의존하던 감광액 교체·불량 검사, 삼전닉스 반도체 공장선 로봇이 한다","so":"서울경제","tm":"11/08 17:51","c":1,"r":"kr","u":"https://m.sedaily.com/amparticle/20111617","p":1794127876,"a":1794145920,"su":"고도의 정밀성이 요구되는 반도체 제조 현장에서 로봇 활용 범위가 넓어지고 있다. 단순 물류·이송 자동화를 넘어 감광액 교체, 웨이퍼 테스트 등 작업자의 숙련도와 정교한 조작이 필요한 영역까지 로봇 적용을 검토하는 단계에 이르렀다. 까다로운 반도체 공정이 로봇의 성능과 정밀도를 검증하는 테스트베드로 활용되면서 로봇 기술 고도화에도 속도가 붙을 것으로 전망된다"},{"s":"로봇 눈 달고, 숫자 읽는 AI…'실전 딥테크'에 몰린 뭉칫돈 - 머니투데이","so":"머니투데이","tm":"11/08 17:00","c":1,"r":"kr","u":"https://www.mt.co.kr/future/2026/11/08/2026110813265917222","p":1794124800,"a":1794128040,"su":"[이 기사에 나온 스타트업에 대한 보다 다양한 기업정보는 유니콘팩토리 빅데이터 플랫폼 '데이터랩'에서 볼 수 있습니다. ] 11월 첫째 주(2~6일)에는 AI(인공지능)와 로보틱스, 반도체, 커머스 등 다양한 분야의 스타트업에 투자금이 유입됐다."},{"s":"AI to expand industrial robotics market, but equipment makers may see limited gains: S&P Global","so":"ET Enterprise AI","tm":"11/08 16:05","c":1,"r":"us","u":"https://enterpriseai.economictimes.indiatimes.com/news/industry/ai-to-expand-industrial-robotics-market-but-robot-makers-may-gain-less-sp-global/135653604","p":1794121552,"a":1794177888,"su":"A recent S&P Global report reveals that while artificial intelligence (AI) will significantly enhance the industrial robotics market, manufacturers may not see proportional benefits as customers leverage more flexible automation."},{"s":"'삼성·현대차' 미래 혈맹으로…첫 경영진 '부부동반' 네트워킹 개최","so":"뉴스핌","tm":"11/08 15:38","c":1,"r":"kr","u":"https://www.newspim.com/news/view/20261108000072","p":1794119880,"a":1794128040,"su":"[서울=뉴스핌] 채송무 기자 = 국내 재계를 대표하는 삼성전자와 현대자동차그룹이 사상 처음으로 그룹 차원의 대규모 부부동반 교류 행사를 열고"},{"s":"Samsung, LG seek robotics talent overseas as commercialization push grows","so":"The Korea Herald","tm":"11/08 14:40","c":1,"r":"us","u":"https://www.koreaherald.com/article/10929657","p":1794116429,"a":1794177888, <script>
var D = JSON.parse(document.getElementById('data').textContent);
var RL = {}; D.regions.forEach(function(r){ RL[r.k] = r.l; });
function $(id){ return document.getElementById(id); }
function esc(t){ return String(t==null?'':t).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
// 휴대폰에 기억해 두는 값 (마지막 탭, 탭별로 마지막에 본 시각, 정렬, 국가)
function load(k, d){ try { var v = localStorage.getItem('nb_'+k); return v===null ? d : JSON.parse(v); } catch(e){ return d; } }
function save(k, v){ try { localStorage.setItem('nb_'+k, JSON.stringify(v)); } catch(e){} }
var S = { tab: load('tab', 0), seen: load('seen', null), sort: load('sort', 'c'), region: load('region', 'all'), shown: D.show, prev: {} };
function newest(t){ var m = 0; t.items.forEach(function(n){ if(n.a > m) m = n.a; }); return m; }
if(S.seen === null){ S.seen = {}; D.themes.forEach(function(t){ S.seen[t.name] = newest(t); }); save('seen', S.seen); }  // 처음 방문: 레드닷 없이 시작
if(location.hash && /^#t\d+$/.test(location.hash)) S.tab = +location.hash.slice(2);
if(S.tab >= D.themes.length) S.tab = 0;

function visible(t){
  return t.items.filter(function(n){ return S.region==='all' || n.r===S.region; });
}
function sorted(list, breaking){
  var k = breaking ? 'p' : S.sort;
  return list.slice().sort(function(x,y){
    var c = y.c - x.c, p = y.p - x.p; return k==='c' ? (c||p) : (p||c);
  });
}
function renderTabs(){
  $('tabs').innerHTML = D.themes.map(function(t, i){
    var dot = newest(t) > (S.seen[t.name] || 0) && i !== S.tab;
    return '<button class="tab'+(i===S.tab?' on':'')+'" onclick="openTab('+i+')">'+esc(t.name)+
           '<b>'+visible(t).length+'</b>'+(dot?'<span class="dot" title="새 뉴스"></span>':'')+'</button>';
  }).join('');
  var on = $('tabs').children[S.tab]; if(on && on.scrollIntoView) on.scrollIntoView({block:'nearest', inline:'center'});
}
function renderCtrl(){
  var br = D.themes[S.tab].breaking;
  var h = '';
  if(!br){
    h += '<button class="'+(S.sort==='c'?'on':'')+'" onclick="setSort(\'c\')">🔥 화제순</button>';
    h += '<button class="'+(S.sort==='p'?'on':'')+'" onclick="setSort(\'p\')">🕒 최신순</button><span class="sep"></span>';
  }
  h += '<button class="'+(S.region==='all'?'on':'')+'" onclick="setRegion(\'all\')">전체</button>';
  D.regions.forEach(function(r){
    h += '<button class="'+(S.region===r.k?'on':'')+'" onclick="setRegion(\''+r.k+'\')">'+esc(r.l)+'</button>';
  });
  $('ctrl').innerHTML = h;
}
function card(n, prev){
  var hot = n.c > 1 ? '<span class="hot'+(n.c>=5?' big':'')+'">🔥 언론 '+n.c+'곳</span>' : '';
  var isNew = prev && n.a > prev ? ' <span class="new">NEW</span>' : '';
  return '<a class="card" href="'+esc(n.u)+'" target="_blank" rel="noopener" data-s="'+esc(n.su||'')+'">'+
    '<div class="meta">'+hot+esc(RL[n.r]||'')+' · '+esc(n.so)+' · '+esc(n.tm)+isNew+'</div>'+
    '<div class="title">'+esc(n.s)+'</div>'+(n.t?'<div class="orig">'+esc(n.t)+'</div>':'')+'</a>';
}
function renderMain(){
  var t = D.themes[S.tab], list = sorted(visible(t), t.breaking), prev = S.prev[t.name];
  var h = '<h2>'+esc(t.name)+'</h2>' + (t.note ? '<p class="note">'+esc(t.note)+'</p>' : '');
  if(!list.length) h += '<p class="none">'+(S.region==='all' ? '최근 ' + (t.breaking?'속보':'기사') + ' 없음' : esc(RL[S.region])+' 기사 없음')+'</p>';
  h += list.slice(0, S.shown).map(function(n){ return card(n, prev); }).join('');
  var extra = list.length - S.shown;
  if(extra > 0) h += '<button class="more" onclick="more()">더보기 ▾  ('+extra+'개 더)</button>';
  else if(S.shown > D.show) h += '<button class="more" onclick="less()">접기 ▴</button>';
  var auto = Object.keys(D.auto);
  h += '<footer>업데이트 '+esc(D.updated)+' · 최근 3일 · 믿을 만한 언론사 기사만 · 기사를 누르면 한국어 요약 → 원문 보기<br>'+
       '🔥 언론 N곳 = 같은 소식을 보도한 언론사 수 (많을수록 화제) · <span style="color:var(--red)">●</span> = 새 뉴스'+
       '<br><br><b>자동으로 추가된 언론사</b> (주요 언론보다 먼저 보도하고, 주요 언론도 함께 다룬 소식이 많은 곳 · 최근 14일)'+
       (auto.length ? auto.map(function(k){ return '<div>'+esc(k)+': '+esc(D.auto[k].join(', '))+'</div>'; }).join('') : '<div>아직 없음</div>')+
       '</footer>';
  $('main').innerHTML = h;
}
function openTab(i){
  var t = D.themes[i];
  S.tab = i; S.shown = D.show; save('tab', i);
  if(!(t.name in S.prev)) S.prev[t.name] = S.seen[t.name] || 0;     // 이 탭에서 NEW 로 보여줄 기준
  S.seen[t.name] = Math.max(S.seen[t.name] || 0, newest(t)); save('seen', S.seen);  // 탭에 들어오면 레드닷 지움
  history.replaceState(null, '', '#t'+i);
  renderTabs(); renderCtrl(); renderMain(); window.scrollTo(0, 0);
}
function setSort(k){ S.sort = k; save('sort', k); S.shown = D.show; renderCtrl(); renderMain(); }
function setRegion(k){ S.region = k; save('region', k); S.shown = D.show; renderTabs(); renderCtrl(); renderMain(); }
function more(){ S.shown += 20; renderMain(); }
function less(){ S.shown = D.show; renderMain(); window.scrollTo(0, 0); }
$('upd').textContent = '업데이트 ' + D.updated + ' · 탭을 눌러 테마별 뉴스 보기';

// 🚨 미국 속보는 페이지를 새로 올리지 않아도 최신 내용을 바로 가져옴
var BI = D.themes.findIndex(function(t){ return t.breaking; });
function refreshBreaking(){
  if(BI < 0 || !window.fetch) return;
  fetch(D.breaking_url + '?t=' + Date.now(), {cache:'no-store'}).then(function(r){ return r.json(); }).then(function(b){
    var items = (b.items || []).map(function(n){
      var d = {s:n.show, so:n.source||'', tm:n.time||'', c:n.count||1, r:'us', u:n.url||n.link, p:Math.floor(n.pub), a:Math.floor(n.added||n.pub)};
      if(n.show !== n.title) d.t = n.title; if(n.sum) d.su = n.sum; return d;
    });
    if(!items.length && D.themes[BI].items.length) return;
    D.themes[BI].items = items;
    if(S.tab === BI){ S.seen[D.themes[BI].name] = Math.max(S.seen[D.themes[BI].name]||0, newest(D.themes[BI])); save('seen', S.seen); renderMain(); }
    renderTabs();
  }).catch(function(){});
}
openTab(S.tab);
refreshBreaking();
setInterval(refreshBreaking, 5 * 60 * 1000);
document.addEventListener('visibilitychange', function(){ if(!document.hidden) refreshBreaking(); });

// 기사를 누르면 먼저 한국어 요약 → 원문 볼지 선택
document.addEventListener('click', function(e){
  var c = e.target.closest('a.card'); if(!c) return;
  if(e.ctrlKey||e.metaKey||e.shiftKey) return;
  e.preventDefault();
  $('s-meta').innerHTML = c.querySelector('.meta').innerHTML;
  $('s-title').textContent = c.querySelector('.title').textContent;
  var o = c.querySelector('.orig'); $('s-orig').textContent = o ? o.textContent : '';
  var sm = c.dataset.s || '';
  $('s-sum').textContent = sm || '이 기사는 요약을 가져오지 못했어요. (사이트가 자동 접속을 막았거나 아직 준비 중)';
  $('s-sum').className = 's-sum' + (sm ? '' : ' empty');
  $('s-go').href = c.href;
  $('dim').hidden = false; $('sheet').hidden = false; $('sheet').scrollTop = 0;
  document.body.style.overflow = 'hidden';
});
function closeSheet(){ $('dim').hidden = true; $('sheet').hidden = true; document.body.style.overflow = ''; }
document.addEventListener('keydown', function(e){ if(e.key==='Escape') closeSheet(); });
