<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#262624">
<title>투자 테마별 뉴스</title>
<style>
@font-face{font-family:'ChosunIlboMyungjo';src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_one@1.0/Chosunilbo_myungjo.woff') format('woff');font-weight:normal;font-display:swap}
:root{color-scheme:dark;--bg:#262624;--card:#30302e;--card2:#3a3a37;--text:#faf9f5;--sub:#a6a39a;--line:#3e3e3a;--acc:#d97757;--red:#ef4444}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.55 'ChosunIlboMyungjo',Georgia,"Noto Serif KR",serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:760px;margin:auto}
header{padding:20px 16px 8px}
h1{font:600 22px/1.3 'ChosunIlboMyungjo',Georgia,serif;margin:0 0 4px}
.upd{color:var(--sub);font-size:12.5px}
/* 테마 탭 */
.tabs{position:sticky;top:0;z-index:3;background:rgba(38,38,36,.96);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.tabrow{display:flex;gap:8px;overflow-x:auto;padding:12px 16px 10px;scrollbar-width:none}.tabrow::-webkit-scrollbar{display:none}
.tab{position:relative;flex:none;padding:9px 15px;border-radius:12px;border:1px solid var(--line);background:var(--card);
  color:var(--sub);font:inherit;font-size:14px;cursor:pointer}
.tab b{margin-left:5px;color:var(--sub);font-weight:400;font-size:12px}
.tab.on{background:var(--acc);border-color:var(--acc);color:#1f1e1d;font-weight:600}.tab.on b{color:#1f1e1d}
.dot{position:absolute;top:-3px;right:-3px;width:11px;height:11px;border-radius:50%;background:var(--red);border:2px solid var(--bg)}
/* 정렬·국가 */
.ctrl{display:flex;gap:6px;overflow-x:auto;padding:0 16px 10px;scrollbar-width:none}.ctrl::-webkit-scrollbar{display:none}
.ctrl button{flex:none;border:1px solid var(--line);background:transparent;color:var(--sub);border-radius:8px;padding:5px 11px;font:inherit;font-size:12.5px}
.ctrl button.on{background:var(--card2);border-color:var(--card2);color:var(--text)}
.ctrl .sep{flex:none;width:1px;background:var(--line);margin:2px 4px}
main{padding:6px 12px 48px}
h2{font:600 19px/1.3 'ChosunIlboMyungjo',Georgia,serif;margin:16px 4px 2px}
.note{margin:0 4px 10px;color:var(--sub);font-size:12px}
.none{color:var(--sub);margin:24px 4px;text-align:center}
.card{display:block;background:var(--card);border-radius:12px;padding:12px 14px;margin:8px 0;color:var(--text);text-decoration:none;transition:background .15s}
.card:hover{background:var(--card2)}.card:active{opacity:.75}
.meta{color:var(--sub);font-size:12px}
.title{font-weight:500;margin-top:3px}
.orig{color:var(--sub);font-size:12px;margin-top:3px}
.new{margin-left:4px;color:var(--red);font-size:11px;font-weight:700;letter-spacing:.3px}
.hot{display:inline-block;margin-right:6px;padding:0 6px;border-radius:4px;background:rgba(217,119,87,.16);color:var(--acc);font-weight:600}
.hot.big{background:var(--acc);color:#1f1e1d}
.newbar{display:block;width:100%;margin:2px 0 6px;padding:9px;border:0;border-radius:10px;background:rgba(239,68,68,.14);color:#fca5a5;font:inherit;font-size:13px;text-align:left}
.more{display:block;width:100%;margin:4px 0 0;padding:10px;border:1px dashed var(--line);border-radius:12px;background:transparent;color:var(--sub);font:inherit;font-size:13px}
footer{margin:36px 4px 0;padding-top:14px;border-top:1px solid var(--line);color:var(--sub);font-size:12px;line-height:1.7}
footer b{color:var(--text);font-weight:600}
/* 요약 창 */
#dim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:5}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:6;max-width:760px;margin:auto;max-height:82vh;overflow-y:auto;
  background:var(--card);border-radius:16px 16px 0 0;padding:10px 18px calc(18px + env(safe-area-inset-bottom));box-shadow:0 -8px 30px rgba(0,0,0,.4)}
.grab{width:38px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 12px}
.s-title{font-size:17px;font-weight:600;margin:4px 0 2px;line-height:1.45}
.s-label{margin:16px 0 4px;color:var(--acc);font-size:12px;font-weight:700;letter-spacing:.5px}
.s-sum{font-size:15px;line-height:1.75}.s-sum.empty{color:var(--sub);font-size:13.5px}
.s-btns{display:flex;gap:8px;margin-top:20px}
.s-btns a{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;padding:11px 6px;border-radius:10px;font:inherit;font-size:13.5px;line-height:1.3;text-decoration:none;
  background:var(--acc);color:#1f1e1d;font-weight:600}
.s-btns a.cl{background:transparent;border:1px solid var(--acc);color:var(--acc)}
.s-close button{width:100%;margin-top:8px;padding:11px;border-radius:10px;background:transparent;border:1px solid var(--line);color:var(--sub);font:inherit;font-size:14px}
.s-cnote{margin-top:8px;color:var(--sub);font-size:11.5px;text-align:center}
#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);z-index:9;max-width:90%;padding:10px 16px;border-radius:10px;background:#faf9f5;color:#1f1e1d;font-size:13.5px;box-shadow:0 6px 20px rgba(0,0,0,.4)}
.seg{display:flex;gap:4px;margin:6px 4px 10px}.seg button{flex:1;min-width:0;border:1px solid var(--line);background:transparent;color:var(--sub);border-radius:8px;padding:7px 0;font:inherit;font-size:12.5px;white-space:nowrap}
.seg.ly{margin-top:-4px}.seg.ly button{padding:5px 0;font-size:12px}.seg.ly button.on{background:var(--card2);border-color:var(--acc);color:var(--text);font-weight:600}
.seg.sm{margin-bottom:8px}.seg.sm button{padding:9px 0;font-size:13px}.seg.sm button.on{background:var(--card2);border-color:var(--acc);color:var(--text)}
.warn{margin:0 4px 10px;padding:8px 10px;border-radius:8px;background:rgba(250,204,21,.08);color:var(--sub);font-size:12.5px;line-height:1.5}.warn b{color:var(--text)}
.seg button.on{background:var(--acc);border-color:var(--acc);color:#1f1e1d;font-weight:600}
.tot{margin:2px 4px 10px;color:var(--sub);font-size:13px}.tot b{color:var(--text)}.chgnote{font-size:11px}
.srow{background:var(--card);border-radius:12px;margin:6px 0;padding:10px 12px;cursor:pointer}.srow.open{background:var(--card2)}
.sline{display:flex;align-items:center;gap:8px}
.rk{width:18px;color:var(--sub);font-size:12px;text-align:right;flex:none}
.mv .gap{display:inline-block;width:3px}.mv{width:30px;flex:none;font-size:11px;font-weight:600;text-align:left;font-variant-numeric:tabular-nums;margin-right:-4px}.mv.up{color:#f87171}.mv.dn{color:#60a5fa}.mv.same{color:#a8a29e;font-size:15px;font-weight:700;line-height:1;padding-left:3px}
.sn{width:86px;flex:none;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb{flex:1;height:10px;background:rgba(255,255,255,.05);border-radius:5px;overflow:hidden;min-width:30px}.sb i{display:block;height:100%;background:var(--acc);border-radius:0 4px 4px 0}
.sc{width:54px;flex:none;text-align:right;font-size:14px;font-variant-numeric:tabular-nums}
.sent{flex:none;display:flex;gap:4px;font-size:10.5px;font-variant-numeric:tabular-nums;width:104px;justify-content:flex-start}.sent i{font-style:normal;white-space:nowrap}
.sent i::before{content:'●';font-size:8px;margin-right:1px;vertical-align:1px}.s-p::before{color:#4ade80}.s-n::before{color:#f87171}.s-u::before{color:#a8a29e}
.sentot{margin-top:-4px}.sentot .sent{display:inline-flex;font-size:12px;gap:8px;width:auto}
@media(max-width:520px){.srow .spark{display:none}.srow .sent{flex-direction:column;gap:0;font-size:9.5px;line-height:1.15;width:36px}}
.chg{width:48px;flex:none;text-align:right;font-size:11.5px;color:var(--sub)}.chg.up{color:#f87171}.chg.dn{color:#60a5fa}
.spark{flex:none}
.det{margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.dt{color:var(--sub);font-size:12px;margin:6px 0 4px}
.bars{width:100%;height:auto;display:block}.bars .ax{fill:var(--sub);font-size:10px}.bars .bar:hover rect+rect{opacity:.8}
.crow{display:flex;align-items:center;gap:8px;margin:3px 0;font-size:12.5px}.cl{width:86px;flex:none}.cb{flex:1;height:8px;background:rgba(255,255,255,.05);border-radius:4px;overflow:hidden}
.cb i{display:block;height:100%;background:var(--acc);opacity:.8;border-radius:0 3px 3px 0}.cn{width:50px;text-align:right;flex:none;font-variant-numeric:tabular-nums}
@media(max-width:400px){.spark{display:none}.sn{width:74px}}
</style></head><body>

06","c":3,"r":"tw","u":"https://www.ctee.com.tw/news/20261120700744-430201","p":1795143960,"a":1795144370,"t":"台積電失守2,000元！台股重挫逾2,400點摜破36K 千金股一排跌停- 證券","su":"TSMC(2330)는 오늘(20일) NT$2,000선 아래로 떨어졌고, NT$1,000가 넘는 주가가 쓰나미의 맨 앞줄에 섰다. NT$2,000 이상의 가격을 지닌 12개 주식은 모두 이번 장에서 제한가 하락했습니다. 가권지수 대만증시는 2,400포인트 넘게 하락했다. 오전 10시 50분경 36,000포인트가 무너졌고, 최저점은 35,959포인트였습니다. 대만 증시는 오늘 2,400포인트 이상 급락해 6% 이상 하락해 36,000포인트 미만을 기록했습니다. 미국 주요 4대 주가지수는 어젯밤 모두 마감됐다."},{"s":"[속보] '검은 금요일' 코스피 급락에 '매도 사이드카' 발동","so":"뉴스핌","tm":"11/20 11:56","c":1,"r":"kr","u":"https://www.newspim.com/news/view/20261120000595","p":1795143360,"a":1795143618,"su":"[서울=뉴스핌] 이정아 기자 = 코스피(한국 대표 주식시장 지수) 시장에서 20일 오전 11시 54분 5초 매도 사이드카가 발동했다.plum@newspim.com"},{"s":"코스피 4%대 급락에 4,900선 위협…외국인·기관 매도 공세","so":"산경투데이","tm":"11/20 11:42","c":4,"r":"kr","u":"https://www.sankyungtoday.com/news/articleView.html?idxno=64359","p":1795142569,"a":1795143616,"su":"[산경투데이 = 한승수 기자]미국발 인공지능(AI) 산업의 불확실성과 반도체(전자기기의 두뇌 부품) 기업에 대한 규제 우려가 국내 증시를 강타하면서 코스피가 4% 넘게 급락하고 있다.외국인과 기관의 대규모 매도세(팔려는 힘)가 이어지는 가운데 삼성전자와 SK하이닉스 등 대형 반도체주가 동반 하락하면서 지수의 낙폭을 키우"},{"s":"[자막뉴스] 앤트로픽 상장 흥행에도…왜 뉴욕증시는 힘을 못 받나","so":"SBS 뉴스","tm":"11/20 11:31","c":3,"r":"kr","u":"https://news.sbs.co.kr/news/endPage.do?news_id=N1008855241","p":1795141906,"a":1795143616,"su":"인공지능 기업인 앤트로픽의 나스닥(미국 기술 회사들이 많은 주식시장) 상장(주식시장에 처음 들어오는 것) 첫날 성적은 좋았습니다. 공모가보다 17% 오른 97달러 17센트에 거래를 마쳤습니다. 엔트로픽은 공모가 83달러를 웃도는 111달러 50센트에 거래를 시작했습니다."},{"s":"[속보] ’SM 시세조종’ 카카오 김범수 항소심도 무죄","so":"연합뉴스TV","tm":"11/20 10:36","c":1,"r":"kr","u":"https://m.yonhapnewstv.co.kr/news/AKR20261120103609nrc","p":1795138560,"a":1795139987,"su":"항소심 선고 공판 출석하는 김범수 카카오 미래이니셔티브센터장(서울=연합뉴스) 김주형 기자 = SM엔터테인먼트 시세조종 공모 의혹으로 1심에서 무죄를 선고받은 김범수 카카오 미래이니셔티브센터장이 20일 서울 서초구 고등법원에서 열린 항소심 선고 공판에 출석하고 있다. 2026.11.20 kjhpress@yna.co.kr 연합뉴스TV 기사문의 및 제보 : 카톡/라인 jebo23 이경희(sorimoa@yna.co.kr) 당신이 담은 순간이 뉴스입니다!"},{"s":"뉴스/아시아 주식이 피바다가 되었습니다! 닛케이 2,800포인트 급락, 한국 증시는 4% 이상 폭락, 5,000선 아래로 하락","so":"TVBS新聞網","tm":"11/20 10:33","c":1,"r":"tw","u":"https://news.tvbs.com.tw/world/4053290","p":1795138380,"a":1795139270,"t":"快訊／亞股遭血洗！日經狂瀉2800點 韓股崩逾4%失守5000大關","su":"16나노, 14나노 등 첨단 공정 로직 칩의 수출 검사를 강화하는 미국의 새로운 규정이 19일 공식 발효됐다. 외신들은 TSMC(2330)와 삼성전자가 일부 중국 고객들에게 미국 수출 허가를 신청하는 과정에서 일부 프로세서의 출하를 중단하겠다고 통보한 사실도 지적했다. 이와 함께 밤새 미국 증시 급락, 기술주 매도 압력, 칩 수출 통제 우려 등의 영향으로 아시아 증시는 오늘(20일) 장 초반 급락세를 보였다. 닛케이지수는 2,800포인트 이상 급락했고, 한국증시도 4% 이상 하락해 5,000선을 밑돌았다."},{"s":"미국과 아시아 주식시장이 활황입니다! 대만 주식시장은 한때 1,600포인트 이상 하락해 37,000포인트 아래로 떨어졌습니다. Delta Electronics와 Sino-Technology Holdings는 급락했습니다.","so":"UDN","tm":"11/20 10:25","c":3,"r":"tw","u":"https://udn.com/news/story/7251/9890572","p":1795137922,"a":1795138550,"t":"美亞股市殺聲四起！台股一度跌逾1,600點失守37K 台達電、信驊重挫","su":"AI 투자 수익성에 대한 우려가 증폭됐고, 연준의 매파적(금리를 올리자는 쪽) 신호와 맞물려 어젯밤 미국 주요 4대 주가지수가 모두 급락했다. 다우존스 산업평균지수는 1,100포인트 이상 급락했고, 필라델피아 반도체(전자기기의 두뇌 부품) 지수는 2.42% 하락했다. 아시아 증시 역시 매도압력을 벗어나지 못했다. 일본과 한국 증시는 20일 동시에 개장하며 큰 폭으로 하락했다. 장초반 손실폭은 각각 약 4.5%, 3.5%로 확대됐고, 시장의 위험회피심리는 급격하게 높아졌다. 대만 12월 지수 선물은 1,057포인트 급락하며 37,550포인트에서 개장하며 선두를 차지했습니다. 이후 집중 시장 지수는 780.76포인트 하락하여 37,646.13포인트로 개장했습니다."},{"s":"투자자문사 CEO 3명 중 2명 내년 코스피 7000 이상","so":"SBS Biz","tm":"11/20 10:07","c":3,"r":"kr","u":"https://biz.sbs.co.kr/article/20000347763","p":1795136820,"a":1795137801,"su":"시장 전문가 3명 중 2명이 내년 코스피(한국 대표 주식시장 지수) 7000 이상을 전망하고 있다는 조사 결과가 발표됐습니다.오늘(20일) 삼성증권은 국내 주요 투자자문사 및 자산운용사 CEO와 임원들이 참석한 '삼성증권 자문사 CEO 포럼'을 개최했다고 밝혔습니다.삼성증권이 이번 포럼 참석자를 대상으로 실시한 ‘2027년 시장전망 및 행사관련 설문&…"},{"s":"하나에어로, 코스닥 상장 첫날 70%대 급등[종목NOW]","so":"파이낸셜뉴스","tm":"11/20 09:33","c":3,"r":"kr","u":"https://www.fnnews.com/news/202611200927366137","p":1795134837,"a":1795135640,"su":"하나에어로다이내믹스가 코스닥(한국 중소·기술 회사 주식시장) 상장(주식시장에 처음 들어오는 것) 첫날 장초반 70% 넘는 급등세다. 하나에어로는 지난 2007년 설립 이후 부품·치공구·구조물 조립으로 사업을 넓혀 온 항공 제조 솔루션 기업이다."},{"s":"닛케이 평균 주가 일시 1800엔 초 하락 AI·반도체 업계의 선행 우려","so":"NHKニュース","tm":"11/20 09:31","c":3,"r":"jp","u":"https://news.web.nhk/newsweb/na/nd-20261120de78808","p":1795134711,"a":1795134935,"t":"日経平均株価 一時1800円超下落 AI・半導体業界の先行き懸念 핌","tm":"11/19 14:44","c":3,"r":"kr","u":"https://www.newspim.com/news/view/20261119000900","p":1795067040,"a":1795067301,"su":"[서울=뉴스핌] 설희 기자= 주문형 반도체(ASIC) 설계·양산 서비스를 제공하는 알파칩스는 중국 현지 고객 대응과 신규 프로젝트 발굴을 위한 중국 법인 설립을 완료했다고 19일 밝혔다.알파칩스는 올해 10월 말 중국에서 영업집조(사업자등록 허가증"},{"s":"[속보]1조달러 넘어선 韓수출…'오징어→가발→車→반도체'","so":"아시아경제","tm":"11/19 14:31","c":2,"r":"kr","u":"https://www.asiae.co.kr/article/2026111914102007328","p":1795066311,"a":1795066582,"su":"함께 보면 좋은 기사 용산·동작도 아파트값 하락 전환…수원 권선구는 상승폭 2배 넘어 '전국 1위'[부동산AtoZ] 달 착륙부터 우주망원경까지…AI·슈퍼컴퓨터로 우주탐사 준비 사이버도박, 공급자까지 잡는다…범인 절반은 청년층 케임브리지 사전 올해의 단어는 '인간'…\"AI 발전으로 더 중요해져\" 군내 과학기술 인재가 없다[양낙규의 Defence Club] \"한국인 단골 아침 메뉴인데\"…\"위장 다"},{"s":"[속보] 한국 수출 1조 달러 돌파…독일·미국·중국 이어 세계 네 번째","so":"한겨레","tm":"11/19 14:30","c":2,"r":"kr","u":"https://www.hani.co.kr/arti/economy/economy_general/1288128.html","p":1795066200,"a":1795066583,"su":"한국의 연간 수출액이 사상 처음으로 1조달러를 넘어섰다. 독일·미국·중국에 이어 세계 네 번째다. 1964년 처음 수출 1억달러를 달성한 지 62년 만에 수출 규모가 1만배로 커졌다. 선박·어류·목재·의류 등이 주력 수출품이던 한국의 수출 구조는 반세기 동안 반도체(전자기기의 두뇌 부품) 등"},{"s":"한은 “환율 10% 하락하면 생활비 연 16.5만원 절감… 저소득층에 특히 유리”","so":"Chosunbiz","tm":"11/19 12:03","c":10,"r":"kr","u":"https://biz.chosun.com/policy/policy_sub/2026/11/19/7C4FWRBKGBFLDPR77U5BXMZDNE/","p":1795057414,"a":1795058588,"su":"원·달러 환율(다른 나라 돈과 바꾸는 비율)이 10% 하락하면 생활비가 가구당 연 16만5000원 절감된다는 한국은행 연구 결과가 19일 나왔다. 특히 저소득층의 생활비 절감 효과가 큰 것으로 분석됐다. 최근 빠르게 하락한 환율이 양극화 완화에 기여할 수 있다는 것이다. 한국은행이 이날 발표한 '원화 절상의 경제적 영향: 부문별 파급 차별화와 양극화 완화 가능성'에 따르면, 환율 10% 하락 시 절감되는 생활비는 소득 수준이 가장 높은 5분위(상위 20%)가 1년에 26만3000원으로, 소득이 가장 낮은 1분위(하위 20%)의 8만8000원보다"},{"s":"3분기 韓 해외 순금융자산 역대 최대 2807억달러 증가… “코스피 하락 영향”","so":"Chosunbiz","tm":"11/19 12:00","c":6,"r":"kr","u":"https://biz.chosun.com/policy/policy_sub/2026/11/19/PFDYM3DICNCYRGPTHKX5UY7UHE/","p":1795057254,"a":1795058589,"su":"우리나라 순대외금융자산은 3분기 말 기준 3448억달러로 직전 분기(640억달러)보다 2807억달러 증가했다고 한국은행이 19일 밝혔다. 관련 통계가 집계되기 시작한 1994년 이후 역대 최대 증가 폭이다. 지난 2분기에는 역대 최대 폭 하락을 기록했는데, 3개월 만에 최대 폭 증가를 나타낸 것이다. 순대외금융자산은 국내 거주자가 해외에 보유한 대외금융자산에서 외국인이 우리나라에 보유한 대외금융부채를 뺀 금액이다."},{"s":"홍콩증시는 400포인트 넘게 하락해 2만3000포인트 아래로 떨어졌다.","so":"RTHK News","tm":"11/19 11:17","c":3,"r":"hk","u":"https://news.rthk.hk/rthk/ch/component/k2/1878394-20261119.htm","p":1795054620,"a":1795054962,"t":"港股跌逾400點 失守23000點","su":"홍콩증시 하락폭은 400포인트 이상으로 확대됐다. 항셍지수는 지난 3주 만에 처음으로 23,000포인트 아래로 하락해 거의 425포인트(1.8% 이상) 하락한 22,869포인트로 최저치를 기록했다. 기술지수는 3,655포인트로 약 2.2% 하락했다. 텐센트는 결과 발표 후 6% 가까이 급락했고, 알리바바도 결과 발표 전 5% 이상 하락하며 10거래일 연속 하락세를 이어갔다. 두 사람은 아래로 끌려갔다..."},{"s":"대만 증시는 1,100포인트 이상 급락하며 40,000선 아래로 떨어졌습니다! 엔비디아 후계자 연준 매파와 AI 규제…아시아 증시 3대 부정적 영향","so":"UDN","tm":"11/19 10:56","c":3,"r":"tw","u":"https://udn.com/news/story/7251/9888134","p":1795053383,"a":1795054243,"t":"台股暴跌逾1100點失守4萬！輝達接班、Fed鷹派與AI監管…3大利空衝擊亞股","su":"대만 증시는 1,100포인트 이상 급락하며 40,000선 아래로 떨어졌습니다! 엔비디아의 승계, 연준(미국의 중앙은행) 매파, AI 규제… 3대 부정적 영향이 아시아 증시에 영향을 미쳤다. 대만 증시는 오늘(19일) 또 한번 격렬한 장세를 펼쳤다. 장중 가권지수는 1,100포인트 이상 하락하며 4만포인트 아래로 떨어졌다. 반대매수지수는 5% 가까이 급락했다. 대만 증시와 아시아 증시는 미국 연방준비제도(연준)의 매파적(금리를 올리자는 쪽) 시그널, 미국 AI 규제 강화, 엔비디아 고위 인사 교체 등의 영향으로 동시 등락세를 보였다. 외국자본은 아시아 신흥시장의 조정을 가속화했다. 엔비디아의 승계 변수는 기술주에 영향을 미칩니다. 엔비디아의 최근 단일 분기 실적은 미화 1,158억 달러에 이르렀으며, 4분기 재무 예측은 미화 1,300억 달러였습니다. 그러나 주가는 2.9% 가까이 하락해 17개월 만에 최저치를 기록했다."},{"s":"코스피 하루 만에 5000선 붕괴…‘한한령 완화’ 기대에 콘텐츠주는 급등","so":"디지털데일리","tm":"11/19 10:50","c":3,"r":"kr","u":"https://www.ddaily.co.kr/page/view/2026111910500137086","p":1795053016,"a":1795054236,"su":"9일 서울 중구 하나은행 본점 딜링룸에서 직원들이 업무를 보고 있다. [사진=연합뉴스][디지털데일리 김남기자] 코스피(한국 대표 주식시장 지수)가 전날 5000선을 회복한 지 하루 만에 다시 4900선으로..."},{"s":"[속보] 5천피 또 깨졌다…코스피 1%대 하락","so":"파이낸셜뉴스","tm":"11/19 10:30","c":1,"r":"kr","u":"https://www.fnnews.com/news/202611191029191607","p":1795051824,"a":1795052768,"su":"증권 시황·전망 [속보] 5천피 또 깨졌다…코스피(한국 대표 주식시장 지수) 1%대 하락 임상혁 기자 파이낸셜뉴스 입력 2026.11.19 10:30 수정 2026.11.19 10:30 기사 듣기 구글 검색 선호 매체 추가 [파이낸셜뉴스] [속보] 5천피 또 깨졌다…코스피 1%대 하락 [email protected] 임상혁 기자 ※ 저작권자 © 파이낸셜뉴스, 무단전재-재배포 금지 임상혁 증권부 [email protected] 中 한한령 해제 기대감에…콘텐츠·엔터·관광·화장품 등 관련주 '강세' [종목 NOW] 다며 연준을 다시 한번 비난했다. 그러나 그는 자신의 발언이 근거가 아니라고 말했다."},{"s":"대만 증시 역사상 단일 주 최대 낙폭이자 미국 증시 폭락이다. 금융감독원 \"23일부터 균일장 이하 공매도 금지\" 시장 살리기 5대책 | 주식 시장 뉴스 | 주식 시장","so":"UDN","tm":"11/21 17:10","c":2,"r":"tw","u":"https://udn.com/news/story/7251/9893382?from=udn-ch1_breaknews-1-99-news","p":1795248639,"a":1795259681,"t":"台股史上最大單周跌點、美股崩盤金管會「23日起禁平盤以下放空」5招救市| 股市要聞| 股市","su":"지난주 대만 주식시장은 36,000포인트 위험에 빠지면서 역사상 최대 주간 하락폭을 기록했습니다. 미국 증시는 금요일에 다시 마감했다. 금융감독위원회는 다음주 월요일(23일)부터 정액시장 이하 공매도(주식을 빌려서 먼저 파는 것) 등 5개 조치를 전면 금지한다고 21일 오후 밝혔다."},{"s":"미국 주식에 대한 팁 | 빅스(VIX)가 폭발한다! 공황 매도가 시장을 휩쓸고 있는데, 나스닥은 '곰의 문 두드리는 소리'를 견딜 수 있을까?","so":"第一财经","tm":"11/22 15:27","c":1,"r":"cn","u":"https://www.yicai.com/news/103449207.html","p":1795328875,"a":1795334496,"t":"美股点金丨VIX爆表！恐慌抛售席卷市场，纳指能否顶住“熊敲门”","su":"이번주 미국 증시는 크게 하락했다. 엔비디아는 강력한 수익을 발표했고 인공지능 스타트업인 앤트로픽은 역사상 최대 규모의 기업공개(IPO)를 기록했지만 여전히 연준의 매파적인 태도로 인한 우려를 상쇄하지 못했습니다. S&P500(미국 큰 회사 500곳 지수)과 다우존스 산업평균지수는 조정 국면에 진입했고, 나스닥은 기술적 약세장에 접근하고 있었습니다. 시장 변동성을 측정하는 패닉지수 VIX는 한때 40을 돌파하기도 했다. 투자자들은 반도체 회사와 소프트웨어 인프라 주식의 급격한 매도 속에서 미국 부채로 피난처를 찾았습니다. 다음 주에 발표되는 개인소비지출(PCE) 데이터는 지난 주의 10월 인플레이션(물건값이 계속 오르는 것) 보고서가 예상보다 높았던 이후 연준의 통화 정책 방향을 더욱 명확하게 반영할 수 있습니다. 단기 급락 이후 시장 심리가 회복되기까지는 시간이 걸릴 수 있다."},{"s":"미국 주식이 폭락하면 연준이 퇴임하게 될까요? 뱅크오브아메리카의 Hartnett는 연준의 금리 인상 중단 결정의 핵심을 밝힙니다.","so":"工商時報","tm":"11/22 15:14","c":1,"r":"tw","u":"https://www.ctee.com.tw/news/20261122700452-430702","p":1795328040,"a":1795334501,"t":"美股崩跌逼宮Fed？美銀Hartnett揭聯準會升息喊停關鍵- 國際","su":"미국 주식의 급격한 조정은 연준이 계속해서 금리(돈을 빌릴 때 내는 이자 비율)를 인상하는 것을 막는 가장 빠른 방법이 될 수 있습니다! 뱅크오브아메리카의 수석 투자 전략가인 Michael Hartnett는 최신 \"Flow Show\" 보고서에서 S&P500(미국 큰 회사 500곳 지수)이 2026년 이후 모든 상승폭을 포기하고 6,845포인트로 떨어지면 연준이 긴축 정책을 재평가하게 될 수 있다고 지적했습니다. S&P는 지난 금요일 6,910포인트로 마감했는데, 이는 이 주요 bp에서 불과 65포인트 떨어져 있습니다."},{"s":"2018년 대본의 반복인가요? 미 증시는 투자자들이 연준의 긴축 정책에 의문을 제기하면서 급락했습니다.","so":"鉅亨網","tm":"11/22 14:00","c":1,"r":"tw","u":"https://news.cnyes.com/news/id/6669834","p":1795323603,"a":1795334502,"t":"2018年劇本重演？美股暴跌 投資人質疑聯準會緊縮政策","su":"미국 증시는 6일 연속 하락했고, S&P500(미국 큰 회사 500곳 지수) 지수는 200일선 아래로 떨어졌습니다. 골드만삭스는 매도 압력이 '포괄적 청산'이라며 금융 여건이 급속히 긴축되고 있다고 말했다.\n연준 관계자들은 매파적인 신호를 보냈고 월러는 금리를 0.5%포인트(퍼센트끼리 뺀 차이) 인상할 가능성을 언급했으며 골드만삭스는 여전히 12월에 0.25% 포인트 금리를 인상하고 2027년 3월에 또 한 번 금리를 인상할 것으로 예상하고 있습니다.\n금은 온스당 미화 3,600달러 아래로 떨어졌고, 구리 가격은 하루 만에 약 5% 하락했습니다. 골드만삭스는 금 주식의 동일한 하락은 유동성 위축을 의미하며 채권 시장은 단기 국채에 편향되어 있다고 말했습니다."},{"s":"미국 증시가 무너지고 있나요? AI 산업은 버블 붕괴인가, 가격 재평가인가?","so":"鉅亨網","tm":"11/22 13:10","c":1,"r":"tw","u":"https://news.cnyes.com/news/id/6669832","p":1795320609,"a":1795334504,"t":"美股慘崩 AI產業是泡沫破裂還是價格重估？","su":"나스닥은 이번 주에 10% 하락했고 고점 대비 약 18% 하락했습니다. S&P500(미국 큰 회사 500곳 지수)과 다우존스 지수도 기술적 조정 범위에 진입했습니다.\n엔비디아는 일주일 만에 약 23% 하락했으며 시가총액(회사 전체 몸값)은 2조 7천억 달러 증발했습니다. 코어위브, AMD, 알파벳과 같은 AI 공급망은 동시에 압박을 받았습니다.\n시장에서는 AI의 높은 자본지출이 수익으로 전환되기 어렵고, 금리와 자금조달 비용의 상승으로 가치평가 재평가가 심화될 것이라고 우려하고 있다."},{"s":"월요일에 대만 주식이 하락할 때까지 기다리시겠습니까? 골드만삭스 패닉 지수가 9포인트까지 치솟으며 미국 증시가 2조6000억대만달러를 더 매도할 수 있다고 경고했다.","so":"TVBS新聞網","tm":"11/22 12:52","c":1,"r":"tw","u":"https://news.tvbs.com.tw/money/4054251","p":1795319520,"a":1795320021,"t":"台股週一挫咧等？高盛恐慌指數飆至9分 警告美股恐再倒貨2.6兆","su":"미국 기술주들이 블랙프라이데이를 맞이했습니다. 골드만삭스 트레이딩부는 골드만삭스가 내부 집계한 '패닉지수'가 10점 만점에 9포인트까지 급등해 최고 경고 수준에 접근했다고 지적하며 다음 주 미국 증시가 대규모 매도세(팔려는 힘)를 이어갈 수 있음을 시사했다. 미국 증시 기술·반도체(전자기기의 두뇌 부품) 그룹이 전반적으로 급락하면서 미국 증시와 밀접한 연관이 있는 대만 증시는 월요일(23일) 개장하면 손실보전 압박에서 벗어나지 못할 수도 있다."},{"s":"프리토크 뉴스》우크라이나군이 러시아 드론을 지상에서 공중으로 폭격했습니다! 애국 여군, '최전선 전투 조건' 공개하고 월스트리트 고액 연봉 포기하고 군 입대","so":"自由時報","tm":"11/22 12:21","c":1,"r":"tw","u":"https://news.ltn.com.tw/news/world/breakingnews/5649355","p":1795317709,"a":1795320025,"t":"自由說新聞》烏軍地對空轟爆俄無人機！愛國女兵揭「前線戰況」棄華爾街高薪參軍"},{"s":"채권시장은 시기적절한 비를 맞이하고, 미국 주식과 신흥시장이 장기 매수 포인트로 부상","so":"自由財經","tm":"11/22 12:20","c":1,"r":"tw","u":"https://ec.ltn.com.tw/article/breakingnews/5649152","p":1795317600,"a":1795320030,"t":"債市迎及時雨 美股與新興市場浮現長線買點","su":"■황신시(황 Xinshi) 10월 7일 대만 가권지수는 역사적 고점인 5만포인트에 한 발짝 다가섰습니다. 예상과 달리 상황은 불과 한 달 만에 바뀌었다. 첫째, 미국 중간선거가 '블루 웨이브'를 일으켰다. 민주당은 하원과 상원을 휩쓸었을 뿐만 아니라 텍사스와 같은 전통적인 투표 기반도 장악했습니다. 에너지 집약적 산업에 대한 여론의 반발은 빠르게 발효됐다."},{"s":"앤트로픽 급락에 월가 '책임 공방'...패닉지수 10점 만점에 9점","so":"YTN","tm":"11/22 12:09","c":1,"r":"kr","u":"https://www.ytn.co.kr/_ln/0104_202611221209256822","p":1795316940,"a":1795334494,"su":"지난주 사상 최대 규모 상장(주식시장에 처음 들어오는 것)으로 주목을 끌었던 AI 기업 앤트로픽이 데뷔 이틀 만에 급락하자 월가에서는 책임 공방이 벌어지고 있습니다. 앤트로픽 상장이 AI 거품에 대한 불안감을 되레 키우면서 이번 주 증시 전망도 어두울 거란 관측이 나오고 있습니다. 국제부 연결해 자세한 내용 알아보겠습니다."},{"s":"앤트로픽의 상장은 주식시장의 급락을 막지 못했습니다. 월스트리트는 AI 투자를 절약할 수 있는 것이 무엇인지 묻는다 | 미국 증시 동향 | 국제","so":"經濟日報","tm":"11/22 11:49","c":1,"r":"tw","u":"https://money.udn.com/money/story/123398/9893972","p":1795315764,"a":1795334505,"t":"Anthropic 上市未能止住股市暴跌 華爾街追問什麼能拯救 AI 交易 | 美股動態 | 國際","su":"이 글은 총 2,750 단어로 구성되어 있습니다. 블룸버그경제신문은 블룸버그와 손잡고 글로벌 실시간 금융뉴스, 시사분석, 연예인 칼럼을 제공합니다. 원스톱 독서와 세상과의 동기화. 독점 콘텐츠를 무료로 시청하세요. 남은 기사는 회원으로 로그인하세요. ※ 기사 링크를 다시 게시하거나 다시 게시할 수 있습니다. 무단으로 기사 내용을 복사 및 재게시하지 마세요. 디지털 구독🎉 5주년 기념 ✨신규 구독자는 구독 시 100위안을 받고 iPhone 18 Pro를 받습니다. ✨기존 구독자는 완자푸에서 NT$1,000를 보너스로 받습니다. 앞으로도 모든 변동에 계속 함께하겠습니다👍 페이지로 이동"},{"s":"뉴욕증시, AI발 급락 충격에 물가 변수까지…반등 기대와 불안 교차","so":"산경투데이","tm":"11/22 11:23","c":1,"r":"kr","u":"https://www.sankyungtoday.com/news/articleViewAmp.html?idxno=64388","p":1795314197,"a":1795319979,"su":"뉴욕증시, AI발 급락 충격에 물가 변수까지…반등 기대와 불안 교차 25일 PCE·GDP 발표 앞두고 연준 추가 금리(돈을 빌릴 때 내는 이자 비율) 인상 우려 기술주 과매도에 반등 기대…추수감사절·중동 긴장 변수 [산경투데이 = 이하나 기자] 미국 뉴욕증시가 급격한 기술주 매도세(팔려는 힘)로 큰 폭의 조정을 겪은 가운데 이번 주(11월 23~27일) 발표되는 주요 경제지표가 증시의 향방을 결정할 핵심 변수로 떠오르고 있다. 인공지능(AI) 관련주를 중심으로 투자심리가 급격히 위축된 상황에서 미국의 물가 상승 압력이 예상보다"},{"s":"[모닝포스트] 심야 플래시 폭락, 미국 증시는 엄청난 수준으로 매도하고 있습니다. 필라델피아 반도체 지수는 12% 하락해 2020년 최대 하락폭을 기록했습니다. 국제유가가 급등했다","so":"财联社","tm":"11/22 09:50","c":1,"r":"cn","u":"https://www.cls.cn/detail/2526813","p":1795308626,"a":1795319989,"t":"【早报】深夜闪崩，美股现史诗级抛售；费城半导体指数重挫12%，创2020年来最大跌幅；国际油价，大幅走高","su":"①허라이펑: 인공지능, 컴퓨팅 파워 네트워크 구축 및 기타 분야에 대한 재정 지원 확대 ②국무원의 재정 업무 보고: 중앙회진이 안정화 기금 역할을 할 수 있도록 지원 ③미국 증시는 다우지수가 3% 이상 하락하고 나스닥(미국 기술 회사들이 많은 주식시장) 지수가 5% 이상 하락하는 등 급락했습니다. 매크로 뉴스 1. 중국 공산당 중앙 정치국 위원이자 국무원 부총리인 허리펑이 11월 4일부터 5일까지 조사를 위해 베이징을 방문했습니다. He Lifeng은 새롭고 더 나은 방향으로 경제의 지속적인 발전을 촉진하기 위해서는 기술 혁신과 산업 혁신의 심층적 통합을 강화해야 한다고 지적했습니다. 허라이펑은 또한 인공지능, 컴퓨팅 파워 네트워크 구축 등 분야에서 재정 지원과 요소 보장을 늘리고 혁신적인 개발과 위험 예방 및 통제를 조율하며 새로운 인프라 건설에 대한 투자를 질서있게 확대해야 한다고 지적했습니다."},{"s":"주식시장 조정? 이 최고 투자 책임자는 S&P500이 45% 상승하여 10,000이 될 것으로 보고 있습니다.","so":"Fortune","tm":"11/22 09:02","c":1,"r":"us","u":"https://fortune.com/2026/11/21/stock-market-correction-sp500-2027-forecasts-ai-boom-fed-rate-hikes/","p":1795305720,"a":1795307318,"t":"Stock market correction? This chief investment officer sees the S&P 500 soaring 45% to 10,000","su":"AI 주가가 더 급락하면서 다우존스 산업평균지수와 S&P500(미국 큰 회사 500곳 지수)이 나스닥 조정 국면(고점에서 10% 넘게 내린 상태)에 합류했지만 2026년 역시 침체되고 있으며 월스트리트는 이미 2027년에 대한 예측을 내놓고 있습니다. 분석가들은 미국이 앞으로 확실한 상승세를 보일 것으로 보고 있습니다."},{"s":"연준, 연말 금리 인상, AI 주식 운용 새 전략 | 잡지","so":"UDN","tm":"11/22 08:41","c":1,"r":"tw","u":"https://udn.com/news/story/6848/9889599?from=udn-relatednews_ch1015","p":1795304469,"a":1795307321,"t":"Fed年底升息AI股操作新策略| 雜誌","su":"10월 미국 소비자물가(가게에서 사는 물건값 수준)지수(CPI)는 전월 대비 0.4% 상승했고, 근원 CPI도 전월 대비 0.3% 상승해 시장 예상치(0.3%, 0.2%)를 크게 웃돌며 미국 금융시장에 통화정책 전환 압력이 가해졌다. 케빈 워시(Kevin Wash. 워시) 연방준비제도(연준) 의장)은 인플레이션(물건값이 계속 오르는 것)에 대한 지속적인 경계심을 표명했고, 연준 관계자들도 금리 인상 신호를 잇따라 내놨다. 시장에서는 연준이 12월에 금리를 최소 1포인트 인상할 것으로 예상하고 있다. 미국과 대만의 금리 격차가 계속 벌어지고 있다. 대만 주식과 신대만 달러 역시 외국 자본이 과도하게 매도한 후 송금 압력을 받게 될 것입니다. 미국 금리 인상 전 대만 주식 운용 전략에 대해 국내 증권사들은 \"종목 선정이 성장 추구에서 이익의 질 중심으로 전환되어야 한다\"고 제안한다."},{"s":"뉴욕증시, AI 투자 불안에 급락…월가, 이번 주 최대 806억달러 추가 매도 경고,","so":"아시아투데이","tm":"11/22 08:32","c":1,"r":"kr","u":"https://www.asiatoday.co.kr/kn/view.php?key=20261122010008242","p":1795303948,"a":1795307316,"su":"【기사 요약】▲ 앤트로픽의 완전희석 기업가치는 상장(주식시장에 처음 들어오는 것) 이틀째 종가 기준 약 1조6000억달러로 평가됐다.▲ 기업들은 2030년까지 AI 인프라에 약 5조달러를 투자할 계획이지만, 월가는 수익성에 의문을 제기하고 있다.▲ 앤트로픽은 12월 15일 약 3억주의 추가 거래 가.."},{"s":"주식시장이 10% 하락하는 것은 불안한 일이지만 그다지 특이한 일은 아닙니다.","so":"BNN Bloomberg","tm":"11/22 08:09","c":1,"r":" 5319997,"t":"黄金连连溃败，逼近3500美元关口！华尔街齐呼：已跌入超卖区域","su":"① 지난주 국제 금값은 미화 3,800달러, 3,700달러, 3,600달러 선이 잇달아 하락하며 심리적으로 중요한 3,500달러 선에 접근하는 등 급락세를 겪었다. 2월스트리트 분석가들은 금이 주요 지지선 아래로 떨어질 가능성을 배제하지 않았지만, 특히 금이 과매도 영역에 진입했기 때문에 이번 매도 라운드가 매수 기회라고 믿는 많은 견해가 있습니다. 차이롄서, 11월 22일(편찬춘 편집장) 지난주 국제 금값은 3,800달러, 3,700달러, 3,600달러가 차례로 하락하며 심리적으로 중요한 3,500달러 선에 접근하는 등 큰 폭의 하락세를 보였다. 지난 금요일 미국 금 선물(미래 값을 미리 정해 사고파는 거래)은 4% 하락한 온스당 미화 3,539달러에 마감했습니다. 현물 금은 2.41% 하락한 온스당 미화 3,538.11달러로 장을 마감했고, 장중 최저치인 미화 3,502달러를 기록했다. 주간 하락률은 8.9%로 3월 20일 주 이후 최대 주간 하락폭이다."},{"s":"미국 증시는 필라델피아 반도체 지수가 10% 이상 하락하고, 나스닥도 올해 공백기를 기록하는 등 폭등했다. 다음주 이 데이터는 투자자들의 안정에 대한 희망이 되었습니다 - Daily","so":"工商時報","tm":"11/22 04:00","c":1,"r":"tw","u":"https://www.ctee.com.tw/news/20261122700029-439901","p":1795287600,"a":1795320037,"t":"美股大爆破費半瀉逾10％、那指今年白做工下周這數據成投資人穩盤希望- 日報","su":"AI 투자에 대한 우려가 20일에도 S&P 지수와 다우존스 지수가 모두 조정권에 들어가는 등 미국 증시를 계속 압박했다. 나스닥 지수는 약세장을 피했지만 올해 상승폭을 모두 반납했다. 필라델피아 반도체(전자기기의 두뇌 부품) 지수는 10% 이상 급락했고, TSMC ADR도 10% 가까이 급락했습니다. 20일 다우존스지수와 S&P500(미국 큰 회사 500곳 지수)지수는 각각 1.93%, 3.7% 하락 마감했다. S&P500 지수는 7거래일 연속 하락세를 보이며 2020년 2월 이후 최장 연속 하락세 기록을 세웠습니다. 다우 지수와 S&P500 지수는 역사적으로..."},{"s":"뉴욕증시 매도세, 5대 배경은…제러미 시걸 \"기대치 조정 불가피\"","so":"파이낸셜뉴스","tm":"11/22 03:12","c":1,"r":"kr","u":"https://www.fnnews.com/news/202611220219252872","p":1795284725,"a":1795303130,"su":"뉴욕 증시의 기술주들이 지난주 6년 만에 최악의 주간 매도세(팔려는 힘)를 기록했다.CNBC는 21일 분석기사에서 이번 매도세 배경으로 엔비디아 사태와 앤스로픽 기업공개(주식시장에 처음 들어오는 것) 등 크게 5가지를 꼽았다."},{"s":"다음 주식 시장 붕괴를 통해 1개의 ETF만 보유할 수 있다면, 내가 사고 싶은 것은 다음과 같습니다.","so":"The Globe and Mail","tm":"11/22 01:56","c":1,"r":"world","u":"https://www.theglobeandmail.com/investing/markets/markets-news/motley/8950947/if-i-could-only-hold-1-etf-through-the-next-stock-market-crash-here-s-what-i-d-buy/","p":1795280213,"a":1795281902,"t":"If I Could Only Hold 1 ETF Through the Next Stock Market Crash, Here's What I'd Buy","su":"핵심 포인트 - 시장 붕괴를 통해 보유할 수 있는 최고의 ETF(여러 주식을 묶어 파는 상품)는 좋은 상황과 나쁜 상황에서도 보유할 수 있는 ETF입니다. - 성장 지향적 ETF는 하락장보다 오래 지 /5618/9893546","p":1795275379,"a":1795278527,"t":"國泰標普低波高息 抗風險","su":"Cathay Pacific S&P 저변동성(값이 크게 출렁이는 정도) 및 고금리(00702)는 미국 기술주에 대한 평가 수정과 금리 정책에 대한 불확실성 증가로 인해 단기 변동폭이 확대되면서 주중에 2.2% 하락했습니다. 하지만 00702는 핵심소비, 의료, 금융 등 방어산업을 전개해 리스크를 분산시키는 효과가 있다."},{"s":"월스트리트의 공포지수는 9.7을 기록했습니다. 역사에 따르면 S&P500은 3주 안에 10.5% 상승할 수 있습니다.","so":"Yahoo Finance","tm":"11/22 00:28","c":1,"r":"us","u":"https://finance.yahoo.com/markets/stocks/articles/wall-street-fear-index-just-152829696.html","p":1795274909,"a":1795278523,"t":"Wall Street’s Fear Index Just Hit 9.7. History Says the S&P 500 Could Rally 10.5% in 3 Weeks","su":"패닉이 월스트리트를 휩쓸었고, 지난번 감정이 이렇게 최저로 가라앉았을 때, 개입한 구매자들은 몇 주 안에 보상을 받았습니다. 세 가지 신호는 이번 매도세(팔려는 힘)가 끝났는지 아니면 절반만 끝났는지 보여줍니다."},{"s":"미국 증시는 AI 자본 지출의 이점으로 인해 변동성이 더 큽니다.","so":"經濟日報","tm":"11/22 00:14","c":1,"r":"tw","u":"https://money.udn.com/money/story/5618/9893553?from=edn_finmanagement_index","p":1795274080,"a":1795278530,"t":"美股受 AI 資本支出效益影響 波動加劇","su":"최근 미국 기술주들은 AI 자본지출의 실효성에 대한 시장의 의구심, 연준의 금리정책, 높은 밸류에이션(주가가 비싼지 싼지 따진 값) 등의 영향을 받아왔습니다. 주가변동성(값이 크게 출렁이는 정도)이 심화됐다. 단기적인 시장 심리는 주식시장의 방향에 영향을 미쳐 미국 주식 ETF의 성과에 영향을 미칩니다."},{"s":"우리는 월스트리트의 최대 버블 붕괴를 실시간으로 목격하고 있을지도 모릅니다(인공 지능에 대해 말하는 것이 아닙니다).","so":"The Globe and Mail","tm":"11/21 23:42","c":1,"r":"world","u":"https://www.theglobeandmail.com/investing/markets/markets-news/Motley%20Fool/8950198/we-may-be-witnessing-wall-street-s-biggest-bubble-burst-in-real-time-and-i-m-not-talking-about-artificial-intelligence/","p":1795272134,"a":1795278535,"t":"We May Be Witnessing Wall Street's Biggest Bubble Burst in Real Time (and I'm Not Talking About Artificial Intelligence)","su":"핵심 포인트 - 다우존스 Industrial Average, S&P500(미국 큰 회사 500곳 지수) 및 나스닥 Composite는 AI 혁명이 많은 무거운 작업을 수행하면서 지난 4년 동안 상승세(오르는 흐름)를 보였습니다. - 월스트리트의 위험 감수에 대한 가장 조잡한 척도는 모든 잘못된 신호를 보내는 것입니다."},{"s":"[모닝포스트] 미국 스토리지 및 반도체 주식이 전반적으로 폭발적으로 상승했습니다. 18개 활성 ETF의 첫 번째 배치가 승인되었습니다. 10개 이상의 A주 회사가 자사주 매입을 발표했습니다.","so":"财联社","tm":"11/21 23:39","c":1,"r":"cn","u":"https://www.cls.cn/detail/2509124","p":1795271945,"a":1795320001,"t":"【早报】美股存储、半导体股，全线爆发；首批18只主动ETF获批；10余家A股公司宣布回购","su":"① Pan Gongsheng: 비은행 기관을 위한 대규모 환매 유동성(시장에 도는 돈의 양) 지원 도구 출시 예정 ② Wu Qing: 국경 간, 시장 간, 산업 간 위험 전달에 높은 경계가 필요함 ③ 스토리지 및 반도체 반등으로 미국 증시가 상승했고, 나스닥은 1% 이상 상승했습니다. ④ 18개 활성 ETF의 첫 번째 배치가 승인되었습니다. ⑤ 많은 A주 회사들이 자사주 매입(회사가 자기 주식을 다시 사는 것) 계획을 공개했습니다. 매크로 뉴스 1. 2026년 금융거리포럼 연차총회가 10월 19일 오후 베이징에서 열렸습니다. 판공성(Pan Gongsheng) 중앙은행 총재는 채권시장 안정 메커니즘 구축을 목적으로 국가금융감독관리총국 및 중국 증권감독관리위원회와 협력해 비은행 기관의 대규모 환매에 대응할 수 있는 유동성 지원 도구를 구축하겠다고 밝혔습니다. Pan Gongsheng은 또한 금융 기관의 예금 및 대출에 대한 기준 금리가 철회되고 시장 기반 금리 지표로 대체될 것이라고 말했습니다. 2. 국가금융감독관리국 국장 Ding Xiangqun은 2026년 금융 거리 포럼 연차 회의 개막식에서 모든 금융 활동이 법에 따라 감독을 받게 될 것이라고 밝혔습니다. Ding Xiangqun은 또한 금융 부문의 기관 개방을 위한 다양한 조치를 확고히 추진하고 중국 내 사업 발전을 위해 더 많은 외자 기관과 장기 자본을 지원할 것이라고 말했습니다."},{"s":"[모닝포스트] 유가는 급등했고, 금과 은은 급락했다. 미국 재고 저장 부문은 전체적으로 하락했습니다. 오늘 상장된 Suiyuan Technology; 오라클, 기대 이상의 성능","so":"财联社","tm":"11/21 23:10","c":1,"r":"cn","u":"https://www.cls.cn/detail/2480154","p":1795270231,"a":1795320006,"t":"【早报】油价大涨，黄金、白银大跌；美股存储板块，集体回落；燧原科技，今日上市；甲骨文，业绩超预期","su":"① A주(중국 본토 주식시장 주식)와 관련하여 중국 증권감독관리위원회는 성명을 발표했습니다. ② 상무부: 중국과 미국은 300억 달러 규모의 상호 세금 감면 기본 협약을 협상 중입니다. ③ 미국 증시는 하락 마감했고, 저장 부문과 구리 개념 주식은 하락했습니다. ④ 이란이 노출되었습니다: 외국 에너지 운송 선박에 대한 10% 운임 할증료를 중단했습니다. ⑤ Suiyuan Technology는 오늘 상장(주식시장에 처음 들어오는 것)했습니다. 매크로뉴스 1. 지난 10일 상무부 정례 기자회견에서 황링 상무부 대변인은 관련 질문에 대해 “중미 양국 경제무역팀은 베이징 회담에서 양국 정상이 합의한 합의를 성실히 이행했으며 300억 달러 규모의 상호 세금 감면 기본 협정에 대해 협상 중이며 조기 이행을 위해 노력하고 있다”고 밝혔다. 2. 국가발전개혁위원회와 국가시장감독관리총국은 중요 공산품의 저가 및 무질서 경쟁 원가계산과 관련된 사항에 관한 통지를 발표했다. 이는 저가 및 무질서 경쟁 문제가 두드러지는 중요 공산품 생산 분야에 초점을 맞추고, 저가 및 무질서 경쟁이 의심되는 경영자에게 상기시키고 경고하며, 필요한 경우 경영자의 관련 비용을 계산하기 위해 원가 조사를 조직한다."},{"s":"CTA는 \"떨어질수록 매진된다\"는 악순환에 빠져있습니다! 골드만삭스 \"미국 증시, 다음 주 또 대규모 매도세 보일 것\"","so":"鉅亨網","tm":"11/21 23:10","c":1,"r":"tw","u":"https://news.cnyes.com/news/id/6669718","p":1795270202,"a":1795278531,"t":"CTA陷「愈跌愈賣」惡性循環！高盛：未來一周美股將出現另一波大規模拋售","su":"골드만삭스는 미국 주식이 '매도 압력이 더 큰 매도 압력으로 이어지는' 악순환에 갇혀 있으며 시스템 투자자들은 여전히 대규모로 보유 자산을 줄여야 한다고 경고했다.\nCTA는 지난 달 570억 달러의 주식을 매각했으며 다음 주에는 658억~806억 달러를 추가로 매각할 것으로 예상됩니다.\n앤트로픽의 기업공개(IPO)가 시장 부양에 실패했고, AI 자본 지출(공장·장비 등에 쓰는 큰돈) 수익률(넣은 돈에 비해 얻는 이익 비율)에 대한 의구심이 높아졌으며, 기술주와 소매 투자자 우선주가 계속 하락했습니다."},{"s":"수익성 시험대 오른 AI...대장주 추락에 뉴욕증시 '패닉'","so":"YTN","tm":"11/21 22:34","c":1,"r":"kr","u":"https://www.ytn.co.kr/_ln/0104_202611212234023095","p":1795268040,"a":1795270250,"su":"수익성 의구심에 애플 독자 AI 에이전트 개발 악재 / 엔비디아, 회계 조사 보도·리더십 공백 위기 / 미 정책 변수·금리(돈을 빌릴 때 내는 이자 비율)인상 우려…AI 인프라 확장 제동"},{"s":"소프트뱅크, SK하이닉스 인수 원해? 손정의는 한때 1조달러 지출을 고려했고 월스트리트에 접촉했다.","so":"鉅亨網","tm":"11/21 22:10","c":1,"r":"tw","u":"https://news.cnyes.com/news/id/6669717","p":1795266605,"a":1795270252,"t":"軟銀欲收購SK海力士？孫正義一度考慮砸1兆美元、已接洽華爾街","su":"손정의는 SK하이닉스 인수를 평가하고 자금조달을 위해 월스트리트에 연락했다. 소프트뱅크는 이를 고려했지만 더 이상 적극적으로 추진하지 않는다고 확인했습니다.\n거래 규모는 1조 달러에 가까울 것으로 예상된다. 주된 이유는 자금 조달(사업에 쓸 돈을 모으는 것) 수요가 엄청나고 월스트리트 기관이 이를 기꺼이 수행할 의지가 없기 때문입니다. 규제 검토의 장애물도 있습니다.\n이것이 실현된다면 소프트뱅크 AI 환경의 메모리 공백을 메우고 HBM(인공지능용 빠른 메모리) 등 AI 칩의 핵심 공급망을 통제할 수 있다."},{"s":"뉴욕증시 또 급락…“돌파구가 보이지 않아”","so":"KBS 뉴스","tm":"11/21 21:08","c":1,"r":"kr","u":"https://news.kbs.co.kr/news/view.do?ncd=8719192","p":1795262880,"a":1795265068,"su":"[앵커] 뉴욕증시가 심상치 않습니다. 이틀 연속 폭락했습니다. 그 중심엔 역시나 AI 반도체(전자기기의 두뇌 부품) 기업들이 있었..."},{"s":"미국 10월 비농업 고용 데이터가 예상을 뛰어넘었습니다! AI 컴퓨팅 파워 확장 사이클은 계속될 수 있을까? 전경의 기하학은 무엇입니까? 여러 요인의 교란 속에서 금 가격 추세를 어떻게 추론할 수 있습니까?丨20261109월스트리트에서 루자쭈이까지","so":"第一财经","tm":"11/21 20:42","c":1,"r":"cn","u":"https://www.yicai.com/video/103431959.html","p":1795261370,"a":1795320011,"t":"美国10月非农就业数据大超预期！AI算力扩张周期能否延续？前景几何？多重因素扰动下金价趋势如何推演？丨20261109从华尔街到陆家嘴"},{"s":"이번 주에는 기술주가 상승세를 보이고 있습니다! 엔비디아는 23% 하락했지만 S&P 3개 구성주는 더욱 심하게 하락했습니다.","so":"經濟日報","tm":"11/21 19:42","c":1,"r":"tw","u":"https://money.udn.com/money/story/123398/9893571","p":1795257734,"a":1795270253,"t":"科技股本周大翻車！NVIDIA 跌23% 但這三檔標普成分股跌更兇","su":"미국 기술주는 이번 주 엄청난 반등(내렸다가 다시 오르는 것)을 경험했으며, 정보기술(IT) 주식이 매도 압력의 최전선에 섰습니다. 스캔들에 휘말리며 각종 관계자들의 조사를 받고 있는 엔비디아의 주가는 일주일 동안 20% 이상 하락했다. 그러나 S&P500(미국 큰 회사 500곳 지수) 지수를 구성하는 다른 3개의 주식은 엔비디아보다 훨씬 더 심하게 하락했습니다."},{"s":"AI 버블 붕괴 신호탄인가, 숨 고르기인가…유동성 한계 부딪힌 미국 증시","so":"한국경제","tm":"11/21 19:32","c":1,"r":"kr","u":"https://www.hankyung.com/article/202611211559i","p":1795257142,"a":1795259665,"su":"- 기사 스크랩 - 댓글 - 공유 - 글자크기 - 프린트 Google 검색에서 한국경제 기사를 더 자주 볼 수 있습니다. 최근 나스닥 폭락은 유동성(시장에 도는 돈의 양) 공급 과잉, 테크노달러 균열, 매파적 연준 우려 등이 맞물린 결과로, AI 시장이 인프라 구축 단계에서 벗어나 본격적인 수익 모델 검증과 옥석 가리기 국면으로 진입하고 있음을 시사합니다. 파이낸셜타임스와 블룸버그 등 외신에 따르면 시장의 분위기가 ‘묻지마 매수’에서 ‘패닉성 대피’로 급변한 배경에는 단순한 차익 실현(오른 주식을 팔아 이익을 챙기는 것)을 넘어, △ 감당하기 힘든 수준의 주식·채권 물량 공세(유동성 한계) △ AI 자금 순환 구조인 ‘테크노달러’의 균열 △ 금리 인상 공포와 지정학적 악재의 동시다발적 충돌이 자리 잡고 있다."},{"s":"연준 정책 충격이 다가오고 있는가? 쿡은 금리가 AI 구축을 방해하지 않았으며 너무 오래 기다리면 금리를 더 크게 인상해야 할 수도 있다고 말했습니다.","so":"鉅亨網","tm":"11/21 19:13","c":1,"r":"tw","u":"https://news.cnyes.com/news/id/6669775","p":1795256017,"a":1795259677,"t":"聯準會政策衝擊要來了？庫克指利率未抑制AI建設，等太久恐需更大幅升息","su":"연준 정책 충격이 다가오고 있는가? Cook은 금리가 AI 구축을 방해하지 않았으며, 너무 오래 기다리면 금리를 더 크게 인상해야 할 수도 있다고 말했습니다. Uanalyze 2026년 11월 21일(Uanalyze/Industry Data Center Report) ⸺ 미국 연준 총재 Lisa Cook은 현재 금리가 AI 인프라 구축을 크게 억제하지 않았으며 금융 여건이 여전히 경제를 뒷받침하기에는 너무 강하다고 말했습니다. 그녀는 9월에 금리를 1포인트 인상하는 것이 인플레이션(물건값이 계속 오르는 것) 추세를 반전시키기에 충분한지 의문을 제기했으며, 조치를 취하기 전에 인플레이션 압력이 더 분명하다면 향후 더 큰 금리 인상이 필요할 수 있다고 경고했습니다. 그녀는 12월에 금리를 인상해야 하는 구체적인 금액을 제안하지 않았습니다. 쿡은 지난 20일 칠레 중앙은행 연설에서 미국 기업들이 명명된 데이터센터(컴퓨터 수만 대를 모아 둔 건물) 건설 프로젝트에 2조 달러 이상을 발표했지만 지금까지 실제로 투자된 부분은 극히 일부에 불과하다고 지적했다. 그럼에도 불구하고 그녀는 건설 수요가 칩 및 첨단 장비 가격, 건설 임금 및 전기 가격에 영향을 미치는 것을 목격했습니다. 그녀의 초점은 AI가 장기적으로 생산성을 높일 수 있는 기회가 있지만 이러한 시설이 완성되기 전에 기업은 먼저 장비를 구입하고 직원을 고용하고 전력 공급을 준비해야 하며 투자 필요성은 경제 데이터에서 먼저 나타난다는 것입니다."},{"s":"앤트로픽의 데뷔는 월스트리트와 실리콘 밸리의 단절을 보여줍니다","so":"The New York Times","tm":"11/21 19:03","c":1,"r":"us","u":"https://www.nytimes.com/2026/11/21/business/anthropics-debut-shows-the-disconnect-between-wall-street-and-silicon-valley.html","p":1795255424,"a":1795259666,"t":"Anthropic’s Debut Shows the Disconnect Betwe “医药保学面对面”首站在穗举办 推动创新药落地","su":"혁신적인 약물의 구현을 촉진하기 위해 첫 번째 '학교 보호를 위한 대면 의학' 행사가 광저우에서 개최되었습니다. 중국신보사, 광저우, 11월 21일(채민제 기자) 21일 광저우에서 2026년 의료보험약품 카탈로그 신품종 대상 '학교보호를 위한 대면의학' 행사(제1차)가 열렸다. 이번 행사에서 발표된 신호는 더욱 명확합니다. 국민의료보험청은 혁신적인 의약품 접근의 초점을 \"카탈로그 입력\"에서 \"병원 입력, 처방전 입력, 강의실 입력\"으로 확대하여 신약이 환자의 실제 요구에 더 빨리 혜택을 줄 수 있도록 하고 있습니다. 혁신적인 의약품의 경우 카탈로그에 포함되는 것은 단지 \"임신 증명서\"일 뿐입니다. 실제 접근성은 해당 약물이 임상(새 약을 사람에게 시험하는 것)적으로 알려져 있는지, 사용할 수 있는지, 환자가 찾을 수 있는지에 따라 달라집니다. 국민의료보험국 약품서비스관리부 황신위 국장은 2026년 의료보험 약품 목록에 신품종과 관련 정책이 추가될 것이라고 소개했다. 2026년판 의료보험 약품 목록에는 총 3,331종의 약품이 있는데, 그중 신규 약품이 107개이고 이전된 약품이 34개이다. 신약 중 103개는 5년 이내에 새로 출시된 신약이고, 51개는 카테고리 1 신약으로 모두 새로운 최고치입니다. 60개 신약에는 화학약품, 36개 생물의약품, 11개 중국전통특허의약품이 포함된다. 신약 중 종양분야는 29개, 만성질환은 21개, 희귀질환은 18개다."},{"s":"강력한 위험 회피, 신흥 생명공학 및 구리 주식 상승","so":"中時新聞網","tm":"11/21 05:10","c":2,"r":"tw","u":"https://www.chinatimes.com/newspapers/20261121000274-260206","p":1795205400,"a":1795215144,"t":"避險情緒濃 興櫃生技、銅板股崛起","su":"대만 증시 폭락이 계속되는 가운데 가치주(제값보다 싸 보이는 주식)들이 공매도(주식을 빌려서 먼저 파는 것)자들의 피바다를 겪고 있다. 시장펀드는 보수적으로 변했고, 신흥시장에서는 생명공학과 저가주가 추세를 거스르고 있다. 이번 주 주간 상승률 상위 10개 기업의 통계에 따르면, 생명공학 주식은 단숨에 7계단 하락했습니다. 시지바이오메디칼(7595)이 주간 15.3% 상승하며 우승을 차지했다. 공황상태의 매도 압력으로 인해 전자는"},{"s":"Alnylam 협력사 Regeneron, 9년 이내에 Alnylam RNAi 플랫폼의 7번째 FDA 승인 치료제인 Livsayis™(cemdisiran)에 대한 FDA 승인 획득 - 회사 발표 - FT.com","so":"Financial Times","tm":"11/19 21:00","c":2,"r":"world","u":"https://markets.ft.com/data/announce/detail?dockey=600-202611190700BIZWIRE_USPRX____20261119_BW295782-1","p":1795089600,"a":1795094270,"t":"Alnylam Collaborator Regeneron Secures FDA Approval of Livsayis™ (cemdisiran), the Seventh FDA-Approved Therapeutic from Alnylam's RNAi Platform in Less Than Nine Years – Company Announcement - FT.com"},{"s":"생명공학 개척자, 상장 시작을 위해 영국 자본 이득세 감면 요구","so":"Financial Times","tm":"11/22 14:00","c":1,"r":"world","u":"https://www.ft.com/content/01e128fd-58b4-44e9-8c31-c9d0a909b9b7?syn-25a6b1a6=1","p":1795323606,"a":1795334526,"t":"Biotech pioneer calls for UK capital gains tax cut to kick-start listings"},{"s":"야오화제약의 신약 매출실적 - 데일리","so":"工商時報","tm":"11/22 04:00","c":1,"r":"tw","u":"https://www.ctee.com.tw/news/20261122700175-439903","p":1795287600,"a":1795320052,"t":"藥華藥新藥銷售奏捷- 日報","su":"Yaohua Pharmaceutical(6446)은 핵심 신약인 Ropeg의 글로벌 매출의 지속적인 성장으로 이익을 얻었습니다. 첫 3분기 동안 NT$18.43의 탁월한 세후 주당순이익(주식 한 주가 번 돈)을 달성했습니다. 다만, 시장 하락세로 인해 주가는 하향조정됐다. 지난 5일 동안 20.3% 하락해 20일 NT$1,100에 마감했다. 기술적 그림에서는 숏포지션을 보이고 있지만, 주요 기관투자가 3사가 동시에 2일 이상 매수세(사려는 힘)를 보이고 있어 시장전망에 유리하다. 10월에는 본태혈소판증가증(E..."},{"s":"주목해야 할 Little Green Pharma와 호주 생명공학 주식 2개","so":"Yahoo Finance","tm":"11/22 02:10","c":1,"r":"us","u":"https://finance.yahoo.com/healthcare/articles/little-green-pharma-2-australian-171004251.html","p":1795281004,"a":1795303148,"t":"Little Green Pharma And 2 Australian Biotech Stocks To Watch","su":"호주 경제는 실업률이 증가하고 경기 침체(나라 경제가 쪼그라드는 것)에 대한 이야기가 늘어나면서 압박을 받고 있습니다. 이로 인해 많은 투자자들이 현지 수요와 보조를 맞추지 못하는 지역으로 몰려들게 되었습니다. 생명공학에서는 의학의 혁신이 GDP 헤드라인보다 가치 평가에 더 중요할 수 있으며, 이러한 단절은 강력할 수 있습니다. 이 기사에서는 상대적으로 투자 가치가 높은 세 가지 호주 생명공학 주식을 살펴봅니다."},{"s":"수익 성장이 최대 26%인 생명공학 주식 3개","so":"Yahoo Finance","tm":"11/21 16:14","c":1,"r":"us","u":"https://finance.yahoo.com/healthcare/articles/3-biotech-stocks-revenue-growth-071419779.html","p":1795245240,"a":1795248109,"t":"3 Biotech Stocks With Revenue Growth Up To 26%","su":"S&P500(미국 큰 회사 500곳 지수)이 조정 국면(고점에서 10% 넘게 내린 상태)에 빠지고 유명 AI 주식이 휘청거리면 투자자들은 덜 붐비지만 여전히 잠재력이 가득한 지역을 찾기 시작합니다. 이는 더 건강한 대차대조표를 갖춘 더 높은 위험, 더 높은 보상의 생명공학 기회가 흥미로워 보일 수 있는 곳입니다. 이 기사에서는 집중 스크리너에서 추출한 세 가지 생명공학 주식을 살펴보며 각 주식이 왜 하락할 수 있는지 강조합니다."},{"s":"췌장암︱종양을 줄이거나 없앨 수 있는 새로운 약, 전문가들은 '십년 만에 가장 큰 도약'이라고 부른다","so":"星島頭條","tm":"11/21 09:23","c":1,"r":"hk","u":"https://www.stheadline.com/realtime-world/3639510/%E8%83%B0%E8%87%9F%E7%99%8C%E6%96%B0%E8%97%A5%E4%B8%B8%E8%83%BD%E7%B8%AE%E5%B0%8F%E6%88%96%E6%B6%88%E9%99%A4%E8%85%AB%E7%98%A4-%E5%B0%88%E5%AE%B6%E7%A8%B1%E6%95%B8%E5%8D%81%E5%B9%B4%E4%BE%86%E6%9C%80%E5%A4%A7%E8%BA%8D%E9%80%B2","p":1795220581,"a":1795226144,"t":"胰臟癌︱新藥丸能縮小或消除腫瘤 專家稱「數十年來最大躍進」","su":"췌장암은 홍콩에서 치명적인 암의 네 번째 주요 원인이며, 최근 주요 치료법이 개발되었습니다. 미국의 초기 임상 시험에서는 매일 약을 복용하면 이러한 유형의 암에 걸린 일부 환자의 종양이 줄어들거나 심지어 제거될 수 있다는 사실이 밝혀졌습니다. 영국 암연구소(Cancer Research UK)는 이를 췌장암 치료에 있어 \"수십년 만에 가장 큰 도약\"이라고 설명했습니다. 뉴욕 메모리얼 슬론 케터링 암센터(Memorial Sloan Kettering Cancer Center)가 주도한 이번 연구에서는 환자의 8.2%가 종양이 '완전 관해'된 것으로 나타났으며 지난 금요일 스페인 바르셀로나에서 열린 유럽 암 연구 컨퍼런스에서 발표됐다. 1상 및 2상 임상시험(새 약을 사람에게 시험하는 것)에는 전이성 췌장암 치료를 받지 않은 환자 61명이 참여했으며, 매일 새로운 신약을 200mg 복용했습니다."},{"s":"Capricor의 Duchenne 치료제가 FDA 승인을 얻지 못해 주가가 하락했습니다.","so":"Reuters","tm":"11/21 08:42","c":1,"r":"us","u":"https://www.reuters.com/legal/litigation/us-fda-declines-approve-capricors-cell-therapy-duchenne-muscular-dystrophy-2026-11-20/","p":1795218120,"a":1795230983,"t":"Capricor's Duchenne treatment fails to get FDA approval, shares sink"},{"s":"췌장암 치료에 생명공학 주식 거래 타격","so":"Investor's Business Daily","tm":"11/21 06:16","c":1,"r":"us","u":"https://www.investors.com/news/technology/revolution-medicines-erasca-biotech-stocks-pancreatic-cancer/","p":1795209360,"a":1795278542,"t":"Biotech Stocks Trade Blows In Pancreatic Cancer Treatment","su":"Erasca는 금요일에 췌장암 치료에 도전장을 던졌고 Revolution Medicines는 이를 바로 뒤로 던졌습니다."},{"s":"FDA는 코로나 백신 기록을 놓고 법정 싸움에서 승리한 단체에 법적 비용을 지불해야 합니다.","so":"Reuters","tm":"11/21 05:31","c":1,"r":"us","u":"https://www.reuters.com/legal/government/fda-must-pay-legal-fees-group-that-won-court-fight-over-covid-vaccine-records-2026-11-20/","p":1795206704,"a":1795230984,"t":"FDA must pay legal fees to group that won court fight over COVID vaccine records"},{"s":"Novo, 터너 증후군 아동을 위한 최초의 주간 성장 호르몬 치료에 대해 FDA 승인 획득","so":"Yahoo Finance","tm":"11/21 03:06","c":1,"r":"us","u":"https://finance.yahoo.com/healthcare/articles/novo-gets-fda-approval-first-180617592.html","p":1795197977,"a":1795215141,"t":"Novo Gets FDA Approval For First-Of-Its-Kind Weekly Growth Hormone Treatment For Children With Turner Syndrome","su":"이번 승인은 터너증후군 아동 105명을 대상으로 한 Novo의 3상 Real8 임상시험(새 약을 사람에게 시험하는 것)의 지원을 받았습니다."},{"s":"FDA, 사바라의 희귀 폐질환 치료제 승인 기한 놓칠 듯","so":"Reuters","tm":"11/20 23:28","c":1,"r":"us","u":"https://www.reuters.com/legal/litigation/fda-miss-deadline-savaras-rare-lung-disease-drug-approval-2026-11-20/","p":1795184892,"a":1795230986,"t":"FDA to miss deadline on Savara's rare lung disease drug approval"},{"s":"진야오제약(Jinyao Pharmaceutical): 베타메타손 API가 FDA DMF FA Letter 획득","so":"第一财经","tm":"11/20 16:56","c":1,"r":"cn","u":"https://www.yicai.com/news/103448198.html","p":1795161405,"a":1795175793,"t":"津药药业：倍他米松原料药取得FDA DMF FA Letter","su":"제일재경 2026-11-20 15:55:30 편집자: Zhang Xiao Jinyao Pharmaceutical은 최근 미국 식품의약국(\"FDA\")이 발행한 DMF First Adequate Letter(\"DMF FA Letter\")를 받았다고 발표했습니다. 베타메타손은 저레닌 및 저알도스테론 증후군과 자율신경병증으로 인한 체위성 저혈압, 알레르기성 및 자가면역 염증성 질환에 적합합니다. 현재는 주로 활동성 류마티스, 류마티스 관절염, 홍반성 루푸스, 중증 기관지 천식, 중증 피부염, 급성 백혈병 등에 사용됩니다. 또한 특정 감염의 종합 치료에도 사용됩니다."},{"s":"리제네론, 앨라일람 'C5 siRNA' gMG \"FDA 승인\"","so":"바이오스펙테이터","tm":"11/20 15:50","c":1,"r":"kr","u":"https://www.biospectator.com/news/view/30475","p":1795157400,"a":1795158234,"su":"리제네론 파마슈티컬(Regeneron Pharmaceuticals)의 C5 siRNA ‘셈디시란(cemdisiran)’이 중증근무력증(gMG) 치료제로 미국에서 승인받았다. 이번 승인은 gMG의 약 85%를 차지하는"},{"s":"인누오제약 GLP-1, 아직도 해외에서 잘 팔릴 수 있을까?","so":"Jiemian.com","tm":"11/20 14:06","c":1,"r":"cn","u":"https://www.jiemian.com/article/15354220.html","p":1795151201,"a":1795158235,"t":"银诺医药的GLP-1能还海外大卖吗？","su":"지몐 뉴스 기자 | Jiemian 뉴스 편집자 | 시에신(Xie Xin) 국산 글루카곤유사펩타이드-1(GLP-1) 수용체 작용제 이수파글루타이드α 주사제가 해외 출시됐다. 인누오제약은 자회사 홍콩인누오(Hong Kong Yinnuo)가 글로벌 제약그룹 아르세라 라이프사이언스(Arcera Life Sciences)의 회원사인 아르세라 라이프사이언스(Arcera Life Sciences LTD)와 라이선스 계약을 체결해 핵심 제품인 에프수바글루타이드 알파(상품명 '에프수바글루타이드 알파')에 대한 아프리카, 라틴 아메리카, 중동, 동유럽 여러 국가에서 인체 치료 목적으로 독점 개발 및 상업화 권리를 부여한다고 밝혔다. 최초 라이센스 기간은 15년입니다."},{"s":"Xingrui Pharmaceuticals는 화이자와 최대 23억 달러의 마일스톤 지급액으로 독점 라이센스 계약을 체결했습니다. 홍콩 혁신신약 ETF Boshi(520690)의 중장기 배분가치가 상당하다.","so":"Jiemian.com","tm":"11/20 12:29","c":1,"r":"cn","u":"https://www.jiemian.com/article/15354120.html","p":1795145340,"a":1795158236,"t":"星锐医药与辉瑞达成独家许可协议，里程碑付款最高达23亿美元，港股创新药ETF博时(520690)中长期配置价值显著","su":"홍콩 혁신 약물 ETF(여러 주식을 묶어 파는 상품) Boshi(520690)는 항셍 Hong Kong Stock Connect Innovative Drug Select Index를 추적합니다. Xingrui Pharmaceuticals와 화이자는 상당한 중장기 할당 가치를 지닌 최대 23억 달러의 협력에 도달했습니다."},{"s":"혁신신약 연말고사: '신념의 자리'부터 '성과의 자리'까지, 2027년 답안지는 누가 내놓을 수 있을까?","so":"36Kr","tm":"11/20 12:05","c":1,"r":"cn","u":"http://www.36kr.com/p/4077498233362304","p":1795143908,"a":1795144466,"t":"创新药年末大考：从“信仰仓位”到“业绩仓位”，谁能交出2027的答卷？","su":"혁신신약(세상에 처음 나온 새로운 약) 연말고사: '신념의 자리'부터 '성과의 자리'까지, 2027년 답안지는 누가 내놓을 수 있을까? 11월 중순부터 시작되는 1년 중 가장 집중적인 포지션 조정 기간이다. 기관은 내년에 어디에 돈을 투자할지 결정해야 하고, 개인 투자자는 남을지 떠날지 결정해야 합니다. 이때 시장은 더 이상 새로운 이야기를 원할 뿐만 아니라 어떤 회사가 실제로 돈을 벌고 있는지, 어떤 회사가 여전히 기대에 머물고 있는지 알고 싶어합니다. 지난 2년간 혁신신약 자금의 상당 부분을 임상(새 약을 사람에게 시험하는 것) 데이터, 허가, 트랙 스토리 등 상상력에 투자했습니다. 이러한 베팅은 올 가을에 차례대로 이루어졌습니다. Kangfang의 ivocilimab은 FDA로부터 완전한 응답 편지를 받았고 마케팅이 거부되었으며 Ingen DB-1303의 3상 데이터는 \"통계적으로 유의미하지만 보통\"이었고 Connoya의 CMG901의 PFS는 통계적으로 유의한 기준을 통과하지 못했습니다. 세 기업의 각자의 상황을 단독으로 보고, 종합적으로 보면 시장은 다시 '현금화' 입찰에 나서기 시작했다."},{"s":"뇌 전달력 높이고 월 1회 투약으로…유한양행, 사노피 이어 ‘고셔병 신약’ 도전","so":"Chosunbiz","tm":"11/20 11:37","c":1,"r":"kr","u":"https://biz.chosun.com/science-chosun/bio/2026/11/20/JOQLLKLY35FCRE3OW5YWFNXCZU/","p":1795142220,"a":1795144465,"su":"뇌 전달력 높이고 월 1회 투약으로유한양행, 사노피 이어 고셔병 신약 도전 사노피, 세계 최초 고셔병 3형 신약 FDA 승인 유한양행, BBB 통과해 신경증상 개선·월 1회 투약 목표 사노피 임상(새 약을 사람에게 시험하는 것)서 정신건강 이상반응 보고장기 안전성 입증 관건"},{"s":"캔버스가 연일의 정지고, 유럽 당국이 제3상 임상시험 개시 승인","so":"四季報オンライン","tm":"11/20 10:05","c":1,"r":"jp","u":"https://shikiho.toyokeizai.net/news/0/965447","p":1795136757,"a":1795144469,"t":"キャンバスが連日のストップ高､欧州当局が第3相治験開始承認","su":"콘텐츠 차단이 활성화된 것으로 감지되었습니다. 이 사이트를 사용하려면 콘텐츠 차단 기능(예: 광고 차단 기능이 있는 확장 프로그램)을 비활성화하고 페이지를 다시 로드하세요. 마이크로소프트 Edge를 사용하는 경우 개인 정보 설정이 영향을 받을 수 있으므로 이 설정 화면 <edge://settings/privacy/trackingPrevention>에 접속하여 \"추적 방지 활성화\" 설정을 \"균형(권장)\"으로 설정하시기 바랍니다. 자세한 내용은 사용자 가이드를 참조하세요."},{"s":"주목해야 할 Medexus Pharmaceuticals 및 기타 캐나다 생명 the Middle East, Turkey is a regional economic hub with a fast-growing electric vehicle market and a rapidly expanding energy storage industry, and the transition to clean energy is driving demand for specialist battery support. Its \"National Energy 2040\" plan proposes to achieve the goal of 20 million electric vehicles and 140 GWh of energy storage capacity by 2040. In this context, Ningjia Services provides full life cycle battery services for road vehicles and power grids, further consolidating the infrastructure on which this transformation depends. 닝자 서비스 체험 센터는 이스탄불에 위치해 있습니다. 이는 CATL과 Ascendum Group의 자회사인 Ascendum Türkiye 간의 협력에 있어서 중요한 이정표입니다. 포괄적인 수명주기 애프터 서비스 지원을 제공하고 현지 기술 인재를 육성하며 첨단 전기 산업을 가속화합니다."},{"s":"보도자료: EV 등의 사용이 끝난 차재 리튬 이온 전지의 객관적인 안전성·성능 평가 기준을 정한 JIS 제정(PR TIMES)","so":"毎日新聞","tm":"11/20 16:54","c":2,"r":"jp","u":"https://mainichi.jp/articles/20261120/pr2/00m/020/804000c","p":1795161246,"a":1795175816,"t":"プレスリリース：EV等の使用済み車載リチウムイオン電池の客観的な安全性・性能評価基準を定めた JIS制定（PR TIMES）","su":"일본발의 국제 규격에 완전 정합. 2차 이용(리퍼패스)의 평가기준을 명확히 하고, 축전지 시장의 성장과 서큘러 이코노미의 실현을 뒷받침. 일반 재단법인 일본 규격 협회(본부: 도쿄도 미나토구, 이사장: 아사히 히로)는 2026년 11월 20일에 국제 규격 IEC 63330-1:2024와 일치한 이차 전지의 리퍼 패스에 관하여"},{"s":"히타치와 히타치 하이테크, 전고체 전지의 품질 평가를 위한 분석·해석 기술 개발","so":"日本経済新聞","tm":"11/20 16:39","c":2,"r":"jp","u":"https://www.nikkei.com/article/DGXZRSP715599_Q6A121C2000000/","p":1795160347,"a":1795175813,"t":"日立と日立ハイテク、全固体電池の品質評価に向けた分析・解析技術を開発","su":"【프레스 릴리스】발표일:2026년 11월 20일 전고체 전지의 품질 평가를 향한 분석·해석 기술을 개발 금속 이물의 혼입에 의한 성능 영향을 평가해, 양산시에 확인해야 할 항목의 정리를 지원 히타치와 히타치 하이테크는, 전고체 전지의 실용화·양산화를 향해 중요해지는 품질 평가를 지탱하기 위해, 제조 공정에서 혼입 히타치 하이테크의 전자 현미경이나 X 선 분석 장치 등의 첨단 분석 기기를 활용"},{"s":"CATL의 자회사인 Fuding New Energy Technology Company, 자본금을 55억으로 증자","so":"Jiemian.com","tm":"11/20 15:22","c":2,"r":"cn","u":"https://www.jiemian.com/article/15354615.html","p":1795155774,"a":1795158247,"t":"宁德时代旗下福鼎新能源科技公司增资至55亿","su":"Tianyancha 앱에 따르면 CATL(Fuding) New Energy Technology Co., Ltd.는 최근 산업 및 상업 변화를 겪었으며 등록 자본금은 lks-with-chinas-catl-for-rechargeable-batteries-report/68357867?next=1","p":1795247229,"a":1795270287,"t":"Tesla in talks with China's CATL for rechargeable batteries: Report"},{"s":"JA Solar가 자체 개발한 배터리 여권 플랫폼이 EU 강제 접근 요구 사항을 충족하기 위해 온라인에 출시되었습니다.","so":"經濟日報","tm":"11/21 16:00","c":1,"r":"tw","u":"https://money.udn.com/money/story/123828/9893297","p":1795244432,"a":1795248137,"t":"晶澳自研電池護照平台上線，滿足歐盟強制准入要求","su":"베이징, 2026년 11월 21일 /PRNewswire/ -- 글로벌 에너지 전환의 물결 속에서 수명 주기 전반에 걸친 배터리의 투명성과 추적성은 에너지 저장의 핵심 운반체로서 국제 시장의 관심의 초점이 되었습니다. EU 배터리 여권 요구 사항이 점진적으로 구현됨에 따라 유럽 시장에 진출하는 배터리 제품은 새로운 정보 관리 요구 사항에 직면하게 됩니다. JA Solar가 자체 개발한 배터리 패스포트 플랫폼 01 '배터리 패스포트'란 정확히 무엇인가요? 배터리 여권은 실제 배터리에 바인딩된 디지털 기록입니다. QR 코드와 고유 식별자(ISO/IEC 15459 표준 기반)를 통해 \"탄생부터 폐기까지\" 배터리의 주요 데이터가 직렬로 연결되어 신원 정보, 재료 구성, 탄소 발자국, 재활용 재료 함량, 성능 내구성, 건강 상태, 공급망(부품·재료가 오가는 연결망) 실사 및 폐기 처리 등 전체 수명 주기 정보를 포괄합니다. 02 주요 일정: 규정 준수 준비를 계속해야 합니다. EU의 배터리 및 폐배터리 규정(규정(EU) 2023/1542)에 따라 2027년 2월 18일부터 EU 시장에 출시되거나 사용되는 소형 자동차 배터리, 2kWh 이상의 산업용 배터리, 전기 자동차 배터리에는 배터리 여권을 장착해야 합니다. 이 요구 사항을 충족하기 위해 JA Solar는"},{"s":"중고차 배터리에서 '블랙 골드'를 찾는 노르웨이","so":"ET Auto","tm":"11/21 14:42","c":1,"r":"us","u":"https://auto.economictimes.indiatimes.com/news/auto-components/norways-quest-for-black-gold-from-used-car-batteries/101384719?next=1","p":1795239724,"a":1795282027,"t":"Norway's quest for 'black gold' from used car batteries"},{"s":"폐전기차 배터리를 금으로 바꿀 수 있을까? 중국 본토에서 '도시 광산' 사업 기회 폭발","so":"中時新聞網","tm":"11/21 14:30","c":1,"r":"tw","u":"https://www.chinatimes.com/realtimenews/20261121001926-260409","p":1795239013,"a":1795248139,"t":"電動車報廢電池變黃金？大陸「城市礦山」商機爆發","su":"폐기된 신에너지 자동차용 동력배터리는 제대로 처리하지 않으면 오염원이 될 수 있지만, 제대로 재활용하면 '도시 광산'이 될 수 있다. 중국 본토에서 신에너지 차량의 수가 급속히 증가하고 있으며, 전력 배터리의 폐기가 다가오고 있습니다. 관계자들은 밀집된 재활용 네트워크 구축을 가속화하고 배터리 흐름을 감시하며 수천억 위안 규모의 순환 경제 시장을 점유하고 있습니다. 중국-싱가포르"},{"s":"촘촘하게 짜여진 중국 배터리 재활용 네트워크, 1000억 규모 '도시 광산'으로 부상 - China News Service","so":"中国新闻网","tm":"11/21 13:50","c":1,"r":"cn","u":"https://www.chinanews.com.cn/cj/2026/11-21/10735679.shtml","p":1795236632,"a":1795278552,"t":"中国织密电池回收网络千亿级“城市矿山”崛起-中新网","su":"중국의 고밀도 배터리 재활용 네트워크 수천억 개의 '도시 광산' 증가 폐기된 신에너지 차량용 동력 배터리는 버리면 오염되지만 재활용하면 풍부한 광석이 될 것입니다. 올해 6월 말 현재 중국의 신에너지차 대수는 4,897만 대에 달했다. 이 숫자 뒤에는 전례 없는 전력 배터리 폐기의 물결이 다가오고 있습니다. 최근 상무부를 포함한 9개 부서가 공동으로 \"재생 가능한 자원 재활용 시스템 구축을 심층적으로 추진하고 재활용 산업의 고품질 발전을 촉진하기 위한 의견\"을 발표하여 특별 장 형태로 \"3가지 새로운 유형\"의 고형 폐기물 재활용 및 활용에 대한 전반적인 조치를 취했습니다. 표면적으로는 '폐기물 수집'에 관한 것처럼 보이지만, 자세히 보면 이는 산업체인의 안보와 관련된 장기화된 자원전쟁이다. 동시에 거대한 시장의 형성이 가속화되고 있다."},{"s":"Yiwei Lithium Energy Liu Jincheng: 2027~2028년 대형 원통형 배터리 납품 규모가 100GWh를 초과할 것","so":"Jiemian.com","tm":"11/21 11:58","c":1,"r":"cn","u":"https://www.jiemian.com/article/15357631.html","p":1795229938,"a":1795230995,"t":"亿纬锂能刘金成：2027‑2028年大圆柱电池交付规模将超100 GWh","su":"원본 뉴스 Gao JingGJ · 출처: Jiemian News 11월 21일, 제11회 파워 배터리 응용 국제 서밋(CBIS2026) 기업가 고위급 포럼이 상하이에서 열렸습니다. Yiwei Lithium Energy의 Liu Jincheng 회장은 회의에서 회사가 대형 원통형 및 대형 사각형 배터리 트랙 레이아웃에 중점을 두고 있다고 소개했습니다. 2027~2028년에는 대형 원통형 배터리 납품 규모가 100GWh를 넘어설 것으로 예상된다. 현재 702Ah 대형 각형 배터리 수요는 강하지만 공급 격차가 존재한다."},{"s":"Zhuhai Guanyu Xu Yanming: 리튬 배터리 산업은 대내외 특허 문제에 직면해 있으며, 내부 차단 소송을 중단하고 외부 세계에 대한 통합적인 접근을 요구하고 있습니다.","so":"Jiemian.com","tm":"11/21 11:36","c":1,"r":"cn","u":"https://www.jiemian.com/article/15357594.html","p":1795228616,"a":1795230995,"t":"珠海冠宇徐延铭：锂电行业面临专利内忧外患，呼吁停止内部阻击式诉讼、抱团一致对外","su":"11월 21일, Zhuhai Guanyu 회장 Xu Yanming은 제11회 국제 전력 배터리 응용 서밋(CBIS2026)의 기업가 고위급 포럼에서 중국 국내 리튬 배터리 산업의 특허 압력이 두드러지고 있으며 많은 해외 기업과 특허 풀이 계속해서 특허 문제를 제기하고 있다고 지적했습니다. 동시에, 중국 국내 동종 기업의 특허 소송이 빈번하고, 많은 소송이 기업공개(IPO) 및 입찰 노드를 대상으로 장벽을 형성하고 있습니다. 그는 업계가 내부소송을 줄이고, 협의와 조정을 정상화하며, 혁신을 중단하고, 해외 지적재산권 리스크에 공동으로 대응하기 위해 한 팀으로 글로벌화할 것을 제안했다. Xu Yanming은 또한 중국의 전체 리튬 배터리 시장 점유율은 세계 1위이지만 기초 기술 특허 축적은 여전히 일본과 한국만큼 좋지 않으며 해외 특허 풀의 압력에 직면해 있다고 지적했습니다. 그는 업계가 기술 리더십을 유지하고 글로벌 관점에서 특허를 배포해야 한다고 제안했습니다. 동시에, 최근 몇 년간 중국 리튬 배터리 산업이 신기술, 신재료, 신시스템 분야에서 형성한 고부가가치 특허를 활용해 전문 지적재산권팀을 구축해 해외 특허 봉쇄를 파악하고 대응하며 심지어 반격해야 한다."},{"s":"[AX 인재 키우는 대학]〈2〉동국대, 이차전지 전 과정에 AI 접목…산업 맞춤형 인재 양성","so":"전자신문","tm":"11/21 11:09","c":1,"r":"kr","u":"https://www.etnews.com/20261120000141","p":1795226940,"a":1795230994,"su":"인공지능(AI)이 이차전지 산업의 소재 개발부터 제조공정, 품질 관리까지 빠르게 확산하면서 배터리 전문지식과 AI 활용 역량을 동시에 갖춘 인재의 중요성이 커지고 있다. 동국대학교는 배터리 소재 설계부터 셀 제조, 성능 평가까지 전 과정에 AI를 접목한 실무교육으로 산업현장이 요구하는 융합인재 양성에 나섰다. 동국대는 교육부가 추진하는"},{"s":"\"엘앤에프, 설비투자 위해 추가 자금조달 불가피… 목표가↓\"-대신 - 머니투데이","so":"머니투데이","tm":"11/21 10:43","c":1,"r":"kr","u":"https://www.mt.co.kr/index.php/stock/2026/11/20/2026112008225688924","p":1795225402,"a":1795259708,"su":"대신증권이 20일 엘앤에프에 대한 목표주가(전문가가 예상한 앞날의 주가)를 기존 15만원에서 11만원으로 낮춰 잡았다. 자금조달에 따른 지분(회사를 나눠 가진 몫)희석(오버행) 물량과 리튬인산철(LFP) 양극재 시장의 경쟁이 심화할 가능성을 반영했다."},{"s":"반도체 흑자에 가려진 '대중국 수출 착시'…자동차·이차전지 적자 급증","so":"파이낸셜포스트","tm":"11/21 09:52","c":1,"r":"kr","u":"https://www.financialpost.co.kr/news/articleView.html?idxno=302335","p":1795222374,"a":1795226153,"su":"올해 한국의 대중 무역수지가 4년 만에 흑자(번 돈이 쓴 돈보다 많은 것)로 돌아섰으나 반도체(전자기기의 두뇌 부품)를 제외하면 오히려 적자 폭이 커진 것으로 나타났다.21일 한국무역협회 및 산업통상부에 따르면, 올"},{"s":"리튬 이온 전지를 둘러싼 화재 등의 사례가 소개되었다=13일, 치바현 이치카와시의 쇼와 학원 초등학교(외자 아키히코 촬영)","so":"産経ニュース","tm":"11/21 07:30","c":1,"r":"jp","u":"https://www.sankei.com/article/20261121-BKRVLT2ET5JT7NIHC4LVFLX55Y/photo/VJYWPZ3Z3RM3TP22TPJUZD6DXI/","p":1795213800,"a":1795226161,"t":"リチウムイオン電池を巡る火災などの事例が紹介された＝13日、千葉県市川市の昭和学院小学校（外崎晃彦撮影）","su":"산케이 뉴스의 기사 「리튬 이온 전지 「바르게 버리고」 산폐업자가 아이용 수업 30회 「화재 공포와 싸움」」의 사진이나 화상의 확대 페이지입니다."},{"s":"리튬이온 전지 「바르게 버려」 산폐업자가 아이용 수업 30회 「화재 공포와 싸움」","so":"産経ニュース","tm":"11/21 07:30","c":1,"r":"jp","u":"https://www.sankei.com/article/20261121-BKRVLT2ET5JT7NIHC4LVFLX55Y/","p":1795213800,"a":1795215161,"t":"リチウムイオン電池「正しく捨てて」 産廃業者が子供向け授業30回 「火災恐怖と戦い」","su":"분별되지 않고 버려진 리튬 이온 전지가 폐기물 처리 시설에서 발화해 화재를 일으킨다고 하는 사안이 전국에서 잇따르고 있는 것을 둘러싸고, 지바현내의 산업 폐기물 처리 사업자가,…"},{"s":"GS유아사 아베 사장 “우주용 전지, 양산에 검사 공정의 자동화 진행한다”","so":"日本経済新聞","tm":"11/21 05:00","c":1,"r":"jp","u":"https://www.nikkei.com/article/DGXZQOUF0613D0W6A101C2000000/","p":1795204800,"a":1795215164,"t":"GSユアサ阿部社長「宇宙用電池、量産へ検査工程の自動化進める」","su":"지에스 유아사 코퍼레이션(GS유아사)은 인공위성용 리튬 이온 전지의 사업 확대를 목표로 한다. 소형 위성용 수요 개척을 위해 양산 기술을 닦아 검사 공정의 자동화도 진행한다. 아베 타카시 사장에게 향후 성장 전략을 들었다. ――2026년도부터 3년간의 제7차 중기 경영 계획으로 「항공・우주・방위」를 독립한 사업에 자리매김했습니다. “방위 용도의 산업용 전지는 당사의 조업의 하나로, 오랜 역사가 있다.안보를 둘러싼 환경이 크"},{"s":"항셍지수 분기별 리뷰 발표 Ningde Changfei Naco Index | 홍콩경제신문","so":"香港經濟日報HKET","tm":"11/21 01:29","c":1,"r":"hk","u":"https://invest.hket.com/article/4228789/","p":1795192140,"a":1795215158,"t":"恒指季檢出爐 寧德長飛納科指|香港經濟日報"},{"s":"항셍테크지수는 큰 조정을 겪게 될 것이다. CATL, 중지쉬촹 등의 주식이 포함될 수 있습니다 | 본토 주식 통찰력 | 양안","so":"經濟日報","tm":"11/20 22:09","c":1,"r":"tw","u":"https://money.udn.com/money/story/5604/9890792?from=edn_subcatelist_cate","p":1795180163,"a":1795180888,"t":"恒生科技指數將迎重大調整 寧德時代和中際旭創等股票或被納入 | 陸股透視 | 兩岸","su":"[블룸버그] - CATL과 중국 InnoLight와 같은 주식이 홍콩 기술주 벤치마크 지수의 대대적인 개편에 포함될 것으로 예상됩니다. 이를 통해 지수가 인공지능 붐을 더 잘 반영하고 아시아의 다른 기술 중심 지수와 경쟁하는 데 도움이 될 것입니다."},{"s":"CATL은 일주일에 세 번씩 200억~400억 위안 규모의 자사주 매입 계획을 가속화합니다.","so":"21财经","tm":"11/20 21:57","c":1,"r":"cn","u":"https://www.21jingji.com/article/20261120/herald/ad352edf292e19be95951dc69c2d885d.html","p":1795179420,"a":1795180882,"t":"一周三度出手，宁德时代加速推进200亿~400亿元回购计划","su":"21세기 비즈니스 헤럴드 Liu Xiafei 기자 이번 주 CATL은 200억~400억 위안 규모의 상각 환매 계획을 가속화하기 위해 세 차례 조치를 취했습니다. CATL은 이날 중앙입찰을 통해 A주(중국 본토 주식시장 주식) 65만7600주를 매입했다고 20일 밝혔다. 최고거래가는 주당 229.58위안, 최저거래가는 주당 226.84위안이다. 지급총액은 1억4998만위안이며, 자사주 매입(회사가 자기 주식을 다시 사는 것)은 소각 예정이었다. 앞서 CATL은 지난 11월 17일과 19일 각각 약 1억5천만 위안과 2억 위안을 환매에 지출했다. 위에 언급된 거래는 모두 해당 연도에 시작된 상각 환매 계획의 일부입니다. 이 계획을 되돌아보면 CATL은 8월 12일 임시 주주총회에서 검토 및 승인을 받았다. CATL은 12개월 동안 중앙 집중식 입찰을 통해 A주를 환매하는 데 자체 자금 또는 자체 조달 자금 중 200억 위안 이상, 400억 위안 이하를 사용할 계획이다. 모든 주식이 소각되고 그에 따라 등록 자본금도 감소됩니다."},{"s":"Shanghai Electronics Co., Ltd., GigaDevice Innovation, Goke Microelectronics, CATL, Shengyi Technology, Hengtong Optoelectronics 및 Tongwei Co., Ltd.는 공동으로 지분 증가 및 환매를 발표했습니다.","so":"21财经","tm":"11/20 20:53","c":1,"r":"cn","u":"https://www.21jingji.com/article/20261120/herald/704a6c7c7cafa050288a7c996fda5a54.html","p":1795175580,"a":1795180884,"t":"沪电股份、兆易创新、国科微、宁德时代、生益科技、亨通光电、通威股份集体宣布增持、回购","su":"11월 20일 저녁, 21 Financial Radar에 따르면 Shanghai Electric Co., Ltd., GigaDevice, CATL, Cyrus, Hengtong Optoelectronics, Tongwei Co., Ltd., Rongsheng Petrochemical, Huaqin Technology 및 기타 회사가 A주 '증가 및 환매 물결'에 동참했습니다. Shanghai Electric Co., Ltd.는 2026년 11월 20일 회사가 주식 환매를 위한 특별 증권 계정을 통한 중앙 집중식 입찰 거래를 통해 처음으로 회사 주식 248,900주를 환매했다고 발표했습니다. 이는 회사 전체 주식 자본금의 0.01%에 해당합니다. 최고 거래가격은 80.85위안/주, 최저 거래가격은 79.92위안/주, 총 거래금액은 199993만원(거래수수료 제외)을 기록했다. 이번 환매 계획은 우리사주 제도나 지분(회사를 나눠 가진 몫) 인센티브를 시행하고 회사 가치와 주주 권리를 유지하기 위해 5억~10억 위안을 환매할 계획이다. 최근 마감 기준으로 Shanghai Electric Co., Ltd.의 시가총액(회사 전체 몸값)은 1,500억 위안을 넘어 전년 대비 10% 이상 증가했으며, 주가는 지난 60일 동안 거의 30% 하락했습니다."},{"s":"1시간만에 증명서 발급! Shaoguan 리튬 배터리의 해외 시장 수출이 가속화되어 수출이 68.6% 증가했습니다.","so":"21财经","tm":"11/20 20:18","c":1,"r":"cn","u":"https://www.21jingji.com/article/20261120/herald/894f2f351e29f047af3506f8f3da0684.html","p":1795173480,"a":1795180887,"t":"1小时内出证！韶关锂电池出海提速，出口比增68.6%","su":"최근 Shaoguan Customs의 감독하에 Guangdong Paidon New Energy Co., Ltd.의 리튬 배터리 수출 위험 패키지 배치는 \"수출 위험물 포장 스마트 감독 시스템\"을 통해 자동으로 온라인 비교 및 확인되어 패키지가 사용 자격이 있는지 확인하고 신속하게 출시되었습니다. 이는 Shaoguan에서 리튬 배터리 패키징을 위한 스마트 감독 모델이 성공적으로 구현되었음을 의미합니다. 최근에는 그린에너지 산업의 급속한 발전과 함께 대외무역의 '3대 신품목' 중 하나인 리튬전지 수출이 폭발적인 성장세를 보이고 있다. 통계에 따르면 2026년 1월부터 10월까지 소관시 리튬 배터리 제품 수출액은 9,395만 위안에 달해 전년 동기 대비 68.6% 증가했다. 제품은 유럽, 미국, 동남아시아 등 많은 국가와 지역으로 수출되어 소관 대외 무역 성장의 새로운 엔진이 되었습니다."},{"s":"규슈전력, 산업기계용 전지팩으로 신회사 정흥전기제작소와 협업","so":"日本経済新聞","tm":"11/20 20:12","c":1,"r":"jp","u":"https://www.nikkei.com/article/DGXZQOJC207IW0Q6A121C2000000/","p":1795173126,"a":1795175814,"t":"九州電力、産業機械向け電池パックで新会社 正興電機製作所と協業","su":"큐덴홀딩스 산하 규슈전력은 20일 산업기계용 전지팩을 개발·판매하는 신회사를 설립했다고 발표했다. 탈탄소를 배경으로 건설기계나 특수차량 등으로 전동화 요구가 확대되고 있어 상기가 있다고 판단했다. 신회사 「BIXSAS(빅사스)」를 1일자로 설립했다. 전지 팩은 리튬 이온 전지에 제어 기판 등을 조합한 것. 구전은 2022년부터 판매하고 있으며, 사업이 궤도를 타고 있기 때문에 신회사에서 본격전"},{"s":"BYD는 일본에서 무엇을 했나요? | 발전소", ":"Jiemian.com","tm":"11/20 18:25","c":1,"r":"cn","u":"https://www.jiemian.com/article/13841727.html","p":1795166707,"a":1795248136,"t":"行业观察 | 锂电池价格进入上行通道：产业周期与价值逻辑的再平衡","su":"리튬 배터리 산업이 수년간 하락세를 겪은 후, 인산철리튬 가격은 2025년 6월부터 상승하기 시작하여 반년 만에 거의 30% 상승했습니다. 이러한 가격 인상은 비용에 의해 주도되며 전체 리튬 배터리 산업의 생태에 영향을 미칩니다. 에너지 신산업 체인이 스스로를 고치고 있고, 대형 원통형 배터리 등 세분화된 영역의 업체들이 레이아웃을 가속화하고 있다. 업계의 압력이 풀리고 신에너지 차량과 에너지 저장 장치에 대한 수요가 시장을 주도했으며 인산철리튬 재료 가격은 큰 조정을 거친 후 반등(내렸다가 다시 오르는 것)했습니다. 인산철리튬 배터리는 신에너지 차량, 에너지 저장 시스템 및 기타 분야에서 지배적인 위치를 차지하고 있으며 시장 수요가 빠르게 증가하고 있습니다."},{"s":"홍콩, 2028년부터 공급업체에 kg당 HK$6의 EV 배터리 부과금 부과 예정","so":"South China Morning Post","tm":"11/20 17:55","c":1,"r":"sg","u":"https://www.scmp.com/news/hong-kong/health-environment/article/3375222/hong-kong-plans-impose-ev-battery-levy-hk6-kg-suppliers-2028","p":1795164931,"a":1795175817,"t":"Hong Kong plans to impose EV battery levy of HK$6 per kg on suppliers from 2028"},{"s":"배터리 소재업계 3분기 한파, 코스모신소재만 웃었다","so":"디일렉","tm":"11/20 17:44","c":1,"r":"kr","u":"https://www.thelec.kr/news/articleView.html?idxno=65723","p":1795164252,"a":1795248133,"su":"국내 배터리 소재업계가 장기 실적(회사가 번 돈 성적표) 부진에 빠졌다. 주요 소재 기업 17곳 가운데 11곳이 3분기에도 영업적자(쓴 돈이 번 돈보다 많은 것)를 기록했다. 배터리 사업에 대한 의존도가 높은 기업들"},{"s":"정부는 공급업체로부터 전기차 배터리 재활용 수수료를 킬로그램당 6위안부터 시작하여 매년 인상할 계획이다.","so":"Now 新聞","tm":"11/20 17:07","c":1,"r":"hk","u":"https://news.now.com/home/local/player?newsId=670311","p":1795162044,"a":1795175812,"t":"政府擬向供應商預徵電動車電池循環再造費 起始每公斤6元每年遞增","su":"[Now News Channel] The government plans to collect a battery recycling levy from electric vehicle suppliers in advance. 배터리 무게를 기준으로 계산하면 1kg당 6위안부터 시작해 매년 인상해 2029년 전면 시행을 목표로 하고 있다."},{"s":"CATL의 중국 배터리 시장 점유율은 자동차 제조사 다각화 속에 6개월 연속 하락세를 이어갔다.","so":"South China Morning Post","tm":"11/20 17:00","c":1,"r":"sg","u":"https://www.scmp.com/business/china-evs/article/3375184/catls-china-battery-market-share-extends-six-month-slide-amid-carmaker-diversification?module=Companies&pgtype=section","p":1795161606,"a":1795175817," 가 시작된 미국 로스앤젤레스 자동차 쇼(일반 공개는 20일부터)에 2년 만에 출전했다. 10월 발표해 비행 실연을 한 스포츠차 '로드스터'를 자동차쇼에서 첫 공개했다. 전시한 로드스터는 미남부 텍사스 주 스페이스 X의 시험장에서 시연에 사용한 것과 같은 차량이라고 한다. 2028년 양산할 계획으로 미국 스페이스 X의 기술을 활용"},{"s":"'소문' 에너지저장전지 수요 급증. 중국 통신주, AI 인프라 탐색 중","so":"etnet 經濟通","tm":"11/20 10:10","c":1,"r":"hk","u":"http://www.etnet.com.hk/www/tc/news/rumours_detail.php?newsid=20261120372","p":1795137015,"a":1795144484,"t":"《傳聞》儲能電池需求快速增長；中資電訊股力拓AI基建","su":"2026-11-20 09:05 \"소문\" 에너지 저장 배터리 수요가 빠르게 증가하고 있습니다. 중국 통신주들이 AI 인프라를 탐색하고 있다. '루머' 시장 소식통에 따르면 글로벌 AI 데이터센터(컴퓨터 수만 대를 모아 둔 건물) 구축이 에너지 저장 배터리 수요의 급속한 성장을 주도했다고 한다. CATL(03750)은 어제(19일) 20.2위안 하락한 349.8위안에 거래를 마감했고, 매출(물건을 판 돈 전체)액은 14억위안이 넘었다. 글로벌 주식시장 상황은 불투명하고, 중국 통신주는 방어력이 강하다. 리오틴토(Rio Tinto) 데이터센터 등 AI 인프라가 사업 매출 성장을 촉진하는 데 도움이 될 것으로 전해졌다. 차이나모바일(00941)은 어제 0.15위안 오른 80.7위안으로 마감했다. '편집자주' 본 칼럼은 시장의 루머를 수집하고 있으나 확인된 내용은 아니며, '경제뉴스'는 내용의 정확성을 보장하지 않습니다."},{"s":"교보증권 \"엘앤에프, 하이니켈·LFP 양극재 공급 확대로 수익성 개선 전망\"","so":"비즈니스포스트","tm":"11/20 09:46","c":1,"r":"kr","u":"https://www.businesspost.co.kr/BP?command=article_view&num=452480","p":1795135619,"a":1795144478},{"s":"CATL Qiji Power Exchange 산시 지역 총괄 관리자 Guo Xuan: 다퉁 에너지 전환 촉진","so":"新华网山西","tm":"11/20 09:46","c":1,"r":"cn","u":"http://www.sx.xinhuanet.com/20261120/764bc24ce489447fb31712706e7ba10f/c.html","p":1795135594,"a":1795144480,"t":"宁德时代骐骥换电山西大区总经理郭轩：助推大同能源转型","su":"CATL Qiji 배터리 교환 산시 지역 총책임자 Guo Xuan: 다퉁 에너지 변혁 촉진 - 최근 \"중국 경제의 다음 여정: 새로운 방향으로 나아가고 품질을 앞서가다\"라는 주제로 2026 Xinhuanet Sike 연례 컨퍼런스가 산시성 다퉁시에서 열렸습니다."},{"s":"[모닝 리포트] \"엘앤에프, LFP 성장 위한 자금조달 가시화\"","so":"뉴스핌","tm":"11/20 08:54","c":1,"r":"kr","u":"https://www.newspim.com/news/view/20261120000117","p":1795132440,"a":1795132829,"su":"[서울=뉴스핌] 설희 기자= 대신증권은 20일 2차전지(충전해서 다시 쓰는 배터리) 양극재 기업 엘앤에프에 대해 리튬인산철(LFP) 양극재 증설을 위한 추가 자금조달 가능성을 반영하면서도 성장 여력은 유효하다며 투자의견"},{"s":"CATL, Innolight가 주요 AI 개편에 Hong Kong Tech Index에 합류할 예정","so":"Bloomberg.com","tm":"11/20 08:00","c":1,"r":"us","u":"https://www.bloomberg.com/news/articles/2026-11-19/catl-innolight-may-join-hong-kong-tech-index-in-major-ai-revamp","p":1795129200,"a":1795132830,"t":"CATL, Innolight May Join Hong Kong Tech Index in Major AI Revamp"},{"s":"미시간주 포드, CATL이 생산한 LFP 배터리 활용해 '메이드 인 아메리카' 달성","so":"DIGITIMES","tm":"11/20 02:14","c":1,"r":"tw","u":"https://www.digitimes.com.tw/tech/dt/n/shwnws.asp?id=775407","p":1795108445,"a":1795128473,"t":"借力寧德時代產LFP電芯 福特密西根州實現「美國製造」","su":"포드자동차는 미시간주 중부 마샬에 위치한 새로운 배터리 공장이 10월부터 생산을 시작했다고 11월 18일 발표했습니다. 중국 배터리 제조사 CATL이 인증한 기술을 이용해 저가형 리튬인산철(LFP) 셀을 제조해 출하에 나섰다."},{"s":"Ford, Fathom 전기 트럭용 CATL 라이센스 배터리 셀 생산 시작","so":"AutoTechInsight","tm":"11/19 23:41","c":1,"r":"world","u":"https://autotechinsight.spglobal.com/news/5291534/ford-starts-producing-catl-licensed-battery-cells-for-fathom-electric-truck","p":1795099282,"a":1795128477,"t":"Ford starts producing CATL-licensed battery cells for Fathom electric truck","su":"포드는 배터리 파크가 분당 40개의 셀을 생산할 수 있을 것이라고 밝혔습니다."},{"s":"선전 시장은 보유량을 늘리기 위해 또 다른 집중적인 환매 물결을 일으켰으며, CATL은 거의 2억 달러를 환매했습니다.","so":"财联社","tm":"11/19 22:25","c":1,"r":"cn","u":"https://www.cls.cn/detail/2539402","p":1795094700,"a":1795158249,"t":"深市再掀一波密集回购增持，宁德时代回购近两亿","su":"① 11월 19일 밤, 선전증권거래소 상장(주식시장에 처음 들어오는 것)기업의 자사주 매입(회사가 자기 주식을 다시 사는 것) 및 지분 증액 발표가 집중적으로 '화면을 휩쓸었다'. ② 상장기업의 자사주 매입과 지분 확대는 항상 A주에 대한 기대감을 안정시키는 중요한 방법이었으며 일부에서는 선전증권거래소의 자사주 매입 범위가 확대될 가능성이 높다고 믿고 있습니다. ③ 자사주 매입의 '사례별 성격'은 점점 더 강해지고 있으며 업계 리더부터 액면가 압박을 받는 기업까지 각자 고유한 요구 사항과 전략이 있습니다. 차이롄서, 11월 19일 (린지안 기자) A주 보유와 자사주 매입의 새로운 물결이 다가오고 있습니다. 11월 19일 밤, 선전증권거래소 상장기업의 자사주 매입 및 주식 보유 공고가 화면을 가득 채웠다. 기자가 자세히 조사한 새로 공개된 자사주 매입 계획, 주식 보유 계획 및 자사주 매입 진행 상황에는 Lingyi Intelligent Manufacturing, Demei Chemical, Beingmate, Crystal Optoelectronics, Century Huatong, Haowu Shares, Pengding Holdings, Ganfeng Lithium Industry, Jinke Shares 및 기타 여러 회사가 포함되었습니다. 요즘에는 일일 행동의 비밀이 드물다."},{"s":"중국남방전력망과 CATL, 전략적 협력 체결","so":"第一财经","tm":"11/19 21:08","c":1,"r":"cn","u":"https://www.yicai.com/brief/103447039.html","p":1795090080,"a":1795094282,"t":"南方电网与宁德时代达成战略合作","su":"CATL 뉴스에 따르면 최근 중국남방전력망과 CATL은 공식적으로 전략적 협력 계약을 체결했습니다. 양 당사자는 기술 연구 개발, 제로 탄소 시나리오 구축, 에너지 저장 생태학, 산업 협력 및 국제 비즈니스 분야에서 협력하여 새로운 것을 촉진할 것입니다."},{"s":"독일 SPRIND, 배터리 재활용 기업 Cylib에 투자","so":"AutoTechInsight","tm":"11/19 20:50","c":1,"r":"world","u":"https://autotechinsight.spglobal.com/news/5291525/germanys-sprind-invests-in-battery-recycling-company-cylib","p":1795089057,"a":1795128478,"t":"Germany’s SPRIND invests in battery recycling company Cylib","su":"이번 투자는 EU 배터리 규정에 따라 재활용 업체가 2031년 말까지 폐 배터리에서 리튬의 80%를 회수하도록 요구함에 따라 이루어졌습니다."},{"s":"전기차 화재 진압을 위한 최고의 도구! 기업, 소방관이 도시 안전을 지킬 수 있도록 방화 담요 기부 - Baodao","so":"中時新聞網","tm":"11/19 20:39","c":1,"r":"tw","u":"https://www.chinatimes.com/realtimenews/20261119004612-260421","p":1795088352,"a":1795144482,"t":"電動車滅火最佳利器！ 企業捐贈防火毯助消防守護城市安全- 寶島","su":"새로운 유형의 차량의 재난 구조 효율성을 향상시키기 위해 오랫동안 전기 자동차의 화재 안전에 투자해 온 Rixi Disaster Prevention Co., Ltd.는 오늘(19일) 신베이시 정부 소방국에서 기부식을 열고 총 가치가 약 NT$150만 상당인 Dutch Fire Isolator ULTRA 재사용 가능한 전기 자동차 방화 담요 10개를 기부했습니다."},{"s":"중국 리튬 배터리 회사 APEC, 공동 건설에 대해 이야기: 일자리를 얻기 위해서가 아니라 격차를 메우기 위해서","so":"Jiemian.com","tm":"11/19 20:30","c":1,"r":"cn","u":"https://www.jiemian.com/article/15350867.html","p":1795087809,"a":1795089957,"t":"中国锂电企业APEC谈共建：不是抢饭碗，是补空白","su":"지몐 뉴스 기자 | 가오징(Gao Jing) 11월 18~19일 양일간 선전에서 제33차 아시아태평양경제협력체(APEC) 정상회의가 열렸다. 중국이 APEC 개최국이 된 것은 이번이 세 번째다. 같은 주에는 2026 APEC 비즈니스 리더 서밋이 선전에서 열렸습니다. 이번 정상회담의 주제는 '함께 번영과 미래 상생'이다. APEC 21개국과 해외 경제권의 정·재계 대표 2000여 명이 참석한다. 이번 정상회담에는 리튬전지와 에너지저장 분야의 기업인들이 대거 등장했다. 그들의 연설은 공통된 변화를 보여주었습니다. 그들은 더 이상 생산 능력과 매개 변수에 초점을 맞추지 않고 공동 건설과 상생 결과에 대해 이야기했습니다. 현재 중국의 리튬 배터리 및 에너지 저장 산업은 세계에서 절대적인 지배적 위치를 차지하고 있습니다. 국제에너지기구(IEA) 자료에 따르면 중국의 리튬이온 배터리 생산량은 전 세계 생산량의 85%를 차지한다."},{"s":"온디바이스 AI 열풍 뒤에는 배터리 소재에 숨겨진 기술 업그레이드","so":"Jiemian.com","tm":"11/19 18:57","c":1,"r":"cn","u":"https://www.jiemian.com/article/15351492.html","p":1795082270,"a":1795089958,"t":"端侧AI热潮背后：藏在电池材料里的技术升级","su":"실시간 번역, 음성 인터랙션부터 이미지 수집까지 AI 글래스 등 스마트 단말기가 일상생활 속으로 빠르게 들어오고 있다. 기능이 계속 풍부해지면서 배터리 수명, 가볍고 안정적인 전원 공급 장치에 대한 단말기 요구 사항이 계속 높아지고 있습니다. 제한된 부피와 무게 제약 하에서 사용자 경험을 최적화하는 방법은 소비자 배터리의 반복적인 업그레이드의 핵심 방향이 되었으며, 업스트림 리튬 배터리 소재에 대한 새로운 개발 기회도 가져왔습니다. 엔드사이드 AI에 의해 생성된 새로운 요구로 인해 배터리 소재는 더욱 세련된 협업 적응 방향으로 나아가고 있습니다. 지속적인 감지 및 다중 작업 작업으로 인해 전력 소비와 순간 전력 요구 사항이 증가했으며, 얇고 가벼운 디자인으로 인해 제한된 공간에서 더 높은 에너지를 운반할 수 있는 배터리가 필요합니다. 에너지 밀도, 속도 성능, 사이클 수명, 안전 성능이 동시에 균형을 이루어야 하며 전해질과 기능성 첨가제의 가치가 더욱 부각됩니다."},{"s":"\"상하이/선전 증권 후계\" CATL, 심천 증권 후계에서 활발히 거래되는 상위 10개 주식 중 1위를 차지","so":"etnet 經濟通","tm":"11/19 18:45","c":1,"r":"hk","u":"https://www.etnet.com.hk/www/tc/news/news-article.php?section=categorized&category=latest&newsid=20261119510","p":1795081546,"a":1795089962,"t":"《滬／深股通》寧德時代為深股通十大成交活躍股榜首","su":"홍콩증권거래소(00388)는 오늘 '상하이-홍콩 증권 거래소'와 '심천-홍콩 증권 거래소'에서 가장 활발하게 거래되는 상위 10개 주식을 다음과 같이 발표했습니다. '상하이-홍콩 증권 거래소'에서 가장 활발하게 거래되는 상위 10개 주식은..."},{"s":"[IPO] 솔리스, 내년 1월 상장…\"유럽 이차전지 시장 진출 추진\"","so":"한스경제","tm":"11/19 17:29","c":1,"r":"kr","u":"http://www.hansbiz.co.kr/news/articleView.html?idxno=885359","p":1795076996,"a":1795128471,"su":"| 서울=한스경제 김지호 기자 | 첨단 제조공정 유틸리티 엔지니어링 전문기업 솔리스가 한화플러스제5호스팩과의 합병을 통해 코스닥(한국 중소·기술 회사 주식시장) 상장을 추진한다. 북미 이차전지 시장에서 확보한 대형 프로젝트 수행 경험을 바탕으로 미국 반도체(전자기기의 두뇌 부품) 시장까지 사업 영역을 확대하고, 유럽 이차전지 시장 진출도 본격화한다는 전략이다.19일 이종필 솔리스 대표는 서울 여의도에서 열린 기업공개(IPO) 기자간담회에서 \"북미 이차전지 프로젝트 확장과 더불어, 협력사와 유럽 이차전지 시장에 진출하기 위해 협업 중\"이라며 \"북미 신규 반도체 고객사 확보 건은 조만간 좋"},{"s":"LG화학·LG엔솔, 수장 동반 유임…'석화 사업 재편·북미 ESS 공략' 이어간다","so":"뉴시스","tm":"11/19 17:23","c":1,"r":"kr","u":"https://www.newsis.com/view/NISX20261119_0003875585","p":1795076580,"a":1795089955,"su":"[서울=뉴시스]박현준 기자 = LG화학과 LG에너지솔루션이 현 경영진 체제를 이어가면서 LG화학은 석유화학 사업 재편을, LG에너지솔루션은 수요에 맞춘 생산·투자 조정을 지속할 전망이다.19일 업계에 따르면 이날 발표된 LG그룹 2027년 정기 임원 인사에서 김동춘 LG화학 대표이사 사장과 김동명 LG에너지솔루션 대표이사 사장은 유임됐다. ◆LG화학, 석화.."},{"s":"충북 열달만에 작년 수출액 훌쩍…반도체·이차전지 효자","so":"뉴시스","tm":"11/19 17:15","c":1,"r":"kr","u":"https://www.newsis.com/view/NISX20261119_0003875554","p":1795076134,"a":1795089955,"su":"[청주=
