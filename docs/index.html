attery-giants-turn-to-korean-materials-firms-in-an-attempt-to-bypass-us-and-eu-straightjacket/12982976","p":1795644299,"a":1795647087,"t":"Chinese battery giants turn to Korean materials firms in an attempt to bypass U.S. and EU straightjacket","su":"미국과 유럽연합(EU)이 중국산 전기차 배터리(전기차를 움직이는 큰 충전 배터리) 의존도를 낮추려는 움직임에 따라 CATL 등 중국 배터리 제조사들이 한국 소재 공급업체, 서구 자동차 제조사들과 손잡고 해외 진출에 나선다."},{"s":"세 명의 시애틀 엔지니어가 리튬을 식염의 원소로 대체하려고 하여 거의 110만 달러를 모금했습니다.","so":"The Economic Times","tm":"11/26 06:28","c":1,"r":"us","u":"https://m.economictimes.com/world/us/three-seattle-engineers-want-to-replace-lithium-with-the-element-in-table-salt-raise-nearly-1-1-million-to-take-on-china-plan-60-kwh-battery-system-for-washington-community-hub/articleshow/136172253.cms","p":1795642102,"a":1795676835,"t":"Three Seattle engineers want to replace lithium with the element in table salt, raise nearly $1.1 million","su":"나트륨 이온 배터리(리튬 대신 소금 성분을 쓰는 배터리) 기술 설명: Emerald Battery Labs는 나트륨 이온 배터리 기술로 에너지 저장에 혁명을 일으키고 있습니다. 110만 달러 미만의 자금을 지원받은 이 스타트업은 비용을 절감하고 배터리 성능을 향상시켜 잠재적으로 전기 자동차 산업을 변화시키는 것을 목표로 하고 있습니다."},{"s":"세키스이 화학·니시다 전무, 페로브스카이트 태양전지 「기술 혁신으로 투자 억제」","so":"日本経済新聞","tm":"11/26 05:00","c":1,"r":"jp","u":"https://www.nikkei.com/article/DGXZQOUC047YD0U6A101C2000000/","p":1795636800,"a":1795647104,"t":"積水化学･西田専務、ペロブスカイト太陽電池「技術革新で投資抑制」","su":"세키스이화학공업은 차세대 기술인 페로브스카이트 태양전지를 올봄 발매해 9월까지 8건 납품(만든 물건을 주문한 곳에 넘기는 것)했다. 2027년 4월부터는 제1탄 양산(공장에서 많이 만들어 내는 것)설비를 가동시킬 예정이다. 태양전지 사업을 이끄는 니시다 타츠야 대표 이사 전무 집행 임원에게 향후 전망을 들었다. ――페로브스카이트 태양전지 「SOLAFIL(소라필)」판매 개시로부터 반년이 경과했습니다. “26년도 상반기에 8건 납입해, 하반기에도 증가할 전망이다. 인수는 매우 많아지고"},{"s":"CATL 주가, EU 하이브리드 억제로 수요 우려가 가중되면서 리튬 가격 하락","so":"Fastmarkets","tm":"11/26 01:10","c":1,"r":"us","u":"https://www.fastmarkets.com/insights/catl-shares-lithium-prices-fall-as-eu-hybrid-curbs-add-to-demand-concerns/","p":1795623040,"a":1795647091,"t":"CATL shares, lithium prices fall as EU hybrid curbs add to demand concerns","su":"시장 변동, 배터리 부문에 영향을 미치는 주요 평가 등 리튬(배터리에 꼭 들어가는 아주 가벼운 금속) 가격에 대한 최신 통찰력을 얻으세요."},{"s":"Huajing은 2027년에 CATL 배터리 교체 전기 SUV를 계획하고 있다고 합니다.","so":"AutoTechInsight","tm":"11/25 23:56","c":1,"r":"world","u":"https://autotechinsight.spglobal.com/news/5291596/huajing-reportedly-plans-catl-battery-swapping-electric-suv-for-2027","p":1795618589,"a":1795647111,"t":"Huajing reportedly plans CATL battery-swapping electric SUV for 2027","su":"계획된 차량은 현재 플러그인 하이브리드로만 판매되는 모델에 배터리-전기 옵션(정해진 값에 사거나 팔 권리)을 추가할 것입니다."},{"s":"탄산리튬이 60% 이상 떨어졌는데, 자동차 회사들은 왜 아직까지 좋은 삶을 누리지 못하는 걸까? -36Kr","so":"36kr","tm":"11/25 22:06","c":1,"r":"cn","u":"https://www.36kr.com/p/4084993668180356","p":1795611978,"a":1795612532,"t":"碳酸锂跌幅超六成，车企咋还没过上好日子-36氪","su":"탄산리튬(배터리 재료로 쓰는 리튬 가루)이 60% 이상 떨어졌는데, 자동차 회사들은 왜 잘 살지 못하는 걸까? 현재 탄산리튬 가격은 계속해서 하락세를 보이고 있다. 동력 배터리의 핵심 원자재(물건의 재료(석유·구리 등))인 탄산리튬 가격은 전체 신에너지 자동차 산업 체인의 민감한 신경에 영향을 미칩니다. 최근 10만 위안/톤, 9만 위안/톤이라는 두 가지 중요한 bp이 잇달아 사라지며 비관론이 확산됐다. 불과 반년 만에 탄산리튬 가격이 약 60% 하락한 셈이다. 이에 자동차 회사들은 탄산리튬이 주는 배당금을 제대로 거두지 못한 것 같지만, 기대와는 많이 다른 그들의 삶은 더욱 어려워지고 있다. 산업체인의 이익 재편으로 인해 자동차 회사는 왜 그렇게 어려운가? 수요가 미리 초과되어 공급이 계속 증가합니다. 신에너지 차량이 대다수가 되었습니다."},{"s":"리튬 배터리 수출은 첫 10개월 동안 137% 급증했으며, 창저우의 아프리카 무역은 30% 증가했습니다.","so":"中国新闻网","tm":"11/25 18:50","c":1,"r":"cn","u":"https://www.chinanews.com.cn/cj/2026/11-25/10737655.shtml","p":1795600233,"a":1795612533,"t":"前十月锂电池出口大增137% 常州对非洲贸易增三成","su":"리튬 배터리 수출은 첫 10개월 동안 137% 증가했으며, 창저우의 아프리카와의 무역은 30% 증가했습니다. 중국신보사, 창저우, 11월 25일(탕환 기자) 25일 창저우 세관 통계에 따르면 2026년 10월까지 창저우의 대외 무역 수출입 총액은 3325억6000만 위안으로 전년 대비(작년 같은 때와 비교해서) 8.9% 증가해 규모와 성장률 측면에서 장쑤성에서 5위를 차지했다. 그 중 리튬전지 수출액은 93억9000만 위안으로 동기 대비 137.2% 증가했다. 아프리카 수출입액은 146억 2천만 위안으로 동기 대비 30.8% 증가했습니다. 신에너지 제품의 수출과 신흥 시장의 발전은 창저우 대외 무역의 가장 두드러진 성장 포인트가 되었습니다. 4분기에 들어서면서 창저우의 대외 무역은 크게 가속화되었습니다. 10월 월 수출입액은 371억7000만 위안으로 전년 동기 대비 34.5% 증가했다. 대외무역 규모는 1분기 이후 분기별로 증가했다. 구조적으로 일반무역 수출입액은 2,807.5억 위안으로 대외무역 총액의 84.4%를 차지하며 지배적 지위는 안정적이었다. 가공무역 수출입액은 425억 위안으로 동기 대비 21.6% 증가했고 그 비중은 전년 동기 대비 1.3% 증가했다. 가공무역 비중의 반등은 국내 기업의 국제 수주(일감 주문을 받는 것) 능력이 지속적으로 향상되고 있음을 반영한다."},{"s":"CATL 주가 급락, 기관에서는 리튬 배터리 이익 및 생산 일정 기대가 압박을 받고 있다고 말합니다.","so":"第一财经","tm":"11/25 18:32","c":1,"r":"cn","u":"https://www.yicai.com/news/103454142.html","p":1795599178,"a":1795608190,"t":"宁德时代股价大跌，机构称锂电盈利、排产预期承压","su":"11월 25일, CATLA 주가는 8.33% 하락한 208.42위안으로 마감했으며, 총 시가총액(회사 전체 몸값)은 약 9,644억 위안으로 1조 위안 아래로 떨어졌습니다. 이는 2025년 4월 14일 이후 최저치이며 올해 5월 초 최고 수준에서 거의 55% 되돌린 수치입니다. H주는 12.23% 하락한 HK$295.6에 마감했으며, 올해 6월 초 고점 대비 누적 하락폭은 약 62%다. 같은 날 플러시배터리 업종지수(881281)도 6.12% 하락하며 큰 폭 하락했다. CATL과 리튬 배터리 업계를 둘러싼 여러 소식도 기관들이 배터리 재고 이익 전망을 낮추고, 11월 생산 일정을 낮추고, 탄산리튬(배터리 재료로 쓰는 리튬 가루) 선물 가격이 급락하는 등 시장의 주목을 받고 있다."},{"s":"논평: CATL에서 사업을 다각화하는 EV 제조사에게 낮은 가격이 항상 더 낮은 비용은 아닙니다.","so":"Caixin Global","tm":"11/25 17:57","c":1,"r":"us","u":"https://www.caixinglobal.com/2026-11-25/commentary-for-ev-makers-diversifying-from-catl-a-lower-price-isnt-always-a-lower-cost-102508665.html","p":1795597020,"a":1795608187,"t":"Commentary: For EV-Makers Diversifying From CATL, a Lower Price Isn’t Always a Lower Cost","su":"배터리는 자동차 재료비의 30% 이상을 차지하기 때문에 자동차 제조사에게는 더 저렴한 셀이 중요합니다. 그러나 보증 비용, 리콜 및 브랜드 손상은 절감액이 적립된 지 몇 년 후에 발생할 수 있습니다."}]},{"name":"⚡ 전고체배터리·ESS","note":"보유: KODEX 전고체배터리ESS TOP2플러스","breaking":false,"items":[{"s":"3차 ESS 중앙계약시장 우선협상 대상자 선정…14곳 구축","so":"연합뉴스","tm":"11/26 19:57","c":7,"r":"kr","u":"https://www.yna.co.kr/view/AKR20261126190700530","p":1795690644,"a":1795694317,"su":"(서울=연합뉴스) 이재영 기자 = 제3차 에너지저장장치(ESS(전기를 저장해 두는 큰 배터리)) 중앙계약시장 우선협상 대상자를 선정했다고 기후에너지환경부와 전력거래소가 26일 ..."},{"s":"포스텍, '무거운 가압 장치' 뺀 전고체 리튬금속전지 개발…상용화 앞당긴다","so":"전자신문","tm":"11/26 10:37","c":3,"r":"kr","u":"https://www.etnews.com/20261126000195","p":1795657054,"a":1795663014,"su":"포스텍(POSTECH)은 박수진 화학과 교수와 이형석 박사, 통합과정 성지훈 씨 연구팀이 문장혁 중앙대 교수, 한국기초과학지원연구원(KBSI) 이영주 박사, 미국 서던메소디스트대(SMU) 동하이 왕 교수팀과 함께 상온·저압에서도 안정적으로 작동하는"},{"s":"슈나이더 일렉트릭, 홍콩에서 초고속 전기차 충전 및 배터리 에너지 저장 솔루션 출시","so":"AAstocks","tm":"11/27 13:15","c":2,"r":"hk","u":"https://www.aastocks.com/tc/stocks/news/infocast-news/IC5047403/1","p":1795752900,"a":1795762650,"t":"施耐德電氣在港推出超高速電動車充電及電池儲能解決方案","su":"에너지 기술 분야의 글로벌 리더인 슈나이더 일렉트릭(SBGSY.US)은 오늘 홍콩에서 EVlink Pro DC 720 직류(DC) 초고속 제품을 공식 출시했습니다."},{"s":"맥셀의 전고체 전지를 요코가와 전기가 채용, PLC 신제품의 RTC 백업 전원으로서: 임베디드 채용 사례","so":"MONOist","tm":"11/26 13:30","c":2,"r":"jp","u":"https://monoist.itmedia.co.jp/mn/articles/2611/26/news061.html","p":1795667400,"a":1795676849,"t":"マクセルの全固体電池を横河電機が採用、PLC新製品のRTCバックアップ電源として：組み込み採用事例","su":"맥셀은 이 회사의 세라믹 패키지형 전고체(액체 대신 고체를 넣어 더 안전한 배터리) 전지 「PSB401010H」가 요코가와 전기의 PLC 「OpreX Universal Autonomous Control System」에 채용되었다고 발표했다."},{"s":"정석케미칼, 도로 위 하얀 선에서 전고체 배터리까지 확장","so":"매일경제","tm":"11/26 00:00","c":2,"r":"kr","u":"https://www.mk.co.kr/news/special-edition/12218194","p":1795618800,"a":1795647120,"su":"전북 완주에 본사를 둔 정석케미칼은 노면표지용 도료를 만들어 온 기업이다. 미끄럼방지포장재와 우레탄·에폭시 방수바닥재 등을 생산하고 있으며 최근 전고체 배터리(액체 대신 고체를 넣은 안전한 배터리)용 전해질(배터리 안에서 전기 알갱이가 지나다니는 길) 원료인 황화리튬으로 사업 영역을 넓히고 있다. 회사는 올해 품질경쟁력우수기업에 7회째 선정됐다. 국가품질혁신경진대회에서는 2025년 현장 개선 부문에 이어 올해에도 금상을 받았고, 전북특별자.."},{"s":"StarCharge가 내부 몽골에서 1GW/4GWh의 LFP 축전지 에너지 저장 시스템(BESS)을 전력망에 연결","so":"時事ドットコム","tm":"11/28 15:25","c":1,"r":"jp","u":"https://www.jiji.com/jc/article?k=N4ueeyqW&g=prn","p":1795847100,"a":1795853279,"t":"StarChargeが内モンゴルで1GW/4GWhのLFP蓄電池エネルギー貯蔵システム（BESS）を電力網に接続","su":"중국 시링고르맹, 2026년 11월 28일 /PRNewswire/--StarCharge는 내몽골 자치구 시링고르맹에 있는 1GW/4GWh의 BESS(전기를 저장해 두는 큰 배터리)를 전력망(발전소 전기를 집·공장까지 보내는 전깃줄 그물)에 연결하여 세계 최대의 단일 사이트 전력망 형성형 독립형 BESS를 실현했습니다."},{"s":"전고체 배터리 응용 시나리오는 계속 확장되고 있습니다.","so":"21财经","tm":"11/28 00:28","c":1,"r":"cn","u":"https://www.21jingji.com/article/20261127/herald/0b88bd37e331c11f91192655204f7e3d.html","p":1795793290,"a":1795819529,"t":"固态电池应用场景持续拓宽","su":"전고체 배터리(액체 대신 고체를 넣은 안전한 배터리)의 개발은 리튬 배터리 산업의 주류 추세입니다. 지난 11월 26일 2026년(제16회) 시니어 엔지니어 리튬전지 연차총회 전고체전지 세션에서 업계 논의의 초점이 '전고체전지는 언제 탑재될 것인가'에서 '전고체전지에 적합하지 않은 시나리오는 무엇인가'로 옮겨갔다. 현재 전고체전지 산업화 초기 단계는 기술적으로 어렵고 비용도 많이 든다. Jingshi Mechanical and Electrical Research Institute의 Xiong Mingfu 부국장은 현재 전고체 배터리가 기술적 병목 현상, 높은 비용, 불완전한 산업 체인 지원과 같은 핵심 과제에 직면해 있다고 말했습니다. \"기술적 병목 현상의 경우 고체-고체 인터페이스 접촉이 좋지 않아 내부 저항이 높아지고 사이클 수명이 부족합니다. 리튬 금속 양극은 리튬 수지상 성장이 발생하기 쉬워 안전 위험이 있습니다. 비용 측면에서 황화리튬과 같은 핵심 재료는 비싸고 특수 장비 투자가 크며 생산 환경 관리 및 제어 비용이 높습니다. 산업 체인 지원 측면에서 핵심 재료의 대규모 공급이 부족할 뿐만 아니라 산업 표준 시스템이 완벽하지 않으며 업스트림 및 다운스트림 협력이 어렵습니다. 어렵다.\" 업계에서는 전고체 배터리의 산업화가 가속화되면서 전고체 배터리 상용화(실제로 팔고 쓰이기 시작하는 것)의 첫 번째 종착역은 주류 패밀리카 시장이 아니라 비용에 민감하지 않은 고부가가치 시나리오가 될 가능성이 높다고 보고 있다. Enli Power의 홍보 담당 부사장인 Zhang Feng은 올해가 \"로봇 배터리 방해의 해\"라고 말했습니다."},{"s":"[고래사냥] '성호전자·주성엔지니어링·애경케미칼·삼성SDI! 내일장 고래 종목은?! - 머니투데이","so":"머니투데이","tm":"11/27 23:23","c":1,"r":"kr","u":"https://www.mt.co.kr/amp/stock/2026/11/27/2026112722427079902","p":1795789405,"a":1795853273,"su":"▶▶▶ 싹쓰리 Up&Down 빅테크 유리기판 퀄테스트 결과 눈앞…양산(공장에서 많이 만들어 내는 것)은 - 글로벌 기판사들 빅테크 유리기판 퀄테스트 진행 - 태성, 유리기판 세정·식각·도금 포트폴리오 구축 - 제이앤티씨, 엔비디아·브로드컴 고객사 등록 - 비아트론, 삼성전기와 유리기판 관련 장비 공동개발 ▶▶▶ 명품투자 POINT 코스닥(한국 중소·기술 회사들이 모인 주식시장) 주도한 '로봇주'… 어딜 공략해야 할까"},{"s":"스페이스X는 텍사스의 Starbase 데이터 센터 사이트에 2억 5천만 달러 상당의 테슬라 Megapack 배터리를 설치했습니다.","so":"Data Center Dynamics","tm":"11/27 23:04","c":1,"r":"us","u":"https://www.datacenterdynamics.com/en/news/spacex-installs-250m-worth-of-tesla-megapack-batteries-at-starbase-data-center-site-in-texas-report/","p":1795788271,"a":1795819527,"t":"SpaceX installs $250m worth of Tesla Megapack batteries at Starbase data center site in Texas - report","su":"해당 부지에 최대 240억 달러 규모의 데이터 센터와 천연가스 발전소를 개발하려는 회사"},{"s":"StarCharge, 내몽고 그리드에 1GW/4GWh LFP 배터리 에너지 저장 시스템(BESS) 연결","so":"The Straits Times","tm":"11/27 22:40","c":1,"r":"sg","u":"https://www.straitstimes.com/paid-press-releases/starcharge-connects-1-gw4-gwh-lfp-battery-energy-storage-system-bess-to-grid-in-inner-mongolia-20261127","p":1795786800,"a":1795819532,"t":"StarCharge Connects 1 GW/4 GWh LFP Battery Energy Storage System (BESS) to Grid in Inner Mongolia","su":"세계 최대의 단일 사이트 그리드 형성 독립형 BESS(전기를 저장해 두는 큰 배터리) XILIN GOL, 중국, 2026년 11월 27일 /PRNewswire/ -- StarCharge가 1GW/4GWh BESS를 연결했습니다."},{"s":"간쑤성 둔황 최초의 계통측 독립 에너지 저장 발전소가 완공되어 가동에 들어갔습니다.","so":"新华网","tm":"11/27 22:35","c":1,"r":"cn","u":"http://www.xinhuanet.com/photo/20261127/a5732e94d67243b59af3b83ec0307ef4/c.html","p":1795786518,"a":1795853275,"t":"甘肃敦煌首个电网侧独立储能电站建成投用"},{"s":"중국, 세계 최초로 600MW급 압축 공기 에너지 저장 확장기 개발, 작동 원리는 다음과 같습니다.","so":"The Economic Times","tm":"11/27 21:09","c":1,"r":"us","u":"https://m.economictimes.com/news/new-updates/china-develops-worlds-first-600-mw-class-compressed-air-energy-storage-expander-heres-how-it-works/articleshow/136221583.cms","p":1795781394,"a":1795785211,"t":"China develops world's first 600 MW-class compressed-air energy storage expander, here's how it works","su":"이번 개발은 변동하는 풍력(바람으로 전기를 만드는 것) 및 태양열 발전을 처리하는 전력망(발전소 전기를 집·공장까지 보내는 전깃줄 그물)에 압축 공기 저장 장치를 보다 경제적인 옵션으로 만드는 데 도움이 될 수 있습니다. 중국 개발자들은 새로운 장비를 운영 시설에 배치하고 평가해야 하지만 기술을 확장하면 단위 전력 비용을 최대 30%까지 낮추고 시스템 효율성을 향상시킬 수 있다고 말합니다."},{"s":"정부 ESS 최대규모 입찰서 삼성SDI 63%, SK온 37% 확보","so":"Chosunbiz","tm":"11/27 19:20","c":1,"r":"kr","u":"https://biz.chosun.com/industry/company/2026/11/27/RLM4B2COMVEDDIPX22CZEP5AD4/","p":1795774800,"a":1795853273,"su":"삼성SDI와 SK온이 정부의 제3차 에너지저장장치(ESS(전기를 저장해 두는 큰 배터리)) 중앙계약시장 입찰에서 각각 63%, 37%를 수주했다. 전세계 빅테크의 인공지능(AI) 데이터센터(컴퓨터 수만 대를 모아 둔 건물) 투자로 ESS 수요가 몰리는 북미에 비하면 국내 시장 규모가 작지만, 향후 빠르게 커질 시장을 선점해 주도권을 확보하기 위한 조치다. 27일 업계에 따르면, 기후에너지환경부가 전날 발표한 3차 ESS 중앙계약시장 입찰 평가 결과 삼성SDI는 전체 물량 1194㎿(메가와트) 가운데 62.9%인 751㎿를 따냈다."},{"s":"도쿄도, 도내 피난소의 절반에 태양광 발전 설비와 축전지 설치 30년까지","so":"日本経済新聞","tm":"11/27 19:14","c":1,"r":"jp","u":"https://www.nikkei.com/article/DGXZQOCC277ZA0X21C26A1000000/","p":1795774468,"a":1795780879,"t":"東京都、都内避難所の半数に太陽光発電設備と蓄電池設置 30年までに","su":"도쿄도는 27일 2030년까지 도내 피난소의 약 3200곳 중 절반 이상에 태양광(햇빛으로 전기를 만드는 것) 발전 설비와 축전지를 설치한다고 발표했다. 구마모토 지진에서는 정전으로 피난소의 더위 대책이 문제가 되었다. 자립전원을 확보함과 동시에 단열화도 진행되어 격렬화하는 재해에 대비한다. 도유시설에서 태양광발전이나 축전지의 설치와 단열화를 진행시켜 구시정촌의 대처도 지원한다. 설치 비용의 보조율을 현재의 3분의 2"},{"s":"GX ZEH로 HEMS가 필수로 파나소닉 「AiSEG3」가 타사제 축전지를 제어, 잉여 전력으로 가전을 자동 운전","so":"ITmedia","tm":"11/27 18:21","c":1,"r":"jp","u":"https://built.itmedia.co.jp/bt/articles/2611/27/news054.html","p":1795771260,"a":1795780880,"t":"GX ZEHでHEMSが必須に パナソニック「AiSEG3」が他社製蓄電池を制御、余剰電力で家電を自動運転","su":"파나소닉 일렉트릭웍스는 2027년 4월부터 적용되는 고성능 주택의 새로운 정의 「GX ZEH」에 대응하기 위해 HEMS 「AiSEG3」의 기능을 강화한다. 2027년 1월 25일 업데이트로 타사제 축전지의 충방전 제어나 태양광(햇빛으로 전기를 만드는 것) 발전의 잉여 전력을 활용한 가전제어에 대응한다. GX ZEH의 보급에 수반하는 HEMS 수요의 확대를 전망해, 2029년도에 AiSEG 시리즈의 누계 판매 대수 70만대를 목표로 한다."},{"s":"후베이성 이창: Chuneng New Energy 588Ah 에너지 저장 용기 일괄 배송","so":"湖北新闻网","tm":"11/27 18:07","c":1,"r":"cn","u":"http://www.hb.chinanews.com.cn/news/2026/1127/435614.html","p":1795770420,"a":1795819530,"t":"湖北宜昌：楚能新能源588Ah储能集装箱批量交付","su":"중국 뉴스 서비스, 후베이 뉴스, 11월 27일(진 샤오옌) \"3, 2, 1 - 들어올려라!\" 현장 지휘관의 명령에 따라 3328개의 588Ah 대용량 배터리와 에너지저장장치(전기를 저장해 두는 큰 배터리) 통합시스템을 탑재한 47.5톤 무게의 6.25MWh 에너지저장 컨테이너가 원활하고 정확하게 수송차량에 안착됐다. 11월 26일, 후베이성 이창시 이링구 룽취안진에 위치한 Chuneng 신에너지 이창 생산 기지의 2단계 컨테이너 작업장에서 회사가 자체 개발한 588Ah 대용량 배터리가 장착된 6.25MWh 에너지 저장 컨테이너가 생산 라인에서 출시되어 중국 국내 고객에게 공식적으로 인도되어 Chuneng 신에너지 이창 생산 기지의 제품 배송 능력이 새로운 수준으로 향상되었습니다."},{"s":"100메가와트 에너지 저장 발전소를 뒷받침하는 친환경 금융 지원","so":"21财经","tm":"11/27 18:07","c":1,"r":"cn","u":"https://www.21jingji.com/article/20261127/herald/57ef865d49200f0853fd419b05e67447.html","p":1795770420,"a":1795853277,"t":"一座百兆瓦储能电站背后的绿色金融助力","su":"21세기 비즈니스 헤럴드 연수생 기자 양몽게 - 실물경제에 봉사하는 닝보은행의 녹색금융에 대한 기록입니다. 올해 10월, 중국 최초의 100메가와트 압축 이산화탄소 에너지 저장 프로젝트가 신장 무레이의 전력망(발전소 전기를 집·공장까지 보내는 전깃줄 그물)에 성공적으로 연결되어 전기를 생산했습니다. 이는 이산화탄소 '압축-액화-에너지 저장-가스화-팽창-에너지 방출-발전'의 전체 과정을 공개했으며 중국의 장기적인 에너지 저장 기술 혁신의 핵심 장을 썼습니다. 이 시스템이 구축되면 1GWh당 연간 탄소 감소량은 300,000톤에 달할 수 있으며 이는 연간 300,000에이커의 숲에서 탄소를 격리하는 것과 같습니다. 본 프로젝트 기술의 구현 뒤에는 Bairang New Energy Technology (Shenzhen)의 지속적인 노력이 있었습니다. 실험실 검증에서 대규모 구현에 이르기까지 회사의 성장 경로에는 닝보 은행의 녹색 금융 서비스가 항상 동반되었습니다."},{"s":"정흥전기, 최초의 R&D 거점을 개설 전고체 전지 등 신기술에 도전한다","so":"日本経済新聞","tm":"11/27 17:40","c":1,"r":"jp","u":"https://www.nikkei.com/article/DGXZQOJC243KZ0U6A121C2000000/","p":1795768800,"a":1795780881,"t":"正興電機、初のR&D拠点を開設 全固体電池など新技術に挑む","su":"정흥전기제작소는 27일 동사로서 최초의 연구개발(R&D) 거점인 '히비키의 연구개발센터'(기타큐슈시)의 개설식을 열었다. 동거점은 2일부터 운용을 시작하고 있다. 자전 중심의 방침으로부터 전환해, 산학관 제휴에 의한 차세대 기술의 개발을 목표로 한다. 동시 와카마츠구의 기타큐슈 학술 연구 도시 내에 입지해, 연구 개발동과 첨단 모노즈쿠리동으로 이루어진다. 연 바닥면적은 총 5300제곱미터로 약 51억엔을 들여 정비했다. 사업별로 배치"},{"s":"해호[3133]：(공개 사항의 경과) 「축전지 사업의 개시 및 고정 자산의 취득에 관한 알림」에 관한 취득 대상 안건의 변경에 관한 알림 2026년 11월 27일(적시 공개) ：닛케이 회사 정보","so":"日本経済新聞","tm":"11/27 17:00","c":1,"r":"jp","u":"https://www.nikkei.com/nkd/disclosure/tdnr/20261127587744/","p":1795766400,"a":1795819531,"t":"海帆[3133]：（開示事項の経過）「蓄電池事業の開始及び固定資産の取得に関するお知らせ」に係る取得対象案件の変更に関するお知らせ 2026年11月27日(適時開示) ：日経会社情報DIGITAL","su":"2026년 11월 27일 해호[3133]의 공개 자료 「(공개 사항의 경과) 「축전지 사업의 개시 및 고정 자산의 취득에 관한 알림」에 관한 취득 대상 안건의 변경에 관한 알림」을 열람할 수 있습니다. 자료는 PDF로 다운로드 가능"},{"s":"동서발전, ESS 입찰물량 57% 확보…국내 최대 용량 선점","so":"뉴시스","tm":"11/27 16:26","c":1,"r":"kr","u":"https://www.newsis.com/view/NISX20261127_0003886502","p":1795764392,"a":1795780876,"su":"[울산=뉴시스] 구미현 기자 = 한국동서발전이 에너지저장장치(ESS(전기를 저장해 두는 큰 배터리)) 중앙계약시장 입찰에서 전체 물량의 절반 이상을 확보하며 국내 최대 규모의 배터리에너지저장장치(BESS) 용량을 확보했다.한국동서발전은 '2026년 제3차 ESS 중앙계약시장 입찰'에서 강진 등 전남·전북 지역 7개 사업, 총 672MW 규모의 물량을 확보했다고 27일 밝혔다. 저장 용량으.."},{"s":"'건설주' 황딩 배터리모듈 가시성 반년 도달, 해외 에너지저장 레이아웃 다시 가속화 - OTC 상장주","so":"旺得富理財網","tm":"11/27 16:09","c":1,"r":"tw","u":"https://wantrich.chinatimes.com/news/20261127900259-420101","p":1795763354,"a":1795780878,"t":"《營建股》桓鼎電池模組能見度達半年海外儲能佈局再加速- 上市櫃","su":"[타임스 기자 궈홍휘(Guo Honghui) 타이페이 보도] Huanding-KY(5543)는 2026년 4분기(올해) 영업 전망을 조심스럽게 낙관하고 있습니다. 저궤도 위성, 스마트 웨어러블, 의료기기, 에너지 저장 시스템 등 단말 애플리케이션에 대한 수요가 지속적으로 증가함에 따라 Huanding 배터리 모듈 사업의 현재 수주(일감 주문을 받는 것) 가시성은 꾸준히 반년 수준에 도달했습니다. Huan Ding은 신흥 기술의 적용으로 인한 시장 변화에 직면하여 앞으로도 핵심 기술 연구 개발과 배터리 모듈의 맞춤형 개발을 계속해서 심화할 것이라고 지적했습니다."},{"s":"에너지저장 전력가격 메커니즘이 개선되고 신에너지 설비용량이 증가하면서 서던펀드의 저금리 상품인 신에너지 ETF 서던(516160)의 기초지수가 5% 가까이 상승했다.","so":"Jiemian.com","tm":"11/27 15:49","c":1,"r":"cn","u":"https://m.jiemian.com/article/15382875.html","p":1795762154,"a":1795762649,"t":"储能电价机制完善叠加新能源装机增长，南方基金旗下低费率产品新能源ETF南方(516160)标的指数涨近5%","su":"13시 27분 현재, 신에너지 ETF(여러 주식을 묶어 파는 상품) Southern(516160)은 장중 3.37%의 손바꿈을 했으며, 거래량(하루 동안 사고판 주식 수)은 8795.07백만 위안입니다. 추적지수인 CSI신에너지지수(399808)는 한때 4.87% 이상 상승했다가 현재 4.86% 상승 중이다."},{"s":"“누적 용량 국내 1위”…동서발전, 에너지저장장치 입찰 672MW 확보","so":"매일경제","tm":"11/27 15:48","c":1,"r":"kr","u":"https://m.mk.co.kr/amp/12220225","p":1795762122,"a":1795780876,"su":"기사 상세 기업 “누적 용량 국내 1위”…동서발전, 에너지저장장치(전기를 저장해 두는 큰 배터리) 입찰 672MW 확보 - 입력 : 2026-11-27 15:48:42 3차 중앙계약시장 입찰 물량 57% 확보 4032메가와트시(MWh) 규모 전남·전북 에너지 전환 기반 마련 한국동서발전이 국내 최대 배터리에너지저장장치 용량을 확보했다. 동서발전은 에너지저장장치(ESS) 중앙계약시장 입찰에서 강진 등 7개 사업 총 672메가와트(MW) 규모의 물량을 대거 확보했다고 27일 밝혔다."},{"s":"SK온, 국내 최대 에너지저장장치 입찰에서 지분 37% 인수","so":"The Korea Herald","tm":"11/27 14:38","c":1,"r":"us","u":"https://www.koreaherald.com/article/10951924","p":1795757931,"a":1795785212,"t":"SK On takes 37% share in Korea’s largest energy storage tender","su":"SK온은 금요일 현재까지 한국 최대 에너지 저장 입찰에서 총 443MW 규모의 에너지 저장 프로젝트에 배터리를 공급할 예정이라고 밝혔다."},{"s":"[특징주] 삼화전기, ESS 업종 매수세 유입에 강세…전기이중층·하이브리드 콘덴서 부각","so":"와이드경제","tm":"11/27 13:37","c":1,"r":"kr","u":"https://www.widedaily.com/news/articleView.html?idxno=305021","p":1795754243,"a":1795823858,"su":"인공지능(AI) 데이터센터(컴퓨터 수만 대를 모아 둔 건물) 확산에 따른 전력 수요 급증으로 전력저장장치(ESS)와 페라이트 관련주가 일제히 강세를 보이는 가운데 콘덴서 전문기업 삼화전기가 장중 급등하고 있다. 27일 오후 1시 2분 기준 유가증권시장(코스피(한국 큰 회사들 주가를 합쳐 만든 점수))에서 삼화전기는 전 거래일 대비 3650원(15.94%) 오"},{"s":"Sinolink Securities: 글로벌 에너지 저장 성장 추세는 분명합니다.","so":"中国证券报","tm":"11/27 10:06","c":1,"r":"cn","u":"https://jnzstatic.cs.com.cn/zzb/htmlInfo/139304.html","p":1795741560,"a":1795749585,"t":"国金证券： 全球储能增长趋势明确","su":"Sinolink Securities: 글로벌 에너지 저장 성장 추세는 분명합니다. Lin Qian CSI Taurus 최근 Sinolink Securities는 전 세계 에너지 저장 수요가 빠른 속도로 계속 증가하고 있으며 산업 발전이 점차 정책 중심에서 전력 시스템 유연성 요구 및 프로젝트 경제성으로 전환하고 있다는 연구 보고서를 발표했습니다. 2026년과 2027년 전 세계 신규 설치 에너지 저장 용량은 430GWh, 595GWh로 전년 대비(작년 같은 때와 비교해서) 40%, 38% 증가할 것으로 예상된다. 지속적인 신에너지 설비용량 증가, 전력부하 증가, 그리드 규제 수요 증가 등이 글로벌 에너지저장 시장 확대를 함께 촉진하고 있다. 중국, 유럽, 미국, 신흥시장 등이 다지역적 공명을 형성할 것으로 예상된다. Sinolink Securities는 높은 해외 배송 비율, 글로벌 채널 레이아웃, 수직 통합 제조 능력 및 우수한 금융 가능성을 갖춘 선도적인 에너지 저장 시스템 통합업체와 네트워크 구축 기술 및 시스템 제어 분야에서 우위를 점하고 있는 PCS 기업에 초점을 맞춰 글로벌 에너지 저장 장치 성장 추세가 분명하다고 밝혔습니다."},{"s":"산화물계 전고체 전지, 150℃에서도 안정된 방전 동작 FDK：고온 설비 주변에서 상태 감시가 가능하게","so":"EE Times Japan","tm":"11/27 09:30","c":1,"r":"jp","u":"https://eetimes.itmedia.co.jp/ee/articles/2611/27/news033.html","p":1795739400,"a":1795749588,"t":"酸化物系全固体電池、150℃でも安定した放電動作 FDK：高温設備周辺で状態監視が可能に","su":"FDK는 SMD 소형 산화물계 전고체(액체 대신 고체를 넣어 더 안전한 배터리) 전지 「SoLiCell」이 150℃라는 고온 환경하에서도 안정된 방전 동작을 할 수 있는 것을 확인했다. 고온 설비 주변에서 상태 감시를 실시하는 센서(빛·소리·움직임 등을 알아채는 부품)나 IoT 디바이스 등의 용도를 향한다."},{"s":"정흥전기, 최초의 연구거점 AI와 사외의 지견 활용해 축전지 개발에","so":"毎日新聞","tm":"11/27 07:45","c":1,"r":"jp","u":"https://mainichi.jp/articles/20261126/k00/00m/310/134000c","p":1795733100,"a":1795733642,"t":"正興電機、初の研究拠点 AIと社外の知見活用し蓄電池開発へ","su":"전력회사용 인프라 제어시스템 등을 다루는 정흥전기제작소는 '히비키의 연구개발센터'(기타큐슈시 와카마츠구)를 개설했다. 기타큐슈학술연구도시에 있으며, 동사에 있어서는 1921년의 창업 이래, 최초의 연구개발 거점. 대학이나 기업과 연계를 추진해 인공지능(AI)을 활용한 전력 인프라와 축전지의 연구개발을 담당한다."},{"s":"일본 국내 최대급의 축전소, 12월 가동 오릭스가 시가·요네하라의 시유지에","so":"朝日新聞","tm":"11/27 07:30","c":1,"r":"jp","u":"https://www.asahi.com/articles/ASVCT4J93VCTPTJB003M.html","p":1795732200,"a":1795733645,"t":"国内最大級の蓄電所、12月稼働 オリックスが滋賀・米原の市有地に","su":"오릭스는 시가현 요네하라시 번장에 정비한 ‘요네하라코 동축전소’의 상업운전을 12월 1일에 시작한다. 출력은 13만 4천킬로와트, 축전 용량은 54만 8천킬로와트시로, 일반 가정 약 5만 1천 가구가 하루에 사용하는 전력량에…"},{"s":"배터리 팩 뚜껑은 자동차 바닥, 중국 EV \"B05\"를 분해 코스파의 원천에 육박","so":"日経クロステック","tm":"11/27 05:00","c":1,"r":"jp","u":"https://xtech.nikkei.com/atcl/nxt/column/18/03520/112400028/","p":1795723200,"a":1795733649,"t":"電池パックのフタは車の床、中国EV「B05」を分解 コスパの源泉に迫る","su":"중국 립모터는 '코스파'가 높은 대중차를 주력으로 삼아 중국 신흥자동차 업체 중 판매 선두를 독주하는 주목 기업이다. 이번에 닛케이 BP의 프로젝트 팀은 립 모터의 전기 자동차 \"B05\"를 분해. 비용 경쟁력의 원천에 다가갔다."},{"s":"전고체 전지의 입자를 검사 아르코닉스계에 매료","so":"日本経済新聞","tm":"11/27 05:00","c":1,"r":"jp","u":"https://www.nikkei.com/prime/mobility/article/DGXZQOUC122M30S6A111C2000000","p":1795723200,"a":1795733653,"t":"全固体電池の粒子を検査 アルコニックス系に引き合い","su":"마크텍의 분체입자의 강도를 조사하는 장치 도요타 자동차 등 일본차 메이커가 전고체(액체 대신 고체를 넣어 더 안전한 배터리) 전지 개발을 진행하는 가운데 개발 시 성능 등을 확인하는 검사 수요가 발생하고 있다. 전기자동차(EV)의 항속거리 등의 성능은 전지를 구성하는 입자의 밀도 등이 좌우한다. 비철금속상사 아르코닉스의 그룹사가 의약품과 화장품으로 길러온 분체의 검사 수탁으로 새로운 수요 섭취를 목표로 한다. 일하고 있는 것은 물질의 검사를 다루는 마크텍(도쿄·대전)이다. 대상을 파괴하지 않고 실시하는 검사"},{"s":"1분 만에 기술: 장기 에너지 저장 이점을 갖춘 플로우 배터리","so":"DIGITIMES","tm":"11/27 02:25","c":1,"r":"tw","u":"https://www.digitimes.com.tw/tech/dt/n/shwnws.asp?id=776242","p":1795713938,"a":1795733638,"t":"科技1分鐘：具長時儲能優勢的液流電池","su":"풍력(바람으로 전기를 만드는 것)과 태양광(햇빛으로 전기를 만드는 것) 발전 비중이 높아지면서 AI도 전력 수요를 증가시킨다. 그리드는 잉여 전력을 저장했다가 전력 생산량이 감소해도 계속해서 전력을 공급해야 합니다. 이에 플로우 배터리(Flow Battery)가 주목받고 있다. 수요에 따라 에너지 저장 용량을 확장하고 전원 공급 시간을 연장할 수 있습니다."},{"s":"유해한 \"잔류 알칼리\"가 \"방호복\"이 됩니다! 중국 나트륨이온 배터리 연구의 새로운 돌파구","so":"ThePaper.cn","tm":"11/26 23:41","c":1,"r":"cn","u":"https://www.thepaper.cn/newsDetail_forward_34568292","p":1795704091,"a":1795733633,"t":"有害“残碱”变“防护衣”！我国钠离子电池研究有新突破","su":"◎ 과학기술일보 양룬 기자 대규모 에너지 저장 발전소의 비용을 어떻게 줄일 수 있을까? 전기 자전거로 안전과 배터리 수명의 균형을 맞추는 방법은 무엇입니까? 원자재(물건의 재료(석유·구리 등))가 풍부한 나트륨이온(리튬 대신 소금 성분(나트륨)을 쓰는 배터리)전지는 이러한 문제를 해결하기 위한 중요한 선택이다. 나트륨 배터리는 저장용량, 빠른 충전 속도, 수명이 매우 중요합니다."},{"s":"[모닝포스트] 신에너지저장 블록버스터 시행계획 발표… TCL Zhonghuan과 China Rare Earth는 다음 월요일에 거래를 재개합니다","so":"财联社","tm":"11/26 17:23","c":1,"r":"cn","u":"https://www.cls.cn/detail/2534356","p":1795681424,"a":1795694321,"t":"【早报】新型储能重磅实施方案印发；TCL中环、中国稀土下周一复牌","su":"①10월 재무 데이터 공개 ②중앙은행(나라의 돈과 이자를 관리하는 은행): 2000억 위안 규모의 매입 역환매 작업이 11월 16일 6개월 기간으로 진행된다. ③ 엔비디아 주가는 이번 주 13% 하락했다. ④ 2개 부문: 중국의 신규 에너지 저장 장치 설치 용량은 2030년까지 3억 킬로와트에 달할 것이다. ⑤TCL 센트럴과 중국 희토류는 다음 주 월요일 거래를 재개할 예정이다. 매크로뉴스 1. 중앙은행 자료에 따르면 예비통계에 따르면 2026년 1~10월 사회융자 누적 증가액은 28조6100억 위안으로 지난해 같은 기간보다 2조2900억 위안이 줄었다. 10월 말 광의통화잔고(M2)는 359조600억 위안으로 전년 동기 대비 7.1% 증가했다. 10월 말 기준 내외대출 잔액은 287조2500억 위안으로 전년 동기 대비 4.6% 증가했다. 월말 기준 위안화 대출 잔액은 283조3300억 위안으로 전년 동기 대비 4.7% 증가했다. 첫 10개월 동안 위안화 대출은 11조4200억 위안 증가했다."},{"s":"GFESS 배터리 ETF는 400만주의 순청약을 보유하고 있으며, 안전마진이 높은 저위험군에서는 현재 프리미엄 및 할인율이 -0.23%이다.","so":"经济观察网","tm":"11/26 15:41","c":1,"r":"cn","u":"http://www.eeo.com.cn/2026/1126/1103898.shtml","p":1795675260,"a":1795694322,"t":"储能电池ETF广发净申购400万份份额，当前溢折率-0.23%处低风险区安全边际较高","su":"경제 관찰자 네트워크 에너지 저장 배터리 ETF(여러 주식을 묶어 파는 상품) Guangfa (159305)는 11월 25일 400만개를 순매수(산 돈이 판 돈보다 많은 것)했으며 이는 ETF 펀드 점유율의 0.43%를 차지합니다. 펀드의 최근 주식수는 9억2800만주로 상장 이후 누적 증가액은 7억700만주다. 최근 규모는 5억2200만 위안으로 증가했다."},{"s":"[철도 에너지 전환, 현장에서 길을 찾다] ⑥ 같은 ESS, 다르게 쓴다…동해선 평해·후포역 전력비 절감법","so":"전기신문","tm":"11/26 10:09","c":1,"r":"kr","u":"https://www.electimes.com/news/articleViewAmp.html?idxno=375233","p":1795655380,"a":1795663014,"su":"[철도 에너지 전환, 현장에서 길을 찾다] ⑥ 같은 ESS(전기를 저장해 두는 큰 배터리), 다르게 쓴다…동해선 평해·후포역 전력비 절감법 태양광(햇빛으로 전기를 만드는 것)은 주간 자가소비, ESS는 심야 충전…두 무인역서 시범운영 태양광 규모·전력 수요 고려해 운전…계절별 요금 시간대도 반영 LTE 원격 감시·이상 알림 적용…모듈별 소화설비로 안전관리 강화 지난달 16일 찾은 동해선 평해역. 열차 이용객을 맞는 역사 한편에서 에너지저장장치(ESS)가 정해진 시간표에 따라 충전과 방전을 반복한다."},{"s":"전고체 배터리 상용화 걸림돌 ‘압력’ 낮췄다… 포스텍, 저압 구동 구현","so":"Chosunbiz","tm":"11/26 09:08","c":1,"r":"kr","u":"https://biz.chosun.com/science-chosun/science/2026/11/26/4FFJXM45R5G57PLURYD5RVT2UE/?outputType=amp","p":1795651680,"a":1795663014,"su":"국내 연구진이 상온에서 낮은 압력으로도 안정적으로 작동하는 전고체 리튬금속전지를 개발했다. 전고체 배터리(액체 대신 고체를 넣은 안전한 배터리)의 상용화(실제로 팔고 쓰이기 시작하는 것) 걸림돌 중 하나인 높은 가압 조건을 완화할 수 있는 기술로, 향후 배터리의 무게와 부피를 줄이는 데 활용될 가능성이 있다. 박수진 포스텍 화학과 교수 연구진은 중앙대, 한국기초과학지원연구원(KBSI), 미 서던메소디스트대(SMU) 연구진과 공동으로 상온에서 0.3㎫(메가파스칼) 이하의 압력으로 작동하는 전고체 리튬금속전지를 구현했다고 26일 밝혔다."},{"s":"축전지, 주력 전원에","so":"日経クロステック","tm":"11/26 06:33","c":1,"r":"jp","u":"https://xtech.nikkei.com/atcl/nxt/column/18/03385/index.html?%3Fi_cid=nbpnxt_bn_child&fieldSubSeg=fdxKEYWORDUSBKEYWORDSoC","p":1795642414,"a":1795676852,"t":"蓄電池、主力電源に","su":"리튬(배터리에 꼭 들어가는 아주 가벼운 금속) 이온 전지를 이용한 축전지는 재생 가능 에너지의 출력 변동을 평준화하는 툴로서 전세계의 전력 계통에 대량 도입되고 있다. 해외에서는 이미 주력전원 중 하나가 된 예도 나왔다."},{"s":"27년 중국 자동차 '10대 기술', 전고체 전지에 브레이크스루 E2E는 벗어난다","so":"日経クロステック","tm":"11/26 05:00","c":1,"r":"jp","u":"https://xtech.nikkei.com/atcl/nxt/column/18/03565/112200049/","p":1795636800,"a":1795647129,"t":"27年の中国自動車「10大技術」、全固体電池にブレークスルー E2Eは外れる","su":"중국의 자동차 기술자 단체인 중국 자동차 공정 학회(CSAE)가 2027년 주목되는 자동차 기술 트렌드 10선(이하 10대 기술)을 발표했다. CSAE는 자동차 메이커나 부품 메이커의 기술자도 많이 참가하고 있다. 10대 기술에는 단순한 예측이라기 보다 목표로 하는 방향을 명확하게 하는 목표 설정으로서의 의미도 크다. 과거의 10대 기술의 경향과 비교함으로써 중국세의 미래 전략의 일단이 보였다."},{"s":"에너지 저장 정책은 Xiter의 보충을 지원합니다 - 매일","so":"工商時報","tm":"11/26 04:00","c":1,"r":"tw","u":"https://www.ctee.com.tw/news/20261126700322-439901","p":1795633200,"a":1795647125,"t":"儲能政策助攻熙特爾進補- 日報","su":"지난 10월 국립대만경제연구소가 발행한 '에너지 저장 산업'에 대한 미래 전망 산업 분석 보고서에서는 경제부 에너지 관리국이 기술적 에너지 저장 촉진을 확대할 계획이며, 이는 2026년 새로운 에너지 저장 구축 증가를 지원하는 데 도움이 될 것이라고 지적했습니다. 데이터 센터와 같은 대규모 전력 소비자가 적극적으로 에너지 저장 및 기타 에너지 절약 조치를 모색하는 환경에서 Xitel-Chuang의 중장기 운영 성과에 도움이 될 것입니다. (7740). 대만 증권 거래소와 대만 경제 아카데미는 협력하여 정기적으로 업계 보고서를 발행합니다. 대만 경제원(Taiwan Academy of Economics)은 지난 10월 에너지 저장 산업에 관한 산업 발전 보고서를 발표했습니다."},{"s":"동화일렉트로라이트, 북미서 신규 배터리 고객사 확보","so":"디일렉","tm":"11/25 17:26","c":1,"r":"kr","u":"https://www.thelec.kr/news/articleView.html?idxno=65915","p":1795595193,"a":1795608210,"su":"동화일렉트로라이트가 북미 전해액 사업의 고객 기반을 확대했다. 신규 고객사는 글로벌 배터리 시장 점유율 상위 10대 기업 중 한 곳이다.동화일렉트로라이트는 글로벌"}]},{"name":"🏭 AI 전력","note":"보유: ACE 코리아AI전력TOP10","breaking":false,"items":[{"s":"두산에너빌리티·창원상의, 취약계층 난방비 1억8000만원 기탁","so":"뉴시스","tm":"11/26 17:39","c":13,"r":"kr","u":"https://mobile.newsis.com/view_amp.html?ar_id=NISX20261126_0003885183","p":1795682384,"a":1795694333,"su":"[창원=뉴시스]강경국 기자 = 두산에너빌리티와 창원상공회의소가 5년째 공동 사회공헌 사업으로 경남 창원 지역 에너지 취약계층의 겨울나기를 지원하고 있다"},{"s":"Hongyu Motor는 201.11위안으로 시장에 상장되었으며, AI 데이터 센터 주문은 2028년에 이루어질 것으로 예상됩니다.","so":"自由財經","tm":"11/26 14:55","c":7,"r":"tw","u":"https://ec.ltn.com.tw/article/breakingnews/5654164","p":1795672558,"a":1795676862,"t":"宏于電機201.11元掛牌上櫃 AI資料中心訂單看到2028年","su":"[린징화 기자/타이베이 리포트] 스마트 전력 및 에너지 시스템 통합 공장인 홍유전기(7869)가 인수가격 주당 NT$201.11에 26일 OTC 시장에 공식 상장됐다. Hongyu의 사업은 전력망(발전소 전기를 집·공장까지 보내는 전깃줄 그물) 업그레이드, 공공 공사, 반도체(전자기기 속에서 계산하고 기억하는 작은 부품) 공장 확장 및 AI 데이터 센터를 포괄합니다. 고객의 요구는 다양한 소스에서 나옵니다."},{"s":"도쿄전력, AI 인프라에 10조엔 데이터센터용 송전망·원전 증강","so":"日本経済新聞","tm":"11/26 18:00","c":3,"r":"jp","u":"https://www.nikkei.com/article/DGXZQOUA048R70U6A101C2000000/","p":1795683600,"a":1795694339,"t":"東京電力、AIインフラに10兆円 データセンター向け送電網・原発増強","su":"도쿄전력홀딩스는 인공지능(AI) 인프라가 되는 송전(전기를 멀리 보내는 것)망이나 원자력발전소에 2035년도까지 9년간 10.2조엔을 던져 미국 하이퍼스케일러(대규모 클라우드(인터넷으로 빌려 쓰는 컴퓨터) 사업자) 등 데이터센터(DC)를 유치한다. 타사로부터 출자를 받아들여 외부 자본을 활용한다. 전력판매 확대로 후쿠시마 제1원자력발전소의 폐로 비용을 비싼다. 토덴은 소프트뱅크와 일본 국내외 투자펀드의 총 5진영과 자본제휴를 위한 협상을 진행하고 있다."},{"s":"미국 칩 제어가 AI 레이아웃에 영향을 미침 태국 데이터 센터 협회: 대만의 장점 | 산업경제학","so":"中央社 CNA","tm":"11/27 15:42","c":2,"r":"tw","u":"https://www.cna.com.tw/news/afe/202611270121.aspx","p":1795761720,"a":1795762663,"t":"美晶片管制牽動AI布局泰國資料中心協會：台灣具優勢| 產經","su":"미국은 AI 칩(인공지능 계산에 쓰는 반도체) 수출 규제를 강화했고, 태국의 관련 산업도 어려움을 겪고 있다. 태국 데이터센터(컴퓨터 수만 대를 모아 둔 건물) 협회 부회장인 수팔랏(Supalat)은 CNA에 정부가 최근 데이터센터에 전력을 할당하기 시작했으며 운영자들은 여전히 고객 분포를 조정하고 영향을 줄일 수 있는 능력을 갖고 있다고 말했습니다. 대만은 기술적, 재정적 이점으로 인해 동남아시아 AI 산업에서 중요한 역할을 할 수 있다."},{"s":"대동의 3개 도로는 성과를 위해 노력하기 위해 병행하여 전진하고 있습니다. 모듈형 컴퓨팅 파워 센터는 다음 분기에 주문을 받을 것으로 예상됩니다.","so":"UDN","tm":"11/27 02:52","c":2,"r":"tw","u":"https://udn.com/news/story/7240/9904579","p":1795715573,"a":1795733669,"t":"大同三路並進拚業績 模組化算力中心下季可望接單","su":"다퉁(2371)은 어제(26일) 그룹 합동법률회의를 열고 전력, 컴퓨팅 파워, 자산 3대 사업을 종합적으로 추진했다. 회사는 모듈형 컴퓨팅 파워 센터 'AIDC CUBE'가 점점 더 많은 고객을 유치하고 있으며 내년 1분기에 신규 수주가 예상된다고 밝혔다. 북미 변압기(전기의 세기(전압)를 바꿔 주는 기계) 주문은 내년에 인도될 예정이다. 총 매출(물건을 판 돈 전체)이 NT$430억에 달하는 세 가지 주요 주택 건설 프로젝트도 내년부터 계정에 이관될 예정입니다."},{"s":"Datong Dharma Conference/전기 및 컴퓨팅 파워 주문을 받아 430억 주택 프로젝트가 2027년부터 계좌로 이관됩니다.","so":"UDN","tm":"11/26 16:48","c":2,"r":"tw","u":"https://udn.com/news/story/7252/9903821","p":1795679312,"a":1795694334,"t":"大同法說會／電力、算力雙接單 430億住宅案2027年起交屋入帳","su":"지난 26일 다퉁(2371)은 다샤케(8099), 엘리트컴퓨터(2331), 푸화전자(8085)와 함께 3분기 합동 기업설명회를 열었다. Datong은 중국 본토에서 Huaying 사건이 공식적으로 해결됨에 따라 부채 적립금 환급 혜택이 재무 구조를 강화하고 미분배 수익을 개선할 것으로 기대된다고 지적했습니다. 이 전력회사는 최근 미국 텍사스와 캘리포니아에서 대규모 변압기(전기의 세기(전압)를 바꿔 주는 기계) 수주(일감 주문을 받는 것)에 성공했다. AI데이터센터(AIDC)도 최초로 엣지 AI 완제품 수주를 따냈다. 또한, 총 판매량 NT$430억에 달하는 주택 개발 프로젝트가 2027년에 차례로 인도될 예정입니다. 세 가지 핵심 사업이 동시에 진행되어 내년 운영에 탄력을 더할 것입니다."},{"s":"대만자동차전기(Taiwan Automobile & Electric), AI 데이터센터에서 3개 사업 기회 포착…원전 재가동 영향 제한적","so":"自由時報","tm":"11/26 16:12","c":2,"r":"tw","u":"https://stock.ltn.com.tw/article/bzyyf7puxuge","p":1795677170,"a":1795694336,"t":"台汽電搶AI資料中心3商機 看核電重啟影響有限","su":"AI 데이터센터(AIDC) 열풍으로 전력 수요가 급증하고, 주요 증기력 공생 기업인 대만전력(8926)은 그룹의 AI 전력 인프라 참여 확대를 희망하며 발전소 투자, 발전소 프로젝트 계약, 공급망(부품·재료가 오가는 연결망) 레이아웃까지 관련 사업 기회를 지속적으로 포착하고 있다. 대만자동차발전(Taiwan Automobile & Power)은 오늘(26일) 프랑스에서 열린 기자회견에서 원자력이 재가동되더라도 가스발전소 사업에 미치는 영향은 여전히 제한적일 것이라고 밝혔습니다. AI 데이터센터와 반도체(전자기기 속에서 계산하고 기억하는 작은 부품) 산업의 전력 수요가 지속적으로 증가함에 따라 전력 시장도 계속해서 발전할 것입니다."},{"s":"골드만삭스: 미국 데이터센터 건설 붐은 2028년까지 지속될 것으로 예상된다. TrendForce: 2027년에는 메모리 출력 가치 성장이 둔화될 것으로 예상 | 디지털 지능 초기 참조","so":"经济观察网","tm":"11/26 09:00","c":2,"r":"cn","u":"http://www.eeo.com.cn/2026/1126/1103147.shtml","p":1795651200,"a":1795663025,"t":"高盛：美国数据中心建设热潮有望持续至2028年；集邦咨询：预计2027年存储器产值增速放缓｜数智早参","su":"일일 기자 | 양휘 편집자 | 웨이웬이 | 2026년 11월 26일 목요일 | NO.1 골드만삭스: 미국 데이터센터(컴퓨터 수만 대를 모아 둔 건물) 건설 붐은 2028년까지 지속될 것으로 예상된다. 11월 25일 과학기술혁신위원회데일리(Science and Technology Innovation Board Daily)에 따르면 골드만삭스 그룹은 인공지능 붐에 힘입어 미국 데이터센터의 전력 용량이 2028년까지 계속해서 크게 성장할 것이라고 밝혔다. 데이터센터의 수, 규모, 전력 밀도가 지속적으로 증가함에 따라 이는 전기 및 천연가스 수요에 상승 위험을 초래할 것이다. 골드만삭스는 2028년까지 미국 데이터센터 전력 용량이 52기가와트 추가될 것으로 예상했다. 올해 초부터 미국 데이터센터 전력 용량과 수요는 거의 30% 증가해 미국 전체 전력 수요 증가의 3분의 1 이상을 차지했다."},{"s":"Huacheng: 2030년 대규모 전력 주문으로 AIDC 전원 공급 시스템 사업 기회 포착 | 업계 핫스팟 | 산업","so":"經濟日報","tm":"11/25 17:22","c":2,"r":"tw","u":"https://money.udn.com/money/story/5612/9901479?from=edn_newestlist_rank","p":1795594937,"a":1795608227,"t":"華城：重電訂單看到2030年 搶攻AIDC供電系統商機 | 產業熱點 | 產業","su":"주요 중전력 제조업체인 Huacheng Electric의 CEO(회사의 가장 높은 책임자) Xu Yisheng은 AIDC(인공 지능 데이터 센터)가 전력망(발전소 전기를 집·공장까지 보내는 전깃줄 그물) 인프라에 대한 수요가 높으며 Huacheng Heavy Electric 제품의 주문 가시성이 203개로 증가했다고 지적했습니다."},{"s":"텍사스, 데이터 센터 프로젝트 승인 \"동결 해제\", 개발자들은 민주당 주지사 취임 전에 승인 받기 위해 서두르고 있음","so":"星島頭條","tm":"11/28 16:01","c":1,"r":"hk","u":"https://www.stheadline.com/realtime-finance/3642086/%E5%BE%B7%E5%B7%9E%E8%A7%A3%E5%87%8D%E6%95%B8%E6%93%9A%E4%B8%AD%E5%BF%83%E9%A0%85%E7%9B%AE%E5%AF%A9%E6%89%B9-%E9%96%8B%E7%99%BC%E5%95%86%E8%B6%95%E5%9C%A8%E6%B0%91%E4%B8%BB%E9%BB%A8%E5%B7%9E%E9%95%B7%E4%B8%8A%E4%BB%BB%E5%89%8D%E7%8D%B2%E6%89%B9","p":1795849305,"a":1795853288,"t":"德州「解凍」數據中心項目審批 開發商趕在民主黨州長上任前獲批","su":"텍사스가 몇 달 동안 1,800개 이상의 데이터 센터 프로젝트에 대한 허가 승인을 중단한 후 공화당 주지사 Greg Abbott 사무실은 앞서 텍사스 환경 품질 위원회(TCEQ)에 데이터 센터 관련 허가를 완전히 재개하도록 요구하는 명령을 내린 것으로 알려졌습니다. 개발자들은 민주당 주지사가 취임하기 전에 즉시 승인을 받기 위해 달려갔습니다. 스페이스X 프로젝트는 대기 오염 허가 승인을 받았습니다. 파이낸셜타임스는 TCEQ가 지난주 데이터 센터 프로젝트와 관련된 허가 발급을 재개했다고 보도했습니다. 이번에는 스페이스X에 대한 세 가지 대기 오염 허가를 승인했습니다."},{"s":"척, 1990년대 출생: 전력망의 최전선에서 수천 가구의 조명을 보호합니다.","so":"经济观察网","tm":"11/28 06:57","c":1,"r":"cn","u":"http://www.eeo.com.cn/2026/1128/1105840.shtml","p":1795816654,"a":1795823867,"t":"90后张策：电网一线守护万家灯火","su":"Zhang Ce(오른쪽)와 그의 동료들이 허난성 뤄양시 이촨현에 있는 110kV 리공 변전소(전기의 세기를 바꿔 나눠 보내는 곳)에서 검사를 수행하고 있습니다. 사진 제공: 인터뷰 대상자 Zhang Ce는 전력 운영 및 유지 관리 분야에서 8년간의 깊은 경험을 쌓은 후 다음과 같은 단순한 진실을 믿습니다. \"운영 및 유지 관리 효율성은 결코 속도 경쟁이 아닙니다. 안전을 유지하고 오작동을 제거하는 것이 우리 변전소 운영 및 유지 관리 인력의 원칙입니다.\" 이 문장은 그가 자주 언급하는 말이다. 2018년 북동전력대학교에서 기계 설계, 제조, 자동화를 전공한 Zhang Ce는 허난성 뤄양시에 있는 State Grid Yichuan County Power Supply Company(이하 \"Yichuan County Power Supply Company\")에 입사하여 현에서 멀리 떨어진 110kV Doucun 변전소(이하 \"Ducun 변전소\")를 포함하여 7개의 무인 변전소의 운영 및 유지 관리를 담당했습니다. 일상적인 장비 점검, 정전 작업, 긴급 상황 발생 시 긴급 수리 등이 그의 업무에서 일반적입니다. 매일 현장 작업에서 그는 모든 작업에 안전 원칙을 구현합니다. 그는 작전일지와 적외선 온도계, 그리고 풀뿌리 차원에 뿌리내리려는 진지한 의지로 경험을 쌓고 현장 작전 기술을 연마한다. 젊고 무식한 신입사원에서 직장에 입문한 그는 변전소 운영 및 유지보수 전담 전문가가 된다(전문이란 변전소 운영 및 유지보수 전문 관리직을 말한다 - 기자 주)."},{"s":"미국 군사전문가, 한·일 병력 급감 경고…무인·AI 전력 전환 해법 제시","so":"글로벌이코노믹","tm":"11/28 03:56","c":1,"r":"kr","u":"https://www.g-enews.com/article/Global-Biz/2026/11/2026112803535783820990b2dc5_1","p":1795805787,"a":1795819540,"su":"미국 군사전문가가 한국과 일본 국방 당국이 같은 주에 인구 구조 변화로 인한 병력 제약을 공개적으로 밝힌 현상을 분석했다.미국 안보·방산 전문 매체 디펜스인포는 로빈 레어드 군사·안보 분석가의 2026년 11월 27일(현지시각) 기고를 인용해 양국이 병력 자원 감소와 전장 기술 수요 증"},{"s":"중국남방전력망 광동제양전력공급국은 낚시하러 갈 때 전선에서 멀리 떨어져 있도록 따뜻하게 상기시켜 줍니다.","so":"21财经","tm":"11/27 20:09","c":1,"r":"cn","u":"https://www.21jingji.com/article/20261127/herald/93cbbee9ad1e5cb628283f1d84452152.html","p":1795777740,"a":1795780894,"t":"南方电网广东揭阳供电局温馨提醒，外出垂钓请远离电力线路","su":"날씨가 좋아 야외 활동을 즐기기 좋은 계절입니다. 강, 호수, 연못에서의 낚시는 많은 시민들의 선택입니다. 낚시의 즐거움을 즐기면서 주변의 전기 안전에도 주의를 기울여야 합니다. 중국남방전력망 광동제양전력공급국은 모든 낚시 애호가들에게 장대를 출발하기 전에 주변 환경을 명확하게 확인하고 전선 아래 또는 근처에서 낚시를 하지 말고 변압기(전기의 세기(전압)를 바꿔 주는 기계) 및 기타 전기 장비에서 적극적으로 멀리 떨어져 있도록 상기시켜 드립니다. 낚시터를 선택할 때에는 우선 위쪽에 전선이 있는지 살펴보고, 그 다음에는 전신주나 변압기가 있는지, '고전압 위험', '낚시 금지' 등의 경고 표시가 있는지 살펴보세요. 연못, 강, 호수 주변의 경고 표지판은 위험을 상기시켜줍니다. 보신 후에는 안전한 곳을 선택하셔야 합니다. 경고 표시가 보이지 않더라도 이곳이 안전하다고 단정할 수는 없습니다. 근처에 전선이 있거나 전선의 위치를 명확하게 볼 수 없거나 알 수 없다면 함부로 전선에서 내리지 마십시오."},{"s":"Agencia Comercial Spirits Ltd, AI 컴퓨팅 및 데이터 센터 사업에 대한 업데이트 제공 및 규정 준수 의지 재확인 - 회사 발표 - FT.com","so":"Financial Times","tm":"11/27 19:15","c":1,"r":"world","u":"https://markets.ft.com/data/announce/detail?dockey=1330-9885843en-2G8IMHDUF0NAV9U9T3P5U03R8U","p":1795774500,"a":1795785226,"t":"Agencia Comercial Spirits Ltd Provides Update on AI Computing and Data Center Business and Reaffirms Commitment to Compliance – Company Announcement - FT.com"},{"s":"‘전력통’ 정승일·‘재무통’ 강동수 쌍두마차 출격…SK이노베이션, AI 전력 키우고 11조 투자금 회수전 돌입","so":"뉴스퀘스트","tm":"11/27 16:51","c":1,"r":"kr","u":"https://www.newsquest.co.kr/news/articleView.html?idxno=306047","p":1795765901,"a":1795780892,"su":"【뉴스퀘스트=이승주 기자】SK이노베이션이 전력·에너지 전문가와 전략·재무 전문가를 새 경영진으로 선임했다. 인공지능(AI) 데이터센터(컴퓨터 수만 대를 모아 둔 건물)와 반도체(전자기기 속에서 계산하고 기억하는 작은 부품) 산업을 중심으로 전"},{"s":"스타마인드 | 포커스 | 수백만 개의 위성 밸리 컴퓨팅 성능, 전력망 구축을 위한 Space Three Gorges | 주제 관점 - 뉴스","so":"etnet 經濟通","tm":"11/27 15:10","c":1,"r":"hk","u":"https://www.etnet.com.hk/www/tc/news/news-article.php?section=features&category=focus&newsid=418386","p":1795759800,"a":1795762665,"t":"Starmind | FOCUS | 百萬衛星谷算力，太空三峽築電網 | 專題透視 - 新聞","su":"스타마인드 | 포커스 | 수백만 개의 위성 밸리 컴퓨팅 파워, 우주 삼협 전력망(발전소 전기를 집·공장까지 보내는 전깃줄 그물) 구축 GPU 임대 및 토큰 가격을 둘러싼 전쟁이 격화되는 가운데 머스크의 \"우주 꿈\"은 최근 미국 연방통신위원회(FCC)로부터 2040년까지 최대 100만 개의 AI 데이터 센터 위성을 배치하겠다는 조건부 승인을 받았습니다. 많은 기술적 병목 현상이 아직 해결되지 않았지만 컴퓨팅 파워의 배치는 지상과 우주라는 두 가지 범주로 명확하게 구분되었습니다. 이제 스페이스X의 \"지각이 있는 태양\" 야망에서 중국의 \"일요일 프로젝트\"로 초점을 옮기면서 중국과 미국 간의 게임은 계속해서 지구를 넘어 확장되고 있습니다. 커다란 꽃관과 이빨 사이의 틈이 있는 달 외에도 미래에 천문학 애호가들의 망원경에 갑자기 '생각하는' 위성 무리가 나타날 것인가? 현재 궤도에는 11,000개 이상의 스타링크 위성이 있으며, 향후 클라우드(인터넷으로 빌려 쓰는 컴퓨터) 컴퓨팅 파워를 담당하게 될 스타마인드 네트워크는 500km에서 1,002km에 이르는 저궤도에 최대 100만 개의 위성을 분산시킬 계획이다. 그들은 성간 레이저 링크를 통해 스타링크와 연결되어 지구와의 데이터 교환을 실현할 것입니다."},{"s":"전력공급, AI용 데이터센터의 사업자를 우선으로 「파스트패스 제도」의 검토 등 자민당 제언안","so":"日本経済新聞","tm":"11/27 15:00","c":1,"r":"jp","u":"https://www.nikkei.com/article/DGXZQOUA2706H0X21C26A1000000/","p":1795759200,"a":1795762666,"t":"電力供給、AI向けデータセンターの事業者を優先に 「ファストパス制度」の検討など自民党提言案","su":"자민당의 자원·에너지 전략조사회는 27일 인공지능(AI)용 데이터센터(DC) 등 입지촉진에 제언안을 정리했다. 실수를 예상하는 대규모 DC사업자에게 우선적으로 전력을 공급할 수 있도록 계통접속 규칙의 재검토를 정부에 요구했다. 사업의 실현성이 낮음에도 불구하고 송전(전기를 멀리 보내는 것)망에 접속할 권리를 얻는 '공압'을 막는다. DC사업자는 건설 전에 전력회사와 전력확보 계약을 맺는다. 최근에는 신청이 쇄도하여 수도권과 간사이 지역에서의 전기"},{"s":"‘현지화 없는 수출’ 중동 줄이고 유럽 키운다더니…HD현대일렉트릭, 유럽 수주 32% 급감 ‘역풍’","so":"뉴스퀘스트","tm":"11/27 14:46","c":1,"r":"kr","u":"https://www.newsquest.co.kr/news/articleView.html?idxno=306012","p":1795758367,"a":1795762660,"su":"【뉴스퀘스트=장홍석 기자】중동의 자국 우선주(투표권 대신 배당을 먼저 받는 주식)의(현지화) 정책을 피해 유럽 시장으로 눈을 돌렸던 HD현대일렉트릭이 또다시 ‘현지화’라는 거대한 벽에 부딪혔다. 중동"},{"s":"신유열 ‘바이오’ 구본규 ‘전력 인프라’…","so":"매일경제","tm":"11/27 14:02","c":1,"r":"kr","u":"https://www.mk.co.kr/news/economy/12220096","p":1795755759,"a":1795762660,"su":"재계 인사를 보면 기업의 미래 전략을 읽을 수 있다. 올해 재계 인사에서는 두 가지 흐름이 두드러진다. 인공지능(AI) 시대를 맞아 전력·로봇·바이오 등 미래 먹거리를 선점하기 위한 인재 재배치, 그리고 신사업을 무대로 한 오너 3·4세의 경영 전면 등장이다. 사진 확대 반도체(전자기기 속에서 계산하고 기억하는 작은 부품) 너머 전력·로봇·바이오 미래 먹거리에 핵심 인재 전진 배치 지난해까지 AI 인재 확보 경쟁은 주로 반도체와 소프트웨어업계 중심으로 이뤄졌다."},{"s":"[특징주] 알에스오토메이션, 피지컬 AI·전력 인프라 기대감 확산에 장중 10% 넘게 올라","so":"와이드경제","tm":"11/27 13:55","c":1,"r":"kr","u":"https://www.widedaily.com/news/articleView.html?idxno=305032","p":1795755359,"a":1795785224,"su":"삼성전자의 반도체(전자기기 속에서 계산하고 기억하는 작은 부품) 생산 현장 로봇 확대 전망과 인공지능(AI) 데이터센터(컴퓨터 수만 대를 모아 둔 건물)발 전력저장장치(ESS) 수요 증가 기대감 속에 관련 테마가 동반 강세를 보이면서 알에스오토메이션이 장중 급등해 8100원 선을 돌파했다. 27일 오후 1시 2분 기준 코스닥 시장에서 알에스오토메이션은 전 거래일"},{"s":"도쿄전력은 AI 전력 인프라 확충과 글로벌 기술 대기업 유치를 위해 10조엔 이상을 투자할 계획이다.","so":"财联社","tm":"11/27 12:54","c":1,"r":"cn","u":"https://www.cls.cn/detail/2546600","p":1795751640,"a":1795780894,"t":"东京电力拟投入超10万亿日元扩建AI电力基建 招揽全球科技巨头落地","su":"① 도쿄전력은 2035회계연도까지 9년간 10조2000억엔을 투자해 전력망(발전소 전기를 집·공장까지 보내는 전깃줄 그물)과 원자력 시설을 강화하고, 데이터센터(컴퓨터 수만 대를 모아 둔 건물) 유치를 통해 전력판매 수익을 확대할 계획이다. ② 합작회사인 JERA는 10년이라는 최장 시간의 전력망 연결 대기 시간을 \"무선 전원 공급 장치\"로 완화하기 위해 발전소 인근 데이터 센터 프로젝트를 위해 앤트로픽, 메타 등과 협상을 진행하고 있습니다. 차이롄서통신, 11월 27일(편집자 Shi Zhengcheng) 최근 뉴스에 따르면 AI 시대 컴퓨팅 파워 확장이라는 '빅 케이크'에 직면한 일본 전력 대기업 도쿄전력홀딩스가 전력망과 원자력 시설 강화를 위해 10조엔 이상을 투자할 계획이다. 지분을 보유하고 있는 일본 최대 발전회사인 JERA는 앤트로픽, 메타 등 기술 대기업들과 도쿄만 발전소 바로 옆에 데이터센터를 구축하기 위해 협상을 진행 중이다."},{"s":"[장중수급포착] 두산에너빌리티, 외국인/기관 동시 순매수… 주가 +6.91%","so":"뉴스핌","tm":"11/27 11:32","c":1,"r":"kr","u":"https://www.newspim.com/news/view/20261127000778","p":1795746720,"a":1795762660,"su":"[서울=뉴스핌] 로보뉴스 = 27일 11시 30분 현재 두산에너빌리티(034020)는 외국인과 기관이 각각 6.45 만 주, 1.00 만 주 순매수(잠정) 하면서 전일 대비 6.91% (현재가 43,300원) 상승하고 있다.[표] 외국인ㆍ기관 순매매량 (단위 만주)[표"},{"s":"[인민일보 클라이언트] 흑룡강 500kV 대경 변전소 주변압기 확장 프로젝트 가동","so":"ThePaper.cn","tm":"11/27 11:20","c":1,"r":"cn","u":"https://www.thepaper.cn/newsDetail_forward_34572471","p":1795746022,"a":1795762662,"t":"【人民日报客户端】黑龙江500千伏大庆变电站主变压器扩建工程投运","su":"11월 24일, 인민일보는 \"흑룡강 500kV 대경 변전소(전기의 세기를 바꿔 나눠 보내는 곳) 주변압기 확장 프로젝트 가동\"을 게재했습니다. 원문은 다음과 같습니다. 11월 21일 헤이룽장성 500kV 대경변전소 3호 주변압기 5차 급등과 함께"},{"s":"한수원 체코 찾아 원전 완수 의지, 두산에너빌리티 한국전력기술 경영진 동행","so":"비즈니스포스트","tm":"11/27 10:25","c":1,"r":"kr","u":"https://www.businesspost.co.kr/BP?command=article_view&num=453094","p":1795742712,"a":1795749597},{"s":"AI 컴퓨팅 능력 \"샷볼 수준\"이 전력망에 도전하고 대만전력공사는 수요와 공급의 효과적인 할당을 촉진합니다.","so":"自由時報","tm":"11/27 10:00","c":1,"r":"tw","u":"https://market.ltn.com.tw/article/19095","p":1795741200,"a":1795749600,"t":"AI算力「鉛球級」電網挑戰 台電推動供需有效配置","su":"AI와 반도체(전자기기 속에서 계산하고 기억하는 작은 부품)의 발전 앞에서 안정적인 전력은 발전의 생명선이다. 그러나 AI 컴퓨팅 파워는 '높은 전력 소비'와 '높은 전력 밀도'라는 특성을 갖고 있어 지역 전력망의 잉여분을 빠르게 소모하게 된다. 대규모 상업용 사무실의 전력 수요는 약 2MW인데, 같은 공간의 AI 데이터센터(컴퓨터 수만 대를 모아 둔 건물)는 20MW~40MW에 쉽게 도달할 수 있어 지역 전력망 부하에 대한 '리드볼'과 같다."},{"s":"한전, '2026년 올해의 상생기업대상' 단체 부문 대통령표창 수상…K-전력기기 상생협력 결실","so":"데일리안","tm":"11/27 09:07","c":1,"r":"kr","u":"https://www.dailian.co.kr/news/view/1720393/%ED%95%9C%EC%A0%84-2026%EB%85%84-%EC%98%AC%ED%95%B4-%EC%83%81%EC%83%9D%EA%B8%B0%EC%97%85%EB%8C%80%EC%83%81-%EB%8B%A8-2026","p":1795738020,"a":1795749597,"su":"한국전력이 중소기업 연구개발(RD) 제품 누적 매출(물건을 판 돈 전체) 2조4000억원을 달성하고 816개 창업 기업을 육성한 공로를 인정받았다.한전은 26일 서울 코엑스 마곡 컨벤션센터에서 열린 '2026년 동반성장 주간 기념식'에서 '올해의 상생기업대상' 단체 부문 최고 훈격인 대통령표창을 수상했다고 27일 밝혔다.중소벤처기업부가 주관하는 이 행사에서는 대·중소기업 간 동"},{"s":"데이터 센터 보조금, 주민 배려로 우대 소음·배열 트러블 증가","so":"日本経済新聞","tm":"11/27 05:00","c":1,"r":"jp","u":"https://www.nikkei.com/article/DGXZQOUA1617Q0W6A111C2000000/","p":1795723200,"a":1795737910,"t":"データセンター補助金、住民配慮で優遇 騒音・排熱トラブル増加","su":"총무성은 데이터센터(DC)용 보조금(나라가 지원해 주는 돈) 채택으로 지역주민에 대한 배려를 기준에 더한다. 배열이나 소음을 둘러싸고 주민과의 마찰이 눈에 띄었다. 인공지능(AI) 시대의 인프라의 원활한 정비에 연결한다. DC 건물과 설비비의 반액을 내는 보조금을 2026~30년도 분에 209억엔 계상했다. 앞으로 사업자를 공모한다. 업계 단체의 일본 데이터 센터 협회가 5월에 책정한 '지역 공생 가이드라인'을 준수하고 있으면 우선적으로 선정한다. 동 협회"},{"s":"JERA, 앤트로픽, 메타 등과 협상 발전소 병설 데이터 센터","so":"日本経済新聞","tm":"11/27 05:00","c":1,"r":"jp","u":"https://www.nikkei.com/article/DGXZQOUC218DJ0R21C26A0000000/","p":1795723200,"a":1795733680,"t":"JERA、アンソロピックやメタなどと交渉 発電所併設データセンター","su":"JERA가 수도권에 정비하는 데이터센터(컴퓨터 수만 대를 모아 둔 건물)를 둘러싸고 미국 앤트로픽과 미국 메타 등 미국 기술 대기업 각사와 유치협상을 하고 있는 것으로 27일까지 알려졌다. 발전소 일체형으로 전력을 직접 사용할 수 있는 메리트를 살려 합의를 목표로 한다. 아마존, 마이크로소프트, 구글 등도 관심 JERA는 앤트로픽과 메타 외에 미국 아마존 닷컴, 미 마이크로소프트, 미 구글과 협상에 들어갔다. JERA의 가아유부 회장 겸 글로벌"},{"s":"엔비디아, 냉각 장치 없는 데이터센터 냉각 시스템 개발 스타트업 지원","so":"Data Center Dynamics","tm":"11/27 02:11","c":1,"r":"world","u":"https://www.datacenterdynamics.com/en/news/nvidia-backs-startup-developing-chiller-free-data-center-cooling-system/","p":1795713113,"a":1795733683,"t":"Nvidia backs startup developing chiller-free data center cooling system","su":"새로운 냉각 장치가 없는 시스템으로 데이터 센터 냉각 비용을 절감하겠다고 약속한 스타트업이 엔비디아를 포함한 후원자로부터 500,000달러를 모금했습니다. Y Combinator 비즈니스 인큐베이터 프로그램의 일부인 Madrone은 GPU(인공지능 계산에 많이 쓰는 반도체) 거대 기업은 물론 Y Combinator 자체와 투자 회사 Tekedia Capital의 지원을 받는 시드 라운드에서 현금을 조달했습니다."},{"s":"MiTAC은 장비를 확충하고 전력을 준비하며 운영에 자신감을 갖고 있다. 내년 성장에는 의심의 여지가 없습니다.","so":"經濟日報","tm":"11/27 00:54","c":1,"r":"tw","u":"https://money.udn.com/money/story/5710/9904369","p":1795708469,"a":1795733673,"t":"神達擴充設備並備妥電力 對營運充滿信心 明年成長無懸念","su":"미택(3706)과 자회사(다른 회사가 주인인 회사) 미택디지털(MiTAC Digital)이 어제(26일) 공동기자간담회를 가졌다. 시장 전망을 내다보며 MiTAC 허지우 단장은 2027년 운영에 대해 확신을 갖고 있으며, 내년 성장에 대해서는 '서스펜스'가 없다고 강조했다."},{"s":"AI 전력 수요가 가열되고 있으며 Hongyu Motor는 중요한 전자상거래 비즈니스 기회를 포착하기 위해 시장에 나와 있습니다.","so":"經濟日報","tm":"11/27 00:38","c":1,"r":"tw","u":"https://money.udn.com/money/story/11074/9904566?from=edn_newestlist_cate_side","p":1795707520,"a":1795733677,"t":"AI 用電需求升溫 宏于電機上櫃搶重電商機","su":"중전기산업에서 신입사원을 모집합니다. 홍유전기(7869)가 어제(26일) 주당 NT$201.11에 OTC 시장에 공식 상장됐다. AI 데이터센터(컴퓨터 수만 대를 모아 둔 건물), 반도체(전자기기 속에서 계산하고 기억하는 작은 부품) 공장 확장, 전력망 업그레이드라는 세 가지 주요 비즈니스 기회를 활용해 Acer의 수주 가시성은 2028년에 도달했으며 해외 시장을 적극적으로 확장하고 있습니다. '대만 R&D, 베트남 제조, 북미 상륙'이라는 운영 레이아웃을 만들기 위해 12월 미국 법인을 설립할 예정이다."},{"s":"뉴스케일 Power(SMR)는 AI 전력 수요가 SMR 매력을 높이면서 새로운 투자자의 관심을 끌고 있습니다.","so":"Yahoo Finance","tm":"11/26 23:11","c":1,"r":"us","u":"https://finance.yahoo.com/energy/articles/nuscale-power-smr-draws-fresh-141122724.html","p":1795702282,"a":1795733664,"t":"NuScale Power (SMR) Draws Fresh Investor Focus As AI Power Demand Lifts SMR Appeal","su":"뉴스케일 Power(NYSE: SMR(작게 만든 원자력 발전소))는 AI 전력 수요로 인해 첨단 원자력 옵션(정해진 값에 사거나 팔 권리)의 인지도가 높아짐에 따라 투자자들의 관심이 높아지고 있습니다. 이 회사는 원자력 규제 위원회(Nuclear Regulatory Commission)로부터 연방 인증을 받은 소형 모듈형 원자로 설계를 보유하고 있어 오클로보다 규제 우위를 제공합니다. 분석가들은 뉴스케일을 지적합니다."},{"s":"SNPS 대 VICR: AI 전력 수요로 인해 어느 주식이 이익을 얻을 수 있습니까?","so":"Yahoo Finance","tm":"11/26 22:20","c":1,"r":"us","u":"https://finance.yahoo.com/markets/stocks/articles/snps-vs-vicr-stock-stands-132000637.html","p":1795699200,"a":1795785225,"t":"SNPS vs. VICR: Which Stock Stands to Gain From AI Power Demand?","su":"Synopsys는 EDA 수요 확대, Ansys 통합 및 에이전트 AI 기회를 통해 더욱 강력한 AI 인프라 투자로서 Vicor를 앞지릅니다."},{"s":"중국 임차인이 높은 비율을 차지하며 새로운 미국 컴퓨팅 전력 규정이 조호르 컴퓨팅 전력 허브에 영향을 미침","so":"财新","tm":"11/26 21:29","c":1,"r":"cn","u":"https://companies.caixin.com/2026-11-26/102509013.html","p":1795696140,"a":1795699393,"t":"中资租户占比高 美国算力新规冲击柔佛算力枢纽","su":"[Caixin.com] 미국이 중국 기업의 해외 선진 컴퓨팅 파워 접근에 대한 제한을 더욱 강화해 최근 몇 년간 데이터센터(컴퓨터 수만 대를 모아 둔 건물) 건설이 급속도로 확대되고 있는 말레이시아에 새로운 신용위험을 안겨주고 있다. 11월 25일, S&P Global Ratings 이사이자 아시아 태평양 디지털 인프라 이사인 Gu Lifu는 기자 회견에서 말레이시아 조호르에 있는 데이터 센터가 심각한 위험에 노출되어 있다고 말했습니다. 많은 데이터 센터가 중국 기업에 의해 임대되기 때문에 일부 사업자는 새로운 고객을 찾아야 한다는 압박에 직면할 수 있습니다. 싱가포르와 인접한 말레이시아 조호르는 최근 몇 년간 동남아시아에서 데이터센터 투자가 가장 활발한 지역 중 하나로 꼽힌다. S&P 산하 데이터센터 연구 기관인 datacenterHawk의 통계에 따르면 현재 조호르에서 운영 중인 데이터센터의 전력 용량은 2,632MW에 달하며, 이 중 멀티 테넌트 데이터센터가 1,654MW, 초대형 데이터센터가 978MW를 차지한다. Cushman & Wakefield의 모니터링에 따르면 조호르(Johor) 데이터 센터의 코로케이션 공실률은 0.7%에 불과해 아시아 태평양 지역의 주요 시장 중 가장 낮은 것으로 나타났습니다. 이는 새로 생산된 용량이 거의 즉시 채워짐을 의미합니다."},{"s":"용량 확장이 Vicor가 증가하는 AI 전력 수요를 충족하는 데 도움이 될 수 있습니까?","so":"Yahoo Finance","tm":"11/26 21:13","c":1,"r":"us","u":"https://finance.yahoo.com/technology/ai/articles/capacity-expansion-help-vicor-meet-121300058.html","p":1795695180,"a":1795780892,"t":"Can Capacity Expansion help Vicor Meet Rising AI Power Demand?","su":"VICR은 급증하는 AI 전력 수요를 충족하기 위해 제조 역량을 확장하고 있으며, 상당한 장기적 성장 잠재력을 제공하는 두 개의 계획된 시설을 갖추고 있습니다."},{"s":"시코쿠 전력, 새롭게 약 25만 건의 유출 판명 플레이드에 대한 무단 액세스로","so":"日本経済新聞","tm":"11/26 19:00","c":1,"r":"jp","u":"https://www.nikkei.com/article/DGXZQOCC268L20W6A121C2000000/","p":1795687200,"a":1795699394,"t":"四国電力、新たに約25万件の流出判明 プレイドへの不正アクセスで","su":"시코쿠 전력은 지난 26일 회원제 웹서비스 ‘욘덴 컨시어지’를 이용하는 고객 정보가 새롭게 약 25만 건 외부로 유출됐다고 발표했다. 당초 약 60만건과 함께 누출은 약 85만건이 됐다. 무단 액세스를 받은 플레이드의 서비스를 이용하고 있었다. 새로운 유출"},{"s":"Datong은 미국으로부터 345kV 변압기 주문을 받고 모듈형 AIDC 케이스의 첫 주문을 받았습니다.","so":"DIGITIMES","tm":"11/26 18:37","c":1,"r":"tw","u":"https://www.digitimes.com.tw/tech/dt/n/shwnws.asp?id=776155","p":1795685820,"a":1795694337,"t":"大同拿下美國345kV變壓器訂單 模組化AIDC整案首單到手","su":"다퉁그룹은 26일 2026년 3분기 공동법무대리인 설명회를 열었다. Datong은 회의에서 전기, 컴퓨팅 능력, 토지가 성장의 세 가지 주요 축이라고 말했습니다. 이 중 전력업계는 미국 텍사스와 캘리포니아에서 345kV 대형 변압기(전기의 세기(전압)를 바꿔 주는 기계)를 수주(일감 주문을 받는 것)했으며, AI데이터센터(AIDC)가 최초로 엣지AI(Edge AI) 완제품 수주를 따냈다. 게다가 최근 화잉 사건도 합의에 이르렀는데…"},{"s":"발전소부터 케이블까지…물 만난 K전력기기","so":"한국경제","tm":"11/26 18:23","c":1,"r":"kr","u":"https://www.hankyung.com/article/2026112630811","p":1795685001,"a":1795694333,"su":"발전소부터 케이블까지…물 만난 K전력기기, 美 전력 인프라 확대 수혜 두산에너빌, 가스터빈(가스를 태워 전기를 만드는 기계) 12기 계약 가온전선, 빅테크서 5조 수주(일감 주문을 받는 것)"},{"s":"도호쿠 전력이 4년 연속 초임급 인상으로 27년도 최대 1.3만엔","so":"日本経済新聞","tm":"11/26 18:15","c":1,"r":"jp","u":"https://www.nikkei.com/article/DGXZQOCC2623I0W6A121C2000000/","p":1795684500,"a":1795699395,"t":"東北電力が4年連続の初任給引き上げへ 27年度、最大1.3万円","su":"도호쿠 전력과 송배전을 다루는 도호쿠 전력 네트워크(센다이시)는 26일 2027년도 신입사원의 초임급을 최대 1만3000엔 끌어올릴 것이라고 발표했다. 인상은 4년 연속. 물가(물건값 전체의 수준) 상승과 인재 획득 경쟁의 격화를 바탕으로 채용 경쟁력을 높인다. 고졸부터 대학원 졸업까지 학력별로 1만~1만3000엔 인상한다. 고졸은 현행보다 1만엔 높은 22만3000엔, 고전·단대졸은 1만3000엔 높은 24만7000엔, 대졸은 1만2000엔 높음"},{"s":"중부전력, 하마오카 원전 관계자를 처분 카츠노 전 회장은 보수 5할 감소 6개월","so":"日本経済新聞","tm":"11/26 16:59","c":1,"r":"jp","u":"https://www.nikkei.com/article/DGXZQOFD267RU0W6A121C2000000/","p":1795679976,"a":1795699396,"t":"中部電力、浜岡原発関係者を処分 勝野前会長は報酬5割減6カ月","su":"중부전력은 26일 하마오카 원자력발전소(시즈오카현 오마에자키시)의 데이터 부정 문제를 둘러싸고, 카츠노 테츠마에 회장 등 당시 임원 7명에게 감급처분에 해당하는 자주 반납을 요청한다고 발표했다. 재가동이 심사신청 취하로 전망할 수 없는 가운데 책임을 명확히 하고 조직 개혁을 서두른다. 이날 경제산업상에 업무개선계획을 제출했다. 하마오카 원전 3, 4호기의 재가동 심사에 관한 데이터 부정 외, 전기 요금의 과대 청구 문제와 1, 2호기의 폐로 수속에 관련된 부정이 대상. 법"},{"s":"도치기현 지사 「AI 관련 산업의 집적 목표로 한다」 데이터 센터 유치를 평가","so":"日本経済新聞","tm":"11/26 15:28","c":1,"r":"jp","u":"https://www.nikkei.com/article/DGXZQOCC261Q10W6A121C2000000/","p":1795674505,"a":1795699398,"t":"栃木県知事「AI関連産業の集積目指す」 データセンター誘致を評価","su":"도치기현의 후쿠다 토미이치 지사는 현내에서 데이터 센터 유치와 데이터 센터를 정비·운영하는 사업자의 선정이 진행되고 있는 점을 평가했다. 유치를 계기로 장래에는 현내에서 \"인공지능(AI) 관련 산업의 집적을 목표로 한다\"고 말했다. 25일 기자회견에서 발언했다. 데이터센터(컴퓨터 수만 대를 모아 둔 건물)가 새로운 산업단지 조성과 분양 등의 효과를 낳을 것이라고 말해 기대를 모았다. 앞으로 “우량기업 진출을 전망해 산업단지 조성과 영업활동에 임할 것”이라고 말했다."},{"s":"광주교통공사, AI 전력관제 교육용 시뮬레이터 자체 개발","so":"전기신문","tm":"11/26 15:01","c":1,"r":"kr","u":"https://www.electimes.com/news/articleView.html?idxno=375336","p":1795672875,"a":1795676860,"su":"광주교통공사가 실제 전력관제 시스템과 같은 화면과 조작 결과를 구현한 인공지능(AI) 기반 교육용 시뮬레이터를 개발해 관제 인력의 실습 교육에 활용한다.광주교통공사는 AI를 활용해 실제 전력관제 시스템의 화면과 조작 결과를 구현한 교육용 시뮬레이터를 자체 개발했다고 26일 밝혔다.시뮬레이터는 실제 제어망과 분리된 독립 환경에서 운영된다. 교육생은 실제 설비에 영향을 주지 않고 현장과 유사한 조건에서 전력관제 조작과 장애 대응을 연습할 수 있다. 실제 설비를 제어하는 시스템을 교육에 사용하기 어려웠던 기존의 제약을 해소한 것이다.그동"},{"s":"SOLUM과 Infineon, AI 데이터 센터용 HVDC 전력 솔루션 확장","so":"ET Datacenters","tm":"11/26 13:37","c":1,"r":"us","u":"https://datacenters.economictimes.indiatimes.com/news/ai-compute-infrastructure/solum-and-infineon-expand-hvdc-power-solutions-for-ai-data-centers/136178184?utm_source=latest_news&utm_medium=latestNews","p":1795667862,"a":1795676861,"t":"SOLUM and Infineon expand HVDC power solutions for AI data centers","su":"솔럼(SOLUM)과 인피니언 테크놀로지스(Infineon Technologies)가 AI 데이터센터(컴퓨터 수만 대를 모아 둔 건물)용 고전압 직류(HVDC) 전력 솔루션에 대한 협력을 확대할 예정이다. 확장된 작업은 중간 버스 컨버터, 배터리 백업 장치 및 전원 공급 장치에 중점을 둡니다."},{"s":"도쿄 전력, 원전 테러 대책 시설의 완성을 재차 연기 카시와자키 카리바 7호기","so":"日本経済新聞","tm":"11/26 12:35","c":1,"r":"jp","u":"https://www.nikkei.com/article/DGXZQOCC261T00W6A121C2000000/","p":1795664100,"a":1795694340,"t":"東京電力、原発テロ対策施設の完成を再度延期 柏崎刈羽7号機","su":"도쿄전력홀딩스는 26일 카시와자키 카리바 원자력발전소(니가타현) 7호기에 정비하는 테러 대책 시설에 대해 2029년 8월로 했던 완성 시기를 연기할 방침을 표명했다. 이날 기자회견한 이나가키 타케유키·발전소장은 새로운 완성 시기의 메드로서 “31년 4월을 목표로 하고 싶다”고 말했다. 연기 표명은 25년에 이어 2회째. 11월 초순에 시공사로부터 주요 구축물의 공정을 1년 이상 지연시킬 필요가 있다고 하는 보고를 받은 호"},{"s":"목표주가표 살펴보기》전자제품 비중이 높은 방어주! 발전하면 AI의 엄격한 요구를 공격할 수 있습니다. 후퇴하면 공공전력망의 핵심을 지킬 수 있다. 화성, 시뎬, ZTE... 외 6개 레벨. 법인만이 선택할 수 있습니다.","so":"旺得富理財網","tm":"11/26 12:11","c":1,"r":"tw","u":"https://wantrich.chinatimes.com/news/20261126900141-420101","p":1795662675,"a":1795663027,"t":"目標價一表看》重電躍防禦股！進可攻AI剛需 退可守公共電網保底 華城、士電、中興電...等6檔 法人只選它","su":"대만 주식시장은 날이 갈수록 오르락내리락하는 등 격앙된 모습을 보이고 있습니다. 격렬한 변동이 불안합니다. 기관투자자들은 중전기산업이 '전진, 공격, 후퇴, 방어'가 가능한 방어주라고 낙관하고 있다. 글로벌 전력망 업데이트 + AI 데이터센터(컴퓨터 수만 대를 모아 둔 건물) 등 크게 두 가지 혜택을 갖고 있다. 오늘(11/26) 화청이 상한가(하루에 오를 수 있는 가장 높은 값) 상승 선두를 차지하며 Yali가 6% 이상 상승했고, TECO와 Shiden이 4% 이상 상승, ZTE가 3% 이상 상승했다. OTC 시장에 상장된 홍유전기는 11% 이상 하락했다. 3분기에 1주 이상의 자본금을 획득했습니다. 구글, 마이크로소프트 등 CSP에도 진출했다. 법인..."},{"s":"(품질경영 No.1) HD현대일렉트릭, 클라우드 기반 ‘INTEGRICT CEMS’로 에너지·탄소감축 통합 관리 선도","so":"전기신문","tm":"11/26 12:00","c":1,"r":"kr","u":"https://www.electimes.com/news/articleView.html?idxno=375209","p":1795662000,"a":1795663024,"su":"제조업의 경쟁력을 높이기 위해서는 제품과 공정뿐 아니라 생산에 투입되는 에너지도 체계적으로 관리해야 한다. 산업 현장의 에너지관리는 단순한 계측 시스템 구축만으로 구현할 수 있는 영역이 아니다. 전력, 가스, 스팀 등 다양한 에너지원과 수많은 설비에서 발생하는 데이터를 실시간으로 수집하고, 이를 생산량·가동률·공정 정보와 연계해 의미 있는 분석 결과로 제공해야 한다.HD현대일렉트릭은 클라우드(인터넷으로 빌려 쓰는 컴퓨터) 기반 에너지관리 솔루션 ‘INTEGRICT CEMS(Cloud Energy Management System)’를 통해 산업 현장의 에너지 효율 향상을 지원하고 있다. 2020년 반월·시화 산업단지를 시작으로 전국 9개 국가산업단지, 700개 이상 기업에 솔루션을 구축하며 기술력과 현장 적용성을 입증했다. 최근에는 이러한"},{"s":"성균관대, '지능화 에너지 솔루션 국가연구소' 공식 출범… AI 전력 수요 대응 본격화","so":"팝콘뉴스","tm":"11/26 11:39","c":1,"r":"kr","u":"http://www.popcornnews.net/news/articleViewAmp.html?idxno=141658","p":1795660790,"a":1795737910,"su":"성균관대, '지능화 에너지 솔루션 국가연구소' 공식 출범… AI 전력 수요 대응 본격화 과기정통부·교육부 '국가연구소(NRL2.0)' 선정… 10년간 최대 950억 원 투입 4대 연구그룹 가동해 '마이크로그리드-디지털트윈' 플랫폼 개발 추진 (팝콘뉴스=김은교 기자) 인공지능(AI) 데이터센터(컴퓨터 수만 대를 모아 둔 건물) 확산과 첨단산업 고도화로 전력 수요가 급증하는 가운데, AI와 에너지 기술을 결합해 이를 해결할 국가 연구 거점이 본격적인 가동에 들어갔다."},{"s":"송전선의 사고로부터의 복구를 훈련 규슈 전력 자회사, 태풍에서의 정전을 상정 [사가현]","so":"朝日新聞","tm":" 지원하고 로봇 기능을 향상시키는 인공 지능의 발전에 힘입어 2027년까지 휴머노이드 로봇(사람을 닮은 로봇)에 대한 투자가 크게 증가할 것으로 예상됩니다."},{"s":"특징주, 크라우드웍스-피지컬 AI/휴머노이드 로봇 테마 상승세에 7.87% ↑","so":"매일경제 마켓","tm":"11/27 09:22","c":3,"r":"kr","u":"https://stock.mk.co.kr/news/view/1207007","p":1795738930,"a":1795749611,"su":"특징주, 크라우드웍스-피지컬 AI(몸을 갖고 실제 세상에서 움직이는 인공지능(로봇 등))/휴머노이드 로봇(사람을 닮은 로봇) 테마 상승세에 7.87% ↑ 아이넷 AI 로봇 입력 : 2026.11.27 09:22:10 27일 피지컬 AI/휴머노이드 로봇 테마가 전일 대비 3.17% 상승하면서 강세를 보이는 가운데 관련주로 주목받고 있는 크라우드웍스(355390)가 전일 대비 7.87% 상승하며 급등하고 있다. ◆피지컬 AI/휴머노이드 로봇 테마 강한 상승세 +8.71%, 기관 상승 주도 10,529.02억원 순매수 피지컬 AI/휴머노이드 로봇 테마는 최근 5일 동안 기간 수익률 8.71%에 이르는 가파른 상승세를 보이고 있다."},{"s":"Xiaopeng Technology Day는 IRON 휴머노이드 로봇에 중점을 두고 연말까지 대량 생산을 목표로 하며 2027년 상용화 확대를 목표로 하고 있습니다.","so":"DIGITIMES","tm":"11/25 21:00","c":3,"r":"tw","u":"https://www.digitimes.com.tw/tech/dt/n/shwnws.asp?id=776077","p":1795608000,"a":1795612563,"t":"小鵬科技日聚焦IRON人形機器人 年底拚量產、2027拓展商用","su":"샤오펑 그룹은 11월 25일 광저우에서 2026년 기술의 날을 개최하여 '원산지'라는 주제로 물리적 AI(물리적 AI) 기술의 진행 상황을 공유했으며, 여기서 휴머노이드 로봇(사람을 닮은 로봇) IRON이 회의의 초점이 되었습니다."},{"s":"'다항' 골드만삭스: 중국의 휴머노이드 로봇 출하량은 2035년 330만대에 달해 전 세계 로봇 출하량의 절반 이상을 차지할 것으로 예상된다.","so":"AAstocks","tm":"11/27 17:30","c":2,"r":"hk","u":"https://www.aastocks.com/tc/stocks/news/aafn-news/NOW.1557025/2","p":1795768200,"a":1795780921,"t":"《大行》高盛：中國人形機械人出貨量2035年料達330萬部 佔全球逾半","su":"골드만삭스는 휴머노이드 로봇(사람을 닮은 로봇) 산업이 기술 검증, 실험실 시연 및 비공개 데이터 수집을 거쳐 다년간의 실제 산업 및 상업 배포 단계에 진입하고 있다는 연구 보고서를 발표했습니다. 중국은 계속해서 물리적 인공지능 분야에서 세계 최대의 지역 시장이 될 것으로 예상됩니다. 휴머노이드 로봇 출하량은 초기 시험 단계에서 2030년 약 524,000개, 2035년 약 330만 개로 확대되어 전 세계 출하량 약 650만 개 중 51%를 차지하며, 이는 전 세계 도달 가능한 시장 규모 1,380억 달러에 해당합니다. 은행은 중국의 수요가 기술 검증에서 실질적인 생산성으로 전환되고 있다고 지적했다. 2025년부터 2035년까지 국내 수요에서 연구, 교육 및 인공지능 데이터 팩토리 애플리케이션의 비율은 약 42%에서 약 5%로 줄어들 것으로 예상됩니다. 산업 운영 및 상업용/소비자 애플리케이션은 약 240만 개로 확장되어 2035년 중국 전체 수요의 약 95%를 차지할 것으로 예상됩니다. 산업용으로는 약 100만 개, 상업용/소비자 애플리케이션은 각각 약 140만 개에 이를 것으로 예상됩니다. 2035년 중국의 약 330만 개 출하량 중 77%는 국내 수요에 맞춰지고 23%는 순수출에 사용될 것으로 예상됩니다."},{"s":"샤오펑 : 내년 1월 휴머노이드 로봇 양산 1 "tw","u":"https://news.cnyes.com/news/id/6673835","p":1795781411,"a":1795853300,"t":"馬斯克預言：Optimus機器人18個月內包辦家務 人人會想買一至兩台","su":"머스크는 옵티머스(테슬라가 만드는 사람 닮은 로봇) 로봇이 18개월 이내에 집안일을 처리할 것이며 모두가 한두 개 사고 싶어할 것이라고 예측합니다. 거형망(Anue) 뉴스센터 테슬라(TSLA-US) CEO인 Elon 머스크는 자사의 옵티머스 휴머노이드 로봇(사람을 닮은 로봇)이 약 1~1년 반(12~18개월) 안에 설거지, 쓰레기 버리기 등 일상적인 집안일을 처리할 수 있을 것으로 예상했습니다. 머스크는 로봇이 이러한 가사 기술을 성공적으로 익히면 \"거의 모든 사람이 하나 또는 두 개를 원할 것\"이라고 말하면서 더욱 낙관적입니다. 이런 전망은 머스크가 11월 18일 투모로우엑스 서밋에 참석했을 때 내놓은 것이다. 당시 아트레이드 매니지먼트의 개빈 베이커 최고투자책임자(CIO)는 회의 중 질문을 제기하며 평소 쓰레기 버리는 것이나 설거지를 싫어한다고 인정했다. 베이커의 가사 고충에 대해 머스크는 옵티머스 로봇이 베이커가 설명한 가사 처리 능력을 12~18개월 안에 달성할 수 있을 것이라고 지적하며 화답했다."},{"s":"먼저 결과를 추론한 후 실행: Huilun AWAM-1.8B는 로봇에 \"안전 벨트\"를 추가합니다.","so":"Jiemian.com","tm":"11/27 18:35","c":1,"r":"cn","u":"https://www.jiemian.com/article/15383884.html","p":1795772146,"a":1795780915,"t":"先推演后果再执行：慧仑 AWAM-1.8B 给机器人加了一道“安全带”","su":"로봇이 실제 현장에 진입하는 경우 작업을 완료하는 것은 첫 번째 단계일 뿐입니다. 안전하고 안정적으로 완료할 수 있는지 여부도 마찬가지로 중요합니다. 11월 27일, GAC가 인큐베이팅한 휴머노이드 로봇(사람을 닮은 로봇) 회사인 Huilun Technology가 광저우 모터쇼에서 기자회견을 열었습니다. 창업자이자 회장 겸 CEO(회사의 가장 높은 책임자)인 Zhang Aimin은 3층 설계에 안전성을 통합한 AWAM-1.8B를 출시했습니다. 알고리즘의 첫 번째 수준: 실행 전 추론. 모델은 여러 가지 가능한 미래 상태를 생성합니다. 이 작업이 계속되면 객체는 어디로 갈지, 어떤 것과 마주칠지, 주변에 사람이 있을지 등을 알 수 있습니다. 가치평가 브랜치는 각 미래에 점수를 매기고, 기준에 맞지 않는 행동은 바로 포기합니다. 장아이민은 \"세계 모델은 결과를 상상하는 역할을 하고, 행동 전문가는 행동 선택을 담당한다\"고 설명했다. '불집행'이 처음으로 법적 출력이 되었습니다. 안전은 단순히 실수하지 않는 것뿐만 아니라, 움직이거나 멈추지 않고 불확실할 때 다른 사람이 살펴보기를 기다리는 것이기도 합니다."},{"s":"중국 하이테크 박람회에서 Jukun Robot의 손재주를 위한 풀스택 솔루션의 속도를 높이기 위해 임바디드 AI가 구현되었습니다.","so":"Jiemian.com","tm":"11/27 17:29","c":1,"r":"cn","u":"https://www.jiemian.com/article/15383635.html","p":1795768179,"a":1795780916,"t":"具身智能落地提速 炬坤机器人携灵巧手全栈方案亮相高交会","su":"제28회 중국국제첨단기술박람회(하이테크박람회)가 최근 선전에서 막을 내렸다. 이번 전시회에는 5,000개 이상의 기술 기업이 모여 인공 지능, 임바디드 AI(로봇처럼 몸을 가진 인공지능), 고급 장비 제조 및 기타 분야의 최첨단 성과를 선보입니다. 그중에서도 인간형 로봇과 산업 자동화의 핵심 실행 끝인 손재주는 산업 체인에서 가장 주목받는 트랙 중 하나가 되었습니다. 이번 전시회에서 절강대학교 Grasp Lab에서 탄생한 Hangzhou Jukun Robot는 처음으로 다양한 손재주 제품을 전시했습니다. 자체 개발한 공간 분리 메커니즘, 압저항 촉각 센싱, 코깅리스 모터 등 3가지 핵심 기술을 공개했다. 현장의 다양한 산업 고객과 심층적인 도킹을 완료했습니다. 절강대학교 기술의 산업화 성과는 업계에서 높은 평가를 받고 있습니다."},{"s":"[이주의 ETF] 신한자산운용 'SOL 우주항공밸류체인' 32%대 올라 상승률 1위, 휴머노이드 테마도 강세","so":"비즈니스포스트","tm":"11/27 17:05","c":1,"r":"kr","u":"https://www.businesspost.co.kr/BP?command=article_view&num=453169","p":1795766720,"a":1795780912},{"s":"한국 제조업 ‘로봇 밀도’ 세계 1위…세계 평균 7배 [데이터로 보는 세상]","so":"매일경제","tm":"11/27 16:45","c":1,"r":"kr","u":"https://www.mk.co.kr/news/economy/12220293","p":1795765543,"a":1795780912,"su":"한국이 제조업 자동화 수준을 보여주는 ‘로봇 밀도’에서 세계 1위를 기록했다. 국제로봇연맹(IFR)의 최근 발표 자료에 따르면, 2025년 기준 한국의 로봇 밀도는 제조업 근로자 1만명당 1066대로 집계됐다. 세계 평균(152대)의 7배다. 로봇 밀도는 제조업 근로자 1만명당 실제 가동 중인 산업용 로봇 대수를 뜻한다. 싱가포르가 873대로 2위, 독일이 469대로 3위를 차지했다. 일본(452대)과 스웨덴(392대)이 뒤를 이었다."},{"s":"휴머노이드 로봇 분야는 계속 상승하고 있으며 유니트리는 하루 가격제한폭 20%에 도달했습니다.","so":"Jiemian.com","tm":"11/27 16:27","c":1,"r":"cn","u":"https://www.jiemian.com/article/15383219.html","p":1795764446,"a":1795780919,"t":"人形机器人板块持续走高，宇树科技触及20cm涨停"},{"s":"모건스탠리는 중국의 휴머노이드 로봇 산업 체인 목록을 발표했습니다. Horizon, 텐센트, 알리바바, 유니트리 및 기타 기업이 선정되었습니다.","so":"AAstocks","tm":"11/27 16:11","c":1,"r":"hk","u":"https://www.aastocks.com/tc/usq/quote/stock-news-content.aspx?symbol=BABA&id=GLH2782855L&source=GLH","p":1795763460,"a":1795780922,"t":"大摩發佈中國人形機器人產業鏈名單，地平線、騰訊、阿里、宇樹科技等企業入選","su":"11월 27일 | 세계적인 투자은행 모건스탠리는 휴머노이드 로봇(사람을 닮은 로봇) 산업 최신 연구보고서 'Progress on Brains; Update..."},{"s":"서던 펀드의 로봇 ETF Southern(159258)의 기초 지수가 7% 이상 상승하는 등 로봇 부문은 오후에 상승했습니다.","so":"Jiemian.com","tm":"11/27 15:49","c":1,"r":"cn","u":"https://m.jiemian.com/article/15382797.html","p":1795762153,"a":1795838647,"t":"机器人板块午后拉升，南方基金旗下机器人ETF南方(159258)标的指数涨超7%","su":"로봇 부문은 많은 재고가 제한되면서 오후에 상승했습니다. 13시 44분 현재 로봇 ETF(여러 주식을 묶어 파는 상품) South(159258)는 장중 거래량(하루 동안 사고판 주식 수)이 3,748억 1900만 위안으로 3.17% 상승했다. 트래킹지수 CSI 로봇지수(H30590)는 한때 7.98% 넘게 올랐고, 현재는 7.89% 상승 중이다."},{"s":"현대차 보스턴다이나믹스 휴머노이드 테슬라와 양강 구도, 일본·중국 신중론에 생산성 입증 과제","so":"비즈니스포스트","tm":"11/27 15:45","c":1,"r":"kr","u": 출시","so":"etnet 經濟通","tm":"11/27 11:31","c":1,"r":"hk","u":"https://www.etnet.com.hk/www/tc/news/news-article.php?section=categorized&category=latest&newsid=20261121134","p":1795746660,"a":1795749613,"t":"《券商精點》中信里昂：小鵬推新一代人形機械人IRON，授予「優於大市」評級，目標價45港元","su":"2026년 11월 27일 10:31 \"브로커 포커스\" CITIC CLSA: 샤오펑은 차세대 휴머노이드 로봇(사람을 닮은 로봇) IRON을 출시하여 \"우수\" 등급과 목표주가(전문가가 예상한 앞날의 주가) HK$45를 할당했습니다. CITIC CLSA는 샤오펑 Group(9868)이 차세대 휴머노이드 로봇 IRON을 출시했다는 연구 보고서를 발표했습니다. 이 로봇은 2027년 1월에 대량 생산을 시작할 예정이며 2분기에 상업 출시 및 외부 고객에게 배송을 시작할 예정입니다. 보고서는 현재 선보이고 있는 기능들은 소통과 사회적 상호작용에 초점을 맞추고 있지만, 2027년 초 양산이 시작되면 객체 조작, 장기 작업 실행 등 보다 실용적인 역량이 더욱 시연될 것으로 예상된다고 지적했다. 은행은 샤오펑에 \"우수\" 등급을 부여하고 목표주가를 HK$45로 지정했습니다."},{"s":"로봇 쇼핑몰 사업으로 누가 돈을 벌고 있나요?","so":"Jiemian.com","tm":"11/27 11:30","c":1,"r":"cn","u":"https://www.jiemian.com/article/15378205.html","p":1795746620,"a":1795749612,"t":"机器人的商场生意，到底谁在挣钱？","su":"3C부터 신에너지 자동차까지, 로봇 매장이 이제 쇼핑몰에 입점하기 시작했습니다. 그러나 개인 구매 수요가 제한되어 있어 제3자 딜러들은 여전히 임대 및 기업 프로젝트를 통해 수입을 찾고 있습니다."},{"s":"코스닥 장중 5% '불기둥'에 매수사이드카…로봇·방산주 강세","so":"SBS Biz","tm":"11/27 11:30","c":1,"r":"kr","u":"https://biz.sbs.co.kr/amp/article/20000349323","p":1795746600,"a":1795762675,"su":"코스닥 장중 5% '불기둥'에 매수사이드카(주가가 크게 움직일 때 프로그램 매매를 잠시 멈추는 장치)…로봇·방산주 강세 SBS Biz 김종윤 입력2026.11.27 11:30 수정2026.11.27 11:37 [앵커] 뉴욕증시가 추수감사절로 휴장한 가운데 다음 주 월요일 예정된 증시안정회의에서 증안펀드 투입 기대감에 국내증시는 일제히 상승 중입니다. 코스피는 외국인과 기관 순매수(산 돈이 판 돈보다 많은 것)에 장중 4800선을 넘었고, 코스닥도 5% 이상 급등하면서 매수사이드카가 발동했습니다."},{"s":"카와사키 중공과 베코프, 차세대 로봇 컨트롤러에 의한 유연하고 확장성이 높은 시스템의 실현을 향한 협업에 합의","so":"日本経済新聞","tm":"11/27 11:18","c":1,"r":"jp","u":"https://www.nikkei.com/article/DGXZRSP715834_X21C26A1000000/","p":1795745931,"a":1795749616,"t":"川崎重工とベッコフ、次世代ロボットコントローラによる柔軟で拡張性の高いシステムの実現に向けた協業に合意","su":"【보도 자료】 발표일 : 2026년 11월 27일 차세대 로봇 컨트롤러에 의한 유연하고 확장 성이 높은 시스템 실현을 향한 협업에 합의 - EtherCAT · TwinCAT를 활용하여 산업용 로봇 제어 기술의 오픈화를 추진 - 가와사키 중공과 Beckhoff Automation GmbH & Co. KG(이하 '베코프')는 독일 뉘른베르크에서 개최된 국제 산업 자동화"},{"s":"\"휴머노이드 로봇 성큼…'블루칼라 피난처' 사라지고 무역질서 바뀐다\"","so 옆에서 함께 일하는 로봇) 등) 업종은 5.28% 오르고 있다."},{"s":"\"두산로보틱스, 美자동화 사업 앞세워 내년 매출 1000억 돌파\" iM證","so":"파이낸셜뉴스","tm":"11/27 08:48","c":1,"r":"kr","u":"https://www.fnnews.com/news/202611270839576435","p":1795736913,"a":1795737920,"su":"두산로보틱스가 북미 자동화 솔루션 사업 확대에 힘입어 내년 매출(물건을 판 돈 전체) 1000억원을 넘어설 것이라는 전망이 나왔다. 같은 분기 협동로봇(사람 옆에서 함께 일하는 로봇) 매출은 45억원으로 29.8% 줄었다."},{"s":"화태증권: 구체화된 데이터 표준이 가속화되고 있으며 옵티머스 및 T-chain의 데뷔에 주목","so":"Jiemian.com","tm":"11/27 08:37","c":1,"r":"cn","u":"https://m.jiemian.com/article/15379478.html","p":1795736227,"a":1795737920,"t":"华泰证券：具身数据标准提速，关注Optimus亮相与T链","su":"화타이증권 연구 보고서에 따르면 지난 주 CSI 로봇 및 CSI 스마트 자동차 지수는 각각 10.69% 및 10.11% 하락하여 상하이 및 선전 300(-1.54%)보다 실적이 저조했으며 주로 글로벌 AI 자산 조정으로 인해 하락했습니다. 로봇 분야에서는 산업정보기술부가 휴머노이드 로봇(사람을 닮은 로봇) 산업 표준 5개와 체화 데이터 국가 표준을 발표하고 개발에 착수했다. 주요 AI 제조사들은 로봇을 직접 제어하기 위해 일반 대형 모델을 활용하기 시작했다. 옵티머스(테슬라가 만드는 사람 닮은 로봇)는 12월 초 공개될 예정이다. 스마트 운전 측면에서 WeRide와 Pony.com Robotaxi의 매출은 3분기에 크게 증가했지만 손실과 단일 차량 수는 아직 개선되지 않았습니다. 테슬라는 FSD v15를 추진하기 시작했고, 회사는 핵심 개입 비율이 25배 향상되었다고 밝혔습니다. 함대가 가벼운 자산 확장으로 전환할 수 있는지 여부는 12월 v15의 포괄적인 추진과 소유자의 파일럿 차량 액세스에 달려 있습니다."},{"s":"두산로보틱스, 내년 영업손실 303억 전망...적자 축소","so":"파이낸셜뉴스","tm":"11/27 08:23","c":1,"r":"kr","u":"https://www.fnnews.com/news/202611270820227849","p":1795735381,"a":1795737920,"su":"iM증권은 27일 두산로보틱스에 대해 내년 매출(물건을 판 돈 전체)액 1045억원, 영업손실 303억원을 전망했다. 이상수 iM증권 연구원은 \"자동화 솔루션 매출액 584억원, 협동로봇(사람 옆에서 함께 일하는 로봇) 매출액 376억원을 가정했다."},{"s":"유진證 \"2040년 휴머노이드 787만대 시대…현장 성과 입증 기업·병목 부품사 주목\"","so":"이투데이","tm":"11/27 08:23","c":1,"r":"kr","u":"https://www.etoday.co.kr/news/view/2653720","p":1795735380,"a":1795737920,"su":"▲휴머노이드 시장 전망. (출처=유진투자증권)전 세계 휴머노이드 로봇(사람을 닮은 로봇) 설치 대수가 2030년 13만대에서 2040년 787만대로 급증할 것이라는 전망이 나왔"},{"s":"스웨덴 볼보자동차, 벨기에 공장에 휴머노이드 로봇 투입","so":"로봇신문","tm":"11/27 06:43","c":1,"r":"kr","u":"https://www.irobotnews.com/news/articleView.html?idxno=49833","p":1795729422,"a":1795733692,"su":"스웨덴 자동차 제조업체 볼보자동차는 헥사곤 로보틱스(Hexagon Robotics)의 휴머노이드 로봇(사람을 닮은 로봇) '이온(AEON)'을 벨기에 겐트(Ghent) 공장에 배치했"},{"s":"휴머노이드 열풍에 냉정한 토요타 본거지… “화려한 묘기보다 신뢰성이 우선”","so":"글로벌이코노믹","tm":"11/27 05:45","c":1,"r":"kr","u":"https://www.g-enews.com/article/Global-Biz/2026/11/2026112618345395420c8c1c064d_1","p":1795725900,"a":1795733692,"su":"토요타 본거지 아이치현 '팩토리 이노베이션 위크 2026' 개막… 쿵푸·백플립 시연에도 현장 반응은 냉정 유니트리 유통사 \"시각 인식 한계로 무작위 부품 집기 어려워… 대학·기업 연구용 주문이 대부분\" 토요타, 2028~2040년 로봇 40만 대 배치 추진… 휴머노이드(사람을 닮은 로봇) 대신 용접 코봇·바퀴형 양팔 로봇 등 검증된 실용 자동화 집중 전 세계 테크 업계가 '물리적 인공지능(Physical AI)'과 휴머노이드(인간형) 로봇 상용화(실제로 팔고 쓰이기 시작하는 것) 경쟁에 열을 올리고 있으나, 정작 세계 최대 완성차 기업 토요타자동차의 심장부인 일본 아이치현 제조현장에서는 이족보행 휴머노이드에 대해 냉정한 신중론이 지배하고 있다."},{"s":"피지컬 AI 시대의 로봇 산업 로보넥스트 2026(9) 화낙 상무 집행 임원","so":"日刊工業新聞","tm":"11/27 05:00","c":1,"r":"jp","u":"https://www.nikkan.co.jp/articles/view/798257","p":1795723200,"a":1795733702,"t":"フィジカルAI時代のロボット産業 ロボネクスト2026（9）ファナック常務執行役員 ロボット研究開発統括本部長・安部健一郎氏"},{"s":"휴머노이드 로봇이 \"해체\"되었습니다! 하이테크 박람회의 Baoan 부스에서는 전체 산업 체인을 선보입니다.","so":"21财经","tm":"11/27 00:33","c":1,"r":"cn","u":"https://www.21jingji.com/article/20261126/herald/86de3d22f2fb1db508be44ce936426dd.html","p":1795707180,"a":1795733695,"t":"人形机器人被“拆”了！高交会宝安展台， 亮出整条产业链","su":"하이테크 박람회에서 휴머노이드 로봇(사람을 닮은 로봇)을 볼 때 모든 사람들은 손을 흔들고, 걷고, 물을 주고, 공중제비를 돌리고, 춤을 추고, \"실제\"이고 기능적인 진화를 칭찬하는 등 로봇의 움직임을 따라가는 데 익숙합니다. 올해 선전 바오안(Shenzhen Baoan)은 얼마나 똑똑한지 보여주는 대신 전시 방식을 바꿔 휴머노이드 로봇을 분해하고 관객이 로봇의 '내부 장기'를 직접 볼 수 있도록 했다. 11월 26일, 제28회 중국국제첨단기술박람회가 선전국제전시센터에서 개막했다. 15번 홀에 있는 340제곱미터 규모의 Baoan 이미지 전시 공간은 \"Baozhi Chain New Embodied Competition\"이라는 주제로 42개 회사가 모입니다. 중앙에는 해체된 휴머노이드 로봇이 있습니다. 평소 동체 안에 촘촘하게 숨겨져 있던 것들이 이제 전시대 위에 하나씩 펼쳐집니다. 각 작품 뒤에는 Baoan의 해당 지능형 제조 회사를 거의 찾을 수 있습니다."},{"s":"선전 난산(Nanshan)의 42개 기술 기업이 하이테크 박람회에 등장해 로봇 공학과 양자 기술을 전시했습니다.","so":"Jiemian.com","tm":"11/27 00:02","c":1,"r":"cn","u":"https://www.jiemian.com/article/15379221.html","p":1795705323,"a":1795733699,"t":"深圳南山42家科技企业亮相高交会，机器人、量子科技集中展示","su":"11월 26일, 제28회 중국국제첨단기술박람회가 선전에서 개막했습니다. 휴머노이드 로봇(사람을 닮은 로봇), 반도체 칩, 생명과 건강, 첨단 기술, 지능형 하드웨어, 신에너지 등 6개 주요 방향을 다루는 선전 난산(Nanshan)의 42개 기술 기업이 함께 등장했다. 이 가운데 Zhongqing Robotics, Zhisquare, Lesen Robotics 등의 기업은 로봇 산업에서의 성과를 시연했으며, Weiling Medical, Bose Quantum, Lingnan Quantum 등의 기업은 뇌-컴퓨터 인터페이스, 양자 컴퓨팅 등 첨단 기술을 선보였습니다. Nanshan은 이번에도 혁신 인큐베이션 결과를 보여주는 데 중점을 두었습니다. Moliying AI 생태 커뮤니티에서 인큐베이션한 Yuanshi Intelligence, Huilu Intelligence 및 Handy Technology와 Shenzhen Science and Technology Innovation Institute에서 인큐베이션한 Shibu Technology, Jiangxin Era 및 기타 스타트업이 같은 장소에 등장하여 AI 대형 모델, 임바디드 AI(로봇처럼 몸을 가진 인공지능)형 데이터, 뇌-컴퓨터 인터페이스, 지능형 하드웨어 및 기타 분야를 포함하여 스타트업 인큐베이션부터 산업 구현에 이르기까지 Nanshan의 과학 기술 혁신 생태를 보여주었습니다."},{"s":"Xiaopeng의 휴머노이드 로봇은 수동 원격 제어가 필요하지 않으며 실시간으로 사람들을 독립적으로 관찰하고 상호 작용할 수 있습니다.","so":"TVB","tm":"11/26 20:39","c":1,"r":"hk","u":"https://news.tvb.com/sc/1208632-%E5%B0%8F%E9%B5%AC%E4%BA%BA%E5%BD%A2%E6%A9%9F%E6%A2%B0%E4%BA%BA%E5%85%A8%E7%A8%8B%E4%B8%8D%E7%94%A8%E4%BA%BA%E5%B7%A5%E9%81%99%E6%8E%A7%E5%8F%AF%E8%87%AA%E4%B8%BB%E8%A7%80%E5%AF%9F%E8%88%87%E4%BA%BA%E5%AF%A6%E6%99%82%E4%BA%92%E5%8B%95","p":1795693140,"a":1795699409,"t":"小鵬人形機械人全程不用人工遙控 可自主觀察、與人實時互動","su":"Xiaopeng Group은 수동 원격 제어가 필요하지 않고 실시간으로 사람들을 독립적으로 관찰하고 생각하고 상호 작용할 수 있는 차세대 휴머노이드 로봇(사람을 닮은 로봇)을 출시했습니다. 마이크를 들고 무대에 올라 자신을 소개하세요. 샤오펑 Robot IRON은 \"안녕하세요 여러분. 저는 샤오펑 Robot IRON입니다. 왼쪽에 있는 친구들이 안녕하세요. 전 세계의 친구들을 환영합니다.\"라고 말했습니다. 관객들과도 유머러스하게 소통할 예정이다. 아이언은 “2000명이 넘는 무대에 서는 건 처음이다. 확실히 조금 떨리긴 하지만 꼭 보셔야 할…"},{"s":"휴머노이드 로봇이 생각보다 빨리 온다","so":"The Economist","tm":"11/26 19:48","c":1,"r":"world","u":"https://www.economist.com/briefing/2026/11/26/humanoid-robots-are-coming-sooner-than-you-think","p":1795690118,"a":1795733709,"t":"Humanoid robots are coming—sooner than you think"},{"s":"중롄중커, bauma CHINA 2026에서 엠보디드 인텔리전스를 탑재한 업계 최초의 AI 드릴링 로봇 발표","so":"時事ドットコム","tm":"11/26 19:46","c":1,"r":"jp","u":"https://www.jiji.com/jc/article?k=v1AsYCRq&g=prn","p":1795689960,"a":1795694363,"t":"Zoomlion、bauma CHINA 2026にて、エンボディド・インテリジェンスを搭載した業界初のAI掘削ロボットを発表","su":"상하이, 2026년 11월 26일/PRNewswire/--ZoomlionHeavyIndustryScience&TechnologyCo.,Ltd.(\"중롄중커\" 또는 \"당사\ <script>
var D = JSON.parse(document.getElementById('data').textContent);
var RL = {}; D.regions.forEach(function(r){ RL[r.k] = r.l; });
function $(id){ return document.getElementById(id); }
function esc(t){ return String(t==null?'':t).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
// 휴대폰에 기억해 두는 값 (마지막 탭, 탭별로 마지막에 본 시각, 정렬, 국가)
function load(k, d){ try { var v = localStorage.getItem('nb_'+k); return v===null ? d : JSON.parse(v); } catch(e){ return d; } }
function save(k, v){ try { localStorage.setItem('nb_'+k, JSON.stringify(v)); } catch(e){} }
var S = { tab: (D.themes[0] && D.themes[0].stats && D.themes.length > 1) ? 1 : 0, seen: load('seen', null), sort: load('sort', 'c'), region: load('region', 'all'), shown: D.show, prev: {} };
function newest(t){ var m = 0; t.items.forEach(function(n){ if(n.a > m) m = n.a; }); return m; }
if(S.seen === null){ S.seen = {}; D.themes.forEach(function(t){ S.seen[t.name] = newest(t); }); save('seen', S.seen); }  // 처음 방문: 레드닷 없이 시작
(function(){ var nm = load('tabname', ''); D.themes.forEach(function(t, i){ if(t.name === nm) S.tab = i; }); })();  // 마지막에 본 탭 (이름으로 기억)
if(location.hash && /^#t\d+$/.test(location.hash)) S.tab = +location.hash.slice(2);
if(location.hash === '#stats') D.themes.forEach(function(t, i){ if(t.stats) S.tab = i; });
if(S.tab >= D.themes.length) S.tab = D.themes.length > 1 ? 1 : 0;
// 통계 탭은 나라 선택을 따로 기억 (기본 = 미국 · 2026-11-24 사용자 요청: 미국 위주로) — 뉴스 탭의 나라 선택과 섞이지 않게
function regKey(){ return (D.themes[S.tab] && D.themes[S.tab].stats) ? 'sregion' : 'region'; }
function regLoad(){ S.region = load(regKey(), regKey()==='sregion' ? 'us' : 'all'); }
regLoad();

function visible(t){
  return t.items.filter(function(n){ return S.region==='all' || n.r===S.region; });
}
function sorted(list, breaking){
  var k = breaking ? 'p' : S.sort;
  return list.slice().sort(function(x,y){
    var c = y.c - x.c, p = y.p - x.p; return k==='c' ? (c||p) : (p||c);
  });
}
function renderTabs(){
  $('tabs').innerHTML = D.themes.map(function(t, i){
    var sn = S.seen[t.name] || 0;           // 지금 고른 나라에서 보이는 기사 중 새 기사가 있을 때만 (0개인데 레드닷 뜨던 문제)
    var dot = i !== S.tab && !t.stats && visible(t).some(function(n){ return n.a > sn; });
    return '<button class="tab'+(i===S.tab?' on':'')+'" onclick="openTab('+i+')">'+esc(t.name)+
           (t.stats ? '' : '<b>'+visible(t).length+'</b>')+(dot?'<span class="dot" title="새 뉴스"></span>':'')+'</button>';
  }).join('');
  var on = $('tabs').children[S.tab]; if(on && on.scrollIntoView) on.scrollIntoView({block:'nearest', inline:'center'});
}
function renderCtrl(){
  var br = D.themes[S.tab].breaking || D.themes[S.tab].stats;
  var h = '';
  if(!br){
    h += '<button class="'+(S.sort==='c'?'on':'')+'" onclick="setSort(\'c\')">🔥 화제순</button>';
    h += '<button class="'+(S.sort==='p'?'on':'')+'" onclick="setSort(\'p\')">🕒 최신순</button><span class="sep"></span>';
  }
  h += '<button class="'+(S.region==='all'?'on':'')+'" onclick="setRegion(\'all\')">전체</button>';
  D.regions.forEach(function(r){
    h += '<button class="'+(S.region===r.k?'on':'')+'" onclick="setRegion(\''+r.k+'\')">'+esc(r.l)+'</button>';
  });
  $('ctrl').innerHTML = h;
}
function card(n, prev){
  var hot = n.c > 1 ? '<span class="hot'+(n.c>=5?' big':'')+'">🔥 언론 '+n.c+'곳</span>' : '';
  var isNew = prev && n.a > prev ? ' <span class="new">NEW</span>' : '';
  return '<a class="card" href="'+esc(n.u)+'" target="_blank" rel="noopener" data-s="'+esc(n.su||'')+'" data-so="'+esc(n.so)+'">'+
    '<div class="meta">'+hot+esc(RL[n.r]||'')+' · '+esc(n.so)+' · '+esc(n.tm)+isNew+'</div>'+
    '<div class="title">'+esc(n.s)+'</div>'+(n.t?'<div class="orig">'+esc(n.t)+'</div>':'')+'</a>';
}
function renderMain(){
  if(D.themes[S.tab].stats){ renderStats(D.themes[S.tab]); return; }
  var t = D.themes[S.tab], list = sorted(visible(t), t.breaking), prev = S.prev[t.name] || 0;
  var h = '<h2>'+esc(t.name)+'</h2>' + (t.note ? '<p class="note">'+esc(t.note)+'</p>' : '');
  var fresh = prev ? list.filter(function(n){ return n.a > prev; }).length : 0;
  if(S.onlyNew){                                // '새 기사만 보기' 중

    for(var t in HI.s){ for(var k in HI.s[t]){ if(HI.s[t][k][i] != null){ ok = true; break; } } if(ok) break; }
    HI.av.push(ok); }
  var y = +HI.since.slice(0,4), m = +HI.since.slice(5,7), ey = +HI.end.slice(0,4), em = +HI.end.slice(5,7);
  while(y < ey || (y === ey && m <= em)){
    var a = dIdx(y+'-'+('0'+m).slice(-2)+'-01'), ny = m===12 ? y+1 : y, nm = m===12 ? 1 : m+1;
    var b = Math.min(HI.n, dIdx(ny+'-'+('0'+nm).slice(-2)+'-01'));

// ✦ 버튼: Gemini 요청 문장을 복사하고 원문을 엶 → 원문 화면에서 Gemini 를 불러 붙여넣기
function askAI(a){
  var q = a.dataset.q || '';
  try { if(navigator.clipboard) navigator.clipboard.writeText(q); } catch(e){}
  toast('요청 문장을 복사했어요 · 원문에서 측면 버튼 길게 → 「이 페이지에 관해 질문하기」 → 붙여넣기');
  setTimeout(closeSheet, 50);
}
function toast(msg){ var t = $('toast'); t.textContent = msg; t.hidden = false; clearTimeout(toast._t); toast._t = setTimeout(function(){ t.hidden = true; }, 4000); }
function closeSheet(){ $('dim').hidden = true; $('sheet').hidden = true; document.body.style.overflow = ''; }
document.addEventListener('keydown', function(e){ if(e.key==='Escape') closeSheet(); });
