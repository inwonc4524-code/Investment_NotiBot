 개입에 대한 강한 반대, 의료 안보와 풀뿌리 사회복지 수호, 젊은 세대와 소수민족의 변화 요구 등 현 정부의 정책에 대해 강력한 항의와 불만을 투표를 통해 표현했다. AI 데이터센터(컴퓨터 수만 대를 모아 둔 건물)로 인해 전력 수요가 급증하고, 주민들은 시설 확충에 따른 전이효과를 우려하고 있다. 경제와 민생은 유권자들이 가장 우려하는 페인포인트다. 건담..."}]},{"name":"🤖 로봇","note":"","breaking":false,"items":[{"s":"LG전자, 한국로봇산업진흥원과 휴머노이드 안전·품질 경쟁력 강화 나서","so":"비즈니스포스트","tm":"11/16 10:13","c":20,"r":"kr","u":"https://www.businesspost.co.kr/BP?command=article_view&num=452036","p":1794791611,"a":1794792488},{"s":"Youzhishi︱디지털 휴머노이드 로봇 'Youzhobao'가 춤을 추며 쿵푸를 선보이고, 친구들은 기쁨과 칭찬으로 춤을 춥니다.","so":"星島頭條","tm":"11/16 20:04","c":3,"r":"hk","u":"https://www.stheadline.com/society/3637773/%E5%8F%8B%E6%99%BA%E8%AD%98%E6%95%B8%E5%AD%97%E8%BE%A6%E4%BA%BA%E5%BD%A2%E6%A9%9F%E6%A2%B0%E4%BA%BA%E5%8F%8B%E6%99%BA%E5%AF%B6%E8%B7%B3%E8%88%9E%E6%89%93%E5%8A%9F%E5%A4%AB-%E8%80%81%E5%8F%8B%E8%A8%98%E7%9C%89%E9%A3%9B%E8%89%B2%E8%88%9E%E8%AE%9A%E5%8F%BB","p":1794827048,"a":1794830486,"t":"友智識︱數字辦人形機械人「友智寶」跳舞打功夫 老友記眉飛色舞讚叻","su":"디지털오피스는 오늘(16일) '친절한 지식' 커뮤니티 디지털 포용 프로그램 2차와 '로봇을 커뮤니티 속으로' 시범 프로그램 론칭식을 가졌다. Sun Dong 혁신기술산업국 국장은 더 많은 사람들에게 혜택을 제공하기 위해 서비스 규모가 확대될 것이라고 말했습니다. 디지털 오피스와 사회혁신기금은 2024년에 2년간의 '친절한 지식' 디지털 포용 프로그램을 시작하여 노인과 기타 도움이 필요한 사람들이 디지털 기술을 습득할 수 있도록 지원합니다. 여기에는 스마트폰 및 디지털 서비스 사용을 돕기 위한 지원 지점 설정, 디지털 서비스 및 기술 과정 설정, 온라인 기술 학습 플랫폼 설정 등이 포함됩니다. 우정 지식 프로젝트 기술 및 산업 혁신을 통해 커뮤니티 디지털 지원 포인트가 두 배로 증가했습니다."},{"s":"국가통계국: 10월 중국 산업용 로봇 생산량 전년 동기 대비 26% 증가","so":"Jiemian.com","tm":"11/16 11:19","c":3,"r":"cn","u":"https://www.jiemian.com/article/15335460.html","p":1794795591,"a":1794797241,"t":"国家统计局：10月份我国工业机器人产量同比增长26%","su":"국가통계국 대변인 푸링후이는 11월 16일 열린 국무원 신문판공실 기자회견에서 올해 10월 중국의 장비제조업과 첨단기술제조업이 크게 지지를 받았다고 밝혔다. 산업용 로봇 생산량은 전년 동기 대비 26.0% 증가했고, 3D프린팅 장비와 리튬이온전지 생산량은 각각 85.9%, 30.0% 증가했다."},{"s":"아티언스대전 개막 축하공연 선보이는 휴머노이드 로봇","so":"뉴스1","tm":"11/17 18:27","c":2,"r":"kr","u":"https://www.news1.kr/photos/8218896","p":1794907625,"a":1794917012},{"s":"AI의 다음 목적지는 물리적 세계를 겨냥한 레이준: 휴머노이드 로봇 산업의 규모는 자동차를 넘어선다 | 기술산업 | 산업경제학","so":"UDN","tm":"11/17 17:15","c":2,"r":"tw","u":"https://udn.com/news/story/7240/9884410","p":1794903348,"a":1794917025,"t":"AI 落地下一站瞄準物理世界雷軍：人形機器人產業規模超越汽車| 科技產業| 產經","su":"인공지능(AI) 산업은 소프트웨어 애플리케이션에서 물리적 세계로 이동하고 있으며, 휴머노이드(사람을 닮은 로봇) 로봇, AI 자동차, 스마트 제조가 차세대 비즈니스 기회의 물결이 되고 있습니다. 샤오미 그룹 창업자이자 회장 겸 CEO인 레이쥔(Lei Jun)은 AI 기술이 지난 4년 동안 빠르게 발전했다고 말했다. 업계에서는 많은 자원을 투자했지만 실제로 구현하고 수익을 창출할 수 있는 애플리케이션은 여전히 제한적입니다. 그는 AI가 물리적 세계에 진입함으로써 가져올 새로운 기회, 특히 휴머노이드 로봇이 향후 자동차 산업을 뛰어넘는 거대한 시장으로 발전할 것으로 기대하고 있다고 낙관하고 있다."},{"s":"현대차, 보스턴다이내믹스 지분 100% 인수","so":"The Korea Herald","tm":"11/17 15:31","c":2,"r":"us","u":"https://www.koreaherald.com/article/10940043","p":1794897083,"a":1794898995,"t":"Hyundai Motor takes full ownership of Boston Dynamics","su":"현대자동차그룹이 미국 로봇 자회사 보스턴다이내믹스의 지분(회사를 나눠 가진 몫) 100%를 인수하며 휴머노이드(사람을 닮은 로봇) 로봇 아틀라스(Atlas) 상용화에 박차를 가하고 있다."},{"s":"영남대, 'HuMAN 제조특화 휴머노이드 사업단' 개소…휴머노이드AI로 지역 정주형 최고급 AI 신진연구자 양성","so":"전자신문","tm":"11/17 14:27","c":2,"r":"kr","u":"https://www.etnews.com/20261117000298","p":1794893262,"a":1794898995,"su":"영남대학교(총장 최외출)가 최근 천마아트센터 이시원글로벌컨벤션홀에서 'HuMAN(Humanoid Manufacturing AI Nexus) 제조특화 휴머노이드(사람을 닮은 로봇) 사업단' 개소식을 가졌다. 이번 개소식에는 김삼수 영남대 산학연구부총장, 김재홍 산학협력단장을 비롯해 정종혁 경북도 인공지능산업과 팀장, 이상협 경산시 신성장산업과장을 비롯해 참여기업 관계자 등 100여 명이 참석했다. 영남대는 지난 7월 과학기술정보통신부와 정보통신기획평가원(IITP)의 'AI최고급신진연구자지원사업' 지역주도형 산학협력 트랙에 선정, 2031년까지 국비 110억 원 등 총 123억여 원을 투입해 사업을 추진한다."},{"s":"유니트리는 10% 이상 하락했습니다.","so":"第一财经","tm":"11/17 11:18","c":2,"r":"cn","u":"https://www.yicai.com/brief/103443111.html","p":1794881880,"a":1794885947,"t":"宇树科技跌超10%","su":"2026/11/17 10:18 [유니트리 10% 이상 하락] 유니트리는 장중 10% 이상 하락하여 현재 636위안으로 거래되고 있으며 매출(물건을 판 돈 전체)액은 17억 4,700만 위안입니다."},{"s":"삼성서울병원, 수술 상황 이해하는 AI 개발…휴머노이드 로봇 구현","so":"아시아경제","tm":"11/17 09:04","c":2,"r":"kr","u":"https://www.asiae.co.kr/article/2026111709042479186","p":1794873864,"a":1794874215,"su":"수술 도구와 의료진의 동작을 인식하는 수준을 넘어 수술이 어떤 단계에 있고 어떤 상황이 진행 중인지 파악하는 ."},{"s":"삼성·LG, 내년 CES서 휴머노이드 맞대결 예고…사업화 경쟁 속도 - 머니투데이","so":"머니투데이","tm":"11/16 17:30","c" 과제를 극복해야 하며 제한된 기관 공간 내에서 전력 소비, 열 방출 및 간섭 방지 기능을 고려해야 합니다. 협동 로봇 제조업체가 위의 기술적 문제를 극복할 수 있도록 TDK는 기존 센서, 능동 및 수동 구성 요소, 소프트웨어 알고리즘을 결합하여 일련의 휴머노이드 로봇 솔루션을 출시합니다."},{"s":"분위기: 중국 베이징에서 열린 세계 휴머노이드 로봇 게임의 로봇","so":"The Straits Times","tm":"11/18 04:09","c":1,"r":"us","u":"https://www.straitstimes.com/videos/6403947356112","p":1794942592,"a":1794955497,"t":"Mood: Robots at the World Humanoid Robot Games in Beijing, China","su":"The Straits Times - straitstimes.com에서 싱가포르, 아시아 및 기타 지역의 최신 속보, 비즈니스, 스포츠, 라이프스타일, 기술 및 멀티미디어 및 기타 뉴스를 받아보세요."},{"s":"Wang Xingxing: 로봇은 일반화의 임계점에 접근하고 있으며 생산 능력과 컴퓨팅 능력은 큰 시험에 직면해 있습니다.","so":"第一财经","tm":"11/17 23:36","c":1,"r":"cn","u":"https://www.yicai.com/video/103444274.html","p":1794926201,"a":1794927760,"t":"王兴兴：机器人逼近泛化临界点 产能与算力迎来大考"},{"s":"Dong Mingzhu는 Zhou Jian에게 소리쳤습니다. Gree는 10년 넘게 로봇을 개발해 왔으며 그것이 좋은 파트너가 될 것이라고 믿습니다. 원하시는 부품을 제공해드리겠습니다.","so":"ThePaper.cn","tm":"11/17 23:34","c":1,"r":"cn","u":"https://www.thepaper.cn/newsDetail_forward_34493465","p":1794926079,"a":1794927762,"t":"董明珠喊话优必选周剑：格力已经研发机器人十几年，相信会成为很好的合作伙伴，你要什么部件提供什么部件","su":"11월 17일 Dong Mingzhu는 APEC 비즈니스 리더 정상 회담에서 Zhou Jian이 선택되어야 한다고 발표했습니다. 그녀는 Gree가 10년 넘게 로봇을 개발해 왔으며 좋은 파트너가 될 것이라고 믿고 있다고 말했습니다. \"원하시는 부품을 제공해드리겠습니다.\""},{"s":"Congtai의 수주에는 내년 1분기에 스프린트 로봇, 무인 차량, 스마트 의료 등 신제품이 나올 예정이다.","so":"UDN","tm":"11/17 23:03","c":1,"r":"tw","u":"https://udn.com/news/story/7252/9885053","p":1794924215,"a":1794927766,"t":"聰泰訂單看到明年第1季 衝刺機器人、無人載具與智慧醫療等新品","su":"이미지 캡쳐카드 제조사 콩타이(5474)가 17일 역매수 실적(회사가 번 돈 성적표)설명회에 참석했다. Lin Hongpei 총책임자는 주문 가시성이 내년 1분기까지 연장되었으며 현재 주문 접수 상황은 양호하다고 말했습니다. 기존 이미지 캡쳐카드 외에도 로봇, 무인차량, 스마트 의료 등 기타 신규 애플리케이션과 신제품의 레이아웃도 확대해 내년 실적 성장을 낙관하고 있다."},{"s":"산업정보기술부는 지능 능력 분류, 민첩성, 훈련 데이터 등을 포함하는 5가지 휴머노이드 로봇 표준을 발표했습니다.","so":"ThePaper.cn","tm":"11/17 22:35","c":1,"r":"cn","u":"https://www.thepaper.cn/newsDetail_forward_34492647","p":1794922548,"a":1794927762,"t":"工信部发布5项人形机器人标准，涉及智能化能力分级、灵巧手及训练数据等","su":"더페이퍼테크놀로지는 지난 11월 17일 산업정보기술부가 발표한 휴머노이드(사람을 닮은 로봇) 로봇 및 체화지능표준화기술위원회(MIIT/TC8, 이하 'TC8 표준화위원회') 사무국으로부터 20일 밝혔다."},{"s":"ETU의 피아노 연주 로봇은 53개의 손가락으로 정확하게 연주합니다. 음악에 대한 인간의 해석의 감정 표현을 대체하는 것은 여전히 어렵습니다.","so":"公視新聞","tm":"11/17 21:32","c":1,"r":"tw","u":"https://news.pts.org.tw/article/836180","p":1794918773,"a":1794921331,"t":"義大彈琴機器人以53指精準演奏 人類詮釋樂章流露情感仍難取代","su":"이탈리아가 53개의 손가락으로 피아노를 연주하고 같은 무대에서 인간 피아니스트와 경쟁할 수 있는 피아노 연주 휴머노이드(사람을 닮은 로봇) 로봇을 개발했습니다. 하지만 인간과 로봇의 가장 큰 차이점은 인간이 공연에 감정적 해석을 접목하고 관객과 소통할 수 있다는 점인데, 이는 로봇이 대체할 수 없는 부분이다."},{"s":"유비테크 CEO Zhou Jian: 휴머노이드 로봇이 아시아 태평양에 진출하는 길은 “하나의 도메인, 하나의 전략”이 될 것입니다","so":"21财经","tm":"11/17 20:30","c":1,"r":"cn","u":"https://www.21jingji.com/article/20261117/herald/f357d50e0437ad01778f036b9d611b7b.html","p":1794915000,"a":1794927764,"t":"优必选CEO周剑：人形机器人进入亚太的路径将是“一域一策”","su":"21세기 비즈니스 헤럴드 기자 Shi Enze가 선전에서 보도했습니다. 11월 17일, 2026년 아시아태평양경제협력체(APEC) 비즈니스 리더 정상회의가 선전에서 열렸습니다. 광둥-홍콩-마카오 그레이터 베이 지역 및 아시아 태평양 개발 기회 포럼에서 유비테크 설립자 겸 CEO인 Zhou Jian은 휴머노이드(사람을 닮은 로봇) 로봇이 아시아 태평양 경제에 진정으로 통합되기 위해서는 특정 시나리오 및 시나리오 데이터와 깊이 통합되어야 한다고 말했습니다. Greater Bay Area의 성숙한 공급망과 광둥, 홍콩, 마카오에 연결된 자본 및 과학 연구 자원은 이 프로세스를 위한 견고한 기반을 제공합니다. Zhou Jian은 휴머노이드 로봇과 임바디드 AI(로봇처럼 몸을 가진 인공지능)가 물리적 세계로 가속화되고 있다고 믿습니다. 그는 향후 20~30년 안에 휴머노이드 로봇이 용접, 스프레이, 자동차 조립 외에도 수많은 유연한 작업을 처리할 수 있다면 “글로벌 환경에 큰 변화가 있을 수 있다”고 예측합니다."},{"s":"휴머노이드 로봇 기업 Youbixuan: 로봇 응용 시나리오는 지역화되고 차별화될 것입니다","so":"财新","tm":"11/17 19:33","c":1,"r":"cn","u":"https://companies.caixin.com/2026-11-17/102505896.html","p":1794911580,"a":1794917014,"t":"人形机器人公司优必选：机器人应用场景将地域化、差异化","su":"[Caixin.com] 지난 11월 17일 열린 2026 APEC 비즈니스 리더 서밋에서 휴머노이드(사람을 닮은 로봇) 로봇 기업 유비테크 창업자 겸 CEO Zhou Jian은 \"미래에 집에 들어가는 로봇은 현지 시장 문화와 사용자 초상화에 대해 매우 다른 이해를 갖게 될 것이며, 지역에 따라 적용 시나리오도 차별화될 것\"이라고 말했습니다. Zhou Jian은 휴머노이드 로봇이 다양한 응용 시나리오에서 다양한 솔루션을 형성할 것이라고 믿습니다. 다양한 지역과 산업의 특성이 다르기 때문에 로봇 자체는 훈련을 위해 대량의 특정 장면 데이터가 필요하므로 개발 캐리어가 된 다음 응용 목표에 따라 2차 개발을 수행합니다."},{"s":"Youbixuan Zhou Jian: 강력한 일반화 기능을 갖춘 범용 휴머노이드 로봇에는 아직 개발 시간이 필요합니다.","so":"第一财经","tm":"11/17 18:58","c":1,"r":"cn","u":"https://www.yicai.com/news/103443875.html","p":1794909507,"a":1794917016,"t":"优必选周剑：泛化能力强的通用人形机器人还需要一些发展时间","su":"제일재경 2026-11-17 17:57:23 편집자: Gao Mingyan 11월 17일 유비테크의 창립자이자 회장 겸 CEO인 Zhou Jian은 2026 APEC 비즈니스 리더 서밋에서 매우 강력한 일반화 기능을 갖춘 범용 휴머노이드(사람을 닮은 로봇) 로봇은 현재의 하드웨어 및 대형 모델 조건에서 여전히 개발 시간이 필요할 것이라고 말했습니다. 이 공백기에는 장면 데이터가 가장 중요하며 장면 데이터를 기반으로 많은 개발이 가능합니다. 미래의 어느 날 휴머노이드 로봇이 집에 들어간다면, 다양한 국가의 집에 들어갈 수 있는 로봇은 문화적 이해, 사용자 프로필, 언어 등이 매우 다를 것입니다. 아시아 태평양 지역을 포함한 전 세계의 소프트웨어, 하드웨어 및 시나리오는 차별화된 차이를 형성할 것입니다. (제일재경 기자 Zheng Xutong)"},{"s":"AI 반도체부터 로봇 몸체까지…영남대, 제조용 휴머노이드 개발 착수","so":"이데일리","tm":"11/17 18:51","c":1,"r":"kr","u":"https://www.edaily.co.kr/News/Read?newsId=04929846645646704&mediaCodeNo=257","p":1794909080,"a":1794917012,"su":"영남대가 사람의 신경망을 모방한 저전력 AI 반도체(전자기기의 두뇌 부품)와 제조용 로봇 몸체, 스스로 작업을 수행하는 AI를 하나의 휴머노이드(사람을 닮은 로봇)에 통합한다. 구미·경산·포항 기업이 제조 현장에서 성능을 검증하고, 연구에 참여한 인재의 채용도 연계한다. 영남대는 지난 9일 교내 천마아트센터..."},{"s":"ROBOTERA, China Post의 광둥 네트워크를 통해 휴머노이드 로봇 배치를 확장하여 성 전체 8개 도시에 도달","so":"The Straits Times","tm":"11/17 18:10","c":1,"r":"sg","u":"https://www.straitstimes.com/paid-press-releases/robotera-expands-humanoid-robot-deployment-across-china-posts-guangdong-network-reaching-eight-cities-province-wide-20261117","p":1794906600,"a":1794917031,"t":"ROBOTERA Expands Humanoid Robot Deployment Across China Post's Guangdong Network, Reaching Eight Cities Province-Wide","su":"베이징, 2026년 11월 17일 /PRNewswire/ -- ROBOTERA는 China Post Group 광둥 지점의 네트워크 전체에 휴머노이드(사람을 닮은 로봇) 로봇을 배치하여 11개 우편함에 도달했습니다. straitstimes.com에서 자세한 내용을 확인하세요."},{"s":"Junxing-KY의 지능형 전송은 내년에도 계속 성장할 것이며, 휴머노이드 로봇은 내년에 생산량이 증가할 것입니다 - 뉴스","so":"MoneyDJ","tm":"11/17 17:56","c":1,"r":"tw","u":"https://www.moneydj.com/kmdj/news/newsviewer.aspx?a=6393fe0b-942d-4968-a332-8bf0562d5ddc","p":1794905760,"a":1794917023,"t":"鈞興-KY明年智能傳動續強，人形機器人拚後年放量- 新聞","su":"Junxing-KY(4571) 지능형 전송 수익은 올해(2026년) 10%를 차지할 것으로 예상됩니다. 산업용 로봇 기어 관련 수주(일감 주문을 받는 것) 증가세에 대해 계속 낙관하고 있는 가운데, 휴머노이드(사람을 닮은 로봇) 로봇 기어도 2027년에는 소량 생산될 것으로 예상된다. 지능형 변속기는 2027년에도 여전히 가장 크게 성장하는 응용 산업이 될 것으로 예상되며, 휴머노이드 로봇 기어가 출하된다면…"},{"s":"Zhiyuan은 범위를 확장하고 유니트리는 게임에 참여합니다. 선두 로봇 회사는 왜 벤처 캐피탈에 대한 투자를 늘리나요?","so":"第一财经","tm":"11/17 17:48","c":1,"r":"cn","u":"https://www.yicai.com/news/103438253.html","p":1794905335,"a":1794955500,"t":"智元扩圈，宇树入局：头部机器人企业为何加码创投","su":"하반기로 접어들면서 구현지능 1차 시장이 냉각되고, 로봇 선두업체들은 벤처캐피털에 대한 투자를 늘리고 있다. 최근 Zhiyuan은 임바디드 AI(로봇처럼 몸을 가진 인공지능) 분야에서 차세대 AI 인프라, 차세대 모델 등으로 확장하는 Venture Capital Plan A를 업그레이드했습니다. 유니트리와 Sequoia China는 \"Shanyu 혁신 계획\"의 공동 수립을 발표했습니다. 이전에는 업계 내 다른 회사에서도 이에 대한 계획을 갖고 있었습니다. 올해 로봇기업은 시장에서 무시할 수 없는 벤처캐피탈 강자로 거듭났다. 많은 업계 관계자들은 임바디드 AI의 개발이 아직 초기 단계라고 말했습니다. 투자를 통해 생태학적 파트너를 지원하는 것은 산업 및 산업 체인의 발전을 촉진할 것이며, 이는 또한 전략적 위치이기도 합니다. 일부 투자기관도 이러한 투자가 산업장벽 우위를 형성할 수 있는지 여부는 산업 발전과 건전한 공급망(부품·재료가 오가는 연결망) 관계 형성 여부에 달려 있다고 언급했다."},{"s":"일본 도쿄 패션쇼에 휴머노이드 모델 등장…인간 모델과 함께 런웨이","so":"로봇신문","tm":"11/17 17:13","c":1,"r":"kr","u":"https://www.irobotnews.com/news/articleView.html?idxno=49646","p":1794903225,"a":1794917012,"su":"일본 도쿄에서 열린 패션쇼에 휴머노이드(사람을 닮은 로봇) 로봇이 전문 모델과 함께 런웨이에 등장해 주목받았다.일본 관련 뉴스를 전하는 뉴스 온 재팬(News On Japan)은 1"},{"s":"휴머노이드 로봇은 어떻게 기술적 병목 현상을 극복할 수 있습니까? 학자가 JNU를 방문하여 최첨단 해석을 제공합니다.","so":"21财经","tm":"11/17 17:09","c":1,"r":"cn","u":"https://www.21jingji.com/article/20261117/herald/f7c2810865404a9e17cdf6a0f8bfe714.html","p":1794902940,"a":1794917017,"t":"人形机器人如何突破技术瓶颈？院士做客暨大给出前沿解读","su":"지난대학교 창립 120주년을 기념하고, 창립 120주년을 맞아 강력한 학문적 분위기를 조성하고, 교사와 학생의 학문적 지평을 넓히기 위해 지난대학교 지능과학공학부/인공지능 산업부에서는 \"세상을 가르치고, 미래에 대한 지능적 감각\"을 주제로 일련의 학문적 개척 강의를 만들었습니다. 중국과학원 Yin Zhouping 학자와 중국공정한림원 외국 학자 Wang Jiangzhou가 손님으로 초청되어 두 개의 높은 수준의 최첨단 학술 보고서를 발표했습니다. 천명에 가까운 교사와 학생이 수준 높은 과학기술 학술대회를 위해 현장에 모였습니다. 11월 15일, 화중과기대학교 부총장이자 중국과학원 학자인 인저우핑(Yin Zhouping)이 지난대학교 힐튼 가든 인 주하이 국제 컨퍼런스 센터 강의실에서 '휴머노이드(사람을 닮은 로봇) 로봇의 개발 현황 및 동향'이라는 제목의 특별 보고서를 발표했습니다. 학자 Yin Zhouping은 지능형 제조 장비 및 기술 국가 핵심 연구소의 전무이사로 재직하고 있습니다. 그는 오랫동안 고급 전자 제조 장비의 기초 이론과 핵심 기술 연구에 전념해 왔습니다. 그는 새로운 디스플레이, 통합 칩, 플렉서블 센싱 제조 및 기타 방향에서 수많은 산업화 성과를 거두었으며 여러 국가 과학 기술상을 수상했습니다."},{"s":"A주 마감: 중국의 3대 A주 지수가 종합적으로 마감되고, 휴머노이드 로봇 컨셉 주가 하락했으며, 유니트리가 약 12% 하락하고, 귀금속 및 반도체 주가가 상승했습니다.","so":"21财经","tm":"11/17 16:56","c":1,"r":"cn","u":"https://www.21jingji.com/article/20261117/herald/8691b32b6234f1e5195dd4d899ff6265.html","p":1794902196,"a":1794917019,"t":"A股收报：A股三大指数集体收跌，人形机器人概念股下挫，宇树科技跌近12%，贵金属、半导体上涨","su":"17일 중국 3대 A주 지수는 하락세로 출발했다가 상승했다가 종합적으로 하락세로 마감했습니다. 장을 마감한 시점에서 상하이 증권거래소 지수는 0.50% 하락했고, 선전 구성요소 지수는 0.49% 하락했으며, 차이넥스트 지수는 1.20% 하락했다. 시의 매출액은 1조 4700억 위안이었고, 4,100개 이상의 주식이 하락했다. 업종별로는 AI 대형모델과 휴머노이드(사람을 닮은 로봇) 로봇 컨셉주가 종합적으로 하락했고 유니트리는 거의 12% 하락했다. 문화미디어가 급락했고, 통신기기, 자동차, 인터넷, 교육, 에너지기기, 전자부품 등 업종도 부진했다. 노광기 컨셉주가 활발했고, 가전제품, 오토바이, 귀금속, 석유화학, 컴퓨터 하드웨어, 반도체(전자기기의 두뇌 부품) 등이 시장을 강세를 보이며 상승했다. 소스 시장 정보 QR 코드를 스캔하여 다운로드 21 Finance APP QR 코드를 스캔하여 WeChat 공용 계정 팔로우 QR 코드를 스캔하여 Weibo를 팔로우하십시오 QR 코드를 스캔하여 Tik Tok을 팔로우하세요 QR 코드를 스캔하여 BiliBili를 팔로우하세요 QR 코드를 스캔하여 Toutiao를 팔로우하세요 QR 코드를 스캔하여 Baijiahao를 팔로우하세요 QR 코드를 스캔하여 Kuaishou를 팔로우하세요"},{"s":"[기고] 협동로봇 실습에 ‘정답 없는 문제’를 들이려면","so":"로봇신문","tm":"11/17 16:54","c":1,"r":"kr","u":"https://www.irobotnews.com/news/articleView.html?idxno=49635","p":1794902045,"a":1794917012,"su":"협동로봇 실습실의 흔한 풍경이 있다. 훈련생들은 티칭 펜던트로 정해진 경로를 입력하고, 로봇이 같은 동작을 되풀이하는지 확인한다. 기초를 익히는 데 꼭 필요한 과"},{"s":"[AI + 로봇] 유니트리의 Wang Xingxing: 임바디드 AI의 임계점이 다가오고 있습니다. 연간 생산량이 1,000만 개로 증가하면 세 가지 주요 과제에 직면하게 됩니다.","so":"香港經濟日報HKET","tm":"11/17 16:51","c":1,"r":"hk","u":"https://inews.hket.com/article/4226420/%E3%80%90AI-%E6%A9%9F%E6%A2%B0%E4%BA%BA%E3%80%91%E5%AE%87%E6%A8%B9%E7%A7%91%E6%8A%80%E7%8E%8B%E8%88%88%E8%88%88%EF%BC%9A%E5%85%B7%E8%BA%AB%E6%99%BA%E8%83%BD%E8%87%A8%E7%95%8C%E9%BB%9E%E5%B0%87%E8%87%B3%E3%80%80%E5%B9%B4%E7%94%A2%E9%87%8F%E8%8B%A5%E5%8D%87%E8%87%B3%E5%8D%83%E8%90%AC%E5%8F%B0%E6%81%90%E8%BF%8E3%E5%A4%A7%E6%8C%91%E6%88%B0?mtc=20064","p":1794901913,"a":1794917027,"t":"【AI+機械人】宇樹科技王興興：具身智能臨界點將至 年產量若升至千萬台恐迎3大挑戰"},{"s":"APEC │ 유니트리의 Wang Xingxing: 로봇의 다음 과제는 대량 생산이며 파생된 컴퓨팅 성능에 대한 수요는 무시할 수 없습니다","so":"TVB","tm":"11/17 16:09","c":1,"r":"hk","u":"https://news.tvb.com/en/1206836-APEC%E5%AE%87%E6%A8%B9%E7%A7%91%E6%8A%80%E7%8E%8B%E8%88%88%E8%88%88%E6%A9%9F%E6%A2%B0%E4%BA%BA%E4%B8%8B%E4%B8%80%E5%80%8B%E6%8C%91%E6%88%B0%E7%82%BA%E5%A4%A7%E8%A6%8F%E6%A8%A1%E7%94%9F%E7%94%A2%E8%A1%8D%E7%94%9F%E7%AE%97%E5%8A%9B%E9%9C%80%E6%B1%82%E4%B8%8D%E5%AE%B9%E5%BF%BD%E8%A6%96","p":1794899340,"a":1794917029,"t":"APEC｜宇樹科技王興興︰機械人下一個挑戰為大規模生產 衍生算力需求不容忽視","su":"유니트리의 Wang Xingxing 회장은 로봇 기술의 일반화 능력이 임계점에 접근하고 있으며 다양한 작업 시나리오에 적응할 것으로 예상된다고 말했습니다. 다음 과제는 대량 생산이며, 이에 따른 컴퓨팅 성능에 대한 수요도 무시할 수 없습니다. 유니트리의 Wang Xingxing 회장은 \"우리는 로봇이 모든 가정, 모델 또는 로봇에 배치될 수 있고 장면이 바뀔 때 재교육을 받는 대신 즉시 작동할 수 있기를 바랍니다. 현재 우리는 연간 수만 대를 생산하기 때문입니다..."},{"s":"중국의 로봇 제조업체는 바이러스성 공중제비 동영상보다 더 많은 것을 제공할 수 있습니다.","so":"Financial Times","tm":"11/17 14:00","c":1,"r":"world","u":"https://www.ft.com/content/13fb1482-46d8-46a8-9163-f2391204319d?syn-25a6b1a6=1","p":1794891614,"a":1794917032,"t":"China’s robot makers have more to offer than viral backflip videos"},{"s":"유니트리의 창립자 Wang Xingxing은 2026년 AI 발전을 한 단어로 설명합니다.","so":"21财经","tm":"11/17 13:25","c":1,"r":"cn","u":"https://www.21jingji.com/article/20261117/herald/69451dfdd596b22a2afa1b0a759d2aba.html","p":1794889500,"a":1794917022,"t":"宇树科技创始人王兴兴用一个词形容2026年AI发展：激动人心","su":"지난 11월 17일 아시아태평양경제협력체(APEC) 비즈니스 리더스 서밋에서 위슈테크놀로지(유니트리) 창업자 왕싱싱(Wang Xingxing)이 기술 기업 대표로서 2026년 AI 발전 동향에 대한 소감을 밝혔다. 그는 향후 몇 년 동안 AI 대형 모델과 로봇 분야의 잠재력이 엄청나며 현재 가장 기대되는 방향이라고 말했습니다. 그의 견해로는 현재 일반 대중이 볼 수 있는 AI 기술과 로봇 공학 기술의 발전은 대부분 \"물 위\"에 불과합니다. 대중의 시선 밖에서는 업계 최하층의 기술적 혁신이 훨씬 더 빠르고, 반복 속도도 외부 세계의 인식을 훨씬 뛰어넘습니다. 그는 향후 몇 년간 기술 방향과 개발 가능성을 명확하게 볼 수 있다고 인정했다. 트랙 전체가 늘 흥미진진한 진행으로 가득 차 있기 때문에 AI를 수용하고 AI 기술을 잘 활용하는 데 더 많은 시간을 투자할 예정이다."},{"s":"유니트리 Wang Xingxing: 미래 로봇의 컴퓨팅 성능에 대한 수요는 대부분의 사람들의 상상을 훨씬 뛰어넘을 수 있습니다.","so":"第一财经","tm":"11/17 13:14","c":1,"r":"cn","u":"https://www.yicai.com/news/103443313.html","p":1794888871,"a":1794898997,"t":"宇树王兴兴：未来机器人对算力的需求可能远超绝大部分人想象","su":"11월 17일, APEC 비즈니스 리더 정상회의가 선전에서 열렸습니다. 첫날 열린 '개방적이고 포용적인 인공지능 혁신 생태계 공동 구축' 특별 토론 세션에서는 유니트리의 창업자 Wang Xingxing이 AI 및 로봇 산업 발전에 대한 자신의 견해를 공유했습니다. 그는 지금까지 모두가 보아온 AI와 로봇공학 기술의 진보는 여전히 '물 위'에 있는 반면, '물 아래'의 상황은 더욱 고르지 못하며 기술 혁신은 여전히 훨씬 빠르다고 말했다. 그러나 그는 현재 많은 과제가 있으며 그 중 가장 큰 문제는 모델 일반화 능력의 문제라고 언급했습니다. 그러나 올해 글로벌 기술 혁신과 결합하여 우리는 이미 돌파의 임계점을 확인했으며 이는 상대적으로 빠를 수 있습니다."},{"s":"유니트리의 Wang Xingxing: 보편적인 로봇 모델은 곧 획기적인 발전을 이루겠지만 컴퓨팅 성능과 대량 생산에는 여전히 어려움이 있습니다.","so":"财新","tm":"11/17 13:03","c":1,"r":"cn","u":"https://companies.caixin.com/2026-11-17/102505654.html","p":1794888180,"a":1794898998,"t":"宇树科技王兴兴：机器人通用模型很快迎来突破 算力、量产仍有挑战","su":"[Caixin] 11월 17일 오전에 열린 2026 APEC 비즈니스 리더 서밋에서 왕싱싱(Wang Xingxing)은 현재의 시장 인식과 로봇 연구 및 개발의 인지적 차이에 대해 “흥미롭다”고 설명하면서 “AI와 임바디드 AI(로봇처럼 몸을 가진 인공지능) 분야에서 일반 사람들은 물 위에서 많은 진전을 보지만 물 아래에서 볼 수 있는 것은 매우 흥미롭고 향후 몇 년 안에 큰 잠재력이 있음을 알 수 있습니다”라고 말했습니다. 그날 오전 두 번째 AI 관련 세미나에서 왕싱싱(Wang Xingxing)은 대형 언어 모델이 일상 생활에서 점점 더 중요한 역할을 하고 있어 다른 응용 시나리오에서 신기술에 대한 사람들의 기대가 높아지면서 중국 국내 로봇 산업이 현재 많은 관심을 받고 있다고 말했다. 그러므로 사람들은 자연스럽게 로봇이 현실적(회사가 번 돈 성적표)인 문제도 빨리 해결할 수 있기를 바랍니다."},{"s":"\"2080년 휴머노이드 로봇 100억대 넘어 세계인구보다 많아진다\"","so":"뉴스1","tm":"11/17 12:00","c":1,"r":"kr","u":"https://www.news1.kr/world/general-world/6356581","p":1794884443,"a":1794885942},{"s":"[오늘 이 종목] 북미 휴머노이드 첫 공급 '삼현' · AI 보안 트렌드 '클라우드플레어' - 머니투데이","so":"머니투데이","tm":"11/17 11:27","c":1,"r":"kr","u":"https://www.mt.co.kr/amp/stock/2026/11/17/2026111711167086122","p":1794882450,"a":1794898995,"su":"유 차장은 최근 5천피 부근의 변동성(값이 크게 출렁이는 정도) 장세 속 바닥 테스트 국면을 짚어내며, 북미 휴머노이드(사람을 닮은 로봇) 시장에 첫발을 디딘 삼현과 AI 에이전트 확산의 수혜를 입는 클라우드플레어를 집중 조명했다."},{"s":"허샤오펑 : 11월 처음으로 월 판매량 6만대 돌파 예상, 내년 2분기에는 휴머노이드 로봇 출시","so":"第一财经","tm":"11/17 11:16","c":1,"r":"cn","u":"https://www.yicai.com/news/103442684.html","p":1794881763,"a":1794885951,"t":"何小鹏：预计11月月销将首次超6万辆，人形机器人明年二季度对外发布","su":"11월 16일 Xpeng Group은 2026년 3분기 실적(회사가 번 돈 성적표) 보고서를 발표하고 전화 회의를 가졌습니다. 3분기 차량 인도량이 11만 대를 돌파해 분기별 인도 사상 최고치를 기록했다. 총 수입은 242.8억 위안으로 단일 분기 수입 사상 최고치를 기록했습니다. MONA L03과 글로벌 확장으로 인해 자동차 수요가 성장기로 접어들었습니다. He Xiaopeng은 수익 컨퍼런스 콜에서 회사의 단기 및 중기 운영 목표는 자동차 사업에서 긍정적인 현금 흐름과 수익성을 달성하여 물리적 AI에 대한 전략적 투자를 보장하는 것이라고 말했습니다. Xpeng의 물리 AI 혁신 사업은 2C와 2B에 대한 다양한 수익원을 열어주고 있습니다. 동시에 He Xiaopeng은 내년에 전반적인 운영 개선에 더 많은 에너지를 쏟고, 회사의 자가 조혈 능력을 강화하는 동시에 고급 로봇의 대량 생산 및 납품을 촉진할 계획입니다."},{"s":"뉴빌리티 “배달·순찰 로봇으로 쌓은 공간 지능, 휴머노이드·제조 부문까지 확장”","so":"동아일보","tm":"11/17 10:32","c":1,"r":"kr","u":"https://www.donga.com/news/It/article/all/20261117/135037729/1","p":1794879126,"a":1794885942,"su":"[경기창조경제혁신센터 x IT동아 공동기획] 경기창조경제혁신센터(이하 경기혁신센터)는 대·중견기업과 스타트업을 1:1로 연결해 기술검증(PoC)부터 투자 유치,해외 진출까지 원스톱으로 지원하는 오픈이노베이션 프로그램 ‘유니콘 브릿지’를 운영합니다.단순 매칭을 넘어 실…"},{"s":"학습 없어도 ‘척척’ 해내는 휴머노이드… “로봇 AI 기술 또 진화했다”","so":"Chosunbiz","tm":"11/17 10:25","c":1,"r":"kr","u":"https://biz.chosun.com/industry/company/2026/11/17/EQSUFD65LZEN7DXCXOS3TDBOA4/","p":1794878700,"a":1794885942,"su":"국내외 휴머노이드(사람을 닮은 로봇) 경쟁이 확대되는 가운데 로봇 성능을 높이는 기반 기술도 고도화되고 있다. 휴머노이드가 학습해야 하는 데이터량을 줄이거나 로봇의 지능 수준을 높이는 기술이 잇따라 나오면서다. 업계에서는 관련 기술들이 고도화되면서 휴머노이드 경쟁도 한층 심화될 것으로 전망하고 있다. 17일 로봇업계에 따르면, 미 빅테크 기업 엔비디아는 이달 새로운 로봇 범용 파운데이션 모델(RFM·Robot Foundation Model) 'GROOT N2'를 출시했다."},{"s":"Xinsong Robot: 핵심 기술을 손에 쥐다","so":"经济参考报","tm":"11/17 09:21","c":1,"r":"cn","u":"http://jjckb.xinhuanet.com/20261117/c9b77ca8dee54a9a8322d14d0dd8e52e/c.html","p":1794874905,"a":1794955502,"t":"新松机器人：把关键技术攥在自己手里","su":"SIASUN Robot: 핵심 기술을 손에 쥐다 - 심양 SIASUN Robot Automation Co., Ltd.(이하 \"SIASUN 로봇\")의 생산 작업장에 들어서면 산업용 로봇, 협동 로봇, 특수 로봇이 차례로 테스트되고 있습니다. 로봇 팔은 리드미컬하게 흔들리고 모바일 로봇은 설정된 경로를 따라 이동합니다. SIASUN Robotics는 2009년에 GEM에 상장(주식시장에 처음 들어오는 것)되었습니다. 산업용 로봇, 모바일 로봇, 특수 로봇이라는 세 가지 핵심 제품을 보유한 중국 국내 로봇 산업의 국영 선도 기업입니다. 많은 응용 시나리오 중에서 자동차 제조는 SIASUN Robot이 차체 용접 및 조립부터 공장 내 물류에 이르기까지 수년 동안 산업용 로봇 분야에 깊이 관여해 온 중요한 방향입니다. 자동화된 생산 라인은 중국의 많은 국내 자동차 회사에 서비스를 제공해 왔습니다."},{"s":"[모닝 리포트] \"로보티즈, 유럽 공급 확대·휴머노이드 출하 기대\"","so":"뉴스핌","tm":"11/17 08:27","c":1,"r":"kr","u":"https://www.newspim.com/news/view/20261117000087","p":1794871620,"a":1794874215,"su":"[ ":"10월에는 산업용 로봇과 집적회로 생산 증가율이 20%를 넘어섰고, 신운동에너지의 지원 역할도 계속해서 높아졌다.","so":"21财经","tm":"11/16 20:52","c":1,"r":"cn","u":"https://www.21jingji.com/article/20261116/herald/35a348029c0464373fc004d7f9ceb32c.html","p":1794829920,"a":1794834748,"t":"10月工业机器人、集成电路产量增速均超20% 新动能支撑作用继续提升","su":"1월부터 10월까지 첨단제조와 스마트제조로 대표되는 새로운 원동력은 산업부가가치가 일정 규모 이상으로 성장하는 데 50% 이상 기여했다. 10월에는 첨단기술제품과 '3대 신제품' 수출액이 전년 동기 대비 50% 이상 증가했다. 3D 프린팅 장비, 리튬이온 배터리, 산업용 로봇의 생산량은 전년 동기 대비 각각 85.9%, 30.0%, 26.0% 증가했다. 국가통계국이 16일 발표한 국가경제실적(회사가 번 돈 성적표)에 따르면, 다양한 분야에서 새로운 생산력 배양이 가속화되고, 새로운 운동에너지의 추진력이 지속적으로 강화되며, 국가경제 운영이 전반적으로 안정되고 새롭고 더 나은 성과를 향해 발전하고 있다. 새로운 운동에너지의 축적은 컴퓨팅 파워에 대한 수요에 새로운 기회를 가져왔습니다. \"기술 혁신과 산업 혁신이 깊이 통합되고, 새로운 과학 기술 성과가 지속적으로 나타나고 있으며, 새로운 산업, 새로운 비즈니스 형식 및 신제품이 더 나은 방향으로 개발되고 있으며, 전통 산업의 변화와 업그레이드 속도가 가속화되고, 디지털화와 지능이 통합 및 발전하고 있습니다. 이는 고품질 경제 발전을 강력하게 지원했습니다.\" 중국 국가통계국 국민경제종합통계국 대변인이자 수석경제학자인 푸 링후이(Fu Linghui)는 10월 경제 성과를 분석하면서 이렇게 말했습니다."},{"s":"탄민: 본토 휴머노이드 로봇 '백연대 전투' 적자생존","so":"信報網站","tm":"11/16 20:33","c":1,"r":"hk","u":"https://www.hkej.com/multimedia/view/id/4566083","p":1794828813,"a":1794830484,"t":"譚旻: 內地人形機械人「百團大戰」 優勝劣汰","su":"최근에는 임바디드 AI(Embodied AI)과 휴머노이드(사람을 닮은 로봇) 로봇의 물결이 전 세계를 휩쓸며 공상과학의 장면을 현실로 가져오고 있습니다. 구현지능의 상용화 과정은 '기술 실증'에서 대규모 구현으로 진화하고 있다. 유비테크놀로지(09880)는 휴머노이드 로봇 최초의 주식으로 하드 기술을 자본 시장에 도입하는 데 성공적으로 앞장섰습니다. 회사의 최고 브랜드 책임자인 Tan Min(Michael)은 \"경제 저널\"을 수락했으며 현재 TV \"A Word for Money\" 시리즈 2에서 공동 제작한 \"홍콩 혁신 및 기술\"과의 독점 인터뷰를 통해 임바디드 AI 뒤에 있는 과제를 공유하고 로봇이 진정으로 자율적인 의사 결정을 달성할 수 있는 시기와 본토 산업의 발전을 분석합니다."},{"s":"포토 갤러리 | 상하이 하버 시티에서 로봇 패션쇼 개막, 휴머노이드 로봇이 고전 댄스 스텝 재현","so":"财新","tm":"11/16 20:25","c":1,"r":"cn","u":"https://photos.caixin.com/2026-11-16/102505444.html","p":1794828300,"a":1794874217,"t":"图集｜机器人时装秀开上海港城 人形机器人重现经典舞步","su":"[카이신] 2026년 11월 16일, 지드래곤이 소속된 갤럭시 코퍼레이션(Galaxy Corporation)은 홍콩 침사추이에서 'MACH 33: Physical AI Fashion Show Hong Kong' 로봇 패션쇼를 개최했다. 이번 행사는 중국 로봇기업 유니트리(688836.SH)와 홍콩 상장(주식시장에 처음 들어오는 것)기업 Superstar Legend(06683.HK)가 공동으로 개최했습니다. 홍콩 일럿 계획 시작","so":"Now 新聞","tm":"11/16 18:18","c":1,"r":"hk","u":"https://news.now.com/home/local/player?newsId=669771","p":1794820713,"a":1794830488,"t":"機器人走入社區試驗計劃啟動"},{"s":"화웨이, 임바디드 AI에 중점을 두고 청소 로봇 사업에 진출","so":"第一财经","tm":"11/16 18:07","c":1,"r":"cn","u":"https://www.yicai.com/news/103442130.html","p":1794820027,"a":1794830478,"t":"华为加码具身智能，切入清扫机器人业务","su":"화웨이는 인공 지능 레이아웃을 디지털 세계에서 물리적 세계로 확장하고 있습니다. 11월 16일, 화웨이 클라우드는 위생 장비 회사인 Fulongma와 공동 개발한 차세대 지능형 청소 로봇의 사전 판매를 시작했다고 발표했습니다. 그중 화웨이 Cloud는 제품에 CloudRobo 개발 도구 체인, 인식 및 계획 모델, Agentic 운영 플랫폼 및 Ascend 클라우드 컴퓨팅 성능을 제공합니다. 로봇은 또한 환경을 인식할 수 있을 뿐만 아니라 복잡한 동적 물리적 공간에 대한 추론 및 미래 상태 예측을 수행할 수 있는 세계 모델을 도입합니다. 같은 날, 화웨이 Cloud는 Ascend의 기본 임바디드 월드 모델 CloudRobo-WM1.2를 공식 출시하고 오픈 소스화하여 로봇 산업 체인으로 더욱 확장했습니다."},{"s":"Elite Robots, CE 규격 모바일 매니퓰레이터로 글로벌 모바일 자동화 제품 확장","so":"The Straits Times","tm":"11/16 18:00","c":1,"r":"sg","u":"https://www.straitstimes.com/paid-press-releases/elite-robots-expands-global-mobile-automation-offering-with-ce-compliant-mobile-manipulators-20261116","p":1794819600,"a":1794830489,"t":"Elite Robots Expands Global Mobile Automation Offering with CE-Compliant Mobile Manipulators","su":"자율 이동성과 협업 로봇공학을 결합하여 전 세계적으로 보다 유연한 제조 운영을 지원 상하이, 2026년 11월 16일 /"},{"s":"Rongqi Technology: 현재 물리적 AI 및 휴머노이드 로봇의 연구 개발에 참여하지 않음","so":"第一财经","tm":"11/16 17:54","c":1,"r":"cn","u":"https://www.yicai.com/brief/103442138.html","p":1794819240,"a":1794830479,"t":"荣旗科技：当前未涉及物理AI和人形机器人研发","su":"2026/11/16 16:54 [룽치테크놀로지: 현재 물리적 AI 및 휴머노이드(사람을 닮은 로봇) 로봇 연구개발에는 참여하지 않음] 롱치테크놀로지는 인터랙티브 플랫폼을 통해 회사가 현재 물리적 AI 및 휴머노이드 로봇 연구개발에 참여하고 있지 않다고 밝혔습니다."},{"s":"연속보드주 추적丨오늘 총 33개의 A주 주식 한도가 상향되었습니다. 이 로봇 컨셉 스톡에는 4개의 연속 보드가 있습니다.","so":"第一财经","tm":"11/16 17:17","c":1,"r":"cn","u":"https://www.yicai.com/news/103442076.html","p":1794817043,"a":1794830481,"t":"连板股追踪丨A股今日共33只个股涨停 这只机器人概念股4连板","su":"제일재경 2026-11-16 16:08:13 뉴스 듣기 저자: Gao Mingyan 편집자: Gao Mingyan 11월 16일 Wind 데이터에 따르면 A주 시장에서 총 33개 주식이 한도 상승을 보였습니다. 그 중 로봇 컨셉 주식인 Northern Wei Technology는 4회 연속 보드를 획득했고, 소매 부문 Guangbai Co., Ltd.는 3회 연속 보드를 획득했습니다. 오늘의 상장(주식시장에 처음 들어오는 것)주식을 하나의 차트로 간단히 살펴보기 >> Gao Mingyan 발전부문 민동전력은 6개의 연속보드가 있고, PCB 컨셉주인 아오홍전자는 4개의 보드가 연속되어 있습니다. 오늘의 커넥티드주식을 한장의 사진으로 간략히 살펴보기 >> 전력분야의 4연결주인 민동전력과 PCB 컨셉주에서의 3연결보드인 초음파전자. 주식이 상장된 오늘의 주식 간략히 살펴보기 >> 농업 부문 Yasheng Group은 4주 연속 주식을 보유하고 있으며 Dunhuang Seed Industry는 3주 연속 주식을 보유하고 있습니다. 주식이 상장된 오늘의 주식 간략히 살펴보기>> 농업주 Wanxiang Denong이 6회 연속 상승했고, Xinsai Stock이 4회 연속 상승했습니다. AI 단편드라마 컨셉주 망고슈퍼미디어가 2회 연속 보드를 기록했다. 오늘 상장주식을 하나의 차트로 간략히 살펴보기 >> 혁신신약(세상에 처음 나온 새로운 약) 컨셉주 한센제약이 4보드 연속 상승을 기록했고, 골드 컨셉주 심천중화A가 3보드 연속 상승을 기록했습니다. 오늘의 상장주식을 한 장의 사진으로 간단히 살펴보기 >>"},{"s":"야스카와 전기, 경영 인력 육성","so":"日経ビジネス電子版","tm":"11/16 17:00","c":1,"r":"jp","u":"https://business.nikkei.com/atcl/gen/19/00961/","p":1794816000,"a":1794830489,"t":"安川電機、経営人材の育成","su":"오가와 마사히로 전 사장의 급속한 일을 받아 경영 톱에 재등판한 오가사와라 히로시 회장 겸 사장. 함께 그린 노선을 완수하고 그 뜻을 연결하기 위한 가장 큰 초점이 경영인력 육성이다. 컨설턴트와 AI가 “그러한 정답”을 내는 시대에 스스로의 머리로 회사의 미래를 그려내는 차대의 톱을 어떻게 판별하고 키워나갈 것인가. 수많은 위기를 극복해 온 톱의 각오를 듣는다."},{"s":"아이엘, '로봇손' 사업 진출…'아이엘핸드' 상표출원","so":"데일리안","tm":"11/16 15:19","c":1,"r":"kr","u":"https://www.dailian.co.kr/news/view/1715624/%EC%95%84%EC%9D%B4%EC%97%98-%EB%A1%9C%EB%B4%87%EC%86%90-%EC%82%AC%EC%97%85-%EC%A7%84%EC%B6%9C%EC%95%84%EC%9D%B4%EC%97%98%ED%95%B8%EB%93%9C-%EC%83%81-2026","p":1794809940,"a":1794812228,"su":"피지컬 인공지능(AI) 데이터 플랫폼 기업 아이엘은 아이엘이 휴머노이드(사람을 닮은 로봇) 로봇핸드 사업 강화를 위해 신규 브랜드 '아이엘핸드(ILHAND)'의 상표출원을 마쳤다고 16일 밝혔다. 이번 브랜드는 휴머노이드 로봇의 핵심 부품인 로봇핸드 분야에 특화돼 있다. 아이엘은 지난해 11월 휴머노이드 로봇 브랜드 '아이엘봇(ILBOT)' 상표출원을 통해 로봇 사업의 방향성"},{"s":"아이엘, 피지컬AI 핵심 부품 ‘로봇핸드’로 사업 확장","so":"서울경제","tm":"11/16 14:55","c":1,"r":"kr","u":"https://www.sedaily.com/article/20114902","p":1794808542,"a":1794812228,"su":"아이엘, 피지컬AI 핵심 부품 ‘로봇핸드’로 사업 확장 ‘아이엘핸드’ 브랜드 상표권 출원 휴머노이드(사람을 닮은 로봇) 사업 전략 핵심 축 완성 입력2026-11-16 14:55 피지컬AI 데이터 플랫폼 기업 아이엘(307180)이 로봇핸드 분야로 사업 영역을 확장한다. 이를 통해 휴머노이드 기반 피지컬AI 사업 역량 강화를 추진한다. 아이엘은 휴머노이드 로봇핸드 사업 확대를 위한 신규 브랜드 ‘아이엘핸드(ILHAND)’의 상표 출원을 완료했다고 16일 밝혔다."},{"s":"심천 APEC │ 뉴스 센터, AI 안경 매칭 전시 및 커피 머신 작동을 위한 휴머노이드 로봇 설치","so":"RTHK News","tm":"11/16 14:06","c":1,"r":"hk","u":"https://news.rthk.hk/rthk/ch/component/k2/1877974-20261116.htm","p":1794805560,"a":1794806476,"t":"深圳APEC｜新聞中心展示AI配眼鏡 設人形機械人操作咖啡機","su":"아시아태평양경제협력체 APEC 회의가 선전에서 열렸습니다. 선전은 26,000개의 첨단 기술 기업이 위치한 혁신의 도시입니다. 선전-홍콩-광저우 혁신 클러스터가 2년 연속 세계 1위를 차지했습니다. 하이테크는 일상생활과 통합됩니다. 프레스센터도 전시장으로 변신했다. 행사장에는 일반 차량을 직접 조작할 수 있는 휴머노이드(사람을 닮은 로봇) 로봇이 탑재됐다."},{"s":"삼기, 3분기 영업익 114억 전분기比 883%↑…“휴머노이드 로봇 부품 개발 확대 계획”","so":"이투데이","tm":"11/16 13:56","c":1,"r":"kr","u":"https://www.etoday.co.kr/news/view/2648685","p":1794804960,"a":1794806474,"su":"상반기 81억 적자 3개월 만에 만회…원자재(물건의 재료(석유·구리 등))가 안정ㆍ자회사 ESS 부문 호조 견인글로벌 기업 휴머노이드(사람을 닮은 로봇) 상체 프레임 개발 순항…하체ㆍ액추에이터로 영"},{"s":"美 군사용 휴머노이드 로봇 기업 '파운데이션', 임금 체불·자금 운용 논란","so":"로봇신문","tm":"11/16 11:37","c":1,"r":"kr","u":"https://www.irobotnews.com/news/articleView.html?idxno=49608","p":1794796678,"a":1794797239,"su":"미국 휴머노이드(사람을 닮은 로봇) 로봇 스타트업 '파운데이션 퓨처 인더스트리즈(Foundation Future Industries, 약칭 파운데이션)'가 자금난으로 직원 임금을 지"},{"s":"대만-미국 로봇 무인 차량 포럼은 8개의 대만-미국 협정 체결을 촉진했습니다. 산업 MOU | 핫 하이라이트 | 사업정보","so":"經濟日報","tm":"11/16 11:31","c":1,"r":"tw","u":"https://money.udn.com/money/story/5635/9877638?from=edn_newestlist_cate_side","p":1794796272,"a":1794797244,"t":"台美機器人無人載具論壇 促成8項台美產業MOU簽署 | 熱門亮點 | 商情","su":"글로벌 AI 물결이 가상 세계에서 물리적 세계(물리 AI)로 이동하면서 로봇과 무인 차량은 전 세계 군사 전략가들의 전쟁터가 되었습니다. 경제부 산업발전국의 지도 하에 \"대만-미국 로봇 × 무인 차량 × 첨단기술 공급망(부품·재료가 오가는 연결망) 매치메이킹 포럼\"이 중화민국 산업기술연구소와 무인 차량 시스템 산업 발전 협회(TUVIDA)가 주최하고 미국 하드웨어 혁신 플랫폼 Atomica가 공동 주최했습니다. 11월 11일, 12일 양일간 타이베이 그랜드 호텔에서 성대하게 개최되었습니다."},{"s":"충남 중학생들, 휴머노이드로봇 직업교육 프로그램 체험","so":"뉴시스","tm":"11/16 10:35","c":1,"r":"kr","u":"https://www.newsis.com/view/NISX20261116_0003869378","p":1794792935,"a":1794797239,"su":"[홍성=뉴시스] 유효상 기자 = 충남도 내 중학생들이 인간형(휴머노이드(사람을 닮은 로봇)) 로봇을 만나 미래 직업을 상상하는 체험을 하게 된다. 도내 중학생들은 인공지능·로봇 코딩 및 첨단 산업기술을 체험하는 시간을 갖는다.인간형 로봇 프로그래밍부터 미래 자동차·자율주행 로봇까지 상상의 미래가 현실로 펼쳐진다. 충남교육청(교육감 이병도)은 인공지능직업교육센터에서 도내 중학생.."},{"s":"LG전자, '엔비디아 로봇' 출시 앞두고 품질 확보 박차","so":"파이낸셜포스트","tm":"11/16 10:00","c":1,"r":"kr","u":"https://www.financialpost.co.kr/news/articleView.html?idxno=301043","p":1794790800,"a":1794792488,"su":"내년 1분기 이족보행 기반의 엔비디아 레퍼런스 로봇 공개를 앞둔 LG전자가 휴머노이드(사람을 닮은 로봇) 로봇 개발 초기 단계부터 안전과 품질을 확보하게 됐다.LG전자는 지난 13일"},{"s":"\"공장에 투입했더니 이럴 수가\"…中 로봇 줄줄이 '굴욕' [차이나 워치]","so":"한국경제","tm":"11/16 07:16","c":1,"r":"kr","u":"https://www.hankyung.com/article/202611135386i","p":1794780961,"a":1794784892,"su":"\"공장에 투입했더니 이럴 수가\"…中 로봇 줄줄이 '굴욕' [차이나 워치], 세계 놀라게 한 휴머노이드(사람을 닮은 로봇)의 민낯 공장 투입하자 드러난 실력 中 휴머노이드 로봇의 상용화 벽"},{"s":"오므론, 창약 실험을 자동화로 쌍팔 3 손가락 로봇 + α","so":"日本経済新聞","tm":"11/16 05:00","c":1,"r":"jp","u":"https://www.nikkei.com/prime/tech-foresight/article/DGXZQOUC1217S0S6A111C2000000","p":1794772800,"a":1794784909,"t":"オムロン、創薬実験を自動化へ 双腕3指ロボット＋αで","su":"오므론이 개발하는 쌍팔 3손가락의 상반신 로봇은 투명하고 얇은 마이크로플레이트도 잡는 오므론이 창약 분야의 실험 자동화를 위해 쌍팔 3손가락 손의 상반신 로봇(세미휴마노이드) 등을 개발하고 있다. 주로 표적 분자를 탐색하는 실험 현장을 상정하고 전용 지그를 필요로 하지 않는 것이 특징이다. 인간과의 공존을 전제로 환경 변화가 많이 좁은 실험실이라도 쉽게 도입할 수 있는 AI(인공지능) 로봇의 실현을 노린다. 이 기사의 3개의 포인트 ・쌍팔 3손가락의 상반신 로봇 등장, 위치 결정 지그 불필요로 투명 물체를 파지 ・작업마다 역할 분담, 구상 바퀴의 이동형 핸드 로봇은 미닫이 문도 자랑"},{"s":"CEO, 고급 주택 구입 위해 460만 달러 대출, 휴머노이드 로봇 스타트업 임금 위기 직면","so":"36Kr","tm":"11/16 04:39","c":1,"r":"cn","u":"https://www.36kr.com/p/4072064387143305","p":1794771540,"a":1794834749,"t":"CEO借460万美元购豪宅，人形机器人初创企业遭欠薪危机","su":"CEO, 맨션 구입 위해 460만달러 대출, 휴머노이드(사람을 닮은 로봇) 로봇 스타트업이 급여 위기에 직면했다. 미국의 휴머노이드 로봇 기업인 파운데이션 퓨처 인더스트리즈(Foundation Future Industries)가 지난 10월 30일 급여일을 놓쳤다. CNBC는 11월 14일 이 문제에 정통한 관계자를 인용해 보도 당시 기준으로 관련 급여가 아직 지급되지 않았다고 보도했다. 일부 직원들을 더욱 불만족스럽게 만든 것은 공동 창업자이자 CEO인 Sankaet Pathak이 집을 구입하기 위해 회사로부터 460만 달러를 빌렸다는 사실이었습니다. 공개 기록에 따르면 그의 이름을 딴 회사는 2025년 10월 캘리포니아 주 소살리토에 있는 저택을 같은 가격에 구입했습니다. CNBC에 따르면 Pathak은 재단의 단독 이사이며 회사의 대다수 지분(회사를 나눠 가진 몫)을 보유하고 있습니다. 대변인은 인터뷰 질문에 응답하지 않았습니다."},{"s":"AAEON 총괄 관리자 Lin Jianhong: 로봇 애플리케이션이 뜨거워지고 있습니다 - Daily","so":"工商時報","tm":"11/16 04:00","c":1," function prepHist(){                       // 달 경계(배열 위치) 미리 계산
  if(!HI || !HI.s || !HI.end) return;
  HI.n = dIdx(HI.end) + 1; HI.months = []; HI.av = [];
  for(var i=0;i<HI.n;i++){ var ok = false;      // GDELT 자료가 있는 날 (서버가 멈춰 통째로 빠진 날은 false)
    for(var t in HI.s){ for(var k in HI.s[t]){ if(HI.s[t][k][i] != null){ ok = true; break; } } if(ok) break; }
    HI.av.push(ok); }
  var y = +HI.since.slice(0,4), m = +HI.since.slice(5,7), ey = +HI.end.slice(0,4), em = +HI.end.slice(5,7);
  while(y < ey || (y === ey && m <= em)){
    var a = dIdx(y+'-'+('0'+m).slice(-2)+'-01'), ny = m===12 ? y+1 : y, nm = m===12 ? 1 : m+1;
    var b = Math.min(HI.n, dIdx(ny+'-'+('0'+nm).slice(-2)+'-01'));
    HI.months.push({y:y, m:m, a:a, b:b, full: b - a === dIdx(ny+'-'+('0'+nm).slice(-2)+'-01') - a});
    y = ny; m = nm;
  }
}
function hsum(th, a, b, rk){               // [a, b) 날짜 칸의 합 (국가 필터 반영) · 자료 없는 날(null)은 건너뜀
  var s = (HI.s||{})[th] || {}, n = 0;
  for(var k in s){ if(rk ? k !== rk : !(S.region==='all' || k===S.region)) continue;
    var arr = s[k]; for(var i=Math.max(0,a); i<Math.min(b, arr.length); i++) if(arr[i] != null) n += arr[i]; }
  return n;
}
function avn(a, b){ var n=0; for(var i=Math.max(0,a); i<Math.min(b, HI.n); i++) if(HI.av[i]) n++; return n; }   // 자료 있는 날 수
function years(){ var a = [], y0 = +HI.since.slice(0,4), ty = +HI.end.slice(0,4); for(var y=ty-1; y>=y0; y--) a.push(y); return a; }   // 다 지난 해 (최근 먼저)
function pickYear(){ var ys = years(); return ys.indexOf(S.ly) >= 0 ? S.ly : (ys[0] || +HI.end.slice(0,4)); }
function lperiod(){                        // [이번 a,b] [비교 a,b 또는 null] 이름
  var M = HI.months, last = M[M.length-1], lf = last.full ? M.length-1 : M.length-2, ty = +HI.end.slice(0,4);
  if(S.lp === 'lm' && lf >= 0){ var x = M[lf], p = M[lf-1];
    return [[x.a, x.b], p ? [p.a, p.b] : null, x.y+'년 '+x.m+'월', '전달 대비']; }
  if(S.lp === 'ty'){ var a = dIdx(ty+'-01-01'), pa = dIdx((ty-1)+'-01-01'), len = HI.n - a;
    return [[a, HI.n], pa >= 0 ? [pa, pa+len] : null, ty+'년 (1월 1일~'+HI.end.slice(5).replace('-','/')+')', '작년 같은 기간 대비']; }
  if(S.lp === 'yr'){ var yy = pickYear(), ya = Math.max(0, dIdx(yy+'-01-01')), yb = Math.min(HI.n, dIdx((yy+1)+'-01-01')), pa = dIdx((yy-1)+'-01-01');
    return [[ya, yb], pa >= 0 ? [pa, ya] : null, yy+'년 전체', yy-1+'년 대비']; }
  return [[0, HI.n], null, HI.since.slice(0,7).replace('-','.')+' ~ '+HI.end.replace(/-/g,'.')+' 전체', ''];
}
function mspark(th){                       // 달별 흐름 (작은 선, 진행 중인 달은 빼고)
  var M = HI.months.filter(function(x){ return x.full; }), vals = M.map(function(x){ var d = avn(x.a, x.b); return d ? hsum(th, x.a, x.b)/d : 0; });
  if(vals.length < 2) return '';
  var mx = Math.max.apply(null, vals.concat([1])), w = 64, h = 20;
  var pts = vals.map(function(v,i){ return (i*(w/(vals.length-1))).toFixed(1)+','+(h-2-(v/mx)*(h-4)).toFixed(1); }).join(' ');
  return '<svg class="spark" viewBox="0 0 '+w+' '+h+'" width="'+w+'" height="'+h+'" aria-hidden="true"><polyline points="'+pts+'" fill="none" stroke="var(--acc)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></svg>';
}
function ldetail(th){                      // 달별 막대 + 나라별 구성
  var M = HI.months, dn = M.map(function(x){ return avn(x.a, x.b); });
  var vals = M.map(function(x, i){ return dn[i] ? hsum(th, x.a, x.b)/dn[i] : 0; });   // 하루 평균 (자료 빠진 날 영향 없게)
  var mx = Math.max.apply(null, vals.concat([1])), W = chartW(), H = 120, bw = W/M.length;
  var bars = vals.map(function(v,i){
    var x = M[i], bh = Math.max(v ? 2 : 0, (v/mx)*(H-32)), bx = i*bw + 1, y = H-14-bh;
    return '<g class="bar"><rect x="'+bx.toFixed(1)+'" y="0" width="'+(bw-2).toFixed(1)+'" height="'+(H-14)+'" fill="transparent"/>'+
      '<rect x="'+bx.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+(bw-2).toFixed(1)+'" height="'+bh.toFixed(1)+'" rx="2" fill="var(--acc)"'+(x.full?'':' opacity=".55"')+'/>'+
      '<title>'+x.y+'년 '+x.m+'월'+(x.full?'':' (진행 중)')+' · 하루 평균 '+Math.round(v).toLocaleString()+'건 · 한 달 '+hsum(th, x.a, x.b).toLocaleString()+'건'+
      (dn[i] < x.b - x.a ? ' (자료 '+dn[i]+'일치)' : '')+'</title></g>';
  }).join('');
  var ticks = M.map(function(x,i){ return x.m===1 ? '<line x1="'+(i*bw).toFixed(1)+'" y1="'+(H-14)+'" x2="'+(i*bw).toFixed(1)+'" y2="'+(H-9)+'" stroke="var(--sub)"/>'+
      '<text x="'+(i*bw+2).toFixed(1)+'" y="'+(H-1)+'" class="ax">'+x.y+'</text>' : ''; }).join('');
  var axis = ticks + '<line x1="0" y1="'+(H-14)+'" x2="'+W+'" y2="'+(H-14)+'" stroke="var(--line)"/>'+
             '<text x="0" y="9" class="ax">최대 하루 평균 '+Math.round(mx).toLocaleString()+'건</text>';
  var P = lperiod(), parts = D.regions.filter(function(r){ return (HI.regions||[]).indexOf(r.k) >= 0; }).map(function(r){
    return [r, hsum(th, P[0][0], P[0][1], r.k)]; }).filter(function(x){ return x[1] > 0; }).sort(function(a,b){ return b[1]-a[1]; });
  var pm = parts.length ? parts[0][1] : 1;
  var rows = parts.map(function(x){
    return '<div class="crow"><span class="cl">'+esc(x[0].l)+'</span><span class="cb"><i style="width:'+Math.max(2, x[1]/pm*100)+'%"></i></span><span class="cn">'+x[1].toLocaleString()+'</span></div>';
  }).join('') || '<div class="note">이 기간 기사 없음</div>';
  return '<div class="det"><div class="dt">달별 하루 평균 뉴스 수 ('+HI.since.slice(0,4)+'년 1월~)'+(S.region==='all'?'':' · '+esc(RL[S.region]))+'</div>'+
    '<svg class="bars" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(th)+' 달별 뉴스 수">'+bars+axis+'</svg>'+
    '<div class="dt">'+esc(P[2])+' 나라별</div>'+rows+'</div>';
}
function renderLong(h){
  if(!HI){ loadHist(); $('main').innerHTML = h + '<p class="none">장기 추이를 불러오는 중…</p>'; return; }
  if(HI.err || !HI.s || !HI.months || !HI.months.length){ $('main').innerHTML = h + '<p class="none">장기 추이를 아직 받는 중이에요. 처음 한 번은 몇 시간 걸려요. 조금 뒤에 다시 열어 주세요.</p>'; return; }
  if(S.region === 'world'){ $('main').innerHTML = h + '<p class="none">장기 추이는 나라별(한국·미국·중국·대만·홍콩·일본·싱가포르)로만 셀 수 있어요. 위에서 \'전체\'나 다른 나라를 골라 주세요.</p>'; return; }
  var P = lperiod();
  h += '<p class="note">GDELT(전 세계 뉴스 기록) 자료 · 본문에 테마 단어가 나온 기사 수 · 일주일에 한 번 갱신 · '+esc(HI.end.slice(5).replace('-','/'))+'까지 · 업데이트 '+esc(HI.updated||'')+'</p>';
  if(!HI.complete) h += '<div class="warn">⏳ '+HI.since.slice(0,4)+'년 1월부터 자료를 아직 받는 중이에요. 다 받기 전엔 일부 테마·나라·연도가 0이나 빈칸으로 보여요. 자료 서버가 느려서 하루쯤 걸려요 (봇이 알아서 이어 받음).</div>';
  h += '<div class="seg lp">' + [['all','전체'],['lm','지난달'],['ty','올해'],['yr','연도별']].map(function(x){
    return '<button data-lp="'+x[0]+'" class="'+(S.lp===x[0]?'on':'')+'">'+x[1]+'</button>'; }).join('') + '</div>';
  if(S.lp === 'yr') h += '<div class="seg ly">' + years().slice().reverse().map(function(y){   // 옛날 → 최근 순서로 (기본 선택은 최근 해)
    return '<button data-ly="'+y+'" class="'+(pickYear()===y?'on':'')+'">'+y+'</button>'; }).join('') + '</div>';
  var dc = avn(P[0][0], P[0][1]), dp = P[1] ? avn(P[1][0], P[1][1]) : 0, span = P[0][1] - P[0][0];
  if(span - dc > 0) h += '<div class="warn">ℹ️ 이 기간 중 '+(span-dc)+'일은 GDELT 서버 사정으로 자료가 비어 있어요 ('+span+'일 중 '+dc+'일치). 합계는 그만큼 적게 잡히고, ▲▼ 비교는 하루 평균끼리 해요.</div>';
  var rows = (HI.themes||[]).map(function(th){ return {th:th, n:hsum(th, P[0][0], P[0][1]), p: P[1] ? hsum(th, P[1][0], P[1][1]) : null}; })
                            .sort(byN);
  ranks(rows, !!P[1] && dp > 0);
  var mx = rows.length ? Math.max(1, rows[0].n) : 1, total = 0; rows.forEach(function(r){ total += r.n; });
  h += '<div class="tot">'+esc(P[2])+(S.region==='all'?' · 7개 나라':' · '+esc(RL[S.region]))+' · 총 <b>'+total.toLocaleString()+'</b>건 <span class="chgnote">'+(P[1]?'('+P[3]+')':'')+'</span></div>';
  h += rows.map(function(r, i){
    var open = S.open['L'+r.th];
    return '<div class="srow'+(open?' open':'')+'" data-th="'+esc(r.th)+'" data-l="1">'+
      '<div class="sline">'+mv(r, i)+'<span class="rk">'+(i+1)+'</span><span class="sn">'+esc(r.th)+'</span>'+
      '<span class="sb"><i style="width:'+Math.max(r.n?2:0, r.n/mx*100)+'%"></i></span>'+
      '<span class="sc">'+r.n.toLocaleString()+'</span>'+(r.p===null ? '<span class="chg"></span>' : chg(r.n, r.p, dc, dp))+mspark(r.th)+'</div>'+
      (open ? ldetail(r.th) : '') + '</div>';
  }).join('');
  h += '<footer>· 순위 왼쪽 <span style="color:#f87171">▲</span>/<span style="color:#60a5fa">▼</span> = 비교 기간(전달·작년 같은 기간·전년)보다 몇 계단 오르고 내렸는지<br>· 오른쪽 작은 선 = '+HI.since.slice(0,4)+'년 1월부터 달별 흐름(하루 평균), 줄을 누르면 달별 그래프와 나라별 구성<br>'+
       '· 일별 집계(기사 제목 기준, 구글 뉴스)와 세는 방법이 달라 숫자 크기는 서로 비교하지 말고 흐름만 보세요<br>'+
       '· 한국·중국·일본 기사도 GDELT 가 영어로 번역해 둔 것을 영어 검색어로 셉니다 · 자료가 빠진 날은 0이 아니라 빈칸으로 둠</footer>';
  $('main').innerHTML = h;
}
document.addEventListener('click', function(e){
  var b = e.target.closest('.seg.lp button');
  if(b){ S.lp = b.dataset.lp; save('lp', S.lp); renderMain(); return; }
  var yb = e.target.closest('.seg.ly button');
  if(yb){ S.ly = +yb.dataset.ly; save('ly', S.ly); renderMain(); return; }
  var m = e.target.closest('.seg.sm button');
  if(m){ S.sm = m.dataset.sm; save('sm', S.sm); renderMain(); return; }
}, true);

openTab(S.tab);
refreshBreaking();
setInterval(refreshBreaking, 5 * 60 * 1000);
document.addEventListener('visibilitychange', function(){ if(!document.hidden) refreshBreaking(); });

// 기사를 누르면 먼저 한국어 요약 → 원문 볼지 선택
document.addEventListener('click', function(e){
  var c = e.target.closest('a.card'); if(!c) return;
  if(e.ctrlKey||e.metaKey||e.shiftKey) return;
  e.preventDefault();
  $('s-meta').innerHTML = c.querySelector('.meta').innerHTML;
  $('s-title').textContent = c.querySelector('.title').textContent;
  var o = c.querySelector('.orig'); $('s-orig').textContent = o ? o.textContent : '';
  var sm = c.dataset.s || '';
  $('s-sum').textContent = sm || '이 기사는 요약을 가져오지 못했어요. (사이트가 자동 접속을 막았거나 아직 준비 중)';
  $('s-sum').className = 's-sum' + (sm ? '' : ' empty');
  $('s-go').href = c.href;
  // 외국어 기사면 ✦ Gemini 버튼 보이기 (한국어 기사는 숨김)
  var foreign = !!o || !/[가-힣]/.test(c.querySelector('.title').textContent);   // 번역이 안 됐어도 외국 기사면 버튼 표시
  $('s-cs').hidden = $('s-ct').hidden = $('s-cnote').hidden = !foreign;
  if(foreign){
    // 원문을 열고, Gemini 가 '지금 화면'의 기사를 읽고 답하도록 요청 문장만 복사
    $('s-cs').href = $('s-ct').href = c.href;
    $('s-cs').dataset.q = '이 페이지의 기사 전체를 처음부터 끝까지 읽고 한국어로 요약해 줘. 핵심 내용 3~5줄, 그리고 투자자 입장에서 중요한 숫자와 의미를 짧게 정리해 줘.';
    $('s-ct').dataset.q = "너는 어려운 경제 뉴스를 초등학생도 이해할 수 있게 풀어 주는 친절한 번역가야.\n이 페이지의 뉴스 기사 전체를 쉬운 한국어로 번역해 줘.\n\n[가장 중요한 규칙]\n- 쉽게 쓰더라도 기사 내용은 정확해야 해. 사실을 빼거나, 바꾸거나, 지어내지 마.\n- 기사 순서대로, 빠지는 내용 없이 번역해 줘.\n\n[쉽게 쓰는 방법]\n1. 한 문장에는 한 가지 내용만 써 줘. 문장은 짧게.\n2. \"~습니다/~해요\"체로 친절하게 써 줘.\n3. 어려운 말은 쉬운 말로 바꾸고, 꼭 필요한 전문 용어는 처음 나올 때 괄호로 뜻을 풀어 줘.\n   (예: 금리(돈을 빌릴 때 내는 이자의 비율), 실적(회사가 번 돈과 성과), 주가(회사 주식 한 주의 가격))\n4. 한자어·외래어보다 쉬운 우리말을 먼저 써 줘. (예: 하락 → 떨어졌어요, 상승 → 올랐어요)\n5. 큰 숫자는 읽기 쉽게 바꾸되 정확한 값은 지켜 줘. (예: $2.5 billion → 25억 달러(약 3조 5천억 원쯤))\n   환율로 바꾼 값은 \"약\"을 붙여서 대략이라는 걸 알려 줘.\n6. 회사·사람 이름은 한국에서 부르는 이름으로 쓰고, 처음 나올 때만 괄호에 영어 이름을 적어 줘. (예: 엔비디아(Nvidia))\n7. 누가 한 말인지 분명하게 써 줘. (예: 젠슨 황 대표는 \"…\"라고 말했어요.)\n\n[출력 형식]\n① 한 줄 요약: 이 기사가 무슨 이야기인지 한 문장으로\n② 쉬운 번역: 기사 순서대로\n③ 어려운 말 풀이: 기사에 나온 경제 용어 3~5개를 한 줄씩 쉽게 설명\n④ 그래서 무슨 뜻이야?: 이 소식이 주식 투자하는 사람에게 왜 중요한지 2~3줄\n   (기사에 나온 사실만 근거로, 내 생각이나 예측은 넣지 마)\n\n기사가 길어서 한 번에 다 못 하면, 어디까지 했는지 알려 주고 내가 \"계속\"이라고 하면 이어서 해 줘.";
  }
  $('dim').hidden = false; $('sheet').hidden = false; $('sheet').scrollTop = 0;
  document.body.style.overflow = 'hidden';
});
// ✦ 버튼: Gemini 요청 문장을 복사하고 원문을 엶 → 원문 화면에서 Gemini 를 불러 붙여넣기
function askAI(a){
  var q = a.dataset.q || '';
  try { if(navigator.clipboard) navigator.clipboard.writeText(q); } catch(e){}
  toast('요청 문장을 복사했어요 · 원문에서 측면 버튼 길게 → 「이 페이지에 관해 질문하기」 → 붙여넣기');
  setTimeout(closeSheet, 50);
}
function toast(msg){ var t = $('toast'); t.textContent = msg; t.hidden = false; clearTimeout(toast._t); toast._t = setTimeout(function(){ t.hidden = true; }, 4000); }
function closeSheet(){ $('dim').hidden = true; $('sheet').hidden = true; document.body.style.overflow = ''; }
document.addEventListener('keydown', function(e){ if(e.key==='Escape') closeSheet(); });
