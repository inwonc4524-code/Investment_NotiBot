.meta{color:var(--sub);font-size:12px}
.title{font-weight:500;margin-top:3px}

.new{margin-left:4px;color:var(--red);font-size:11px;font-weight:700;letter-spacing:.3px}
.hot{display:inline-block;margin-right:6px;padding:0 6px;border-radius:4px;background:rgba(217,119,87,.16);color:var(--acc);font-weight:600}
.hot.big{background:var(--acc);color:#1f1e1d}

footer{margin:36px 4px 0;padding-top:14px;border-top:1px solid var(--line);color:var(--sub);font-size:12px;line-height:1.7}

#sheet{position:fixed;left:0;right:0;bottom:0;z-index:6;max-width:760px;margin:auto;max-height:82vh;overflow-y:auto;
  background:var(--card);border-radius:16px 16px 0 0;padding:10px 18px calc(18px + env(safe-area-inset-bottom));box-shadow:0 -8px 30px rgba(0,0,0,.4)}
.grab{width:38px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 12px}
.s-title{font-size:17px;font-weight:600;margin:4px 0 2px;line-height:1.45}

.s-sum{font-size:15px;line-height:1.75}.s-sum.empty{color:var(--sub);font-size:13.5px}
.s-btns{display:flex;gap:8px;margin-top:20px}

  background:var(--acc);color:#1f1e1d;font-weight:600}
.s-btns a.cl{background:transparent;border:1px solid var(--acc);color:var(--acc)}
.s-close button{width:100%;margin-top:8px;padding:11px;border-radius:10px;background:transparent;border:1px solid var(--line);color:var(--sub);font:inherit;font-size:14px}
.s-cnote{margin-top:8px;color:var(--sub);font-size:11.5px;text-align:center}
#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);z-index:9;max-width:90%;padding:10px 16px;border-radius:10px;background:#faf9f5;color:#1f1e1d;font-size:13.5px;box-shadow:0 6px 20px rgba(0,0,0,.4)}
.seg{display:flex;gap:4px;margin:6px 4px 10px}.seg button{flex:1;min-width:0;border:1px solid var(--line);background:transparent;color:var(--sub);border-radius:8px;padding:7px 0;font:inherit;font-size:12.5px;white-space:nowrap}
.seg.ly{margin-top:-4px}.seg.ly button{padding:5px 0;font-size:12px}.seg.ly button.on{background:var(--card2);border-color:var(--acc);color:var(--text);font-weight:600}
.seg.sm{margin-bottom:8px}.seg.sm button{padding:9px 0;font-size:13px}.seg.sm button.on{background:var(--card2);border-color:var(--acc);color:var(--text)}
.notes{margin:0 4px 10px}.helpl{margin:4px 0 0;padding:8px 10px 8px 26px;border-radius:8px;background:var(--card2);font-size:12.5px;line-height:1.6;color:var(--text)}.helpl li{margin:2px 0}.notes summary{cursor:pointer;font-size:13px;color:var(--sub);padding:6px 10px;border-radius:8px;background:rgba(250,204,21,.08);list-style:none}.notes summary::-webkit-details-marker{display:none}.notes summary:before{content:"▸ ";}.notes[open] summary:before{content:"▾ ";}.notes[open] summary{margin-bottom:6px}.notes .warn{margin:0 0 6px}.warn{margin:0 4px 10px;padding:8px 10px;border-radius:8px;background:rgba(250,204,21,.08);color:var(--sub);font-size:12.5px;line-height:1.5}.warn b{color:var(--text)}
.seg button.on{background:var(--acc);border-color:var(--acc);color:#1f1e1d;font-weight:600}
.tot{margin:2px 4px 10px;color:var(--sub);font-size:13px}.tot b{color:var(--text)}.chgnote{font-size:11px}
.srow{background:var(--card);border-radius:12px;margin:6px 0;padding:10px 12px;cursor:pointer}.srow.open{background:var(--card2)}
.sline{display:flex;align-items:center;gap:8px}
.rk{width:18px;color:var(--sub);font-size:12px;text-align:right;flex:none}

.spark{flex:none}
.det{margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.dt{color:var(--sub);font-size:12px;margin:6px 0 4px}
.bars{width:100%;height:auto;display:block}.bars .ax{fill:var(--sub);font-size:10px}.bars .bar:hover rect+rect{opacity:.8}

@media(max-width:400px){.spark{display:none}.sn{width:74px}}

를 발휘하고 리튬 산업 위험 관리 도구를 더욱 강화할 것입니다."},{"s":"엔비디아와 AI로 인해 주식 시장이 하락했습니다. 주식은 월요일 상승세의 일부를 지운다","so":"The New York Times","tm":"11/24 22:14","c":5,"r":"us","u":"https://www.nytimes.com/2026/11/24/business/stocks-sp500-huang-nvidia.html","p":1795526093,"a":1795530448,"t":"Stock Markets Slip as Nvidia and A.I. Stocks Erase Some of Monday’s Rally"},{"s":"JP모건은 AI 슈퍼 사이클이 아직 끝나지 않았으며 S&P500은 내년 말까지 14% 상승 여지가 있다고 말했습니다.","so":"第一财经","tm":"11/25 11:16","c":3,"r":"cn","u":"https://www.yicai.com/video/103453292.html","p":1795572972,"a":1795589863,"t":"摩根大通称AI超级周期未结束 标普500指数明年底前仍有14%上涨空间"},{"s":"AI 무역 의심 재부상으로 아시아 주식 하락: 시장 요약","so":"Bloomberg.com","tm":"11/25 10:46","c":3,"r":"us","u":"https://www.bloomberg.com/news/articles/2026-11-24/asian-stocks-to-slide-as-ai-trade-doubts-resurface-markets-wrap","p":1795571160,"a":1795574586,"t":"Asian Stocks to Slide as AI Trade Doubts Resurface: Markets Wrap"},{"s":"젠슨 황이 돌아왔고 2018년에도 마찬가지입니다! 골드만삭스 \"미국 증시 급등은 하락장 반등일 뿐\" 경고","so":"鉅亨網","tm":"11/25 08:22","c":3,"r":"tw","u":"https://news.cnyes.com/news/id/6671180","p":1795562567,"a":1795565153,"t":"黃仁勳回來了 2018也回來了！高盛警告：美股暴漲只是熊市反彈","su":"젠슨 황이 엔비디아의 CEO로 복귀하면서 미국 증시는 강한 반등을 보였고 나스닥 100 지수는 약 7% 상승했습니다. 그러나 골드만삭스는 이번 파동이 숏커버링의 약세장 반등에 가깝다고 말했다.\n골드만삭스는 투자 등급 회사채 스프레드가 약 0.13%포인트(퍼센트끼리 뺀 차이)만큼 확대되고 2년 인플레이션(물건값이 계속 오르는 것) 스왑 금리가 2.09%로 하락하는 등 신용 시장이 주식보다 뒤처졌다고 말했습니다.\n씨티는 2026년을 2018년과 비교하며 순환주, 기술주, 의료주가 약세를 보였으며 시장 압력이 계속 확산될 수 있다고 밝혔습니다."},{"s":"미국 주식의 늦은 거래 | 다우지수는 293포인트 상승하고 나스닥지수는 1.9% 하락하는 등 미국 3대 주가지수가 각각 상승 또는 하락했습니다. 전체 - 뉴스 - 미국 주식","so":"etnet 經濟通","tm":"11/25 05:02","c":3,"r":"hk","u":"https://www.etnet.com.hk/www/tc/us-stocks/news-article/418046/%E7%BE%8E%E8%82%A1%E5%B0%BE%E7%9B%A4+%7C+%E7%BE%8E%E8%82%A1%E4%B8%89%E5%A4%A7%E6%8C%87%E6%95%B8%E5%90%84%E6%9C%89%E5%8D%87%E8%B7%8C%EF%BC%8C%E9%81%93%E6%8C%87%E5%8D%87293%E9%BB%9E%EF%BC%8C%E7%B4%8D%E6%8C%87%E6%8C%AB1.9%25","p":1795550520,"a":1795574619,"t":"美股尾盤 | 美股三大指數各有升跌，道指升293點，納指挫1.9% | 全部 - 新聞 - 美股"},{"s":"캐슬증권은 시장이 2018년과 같은 실수를 반복할 수 있으며 어려운 시기는 아직 끝나지 않았다고 경고 | 미국 증시 동향 | 국제","so":"經濟日報","tm":"11/24 23:13","c":3,"r":"tw","u":"https://money.udn.com/money/story/123398/9897832","p":1795529608,"a":1795530461,"t":"城堡證券警告市場恐重蹈2018年覆轍 苦日子還沒有結束 | 美股動態 | 國際","su":"[블룸버그] -- 연준(미국의 중앙은행)이 점점 매파적(금리를 올리자는 쪽)으로 변하는 가운데 금융 시장은 경제 성장 전망이 악화된다는 신호를 보내고 있다고 Castle Securities의 한 전략가는 경고했습니다. 이는 2018년 말 위험 자산의 급격한 매도 이전에 일어난 일을 반영한 것입니다."},{"s":"팀 쿡은 S&P500 기업 중 489개 기업을 9,030억 달러에 인수할 수 있었습니다. 대신 그는 애플을 영원히 변화시킬 무언가를 구입했습니다.","so":"Yahoo Finance","tm":"11/25 18:26","c":2,"r":"us","u":"https://finance.yahoo.com/markets/stocks/articles/tim-cook-could-purchased-489-092602839.html","p":1795598762,"a":1795608118,"t":"Tim Cook Could Have Purchased Any of 489 S&P 500 Companies With $903 Billion. Instead, He Bought Something That Transformed Apple Forever.","su":"애플의 전 상사는 자신이 월스트리트에서 가장 매력적인 자산이라고 생각하는 자산을 구입했습니다."},{"s":"이번 주 미국 증시는 인플레이션과 연준의 이중 테스트에 직면해 있습니다! 법무법인은 방어배치 권고, AI주 매도압력은 여전히 변수","so":"經濟日報","tm":"11/25 15:04","c":2,"r":"tw","u":"https://money.udn.com/money/story/5607/9901119","p":1795586696,"a":1795589867,"t":"美股本周迎通膨、Fed 雙重考驗！法人建議防守布局 AI 股賣壓仍是變數","su":"이번 주 미국 증시는 10월 미국 개인소비지출(PCE) 물가지수, 연준 베이지북 등 중요한 경제 이벤트를 가져올 예정입니다. 시장의 관심은 인플레이션(물건값이 계속 오르는 것) 추세, AI 산업의 이익 전망, 연준의 후속 금리 정책에 쏠릴 것이다. 법인 관계자는 엔비디아 젠슨 황 CEO의 복귀로 시장 신뢰도가 높아졌지만 AI 주식의 높은 가치 평가, 자본 지출(공장·장비 등에 쓰는 큰돈) 수익, 칩 수출 통제에 대한 우려는 가라앉지 않았다고 지적했습니다. 게다가 연준의 금리정책에 대한 시장의 기대는 더욱 보수적으로 변했다. 단기적으로는 여전히 미국 주식에 대한 평가를 수정하라는 압력이 있을 것으로 예상되며 투자 전략은 방어적이고 균형 잡힌 배분을 유지해야 한다."},{"s":"미국 정세 + 연준 금리인상 우려, 10월 제조업 테스트포인트 거절, 서비스업 4년 연속 하락세","so":"經濟日報","tm":"11/25 13:11","c":2,"r":"tw","u":"https://money.udn.com/money/story/10869/9900780","p":1795579893,"a":1795582080,"t":"美國政局+聯準會升息疑慮 10月製造業營業測驗點轉下跌服務業連四跌","su":"오늘 대만 경제 동향 조사가 발표되었습니다. AI 관련 수요는 여전히 우호적이지만 미국 중간선거 변화로 인해 AI 데이터센터(컴퓨터 수만 대를 모아 둔 건물) 구축에 대한 조사가 강화될 수 있다. 연준의 금리 인상(이자 비율을 올리는 것)에 대한 우려와 함께 제조업체들은 미래 번영에 대한 견해가 더욱 보수적이 되었습니다. 제조업 풍토 테스트 포인트가 하락세로 돌아섰고, 서비스업은 4개월 연속 하락세를 이어갔다. 건설업 시험점수는 2개월 연속 상승했지만 상승 폭이 제한적이어서 제조업체들의 경기 전망이 지난달과 거의 비슷한 것으로 나타났다."},{"s":"AI 투자는 강세 패턴 바꾸지 않고 미국 증시 지지, 내년에도 13% 더 오를 것으로 예상","so":"MoneyDJ","tm":"11/25 12:50","c":2,"r":"tw","u":"https://www.moneydj.com/kmdj/news/newsviewer.aspx?a=eb41f014-1094-40c5-8e22-9d3b9dfd663d","p":1795578600,"a":1795582084,"t":"AI投資撐盤美股不改多頭格局 明年有望再漲13%","su":"최근 미국 증시는 AI 투자에 대한 의구심에 휩싸이며 극심한 등락을 겪었지만 월스트리트 애널리스트들은 여전히 시장 전망을 낙관하고 있다. 최근 로이터 조사에 따르면 전문가들은 S&P500(미국 큰 회사 500곳의 주가를 합쳐 만든 점수)지수가 2027년 말까지 24일 종가 7,201.09포인트보다 13.2% 오른 8,150포인트까지 오를 것으로 예상하며, 아직 두 자릿수 상승 여지가 남아 있다고 내다봤다. 도로..."},{"s":"스페이스X, S&P500 조기 진입 예상, 패시브 매수 효과 기대 가능 - 국제","so":"工商時報","tm":"11/25 12:14","c":2,"r":"tw","u":"https://www.ctee.com.tw/news/20261125700965-430702","p":1795576440,"a":1795582082,"t":"SpaceX有望提前進標普500 被動買盤效應可期- 國際","su":"엘론 머스크의 우주회사 스페이스X(SPCX.US)와 전기차 제조사 테슬라(TSLA.US)가 합병을 논의 중인 것으로 전해졌다. JP모건 분석에 따르면 두 당사자가 성공적으로 합병할 경우 스페이스X는 S&P500(미국 큰 회사 500곳의 주가를 합쳐 만든 점수) 지수 구성종목 자격을 사전에 확보해 패시브 펀드의 매수를 유치하고 주가 상승 모멘텀(값이 움직이는 기세)을 가져올 것으로 예상된다. 로이터는 JP모건이 24일 발표했다고 보도했다."},{"s":"미국 소비자주가 전반적으로 상승했고, 나이키는 5.89% 상승 | 미국 증시 마감 리뷰","so":"经济观察网","tm":"11/25 10:07","c":2,"r":"cn","u":"http://www.eeo.com.cn/2026/1125/1101670.shtml","p":1795568820,"a":1795574589,"t":"美股消费板块全线上涨，耐克涨5.89%丨美股复盘","su":"동부 표준시 기준 11월 24일에는 소비자 소매 부문이 상승했습니다. 나이키는 약 6% 상승했고, 코카콜라와 월마트는 약 2% 상승했습니다. 이날 AI 하드웨어 업종은 약세를 보이며 필라델피아 반도체(전자기기 속에서 계산하고 기억하는 작은 부품) 지수는 8% 가까이 하락했다. 다우존스산업평균지수는 암젠, 나이키, 세일즈포스 등 구성종목의 상승으로 상승세(오르는 흐름)를 보였다. 11월 24일 마감 기준, 나이키는 5.89% 상승한 $35.75로 마감했습니다. 월마트는 2.11% 상승한 $132.31로 마감했습니다. 코스트코는 2.23% 오른 $1,091.71에 마감했습니다. 홈디포은 2.20% 오른 $353.69에 마감되었습니다. 코카콜라는 1.81% 상승한 $97.62로 마감했습니다. 펩시콜라 1.76% 상승한 $142.68로 마감했습니다. P&G은 1.69% 오른 $172.47에 마감했습니다. 맥도날드는 1.56% 상승한 $280.7로 마감했습니다. 어도비는 3.62% 오른 $232.08에 마감했습니다. 넷플릭스는 1.33% 오른 $58.87에 마감했습니다. 스타벅스는 0.02% 상승한 $106.38에 마감했습니다."},{"s":"순자산은 261억 달러로 13억 달러만 남았습니다! '월스트리트의 늑대왕' 부채 부담 44억 달러, 내년 위기로 이어질 수도","so":"自由財經","tm":"11/25 09:54","c":2,"r":"tw","u":"https://ec.ltn.com.tw/article/breakingnews/5652380","p":1795568092,"a":1795574606,"t":"261億美元身價慘剩13億美元！「華爾街狼王」44億美元債務壓頂 明年恐爆危機","su":"[금융채널/종합리포트] 한때 월스트리트를 석권하며 순자산(가진 재산에서 빚을 뺀 것) 261억 달러(약 NT$8594억7300억), '월스트리트의 늑대왕'을 보유했던 행동주의 투자자(회사 경영에 목소리를 내는 큰손 투자자) 칼 아이칸이 지금 그의 경력 중 가장 혹독한 재정 위기에 직면해 있다. 자회사 투자 제국 부채"},{"s":"한국 증시는 개장 후 추가로 5% 하락해 서킷브레이커가 발동됐다. 일본 주식도 하락했고, 미국 주식 선물도 하락했습니다.","so":"經濟日報","tm":"11/25 09:39","c":2,"r":"tw","u":"https://money.udn.com/money/story/5599/9900171","p":1795567181,"a":1795574599,"t":"韓股開盤又大跌5%觸發熔斷 日股也殺低 美股期指低迷","su":"오늘 아시아 증시 개장 이후 매도 압력이 재개되었습니다. 한국 코스피(한국 큰 회사들 주가를 합쳐 만든 점수) 지수는 한때 5% 이상 급락했다. 한국거래소는 SIDECAR 메커니즘을 활성화하고 프로그램 매도를 중단했습니다. 오전 미국 증시 필라델피아 반도체(전자기기 속에서 계산하고 기억하는 작은 부품)지수 급락으로 인해 반도체 회사들의 주가가 약세를 보이면서 AI 투자 붐이 이어질 수 있을지 시장이 다시 한 번 우려하는 모습이 반영됐다."},{"s":"JP모건 \"내년 S&P500 14% 더 오른다…AI 슈퍼사이클 여전히 유효\"","so":"뉴스1","tm":"11/25 09:37","c":2,"r":"kr","u":"https://www.news1.kr/world/usa-canada/6365144","p":1795567027,"a":1795574585},{"s":"시장개방포커스│미국 증시는 개별적으로 발전하고, 홍콩 주식은 6연속 손실 이후 안정될 것으로 예상","so":"TVB","tm":"11/25 09:37","c":2,"r":"hk","u":"https://news.tvb.com/sc/1208280-%E9%96%8B%E5%B8%82%E7%84%A6%E9%BB%9E%E7%BE%8E%E8%82%A1%E5%80%8B%E5%88%A5%E7%99%BC%E5%B1%95%E6%B8%AF%E8%82%A1%E5%85%AD%E9%80%A3%E8%B7%8C%E5%BE%8C%E6%96%99%E5%9B%9E%E7%A9%A9","p":1795567020,"a":1795574608,"t":"開市焦點｜美股個別發展 港股六連跌後料回穩","su":"미국 증시는 개별적으로 발전하고 있습니다. AI 주식의 또 다른 하락으로 나스닥과 필라델피아 반도체(전자기기 속에서 계산하고 기억하는 작은 부품) 지수가 하락했고 다우 지수는 상승했습니다. 홍콩 증시는 6연속 하락세를 보인 뒤 안정될 것으로 예상된다. 시장은 엔비디아, 앤트로픽, 관세 및 MLF 뉴스에 주목하고 있습니다. 미국과 홍콩 주식은 엇갈린 흐름을 보였습니다. AI 주가는 또 하락했고 나스닥은 1% 하락, 필라델피아 반도체 지수는 7% 하락, S&P500(미국 큰 회사 500곳의 주가를 합쳐 만든 점수)은 0.5% 하락, 다우 지수는 423포인트 상승했다. 홍콩 증시는 6연속 하락세를 보인 뒤 안정될 것으로 예상된다. 엔비디아와 앤트로픽 미국의 두 당사자는 엔비디아, 황에 압력을가했습니다 ..."},{"s":"미국 증시 마감/필라델피아 반도체 지수는 8% 추가 급락, 엔비디아는 6% 하락, 반도체주는 급락, 트럼프의 새로운 관세로 인해 매도 압력이 강화됨","so":"經濟日報","tm":"11/25 08:16","c":2,"r":"tw","u":"https://money.udn.com/money/story/123398/9900086?from=edn_search_result","p":1795562202,"a":1795565149,"t":"美股收盤／費半又暴跌8%、輝達跌6% 晶片股慘摔 川普新關稅加重賣壓","su":"S&P500(미국 큰 회사 500곳의 주가를 합쳐 만든 점수) 지수는 화요일(24일) 나스닥 지수가 1% 이상 하락하고 필라델피아 반도체(전자기기 속에서 계산하고 기억하는 작은 부품) 지수가 7.8% 급락하는 등 하락세로 마감했습니다. 반도체주의 매도가 다시 한번 시장을 끌어내렸습니다. 엔비디아를 비롯한 AI 관련 주식은 전날 상승분의 일부를 포기했고, 투자자들은 미국에서 가능한 새로운 관세 조치를 준비하고 있다."},{"s":"엔비디아는 월스트리트로부터 호평을 받았으며 대만 체인은 더 많은 수익을 추가했습니다.","so":"經濟日報","tm":"11/25 03:59","c":2,"r":"tw","u":"https://money.udn.com/money/story/5607/9899776","p":1795546771,"a":1795574601,"t":"輝達獲華爾街升評 台鏈添利多","su":"젠슨 황이 엔비디아의 사장, CEO 및 이사로 돌아왔고 월스트리트의 4개 기업이 서둘러 엔비디아의 투자 등급을 높였습니다. 법인 측은 황젠센의 복귀가 대만 주식의 AI 공급망(부품·재료가 오가는 연결망)에 도움이 될 것이라고 지적했다. AI 안개는 12월부터 점차 해소될 것으로 예상되며, 반도체(전자기기 속에서 계산하고 기억하는 작은 부품)와 AI 하드웨어 공급망 선두 기업에 대해 낙관하고 있다."},{"s":"POLL Bruised S&P500은 2027년 말까지 12% 이상 상승할 것으로 예상: 로이터 여론조사","so":"Reuters","tm":"11/25 03:50","c":2,"r":"us","u":"https://www.reuters.com/world/bruised-sp-500-seen-gaining-more-than-12-by-end-2027-2026-11-24/","p":1795546219,"a":1795565135,"t":"POLL Bruised S&P 500 seen gaining more than 12% by end-2027: Reuters poll"},{"s":"테슬라 합병 가능성은 스페이스X의 S&P500 진입에 도움이 될 수 있습니다, ⁠J.P. 모건 라고","so":"Reuters","tm":"11/25 02:45","c":2,"r":"us","u":"https://www.reuters.com/legal/government/possible-tesla-merger-could-aid-spacexs-sp-500-entry-jp-morgan-says-2026-11-24/","p":1795542322,"a":1795560755,"t":"Possible Tesla merger could aid SpaceX's S&P 500 entry, ⁠J.P. Morgan says"},{"s":"AI 주식은 엔비디아로 인한 급격한 상승 후 후퇴했고, 미국 증시는 하락세로 출발했습니다.","so":"經濟日報","tm":"11/25 00:21","c":2,"r":"tw","u":"https://money.udn.com/money/story/123398/9899809","p":1795533681,"a":1795560770,"t":"輝達所引發AI類股大漲回吐　美股開低","su":"엔비디아 젠슨 황 CEO(회사의 가장 높은 책임자) 복귀로 촉발된 인공지능(AI) 주식의 강세 상승세(오르는 흐름)가 오늘 약세를 보이면서 미국 증시는 하락세로 출발했다. 이번주 투자자들 기다려…"},{"s":"미국 반도체 주가 더 많이 하락: AMD는 9% 이상 하락, 마이크론은 거의 9% 하락","so":"Jiemian.com","tm":"11/24 23:43","c":2,"r":"cn","u":"https://www.jiemian.com/article/15369775.html","p":1795531427,"a":1795560759,"t":"美股半导体股跌幅扩大：AMD跌逾9%，美光跌近9%","su":"미국 반도체 업종은 필라델피아 반도체 지수가 6.17% 하락한 8996.18포인트를 기록하는 등 급락했다. 개별 종목별로 보면 AMD 9.55% 하락, 샌디스크 8.93% 하락, 마이크론 테크놀로지 8.75% 하락, 루멘텀 7.23% 하락, SK하이닉스 6.61% 하락, 코히런트 6.46% 하락, 어플라이드 머티리얼즈 6.24% 하락, 마벨 테크놀로지 6.23%, 램그룹 6.18% 하락, 엔비디아 6.02% 하락, 인텔은 5.80%, 브로드컴은 4.35%, TSMC는 3.47% 하락했다. 3배 롱 반도체 ETF(SOXL)는 18.97% 하락했다. 미국 반도체주 하락세가 확대됐다. AMD는 9% 이상 하락했고, 마이크론은 9% 가까이 하락했다. 원본 뉴스 출처: 제몐뉴스 AMD 4.9k - 필라델피아 반도체 지수는 한때 9% 이상 하락했습니다. - 주문이 지원을 위해 자금 조달(사업에 쓸 돈을 모으는 것)에 의존합니까? 엔비디아 이후 AMD도 공매도(주식을 빌려서 먼저 파는 것)를 당해 주가가 거의 8% 하락했습니다."},{"s":"미국 주식 조기 거래/엔비디아 카니발 썰물, 필라델피아 반도체 지수는 전날 상승폭의 거의 절반을 포기했고, VIX 지수는 한때 21% 급등 | 미국 증시 동향 | 국제","so":"經濟日報","tm":"11/24 23:42","c":2,"r":"tw","u":"https://money.udn.com/money/story/123398/9899680?from=edn_newest_index","p":1795531323,"a":1795560775,"t":"美股早盤／輝達狂歡退潮 費半回吐前日近半漲幅 VIX 指數一度飆升21% | 美股動態 | 國際","su":"미국 증시는 24일 오전 거래에서 하락세로 출발했다. 전날 젠슨 황의 엔비디아 복귀 격려에 힘입은 카니발 분위기는 사라졌습니다. 하루의 소화 끝에 시장은 점차 AI 투자가 계속해서 반등(내렸다가 다시 오르는 것)할 수 있을지 의심하기 시작했습니다. 또 블룸버그통신 등 미국 언론들은 미국이 이르면 이번 주부터 중국 본토와 유럽연합(EU) 등 12개국 이상에 대한 관세(수입품에 붙이는 세금)를 인상해 23일 인상폭이 일부 철회될 것이라고 보도했다."},{"s":"젠슨 황이 드라마틱하게 컴백했습니다! 엔비디아가 상승세를 주도한 후 칩 주가가 식은 후 미국 주식 선물이 하락 | 글로벌 금융 | 글로벌","so":"UDN","tm":"11/24 22:37","c":2,"r":"tw","u":"https://udn.com/news/story/6811/9899558?from=udn-ch1_breaknews-1-0-news","p":1795527465,"a":1795530460,"t":"黃仁勳戲劇性回鍋！輝達領漲後晶片股降溫美股期貨走跌| 全球財經| 全球","su":"엔비디아가 미국 주식을 놀라운 상승세로 이끈 후 오늘 반도체(전자기기 속에서 계산하고 기억하는 작은 부품)주가 냉각되어 미국 주식 선물이 하락했습니다. 한편, 투자자들은 연방 정부가 발표한 인플레이션(물건값이 계속 오르는 것) 데이터를 이번 주 말에 기다리고 있었습니다."},{"s":"S&P500 주식 시장 지수는 지난 금요일 조정 국면에 진입했습니다. 다음에 일어날 수 있는 일은 다음과 같습니다.","so":"The Globe and Mail","tm":"11/24 22:37","c":2,"r":"us","u":"https://www.theglobeandmail.com/investing/markets/markets-news/Motley%20Fool/8983902/the-sp-500-stock-market-index-entered-correction-territory-last-friday-here-s-what-could-happen-next/","p":1795527465,"a":1795560756,"t":"The S&P 500 Stock Market Index Entered Correction Territory Last Friday. Here's What Could Happen Next.","su":"요점 - 금리 상승과 인공지능 업계의 혼란으로 지난 주 S&P500(미국 큰 회사 500곳의 주가를 합쳐 만든 점수) 지수가 조정 국면(많이 오른 뒤 주가가 10% 넘게 내려온 때)에 빠졌습니다. - 이러한 역풍이 가라앉는 데는 시간이 걸리므로 단기적으로 매도세는 더욱 악화될 수 있습니다."},{"s":"미국 증시 공포지수 VIX 32 위로 상승","so":"第一财经","tm":"11/24 22:14","c":2,"r":"cn","u":"https://www.yicai.com/brief/103452735.html","p":1795526040,"a":1795530451,"t":"美股恐慌指数VIX升至32上方","su":"2026/11/24 21:14 [미국 증시 공황지수 VIX(앞으로 주가가 얼마나 출렁일지 보여 주는 '공포 지수')가 32를 넘어섰다] 미국 증시 공포지수(사람들이 주식시장을 얼마나 겁내는지 보여 주는 숫자) VIX가 이날 21.64% 상승해 32를 넘어섰다."},{"s":"12월 금리 인상 확률이 100%로 돌아왔습니다! '월스트리트의 늑대' 경고: 연준이 큰 실수를 할 수 있다","so":"财联社","tm":"11/24 17:24","c":2,"r":"cn","u":"https://www.cls.cn/detail/2542924","p":1795508649,"a":1795565146,"t":"12月加息概率重回100%！“华尔街之狼”警告：美联储恐铸成大错","su":"① \"월스트리트의 늑대\"로 알려진 억만장자 헤지펀드 매니저인 빌 애크먼은 최근 연준이 예상대로 12월 초에 금리를 인상한다면 실수를 할 것이라고 경고했습니다. ②그는 인플레이션(물건값이 계속 오르는 것)율을 2% 목표로 되돌리려는 연준의 시도가 경기 침체(나라 경제가 쪼그라드는 것)를 촉발할 수 있다고 말했습니다. ③ 연준이 12월에 금리를 인상할 확률은 조용히 100%로 높아졌습니다. 차이롄서, 11월 24일(편집자 Bian Chun) '월스트리트의 늑대'로 알려진 억만장자 헤지펀드 매니저 빌 애크먼은 최근 연준이 예상대로 12월 초 금리를 인상하면 실수를 할 것이라고 경고했다. 그는 연준이 인플레이션을 목표치인 2%로 되돌리려는 시도가 경기 침체를 촉발할 수 있다고 말했습니다."},{"s":"S&P500이 주요 추세선을 통과하는 것은 불길한 신호라고 역사는 시사합니다.","so":"MarketWatch","tm":"11/25 22:09","c":1,"r":"us","u":"https://www.marketwatch.com/story/s-p-500s-slide-through-a-key-trendline-again-is-an-ominous-sign-history-suggests-def8b99f","p":1795612140,"a":1795612492,"t":"S&P 500’s slide through a key trendline — again — is an ominous sign, history suggests"},{"s":"트럼프 입 열림, 미국 주식 전자 거래, 금 약세, 야간 거래에서 대만 지수 선물 하락","so":"經濟日報","tm":"11/25 22:04","c":1,"r":"tw","u":"https://money.udn.com/money/story/11112/9902068","p":1795611894,"a":1795612504,"t":"川普開金口 美股電子盤、黃金腳軟 台指期夜盤倒地","su":"대만지수선물은 미국증시 전자거래 하락세 확대 등에 힘입어 25일 밤 개장 당시 255포인트 하락한 37,868포인트에 개장했다. 장기 주문이 계속 빠져나가면서 트럼프 미국 대통령의 301항 신규 관세 발표로 인한 부정적 영향이 발효됐고, 이날 저녁 21시 30분 연준의 이번 결정이 발표됐다. 개인소비지출(PCE) 물가지수를 중심으로 상승세(오르는 흐름)는 감히 성급하게 행동하지 못했다. 나스닥(미국 기술 회사들이 많이 모인 주식시장) 전자거래의 하락세가 확대됐다. 지수는 1,464포인트 하락한 36,659포인트까지 도달했습니다. 저녁 21시쯤 현재 지수는 1,291포인트 하락한 약 36,832포인트를 기록하고 있다."},{"s":"연준이 브레이크를 적용한 것은 옳은 일이었는가? 전략가 모델은 올해 14.5%의 수익을 올리며 인플레이션이 후퇴하기 어려운 이유를 밝힙니다.","so":"鉅亨網","tm":"11/25 22:00","c":1,"r":"tw","u":"https://news.cnyes.com/news/id/6671740","p":1795611604,"a":1795612505,"t":"Fed踩煞車反而做對了？策略師模型今年賺14.5% 揭通膨難退原因","su":"다르다 채권 모델은 장단기 현금과 장기채권을 전환해 올해 14.5%의 수익률을 올렸는데, 이는 같은 기간 하락한 TLT-US보다 좋다. 그는 과열된 수요로 인해 인플레이션(물건값이 계속 오르는 것)이 후퇴하기 어렵게 될 것이라고 믿습니다. 4분기 민간 지출 증가율은 7%를 초과할 것으로 추정되며, 이는 연준의 긴축정책과 냉각을 뒷받침할 것입니다. S&P500(미국 큰 회사 500곳의 주가를 합쳐 만든 점수)은 10월 최고치보다 8% 하락했습니다. 그는 더 저렴한 기술, 임의 소비재 및 통신 서비스 주식을 선호합니다."},{"s":"미국 증시가 '터키 딜레마'에 빠질 위기에 처해 있는가? AI 잔치 뒤에 숨은 리스크, 핵심 평가지표가 빨갛게 변하다","so":"鉅亨網","tm":"11/25 21:47","c":1,"r":"tw","u":"https://news.cnyes.com/news/id/6671743","p":1795610855,"a":1795612506,"t":"美股恐陷「火雞困境」？AI盛宴背後藏風險 關鍵估值指標亮紅燈","su":"'블룸버그'는 AI 투자로 수년간 이익을 얻으면 극단적인 위험을 가릴 수 있다는 탈레브의 '칠면조 딜레마'를 경고했다. 젠슨 황이 사임한 후 엔비디아의 시가총액(회사 전체 몸값)은 약 1/3만큼 증발했습니다. 그의 복직 이후 이는 시장의 열광을 촉발했고 미국 주식의 취약성을 부각시켰습니다. Shiller의 CAPE(주가수익률)는 약 40배로, 역사적 표준인 16~18배를 훨씬 웃돌고 있습니다."},{"s":"베상은 월스트리트에서 부적절한 조세회피를 목표로 삼고 있습니다. 업계 상사들은 트럼프의 말을 인용하며 \"위에서 시작하는 것이 어떻겠습니까\"라고 말합니다 | 국제 포커스 | 국제","so":"經濟日報","tm":"11/25 21:33","c":1,"r":"tw","u":"https://money.udn.com/money/story/5599/9900515","p":1795609992,"a":1795612507,"t":"貝森特盯上華爾街不當避稅 業界大佬引川普之言表示「何不從上查起」 | 國際焦點 | 國際","su":"경제일보는 산업, 주식시장, 금융, 국제, 블룸버그, 칼럼 외에도 매일 실시간 금융 뉴스를 제공합니다. 또한 중요한 주제에 대해 조각화되고 상황에 맞는 심층 콘텐츠를 제작하여 해석, 분석, 구성, 선정된 주제, 전문가 의견 등을 제공하여 독자가 정보 조각화 문제를 해결할 수 있도록 돕습니다."},{"s":"S&P500 선물 개장 전 거래 하락; Carlisle Cos, Tradeweb 시장 지연","so":"Barron's","tm":"11/25 21:30","c":1,"r":"us","u":"https://www.barrons.com/articles/s-p-500-futures-drop-in-premarket-trading-carlisle-cos-tradeweb-markets-lag-d8800b3c","p":1795609800,"a":1795612493,"t":"S&P 500 Futures Drop in Premarket Trading; Carlisle Cos, Tradeweb Markets Lag"},{"s":"미국 주가 지수 선물 시간외 거래 나스닥 선물 일시 3% 저렴, 테크 주식 매도","so":"株探","tm":"11/25 21:25","c":1,"r":"jp","u":"https://news.google.com/rss/articles/CBMiUkFVX3lxTE01V3BsVkVZX1BkNzJmRGJfOEpQZ1lzalBaQVlhZ es S&P500(미국 큰 회사 500곳의 주가를 합쳐 만든 점수) Dividend Aristocrats ETF(NOBL)는 2013년 10월 9일에 출시되었으며 시장의 Style Box - Large Cap Value 카테고리에 폭넓은 노출을 제공하도록 설계된 스마트 베타 교환 거래 펀드(여러 사람 돈을 모아 전문가가 굴리는 것)입니다. 스마트 베타 ETF란 무엇입니까?"},{"s":"도이체방크는 9,000 목표를 가진 가장 큰 S&P500 Bulls 중 하나입니다.","so":"Bloomberg","tm":"11/25 19:06","c":1,"r":"us","u":"https://www.bloomberg.com/news/articles/2026-11-25/deutsche-bank-is-among-biggest-s-p-500-bulls-with-9-000-target","p":1795601213,"a":1795608119,"t":"Deutsche Bank Is Among Biggest S&P 500 Bulls With 9,000 Target"},{"s":"해외연구 및 선정 | 뱅크오브아메리카의 2027년 전망: AI 투자가 미국 경제의 가장 큰 변수가 되었고, 연준은 금리를 3배 인상할 것으로 예상됨","so":"财联社","tm":"11/25 19:03","c":1,"r":"cn","u":"https://www.cls.cn/detail/2544444","p":1795600980,"a":1795612497,"t":"海外研选 | 美银2027年展望：AI投资成美国经济最大变数 美联储料再加息三次","su":"① 뱅크오브아메리카는 미국의 실질 GDP가 2027년과 2028년에 각각 2.3%와 2.1% 성장할 것으로 예측하며, 기업 투자와 가계 소비가 주요 성장 동력으로 남아 있습니다. ② 탈세계화는 계속해서 원자재 인플레이션(물건값이 계속 오르는 것)을 촉진할 수 있으며, 뱅크오브아메리카는 핵심 PCE 인플레이션이 2027년 말까지 여전히 2.6%에 도달할 것이라고 예측합니다. ③ 미국 재정 적자와 미국 장기 채권 수익률이 악순환을 형성해 위험자산과 경제활동에 영향을 미칠 수 있다. 차이롄서, 11월 25일(편집자 Xia Junxiong) 뱅크오브아메리카는 미국 경제가 여전히 강한 회복력을 보이고 있지만 인공지능(AI) 투자 물결의 방향이 향후 2년 동안 미국 경제와 통화 정책의 궤적을 결정할 수 있다고 믿고 있습니다. 기업 투자가 계속 빠른 속도로 증가한다면 연준은 정책 금리를 5% 이상으로 인상해야 할 수도 있습니다. AI 자본 지출이 크게 둔화되면 미국 경제는 더 높은 경기 침체(나라 경제가 쪼그라드는 것) 위험에 직면하게 될 것이며 연준도 금리 인하로 전환할 수 있습니다."},{"s":"월스트리트는 \"비농업의 밤\"이라는 큰 시험에 직면해 있습니다. 오늘밤 나쁜 데이터가 좋은 소식일까요?","so":"财联社","tm":"11/25 19:01","c":1,"r":"cn","u":"https://www.cls.cn/detail/2474142","p":1795600915,"a":1795612500,"t":"华尔街迎来“非农夜”大考：今晚坏数据就是好消息？","su":"① 오늘 밤 20시 30분(베이징 시간) 미국 노동통계국(BLS)은 많은 기대를 모았던 8월 비농업 고용(농업을 뺀 일자리 수) 보고서를 발표할 예정입니다. ② 현재 주류 시장에서는 8월 미국의 신규 비농업 고용이 7월 23,000명을 저점으로 반등하여 55,000명 증가할 것으로 예상하고 있습니다. 실업률(일하고 싶은데 일자리가 없는 사람 비율)은 4.1%에 머물 것으로 예상되고, 시간당 임금 상승률은 전월 대비 0.3%로 반등할 것으로 예상된다. 차이롄서, 9월 4일(Editor Xiaoxiang) 베이징 시간으로 오늘 밤 20시 30분에 미국 노동통계국(BLS)이 큰 기대를 모았던 8월 비농업 고용 보고서를 발표할 예정입니다. 상대적으로 일자리 증가가 부족한 부진한 여름을 보낸 후, 이 보고서는 미국 경제가 '고용 증가 없는 여름'에 완전히 갇힐지 여부를 결정할 뿐만 아니라 연준 관리들이 9월 16일 금리 회의 전에 노동 시장 상황을 평가하는 퍼즐의 마지막 조각이 될 것입니다."},{"s":"연준 금리 인상 기대로 인해 금 거래가 15개월 만에 최저치에 근접","so":"Yahoo Finance","tm":"11/25 18:58","c":1,"r":"us","u":"https://finance.yahoo.com/markets/commodities/articles/gold-trades-near-15-month-095815319.html","p":1795600695,"a":1795608119,"t":"Gold Trades Near 15-Month Low as Federal Reserve Rate Hike Expectations Weigh on Prices","su":"미국 연방준비제도(연준)의 추가 통화 긴축과 달러 강세(미국 돈 달러 값이 오르는 것)에 대한 기대가 계속해서 귀금속에 부담을 주면서 금 가격은 수요일 하락해 15개월 만에 최저 수준에 근접했습니다. 투자자들은 세션 후반에 미국의 주요 인플레이션(물건값이 계속 오르는 것) 수치가 발표되기 전에 신중한 자세를 유지했으며, 이는 중앙은행의 12월 이자에 대한 기대에 영향을 미칠 수 있습니다."},{"s":"재무부 및 유럽 정부 채권 수익률이 PCE 인플레이션 데이터보다 앞서 하락","so":"WSJ","tm":"11/25 18:43","c":1,"r":"us","u":"https://news.google.com/rss/articles/CBMioAFBVV95cUxQWGhuNzRQQ2Z2ZWMwOFZPOTk4UXFxNWg4R09KdWVyVXItRnRQMnFJYkxvM3Flb1ktS2pJMFFqZXJodXM1ZXhpZ2hiOUoxTmRXMzZXVEtqZUF2emgyb0dfZm9xbVktNGJrSkZCTjdvZkVmQVItODZmZXdkX3lydHV2SUY4NzFWY3V6RnBlREg1RFhXa0hLaGt4MGRRbmhpQVpm?oc=5","p":1795599780,"a":1795612495,"t":"Treasury and European Government Bond Yields Fall Ahead of PCE Inflation Data"},{"s":"미국 증시가 전반적으로 급등하고 있고, 기술주도 급등하고 있는데, 트럼프가 다시 K라인을 그리고 있는 걸까? \"내가 해냈어\"! 전날 \"좋은 일이 일어나고 있다\"고 말했어요. 젠슨 황의 엔비디아 복귀를 지원하기 위한 마법의 변화 계획을 발표했습니다.","so":"每日经济新闻","tm":"11/25 18:34","c":1,"r":"cn","u":"https://www.nbd.com.cn/articles/2026-11-24/4657205.html","p":1795599240,"a":1795612501,"t":"美股全线暴涨，科技股猛拉，特朗普又在画K线？“是我促成的”！前一天刚说了“好事正在发生”；发魔改图力挺黄仁勋重返英伟达","su":"Mejing.com은 24시간 뉴스 웹사이트입니다. 최첨단 금융일간지 '매일경제뉴스'를 활용해 브랜드 가치, 자동차 정보, 영상, 펀드(여러 사람 돈을 모아 전문가가 굴리는 것), 금융, 부동산, 금융뉴스, 증권사, 기업 등을 다루는 중국 내 영향력 있는 뉴스 웹사이트를 구축하고 종합 금융뉴스 플랫폼이다."},{"s":"'주변기기 집중' 연준은 베이지북 발표, 미국은 개인소비 등 데이터 공개","so":"etnet 經濟通","tm":"11/25 18:06","c":1,"r":"hk","u":"https://www.etnet.com.hk/www/tc/news/news-article.php?section=categorized&category=latest&newsid=20261125070","p":1795597560,"a":1795608132,"t":"《外圍焦點》美聯儲發布褐皮書，美國公布個人消費等數據","su":"2026-11-25 17:06 \"Peripheral Focus\" 연준(미국의 중앙은행)은 베이지북을 발표하고, 미국은 개인 소비 및 기타 데이터를 공개합니다. 요약 면책 조항 이 내용은 기존 시장 데이터 및 뉴스 소스를 기반으로 인공 지능으로 생성되었으며 참고용입니다. 본 내용은 \"이코노믹스\"의 견해나 입장을 대변하지 않으며, 어떠한 투자조언도 구성하지 않습니다. AI가 생성한 정보에는 오류, 누락, 일탈 등이 있을 수 있으므로, 투자 결정을 내리기 전에 사용자가 직접 해당 내용을 확인하거나 전문가의 조언을 구해야 합니다. \"이코노믹스\"는 본 내용을 신뢰하여 발생하는 어떠한 손실이나 손해에 대해서도 책임을 지지 않습니다. ▷ 연준은 26일 오전 3시 베이지북을 발표한다. ▷ 미국은 오늘 밤 개인소비/내구재 주문 등 경제지표를 발표합니다. ▷ BOSS 다이렉트 채용 등 업체들이 오늘 결과를 발표할 예정입니다. 각국의 중요한 경제활동과 관련하여 오늘 밤 현지시간 오후 8시 25분에 보먼 연준 금융감독 부의장이 사전 녹화된 영상을 통해 은행 감독에 대한 연설을 했습니다. 오후 10시 15분에는 베일리 영란은행 총재, 롬바델리 부총재, 통화정책위원회(MPC) 위원 맨과 딩그라 위원이 영국 의회 재정위원회 청문회에 참석할 예정입니다. 연준은 26일 오전 3시 베이지북을 발표했다."},{"s":"연준의 금리 인상에 대한 기대가 금 주식의 성과를 억제했습니다. China Gold International은 한때 4% 이상 하락했습니다.","so":"财联社电报","tm":"11/25 18:04","c":1,"r":"cn","u":"https://m.cls.cn/detail/2543773","p":1795597485,"a":1795612502,"t":"美联储加息预期压制黄金股表现 中国黄金国际一度跌超4%","su":"차이롄서, 11월 25일 (편집자 Hu Jiarong) 오늘 오전 거래에서 대부분의 홍콩 귀금속 주식은 약세를 보였습니다. 그 중 차이나 골드 인터내셔널(China Gold International)은 한때 4% 이상 하락한 후 일부 주식이 상승하기 시작했습니다. 보도 시간 현재 Zijin Gold International(02259.HK)은 2.51% 상승, Lingbao Gold(03330.HK)는 2.12% 상승, China Gold International(02099.HK)은 1.74% 상승, Zhaojin Mining(01818.HK)은 1.37% 상승했습니다. 뉴스에 따르면 국제 금값은 지난주 9% 가까이 하락한 뒤 월요일 3,600달러 이상으로 반등했다가 화요일 다시 하락해 현재 3,600달러 이하로 떨어졌다. 윌리엄스 뉴욕 연준 총재는 연준이 여전히 물가를 낮추기 위해 해야 할 일이 많다며 필요하다면 연속 금리 인상(이자 비율을 올리는 것) 가능성도 배제하지 않는다고 말했습니다. CME의 \"페드워치\"에 따르면, 12월에 연준(FRB)가 금리를 0.25%포인트(퍼센트끼리 뺀 차이) 인상할 확률은 95.9%로 올랐고, 금리를 0.5%포인트 인상할 확률은 약 4%입니다. 내년 1월까지 누적 0.5%포인트 금리 인상 확률은 65%를 넘는다."},{"s":"주요 암호화폐 가격, 비트코인 0.90% 하락 | 모두 - 뉴스 - 미국 주식","so":"etnet 經濟通","tm":"11/25 18:00","c":1,"r":"hk","u":"https://www.etnet.com.hk/www/tc/us-stocks/news-article/418147/%E4%B8%BB%E8%A6%81%E5%8A%A0%E5%AF%86%E8%B2%A8%E5%B9%A3%E8%A1%8C%E6%83%85%EF%BC%8C%E6%AF%94%E7%89%B9%E5%B9%A3%E8%B7%8C0.90%25","p":1795597200,"a":1795608134,"t":"主要加密貨幣行情，比特幣跌0.90% | 全部 - 新聞 - 美股","su":"최신 미국 증시 뉴스 및 정보를 제공하여 주식 시장 동향을 파악할 수 있습니다. 당신이 투자자이거나 주식시장에 관심이 있는 사람이라면 주식시장 동향과 투자 동향을 이해하는 데 도움이 되는 실시간 주식시장 차트, 전문가 분석, 기업 뉴스 리포트 등 oney.udn.com/money/story/122381/9901311","p":1795591094,"a":1795608130,"t":"等到了「黃仁勳賣權」 華爾街等得到聯準會轉向嗎？ | 外媒解析 | 國際","su":"젠슨 황이 사임하는 동안 미국 증시는 폭락했고, 미국 중앙은행(나라의 돈과 이자를 관리하는 은행)이 중대한 정책 실수를 저지르게 될 것이라고 믿고 연준에 금리 인상(이자 비율을 올리는 것)을 중단하라는 월스트리트의 요구가 커졌다. 결국 트럼프와 엔비디아 이사회는 젠슨황을 복직시키기 위한 '젠슨황 풋옵션'을 내놨고, 통화정책 전환으로 시장이 기대했던 구제효과가 마음껏 발휘됐고, 미국 증시는 일시적으로 출혈을 멈췄다. 하지만 연준이 이를 풀었나요? 다음에는 금리를 인상할까요?"},{"s":"금융 전쟁 보고서 │ 미국 증시가 강세장 조정을 겪고 있거나 약세장이 시작되고 있습니까?","so":"TVB","tm":"11/25 16:06","c":1,"r":"hk","u":"https://news.tvb.com/sc/1208362-%E8%B2%A1%E9%87%91%E6%88%B0%E5%A0%B1%E7%BE%8E%E8%82%A1%E7%89%9B%E5%B8%82%E8%AA%BF%E6%95%B4%E6%88%96%E7%86%8A%E5%B8%82%E9%96%8B%E5%A7%8B","p":1795590360,"a":1795608135,"t":"財金戰報｜美股牛市調整或熊市開始？","su":"뉴스 라이브 홍콩 뉴스 양안 국제 금융 스포츠 라이프 스타일 이슈 뉴스 핫 토픽 프로그램 게시일: 2026-11-25 15:06 작성자: Wireless News 미국 주식에 대한 시장의 의견은 엇갈립니다. 모건스탠리와 같은 친구들은 지금이 매수하기에 좋은 시기라고 믿습니다. East Asia Securities의 수석 투자 전략가인 Chen Weicong도 이에 동의합니까? 전략을 배포하는 방법은 무엇입니까?"},{"s":"S&P 2027 목표가 공개되었습니다! JP모건 8200은 월스트리트 바닥에 있다: AI 이익이 아무리 높아도 금리 상한선과 경쟁할 수 없다","so":"鉅亨網","tm":"11/25 15:40","c":1,"r":"tw","u":"https://news.cnyes.com/news/id/6671652","p":1795588804,"a":1795589864,"t":"標普2027目標出爐！小摩8200墊底華爾街：AI獲利再強也敵不過利率天花板","su":"JP모건은 S&P500(미국 큰 회사 500곳의 주가를 합쳐 만든 점수)이 2027년 말까지 8,200포인트에 이를 것으로 추정했는데, 이는 현재 가격 대비 약 14% 상승 여력이 있다는 뜻으로 골드만삭스와 모건스탠리의 8,700포인트보다 낮다. 주된 이유는 \"이익이 바닥을 뒷받침하고 금리가 상한선을 밀어낸다\"는 것입니다. AI 관련 기업이 계속해서 이익을 기여하고 있으며, 2027년 주당순이익은 연간 15% 증가한 약 430달러가 될 것입니다. JP모건은 연준이 계속해서 인플레이션(물건값이 계속 오르는 것) 퇴치에 우선순위를 둔다면 금융 상황과 유동성 악화로 인해 가치 상승이 억제될 것이라고 경고했습니다."},{"s":"시장에서는 연준이 계속해서 금리를 인상할 것으로 예상하고 있기 때문에 채권 거래자들은 2028년에 공격적인 금리 인하를 할 태세를 갖추고 있습니다.","so":"鉅亨網","tm":"11/25 15:20","c":1,"r":"tw","u":"https://news.cnyes.com/news/id/6671634","p":1795587604,"a":1795589866,"t":"市場預計聯準會持續升息之際 債券交易員卡位2028年激進降息","su":"채권 거래자들은 연준이 내년 말까지 금리 인하(이자 비율을 낮추는 것)로 전환하기 전에 금리를 계속 인상할 것이라고 베팅하면서 SOFR 중기 곡선에 대해 낙관적인 옵션을 쏟아 붓고 있습니다. 금리 선물은 연준이 금리를 2027년 중반까지 약 4.5%로 0.75%포인트 더 인상한 다음 2028년 초에는 3%로 하락할 것으로 예상합니다. AI 투자에 대한 우려로 기술주 하락이 촉발되었고, 미국 10년 만기 국채 금리(나라가 돈 빌릴 때 내는 이자 비율)는 5.3%에서 약 4.9%로 떨어졌습니다."},{"s":"UBS: S&P500 지수는 내년 말까지 8,200포인트를 목표로 할 것으로 예상되며 강력한 재무 건전성을 갖춘 초대형 클라우드 서비스 제공업체에 대해 낙관적입니다 | 특별 주제 통찰력 - 뉴스","so":"etnet 經濟通","tm":"11/25 14:43","c":1,"r":"hk","u":"https://www.etnet.com.hk/www/tc/news/news-article.php?section=features&category=financenews&newsid=418113","p":1795585380,"a":1795589870,"t":"瑞銀：料明年底標普500指數目標為8200點，看好財務實力較強超大規模雲端服務商| 專題透視- 新聞","su":"UBS: S&P500(미국 큰 회사 500곳의 주가를 합쳐 만든 점수) 지수는 내년 말까지 8,200포인트를 목표로 할 것으로 예상되며, 강력한 재무력을 갖춘 초대형 클라우드 서비스 제공업체에 대해 낙관하고 있습니다. UBS 자산운용 투자국장은 '2027년 연간 전망' 보고서를 발표하며 견고한 경제 성과와 강력한 이익 성장이 글로벌 주식을 뒷받침할 것이라고 지적했다. 그러나 높은 시장 기대치, 높은 집중도, AI 투자 수익에 대한 의구심은 다각화 개선의 중요성을 강조합니다. (사진: Wu Zhongxian) UBS는 기술 분야에서 은행이 강력한 재정 건전성, 명확한 전망, 내부 자금으로 투자를 지원할 수 있는 능력을 갖춘 초대형 클라우드 서비스 제공업체와 컴퓨팅 파워, 웨이퍼 파운드리(남의 반도체를 대신 만들어 주는 공장) 및 반도체 장비 분야의 일부 리더를 선호한다고 밝혔습니다. 기술주 외에 산업 및 헬스케어 부문이 특히 주목할 만합니다. 지역 차원에서 은행은 유로존 시장에 대해 낙관적입니다."},{"s":"S&P500, 나스닥은 2025년 4월 이후 최고의 날 이후 후퇴","so":"Fox Business","tm":"11/25 13:25","c":1,"r":"us","u":"https://www.foxbusiness.com/video/6408852736112","p":1795580729,"a":1795582071,"t":"S&P 500, Nasdaq retreat after best day since April 2025","su":"B. Riley Wealth Management 수석 시장 전략가 Art Hogan이 'The Claman Countdown'에서 나스닥(미국 기술 회사들이 많이 모인 주식시장) 및 S&P500(미국 큰 회사 500곳의 주가를 합쳐 만든 점수) 하락세와 엔비디아의 성과를 분석합니다."},{"s":"젠슨 황이 복귀 후 퀀트 펀드의 추세를 바꾸는 것이 어려운가요? 월스트리트는 더 많은 CTA 판매 압력이 올 것이라고 경고합니다!","so":"财联社","tm":"11/25 12:10","c":1,"r":"cn","u":"https://www.cls.cn/detail/2543741","p":1795576227,"a":1795608124,"t":"黄仁勋归来难改量化基金趋势？华尔街警示更多CTA抛压在后头！","su":"① 펀더멘털보다는 가격 추세에 따라 결정을 내리는 기관으로서 상품 거래 자문(CTA)이 매도를 시작하면 종종 피드백 루프를 형성하여 특정 bp에 도달할 때까지 포지션이 계속 감소하게 됩니다. ② 데이터에 따르면 CTA는 향후 5일 동안 680억 달러 상당의 글로벌 주식을 추가로 매도할 것으로 예상되며 이는 지난 금요일에 끝난 5일과 비슷합니다. 차이롄서, 11월 25일(Editor Xiaoxiang) 최근 글로벌 주식 시장 동향이 너무 빨리 변해 이른바 '빠른 돈'조차 감히 돌아서지 못하는 것 같습니다... 골드만삭스 그룹 트레이딩 부서가 집계한 추정에 따르면 젠슨 황이 예기치 않게 엔비디아로 복귀한 후 주식 시장 심리가 개선되었지만 이러한 체계적 펀드(여러 사람 돈을 모아 전문가가 굴리는 것)가 추적하는 모델은 아직 매도 강도를 늦추는 신호를 보내지 않은 것으로 나타났습니다."},{"s":"AI 상승세가 흐지부지되고 트럼프 관세가 다시 부과될 것을 우려하면서 아시아 증시는 폭락했습니다.","so":"The Straits Times","tm":"11/25 12:06","c":1,"r":"sg","u":"https://www.straitstimes.com/business/companies-markets/asian-stocks-tumble-as-ai-rally-fizzles-and-trump-tariff-fears-return","p":1795575960,"a":1795576817,"t":"Asian stocks tumble as AI rally fizzles and Trump tariff fears return","su":"미국의 새로운 관세(수입품에 붙이는 세금) 위협과 사라지는 AI 상승세(오르는 흐름)가 칩 중심 시장을 강타하면서 아시아 주식은 하락했고, 한국과 대만 주식은 5% 이상 하락했습니다."},{"s":"2027년에 오르는 주식 : AI 관련 투자로 주목의 미국주 20종목 오카모토 효하치로","so":"週刊エコノミスト Online","tm":"11/25 12:01","c":1,"r":"jp","u":"https://weekly-economist.mainichi.jp/articles/20261208/se1/00m/020/045000c","p":1795575668,"a":1795577442,"t":"2027年に上がる株：AI関連投資で注目の米国株20銘柄 岡元兵八郎","su":"중간선거 후 주가조정을 거쳐도 AI 수요 확대는 이어진다. 클라우드(인터넷으로 빌려 쓰는 컴퓨터) 대기업부터 소프트웨어 기업까지 성장의 혜택을 받는 유망한 유명 상표에 주목한다. ＞＞특집 「2027년에 오르는 주식」은 이쪽"},{"s":"S&P500 선물, 기술주 약세 흐름 속 하락…美 국채금리↓","so":"연합인포맥스","tm":"11/25 11:59","c":1,"r":"kr","u":"https://news.einfomax.co.kr/news/articleView.html?idxno=4446463","p":1795575559,"a":1795576779,"su":"25일 오전 아시아 시장에서 미국 주가지수 선물은 기술주 약세 흐름이 이어지는 가운데 미국 10월 개인소비지출(PCE) 가격지수 발표를 앞두고 하락했다. 미국 국채금리는 전반적으로 내렸다.연합인포맥스 지수선물 통합화면(화면번호 6520)에 따르면 한국 시각으로 오전 9시53분 기준 E-미니 S&P500(미국 큰 회사 500곳의 주가를 합쳐 만든 점수) 지수 선물은 전장 대비 0.25% 내린 7,199.75에 거래됐다.기술주 중심의 E-미니 나스닥(미국 기술 회사들이 많이 모인 주식시장)100 지수 선물은 전장 대비 0.34% 하락한 26,186.00를 나타냈다.간밤 뉴욕증시는 엔비디아와 앤트로픽 등 인공지능(AI) 관련"},{"s":"미국 주식에 대한 두 가지 주요 부정적인 소식! 대만 증시는 장중 3,441포인트 하락했고, TSMC는 9% 이상 하락했습니다.","so":"UDN","tm":"11/25 11:51","c":1,"r":"tw","u":"https://udn.com/news/story/7251/9900477","p":1795575118,"a":1795576797,"t":"美股兩大利空！台股盤中重跌3441點 台積電跌幅逾9%","su":"오늘 대만 증시는 미국 나스닥(미국 기술 회사들이 많이 모인 주식시장) 종합지수와 필라델피아 반도체(전자기기 속에서 계산하고 기억하는 작은 부품) 지수의 영향으로 급락했습니다. 장중 최대 하락폭은 3,441포인트를 넘어섰고, 장중 최저치는 36,681.9포인트에 이르렀다. 이 가운데 대만반도체제조주식회사(TSMC)가 큰 타격을 입어 36,681.9포인트에 가까운 하락폭을 기록했다. 2020년 신대만달러를 앞두고 국가안보기금이 시장에 진입해 급등하면서 시장지수 하락폭을 400포인트 정도 탠더드앤드푸어스(S&P)500지수의 내년 말 목표치를 8200으로 제시했다."},{"s":"12월 금리 인상에 대한 기대치에는 어떤 차이가 있나요? 테슬라 FSD V15의 숨겨진 하이라이트는 무엇인가요? 애플의 딜레마: 병풍 독점 공급? | 20261125월스트리트에서 루자쭈이까지","so":"第一财经","tm":"11/25 09:21","c":1,"r":"cn","u":"https://www.yicai.com/video/103453437.html","p":1795566116,"a":1795582076,"t":"12月加息预期拉满分歧在哪？特斯拉FSD V15隐藏亮点在哪？苹果困局：折叠屏独供？丨20261125从华尔街到陆家嘴","su":"저자: 월스트리트에서 루자쭈이까지 편집자: 한루양 ① 다양한 견해의 대립: 연준의 12월 금리 인상(이자 비율을 올리는 것)은 논란의 여지가 있다. 블랙록은 연준이 12월에 0.25%포인트 금리 인상을 기대한다는 점을 인정하지만, 시장이 내년에 세 차례 금리 인상을 너무 공격적으로 가격을 책정하고 있다고 믿고 있습니다. 블랙록은 에너지 영향이 정점에 이르렀다고 판단해 2027년 상반기에 한 번만 금리를 인상할 것으로 예상하고 있다. 중립금리는 당초 예상보다 높아질 수도 있다. 윌리엄스 뉴욕 연준 총재는 매파적인 신호를 내렸고 연속적인 금리 인상을 배제하지 않았습니다. 퍼싱스퀘어를 설립하고 '월스트리트의 늑대'로 알려진 억만장자 헤지펀드 매니저 빌 애크먼은 12월 금리 인상은 잘못된 판단이었다고 경고했다. 현재 금융환경은 급격히 악화되고 기업의 자금조달 비용도 증가하고 있습니다. 인플레이션(물건값이 계속 오르는 것)을 2%로 강제 억제하면 경기침체를 초래할 수 있다. 그는 지정학적 갈등, 반세계화, AI 인프라 투자라는 새로운 맥락에서 인플레이션 목표 3%가 더 합리적이라고 제안했다. CME 데이터에 따르면 12월 금리를 0.25%포인트 인상할 확률은 95.8%이다. 이번 주 수요일 10월 PCE 데이터가 차이를 검증하는 열쇠가 될 것입니다. 에너지 가격이 계속 하락할 수 있는지 여부도 정책 경로에 영향을 미칠 것입니다."},{"s":"닛케이 2.8% 하락, 칩 관련주에 끌려","so":"WSJ","tm":"11/25 09:21","c":1,"r":"us","u":"https://www.wsj.com/finance/stocks/nikkei-falls-2-8-dragged-by-chip-related-stocks-79ef7a34","p":1795566060,"a":1795589861,"t":"Nikkei Falls 2.8%, Dragged by Chip-Related Stocks"},{"s":"미국 주식 반등을 위한 하루 여행? 젠슨 황의 복귀 썰물 효과와 시장은 더욱 현실적인 테스트에 직면","so":"第一财经","tm":"11/25 09:17","c":1,"r":"cn","u":"https://www.yicai.com/news/103452996.html","p":1795565861,"a":1795574593,"t":"美股反弹一日游？黄仁勋回归效应退潮，市场面临更多现实性考验","su":"화요일 현지 시간으로 미국 증시는 월요일의 격렬한 반등을 연장하지 못했습니다. 나스닥(미국 기술 회사들이 많이 모인 주식시장)이 1.48% 하락하는 등 3대 주가지수가 엇갈렸다. 시장의 성과는 단기적인 열광적인 매수에 찬물을 끼얹었고, 시장 반전은 보다 실질적인 테스트에 직면해야 할 수도 있습니다. 기술적 반등 지난 주의 급격한 하락 이후 많은 시장 참여자들은 주말 논평에서 주가 하락으로 인해 과매도 상태와 긴급 헤징이 발생했다고 썼습니다. 이러한 상황은 일반적으로 최소한 빠른 반등의 물결을 불러일으키며, 일부 지표는 너무 극단적이어서 2025년 4월 관세 패닉 이후 최저치에 가까워졌습니다. 실제로 시장은 이미 상당한 반등을 기대하고 있었습니다. 월요일 개장 전 젠슨 황의 복귀 소식이 전해지기 전에도 S&P500(미국 큰 회사 500곳의 주가를 합쳐 만든 점수) 선물은 2% 이상 상승할 것으로 예상하고 있었습니다 다 약 7% 낮습니다. 전략가들은 AI 투자 둔화, 수익률 곡선 평탄화, 위험 자산에 대한 지속적인 압박을 우려하고 있습니다."},{"s":"홍콩 주식 모닝 포스트 │ 미국 나스닥은 1% 이상 하락, 저우다푸의 중간 순이익은 거의 두 배 증가","so":"财联社","tm":"11/25 08:44","c":1,"r":"cn","u":"https://www.cls.cn/detail/2542939","p":1795563884,"a":1795565140,"t":"港股早报｜美股纳指跌超1% 周大福中期净利近翻番","su":"① 중앙은행은 오늘 8000억 위안 규모의 MLF 운영을 시작했습니다. ② 상무부는 미국 규제 발표 2항 시행을 중단했습니다. ③ 유럽연합은 하이브리드 자동차에 대한 임시 세이프가드 조치를 채택했습니다. ④ 미국 3대 주가지수가 엇갈리고, 중국 인기 테마주가 엇갈린 추세를 보였습니다. ⑤ 헬스케어(건강·의료 관련 산업) 및 소비자 소매주는 추세를 역전하고 상승했습니다. ⑥ 국제 유가 결산가격이 2% 이상 반등했습니다. 은행 시스템의 충분한 유동성을 유지하기 위해 8000억 위안 규모의 MLF 운영이 2026년 11월 25일에 시작되며 기간은 1년입니다. 2. 2024년 상무부 고시 제46호(\"미국에 대한 관련 이중용도 품목의 수출 통제(특정 물건을 다른 나라에 못 팔게 막는 것) 강화에 관한 고시\")의 두 번째 단락이 유예됩니다. 3. 유럽연합은 하이브리드 차량에 대한 임시 보호 조치를 발표했습니다. 중국 상무부는 중국 관련 산업의 정당한 권익을 단호히 수호하겠다고 밝혔다."},{"s":"뉴욕 다우 연일 상승, 5만 달러대 회복 미국 경기에 낙관론, 구매 주문 우세","so":"毎日新聞","tm":"11/25 08:37","c":1,"r":"jp","u":"https://mainichi.jp/articles/20261125/kyd/00m/020/002000c","p":1795563438,"a":1795565166,"t":"NYダウ続伸、5万ドル台回復 米景気へ楽観論、買い注文優勢","su":"24일 뉴욕 주식시장 다우공업주 30종 평균은 연일 상승해 전날 대비 423·39달러 높이인 5만0018·70달러로 거래를 마치고 4영업일 만에 5만달러대를 회복했다. 미국 경기에 대한 낙관론이 퍼져 구매 주문이 우세했다."},{"s":"[GAM] 월가 트레이더들, 내년 말 연준 금리인하 가능성에 베팅","so":"뉴스핌","tm":"11/25 08:30","c":1,"r":"kr","u":"https://www.newspim.com/news/view/20261125000133","p":1795563000,"a":1795565135,"su":"이 기사는 11월 25일 오전 08시26분 '해외 주식 투자의 도우미' GAM(Global Asset Management)에 출고된 프리미엄 기사입니다. GAM에서 회원 가입을 하면 9000여 해외 종목의 프리미엄 기사를 보실 수 있습니다. [서울=뉴스핌] 이홍규 기자 = 월가의 채권 트레이더들이 미국 연방준비제도(연준(미국의 중앙은행))의 정책금리 인상(이자 비율을 올리는 것)과 주가 하락으로 경기가 크게 둔화할 위험에 대비해 헤지를 서두르고 있다."},{"s":"국제 금값, 하루 만에 하락 전환⋯연준 금리인상 전망에 2.5%↓","so":"이투데이","tm":"11/25 08:22","c":1,"r":"kr","u":"https://www.etoday.co.kr/news/view/2652535","p":1795562520,"a":1795565135,"su":"▲서울 종로구 한국금거래소에서 직원이 골드바를 들어보이고 있다. 고성준 기자 joonko1@국제금값이 24일(현지시간) 하락했다. 미국 연방준비제도(Fed"},{"s":"EJFQ Letter Analysis | 미국 증시는 충분히 하락하지 않았으며 위험 프리미엄이 \"수정\"되어 시장에 진입하기를 기다리고 있습니다.","so":"信報網站","tm":"11/25 08:19","c":1,"r":"hk","u":"https://www.hkej.com/instantnews/stock/article/4573696/EJFQ%E4%BF%A1%E6%9E%90%E4%B8%A8%E7%BE%8E%E8%82%A1%E6%9C%AA%E8%B7%8C%E5%A4%A0+%E5%80%99%E9%A2%A8%E9%9A%AA%E6%BA%A2%E5%83%B9%E3%80%8C%E6%AD%B8%E6%AD%A3%E3%80%8D%E5%85%A5%E5%B8%82","p":1795562390,"a":1795565158,"t":"EJFQ信析丨美股未跌夠 候風險溢價「歸正」入市","su":"엔비디아 황의 창립자인 'AI 주식 왕' Jensen은 11일 만에 사임한 후 CEO 및 기타 직위로 드라마틱하게 복귀하여 AI 부문에 대한 시장의 신뢰를 즉시 다시 불러일으켰습니다. 월요일(23일) 회사 주가는 시가총액(회사 전체 몸값) 1조 달러에 가까운 31.48% 급등해 필라델피아 반도체 지수가 14.03% 상승했고, S&P500(미국 큰 회사 500곳의 주가를 합쳐 만든 점수) 지수도 4.76% 상승했다. 그러나 AI 평가 하락이 마무리되고 미국 증시가 다시 상승세를 이어갈 것으로 기대하는 것은 지나치게 낙관적일 수 있다. S&P500지수는 고점에서 하락했고, 이익수익률도 월초 약 3.8%에서 4.42%로 올랐지만 여전히 낮은 수준이다."},{"s":"<시간외 귀금속> 금은 반등했지만 2% 이상 하락에는 실패했다. 연준 관계자들은 12월 금리 인상에 대한 기대를 강화하기 위해 매파적인 입장을 표명했습니다.","so":"鉅亨網","tm":"11/25 07:45","c":1,"r":"tw","u":"https://news.cnyes.com/news/id/6670959","p":1795560333,"a":1795560776,"t":"〈貴金屬盤後〉黃金反彈無力下挫逾2% Fed官員放鷹強化12月升息預期","su":"연준 관계자들의 매파적인 신호는 12월 금리 인상(이자 비율을 올리는 것)에 대한 기대감을 강화했습니다. 화요일 금값은 2% 넘게 하락했고, 미국 증시 하락도 각종 자산의 매도세(팔려는 힘)로 이어졌다.\n현물 금은 US$3,558.25였으며, 12월 금 선물은 US$3,557.80이었습니다. 거래자들은 12월 금리가 0.25% 포인트 인상되는 것을 완전히 가격에 반영했습니다.\n주식 시장이 하락하고 은, 백금, 팔라듐이 동시에 하락하자 투자자들은 마진을 충당하기 위해 금과 은 포지션을 마감했습니다."},{"s":"[모닝 포스트] 미국 증시는 밤새 변화했고, 기술주가 전반적으로 하락했습니다. 국제 원유는 급격히 반등했습니다. Fii와 Shenghong Technology는 배당금을 발표했습니다.","so":"财联社","tm":"11/25 07:39","c":1,"r":"cn","u":"https://www.cls.cn/detail/2543512","p":1795559940,"a":1795582078,"t":"【早报】美股一夜“变天”，科技股全线回调；国际原油，大幅反弹；工业富联、胜宏科技公告分红事项","su":"① 유럽연합이 하이브리드 차량에 대한 임시 세이프가드 조치를 발표하고 상무부가 대응 ② 중앙은행(나라의 돈과 이자를 관리하는 은행): 오늘 5000억 위안의 7일간 역환매 작업 개시 ③ 미국 3대 주가지수 혼조 마감 ④ Wanhua Chemical, Titanium Chemical, Youzu Network 환매 관련 사항 발표 ⑤ Industrial Fii 및 Shenghong Technology가 배당 사항 발표. 매크로 뉴스 1. 중국 상무부는 승인 시 2024년 상무부 고시 제46호(\"미국에 대한 관련 이중용도 품목의 수출 통제(특정 물건을 다른 나라에 못 팔게 막는 것) 강화에 관한 고시\")의 두 번째 단락이 2026년 11월 28일부터 2027년 1월 27일까지 유예된다고 밝혔습니다. 2. 유럽연합 집행위원회는 어제 하이브리드 자동차에 대한 글로벌 세이프가드 조치에 대한 예비 판결을 발표했으며 12월부터 임시 조치를 취할 계획입니다. 1. 상무부는 EU가 10월 30일 조사에 착수했으며 한 달도 채 지나지 않아 임시 조치를 취하기로 결정했다고 밝혔습니다. 중국은 WTO 분쟁 해결에 의지하고 무역 보상을 요구할 모든 권리를 보유합니다."},{"s":"센추리홀딩스, S&P SmallCap 600 편입 예정","so":"S&P Global","tm":"11/25 07:34","c":1,"r":"us","u":"https://press.spglobal.com/2026-11-24-Centuri-Holdings-Set-to-Join-S-P-SmallCap-600","p":1795559690,"a":1795565135,"t":"Centuri Holdings Set to Join S&P SmallCap 600","su":"센추리홀딩스 Inc.(NYSE: CTRI)는 12월 1일 화요일 거래 개시 이전부터 S&P SmallCap 600 지수에서 더블베리파이 Holdings Inc.(NYSE: DV)를 대체합니다. 닐슨 Holdings는..."},{"s":"트럼프 추가관세·젠슨 황 복귀효과 소진에 미국 증시 부진···엔트로픽 공모가 밑돌아","so":"경향신문","tm":"11/25 07:20","c":1,"r":"kr","u":"https://www.khan.co.kr/article/202611250720001/?utm_source=khan_rss&utm_medium=rss&utm_campaign=total_news","p":1795558800,"a":1795565135,"su":"미국 뉴욕증시의 3대 주요 주가지수가 24일 인공지능 관련 기술주를 중심으로 차익실현(오른 주식을 팔아 이익을 챙기는 것) 매물이 출회되면서 혼조세로 마감했다. 도널드 트럼프 미 행정부의 추가 관세 부과 가능성과 젠슨 황 엔비디아 최고경영자를 둘러싼 우려도 투자심리를 짓눌렀다. 이날 스탠더드앤드푸어스500지수는 전 거래일보다 36.08포인트 내린 7201.09에, 기술주 중심의 나스닥(미국 기술 회사들이 많이 모인 주식시장) 종..."},{"s":"미국 증시는 연일 상승, 헬스 케어 및 소비 관련 구매 (아침 재료 검사)","so":"QUICK Money World","tm":"11/25 07:20","c":1,"r":"jp","u":"https://moneyworld.jp/news/detail?id=223606","p":1795558800,"a":1795582090,"t":"米国株は続伸、ヘルスケアや消費関連に買い (朝の材料チェック)","su":"11월 24일 미국 시장에서 미국 증시는 늘어나 전날 대비 423달러 39센트 높은 5만0018달러 70센트로 거래를 마쳤다. 한편 나스닥(미국 기술 회사들이 많이 모인 주식시장) 종합주가지수는 하락 반전했다. 미국 증시는 연일 상승, 헬스케어(건강·의료 관련 산업)와 소비 관련이 상승 24일 미국 증시 […]"},{"s":"미국 증시 동향 | 마이크로소프트는 엔지니어링 시스템과 사고 대응 메커니즘을 개혁하기 위해 최고 수준의 '적색경보'를 활성화합니다.","so":"etnet 經濟通","tm":"11/25 07:10","c":1,"r":"hk","u":"https://www.etnet.com.hk/www/tc/us-stocks/news-article/418069/%E7%BE%8E%E8%82%A1%E5%8B%95%E5%90%91+%7C+%E5%BE%AE%E8%BB%9F%E5%95%9F%E5%8B%95%E6%9C%80%E9%AB%98%E7%B4%9A%E5%88%A5%E3%80%8C%E7%B4%85%E8%89%B2%E8%AD%A6%E5%A0%B1%E3%80%8D%EF%BC%8C%E6%94%B9%E9%9D%A9%E5%B7%A5%E7%A8%8B%E7%B3%BB%E7%B5%B1%E5%8F%8A%E4%BA%8B%E6%95%85%E6%87%89%E8%AE%8A%E6%A9%9F%E5%88%B6","p":1795558200,"a":1795560780,"t":"美股動向 | 微軟啟動最高級別「紅色警報」，改革工程系統及事故應變機制"},{"s":"나스닥 하락 반전 엔비디아 기업지배구조에 우려","so":"NHKニュース","tm":"11/25 07:09","c":1,"r":"jp","u":"https://news.web.nhk/newsweb/na/nd-20261125de80932","p":1795558194,"a":1795560788,"t":"ナスダック 一転下落 エヌビディア企業統治に懸念","su":"[NHK] 24일 뉴욕 주식시장은 전날 급등한 하이테크 주식의 비율이 높은 나스닥의 주가지수가 반도체(전자기기 속에서 계산하고 기억하는 작은 부품) 대기업인 엔비디아의 기업지배구조(회사를 누가 어떻게 이끌고 감시하는지)를 둘러싼 우려가 나온 것 등에서 하락으로 돌아섰습니다. 24일 새"},{"s":"AI 열풍의 미래는 불투명하다. 미국 증시는 하락세로 마감했고 엔비디아의 주가는 거의 6% 하락했습니다.","so":"中央社 CNA","tm":"11/25 07:09","c":1,"r":"tw","u":"https://www.cna.com.tw/news/afe/202611250011.aspx","p":1795558140,"a":1795560778,"t":"AI熱潮前景不明 美股多收跌、輝達股價下挫近6%","su":"인공지능(AI) 열풍의 불투명한 전망으로 인해 다시 한번 투자자들이 기술주를 매도했다. 오늘 미국 4대 증시 지수가 하락세로 마감했습니다. 이 중 거대 칩 엔비디아의 주가는 5.86% 하락한 155.38달러를 기록했습니다."},{"s":"미국 증시는 처음에는 폭발했다가 급락해 투자자들을 딜레마에 빠뜨렸다. 추세 반전 신호는 언제 나타날까요?","so":"鉅亨網","tm":"11/25 07:01","c":1,"r":"tw","u":"https://news.cnyes.com/news/id/6670739","p":1795557681,"a":1795560779,"t":"美股先爆衝又急跌令投資人陷進退兩難 趨勢反轉訊號何時出現？","su":"엔비디아 이사회는 월요일 젠슨 황이 CEO로 즉시 복귀하여 하루 만에 S&P500(미국 큰 회사 500곳의 주가를 합쳐 만든 점수) 지수가 4.73%, 나스닥 지수가 6.51%, 엔비디아 지수가 31.48% 상승할 것이라고 발표했습니다.\nVIX는 급락했고, 숏커버링과 레버리지 ETF(지수 움직임의 2~3배로 움직이는 ETF)의 늦은 리밸런싱으로 인해 매수세가 늘어났습니다. 노무라는 하루에 약 410억 달러가 될 것으로 추산했고, CTA 모델도 크게 뒤집혔다.\n월스트리트는 반등이 바닥을 확인하지 못할 수도 있다고 믿고 있습니다. 금융 여건의 긴축과 AI 자본 지출에 대한 수익률은 여전히 검증이 필요합니다. 더 높은 가격을 쫓는 것을 피하기 위해 할당을 다양화하는 것이 좋습니다."},{"s":"미국 증시 일기 │ 다우 지수는 50,000 포인트로 복귀하고 기술주는 하루 만에 반등 및 붕괴","so":"星島頭條","tm":"11/25 06:59","c":1,"r":"hk","u":"https://www.stheadline.com/stock-market/3640872/%E7%BE%8E%E8%82%A1%E6%97%A5%E8%AA%8C%E9%81%93%E6%8C%87%E9%87%8D%E8%BF%945%E8%90%AC%E9%BB%9E-%E7%A7%91%E6%8A%80%E8%82%A1%E5%8F%8D%E5%BD%88%E4%B8%80%E6%97%A5%E5%8F%88%E6%95%A3","p":1795557595,"a":1795560782,"t":"美股日誌｜道指重返5萬點 科技股反彈一日又散","su":"화요일 미국 3대 주가지수는 서로 다른 추세를 보였습니다. 월요일에 거의 1,448포인트 상승한 다우존스 지수는 오늘 423포인트 이상 상승하여 50,000포인트 선으로 마감했습니다. 어제 보복 반등을 펼쳤던 나스닥 지수는 하락세로 돌아서 오늘 상승분의 4분의 1 가량을 포기하며 356포인트 하락한 뒤 다시 2만4000선 아래로 떨어졌습니다. S&P500(미국 큰 회사 500곳의 주가를 합쳐 만든 점수) 지수도 상승폭을 늘리지 못하고 0.5% 하락 마감했습니다. 어제 기술주와 함께 반등했던 금도 하락세를 보였습니다. 뉴욕 금 선 과=미국 개별 종목 (NY시간 14:09)(일본 시간 04:09) 엔비디아 <NVDA> 젠슨 황 CEO는 24일 본사에서 전사회의를 열고 자신의 일시퇴임으로 이어진 불륜 등 행동규범 위반에 대해 사원들에게 사과했다. 블룸버그가 관계자의 이야기로 전했다. 젠슨 황 CEO는 중국 스파이 의혹이 있는 여성과 부하와의 불륜이 발각되어 퇴임한 경위를 접해 이번 회의를 “지금까지 가장 힘든 전사회의”라고 표현했다. 사원의 기대를 배반한 것을 진사하는 것과 동시에, 매일 테라피를 받고 있는 것이나, 아내와의 대화가 힘들었다고 털어놨다. 또한 부재중에 회사를 이끈 크레스 CFO에 사의를 보였다."},{"s":"S&P500은 1950년 이후 13번째로 일주일 만에 8% 이상 하락했습니다. 나머지 12개 지수의 결과는 다음과 같습니다.","so":"The Globe and Mail","tm":"11/25 04:04","c":1,"r":"us","u":"https://www.theglobeandmail.com/investing/markets/markets-news/Motley%20Fool/8990506/the-sp-500-lost-more-than-8-in-a-week-for-only-the-13th-time-since-1950-here-s-how-the-other-12-played-out/","p":1795547077,"a":1795582074,"t":"The S&P 500 Lost More Than 8% in a Week for Only the 13th Time Since 1950. Here's How the Other 12 Played Out.","su":"요점 - S&P500(미국 큰 회사 500곳의 주가를 합쳐 만든 점수)은 11월 20일로 끝나는 주에 8.6% 하락했습니다. 이는 2025년 4월 이후 최악의 주입니다. - 1950년 이후 지수가 8% 이상 하락한 주만 12주에 불과했습니다. - 1년 후, 지수는 12주 중 8주 후에 상승했습니다."},{"s":"AI 마진 감소로 인해 낙관적인 예측이 무색해지자 HPE 주가 하락","so":"Reuters","tm":"11/25 03:50","c":1,"r":"world","u":"https://www.reuters.com/business/hpe-shares-fall-margin-worries-overshadow-raised-outlook-2026-11-24/","p":1795546225,"a":1795560794,"t":"HPE shares tumble as shrinking AI margins overshadow upbeat forecast"},{"s":"맥클럼 캐나다 은행 총재는 인플레이션이 지속될 것으로 예상","so":"WSJ","tm":"11/25 03:41","c":1,"r":"us","u":"https://www.wsj.com/economy/central-banking/bank-of-canada-gov-macklem-expects-inflation-to-remain-persistent-1fbb15f1","p":1795545660,"a":1795565136,"t":"Bank of Canada Gov. Macklem Expects Inflation to Remain Persistent"},{"s":"미국 주식 결과 | HPE 기술 15% 이상 하락, 내년 클라우드·AI 사업 이익률 14%까지 하락 전망","so":"etnet 經濟通","tm":"11/25 03:35","c":1,"r":"hk","u":"https://www.etnet.com.hk/www/tc/us-stocks/news-article/418032/%E7%BE%8E%E8%82%A1%E6%A5%AD%E7%B8%BE%7C%E6%85%A7%E8%88%87%E7%A7%91%E6%8A%80%E6%8C%AB%E9%80%BE15%25%EF%BC%8C%E9%9B%B2%E8%88%87AI%E6%A5%AD%E5%8B%99%E6%98%8E%E5%B9%B4%E5%88%A9%E6%BD%A4%E7%8E%87%E6%96%99%E 1997,"a":1795530455,"t":"从黄仁勋复职到“马斯克溢价”：华尔街如何重新定价AI巨头的“关键人物风险”","su":"“위대한 기업가의 성공은 자신 때문에 회사를 위대하게 만드는 것이고, 위대한 기업가의 궁극적인 성공은 회사가 더 이상 자신을 필요로 하지 않고 계속 위대하게 만드는 것입니다.” 천용웨이가 말했다."},{"s":"연준 고위 관료들이 내부 규정 위반 혐의로 조사를 받고 있는데, 민주당이 힘을 발휘하기 시작하는 걸까요?","so":"第一财经","tm":"11/24 21:02","c":1,"r":"cn","u":"https://www.yicai.com/news/103452324.html","p":1795521748,"a":1795560766,"t":"美联储高官面临违反内部规定调查，民主党开始发力了？","su":"중간선거 이후 연준(미국의 중앙은행)에는 다시 준수 바람이 불고 있다. 보도에 따르면, 이 문제에 정통한 두 사람은 연준 감찰실이 규제 업무를 담당하는 미셸 보먼 연준 부의장이 연준의 '침묵 기간(회의 앞뒤로 말을 아끼는 기간)' 규정을 위반했는지 여부를 조사하고 있다고 밝혔습니다. 보먼은 이전에 연준 정책 회의가 끝난 지 불과 몇 시간 후인 6월 뱅크오브아메리카가 주최한 개인 만찬에 참석했습니다. 당시 보먼은 개인 만찬에 참석했을 뿐만 아니라 연설도 했습니다. 이 검토는 매사추세츠주 민주당 상원의원 워렌이 이끄는 민주당 상원의원 그룹에 의해 촉발되었으며, 그는 지난 7월 마이클 호로비츠 연준 감찰관에게 편지를 보내 보먼이 고객의 만찬에 참석한 것이 연준의 행동 강령을 위반했는지 여부를 판단해 달라고 요청했습니다."},{"s":"S&P500은 역사상 두 번째로 큰 포인트 상승을 기록했습니다.","so":"Yahoo Finance","tm":"11/24 21:02","c":1,"r":"us","u":"https://finance.yahoo.com/markets/stocks/articles/p-500-just-had-second-120215688.html","p":1795521735,"a":1795530449,"t":"The S&P 500 Just Had the Second-Biggest Point Gain in Its History","su":"CEO(회사의 가장 높은 책임자)의 단 한 번의 결정으로 인해 시장은 7일 연속 하락세를 보인 후 급등했습니다. 그러나 기록적인 숫자에는 문제가 숨겨져 있으며, 역사는 더 큰 고통이 발생하기 직전에 대규모 상승세(오르는 흐름)일이 종종 도래한다는 것을 보여줍니다."},{"s":"이 억만장자는 젠슨 황의 복귀를 예상하여 엔비디아를 인수했으며 S&P500이 3분의 1 하락할 수 있다고 경고했습니다.","so":"MarketWatch","tm":"11/24 20:59","c":1,"r":"us","u":"https://www.marketwatch.com/story/this-billionaire-bought-nvidia-in-anticipation-of-jensen-huangs-return-and-warns-the-s-p-500-could-fall-by-a-third-dcff9489","p":1795521540,"a":1795530450,"t":"This billionaire bought Nvidia in anticipation of Jensen Huang’s return — and warns the S&P 500 could fall by a third"},{"s":"미국 주식의 변화 | 로켓랩은 지난주 기술주 매도와 중성자 로켓 발사 지연으로 인해 거의 11% 하락했습니다.","so":"etnet 經濟通","tm":"11/24 20:13","c":1,"r":"hk","u":"https://www.etnet.com.hk/www/tc/us-stocks/news-article/418051/%E7%BE%8E%E8%82%A1%E7%95%B0%E5%8B%95%7CRocket+Lab%E4%B8%8A%E5%91%A8%E6%8C%AB%E8%BF%9111%25%EF%BC%8C%E w.cls.cn/detail/2518477","p":1795516183,"a":1795576793,"t":"美联储如期维持基准利率不变 两名票委主张加息25个基点","su":"① 연준은 시장의 일반적인 기대에 맞춰 연방기금 금리 목표 범위를 3.75~4%로 유지하겠다고 밝혔다. ② 리사 쿡과 Beth 해맥은 반대표를 던졌고, 이번 회의에서 연방기금 금리의 목표 범위를 0.25%포인트(퍼센트끼리 뺀 차이) 늘리는 것을 선호했습니다. 차이롄서, 10월 29일(자오 하오 편집자) 베이징 시간으로 목요일(10월 29일) 이른 아침, 연준은 일반 시장 기대에 맞춰 연방기금 금리 목표 범위를 3.75~4%로 그대로 유지할 것이라고 발표했습니다. 지난달 연준은 3년여 만에 처음으로 금리를 인상해 연방기금 금리 목표 범위를 3.75~4%로 0.25%포인트 인상했다. 보도자료에 따르면 연방공개시장위원회(FOMC(미국 금리를 정하는 회의))는 찬성 10표, 반대 2표로 결의안을 통과시켰다. 성명서는 연준의 이중 임무 실현을 지원하기 위해 FOMC가 연방기금 금리 목표 범위를 3.75~4%로 유지하기로 결정했다고 밝혔습니다. 위원회는 은행 시스템에서 적절한 준비금을 유지하기 위한 정책을 계속해서 시행할 것입니다."},{"s":"인베스코 S&P500 Pure Value ETF(RPV)가 현재 강력한 ETF인가요?","so":"Yahoo Finance","tm":"11/24 19:20","c":1,"r":"us","u":"https://finance.yahoo.com/markets/stocks/articles/invesco-p-500-pure-value-102002212.html","p":1795515602,"a":1795577422,"t":"Is Invesco S&P 500 Pure Value ETF (RPV) a Strong ETF Right Now?","su":"스마트 베타 상장(주식시장에 처음 들어오는 것)지수펀드인 인베스코 S&P500(미국 큰 회사 500곳의 주가를 합쳐 만든 점수) Pure Value ETF(RPV)는 2006년 3월 1일에 출시되었으며 시장의 Style Box - Large Cap Value 카테고리에 대한 폭넓은 노출을 제공합니다. 스마트 베타 ETF란 무엇입니까?"},{"s":"급락부터 급등까지! 역사에서 교훈 얻기: 미국 주식의 \"카니발 나이트\" 이후에는 어떤 일이 일어날까요?","so":"财联社","tm":"11/24 19:03","c":1,"r":"cn","u":"https://www.cls.cn/detail/2543090","p":1795514580,"a":1795565144,"t":"从暴跌到暴涨！以史为鉴：美股经历“狂欢夜”后 接下来会怎么走？","su":"① 1993년 이후 S&P500(미국 큰 회사 500곳의 주가를 합쳐 만든 점수) 지수는 월요일에 2% 이상의 상승률로 20차례 개장했으며, 그 중 17차례는 1년 후에 상승했습니다. ③ 역사상 월요일 개장 시가가 급격하게 높아진 20건 중 절반이 향후 3개월 이내에 지난 주 금요일 최저치 아래로 떨어졌습니다. 차이롄서, 11월 24일(Editor Liu Rui) 지난 주부터 월요일까지 미국 기술주는 짜릿한 반전을 경험했습니다. 지난주 월스트리트가 AI 관련 자산을 모두 매도한 후 월요일 자금이 바닥으로 돌아섰습니다. 젠슨 황이 엔비디아의 CEO(회사의 가장 높은 책임자)로 복귀했다는 소식이 나온 후 S&P500 지수는 월요일 개장 시 거의 5% 급등하여 1993년 이후 월요일에 두 번째로 높은 가격을 기록했습니다. 금융 위기가 가장 심각한 시기였던 2008년 10월 13일에만 S&P500의 월요일 개장 시 상승폭이 이때보다 높았습니다."},{"s":"S&P500 미국 수익 선두 기업(^SPXURLUN) 차트, 데이터 및 뉴스","so":"Yahoo Finance UK","tm":"11/24 19:02","c":1,"r":"us","u":"https://uk.finance.yahoo.com/quote/%5ESPXURLUN/","p":1795514534,"a":1795530808,"t":"S&P 500 U.S. Revenue Leaders In (^SPXURLUN) charts, data and news"},{"s":"20261124 PTS 수화 뉴스 정식 버전 ｜ 엔비디아 CEO의 주가 급등으로 젠슨 황이 복귀하여 미국 주식 상승 ｜PTS News PNN","so":"公視新聞","tm":"11/24 18:59","c":1,"r":"tw","u":"https://news.pts.org.tw/video/23408","p":1795514367,"a":1795577429,"t":"20261124 公視手語新聞 完整版｜黃仁勳回任執行長 輝達股價飆漲拉抬美股 ｜ 公視新聞 PNN"},{"s":"기술 상승세가 사라지고 사노피가 상승하면서 유럽 주식은 일시 중지됩니다.","so":"Reuters","tm":"11/24 18:45","c":1,"r":"us","u":"https://www.reuters.com/markets/europe/europes-stoxx-600-subdued-after-ai-driven-rally-2026-11-24/","p":1795513511,"a":1795530808,"t":"European shares pause as tech rally fades, Sanofi gains"},{"s":"프랑스와 파키스탄은 연준이 12월부터 세 차례 연속 금리를 인상할 것으로 예상하고 있다. 경고: AI 주식이 가장 큰 패자가 될 수 있습니다.","so":"香港經濟日報HKET","tm":"11/24 17:43","c":1,"r":"hk","u":"https://wealth.hket.com/article/4230055/%E6%B3%95%E5%B7%B4%E6%96%99%E7%BE%8E%E8%81%AF%E5%84%B212%E6%9C%88%E8%B5%B7%E9%80%A3%E5%8A%A03%E6%AC%A1%E6%81%AF%E3%80%80%E8%AD%A6%E5%91%8A%EF%BC%9AAI%E8%82%A1%E6%81%90%E6%88%90%E6%9C%80%E5%A4%A7%E8%BC%B8%E5%AE%B6","p":1795509803,"a":1795530476,"t":"法巴料美聯儲12月起連加3次息 警告：AI股恐成最大輸家"},{"s":"알리안츠 Tang Jicheng과의 독점 인터뷰: 연준의 금리 인상은 아직 끝나지 않았으며 AI 배당금은 아시아 태평양 지역의 지형을 바꿀 것입니다","so":"21财经","tm":"11/24 17:33","c":1,"r":"cn","u":"https://www.21jingji.com/article/20261124/herald/14c791cfc8d654a5003937f053d22897.html","p":1795509180,"a":1795565146,"t":"专访安联汤继成：美联储加息未至终点，AI红利重塑亚太格局","su":"21세기 비즈니스 헤럴드 Feng Zitong 기자 2026년 세계 경제는 탄력성과 위험 사이에서 흔들리게 될 것입니다. 미국 경제는 하락세에 저항하고 있지만 인플레이션(물건값이 계속 오르는 것) 경직성은 해소하기 어려운 상황이다. 중동 지역의 지정학적 갈등으로 인해 국제 유가가 상승했습니다. 미국, 유럽, 일본의 장기 국채 금리(나라가 돈 빌릴 때 내는 이자 비율)는 지속적으로 상승했다. AI 산업이 중요한 글로벌 성장 동력이 된 반면, 시장에서는 업계의 막대한 자본 지출이 그에 상응하는 이익 수익을 제공할 수 있는지 의문을 제기하기 시작했습니다. 대외 유동성이 지속적으로 부족해지면서 아시아 태평양 경제 간의 차별화가 더욱 심화되었습니다. 다양한 변수가 얽혀 있는 거시적 환경에 직면하여 2027년 글로벌 및 아시아 태평양 시장의 기회와 과제를 어떻게 분석할 것인가? 최근 21세기 비즈니스 헤럴드는 알리안츠 Investment Asia Pacific의 선임 이코노미스트 Tang Jicheng과 단독 인터뷰를 진행했습니다. 그는 2027년에도 세계 경제 전체는 회복력을 유지하겠지만 유동성 마진은 줄어들 것이라고 말했습니다."},{"s":"글 73502.html","p":1795604521,"a":1795608159,"t":"410亿美元，制药行业近年最大并购落定！港股通创新药情绪升温，520880标的指数摸高逾3%，权重龙头集体发力","su":"11월 25일(수요일) 홍콩 증시는 상승했다가 하락하며 항셍지수가 1.14% 하락했습니다. 혁신적인 약물은 시장 추세를 거스르는 몇 안 되는 약물 중 하나였습니다. 100% 혁신의약품 연구개발 목표인 홍콩주식연계 혁신약품 ETF(여러 주식을 묶어 파는 상품) 화바오(520880) 추적지수(항셍홍콩주식연계 혁신약물선택지수)가 0.4% 상승을 마감했다."},{"s":"방금 생명공학주로 1억 6천만 달러를 벌었습니다! 장준닝(Junning Chang)은 대만 증시 충격에 직면해 AI 주식을 알아보고 '오로라'를 보았다.","so":"噓！星聞","tm":"11/25 18:12","c":1,"r":"tw","u":"https://stars.udn.com/star/story/10089/9901613","p":1795597967,"a":1795608162,"t":"才靠生技股賺1.6億！張鈞甯遇台股震盪認了AI股慘見「極光」","su":"2022년에는 장준닝이 생명공학 주식 '야오화제약(Yaohua Pharmaceutical)'을 NT$6016만에 매입한 것으로 밝혀졌습니다. 그녀는 최소 NT$1억 6천만 달러를 벌어들인 것으로 알려졌고, 그녀는 단번에 \"여성 주식의 신\"이라는 별명을 얻었습니다. 그러나 그녀는 지난달 한 행사에서 자신의 주식을 모두 매진했고 여전히 일부 AI 주식을 보유하고 있다고 담담하게 밝혔다. 최근 대만 증시는 지속적인 변동세를 보이고 있습니다. 그녀는 어제 한 금 주얼리 브랜드 행사에 참석해 현재 투자 상황에 대한 질문을 받았다. 그녀는 최근 주식시장이 '오로라'(증시 붕괴의 청신호)였다고 인정했다. 그녀는 “다른 사람들도 마찬가지”라며 웃었다. 그녀는 자신의 투자 생각도 밝혔습니다."},{"s":"‘먹는 유방암약’ 美 FDA 승인…100조 시장 노린 신약 쏟아진다","so":"Chosunbiz","tm":"11/25 16:11","c":1,"r":"kr","u":"https://biz.chosun.com/science-chosun/science/2026/11/25/HBSWEODEGJRGGOLGGZRGEY3GHE/?outputType=amp","p":1795590660,"a":1795608158,"su":"먹는 유방암약 美 FDA 승인(미국에서 이 약을 팔아도 된다는 허가)100조 시장 노린 신약 쏟아진다 먹는 약부터 ADC(암세포만 골라 약을 전달하는 항암제) 치료제까지 中 기업도 맹추격"},{"s":"ST 렌푸가 19년 넘게 개발한 신약은 폐기됐고, 4억 달러의 자금이 낭비됐다.","so":"第一财经","tm":"11/25 15:08","c":1,"r":"cn","u":"https://www.yicai.com/news/103454004.html","p":1795586935,"a":1795612520,"t":"ST人福研发了19年以上的新药宣告放弃，4亿资金打水漂了","su":"19년 넘게 개발해온 신약, ST 렌푸(600079.SH)가 결국 무산됐다. 11월 25일 저녁, ST Renfu는 R&D 프로젝트 종료 및 자산 손상 조항 제공에 대한 발표를 발표했습니다. 이번에 종료된 연구개발은 생체치료제 1종 신약인 재조합 플라스미드-간세포 성장인자 주사제(이하 'pUDK-HGF')이다. 에스티휴먼푸의 자회사(다른 회사가 주인인 회사)인 우한옵틱스밸리휴먼푸바이오팜(이하 '옵티컬밸리휴먼푸', 지분 81.30% 보유)이 개발한 제품으로, 중증 하지 허혈성 질환으로 인한 사지 안정 통증 치료에 사용된다. 이 약은 2007년 4월 '의약품임상시험(새 약을 사람에게 시험하는 것) 승인'을 획득하고 1상 임상시험이 허가됐다. 2013년 3월에는 '의약품 임상시험 승인'을 획득하고 2상 임상시험을 실시할 수 있게 되었습니다. 2017년 9월에는 '의약품 임상시험 승인'을 획득해 3상 임상시험을 실시할 수 있게 됐다. 2024년 12월 Optics Valley Renfu는 국가 식품의약국에 판매 등록 신청서를 제출하고 승인되었습니다."},{"s":"바이오의약품에 대한 정책 지원이 크게 늘었고, 과학기술제약 ETF Harvest(588700)도 계속 수혜를 입을 것으로 예상된다.","so":"Jiemian.com","tm":"11/25 14:31","c":1,"r":"cn","u":"https://www.jiemian.com/article/15372010.html","p":1795584660,"a":1795589883,"t":"政策端对生物医药的支持力度显著增强，科创医药ETF嘉实(588700)有望持续受益","su":"2026년 11월 25일 13시 31분 현재 상하이 과학기술혁신위원회 생물의학지수는 0.74% 하락했다. Baili Tianheng이 5.54% 상승을 주도하고 Shengxiang Biotech이 1.52% 상승하고 Zejing Pharmaceutical이 1.51% 상승하는 등 구성 종목이 혼조세(오르는 것과 내리는 것이 섞인 모습)를 보였습니다. 메디실론이 하락세를 주도했고, MGI와 하이타이싱광이 그 뒤를 이었다."},{"s":"직장‧결장 수술부위 감염증 항생제 FDA 승인","so":"약업신문","tm":"11/25 14:01","c":1,"r":"kr","u":"http://m.yakup.com/news/?mode=view&cat=16&cat2=&cat3=0&nid=335707","p":1795582860,"a":1795589880},{"s":"FDA 승인으로 BridgeBio 주식에 대한 사례가 바뀔 수 있음","so":"Yahoo Finance","tm":"11/25 12:19","c":1,"r":"us","u":"https://finance.yahoo.com/healthcare/articles/fda-approval-may-change-case-031915636.html","p":1795576740,"a":1795582099,"t":"FDA Approval May Change The Case For BridgeBio Stock","su":"브리지바이오는 1차 및 주요 2차 평가변수를 충족한 3상 FORTIFY 시험 데이터를 기반으로 체중이 30kg 이상인 LGMD2I/R9 성인 및 소아 환자를 위한 경구 치료제인 Welgemda에 대해 기존 FDA 승인(미국에서 이 약을 팔아도 된다는 허가)을 받았습니다. Welgemda는 모든 형태의 사지 근이영양증에 대해 최초로 승인된 치료법이며 BridgeBio에 희귀 소아 질환 우선 검토 바우처를 제공합니다."},{"s":"美브릿지, '경구 리비톨' LGMD 첫 치료제 \"FDA 승인\"","so":"바이오스펙테이터","tm":"11/25 10:56","c":1,"r":"kr","u":"https://www.biospectator.com/news/view/30508","p":1795571760,"a":1795574626,"su":"미국 브릿지바이오파마(BridgeBio Pharma)의 경구 리비톨(ribitol) ‘BBT-418’이 체중 30kg 이상인 성인 및 소아 지대근이영양증 2I/R9형(LGMD2I/R9) 치료제로 미국에서 승인받았다."},{"s":"Alembic, 백혈병 치료제의 추가 효능에 대해 FDA 승인 획득","so":"ETPharma","tm":"11/25 10:41","c":1,"r":"world","u":"https://pharma.economictimes.indiatimes.com/amp/news/drug-approvals-and-launches/alembic-gets-fda-nod-for-additional-strength-of-leukemia-drug/136145441","p":1795570893,"a":1795608163,"t":"Alembic gets FDA nod for additional strength of leukemia drug","su":"Alembic Pharmaceuticals는 일반 백혈병 치료제 Bosutinib의 새로운 400mg 용량에 대해 FDA 승인(미국에서 이 약을 팔아도 된다는 허가)을 받아 혈액암 치료 분야에서 시장 입지를 확대했습니다."},{"s":"눈으로 심장질환 위험 읽는다…메디웨일, 美 FDA 승인 획득","so":"한스경제","tm":"11/25 10:18","c":1,"r":"kr","u":"http://www.hansbiz.co.kr/news/articleView.html?idxno=886970","p":1795569505,"a":1795574626,"su":"| 서울=한스경제 김동주 기자 | 망막 촬영만으로 심혈관질환 발생 위험을 예측하는 국내 인공지능(AI) 의료기기가 미국 시장 진출을 위한 규제 관문을 넘었다. 메디웨일은 망막 기반 심혈관질환 위험 예측 AI 소프트웨어 ‘닥터눈 CVD’가 미국 식품의약국(FDA(미국에서 약을 허가해 주는 정부 기관)) 510(k) 승인을 획득했다고 25일 밝혔다.닥터눈 CVD는 안저카메라로 촬영한 망막 이미지를 AI로 분석해 심혈관질환 발생 위험을 예측하는 의료기기다. 이번 FDA 승인(미국에서 이 약을 팔아도 된다는 허가)을 통해 향후 10년 내 첫 죽상경화성 심혈관질환(ASCVD)이 발생할 위험을 추정하는 기능을 인정받았다"},{"s":"애브비, 비분절성 백반증 치료제 린보크(린버크)에 대해 FDA 승인 획득","so":"Yahoo Finance","tm":"11/24 23:50","c":1,"r":"us","u":"https://finance.yahoo.com/healthcare/articles/abbvie-gets-fda-approval-rinvoq-145000786.html","p":1795531800,"a":1795560804,"t":"AbbVie Gets FDA Approval for Rinvoq in Nonsegmental Vitiligo","su":"애브비는 비분절성 백반증(피부 색이 하얗게 빠지는 병)에 대한 린버크에 대해 FDA 승인(미국에서 이 약을 팔아도 된다는 허가)을 받아 미국에서 이 질환에 대해 승인된 최초이자 유일한 전신 치료제가 되었습니다."},{"s":"'반제약' 민주당이 생명공학 주식의 큰 승리를 앗아갈 것인가?","so":"Investor's Business Daily","tm":"11/24 22:01","c":1,"r":"us","u":"https://www.investors.com/news/technology/biotech-stocks-election-2026-presidential-election-2028-drug-prices/","p":1795525260,"a":1795530490,"t":"Will 'Anti-Pharma' Democrats Chop Away At Biotech Stocks' Big Wins?","su":"생명공학 주식은 이달 초 워싱턴 D.C.를 휩쓸었던 블루 웨이브(민주당 압승)의 여파로 다소 불안하게 거래되었습니다."},{"s":"[美특징주]애브비, 백반증 치료 ‘린버크’ FDA 승인…개장전↑","so":"이데일리","tm":"11/24 20:51","c":1,"r":"kr","u":"https://www.edaily.co.kr/News/Read?newsId=04375526645649000&mediaCodeNo=257","p":1795521114,"a":1795521512,"su":"미국 제약사 애브비(ABBV)의 면역질환 치료제 ‘린버크(Rinvoq)’가 24일(현지 시간) 미국 식품의약국(FDA(미국에서 약을 허가해 주는 정부 기관))으로부터 비분절형 백반증(피부 색이 하얗게 빠지는 병) 치료제로 승인을 받았다. 미국에서 해당 질환에 대한 경구용 전신 치료제가 허가된 것은 이번이 처음이다.애브비에 따르면 FDA..."},{"s":"자오전위: 대사성 동반 질환, 혁신적인 약물 및 제약 서비스에 중점을 두어 포괄적인 환자 관리에 도움","so":"新华网","tm":"11/24 17:08","c":1,"r":"cn","u":"http://www.news.cn/health/20261124/a180147d69ac46b0915b73af92ce6d49/c.html","p":1795507688,"a":1795521516,"t":"赵振宇：聚焦代谢共病，创新药物与药学服务助力患者综合管理","su":"자오전위: 대사성 동반질환에 초점을 맞춘 혁신적인 약물 및 제약 서비스는 포괄적인 환자 관리에 도움이 됩니다. 혁신적인 대사성 약물은 환자 혜택과 진단 및 치료 능력 향상을 고려하여 의료 보험에 포함됩니다. 최근 몇 년 동안 수많은 혁신적인 대사 약물이 의료 보험 카탈로그에 포함되었습니다. 자오전위는 의약품 관리의 관점에서 볼 때 정책 시행이 개별 환자와 전반적인 임상(새 약을 사람에게 시험하는 것) 진단 및 치료 시스템에 큰 가치가 있다고 믿습니다."},{"s":"판밍(Fan Ming): 로봇공학, 혁신 의약품, 가전제품 분야에 중점을 두고 있습니다.","so":"第一财经","tm":"11/24 16:53","c":1,"r":"cn","u":"https://www.yicai.com/video/103452184.html","p":1795506786,"a":1795530493,"t":"凡明：关注机器人 创新药 消费电子板块"},{"s":"독점 | 바이엘은 다음 제약 거래가 더 많은 중간 단계 자산을 목표로 삼을 수 있다고 신호합니다.","so":"WSJ","tm":"11/24 16:26","c":1,"r":"us","u":"https://www.wsj.com/health/pharma/bayer-signals-next-pharma-deals-might-target-more-midstage-assets-79709e97","p":1795505160,"a":1795530491,"t":"Exclusive | Bayer Signals Next Pharma Deals Might Target More Midstage Assets"},{"s":"헤이룽장성: 혁신적인 의약품에 대한 지불 보장 범위를 확대하기 위해 상업 보험을 장려합니다.","so":"Jiemian.com","tm":"11/24 15:57","c":1,"r":"cn","u":"https://www.jiemian.com/article/15367835.html","p":1795503451,"a":1795504070,"t":"黑龙江：鼓励商业保险扩大创新药支付范围","su":"헤이룽장성 인민정부는 '헤이룽장성 보건 발전 15차 5개년 계획'을 발표하고 혁신적인 의약품과 의료기기 개발을 지원하겠다고 제안했습니다. 의료기관, 과학연구기관, 기업이 혁신신약(세상에 처음 나온 새로운 약) 임상시험(새 약을 사람에게 시험하는 것)과 의료기기 연구개발을 공동으로 수행할 수 있도록 지원하고, 기초연구 결과를 임상진단 및 치료계획으로 전환하는 것을 촉진한다. 세포치료제, 유전자치료제, 신규항체, 신규백신, 핵산의약품, 방사성의약품 등의 적용을 가속화하고, 응급백신과 의약품의 활용능력을 제고하며, 어린이용 의약품의 다양성을 풍부화한다. 인공지능 기반 의료 산업 전체 체인의 업그레이드를 촉진합니다. 혁신적인 의약품과 의료기기의 고품질 개발을 지원하기 위한 의료보험 메커니즘을 구현합니다. 금융기관이 혁신적 제약회사에 대한 투자와 융자지원을 강화하도록 지도하고 상업보험이 혁신적 의약품에 대한 지불 범위를 확대하도록 장려합니다."},{"s":"AI 의료 생태계는 계속해서 반복되고 있으며 앤트그룹 바이링의 의료 및 건강 시리즈 모델이 데뷔했으며 홍콩 혁신신약 ETF Boshi(520690) 추적 지수는 초기 거래에서 3% 이상 상승한 후 하락했습니다.","so":"Jiemian.com","tm":"11/24 12:17","c":1,"r":"cn","u":"https://www.jiemian.com/article/15366839.html","p":1795490220,"a":1795499041,"t":"AI医疗生态持续迭代，蚂蚁百灵医疗健康系列模型首次亮相，港股创新药ETF博时(520690)跟踪指数盘初涨超3%后回落","su":"홍콩 혁신신약(세상에 처음 나온 새로운 약) ETF Boshi(520690)는 항셍 홍콩 스톡커넥트(홍콩과 중국 본토 주식 w.reuters.com/legal/litigation/capricor-shares-crater-after-fda-rebuffs-duchenne-therapy-again-2026-11-23/","p":1795433049,"a":1795434990,"t":"Capricor shares crater after FDA rebuffs Duchenne therapy again"},{"s":"또 다른 혁신적인 약물이 상하이에서 승인되어 중국 내 Syk 표적치료제의 임상적 공백을 메웠습니다.","so":"第一财经","tm":"11/23 19:11","c":1,"r":"cn","u":"https://www.yicai.com/news/103450614.html","p":1795428702,"a":1795434981,"t":"上海又一创新药获批，填补国内Syk靶向治疗临床空白","su":"상하이 지역 혁신신약(세상에 처음 나온 새로운 약)이 또 다른 회원을 추가했다. 11월 23일, 국가의약품안전청(중국 국가약품감독관리국)은 허치슨의약(허치메드) (Shanghai)가 적용한 1등급 혁신신약 솔로피닙 아세테이트 정제(상표명: Savco)의 목록을 승인했다고 발표했습니다. 이는 중국에서 승인된 최초의 SYK 억제제이기도 합니다. 허치메드는 또한 상하이에서 5개 이상의 오리지널 신약에 대한 승인을 받은 최초의 회사가 되었습니다. 허치메드는 제일재경와의 인터뷰에서 신약으로서 solopinib의 승인은 허치메드의 연구 개발 파이프라인(개발하고 있는 신약 후보 목록)에서의 도약을 반영한다고 말했습니다. 이전에 허치메드는 단일 핵심으로 고형 종양의 표적 치료에 중점을 두었습니다. 솔로피닙 출시 이후 치메드는 고형종양+혈액면역 듀얼 트랙의 새로운 파이프라인 구조를 공식 구축해 단일 트랙에 대한 의존도를 벗어나 새로운 장기 성장곡선을 열었다."},{"s":"과거에는 바이오주가 큰 손실을 입어 신용거래가 정지되기도 했다. 증권거래소는 11개 종목의 운명이 매우 다르다고 발표했다.","so":"UDN","tm":"11/23 18:46","c":1,"r":"tw","u":"https://udn.com/news/story/7251/9896835","p":1795427211,"a":1795434989,"t":"昔日生技股后累虧遭暫停信用交易 證交所公布11檔股票命運大不同","su":"대만증권거래소는 상장회사(금융지주 제외)가 공시하는 3분기 실적(회사가 번 돈 성적표) 보고서에 대한 주당순가치 및 누적손실정보에 대한 검토를 완료했다고 23일 밝혔다. 피어바이오*-Chuangchuang(6949)은 막대한 금전적 손실로 인해 신용거래(돈을 빌려 주식을 사는 것)가 정지되었습니다. 이밖에도 정지된 타이벤(1310) 등 4개 트랜치, 이항(2601) 등 5개 트랜치가 마진거래와 증권 대차거래를 재개했고, 2개 트랜치는 계속 정지를 유지하고 있다. 조정된 목록은 24일부터 정식 시행된다."},{"s":"프랑스 생명공학회사, 주가 17% 급락 후 공매도자의 암 위험 주장 거부","so":"CNBC","tm":"11/23 18:45","c":1,"r":"us","u":"https://www.cnbc.com/2026/11/23/abivax-scorpion-capital-obefazimod.html","p":1795427142,"a":1795434979,"t":"French biotech rejects short seller’s cancer-risk claims after shares plunge 17%","su":"공매도(주식을 빌려서 먼저 파는 것)업체 스코피온 캐피털은 아비박스가 실험용 염증성 장질환 치료제에 심각한 과학적, 안전성 결점을 갖고 있다고 비난했습니다."},{"s":"51개의 새로운 클래스 1 혁신 의약품이 의료 보험 카탈로그에 추가되어 사상 최고치를 기록했으며 항셍 Shanghai-Shenzhen-Hong Kong Innovative Drug Select 50 Index가 3% 이상 상승했습니다.","so":"Jiemian.com","tm":"11/23 18:09","c":1,"r":"cn","u":"https://www.jiemian.com/article/15362954.html","p":1795424986,"a":1795434983,"t":"医保目录新增51个1类创新药，数量创历年新高，恒生沪深港创新药精选50指数收涨超3%","su":"항셍 상하이-심천-홍콩 혁신신약(세상에 처음 나온 새로운 약) 선택 50 지수(HSSSHID)는 3.18% 상승했으며 51개의 새로운 1급 혁신신약이 2026년 의료 보험 목록에 추가되었습니다. 셀레스티카 항셍 Shanghai-Shenzhen-Hong Kong Innovative Drug Select 50 ETF(여러 주식을 묶어 파는 상품) Link(A:014564, C:014565)가 지수를 추적합니다."},{"s":"[트렌드의 비결: 혁신의약품 부문이 강하게 반등했다! 지속적으로 상용화 검증을 진행 중이며 4개 주요 라인을 활용해 투자 기회 포착","so":"第一财经","tm":"11/23 18:02","c":1,"r":"cn","u":"https://www.yicai.com/vip/news/103450510.html","p":1795424555,"a":1795434984,"t":"[ 风口秘钥 创新药板块强势反弹！商业化持续验证 四大主线把握投资机遇","su":"11월 23일 혁신의약품 부문이 요동치며 인기를 끌었다. 라이미제약의 20CM 제한은 머크의 TROP2 ADC(암세포만 골라 약을 전달하는 항암제) 3상이 OS 엔드포인트에 도달하도록 촉진했으며 오픈AI는 MedChemBench를 출시하여 AI의 의약 화학 침투를 가속화했습니다. 증권사들은 해외BD가 2027년 상용화(실제로 팔고 쓰이기 시작하는 것)기에 돌입할 것으로 낙관하고 있으며, 의료보험 확대, 이익전환점 바이오텍, CXO 회복, AI제약 등 4대 요인에 집중할 것을 제안하고 있다."},{"s":"Haixi 신약: 당뇨병성 황반부종 치료용 HX9428이 국가식품의약국의 승인을 받아 2상 임상시험을 진행하고 있습니다.","so":"Jiemian.com","tm":"11/23 17:54","c":1,"r":"cn","u":"https://m.jiemian.com/article/15362854.html","p":1795424096,"a":1795434986,"t":"海西新药：HX9428治疗糖尿病性黄斑水肿获国家药监局批准开展II期临床试验","su":"11월 23일, 하이시신약은 당뇨병성 황반부종(\"DME\") 치료를 위해 자체 개발한 혁신적인 약물 프로젝트 HXP056의 후보 약물 분자 HX9428이 최근 중국 국가 의약품 관리국(NMPA) 약물 평가 센터(CDE)의 승인을 받고 2상 임상(새 약을 사람에게 시험하는 것) 시험을 실시하기로 동의했다고 홍콩 증권 거래소에서 발표했습니다. DME는 HX9428이 발전하는 두 번째 적응증이다."},{"s":"엔웨이제약(언웨이제약): 자체 자금 1억 위안으로 전액 출자 자회사 설립 계획","so":"Jiemian.com","tm":"11/23 17:54","c":1,"r":"cn","u":"https://m.jiemian.com/article/15362889.html","p":1795424086,"a":1795434987,"t":"恩威医药：拟以1亿元自有资金设立全资子公司","su":"엔웨이제약(언웨이제약)은 11월 23일 자사 자금 1억 위안을 투자해 전액 출자 자회사(다른 회사가 주인인 회사)를 설립할 계획이라고 발표했다. 신설법인은 여성건강 분야의 미충족 임상수요 해결과 여성건강 분야의 첨단 방향에 집중할 예정이다. 산부인과 분야에서 회사의 기존 브랜드, 제품 및 산업 기반을 결합하여 신기술 연구 개발 플랫폼(혁신적인 약물 연구 개발 플랫폼, 협력 연구 개발 플랫폼 등 포함) 구축, 산업 투자 및 인수 합병 통합을 통해 전 세계적으로 기술 혁신 역량과 산업 시너지 가치를 갖춘 고품질 프로젝트를 모색할 것입니다. 회사의 여성 건강 산업 배치를 지속적으로 개선 및 통합하고 장기적인 혁신 역량과 지속 가능한 개발 역량을 강화할 것입니다. 발표에 따르면 설립될 전액 출자 자회사의 중국 이름은 Chengdu Enwei Jieryinta Health이고 등록 주소는 쓰촨성 청두시 하이테크 존 Tianfu Avenue, Middle Section, Building 2, No. 666, 3406, 34th Floor입니다. 기업형은 총투자액과 등록자본금이 1억위안인 유한책임회사입니다. 엔웨이메디슨은 회사 지분(회사를 나눠 가진 몫) 100%를 보유하고 있으며 자금의 출처는 자체 자금으로 금전적 자금 형태로 투자되고 있습니다."},{"s":"Science and Technology Innovation 200 ETF 펑화(588240)의 기초지수는 5.2% 상승했습니다. 로봇공학, 의료, 반도체 등이 종합적으로 상승했고, 업종이 강한 반등을 이끌었습니다.","so":"Jiemian.com","tm":"11/23 16:40","c":1,"r":"cn","u":"https://www.jiemian.com/article/15362284.html","p":1795419636,"a":1795423999,"t":"科创200ETF鹏华(588240)标的指数上涨5.2%，机器人、医药、半导体集体拉升，板块迎来强势反弹","su":"뉴스: 1. 물리적 AI/휴머노이드 로봇(사람을 닮은 로봇): 가사 현장 검증, 대량 생산 첫 해의 분위기 설정: (1) 11월 22일 체화된 지능형 데이터에 대한 국가 표준 개발이 공식적으로 시작되었으며, '15차 5개년 계획' 기간 동안 20개 이상의 특별 국가 표준이 형성될 예정입니다."},{"s":"13:33:38 [해외시장에 진출하는 혁신의약품이 검증기간에 진입하였습니다. 홍콩증권연계 혁신의약품 ETF 이팡다(E Fund)(159316)의 배분가액에 주목하세요]","so":"财联社","tm":"11/23 14:33","c":1,"r":"cn","u":"https://www.cls.cn/detail/2541425","p":1795412018,"a":1795414337,"t":"13:33:38【创新药出海进入验证期，关注港股通创新药ETF易方达（159316）配置价值】","su":"해외시장에 진출하는 혁신신약이 검증기간에 돌입했습니다. 홍콩 스톡커넥트(홍콩과 중국 본토 주식을 서로 사고팔 수 있게 한 길) 혁신신약 ETF E Fund(159316)의 할당 가치에 주목하세요. 정오 마감 기준으로 항셍 홍콩 주식연계 혁신의약품지수는 0.2% 상승, CSI 홍콩증권연계 헬스케어 종합지수는 1.0% 상승, CSI 혁신의약산업지수는 0.6% 상승, CSI 생명공학 테마지수는 0.4% 상승, CSI300 헬스케어 지수는 0.1% 하락했다. CITIC 증권은 2027년을 바라보며 해외 임상시험과 혁신 신약 등록이 검증 기간에 돌입하고 각 기술 경로가 차별화되고 촉매 집약적일 것이라고 지적했습니다. 해외 수출의 증가와 전략적 제휴의 증가로 인해 우리는 기회와 위험이 공존하는 더 큰 시장과 더 복잡해진 경쟁 환경에 직면하게 될 것입니다. 혁신과 국제화를 중심으로 기회를 포착하는 동시에 한계 개선의 주요 라인에 더 많은 관심을 기울이는 것이 좋습니다. 전반적인 성장 유연성과 현금 지급 능력을 고려하고 차별화된 파이프라인(개발하고 있는 신약 후보 목록), 세계화 역량 및 운영 개선의 확실성을 갖춘 부문 리더를 선택합니다."},{"s":"[모닝포스트] 우칭이 발언합니다! 비정상적인 시장 변동을 효과적으로 방지하기 위해 시장 안정성을 위한 장기 메커니즘에 대한 심층 연구를 수행합니다. 51종의 1류 혁신신약이 국가의료보험 목록 새 버전에 포함되었습니다.","so":"财联社","tm":"11/23 14:02","c":1,"r":"cn","u":"https://www.cls.cn/detail/2534592","p":1795410163,"a":1795474272,"t":"【早报】吴清发声！深化市场稳定长效机制研究，有效防范市场异常波动；51个一类创新药进入新版国家医保目录","su":"① 우칭: 시장 안정을 위한 장기적인 메커니즘에 대한 연구를 심화하고 비정상적인 시장 변동을 효과적으로 방지합니다. ② 중국과 미국은 중미 무역 협의회 첫 회의를 개최했습니다. 경제 및 무역 협의 메커니즘 ③ 젤렌스키: 미국은 우크라이나가 NATO에 가입하는 대가로 돈바스 지역을 포기할 것을 제안했습니다. ④ 51개의 클래스 I 혁신신약(세상에 처음 나온 새로운 약)이 새 버전의 국가 의료 보험 카탈로그에 포함되었습니다. ⑤ BYD 네트워크 보고 센터는 \"특정 디지털 에너지가 BYD에 팔렸다\"는 온라인 소문이 사실이 아니라는 문서를 발행했습니다. 매크로 뉴스 1. 중국 증권감독관리위원회 위원장 Wu Qing은 제1회 중국 자본시장 학술 연차 회의에서 시장 안정을 위한 장기적인 메커니즘에 대한 연구를 더욱 심화하고 비정상적인 시장 변동을 효과적으로 방지할 것이라고 말했습니다. Wu Qing은 또한 투자자의 정당한 권익을 효과적으로 보호하기 위해서는 양적 거래, 지분(회사를 나눠 가진 몫) 축소 등 제도적 규칙의 최적화와 공정하고 합리적인 규제 조치에 대한 심층적인 연구와 평가가 필요하다고 말했습니다."},{"s":"홍콩 혁신 의약품 ETF 인베스코(513780) 추적 지수 CSI 홍콩 스톡커넥트 Innovative Drug Index는 1.29% 상승했으며 추적 지수는 지난 1년 동안 최저 평가에 도달했습니다.","so":"Jiemian.com","tm":"11/23 12:37","c":1,"r":"cn","u":"https://www.jiemian.com/article/15360892.html","p":1795405055,"a":1795408841,"t":"港股创新药ETF景顺(513780)跟踪指数中证港股通创新药指数上涨1.29%，跟踪指数已处近1年估值低位","su":"2026년 11월 23일 11시 22분 기준, 홍콩 혁신의약품 ETF(여러 주식을 묶어 파는 상품) 인베스코(513780) 추적지수 CSI 홍콩 스톡커넥트(홍콩과 중국 본토 주식을 서로 사고팔 수 있게 한 길) Innovative Drug Index는 1.29% 상승했으며, 지난 1년간 추적지수는 낮은 평가를 받았습니다."},{"s":"홍콩 스톡커넥트 Pharmaceutical ETF 펑화(513700)와 항셍 Biotech ETF 펑화(159130)가 활발하게 거래되고 있으며, 정책 및 산업 공조가 부문 시장을 촉진합니다.","so":"Jiemian.com","tm":"11/23 12:01","c":1,"r":"cn","u":"https://www.jiemian.com/article/15360535.html","p":1795402887,"a":1795408844,"t":"港股通医药ETF鹏华(513700)、恒生生物科技ETF鹏华(159130)交投活跃，政策产业共振催化板块行情","su":"뉴스에 따르면 11월 23일 2026년 의료보험과 상업보험의 '이중 카탈로그'가 공식 발표되어 결제 시스템이 '다층 결제, 가치 중심'으로 실질적 전환을 나타냈다. 또한, 글로벌 뇌-컴퓨터 인터페이스 기업 수는 2026년 800개 이상에서 1,175개로 증가해 2025년 대비 빠른 성장을 이룰 전망이다. 중국의 뇌-컴퓨터 인터페이스 산업은 베이징-천진-허베이, 장강 삼각주, 광둥, 홍콩, 마카오 등 3대 도시 집합체에 집중되어 있으며, 총 190개 이상의 기업이 전체 시장의 77.4%를 차지한다. 나라 전체. 종타이증권은 연준의 금리 인상(이자 비율을 올리는 것)에 대한 기대가 높아지고 임상 데이터 검증의 차이로 인해 장기 혁신의약품 자산의 가치 평가가 압박을 받았지만 업계의 번영은 근본적으로 변하지 않았다고 밝혔다. 현재 수익 예측 데이터를 활용해 계산하면 우시앱텍 등 일부 선두 CDMO의 벤치마크 시장가치 PER은 약 14.1배에 불과해 조정 밸류에이션(주가가 비싼지 싼지 따진 값) 수준이 매력적이다. 해외 금리 변동의 주기적 교란을 무시하고, 세계 최고의 역량을 갖춘 선도적인 CDMO와 거래량 및 가격 회복 리듬이 뚜렷한 선도적인 임상 CRO에 집중하고, 과매도 이후 가치 회복의 기회를 포착하는 것이 좋습니다."},{"s":"평가 1점: TROP2 ADC가 다시 임상 3상 성공을 달성하며, Kelun의 글로벌 약물 로직이 확고해졌습니다.","so":"第一财经","tm":"11/23 10:36","c":1,"r":"cn","u":"https://www.yicai.com/news/103449638.html","p":1795397812,"a":1795403779,"t":"壹评级：TROP2 ADC再获临床三期成功，科伦全球大药逻辑夯实","su":"11월 20일, 머크는 콜롬보트의 허가를 받은 TROP2 ADC(암세포만 골라 약을 전달하는 항암제) 약물 sac-TMT가 위식도 선암종에 대한 3상 연구에서 전체 생존율(OS)의 1차 평가변수를 달성했다고 발표했습니다. 중국 비즈니스 네트워크(제일재경)의 'One Rating'은 자궁내막암에 이어 난치성 위장관 종양에 대한 하드 엔드포인트를 통해 약효가 다시 한 번 검증되었으며, 이는 '글로벌 의약품'으로서의 잠재력이 확률적 판단에서 사실 확인으로 더욱 전환되었으며, 가치 평가의 확실성이 크게 향상되었음을 의미한다고 믿습니다. 원레이팅(One Rating)은 3차 위식도 선암종 환자들이 다제제 내성을 경험한 사례가 있으며, 중앙생존기간은 일반적으로 1년 미만이라고 지적했다. 이처럼 매우 이질적인 집단에서 임상(새 약을 사람에게 시험하는 것)적으로 의미 있는 전체 생존(OS) 이점을 달성하는 것은 sac-TMT가 강력하고 광범위한 항종양 활성을 가지고 있음을 입증합니다. 특정 바이오마커에 의존하지 않고 종양 유형 전반에 걸쳐 전체 생존(OS)을 개선하는 이러한 능력은 적응증 경계를 확장하는 혁신적인 약물에 대한 핵심 지원입니다. 본 연구의 2차 평가변수인 무진행 생존율(PFS)은 통계적으로 유의미한 수준에 도달하지 못했지만, 후기 치료와 의사의 화학요법 대조군 선택 측면에서 OS는 규제 기관에서 가장 중요하게 여기는 최적 기준이며, 긍정적인 결과는 핵심 적용 논리를 확립하기에 충분합니다."},{"s":"큐리언트 아드릭세티닙, 급성 골수성 백혈병 1차 치료로 임상 확대… FDA 승인 - 머니투데이","so":"머니투데이","tm":"11/23 08:50","c":1,"r":"kr","u":"https://www.mt.co.kr/index.php/stock/2026/11/23/2026112308460781755","p":1795391403,"a":1795392914,"su":"혁신신약(세상에 처음 나온 새로운 약) 개발기업 큐리언트는 미국 MD앤더슨 암센터가 주관하는 급성 골수성 백혈병(AML) 임상의 임상시험계획 변경이 미국 식품의약국(FDA)으로부터 승인됐다고 23일 밝혔다. 앞선 용량증가 단계에서는 베네토클락스를 포함한 표준 치료에 실패한 R/R AML 환자를 대상으로 Ven/Aza에 아드릭세티닙을 더한 3중 병용요법을 평가했으며, 연구진은 Ven/Aza와 병용할 때 아드릭세티닙의 임상 2상(새 약이 잘 듣는지 시험하는 단계) 권장용량을 120mg(1주 투여·1주 휴약)으로 결정했다."},{"s":"주가 방어 위해 생명공학업계, 자사주 희생 - Daily News","so":"工商時報","tm":"11/23 04:00","c":1,"r":"tw","u":"https://www.ctee.com.tw/news/20261123700180-439901","p":1795374000,"a":1795389899,"t":"捍衛股價生技業祭出庫藏股- 日報","su":"3분기부터 자사주(회사가 가진 자기 회사 주식)를 도입한 바이오기업들이 주가를 방어하는 모습을 보였다. 잇따라 자사주를 공모하거나 대주주들이 적극적으로 지분을 늘리고, 경영진이 지분 보유 락업 기간을 연장하는 등의 조치를 취하고 있다. 이로 인해 시장 보호의 물결이 시작되었습니다! 3분기 이후 캉페이*, Handa, Quanyu-KY, Changjia 등 8개 회사가 자사주를 공모했으며, 총 계획 자사주는 12,814주, 최대 자사주 매입(회사가 자기 주식을 다시 사는 것) 규모는 약 11억 7천만 위안입니다. 또 라멕스 회장은 지분을 늘리기 위해 약 820만 위안을 투자한 한강KY..."},{"s":"16개 바이 o":"朝日新聞","tm":"11/24 05:00","c":2,"r":"jp","u":"https://www.asahi.com/articles/DA3S16593915.html","p":1795464000,"a":1795474283,"t":"リチウムイオン電池、火災被害の電話相談 ２７日に日弁連 救済へ実態把握","su":"모바일 배터리 등에 쓰이는 리튬(배터리에 꼭 들어가는 아주 가벼운 금속) 이온 전지로 인한 화재가 늘어나는 가운데 일본 변호사 연합회(닛벤련)는 피해를 당한 사람을 대상으로 무료 전화 법률 상담을 27일 처음 실시한다. 피해 실태를 파악해, 구제에 연결…"},{"s":"'전고체 리튬이온 배터리 및 배터리 팩의 안전 기술 규격'을 공식적으로 편찬하기 위해 '고체 리튬 배터리 표준 사업단'을 구성한다.","so":"Jiemian.com","tm":"11/23 12:17","c":2,"r":"cn","u":"https://www.jiemian.com/article/15360779.html","p":1795403845,"a":1795408853,"t":"“固态锂电池标准项目组”将成立，正式编制《固态锂离子电池和电池组安全技术规范》","su":"공업정보화부 리튬(배터리에 꼭 들어가는 아주 가벼운 금속)이온 배터리 및 유사제품 표준 실무그룹에 따르면, 국가표준위원회가 2026년 제8차 권장 국가 표준 계획 및 관련 표준 외국어 버전 계획을 발표함에 따라 권장 국가 표준인 '고체 리튬이온 배터리 및 배터리 팩 안전 기술 사양'이 정식으로 발표, 제정됐다. 이 표준은 339-1(산업정보기술부(전자))에 의해 제안되고 중앙집중화되었으며, 초안 작성을 중국 전자기술표준화연구소에 위임되었습니다. 중국전자기술표준화연구소(China Electronics Technology Standardization Institute)는 산업정보기술부 리튬이온 배터리 및 유사 제품 표준 실무그룹의 사무국으로서 리튬이온 배터리 분야 국내 업계, 학계, 연구 및 사용자와 협력하여 공동으로 표준을 개발할 예정이다. 현재 실무그룹 산하에 '고체리튬전지 표준사업단'을 구성해 학회에서 표준사업팀 구성원 단위를 모집할 계획이다."},{"s":"[리포트 브리핑]에코프로비엠, '삼원계가 돌아설 때 가장 탄력적' 목표가 100,000원 - 흥국증권","so":"뉴스핌","tm":"11/23 12:05","c":2,"r":"kr","u":"https://www.newspim.com/news/view/20261123000614","p":1795403100,"a":1795403788,"su":"[서울=뉴스핌] 로보뉴스 = 흥국증권에서 23일 에코프로비엠(247540)에 대해 '삼원계가 돌아설 때 가장 탄력적'라며 투자의견(전문가가 사라·팔라고 내는 의견) 'BUY(신규)'의 신규 리포트를 발행하였고, 목표가 100,000원을 내놓았다. 전일 종가 기준으로 볼 때, 이 종목의 주가는 목표가 대비 20.9%의 추가 상승여력(앞으로 더 오를 수 있는 여유)이 있다는 해석이 가능하다. ◆ 에코프로비엠 리포트 주요내용 흥국증권에서 에코프로비엠(247540)에 대해 '2027년 실적 개선의 첫 동력은 인도네시아 BNSI 니켈 제련소."},{"s":"'자동차-전기 통합'이 점차 주류로 자리잡아 2위 신에너지 전력 배터리 기업이 떠오르고 있다 - 36Kr","so":"36kr.com","tm":"11/23 09:04","c":2,"r":"cn","u":"https://36kr.com/newsflashes/4081571998258309","p":1795392247,"a":1795392924,"t":"“车电融合”渐成主流，二线新能源动力电池企业崛起-36氪"},{"s":"탄산리튬이 60% 이상 떨어졌는데, 자동차 회사들은 왜 아직까지 좋은 삶을 누리지 못하는 걸까? -36Kr","so":"36kr","tm":"11/25 22:06","c":1,"r":"cn","u":"https://news.google.com/rss/articles/CBMiUEFVX3lxTE9FTU1xVEtVUE5wYUNsa0ZZT2dqdG1SZ25aLVNONGtuTE5BN29uT09qRUxKUDdlcnROMFlVWWo0ajF4aE84ei13MDVoUFpEZk81?oc=5","p":1795611978,"a":1795612532,"t":"碳酸锂跌幅超六成，车企咋还没过上好日子-36氪"},{"s":"리튬 배터리 수출은 첫 10개월 동안 137% 급증했으며, 창저우의 아프리카 무역은 30% 증가했습니다.","so":"中国新闻网","tm":"11/25 18:50","c":1,"r":"cn","u":"https://www.chinanews.com.cn/cj/2026/11-25/10737655.shtml","p":1795600233,"a":1795612533,"t":"前十月锂电池出口大增137% 常州对非洲贸易增三成","su":"리튬 배터리 수출은 첫 10개월 동안 137% 증가했으며, 창저우의 아프리카와의 무역은 30% 증가했습니다. 중국신보사, 창저우, 11월 25일(탕환 기자) 25일 창저우 세관 통계에 따르면 2026년 10월까지 창저우의 대외 무역 수출입 총액은 3325억6000만 위안으로 전년 대비(작년 같은 때와 비교해서) 8.9% 증가해 규모와 성장률 측면에서 장쑤성에서 5위를 차지했다. 그 중 리튬전지 수출액은 93억9000만 위안으로 동기 대비 137.2% 증가했다. 아프리카 수출입액은 146억 2천만 위안으로 동기 대비 30.8% 증가했습니다. 신에너지 제품의 수출과 신흥 시장의 발전은 창저우 대외 무역의 가장 두드러진 성장 포인트가 되었습니다. 4분기에 들어서면서 창저우의 대외 무역은 크게 가속화되었습니다. 10월 월 수출입액은 371억7000만 위안으로 전년 동기 대비 34.5% 증가했다. 대외무역 규모는 1분기 이후 분기별로 증가했다. 구조적으로 일반무역 수출입액은 2,807.5억 위안으로 대외무역 총액의 84.4%를 차지하며 지배적 지위는 안정적이었다. 가공무역 수출입액은 425억 위안으로 동기 대비 21.6% 증가했고 그 비중은 전년 동기 대비 1.3% 증가했다. 가공무역 비중의 반등은 국내 기업의 국제 수주(일감 주문을 받는 것) 능력이 지속적으로 향상되고 있음을 반영한다."},{"s":"CATL 주가 급락, 기관에서는 리튬 배터리 이익 및 생산 일정 기대가 압박을 받고 있다고 말합니다.","so":"第一财经","tm":"11/25 18:32","c":1,"r":"cn","u":"https://www.yicai.com/news/103454142.html","p":1795599178,"a":1795608190,"t":"宁德时代股价大跌，机构称锂电盈利、排产预期承压","su":"11월 25일, CATLA 주가는 8.33% 하락한 208.42위안으로 마감했으며, 총 시가총액(회사 전체 몸값)은 약 9,644억 위안으로 1조 위안 아래로 떨어졌습니다. 이는 2025년 4월 14일 이후 최저치이며 올해 5월 초 최고 수준에서 거의 55% 되돌린 수치입니다. H주는 12.23% 하락한 HK$295.6에 마감했으며, 올해 6월 초 고점 대비 누적 하락폭은 약 62%다. 같은 날 플러시배터리 업종지수(881281)도 6.12% 하락하며 큰 폭 하락했다. CATL과 리튬 배터리 업계를 둘러싼 여러 소식도 기관들이 배터리 재고 이익 전망을 낮추고, 11월 생산 일정을 낮추고, 탄산리튬(배터리 재료로 쓰는 리튬 가루) 선물 가격이 급락하는 등 시장의 주목을 받고 있다."},{"s":"주가는 하루 만에 8% 이상 하락했고, CATL의 시가총액은 1조 위안 아래로 떨어졌다.","so":"Jiemian.com","tm":"11/25 17:57","c":1,"r":"cn","u":"https://www.jiemian.com/article/15373101.html","p":1795597044,"a":1795608191,"t":"单日股价跌超8%，宁德时代市值跌破万亿元","su":"11월 25일 CATL(300750.SZ) 주가는 8.33% 하락한 208.42위안으로 마감하며 급락했다. A주(중국 본토(상하이·선전) 주식시장의 주식)의 총 시장가치는 약 9,644억 1,100만 위안입니다. 올해 5월 7일 CATL의 주가는 사상 최고치인 467.35위안을 기록했고, A주 시가총액(회사 전체 몸값)은 한때 2조1000억위안을 넘어섰다. 이후 회사 주가는 계속 하락세를 보였다. 11월 25일 장을 마감하는 현재 주가는 역사적 고점 대비 약 55.4% 하락했고, A주의 시가총액은 고점 대비 1조 1천억 위안 이상 감소했다. 원본 뉴스 출처: 제몐뉴스"},{"s":"논평: CATL에서 사업을 다각화하는 EV 제조사에게 낮은 가격이 항상 더 낮은 비용은 아닙니다.","so":"Caixin Global","tm":"11/25 17:57","c":1,"r":"us","u":"https://www.caixinglobal.com/2026-11-25/commentary-for-ev-makers-diversifying-from-catl-a-lower-price-isnt-always-a-lower-cost-102508665.html","p":1795597020,"a":1795608187,"t":"Commentary: For EV-Makers Diversifying From CATL, a Lower Price Isn’t Always a Lower Cost","su":"배터리는 자동차 재료비의 30% 이상을 차지하기 때문에 자동차 제조사에게는 더 저렴한 셀이 중요합니다. 그러나 보증 비용, 리콜 및 브랜드 손상은 절감액이 적립된 지 몇 년 후에 발생할 수 있습니다."},{"s":"항셍지수는 2만2000포인트 하락하며 7일 연속 하락해 253포인트 하락을 마감했다. 화홍그레이스 17% 하락, CATL 12% 하락 (16:15) - 20261125 - 실시간 금융뉴스","so":"明報財經網","tm":"11/25 17:42","c":1,"r":"hk","u":"https://finance.mingpao.com/fin/instantf/20261125/1795595609612/%E6%81%92%E6%8C%87%E5%A4%B1%E5%AE%88%E4%BA%8C%E8%90%AC%E4%BA%8C-%E9%80%A3%E8%B7%8C%E4%B8%83%E6%97%A5-%E6%94%B6%E5%B8%82%E8%B7%8C253%E9%BB%9E-%E8%8F%AF%E8%99%B9%E5%AE%8F%E5%8A%9B%E6%8C%AB17-%E5%AF%A7%E5%BE%B7%E6%99%82%E4%BB%A3%E7%80%8912","p":1795596158,"a":1795608195,"t":"恒指失守二萬二連跌七日收市跌253點華虹宏力挫17% 寧德時代瀉12% (16:15) - 20261125 - 即時財經新聞"},{"s":"<시간외 홍콩 증시> 항셍지수는 1.14% 하락하며 22,000선을 무너뜨렸다. 칩·리튬배터리 주가 급락","so":"鉅亨網","tm":"11/25 17:32","c":1,"r":"tw","u":"https://news.cnyes.com/news/id/6671683","p":1795595556,"a":1795608192,"t":"〈港股盤後〉恒指跌1.14% 失守22000點關口 晶片與鋰電池股重挫","su":"<시간외(정규 시간이 끝난 뒤 하는 거래) 홍콩 증시> 항셍지수는 1.14% 하락하며 2만2000선을 하회했다. 칩과 리튬 배터리 주가가 급락했다. 거형망(Anue) 뉴스센터 홍콩 주요 주가지수는 수요일(25일) 종합적으로 마감했고 항셍지수는 '7연속 하락'을 기록했습니다. 항셍지수는 장 초반 33포인트 상승한 뒤 288포인트나 오른 22,507포인트를 기록했다. 오후에는 하락세로 돌아서 22,000포인트 아래로 하락해 1.14% 하락한 21,966.01포인트에 마감했습니다. 항셍테크지수는 2.56% 하락한 3,378.26포인트로 마감했다. 국영기업지수는 0.91% 하락한 7,384.94포인트로 마감했다. 전체 시장의 하루 거래량(하루 동안 사고판 주식 수)은 2,299억 8천만 홍콩달러에 달했고, 홍콩증권거래소의 남쪽 방향 자금은 추세를 거스르며 64억 3,400만 홍콩달러를 순유입했습니다. 총 644개 종목이 상승했고,
