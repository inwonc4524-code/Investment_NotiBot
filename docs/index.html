.none{color:var(--sub);margin:24px 4px;text-align:center}

.card:hover{background:var(--card2)}.card:active{opacity:.75}
.meta{color:var(--sub);font-size:12px}
.title{font-weight:500;margin-top:3px}
.orig{color:var(--sub);font-size:12px;margin-top:3px}
.new{margin-left:4px;color:var(--red);font-size:11px;font-weight:700;letter-spacing:.3px}
.hot{display:inline-block;margin-right:6px;padding:0 6px;border-radius:4px;background:rgba(217,119,87,.16);color:var(--acc);font-weight:600}
.hot.big{background:var(--acc);color:#1f1e1d}
.newbar{display:block;width:100%;margin:2px 0 6px;padding:9px;border:0;border-radius:10px;background:rgba(239,68,68,.14);color:#fca5a5;font:inherit;font-size:13px;text-align:left}
.more{display:block;width:100%;margin:4px 0 0;padding:10px;border:1px dashed var(--line);border-radius:12px;background:transparent;color:var(--sub);font:inherit;font-size:13px}
footer{margin:36px 4px 0;padding-top:14px;border-top:1px solid var(--line);color:var(--sub);font-size:12px;line-height:1.7}
footer b{color:var(--text);font-weight:600}

#dim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:5}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:6;max-width:760px;margin:auto;max-height:82vh;overflow-y:auto;

.grab{width:38px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 12px}
.s-title{font-size:17px;font-weight:600;margin:4px 0 2px;line-height:1.45}
.s-label{margin:16px 0 4px;color:var(--acc);font-size:12px;font-weight:700;letter-spacing:.5px}
.s-sum{font-size:15px;line-height:1.75}.s-sum.empty{color:var(--sub);font-size:13.5px}
.s-btns{display:flex;gap:8px;margin-top:20px}
.s-btns button,.s-btns a{flex:1;text-align:center;padding:12px;border-radius:10px;font:inherit;font-size:14.5px;text-decoration:none}
.s-btns button{background:transparent;border:1px solid var(--line);color:var(--sub)}
.s-btns a{background:var(--acc);color:#1f1e1d;font-weight:600}

) 주식이 급락한 것은 AI 수요가 갑자기 사라진 것이 아니라, 가치평가 기준이 다시 쓰여지고 있다는 점이다. 시장에서는 데이터 센터, 칩, 컴퓨팅 성능에 대한 투자를 성장의 보장으로 여겼습니다. 이제는 막대한 자본 지출이 언제 수익, 이익, 현금 수익으로 전환될지에 대해 더욱 관심을 기울이고 있습니다. 규제 위험, 자금 조달 비용 및 투자 회수 기간에 대한 불확실성으로 인해 가치가 높은 컨셉 주식, 차입에 대한 의존도 또는 아직 수익을 내지 못한 주식이 가장 먼저 타격을 입게 되었습니다. 즉, AI 트레이딩은 '많이 투자할수록 좋다'에서 '투자하면 돈을 벌 수 있다'로 바뀌고 있는 것이다."},{"s":"충격적인 월스트리트! 머스크는 스페이스X의 연간 매출이 내년 말까지 5000억 달러를 초과할 것이라고 자랑한다.","so":"财联社","tm":"11/09 11:57","c":1,"r":"cn","u":"https://www.cls.cn/detail/2528042","p":1794193038,"a":1794207232,"t":"震惊华尔街！马斯克豪言：SpaceX明年底年化营收或超5000亿美元","su":"① 미국의 억만장자 Elon Musk는 금요일에 SpaceX의 연간 수익이 2027년 12월까지 5000억 달러를 초과할 것으로 예상된다고 말했습니다. ② 그는 또한 SpaceX의 연간 수익이 1조 달러에 도달하는 것이 불가능하지 않다고 말했습니다. ③Musk의 기대는 월스트리트의 가장 낙관적인 분석가들조차 충격에 빠뜨렸다. Financial News Agency, 11월 7일(편집자 Bian Chun) 미국의 억만장자 Elon Musk는 금요일에 SpaceX의 연간 매출이 2027년 12월까지 5천억 달러를 초과할 것으로 예상된다고 말했습니다. 이 예측은 로켓, 위성 및 인공 지능(AI) 회사에 대한 월스트리트 분석가들의 기대를 훨씬 뛰어넘는 것입니다. 머스크는 투자 컨퍼런스에서 \"2027년 12월까지 우리의 연간 반복 수익이 5000억 달러를 초과할 가능성이 매우 높아 보인다\"고 말했다. \"이것은 약속이 아니라 단지 최선의 추측일 뿐입니다.\" 그는 또한 SpaceX가 연간 매출 1조 달러 규모를 달성하는 것이 불가능하지 않다고 말했습니다."},{"s":"대만 주식이 좋은데, 미국 주식도 놓치지 마세요! 펀드 대모 Xiao Biyan: \"풍수는 교대로 진행해야 한다\", \"시장, 폭, 성과\"라는 주식 선택 사고방식을 마스터해야 함","so":"TVBS新聞網","tm":"11/09 11:54","c":1,"r":"tw","u":"https://news.tvbs.com.tw/money/4047768","p":1794192840,"a":1794195216,"t":"台股好，美股也別錯過！基金教母蕭碧燕：「風水要輪流轉」掌握「市、寬、績」選股心法","su":"대만 주식은 최근 AI 공급망 강화로 수혜를 입어 많은 투자자들의 관심을 끌었다. 펀드 대모 Xiao Biyan은 TVBS '금융 권력' 프로그램에서 사람들이 대만 주식의 뛰어난 성과 때문에 미국 주식에 투자할 필요가 없다고 느낄 수 있다고 상기시켰습니다. 그러나 시장 회전은 예측하기 어렵고 \"풍수는 차례대로 진행되어야 합니다.\" 다른 시장의 기회를 살펴볼 수도 있습니다. 그녀는 대만 주식을 급하게 팔 필요가 없다고 제안했다. 개인 상황에 따라 매달 신규 투자 자금을 조정하고 점차적으로 해외 시장에 통합할 수 있습니다."},{"s":"월스트리트와 경쟁하다 - Wen Jie | 정책 리스크 증가, AAOI의 장기 전망은 변함 없음(영화 포함) | 특별 주제 - 뉴스","so":"etnet 經濟通","tm":"11/09 11:44","c":1,"r":"hk","u":"https://www.etnet.com.hk/www/tc/news/news-article.php?section=features&category=interview&newsid=415928","p":1794192240,"a":1794195198,"t":"比拼華爾街－溫傑 | 政策風險上升，AAOI長期前景未變（有片） | 專題透視 - 新聞","su":"월스트리트와 경쟁하다 - Wen Jie | 정책 리스크 높아져, AAOI의 장기 전망은 변함없다(필름 포함) 최근 조정 끝에 지난 금요일(6일) 자금이 일시적으로 인공지능(AI)과 칩주에 복귀하면서 필라델피아 반도체 지수(페이반)가 4.2% 반등했다. 그러나 미국 3대 주가지수는 S&P 500과 나스닥이 각각 1.1%, 0.3% 하락한 반면 다우존스산업평균지수는 0.5% 하락하는 등 또다시 서로 다른 흐름을 보였다. 일주일 내내 반도체 부문은 여전히 ​​큰 폭으로 하락했으며, 비용은 12.2% 감소했다. Blue Wave가 AI 인프라 기대에 미치는 영향 지난주 AI 컨셉주가 급락한 이유는 미국 중간선거에서 비롯됐다. 민주당은 뜻밖의 '블루 웨이브'를 일으키며 상하원 장악력을 탈환했다. 특히 텍사스 주지사의 변화는 주목할 만하다."},{"s":"AI 버블 | 엔비디아의 미국 주식은 시간외 거래에서 급락했으며 하락 폭은 4% 이상으로 확대되었습니다.","so":"etnet 經濟通","tm":"11/09 11:34","c":1,"r":"hk","u":"https://www.etnet.com.hk/www/tc/us-stocks/news-article/415921/AI%E6%B3%A1%E6%B2%AB+%7C+%E8%8B%B1%E5%81%89%E9%81%94%E7%BE%8E%E8%82%A1%E7%9B%A4%E5%BE%8C%E4%BA%A4%E6%98%93%E6%99%82%E6%AE%B5%E5%A4%A7%E8%B7%8C%EF%BC%8C%E8%B7%8C%E5%B9%85%E6%93%B4%E8%87%B3%E9%80%BE4%25","p":1794191681,"a":1794195200,"t":"AI泡沫 | 英偉達美股盤後交易時段大跌，跌幅擴至逾4%"},{"s":"모건스탠리: 미국 주식 매도세가 끝나가고 있으며 향후 2~3주는 포지션을 추가하기에 좋은 시기입니다.","so":"鉅亨網","tm":"11/09 11:25","c":1,"r":"tw","u":"https://news.cnyes.com/news/id/6652474","p":1794191128,"a":1794207244,"t":"摩根士丹利：美股拋售接近尾聲 未來兩、三周是加倉好時機","su":"윌슨은 미국 주식이 반등할 것으로 확신하며 연말까지 S&P 500 지수 목표인 8,000을 고수하고 있습니다.\n윌슨과 많은 월스트리트 분석가들은 이러한 급격한 하락이 최근 몇 주 동안 S&P 500 지수에 대한 매도 압력이 끝났음을 증명한다고 믿고 있습니다. 이는 AI 시장이 무너지고 있다는 신호는 아니다.\nAI 열풍에 대한 몇 달 간의 투자자 불안은 11월 2~6일 주간에 글로벌 시장 혼란으로 바뀌었다."},{"s":"미국 증시 '중간선거 후폭풍' 지속 가능성에 전망 엇갈려, 한국에도 핵심 변수","so":"비즈니스포스트","tm":"11/09 11:24","c":1,"r":"kr","u":"https://www.businesspost.co.kr/BP?command=article_view&num=451503","p":1794191063,"a":1794195127},{"s":"이해할 수 있는 하나의 테이블! 월스트리트는 “완전히 확신”한다: 연준이 이번 주에 금리를 인상할 것이다","so":"财联社","tm":"11/09 11:24","c":1,"r":"cn","u":"https://www.cls.cn/detail/2481857","p":1794191044,"a":1794207233,"t":"一张表看懂！华尔街“彻底信了”：美联储本周加息","su":"① \"신연방준비은행 뉴스 서비스\"에 따르면, 이전에 9월 금리 인상을 예상하지 않았던 거의 모든 연준 관측자들은 8월 CPI 데이터가 예상보다 약간 높자 예측을 변경했습니다. ② 티미라오스가 집계한 20개 주요 투자은행 기관 중 무려 17개 기관이 현재 연준이 이번 달 금리를 인상할 것으로 예상하고 있다. Financial News Agency, 9월 14일(Editor Xiaoxiang) 투자자들은 이번 주 연준 금리 회의를 준비하고 있습니다. 연준이 금리를 다시 인상할 것으로 널리 예상되고 있으며, 이는 이미 채권수익률 상승에 취약한 글로벌 금융시장에 새로운 위협이 될 가능성이 높습니다. 수년 동안 미국의 인플레이션율은 연준의 목표인 2%보다 꾸준히 높은 수준을 유지해 왔으며, 금리 인상은 물가를 안정시키기 위한 중앙은행의 핵심 통제 도구였습니다."},{"s":"월스트리트 트레이더들은 지금이 낮은 가격으로 돈을 벌 수 있는 좋은 시기라고 말합니다. S&P 500 지수는 이번 주 동안 2.7% 하락했으며 연말까지 8,000에 도달할 것으로 예상됩니다. 미국 선거 추적 - 특별 주제","so":"信報網站","tm":"11/09 11:20","c":1,"r":"hk","u":"https://www.hkej.com/features/article/%E7%BE%8E%E5%9C%8B%E5%A4%A7%E9%81%B8%E9%81%B8%E6%83%85%E8%BF%BD%E8%B9%A4/1431049423/%E8%8F%AF%E7%88%BE%E8%A1%97%E4%BA%A4%E6%98%93%E5%93%A1%E5%96%8A%E4%BD%8E%E6%92%88%E5%A5%BD%E6%99%82%E6%A9%9F","p":1794190819,"a":1794195201,"t":"華爾街交易員喊低撈好時機 標指一周跌2.7% 年底仍上望8000 美國大選選情追蹤 - 專題","su":"지난 주 미국 증시는 급격한 하락세를 보였으며, S&P 500 지수는 이번 주 동안 2.7% 하락했습니다. 대형 기술주들이 주도하는 나스닥 100 지수는 4.91% 더 하락했다. Morgan Stanley, Goldman Sachs 등 주요 은행의 전략가들은 지금이 바닥을 찾을 수 있는 기회라고 믿습니다. Bank of America와 Standard Chartered는 중간 선거 결과가 미국 달러에 대한 낙관적인 전망을 바꾸지 못했다고 지적했습니다. 매도파 끝에는 비AI 거래가 무너지고 인공지능(AI) 언와인딩이 대세였다. 지난 목요일 현재 미국 주식시장의 가치는 10월 6일 최고치 이후 5조7000억 달러나 증발했다. 모건스탠리 전략가 마이클 윌슨은 앞으로 2~3주는 위험 노출을 늘리는 기간이 될 것이라고 말했다."},{"s":"아시아주 반발, 나스닥 내리막에서 안도 엔비디아 불륜은 중석","so":"株探","tm":"11/09 11:20","c":1,"r":"jp","u":"https://s.kabutan.jp/news/n202611090445/","p":1794190800,"a":1794195190,"t":"アジア株反発、ナスダック下げ止まりで安堵 エヌビディア不倫は重石","su":"아시아주 반발, 나스닥 하락 정지로 안도 3675.36(+26.19 +0.72%) 대만 가권지수 41617.14(+1915.50 +4.82%) 한국종합주가지수 5124.27(+64.58 +1.28%) 호ASX203지수 900 아시아주는 호주를 제외하고 상승. 나스닥 내리막에 안도, 하이테크로 환매의 움직임을 볼 수 있다."},{"s":"미국 주식에 대한 팁 | 일주일 만에 4조 달러 이상이 증발했는데, 데이터센터 패닉은 언제 끝날 것인가?","so":"第一财经","tm":"11/09 11:16","c":1,"r":"cn","u":"https://www.yicai.com/news/103431102.html","p":1794190567,"a":1794207234,"t":"美股点金丨一周蒸发超4万亿美元，数据中心恐慌何时结束","su":"{{aisd}} AI가 생성한 면책 조항 월스트리트는 미국 3대 주식 지수의 총 시장 가치가 약 미화 4조 1천억 달러 증발하는 등 소란스러운 한 주를 다시 한번 경험했습니다. 시장의 패닉은 미국 중간선거 이후 민주당이 상·하원을 장악하면서 비롯됐다. 투자자들은 인공지능(AI) 산업에 대한 규제 강화와 데이터센터 건립 승인 둔화로 기술주 집중 매각이 촉발될 것을 우려하고 있다. 최근 비농업 고용지표 발표 이후 미국 채권수익률이 급등하면서 연준이 12월 금리를 인상할 것이라는 전망이 더욱 높아졌습니다. 미국 증시는 다음주 성장주 패닉에서 벗어나기 위한 노력을 이어갈 가능성이 있는 가운데, 중동 정세 등 지정학적 리스크와 연준의 정책 기대 등 요인들이 시장을 불안하게 만들 가능성이 크다. 연준이 12월 금리를 인상할 것이라는 기대감이 높아졌다. 이번 주 비농업 고용 보고서에 따르면 미국의 고용 조건이 개선되어 연준의 추가 금리 인상에 대한 기대감이 높아졌습니다. 미국 노동부 보고서에 따르면 지난 10월 미국의 비농업 고용은 16만5000명 증가해 시장 컨센서스인 6만5000명을 크게 웃돌았다. 9월 고용은 최대 6만명으로, 8월에는 18만6천명으로 수정됐다. 고용순증가는 84,000명이다."},{"s":"미국 주식 마감: 칩, 스토리지 및 광학 개념이 급락했으며 나스닥은 2.6% 하락했습니다.","so":"财联社","tm":"11/09 11:11","c":1,"r":"cn","u":"https://www.cls.cn/detail/2512879","p":1794190270,"a":1794207494,"t":"美股收盘：芯片、存储、光概念大幅回落 纳指重挫2.6％","su":"① SpaceX는 9% 이상 하락한 반면 Apple은 1% 이상 상승하여 새로운 최고치를 기록했습니다. ② 필라델피아 반도체 지수는 거의 7% 하락했고, 모든 구성 종목이 하락했습니다. ③ 스토리지 개념이 급격히 하락하여 SanDisk와 Hynix가 8% 이상 하락했습니다. ④ Western Digital의 첫 번째 회계 분기 순이익은 전년 대비 55% 증가했습니다. Financial News Agency, 10월 23일(자오하오 편집자) 목요일(10월 22일) 인공지능 기업의 지출에 대한 시장 우려가 다시 한 번 심화되고 지정학적 긴장이 고조되면서 미국 주식 기술 부문이 크게 약세를 보였습니다. 마감 기준 나스닥 종합지수는 2.6% 하락한 26008.86포인트를 기록했다. S&P 500 지수는 1.21% 하락한 7663.43포인트를 기록했습니다. 다우존스 지수는 0.02% 상승한 52867.98포인트로 3일 연속 상승했다."},{"s":"<대만 주식 오픈> 정책이 강세를 보이고 미국 증시는 반등했습니다. 대만 증시는 반등하며 1,000포인트 이상 상승해 41,000선을 돌파했습니다.","so":"鉅亨網","tm":"11/09 10:36","c":1,"r":"tw","u":"https://news.cnyes.com/news/id/6652764","p":1794188170,"a":1794207503,"t":"〈台股開盤〉政策利多、美股回彈 台股回神漲逾千點站回4萬1關卡","su":"<대만 주식 오픈> 긍정적인 정책에 미국 증시는 반등했고, 대만 증시는 반등하며 1,000포인트 이상 상승해 41,000선을 회복했습니다. Juheng.com 기자 Liu Minyu, 타이페이 대만 주식은 지난 주 5,000포인트 이상 급락했습니다. 그러나 금융감독위원회가 단기지시를 내렸고, 국가안전보장기금이 시장을 보호하기 위해 시장에 뛰어들면서 지난 금요일(6일) 미국 증시는 전반적으로 반등했다. 전자중량주의 강한 반등에 힘입어 대만증시는 오늘(9일) 1,600포인트 이상 상승해 최고 41,399.58포인트를 기록하며 다시 41,000선을 돌파했고, 추정거래량은 9,800억 위안에 이른다. 오늘 전자주가 회복세를 보이며 급등했습니다. TSMC(2330-TW)는 75위안, 즉 3% 이상 장을 열었고, 델타전자(2308-TW)는 일일 한도를 돌파했고, 미디어텍(2454-T W)과 혼하이(2317-TW)는 한도의 절반 이상 오른 반면, ASE(3711-TW), UMC(2303-TW), 콴타(2382-TW)는 모두 2~3% 상승했다."},{"s":"매파적 입장과 결합된 강력한 비농업 고용 UBS는 연준이 올해 두 번 금리를 인상할 것으로 예상합니다.","so":"财联社","tm":"11/09 10:35","c":1,"r":"cn","u":"https://www.cls.cn/detail/2476360","p":1794188157,"a":1794207496,"t":"非农强劲叠加鹰派表态 瑞银预计美联储年内加息两次","su":"① 미국의 8월 비농업 고용은 162,000만큼 증가하여 예상을 초과했습니다. Warsh 연준 의장의 매파적인 신호와 함께 UBS는 연준이 9월과 12월에 각각 25bp씩 인상할 것으로 예상합니다. ② UBS는 두 가지 시나리오를 제안합니다. AI가 강력한 경제를 주도한다면 금리 인상은 온화한 긴축입니다. 인플레이션이 지속되고 성장이 둔화되면 위험 자산은 압박을 받게 됩니다. Financial Associated Press, 9월 7일(편집자 Niu Zhanlin) 8월 미국의 비농업 고용 지표가 예상을 크게 웃돌았습니다. 최근 연준의 매파적인 기조와 맞물려 연준이 연내 금리 인상을 재개할 것이라는 시장의 기대는 더욱 높아졌다. UBS의 최신 예측에 따르면 연준은 9월과 12월에 각각 금리를 25bp 인상하여 올해 전체 금리 인상 폭은 50bp가 될 것으로 예상됩니다. 이에 앞서 UBS는 연준이 올해 금리를 조정할 것으로 예상하지 않았다."},{"s":"S&P500·美 단기국채 반반…퇴직연금 안전자산으로 활용 [ETF줌인]","so":"서울경제","tm":"11/09 10:35","c":1,"r":"kr","u":"https://www.sedaily.com/article/20111848","p":1794188142,"a":1794195127,"su":"S&P500·美 단기국채 반반…퇴직연금 안전자산으로 활용 [ETF줌인] ■1Q 미국S&P500미국채혼합50액티브 순자산 3239억…상장 이후 수익률 14.68% S&P500 실질 투자 비중 최대 85%…월분배로 현금흐름 확보 미국 대표지수에 투자하면서 퇴직연금 안전자산으로 활용할 수 있는 채권혼합형 상장지수펀드(ETF)가 주목받고 있다. 주식과 채권을 함께 담아 변동성을 낮추면서 퇴직연금의 위험자산 투자 한도 안에서 미국 주식에 대한 투자 비중을 높일 수 있다는 점이 특징이다."},{"s":"미국 기술주 붕괴는 시작에 불과할까? Goldman Sachs는 부외 부채에 3조 6천억 달러의 위험이 숨겨져 있어 AI 부채가 급증할 것이라고 경고했습니다.","so":"自由時報","tm":"11/09 10:35","c":1,"r":"tw","u":"https://stock.ltn.com.tw/article/gadg8er3bucm","p":1794188122,"a":1794207504,"t":"美股科技股崩跌只是開端？高盛示警AI債務狂飆 表外負債藏3.6兆美元風險","su":"최근 미국 기술주들이 큰 폭의 손실을 입었고, 인공지능(AI) 투자 붐에 따른 부채 위험도 점차 표면화됐다. 골드만삭스는 5대 클라우드 컴퓨팅 기업이 불과 일주일 만에 670억 달러(약 NT$2조1900억)의 채권을 발행해 올해 누적 채권 발행 규모가 2960억 달러(약 NT$9조7000억)로 늘어나 당초 연간 전망 상한선을 초과했을 뿐만 아니라 신용시장에 공급 압박이 증가하고 있다고 경고했다. Goldman Sachs는 AI가 다음과 같이 지적했습니다."},{"s":"마이크론 PER 3.8배…S&P 500 구성종목 중 498위","so":"연합뉴스","tm":"11/09 10:30","c":1,"r":"kr","u":"https://www.yna.co.kr/view/AKR20261109049800009","p":1794187827,"a":1794205981,"su":"(서울=연합뉴스) 주종국 기자 = 미국 메모리 반도체 기업 마이크론 테크놀러지주가가 급락해 향후 12개월 예상 주가수익비율(PER)이 3.8배로..."},{"s":"오리콘 뉴스: 다운타운의 만남에… 요코야마 야스시씨가 “충격의 한마디” “너희들이 하고 있는 것은…” 하마다가 회고","so":"毎日新聞","tm":"11/09 10:23","c":1,"r":"jp","u":"https://mainichi.jp/articles/20261109/orc/00m/200/039000c","p":1794187404,"a":1794207246,"t":"オリコンニュース：ダウンタウンの漫才に…横山やすしさんが“ 潮重臨？"},{"s":"美 연준 금리 인상 기대 상승에 원·달러, 1360원대 육박","so":"뉴시스","tm":"11/09 09:45","c":1,"r":"kr","u":"https://mobile.newsis.com/view_amp.html?ar_id=NISX20261109_0003859935","p":1794185114,"a":1794207224,"su":"[서울=뉴시스]김래현 기자 = 미국 연방준비제도(Fed·연준)의 금리 인상 기대가 커진 가운데 원·달러 환율이 1350원대 후반에서 움직이고 있다"},{"s":"연준은 예정대로 기준금리를 동결했고, 투표위원 2명은 금리를 25bp 인상할 것을 주장했다.","so":"财联社","tm":"11/09 09:38","c":1,"r":"cn","u":"https://www.cls.cn/detail/2518477","p":1794184704,"a":1794207499,"t":"美联储如期维持基准利率不变 两名票委主张加息25个基点","su":"① 연준은 시장의 일반적인 기대에 맞춰 연방기금 금리 목표 범위를 3.75~4%로 유지하겠다고 밝혔다. ② Lisa Cook과 Beth Hammack은 반대표를 던졌고, 이번 회의에서 연방기금 금리의 목표 범위를 25bp 늘리는 것을 선호했습니다. Financial Associated Press, 10월 29일(자오 하오 편집자) 베이징 시간으로 목요일(10월 29일) 이른 아침, 연준은 일반 시장 기대에 맞춰 연방기금 금리 목표 범위를 3.75~4%로 그대로 유지할 것이라고 발표했습니다. 지난달 연준은 3년여 만에 처음으로 금리를 인상해 연방기금 금리 목표 범위를 3.75~4%로 25bp 인상했다. 보도자료에 따르면 연방공개시장위원회(FOMC)는 찬성 10표, 반대 2표로 결의안을 통과시켰다. 성명서는 연준의 이중 임무 실현을 지원하기 위해 FOMC가 연방기금 금리 목표 범위를 3.75~4%로 유지하기로 결정했다고 밝혔습니다. 위원회는 은행 시스템에서 적절한 준비금을 유지하기 위한 정책을 계속해서 시행할 것입니다."},{"s":"지난주 미국 3대 주가지수는 모두 하락했고, 나스닥은 3.37% 하락했다. Jen-Hsun Huang은 부정 행위를 인정했으며 시장은 Nvidia의 주가에 주목했습니다 | 특별 통찰 - 뉴스","so":"etnet 經濟通","tm":"11/09 09:36","c":1,"r":"hk","u":"https://www.etnet.com.hk/www/tc/news/news-article.php?section=features&category=financenews&newsid=415907","p":1794184560,"a":1794206008,"t":"美股三大指數上周全跌，納指累挫3.37%，黃仁勳認出軌，市場關注英偉達股價 | 專題透視 - 新聞","su":"지난주 미국 3대 주가지수는 모두 하락했고, 나스닥은 3.37% 하락했다. Jen-Hsun Huang은 탈선을 인식했고 시장은 Nvidia의 주가에 주목했습니다. 미국 주식은 지난 금요일(6일) 개별적으로 상승했습니다. 전 거래일 급락 이후 기술주가 반등하면서 나스닥과 S&P 500이 반등했습니다. 그러나 다우지수는 압박을 받고 있었고, 3개 주요 지수는 서로 다른 추세를 보였습니다. 시장은 한편으로는 기술주의 반등을 소화하고 있는 반면, 다른 한편으로는 미국의 강력한 고용지표가 연준의 통화정책에 미칠 영향을 우려하고 있습니다. 다우지수는 237.33포인트, 즉 0.46% 하락한 51,285.73포인트에 마감했습니다. S&P 500은 23.13포인트, 즉 0.31% 상승한 7,376.86포인트를 기록했습니다. 나스닥지수는 264.43포인트(1.09%) 오른 24,579.42포인트에 거래됐다. 한 주 전체를 기준으로 계산하면 이번 주 다우존스 산업평균지수는 0.94%, S&P 지수는 2.68%, 나스닥 종합지수는 3.37% 하락했다."},{"s":"[주간 뉴욕증시] AI株 급락 후 반등 이어질까…물가·실적에 촉각","so":"뉴시스","tm":"11/09 09:32","c":1,"r":"kr","u":"https://mobile.newsis.com/view_amp.html?ar_id=NISX20261109_0003859757","p":1794184342,"a":1794207224,"su":"[서울=뉴시스]박미선 기자 = 미국 뉴욕증시가 인공지능(AI) 관련주 급락 이후 반등을 시도하는 가운데 이번 주 발표되는 주요 물가지표와 AI 인프라 기업들의 실적이 증시 향방을 좌우할 전망이다"},{"s":"지난 금요일 미국 증시의 AI 칩 부문이 집합적으로 반등했으며, AMD 반도체는 11% 이상 상승丨 미국 주식 거래를 재개했습니다.","so":"21财经","tm":"11/09 09:25","c":1,"r":"cn","u":"https://www.21jingji.com/article/20261109/herald/70c05951c5300b82a29e3c5d063f4cc4.html","p":1794183900,"a":1794207501,"t":"美股AI芯片板块上周五集体反弹，超威半导体涨超11%丨美股复盘","su":"미국 동부시간 기준 11월 6일(금) 목요일 큰 폭의 하락세를 보였던 미국 증시는 기술적 반등을 경험했다. AI 거래가 상승세를 주도했고, 칩주가 전반적으로 반등했으며, 필라델피아 반도체 지수는 4.21% 상승했습니다. 금요일 현지 시간으로 미국 3대 주가지수는 엇갈린 상승세로 마감했습니다. 마감 현재 다우지수는 0.46% 하락한 51,285.73포인트를 기록했습니다. S&P 500은 0.31% 상승한 7,376.86포인트를 기록했습니다. 나스닥지수는 1.09% 상승한 24,579.42포인트를 기록했습니다. 시장에서는 기술 하드웨어 부문이 개장 이후 크게 상승했습니다. 세션 중에는 하락했지만 종료 시에는 대부분의 이익을 유지했습니다. 엔비디아, AMD 등 AI 산업 체인주는 전반적으로 반등했다. 개별 주식 측면에서 Nvidia는 2.78% 상승한 $186.64를 기록했습니다. AMD는 11% 이상 상승한 449.04달러를 기록했습니다. Intel은 7% 이상 상승한 56.28달러를 기록했습니다. Qualcomm은 5% 이상 상승한 165.41달러를 기록했습니다. Broadcom은 0.74% 상승한 $293.69를 기록했습니다. Arm은 4.74% 상승한 $174.62를 기록했습니다."},{"s":"미국 증시 패닉 지표가 극한값에 가까워졌습니다! Goldman Sachs: 역사적 신호는 중기 반등을 시사합니다","so":"财联社","tm":"11/09 09:18","c":1,"r":"cn","u":"https://www.cls.cn/detail/2528454","p":1794183480,"a":1794207502,"t":"美股恐慌指标逼近极值！高盛：历史信号指向中期反弹","su":"① 골드만삭스 변동성 공포 지수는 지난 목요일 9.57까지 올라 패닉 범위 기준점인 9.5를 돌파했습니다. ②지수는 이전에 15번이나 9.5를 넘었고 S&P 500 지수는 이후 3개월 동안 평균 4.6% 상승했으며 상승 확률은 80%이다. ③Goldman Sachs는 시장이 아직 조기 매도 압력, 청산 및 부채 축소 압력을 소화하고 있고 일부 포지션 조정이 아직 완료되지 않았기 때문에 단기적으로 포지션 구축에 주의할 것을 상기시켰습니다. Financial Associated Press, 11월 9일(류루이 편집장) 지난주 미국 중간선거 결과가 나오자 미국 증시는 일주일간 등락을 겪었다. 골드만삭스 트레이더들은 지난주 미국 주식시장의 패닉이 역사적으로 극단적인 수준까지 치솟았다고 말했다. 과거 데이터에 따르면 이 지표가 이 수준에 도달할 때마다 S&P 500 지수는 다음 달에 반등하는 경우가 많습니다. 그러나 Goldman Sachs는 단기 시장이 여전히 바닥 찾기 및 부채 축소 단계에 있을 수 있음을 상기시켰습니다."},{"s":"뉴욕증시 4주째 하락⋯이번 주 '10월 물가지수' 최대 관심사","so":"이투데이","tm":"11/09 09:04","c":1,"r":"kr","u":"https://www.etoday.co.kr/news/view/2645581?trc=main_top_sub","p":1794182640,"a":1794207224,"su":"나스닥 주간 3.4%↓ㆍS&P500 2.7%↓10일 소비자물가ㆍ13일 생산자물가 발표AI 투자 거품 우려에 기술주 매도세 러시▲(출처 배런스, 로이터·AI 기반 편집"},{"s":"월스트리트는 \"buy the dip\"을 외친다! 미국 주식이 3조 달러 이상 급락해 매수 포인트로 변했다?","so":"鉅亨網","tm":"11/09 09:00","c":1,"r":"tw","u":"https://news.cnyes.com/news/id/6652277","p":1794182402,"a":1794207506,"t":"華爾街高喊「抄底」！美股暴跌逾3兆美元反成買點？","su":"미국 증시는 미국 중간선거 결과의 영향으로 급락했다. S&P 500은 하루 만에 4.4%, 나스닥 100은 6.4% 하락하며 3조 달러 이상의 시가총액이 사라졌다.\n모건스탠리, 골드만삭스, 야데니 등은 여전히 ​​연말 시장 상황을 낙관하고 있으며 향후 2~3주가 하락 포지션을 늘릴 수 있는 기회가 될 것으로 믿고 있다.\n시장에서는 민주당이 데이터센터 감독을 강화하고 AI 투자를 억제할 것이라는 우려가 나온다. 수수료는 6월 최고치 대비 36% 하락한 12% 하락했습니다."},{"s":"미국 주식의 AI 급락으로 인해 QDII 실적에 큰 차이가 발생했습니다. 자산 재조정으로 인해 자금이 홍콩 주식으로 다시 유입될 수 있습니다.","so":"第一财经","tm":"11/09 08:57","c":1,"r":"cn","u":"https://www.yicai.com/brief/103431550.html","p":1794182220,"a":1794214242,"t":"美股AI重挫致QDII业绩大分化 资产再平衡或驱动资金回流港股","su":"Securities Times에 따르면 최근 미국 기술주가 급격한 조정을 겪었고, AI 부문이 집단적 급락을 겪었으며, 많은 미국 주식의 활성 주식을 공모하는 QDII의 순 가치가 집단적으로 압박을 받아 11월 5일 많은 제품의 순 가치가 7% 이상 하락했습니다."},{"s":"뉴욕증시 선물 소폭 상승…AI주 반등 기대 속 젠슨 황 불륜 사태","so":"뉴스1","tm":"11/09 08:56","c":1,"r":"kr","u":"https://www.news1.kr/world/international-economy/6347103","p":1794182176,"a":1794207224},{"s":"\"미국 주식\" 주간 리뷰: 필라델피아 반도체 지수는 이번 주에 12.15% 하락해 가장 약한 하락세를 기록했습니다.","so":"旺得富理財網","tm":"11/09 08:50","c":1,"r":"tw","u":"https://wantrich.chinatimes.com/news/20261109900034-420201","p":1794181856,"a":1794207507,"t":"《美股》一周回顧：費城半導體指數周跌12.15% 最弱- 國際","su":"[타임스-타이베이] 지난주 미국 다우존스 지수는 0.94% 하락 마감했고, S&P 500 지수는 2.68%, 나스닥 지수는 3.37%, 필라델피아 반도체 지수는 12.15% 하락했다. 타임스 인포메이션(Times Information)은 미국 주식 시장 동향과 이번 주 주요 뉴스에 대한 개요를 정리하여 투자자들이 과거를 되돌아보고 미래를 기대할 수 있도록 돕습니다. ※미국주식 주간리뷰..."},{"s":"금요일 미국 증시의 반등은 단지 '데드 캣 점프'에 불과한 것인가? AI주 매도압력이 수그러들지 않고 금리인상 우려도 커졌다.","so":"鉅亨網","tm":"11/09 08:41","c":1,"r":"tw","u":"https://news.cnyes.com/news/id/6651927","p":1794181305,"a":1794207508,"t":"美股週五反彈只是「死貓跳」？AI股賣壓未消、升息疑慮升溫","su":"미국은 10월 비농업 근로자가 16만5000명 늘었고 실업률은 4.1%로 떨어졌고, 평균 시간당 임금은 전년 동기 대비 3.1% 증가했다. 전반적으로 데이터가 예상보다 좋았습니다.\n강력한 고용과 임금은 연준의 금리 인상에 대한 우려를 불러일으켰습니다. 12월 시장이 금리를 25bp 인상할 확률은 한때 85%까지 올랐고 미국 채권수익률도 상승했다.\n금요일 미국 증시는 반도체주를 중심으로 반등했지만, 상승폭은 집중적이고 폭이 약했습니다. AI 투자에 대한 우려는 여전히 해소되지 않은 채 반등 강도도 의문이다."},{"s":"‘블루쓰나미’ 딛고 나스닥 반등, 국장도 충격파 잦아드나[뉴스새벽배송]","so":"이데일리","tm":"11/09 08:00","c":1,"r":"kr","u":"https://www.edaily.co.kr/News/Read?newsId=02072966645644080&mediaCodeNo=257","p":1794178842,"a":1794207224,"su":"미국 중간선거에서 민주당이 상·하원을 모두 장악하는 이른바 ‘블루웨이브’ 쇼크로 전 세계 증시가 요동친 가운데, 지난주 마지막 거래일 뉴욕증시는 기술주를 중심으로 저가 매수세에 힘입어 반등에 성공했다. 민주당 압승에 따른 인공지능(AI) 인프라 규제 강화 우려로 나스..."},{"s":"미국 주식 시장 예측: S&P 500, Nasdaq, Dow Jones는 긍정적인 출발을 기대하고 있으며,","so":"The Economic Times","tm":"11/09 07:49","c":1,"r":"us","u":"https://m.economictimes.com/news/international/us/us-stock-market-prediction-sp-500-nasdaq-dow-jones-look-to-start-in-positive-check-factors-that-will-drive-wall-street/articleshow/135665989.cms","p":1794178162,"a":1794195144,"t":"US Stock Market prediction: S&P 500, Nasdaq, Dow Jones look to start in positive, check factors that will","su":"미국 주식 시장 투자자들은 S&P 500, 나스닥이 계속해서 상승세를 이어가야 하기 때문에 다우존스를 예의주시할 것입니다."},{"s":"미국 AI 주식의 매도는 일시적인 것인가? 애널리스트: 시장은 민주당의 승리를 과대평가했고, 데이터센터 구축이 제동을 걸지 못할 수도 있다.","so":"鉅亨網","tm":"11/09 07:46","c":1,"r":"tw","u":"https://news.cnyes.com/news/id/6651941","p":1794177996,"a":1794207509,"t":"美股AI股拋售只是暫時的？分析師：市場過度解讀民主黨勝選、資料中心建設未必踩煞車","su":"미국 칩 주식은 지난 금요일 AMD가 11%, INTC가 8%, MU가 5% 상승하는 등 강하게 반등했습니다. SOXX는 목요일에 12% 하락했습니다.\n분석가들은 반등이 주로 염가 사냥에 따른 것이라고 말했다. AI 데이터센터 지출 및 규제에 대한 불확실성은 아직 해결되지 않았으며, 단기적으로는 여전히 급격한 변동이 발생할 위험이 있습니다.\nAnthropic의 ARR은 10월 말 현재 800억 달러를 초과했지만 일부 투자자들은 1조 5천억 달러의 IPO 가치 목표가 하향 조정될 수 있다고 믿고 있습니다."},{"s":"설문 조사: 경제학자의 80% 이상이 연준이 이번 주와 내년 3월 말 전에 다시 금리를 인상할 것으로 예상합니다!","so":"财联社","tm":"11/09 07:39","c":1,"r":"cn","u":"https://www.cls.cn/detail/2483155","p":1794177594,"a":1794214243,"t":"调查：逾八成经济学家预计美联储本周加息 明年3月底前有望再出手！","su":"① 인플레이션이 여전히 완고하다는 것을 보여주는 지난 금요일 공식 미국 CPI 데이터의 영향을 받은 최근 업계 조사에 따르면, 이번 달 금리를 동결하지 않겠다는 이전의 상대적 주류 연준의 약한 합의는 \"붕괴를 선언\"했습니다. ② 현재 조사에 참여한 대부분의 경제학자들은 연준이 수요일에 금리 인상을 발표하고 내년 3월 말 이전에 적어도 한 번 금리를 인상할 것이라고 믿고 있습니다. 파이낸셜 뉴스 에이전시, 9월 15일(편집자 Xiaoxiang) 인플레이션이 여전히 완고하다는 것을 보여주는 지난 금요일 공식 미국 CPI 데이터의 영향을 받은 최근 업계 조사에 따르면, 이전에는 상대적으로 주류였던 연준이 이번 달 금리를 동결하지 않겠다는 강력한 합의가 \"붕괴를 선언\"했습니다. 조사에 참여한 대부분의 경제학자들은 현재 연준이 수요일에 금리 인상을 발표하고 내년 3월 말 이전에 적어도 한 번 더 금리 인상을 발표할 것으로 믿고 있습니다."},{"s":"미국 증시는 반등할 것인가? Goldman Sachs 패닉 지표가 \"극단적인 임계값\"을 돌파했으며, 과거 데이터에 따르면 S&P 500은 향후 반년 동안 평균 9% 상승할 것으로 나타났습니다.","so":"鉅亨網","tm":"11/09 07:39","c":1,"r":"tw","u":"https://m.cnyes.com/news/id/6652053","p":1794177584,"a":1794177855,"t":"美股將反彈？高盛恐慌指標突破「極端門檻」、歷史數據揭標普500未來半年平均漲9%","su":"高盛恐慌指數周四升至9.57，突破9.5極端門檻，兩日累計波動創歷史紀錄，市場情緒急轉恐慌。&#10;Cboe周四看跌期權成交量逾1,100萬張創新高，反映投資人集中買進避險工具，並引發進一步賣壓。&#10;歷史上恐慌指數逾9.5後，標普500未來3個月平均漲4.6%、6個月漲9%；高盛仍稱市場尚在尋底。"},{"s":"\"미국 주식\" 텍사스 주지사, 데이터 센터 AI/페이 반탄을 싫어하지 않는다고 밝혔습니다.","so":"MoneyDJ","tm":"11/09 07:34","c":1,"r":"tw","u":"https://www.moneydj.com/kmdj/news/newsviewer.aspx?a=4936a376-8a3c-41c8-a21d-d48010d0245a","p":1794177240,"a":1794214250,"t":"《美股》德州州長澄清不討厭資料中心AI/費半彈- 新聞","su":"금요일(6일) AI 칩과 데이터센터 인프라 컨셉주가 헐값 사냥이 돌입하면서 전반적으로 반등했다. 그러나 나스닥 지수는 여전히 4주 연속 하락세를 이어갔다. 투자자들은 AI 거래가 다음에 어떻게 발전할지 결정하기 위한 단서를 찾고 있습니다. 다우존스산업평균지수는 0.46%(237.33포인트) 하락 마감했다."},{"s":"주식시장 '내부고발자' 모건스탠리: 미국 주식 매도세는 이제 끝나가고 있으며 앞으로 2~3주는 포지션을 추가하기에 좋은 시기다.","so":"21财经","tm":"11/09 07:29","c":1,"r":"cn","u":"https://www.21jingji.com/article/20261109/herald/77023f1d35e94757fb6a41141ae84922.html","p":1794176964,"a":1794214244,"t":"股市“吹哨人”大摩：美股抛售接近尾声 未来两到三周是加仓好时机","su":"월스트리트는 비관적이지 않다! 며칠 전 주식시장의 '내부고발자'로 알려진 모건스탠리는 미국 증시 매도세가 이제 끝나가고 있으며 앞으로 2~3주가 포지션을 추가하기에 좋은 시기라고 밝혔다. 모건스탠리: 포지션을 추가하기 좋은 시기 인공지능(AI) 열풍에 대한 몇 달 간의 불안이 11월 2일부터 6일까지 주에 글로벌 시장 쇼크로 바뀌었습니다. 지난 목요일(11월 5일) 대규모 매도가 미국 주식 급락을 촉발해 많은 투자자들을 허둥지둥하게 만들었습니다. 지난 금요일(11월 6일) 일부 자금이 시장에 돌아오자 미국 증시는 하락을 멈추고 반등했습니다. S&P 500 지수는 0.31%, 나스닥은 1% 이상, 필라델피아 반도체 지수는 4% 이상 상승했습니다. 위에서 언급한 변동성을 경험한 후 월스트리트 전략가 그룹은 고객에게 상황을 활용할 것을 촉구하고 있습니다. 모건스탠리의 미국 주식 전략가 마이크 윌슨은 \"향후 2~3주 동안 이 부분에 대한 노출을 늘려야 한다\"고 말했다."},{"s":"뉴욕증시, 물가·AI 실적·이란 변수에 주목 [뉴욕인사이트]","so":"이투데이","tm":"11/09 07:16","c":1,"r":"kr","u":"https://www.etoday.co.kr/news/view/2645506","p":1794176160,"a":1794177756,"su":"10일 소비자물가 발표…12월 연준 금리 인상 가능성 80% 육박코어위브·네비우스 등 AI 기업 실적 주목…트럼프 대이란 행보도 변수▲4일(현지시간) 미국"},{"s":"뉴욕증시 이번주 CPI·AI 기업 실적 시험대…12월 금리인상 확률 80%","so":"뉴스1","tm":"11/09 07:00","c":1,"r":"kr","u":"https://www.news1.kr/world/international-economy/6347039","p":1794175200,"a":1794177756},{"s":"AI를 사용하여 Wash의 입을 벌리시겠습니까? 월스트리트 기관, \"WarshGPT\" 출시","so":"财联社","tm":"11/09 06:33","c":1,"r":"cn","u":"https://www.cls.cn/detail/2430794","p":1794173628,"a":1794214246,"t":"用AI撬开沃什的嘴？华尔街机构推出“WarshGPT”","su":"①F/m Investments는 지난 주에 \"WarshGPT\"를 공식 출시했습니다. ②이것은 Warsh가 공개한 거의 1,800개의 문서와 음성 녹음을 분석하여 사용자가 경제 또는 통화 정책과 관련된 문제를 분석할 수 있는 방법을 이해하는 데 도움을 주는 인공 지능 기반 도구입니다. Financial Associated Press, 7월 20일자(Editor Xiaoxiang) F/m Investments 사무실은 워싱턴 D.C.에 위치해 있으며 연방준비은행 본부에서 차로 단 몇 분 거리에 있습니다. 그러나 연준이 새 지도자를 맞이한 후, F/m Investments의 CEO인 Alexander Morris는 물리적 거리가 심리적으로 매우 멀다고 느꼈습니다... 케빈 워시 연준 의장은 지난 5월 취임 이후 연준의 미래지향적 커뮤니케이션 메커니즘에 대한 포괄적인 개혁에 착수했습니다. 이러한 움직임은 연준이 금리를 어떻게 조정할지 예측하는 데 부분적으로 의존하는 투자 전략을 갖고 있는 Morris와 같은 시장 참여자들에게 경종을 울렸습니다."},{"s":"귀하의 주택과 주식 시장: 어느 것이 더 나은 투자였습니까?","so":"WSJ","tm":"11/09 06:05","c":1,"r":"us","u":"https://www.wsj.com/finance/investing/home-vs-stock-market-investment-6783607f","p":1794171915,"a":1794177789,"t":"Your House vs. the Stock Market: Which Has Been a Better Investment?"},{"s":"코어위브 실적, AI주 방향타…인플레이션 지표에도 촉각[이번주 美 증시는] - 머니투데이","so":"머니투데이","tm":"11/09 05:35","c":1,"r":"kr","u":"https://www.mt.co.kr/amp/world/2026/11/09/2026110714102546369","p":1794170100,"a":1794177756,"su":"미국 증시가 큰 변동성을 보이며 AI(인공지능) 수혜주 주도로 하락한 가운데 이번주에는 인플레이션 지표가 공개되고 우주항공과 양자컴퓨팅, 네트워킹 및 반도체 기업의 실적 발표도 이어진다."},{"s":"연준은 예상대로 확고한 입장을 유지했으며 위원 4분의 1이 반대표를 던졌습니다.","so":"财联社","tm":"11/09 05:01","c":1,"r 션, 노동 시장 및 경제 성장에 대한 그의 견해에 세심한 주의를 기울일 것입니다. Financial News Agency, 7월 14일(Editor Xiaoxiang) 케빈 워시 연준 의장은 취임 이후 금리 방향을 밝히지 않으려고 최선을 다했습니다. 의도치 않게 그는 투자자, 분석가 및 기타 정책 입안자에게 중요한 또 다른 사항, 즉 경제가 어려움에 직면할 때 어떻게 대응할 것인지를 모호하게 만들었습니다."},{"s":"기술주의 \"고통스러운\" 조정은 금리 인상 기대를 방해하지 않을 것입니다. Fed Daley는 여전히 추가 긴축 정책을 선호합니다.","so":"财联社","tm":"11/09 00:04","c":1,"r":"cn","u":"https://www.cls.cn/detail/2527938","p":1794150250,"a":1794214938,"t":"科技股“痛苦”调整难阻加息预期 美联储戴利仍倾向进一步收紧政策","su":"① Mary Daly 샌프란시스코 연준 총재는 연준이 지속적으로 높은 인플레이션을 억제하기 위해 금리를 더 인상해야 할 것으로 예상한다고 금요일에 말했습니다. ② 향후 금리 인상 시기와 범위는 아직 알 수 없으며, 연준은 신흥 경제 변수를 종합적으로 고려할 필요가 있다. ③ 그녀는 최근 기술주의 하락이 투자자들을 고통스럽게 만들었다고 인정했지만, 이번 조정은 일반적으로 여전히 질서정연합니다. Financial Associated Press, 11월 7일(편집자 Niu Zhanlin) 메리 데일리(Mary Daly) 샌프란시스코 연준 총재는 금요일에 연준이 지속적인 높은 인플레이션을 억제하기 위해 금리를 더 인상해야 할 것으로 예상한다고 말했습니다. 다만, 경기 전망이 불투명한 상황에서 향후 금리 인상 시기와 규모는 아직 미지수다. 데일리는 이날 인터뷰에서 \"통화정책을 더욱 긴축해야 할 것으로 기대한다\"고 말했다. 금리를 언제 올릴지, 얼마나 인상할지 아직 불투명하다고 강조했다. 연준은 끊임없이 등장하는 다양한 경제변수를 종합적으로 고려해야 한다."},{"s":"[월스트리트부터 루자쭈이까지 투자팁 스페이스X의 연간 매출은 1000억 달러를 넘을 것으로 예상된다. 국내 상업용 항공우주는 여러 가지 혁신을 이루었고 개발이 가속화되었습니다. 기회를 잡는 방법은 무엇입니까?","so":"第一财经","tm":"11/08 23:05","c":1,"r":"cn","u":"https://www.yicai.com/vip/news/103431444.html","p":1794146737,"a":1794214940,"t":"[ 从华尔街到陆家嘴 投资秘籍 SpaceX年化收入有望破千亿美元 国内商业航天多点突破加速发力 机遇如何把握？","su":"현지 시간으로 지난 금요일, 제33차 Barron's 투자 컨퍼런스에서 가상 노변 인터뷰가 진행되었습니다. 머스크는 원격으로 참여해 다수의 블록버스터 예측을 내놨다. 올해 12월 스페이스X의 연간 매출은 1000억 달러를 넘을 것으로 예상되고, 내년 12월 연간 반복 매출은 5000억 달러를 넘을 수도 있다. SpaceX가 최근 발표한 2026년 3분기 재무 보고서에 따르면 보고 기간 동안 회사의 수익은 145억 8천만 달러로 전년 대비 161억 달러 증가했습니다."},{"s":"미국 부채 경보가 울립니다! 월스트리트는 '파격적 조치'가 촉발돼 이르면 내년 2월 부채한도가 정점으로 밀릴 것으로 내다봤다.","so":"鉅亨網","tm":"11/08 23:00","c":1,"r":"tw","u":"https://news.cnyes.com/news/id/6652276","p":1794146405,"a":1794148461,"t":"美國債務警報拉響！華爾街估恐觸發「非常規措施」 債限上限最快提前至明年2月觸頂","su":"美銀、巴克莱、摩根士丹利估美國財政部最快2027年2月中下旬觸及41.1兆美元債務上限&#10;主因是最新融資估算與偏高現金餘額；若國會未動作，財政部可用非常規措施騰出3000億至3500億美元&#10;X日恐落在2027年8月至11月，債限僵局或使短券供給縮、殖利率曲線扭曲加劇"},{"s":"미국 주식이 급락하고 거래를 재개합니다! 비트코인, MSTR, COIN이 드래그되었습니다. 다음 주에 더 큰 조정이 있을까요?","so":"鉅亨網","tm":"11/08 22:00","c":1,"r":"tw","u":"https://news.cnyes.com/news/id/6652434","p":1794142805,"a":1794177855,"t":"美股暴跌復盤!比特幣、MSTR、COIN被拖下水,下周還有更大調整？","su":"金色財經 但這次暴跌最值得關注的，不是跌了多少，而是華爾街的資金鍊條突然發生了變化。 據彭博社報導，周四美股下跌最初由散戶獲利了結引發，隨後對沖基金、長期資管機構和量化策略相繼加入。 Vanda Research數據顯示，當天散戶對個股的凈賣出規模，僅次於2020年3月疫情衝擊期間的兩個交易日。 更反常的是，機構買家沒有像往常一樣趁下跌入場，反而選擇觀望。這意味著市場出現了一個危險信號：賣盤越來越多，接盤資金卻越來越少。 這次暴跌還有一個重要推手：程序化交易和期權對沖機制。"},{"s":"AIDC 검토에는 비용이 증가할 수 있습니다. 미국 주식이 폭락해도 당황하지 마세요. Morgan 분석: S&P 500 되돌림은 여전히 ​​역사적 정상 범위 내에 있습니다.","so":"鉅亨網","tm":"11/08 21:20","c":1,"r":"tw","u":"https://news.cnyes.com/news/id/6652324","p":1794140404,"a":1794145920,"t":"AIDC審查恐拉高成本、美股急洩別慌？摩根解析：標普500回檔仍在歷史常態範圍","su":"민주당이 의회를 장악하게 되면 AI 규제, 데이터센터 구축, 전력망 비용이 더욱 엄격해질 수 있다. 미국 주식은 11월 5일 수수료가 12.3% 하락하면서 급락했습니다.\nLin Yahui는 AI 자본 지출과 수익이 압박을 받고 있으며 동북아 반도체, 메모리, 서버 체인의 가치 평가가 재평가에 직면하고 있다고 말했습니다.\nS&P 500은 10월 고점 대비 약 6% 조정을 받았지만 여전히 3월의 8.7%보다 낮습니다. J.P Morgan Asset Management는 다양한 배분을 요구했습니다."},{"s":"[모닝포스트] 10월 연준이 금리를 인상할 확률이 급락했다. 원유와 금 모두 상승했습니다. 마이크론 테크놀로지(Micron Technology)의 4분기 매출과 이익이 기대치를 초과했습니다.","so":"财联社","tm":"11/08 21:16","c":1,"r":"cn","u":"https://www.cls.cn/detail/2496760","p":1794140186,"a":1794214941,"t":"【早报】美联储10月加息概率，大幅回落；原油、黄金双双上涨；美光科技，Q4营收利润双超预期","su":"① 시진핑: 포용적·기초적·기본적 민생 건설 강화 ② 중앙은행: 10월 8일 3개월간 1조2000억 위안 규모의 매입 역환매 작업을 실시할 예정이다. ③ 미국 최대 기술주가 3% 이상 상승했고, 인텔은 3% 이상 상승했다. ④ 애플이 스마트 홈 시장에 진출할 계획이다. ⑤ 하이얼 스마트홈과 몽타주 테크놀로지가 환매 진행을 발표했다. 매크로 뉴스 1. 10월 1일 발행되는 '치시' 잡지 19호에는 시진핑 중공중앙 총서기, 국가주석, 중앙군사위원회 위원장이 쓴 '보편적, 기본적, 기본적 민생 건설 강화'라는 중요한 글이 게재될 예정입니다. 2012년 11월부터 2026년 1월까지 시진핑 총서기가 한 중요한 발언에서 발췌한 내용이다. 기사에서는 중국식 현대화는 민생을 최우선으로 생각한다는 점을 강조하고 있다. 더 나은 삶을 향한 국민의 열망이 우리의 목표입니다. 우리의 목표는 야심적이고 단순합니다. 결국, 국민들이 더 나은 삶을 살 수 있도록 하는 것입니다. 우리는 발전 과정에서 인민의 생활을 보장하고 개선하는 것을 견지해야 하며 더 나은 삶을 창조하기 위한 공동 노력을 장려하고 더 나은 삶에 대한 인민의 열망을 끊임없이 실현해야 합니다."},{"s":"미국 중간선거 민주당 대승 “대황소” 시세 언제까지[월가 익스프레스]","so":"テレ東BIZ","tm":"11/08 21:01","c":1,"r":"jp","u":"https://txbiz.tv-tokyo.co.jp/nmssat/news/post_352064","p":1794139287,"a":1794148457,"t":"アメリカ中間選挙 民主党大勝 “大荒れ”相場いつまで【ウォール街エクスプレス】","su":"민주당이 대승을 거둔 미국의 중간선거를 받고 5일 뉴욕 주식시장은 하이테크 주식을 중심으로 총 무너지고 대황의 전개가 되었습니다. 불안정한 시세는 언제까지 계속되는지, 그리고 최대의 불안 재료가 되고 있는 AI 개발을 둘러싼 불투명감은 불식될지, 미국의 시장 관계자에게 취재했습니다."},{"s":"[모닝포스트] 연준이 다음 주 금리를 인상할 확률이 90%까지 치솟았다. 미국 주식과 금 모두 상승했습니다. 전국위원회의 최신 배치! 컴퓨팅 인프라를 더욱 개선하세요.","so":"财联社","tm":"11/08 20:46","c":1,"r":"cn","u":"https://www.cls.cn/detail/2481328","p":1794138382,"a":1794216073,"t":"【早报】美联储下周加息概率，飙至90%；美股、黄金齐涨；国常会最新部署！进一步完善算力基础设施","su":"①최근 전국상임위원회 배치! 컴퓨팅 파워 인프라 더욱 개선 ② 8월 미국 CPI는 시장 기대치에 맞춰 전년 대비 3.4% 상승 ③ 미국 3대 주가지수 종합 마감 ④ 허위 정보 유포 혐의로 4명이 증권감독관리위원회에 의해 처벌됨 ⑤ CATL: 어제 처음으로 회사의 A주 604,300주를 매입했고, 거래금액은 약 2억 위안이다. 매크로 뉴스 1. 리창(Li Qiang) 총리는 9월 11일 국무원 상무회의를 주재했습니다. 회의에서는 컴퓨팅 파워 인프라가 더욱 개선되어야 하며 핵심 기술과 장비의 연구 개발 및 응용이 적극적으로 촉진되어야 하며 다층적으로 네트워크화된 컴퓨팅 파워 시스템이 구축되어야 한다고 지적했습니다. 컴퓨팅과 전력 협력 및 컴퓨팅 네트워크 통합을 촉진하고, 컴퓨팅 자원의 모니터링 및 파견과 백본 광섬유 네트워크 구축을 강화하고, 컴퓨팅 및 전력 시설의 계획 및 연결을 강화하며, 친환경 전력 직접 연결, 소스 네트워크 부하 저장 및 기타 프로젝트 구현을 가속화해야 합니다."},{"s":"[모닝포스트] 3년여 만에 연준이 금리 인상을 재개했다. 미국 주식, 원유, 금이 전반적으로 급락했습니다. 많은 A주 회사들이 자사주 매입 진행 상황을 공개했습니다.","so":"财联社","tm":"11/08 20:31","c":1,"r":"cn","u":"https://www.cls.cn/detail/2485626","p":1794137494,"a":1794216074,"t":"【早报】时隔3年多，美联储重启加息；美股、原油、黄金全线跳水；多家A股公司，披露回购进展","su":"① 왕이(王毅) 이란 외무장관 아라그치와 회담 ② ‘문화관광 발전을 위한 15차 5개년 계획’ 발표 ③ 연방준비제도(연준)가 3년 만에 금리를 인상했고, 미국 증시는 폭락했다. ④ CATL은 관련 자동차 회사들이 가까운 시일 내에 다른 공급업체를 선택할 것이라는 소문에 대응할 것이다 ⑤ 삼니중공업: 어제 1662만6000주를 자사주 매입하고 2억9900만 위안을 지급했다. 매크로 뉴스 1. 2026년 9월 16일 왕이(王毅) 중국공산당 중앙정치국 위원 겸 외교부장이 베이징에서 아라그치 이란 외무부장과 회담을 가졌습니다. 왕이 부장은 중국은 이란에 대한 정책의 연속성과 안정성을 견지하고 안보리와 다자간 플랫폼에서 정의를 수호하며 무력 사용을 반대하고 국제 관계 규범을 수호한다고 말했습니다. 중국은 이란과의 소통과 조율을 강화해 중국-이란 관계의 새로운 진전을 추동할 의향이 있다."},{"s":"다른 사람들은 두려워서 탐욕스러워야 합니까? 월스트리트 전략가들은 \"미국 증시 하락세가 매수 포인트로 바뀌었다\"며 더 많은 투자를 촉구하고 있다.","so":"經濟日報","tm":"11/08 19:44","c":1,"r":"hk","u":"https://money.udn.com/money/story/123398/9865349?from=e 약품 보험 게임은 '하나의 보험, 하나의 정책' 단계에 진입했으며 혁신적인 제약회사는 상업 보험과의 대화 방법을 모색하고 있습니다.","so":"第一财经","tm":"11/08 20:14","c":1,"r":"cn","u":"https://www.yicai.com/news/103431200.html","p":1794136470,"a":1794207264,"t":"药险博弈进入“一保一策”阶段，创新药企探寻商保对话路径","su":"{{aisd}} AI 생성 면책조항 제약회사 액세스 팀은 새로운 딜레마에 빠질 수 있습니다. 통합된 카탈로그가 없고 \"하나의 보증, 하나의 정책\"만 있을 뿐입니다. 상업 보험 시장은 정보가 분산되어 있고, 규칙이 혼란스럽고, 여러 질병 분야에서 보험 부채와 지급 조건이 중복되어 접근 기회를 선별하고 우선순위를 정하기가 어렵습니다. 한 제약회사의 인터뷰 대상자는 신약이 출시된 후 \"희민바오를 도시마다 운영하면서 지역 희민바오 특수 의약품 카탈로그와 전국 상업 보험 혁신 의약품 카탈로그의 변화를 동시에 모니터링\"해야 한다고 언급한 적이 있습니다. 상업용 보험이 혁신적인 의약품의 상용화를 위한 중요한 지불 수단으로 자리잡고 있습니다. 그러나 기본 의료보험의 '국가 1게임'에 비해 상업 보험 시장은 더욱 세분화되어 있습니다. 국민을 위한 200개 이상의 '1시 1정책' 혜택이 있고, 백만 달러 의료 보험, 전문 의약품 보험과 같은 상품은 피보험자 그룹, 약물 접근 및 보상 한도 측면에서 다양합니다. 초과 손실 위험 노출에 대한 보험 회사의 강화와 함께, 혁신적인 약물의 \"출시 시 보험\"은 점차 과거의 일이 되었습니다."},{"s":"State Street SPDR S&P 생명공학 ETF(XBI) | 주가 및 최신 뉴스","so":"Reuters","tm":"11/08 19:15","c":1,"r":"us","u":"https://www.reuters.com/markets/companies/XBI/financials/","p":1794132920,"a":1794145920,"t":"State Street SPDR S&P Biotech ETF (XBI) | Stock Price & Latest News"},{"s":"주목해야 할 27세 미만 P E의 영국 생명공학 주식 3개","so":"Yahoo Finance","tm":"11/08 07:13","c":1,"r":"us","u":"https://finance.yahoo.com/healthcare/articles/3-british-biotech-stocks-p-221324852.html","p":1794089604,"a":1794093180,"t":"3 British Biotech Stocks With P E Under 27 To Watch","su":"The Bank of England has lifted interest rates for the first time in years, pushing up borrowing costs just as living expenses bite harder. Higher rates often squeeze highly indebted firms, which puts financially healthier British biotech stocks in sharper focus. This article highlights three UK biotechnology companies from our quality-focused screen that combine reasonable balance sheets and valua"},{"s":"Cathie Wood가 이끄는 Ark는 GOOG, AMD, NVDA 및 생명공학 주식에 투자하지만 CRWV, AVGO, LLY는 매도합니다.","so":"Yahoo Finance","tm":"11/07 15:00","c":1,"r":"us","u":"https://finance.yahoo.com/markets/stocks/articles/cathie-wood-led-ark-loa 水戒備","su":"오늘 아침 신베이시 투청구 중산로에 위치한 상장기업 정웨이정밀(Zhengwei Precision) 공장에서 화재가 발생했습니다. 5층에서 다량의 짙은 연기가 피어올랐습니다. 소방당국은 화재를 구조하기 위해 수백 명의 인력을 파견했습니다. 불은 오전 10시 33분께 진화됐다. 불이 난 곳은 리튬배터리 완제품 보관 장소인 것으로 파악됐다. 직원들은 배터리 구역에서 불이 난 것을 발견하고 구조에 나선 뒤 창문을 열어두는 대신 다량의 산소가 유입돼 불이 더욱 확대된 것으로 의심했다. 소방대원들은 불길을 식히기 위해 계속해서 다량의 물을 쏟아부었다. 현재 화재는 진압 중이다. 위험이 완전히 제거되려면 리튬 배터리 반응이 완료될 때까지 기다려야 합니다."},{"s":"[리포트 브리핑]에코프로비엠, '양극재 출하 부진 지속' 목표가 90,000원 - iM증권","so":"뉴스핌","tm":"11/09 10:53","c":2,"r":"kr","u":"https://www.newspim.com/news/view/20261109000504","p":1794189180,"a":1794195231,"su":"[서울=뉴스핌] 로보뉴스 = iM증권에서 09일 에코프로비엠(247540)에 대해 '양극재 출하 부진 지속'라며 투자의견 'Hold'의 신규 리포트를 발행하였고, 목표가 90,000원을 내놓았다. 전일 종가 기준으로 볼 때, 이 종목의 주가는 목표가 대비 8.3%의 추가 상승여력이 있다는 해석이 가능하다. ◆ 에코프로비엠 리포트 주요내용 iM증권에서 에코프로비엠(247540)에 대해 '3분기 실적은 미국 전기차 세액공제 종료에 따른 수요 둔화와 셀 고객사의 점유율 하락으로 시장기대치를 크게 하회했다."},{"s":"Chinalco와 CATL이 전략적 협력 계약을 체결했습니다.","so":"Jiemian.com","tm":"11/09 10:11","c":2,"r":"cn","u":"https://www.jiemian.com/article/15308758.html","p":1794186706,"a":1794206050,"t":"中铝集团与宁德时代签署战略合作协议","su":"최근 Chinalco와 CATL은 Fujian성 Ningde에서 전략적 협력 계약을 체결했습니다. 이번 합의에 따르면 양측은 과학기술 혁신 협력, 녹색 및 저탄소 전환, '일대일로' 공동 건설 분야에서 다각적이고 심도 있는 협력을 수행하기로 했다."},{"s":"리튬 이온 전지의 부극재, 알루미늄박으로 저비용화 도호쿠 대학","so":"日本経済新聞","tm":"11/09 05:00","c":2,"r":"jp","u":"https://www.nikkei.com/article/DGXZQOSG296RJ0Z21C26A0000000/","p":1794168000,"a":1794177868,"t":"リチウムイオン電池の負極材、アルミ箔で低コスト化 東北大学","su":"東北大学の中田優樹助教らはリチウムイオン電池の負極に適用できるアルミ箔を開発した。マンガンを添加したのが特徴で、蓄電容量を維持しながら充放電による劣化を抑えた。実用化すれば電池の製造工程を減らすことができる。現在普及するリチウムイオン電池の負極には粉末状の黒鉛が使われる。負極として使うには銅箔や接着剤などと組み合わせる工程が必要になる。製造時のコストがかさむため、代替材料が研究されている。"},{"s":"[11.9 ETF 리뷰] ​​위성 발발, 두 도시에서 빛난다! 탄산리튬이 5% 가까이 급락했습니다! CSI 2000이 다시 상승세를 주도했습니다!","so":"Jiemian.com","tm":"11/09 18:06","c":1,"r":"cn","u":"https://m.jiemian.com/article/15311965.html","p":1794215163,"a":1794216095,"t":"【11.9 ETF综述】卫星爆发，闪耀两市！碳酸锂，暴跌近5%！中证2000，再度领涨！","su":"11월 9일, 3대 A주 지수는 상승세를 보였다가 하락세를 보이며 엇갈린 이익과 손실로 마감했습니다. 상하이종합지수는 0.32% 상승한 3660.79포인트로 마감했고, 선전 구성지수는 0.27% 하락한 11145.49포인트에 마감했고, GEM 지수는 0.27% 하락한 2458.56포인트에 마감했다. 과학기술혁신50 지수는 0.30% 상승한 1256.96포인트에 마감했다."},{"s":"허난성: 연료전지 차량의 시범 적용을 지속적으로 장려하고 수소화 장비 및 센서 부문의 선두 기업 개발을 지원합니다.","so":"界面新闻","tm":"11/09 17:57","c":1,"r":"cn","u":"https://www.jiemian.com/article/15311932.html","p":1794214679,"a":1794214962,"t":"河南：持续推进燃料电池汽车示范应用，支持加氢装备和传感器领军企业发展","su":"허난성 상무부를 포함한 19개 부서는 공동으로 \"풀체인 자동차 소비 촉진을 위한 자동차 애프터마켓 육성 및 강화를 위한 허난성 실행 계획\"을 발표했습니다. 그 중에는 자동차 부품 기술 연구개발의 창의성을 높이는 것도 언급된다. 체인 강화, 지능형 네트워크 연결, 연료전지 차량 실증 및 리더십, 기술 혁신 플랫폼 구축을 위한 핵심 자동차 부품 및 부품을 공동으로 추진합니다. 조향 기어, 충격 흡수 장치, 구동축, 워터 펌프, 실린더 라이너 및 동력 배터리와 같은 부품의 장점을 통합하고 개선합니다. 지능형 연결 버스의 선점자 이점을 최대한 활용하고 온보드 감지, 제어 의사 결정 및 정보 보안과 같은 핵심 기술의 적용을 가속화하십시오. 계속해서 연료전지 차량의 시범 적용을 촉진하고, 수소화 장비 및 센서 분야 선도 기업의 발전을 지원하며, 구현을 통해 기업의 생산 능력 출시를 가속화합니다. \"상용차용 지능형 전기 섀시 핵심 기술 연구 개발 및 적용\"과 같은 주요 과학 기술 프로젝트의 구현을 가속화하고 결과의 산업적 적용을 촉진합니다. 새로운 전력 및 에너지 저장 배터리 소재, 차량 충격 흡수 장치 등에 중점을 둔 다수의 파일럿 기지를 구축하여 산업 독립성 및 제어 가능성 수준을 향상시킵니다. 해외 시장 개척 노력을 강화하고 제품 수출을 촉진해 브랜드, 기술 수출 등 가치사슬 내 고급 연계까지 점진적으로 확대한다."},{"s":"BMW, 삼성·LG에너지와 배터리 부품 공급업체 확대","so":"Bloomberg.com","tm":"11/09 17:44","c":1,"r":"us","u":"https://www.bloomberg.com/news/articles/2026-11-09/bmw-widens-battery-component-suppliers-with-samsung-lg-energy","p":1794213891,"a":1794214961,"t":"BMW Widens Battery Component Suppliers With Samsung, LG Energy"},{"s":"10월 승용차 판매는 27% 감소했고, 배터리는 조정으로 반응했다. CATL은 2% 이상 하락했고, 배터리 ETF China Universal(159796) 지수는 2% 이상 하락했으며, 5일 연속 6억 6천만 위안 이상의 자금이 쏟아졌습니다!","so":"Jiemian.com","tm":"11/09 17:35","c":1,"r":"cn","u":"https://m.jiemian.com/article/15311611.html","p":1794213303,"a":1794216096,"t":"10月乘用车销量下降27%，电池应声回调，宁德时代跌超2%，电池ETF汇添富(159796)指数跌超2%，资金连续5日坚定涌入超6.6亿元！","su":"11월 9일 A주 시장은 상하이 증권 거래소 지수가 0.32% 소폭 상승하는 등 상승세를 보였습니다. 배터리 ETF 차이나 유니버셜(159796)의 기초지수는 추세를 거스르며 2% 이상 하락했다. 하지만 여전히 자금은 꾸준히 쏟아져 들어왔다. 배터리 ETF 차이나유니버셜(159796)은 하루 동안 5700만 위안 이상을 유치했으며, 5일 연속 6억 6000만 위안 이상을 유치했다."},{"s":"[시뮬레이션으로 여는 충북 제조혁신] 유진테크놀로지, 이차전지 정밀금형 설계 최적 한 글로벌 시장을 중심으로 견고한 성장세를 이어..."},{"s":"\"에코프로비엠, 내년 상반기까지 버텨야\"⋯반등 시점은 '이때' [찐코노미]","so":"이투데이","tm":"11/09 10:05","c":1,"r":"kr","u":"https://www.etoday.co.kr/news/view/2645658?trc=right_newsplant","p":1794186300,"a":1794195231,"su":"에코프로비엠이 실적 부진과 추가 자금 조달 우려 등으로 내년 상반기까지 어려운 흐름을 이어갈 수 있다는 전망이 나왔다. 헝가리와 인도네시아 등"},{"s":"iM증권 \"엘앤에프 수익성 부진에 목표주가 하향, LFP양극재 출하 증가로 중장기 성장성 높아\"","so":"비즈니스포스트","tm":"11/09 09:50","c":1,"r":"kr","u":"https://www.businesspost.co.kr/BP?command=article_view&num=451478","p":1794185440,"a":1794206048},{"s":"자동차모닝포스트｜BYD, UAE서 신차 딩야오 출시 기대 볼보, 에어백 리콜 문자 메시지 반박","so":"Jiemian.com","tm":"11/09 09:44","c":1,"r":"cn","u":"https://www.jiemian.com/article/15308596.html","p":1794185077,"a":1794207274,"t":"汽车早报｜比亚迪仰望在阿联酋发布新车鼎耀 沃尔沃辟谣气囊召回短信","su":"BYD는 UAE에서 신차 Dingyao를 출시했으며 앞으로 더 많은 초호화 모델을 출시할 예정입니다. 양왕 브랜드는 지난 11월 7일 UAE에서 플래그십 세단 딩야오(Dingyao)를 출시했다. 이 차량에는 BYD Yi Sifang 4륜 구동 기술, 자체 개발한 Xuanji A3 칩, 운전 보조 기능 등이 탑재되어 있습니다. 배터리 수명 측면에서 신차는 BYD의 2세대 블레이드 배터리와 플래시 충전 기술을 사용하며 CLTC 배터리 수명은 1,000km를 초과합니다. 양왕 브랜드의 후샤오칭 총책임자는 지몐뉴스와의 인터뷰에서 양왕딩야오가 글로벌 자동차로 자리매김하고 있으며 UAE에는 현지 양왕 자동차 소유자가 많다고 말했다. \"고객 기반과 시장의 신에너지 차량 수용이라는 맥락에서 우리는 이 자동차를 여기서 출시하기로 결정했습니다.\" 자동차 가격은 아직 발표되지 않았습니다. Hu Xiaoqing은 브랜드가 앞으로 더 많은 초호화 모델을 출시할 것이라고 밝혔습니다."},{"s":"은시전기차신소재(06128)가 리튬전지 소재업체를 1억 달러 투자에 매각했고, 인수자는 현금과 주식배당으로 대금을 지불했다.","so":"etnet 經濟通","tm":"11/09 09:43","c":1,"r":"hk","u":"https://www.etnet.com.hk/www/tc/news/news-article.php?section=categorized&category=latest&newsid=20261109183","p":1794184980,"a":1794195246,"t":"烯石電車新材料(06128)售鋰電池材料公司涉資1億美元，買方以現金及配股支付","su":"2026-09-11 08:43 그래펙스 전기차신소재(06128)가 리튬전지 소재업체를 1억 달러 투자에 매각했고, 매수자는 현금과 주식배당금으로 지급했다. Graphex Electric Vehicle New Materials(06128)는 인수자인 M2i Global과 총 1억 달러 규모의 자회사 Graphex Technologies LLC 매각에 관한 최종 계약을 체결했다고 발표했습니다. 대가는 3단계에 걸쳐 지급됩니다. 계약 체결이 완료되면 구매자는 3000만 달러를 먼저 지불하고, 이 중 300만 달러는 현금으로 지불하게 된다. 구매자는 이를 위해 노트를 발행하고 나머지 2,700만 달러는 주당 3달러의 대가 주식 형태로 지급됩니다. Enshi Electric Vehicle New Materials는 구매자에게 비용을 지불하고 당사자가 공장의 기본 설계를 전달하고 구매자가 설계를 수락한 후 구매자는 주당 미화 3달러의 가격으로 3천만 달러를 유상 주식 형태로 지불하게 됩니다. 공장이 완공되고 생산 승인을 받은 후, 구매자는 주당 미화 4달러의 대가 지분 형태로 Enshi Tram New Materials에 미화 4천만 달러를 지불하게 됩니다."},{"s":"가디언은 영국이 2030년 전기차 판매 목표를 60%로 낮출 것으로 예상한다고 밝혔다.","so":"Reuters","tm":"11/09 08:24","c":1,"r":"world","u":"https://www.reuters.com/world/uk/uk-government-expected-cut-2030-ev-sales-target-60-guardian-reports-2026-11-08/","p":1794180240,"a":1794206082,"t":"Britain expected to cut 2030 EV sales target to 60%, Guardian says"},{"s":"iM증권 \"美블루웨이브 이차전지엔 기회\"…'비중확대' 권고 |","so":"연합인포맥스","tm":"11/09 08:08","c":1,"r":"kr","u":"https://news.einfomax.co.kr/news/articleViewAmp.html?idxno=4443665","p":1794179333,"a":1794195231,"su":"iM증권 \"美블루웨이브 이차전지엔 기회\"…'비중확대' 권고 \"데이터센터 규제, 전력·ESS 수요 키운다\"…삼성SDI 최선호 (서울=연합인포맥스) 정원 기자 = iM증권이 미국 중간선거 이후 불거진 데이터센터 규제 우려가 이차전지 업종에는 오히려 기회가 될 수 있다며 투자의견을 '중립'에서 '비중확대'로 상향 조정했다. 최선호주는 삼성SDI를 차선호주에는 LG에너지솔루션을 제안했다. 정원석 iM증권 연구원은 9일 보고서에서 \"정책의 핵심은 전력과 용수, 환경 부담이 주민에게 전가되지 않도록 사업자의 책임을 강화하는데 있다\"며 \"특히 가스터빈의 공급 제약과 운영 비용 절감 등을 고려하면 가스발전과 '태양광+에너지저장장치(ESS)'를 병행하는 구조가 확대될 가능성이 높다\"고 강조했다."},{"s":"Hongchen, 산업연구소와 손잡고 NASA 항공우주 배터리 세미나 참석 - 비즈니스 정보","so":"工商時報","tm":"11/09 07:00","c":1,"r":"tw","u":"https://www.ctee.com.tw/news/20261109700014-431202","p":1794175200,"a":1794177868,"t":"泓辰攜手工研院登上NASA航太電池研討會- 商情","su":"美國國家航空暨太空總署(NASA)訂於11月17日至19日在美國阿拉巴馬州舉辦「2026 NASA Aerospace Battery Workshop」，將有來自全球7個國家，33場專題演講；NASA航太電池研討會是全球航太與頂級電池技術領域，最具權威與指標性的年度技術盛會，堪稱全球航太電池領域的..."},{"s":"경쟁이 치열해지고, 전력 배터리 제조업체는 새로운 성장 극을 모색합니다.","so":"第一财经","tm":"11/08 22:14","c":1,"r":"cn","u":"https://www.yicai.com/news/103431437.html","p":1794143645,"a":1794207274,"t":"竞争升温，动力电池厂商挖掘新增长极","su":"{{aisd}} AI 생성 면책조항 최근 중국 항공(China Aviation)은 글로벌 생태학적 파트너 컨퍼런스에서 회사의 제품 배송 규모가 2026년에 증가할 것으로 예상하고 있으며, 지난해 상용차 분야에서 전년 대비 133% 성장할 것이라고 밝혔습니다. 2027년까지 회사가 생산 능력 격차를 점차적으로 메우고 다양한 새로운 시나리오와 새로운 비즈니스를 점진적으로 구현함에 따라 중화항공은 출하량이 대폭 증가하고 획기적인 도약을 이룰 것으로 예상됩니다. 현재 중국신항공은 선박, eVTOL 전기 수직 이착륙 항공기, 고급 전기 오토바이 등 신규 사업을 육성해 동일한 기술로 산업을 확장하고 있다. 동시에 에너지 시스템, 센서, 뼈대 등 로봇 시장에도 진출할 계획이다."},{"s":"투자 넘어 수주·양산으로…LFP 양극재 사업화 속도","so":"이투데이","tm":"11/08 17:34","c":1,"r":"kr","u":"https://www.etoday.co.kr/news/view/2645037","p":1794126840,"a":1794128040,"su":"엘앤에프, 국내 셀 3사 고객사 확보…9월부터 양산포스코퓨처엠, 기존 설비 전환·전용공장 건설 병행북미 ESS 성장에 비중국산 소재 확보 수요 확대▲엘"},{"s":"펑지아 야시장에서 한 관광객의 배낭에 불이 붙었고, 모바일 전원 공급 장치의 리튬 배터리가 사고 원인으로 의심됩니다.","so":"公視新聞","tm":"11/08 14:06","c":1,"r":"tw","u":"https://news.pts.org.tw/article/834799","p":1794114387,"a":1794128040,"t":"逢甲夜市遊客背包起火 疑行動電源鋰電池肇禍","su":"타이중 펑지아 야시장에서는 어젯밤(7일) 한 관광객의 배낭에 불이 붙었는데, 내부에 있던 리튬 배터리가 불탔던 것으로 의심됩니다. 다행히 인근 상인이 공용 건조분말소화기를 가져와 진화에 성공해 인명피해는 없었다. 그러나 일부 전문가들은 건조 분말 소화기가 리튬 배터리나 이동식 전원 공급 장치로 인한 화재를 진압하는 데 적합하지 않다는 점을 상기시킵니다. 연소열을 중화시키기 위해 다량의 물을 사용하는 것이 화재를 진압하는 데 더 적절한 방법입니다."}]},{"name":"⚡ 전고체배터리·ESS","note":"보유: KODEX 전고체배터리ESS TOP2플러스","breaking":false,"items":[{"s":"TECO, New Fiber 및 Chang Gungu Energy와 손을 잡고 국내 최초의 비하인드 에너지 저장 프로젝트를 시작하여 연간 전기 요금을 450만 위안 이상 절약 | 업계 종합 | 산업경제학","so":"UDN","tm":"11/09 15:13","c":6,"r":"tw","u":"https://udn.com/news/story/7241/9866794?from=udn-ch1_breaknews-1-cate6-news","p":1794204832,"a":1794206099,"t":"東元攜手新纖、長庚能源國產表後儲能首案啟用年省電費逾450萬元| 產業綜合| 產經","su":"주요 전자기계 기업인 TECO(1504)는 New Fiber(1409) 및 Chang Gungu Energy와 협력하여 국내 비하인드 에너지 저장 장치의 적용을 공동으로 추진하는 등 스마트 에너지 레이아웃을 확장했습니다. 3자 협력의 첫 번째 실증 현장이 공식적으로 완성되어 10월 말에 가동에 들어갔습니다. 이는 국내 에너지 저장 공급망이 대규모 산업 현장에 공식적으로 안착하여 기업 에너지 전환에서 비즈니스 기회를 포착했음을 상징합니다."},{"s":"Yuanxin Energy Storage의 첫 상장은 IPO 가격보다 1.1배 이상 높은 21위안으로 시작되었습니다.","so":"TVB","tm":"11/09 11:46","c":5,"r":"hk","u":"https://news.tvb.com/sc/1205289-%E9%81%A0%E4%BF%A1%E5%84%B2%E8%83%BD%E9%A6%96%E6%8E%9B%E9%96%8B%E5%A0%B121%E5%85%83%E8%BC%83%E6%8B%9B%E8%82%A1%E5%83%B9%E9%AB%98%E9%80%BE11%E5%80%8D","p":1794192360,"a":1794206109,"t":"遠信儲能首掛 開報21元較招股價高逾1.1倍","su":"본토 통합 에너지 저장 시스템 솔루션 제공업체인 Yuanxin Energy Storage가 처음으로 상장했습니다. 공모가는 21위안으로 공모가 9.78위안보다 1.1배 이상 높았다. 취급 수수료를 제외하고 랏당 500주로 랏당 이익은 5,610위안입니다. 주식 공모는 1,387배 초과 청약되어 승률 5%, 국제 공모는 0.3배 초과 청약되었습니다. 모금액은 약 5억 위안으로 기술 역량 강화에 사용될 예정이다."},{"s":"ETF 시장일보 | 상업용 항공우주가 집중적으로 촉매됩니다! 위성 테마 ETF 급증, 과학 기술 혁신 광범위한 기반 및 배터리 에너지 저장 방향 조정","so":"Jiemian.com","tm":"11/09 17:52","c":1,"r":"cn","u":"https://m.jiemian.com/article/15311832.html","p":1794214323,"a":1794216107,"t":"ETF市场日报｜商业航天密集催化！卫星主题ETF大涨，科创宽基与电池储能方向调整","su":"3대 A주 지수는 위축되고 등락을 거듭했고, 시장 규모도 크게 줄었습니다. 구조적인 시장 상황은 사건에 의해 촉진되었습니다. 상업용 항공우주 부문은 여러 긍정적 요인의 영향으로 크게 강화되었습니다. 석탄 등 고배당 방향이 활발해 전체 시장 매출액이 1조4000억위안대로 떨어졌다."},{"s":"Li Yuanheng: 전고체 배터리 라인 프로젝트가 주요 고객사에 납품되었습니다.","so":"界面新闻","tm":"11/09 17:27","c":1,"r":"cn","u":"https://m.jiemian.com/article/15311582.html","p":1794212823,"a":1794214286,"t":"利元亨：全固态电池整线项目已完成向头部客户交付","su":"11월 9일, Li Yuanheng은 투자자 커뮤니케이션 기록 시트에 대한 발표를 발표했습니다. 회사의 전고체전지 장비 사업은 기술 연구개발 단계에서 고객 검증 및 소규모 납품 단계로 전환되고 있다. 전체 라인 및 주요 모델이 꾸준히 진행되고 있습니다. 전고체전지 전체 라인 프로젝트가 주요 고객사에 납품을 완료했으며, 기타 주요 고객사의 일부 주요 모델도 납품 단계에 진입했습니다. 전반적인 진행 상황은 기대에 부합합니다. 전고체 배터리 장비는 회사의 주요 레이아웃 방향 중 하나입니다. 2026년 예정된 이번 증설사업에도 전고체전지 장비 관련 레이아웃이 포함돼 건식전극, 라미네이션, 등방압성프레스 등 핵심 공정 장비 역량 강화에 중점을 두고 있다."},{"s":"최대 규모 ESS 수주전 맞붙은 삼성SDI·SK온…저가 경쟁 완화될까 - 머니투데이","so":"머니투데이","tm":"11/09 17:10","c":1,"r":"kr","u":"https://www.mt.co.kr/index.php/amp/industry/2026/11/09/2026110913383630024","p":1794211800,"a":1794214284,"su":"앞선 두 차례 입찰에서 과도한 저가 경쟁이 벌어진 것과 달리 이번에는 공급사가 줄어들면서 배터리 가격이 상승할 것이라는 전망이 나온다. 9일 배터리업계에 따르면 정부는 오는 11일 제3차 ESS 중앙계약시장 입찰과 관련해 사업계획서와 증빙서류 제출을 마감한다."},{"s":"Yuanxin Energy Storage는 연구 개발, 해외 레이아웃 및 Wuzhen의 새 공장에 투자하기 위해 5억 6,300만 홍콩달러를 모금했습니다.","so":"鉅亨網","tm":"11/09 17:00","c":1,"r":"tw","u":"https://news.cnyes.com/news/id/6653286","p":1794211219,"a":1794214291,"t":"遠信儲能募資5.63億港元投入研發、海外布局與烏鎮新廠","su":"YuanSin Energy Storage는 Wuzhen Uanalyze의 R&D, 해외 레이아웃 및 신규 공장에 투자하기 위해 HK$5억6천3백만을 모금했습니다. 2026년 11월 9일(Uanalyze/산업 데이터 센터 보고서) ⸺ 중국 에너지 저장 시스템 회사 YuanSin Energy Storage RelyEZ(9621-HK)가 홍콩에 상장되어 약 HK$5억6천3백만을 모금했습니다. 이 자금은 소프트웨어 및 하드웨어 연구개발, 해외 시장 확장, 우전 신공장 등에 사용될 예정이다. 지난해 회사 매출이 63% 증가한 후 제품 및 생산 레이아웃을 확장하기 위해 자금을 추가로 조달했습니다. 왕위 회장은 상장이 글로벌 확장을 가속화하는 새로운 출발점이 될 것이라고 말했다. 이전 자금 조달 계획에 따르면 Yuanxin Energy Storage는 순수익의 약 45%를 연구 개발에 투자하고, 25%는 현지 팀, 주요 해외 시장에서의 협력 및 생산 기회에, 20%는 Wuzhen의 새로운 공장, 장비 및 실험실 건설에, 나머지 10%는 운전 자본으로 투자할 것으로 예상됩니다. 위 비율은 순모금액을 기준으로 계산한 것으로, 상장을 통해 모금된 총액과는 다릅니다."},{"s":"심지구에너지저장 핵심기술을 중심으로 산둥성 태안에서 국가수준의 고급훈련강좌가 개최되었습니다.","so":"中国新闻网","tm":"11/09 16:20","c":1,"r":"cn","u":"https://www.chinanews.com.cn/gn/2026/11-09/10728801.shtml","p":1794208829,"a":1794214288,"t":"聚焦深地储能关键技术 国家级高级研修班在山东泰安开班","su":"심지구 에너지 저장 핵심 기술을 중심으로 산둥성 타이안에서 국가 수준의 고급 교육 강좌가 개최되었습니다. 중국 통신사, 타이안, 11월 9일(Zhou Yiwei) 11월 9일 산둥성 타이안에서 \"지하 공간 탐지 및 심지구 에너지 저장 활용을 위한 핵심 기술\"에 관한 국가 수준 고급 교육 강좌(이하 '교육 강좌')가 개최되었습니다. 심지구 인재 팀 구성을 더욱 강화하고 심지구 에너지 저장 프로젝트의 실제 문제 해결 능력을 향상시키는 것을 목표로 합니다. 이번 교육에는 에너지저장공학, 심토지구공학, 지질학 및 광물자원, 지구물리탐사, 지하공간 활용 등 관련 분야에 종사하는 국내 인력이 참여했다. 개회식에서 산둥성 천연자원부 2급 검사관 Duan Xiuming은 지하 공간이 국가 우주 시스템의 중요한 부분이자 발전 잠재력이 큰 전략적 국가 우주 자원이라고 소개했습니다. 산둥성의 뛰어난 소금 자원 보유량과 안정된 지질 구조는 소금 동굴 에너지 저장 산업 발전에 독특한 자원 조건을 제공합니다. 부서는 소금 광산 및 기타 광물 자원의 탐사, 평가 및 모니터링을 지속적으로 장려하고, 채굴권의 전체 과정을 엄격하게 관리하며, 광물 자원 개발과 지하 공동 에너지 저장 재사용 간의 연결을 조정하고, 소금 동굴 에너지 저장 프로젝트를 지원하고 산둥성 지하 심층 에너지 저장 산업의 표준화되고 질서 있는 발전을 돕기 위해 노력하고 있습니다."},{"s":"김성환 \"반도체 산단 전력·용수 적기 공급\"…변전소 선제 확충·ESS 송전망 구축","so":"뉴시스","tm":"11/09 15:36","c":1,"r":"kr","u":"https://www.newsis.com/view/NISX20261109_0003860712","p":1794206180,"a":1794207281,"su":"[세종=뉴시스]손차민 기자 = 김성환 기후에너지환경부 장관이 \"3대 메가프로젝트를 뒷받침하도록 전력·용수 인프라를 적기에 구축하겠다\"고 9일 밝혔다.김 장관은 이날 오후 국회 기후에너지환경노동위원회 전체회의에서 \"호남권 반도체 산단과 충청권 첨단 산업에 필요한 용수 공급 시설도 차질 없이 구축하겠다\"며 기후부 예산안 운용 방향을 설명했다. 김 장관은 \"첨단.."},{"s":"업튼 마그나(Upton Magna) 학부모, 학교 근처 배터리 부지 계획에 반대","so":"BBC","tm":"11/09 15:12","c":1,"r":"world","u":"https://www.bbc.com/news/articles/c63ellz584wqo","p":1794204720,"a":1794206122,"t":"Upton Magna parents oppose plans for battery site near school","su":"부지 계획에 따르면 세인트 루시아의 CofE 초등학교 및 보육원에서 1km 미만 거리에 있습니다."},{"s":"전고체 전지 재료 탐색, 로봇 실험 시스템으로 효율화 : 기계 화학 합성 작업 자동화","so":"EE Times Japan","tm":"11/09 13:30","c":1,"r":"jp","u":"https://eetimes.itmedia.co.jp/ee/articles/2611/09/news024.html","p":1794198600,"a":1794206115,"t":"全固体電池材料の探索、ロボット実験システムで効率化：メカノケミカル合成作業を自動化","su":"산업기술종합연구소(산총연)는 덴소 웨이브나 아이치공업대학, 아이치산업과학기술종합센터와 공동으로 전고체 전지 재료의 메카노케미컬 합성을 일관되게 실시할 수 있는 '인협동형 자동실험 시스템'을 개발했다. 연구자의 작업 부하를 줄이고 재료 탐색을 효율적으로 수행할 수 있다."},{"s":"델: 전고체전지 생산라인은 시험생산 및 증설 단계에 있다.","so":"第一财经","tm":"11/09 12:09","c":1,"r":"cn","u":"https://www.yicai.com/news/103431950.html","p":1794193793,"a":1794206097,"t":"德尔股份：固态电池产线处于试生产及产能爬坡阶段","su":"WeChat을 열고 하단의 \"검색\"을 클릭한 다음 \"스캔\"을 사용하여 웹페이지를 친구들과 공유하세요. 중국 비즈니스 뉴스 2026-11-09 11:07:05 편집자: Qi Xinyi Dell 주식이 공개한 투자자 관계 활동 기록에 따르면 회사는 최근 Guolian Minsheng Securities와 같은 기관으로부터 설문조사를 받은 것으로 나타났습니다. 델(Del Co., Ltd.)은 다양한 적용 시나리오에 따라 에너지 밀도, 속도 성능, 사이클 수명 등 다양한 지표의 종합적인 균형을 맞출 수 있는 독립적인 전해질 소재 공식 시스템을 구축했다고 밝혔다. 생산능력 측면에서는 외부 협력업체와 위탁가공 계약을 체결했다. 파트너의 원래 리튬 배터리 생산 라인을 기반으로 회사의 전고체 배터리 생산 프로세스 요구 사항에 따라 특수 수정 및 장비 디버깅을 구현하여 회사의 전고체 배터리 제품 생산을 담당했습니다. 생산라인은 현재 시험생산 및 생산능력 확대 단계에 있다."},{"s":"거의 1,389회 과매수를 기록하며 역사적인 '과매수 왕'이 되었습니다. YuanSin Energy Storage는 상장 첫날 거의 130% 급등했습니다.","so":"财联社","tm":"11/09 11:51","c":1,"r":"cn","u":"https://www.cls.cn/detail/2528615","p":1794192660,"a":1794214973,"t":"超购近1389倍跻身历史级“超购王” 远信储能上市首日盘中一度狂飙近130%","su":"① Yuanxin Energy Storage의 상장 첫날, 2차 시장에서 집중적인 자금 조달을 촉발한 이유는 무엇입니까? ② 출하량 상위 10위권에 진입했고, 해외 점유율도 급등했다. Farsonic Energy Storage가 AIDC 컴퓨팅 전력 분배 및 스토리지에 투자하여 성장을 위한 새로운 공간을 열 수 있습니까? 파이낸셜뉴스(Financial News Agency)가 11월 9일 보도했다(편집자 후자롱). 홍콩 증시의 신에너지 부문이 또 하나의 큰 이슈를 맞이했다. Yuanxin Energy Storage(09621.HK)가 오늘 공식적으로 상장되었습니다. 초기 거래에서 급격히 상승했고 빠르게 상승했습니다. 장중 증가율은 130%에 가까웠다. 보도 시점 기준으로 119.84% 상승한 HK$21.50을 기록했습니다. Yuanxin Energy Storage는 1000배가 넘는 초과 청약 배수와 콤팩트한 순환 칩 구조로 유통 시장에서 집중적인 자금 추적을 촉발시켰습니다. 공모가는 1,389배 가까이 과매수돼 홍콩 주식 역사상 '과매수 왕'이 됐다. Yuanxin Energy Storage는 IPO 단계에서 선도적인 청약 열정을 보여주었습니다. 홍콩 공모는 1,388.75배 초과 청약을 기록해 같은 기간 다른 공모 주식보다 훨씬 많았을 뿐만 아니라 홍콩 주식 시장 역사상 '과매수 왕'에 직접 이름을 올렸다."},{"s":"이온어스, 美 THOR Energy와 북미 ESS 시장 공략","so":"전기신문","tm":"11/09 11:25","c":1,"r":"kr","u":"https://www.electimes.com/news/articleViewAmp.html?idxno=374518","p":1794191140,"a":1794195264,"su":"이온어스, 美 THOR Energy와 북미 ESS 시장 공략 빅스포서 이동형·컨테이너형 ESS 협력 MOU 텍사스서 실증 거쳐 중남미까지 사업 확대 추진 국내 레퍼런스 바탕으로 해외 사업 기회 모색 이동형 에너지저장장치(ESS) 전문기업 이온어스가 미국 텍사스의 에너지 프로젝트 개발 기업과 손잡고 북미 시장 문을 두드린다. 국내에서 다진 이동형 전력 공급 사업 경험을 미국 현지 실증으로 검증한 뒤 중남미까지 무대를 넓히겠다는 구상이다."},{"s":"보도자료 : RENON POWER, 저압 계통용 축전지 누계 수주 1,500사이트 돌파(PR TIMES)","so":"毎日新聞","tm":"11/09 11:22","c":1,"r":"jp","u":"https://mainichi.jp/articles/20261109/pr2/00m/020/112000c","p":1794190977,"a":1794195267,"t":"プレスリリース：RENON POWER、低圧系統用蓄電池の累計受注1,500サイト突破（PR TIMES）","su":"2026년 말 누계 수주 목표 1,000사이트를 앞당겨 달성, 약 75MW/300MWh의 수주 규모에 미국발의 축전지 메이커 RENON POWER 주식회사(이하 「RENON POWER」)는, 저압 계통용 축전지 패키지의 누계 수주수가 1,500사이트를 돌파한 것을 알렸습니다. 당사는 2026"},{"s":"홍콩 주식 플래시 보고서 | 홍콩 증시는 상승세로 출발했고 Hengke는 1% 이상 상승했습니다. 신규 주식의 어는점은 지났나요? Yuanxin Energy Storage 상장 가격 120% 이상 상승","so":"每日经济新闻","tm":"11/09 11:12","c":1,"r":"cn","u":"https://www.nbd.com.cn/articles/2026-11-09/4642014.html","p":1794190320,"a":1794207283,"t":"港股速报 | 港股高开恒科涨超1% 新股冰点已过？远信储能上市涨超120%","su":"오늘(11월 9일) 홍콩 증시는 장 초반 상승세로 출발했습니다. 보도 시간 현재 항셍지수는 143.85포인트(0.59%) 상승한 24,625.71포인트로 출발했다. 항셍기술지수는 41.75포인트(1.02%) 오른 4119.98포인트로 출발했다. 뉴스, 오늘"},{"s":"이번주 홍콩 증시 뉴스 미리보기 │ Yuanxin Energy Storage 등 다수의 신규 주식이 함께 상장되고 AI 산업 체인이 여러 촉매 이벤트를 맞이하고 있습니다","so":"财联社电报","tm":"11/09 11:00","c":1,"r":"cn","u":"https://m.cls.cn/detail/2528350","p":1794189616,"a":1794214290,"t":"港股本周要闻前瞻｜远信储能等一批新股集中挂牌 AI产业链迎来多重催化事件","su":"Financial Associated Press, 11월 9일(편집자: Feng Yi) Financial Associated Press는 이번 주 홍콩 주식 뉴스를 전합니다: 해외 매크로 월요일(11월 9일): Goolsby 시카고 연준 의장과 Barkin 리치몬드 연준 의장이 연설을 했습니다. 일본은행은 10월 통화정책회의 검토위원회 의견을 요약해 공개했다. 화요일(11월 10일): 10월 미국 CPI, 10월 24일까지 한 주 동안 미국 ADP 고용. G7 외무장관 회의가 열리고, 미국, 러시아, 우크라이나가 11월 10일부터 11일까지 아부다비에서 만날 예정입니다. 목요일(11월 12일): 11월 7일로 끝나는 주 동안 미국의 최초 실업수당 청구 건수. 하맥 클리블랜드 연은 총재, 데일리 샌프란시스코 연은 총재, 윌리엄스 뉴욕 연은 총재가 연설을 했습니다."},{"s":"[신주 IPO] Yuanxin Energy Storage 9621이 장초기 1.24배 상승하여 랏당 6,060위안을 벌었습니다.","so":"香港經濟日報HKET","tm":"11/09 10:51","c":1,"r":"hk","u":"https://inews.hket.com/article/4221827/%E3%80%90%E6%96%B0%E8%82%A1IPO%E3%80%91%E9%81%A0%E4%BF%A1%E5%84%B2%E8%83%BD9621%E9%A6%96%E6%8E%9B%E6%97%A9%E6%AE%B5%E5%8D%871.24%E5%80%8D%E3%80%80%E6%AF%8F%E6%89%8B%E5%B8%B3%E9%9D%A2%E8%B3%BA6,060%E5%85%83","p":1794189109,"a":1794195280,"t":"【新股IPO】遠信儲能9621首掛早段升1.24倍 每手帳面賺6,060元"},{"s":"배터리 시장 판도 바뀐다… 韓은 美 ESS 성장에 ‘미소’, 中은 공급 과잉에 ‘울상’","so":"Chosunbiz","tm":"11/09 10:42","c":1,"r":"kr","u":"https://biz.chosun.com/industry/company/2026/11/09/5GVNFBVHXBAODESK3ZTXMDKTDI/","p":1794188520,"a":1794195264,"su":"배터리 시장 판도 바뀐다 韓은 美 ESS 성장에 미소, 中은 공급 과잉에 울상 CATL, 기대 이하 실적 외형 성장 속 수익성 고민 LG엔솔·삼성SDI는 美 ESS 수혜로 어닝 서프라이즈"},{"s":"중국 최대의 단일 동력 플라이휠 에너지 저장 프로젝트 가동","so":"人民日报","tm":"11/09 09:10","c":1,"r":"cn","u":"http://paper.people.com.cn/rmrbhwb/pc/content/202611/09/content_30190098.html","p":1794183047,"a":1794207285,"t":"中国单体最大功率飞轮储能项目投运","su":"란저우, 11월 8일(Zeng Yichen 기자) 중국 최대의 단일 전력 플라이휠 에너지 저장 프로젝트가 최근 간쑤성 란저우 시의 그리드에 연결되어 화력 기지의 플라이휠 에너지 저장을 위한 중국의 빠른 주파수 변조 기술에 중요한 돌파구를 마련했습니다. 플라이휠 에너지 저장 장치는 고속 회전 로터를 사용하여 전기 에너지를 저장합니다. 전력이 충분할 때 전기 에너지는 로터를 고속으로 회전시켜 전기 에너지를 회전 운동 에너지로 변환하여 저장합니다. 전력망에 전원 공급이 필요할 때 고속 회전 로터는 운동 에너지를 전기 에너지로 변환하여 외부로 전달합니다. 충전 및 방전을 신속하게 완료하여 전력망의 원활한 작동을 보장합니다. 높은 변환 효율, 강력한 적응성 및 긴 장비 수명이라는 장점이 있습니다. 이 그리드 연결 플라이휠 에너지 저장 프로젝트는 \"5MW 고출력 플라이휠 + 0.5MW 관성 플라이휠\"의 협업 모델을 혁신적으로 채택합니다. 기존의 단일 플라이휠 모드와 달리 듀얼 플라이휠의 조화로운 작동은 보완적인 이점과 계층적 응답을 얻을 수 있습니다. 5MW 대형 플라이휠은 전력망의 큰 주파수 변동에 효과적으로 대처할 수 있으며, 0.5MW 소형 플라이휠은 작은 일일 전력망 주파수 변동을 안정화하는 역할을 합니다. 듀얼 플라이휠 에너지 저장 장치가 장착된 화력 발전 장치는 100밀리초 이내에 그리드 주파수 조정에 응답할 수 있으며 조정 정확도는 99.5%를 초과합니다. 보다 복잡한 상황에서 장치의 주파수 조절 성능을 효과적으로 향상시키고 그리드 주파수 안정성을 신속하게 지원할 수 있습니다."},{"s":"현재와 ​​미래의 경제 동향에 관한 메모: Yuanxin Energy Storage가 상장되었습니다. 신세계 파트너십 투자 촉진국 서커우 베이두의 첫 번째 프로젝트 기자회견 | 인스턴트 뉴스 - 뉴스","s ,"c":1,"r":"us","u":"https://ca.finance.yahoo.com/news/chinese-robotics-stock-surge-apple-061332775.html","p":1794204780,"a":1794206163,"t":"Chinese robotics stock surge on Apple robotics research","su":"Investing.com-- 애플이 유니트리 로보틱스(Unitree Robotics)의 기술을 활용한 자율 휴머노이드 로봇 제어 시스템을 공개한 연구 논문을 발표한 후 월요일 중국 로봇주가 급등했습니다."},{"s":"13:08:57 [휴머노이드 로봇 기술로 돌파구를 열었고, 로봇 ETF E펀드(159530)가 4일 연속 자금 순유입을 기록했다.]","so":"财联社","tm":"11/09 14:08","c":1,"r":"cn","u":"https://www.cls.cn/detail/2528743","p":1794200937,"a":1794207308,"t":"13:08:57【人形机器人技术迎来突破，机器人ETF易方达（159530）连续4日获资金净流入】","su":"휴머노이드 로봇 기술이 획기적인 발전을 이루며 로봇ETFE펀드(159530)에 나흘 연속 자금이 순유입됐다. 정오 마감 기준 국가증권 로봇산업지수는 1.7% 상승했다. Flush iFinD 데이터에 따르면 지난 거래일 현재 로봇 ETF E 펀드(159530, 피더 펀드 A/C: 020972/020973)에 4일 연속 자금 순유입이 발생해 총 17억 5천만 위안에 달합니다. 해당 소식에 애플 연구팀은 휴머노이드 로봇 자율제어 시스템 HALO를 출시했다. 시스템은 Yushu G1에 대한 순수 시뮬레이션 교육 후에 제로 샘플 마이그레이션을 달성했습니다. 사전 스캔 및 매핑 없이 6개의 실제 공간에서 360개의 단일 작업 테스트를 완료했으며 평균 성공률은 91%입니다. 세 가지 유형의 결합 작업의 평균 성공률은 70%였습니다. 일각에서는 시뮬레이션 훈련이 휴머노이드 로봇의 자율제어 능력 향상을 촉진하고 있다는 점을 지적하며, 로봇 산업체인에 대한 관심이 뜨거워질 것으로 예상된다."},{"s":"A주가 반격에 나섰고, AI단편드라마, 휴머노이드 로봇, 물리AI가 급등했다! 와서 시장을 추측하고 현금을 획득하세요!","so":"每日经济新闻","tm":"11/09 13:55","c":1,"r":"cn","u":"https://www.nbd.com.cn/articles/2026-11-09/4642109.html","p":1794200100,"a":1794207310,"t":"A股拉开反攻，AI短剧、人形机器人、物理AI飙升！快来猜大盘，赢现金！","su":"해외 증시의 반등과 좋은 국내 뉴스에 힘입어 A주는 11월 9일 오전 반등했고, 장중 상하이종합지수는 0.80%까지 올랐다. AI 단편드라마, 휴머노이드 로봇, 물리 AI 분야가 급등했다. 좋은 소식이 있습니다. \"시장을 추측하고 현금을 얻으세요\" 상금 추측 이벤트의 두 번째 단계가 11월에 개최됩니다."},{"s":"글로벌 구현 모델 역량의 도약은 로봇 애플리케이션 구현을 가속화할 것이며, 로봇 ETF Harvest(159526)는 전체 로봇 산업 체인에 초점을 맞추고 있습니다.","so":"Jiemian.com","tm":"11/09 12:51","c":1,"r":"cn","u":"https://m.jiemian.com/article/15310127.html","p":1794196275,"a":1794207311,"t":"全球具身模型能力飞跃将推动机器人应用落地加速，机器人ETF嘉实(159526)聚焦机器人全产业链","su":"11월 9일 초반 거래에서는 로봇, 휴머노이드 로봇 등 분야의 컨셉이 활발했다. 10시 54분 기준 CSI 로봇지수(H30590)는 1.47% 상승했다. 구성주인 Hechuan Technology는 9.70% 상승했고, Jiangsu Leili는 7.69% 상승했으며, Dingzhi Technology와 Tianzhun Technology 같은 주행차 등 피지컬 인공지능(AI) 신사업에서도 양 그룹간 시너지를 발휘할 공동 전선이 빠르게 넓어지고 있어서다. 삼성·현대차그룹 CEO(최고경영자)들이 대거 부부 동반 행사를 통해 협력의 폭과 깊이를 확대하면서 현대차그룹 휴머노이드 ‘아틀라스’의 메모리 공급과 차세대 칩 개발 등 신사업 협력에 속도가 붙을 전망이다."},{"s":"Huashan Capital의 Yang Lei: 로봇의 미래는 산업별 로봇과 구현된 로봇이 공존하는 시대가 될 것입니다.","so":"Jiemian.com","tm":"11/08 18:20","c":1,"r":"cn","u":"https://www.jiemian.com/article/15308111.html","p":1794129656,"a":1794207553,"t":"华山资本杨镭：机器人的未来将是行业专用机器人与具身机器人并存的时代","su":"Jiang Xi · 출처 : Jiemian News 11월 8일 2026년 국제 수입 박람회 상하이 컨퍼런스 행사의 \"지능형 제조 및 전자 소비 세미나\"에서 Huashan Capital의 창립 파트너이자 CEGA 구현 지능 및 로봇 공학 위원회 이사 Yang Lei는 로봇의 미래는 산업별 로봇과 구현 로봇이 공존하는 시대가 될 것이라고 지적했습니다. Yang Lei는 산업용 로봇이 연간 설치 용량이 50만 대 이상인 성숙한 시장으로 발전한 반면, 휴머노이드 로봇은 아직 1,000대를 시작하는 초기 단계에 있다고 분석했습니다. 두 가지 시나리오는 서로 다른 시나리오를 제공하며 오랫동안 공존합니다. 누가 누구를 대체하느냐의 문제가 아니라 특정 시나리오에는 전용 제품을, 롱테일 시나리오에는 범용 제품을 사용하는 것입니다. 두 라인 모두 투자 기회가 있습니다."},{"s":"숙련공 의존하던 감광액 교체·불량 검사, 삼전닉스 반도체 공장선 로봇이 한다","so":"서울경제","tm":"11/08 17:51","c":1,"r":"kr","u":"https://m.sedaily.com/amparticle/20111617","p":1794127876,"a":1794145920,"su":"고도의 정밀성이 요구되는 반도체 제조 현장에서 로봇 활용 범위가 넓어지고 있다. 단순 물류·이송 자동화를 넘어 감광액 교체, 웨이퍼 테스트 등 작업자의 숙련도와 정교한 조작이 필요한 영역까지 로봇 적용을 검토하는 단계에 이르렀다. 까다로운 반도체 공정이 로봇의 성능과 정밀도를 검증하는 테스트베드로 활용되면서 로봇 기술 고도화에도 속도가 붙을 것으로 전망된다"},{"s":"휴머노이드의 다양한 훈련 방식 중 모방 학습×강화 학습의 차이점!","so":"programs.sbs.co.kr","tm":"11/08 17:00","c":1,"r":"kr","u":"https://programs.sbs.co.kr/culture/humanoidbigbang/clip/90860/OC483066928","p":1794124800,"a":1794206162,"su":"휴머노이드의 훈련 방식 중 모방 학습과 강화 학습의 차이점에 대해 설명한다. 교 양ㅣ휴머노이드 빅뱅 1회 본방송ㅣ11월 8일 일요일 밤 11시 5분 Copyright ⓒ SBS. All rights reserved. 무단 전재, 재배포 및 AI학습 이용 금지"},{"s":"사람처럼 정교한 움직임이 가능해진 ‘휴머노이드’들의 격투 리그♨","so":"programs.sbs.co.kr","tm":"11/08 17:00","c":1,"r":"kr","u":"https://programs.sbs.co.kr/culture/humanoidbigbang/clip/90860/OC483066874","p":1794124800,"a":1794206162,"su":"사람처럼 정교한 움직임이 가능해진 휴머노이드들의 격투 리그에 대해 설명한다. 교 양ㅣ휴머노이드 빅뱅 1회 본방송ㅣ11월 8일 일요일 밤 11시 5분 Copyright ⓒ SBS. All rights reserved. 무단 전재, 재배포 및 AI학습 이용 금지"},{"s":"휴머노이드 빅뱅 : function renderCtrl(){
  var br = D.themes[S.tab].breaking;
  var h = '';
  if(!br){
    h += '<button class="'+(S.sort==='c'?'on':'')+'" onclick="setSort(\'c\')">🔥 화제순</button>';
    h += '<button class="'+(S.sort==='p'?'on':'')+'" onclick="setSort(\'p\')">🕒 최신순</button><span class="sep"></span>';
  }
  h += '<button class="'+(S.region==='all'?'on':'')+'" onclick="setRegion(\'all\')">전체</button>';
  D.regions.forEach(function(r){
    h += '<button class="'+(S.region===r.k?'on':'')+'" onclick="setRegion(\''+r.k+'\')">'+esc(r.l)+'</button>';
  });
  $('ctrl').innerHTML = h;
}
function card(n, prev){
  var hot = n.c > 1 ? '<span class="hot'+(n.c>=5?' big':'')+'">🔥 언론 '+n.c+'곳</span>' : '';
  var isNew = prev && n.a > prev ? ' <span class="new">NEW</span>' : '';
  return '<a class="card" href="'+esc(n.u)+'" target="_blank" rel="noopener" data-s="'+esc(n.su||'')+'">'+
    '<div class="meta">'+hot+esc(RL[n.r]||'')+' · '+esc(n.so)+' · '+esc(n.tm)+isNew+'</div>'+
    '<div class="title">'+esc(n.s)+'</div>'+(n.t?'<div class="orig">'+esc(n.t)+'</div>':'')+'</a>';
}
function renderMain(){
  var t = D.themes[S.tab], list = sorted(visible(t), t.breaking), prev = S.prev[t.name] || 0;
  var h = '<h2>'+esc(t.name)+'</h2>' + (t.note ? '<p class="note">'+esc(t.note)+'</p>' : '');
  var fresh = prev ? list.filter(function(n){ return n.a > prev; }).length : 0;
  if(S.onlyNew){                                // '새 기사만 보기' 중
    list = list.filter(function(n){ return n.a > prev; });
    h += '<button class="newbar" onclick="onlyNew(false)">🆕 새 기사 '+list.length+'개만 보는 중 · 전체 보기</button>';
  } else if(fresh && !t.breaking){              // 새 기사가 정렬 때문에 아래로 밀려도 바로 찾을 수 있게
    h += '<button class="newbar" onclick="onlyNew(true)">🆕 새 기사 '+fresh+'개 · 새 기사만 보기</button>';
  }
  if(!list.length) h += '<p class="none">'+(S.region==='all' ? '최근 ' + (t.breaking?'속보':'기사') + ' 없음' : esc(RL[S.region])+' 기사 없음')+'</p>';
  h += list.slice(0, S.shown).map(function(n){ return card(n, prev); }).join('');
  var extra = list.length - S.shown;
  if(extra > 0) h += '<button class="more" onclick="more()">더보기 ▾  ('+extra+'개 더)</button>';
  else if(S.shown > D.show) h += '<button class="more" onclick="less()">접기 ▴</button>';
  var auto = Object.keys(D.auto);
  h += '<footer>업데이트 '+esc(D.updated)+' · 최근 3일 · 믿을 만한 언론사 기사만 · 기사를 누르면 한국어 요약 → 원문 보기<br>'+
       '🔥 언론 N곳 = 같은 소식을 보도한 언론사 수 (많을수록 화제) · <span style="color:var(--red)">●</span> = 새 뉴스'+
       '<br><br><b>자동으로 추가된 언론사</b> (주요 언론보다 먼저 보도하고, 주요 언론도 함께 다룬 소식이 많은 곳 · 최근 14일)'+
       (auto.length ? auto.map(function(k){ return '<div>'+esc(k)+': '+esc(D.auto[k].join(', '))+'</div>'; }).join('') : '<div>아직 없음</div>')+
       '</footer>';
  $('main').innerHTML = h;
}
function openTab(i){
  var t = D.themes[i];
  S.tab = i; S.shown = D.show; S.onlyNew = false; save('tabname', t.name);
  if(!(t.name in S.prev)) S.prev[t.name] = S.seen[t.name] || 0;     // 이 탭에서 NEW 로 보여줄 기준
  S.seen[t.name] = Math.max(S.seen[t.name] || 0, newest(t)); save('seen', S.seen);  // 탭에 들어오면 레드닷 지움
  history.replaceState(null, '', '#t'+i);
  renderTabs(); renderCtrl(); renderMain(); window.scrollTo(0, 0);
}
function setSort(k){ S.sort = k; save('sort', k); S.shown = D.show; renderCtrl(); renderMain(); }
function setRegion(k){ S.region = k; save('region', k); S.shown = D.show; renderTabs(); renderCtrl(); renderMain(); }
function more(){ S.shown += 20; renderMain(); }
function onlyNew(on){ S.onlyNew = on; S.shown = D.show; renderMain(); }
function less(){ S.shown = D.show; renderMain(); window.scrollTo(0, 0); }
$('upd').textContent = '업데이트 ' + D.updated + ' · 탭을 눌러 테마별 뉴스 보기';

// 🚨 미국 속보 · 🌏 해외 속보는 페이지를 새로 올리지 않아도 최신 내용을 바로 가져옴
function refreshBreaking(){
  if(!window.fetch) return;
  fetch(D.breaking_url + '?t=' + Date.now(), {cache:'no-store'}).then(function(r){ return r.json(); }).then(function(b){
    var all = b.items || [];
    D.themes.forEach(function(t, i){
      if(!t.breaking) return;
      var items = all.filter(function(n){ return n.theme === t.name; }).map(function(n){
        var d = {s:n.show, so:n.source||'', tm:n.time||'', c:n.count||1, r:n.rk||'us', u:n.url||n.link, p:Math.floor(n.pub), a:Math.floor(n.added||n.pub)};
        if(n.show !== n.title) d.t = n.title; if(n.sum) d.su = n.sum; return d;
      });
      if(!items.length && t.items.length) return;
      t.items = items;
      if(S.tab === i){ S.seen[t.name] = Math.max(S.seen[t.name]||0, newest(t)); save('seen', S.seen); renderMain(); }
    });
    renderTabs();
  }).catch(function(){});
}
openTab(S.tab);
refreshBreaking();
setInterval(refreshBreaking, 5 * 60 * 1000);
document.addEventListener('visibilitychange', function(){ if(!document.hidden) refreshBreaking(); });

// 기사를 누르면 먼저 한국어 요약 → 원문 볼지 선택
document.addEventListener('click', function(e){
  var c = e.target.closest('a.card'); if(!c) return;
  if(e.ctrlKey||e.metaKey||e.shiftKey) return;
  e.preventDefault();
  $('s-meta').innerHTML = c.querySelector('.meta').innerHTML;
  $('s-title').textContent = c.querySelector('.title').textContent;
  var o = c.querySelector('.orig'); $('s-orig').textContent = o ? o.textContent : '';
  var sm = c.dataset.s || '';
  $('s-sum').textContent = sm || '이 기사는 요약을 가져오지 못했어요. (사이트가 자동 접속을 막았거나 아직 준비 중)';
  $('s-sum').className = 's-sum' + (sm ? '' : ' empty');
  $('s-go').href = c.href;
  $('dim').hidden = false; $('sheet').hidden = false; $('sheet').scrollTop = 0;
  document.body.style.overflow = 'hidden';
});
function closeSheet(){ $('dim').hidden = true; $('sheet').hidden = true; document.body.style.overflow = ''; }
document.addEventListener('keydown', function(e){ if(e.key==='Escape') closeSheet(); });
</script></body></html>
