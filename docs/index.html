<style>
@font-face{font-family:'ChosunIlboMyungjo';src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_one@1.0/Chosunilbo_myungjo.woff') format('woff');font-weight:normal;font-display:swap}
:root{color-scheme:dark;--bg:#262624;--card:#30302e;--card2:#3a3a37;--text:#faf9f5;--sub:#a6a39a;--line:#3e3e3a;--acc:#d97757;--red:#ef4444}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.55 'ChosunIlboMyungjo',Georgia,"Noto Serif KR",serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:760px;margin:auto}
header{padding:20px 16px 8px}
h1{font:600 22px/1.3 'ChosunIlboMyungjo',Georgia,serif;margin:0 0 4px}
.upd{color:var(--sub);font-size:12.5px}
/* 테마 탭 */
.tabs{position:sticky;top:0;z-index:3;background:rgba(38,38,36,.96);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.tabrow{display:flex;gap:8px;overflow-x:auto;padding:12px 16px 10px;scrollbar-width:none}.tabrow::-webkit-scrollbar{display:none}
.tab{position:relative;flex:none;padding:9px 15px;border-radius:12px;border:1px solid var(--line);background:var(--card);
  color:var(--sub);font:inherit;font-size:14px;cursor:pointer}
.tab b{margin-left:5px;color:var(--sub);font-weight:400;font-size:12px}
.tab.on{background:var(--acc);border-color:var(--acc);color:#1f1e1d;font-weight:600}.tab.on b{color:#1f1e1d}
.dot{position:absolute;top:-3px;right:-3px;width:11px;height:11px;border-radius:50%;background:var(--red);border:2px solid var(--bg)}
/* 정렬·국가 */
.ctrl{display:flex;gap:6px;overflow-x:auto;padding:0 16px 10px;scrollbar-width:none}.ctrl::-webkit-scrollbar{display:none}
.ctrl button{flex:none;border:1px solid var(--line);background:transparent;color:var(--sub);border-radius:8px;padding:5px 11px;font:inherit;font-size:12.5px}
.ctrl button.on{background:var(--card2);border-color:var(--card2);color:var(--text)}
.ctrl .sep{flex:none;width:1px;background:var(--line);margin:2px 4px}
main{padding:6px 12px 48px}
h2{font:600 19px/1.3 'ChosunIlboMyungjo',Georgia,serif;margin:16px 4px 2px}
.note{margin:0 4px 10px;color:var(--sub);font-size:12px}
.none{color:var(--sub);margin:24px 4px;text-align:center}
.card{display:block;background:var(--card);border-radius:12px;padding:12px 14px;margin:8px 0;color:var(--text);text-decoration:none;transition:background .15s}
.card:hover{background:var(--card2)}.card:active{opacity:.75}
.meta{color:var(--sub);font-size:12px}
.title{font-weight:500;margin-top:3px}
.orig{color:var(--sub);font-size:12px;margin-top:3px}
.new{margin-left:4px;color:var(--red);font-size:11px;font-weight:700;letter-spacing:.3px}
.hot{display:inline-block;margin-right:6px;padding:0 6px;border-radius:4px;background:rgba(217,119,87,.16);color:var(--acc);font-weight:600}
.hot.big{background:var(--acc);color:#1f1e1d}
.newbar{display:block;width:100%;margin:2px 0 6px;padding:9px;border:0;border-radius:10px;background:rgba(239,68,68,.14);color:#fca5a5;font:inherit;font-size:13px;text-align:left}
.more{display:block;width:100%;margin:4px 0 0;padding:10px;border:1px dashed var(--line);border-radius:12px;background:transparent;color:var(--sub);font:inherit;font-size:13px}
footer{margin:36px 4px 0;padding-top:14px;border-top:1px solid var(--line);color:var(--sub);font-size:12px;line-height:1.7}
footer b{color:var(--text);font-weight:600}
/* 요약 창 */
#dim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:5}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:6;max-width:760px;margin:auto;max-height:82vh;overflow-y:auto;
  background:var(--card);border-radius:16px 16px 0 0;padding:10px 18px calc(18px + env(safe-area-inset-bottom));box-shadow:0 -8px 30px rgba(0,0,0,.4)}
.grab{width:38px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 12px}
.s-title{font-size:17px;font-weight:600;margin:4px 0 2px;line-height:1.45}
.s-label{margin:16px 0 4px;color:var(--acc);font-size:12px;font-weight:700;letter-spacing:.5px}
.s-sum{font-size:15px;line-height:1.75}.s-sum.empty{color:var(--sub);font-size:13.5px}
.s-btns{display:flex;gap:8px;margin-top:20px}
.s-btns a{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;padding:11px 6px;border-radius:10px;font:inherit;font-size:13.5px;line-height:1.3;text-decoration:none;
  background:var(--acc);color:#1f1e1d;font-weight:600}
.s-btns a.cl{background:transparent;border:1px solid var(--acc);color:var(--acc)}
.s-close button{width:100%;margin-top:8px;padding:11px;border-radius:10px;background:transparent;border:1px solid var(--line);color:var(--sub);font:inherit;font-size:14px}
.s-cnote{margin-top:8px;color:var(--sub);font-size:11.5px;text-align:center}
#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);z-index:9;max-width:90%;padding:10px 16px;border-radius:10px;background:#faf9f5;color:#1f1e1d;font-size:13.5px;box-shadow:0 6px 20px rgba(0,0,0,.4)}

"t":"Tesla Is Down 13% in 2026 While the S&P 500 Is Up. Here’s the 1 Catalyst Left This Year That Could Flip That.","su":"올해 테슬라(NASDAQ:TSLA)의 주가 하락은 부분적으로 긍정적인 방향으로 전환될 수 있는 것과 같은 이유 때문입니다. 구체적으로는 전용 로봇택시인 사이버캡(Cybercab)을 포함한 부진한 로봇택시 출시입니다. 간단히 말해서, 출시 시기와 규모에 대한 경영진의 이전 진술은 2026년에 대해 지나치게 낙관적인 것으로 나타났습니다."},{"s":"역사에 따르면 모든 S&P500 하락장은 같은 방식으로 끝났습니다. 패턴은 다음과 같습니다.","so":"Yahoo Finance","tm":"11/15 20:25","c":1,"r":"us","u":"https://finance.yahoo.com/markets/stocks/articles/history-says-every-p-500-112500345.html","p":1794741900,"a":1794784765,"t":"History Says Every S&P 500 Bear Market Has Ended the Same Way. Here's the Pattern.","su":"투자자들은 약세(내리는 흐름)장에서 자신의 포트폴리오에 어떤 혜택을 줄 수 있는지 이해해야 합니다."},{"s":"AI 관련 매도에도 불구하고 기술주는 S&P500 성과의 중심으로 남아 있습니다.","so":"Yahoo Finance UK","tm":"11/15 20:14","c":1,"r":"us","u":"https://uk.finance.yahoo.com/news/technology-stocks-remain-central-p-111400807.html","p":1794741240,"a":1794751311,"t":"Technology Stocks Remain Central to S&P 500 Performance Despite AI-Related Sell-Off","su":"기술주는 인공 지능 관련 주가의 지속적인 하락에도 불구하고 미국 증시의 방향을 결정하는 데 계속해서 중요한 역할을 하고 있으며, 투자자들은 해당 부문의 추가 약세(내리는 흐름)가 S&P500(미국 큰 회사 500곳 지수) 전체에 영향을 미칠 수 있는지 평가하고 있습니다. 기술 및 AI 관련 기업의 한 달 간의 후퇴는 이번 주 S&P500 정보 기술 부문의 큰 폭으로 끝났습니다."},{"s":"월스트리트는 강세장 컨센서스를 바꾸지 않습니다. 우리는 올해 하반기 AI에 대해 낙관적일 뿐만 아니라 S&P 지수도 8,250포인트에 달합니다.","so":"第一财经","tm":"11/15 19:53","c":1,"r":"cn","u":"https://www.yicai.com/news/103262526.html","p":1794740004,"a":1794789706,"t":"华尔街不改牛市共识：下半年不只看多AI，标普最高到8250点","su":"미국 증시는 반도체(전자기기의 두뇌 부품) 주가가 급등하면서 6년 만에 가장 강한 분기를 경험했고, 중소기업도 다른 기업보다 나은 성과를 냈습니다. 올해 상반기, 특히 강력한 2분기를 경험한 월스트리트 기관들은 최근 하반기 미국 주식 강세(오르는 힘이 센 것)장에 대한 합의에 도달했습니다. 그러나 월스트리트 애널리스트들은 이전의 주요 투자 라인인 칩과 인공지능(AI) '삽질주'에 대해서는 여전히 낙관적인 반면, 산업, 의료, 소재, 중소형주 등 더 넓은 부문과 테마도 '만개할' 것이라고 믿고 있다. '강세장 컨센서스'는 하반기에도 변하지 않을 전망이다. 상반기 미국 증시의 성과는 월스트리트가 하반기에도 강세장이 이어질 것이라는 컨센서스를 이끌어낸 것이다."},{"s":"월스트리트는 금리 기대감을 긴급히 높인다! 미국 주식이 연준이 되는 가장 큰 위험은 무엇일까요?","so":"第一财经","tm":"11/15 18:49","c":1,"r":"cn","u":"https://www.yicai.com/news/103437262.html","p":1794736142,"a":1794746280,"t":"华尔街紧急上调利率预期！美股最大风险变成美联储？","su":"최근 인플레이션(물건값이 계속 오르는 것) 보고서가 예상을 뛰어넘으면서 시장은 연준의 정책 경로를 빠르게 재평가하고 있습니다. 반면, 연준의 '과도한 힘' 리스크는 2027년 주식시장에 점점 더 심각한 위협이 되고 있다. 기관들은 집중적인 상향 조정을 단행했다. 뱅크오브아메리카, Citigroup 및 Standard Chartered Bank는 모두 최신 연구 보고서에서 Waller 연준 총재의 발언이 12월에 0.5%포인트(퍼센트끼리 뺀 차이) 금리 인상의 문을 열었다고 경고했습니다. 스탠더드차타드은행의 이코노미스트 스티브 잉글랜더는 \"12월 0.5%포인트 금리 인상 가능성은 우리가 예상했던 것보다 강력하지만 아직 확인되지 않았다\"고 말했다. 이번 주 초, 크리스토퍼 월러 연준 총재는 다음 달 금리를 0.25%포인트 인상하고, 가격 압력이 가속화되면 더 큰 금리 인상을 권고했습니다."},{"s":"미국 연방준비제도(연준)의 금리 인상이 글로벌 채권시장에 영향을 미쳤다. Fidelity International Zhu Lei: 중국 채권 배분 가치는 하락 대신 상승했습니다.","so":"第一财经","tm":"11/15 18:41","c":1,"r":"cn","u":"https://www.yicai.com/news/103373834.html","p":1794735708,"a":1794751313,"t":"美联储加息冲击全球债市，富达国际朱蕾：中国债券配置价值不降反升","su":"지난주 연준은 3년여 만에 처음으로 0.25%포인트(퍼센트끼리 뺀 차이) 금리 인상을 발표해 연방기금 금리 목표 범위를 3.75~4.00%로 높였다. 결의안 발표 이후 미국 채권시장은 '매파적 충격'에서 '신뢰회복'으로 급속히 전환됐다. 현재 미국 10년 만기 국채수익률은 5% 밑으로 떨어졌지만, 후속 추이는 여전히 불분명하다. 선진국 국채가 집단 매도세(팔려는 힘)를 보이면서 중국과 미국 간 금리 역전 현상이 오랫동안 지속됐다. 월요일(9월 21일) 현재 중국 10년만기 국채수익률은 약 1.68%로, 둘 사이의 격차는 여전히 320BP(베이시스포인트)를 넘어섰다. 그렇다면 연준의 변화는 전 세계 주류 채권 자산에 어떤 영향을 미치게 될까요? 중국 채권시장의 매력이 바뀔까? 불확실성 시대에 자금유지에 영향을 미치는 핵심요소는 무엇인가? 최근 위의 뜨거운 주제에 초점을 맞춰 제일재경은 Fidelity International의 아시아 채권 부문 책임자인 Zhu Lei와 단독 인터뷰를 진행했습니다."},{"s":"4년 전에도 긴급 정리해고가 있었어요... 올해는 너무 바빠서 밤을 새웠어요. 월스트리트가 중국 본토에서 돈을 벌었나요?","so":"UDN","tm":"11/15 17:56","c":1,"r":"tw","u":"https://udn.com/news/story/7333/9880076","p":1794732980,"a":1794746286,"t":"4年前急裁員…今年忙到熬通宵 華爾街在大陸賺到錢了嗎？","su":"2022년 11월, 홍콩 모건스탠리의 중국 기업 투자 은행 직원 수십 명이 일시적으로 사무실 46층에 호출돼 동료들이 해고되고 건물에서 나가라는 요청을 받는 모습을 지켜봤다. 당시 일부 외국인 투자자들은 중국을 '투자할 수 없는' 국가로 간주했습니다."},{"s":"[3분증시] 뉴욕증시, CPI 경계감 속 이틀째 약세","so":"연합뉴스TV","tm":"11/15 17:02","c":1,"r":"kr","u":"https://m.yonhapnewstv.co.kr/newsFeed/7356","p":1794729766,"a":1794746279,"su":"<출연 : 권용욱 연합인포맥스 기자> 세계 증시와 우리 증시를 짚어보는 시간 '3분 증시'입니다. 연합인포맥스 권용욱 기자 나와있습니다. 먼저 간밤 미국 증시부터 정리해주시죠. [기자] 네. 간밤 뉴욕 증시는 3대 주가지수가 이틀째 동반 약세를 보였습니다. 유가는 오르고 미국 국채금리(돈을 빌릴 때 내는 이자 비율)는 내리는 엇갈린 흐름이 나타났는데요. 증시는 중요한 물가(물건값 전체의 수준) 지표 발표를 기다리며 조정을 이어갔습니다. 마감가를 살펴보면 다우지수는 전장보다"},{"s":"스테이트 스트리트, 유럽 증시 상승세의 픽텟 콜타임","so":"Bloomberg.com","tm":"11/15 17:00","c":1,"r":"us","u":"https://www.bloomberg.com/news/articles/2026-11-15/state-street-pictet-call-time-on-europe-s-stock-market-rally","p":1794729600,"a":1794751311,"t":"State Street, Pictet Call Time on Europe’s Stock Market Rally"},{"s":"연준의 금리 인상 폭풍이 다가오고 있습니다! 기술주는 추세를 거스르고 노무라 급등 : 이것은 아마도 반등의 환상 일 것입니다 - 국제","so":"工商時報","tm":"11/15 16:37","c":1,"r":"tw","u":"https://www.ctee.com.tw/news/20261115700519-430702","p":1794728220,"a":1794728505,"t":"聯準會升息風暴殺到！科技股竟逆勢狂飆野村：這恐怕只是反彈假象- 國際","su":"최근 미국 국채수익률(넣은 돈에 비해 얻는 이익 비율)이 큰 폭으로 올랐지만, 기술주와 신용채권도 강하게 반등했다. '주식과 채권이 동시에 상승'하는 보기 드문 현상이 발생했다. 당초 고금리(돈을 빌릴 때 내는 이자 비율)의 최대 피해자로 여겨졌던 기술주는 금리 인상에 대한 시장 기대가 크게 높아지면서 추세를 거스르고 상승했다. 투자자들은 이번 반등이 AI 투자 신뢰의 회복을 의미하는지, 아니면 이전 좌절 이후의 단순한 기술적 수리인지 의문을 제기하기 시작했습니다. '월스트리트 인사이트'는 노무라증권 전략가 나카의 말을 인용했다."},{"s":"월스트리트, 스페이스X의 첫 실적 보고서 미리보기: 성과 외에도 향후 지침이 더 중요","so":"财联社","tm":"11/15 15:56","c":1,"r":"cn","u":"https://www.cls.cn/detail/2445335","p":1794725784,"a":1794784769,"t":"华尔街前瞻SpaceX首份财报：业绩之外更看重未来指引","su":"①스페이스X는 베이징 시간으로 수요일 이른 아침에 2분기 재무 운영 결과를 발표할 예정입니다. 현재 주가는 114.53달러로 발행가보다 15% 낮고, 시가총액(회사 전체 몸값)은 1조5000억 달러를 조금 넘는다. ②시장과 분석가들이 가장 주목하게 될 것은 인공지능, 스타링크, 로켓 발사 사업의 진행 상황에 대한 스페이스X 경영진의 최근 성명이 될 것이다. 차이롄서, 8월 4일(자오 하오 편집자) 스페이스X의 기업공개(IPO) 이후 첫 번째 실적(회사가 번 돈 성적표) 보고서는 올 여름 월스트리트에서 가장 주목받는 이벤트 중 하나가 될 것입니다. 그러나 이 성적표가 투자자들이 하락하는 주식을 다시 사들이기에 충분한지 여부는 아직 알려지지 않았습니다. 스페이스X의 공식 성명에 따르면 회사는 수요일 베이징 시간 오전 4시 이후(미국 증시가 화요일 마감 후) 2분기 재무 및 운영 결과를 발표할 예정입니다. 수요일 베이징 시간 오전 4시 30분에는 공연에 대한 온라인 음성 생방송을 진행한다."},{"s":"우리 아이의 첫 종잣돈에는 무엇을 사야 할까요? KGI증권, 대만 미국 주식 상위 5개 인기주 공개","so":"TVBS","tm":"11/15 14:24","c":1,"r":"tw","u":"https://tech.tvbs.com.tw/money/4050848","p":1794720240,"a":1794728507,"t":"準備孩子第一桶金該買什麼？凱基證券揭台美股熱門前5名標的","su":"아이의 첫 번째 종잣돈를 준비할 때, 어디서부터 시작해야 합니까? KGI증권은 지난 9월 대만과 미국 주식의 미성년자 인기 대상 TOP 5를 발표했다. 대만 주식에서는 Yuanta Taiwan 50(0050)이 1위를 차지했고, S&P500(미국 큰 회사 500곳 지수) 지수를 추적하는 Vanguard S&P500 Index ETF(VOO)는 미국 주식에서 1위를 차지했습니다. 목록을 더 자세히 살펴보면 대만과 미국에서 가장 인기 있는 상위 5개 주식은 모두 ETF가 지배하고 있으며 ETF도 안정적인 첫 번째 선택입니다. 대만 주식 시가 총액 유형, 높은 주식..."},{"s":"[모닝포스트] 미국 칩주 급락; 중국 컨셉주는 추세를 거스르고 강세를 보였습니다. 원유는 급등했고 금은 상승 마감했습니다. A주 자사주 매입의 또 다른 물결이 다가오고 있습니다","so":"财联社","tm":"11/15 14:11","c":1,"r":"cn","u":"https://www.cls.cn/detail/2450678","p":1794719513,"a":1794784773,"t":"【早报】美股芯片股大跌；中概股逆势走强；原油飙升、黄金收涨；A股又一波回购潮来了","su":"① '중국 인민은행의 '15차 5개년 계획' 개혁 발전 계획' 발표 ② A주 자사주 재매입 물결이 오고 있다 ③ 미국 광통신주 폭락과 스토리지주 엇갈림 ④ 한국이 반도체(전자기기의 두뇌 부품) 소재·부품·장비 분야 투자에 집중해 35억 달러 이상의 펀드를 조성할 예정 ⑤ 스토리지 선두주자의 상반기 순이익(모든 비용을 빼고 남은 돈)이 100억 달러를 넘어섰다. 매크로 뉴스 1. 국가발전개혁위원회와 국가에너지국은 '석탄산업 발전을 위한 15차 5개년 계획'을 발표했습니다. 2030년까지 석탄 순익 보장 능력을 더욱 강화하고 생산 및 개발 레이아웃을 지속적으로 최적화하며 고품질 선진 생산 능력 비율을 더욱 높이고 생산, 공급, 저장 및 마케팅 시스템을 더욱 완벽하게 하고 전국 대규모 현대 탄광 생산 능력 비율을 87%로 늘릴 것이라고 지적했습니다. 2. 중앙은행은 최근 '중국인민은행의 '15차 5개년 계획' 개혁 발전 계획'을 발표하고 관련 부문에서 9개 행동 계획을 수립, 발표했다. 과학적이고 건전한 통화정책체계와 종합적인 거시건전성 관리체계를 구축해야 한다고 언급했습니다. 실물 경제에 대한 금융 서비스의 품질과 효율성을 지속적으로 향상합니다. 개방적이고 포용적이며 역동적이고 탄력적인 현대 금융시장을 지속적으로 구축합니다. 외부 세계에 대한 높은 수준의 금융 개방을 꾸준히 추진합니다. 금융 인프라와 중앙은행 서비스 시스템을 최적화합니다."},{"s":"AI 투자 붐이 풀리면서 데이터 센터 건설 주식은 4조 2천억 달러 손실","so":"Financial Times","tm":"11/15 14:00","c":1,"r":"world","u":"https://www.ft.com/content/d5adde7e-68cc-455b-ba78-b39cc3676b7a?syn-25a6b1a6=1","p":1794718804,"a":1794727059,"t":"Data centre construction stocks lose $4.2tn as boom in AI trade unravels"},{"s":"연준의 매파적인 신호로 인해 국제 금 가격이 다시 4,000달러 아래로 떨어졌습니다.","so":"自由時報","tm":"11/15 13:15","c":1,"r":"tw","u":"https://stock.ltn.com.tw/article/a6hsbk29bnx6","p":1794716140,"a":1794727053,"t":"Fed鷹派訊號發威 國際金價再度跌破4000美元關卡","su":"나쁜 소식의 연속! 미국의 계속되는 높은 인플레이션(물건값이 계속 오르는 것) 데이터와 연준 관리들이 발표하는 연속적인 매파적(금리를 올리자는 쪽) 신호의 영향으로 국제 금 가격은 심한 매도 압력에 부딪혔고 다시 한번 주요 심리적 수준인 온스당 미화 4,000달러 아래로 떨어졌습니다. 최신 금 동향 차트에 따르면 금값은 11월 10일 기준 여전히 4,100달러를 넘어 높은 수준에서 등락하며 최고치인 약 4,140달러에 도달했다. 그러나 11월 12일부터 매도 압력이 나타나기 시작했으며 공식적으로는 4,000달러 아래로 떨어졌습니다."},{"s":"암호화폐는 전반적으로 급락했으며 330,000명 이상의 사람들이 포지션을 청산했습니다! 연준, 금리 인상 큰 소식","so":"21财经","tm":"11/15 12:47","c":1,"r":"cn","u":"https://www.21jingji.com/article/20261115/herald/647531e1613e10476a8bf7231012e1ba.html","p":1794714473,"a":1794746281,"t":"加密货币全线暴跌，超33万人爆仓！美联储，加息大消息","su":"암호화폐는 전반적으로 급락했습니다. 보도 시간 현재 비트코인은 거의 8%, 이더리움은 10%, 도지코인은 12%, SOL과 HYPE는 11%, XRP와 BNB는 9%, ZEC는 8% 이상 하락했습니다. 코인글래스(CoinGlass) 통계에 따르면 지난 24시간 동안 전 세계적으로 총 336,900명이 포지션을 청산했으며 청산 금액은 미화 21억 달러를 넘었다. 그 중 90% 이상의 포지션이 매수 주문으로 인해 청산되었습니다. 최근 몇 주 동안 암호화폐는 미국의 금리(돈을 빌릴 때 내는 이자 비율)가 오랫동안 높은 수준으로 유지될 것이라는 시장의 기대, 미국 현물 비트코인 ​​ETF(여러 주식을 묶어 파는 상품) 자금의 상당한 유출, 인공 지능 개념 주식에 대한 열풍의 냉각으로 인한 위험 회피, 그리고 그에 따른 바이낸스의 60억 달러 이상의 도난에 따른 영향 등 다양한 요인으로 인해 계속 압박을 받고 있습니다. 데이터에 따르면 10월 30일부터 11월 13일까지 미국 상장 현물 비트코인 ​​ETF는 거의 미화 30억 달러에 달하는 순유출을 기록했습니다."},{"s":"FBI와 의회가 개입합니다! 젠슨 황이 돌아갈 수 없다고 확신하시나요? \"트럼프가 엔비디아 인수할 쿡 직접 뽑을 가능성 밝힐 것\" 월스트리트 전문가들은 읽은 뒤 냉랭한 4마디 반응 - 국제투데이","so":"旺得富理財網","tm":"11/15 12:08","c":1,"r":"tw","u":"https://wantrich.chinatimes.com/news/20261115900070-420201","p":1794712094,"a":1794727057,"t":"FBI、國會重手介入！黃仁勳確定回不去了？「川普欽點庫克接掌輝達機率曝」華爾街專家看完也冷回4字 - 國際","su":"AI 칩 분야의 선두주자 엔비디아가 최근 기술업계에 충격폭탄을 보냈다. 창립자 젠슨 황은 11월 12일 공식적으로 CEO, 사장 및 이사직에서 물러났습니다. 이러한 움직임은 자본 시장에 파장을 일으켰을 뿐만 아니라 전 세계 직원, 주주 및 기술 리더들이 공개적으로 지지 서명을 하기 위해 \"Stand with Jensen(Support 젠슨 황)\"을 시작하도록 촉발했습니다. 그러나 국가 안보 조사에 대한 압박과 이사회의 지배 구조에 직면하여 예측 시장은 젠슨 황의 짧은..."},{"s":"미국 주식 팁丨통화를 보유하고 기다려 보세요! 통화기금 순유입 6년 만에 최고치, 반등 어디까지 갈까?","so":"第一财经","tm":"11/15 11:37","c":1,"r":"cn","u":"https://www.yicai.com/news/103388790.html","p":1794710266,"a":1794746283,"t":"美股点金丨持币观望！货币基金净流入创六年新高，反弹能走多远","su":"미국 증시는 처음에는 하락했다가 이번 주에 상승했으며, 미국 채권 수익률(넣은 돈에 비해 얻는 이익 비율)은 계속해서 높은 수준을 유지했습니다. 9월 연방공개시장위원회(FOMC) 회의록은 매파적인 신호를 내놨다. 늦은 거래에서 기술주의 안정화는 3대 주요 주가지수가 주중 손실을 회복하는 데 도움이 되었습니다. 그러나 자본 흐름이 다시 조심스러워졌고, 위험 회피로 인해 자금 펀드 매수가 늘어났습니다. 미국 주식의 새로운 실적 시즌이 다음 주에 시작될 예정이며, 인공지능의 성과 향상이 위험 선호도에 영향을 미칠 수 있습니다. 동시에, 중동 상황과 미국 채권 수익률 추세는 계속해서 투자자들의 신경을 불안하게 할 것입니다. 가격 압박은 무시할 수 없습니다. 이번 주에 발표된 주요 데이터는 가격 압력이 여전히 높은 가운데 경제의 회복력을 계속해서 보여줍니다. 미국 ISM 서비스 PMI는 9월 54.9를 기록하며 2개월 연속 상승세(오르는 흐름)를 이어갔다. 그러나 이 지수는 27개월 연속 50 호황-불황선을 넘어섰으며, 이는 서비스 기업 활동이 지속적으로 확대되고 있음을 나타냅니다. ISM 서비스 물가지수는 72.6에서 74.0으로 상승해 2022년 7월 이후 최고치를 기록했고, 112개월 연속 상승세를 이어갔다."},{"s":"미국 주식에 대한 팁 | 엔비디아는 AI 분야를 혼란의 시기로 몰아넣었다. 다음 주 세 가지 주요 위험 사건이 미국 주식을 어떻게 움직일 것인가?","so":"第一财经","tm":"11/15 11:04","c":1,"r":"cn","u":"https://www.yicai.com/news/103440906.html","p":1794708266,"a":1794730716,"t":"美股点金丨英伟达将AI板块带入迷茫期，下周三大风险事件如何搅动美股？","su":"젠슨 황이 엔비디아 CEO 사임을 발표하면서 AI 분야는 변동을 겪었습니다. 그러나 미국 3대 주가지수는 여전히 전반적으로 반등했다. 나스닥 종합지수와 S&P500(미국 큰 회사 500곳 지수) 지수는 모두 4주 연속 하락세를 마감했습니다. 다음 주에 시장은 연준 회의록과 엔비디아의 실적 발표를 발표할 것입니다. 한편, 인공지능 기업 앤트로픽의 기업공개(IPO)는 기존 인공지능 대기업에 대한 투자자의 관심을 테스트할 수도 있습니다. 연준의 금리 인상에 대한 기대도 높아졌다. 이번 주에 발표된 데이터에 따르면 10월 소비자물가(가게에서 사는 물건값 수준)지수(CPI) 증가율은 둔화되었지만 여전히 월스트리트 예측을 초과했습니다. 동시에, 10월 미국 생산자 물가(PPI)의 연간 상승률은 에너지 비용이 치솟는 가운데 거의 4년 만에 최고 수준에 도달했습니다."},{"s":"이번 주 대만 주식/시장은 평정심을 되찾고 미국 주식을 주시했습니다. 외국인 투자자들이 그들에게 감성적 가치를 부여할 것인가?","so":"聯合報數位版","tm":"11/15 11:00","c":1,"r":"tw","u":"https://vip.udn.com/vip/story/121938/9878874?from=vipudn_newfirstscreen_index","p":1794708000,"a":1794713924,"t":"本周台股／大盤回神緊盯美股臉色 外資會給情緒價值？","su":"미국 증시 하락세에서 반등(내렸다가 다시 오르는 것)하고 국가안보기금(National Security Fund)의 시장 보호를 위한 10번째 시장 진입, 금융감독위원회의 단기 제한 조치 등 복합적인 영향으로 대만 증시는 지난주 5거래일 중 4거래일 동안 상승해 누적 상승폭이 3,973.48포인트로 10% 이상 상승했다. 이번주 대만 증시를 보면 외국인 투자자들이 11월 13일 11거래일 연속 과매도를 중단하고 288억 3700만대만달러 정도 과매수로 전환한 것으로 법인은 추정하고 있다. 계속해서 포지션을 늘려갈 수 있고, 투자신뢰의 모멘텀(값이 움직이는 기세)이 지속될 수 있을까? 아니면 식히려고? 대만 주식의 성과에 영향을 미치는 열쇠가 될 것입니다."},{"s":"인터넷 증권, 개인 투자자를 미국 주식에 초대 앤트로픽 기업공개(IPO)는 23시간 거래 전초전","so":"日本経済新聞","tm":"11/15 11:00","c":1,"r":"jp","u":"https://www.nikkei.com/article/DGXZQOUB126UT0S6A111C2000000/","p":1794708000,"a":1794713925,"t":"ネット証券、個人投資家を米国株へ誘う アンソロピックIPOは23時間取引の前哨戦","su":"인터넷 증권이 미국 앤트로픽의 신규 주식 공개(IPO)를 계 아갈 것이다. 지난주도 그랬지만, 세계는 엔비디아의 반도체를 필요로 할 것이다. 엔비디아가 세계의 톱에 올라간 이유의 대부분은 카리스마적인 창업자인 젠슨 황씨에 의한 것이다. 후안씨가 생성 인공지능(AI)의 경이적인 대두에 큰 영향을 준 것에 이의를 제기할 자는 없다. 대규모 언어 모델(LLM)은 컴퓨팅…"},{"s":"굿모닝 월드》미국 10월 도매 인플레이션은 4년 만에 최고치를 기록했으며 시장은 연준이 12월 금리를 인상할 것으로 예상하고 있습니다 | 삶","so":"中央社 CNA","tm":"11/15 08:26","c":1,"r":"tw","u":"https://www.cna.com.tw/news/ahel/202611155001.aspx","p":1794698760,"a":1794727059,"t":"早安世界》美10月躉售通膨創4年來新高市場押注聯準會12月升息| 生活","su":"최근 미국 경제지표에 따르면 10월 도매인플레이션(물건값이 계속 오르는 것) 연간 증가율은 6.5%로 4년 만에 최고치를 기록했다. 월간 증가율은 9월 1.4%보다 낮아진 수준으로 크게 둔화됐지만 식료품 가격이 급등했고, 미-이란 전쟁으로 에너지 비용이 늘어나 인플레이션 냉각 경로에 변수가 추가됐고, 연준의 12월 금리(돈을 빌릴 때 내는 이자 비율) 인상에 대한 시장 기대감도 깊어졌다."},{"s":"그는 자신의 200,000달러 S&P500 401(k)가 AI 위험을 확산시킨다고 생각합니다. 두 개의 알파벳 주식 클래스가 한 회사에 $10,380를 투자했습니다. 20% 하락하면 $2,076의 비용이 발생할 수 있습니다.","so":"Yahoo Finance","tm":"11/15 08:03","c":1,"r":"us","u":"https://finance.yahoo.com/markets/stocks/articles/thinks-200-000-p-500-230346273.html","p":1794697426,"a":1794702376,"t":"He Thinks His $200,000 S&P 500 401(k) Spreads His AI Risk. Two Alphabet Share Classes Put $10,380 in One Company. A 20% Drop Could Cost Him $2,076","su":"그는 단일 AI 승자에 대한 베팅을 피하기 위해 S&P500(미국 큰 회사 500곳 지수) 인덱스 펀드를 구입했습니다. 펀드가 보유 자산을 나열하는 방식의 한 가지 특이한 점은 그가 생각하는 것보다 한 회사에서 훨씬 더 많은 위험을 안고 있을 수 있다는 것을 의미합니다."},{"s":"게임업계의 '슈퍼 머니 인쇄기'가 다음 주에 신제품을 출시합니다! \"GTA VI\"가 월스트리트에 영향을 미치는 이유는 무엇입니까?","so":"财联社","tm":"11/15 05:58","c":1,"r":"cn","u":"https://www.cls.cn/detail/2534581","p":1794689926,"a":1794713921,"t":"游戏业“超级印钞机”下周上新！《GTA VI》缘何牵动华尔街？","su":"① 'GTA VI'는 11월 19일 출시 예정이다. 기관에서는 사전 판매량이 1,200만 장을 넘었고, 전작의 누적 판매량은 2억 3,500만 장에 육박할 것으로 기관 추정하고 있다. ② 많은 월스트리트 기관들은 새로운 게임이 온라인 운영과 지속적인 지불을 통해 수년 동안 테이크투의 이익 성장을 견인할 수 있는지 주목하면서 강세(오르는 힘이 센 것) 등급을 유지합니다. 파이낸셜뉴스가 11월 15일 보도했다(시정청 편집장) 누적 판매량이 2억 3500만 장에 육박하는 등 13년 연속 베스트셀러 자리를 지키고 있는 게임이 다음 주 속편 출시를 앞두고 있다. 월스트리트의 경우 이 제안은 다음과 같은 기대를 담고 있습니다. 수년 동안 수익을 창출해 온 기업이 새로운 수익 성장 주기를 시작할 수 있습니까? 다음주 목요일, 'Grand Theft Auto VI'(이하 'GTA VI')가 전 세계적으로 공식 출시됩니다."},{"s":"월스트리트는 메인 스트리트와 연락이 끊겼다 / 레지나 입 - 20261115 - 작가칼럼","so":"明報新聞網","tm":"11/15 05:30","c":1,"r":"hk","u":"https://news.mingpao.com/pns/%E4%BD%9C%E5%AE%B6%E5%B0%88%E6%AC%84/article/20261115/s00018/1794671493938/%E8%8F%AF%E7%88%BE%E8%A1%97%E8%88%87%E5%A4%A7%E8%A1%97%E8%84%AB%E7%AF%80","p":1794688200,"a":1794698048,"t":"華爾街與大街脫節 / 葉劉淑儀 - 20261115 - 作家專欄"},{"s":"엔비디아의 CEO로 젠슨 황의 복귀를 지원하십시오. 테슬라 CEO 머스크도 청원에 동참 | 미국 주식 뉴스 | 국제적인","so":"經濟日報","tm":"11/15 03:05","c":1,"r":"tw","u":"https://money.udn.com/money/story/123398/9879202","p":1794679531,"a":1794746287,"t":"挺黃仁勳回任輝達 CEO 特斯拉執行長馬斯克也加入連署 | 美股動態 | 國際","su":"경제일보 Liu Zhongyong 작성/외신 종합 뉴스 테슬라 CEO 머스크와 엔비디아 직원 및 주주들은 젠슨 황이 엔비디아 CEO로 복귀할 것을 요구하는 청원에 동참했습니다. '젠슨과 함께하라(Stand with Jensen)'라는 제목의 청원은 보도 당시 약 9만 명의 서명을 받았다. 공동 서명 웹사이트에 나열된 서명자에는 현재 엔비디아 직원 4,800명과 기존 주주 47,000명이 포함됩니다. 다른 잘 알려진 서명자로는 유명한 월스트리트 황소인 Fundstrat의 Tom Lee와 Shopify의 CEO인 Tobi Lutke가 있습니다. 머스크는 공개 서한에서 젠슨 황이 엔비디아를 구축하는 데 33년을 투자했으며 그의 리더십과 공헌이 갑자기 교체되기보다는 공정한 대우와 적법한 절차를 밟아야 한다고 믿었음을 확인했습니다. 공동 서명자들은 또한 젠슨 황이 교체되기 전에 상당한 적법 절차 보장을 받지 못했다는 점에 의문을 제기했으며, 사건에 연루된 여성이 스파이라는 것을 증명할 증거를 아무도 그들에게 제공하지 않았다고 말했습니다."},{"s":"연준 관계자들이 매파적인 발언을 하고 물가가 오르고 시장은 두 달 연속 금리 인상 여부를 논의 중이다.","so":"經濟日報","tm":"11/15 02:26","c":1,"r":"tw","u":"https://money.udn.com/money/story/5599/9879219","p":1794677188,"a":1794698046,"t":"Fed 官員發表鷹派談話、通膨升溫 恐連兩月升息市場熱議","su":"지난주 연준 관계자들의 매파적(금리를 올리자는 쪽) 발언과 미국 인플레이션(물건값이 계속 오르는 것)의 지속적인 상승으로 인해 12월 금리 인상에 대한 시장의 기대가 더욱 확고해졌습니다. 내년 1월 금리를 다시 인상할지 여부에 관심이 쏠렸다. 연준이 두 차례 연속 금리를 인상한다면 2023년 이후 처음이다."},{"s":"예측: 이 소형 가치 ETF는 향후 10년 동안 S&P500을 능가할 것입니다","so":"Yahoo Finance","tm":"11/15 00:50","c":1,"r":"us","u":"https://finance.yahoo.com/markets/stocks/articles/prediction-small-cap-value-etf-155000875.html","p":1794671400,"a":1794698043,"t":"Prediction: This Small-Cap Value ETF Will Beat the S&P 500 Over the Next 10 Years","su":"대부분의 투자자들은 인공지능 주식이 2022년 약세(내리는 흐름)장 이후 광범위한 시장 상승의 대부분을 담당하고 있다는 것을 알고 있습니다. 그다지 분명하지 않은 것은 이러한 강력한 성과의 대부분이 대형주에 의해 주도되었다는 것입니다."},{"s":"뉴욕증시, 반도체 약세ㆍ사우디 피격","so":"이투데이","tm":"11/15 00:33","c":1,"r":"kr","u":"https://m.etoday.co.kr/view_photo.php?idxno=2634887&seq=1","p":1794670395,"a":1794751311,"su":"뉴욕증시, 반도체(전자기기의 두뇌 부품) 약세ㆍ사우디 피격 속 혼조 마감⋯나스닥(미국 기술 회사들이 많은 주식시장) 0.44%↓[종합] 관련 이미지 원본을 이투데이에서 확인하세요"},{"s":"미국 증시는 부정적인 소식이 엇갈리고 변수도 늘어나고 있다 | 펀드월드 | 재무 관리","so":"經濟日報","tm":"11/15 00:13","c":1,"r":"tw","u":"https://money.udn.com/money/story/5618/9878950","p":1794669205,"a":1794698047,"t":"美股多項利空交雜 變數增加 | 基金天地 | 理財","su":"트럼프 미국 대통령은 이란 분쟁이 종식될 긍정적인 신호를 보았다고 주장했습니다. 미군이 이란을 다시 공격할 가능성은 낮고, 미-이란 핵협상도 진전을 이뤘다. 그러나 엔비디아 창립자 젠슨 황이 사임했고 시장은 후임 팀에 대해 관망하고 있었습니다. 규제에 대한 우려가 높아지면서 일부 미국 주식의 상승폭은 제한되었습니다. 그러나 주간 수익률(넣은 돈에 비해 얻는 이익 비율)이 10% 이상인 미국 주식 관련 ETF(여러 주식을 묶어 파는 상품)는 여전히 3개 이상이었다."},{"s":"미국 증시 마감: PCE 인플레이션은 예상을 소폭 상회했고, 3대 주요 지수는 소폭 하락세로 마감했으며, 시장은 더 많은 정책 신호를 기다리고 있었습니다.","so":"财联社","tm":"11/14 23:09","c":1,"r":"cn","u":"https://www.cls.cn/detail/2465573","p":1794665358,"a":1794727046,"t":"美股收盘：PCE通胀略超预期 三大指数小幅收跌 市场静待更多政策信号","su":"①애플의 가을 컨퍼런스가 9월 10일 이른 아침에 예정되어 있습니다. ②췌장암 치료는 획기적인 발전을 이루었고 미국 FDA는 레볼루션(Revolution) 신약을 승인했습니다. ③앤트로픽은 AI 컴퓨팅 능력을 확보하기 위해 450억 달러를 지출한 것으로 보고되었습니다. 차이롄서, 8월 27일(편집자 Niu Zhanlin) 수요일 동부 표준시 기준으로 미국 3대 주가 지수는 소폭 하락세로 마감했습니다. 최근 미국 PCE 인플레이션(물건값이 계속 오르는 것) 데이터는 예상보다 약간 높았습니다. 동시에 많은 투자자들은 AI 분야의 벤치마크인 엔비디아가 실적 보고서를 발표하기 전에 지켜보는 쪽을 선택했습니다. 미국 상무부가 발표한 자료에 따르면 7월 PCE는 전년 동기 대비 3.7% 상승해 시장 예상치를 소폭 웃돌았으며 핵심 PCE는 3.3% 상승한 것으로 나타났습니다. 7월 PCE 물가(물건값 전체의 수준)지수는 전월대비 0.2% 상승해 예상치 0.1%보다 높았다. 핵심 PCE도 6월의 0.1% 증가에 비해 전월 대비 0.2% 증가했습니다."},{"s":"연준의 '3연속 인상'이 올까? \"제3의 지휘자\"는 매파적이다: 인플레이션이 여전히 너무 높고 추가 조치가 필요하다","so":"财联社","tm":"11/14 23:08","c":1,"r":"cn","u":"https://www.cls.cn/detail/2533375","p":1794665290,"a":1794698045,"t":"美联储“三连加”要来了？“三把手”放鹰：通胀仍过高，须进一步行动","su":"① 연준의 \"세 번째 지도자\"인 윌리엄스는 목요일에 미국의 인플레이션(물건값이 계속 오르는 것)이 여전히 높으며 정책 입안자들은 가격 압력을 억제하기 위해 추가 조치를 취해야 한다고 말했습니다. ②연준 관계자들은 이번 주에 집중적으로 매파적인 신호를 발표해 왔습니다. ③현재 금리선물에 따르면 투자자들은 연준이 12월, 1월, 3월에 열리는 다음 세 회의에서 각각 금리를 0.25%포인트(퍼센트끼리 뺀 차이) 인상할 것으로 예상하고 있습니다. 차이롄서, 11월 13일(편집자 Bian Chun) 현지 시간으로 목요일, 연준의 \"제3인자\"이자 뉴욕 연준 총재인 존 윌리엄스는 미국의 인플레이션이 여전히 높으며 정책 입안자들은 가격 압력을 억제하기 위해 추가 조치를 취해야 한다고 말했습니다. 윌리엄스는 목요일 밤 뉴욕에서 열린 한 행사에서 \"인플레이션이 너무 높으며 최신 데이터에 따르면 인플레이션이 여전히 높은 것으로 나타났습니다\"라고 말했습니다. \"시간이 지남에 따라 인플레이션이 시기적절하고 지속적인 방식으로 2% 목표로 돌아갈 수 있도록 조치를 취해야 합니다.\" 윌리엄스는 또한 연준이 \"완전 고용 임무에 불필요한 피해가 발생하지 않도록 해야 한다\"고 말했습니다. 그는 또한 전반적으로 경제가 불균형한 것으로 보이지는 않는다고 말했습니다."},{"s":"의견: 2027년 S&P500을 이기기 위해 이 성장주를 구입하세요","so":"Yahoo Finance","tm":"11/14 22:35","c":1,"r":"us","u":"https://finance.yahoo.com/markets/stocks/articles/opinion-buy-growth-stock-beat-133502592.html","p":1794663302,"a":1794698043,"t":"Opinion: Buy This Growth Stock to Beat the S&P 500 in 2027","su":"이 인공 지능 클라우드 주식은 내년에 시장을 압도하는 수익을 얻을 수 있는 티켓이 될 수 있습니다."},{"s":"다음 주에 큰 일이 일어날 거예요! \"세 가지 주요 초점\"이 미국 주식 추세에 영향을 미칩니다 - 국제","so":"工商時報","tm":"11/14 22:20","c":1,"r":"tw","u":"https://www.ctee.com.tw/news/20261114700716-430701","p":1794662400,"a":1794664778,"t":"下周大事不斷！「三大焦點」牽動美股走勢- 國際","su":"미국 증시가 엔비디아 폭풍으로 인한 혼란을 경험한 후, 시장은 엔비디아의 실적(회사가 번 돈 성적표) 보고서에 초점을 맞춰 젠슨 황 이후 시대의 비즈니스 전망과 잠재적인 후계자를 관찰할 것입니다. 다른 초점으로는 앤트로픽의 상장(주식시장에 처음 들어오는 것)과 APEC 회의가 있는데, 이는 미국 주식 추세에 영향을 미칠 것으로 예상됩니다. 다음주에도 국제행사가 계속됩니다. 엔비디아는 17일 미국 증시가 마감된 후 실적 보고서를 발표할 예정이다. 시장에서는 수익이 1,090억 달러에 달하고 이익이 90% 증가할 것으로 예상합니다. 엔비디아 창립자 젠슨 황이 최근 스캔들에 연루되었습니다."},{"s":"엔비디아의 주식 하락은 '딥 매수'에 대한 유혹적인 사례를 만들었습니다.","so":"Bloomberg.com","tm":"11/14 22:01","c":1,"r":"us","u":"https://www.bloomberg.com/news/newsletters/2026-11-14/nvidia-s-stock-drop-made-a-tempting-case-to-buy-the-dip","p":1794661261,"a":1794698044,"t":"Nvidia’s Stock Drop Made a Tempting Case to ‘Buy the Dip’"},{"s":"S&P500 및 HKEX Tech 100 지수 소개: 기술 중심의 보완적인 혼합","so":"S&P Global","tm":"11/14 21:32","c":1,"r":"us","u":"https://www.spglobal.com/spdji/en/blog/article/introducing-the-sp-500-hkex-tech-100-index-a-complementary-tech-focused-blend/","p":1794659565,"a":1794664774,"t":"Introducing the S&P 500 & HKEX Tech 100 uters","tm":"11/14 13:59","c":1,"r":"us","u":"https://www.reuters.com/world/china/global-markets-global-markets-2026-11-13/","p":1794632376,"a":1794713920,"t":"Stocks mostly ease with tech, Nvidia concerns; airline shares fall late in session"}]},{"name":"🧬 나스닥 바이오","note":"보유: TIGER 미국나스닥바이오","breaking":false,"items":[{"s":"12가지 새로운 유형의 약물이 추가되어 2026년 상업 건강 보험 혁신 약물 카탈로그에 총 28가지 유형이 추가되었습니다.","so":"Jiemian.com","tm":"11/14 11:43","c":4,"r":"cn","u":"https://www.jiemian.com/article/15333030.html","p":1794624194,"a":1794628691,"t":"新增12种药品，2026年商业健康保险创新药品目录共有28种","su":"국민의료보험청 관계자는 11월 14일 2026년 시행 예정인 상업건강보험 혁신의약품 목록 조정에 12개 신약이 추가된다고 밝혔다. 상업 건강 보험 혁신 약물 카탈로그의 새 버전에는 세계 최초의 고형 종양 CAR-T, 중국 최초의 혈우병 유전자 치료 약물 및 기타 주요 혁신 약물이 포함됩니다. 이와 동시에 상업 보험 혁신 의약품 목록과 기본 의료 보험 목록 간의 연계 메커니즘을 구축했으며 2025년 상업 보험 혁신 의약품 2종을 의료 보험 목록에 포함했습니다. 조정을 거쳐 2026년 상업건강보험에는 총 28종의 혁신의약품이 포함될 예정이다."},{"s":"상업보험 혁신의약품 카탈로그에 12개 신약 신규 추가, 가격협상 성공률 100%","so":"经济观察网","tm":"11/14 13:39","c":3,"r":"cn","u":"http://www.eeo.com.cn/2026/1114/1092864.shtml","p":1794631140,"a":1794642669,"t":"12款药新入商保创新药目录，价格协商成功率100%","su":"경제 관찰자 팔로우 2026-11-14 12:39 경제 관찰자 기자 Liu Xiaonuo 11월 14일, 2026년 국가 의료 보험 약품 목록과 상업 보험 혁신 약품 목록이 소주에서 발표되었습니다. 국민의료보험청 약품서비스관리국 황신위 국장은 현장에서 11개 기업의 12개 혁신의약품이 상업적으로 보장되는 혁신의약품 목록에 포함됐다고 발표했다. 2026년 9월 경제옵저버는 상업보험 혁신의약품 카탈로그 현장에서 이번에 가격협상에 총 11개사, 12개 의약품이 참여했다는 사실을 알게 됐다. 이는 상업적으로 보장되는 혁신적인 의약품 카탈로그의 가격 협상에 참여하는 모든 의약품이 카탈로그에 성공적으로 포함되었음을 나타냅니다. 2025년에 국민의료보험청은 처음으로 상업적으로 보장되는 혁신의약품 목록에 대한 가격 협상을 시작했습니다. 정식심사를 통과한 의약품은 총 121개이며, 특별협상에는 24개 의약품이 참여했다. 결국 19개 의약품이 성공적으로 협상돼 약 80%의 성공률을 보였다(1개 의약품은 이후 시장에서 퇴출됐다). 2026년에는 신청 건수가 감소할 예정이다. 총 62개 의약품이 상업 보험 혁신 의약품 목록에 제출되었으며, 그 중 58개가 정식 검토를 통과했다. 하지만 결국 협상 성공률은 100%로 높아졌다."},{"s":"새로운 최고 기록 달성, 51종의 1급 신약이 새 버전의 국민의료보험 의약품 목록에 등재되었습니다.","so":"第一财经","tm":"11/14 11:50","c":3,"r":"cn","u":"https://www.yicai.com/news/103440686.html","p":1794624638,"a":1794628689,"t":"再创新高，51个一类新药进入新版国家医保药品目录","su":"국민의료보험청과 인사사회보장부는 오늘(14일) '국민기본의료보험·모성보험·산재보험 의약품 카탈로그'와 '상업건강보험 혁신 의약품 카탈로그'(2026)를 공개했다. 국민의료보험청 출범 이후 국민기본의료보험 약품목록의 9번째 조정이다. 이번 조정에는 총 107개 신약이 추가됐으며, 이 중 카테고리 1 혁신신약(세상에 처음 나온 새로운 약)은 51개로 역대 최고치를 경신했다. 이번 국가 기본의료보험 의약품 목록이 조정되어 신품종은 종양, 희귀질환, 만성질환, 정신질환 등 긴급하게 필요한 임상 치료 분야를 포괄합니다. 동시에 임상적 가치가 제한적이거나 더 나은 대안이 있거나 지침에 대한 정보가 누락되어 사용할 수 없는 34개 의약품이 목록에서 삭제되었습니다. 포괄적인 이전, 이전 및 제형 병합을 거쳐 2026년판 국민기본의료보험 의약품 목록의 총 의약품 수는 3,331개에 달합니다."},{"s":"상위 8개 생명공학주, 첫 3분기에 엄청난 이익 기록 - 파이낸셜 뉴스 - 산업 및 상업 타임스","so":"中時新聞網","tm":"11/16 05:10","c":2,"r":"tw","u":"https://www.chinatimes.com/newspapers/20261116000239-260202","p":1794773400,"a":1794784830,"t":"生技股8強前三季獲利噴發- 財經要聞- 工商時報","su":"생명공학 주식은 첫 3분기 동안 엄청난 수익을 냈으며 총 8개 회사가 1주 이상의 자본을 보유했습니다. 그러나 주당순이익(주식 한 주가 번 돈) 순위는 대대적인 개편을 겪었다. 징숴(Jingshuo)가 20.09대만달러로 1위를 차지했고, 야오화제약(Yaohua Pharmaceutical)이 18.43대만달러, 타이보(Taibo)가 18.06대만달러로 뒤를 이었다. BenQ Medical은 16.65대만달러로 처음으로 1위 그룹에 진입했습니다. Bao Rui는 톱 10에 진입했고 Lamex는 예상치 못하게 하락했습니다."},{"s":"BenQ Medical, 생명공학 부문 1분기 이익 제왕을 차지, 3분기 세후 주당순이익이 15.05위안으로 급증","so":"中時新聞網","tm":"11/16 05:10","c":2,"r":"tw","u":"https://www.chinatimes.com/newspapers/20261116000242-260202","p":1794773400,"a":1794784834,"t":"明基醫 奪生技單季獲利王寶座 Q3每股稅後純益飆至15.05元","su":"3분기 생명공학주 이익순위가 개편됐다. BenQ Medical은 자산 매각 및 비산업 이익 인식으로 이익을 얻었으며, 단일 분기 세후 주당순이익(주식 한 주가 번 돈)이 15.05위안으로 치솟았습니다. 뜻밖의 징숴(Jingshuo)와 야오화제약(Yaohua Pharmaceutical)을 물리치고 다크호스로서 1분기 실적(회사가 번 돈 성적표) 왕좌를 차지했다. Baorui 및 Lai Fung-KY 운영은 사탕수수를 먹고 있으며 단일 분기의 주당 수익이 상위 10위 안에 들었습니다."},{"s":"엘리 릴리(일라이릴리): 종양학 분야의 혁신적 약물 3개에 대한 새로운 적응증이 국가 의료보험 카탈로그에 포함되었습니다.","so":"Jiemian.com","tm":"11/14 12:56","c":2,"r":"cn","u":"https://www.jiemian.com/article/15333120.html","p":1794628575,"a":1794628688,"t":"礼来：三款肿瘤领域创新药物新增适应症纳入国家医保目录","su":"11월 14일, 일라이릴리는 Jepali®(피투브루티닙 정제), Tyvyt®(신틸리맙 주사제) 및 Aiute®(프루퀸티닙 캡슐)를 포함하여 종양학 분야의 세 가지 혁신 약물의 새로운 적응증이 국민 기본 의료 보험, 산재 보험 및 산모 보험 의약품 카탈로그(2026) 새 버전에 성공적으로 포함되었다고 발표했습니다. 국민의료보험목록 새 버전이 2027년 1월 1일 정식 시행됩니다."},{"s":"하오딩 신약, 노바티스 승인 및 계약금 9억 8천만 지급","so":"UDN","tm":"11/14 03:09","c":2,"r":"tw","u":"https://udn.com/news/story/7241/9877816","p":1794593352,"a":1794610375,"t":"浩鼎新藥授權諾華 9.8億簽約金入袋","su":"룬타이그룹 산하 생명공학신약기업 하오딩(Haoding)이 대형 다국적 제약회사 노바티스와 협력 및 라이선스 계약을 체결했다고 어제(13일) 밝혔다. 하이딩의 다중 독점 항체-약물 접합체(ADC) 플랫폼 기술을 사용해 신약 페이로드를 탑재한 차세대 ADC 약물을 공동 개발할 예정이다."},{"s":"9년 동안 14개의 카테고리 1 혁신 약물이 등장했습니다. 광둥성 이 지역은 무엇을 제대로 했나요? | 광둥성의 경제 생태를 해독하다","so":"21财经","tm":"11/16 08:43","c":1,"r":"cn","u":"https://www.21jingji.com/article/20261116/herald/13d02f47a0f5495600207da8c686e65e.html","p":1794786187,"a":1794789721,"t":"九年跑出14个1类创新药，广东这个区做对了什么？| 解码广东经济生态","su":"최근 국가식품의약국은 광저우웨캉바이오제약유한회사에 '약품등록증'을 발급했고, 1급 혁신적 중의약인 자화문비지추과립이 공식적으로 판매 승인을 받았다. 이 신약은 광둥성 중의학병원 루추안젠 교수의 장기간 임상적으로 입증된 경험적 공식을 바탕으로 개발됐다. 6가지 약재로 구성되어 있으며 3~6주간 지속되는 감염후 기침, 풍한폐애증후군에 사용된다. 신약이 임상처방에서 현대중의학으로 발전하기 위해서는 약리연구, 임상시험, 등록심사, 생산검증 등의 과정을 거쳐야 한다. 광저우 황푸구의 경우, 이 등록증은 또 다른 무게감을 갖고 있습니다. 이는 올해 황푸가 승인한 두 번째 카테고리 1 혁신 약물이다. 2018년부터 황푸는 총 14개의 카테고리 1 혁신 의약품에 대해 승인을 받았으며 이는 광저우시 전체의 93.3%, 광둥성 전체의 43.8%를 차지한다. 6년 연속 카테고리 1 혁신 의약품을 시장에 출시했습니다."},{"s":"[시판 전 팁: 새로운 의료보험 카탈로그! 혁신신약 'C-포지션' 공개 새로운 에너지 저장 블록버스터 계획 발표; 광칩 리더, 대규모 주문 수주","so":"第一财经","tm":"11/16 08:16","c":1,"r":"cn","u":"https://www.yicai.com/vip/news/103441088.html","p":1794784610,"a":1794784823,"t":"[ 盘前点金 医保目录上新！创新药“C位”亮相；新型储能重磅方案发布；光芯片龙头拿下大单","su":"[오늘의 상식] ① 2026년 의료보험 카탈로그가 출시되었습니다! 51개 카테고리 1 혁신신약(세상에 처음 나온 새로운 약)이 포함돼 CAR-T가 최초로 의료보험에 진입한다(아래첨부). ② 인산염의 새로운 에너지 저장 여정: 인산철리튬에 대한 수요가 급증하고 있으며, 주요 제조업체의 이익이 향상될 것으로 예상됩니다(주제 첨부). ③ 중국 증권감독관리위원회 위원장 우칭(Wu Qing)이 최근 성명을 발표했는데, 이는 2억 명이 넘는 주식 투자자들에게 영향을 미칩니다. ④ 본 회사는 3억 6백만 위안의 자산을 인수하고 \"광학 저장 및 컴퓨팅\" 테스트를 늘릴 계획입니다. ⑤ 소속사가 지적한"},{"s":"기술주 평가를 개정하고 자금을 생명공학 분야로 편입했다. 관련지수는 지난달 7.1% 가까이 상승했다.","so":"UDN","tm":"11/16 04:39","c":1,"r":"tw","u":"https://udn.com/news/story/123006/9880478","p":1794771560,"a":1794784837,"t":"科技股評價修正資金轉進生技 相關指數近一月上漲近7.1%","su":"최근 시중자금의 순환이 빠르게 진행되고 있습니다. 기존 강세를 보인 기술주에 대한 평가를 수정하고, 합리적인 평가와 탄탄한 펀더멘털을 갖춘 바이오·의료주에 일부 자금을 편입했다. 가장 대표적인 NBI 생명공학지수를 보면 지난 한 달간 7.1% 가까이 상승했다. 기술주를 대표하는 나스닥 지수와 비교하면 최근 몇 달간 6.7% 하락했다. 더욱 돋보입니다. 지난 한 달 동안 미국 S&P500(미국 큰 회사 500곳 지수)의 다양한 주식들의 성과를 살펴보면, 헬스케어 주식들도 가장 좋은 성과를 냈습니다. 투자자들은 생명공학 ETF(여러 주식을 묶어 파는 상품)를 통해 시장을 확인하고 싶을 수도 있습니다."},{"s":"의료보험이 적용되는 혁신적인 의약품을 최대한 빨리 사용하는 방법은 무엇입니까? 다학과 협업으로 '입학의 어려움' 해결","so":"央视网","tm":"11/16 02:06","c":1,"r":"cn","u":"https://news.cctv.com/2026/11/16/ARTIgQCII4pqN5iNGHDqvJyN261115.shtml","p":1794762390,"a":1794784826,"t":"进了医保的创新药如何尽快用上？多部门联动破解“入院难”","su":"최근 국민의료보험청은 기본 보장과 수익성 보호를 바탕으로 혁신의약품에 대한 보호를 지속적으로 강화해 왔으며, 임상적 이점이 명확한 혁신의약품을 포함하고 치료 공백을 보험 범위에 채워 일반 국민이 새롭고 좋은 의약품을 사용할 수 있도록 하는 데 중점을 두고 있다. 현재 의료보험으로 인해 협상된 약품 판매액이 매년 170억 위안을 초과하고 있으며 이는 5년 전의 4배입니다. '14차 5개년 계획' 기간 의료보험 기금 누적 지출은 13조 위안에 달했다."},{"s":"\"지능형 혁신 약물이 건강에 힘을 실어줍니다\" 2026년 혁신 약물 고품질 개발 회의가 장쑤성 쑤저우에서 개최되었습니다.","so":"央视网","tm":"11/15 15:14","c":1,"r":"cn","u":"https://local.cctv.com/2026/11/15/ARTIJUUOS3gCb1NM4LmCttey261115.shtml","p":1794723251,"a":1794727069,"t":"“智创新药 赋能健康” 2026年创新药高质量发展大会在江苏苏州举行","su":"\"지능형 혁신 약물이 건강에 힘을 실어줍니다\" 2026년 혁신 약물 고품질 개발 컨퍼런스가 장쑤성 쑤저우에서 개최되었습니다."},{"s":"수백만 달러의 가격을 돌파한 후, 카탈로그로 이전된 첫 번째 혁신 의약품의 판매량이 폭발적으로 증가할 수 있을까요?","so":"第一财经","tm":"11/15 10:27","c":1,"r":"cn","u":"https://www.yicai.com/news/103440856.html","p":1794706024,"a":1794751323,"t":"击穿百万价格后，首批转目录的创新药销量能大爆发吗？","su":"\"혁신적인 약물이 곧 등장할 예정이며, 내년에는 이 CAR-T의 매출(물건을 판 돈 전체)이 급증할 것입니다!\" 한 선임 의료인은 오늘 CAR-T 세포치료제 레기올란자가 기본의료보험에 포함됐다는 소식을 듣고 흥분을 감추지 못했다. 우시준누오의 루이구이오렌제주가 녹시나신나트륨에 이어 의료보험 협상을 통해 '순환을 깨는' 또 하나의 스타 고부가가치 의약품으로 자리 잡았다. 이 사람은 100만 달러에 달하는 CAR-T 의약품의 '고가' 장벽이 허물어지면서, 혁신의약품이 지불한도를 깨기 위한 새로운 상상의 공간을 열고 있다고 직설적으로 말했다. 올해 의료보험 카탈로그 조정으로 처음으로 '이중 카탈로그' 연결 메커니즘이 구축되어 상업 보험 상품에 기본 의료 보험을 신청할 수 있게 되었습니다. 국민의료보험청은 고부가가치 혁신신약(세상에 처음 나온 새로운 약)이 출시 초기 단계에서 상용보험 목록에 진입하고 임상 활용을 통해 데이터를 축적해 비용을 절감한 뒤 기본의료보험으로 전환하도록 장려하고 있다."},{"s":"2026년 11월 주목해야 할 영국 생명공학 주식 상위 3개","so":"Yahoo Finance","tm":"11/15 08:09","c":1,"r":"us","u":"https://finance.yahoo.com/healthcare/articles/top-3-british-biotech-stocks-230940445.html","p":1794697780,"a":1794702385,"t":"Top 3 British Biotech Stocks To Watch In November 2026","su":"미국의 도매 인플레이션(물건값이 계속 오르는 것) 상승과 추가 금리(돈을 빌릴 때 내는 이자 비율) 인상 기대로 인해 글로벌 투자자들이 불안해하고 있습니다. 그러나 이런 종류의 압력은 종종 금리가 아닌 돌파구가 결과를 주도하는 부문으로 돈을 밀어 넣습니다. 영국의 생명공학 주식은 바로 그 진영에 속해 있습니다. 이 기사에서는 영국 생명공학 기업을 필터링하는 집중 선별기의 세 가지 후보자를 볼 수 있습니다."},{"s":"신약 출시 경쟁 속에서 강소성의 '좋은 처방'은 무엇일까?","so":"人民网－江苏频道","tm":"11/15 07:57","c":1,"r":"cn","u":"http://js.people.com.cn/n2/2026/1115/c360301-41751166.html","p":1794697020,"a":1794713936,"t":"新药竞发，江苏有何“良方”？","su":"11월 14일, 장쑤성 쑤저우에서 2026년 혁신의약품 고품질 개발 컨퍼런스가 개최되었습니다. 이날 회의에서는 2026년판 국민의료보험 의약품 카탈로그가 공개됐다. 107개 신약 중 51개가 카테고리 1 혁신의약품으로 혁신의약품에 대한 명확한 지원 신호를 보냈다. 이번 컨퍼런스는 장쑤성에서 개최되었으며 장쑤성의 바이오제약 산업과 밀접한 관련이 있습니다."},{"s":"Vita Life Sciences 및 기타 2개의 호주 생명공학 주식 소유","so":"Yahoo Finance","tm":"11/15 01:08","c":1,"r":"us","u":"https://finance.yahoo.com/healthcare/articles/vita-life-sciences-2-other-160842530.html","p":1794672522,"a":1794698059,"t":"Vita Life Sciences And 2 Other Australian Biotech Stocks To Own","su":"미국에서는 10월 소비자물가지수와 생산자물가(공장에서 파는 물건값 수준)가 모두 중앙은행 목표치를 상회하는 등 인플레이션(물건값이 계속 오르는 것)이 과열되고 있으며, 주요 중앙은행들은 금리를 더 오랫동안 유지할 준비가 되어 있다는 신호를 보내고 있습니다. 그런 배경에서는 무거운 자산보다는 연구, 지적재산권, 과학에서 가치가 나오는 기업이 상대적으로 더 나은 입장일 수 있습니다."},{"s":"세계 주요 라이센스 프로젝트의 절반이 중국에서 나옵니다. 혁신신약 황금시대의 혁신과 투자 논리는 무엇일까?","so":"财联社电报","tm":"11/15 00:54","c":1,"r":"cn","u":"https://m.cls.cn/detail/2534664","p":1794671640,"a":1794746294,"t":"全球半数重磅license-in项目来自中国 创新药“黄金时代”的创新与投资逻辑是什么？","su":"AP통신은 11월 15일(유미아오 기자) \"우리는 바이오의약품 산업의 황금시대에 있다\"며 \"혁신적 신약에 대한 투자 기회가 많다\"고 보도했다. 2026 진지호 생명건강 투자 컨퍼런스에서 컨퍼런스에 참석한 많은 귀빈들은 중국의 바이오의약품 산업이 큰 진전을 이루었지만 여전히 중국 제약회사와 세계 선두 기업 사이에는 격차가 있다고 말했다. 산업 발전이 본격화되고, 중국 파이프라인이 글로벌 바이어들의 '보통 옵션'이 된다면 2.0 시대의 혁신은 무엇일까? 선도적인 글로벌 기업의 발전을 따라잡는 방법은 무엇입니까? 자본은 어떻게 선택되고 가격이 책정될 것인가? 혁신 격차를 해소하는 방법 글로벌 구매자가 중요하게 생각하는 것은 무엇입니까? 바이오의약 황금시대에 중국 제약회사의 발전은 누구에게나 명백하지만, 세계 선두 기업과의 격차는 여전히 존재한다. Innovent Biologics(01801.HK)의 창립자이자 회장 겸 CEO인 Yu Dechao는 이러한 격차를 좁히려면 FIC(First in class)와 BIC(Best in class)가 혁신에 필요한 옵션이지만 기업이 FIC만 하는 것만으로는 충분하지 않으며 FIC를 기반으로 BIC를 추구해야 한다고 믿습니다."},{"s":"중국 혁신 의약품의 '쑤저우 모멘트' 개막: JHC 진지호 생명건강 투자 컨퍼런스가 성공적으로 개최되었습니다.","so":"央视网","tm":"11/14 23:09","c":1,"r":"cn","u":"https://local.cctv.com/2026/11/14/ARTIF0JYprRz9gfgmZyNiJZk261114.shtml","p":1794665394,"a":1794698061,"t":"开启中国创新药的“苏州时刻”：JHC金鸡湖生命健康投资大会顺利举行","su":"이 회의에서는 최첨단 과학 세력, 선도적인 투자 자본 및 주요 산업 신호를 모아 ​​자본의 물로 혁신의 원천에 물을 공급하고 생명 및 건강 산업을 위한 매우 중요한 \"연간 자본 좌표\"를 설정합니다."},{"s":"의료보험목록에 의약품 107종 신규 포함, 혁신의약품 지급한도 개방","so":"第一财经","tm":"11/14 17:38","c":1,"r":"cn","u":"https://www.yicai.com/news/103440767.html","p":1794645535,"a":1794659855,"t":"107种药品新纳入医保目录，创新药支付天花板打开","su":"2025년판 상업보험 혁신의약품 카탈로그의 18개 의약품 중 2개가 기본의료보험 카탈로그에 편입돼 '상업보험을 통한 혁신의약품 최초 발굴 및 기본의료보험 연계'라는 변혁의 길을 실현하는 데 앞장서고 있다."},{"s":"pMN 적응증에 대한 최초의 혁신 약물이 의료 보험에 포함됩니다. 전문가들이 베이젝신 이중 적응증 약물의 임상적 의의를 설명하다","so":"新华网上海","tm":"11/14 16:14","c":1,"r":"cn","u":"http://sh.news.cn/20261114/354598b1859f4f2982434c33fd1e51db/c.html","p":1794640448,"a":1794659857,"t":"首个pMN适应症创新药纳入医保 专家解读倍捷欣双适应症药物临床意义","su":"최초의 pMN 적응증 혁신신약(세상에 처음 나온 새로운 약)이 의료보험에 포함되었습니다. 전문가들은 이중 적응증 약물인 Betexin®의 임상적 중요성을 설명합니다. Tianguangshi Biological의 오리지널 CD20 단일클론 항체인 Betexin® 이중 적응증은 2026년 의료 보험 카탈로그에 포함되어 원발성 막성 신병증 및 시신경척수염 스펙트럼 질환을 포함하여 환자의 약물 접근성을 향상시킬 것입니다."},{"s":"수익 최대 11%의 생명공학 주식 3개","so":"Yahoo Finance","tm":"11/14 15:15","c":1,"r":"us","u":"https://finance.yahoo.com/healthcare/articles/3-biotech-stocks-revenue-11-061542278.html","p":1794636900,"a":1794642663,"t":"3 Biotech Stocks With Revenue Up To 11%","su":"AI 인프라와 관련된 복잡한 부채가 급증하면서 AI 관련 위험이 연준(FRB)의 금융 안정성 우려 중 최고 수준으로 올라섰습니다. 이러한 종류의 호황과 정밀한 조사는 투자자들이 다른 최첨단 분야를 보도록 유도할 수 있습니다. 탄탄한 대차대조표를 갖춘 신중하게 선택된 생명공학 주식은 잠재적인 높은 상승 여력의 다른 원천을 제공할 수 있습니다. 이 기사에서는 이러한 세 가지 생명공학 oppo에 대해 설명합니다."},{"s":"전문가들, 혁신적인 ALS 약물이 상업 보험의 새 창을 열다: 유전자 검사는 가족력에만 초점을 맞춰서는 안 됩니다","so":"ThePaper.cn","tm":"11/14 15:12","c":1,"r":"cn","u":"https://www.thepaper.cn/newsDetail_forward_34475772","p":1794636762,"a":1794642664,"t":"渐冻症创新药迎来商保新窗口，专家：基因检测不应只盯家族史","su":"11월 14일, 2026년 전국 상업 보험 혁신 의약품 카탈로그가 공식적으로 발표되었습니다. 이번 국가 \"이중 카탈로그\" 조정은 혁신 수준이 높고, 임상 가치가 높으며, 환자 혜택이 상당한 품종에 초점을 맞추고 있으며, 보다 다양한 보호 방법을 통해 혜택을 받을 수 있는 혁신적인 약물을 홍보하는 것을 목표로 하고 있습니다."},{"s":"상용보험 혁신신약부터 국가협상의약품까지, 밀리언급 CAR-T가 최초로 기본의료보험에 진입","so":"第一财经","tm":"11/14 15:06","c":1,"r":"cn","u":"https://www.yicai.com/news/103440735.html","p":1794636362,"a":1794642666,"t":"从商保创新药变为国谈药，百万级CAR-T首次进入基本医保","su":"\"National Talk\" 듀얼 카탈로그의 새 버전이 오늘 공식적으로 출시되었습니다. 국내 혁신신약(세상에 처음 나온 새로운 약) 2종은 상용보험 혁신의약품 목록에 선정된 지 1년 만에 국가기본의료보험 목록에 성공적으로 편입됐다. '초고가 항암제'로 알려진 CAR-T 제품이 기본의료보험에 들어간 것도 이번이 처음이다. 14일, 쑤저우에서는 2026년 국민의료보험 약품 목록과 상업건강보험 혁신 약품 목록이 발표됐다. 국민의료보험 의약품목록 새 버전에는 1급 신약 51종을 포함해 107종의 신약이 추가돼 최고 기록을 경신했다. 상업 건강 보험 혁신 의약품 카탈로그에는 12개의 신약이 있습니다. 조정 후 2026년 상업 건강보험 혁신의약품 카탈로그에는 총 28종의 품목이 포함될 예정이다."},{"s":"Jikeshu는 의료 보험에 들어갑니다 : 인플루엔자 A와 B에 맞서 싸우기 위해 한 번의 복용량으로 일반 가족에게 혜택을주는 혁신적인 약물","so":"中国新闻网","tm":"11/14 14:44","c":1,"r":"cn","u":"https://www.chinanews.com.cn/jk/2026/11-14/10731967.shtml","p":1794635077,"a":1794642667,"t":"济可舒进医保：一剂对抗甲流乙流，创新药惠及普通家庭","su":"Jikeshu는 의료 보험에 가입합니다. 인플루엔자 A와 B에 대해 한 번의 접종으로 혁신적인 약물이 일반 가족에게 도움이 됩니다. 국민의료보험청은 11월 14일 2026년 '국민기본의료보험, 출산보험, 산재보험 약품 목록'(이하 국민의료보험 목록)을 발표했다. Jichuan Pharmaceutical과 Zhengxiang Pharmaceutical의 전략적 협력인 국내 1급 항인플루엔자 혁신 약물인 Maseloseloxavir 정제(Jikeshu®)가 공식적으로 의료 보험에 포함되었습니다. 이 혁신적인 약물은 인플루엔자 치료에 새로운 선택을 제시하고, 일반 국민들은 국산의 좋은 약물을 보다 저렴하게 사용할 수 있게 되었습니다. 인플루엔자를 치료하려면 전체 치료 과정에서 한 가지 약물만 필요하며 하루 정도 지나면 열이 내려갈 수 있습니다. 독감에 걸리면 매일 약을 복용해야 한다는 것을 기억해야 합니까? Jikeshu®는 다중 약물 치료 모델을 깨뜨립니다. 전체 독감 치료 주기 동안 한 번만 복용하면 진정한 \"1회 복용량 완화\"를 달성할 수 있습니다."},{"s":"2027년에 생명공학 주식이 이익 턴어라운드를 볼 수 있을까요? 한다, 타이허 등 6개 유명 의약품의 허가, 허가, 판매가 핵심이 됐다","so":"工商時報","tm":"11/14 11:35","c":1,"r":"tw","u":"https://www.ctee.com.tw/news/20261114700362-430504","p":1794623700,"a":1794628693,"t":"生技股2027年迎獲利轉機？漢達、泰合等6檔受矚藥證、授權與銷售成關鍵- 產業","su":"생명공학 주식은 2027년에 이익 턴어라운드를 볼 것입니다! 신약 인증, 국제 1/15 07:41","c":1,"r":"cn","u":"https://www.cls.cn/detail/2510447","p":1794696099,"a":1794727082,"t":"【早报】国际油价，一夜“过山车”；SpaceX Q3 业绩超预期；宁德时代等三季报出炉","su":"① 미국 ​​정부가 각 기관에 딥시크 사용 중단을 지시했고, 외교부가 대응 ② 국가 데이터 그룹 설립 ③ 미국 다우존스 산업평균지수가 1% 이상 상승 ④ 공업정보화부: R&D와 테스트를 통해 충분히 검증되지 않은 불합리한 혁신 디자인과 자동차 제품의 시장 진입을 단호히 방지 ⑤ CATL, Tianyue Advanced, Yunnan Germanium Industry, CSSC Special Gas의 3분기 보고서가 공개된다. 매크로뉴스 1. 국무원의 승인을 받아 국립데이터그룹주식회사가 설립되었습니다. 국무원 국유자산감독관리위원회는 국무원을 대신하여 투자자의 직무를 수행한다. 국무원 국유자산감독관리위원회가 투자자의 임무를 수행하는 기업 목록에 포함될 것이다. 2. 미국 국토안보부는 10월 19일 미국 연방정부의 민간행정기관이 중국 인공지능 기업 딥서치(Deep Search) 및 그 계열사가 개발한 제품 및 서비스를 구매하는 것을 금지하고 관련 제품 및 서비스를 관련 기관의 정보시스템에서 제거하도록 요구한다고 발표했다. 상무부는 이에 대해 중국측은 강한 불만을 표하며 단호히 반대한다고 밝혔습니다. 미국은 양국 정상이 달성한 중요한 공감대를 진지하게 이행하고, 중국과 중간 협력하고, 중미 인공지능 대화 메커니즘을 잘 활용하고, 상호 신뢰를 강화하고, 차이를 관리하며, 인공지능을 공동으로 추진하기를 희망합니다."},{"s":"CATL과 BAIC, 포괄적인 전력 교환 협력 실시","so":"21财经","tm":"11/14 20:22","c":1,"r":"cn","u":"https://www.21jingji.com/article/20261114/herald/3850b3ac4602ab05934e7eda1b975b39.html","p":1794655376,"a":1794659867,"t":"宁德时代与北汽全面换电合作落地","su":"CATL과 BAIC는 포괄적인 배터리 교환 협력을 시작했습니다. 본 신문 보도(리팅 기자) 11월 13일 베이징에서 Jihu 국가 전력 스왑 생태계 및 베타 시리즈 신제품 출시 컨퍼런스가 개최되어 Jihu T1 배터리 스왑 버전이 출시되었습니다. 이는 베이징자동차그룹(이하 'BAIC 그룹')과 CATL 신에너지기술유한회사(이하 'CATL')가 지난 10월 22일 협약 체결 이후 한 달도 채 되지 않아 100만대 차량용 배터리 교환 전략적 협력 협약을 체결한 이후 또 하나의 중요한 성과다. 이전 협약에 따르면 양 당사자는 차량 개발, 배터리 교체 공급, 배터리 교체 네트워크 및 비즈니스 모델 혁신에 초점을 맞춘 풀체인 협력을 진행하게 된다. BAIC는 자사의 멀티 브랜드 적용 모델을 초콜릿 배터리 교환 생태계에 통합하는 것을 촉진하고 배터리 교환 모델 100만 개라는 목표를 달성할 것입니다."},{"s":"CATL의 1,300억 달러 하락: 중국 최대 배터리 제조업체의 가치가 급락한 이유는 무엇입니까?","so":"South China Morning Post","tm":"11/14 16:00","c":1,"r":"sg","u":"https://www.scmp.com/business/climate-and-energy/article/3374346/chinas-battery-giant-catl-faces-tough-choices-after-epic-us130b-sell","p":1794639607,"a":1794642677,"t":"CATL’s US$130b drop: why has China’s biggest battery maker plunged in value?"},{"s":"[포토] 이차전지 소재·부품 및 장비전(K-BATTERY SHOW 2026)","so":"전자신문","tm":"11/14 11:57","c":1,"r":"kr", ","su":"3개의 중국 항공기 개발자와의 파트너십을 통해 배터리 제조업체는 아직 초기 단계에 있는 잠재적으로 큰 시장에 진출할 수 있게 되었습니다."},{"s":"위브그리드(WeaveGrid)와 현대차그룹, 북미에서 EV 스마트 충전 플랫폼 개발","so":"AutoTechInsight","tm":"11/13 23:44","c":1,"r":"world","u":"https://autotechinsight.spglobal.com/news/5291468/weavegrid-and-hyundai-motor-group-to-develop-ev-smart-charging-platform-in-north-america","p":1794581052,"a":1794610411,"t":"WeaveGrid and Hyundai Motor Group to develop EV smart-charging platform in North America","su":"WeaveGrid와 현대 및 기아 차량의 승인된 통합을 통해 유틸리티 회사에 차량 모델 전반에 걸쳐 충전 및 배터리 데이터를 제공하게 됩니다."},{"s":"태국, 중국과 EV와 농업에서 협력 확대 \"2 플러스 2\"27년 초에 첫 개최","so":"日本経済新聞","tm":"11/13 23:26","c":1,"r":"jp","u":"https://www.nikkei.com/article/DGXZQOGS13C5J0T11C26A1000000/","p":1794580015,"a":1794610407,"t":"タイ、中国とEVや農業で協力拡大 「2プラス2」27年初に初開催","su":"[방콕=아카마 건재] 태국 아누틴 총리는 13일 방콕을 방문 중인 중국 이강 총리와 회담했다. 전기자동차(EV) 개발과 농산물 무역확대 등에 관한 8개의 협력문서를 나눴다. 투자 확대를 통해 양국의 경제관계를 강화한다. 2027년 초 양국의 외상과 국방상에 의한 ‘2플러스2’ 회의의 첫 회합을 열 방침에서도 일치했다. 양국은 7월 2플러스 2의 틀을 신설하기로 합의했다. 이씨가 23"},{"s":"리튬배터리 산업체인 주간일지 | 리튬 배터리 관련 수출 규제가 내년 1월까지 유예된다. '15차 5개년 계획'을 위한 새로운 에너지 저장 솔루션이 구현됩니다.","so":"Jiemian.com","tm":"11/13 23:24","c":1,"r":"cn","u":"https://www.jiemian.com/article/15332436.html","p":1794579852,"a":1794610396,"t":"锂电产业链周记 | 锂电池相关出口管制暂停实施至明年1月 “十五五”新型储能方案落地","su":"짐바브웨는 2027년 1월 리튬 정광 수출 금지 조치를 유지했고, 궈쉬안의 2GWh 전고체 대량 생산 라인이 가동됐으며, Tianci Materials는 50만 톤 전해질 프로젝트를 건설하기 위해 50억 위안 이하를 투자할 계획이다."},{"s":"온세미, AI·EV·에너지 애플리케이션 겨냥한 4세대 SiC 플랫폼 선보여","so":"AutoTechInsight","tm":"11/13 23:06","c":1,"r":"world","u":"https://autotechinsight.spglobal.com/news/5291465/onsemi-introduces-fourth-generation-sic-platform-targeting-ai-ev-and-energy-applications","p":1794578777,"a":1794610415,"t":"Onsemi introduces fourth-generation SiC platform targeting AI, EV and energy applications","su":"EliteSiC M4 750V 자동차 트랙션 베어 다이는 현재 사용 가능하며 2027년에는 최대 1,200V의 추가 전압 옵션이 예상됩니다."},{"s":"결산 : artience의 순이익 84% 증가 26년 12월기 EV 수요 감소로 하향 수정","so":"日本経済新聞","tm":"11/13 20:24","c":1,"r":"jp","u":"https://www.nikkei.com/article/DGXZQOUC135O50T11C26A1000000/","p":1794569088,"a":1794576135,"t":"決算:artienceの純利益84％増 26年12月期、EV需要減で下方修正","su":"artience(아티엔스, 구 동양 잉크 SC 홀딩스)는 13일, 2026년 12월기의 연결 결산은 순이익(모든 비용을 빼고 남은 돈)이 전기 대비 84% 증가한 190억엔이 될 것이라고 발표했다. 기존 예상을 20억엔 하향 수정한다. 전기자동차(EV) 수요 감속으로 리튬이온 전지 재료가 떨어지고 손상차손 92억엔을 계상한다. 매출은 11% 증가한 3880억엔, 영업이익(장사해서 남긴 돈)은 25% 증가한 260억엔을 전망한다. 종래 예상으로부터 각각 280억엔,"},{"s":"CATL은 이달 들어 eVTOL 기업 2개사 연속 계약을 맺었고, 배터리 제조사들은 저고도 분야 배치를 가속화했다.","so":"财新","tm":"11/13 20:13","c":1,"r":"cn","u":"https://companies.caixin.com/2026-11-13/102504602.html","p":1794568380,"a":1794576129,"t":"宁德时代月内连签两家eVTOL企业 电池厂商加速布局低空领域","su":"[카이신닷컴] 동력배터리 업체들이 저고도 항공기 고객 확대에 속도를 내고 있다. 11월 12일, CATL(300750.SZ)은 Yivit(Hangzhou) Aviation Technology Co., Ltd.와 유인 및 화물 차량용 전기 수직 이착륙 항공기(eVTOL)에 항공 전력 배터리를 제공하는 독점 배터리 파트너 역할을 하는 계약을 체결했다고 발표했습니다. CATL이 eVTOL 기업과의 협력을 발표한 것은 11월 이후 두 번째다. 첫 번째는 11월 2일이었습니다. 협력 파트너는 Blue Vector Aviation Technology (Shanghai) Co., Ltd.였으며 CATL은 SKYLA V30 순수 전기 틸트 로터 eVTOL용 배터리를 맞춤형으로 개발했습니다. 양 당사자는 또한 독점적인 협력 모델을 채택합니다."},{"s":"BESS 업계 소식: CATL 나트륨 이온 사양, BESS 가용성 및 전력 공급 속도 가격","so":"Energy-Storage.News","tm":"11/13 19:01","c":1,"r":"us","u":"https://www.energy-storage.news/bess-industry-buzz-catl-sodium-ion-specs-bess-availability-and-the-price-of-speed-to-power/","p":1794564102,"a":1794576126,"t":"BESS Industry Buzz: CATL sodium-ion specs, BESS availability and the price of speed-to-power"},{"s":"장안자동차 : 전고체 배터리는 파워 배터리 소재 시스템의 근본적인 변화","so":"36Kr","tm":"11/13 17:22","c":1,"r":"cn","u":"https://m.36kr.com/newsflashes/4067880412484740","p":1794558156,"a":1794576130,"t":"长安汽车：固态电池是动力电池材料体系的根本性变革"},{"s":"“에코프로 그룹, 내년 1분기 실적 회복·3분기 본격 반등 전망” [찐코노미]","so":"이투데이","tm":"11/13 16:38","c":1,"r":"kr","u":"https://www.etoday.co.kr/news/view/2648043","p":1794555480,"a":1794576125,"su":"2차전지(충전해서 다시 쓰는 배터리) 소재 기업 에코프로 그룹이 올해 4분기를 실적(회사가 번 돈 성적표) 저점으로 내년 1분기부터 회복세에 접어들어 3분기에는 본격적인 반등에 나설 것이라는 분석이"},{"s":"강원에너지, 이차전지 소재 성장에 실적 개선 본격화","so":"뉴스핌","tm":"11/13 16:34","c":1,"r":"kr","u":"https://www.newspim.com/news/view/20261113001315","p":1794555240,"a":1794576125,"su":"[서울=뉴스핌] 양태훈 기자 = 강원에너지가 이차전지 소재 사업 성장에 힘입어 올해 3분기 영업손실을 크게 줄이고 당기순이익(모든 비용을 빼고 남은 돈) 흑자전환에 성공했다. 주력인 무수수산화리튬 사업의 매출이 증가한 가운데 인공지능(AI) 데이터센터(컴퓨터 수만 대를 모아 둔 건물) 관련 설비 사업으로 영역을 확대하고"},{"s":"\"China News\" 두 부서: 에너지 저장 배터리 회사가 합리적이고 질서 있는 방식으로 프로젝트 건설을 촉진하고 맹목적인 확장 위험을 방지하도록 안내","so":"etnet 經濟通","tm":"11/13 16:30","c":1,"r":"hk","u":"https://www.etnet.com.hk/www/tc/news/news-article.php?section=categorized&category=china&newsid=20261113775","p":1794555000,"a":1794576133,"t":"《中國要聞》兩部門：指導儲能電池企業合理有序推進項目建設，防範盲目擴張風險","su":"2026/11/13 15:30 \"China News\"의 두 부서: 에너지 저장 배터리 회사가 합리적이고 질서 있는 방식으로 프로젝트 건설을 촉진하고 맹목적인 확장 위험을 방지하도록 안내 요약 면책 조항 이 내용은 기존 시장 데이터 및 뉴스 소스를 기반으로 인공 지능에 의해 생성되었으며 참고용입니다. 본 내용은 \"이코노믹스\"의 견해나 입장을 대변하지 않으며, 어떠한 투자조언도 구성하지 않습니다. AI가 생성한 정보에는 오류, 누락, 일탈 등이 있을 수 있으므로, 투자 결정을 내리기 전에 사용자가 직접 해당 내용을 확인하거나 전문가의 조언을 구해야 합니다. \"이코노믹스\"는 본 내용을 신뢰하여 발생하는 어떠한 손실이나 손해에 대해서도 책임을 지지 않습니다."},{"s":"CATL과 시드니 뉴사우스웨일스대학교, 에너지 전환 공동 추진을 위한 협력 양해각서 체결","so":"Jiemian.com","tm":"11/13 16:13","c":1,"r":"cn","u":"https://www.jiemian.com/article/15329814.html","p":1794553980,"a":1794576132,"t":"宁德时代与悉尼新南威尔士大学签署合作谅解备忘录 共促能源转型","su":"최근 2026년 호주 국제에너지쇼가 멜버른에서 열렸습니다. 남반구에서 가장 크고 가장 영향력 있는 청정 에너지 행사인 이 전시회는 효율적인 지식 공유 플랫폼일 뿐만 아니라 호주와 아시아 태평양 지역의 산업 자원을 연결하는 중요한 가교 역할을 합니다. 전시회 기간 동안 CATL은 시드니 뉴사우스웨일스 대학교(UNSW Sydney)와 협력 양해각서를 체결하여 공식적으로 전략적 파트너십을 구축했습니다. 양 당사자는 호주의 청정 에너지 전환에 필요한 전문 기술과 산업 역량을 공동으로 강화하여 혁신 결과, 기술 배당(회사가 주주에게 나눠주는 돈)금 및 산업 기회가 더 많은 사람들에게 혜택을 줄 수 있도록 할 계획입니다. 뉴 사우스 웨일즈는 호주의 재생 에너지 및 에너지 저장 인프라 개발의 최전선에 있습니다. 관련 산업의 확장이 가속화되면서 현지 전문인력에 대한 수요도 급속히 늘어나고 있다. 이를 위해 양 당사자는 에너지저장전지 인재양성, 기술 실증 및 검증, 공동과학연구 등 3대 방향을 중심으로 협력해 나갈 예정이다. 동시에 시드니 뉴사우스웨일스대학교의 50년 이상 축적된 재생에너지 혁신에 의존하여 학교의 장기간 축적된 과학 연구 보유량이 실용적인 산업 기술로 전환될 것입니다. 기술 혁신과 반복을 촉진하는 동시에 지역 고용 기회를 창출하고 지역 생산 능력의 기반을 강화하여 에너지 전환의 결과가 더 많은 어린 학생들, 지역 사회 생계 및 지역 경제에 도움이 될 것입니다."},{"s":"2차전지 연구실·소재공장 찾아 독일 날아간 경남정보대 학생들","so":"아시아경제","tm":"11/13 15:49","c":1,"r":"kr","u":"https://www.asiae.co.kr/article/2026111315495389236","p":1794552594,"a":1794553606,"su":"2차전지(충전해서 다시 쓰는 배터리) 연구실·소재공장 찾아 독일 날아간 경남정보대 학생들 재학생 13명 독일서 5박 7일 현장교육 MEET·BASF 방문 연구·생산과정 살펴 이차전지를 공부하는 대학생들이 독일 연구기관과 기업을 찾아 배터리 산업의 현장을 살폈다. 강의실에서 익힌 이론이 연구와 소재 생산 과정에 어떻게 적용되는지 확인하고 유럽의 기술 동향도 접했다. 경남정보대학교(총장 김태상)는 재학생 13명이 최근 5박 7일 일정으로 독일 프랑크푸르트와 뮌스터 일대에서 이차전지 산업·연구 현장교육을 받았다고 13일 알렸다."},{"s":"소재부터 로봇까지, 이차전지 미래 기술 포항에 집결","so":"서울경제","tm":"11/13 15:14","c":1,"r":"kr","u":"https://www.sedaily.com/article/20114052","p":1794550460,"a":1794576125,"su":"소재부터 로봇까지, 이차전지 미래 기술 포항에 집결 ‘국제 배터리 엑스포 2026 포항’ 13일 개막 입력2026-11-13 15:14 배터리 기술과 활용 가능성을 한자리에서 확인할 수 있는 ‘국제 배터리 엑스포 2026 포항’이 13일 포항 만인당에서 개막했다. 경북도와 포항시가 주최하는 엑스포는 ‘일상을 충전하다, 미래를 향한 움직임’을 주제로 15일까지 3일간 이어진다. 행사에는 53개 기업·기관이 131개 부스를 마련했다."},{"s":"LG에너지솔루션 미국 자회사, ESS 운영 최적화 플랫폼 '에어로스 인텔리전스' 출시","so":"비즈니스포스트","tm":"11/13 14:32","c":1,"r":"kr","u":"https://www.businesspost.co.kr/BP?command=article_view&num=451957","p":1794547972,"a":1794553606},{"s":"제19회 대한민국소통어워즈 시상…대상에 한화그룹·포스코퓨처엠","so":"전자신문","tm":"11/13 14:23","c":1,"r":"kr","u":"https://www.etnews.com/20261113000199","p":1794547399,"a":1794553606,"su":"한국인터넷소통협회는 13일 한국프레스센터에서 제19회 대한민국소통어워즈 시상식을 개최하고, 고객과의 소통에서 탁월한 성과를 거둔 기업과 공공기관을 발표했다. 해당 어워즈는 디지털 플랫폼을 기반으로 고객과 적극적으로 소통하고 차별화된 콘텐츠와 고객 경험을 제공한 기업과 공공기관을 발굴·시상하는 행사다. 올해의 소통대상에는 디지털 소통효과 평가에서 S등급의 우수한 성과를 유지해 온 한화그룹(브랜드미디어), 포스코퓨처엠(유튜브) 등이 선정됐다. 이들"},{"s":"LG엔솔 배터리 가동률 57.1%로 회복…R&D 투자 1.1조 돌파","so":"이데일리","tm":"11/13 14:10","c":1,"r":"kr","u":"https://www.edaily.co.kr/News/Read?newsId=03624406645645392&mediaCodeNo=257","p":1794546651,"a":1794553606,"su":"LG에너지솔루션의 배터리 공장 평균 가동률이 57%를 넘어섰다. 전기차 캐즘(일시적 수요 정체)으로 지난해 50% 아래까지 떨어졌던 가동률이 에너지저장장치(ESS(전기를 저장해 두는 큰 배터리)) 사업 확대와 전기차 배터리 생산 회복에 힘입어 개선되는 모습이다. LG에너지솔루션 폴란드 브로츠와프..."},{"s":"빈패스트의 무제한 마일리지 배터리 보증은 운전의 자유를 보상합니다 – 회사 발표","so":"Financial Times","tm":"11/13 14:08","c":1,"r":"world","u":"https://markets.ft.com/data/announce/detail?dockey=600-202611130008PR_NEWS_USPRX____LA96736-1","p":1794546480,"a":1794553611,"t":"VinFast's Unlimited-Mileage Battery Warranty Rewards the Freedom to Drive – Company Announcement","su":"순자산가치, 성과, 보유 및 부문 가중치, 의결권 변경, 이사 및 거래를 포함한 최신 회사 정보."},{"s":"자체 제작 배터리로 RC카 구동...인하대 미니카 경진대회","so":"한국경제","tm":"11/13 13:45","c":1,"r":"kr","u":"https://www.hankyung.com/article/202611135075h","p":1794545146,"a":1794553606,"su":"AI 추천 뉴스 자체 제작 배터리로 RC카 구동...인하대 미니카 경진대회 대학생이 직접 만든 배터리로 구동하는 미니카 경진대회가 열렸다. 인하대는 이차전지특성화대학사업단이 개최한 미니카 경진대회에 참가한 무선조종 자동차(RC카)의 배터리를 학생들이 직접 설계했다고 13일 밝혔다. 이번 대회는 학생들이 배터리 소재의 특성과 전기화학적 원리를 실제 제품에 적용해 보는 실험실습 차원으로 열렸다. 직접 설계한 배터리로 RC카를 구동하며 설계 조건과 실제 성능의 관계를 이해하고, 제작 과정에서 발생하는 기술적 문제를 해결하는 데 초점을 맞췄다."},{"s":"CATL은 등록 자본금 4억 4600만-36Kr으로 베이징에 Times Beicheng Technology Company를 설립했습니다.","so":"www.36kr.com","tm":"11/13 13:35","c":1,"r":"cn","u":"https://www.36kr.com/newsflashes/4067648557896577","p":1794544509,"a":1794610399,"t":"宁德时代在北京成立时代北成科技公司，注册资本4.46亿-36氪","su":"36Kr은 Tianyancha 앱을 통해 Beijing Times Beicheng Technology Co., Ltd.가 최근 설립되었다는 사실을 알게 되었습니다. 법적 대표자는 Xie Gangyi이며 등록 자본금은 4억 4600만 위안입니다. 사업 범위에는 기계 장비 연구 및 개발, 엔지니어링 및 기술 연구 및 실험 개발, 인공 지능 응용 소프트웨어 개발 등이 포함됩니다. 주주 정보에 따르면 이 회사는 CATL의 자회사인 Times Electronic Services Technology Co., Ltd.가 전액 소유하고 있습니다."},{"s":"센서의 자사 개발을 고집하는 Vaisala 반도체나 전지 제조로 존재감:일본법인이 첫 기자 설명회 개최(1/2 페이지)","so":"EE Times Japan","tm":"11/13 12:30","c":1,"r":"jp","u":"https://eetimes.itmedia.co.jp/ee/articles/2611/13/news068.html","p":1794540600,"a":1794553609,"t":"センサーの自社開発にこだわるVaisala 半導体や電池製造で存在感：日本法人が初の記者説明会開催（1/2 ページ）","su":"핀란드의 계측기기 메이커 Vaisala의 일본법인 바이사라가 일본에서 처음으로 기자 설명회를 개최했다. 바이사라의 대표 이사 사장을 맡은 다카하시 히로유키씨가, Vaisala의 개요나 일본 시장에서의 사업 전개에 대해 말했다."},{"s":"탄산리튬 주계약은 하루 동안 4% 상승했다.","so":"第一财经","tm":"11/13 11:42","c":1,"r":"cn","u":"https://www.yicai.com/news/103439413.html","p":1794537745,"a":1794553607,"t":"碳酸锂主力合约日内涨幅达4%","su":"제일재경 2026-11-13 10:41:06 편집자: Tang Yanbei 탄산리튬의 주요 계약은 하루 동안 4% 상승하여 현재 92,660위안/톤으로 거래되고 있습니다. 전방 수급 반전과 비관적인 시장 기대로 인해 탄산리튬 선물 가격이 급락했고, 업계에서는 고비용 생산 능력 청산과 개편에 속도를 냈다. 메모리 반도체(전자기기의 두뇌 부품) 회사들은 여전히 ​​가격 인상을 의향하고 있지만, PC나 휴대폰 등 가전제품 단말기는 가격 압박에 영향을 받고 있다. 전체 기계업체들은 구매에 있어 보수적인 경향을 보이고 있으며, 메모리반도체 단가 추가 상승 모멘텀(값이 움직이는 기세)도 약화되고 있다. 주요 참가자들은 오늘 늦은 거래에서 이러한 주식을 사고 팔고 있습니다. 비닐렌카보네이트(VC) 가격이 지난주 21% 이상 올랐다. 탄산리튬 가격은 지난해 같은 기간 톤당 8만위안에서 현재 톤당 18만위안으로 올랐다."},{"s":"Fengjing Shares: 회사의 리튬 배터리 제품은 현재 협상 단계에 있습니다.","so":"Jiemian.com","tm":"11/13 11:21","c":1,"r":"cn","u":"https://www.jiemian.com/article/15328713.html","p":1794536478,"a":1794539817,"t":"峰璟股份：公司锂电池产品目前在洽谈阶段","su":"11월 13일 뉴스에 따르면, Fengjing Co., Ltd.는 대화형 플랫폼을 통해 회사의 리튬 배터리 제품이 현재 협상 단계에 있다고 밝혔습니다."},{"s":"배터리 설계부터 주행까지…인하대, 이차전지 인재 키운다","so":"데일리안","tm":"11/13 10:39","c":1,"r":"kr","u":"https://www.dailian.co.kr/news/view/1714604/%EB%B0%B0%ED%84%B0%EB%A6%AC-%EC%84%A4%EA%B3%84-%EC%A3%BC%ED%96%89%EA%B9%8C%EC%A7%80%EC%9D%B8%ED%95%98%EB%8C%80-%EC%9D%B4%EC%B0%A8%EC%A0%84%EC%A7%80-2026","p":1794533940,"a":1794539816,"su":"인하대가 학생들의 이차전지 설계·제작 역량을 높이기 위한 실무형 교육 프로그램을 운영했다.인하대는 이차전지특성화대학사업단이 최근 학생들을 대상으로 배터리 설계부터 제작, 성능 평가까지 직접 수행하는 미니카 경진대회를 개최했다고 13일 밝혔다.이번 대회는 배터리 소재와 전기화학 원리에 대한 이론을 실제 제품에 적용하는 실습 중심으로 진행됐다.학생들이 직접 만"},{"s":"이차전지 특화단지 광양만권 중마동에 ‘두산위브 시그니처 광양’ 이달 분양","so":"동아일보","tm":"11/13 10:00","c":1,"r":"kr","u":"https://www.donga.com/news/amp/all/20261112/135015558/1","p":1794531600,"a":1794539816,"su":"전남 광양시 중마동에 들어서는 ‘두산위브 시그니처 광양’이 이달 중 견본주택을 열고 일반분양에 나선다. 12일 분양업계에 따르면 이 단지는 지상 최고 32층, 총 575세대 규모로 이 중 120세대가 일반분양된다. 전용면적은 66㎡·84㎡&middo…"}]},{"name":"⚡ 전고체배터리·ESS","note":"보유: KODEX 전고체배터리ESS TOP2플러스","breaking":false,"items":[{"s":"국가에너지청 관계자들이 '15차 5개년 신에너지저장장치 이행계획' 기자들의 질의에 답변했다.","so":"Jiemian.com","tm":"11/13 21:26","c":7,"r":"cn","u":"https://www.jiemian.com/article/15332228.html","p":1794572762,"a":1794576145,"t":"国家能源局有关负责同志就《“十五五”新型储能实施方案》答记者问","su":"최근 국가발전개혁위원회와 국가에너지국은 공동으로 '15차 5개년 계획 신에너지저장 시행계획'(이하 '시행계획')을 발표했다. 기자는 국가 에너지 관리국의 관련 책임자 동지들과 인터뷰했습니다. 1. 실시계획을 발표하게 된 배경은 무엇입니까? 답변: 당 중앙위원회와 국무원은 새로운 에너지 저장 장치의 개발을 매우 중요하게 생각합니다. 신에너지저장장치 개발은 3년 연속 '정부사업보고서'에 포함됐다. '국가경제사회발전을 위한 15차 5개년 계획'에서는 신에너지저장장치 개발을 본격화할 것을 제안하고 있으며, 이는 '15차 5개년 계획'에서 신에너지저장장치 개발 방향을 제시한 바 있다."},{"s":"2030년까지 중국의 새로운 에너지 저장 장치 설치 용량은 3억 킬로와트에 도달할 계획입니다.","so":"中国新闻网","tm":"11/13 22:01","c":5,"r":"cn","u":"https://www.chinanews.com.cn/cj/2026/11-13/10731719.shtml","p":1794574910,"a":1794576145,"t":"到2030年中国新型储能装机规模计划达3亿千瓦","su":"2030년까지 중국의 새로운 에너지 저장 장치 설치 용량은 3억 킬로와트에 도달할 계획입니다. 중국신사서비스, 베이징, 11월 13일(왕멍야오 기자) 중국 국가에너지국이 13일 발표한 '15차 5개년 계획 신에너지저장 실행계획'에서는 2030년까지 신에너지저장이 대규모 개발단계에서 시장지향적 발전단계로 진입해 국가 신에너지저장 설치용량이 3억 킬로와트에 달하고 평균 에너지 저장시간은 약 3시간에 달한다는 목표를 세웠다. '이중 탄소' 목표의 지도 하에 중국의 신에너지는 급속히 발전했으며 시스템 피크 조절 및 전원 공급 보장에 대한 압력은 계속해서 높아지고 있습니다. 중요한 유연성 조정 자원으로서 새로운 에너지 저장 장치는 새로운 전력 시스템을 구축하기 위한 객관적인 요구 사항이 되었습니다. 2025년 말까지 중국은 1억 3,600만 킬로와트/3억 5,100만 킬로와트 시간에 달하는 새로운 에너지 저장 장치 설치 용량을 완료하고 가동했습니다."},{"s":"2개 부서: 그리드 측에서 독립적인 신에너지 저장 용량 전기 가격 메커니즘 구축","so":"36氪","tm":"11/13 16:58","c":3,"r":"cn","u":"https://36kr.com/newsflashes/4067858999317376","p":1794556730,"a":1794576147,"t":"两部门：建立电网侧独立新型储能容量电价机制"},{"s":"컴퓨팅 파워의 확장은 파워 반복을 강요하고 있으며, 에너지 저장 증가를 위한 공간이 열리고 있습니다. 업계에서는 2035년에는 전고체전지의 스케일업이 가능할 것으로 예상하고 있다.","so":"36Kr","tm":"11/13 09:41","c":3,"r":"cn","u":"https://www.36kr.com/newsflashes/4067444532614016","p":1794530503,"a":1794539829,"t":"算力扩容倒逼电力迭代，储能增量空间打开，业内预计全固态电池2035年规模化可期","su":"컴퓨팅 파워가 급증하면서 에너지 저장의 가치 경계가 재정의되고 있습니다. 최근 닝보에서 열린 제13회 중국(닝보) 배터리 신에너지 산업 국제 서밋 포럼(ABEC 2026)에서는 컴퓨팅 파워의 물결로 촉발된 인공지능 데이터센터(AIDC) 유통 및 저장 트랙이 청중의 이목을 집중시켰다. 회의에 참석한 전문가들은 AIDC BBU 배터리가 인증 기간에 진입하고 있으며 컴퓨팅 성능에 대한 수요 증가로 인해 전원 공급 장치가 반복되어 에너지 저장을 위한 새로운 증분 공간이 열릴 것이라고 믿었습니다. 이런 배경에서 전고체전지의 대규모 상용화 시기는 2035년이 될 것으로 예상된다. (상하이증권 뉴스)"},{"s":"2개 부서: 리튬이온 배터리 에너지 저장 장치의 반복적 업그레이드를 가속화하고 나트륨 이온 배터리 에너지 저장 장치의 적용을 촉진합니다.","so":"第一财经","tm":"11/13 16:16","c":2,"r":"cn","u":"https://www.yicai.com/news/103439922.html","p":1794554168,"a":1794610448,"t":"两部门：加快锂离子电池储能迭代升级 推广钠离子电池储能应用","su":"국가 발전 개혁 위원회와 국가 에너지 관리국은 \"15차 5개년 계획 새로운 에너지 저장 구현 계획\"을 발표했습니다. 새로운 에너지 저장 혁신 방향의 과학적인 레이아웃을 제안합니다. 리튬이온 배터리 에너지 저장의 반복적 업그레이드를 가속화하고 나트륨 이온 배터리(리튬 대신 소금 성분을 쓰는 배터리) 에너지 저장의 적용을 촉진합니다. 압축공기 에너지 저장장치, 흐름전지 에너지 저장장치, 플라이휠 에너지 저장장치 등을 파일럿 애플리케이션에서 상용 애플리케이션으로 전환을 촉진합니다. 슈퍼커패시터, 압축 이산화탄소 에너지 저장, 액체 공기 에너지 저장, 중력 에너지 저장, 용융염 열 저장과 같은 기술의 시범 적용을 장려합니다. 전고체 배터리(액체 대신 고체를 넣은 안전한 배터리), 히트펌프 전력저장, 열에너지 저장, 수소 에너지 저장 등 첨단 기술 보유량을 지원합니다. 네트워크 기반 에너지 저장 장치의 개발을 더욱 촉진합니다. 시나리오 요구에 따라 네트워크형 에너지 저장 장치의 레이아웃 및 적용을 적극적이고 꾸준히 추진하고, 네트워크형 에너지 저장 기술의 신뢰성과 전력망 지원 능력을 검증하며, 네트워크형 에너지 저장 장치 계획 및 구성, 장비 기술 요구 사항 등 표준 및 사양을 점진적으로 개선합니다."},{"s":"2개 부서: 대용량 및 고출력 배터리 에너지 저장에 대한 연구와 고출력 배터리 에너지 저장 및 슈퍼커패시터의 시범 적용을 촉진합니다.","so":"第一财经","tm":"11/13 16:12","c":2,"r":"cn","u":"https://www.yicai.com/brief/103439907.html","p":1794553920,"a":1794576147,"t":"两部门：研究大容量高比功率电池储能 推动高比功率电池储能、超级电容器试点应用","su":"국가발전개혁위원회와 국가에너지국은 '신에너지저장 실시계획 15차 5개년 계획'을 발표했다. 단기 고주파 전력 에너지 저장 기술 개발을 언급했다. 저비용, 고강도 소재, 고성능 베어링, 실생활 플라이휠 에너지 저장 소재를 개발합니다."},{"s":"삼성SDI, 주피터파워에 LFP 배터리 공급","so":"Yonhap News Agency","tm":"11/16 09:33","c":1,"r":"us","u":"https://en.yna.co.kr/view/AEN20261116002300320","p":1794789187,"a":1794789737,"t":"Samsung SDI to supply LFP batteries to Jupiter Power","su":"서울, 11월 16일(연합) -- 국내 2위 배터리 제조사인 삼성SDI가..."},{"s":"엠플러스, '전고체 배터리' 양산시장 뚫었다…글로벌 기업서 200억대 수주","so":"파이낸셜뉴스","tm":"11/16 08:46","c":1,"r":"kr","u":"https://www.fnnews.com/news/202611160844070909","p":1794786411,"a":1794789736,"su":"이차전지 조립장비 전문기업 엠플러스가 글로벌 기업으로부터 200억원대 전고체 배터리(액체 대신 고체를 넣은 안전한 배터리) 장비를 수주(일감 주문을 받는 것)하며 차세대 배터리 시장 공략에 속도를 내고 있다."},{"s":"중국 메이커가 JC-STAR 대응에 고전하는 이유── 태양광·축전지 사업자가 취해야 할 대응은","so":"ITmedia","tm":"11/16 07:00","c":1,"r":"jp","u":"https://www.itmedia.co.jp/smartjapan/articles/2611/16/news007.html","p":1794780000,"a":1794784865,"t":"中国メーカーがJC-STAR対応に苦戦する理由──太陽光・蓄電池事業者がとるべき対応は","su":"2027년 4월 이후, 태양광 발전·축전지의 계통 연계의 필수 요건이 되는 JC-STAR 제도에 대해 해설하는 본 연재. 후편이 되는 이번은, 공개되고 있는 ★1 적합 라벨 취득 제품 리스트를 분석해, 중국 메이커의 ★1 취득 상황과 그 배경, 그리고 태양광·축전지 사업자가 지금 해야 할 대응의 포인트에 대해서 해설한다."},{"s":"이시카리에 「국산」특고 축전소, 재에너지산지소에 공헌도(4페이지째)","so":"日経クロステック","tm":"11/16 05:00","c":1,"r":"jp","u":"https://xtech.nikkei.com/atcl/nxt/column/18/02443/110600187/?P=4","p":1794772800,"a":1794784868,"t":"石狩に「国産」特高蓄電所、再エネ地産地消に貢献も（4ページ目）","su":"JR 삿포로역에서 자동차로 북쪽으로 30분이 걸리지 않고, 이시카리시와 오타루시에 걸친 ‘이시카리만 신항’은 인구 230만명을 보유한 삿포로 경제권의 바다 현관구가 된다. 항구에 면한 약 3000ha의 광대한 지역은 홋카이도를 대표하는 공업단지와 유통거점으로 되어 있으며, 공장 외에 상업시설이나 호텔, 데이터센터(컴퓨터 수만 대를 모아 둔 건물), 물류센터 등 약 760개사가 진출해 2만명 이상이 일하고 있다."},{"s":"ESS Tech, Inc.의 주가(GWHTQ)를 실시간으로 확인해보세요","so":"CNBC","tm":"11/16 04:10","c":1,"r":"us","u":"https://www.cnbc.com/quotes/GWHTQ","p":1794769806,"a":1794784861,"t":"Check out ESS Tech, Inc.'s stock price (GWHTQ) in real time","su":"ESS(전기를 저장해 두는 큰 배터리) Tech, Inc.(GWHTQ:OTCQB) CNBC에서 실시간 주가, 뉴스, 가격 및 금융 정보를 받아보세요."},{"s":"테슬라 실적 발표 대본: 로봇 공학, 자율 주행 및 에너지 저장에 크게 투자하고 자본 지출이 계속 확대되고 있습니다.","so":"财联社","tm":"11/15 10:43","c":1,"r":"cn","u":"https://www.cls.cn/detail/2434633","p":1794707026,"a":1794727091,"t":"特斯拉财报会实录：大举押注机器人、自动驾驶与储能 资本开支持续扩张","su":"① 머스크는 실적(회사가 번 돈 성적표)발표에서 테슬라가 \"제2차 세계대전 이후 미국에서 가장 빠른 산업 규모 확장\"을 겪고 있다고 말하고, 올해 자본 지출이 250억 달러를 초과할 것으로 예상되며 향후 2~3년간 계속 증가할 것이라고 거듭 강조했다. ②테슬라 경영진은 휴머노이드(사람을 닮은 로봇) 로봇, 자율주행 택시, 에너지 저장장치, 자체 개발 칩 등 4대 주요 사업을 중심으로 자본 지출을 계속 늘릴 것이라고 밝히며 시장의 핵심 질문에 답했다. 차이롄서, 7월 23일(편집자 Liu Rui) 테슬라는 수요일 동부 표준시 시장 마감 후 2분기 재무 결과를 발표했습니다. 차량 납품 및 에너지저장장치 설치 데이터는 인상적이었지만 분기 매출총이익률 하락과 생산 확대에 대한 높은 투자로 시장 우려가 컸고, 장 마감 후 주가가 하락했다. 머스크 테슬라 최고경영자(CEO)는 실적 보고서 발표 후 컨퍼런스콜에서 “테슬라는 제2차 세계대전 이후 미국에서 가장 빠른 산업 규모 확장을 겪고 있다”며 “올해 자본 지출이 250억 달러를 넘어설 것으로 예상되며 향후 2~3년간 계속해서 성장할 것”이라고 거듭 강조했다."},{"s":"해외조사 및 선정 | 골드만삭스: 글로벌 배터리 수급 비율은 2029년 바닥을 칠 수 있고, 에너지 저장 성장은 초과분을 상쇄하기 어려울 것","so":"财联社","tm":"11/15 05:55","c":1,"r":"cn","u":"https://www.cls.cn/detail/2506034","p":1794689708,"a":1794727317,"t":"海外研选 | 高盛：全球电池供需比或2029年触底 储能增长难抵过剩","su":"① 미국은 전기차 배터리 과잉을 지속하고 있으나, 에너지 저장 배터리의 현지 생산 능력이 부족하다. ② 한국 배터리 업체들의 유럽 시장 점유율은 일부 안정됐지만, 중국의 수입 경쟁은 여전히 ​​치열하다. ③ 국내 배터리셀 제조사들은 2027년과 2028년 이익 전망치를 평균 10% 하향 조정했는데, CATL의 에너지 저장장치 전환이 유망하다. 차이롄서, 10월 15일(편집자 Xia Junxiong) 골드만삭스는 10월 14일 글로벌 배터리 산업 조사 보고서를 발표했습니다. 이는 에너지 저장 시장의 급속한 확장으로 배터리 수요 전망이 개선되고 있지만, 글로벌 배터리 산업은 여전히 ​​과잉 생산 능력, 지역 시장 수급 불균형 및 치열한 시장 경쟁에 직면해 있으며, 이는 업계가 사이클이 바닥을 쳤다는 것을 확인하기에 충분한 신호를 아직 보지 못했다는 것을 의미합니다. 은행은 중국 외 배터리 시장의 수급 공급률은 2027년을 바닥으로, 글로벌 시장은 2029년까지 수급 전환점이 이뤄지지 않을 것으로 내다봤다."},{"s":"화웨이, 새로운 20kW 가정용 배터리로 테슬라 파워월에 도전","so":"Electrek","tm":"11/15 01:25","c":1,"r":"us","u":"https://electrek.co/2026/11/14/huawei-set-to-challenge-tesla-powerwall-with-new-20-kw-home-battery/","p":1794673500,"a":1794698079,"t":"Huawei set to challenge Tesla Powerwall with new, 20 kW home battery","su":"이 하이테크 화웨이 홈 배터리 팩은 실리콘 카바이드 기술, AI 기반 에너지 관리 기능을 갖춘 테슬라의 최신 파워월을 저지하기를 희망합니다."},{"s":"에너지 저장 산업의 글로벌 협력을 촉진하기 위해 글로벌 에너지 저장 동맹 이니셔티브(Global Energy Storage Alliance Initiative) 발표","so":"财新","tm":"11/14 21:37","c":1,"r":"cn","u":"https://companies.caixin.com/2026-11-14/102504955.html","p":1794659820,"a":1794664813,"t":"全球储能联盟倡议发布 推动储能产业全球合作","su":"[Caixin.com] 글로벌 에너지 전환이 심화됨에 따라 새로운 전력 시스템의 핵심 인프라인 에너지 저장 장치는 글로벌 시장에서 꾸준히 수요가 증가하고 있습니다. 국제 교류와 협력을 촉진하는 방법은 중국의 에너지 저장 '세계화'의 다음 초점이 되었습니다. 이러한 배경에서 지난 11월 14일 제31차 유엔기후회의(COP31) 차이나코너에서 수력 및 물 보존 계획 및 설계 종합연구소, 중관촌 에너지저장산업기술연맹, 중국남방그리드에너지저장소(600995.SH)가 국내외 유수 기업들과 함께 글로벌 에너지 저장 동맹 이니셔티브(이하 이니셔티브)를 공동 출범시켰다. 동맹의 행동 방향에는 국제 대화 및 교환 플랫폼 구축, 글로벌 에너지 저장 데이터베이스 및 표준 시스템 구축, 첨단 기술의 연구 개발 및 홍보 강화, 시장 메커니즘 개선 및 비즈니스 모델 혁신 촉진, 공급망(부품·재료가 오가는 연결망) 협력 강화 및 글로벌 무역 발전 촉진, 투자, 자금 조달(사업에 쓸 돈을 모으는 것) 및 프로젝트 협력 촉진이 포함됩니다."},{"s":"에너지저장전지 ETF E펀드 순청약액은 11월 12일 기준 1,300만좌 감소해 전년 대비 36.09% 감소했다.","so":"经济观察网","tm":"11/14 11:49","c":1,"r":"cn","u":"http://www.eeo.com.cn/2026/1114/1092713.shtml","p":1794624540,"a":1794659877,"t":"储能电池ETF易方达11月12日净申购减少1300万份，近一年跌36.09%","su":"경제 관찰자 네트워크 에너지 저장 배터리 ETF(여러 주식을 묶어 파는 상품) E 펀드(159566)는 11월 12일 기준 -1,300만주의 순청약을 기록했으며 이는 이 ETF 펀드 지분의 0.55%를 차지합니다. 펀드의 최근 주식수는 23억5300만주로 상장(주식시장에 처음 들어오는 것) 이후 누적 증가액은 21억3200만주다. 최신 스케일 34...."},{"s":"본토는 새로운 에너지 저장 장치의 시장화를 촉진합니다.","so":"信報網站","tm":"11/14 03:26","c":1,"r":"hk","u":"https://www.hkej.com/dailynews/finnews/article/4565207/%E5%85%A7%E5%9C%B0%E6%8E%A8%E9%80%B2%E6%96%B0%E5%9E%8B%E5%84%B2%E8%83%BD%E5%B8%82%E5%A0%B4%E5%8C%96","p":1794594400,"a":1794610457,"t":"內地推進新型儲能市場化","su":"신흥 기간 산업을 적극적으로 육성하고 새로운 에너지 저장 장치를 적극적으로 개발하기 위해 국가 발전 개혁위원회와 국가 에너지 관리국은 공동으로 \"신 에너지 저장 장치 실행 계획을 위한 15차 5개년 계획\"(이하 \"계획\"이라고 함)을 발표했습니다. 15차 5개년 계획 기간 동안 신에너지 저장을 '대규모 개발'에서 '시장 지향적 개발' 단계로 추진하고 신 에너지 저장을 위한 다양한 응용 시나리오를 구축하며 신 에너지 저장 기술 혁신과 연구를 지원해야 한다고 제안되었습니다. 2030년까지 국가 신에너지 저장장치 설치 용량은 3억kW에 도달하고, 평균 에너지 저장 시간은 약 3시간이 되는 것이 목표다. 허베이의 설치 용량은 2030년까지 3억 킬로와트에 도달할 것으로 예상됩니다. \"계획\"에서는 15차 5개년 계획 기간 동안 새로운 에너지 저장 장치가 주로 시스템의 \"소스 네트워크\" 요구를 충족할 것이라고 지적합니다."},{"s":"美민주당 집권, 에너지저장산업 폭발 기대","so":"信報網站","tm":"11/14 03:20","c":1,"r":"hk","u":"https://www.hkej.com/dailynews/investment/article/4565313/%E7%BE%8E%E6%B0%91%E4%B8%BB%E9%BB%A8%E5%BE%97%E5%8B%A2+%E5%84%B2%E8%83%BD%E7%94%A2%E6%A5%AD%E6%96%99%E7%88%86%E7%99%BC","p":1794594007,"a":1794610460,"t":"美民主黨得勢 儲能產業料爆發","su":"미국 중간선거 이후 민주당은 상원과 하원을 다시 장악했다. 정치 판 전체가 바뀌었을 뿐만 아니라, 공화당의 본거지이자 미국 미래인공지능데이터센터(AIDC)의 중심지인 텍사스의 3선 주지사도 축출됐다. 시장에서는 다수의 AIDC 프로젝트가 전력 공급 계획을 재검토해야 하고 이로 인해 건설 속도가 위장 둔화될 수 있다는 점을 우려하고 있습니다. 중간선거가 시작된 뒤 필라델피아 반도체(전자기기의 두뇌 부품) 지수는 급락했고, AI주도 급락했다. 정책 기울기가 예상되어 많은 주에서 이를 배포하고 있습니다. 이번 중간선거 전체를 돌이켜보면 미국 국민들은 트럼프 대통령이 중동 전쟁을 촉발한 것뿐 아니라, 데이터센터를 대규모로 개발해 인구를 늘린 것에 대해 가장 불만을 품고 있다."},{"s":"퀀텀스케이프, 전고체 배터리 Osprey용 개방형 플랫폼 출시","so":"AutoTechInsight","tm":"11/14 02:49","c":1,"r":"world","u":"https://autotechinsight.spglobal.com/news/5291472/quantumscape-launches-open-platform-for-all-solid-state-batteries-osprey","p":1794592195,"a":1794610464,"t":"QuantumScape launches open platform for all-solid-state-batteries Osprey","su":"퀀텀스케이프는 1,000사이클 내구성과 5분 고속 충전, 저압 작동을 결합한 전고체 배터리(액체 대신 고체를 넣은 안전한 배터리) 플랫폼인 Osprey를 공개하여 QSE 셀을 넘어 기술 로드맵을 확장했습니다."},{"s":"ESS의 다음 단계, 진화하는 에너지 시장을 위한 LG에너지솔루션의 전략","so":"Energy-Storage.News","tm":"11/13 23:14","c":1,"r":"us","u":"https://www.energy-storage.news/the-next-phase-of-ess-lg-energy-solutions-strategy-for-an-evolving-energy-market/","p":1794579249,"a":1794610427,"t":"The next phase of ESS: LG Energy Solution’s strategy for an evolving energy market"},{"s":"납-탄소 에너지 저장 벤치마크 프로젝트가 품질 분쟁에 빠졌고 Jingwei Co., Ltd. 및 기타 자회사가 1억이 넘는 소송을 당했습니다 | 빠른 읽기 공지","so":"财联社电报","tm":"11/13 23:09","c":1,"r":"cn","u":"https://m.cls.cn/detail/2534236","p":1794578948,"a":1794628712,"t":"铅炭储能标杆项目陷质量纠纷 经纬股份子公司等被诉超1亿 | 速读公告","su":"중국금융신문(China Finance News)이 11월 13일 보도했다(뤄이첸 기자) 전력계획 컨설팅업체 징웨이유한공사(301390.SZ)가 소송으로 몸살을 앓고 있다. 수년 전 자사가 전액 출자한 자회사가 참여한 납-탄소 에너지 저장 벤치마크 프로젝트는 배터리 품질 문제로 기소되어 법원에 고소를 당했다. 이로 인해 2026년 1월 17일부터 현재까지 Jingwei Co., Ltd.와 그 두 자회사가 피고인으로 관련된 소송, 중재 및 기타 문제에 관련된 총액은 1억 8백만 위안에 달했습니다. 상장(주식시장에 처음 들어오는 것)회사는 자사의 전액 출자 자회사인 Hangzhou Hongsheng Electric Power Design Consulting Co., Ltd.(이하 \"Hongsheng Electric Power\")가 최근 \"피신청인 통지\"를 받았다고 오늘 발표했습니다. Power Investment Zhejiang Storage (Changxing) Smart Energy Co., Ltd. (이하 \"Power Investment Zhejiang Storage\")는 원고로서 Hongsheng Electric Power를 상대로 소송을 제기했으며 Zhejiang Taihu Energy Valley Technology Co., Ltd. (이하 \"Taihu Energy Valley\")와 Zhejiang Changxing Electrical Engineering Co., Ltd. (이하 \"Changxing Electric\")는 다음 사항으로 인한 방전 손실에 대해 공동으로 보상했습니다. 배터리 품질 문제, 자본 점유 기간 동안의 이자, 배터리 교체 손실, 이 사건으로 인해 지불된 법적 비용 및 기타 비용 총 1억 3백만 위안."},{"s":"저장성: 2026 이우 신에너지 및 에너지 저장 수출 박람회 개막","so":"中国新闻网","tm":"11/13 22:22","c":1,"r":"cn","u":"https://www.chinanews.com.cn/cj/2026/11-13/10731735.shtml","p":1794576155,"a":1794610431,"t":"浙江：2026义乌新能源与储能出口博览会启幕","su":"저장성: 2026 이우 신에너지 및 에너지 저장 수출 박람회가 중국 이우에서 11월 13일 개최됩니다. (Dong Yixin, Gong Shuhong) \"테스트 결과, 태양광 발전소를 5일 이상 청소하지 않으면 발전 수익이 20~30% 직접적인 영향을 받는 것으로 나타났습니다.\" 11월 13일, 2026년 이우 신에너지 및 에너지 저장 수출 박람회가 저장성 이우에서 개막했습니다. 현장에서 후베이의 광전지 지능형 청소 장비 전문 전시업체인 Fang Changsheng은 이렇게 말했습니다. 부스에서는 태양광 스마트 청소장비가 슬라이드레일을 타고 규칙적으로 앞뒤로 미끄러지는 모습을 보였다. 내장된 태양광 패널은 또한 에너지 자급자족을 달성할 수 있어 우간다와 파키스탄의 구매자를 빠르게 끌어 모았습니다. 우간다 바이어인 Sam은 \"이것은 확실히 태양광 발전을 위한 가장 중요한 지원 제품이 될 것이며 우리는 그것에 매우 관심이 있습니다\"라고 말했습니다."},{"s":"새로운 에너지 저장 장치는 새로운 시장화 단계에 진입했으며 '15차 5개년 계획'에서는 3억 kW의 개발 목표를 설정했습니다.","so":"第一财经","tm":"11/13 21:53","c":1,"r":"cn","u":"https://www.yicai.com/news/103440392.html","p":1794574403,"a":1794576149,"t":"新型储能迈入市场化新阶段，“十五五”方案划定3亿千瓦发展目标","su":"11월 13일 국가발전개혁위원회와 국가에너지청은 공동으로 '15차 5개년 계획 신에너지저장 구현계획'(이하 '계획')을 발표했는데, 이 계획에서는 2030년까지 신에너지저장장치가 대규모 개발단계에서 시장지향적 개발단계로 진입할 것임을 명시했다. 국가 신에너지 저장장치 설치 용량은 3억kW에 달하고, 평균 에너지 저장 시간은 약 3시간이 될 전망이다. \"계획\"은 \"15차 5개년 계획\" 기간 동안 신에너지 저장 장치가 주로 시스템의 \"소스, 그리드 및 부하\" 측면의 일중 조정 요구를 충족하고, 신에너지 소비 촉진, 전력 공급 보장, 전력 시스템의 안전하고 안정적인 운영 지원을 위한 신에너지 저장 장치의 적용을 심화하고, 혁신적인 응용 시나리오를 확장하고 신에너지의 비전기적 활용 실천을 지원한다는 전체 요구 사항을 명시합니다. 동시에, 제도적 메커니즘과 비즈니스 모델의 혁신을 가속화해야 하며, 새로운 에너지 저장 장치의 가치를 합리적으로 반영하는 전력 시장 메커니즘과 가격 메커니즘이 더욱 완전해지고, 새로운 에너지 저장 장치의 안정적인 용량 가치가 더 잘 반영될 수 있습니다."},{"s":"마켓 오픈 후 에너지저장 혜택이 옵니다!","so":"21财经","tm":"11/13 20:01","c":1,"r":"cn","u":"https://www.21jingji.com/article/20261113/herald/b9cce244c32cd152cb230552f8976edf.html","p":1794567700,"a":1794576152,"t":"盘后，储能利好来了！","su":"[소개] 국가발전개혁위원회와 국가에너지국은 '15차 5개년 계획 신에너지 저장 실시 계획'을 발표했습니다. 중국 기금 뉴스 기자 Chen Xi 신에너지 저장과 관련하여 좋은 소식이 다가오고 있습니다! 11월 13일 국가발전개혁위원회 공식 홈페이지에는 국가발전개혁위원회와 국가에너지청이 '15차 5개년 계획 신에너지저장 시행계획'(이하 '시행계획')을 발표했다고 밝혔다. \"구현 계획\"에서는 \"15차 5개년 계획\" 기간 동안 새로운 에너지 저장 장치가 전력 시스템, 소스, 그리드, 부하 및 저장의 모든 링크의 통합과 상호 작용을 효과적으로 촉진하고 더욱 다양한 가치를 발휘하며 새로운 전력 시스템 구축을 지원할 것이라고 지적합니다. 2030년까지 신에너지저장장치는 대규모 개발단계에서 시장지향적 개발단계로 전환될 것이다. 국가 신에너지 저장장치 설치 용량은 3억kW에 달하고, 평균 에너지 저장 시간은 약 3시간이 될 전망이다."},{"s":"쉬지 않고 은퇴하고 폐기물을 보물로 전환 - State Grid Nanjing Power Supply Company는 기업의 폐기된 에너지 저장 배터리 재활용을 촉진합니다.","so":"ThePaper.cn","tm":"11/13 19:55","c":1,"r":"cn","u":"https://www.thepaper.cn/newsDetail_forward_34468912","p":1794567324,"a":1794610435,"t":"退而不休 变废为宝——国网南京供电公司推动企业退役储能电池循环利用","su":"11월 11일, State Grid Nanjing Power Supply Company의 Liuhe 전원 공급 서비스 센터 주요 계정 관리자는 난징 공공 Ganfeng 폐기 리튬 배터리 종합 활용 프로젝트의 1단계에 참여하여 전기 안전 검사 및 기술을 수행했습니다."},{"s":"검사관리부터 ESS 진단까지…전기안전 혁신 관통하는 키워드 ‘AI’","so":"전기신문","tm":"11/13 19:17","c":1,"r":"kr","u":"https://www.electimes.com/news/articleViewAmp.html?idxno=374736","p":1794565020,"a":1794628711,"su":"검사관리부터 ESS(전기를 저장해 두는 큰 배터리) 진단까지…전기안전 혁신 관통하는 키워드 ‘AI’ 2026 KESCO 우수사례 경진대회 12-13일 개최…분야별 우수사례 대상 선정 업무 효율화부터 설비 진단·정보 전달까지…현장 개선 경험 공유·확산 우리 일상에 자리 잡은 인공지능(AI)이 이제 전기안전 현장의 혁신을 관통하는 핵심 키워드로 떠오르고 있다. 검사·점검 관리부터 설비 상태 분석, 고객에게 진단정보를 전달하는 방식까지 AI와 디지털 기술을 접목한 업무 개선 사례들이 주목받고 있다."},{"s":"두 부서는 '15차 5개년 계획을 위한 신에너지 저장 구현 계획'을 발표했으며, 전국 신에너지 저장 장치 설치 용량은 3억 킬로와트에 도달했습니다.","so":"Now 新聞","tm":"11/13 18:48","c":1,"r":"hk","u":"https://news.now.com/home/international/player?newsId=669495","p":1794563304,"a":1794576154,"t":"兩部門印發《「十五五」新型儲能實施方案》 全國新型儲能裝機規模達到3億千瓦","su":"[지금 뉴스 채널] 국가발전개혁위원회와 국가에너지국은 오늘(13일) '15차 5개년 계획' 신에너지저장 구현계획(이하 '시행계획')을 발표해 '15차 5개년 계획'이 신에너지저장장치를 대규모 개발 단계에서 시장지향적 개발 단계로 촉진하고 신에너지저장장치의 다각화된 응용 시나리오를 구축하며 신에너지저장 기술 혁신과 연구를 지원하고 개발의 주요 목표도 제시한다는 점을 명확히 했다. '15차 5개년 계획' 기간 동안 신에너지 저장장치를 구축한다."},{"s":"포시즈 HD[3726]：주식회사 넥스타와의 계통용 축전지 설비에 있어서의 포괄 매매 계약 체결 및 저압 계통용 축전소 사업에의 대처에 대한 공지 2026년 11월 13일(적시 공개)","so":"日本経済新聞","tm":"11/13 18:00","c":1,"r":"jp","u":"https://www.nikkei.com/nkd/disclosure/tdnr/20261113580245/","p":1794560400,"a":1794632188,"t":"フォーシーズＨＤ[3726]：株式会社ネクスタとの系統用蓄電池設備における包括売買契約締結及び 低圧系統用蓄電所事業への取り組みについてのお知らせ 2026年11月13日(適時開示) ：日経会社情報DIGITAL","su":"2026년 11월 13일 포시즈 HD[3726]의 공개 자료 “주식회사 넥스타와의 계통용 축전지 설비에 있어서의 포괄 매매 계약 체결 및 저압 계통용 축전소 사업에의 대처에 대한 알림”을 열람할 수 있습니다. 자료는 PDF로 다운로드 가능"},{"s":"신규 스토리지 관련 주요 정책을 공개합니다! Enjie 주가는 3% 이상 하락했고, 배터리 ETF China Universal(159796) 지수는 2% 이상 하락해 이틀 연속 약한 하락세를 보였습니다! 중국의 대규모 국내 보유고 가격이 상승하고 있으며, 신흥 시장에서는 가계 저축이 장악하고 있습니다.","so":"Jiemian.com","tm":"11/13 17:57","c":1,"r":"cn","u":"https://www.jiemian.com/article/15331355.html","p":1794560226,"a":1794610440,"t":"事关新型存储，重磅政策发布！恩捷股份跌超3%，电池ETF汇添富(159796)指数跌超2%，弱势两连阴！国内大储量价齐升，户储新兴市场接力","su":"11월 13일, A주 시장은 등락을 거듭하며 후퇴했으며, 상하이 증권 거래소 지수는 0.59% 하락했습니다. 시장심리는 다시 약화됐다. 두 도시에서 4,700개 이상의 주식이 하락했습니다. 오후 들어 배터리 업종의 하락 폭이 확대됐다. 장 마감 기준 배터리 ETF(여러 주식을 묶어 파는 상품) 차이나 유니버셜(159796)의 기초지수는 2% 이상 하락하며 2회 연속 마이너스 실적(회사가 번 돈 성적표)을 기록했다."},{"s":"Shaoyang Hydraulic : 컨소시엄이 4억 6200만 위안의 에너지 저장 프로젝트 계약을 체결했습니다.","so":"Jiemian.com","tm":"11/13 17:51","c":1,"r":"cn","u":"https://www.jiemian.com/article/15331419.html","p":1794559877,"a":1794610444,"t":"邵阳液压：联合体签署4.62亿元储能项目合同","su":"Shaoyang Hydraulic은 11월 13일, 회사가 Huazi Technology와 구성된 컨소시엄이 China Metallurgical Group II가 발행한 \"입찰 통지서\"를 받고 바오딩(Baoding)의 200MW/600MWh 네트워크 기반 독립 에너지 저장 프로젝트를 위한 에너지 저장 시스템 장비 및 부스터 스테이션 장비를 수주(일감 주문을 받는 것)했다고 밝혔습니다. 최근 회사는 China Metallurgical Group Co., Ltd.와 '의향금 계약'을 체결했습니다. 동시에 회사와 Huazi Technology가 구성한 컨소시엄은 China Metallurgical Group Co., Ltd.의 건설 엔지니어링 기술 지점과 \"자재 조달 계약\"을 체결했습니다. 계약 가격은 RMB 4억 6200만(세금 포함)으로 낙찰 금액과 일치했습니다. 회사는 약 1억 8천만 위안(세금 포함)의 공급 및 서비스 금액을 맡을 것으로 예상됩니다. Shaoyang Hydraulic: 컨소시엄은 4억 6200만 위안 규모의 에너지 저장 프로젝트 계약을 체결했습니다. 원래 뉴스 출처: Jiemian News Shaoyang Hydraulic - Institutional Vane | Shaoyang Hydraulic (301079)은 2026년 3분기에 5개의 지주 기관만 공개했습니다. - Shaoyang Hydraulic: 컨소시엄이 4억 6200만 위안 규모의 에너지 저장 시스템 장비 프로젝트 입찰에서 승리했습니다."},{"s":"2개 부서: 슈퍼커패시터, 압축 이산화탄소 에너지 저장, 액체 공기 에너지 저장, 중력 에너지 저장, 용융염 열 저장과 같은 기술의 시범 적용을 장려합니다.","so":"Jiemian.com","tm":"11/13 16:08","c":1,"r":"cn","u":"https://www.jiemian.com/article/15330777.html","p":1794553738,"a":1794610452,"t":"两部门：鼓励超级电容、压缩二氧化碳储能、液态空气储能、重力储能、熔盐储热等技术试点应用","su":"국가발전개혁위원회와 국가에너지국은 '신에너지저장 실시계획 15차 5개년 계획'을 발표했다. 이 계획은 새로운 에너지 저장 혁신 방향의 과학적인 레이아웃을 제안합니다. 리튬이온 배터리 에너지 저장의 반복적 업그레이드를 가속화하고 나트륨 이온 배터리(리튬 대신 소금 성분을 쓰는 배터리) 에너지 저장의 적용을 촉진합니다. 압축공기 에너지 저장장치, 흐름전지 에너지 저장장치, 플라이휠 에너지 저장장치 등을 파일럿 애플리케이션에서 상용 애플리케이션으로 전환을 촉진합니다. 슈퍼커패시터, 압축 이산화탄소 에너지 저장, 액체 공기 에너지 저장, 중력 에너지 저장, 용융염 열 저장과 같은 기술의 시범 적용을 장려합니다. 전고체 배터리(액체 대신 고체를 넣은 안전한 배터리), 히트펌프 전력저장, 열에너지 저장, 수소 에너지 저장 등 첨단 기술 보유량을 지원합니다."},{"s":"Wiltshire Rivals 부지에 설치된 대형 배터리에 수백 명이 반대","so":"BBC","tm":"11/13 15:22","c":1,"r":"world","u":"https://www.bbc.com/news/articles/cmze757jx001o","p":1794550958,"a":1794553620,"t":"Hundreds object to huge batteries on Wiltshire Rivals estate","su":"배터리가 보관될 시골 사유지에서는 월드 뮤직 페스티벌 WOMAD도 개최됩니다."},{"s":"Xos 에너지저장장치 파워허브(Power Hub) 양산 본격화, 2027년 전력사업이 전기트럭 추월 전망","so":"鉅亨網","tm":"11/13 11:00","c":1,"r":"tw","u":"https://news.cnyes.com/news/id/6661425","p":1794535241,"a":1794539839,"t":"Xos儲能Power Hub投入量產盼2027年電力業務超越電動卡車","su":"Xos 에너지저장장치 파워허브, 2027년 전력사업이 전기트럭 추월 기대하며 양산 돌입 Uanalyze 2026년 11월 13일(Uanalyze/산업데이터센터(컴퓨터 수만 대를 모아 둔 건물) 보고서) ⸺ 미국 전기상용차 및 전력기기 제조사 Xos(XOS-US)는 최근 420kWh 용량의 파워허브 에너지저장장치가 양산에 들어갔다고 밝혔다. 수요가 유틸리티, 엔지니어링 임대 및 데이터 센터로 확대됨에 따라 회사는 Power Hub를 중심으로 하는 전력 사업이 2027년에는 트럭 및 전기 자동차 충전을 능가하여 최대 사업이 될 것으로 예상하고 있습니다. Power Hub는 발전기와 결합하여 전력 사용량이 가장 많을 때 전력을 공급할 수 있으므로 발전기는 더 짧은 시간에 배터리 충전에 집중할 수 있어 저부하에서 장기간 작동하는 동안 연료 및 유지 관리 비용이 절감됩니다. Xos는 고객 발전기를 자동으로 시작하고 중지하는 시스템 기능을 입증했으며 대규모 데이터 센터 엔지니어링 계약자와도 협력하고 있습니다. 현재 고객들은 해당 장비가 데이터센터의 정식 운영 중에 부하를 추가로 지원할 수 있는지, 더 이상 건설 현장 장비 충전에만 사용되지 않는지 평가하고 있습니다."},{"s":"Juheng-Chuang, Yaohua와 손잡고 내년 6월 완공 예정인 에너지 저장 시스템 구축 - 뉴스","so":"MoneyDJ","tm":"11/13 10:48","c":1,"r":"tw","u":"https://www.moneydj.com/kmdj/news/newsviewer.aspx?a=403efb6d-881d-472f-a450-d1f0d8071c14","p":1794534480,"a":1794539841,"t":"聚恆-創攜手燿華建置儲能系統明年6月完工- 新聞","su":"Juheng-Chuang(4582)은 산업용 및 상업용 계량기 뒤(BTM) 에너지 저장 시장을 계속 확장하고 있습니다. PCB 제조업체 Yaohua(2367)와 손을 잡고 대만 이란현 공장에 5.04MW/10.03MWh 규모의 대규모 BTM 에너지 저장 시스템을 구축했다고 발표했습니다. 2027년 6월 완공 예정이다. 급전용 스마트 에너지 관리 시스템을 통해 연간 전기요금을 1,2..."},{"s":"해외일보｜징둥닷컴, 독일 CECONOMY 지분 약 59.8% 13억 3500만 유로에 인수, Junda 주식, 오만 5GW 배터리 프로젝트 종료","so":"Jiemian.com","tm":"11/13 10:39","c":1,"r":"cn","u":"https://www.jiemian.com/article/15328727.html","p":1794533942,"a":1794539831,"t":"出海日报｜京东13.35亿欧元收购德国CECONOMY约59.8%股权，钧达股份终止阿曼5GW电池项目","su":"징둥닷컴은 독일 CECONOMY AG 지분(회사를 나눠 가진 몫) 약 59.8%를 13억 3,500만 유로에 인수했습니다. 11월 12일, 징둥닷컴은 독일 소비자 가전 소매 그룹인 CECONOMY AG에 대한 자발적인 공개 인수 제안을 완료했다고 발표했습니다. 이를 통해 총 13억 3,500만 유로에 해당하는 자본금의 59.8%와 의결권을 인수했습니다. 거래가 완료되면 CECONOMY는 징둥닷컴의 자회사가 되며 11월 12일부터 징둥닷컴의 연결 재무제표에 포함될 예정입니다. 파트너 Convergenta가 보유한 지분 25.3%를 포함하면 두 당사자는 CECONOMY 지분의 총 약 85.2%를 보유합니다. 이번 인수는 징둥닷컴이 간접적으로 전체 지분을 소유한 자회사를 통해 이루어졌으며, 제안 가격은 주당 현금 4.60유로였습니다. CECONOMY는 MediaMarkt 및 Saturn과 같은 가전제품 소매 브랜드를 소유하고 있으며 유럽 11개 국가 및 지역에서 1,000개 이상의 실제 매장을 운영하고 있습니다. 기존 합의에 따라 CECONOMY는 현지 관리팀과 기술 구조를 유지하면서 유럽에서 계속 독립적으로 운영될 것입니다."},{"s":"글로벌 에너지저장 학술교류 플랫폼 구축을 위해 제1회 글로벌 에너지저장 학술포럼이 샤먼에서 개최됐다.","so":"人民网-福建频道","tm":"11/13 10:07","c":1,"r":"cn","u":"http://fj.people.com.cn/n2/2026/1113/c181466-41749893.html","p":1794532020,"a":1794539833,"t":"搭建全球储能学术界交流平台 首届环球储能学术论坛在厦门举行","su":"인민일보 온라인, 샤먼, 11월 13일(Yu Nailiu) 에너지 저장의 미래를 탐구하기 위한 세계적인 지혜를 모으십시오. 지난 12일, 제1회 글로벌 에너지 저장 학술 포럼 '프론티어 대화·미래를 위한 지능 저장'이 샤먼에서 열렸습니다. 이번 행사에는 국제 에너지저장 분야의 유명 학자, 전문가, 학자, 업계 대표들이 한자리에 모여 에너지저장 과학기술에 대해 논의했다."},{"s":"뉴욕주, 2030년까지 6GW 목표 달성을 위해 1GW 대규모 에너지 저장 입찰 시작","so":"鉅亨網","tm":"11/13 10:00","c":1,"r":"tw","u":"https://news.cnyes.com/news/id/6661288","p":1794531616,"a":1794539842,"t":"紐約州啟動1GW大型儲能招標朝2030年6GW目標推進","su":"뉴욕주, 2030년 6GW 목표 달성을 위해 1GW 대규모 에너지 저장 입찰 시작 Uanalyze 2026년 11월 13일(Uanalyze/Industry Data Center Report) ⸺ 뉴욕주는 2차 대규모 에너지 저장 입찰을 공식적으로 시작했으며, 약 1GW의 에너지 저장 용량을 구매할 것으로 예상되며, 2030년에 6GW 에너지 저장 장치를 배치한다는 정책 목표를 지속적으로 추진할 예정입니다. 뉴욕 주 에너지 입찰 처리를 담당하는 연구개발청(NYSERDA)은 개발자가 12월 15일 이전에 자격 신청서를 제출하고 프로젝트 선택의 2단계에 들어가기 전에 검토를 통과해야 한다고 밝혔습니다. 이번 입찰은 1차 조달 라운드를 따릅니다. 뉴욕주는 첫 번째 라운드에서 총 용량이 950MW에 달하는 8개의 대규모 에너지 저장 프로젝트와 계약을 체결했습니다. 두 번째 라운드의 규모는 약 1GW로, 전력망의 파견 가능한 에너지 저장 자원을 더욱 확장할 것입니다."}]},{"name":"🏭 AI 전력","note":"보유: ACE 코리아AI전력TOP10","breaking":false,"items":[{"s":"남부발전, 두산에너빌리티와 발전기 디지털 정비 체계 구축","so":"한국경제","tm":"11/13 10:48","c":17,"r":"kr","u":"https://www.hankyung.com/article/202611134761h","p":1794534518,"a":1794539853,"su":"AI 추천 뉴스 남부발전, 두산에너빌리티와 발전기 디지털 정비 체계 구축 한국남부발전이 국산화에 성공한 발전기 핵심 기술의 상용화를 위한 현장 개방을 추진한다. 남부발전은 12일 경남 창원 두산에너빌리티 본사에서 두산에너빌리티와 ‘발전기 브러시 모니터링 시스템(B-EYES) 실증 및 디지털 정비 체계 구축을 위한 업무협약’을 체결했다고 밝혔다. 협약식에는 송상옥 남부발전 발전처장과 이광열 두산에너빌리티 파워서비스 설계·생산총괄 전무 등 양사 주요 관계자들이 참석했다."},{"s":"효성중공업 노조 2차 파업 돌입…사측 \"법·원칙 따라 충실히 교섭\"","so":"뉴시스","tm":"11/13 10:06","c":4,"r":"kr","u":"https://mobile.newsis.com/view_amp.html?ar_id=NISX20261113_0003866756","p":1794531993,"a":1794539853,"su":"[서울=뉴시스]유희석 기자 = 효성중공업 사무기술직 노동조합이 13일부터 30일까지 전면 파업에 돌입한 가운데, 사측은 교섭을 거부한 것이 아니라 실질적인 협의를 위한 일정 조정을 제안한 것이라고 반박했다"},{"s":"미국 양당이 도입한 강세 법안에 편승해 전력 및 에너지 ETF는 자금 전망을 갖고 있습니다.","so":"UDN","tm":"11/16 04:51","c":2,"r":"tw","u":"https://udn.com/news/amp/story/123006/9880423","p":1794772294,"a":1794784880,"t":"搭上美國兩黨合推法案利多 電力能源ETF有錢景","su":"미국 상원이 중간선거 이후 미국 최초의 주요 합동 입법 조치인 초당적 미국 일자리 창출법(BAAJA) 발의안을 통과시켰습니다. 주요 목적은 발전소, 천연가스 파이프라인, 송전선 및 기타 에너지 건설의 검토 프로세스를 단순화하고 가속화하기 위한 준비를 하는 것입니다."},{"s":"김정관 산업장관, 체코 원전사업 정상 추진 약속“결과로 책임질 것”","so":"이투데이","tm":"11/14 07:28","c":2,"r":"kr","u":"https://www.etoday.co.kr/news/view/2648134","p":1794608880,"a":1794659885,"su":"한·체코 산업장관 화상 면담두코바니 원전사업 이행 논의양국 장관 월 1회 소통 추진▲김정관 산업통상부 장관이 9일 국회 산업통상자원중소벤처기업위"},{"s":"중국과 티베트가 내려다보이는 곳 | 나그취(Nagqu)의 고지대 3개 현에서 태양광발전소 가동, 전력 불안정에 작별 인사","so":"TVB","tm":"11/16 09:00","c":1,"r":"hk","u":"https://news.tvb.com/tc/1206208-%E4%BF%AF%E7%9E%B0%E7%A5%9E%E5%B7%9E%E8%A5%BF%E8%97%8F%E9%82%A3%E6%9B%B2%E9%AB%98%E6%B5%B7%E6%8B%94%E4%B8%89%E7%B8%A3%E5%85%89%E4%BC%8F%E6%8A%95%E9%81%8B%E5%91%8A%E5%88%A5%E9%9B%BB%E5%8A%9B%E4%B8%8D%E7%A9%A9","p":1794787200,"a":1794789745,"t":"俯瞰神州‧西藏｜那曲高海拔三縣光伏投運 告別電力不穩","su":"최근 티베트 나그쿠(Nagqu)의 3개 고지대 태양광 프로젝트가 완료되어 지역 주민들에게 보다 안정적인 녹색 전력 공급을 제공하고 있습니다. Shuanghu, Bangor 및 Rui 카운티는 과거의 극심한 기후로 인한 전력 불안정에 작별을 고할 것이며 안정적인 녹색 전력으로 난방, 의료, 교육 등 사람들의 생계 요구를 계속 충족할 것입니다. Shuanghu 태양광 발전소가 연간 발전량 1,559만kWh로 가동됩니다. 솽후(雙湖)현은 해발 약 5,000m로 중국에서 해발이 가장 높은 현이다. 새로운 10MW 태양광 발전소는 16,000개 이상의 발전소로 구성됩니다..."},{"s":"북미 데이터 센터 전력 부족이 거의 두 배로 늘었고, 마이크로그리드는 전력 칩에 대한 기회의 창을 촉발했습니다.","so":"DIGITIMES","tm":"1 ze 2026-11-13 17:00 2026년 11월 13일 (Uanalyze/산업데이터센터 리포트) ⸺ AI 데이터센터 전력수요는 지속적으로 증가하고 있으나, 대형 발전장비 공급이 따라가지 못하고 있다. 인도 발전기 제조사 TD 파워시스템즈(533553-IN)는 최근 기자회견을 통해 지금까지 주요 고객사에 대한 장비 납품 기간이 단축되지 않았으며, 신규 생산능력은 2028~2029년에야 출범할 것이라고 지적했다. 회사는 2030년까지 연장되는 생산능력 확보 방안을 고객들과 논의한 바 있으며, 단기적으로 타이트한 공급 상황은 여전히 ​​개선되기 어렵다."},{"s":"보그워너는 데이터 센터 전력으로 확장하면서 터빈 매출 3억 달러를 목표로 하고 있습니다.","so":"Yahoo Finance","tm":"11/13 20:14","c":1,"r":"us","u":"https://finance.yahoo.com/technology/articles/borgwarner-targets-300-million-turbine-111449615.html","p":1794568489,"a":1794576164,"t":"BorgWarner Targets $300 Million in Turbine Revenue as It Expands Into Data Center Power","su":"보그워너(NYSE:BWA)는 자동차 공급업체가 데이터 센터 및 산업용 전력 시장용 장비로 확장함에 따라 새로운 터빈 발전기 사업이 2027년에 3억 달러의 수익을 창출할 것으로 예상하고 있습니다. CEO Joe Fadool은 회사가 자동차 제품용으로 개발된 기술을 사용하여"},{"s":"New Era 데이터센터 1단계 건설 비용은 기존 모듈식 개발 비용의 절반에도 미치지 못할 것으로 추산됩니다.","so":"鉅亨網","tm":"11/13 19:41","c":1,"r":"tw","u":"https://news.cnyes.com/news/print/6661281","p":1794566472,"a":1794628721,"t":"New Era資料中心改採模組化開發一期建置成本估低於傳統一半","su":"뉴에라(New Era) 데이터센터(컴퓨터 수만 대를 모아 둔 건물) 모듈화 1단계 건설비용은 기존 건설비용의 절반에도 미치지 못할 것으로 추산된다. 대규모 글로벌 기술 회사와 공식 임대 계약을 맺고 자체 팀에서 개발할 예정입니다. 회사의 초기 추정치는 모듈식 건설 비용이 동일한 규모의 기존 개발 프로젝트의 절반 미만일 수 있다는 것입니다. 그러나 아직 임대 계약이 체결되지 않았으며 최종 자금 요구 사항은 여전히 ​​프로젝트 범위, 지불 일정 및 배송 책임 분할에 따라 다릅니다."},{"s":"데이터 센터 신설에 암운? 소프트뱅크 G의 6000억엔 손실도 읽어 낸다","so":"日本経済新聞","tm":"11/13 19:30","c":1,"r":"jp","u":"https://www.nikkei.com/article/DGXZQOCD09B780Z01C26A1000000/","p":1794565800,"a":1794576166,"t":"データセンター新設に暗雲？ ソフトバンクGの6000億円損失も読み解く","su":"미국 중간선거 후 인공지능(AI) 관련주의 주가 움직임이 거칠어지고 있다. 시장이 경계하는 것은 AI에 대한 수요 자체만이 아닙니다. AI를 움직이기 위한 거대한 데이터 센터를 계획대로 건설할 수 있을까. 전력 부족이나 건설 규제, 부풀어 오르는 자금 조달(사업에 쓸 돈을 모으는 것) 비용이 새로운 우려 재료가 되고 있습니다. 11월 3일 미주지사선에서는 데이터센터(컴퓨터 수만 대를 모아 둔 건물) 건설계획이 집중되는 주에서 민주당 후보가 잇따라 승리했습니다. JP 모건 애셋 매니지"},{"s":"보고서에 따르면 데이터 센터 투자자들은 기후 위험을 과소평가합니다","so":"Bloomberg.com","tm":"11/13 16:00","c":1,"r":"us","u":"https://www.bloomberg.com/news/articles/2026-11-13/dat
