aulic은 11월 13일, 회사가 Huazi Technology와 구성된 컨소시엄이 China Metallurgical Group II가 발행한 \"입찰 통지서\"를 받고 바오딩(Baoding)의 200MW/600MWh 네트워크 기반 독립 에너지 저장 프로젝트를 위한 에너지 저장 시스템 장비 및 부스터 스테이션 장비를 수주(일감 주문을 받는 것)했다고 밝혔습니다. 최근 회사는 China Metallurgical Group Co., Ltd.와 '의향금 계약'을 체결했습니다. 동시에 회사와 Huazi Technology가 구성한 컨소시엄은 China Metallurgical Group Co., Ltd.의 건설 엔지니어링 기술 지점과 \"자재 조달 계약\"을 체결했습니다. 계약 가격은 RMB 4억 6200만(세금 포함)으로 낙찰 금액과 일치했습니다. 회사는 약 1억 8천만 위안(세금 포함)의 공급 및 서비스 금액을 맡을 것으로 예상됩니다. Shaoyang Hydraulic: 컨소시엄은 4억 6200만 위안 규모의 에너지 저장 프로젝트 계약을 체결했습니다. 원래 뉴스 출처: Jiemian News Shaoyang Hydraulic - Institutional Vane | Shaoyang Hydraulic (301079)은 2026년 3분기에 5개의 지주 기관만 공개했습니다. - Shaoyang Hydraulic: 컨소시엄이 4억 6200만 위안 규모의 에너지 저장 시스템 장비 프로젝트 입찰에서 승리했습니다."},{"s":"2개 부서: 슈퍼커패시터, 압축 이산화탄소 에너지 저장, 액체 공기 에너지 저장, 중력 에너지 저장, 용융염 열 저장과 같은 기술의 시범 적용을 장려합니다.","so":"Jiemian.com","tm":"11/13 16:08","c":1,"r":"cn","u":"https://www.jiemian.com/article/15330777.html","p":1794553738,"a":1794610452,"t":"两部门：鼓励超级电容、压缩二氧化碳储能、液态空气储能、重力储能、熔盐储热等技术试点应用","su":"국가발전개혁위원회와 국가에너지국은 '신에너지저장 실시계획 15차 5개년 계획'을 발표했다. 이 계획은 새로운 에너지 저장 혁신 방향의 과학적인 레이아웃을 제안합니다. 리튬이온 배터리 에너지 저장의 반복적 업그레이드를 가속화하고 나트륨 이온 배터리(리튬 대신 소금 성분을 쓰는 배터리) 에너지 저장의 적용을 촉진합니다. 압축공기 에너지 저장장치, 흐름전지 에너지 저장장치, 플라이휠 에너지 저장장치 등을 파일럿 애플리케이션에서 상용 애플리케이션으로 전환을 촉진합니다. 슈퍼커패시터, 압축 이산화탄소 에너지 저장, 액체 공기 에너지 저장, 중력 에너지 저장, 용융염 열 저장과 같은 기술의 시범 적용을 장려합니다. 전고체 배터리(액체 대신 고체를 넣은 안전한 배터리), 히트펌프 전력저장, 열에너지 저장, 수소 에너지 저장 등 첨단 기술 보유량을 지원합니다."},{"s":"Wiltshire Rivals 부지에 설치된 대형 배터리에 수백 명이 반대","so":"BBC","tm":"11/13 15:22","c":1,"r":"world","u":"https://www.bbc.com/news/articles/cmze757jx001o","p":1794550958,"a":1794553620,"t":"Hundreds object to huge batteries on Wiltshire Rivals estate","su":"배터리가 보관될 시골 사유지에서는 월드 뮤직 페스티벌 WOMAD도 개최됩니다."},{"s":"Xos 에너지저장장치 파워허브(Power Hub) 양산 본격화, 2027년 전력사업이 전기트럭 추월 전망","so":"鉅亨網","tm":"11/13 11:00","c":1,"r":"tw","u":"https://news.cnyes.com/news/id/6661425","p":1794535241,"a":1794539839,"t":"Xos儲能Power Hub投入量產盼2027年電力業務超越電動卡車","su":"Xos 에너지저장장치 파워허브, 2027년 전력사업이 전기트럭 추월 기대하며 양산 돌입 Uanalyze 2026년 11월 13일(Uanalyze/산업데이터센터(컴퓨터 수만 대를 모아 둔 건물) 보고서) ⸺ 미국 전기상용차 및 전력기기 제조사 Xos(XOS-US)는 최근 420kWh 용량의 파워허브 에너지저장장치가 양산에 들어갔다고 밝혔다. 수요가 유틸리티, 엔지니어링 임대 및 데이터 센터로 확대됨에 따라 회사는 Power Hub를 중심으로 하는 전력 사업이 2027년에는 트럭 및 전기 자동차 충전을 능가하여 최대 사업이 될 것으로 예상하고 있습니다. Power Hub는 발전기와 결합하여 전력 사용량이 가장 많을 때 전력을 공급할 수 있으므로 발전기는 더 짧은 시간에 배터리 충전에 집중할 수 있어 저부하에서 장기간 작동하는 동안 연료 및 유지 관리 비용이 절감됩니다. Xos는 고객 발전기를 자동으로 시작하고 중지하는 시스템 기능을 입증했으며 대규모 데이터 센터 엔지니어링 계약자와도 협력하고 있습니다. 현재 고객들은 해당 장비가 데이터센터의 정식 운영 중에 부하를 추가로 지원할 수 있는지, 더 이상 건설 현장 장비 충전에만 사용되지 않는지 평가하고 있습니다."},{"s":"Juheng-Chuang, Yaohua와 손잡고 내년 6월 완공 예정인 에너지 저장 시스템 구축 - 뉴스","so":"MoneyDJ","tm":"11/13 10:48","c":1,"r":"tw","u":"https://www.moneydj.com/kmdj/news/newsviewer.aspx?a=403efb6d-881d-472f-a450-d1f0d8071c14","p":1794534480,"a":1794539841,"t":"聚恆-創攜手燿華建置儲能系統明年6月完工- 新聞","su":"Juheng-Chuang(4582)은 산업용 및 상업용 계량기 뒤(BTM) 에너지 저장 시장을 계속 확장하고 있습니다. PCB 제조업체 Yaohua(2367)와 손을 잡고 대만 이란현 공장에 5.04MW/10.03MWh 규모의 대규모 BTM 에너지 저장 시스템을 구축했다고 발표했습니다. 2027년 6월 완공 예정이다. 급전용 스마트 에너지 관리 시스템을 통해 연간 전기요금을 1,2..."},{"s":"해외일보｜징둥닷컴, 독일 CECONOMY 지분 약 59.8% 13억 3500만 유로에 인수, Junda 주식, 오만 5GW 배터리 프로젝트 종료","so":"Jiemian.com","tm":"11/13 10:39","c":1,"r":"cn","u":"https://www.jiemian.com/article/15328727.html","p":1794533942,"a":1794539831,"t":"出海日报｜京东13.35亿欧元收购德国CECONOMY约59.8%股权，钧达股份终止阿曼5GW电池项目","su":"징둥닷컴은 독일 CECONOMY AG 지분(회사를 나눠 가진 몫) 약 59.8%를 13억 3,500만 유로에 인수했습니다. 11월 12일, 징둥닷컴은 독일 소비자 가전 소매 그룹인 CECONOMY AG에 대한 자발적인 공개 인수 제안을 완료했다고 발표했습니다. 이를 통해 총 13억 3,500만 유로에 해당하는 자본금의 59.8%와 의결권을 인수했습니다. 거래가 완료되면 CECONOMY는 징둥닷컴의 자회사가 되며 11월 12일부터 징둥닷컴의 연결 재무제표에 포함될 예정입니다. 파트너 Convergenta가 보유한 지분 25.3%를 포함하면 두 당사자는 CECONOMY 지분의 총 약 85.2%를 보유합니다. 이번 인수는 징둥닷컴이 간접적으로 전체 지분을 소유한 자회사를 통해 이루어졌으며, 제안 가격은 주당 현금 4.60유로였습니다. CECONOMY는 MediaMarkt 및 Saturn과 같은 가전제품 소매 브랜드를 소유하고 있으며 유럽 11개 국가 및 지역에서 1,000개 이상의 실제 매장을 운영하고 있습니다. 기존 합의에 따라 CECONOMY는 현지 관리팀과 기술 구조를 유지하면서 유럽에서 계속 독립적으로 운영될 것입니다."},{"s":"글로벌 에너지저장 학술교류 플랫폼 구축을 위해 제1회 글로벌 에너지저장 학술포럼이 샤먼에서 개최됐다.","so":"人民网-福建频道","tm":"11/13 10:07","c":1,"r":"cn","u":"http://fj.people.com.cn/n2/2026/1113/c181466-41749893.html","p":1794532020,"a":1794539833,"t":"搭建全球储能学术界交流平台 首届环球储能学术论坛在厦门举行","su":"인민일보 온라인, 샤먼, 11월 13일(Yu Nailiu) 에너지 저장의 미래를 탐구하기 위한 세계적인 지혜를 모으십시오. 지난 12일, 제1회 글로벌 에너지 저장 학술 포럼 '프론티어 대화·미래를 위한 지능 저장'이 샤먼에서 열렸습니다. 이번 행사에는 국제 에너지저장 분야의 유명 학자, 전문가, 학자, 업계 대표들이 한자리에 모여 에너지저장 과학기술에 대해 논의했다."},{"s":"뉴욕주, 2030년까지 6GW 목표 달성을 위해 1GW 대규모 에너지 저장 입찰 시작","so":"鉅亨網","tm":"11/13 10:00","c":1,"r":"tw","u":"https://news.cnyes.com/news/id/6661288","p":1794531616,"a":1794539842,"t":"紐約州啟動1GW大型儲能招標朝2030年6GW目標推進","su":"뉴욕주, 2030년 6GW 목표 달성을 위해 1GW 대규모 에너지 저장 입찰 시작 Uanalyze 2026년 11월 13일(Uanalyze/Industry Data Center Report) ⸺ 뉴욕주는 2차 대규모 에너지 저장 입찰을 공식적으로 시작했으며, 약 1GW의 에너지 저장 용량을 구매할 것으로 예상되며, 2030년에 6GW 에너지 저장 장치를 배치한다는 정책 목표를 지속적으로 추진할 예정입니다. 뉴욕 주 에너지 입찰 처리를 담당하는 연구개발청(NYSERDA)은 개발자가 12월 15일 이전에 자격 신청서를 제출하고 프로젝트 선택의 2단계에 들어가기 전에 검토를 통과해야 한다고 밝혔습니다. 이번 입찰은 1차 조달 라운드를 따릅니다. 뉴욕주는 첫 번째 라운드에서 총 용량이 950MW에 달하는 8개의 대규모 에너지 저장 프로젝트와 계약을 체결했습니다. 두 번째 라운드의 규모는 약 1GW로, 전력망의 파견 가능한 에너지 저장 자원을 더욱 확장할 것입니다."},{"s":"CITIC증권: 배터리 산업 체인의 수익성이 점차 회복되고 있으며, 리튬 배터리 부문의 투자 가치가 부각되고 있습니다.","so":"第一财经","tm":"11/13 09:16","c":1,"r":"cn","u":"https://www.yicai.com/news/103439099.html","p":1794528970,"a":1794539835,"t":"中信证券：电池产业链盈利逐步修复，锂电板块投资价值凸显","su":"CITIC 증권 연구 보고서에 따르면 2026년과 2026년 3분기의 첫 3분기 배터리 및 에너지 관리 산업 체인의 운영 결과에 따르면 전 세계 에너지 저장 수요는 여전히 높고 신에너지 차량에 대한 수요는 차별화되었으며 산업 체인의 대부분 링크가 수익 성장을 달성했으며 미드스트림 및 업스트림 이익이 전년 대비 크게 회복되었지만 3분기는 분기별로 압박을 받고 있습니다. 이익 측면에서는 배터리 부문 매출(물건을 판 돈 전체)이 빠른 성장을 유지했다. 탄산리튬, 양극, 분리막, 전해질, 헥사플루오로, 구리박, 알루미늄박 및 기타 부문의 이익은 전년 대비 크게 향상되었습니다. 다만, 일부 부문의 3분기 이익은 전년 동기 대비 감소했다. 공급 측면에서는 업계 '고정자산+건설진행 중' 성장률이 전년 동기 대비 계속 반등(내렸다가 다시 오르는 것)해 2026년 3분기에는 20%까지 상승했다. 동시에, 자본 지출은 뚜렷한 차별화를 보였습니다. 배터리, 양극, 음극, 구조부품 등 관련 부품은 전년 대비 빠른 성장세를 보였다. 산업은 점차 전반적인 위축에서 구조적 확장으로 전환했습니다. 중국 리튬 배터리 산업 체인의 상당한 글로벌 경쟁력, 해외 레이아웃의 점진적인 개선, 솔리드 스테이트 및 고속 충전과 같은 신기술의 지속적인 반복을 고려할 때 선도 기업은 기술, 비용 및 세계화 이점을 활용하여 점유율 및 수익성 이점을 더욱 확대하고 산업 체인의 모든 측면에서 고품질 선도 기업에 대해 계속 낙관할 것으로 예상됩니다."},{"s":"에너지저장장치 해외 진출 가속화","so":"央视网","tm":"11/13 08:43","c":1,"r":"cn","u":"https://news.cctv.cn/2026/11/13/ARTIHohjvz8obzgSqHC4GJMt261113.shtml","p":1794527032,"a":1794539837,"t":"储能装备加速出海","su":"새로운 전력 시스템 구축을 위한 핵심 지원으로서 에너지 저장은 국가가 에너지 기술의 최고 수준을 장악하는 핵심 경로가 되고 있습니다. 최근 몇 년 동안 중국의 에너지 저장 산업은 추종에서 나란히 달리고 선도로 나아가는 역사적인 도약을 이루었습니다. 그 중 에너지저장 수출이 강한 모멘텀(값이 움직이는 기세)을 보이고 있다. 2025년에는 중국의 에너지 저장 배터리 수출이 전년 대비 67.9% 증가하여 60개국 이상을 대상으로 사업을 펼치게 됩니다."},{"s":"에너지 저장 합병 및 인수로 인해 감가상각이 발생하고 Chailease-KY(5871) 태양광 자산이 NT$911억에 달했으며 대만의 순이익은 분기별로 3% 감소했습니다.","so":"鉅亨網","tm":"11/13 01:34","c":1,"r":"tw","u":"https://news.cnyes.com/news/id/6661024","p":1794501245,"a":1794523841,"t":"儲能併購帶入折舊，中租-KY(5871) 太陽能資產達 911 億元、台灣淨利季減 3%","su":"에너지 저장 합병 및 인수로 인해 감가상각이 발생했으며, Chailease-KY(5871)의 태양광 자산은 911억대만달러에 달했고 대만의 순이익(모든 비용을 빼고 남은 돈)은 분기별로 3% 감소했습니다. Uanalyze 2026년 11월 13일(Uanalyze/산업 데이터 센터 보고서) ⸺ 대만의 태양 에너지는 Chailease-KY(5871-TW)의 가장 빠르게 확장되는 자산입니다. 3분기 말 총 태양광 자산은 911억대만달러로 2분기보다 연간 18%, 15% 증가했다. 분기별 증가 데이터에는 이번 분기에 처음으로 포함된 에너지 저장 자산이 포함됩니다. 에너지저장장치는 처음으로 실적(회사가 번 돈 성적표) 보고서에 포함되었습니다. 회사는 3분기에 에너지 저장 사업자를 인수하고 에너지 저장 자산을 전체 태양광 자산에 포함시켜 재무제표에 통합하기 시작했습니다. 따라서 발전소 자체 자산의 증가율은 15% 미만이었습니다."},{"s":"회사 상호 작용丨이 회사는 PCB 동박, 전고체 배터리 등의 최신 개발을 공개합니다.","so":"第一财经","tm":"11/12 23:17","c":1,"r":"cn","u":"https://www.yicai.com/brief/103438859.html","p":1794493020,"a":1794496146,"t":"公司互动丨这些公司披露在PCB铜箔、固态电池等方面最新情况","su":"11월 12일, 다수의 상장(주식시장에 처음 들어오는 것)기업이 대화형 플랫폼, IR 활동 기록 공개 및 기타 채널을 통해 PCB 동박, 전고체 배터리(액체 대신 고체를 넣은 안전한 배터리) 등에 대한 회사의 최신 현황을 공개했습니다. [PCB 동박] Nord Shares:"},{"s":"Chinova Energy Storage는 2027년 매출의 5~10%를 목표로 하고 있습니다! Feihong(2457)의 150,000개 충전 지점 중 최소 30%가 에너지 문제에 직면해 있습니다.","so":"鉅亨網","tm":"11/12 22:00","c":1,"r":"tw","u":"https://news.cnyes.com/news/id/6660840","p":1794488410,"a":1794489675,"t":"馳諾瓦儲能瞄準 2027 年營收 5% 到 10%！飛宏(2457) 15 萬個充電點至少三成面臨能源問題","su":"Chinova Energy Storage는 2027년 매출(물건을 판 돈 전체)의 5~10%를 목표로 하고 있습니다! 페이홍(2457) 150,000개 충전소 중 최소 30%가 에너지 문제에 직면 Uanalyze 2026년 11월 12일(Uanalyze/산업 데이터 센터 보고서) ⸺ 페이홍(2457-TW) 그룹의 충전 파일 사업 ZEROVA의 2027년 목표는 에너지 저장 제품이 ZEROVA 매출의 5%를 차지하는 것입니다. 10%; 미국 충전 보조금 철회 이후 고객의 스테이션 확장 계획이 3분기 정도 연기되면서 점차 주문이 돌아왔습니다. 에너지 저장에 대한 수요는 고객의 전력 소비 문제에서 파생됩니다. 2025년부터 많은 충전소 고객이 전력 규제 및 전력 소비 부족 문제에 직면하고 있으며 충전 파일과 페어링할 수 있는 에너지 저장 장치가 있는지 문의했습니다. 따라서 회사는 에너지 저장 제품 라인에 진출하고 전체 패키지를 제공할 공급업체를 찾았습니다."}]},{"name":"🏭 AI 전력","note":"보유: ACE 코리아AI전력TOP10","breaking":false,"items":[{"s":"남부발전, 두산에너빌리티와 발전기 디지털 정비 체계 구축","so":"한국경제","tm":"11/13 10:48","c":15,"r":"kr","u":"https://www.hankyung.com/article/202611134761h","p":1794534518,"a":1794539853,"su":"AI 추천 뉴스 남부발전, 두산에너빌리티와 발전기 디지털 정비 체계 구축 한국남부발전이 국산화에 성공한 발전기 핵심 기술의 상용화를 위한 현장 개방을 추진한다. 남부발전은 12일 경남 창원 두산에너빌리티 본사에서 두산에너빌리티와 ‘발전기 브러시 모니터링 시스템(B-EYES) 실증 및 디지털 정비 체계 구축을 위한 업무협약’을 체결했다고 밝혔다. 협약식에는 송상옥 남부발전 발전처장과 이광열 두산에너빌리티 파워서비스 설계·생산총괄 전무 등 양사 주요 관계자들이 참석했다."},{"s":"효성중공업 노조 2차 파업 돌입…사측 \"법·원칙 따라 충실히 교섭\"","so":"뉴시스","tm":"11/13 10:06","c":4,"r":"kr","u":"https://mobile.newsis.com/view_amp.html?ar_id=NISX20261113_0003866756","p":1794531993,"a":1794539853,"su":"[서울=뉴시스]유희석 기자 = 효성중공업 사무기술직 노동조합이 13일부터 30일까지 전면 파업에 돌입한 가운데, 사측은 교섭을 거부한 것이 아니라 실질적인 협의를 위한 일정 조정을 제안한 것이라고 반박했다"},{"s":"김정관 산업장관, 체코 원전사업 정상 추진 약속“결과로 책임질 것”","so":"이투데이","tm":"11/14 07:28","c":2,"r":"kr","u":"https://www.etoday.co.kr/news/view/2648134","p":1794608880,"a":1794659885,"su":"한·체코 산업장관 화상 면담두코바니 원전사업 이행 논의양국 장관 월 1회 소통 추진▲김정관 산업통상부 장관이 9일 국회 산업통상자원중소벤처기업위"},{"s":"AI 투자 위축 우려…국내 반도체·전력기기 영향은","so":"연합뉴스TV","tm":"11/15 11:04","c":1,"r":"kr","u":"https://www.yonhapnewstv.co.kr/news/MYH202611151104044M7","p":1794708240,"a":1794713963,"su":"[앵커] 미국 중간선거 이후 AI 투자 위축 우려가 커지면서 국내 산업계에도 긴장감이 감돌고 있습니다. 특히 AI 호황을 누려온 반도체(전자기기의 두뇌 부품)와 전력기기 업계에 어떤 파장이 있을지 주목됩니다. 정다예 기자입니다. [기자] 미국 중간선거 직후 국내 증시는 크게 출렁였습니다. 삼"},{"s":"포스코·효성중공업·한화오션 하청까지…중공업계 '동투' 장기화 조짐","so":"이투데이","tm":"11/15 10:44","c":1,"r":"kr","u":"https://www.etoday.co.kr/news/view/2648009","p":1794707040,"a":1794713963,"su":"협상 난항에 노사 갈등 연말까지 이어져임금·성과급 갈등에 동투 장기화 조짐파업·집회 잇따라…생산 차질 우려▲효성중공업 창원공장 전경. (사진제공="},{"s":"AI 데이터센터가 벽에 부딪혔다! 미국 내 38개 지역이 금지령을 통과시키고 확장을 요구했습니다. 마이크로소프트와 구글은 강제로 다른 탈출구를 찾아야 하는가?","so":"工商時報","tm":"11/15 08:37","c":1,"r":"tw","u":"https://www.ctee.com.tw/news/20261115700014-430701","p":1794699420,"a":1794702410,"t":"AI資料中心踢到鐵板！美國38地通過禁令喊卡擴建 微軟、Google被迫另尋出路？","su":"미국 민주당이 2026년 중간선거에서 큰 승리를 거두며 상하원 장악력을 탈환했다. 유권자들은 높은 인플레이션(물건값이 계속 오르는 것)과 생활비에 대한 불관용, 해외 전쟁 개입에 대한 강한 반대, 의료 안보와 풀뿌리 사회복지 수호, 젊은 세대와 소수민족의 변화 요구 등 현 정부의 정책에 대해 강력한 항의와 불만을 투표를 통해 표현했다. AI 데이터센터(컴퓨터 수만 대를 모아 둔 건물)로 인해 전력 수요가 급증하고, 주민들은 시설 확충에 따른 전이효과를 우려하고 있다. 경제와 민생은 유권자들이 가장 우려하는 페인포인트다. 건담..."},{"s":"팬과 함께 떠나지 않는 현실 AI 데이터센터 과열투자에 한 홀","so":"日本経済新聞","tm":"11/15 05:00","c":1,"r":"jp","u":"https://www.nikkei.com/article/DGXZQOUC132SG0T11C26A1000000/","p":1794686400,"a":1794698087,"t":"「ファンと共に去りぬ」の現実味 AIデータセンター過熱投資に一穴","su":"인공지능(AI) 붐을 선도해온 미국 엔비디아 젠슨 황씨가 최고경영책임자(CEO)를 전격 사임했습니다. 영향은 엔비디아의 경영에 그치지 않고, 과열하는 AI 데이터 센터의 투자 붐의 조정을 초래하는 「황 퇴진이라는 작은 균열」에 퍼질 수 있습니다. 「수평형 조직」. 엔비디아의 경영 체제는 다음과 같습니다. 엔비디아 간부는 “한 사람의 시끄럽고 무서운 아버지가 있고, 그 아래에 만명의 아이들이 줄지어 있다. 아버지가 결"},{"s":"하루 만에 40% 이상 급락했습니다! 호주 데이터센터 운영업체 NextDC, 내년 실적 전망 하향","so":"财联社","tm":"11/14 22:02","c":1,"r":"cn","u":"https://www.cls.cn/detail/2511045","p":1794661373,"a":1794713965,"t":"一天暴跌逾四成！澳数据中心运营商NextDC下调明年业绩指引","su":"① 호주 데이터센터(컴퓨터 수만 대를 모아 둔 건물) 운영업체인 NextDC는 멜버른 M3 데이터센터 전력 공급 지연으로 인해 2027회계연도 매출과 기본 EBITDA 실적 전망을 하향 조정했고 주가는 장중 44% 하락했다. ② M3의 그리드 전력 공급 증가의 다음 단계는 2028 회계연도로 연기될 것으로 예상됩니다. ③ 회사는 신규 프로젝트와 토지 취득을 중단했으며, 씨티그룹은 관련 문제가 수익에 미치는 영향이 2027 회계연도 이후까지 이어질 수 있다고 밝혔습니다. 차이롄서, 10월 21일(인턴 편집자 Xu Yuanjia/편집자 Qi Ling) 호주 데이터 센터 운영업체인 NextDC가 멜버른 M3 데이터 센터의 전력 공급이 지연되었습니다. 회사의 주가는 수요일 세션 동안 44% 하락하여 5.35 호주 달러로 마감했으며, 시가총액(회사 전체 몸값)은 40억 호주 달러(약 28억 달러)를 약간 넘는 수준으로 떨어졌습니다."},{"s":"기술 거대 기업은 민주당 산사태로 더 많은 전력망 비용 압박에 직면","so":"Bloomberg.com","tm":"11/14 22:00","c":1,"r": 14 18:48","c":1,"r":"cn","u":"https://www.cls.cn/detail/2528407","p":1794649705,"a":1794664823,"t":"“十五五”新型电力系统建设全面铺开 特高压建设节奏进一步加快","su":"①언론 보도에 따르면, 아바현 리현 미야뤄진 정상 해발 3,620m에 아바 1,000kV UHV 변전소가 올해 말까지 가동될 예정이다. ② UHV DC는 새로운 전력 시스템의 \"에너지 동맥\"입니다. \"15차 5개년 계획\"에 따라 새로운 전력 시스템 건설이 전면적으로 시행됨에 따라 중국의 UHV DC 송전 프로젝트는 새로운 승인 단계와 건설 피크 기간에 돌입하고 있습니다. 언론 보도에 따르면 아바현 리현 미야뤄진 꼭대기 해발 3,620m에 위치한 아바 1,000kV UHV 변전소는 눈 덮인 산으로 둘러싸여 있습니다. 현재 세계 최고 수준의 초고압 변전소가 가동 전 전력 질주 단계에 있으며, 올해 말 가동에 들어갈 예정이다. 이 변전소는 UHV 건설 역사상 많은 기록을 경신했으며 가장 높은 고도, 가장 높은 성토 경사, 가장 많은 토공량, 가장 복잡한 지질학, 가장 복잡한 접근 도로 및 수원 조건이라는 \"5대 최고\"를 보유하고 있습니다."},{"s":"블랙스톤의 에어트렁크, 110억 달러 규모의 인도 데이터 센터 투자 진행","so":"Bloomberg","tm":"11/14 15:08","c":1,"r":"us","u":"https://www.bloomberg.com/news/articles/2026-11-14/blackstone-s-airtrunk-advances-11-billion-india-data-center-bet","p":1794636480,"a":1794659886,"t":"Blackstone’s AirTrunk Advances $11 Billion India Data Center Bet"},{"s":"AI 수요로 인해 원자력 부활이 촉발되면서 우라늄 가격이 사상 최고치를 기록했습니다.","so":"Nikkei Asia","tm":"11/14 02:16","c":1,"r":"us","u":"https://asia.nikkei.com/business/markets/commodities/uranium-price-hits-record-as-ai-demand-prompts-nuclear-comeback","p":1794590160,"a":1794610474,"t":"Uranium price hits record as AI demand prompts nuclear comeback","su":"일본은 안정적인 연료를 추구하고 Big Tech의 데이터 센터 전력에 대한 갈증은 공급 부족을 심화시킵니다."},{"s":"대동(Tatung)의 9월 매출은 전년 동기 대비 13% 감소했으며 전력 인프라 건설에서 AI 컴퓨팅 성능을 지속적으로 심화하고 있습니다.","so":"經濟日報","tm":"11/14 01:53","c":1,"r":"tw","u":"https://money.udn.com/money/story/5612/9810044?from=edn_next_story","p":1794588784,"a":1794664827,"t":"大同9月營收年減13%　持續深化電力基礎建設AI算力","su":"대동(Tatung)은 오늘 9월 연결 매출(물건을 판 돈 전체)이 NT$36억 8,700만으로 전년 동기 대비 13.29% 감소했다고 발표했습니다. 첫 9개월 동안의 통합 수익은 NT$362.5억으로 연간 NT$2.1 감소했습니다."},{"s":"데이터센터 구축 병목현상 해소 | 홍콩경제신문","so":"香港經濟日報HKET","tm":"11/14 01:28","c":1,"r":"hk","u":"https://invest.hket.com/article/4225081/","p":1794587280,"a":1794610482,"t":"數據中心建設 瓶頸逆轉曙光|香港經濟日報"},{"s":"2031년까지 524억 3천만 달러 규모의 데이터 센터 전력 시장 - MarketsandMarkets™ "a":1794553629,"t":"India’s ReNew Commits $8.5 Billion for Data Center, Clean Energy"},{"s":"데이터 센터 전력 공급업체는 연료 전지 거래와 함께 백로그 및 전망 업데이트를 게시합니다.","so":"Financial Times","tm":"11/12 21:11","c":1,"r":"world","u":"https://markets.ft.com/data/announce/detail?dockey=600-202611120711PR_NEWS_USPRX____LN96156-1","p":1794485460,"a":1794489693,"t":"Data Center Power Suppliers Post Backlog and Guidance Updates Alongside a Fuel Cell Deal"},{"s":"국민당·민중당은 조언 듣기를 거부하고 대기오염법을 부과합니다. 관리자: 필연적으로 전력 부족이 발생하므로 바람직하지 않습니다.","so":"自由時報","tm":"11/12 21:06","c":1,"r":"tw","u":"https://stock.ltn.com.tw/article/m5vqzkmnkgqj","p":1794485208,"a":1794489691,"t":"藍白不聽勸強修空污法 經長：勢必釀電力吃緊非所願","su":"국민당 입법원과 인민당 의원들은 석탄화력발전소의 조기 해체를 직접적으로 규정하고, 해체된 석탄화력발전기를 비상 백업으로 전환하는 것을 제한하는 대기오염법 개정법 제28조와 제30조를 이달 10일 발의했다. Gong Mingxin 경제부 장관은 오늘 인터뷰에서 특정 장치를 조기에 폐기해야 한다면 필연적으로 전력 공급 부족 문제가 발생할 것이라고 말했습니다. 이는 경제부와 업계가 원하는 바가 아니며, 새로운 유닛 건설에는 시간이 걸릴 것입니다. \"오늘 그렇게 하면 내일 전기가 나올 것입니다.\""},{"s":"중국, AI 전력 수요 폭발로 글로벌 가스 터빈 시장 공략","so":"Crude Oil Prices Today | OilPrice.com","tm":"11/12 19:00","c":1,"r":"sg","u":"https://oilprice.com/Latest-Energy-News/World-News/China-Targets-Global-Gas-Turbine-Market-as-AI-Power-Demand-Explodes.amp.html","p":1794477600,"a":1794489692,"t":"China Targets Global Gas Turbine Market as AI Power Demand Explodes","su":"중국은 글로벌 AI 데이터센터(컴퓨터 수만 대를 모아 둔 건물) 붐으로 인한 기록적인 수요와 공급 부족을 활용하기 위해 가스터빈 개발과 해외 진출을 가속화하고 있습니다."},{"s":"변압기 회사는 선물 도구를 사용하여 정확한 정책을 구현하여 원자재 가격 변동에 효과적으로 대응할 수 있습니다.","so":"21财经","tm":"11/12 18:33","c":1,"r":"cn","u":"https://www.21jingji.com/article/20261112/herald/b3e514236fc708844bf7dfee890f3095.html","p":1794475980,"a":1794489689,"t":"运用期货工具精准施策 变压器企业有效应对原料价格波动","su":"지난 2년간 국내외 구리 가격의 등락이 계속돼 구리 산업 하류 기업의 생산원가와 영업이익(장사해서 남긴 돈)에 직접적인 영향을 미쳤다. 일부 기업은 성숙하고 효과적인 위험 관리 시스템이 부족하여 여러 가지 문제에 직면하고 있습니다. 방문 기간 동안 기자는 중국 동부 지역의 한 변압기 제조 회사가 파생상품 위험 관리 도구의 과학적이고 합리적인 사용을 통해 올해 약 300만 위안의 조달 비용을 절감하고 원자재(물건의 재료(석유·구리 등)) 가격 변동의 영향에 효과적으로 대응하며 안정적인 운영을 달성했다는 사실을 알게 되었습니다. 구리 가격이 오르고 기업에는 위험 관리 도구가 시급히 필요합니다. 인터뷰에서 기자는 변압기 제조를 핵심으로 하고 송전 및 변전 장비 분야에 깊이 있는 중국 동부의 국가 수준의 전문화되고 새로운 \"작은 거인\" 기업이 다량의 구리를 사용하고 원자재 비용의 높은 비율을 차지한다는 사실을 알게 되었습니다. 그러나 현물 조달 및 판매를 담당하는 전문 선물팀이 없습니다. 팀은 선물의 기본 이론, 헤징 운영 절차, 위험 예방 및 통제의 핵심 사항 등 전문적인 내용에 대한 지식이 제한되어 있습니다. 이들은 금융파생상품 상품을 “이해하지 못하고, 사용할 용기가 없고, 사용 방법을 모른다”는 공통된 업계 특성을 갖고 있어 매일 독립적이고 효과적인 헤징 사업을 수행하기가 어렵습니다."}]},{"name":"🤖 로봇","note":"","breaking":false,"items":[{"s":"울산 남구, 中상하이 '휴머노이드 로봇 실증기지' 찾았다","so":"뉴시스","tm":"11/13 17:33","c":4,"r":"kr","u":"https://mobile.newsis.com/view_amp.html?ar_id=NISX20261113_0003867719","p":1794558822,"a":1794576174,"su":"[울산=뉴시스] 안정섭 기자 = 울산 남구는 13일 남구 중소기업협의회 대표단 20여명과 함께 중국 상하이 '휴머노이드(사람을 닮은 로봇) 로봇 기린(Kylin·麒麟) 트레이닝 그라운드'를 방문했다"},{"s":"보도자료 : XNOVA, 「NexTech Week 2026[가을] 제1회 휴머노이드 로봇 EXPO」에 출전 3일간에 1,500명 이상이 참석해, 부스는 대성황에(PR TIMES)","so":"毎日新聞","tm":"11/14 11:52","c":3,"r":"jp","u":"https://mainichi.jp/articles/20261114/pr2/00m/020/025000c","p":1794624755,"a":1794628736,"t":"プレスリリース：XNOVA、「NexTech Week 2026［秋］第1回ヒューマノイドロボットEXPO」に出展 3日間で1,500人以上が来場し、ブースは大盛況に（PR TIMES）","su":"4족 보행 로봇용 내비게이션 「현장견」과 전동 공구를 취급하는 쌍팔 로봇을 실기로 전시. 건설 현장용의 제공 체제와, 2027년 4월의 본격 제공을 향한 파트너 모집을 발표 피지컬 AI·로보틱스의 스타트업인 주식회사 XNOVA"},{"s":"JP모건은 미국의 휴머노이드 로봇 생산량이 2030년까지 400,000대에 달할 것이라고 밝혔습니다.","so":"CNBC TV18","tm":"11/12 19:22","c":3,"r":"us","u":"https://www.cnbctv18.com/technology/us-humanoid-robot-production-could-hit-400000-by-2030-as-deployment-ramps-jpmorgan-20032565.htm","p":1794478938,"a":1794489703,"t":"US humanoid robot production could hit 400,000 by 2030 as deployment ramps, JPMorgan says","su":"JP모건은 성장하는 휴머노이드(사람을 닮은 로봇) 로봇 산업의 혜택을 받을 부품 공급업체로 테슬라, 피규어AI 및 보스턴다이내믹스를 주요 업체로 꼽았습니다."},{"s":"중롄중커, bauma CHINA 2026에서 AI 기반 장비 및 로봇 공학 선보일 예정","so":"The Straits Times","tm":"11/13 20:56","c":2,"r":"sg","u":"https://www.straitstimes.com/paid-press-releases/zoomlion-to-showcase-ai-powered-equipment-and-robotics-at-bauma-china-2026-20261113","p":1794570960,"a":1794576183,"t":"Zoomlion to Showcase AI IH3ADEP2734AI/?outputType=amp","p":1794690000,"a":1794698095,"su":"0.0005N 힘 감지하는 로봇 피부, 20개 넘는 자유도 갖춘 로봇손 스위스 로보틱스 데이에 등장한 피지컬 AI 기술 로봇, 데이터·강화학습으로 조작 능력 익혀 촉각센서·액추에이터 등 부품 경쟁도 치열 韓 제조기업도 협력 기회 모색"},{"s":"항저우가 키운 춤추는 로봇… 유니트리, 中 증시서 62조원 가치 ‘우뚝’","so":"조선일보","tm":"11/15 03:00","c":1,"r":"kr","u":"https://www.chosun.com/economy/weeklybiz/2026/11/15/N656DOYEHVAY5GYJQJ7U6JJ5D4/","p":1794679200,"a":1794698095,"su":"항저우 기반 로봇 기업 유니트리가 저비용 모델을 앞세워 시가총액(회사 전체 몸값) 62조 원을 달성했습니다. 민간 주도 기술 발전과 교육·연구용 로봇 수요가 성장을 견인했으나, 휴머노이드(사람을 닮은 로봇)의 상업적 활용 및 기술적 완성도 측면에서는 향후 시장의 검증이 필요한 상황입니다."},{"s":"[모닝포스트] 유니트리, 오늘부터 신규주 청약을 시작했습니다. 이란은 호르무즈 해협 안전 개요를 승인했습니다. 캄브리콘, 롱시스 및 우시앱텍이 중요한 발표를 했습니다.","so":"财联社","tm":"11/15 00:28","c":1,"r":"cn","u":"https://www.cls.cn/detail/2449482","p":1794670123,"a":1794698096,"t":"【早报】宇树科技，今日申购；伊方批准霍尔木兹海峡安全纲要；寒武纪、江波龙、药明康德发布重要公告","su":"① 국가통계국: 7월 CPI 전년 동기 대비 0.5% 상승 ② S&P500(미국 큰 회사 500곳 지수) 지수가 지난 금요일 최고치를 경신했고, 광통신 부문이 급등했다. ③ 베이징: 집을 구입하는 비베이징 가구의 사회보장 및 개인 납세 기간이 1년으로 단축되었다. ④ 애플 China 공식 웹사이트에서 애플 Smart Access 알리바바 큐원(Qwen) 매뉴얼을 삭제했다. ⑤ 캄브리콘, 롱시스, Wuxi AppTec이 중요한 발표를 했다. 매크로 뉴스 1. 국가통계국이 발표한 자료에 따르면 7월 소비자물가지수(CPI)는 국제 수입 요인의 영향으로 전월 대비 0.1% 하락하고 전년 대비 0.5% 상승한 것으로 나타났습니다. 식품과 에너지를 제외한 근원 CPI는 전월 대비 0.3%, 전년 동기 대비 0.9% 상승했다. CPI는 전반적으로 완만한 상승을 유지했습니다. 1~7월 평균 전국 소비자물가는 전년 동기 대비 0.9% 상승했다. 국내 일부 산업의 수요가 늘었지만, 수입·계절적 요인 등으로 산업생산자물가(공장에서 파는 물건값 수준)지수(PPI)는 전월 ​​대비 0.7% 하락, 전년 동기 대비 3.5% 상승, 전월 대비 0.6%포인트 하락했다."},{"s":"로봇 더블 일레븐 '시험장': 대규모 판매 이후 배송과 생산 라인이 실제 테스트 문제","so":"财联社","tm":"11/15 00:11","c":1,"r":"cn","u":"https://www.cls.cn/detail/2533342","p":1794669109,"a":1794730754,"t":"机器人双十一\"考场\"：大卖之后，交付和产线才是真考题","su":"① 더블 일레븐(Double Eleven) 기간 동안, 임바디드 AI(로봇처럼 몸을 가진 인공지능)형 로봇 배치가 처음으로 물류 최전선에서 \"작업\"했습니다. ② 더블일레븐 이후에는 주문한 상품이 제때에 배송될 수 있는지, 이용자가 이를 수령한 후 반품할 것인지, 사용할 것인지 여부 등 배송을 소비자측에서 부담하게 됩니다. 창고가 대답해야 할 것은 로봇이 일년 내내 가장 극심한 주문 피크 기간 동안 안정적으로 작동하고 계산 가능한 경제적 가치를 계산할 수 있는지 여부입니다. '극장반일보'가 11월 13일 보도했다(리밍밍 기자) 더블일레븐은 막을 내렸지만 올해 로봇 분야에는 새로운 변화가 있다. 먼저, 소비자 측면에서는 더블 일레븐 기간 동안 플랫폼 내 지능형 휴머노이드(사람을 닮은 로봇) 로봇 매출이 전년 대비 700% 증가했고, 로봇 팔, 손재주 등 트렌드 카테고리 매출도 전년 대비 10배 이상 증가했다. 반면, 소비자가 주문한 후 분류, 포장 및 배송 링크에서는 임바디드 AI형 로봇 그룹이 처음으로 물류 최전선에서 '작업'했습니다."},{"s":"최신 Caixin Weekly │ 휴머노이드 로봇이 임계점을 기다리고 있습니다","so":"财新周刊","tm":"11/14 23:16","c":1,"r":"cn","u":"https://weekly.caixin.com/2026-11-14/102504772.html","p":1794665765,"a":1794698097,"t":"最新财新周刊｜人形机器人等待临界点","su":"텍스트 | A주 '최초의 인간형 로봇 주식'인 Caixin Weekly Du Zhihang 유니트리(688836.SH)는 8월 19일 상장(주식시장에 처음 들어오는 것) 당일 발행 가격이 주당 150.80위안에서 1,100위안으로 급등했습니다. 이후 오르락내리락하며 등락을 거듭하며 시가총액(회사 전체 몸값)은 최고에서 최고로 상승했습니다. 4,449억 위안으로 최저치인 1,634억 위안을 기록했으나 10월 중순 이후 등락을 거듭하며 2,815억 1,000만 위안 안팎까지 올랐다. 이 시가총액을 기준으로 3개 분기별 보고서의 수익을 합산하면 PS(가격 대비 판매 비율)는 여전히 120배입니다. \"2027년은 로봇 산업이나 로봇 모델 발전에 있어서 중요한 시점이 될 가능성이 높다.\" 2026년 11월 4일 Wuzhen 인터넷 컨퍼런스에서 유니트리의 왕싱싱(Wang Xingxing) CEO는 2027년에는 어떤 현장에서도 작동할 수 있는 로봇을 배치할 가능성이 높다며 두 달 전 기업공개(IPO) 때보다 조금 더 낙관적인 목소리를 냈습니다."},{"s":"2026~2030 휴머노이드 로봇 브레인용 D램 수요 전망(사진=카운터포인트리서치)","so":"전자신문","tm":"11/14 22:30","c":1,"r":"kr","u":"https://www.etnews.com/tools/image_popup.html?v=bjQ5VkNYY2dLZTZMZFBUbmNzandvWmpGcjBTK1pHYm1CUVRXR0pTMldlYVZkdE5JeGJVUFVVNURJN04rbmhKTXpEZ0VrRFJ1Z0UzZXBlTmtIMExTejVCeTJrc0pTeDdtRld1cnQ3Yi9BbWhSaTVjb0VObnNFZndkeDNYcGw4UEY1K0xQNVQvQlNwaUVLSko4a0E3aXFPSk9xemFzdGpKV0ltS1NSaGczSm85VzlHaEo2blpZRjJuQW0yZmlRSmdjZWo3R0o5NHoyUzlxMk5wOFhhaWJkL09zblpXVXkwVG5YVG01Z3hpTU9XMXN2b0Nzc1BPU1d1RlBqUmQ5azRmZzJISzRWNWpEWDFqVmRsNk1iTEw0eW4vUEdNTVNtZnBrdVhTdGtqTWlSVFFnSEVnNFZVTHRsL0tGZDJEb1l5aExVNE1iVmpWNlMrTzA3UXFKTmw2dFBlTXFIMzJCSjFZVDNYa3k5YXZ2OWtRREpoRjZ4TWlJeEFYdFFlcFljeXdrNm1OaGhKd1BhbENmdUdON3BQZTZ0Vkx1bTVZYXZVUGlHT1lQVjJWNEk0ST0","p":1794663016,"a":1794698095},{"s":"에릭 트럼프가 지원하는 로봇 군인 스타트업은 창업자가 집을 구입하기 위해 회사로부터 460만 달러를 빌린 후 직원에게 급여를 지급할 수 없습니다","so":"CNBC","tm":"11/14 21:00","c":1,"r":"us","u":"https://www.cnbc.com/2026/11/14/foundation-payroll-ceo-loan.html","p":1794657601,"a":1794659895,"t":"Eric Trump-backed robot soldier startup can't pay staff after founder borrowed $4.6 million from company to buy home","su":"에릭 트럼프가 지원하는 로봇 스타트업 Foundation Future Industries는 CEO Sankaet Pathak이 460만 달러의 회사 대출에 대한 조사를 받자 현금이 부족하고 급여도 누락되었습니다."},{"s":"중국의 휴머노이드 로봇 생산량은 올해 100,000대를 초과할 것으로 예상되며, 임바디드 AI의 대규모 개발을 지원하기 위해 산업 표준이 시행될 예정입니다.","so":"财联社","tm":"11/14 20:48","c":1,"r":"cn","u":"https://www.cls.cn/detail/2429801","p":1794656919,"a":1794713975,"t":"今年我国人形机器人产量或超10万台，行业标准落地护航具身智能规模化发展","su":"①산업정보기술부 휴머노이드(사람을 닮은 로봇) 로봇 및 임바디드 AI(로봇처럼 몸을 가진 인공지능) 표준화 기술 위원회의 2026년 연례 총회 및 \"표준 주간\" 행사가 최근 저장성 소흥시 상위구에서 열렸습니다. ② 공업정보화부 커직신(Ke Jixin) 차관은 연설을 통해 중국의 휴머노이드 로봇 생산량이 지난해 약 2만대 수준이었고, 올해 상반기에는 4만대를 넘어섰으며, 올해에는 10만대를 넘어설 것으로 예상된다고 밝혔다. '커창반일보'가 7월 17일 보도했다(궈휘 기자) 7월 15일부터 17일까지 공업정보화부 휴머노이드 로봇 및 체화지능 표준화 기술위원회(이하 '표준위원회')의 2026년 정기총회와 '표준주간' 활동이 저장성 소흥시 상위구에서 열렸다. 개회식에서 산업정보기술부 차관 Ke Jixin은 연설을 통해 현재의 인간형 로봇과 지능 구현 산업이 기술 탐구를 통해 표준화되고 대규모로 발전하는 중요한 단계에 진입하고 있다고 말했습니다. 표준의 기본, 선도, 지원 역할을 충분히 발휘하고 각 측의 공감대를 형성하며 각 측의 공동 노력을 모아야 합니다. 산업 표준의 공식화는 구현과 대중화에 중점을 둡니다. 우리는 표준의 가속화된 구현을 촉진하고, 고품질 표준으로 기술 반복을 주도하고, 제품의 대규모 적용을 지원하고, 안전을 위한 견고한 기반을 구축하기 위해 \"표준 주간\" 및 기타 형식을 개최하여 지속적으로 홍보를 강화해야 합니다."},{"s":"[미리보는 ITCE EXPO 2026]AI부터 휴머노이드까지…중국 절강성, 대구서 '디지털 융합' 미래 제시","so":"전자신문","tm":"11/14 18:46","c":1,"r":"kr","u":"https://www.etnews.com/tools/image_popup.html?v=bjQ5VkNYY2dLZTZMZFBUbmNzandvWmpGcjBTK1pHYm1CUVRXR0pTMldlYVZkdE5JeGJVUFVVNURJN04rbmhKTXpEZ0VrRFJ1Z0UzZXBlTmtIMExTeis0K0lkZ00vMkM0MXI0WlJTd2lxS0dVTEkzUkJwa2dNSllaNzNiZ2NQMG42Nm5OdUMxOXA0d1RpTWNPc1I0ZW52OTd4WUIyeWZkWUJ5TUQ4UjFNeHpldENYZmlSdmRoOE91Y1ptRSs1RDk3UEljSVRXanVzRktpd2NEV0dPdzdhSTVNRDY5dHViU0Z6YXpJUXdWSS9yYWJlNzdjZ214SnRILzFNNitJVml3MG5pZ3FCQ3RzR3J5eURXdUhwWGZTd2pFVVQ0RnQvZkxFR2hqNVFoVHBOMi9CbFJ6Y2FSbWJRcDZSWWxjV1NrdlZNblFlbnE2MzRCTG5BWnh2VHE4RFdvR0h1Z21KcFphSXFlWllnamp6eDJab05LSjZOQXZGUHI4eXNxdjQvaURHUjVzT1RUL0JQOU9YbGo4T1pJUjdkVWg1b2RtWlc4MjBrdXQzVWF5YjB1NXZwZU5LWFNNd2d6djQvalNtekNZMjB1VEh0eU9zUjZMYjBQY3hRK0NPdUdlazdFVUtRRElDOEErNHdZTE5MQ2M9","p":1794649583,"a":1794698095 11/13 17:00","c":1,"r":"kr","u":"https://biz.sbs.co.kr/amp/article/20000346329","p":1794556800,"a":1794576174,"su":"[숏폼] 레인보우 로보틱스 두 자릿수 껑충 \"이벤트성 급등 이용해야\" SBS Biz 입력2026.11.13 17:00 수정2026.11.13 17:00 ⓒ SBS Medianet & SBSi 무단복제-재배포 금지"},{"s":"中 광군제, '200만원 휴머노이드' 판매 두 배 이상 급증 - 머니투데이","so":"머니투데이","tm":"11/13 15:32","c":1,"r":"kr","u":"https://www.mt.co.kr/world/2026/11/13/2026111315093515227","p":1794551554,"a":1794553638,"su":"올해 중국 최대 쇼핑 축제 광군제(11월 11일·쌍십일) 기간 온라인 쇼핑 플랫폼 징둥에서 지능형 휴머노이드(사람을 닮은 로봇) 로봇 판매량이 전년 동기 대비 700% 급증한 것으로 조사됐다. 지난 달 9일부터 11월 11일까지 징둥의 휴머노이드 부문에서는 휴머노이드 로봇 기업 쑹옌둥리 제품 판매량과 판매액이 모두 1위를 차지했다."},{"s":"Matrix의 초지능형 MATRIX-3가 중국 국제 수입 박람회에서 데뷔하여 휴머노이드 로봇 내비게이션 장면의 실제 구현을 시연했습니다.","so":"经济参考报","tm":"11/13 15:18","c":1,"r":"cn","u":"http://jjckb.xinhuanet.com/20261113/7b95c4f4da734577bf81494ee794e248/c.html","p":1794550726,"a":1794553640,"t":"矩阵超智MATRIX-3亮相进博会 展示人形机器人导览场景实景落地","su":"최근 제9회 중국국제수입박람회에 매트릭스 초지능 3세대 범용 휴머노이드(사람을 닮은 로봇) 로봇 MATRIX-3이 등장했다. 지능형 관광가이드 최초로 실제 현장 시연을 완료했다. 군중이 밀집되고 시끄러운 환경이 있는 공공적이고 복잡한 환경에서 독립적인 과학 혁신 촉진 상호 작용을 완료하여 공공 지식 서비스 시나리오에서 국내 물리적 AI 휴머노이드 로봇의 상업적 잠재력을 입증했습니다. 전시장에는 유동인구가 많고 배경 소음이 복잡합니다. MATRIX-3은 사전 설정된 스크립트의 제약이 전혀 없으며 수동으로 라인별로 제어할 필요가 없습니다. 방문자 인식, 다중 모드 대화형 전환, 기업 정보 설명 및 방문자 응답 상호 작용의 완전한 비즈니스 링크를 독립적으로 완료할 수 있습니다. 로봇은 현장 방문객의 상태에 따라 설명 콘텐츠를 독립적으로 검색할 수 있어 \"환경을 이해하고 방문객을 이해하는\" 진정한 투어 서비스 경험을 실현할 수 있습니다."},{"s":"아틀라스 휴머노이드 로봇은 발을 버리고 바퀴를 장착해 격렬하게 날고, 달보행을 복원하고, 점프하고 360도 표류한다.","so":"香港01","tm":"11/13 15:00","c":1,"r":"hk","u":"https://www.hk01.com/%E6%95%B8%E7%A2%BC%E7%94%9F%E6%B4%BB/60410075/atlas%E4%BA%BA%E5%BD%A2%E6%A9%9F%E6%A2%B0%E4%BA%BA%E6%A3%84%E9%9B%99%E8%85%B3%E8%A3%9D%E8%BC%AA%E7%8B%82%E9%A3%86-%E7%A5%9E%E9%82%84%E5%8E%9F%E6%9C%88%E7%90%83%E6%BC%AB%E6%AD%A5-360%E5%BA%A6%E8%B7%B3%E8%BA%8D%E9%A3%84%E7%A7%BB","p":1794549654,"a":1794628735,"t":"Atlas人形機械人棄雙腳裝輪狂飆 神還原月球漫步 360度跳躍飄移","su":"현대자동차그룹이 미국 로봇기업 보스턴다이내믹스의 지배지분(회사를 나눠 가진 몫)을 인수하고, 양사가 로봇 기술의 또 다른 돌파구를 마련하기 위해 협력하고 있다. 보스턴 이동"},{"s":"엑스와이지-KAIST,휴머노이드 기반 인간–로봇 상호작용 공동 연구 협약 체결","so":"로봇신문","tm":"11/13 14:32","c":1,"r":"kr","u":"https://www.irobotnews.com/news/articleView.html?idxno=49571","p":1794547942,"a":1794553638,"su":"피지컬 AI 전문기업 엑스와이지(대표 황성재)는 12일 KAIST와 인간–로봇 상호작용(HRI) 기술 공동 연구 및 인프라 구축을 위한 업무협약(MOU)을 체결하"},{"s":"중국 더블11 로봇 붐: 휴머노이드 로봇 판매량 7배 급증","so":"工商時報","tm":"11/13 13:18","c":1,"r":"tw","u":"https://www.ctee.com.tw/news/20261113700935-430804","p":1794543480,"a":1794576181,"t":"陸雙11機器人大爆單 人形機器人銷量狂飆7倍","su":"중국 본토 더블 11 쇼핑 페스티벌이 막을 내렸습니다. 올해는 로봇산업이 시장의 화두가 됐다. 소비자용 휴머노이드(사람을 닮은 로봇) 로봇의 판매가 크게 증가했을 뿐만 아니라, 임바디드 AI(로봇처럼 몸을 가진 인공지능)형 로봇도 처음으로 대규모 물류 분류 작업에 투입되었습니다. 징둥닷컴 데이터에 따르면 Double 11 기간 동안 스마트 휴머노이드 로봇의 판매가 전년 대비 700% 증가했으며 로봇 팔, 손재주 같은 제품의 매출이 10배 이상 증가한 것으로 나타났습니다. 또한 차이나포스트, SF익스프레스 등 물류센터에도 로봇이 진출하기 시작했는데, 1시간에 최대 1.5개까지 분류할 수 있는 처리량을 기록했다."},{"s":"로봇 교통경찰, AI 항저우 경찰이 즉시 영어를 바꿔 행인의 의심 해결에 도움 - Cross-Strait","so":"工商時報","tm":"11/13 13:00","c":1,"r":"tw","u":"https://www.ctee.com.tw/news/20261113701019-430801","p":1794542400,"a":1794553642,"t":"機器人交警上崗AI杭警可秒換英文幫路人解惑- 兩岸","su":"인공 지능과 임바디드 AI(Embodied AI)의 기술 혁신으로 중국 본토의 많은 도시에서는 도로 교통 관리에 참여하기 위해 \"로봇 교통 경찰\"을 연속적으로 도입했습니다. 로봇 교통경찰은 근무 중에도 거리에서 '흥미로운 에피소드'를 많이 펼쳤다. Xinhuanet의 보고서에 따르면 저장성 항저우는 중국 본토에서 최초로 완전히 조직화된 교통 관리 로봇 팀인 \"항저우 경찰 정보\" 로봇 교통 경찰 대대를 설립했습니다. 이 비행대는 15개의 지능형 교통 통제 로봇으로 구성됩니다."},{"s":"ASUS, 최초의 휴머노이드 로봇 Gallop 발표","so":"CNBC","tm":"11/13 12:33","c":1,"r":"us","u":"https://www.cnbc.com/video/2026/11/13/asus-announces-first-humanoid-robot-gallop.html","p":1794540819,"a":1794553639,"t":"ASUS announces first humanoid robot: Gallop","su":"ASUS의 공동 CEO인 S.Y.Hsu는 현재 ASUS 생산 라인에서 테스트 중인 최초의 휴머노이드(사람을 닮은 로봇) 로봇을 사용하여 회사의 물리적 AI 장치 개발에 대해 논의합니다. 그는 Gallop이 2027년 하반기에 파트너에게 출시되고 2028년에 시장에 출시될 예정이라고 밝혔습니다."},{"s":"유비테크, 메타엑스와 협력해 2028년 로봇 칩 대량 생산","so":"21财经","tm":"11/13 12:23","c":1,"r":"cn","u":"https://www.21jingji.com/article/20261113/herald/52fdd685f52c0ae8b6e9eb9b149a1425.html","p":1794540180,"a":1794576176,"t":"优必选联手沐曦，机器人芯片2028年量产","su":"최근 메타엑스와 유비테크가 공동으로 설립한 임바디드 AI(로봇처럼 몸을 가진 인공지능) 칩 회사인 Xixuan Chuangzhi는 5억 위안, 사후 평가액 40억 위안의 엔젤 라운드 자금 조달(사업에 쓸 돈을 모으는 것)을 완료했습니다. 이번 자금 조달 라운드는 GGV Capital과 Matrix Ventures가 공동으로 주도했으며 Heli Capital, CDH Loongson Ventures, SAIC Hengxu Capital, Yaotu Capital, Zhengxuan Capital, Heart Capital, Advantage Capital, Boyaa Ventures 등이 뒤를 이었습니다. 이번 자금 조달은 주요 SoC 연구 및 개발, 소프트웨어 도구 체인, 팀 구축, 샘플 테스트부터 대량 생산 납품까지의 엔지니어링 링크에 투자됩니다. 두 회사는 각각 칩 설계 및 로봇 공학 시나리오에서 각자의 노동 분업에 따라 35%의 지분 구조를 보유하고 있습니다. 첫 번째 로봇 메인 제어 SoC는 2027년 하반기 테이프아웃, 2028년 양산을 목표로 하는 명확한 리듬을 갖고 있다."},{"s":"로봇부품 구매액은 전년 대비 300% 가까이 증가했고, 장중 로봇ETF 보시(158037) 추적지수도 1% 이상 상승했다.","so":"Jiemian.com","tm":"11/13 11:54","c":1,"r":"cn","u":"https://m.jiemian.com/article/15329587.html","p":1794538440,"a":1794553641,"t":"机器人零部件采购额同比增长近300%，机器人ETF博时(158037)跟踪指数盘中涨超1%","su":"로봇 ETF(여러 주식을 묶어 파는 상품) Boshi(158037)는 장중 1% 이상 상승해 지난 21일 동안 6억 8500만 위안의 자금을 유치했습니다. 징둥닷컴의 산업용 로봇 구매가 거의 300% 증가했으며, 화웨이 Cloud는 11월 16일 CloudRobo 임바디드 월드 모델을 출시할 예정입니다."},{"s":"티로보틱스, KAIST와 ‘피지컬 AI’ 사업화 협력…휴머노이드·AMR 실증 가속","so":"이투데이","tm":"11/13 11:22","c":1,"r":"kr","u":"https://www.etoday.co.kr/news/view/2647851?trc=sub_list_news","p":1794536520,"a":1794539865,"su":"제조피지컬AI연구소와 MOU…표준화 얼라이언스·글로벌 시장 공략카이로스 프로젝트 이어 협력 확대…자체 휴머노이드(사람을 닮은 로봇) ‘티알웍스’ 현장 검증▲티로보틱스"},{"s":"테슬라│테슬라, 사이버트럭 원격조종자동차와 옵티머스 Gen 2.5 인형 출시","so":"香港經濟日報HKET","tm":"11/13 11:00","c":1,"r":"hk","u":"https://inews.hket.com/article/4224397/Tesla%EF%BD%9C%E7%89%B9%E6%96%AF%E6%8B%89%E6%8E%A8Cyber%E2%80%8B%E2%80%8Btruck%E9%81%99%E6%8E%A7%E8%BB%8A%E5%92%8COptimus%20Gen%202.5%E7%8E%A9%E5%81%B6?mtc=20023","p":1794535200,"a":1794539870,"t":"Tesla｜特斯拉推Cyber​​truck遙控車和Optimus Gen 2.5玩偶"},{"s":"베이징은 임바디드 AI 로봇 산업을 위한 3개년 행동 계획을 발표했습니다. 로봇ETF 톈훙(159770)는 어제 3천만주가 넘는 순청약을 기록하며 같은 입찰로 선전증권거래소에서 1위를 차지했다.","so":"Jiemian.com","tm":"11/13 10:22","c":1,"r":"cn","u":"https://www.jiemian.com/article/15328455.html","p":1794532970,"a":1794539869,"t":"北京发布具身智能机器人产业三年行动方案，机器人ETF天弘(159770)昨日净申购超3000万份为深市同标的第一","su":"2026년 11월 12일 거래 종료 기준으로 로봇 ETF(여러 주식을 묶어 파는 상품) 톈훙(159770)는 하루 동안 3,150만 건의 순 청약을 기록하여 심천 증권 거래소의 기본 ETF 중 1위를 차지했습니다. CSI 로봇지수(H30590)는 4.39% 하락했다. 부품주별로는 OPT가 12.71% 하락을 주도했고, OBI Zhongguang이 12.70% 하락했고, SUPCON Technology가 12.09% 하락했으며, Keyuan Wisdom이 8.07%, Evert가 7.99% 하락했다. 11월 12일 현재 로봇ETF '천홍(159770)'에 최근 순유입된 자금은 2,830만 위안이다. 지난 10거래일 동안 총 3453만 위안이 '유치'됐다. [상품 하이라이트] Robot ETF 톈훙 (159770) 로봇 산업 체인의 관점에서 볼 때 기본 지수는 하드웨어 및 소프트웨어의 핵심 영역인 핵심 구성 요소, 알고리즘 제어 모듈 및 모터 배터리 모듈을 다룹니다."},{"s":"천진 경공업 직업 기술 대학, 유니트리와 손잡고 임바디드 AI 산업 대학 설립","so":"新华网","tm":"11/13 10:11","c":1,"r":"cn","u":"http://tj.news.cn/20261113/7b8d3735b49e4aaeb58ce79311be2291/c.html","p":1794532275,"a":1794576176,"t":"天津轻工职业技术学院携手宇树科技共建具身智能产业学院","su":"11월 7일, 천진 경공업 직업 기술 대학과 유니트리는 천진 빈해 신구에서 임바디드 AI(로봇처럼 몸을 가진 인공지능) 산업 대학을 공동으로 설립하기로 합의했습니다. 양 당사자는 임바디드 AI 산업의 발전을 위한 고품질 기술 인재를 제공하는 것을 목표로 전문 구축, 커리큘럼 개발 및 교육 기반 구축에 관한 심층적인 협력을 수행할 예정입니다. 이번 협력은 학교가 산업과 교육의 통합을 심화하고 인공지능과 스마트 제조 산업의 요구를 연결하기 위한 핵심 조치입니다. 임바디드 AI형 로봇 공학에 대한 학교의 전문 지식과 휴머노이드(사람을 닮은 로봇) 로봇, 4족 로봇 및 모션 제어 분야에서 유니트리의 기술 및 자원 이점을 활용하여 양 당사자는 기업 기술 표준과 실제 엔지니어링 프로젝트를 교육 과정에 도입할 것입니다. 현장과 과정을 연계한 종합 교육 모델을 추진하여 로봇 본체 디버깅, 현장 통합, 현장 운영 및 유지보수, 솔루션 전달 역량 등을 갖춘 실무형 인재 양성에 중점을 두고, \"강의실 교육-실제 기계 교육-산업 취업\"의 풀체인 교육 경로를 구축합니다."},{"s":"특징주, 로보스타-로봇(산업용/협동로봇 등) 테마 상승세에 6.24% ↑","so":"매일경제 마켓","tm":"11/13 09:27","c":1,"r":"kr","u":"https://stock.mk.co.kr/news/view/1198101","p":1794529634,"a":1794539865,"su":"특징주, 로보스타-로봇(산업용/협동로봇 등) 테마 상승세(오르는 흐름)에 6.24% ↑ 아이넷 AI 로봇 입력 : 2026.11.13 09:27:14 13일 로봇(산업용/협동로봇 등) 테마가 전일 대비 3.07% 상승하면서 강세(오르는 힘이 센 것)를 보이는 가운데 관련주로 주목받고 있는 로보스타(090360)가 전일 대비 6.24% 상승하며 급등하고 있다. 로보스타는 산업용 로봇 및 FPD장비, IT부품 제조장비 전문업체로 알려져 있다."},{"s":"2026년 11월에 보유할 로봇공학 주식 3개","so":"Yahoo Finance","tm":"11/13 08:24","c":1,"r":"us","u":"https://finance.yahoo.com/markets/stocks/articles/3-robotics-stocks-own-november-232413810.html","p":1794525853,"a":1794539866,"t":"3 Robotics Stocks To Own In November 2026","su":"젠슨 황의 function $(id){ return document.getElementById(id); }
function esc(t){ return String(t==null?'':t).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
// 휴대폰에 기억해 두는 값 (마지막 탭, 탭별로 마지막에 본 시각, 정렬, 국가)
function load(k, d){ try { var v = localStorage.getItem('nb_'+k); return v===null ? d : JSON.parse(v); } catch(e){ return d; } }
function save(k, v){ try { localStorage.setItem('nb_'+k, JSON.stringify(v)); } catch(e){} }
var S = { tab: 0, seen: load('seen', null), sort: load('sort', 'c'), region: load('region', 'all'), shown: D.show, prev: {} };
function newest(t){ var m = 0; t.items.forEach(function(n){ if(n.a > m) m = n.a; }); return m; }
if(S.seen === null){ S.seen = {}; D.themes.forEach(function(t){ S.seen[t.name] = newest(t); }); save('seen', S.seen); }  // 처음 방문: 레드닷 없이 시작
(function(){ var nm = load('tabname', ''); D.themes.forEach(function(t, i){ if(t.name === nm) S.tab = i; }); })();  // 마지막에 본 탭 (이름으로 기억)
if(location.hash && /^#t\d+$/.test(location.hash)) S.tab = +location.hash.slice(2);
if(S.tab >= D.themes.length) S.tab = 0;

function visible(t){
  return t.items.filter(function(n){ return S.region==='all' || n.r===S.region; });
}
function sorted(list, breaking){
  var k = breaking ? 'p' : S.sort;
  return list.slice().sort(function(x,y){
    var c = y.c - x.c, p = y.p - x.p; return k==='c' ? (c||p) : (p||c);
  });
}
function renderTabs(){
  $('tabs').innerHTML = D.themes.map(function(t, i){
    var dot = newest(t) > (S.seen[t.name] || 0) && i !== S.tab;
    return '<button class="tab'+(i===S.tab?' on':'')+'" onclick="openTab('+i+')">'+esc(t.name)+
           '<b>'+visible(t).length+'</b>'+(dot?'<span class="dot" title="새 뉴스"></span>':'')+'</button>';
  }).join('');
  var on = $('tabs').children[S.tab]; if(on && on.scrollIntoView) on.scrollIntoView({block:'nearest', inline:'center'});
}
function renderCtrl(){
  var br = D.themes[S.tab].breaking;
  var h = '';
  if(!br){
    h += '<button class="'+(S.sort==='c'?'on':'')+'" onclick="setSort(\'c\')">🔥 화제순</button>';
    h += '<button class="'+(S.sort==='p'?'on':'')+'" onclick="setSort(\'p\')">🕒 최신순</button><span class="sep"></span>';
  }
  h += '<button class="'+(S.region==='all'?'on':'')+'" onclick="setRegion(\'all\')">전체</button>';
  D.regions.forEach(function(r){
    h += '<button class="'+(S.region===r.k?'on':'')+'" onclick="setRegion(\''+r.k+'\')">'+esc(r.l)+'</button>';
  });
  $('ctrl').innerHTML = h;
}
function card(n, prev){
  var hot = n.c > 1 ? '<span class="hot'+(n.c>=5?' big':'')+'">🔥 언론 '+n.c+'곳</span>' : '';
  var isNew = prev && n.a > prev ? ' <span class="new">NEW</span>' : '';
  return '<a class="card" href="'+esc(n.u)+'" target="_blank" rel="noopener" data-s="'+esc(n.su||'')+'" data-so="'+esc(n.so)+'">'+
    '<div class="meta">'+hot+esc(RL[n.r]||'')+' · '+esc(n.so)+' · '+esc(n.tm)+isNew+'</div>'+
    '<div class="title">'+esc(n.s)+'</div>'+(n.t?'<div class="orig">'+esc(n.t)+'</div>':'')+'</a>';
}
function renderMain(){
  var t = D.themes[S.tab], list = sorted(visible(t), t.breaking), prev = S.prev[t.name] || 0;
  var h = '<h2>'+esc(t.name)+'</h2>' + (t.note ? '<p class="note">'+esc(t.note)+'</p>' : '');
  var fresh = prev ? list.filter(function(n){ return n.a > prev; }).length : 0;
  if(S.onlyNew){                                // '새 기사만 보기' 중
    list = list.filter(function(n){ return n.a > prev; });
    h += '<button class="newbar" onclick="onlyNew(false)">🆕 새 기사 '+list.length+'개만 보는 중 · 전체 보기</button>';
  } else if(fresh && !t.breaking){              // 새 기사가 정렬 때문에 아래로 밀려도 바로 찾을 수 있게
    h += '<button class="newbar" onclick="onlyNew(true)">🆕 새 기사 '+fresh+'개 · 새 기사만 보기</button>';
  }
  if(!list.length) h += '<p class="none">'+(S.region==='all' ? '최근 ' + (t.breaking?'속보':'기사') + ' 없음' : esc(RL[S.region])+' 기사 없음')+'</p>';
  h += list.slice(0, S.shown).map(function(n){ return card(n, prev); }).join('');
  var extra = list.length - S.shown;
  if(extra > 0) h += '<button class="more" onclick="more()">더보기 ▾  ('+extra+'개 더)</button>';
  else if(S.shown > D.show) h += '<button class="more" onclick="less()">접기 ▴</button>';
  var auto = Object.keys(D.auto);
  h += '<footer>업데이트 '+esc(D.updated)+' · 최근 3일 · 믿을 만한 언론사 기사만 · 기사를 누르면 한국어 요약 → 원문 보기<br>'+
       '🔥 언론 N곳 = 같은 소식을 보도한 언론사 수 (많을수록 화제) · <span style="color:var(--red)">●</span> = 새 뉴스'+
       '<br><br><b>자동으로 추가된 언론사</b> (주요 언론보다 먼저 보도하고, 주요 언론도 함께 다룬 소식이 많은 곳 · 최근 14일)'+
       (auto.length ? auto.map(function(k){ return '<div>'+esc(k)+': '+esc(D.auto[k].join(', '))+'</div>'; }).join('') : '<div>아직 없음</div>')+
       '</footer>';
  $('main').innerHTML = h;
}
function openTab(i){
  var t = D.themes[i];
  S.tab = i; S.shown = D.show; S.onlyNew = false; save('tabname', t.name);
  if(!(t.name in S.prev)) S.prev[t.name] = S.seen[t.name] || 0;     // 이 탭에서 NEW 로 보여줄 기준
  S.seen[t.name] = Math.max(S.seen[t.name] || 0, newest(t)); save('seen', S.seen);  // 탭에 들어오면 레드닷 지움
  history.replaceState(null, '', '#t'+i);
  renderTabs(); renderCtrl(); renderMain(); window.scrollTo(0, 0);
}
function setSort(k){ S.sort = k; save('sort', k); S.shown = D.show; renderCtrl(); renderMain(); }
function setRegion(k){ S.region = k; save('region', k); S.shown = D.show; renderTabs(); renderCtrl(); renderMain(); }
function more(){ S.shown += 20; renderMain(); }
function onlyNew(on){ S.onlyNew = on; S.shown = D.show; renderMain(); }
function less(){ S.shown = D.show; renderMain(); window.scrollTo(0, 0); }
$('upd').textContent = '업데이트 ' + D.updated + ' · 탭을 눌러 테마별 뉴스 보기';

// 🚨 미국 속보 · 🌏 해외 속보는 페이지를 새로 올리지 않아도 최신 내용을 바로 가져옴
function refreshBreaking(){
  if(!window.fetch) return;
  fetch(D.breaking_url + '?t=' + Date.now(), {cache:'no-store'}).then(function(r){ return r.json(); }).then(function(b){
    var all = b.items || [];
    D.themes.forEach(function(t, i){
      if(!t.breaking) return;
      var items = all.filter(function(n){ return n.theme === t.name; }).map(function(n){
        var d = {s:n.show, so:n.source||'', tm:n.time||'', c:n.count||1, r:n.rk||'us', u:n.url||n.link, p:Math.floor(n.pub), a:Math.floor(n.added||n.pub)};
        if(n.show !== n.title) d.t = n.title; if(n.sum) d.su = n.sum; return d;
      });
      if(!items.length && t.items.length) return;
      t.items = items;
      if(S.tab === i){ S.seen[t.name] = Math.max(S.seen[t.name]||0, newest(t)); save('seen', S.seen); renderMain(); }
    });
    renderTabs();
  }).catch(function(){});
}
openTab(S.tab);
refreshBreaking();
setInterval(refreshBreaking, 5 * 60 * 1000);
document.addEventListener('visibilitychange', function(){ if(!document.hidden) refreshBreaking(); });

// 기사를 누르면 먼저 한국어 요약 → 원문 볼지 선택
document.addEventListener('click', function(e){
  var c = e.target.closest('a.card'); if(!c) return;
  if(e.ctrlKey||e.metaKey||e.shiftKey) return;
  e.preventDefault();
  $('s-meta').innerHTML = c.querySelector('.meta').innerHTML;
  $('s-title').textContent = c.querySelector('.title').textContent;
  var o = c.querySelector('.orig'); $('s-orig').textContent = o ? o.textContent : '';
  var sm = c.dataset.s || '';
  $('s-sum').textContent = sm || '이 기사는 요약을 가져오지 못했어요. (사이트가 자동 접속을 막았거나 아직 준비 중)';
  $('s-sum').className = 's-sum' + (sm ? '' : ' empty');
  $('s-go').href = c.href;
  // 외국어 기사면 ✦ Gemini 버튼 보이기 (한국어 기사는 숨김)
  var foreign = !!o || !/[가-힣]/.test(c.querySelector('.title').textContent);   // 번역이 안 됐어도 외국 기사면 버튼 표시
  $('s-cs').hidden = $('s-ct').hidden = $('s-cnote').hidden = !foreign;
  if(foreign){
    // 원문을 열고, Gemini 가 '지금 화면'의 기사를 읽고 답하도록 요청 문장만 복사
    $('s-cs').href = $('s-ct').href = c.href;
    $('s-cs').dataset.q = '이 페이지의 기사 전체를 처음부터 끝까지 읽고 한국어로 요약해 줘. 핵심 내용 3~5줄, 그리고 투자자 입장에서 중요한 숫자와 의미를 짧게 정리해 줘.';
    $('s-ct').dataset.q = "너는 어려운 경제 뉴스를 초등학생도 이해할 수 있게 풀어 주는 친절한 번역가야.\n이 페이지의 뉴스 기사 전체를 쉬운 한국어로 번역해 줘.\n\n[가장 중요한 규칙]\n- 쉽게 쓰더라도 기사 내용은 정확해야 해. 사실을 빼거나, 바꾸거나, 지어내지 마.\n- 기사 순서대로, 빠지는 내용 없이 번역해 줘.\n\n[쉽게 쓰는 방법]\n1. 한 문장에는 한 가지 내용만 써 줘. 문장은 짧게.\n2. \"~습니다/~해요\"체로 친절하게 써 줘.\n3. 어려운 말은 쉬운 말로 바꾸고, 꼭 필요한 전문 용어는 처음 나올 때 괄호로 뜻을 풀어 줘.\n   (예: 금리(돈을 빌릴 때 내는 이자의 비율), 실적(회사가 번 돈과 성과), 주가(회사 주식 한 주의 가격))\n4. 한자어·외래어보다 쉬운 우리말을 먼저 써 줘. (예: 하락 → 떨어졌어요, 상승 → 올랐어요)\n5. 큰 숫자는 읽기 쉽게 바꾸되 정확한 값은 지켜 줘. (예: $2.5 billion → 25억 달러(약 3조 5천억 원쯤))\n   환율로 바꾼 값은 \"약\"을 붙여서 대략이라는 걸 알려 줘.\n6. 회사·사람 이름은 한국에서 부르는 이름으로 쓰고, 처음 나올 때만 괄호에 영어 이름을 적어 줘. (예: 엔비디아(Nvidia))\n7. 누가 한 말인지 분명하게 써 줘. (예: 젠슨 황 대표는 \"…\"라고 말했어요.)\n\n[출력 형식]\n① 한 줄 요약: 이 기사가 무슨 이야기인지 한 문장으로\n② 쉬운 번역: 기사 순서대로\n③ 어려운 말 풀이: 기사에 나온 경제 용어 3~5개를 한 줄씩 쉽게 설명\n④ 그래서 무슨 뜻이야?: 이 소식이 주식 투자하는 사람에게 왜 중요한지 2~3줄\n   (기사에 나온 사실만 근거로, 내 생각이나 예측은 넣지 마)\n\n기사가 길어서 한 번에 다 못 하면, 어디까지 했는지 알려 주고 내가 \"계속\"이라고 하면 이어서 해 줘.";
  }
  $('dim').hidden = false; $('sheet').hidden = false; $('sheet').scrollTop = 0;
  document.body.style.overflow = 'hidden';
});
// ✦ 버튼: Gemini 요청 문장을 복사하고 원문을 엶 → 원문 화면에서 Gemini 를 불러 붙여넣기
function askAI(a){
  var q = a.dataset.q || '';
  try { if(navigator.clipboard) navigator.clipboard.writeText(q); } catch(e){}
  toast('요청 문장을 복사했어요 · 원문에서 측면 버튼 길게 → 「이 페이지에 관해 질문하기」 → 붙여넣기');
  setTimeout(closeSheet, 50);
}
function toast(msg){ var t = $('toast'); t.textContent = msg; t.hidden = false; clearTimeout(toast._t); toast._t = setTimeout(function(){ t.hidden = true; }, 4000); }
function closeSheet(){ $('dim').hidden = true; $('sheet').hidden = true; document.body.style.overflow = ''; }
document.addEventListener('keydown', function(e){ if(e.key==='Escape') closeSheet(); });
</script></body></html>
