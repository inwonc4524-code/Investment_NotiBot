so":"Jiemian.com","tm":"11/27 08:37","c":1,"r":"cn","u":"https://m.jiemian.com/article/15379406.html","p":1795736266,"a":1795737892,"t":"动力电池格局重塑，二线阵营分化明显","su":"전력배터리 산업의 구조조정이 지속되고 있다. 11월 26일 CATLA 주식은 주당 204.22위안으로 마감되었으며, 총 시가총액(회사 전체 몸값)은 거의 1조 위안에 달합니다. 기자들의 통계에 따르면 올해 3분기까지 중국 8개 상장 전력 배터리 및 리튬 배터리 기업 중 절반이 전년 동기 대비 순이익(모든 비용을 빼고 남은 돈) 성장을 달성했다. 이 중 CATL이 모회사 귀속 순이익 645억3000만 위안으로 1위를 차지했고, BYD가 223억4500만 위안, 이웨이리튬에너지가 52억4000만 위안으로 뒤를 이었다. 성장률 측면에서는 Penghui Energy가 928.81%로 선두를 차지했고, China New Aviation과 EVE에너지는 각각 99.50%와 86.11% 증가했습니다. 가장 큰 하락폭을 보인 곳은 궈쉬안로 전년 동기 대비 66.48% 하락했습니다. 중국자동차딜러협회 승용차시장정보합작지부 사무국장 Cui Dongshu는 2026년 파워 배터리 시장은 \"두 영웅의 주가는 하락세를 보이고, 2위권은 상승세를 가속화할 것\"이라는 추세를 보일 것이라고 말했다. 궈쉬안, EVE에너지, 지리자동차 Yaoning 등 2위 기업의 주가가 크게 상승했습니다. 후미 기업의 주식은 기본적으로 청산되었습니다. 산업 집중도는 낮아지고 경쟁은 더욱 다양해졌습니다. 그러나 주식이 재분배되는 동안 이익은 동시에 개선되지 않았습니다. 이 격차가 현재 리튬전지 산업의 주축을 이루고 있다. (중국 증권 뉴스) 제몐뉴스는 독립적으로 생각하는 사람들에게만 서비스를 제공합니다."},{"s":"[리포트 브리핑]포스코퓨처엠, 'LFP 전환, 성장영역의 확장' 목표가 260,000원 - 상상인증권","so":"뉴스핌","tm":"11/27 08:31","c":1,"r":"kr","u":"https://www.newspim.com/news/view/20261127000090","p":1795735860,"a":1795737892,"su":"포스코퓨처엠 주가, 앞으로 오를까? 포스코퓨처엠 지금 사도 될까? 포스코퓨처엠 1년 뒤 주가는 얼마일까? 포스코퓨처엠 주가에 영향을 줄 변수는? 본 콘텐츠는 투자 결과에 대한 법적 책임의 근거로 사용될 수 없습니다. [서울=뉴스핌] 로보뉴스 = 상상인증권에서 27일 포스코퓨처엠(003670)에 대해 'LFP 전환, 성장영역의 확장'라며 투자의견(전문가가 사라·팔라고 내는 의견) 'BUY'의 신규 리포트를 발행하였고, 목표가(전문가가 예상한 앞날의 주가) 260,000원을 내놓았다."},{"s":"항공 배터리는 엔지니어링 검증을 향해 나아가고 있으며, 기술과 시장은 여전히 양방향에서 획기적인 발전이 필요합니다.","so":"第一财经","tm":"11/27 08:13","c":1,"r":"cn","u":"https://www.yicai.com/news/103456220.html","p":1795734795,"a":1795737893,"t":"航空电池走向工程验证 技术与市场仍需双向突破","su":"상하이증권뉴스에 따르면 지상에서 하늘까지 전력전지 기업들이 새로운 성장 공간을 찾고 있다. CATL은 11월부터 전기 수직 이착륙기(eVTOL) 회사인 Blue Vector 및 Ivit Aviation과 연속적으로 독점 배터리 협력을 체결했으며, 중국 민간 항공 대학교와 공동 항공 배터리 감항성 기술 혁신 연구소를 구축하는 계약을 체결했습니다. 동시에 11월 14일 COMAC가 개발한 10톤 전기 상용 항공기 CE-25A가 최초의 유인 지능형 비행을 완료했습니다. 많은 인터뷰 대상자들은 1~2년 전과 비교하여 항공 배터리 산업이 단일 성능 지표의 혁신을 추구하는 것에서 항공 등급의 종합적인 성능 및 엔지니어링 역량을 향상시키는 방향으로 나아가고 있다고 믿습니다. 하지만 배터리가 대량생산되고 항공기가 상용화(실제로 팔고 쓰이기 시작하는 것)되기까지는 넘어야 할 난관이 여전히 많다."},{"s":"일본은 전고체 전지로 패권을 취할 수 있는지, LFP 전지의 역사가 나타내는 교훈","so":"日経クロステック","tm":"11/27 05:00","c":1,"r":"jp","u":"https://xtech.nikkei.com/atcl/nxt/column/18/02421/112400138/","p":1795723200,"a":1795733617,"t":"日本は全固体電池で覇権を取れるのか、LFP電池の歴史が示す教訓","su":"지금 세계의 정치용 축전지의 90% 초과, 전기 자동차(EV)용 축전지의 50% 초과를, LFP(인산철(값싸고 불에 강한 배터리 재료) 리튬(배터리에 꼭 들어가는 아주 가벼운 금속), LiFePO4)를 정극재에 이용한 리튬 이온 전지가 차지한다. 그리고 LFP 전지 시장은 중국 메이커가 석권하고 있다."},{"s":"베이징자동차는 CATL과의 관계가 심화됨에 따라 112개의 배터리 교체 스테이션 자산을 매각할 계획입니다.","so":"AutoTechInsight","tm":"11/27 00:03","c":1,"r":"world","u":"https://autotechinsight.spglobal.com/news/5291612/baic-plans-sale-of-112-battery-swap-station-assets-as-catl-ties-deepen","p":1795705388,"a":1795733620,"t":"BAIC plans sale of 112 battery-swap station assets as CATL ties deepen","su":"전체 지분(회사를 나눠 가진 몫)을 소유한 자회사(다른 회사가 주인인 회사)는 세금을 제외하고 최소한 자산 평가 가치인 약 2억 7,800만 위안을 추구할 것입니다."},{"s":"CATL 기술은 Ford 공장에 라이센스가 부여되었습니다. 이번 금지 조치로 중국 기업의 해외 진출을 막을 수는 없다. 중국 배터리, 무역 금지-36Kr의 높은 벽을 극복했습니다","so":"36kr","tm":"11/26 20:59","c":1,"r":"cn","u":"https://www.36kr.com/p/4087421880948352","p":1795694340,"a":1795762636,"t":"宁德时代技术授权福特工厂，禁令挡不住中国企业的出海，中国电池翻过贸易禁令的高墙-36氪","su":"CATL 기술은 포드 공장에 라이센스가 부여되었지만 금지 조치로 인해 중국 기업의 해외 진출을 막을 수는 없습니다. 중국 배터리는 무역 금지 조치를 극복했습니다. Ford는 CATL 인증 기술을 사용하여 LFP(값싸고 불에 강한 배터리 종류(인산철)) 배터리를 대량 생산합니다. 이는 관세 및 지분 검토를 피하기 위해 중국의 신에너지 해외 시장에서 제품 판매에서 기술 라이센스로의 전환을 반영합니다. Foresight Energy는 11월 24일 Ford의 Michigan BlueOval Battery Park 공장이 CATL 인증 기술을 사용하여 인산철(값싸고 불에 강한 배터리 재료)리튬 각형 배터리의 대량 생산을 시작했다는 사실을 알게 되었습니다. 생산 라인은 분당 40개의 배터리를 생산할 수 있습니다. 첫 번째 배터리 배치는 Fathom 프로토타입 자동차에 사용하기 위해 Louisville로 보내졌습니다. Ford는 주식을 보유하지 않으며 CATL은 라이센스 비용을 청구합니다. 생산 라인은 분당 40개를 생산하며, Ford는 이 라인이 중국 외 지역에서 가장 빠른 정사각형 LFP 라인 중 하나라고 말합니다. 공장의 재산권, 기계, 근로자 및 감가상각비는 모두 Ford에 속합니다. CATL은 소유권을 갖고 있지 않습니다. 엔지니어를 보내고, 장인의 기술을 넘겨주고, 단위당 돈을 모으는 것뿐입니다."},{"s":"AIDC 전력 수요 급증, 주요 배터리 제조업체가 새로운 컴퓨팅 전력 트랙을 놓고 경쟁","so":"第一财经","tm":"11/26 20:23","c":1,"r":"cn","u":"https://www.yicai.com/news/103454565.html","p":1795692187,"a":1795694299,"t":"AIDC用电需求激增 头部电池厂商角逐算力新赛道","su":"제일재경 2026-11-26 07:44:34 편집자: Zhou Ling 증권시보에 따르면 인공지능 데이터센터(AIDC)의 전력 수요 급증이 리튬(배터리에 꼭 들어가는 아주 가벼운 금속) 배터리 산업을 새로운 추세로 몰고 가고 있습니다. 올해 초부터 AIDC 분야의 리튬 배터리 주문이 집중적으로 체결되었으며 많은 주요 배터리 제조업체가 새로운 컴퓨팅 파워 트랙에서 경쟁하기 위해 특수 제품을 출시했습니다. 업계 관계자는 AIDC 분야에서 리튬 배터리의 역할이 과거 비상 백업부터 전력 안정화, 단기 전원 공급, 에너지 급전 등 전체 체인으로 확대돼 시장의 새로운 성장축으로 자리잡고 있다고 전했다. 그러나 앞으로 AIDC 경쟁의 초점은 제품 성능에만 국한되지 않을 것입니다. 시스템 구축, 현지화된 납품(만든 물건을 주문한 곳에 넘기는 것), 전체 수명 주기 운영 및 유지 관리 능력은 모두 차별화를 위한 핵심 변수가 될 것입니다."},{"s":"포지션 펀드는 고점 대비 331억 위안 감소했으며, 탄산리튬 선물과 현물은 올해 최저치를 경신했다.","so":"AAStock","tm":"11/26 20:16","c":1,"r":"hk","u":"https://www.aastocks.com/tc/stocks/news/glh-news/GLH2781403L/1","p":1795691760,"a":1795694305,"t":"持倉資金較峯值回落331億元 碳酸鋰期貨、現貨再創年內新低","su":"11월 26일 | 21파이낸스에 따르면 리튬염 제품 가격은 올해에도 계속해서 최저치를 경신했다. 11월 26일, 탄산리튬(배터리 재료로 쓰는 리튬 가루) 선물(미래 값을 미리 정해 사고파는 거래)의 주요 2701 계약은 다시 3.16% 하락했으며 최근 가격은..."},{"s":"스즈키는 중국 공급 위험 속에 희귀 금속 없는 배터리로 전환","so":"Nikkei Asia","tm":"11/26 18:23","c":1,"r":"us","u":"https://asia.nikkei.com/business/automobiles/electric-vehicles/suzuki-turns-to-rare-metal-free-batteries-amid-china-supply-risks","p":1795684980,"a":1795699374,"t":"Suzuki turns to rare metal-free batteries amid China supply risks","su":"일본 자동차 제조업체는 EV에 저렴한 전력을 공급할 국내 공급원이 부족합니다."},{"s":"[K양자기술, 산업화로]〈이차전지〉양자센서로 배터리 미세 자기장까지 한눈에","so":"전자신문","tm":"11/26 17:00","c":1,"r":"kr","u":"https://www.etnews.com/20261126000256","p":1795680000,"a":1795694298,"su":"스마트폰 등 휴대용 전자기기부터 전기차까지 배터리 활용이 확대되면서 품질과 안전성을 확보하기 위한 기술도 한층 발전하고 있다. 특히 배터리의 기본 단위인 셀의 상태를 정밀하게 파악하고 이상을 조기에 찾아내는 검사 기술에 대한 수요도 커지고 있다. 기존 배터리 검사는 주로 전압·전류 등을 측정해 셀의 상태를 평가한다. 이는 셀 전체의 전기적 특성을 보여주지만, 셀 내부 상태의 미세한 차이까지 구분하는 데는 한계가 있다. 양자 자기장 센서(빛·소리·움직임 등을 알아채는 부품)를 활용하"},{"s":"CATL은 실망스럽다","so":"21财经","tm":"11/26 16:18","c":1,"r":"cn","u":"https://www.21jingji.com/article/20261126/herald/60b02ab41430ea6a825052a1f8ffff battery-swapping electric SUV for 2027","su":"계획된 차량은 현재 플러그인 하이브리드로만 판매되는 모델에 배터리-전기 옵션(정해진 값에 사거나 팔 권리)을 추가할 것입니다."},{"s":"탄산리튬이 60% 이상 떨어졌는데, 자동차 회사들은 왜 아직까지 좋은 삶을 누리지 못하는 걸까? -36Kr","so":"36kr","tm":"11/25 22:06","c":1,"r":"cn","u":"https://www.36kr.com/p/4084993668180356","p":1795611978,"a":1795612532,"t":"碳酸锂跌幅超六成，车企咋还没过上好日子-36氪","su":"탄산리튬(배터리 재료로 쓰는 리튬 가루)이 60% 이상 떨어졌는데, 자동차 회사들은 왜 잘 살지 못하는 걸까? 현재 탄산리튬 가격은 계속해서 하락세를 보이고 있다. 동력 배터리의 핵심 원자재(물건의 재료(석유·구리 등))인 탄산리튬 가격은 전체 신에너지 자동차 산업 체인의 민감한 신경에 영향을 미칩니다. 최근 10만 위안/톤, 9만 위안/톤이라는 두 가지 중요한 bp이 잇달아 사라지며 비관론이 확산됐다. 불과 반년 만에 탄산리튬 가격이 약 60% 하락한 셈이다. 이에 자동차 회사들은 탄산리튬이 주는 배당금을 제대로 거두지 못한 것 같지만, 기대와는 많이 다른 그들의 삶은 더욱 어려워지고 있다. 산업체인의 이익 재편으로 인해 자동차 회사는 왜 그렇게 어려운가? 수요가 미리 초과되어 공급이 계속 증가합니다. 신에너지 차량이 대다수가 되었습니다."},{"s":"리튬 배터리 수출은 첫 10개월 동안 137% 급증했으며, 창저우의 아프리카 무역은 30% 증가했습니다.","so":"中国新闻网","tm":"11/25 18:50","c":1,"r":"cn","u":"https://www.chinanews.com.cn/cj/2026/11-25/10737655.shtml","p":1795600233,"a":1795612533,"t":"前十月锂电池出口大增137% 常州对非洲贸易增三成","su":"리튬 배터리 수출은 첫 10개월 동안 137% 증가했으며, 창저우의 아프리카와의 무역은 30% 증가했습니다. 중국신보사, 창저우, 11월 25일(탕환 기자) 25일 창저우 세관 통계에 따르면 2026년 10월까지 창저우의 대외 무역 수출입 총액은 3325억6000만 위안으로 전년 대비(작년 같은 때와 비교해서) 8.9% 증가해 규모와 성장률 측면에서 장쑤성에서 5위를 차지했다. 그 중 리튬전지 수출액은 93억9000만 위안으로 동기 대비 137.2% 증가했다. 아프리카 수출입액은 146억 2천만 위안으로 동기 대비 30.8% 증가했습니다. 신에너지 제품의 수출과 신흥 시장의 발전은 창저우 대외 무역의 가장 두드러진 성장 포인트가 되었습니다. 4분기에 들어서면서 창저우의 대외 무역은 크게 가속화되었습니다. 10월 월 수출입액은 371억7000만 위안으로 전년 동기 대비 34.5% 증가했다. 대외무역 규모는 1분기 이후 분기별로 증가했다. 구조적으로 일반무역 수출입액은 2,807.5억 위안으로 대외무역 총액의 84.4%를 차지하며 지배적 지위는 안정적이었다. 가공무역 수출입액은 425억 위안으로 동기 대비 21.6% 증가했고 그 비중은 전년 동기 대비 1.3% 증가했다. 가공무역 비중의 반등은 국내 기업의 국제 수주(일감 주문을 받는 것) 능력이 지속적으로 향상되고 있음을 반영한다."},{"s":"CATL 주가 급락, 기관에서는 리튬 배터리 이익 및 생산 일정 기대가 압박을 받고 있다고 말합니다.","so":"第一财经","tm":"11/25 18:32","c":1,"r":"cn","u":"https://www.yicai.com/news/103454142.html","p":1795599178,"a":1795608190,"t":"宁德时代股价大跌，机构称锂电盈利、排产预期承压","su":"11월 25일, CATLA 주가는 8.33% 하락한 208.42위안으로 마감했으며, 총 시가총액(회사 전체 몸값)은 약 9,644억 위안으로 1조 위안 아래로 떨어졌습니다. 이는 2025년 4월 14일 이후 최저치이며 올해 5월 초 최고 수준에서 거의 55% 되돌린 수치입니다. H주는 12.23% 하락한 HK$295.6에 마감했으며, 올해 6월 초 고점 대비 누적 하락폭은 약 62%다. 같은 날 플러시배터리 업종지수(881281)도 6.12% 하락하며 큰 폭 하락했다. CATL과 리튬 배터리 업계를 둘러싼 여러 소식도 기관들이 배터리 재고 이익 전망을 낮추고, 11월 생산 일정을 낮추고, 탄산리튬(배터리 재료로 쓰는 리튬 가루) 선물 가격이 급락하는 등 시장의 주목을 받고 있다."},{"s":"논평: CATL에서 사업을 다각화하는 EV 제조사에게 낮은 가격이 항상 더 낮은 비용은 아닙니다.","so":"Caixin Global","tm":"11/25 17:57","c":1,"r":"us","u":"https://www.caixinglobal.com/2026-11-25/commentary-for-ev-makers-diversifying-from-catl-a-lower-price-isnt-always-a-lower-cost-102508665.html","p":1795597020,"a":1795608187,"t":"Commentary: For EV-Makers Diversifying From CATL, a Lower Price Isn’t Always a Lower Cost","su":"배터리는 자동차 재료비의 30% 이상을 차지하기 때문에 자동차 제조사에게는 더 저렴한 셀이 중요합니다. 그러나 보증 비용, 리콜 및 브랜드 손상은 절감액이 적립된 지 몇 년 후에 발생할 수 있습니다."},{"s":"<시간외 홍콩 증시> 항셍지수는 1.14% 하락하며 22,000선을 무너뜨렸다. 칩·리튬배터리 주가 급락","so":"鉅亨網","tm":"11/25 17:32","c":1,"r":"tw","u":"https://news.cnyes.com/news/id/6671683","p":1795595556,"a":1795608192,"t":"〈港股盤後〉恒指跌1.14% 失守22000點關口 晶片與鋰電池股重挫","su":"<시간외(정규 시간이 끝난 뒤 하는 거래) 홍콩 증시> 항셍지수는 1.14% 하락하며 2만2000선을 하회했다. 칩과 리튬 배터리 주가가 급락했다. 거형망(Anue) 뉴스센터 홍콩 주요 주가지수는 수요일(25일) 종합적으로 마감했고 항셍지수는 '7연속 하락'을 기록했습니다. 항셍지수는 장 초반 33포인트 상승한 뒤 288포인트나 오른 22,507포인트를 기록했다. 오후에는 하락세로 돌아서 22,000포인트 아래로 하락해 1.14% 하락한 21,966.01포인트에 마감했습니다. 항셍테크지수는 2.56% 하락한 3,378.26포인트로 마감했다. 국영기업지수는 0.91% 하락한 7,384.94포인트로 마감했다. 전체 시장의 하루 거래량(하루 동안 사고판 주식 수)은 2,299억 8천만 홍콩달러에 달했고, 홍콩증권거래소의 남쪽 방향 자금은 추세를 거스르며 64억 3,400만 홍콩달러를 순유입했습니다. 총 644개 종목이 상승했고, 1,744개 종목이 하락했다."},{"s":"CATL, 실적 부진과 강제 매도 우려로 12% 급락","so":"Bloomberg","tm":"11/25 17:25","c":1,"r":"us","u":"https://www.bloomberg.com/news/articles/2026-11-25/catl-tumbles-12-on-fears-over-weak-earnings-forced-selling","p":1795595156,"a":1795608188,"t":"CATL Tumbles 12% on Fears Over Weak Earnings, Forced Selling"},{"s":"CATL의 1,300억 달러 급락; BMW의 중국 대규모 해고: EV 7개 읽기","so":"South China Morning Post","tm":"11/25 16:30","c":1,"r":"sg","u":"https://www.scmp.com/business/china-evs/article/3375716/byd-apologises-wheel-rim-error-chinese-car-buyers-go-electric-7-ev-reads","p":1795591811,"a":1795608202,"t":"CATL’s US$130 billion plunge; BMW’s massive lay-offs in China: 7 EV reads"},{"s":"태그 검색 - CATLA 공유","so":"明報財經網","tm":"11/25 16:24","c":1,"r":"hk","u":"https://finance.mingpao.com/fin/specialpage3.php?tag=%E5%AF%A7%E5%BE%B7%E6%99%82%E4%BB%A3A%E8%82%A1","p":1795591489,"a":1795608196,"t":"標籤搜尋 - 寧德時代A股"},{"s":"LFP 양극재용 인산철 전구체 중국이 92% 장악, 엘앤에프·포스코퓨처엠 '무전구체' LFP 개발 속도","so":"비즈니스포스트","tm":"11/25 15:51","c":1,"r":"kr","u":"https://www.businesspost.co.kr/BP?command=article_view&num=452904","p":1795589460,"a":1795608186,"su":"LFP 양극재(배터리에서 전기를 내보내는 쪽의 핵심 재료) 생산에 필수적인 인산철(FP) 전구체 공급망(부품·재료가 오가는 연결망)을 중국 기업들이 사실상 독점하고 있는 만큼, 해당 소재를 사용하지 않는 새로운 제조 공정을 통해 원가 경쟁력을 확보하겠다는 구상이다. 하지만 중국 기업들도 무전구체 기술 개발과 생산설비 증설에 나서고 있어 기술 선점 경쟁이 본격화할 것으로 전망된다. 25일 배터리 업계 취재를 종합하면 엘앤에프와 포스코퓨처엠 등 국내 양극재 기업들이 중국의 저가공세 속에서 수익성을 확보하기 위해 무전구체 LFP 양극재 개발에 나설 필요성이 커진 것으로 분석된다."},{"s":"게임 수출은 이차전지급, 지원은 '사각지대'... “국가전략자산으로 키워야”","so":"전자신문","tm":"11/25 15:34","c":1,"r":"kr","u":"https://www.etnews.com/20261125000447","p":1795588498,"a":1795589899,"su":"게임을 국가전략콘텐츠자산으로 지정하고 세제·금융·인공지능(AI) 전환까지 국가 차원에서 집중 지원해야 한다는 목소리가 커지고 있다. 콘텐츠 수출의 절반 이상을 게임이 담당하고 가전·이차전지와 맞먹는 수출 규모를 기록하고 있지만, 현행 산업 지원체계가 제조업 중심으로 설계돼 게임이 정책 사각지대에 놓여 있다는 지적이다. 김성회 더불어민주당 의원은 25일 국회에서 열린"}]},{"name":"⚡ 전고체배터리·ESS","note":"보유: KODEX 전고체배터리ESS TOP2플러스","breaking":false,"items":[{"s":"3차 ESS 중앙계약시장 우선협상 대상자 선정…14곳 구축","so":"연합뉴스","tm":"11/26 19:57","c":7,"r":"kr","u":"https://www.yna.co.kr/view/AKR20261126190700530","p":1795690644,"a":1795694317,"su":"(서울=연합뉴스) 이재영 기자 = 제3차 에너지저장장치(ESS(전기를 저장해 두는 큰 배터리)) 중앙계약시장 우선협상 대상자를 선정했다고 기후에너지환경부와 전력거래소가 26일 ..."},{"s":"중국 최초의 600MW 압축 공기 에너지 저장 시스템 확장기가 생산 라인에서 성공적으로 출시되었습니다.","so":"央视网","tm":"11/25 13:31","c":4,"r":"cn","u":"https://news.cctv.com/2026/11/25/ARTIkgQ4mgsDIZQEdz8okktV261125.shtml","p":1795581079,"a":1795582121,"t":"我国首套600MW级压缩空气储能系统膨胀机顺利下线","su":"최근 중국은 압축 공기 에너지 저장 시스템의 연  발전을 처리하는 전력망(발전소 전기를 집·공장까지 보내는 전깃줄 그물)에 압축 공기 저장 장치를 보다 경제적인 옵션으로 만드는 데 도움이 될 수 있습니다. 중국 개발자들은 새로운 장비를 운영 시설에 배치하고 평가해야 하지만 기술을 확장하면 단위 전력 비용을 최대 30%까지 낮추고 시스템 효율성을 향상시킬 수 있다고 말합니다."},{"s":"도쿄도, 도내 피난소의 절반에 태양광 발전 설비와 축전지 설치 30년까지","so":"日本経済新聞","tm":"11/27 19:14","c":1,"r":"jp","u":"https://www.nikkei.com/article/DGXZQOCC277ZA0X21C26A1000000/","p":1795774468,"a":1795780879,"t":"東京都、都内避難所の半数に太陽光発電設備と蓄電池設置 30年までに","su":"도쿄도는 27일 2030년까지 도내 피난소의 약 3200곳 중 절반 이상에 태양광(햇빛으로 전기를 만드는 것) 발전 설비와 축전지를 설치한다고 발표했다. 구마모토 지진에서는 정전으로 피난소의 더위 대책이 문제가 되었다. 자립전원을 확보함과 동시에 단열화도 진행되어 격렬화하는 재해에 대비한다. 도유시설에서 태양광발전이나 축전지의 설치와 단열화를 진행시켜 구시정촌의 대처도 지원한다. 설치 비용의 보조율을 현재의 3분의 2"},{"s":"GX ZEH로 HEMS가 필수로 파나소닉 「AiSEG3」가 타사제 축전지를 제어, 잉여 전력으로 가전을 자동 운전","so":"ITmedia","tm":"11/27 18:21","c":1,"r":"jp","u":"https://built.itmedia.co.jp/bt/articles/2611/27/news054.html","p":1795771260,"a":1795780880,"t":"GX ZEHでHEMSが必須に パナソニック「AiSEG3」が他社製蓄電池を制御、余剰電力で家電を自動運転","su":"파나소닉 일렉트릭웍스는 2027년 4월부터 적용되는 고성능 주택의 새로운 정의 「GX ZEH」에 대응하기 위해 HEMS 「AiSEG3」의 기능을 강화한다. 2027년 1월 25일 업데이트로 타사제 축전지의 충방전 제어나 태양광(햇빛으로 전기를 만드는 것) 발전의 잉여 전력을 활용한 가전제어에 대응한다. GX ZEH의 보급에 수반하는 HEMS 수요의 확대를 전망해, 2029년도에 AiSEG 시리즈의 누계 판매 대수 70만대를 목표로 한다."},{"s":"정흥전기, 최초의 R&D 거점을 개설 전고체 전지 등 신기술에 도전한다","so":"日本経済新聞","tm":"11/27 17:40","c":1,"r":"jp","u":"https://www.nikkei.com/article/DGXZQOJC243KZ0U6A121C2000000/","p":1795768800,"a":1795780881,"t":"正興電機、初のR&D拠点を開設 全固体電池など新技術に挑む","su":"정흥전기제작소는 27일 동사로서 최초의 연구개발(R&D) 거점인 '히비키의 연구개발센터'(기타큐슈시)의 개설식을 열었다. 동거점은 2일부터 운용을 시작하고 있다. 자전 중심의 방침으로부터 전환해, 산학관 제휴에 의한 차세대 기술의 개발을 목표로 한다. 동시 와카마츠구의 기타큐슈 학술 연구 도시 내에 입지해, 연구 개발동과 첨단 모노즈쿠리동으로 이루어진다. 연 바닥면적은 총 5300제곱미터로 약 51억엔을 들여 정비했다. 사업별로 배치"},{"s":"동서발전, ESS 입찰물량 57% 확보…국내 최대 용량 선점","so":"뉴시스","tm":"11/27 16:26","c":1,"r":"kr","u":"https://www.newsis.com/view/NISX20261127_0003886502","p":1795764392,"a":1795780876,"su":"[울산=뉴시스] 구미현 기자 = 한국동서발전이 에너지저장장치(ESS(전기를 저장해 두는 큰 배터리)) 중앙계약시장 입찰에서 전체 물량의 절반 이상을 확보하며 국내 최대 규모의 배터리에너지저장장치(BESS) 용량을 확보했다.한국동서발전은 '2026년 제3차 E ":"https://jnzstatic.cs.com.cn/zzb/htmlInfo/139304.html","p":1795741560,"a":1795749585,"t":"国金证券： 全球储能增长趋势明确","su":"Sinolink Securities: 글로벌 에너지 저장 성장 추세는 분명합니다. Lin Qian CSI Taurus 최근 Sinolink Securities는 전 세계 에너지 저장 수요가 빠른 속도로 계속 증가하고 있으며 산업 발전이 점차 정책 중심에서 전력 시스템 유연성 요구 및 프로젝트 경제성으로 전환하고 있다는 연구 보고서를 발표했습니다. 2026년과 2027년 전 세계 신규 설치 에너지 저장 용량은 430GWh, 595GWh로 전년 대비(작년 같은 때와 비교해서) 40%, 38% 증가할 것으로 예상된다. 지속적인 신에너지 설비용량 증가, 전력부하 증가, 그리드 규제 수요 증가 등이 글로벌 에너지저장 시장 확대를 함께 촉진하고 있다. 중국, 유럽, 미국, 신흥시장 등이 다지역적 공명을 형성할 것으로 예상된다. Sinolink Securities는 높은 해외 배송 비율, 글로벌 채널 레이아웃, 수직 통합 제조 능력 및 우수한 금융 가능성을 갖춘 선도적인 에너지 저장 시스템 통합업체와 네트워크 구축 기술 및 시스템 제어 분야에서 우위를 점하고 있는 PCS 기업에 초점을 맞춰 글로벌 에너지 저장 장치 성장 추세가 분명하다고 밝혔습니다."},{"s":"산화물계 전고체 전지, 150℃에서도 안정된 방전 동작 FDK：고온 설비 주변에서 상태 감시가 가능하게","so":"EE Times Japan","tm":"11/27 09:30","c":1,"r":"jp","u":"https://eetimes.itmedia.co.jp/ee/articles/2611/27/news033.html","p":1795739400,"a":1795749588,"t":"酸化物系全固体電池、150℃でも安定した放電動作 FDK：高温設備周辺で状態監視が可能に","su":"FDK는 SMD 소형 산화물계 전고체(액체 대신 고체를 넣어 더 안전한 배터리) 전지 「SoLiCell」이 150℃라는 고온 환경하에서도 안정된 방전 동작을 할 수 있는 것을 확인했다. 고온 설비 주변에서 상태 감시를 실시하는 센서(빛·소리·움직임 등을 알아채는 부품)나 IoT 디바이스 등의 용도를 향한다."},{"s":"정흥전기, 최초의 연구거점 AI와 사외의 지견 활용해 축전지 개발에","so":"毎日新聞","tm":"11/27 07:45","c":1,"r":"jp","u":"https://mainichi.jp/articles/20261126/k00/00m/310/134000c","p":1795733100,"a":1795733642,"t":"正興電機、初の研究拠点 AIと社外の知見活用し蓄電池開発へ","su":"전력회사용 인프라 제어시스템 등을 다루는 정흥전기제작소는 '히비키의 연구개발센터'(기타큐슈시 와카마츠구)를 개설했다. 기타큐슈학술연구도시에 있으며, 동사에 있어서는 1921년의 창업 이래, 최초의 연구개발 거점. 대학이나 기업과 연계를 추진해 인공지능(AI)을 활용한 전력 인프라와 축전지의 연구개발을 담당한다."},{"s":"일본 국내 최대급의 축전소, 12월 가동 오릭스가 시가·요네하라의 시유지에","so":"朝日新聞","tm":"11/27 07:30","c":1,"r":"jp","u":"https://www.asahi.com/articles/ASVCT4J93VCTPTJB003M.html","p":1795732200,"a":1795733645,"t":"国内最大級の蓄電所、12月稼働 オリックスが滋賀・米原の市有地に","su":"오릭스는 시가현 요네하라시 번장에 정비한 ‘요네하라코 동축전소’의 상업운전을 12월 1일에 시작한다. 출력은 13만 4천킬로와트, 축전 용량은 54만 8천킬로와트시로, 일반 가정 약 5만 1천 가구가 하루에 사용하는 전력량에…"},{"s":"배터리 팩 뚜껑은 자동차 바닥, 중국 EV \"B05\"를 분해 코스파의 원천에 육박","so":"日経クロステック","tm":"11/27 05:00","c":1,"r":"jp","u":"https://xtech.nikkei.com/atcl/nxt/column/18/03520/112400028/","p":1795723200,"a":1795733649,"t":"電池パックのフタは車の床、中国EV「B05」を分解 コスパの源泉に迫る","su":"중국 립모터는 '코스파'가 높은 대중차를 주력으로 삼아 중국 신흥자동차 업체 중 판매 선두를 독주하는 주목 기업이다. 이번에 닛케이 BP의 프로젝트 팀은 립 모터의 전기 자동차 \"B05\"를 분해. 비용 경쟁력의 원천에 다가갔다."},{"s":"전고체 전지의 입자를 검사 아르코닉스계에 매료","so":"日本経済新聞","tm":"11/27 05:00","c":1,"r":"jp","u":"https://www.nikkei.com/prime/mobility/article/DGXZQOUC122M30S6A111C2000000","p":1795723200,"a":1795733653,"t":"全固体電池の粒子を検査 アルコニックス系に引き合い","su":"마크텍의 분체입자의 강도를 조사하는 장치 도요타 자동차 등 일본차 메이커가 전고체(액체 대신 고체를 넣어 더 안전한 배터리) 전지 개발을 진행하는 가운데 개발 시 성능 등을 확인하는 검사 수요가 발생하고 있다. 전기자동차(EV)의 항속거리 등의 성능은 전지를 구성하는 입자의 밀도 등이 좌우한다. 비철금속상사 아르코닉스의 그룹사가 의약품과 화장품으로 길러온 분체의 검사 수탁으로 새로운 수요 섭취를 목표로 한다. 일하고 있는 것은 물질의 검사를 다루는 마크텍(도쿄·대전)이다. 대상을 파괴하지 않고 실시하는 검사"},{"s":"1분 만에 기술: 장기 에너지 저장 이점을 갖춘 플로우 배터리","so":"DIGITIMES","tm":"11/27 02:25","c":1,"r":"tw","u":"https://www.digitimes.com.tw/tech/dt/n/shwnws.asp?id=776242","p":1795713938,"a":1795733638,"t":"科技1分鐘：具長時儲能優勢的液流電池","su":"풍력(바람으로 전기를 만드는 것)과 태양광(햇빛으로 전기를 만드는 것) 발전 비중이 높아지면서 AI도 전력 수요를 증가시킨다. 그리드는 잉여 전력을 저장했다가 전력 생산량이 감소해도 계속해서 전력을 공급해야 합니다. 이에 플로우 배터리(Flow Battery)가 주목받고 있다. 수요에 따라 에너지 저장 용량을 확장하고 전원 공급 시간을 연장할 수 있습니다."},{"s":"유해한 \"잔류 알칼리\"가 \"방호복\"이 됩니다! 중국 나트륨이온 배터리 연구의 새로운 돌파구","so":"ThePaper.cn","tm":"11/26 23:41","c":1,"r":"cn","u":"https://www.thepaper.cn/newsDetail_forward_34568292","p":1795704091,"a":1795733633,"t":"有害“残碱”变“防护衣”！我国钠离子电池研究有新突破","su":"◎ 과학기술일보 양룬 기자 대규모 에너지 저장 발전소의 비용을 어떻게 줄일 수 있을까? 전기 자전거로 안전과 배터리 수명의 균형을 맞추는 방법은 무엇입니까? 원자재(물건의 재료(석유·구리 등))가 풍부한 나트륨이온(리튬 대신 소금 성분(나트륨)을 쓰는 배터리)전지는 이러한 문제를 해결하기 위한 중요한 선택이다. 나트륨 배터리는 저장용량, 빠른 충전 속도, 수명이 매우 중요합니다."},{"s":"[모닝포스트] 신에너지저장 블록버스터 시행계획 발표… TCL Zhonghuan과 China Rare Earth는 다음 월요일에 거래를 재개합니다","so":"财联社","tm":"11/26 17:23","c":1,"r":"cn","u":"https://www.cls.cn/detail/2534356","p":1795681424,"a":1795694321,"t":"【早报】新型储能重磅实施方案印发；TCL中环、中国稀土下周一复牌","su":"①10월 재무 데이터 공개 ②중앙은행(나라의 돈과 이자를 관리하는 은행): 2000억 위안 규모의 매입 역환매 작업이 11월 16일 6개월 기간으로 진행된다. ③ 엔비디아 주가는 이번 주 13% 하락했다. ④ 2개 부문: 중국의 신규 에너지 저장 장치 설치 용량은 2030년까지 3억 킬로와트에 달할 것이다. ⑤TCL 센트럴과 중국 희토류는 다음 주 월요일 거래를 재개할 예정이다. 매크로뉴스 1. 중앙은행 자료에 따르면 예비통계에 따르면 2026년 1~10월 사회융자 누적 증가액은 28조6100억 위안으로 지난해 같은 기간보다 2조2900억 위안이 줄었다. 10월 말 광의통화잔고(M2)는 359조600억 위안으로 전년 동기 대비 7.1% 증가했다. 10월 말 기준 내외대출 잔액은 287조2500억 위안으로 전년 동기 대비 4.6% 증가했다. 월말 기준 위안화 대출 잔액은 283조3300억 위안으로 전년 동기 대비 4.7% 증가했다. 첫 10개월 동안 위안화 대출은 11조4200억 위안 증가했다."},{"s":"GFESS 배터리 ETF는 400만주의 순청약을 보유하고 있으며, 안전마진이 높은 저위험군에서는 현재 프리미엄 및 할인율이 -0.23%이다.","so":"经济观察网","tm":"11/26 15:41","c":1,"r":"cn","u":"http://www.eeo.com.cn/2026/1126/1103898.shtml","p":1795675260,"a":1795694322,"t":"储能电池ETF广发净申购400万份份额，当前溢折率-0.23%处低风险区安全边际较高","su":"경제 관찰자 네트워크 에너지 저장 배터리 ETF(여러 주식을 묶어 파는 상품) Guangfa (159305)는 11월 25일 400만개를 순매수(산 돈이 판 돈보다 많은 것)했으며 이는 ETF 펀드 점유율의 0.43%를 차지합니다. 펀드의 최근 주식수는 9억2800만주로 상장 이후 누적 증가액은 7억700만주다. 최근 규모는 5억2200만 위안으로 증가했다."},{"s":"[철도 에너지 전환, 현장에서 길을 찾다] ⑥ 같은 ESS, 다르게 쓴다…동해선 평해·후포역 전력비 절감법","so":"전기신문","tm":"11/26 10:09","c":1,"r":"kr","u":"https://www.electimes.com/news/articleViewAmp.html?idxno=375233","p":1795655380,"a":1795663014,"su":"[철도 에너지 전환, 현장에서 길을 찾다] ⑥ 같은 ESS(전기를 저장해 두는 큰 배터리), 다르게 쓴다…동해선 평해·후포역 전력비 절감법 태양광(햇빛으로 전기를 만드는 것)은 주간 자가소비, ESS는 심야 충전…두 무인역서 시범운영 태양광 규모·전력 수요 고려해 운전…계절별 요금 시간대도 반영 LTE 원격 감시·이상 알림 적용…모듈별 소화설비로 안전관리 강화 지난달 16일 찾은 동해선 평해역. 열차 이용객을 맞는 역사 한편에서 에너지저장장치(ESS)가 정해진 시간표에 따라 충전과 방전을 반복한다."},{"s":"전고체 배터리 상용화 걸림돌 ‘압력’ 낮췄다… 포스텍, 저압 구동 구현","so":"Chosunbiz","tm":"11/26 09:08","c":1,"r":"kr","u":"https://biz.chosun.com/science-chosun/science/2026/11/26/4FFJXM45R5G57PLURYD5RVT2UE/?outputType=amp","p":1795651680,"a":1795663014,"su":"국내 연구진이 상온에서 낮은 압력으로도 안정적으로 작동하는 전고체 리튬금속전지를 개발했다. 전고체 배터리(액체 대신 고체를 넣은 안전한 배터리)의 상용화(실제로 팔고 쓰이기 시작하는 것) 걸림돌 중 하나인 높은 가압 조건을 완화할 수 있는 기술로, 향후 배터리의 무게와 부피를 줄이는 데 활용될 가능성이 있다. 박수진 포스텍 화학과 교수 연구진은 중앙대, 한국기초과학지원연구원(KBSI), 미 서던메소디스트대(SMU) 연구진과 공동으로 상온에서 0.3㎫(메가파스칼) 이하의 압력으로 작동하는 전고체 리튬금속전지를 구현했다고 26일 밝혔다."},{"s":"축전지, 주력 전원에","so":"日経クロステック","tm":"11/26 06:33","c":1,"r":"jp","u":"https://xtech.nikkei.com/atcl/nxt/column/18/03385/index.html?%3Fi_cid=nbpnxt_bn_child&fieldSubSeg=fdxKEYWORDUSBKEYWORDSoC","p":1795642414,"a":1795676852,"t":"蓄電池、主力電源に","su":"리튬(배터리에 꼭 들어가는 아주 가벼운 금속) 이온 전지를 이용한 축전지는 재생 가능 에너지의 출력 변동을 평준화하는 툴로서 전세계의 전력 계통에 대량 도입되고 있다. 해외에서는 이미 주력전원 중 하나가 된 예도 나왔다."},{"s":"27년 중국 자동차 '10대 기술', 전고체 전지에 브레이크스루 E2E는 벗어난다","so":"日経クロステック","tm":"11/26 05:00","c":1,"r":"jp","u":"https://xtech.nikkei.com/atcl/nxt/column/18/03565/112200049/","p":1795636800,"a":1795647129,"t":"27年の中国自動車「10大技術」、全固体電池にブレークスルー E2Eは外れる","su":"중국의 자동차 기술자 단체인 중국 자동차 공정 학회(CSAE)가 2027년 주목되는 자동차 기술 트렌드 10선(이하 10대 기술)을 발표했다. CSAE는 자동차 메이커나 부품 메이커의 기술자도 많이 참가하고 있다. 10대 기술에는 단순한 예측이라기 보다 목표로 하는 방향을 명확하게 하는 목표 설정으로서의 의미도 크다. 과거의 10대 기술의 경향과 비교함으로써 중국세의 미래 전략의 일단이 보였다."},{"s":"에너지 저장 정책은 Xiter의 보충을 지원합니다 - 매일","so":"工商時報","tm":"11/26 04:00","c":1,"r":"tw","u":"https://www.ctee.com.tw/news/20261126700322-439901","p":1795633200,"a":1795647125,"t":"儲能政策助攻熙特爾進補- 日報","su":"지난 10월 국립대만경제연구소가 발행한 '에너지 저장 산업'에 대한 미래 전망 산업 분석 보고서에서는 경제부 에너지 관리국이 기술적 에너지 저장 촉진을 확대할 계획이며, 이는 2026년 새로운 에너지 저장 구축 증가를 지원하는 데 도움이 될 것이라고 지적했습니다. 데이터 센터와 같은 대규모 전력 소비자가 적극적으로 에너지 저장 및 기타 에너지 절약 조치를 모색하는 환경에서 Xitel-Chuang의 중장기 운영 성과에 도움이 될 것입니다. (7740). 대만 증권 거래소와 대만 경제 아카데미는 협력하여 정기적으로 업계 보고서를 발행합니다. 대만 경제원(Taiwan Academy of Economics)은 지난 10월 에너지 저장 산업에 관한 산업 발전 보고서를 발표했습니다."},{"s":"동화일렉트로라이트, 북미서 신규 배터리 고객사 확보","so":"디일렉","tm":"11/25 17:26","c":1,"r":"kr","u":"https://www.thelec.kr/news/articleView.html?idxno=65915","p":1795595193,"a":1795608210,"su":"동화일렉트로라이트가 북미 전해액 사업의 고객 기반을 확대했다. 신규 고객사는 글로벌 배터리 시장 점유율 상위 10대 기업 중 한 곳이다.동화일렉트로라이트는 글로벌"},{"s":"화웨이 Smart String Grid Forming ESS Platform, 업계 최초로 TÜV SÜD 최고 등급(L4) 그리드포밍 인증 획득","so":"뉴시스","tm":"11/25 16:41","c":1,"r":"kr","u":"https://www.newsis.com/view/ALSX20261125_0000008356","p":1795592468,"a":1795612541},{"s":"요코가와 전기, 중소 플랜트용 컨트롤러 전고체 전지를 채용","so":"日本経済新聞","tm":"11/25 16:17","c":1,"r":"jp .단지는 영주시 가흥동 1059-10번지 일원에 지하 2층~지상 최고 29층, 8개동 규모로 조성된다.주택형별로 전용면적 84㎡ 708가구, 113㎡ 57가구다. 전용 84㎡는 A·B·C·D 등 4개 타입으로 구성된다.청약(새로 사겠다고 신청하는 것) 일정은 다음달 2일 특별공급을 시작으로 3일 1순위, 4일 2순위 순으로 진행된다. 당첨자는 10일 발"},{"s":"도쿄전력, AI 인프라에 10조엔 데이터센터용 송전망·원전 증강","so":"日本経済新聞","tm":"11/26 18:00","c":3,"r":"jp","u":"https://www.nikkei.com/article/DGXZQOUA048R70U6A101C2000000/","p":1795683600,"a":1795694339,"t":"東京電力、AIインフラに10兆円 データセンター向け送電網・原発増強","su":"도쿄전력홀딩스는 인공지능(AI) 인프라가 되는 송전(전기를 멀리 보내는 것)망이나 원자력발전소에 2035년도까지 9년간 10.2조엔을 던져 미국 하이퍼스케일러(대규모 클라우드(인터넷으로 빌려 쓰는 컴퓨터) 사업자) 등 데이터센터(DC)를 유치한다. 타사로부터 출자를 받아들여 외부 자본을 활용한다. 전력판매 확대로 후쿠시마 제1원자력발전소의 폐로 비용을 비싼다. 토덴은 소프트뱅크와 일본 국내외 투자펀드의 총 5진영과 자본제휴를 위한 협상을 진행하고 있다."},{"s":"미국 칩 제어가 AI 레이아웃에 영향을 미침 태국 데이터 센터 협회: 대만의 장점 | 산업경제학","so":"中央社 CNA","tm":"11/27 15:42","c":2,"r":"tw","u":"https://www.cna.com.tw/news/afe/202611270121.aspx","p":1795761720,"a":1795762663,"t":"美晶片管制牽動AI布局泰國資料中心協會：台灣具優勢| 產經","su":"미국은 AI 칩(인공지능 계산에 쓰는 반도체) 수출 규제를 강화했고, 태국의 관련 산업도 어려움을 겪고 있다. 태국 데이터센터(컴퓨터 수만 대를 모아 둔 건물) 협회 부회장인 수팔랏(Supalat)은 CNA에 정부가 최근 데이터센터에 전력을 할당하기 시작했으며 운영자들은 여전히 고객 분포를 조정하고 영향을 줄일 수 있는 능력을 갖고 있다고 말했습니다. 대만은 기술적, 재정적 이점으로 인해 동남아시아 AI 산업에서 중요한 역할을 할 수 있다."},{"s":"대동의 3개 도로는 성과를 위해 노력하기 위해 병행하여 전진하고 있습니다. 모듈형 컴퓨팅 파워 센터는 다음 분기에 주문을 받을 것으로 예상됩니다.","so":"UDN","tm":"11/27 02:52","c":2,"r":"tw","u":"https://udn.com/news/story/7240/9904579","p":1795715573,"a":1795733669,"t":"大同三路並進拚業績 模組化算力中心下季可望接單","su":"다퉁(2371)은 어제(26일) 그룹 합동법률회의를 열고 전력, 컴퓨팅 파워, 자산 3대 사업을 종합적으로 추진했다. 회사는 모듈형 컴퓨팅 파워 센터 'AIDC CUBE'가 점점 더 많은 고객을 유치하고 있으며 내년 1분기에 신규 수주가 예상된다고 밝혔다. 북미 변압기(전기의 세기(전압)를 바꿔 주는 기계) 주문은 내년에 인도될 예정이다. 총 매출(물건을 판 돈 전체)이 NT$430억에 달하는 세 가지 주요 주택 건설 프로젝트도 내년부터 계정에 이관될 예정입니다."},{"s":"Datong Dharma Conference/전기 및 컴퓨팅 파워 주문을 받아 430억 주택 프로젝트가 2027년부터 계좌로 이관됩니다.","so":"UDN","tm":"11/26 16:48","c":2,"r":"tw","u":"https://udn.com/news/story/7252/9903821","p":1795679312,"a":1795694334,"t":"大同法說會／電力、算力雙接單 430億住宅案2027年起交屋入帳","su":"지난 26일 다퉁(2371)은 다샤케(8099), 엘리트컴퓨터(2331), 푸화전자(8085)와 함께 3분기 합동 기업설명회를 열었다. Datong은 중국 본토에서 Huaying 사건이 공식적으로 해결됨에 따라 부채 적립금 환급 혜택이 재무 구조를 강화하고 미분배 수익을 개선할 것으로 기대된다고 지적했습니다. 이 전력회사는 최근 미국 텍사스와 캘리포니아에서 대규모 변압기(전기의 세기(전압)를 바꿔 주는 기계) 수주(일감 주문을 받는 것)에 성공했다. AI데이터센터(AIDC)도 최초로 엣지 AI 완제품 수주를 따냈다. 또한, 총 판매량 NT$430억에 달하는 주택 개발 프로젝트가 2027년에 차례로 인도될 예정입니다. 세 가지 핵심 사업이 동시에 진행되어 내년 운영에 탄력을 더할 것입니다."},{"s":"대만자동차전기(Taiwan Automobile & Electric), AI 데이터센터에서 3개 사업 기회 포착…원전 재가동 영향 제한적","so":"自由時報","tm":"11/26 16:12","c":2,"r":"tw","u":"https://stock.ltn.com.tw/article/bzyyf7puxuge","p":1795677170,"a":1795694336,"t":"台汽電搶AI資料中心3商機 看核電重啟影響有限","su":"AI 데이터센터(AIDC) 열풍으로 전력 수요가 급증하고, 주요 증기력 공생 기업인 대만전력(8926)은 그룹의 AI 전력 인프라 참여 확대를 희망하며 발전소 투자, 발전소 프로젝트 계약, 공급망(부품·재료가 오가는 연결망) 레이아웃까지 관련 사업 기회를 지속적으로 포착하고 있다. 대만자동차발전(Taiwan Automobile & Power)은 오늘(26일) 프랑스에서 열린 기자회견에서 원자력이 재가동되더라도 가스발전소 사업에 미치는 영향은 여전히 제한적일 것이라고 밝혔습니다. AI 데이터센터와 반도체(전자기기 속에서 계산하고 기억하는 작은 부품) 산업의 전력 수요가 지속적으로 증가함에 따라 전력 시장도 계속해서 발전할 것입니다."},{"s":"골드만삭스: 미국 데이터센터 건설 붐은 2028년까지 지속될 것으로 예상된다. TrendForce: 2027년에는 메모리 출력 가치 성장이 둔화될 것으로 예상 | 디지털 지능 초기 참조","so":"经济观察网","tm":"11/26 09:00","c":2,"r":"cn","u":"http://www.eeo.com.cn/2026/1126/1103147.shtml","p":1795651200,"a":1795663025,"t":"高盛：美国数据中心建设热潮有望持续至2028年；集邦咨询：预计2027年存储器产值增速放缓｜数智早参","su":"일일 기자 | 양휘 편집자 | 웨이웬이 | 2026년 11월 26일 목요일 | NO.1 골드만삭스: 미국 데이터센터(컴퓨터 수만 대를 모아 둔 건물) 건설 붐은 2028년까지 지속될 것으로 예상된다. 11월 25일 과학기술혁신위원회데일리(Science and Technology Innovation Board Daily)에 따르면 골드만삭스 그룹은 인공지능 붐에 힘입어 미국 데이터센터의 전력 용량이 2028년까지 계속해서 크게 성장할 것이라고 밝혔다. 데이터센터의 수, 규모, 전력 밀도가 지속적으로 증가함에 따라 이는 전기 및 천연가스 수요에 상승 위험을 초래할 것이다. 골드만삭스는 2028년까지 미국 데이터센터 전력 용량이 52기가와트 추가될 것으로 예상했다. 올해 초부터 미국 데이터센터 전력 용량과 수요는 거의 30% 증가해 미국 전체 전력 수요 증가의 3분의 1 이상을 차지했다."},{"s":"Huacheng: 2030년 대규모 전력 주문으로 AIDC 전원 공급 시스템 사업 기회 포착 | 업계 핫스팟 | 산업","so":"經濟日報","tm":"11/25 17:22","c":2,"r":"tw","u":"https://money.udn.com/money/story/5612/9901479?from=edn_newestlist_rank","p":1795594937,"a":1795608227,"t":"華城：重電訂單看到2030年 搶攻AIDC供電系統商機 | 產業熱點 | 產業","su":"주요 중전력 제조업체인 Huacheng Electric의 CEO(회사의 가장 높은 책임자) Xu Yisheng은 AIDC(인공 지능 데이터 센터)가 전력망(발전소 전기를 집·공장까지 보내는 전깃줄 그물) 인프라에 대한 수요가 높으며 Huacheng Heavy Electric 제품의 주문 가시성이 203개로 증가했다고 지적했습니다."},{"s":"AI 컴퓨팅 성능에 대한 수요는 아직 정점에 도달하지 않았습니다. Huacheng: 미국 고객이 적극적으로 주문하고 있으며 가시성은 2030년에 도달할 예정입니다.","so":"自由時報","tm":"11/25 17:06","c":2,"r":"tw","u":"https://stock.ltn.com.tw/article/smykkkrtsejn","p":1795594002,"a":1795608228,"t":"AI算力需求還沒到頂 華城：美客戶積極下單 能見度達2030年","su":"화청(1519) CEO(회사의 가장 높은 책임자) 쉬이셩은 오늘(25일) AI 컴퓨팅 파워에 대한 수요가 아직 정점에 도달하지 않았다고 말했다. 미래에는 로봇, 자율주행(사람 대신 차가 스스로 운전하는 것), 드론과 같은 애플리케이션이 컴퓨팅 파워 구축의 차세대 물결을 주도할 것이며, 시장 수요는 적어도 2~3년 동안 여전히 성장할 여지가 있습니다. 화성은 미국으로의 수출 비중이 높다. 현재 전력회사 고객들은 여전히 적극적으로 상품을 추구하고 있으며, 관련 생산능력 수주 가시성은 2030년까지로 예정돼 있다. AIDC 건설 둔화세는 체감되지 않고, 내년 1분기 시장수요는 유지되고 있다."},{"s":"골드만삭스는 2028년까지 미국 데이터센터 붐으로 전력과 가스 수요가 늘어날 것이라고 말했다.","so":"CNA","tm":"11/25 12:22","c":2,"r":"sg","u":"https://www.channelnewsasia.com/business/goldman-says-us-data-center-boom-through-2028-will-lift-power-and-gas-demand-6580431","p":1795576968,"a":1795577510,"t":"Goldman says US data center boom through 2028 will lift power and gas demand","su":"11월 24일: 골드만삭스는 미국의 데이터 센터 전력 용량의 강력한 성장이 2028년까지 계속될 가능성이 높으며, AI 붐으로 인해 더 많은 규모의 전력 밀도가 높은 시설 건설이 추진됨에 따라 전력 및 천연가스 수요에 상승 위험을 초래할 것이라고 말했습니다. • 중개회사에서는 52기가와트가 추가로 필요하다고 밝혔습니다."},{"s":"성스러운 능선을 밝혀라! Mooshan Mountain House는 마이크로그리드 업그레이드를 완료하고 침대에는 전용 충전소를 갖추고 있습니다.","so":"自由時報","tm":"11/25 10:37","c":2,"r":"tw","u":"https://news.ltn.com.tw/news/life/breakingnews/5652430","p":1795570672,"a":1795574661,"t":"點亮聖稜線！桃山山屋完成微電網升級 床位設專屬充電座","su":"산장 전원 공급 안정성을 개선하고 순 제로 배출을 구현하기 위해 셰이파 국립공원 관리사무소는 민간 업계와 협력하여 \"세이파 보호, 산 여행을 밝게 하세요\" 프로젝트를 추진하고 첫 번째 시범 현장인 \"타오산 마운틴 하우스\"의 마이크로그리드 시스템 교체 및 업데이트를 완료하여 20년 이상 사용된 장비의 노후화 문제를 해결했습니다. 또한 생태 보전과 산악 이용자의 편의성을 고려하여 각 침대에 개인 휴대폰 전용 충전 소켓을 추가했습니다. 눈관리국은 공원 내 고산 가옥에 설치된 태양광(햇빛으로 전기를 만드는 것) 발전 공급 장비 대부분이 20년 이상 사용됐다고 밝혔다. 낮은 산기온, 강풍, 낮과 밤의 기온차 등의 장기적인 영향으로 인해 점차 노후화되어 불안정한 전력 공급, 유지 관리의 어려움 등의 과제에 직면해 있습니다. 이번에 업계에서는 태양광 패널과 에너지 저장장치를 기증하고, 산악헬기 자재 걸이 지원을 위한 기술인력도 지원했다. 교통부 민간항공청의 지도 아래 해발 3,000m 이상의 저온 및 운송 문제를 극복하고 100kg이 넘는 장비의 매달기와 업데이트를 성공적으로 완료했다."},{"s":"중국남방전력망 광동제양전력공급국은 낚시하러 갈 때 전선에서 멀리 떨어져 있도록 따뜻하게 상기시켜 줍니다.","so":"21财经","tm":"11/27 20:09","c":1,"r":"cn","u":"https://www.21jingji.com/article/20261127/herald/93cbbee9ad1e5cb628283f1d84452152.html","p":1795777740,"a":1795780894,"t":"南方电网广东揭阳供电局温馨提醒，外出垂钓请远离电力线路","su":"날씨가 좋아 야외 활동을 즐기기 좋은 계절입니다. 강, 호수, 연못에서의 낚시는 많은 시민들의 선택입니다. 낚시의 즐거움을 즐기면서 주변의 전기 안전에도 주의를 기울여야 합니다. 중국남방전력망 광동제양전력공급국은 모든 낚시 애호가들에게 장대를 출발하기 전에 주변 환경을 명확하게 확인하고 전선 아래 또는 근처에서 낚시를 하지 말고 변압기(전기의 세기(전압)를 바꿔 주는 기계) 및 기타 전기 장비에서 적극적으로 멀리 떨어져 있도록 상기시켜 드립니다. 낚시터를 선택할 때에는 우선 위쪽에 전선이 있는지 살펴보고, 그 다음에는 전신주나 변압기가 있는지, '고전압 위험', '낚시 금지' 등의 경고 표시가 있는지 살펴보세요. 연못, 강, 호수 주변의 경고 표지판은 위험을 상기시켜줍니다. 보신 후에는 안전한 곳을 선택하셔야 합니다. 경고 표시가 보이지 않더라도 이곳이 안전하다고 단정할 수는 없습니다. 근처에 전선이 있거나 전선의 위치를 명확하게 볼 수 없거나 알 수 없다면 함부로 전선에서 내리지 마십시오."},{"s":"Agencia Comercial Spirits Ltd, AI 컴퓨팅 및 데이터 센터 사업에 대한 업데이트 제공 및 규정 준수 의지 재확인 - 회사 발표 - FT.com","so":"Financial Times","tm":"11/27 19:15","c":1,"r":"world","u":"https://markets.ft.com/data/announce/detail?dockey=1330-9885843en-2G8IMHDUF0NAV9U9T3P5U03R8U","p":1795774500,"a":1795785226,"t":"Agencia Comercial Spirits Ltd Provides Update on AI Computing and Data Center Business and Reaffirms Commitment to Compliance – Company Announcement - FT.com"},{"s":"‘전력통’ 정승일·‘재무통’ 강동수 쌍두마차 출격…SK이노베이션, AI 전력 키우고 11조 투자금 회수전 돌입","so":"뉴스퀘스트","tm":"11/27 16:51","c":1,"r":"kr","u":"https://www.newsquest.co.kr/news/articleView.html?idxno=306047","p":1795765901,"a":1795780892,"su":"【뉴스퀘스트=이승주 기자】SK이노베이션이 전력·에너지 전문가와 전략·재무 전문가를 새 경영진으로 선임했다. 인공지능(AI) 데이터센터(컴퓨터 수만 대를 모아 둔 건물)와 반도체(전자기기 속에서 계산하고 기억하는 작은 부품) 산업을 중심으로 전"},{"s":"스타마인드 | 포커스 | 수백만 개의 위성 밸리 컴퓨팅 성능, 전력망 구축을 위한 Space Three Gorges | 주제 관점 - 뉴스","so":"etnet 經濟通","tm":"11/27 15:10","c":1,"r":"hk","u":"https://www.etnet.com.hk/www/tc/news/news-article.php?section=features&category=focus&newsid=418386","p":1795759800,"a":1795762665,"t":"Starmind | FOCUS | 百萬衛星谷算力，太空三峽築電網 | 專題透視 - 新聞","su":"스타마인드 | 포커스 | 수백만 개의 위성 밸리 컴퓨팅 파워, 우주 삼협 전력망(발전소 전기를 집·공장까지 보내는 전깃줄 그물) 구축 GPU 임대 및 토큰 가격을 둘러싼 전쟁이 격화되는 가운데 머스크의 \"우주 꿈\"은 최근 미국 연방통신위원회(FCC)로부터 2040년까지 최대 100만 개의 AI 데이터 센터 위성을 배치하겠다는 조건부 승인을 받았습니다. 많은 기술적 병목 현상이 아직 해결되지 않았지만 컴퓨팅 파워의 배치는 지상과 우주라는 두 가지 범주로 명확하게 구분되었습니다. 이제 스페이스X의 \"지각이 있는 태양\" 야망에서 중국의 \"일요일 프로젝트\"로 초점을 옮기면서 중국과 미국 간의 게임은 계속해서 지구를 넘어 확장되고 있습니다. 커다란 꽃관과 이빨 사이의 틈이 있는 달 외에도 미래에 천문학 애호가들의 망원경에 갑자기 '생각하는' 위성 무리가 나타날 것인가? 현재 궤도에는 11,000개 이상의 스타링크 위성이 있으며, 향후 클라우드(인터넷으로 빌려 쓰는 컴퓨터) 컴퓨팅 파워를 담당하게 될 스타마인드 네트워크는 500km에서 1,002km에 이르는 저궤도에 최대 100만 개의 위성을 분산시킬 계획이다. 그들은 성간 레이저 링크를 통해 스타링크와 연결되어 지구와의 데이터 교환을 실현할 것입니다."},{"s":"전력공급, AI용 데이터센터의 사업자를 우선으로 「파스트패스 제도」의 검토 등 자민당 제언안","so":"日本経済新聞","tm":"11/27 15:00","c":1,"r":"jp","u":"https://www.nikkei.com/article/DGXZQOUA2706H0X21C26A1000000/","p":1795759200,"a":1795762666,"t":"電力供給、AI向けデータセンターの事業者を優先に 「ファストパス制度」の検討など自民党提言案","su":"자민당의 자원·에너지 전략조사회는 27일 인공지능(AI)용 데이터센터(DC) 등 입지촉진에 제언안을 정리했다. 실수를 예상하는 대규모 DC사업자에게 우선적으로 전력을 공급할 수 있도록 계통접속 규칙의 재검토를 정부에 요구했다. 사업의 실현성이 낮음에도 불구하고 송전(전기를 멀리 보내는 것)망에 접속할 권리를 얻는 '공압'을 막는다. DC사업자는 건설 전에 전력회사와 전력확보 계약을 맺는다. 최근에는 신청이 쇄도하여 수도권과 간사이 지역에서의 전기"},{"s":"‘현지화 없는 수출’ 중동 줄이고 유럽 키운다더니…HD현대일렉트릭, 유럽 수주 32% 급감 ‘역풍’","so":"뉴스퀘스트","tm":"11/27 14:46","c":1,"r":"kr","u":"https://www.newsquest.co.kr/news/articleView.html?idxno=306012","p":1795758367,"a":1795762660,"su":"【뉴스퀘스트=장홍석 기자】중동의 자국 우선주(투표권 대신 배당을 먼저 받는 주식)의(현지화) 정책을 피해 유럽 시장으로 눈을 돌렸던 HD현대일렉트릭이 또다시 ‘현지화’라는 거대한 벽에 부딪혔다. 중동"},{"s":"신유열 ‘바이오’ 구본규 ‘전력 인프라’…","so":"매일경제","tm":"11/27 14:02","c":1,"r":"kr","u":"https://www.mk.co.kr/news/economy/12220096","p":1795755759,"a":1795762660,"su":"재계 인사를 보면 기업의 미래 전략을 읽을 수 있다. 올해 재계 인사에서는 두 가지 흐름이 두드러진다. 인공지능(AI) 시대를 맞아 전력·로봇·바이오 등 미래 먹거리를 선점하기 위한 인재 재배치, 그리고 신사업을 무대로 한 오너 3·4세의 경영 전면 등장이다. 사진 확대 반도체(전자기기 속에서 계산하고 기억하는 작은 부품) 너머 전력·로봇·바이오 미래 먹거리에 핵심 인재 전진 배치 지난해까지 AI 인재 확보 경쟁은 주로 반도체와 소프트웨어업계 중심으로 이뤄졌다."},{"s":"[특징주] 알에스오토메이션, 피지컬 AI·전력 인프라 기대감 확산에 장중 10% 넘게 올라","so":"와이드경제","tm":"11/27 13:55","c":1,"r":"kr","u":"https://www.widedaily.com/news/articleView.html?idxno=305032","p":1795755359,"a":1795785224,"su":"삼성전자의 반도체(전자기기 속에서 계산하고 기억하는 작은 부품) 생산 현장 로봇 확대 전망과 인공지능(AI) 데이터센터(컴퓨터 수만 대를 모아 둔 건물)발 전력저장장치(ESS) 수요 증가 기대감 속에 관련 테마가 동반 강세를 보이면서 알에스오토메이션이 장중 급등해 8100원 선을 돌파했다. 27일 오후 1시 2분 기준 코스닥 시장에서 알에스오토메이션은 전 거래일"},{"s":"도쿄전력은 AI 전력 인프라 확충과 글로벌 기술 대기업 유치를 위해 10조엔 이상을 투자할 계획이다.","so":"财联社","tm":"11/27 12:54","c":1,"r":"cn","u":"https://www.cls.cn/detail/2546600","p":1795751640,"a":1795780894,"t":"东京电力拟投入超10万亿日元扩建AI电力基建 招揽全球科技巨头落地","su":"① 도쿄전력은 2035회계연도까지 9년간 10조2000억엔을 투자해 전력망(발전소 전기를 집·공장까지 보내는 전깃줄 그물)과 원자력 시설을 강화하고, 데이터센터(컴퓨터 수만 대를 모아 둔 건물) 유치를 통해 전력판매 수익을 확대할 계획이다. ② 합작회사인 JERA는 10년이라는 최장 시간의 전력망 연결 대기 시간을 \"무선 전원 공급 장치\"로 완화하기 위해 발전소 인근 데이터 센터 프로젝트를 위해 앤트로픽, 메타 등과 협상을 진행하고 있습니다. 차이롄서통신, 11월 27일(편집자 Shi Zhengcheng) 최근 뉴스에 따르면 AI 시대 컴퓨팅 파워 확장이라는 '빅 케이크'에 직면한 일본 전력 대기업 도쿄전력홀딩스가 전력망과 원자력 시설 강화를 위해 10조엔 이상을 투자할 계획이다. 지분을 보유하고 있는 일본 최대 발전회사인 JERA는 앤트로픽, 메타 등 기술 대기업들과 도쿄만 발전소 바로 옆에 데이터센터를 구축하기 위해 협상을 진행 중이다."},{"s":"[장중수급포착] 두산에너빌리티, 외국인/기관 동시 순매수… 주가 +6.91%","so":"뉴스핌","tm":"11/27 11:32","c":1,"r":"kr","u":"https://www.newspim.com/news/view/20261127000778","p":1795746720,"a":1795762660,"su":"[서울=뉴스핌] 로보뉴스 = 27일 11시 30분 현재 두산에너빌리티(034020)는 외국인과 기관이 각각 6.45 만 주, 1.00 만 주 순매수(잠정) 하면서 전일 대비 6.91% (현재가 43,300원) 상승하고 있다.[표] 외국인ㆍ기관 순매매량 (단위 만주)[표"},{"s":"[인민일보 클라이언트] 흑룡강 500kV 대경 변전소 주변압기 확장 프로젝트 가동","so":"ThePaper.cn","tm":"11/27 11:20","c":1,"r":"cn","u":"https://www.thepaper.cn/newsDetail_forward_34572471","p":1795746022,"a":1795762662,"t":"【人民日报客户端】黑龙江500千伏大庆变电站主变压器扩建工程投运","su":"11월 24일, 인민일보는 \"흑룡강 500kV 대경 변전소(전기의 세기를 바꿔 나눠 보내는 곳) 주변압기 확장 프로젝트 가동\"을 게재했습니다. 원문은 다음과 같습니다. 11월 21일 헤이룽장성 500kV 대경변전소 3호 주변압기 5차 급등과 함께"},{"s":"한수원 체코 찾아 원전 완수 의지, 두산에너빌리티 한국전력기술 경영진 동행","so":"비즈니스포스트","tm":"11/27 10:25","c":1,"r":"kr","u":"https://www.businesspost.co.kr/BP?command=article_view&num=453094","p":1795742712,"a":1795749597},{"s":"AI 컴퓨팅 능력 \"샷볼 수준\"이 전력망에 도전하고 대만전력공사는 수요와 공급의 효과적인 할당을 촉진합니다.","so":"自由時報","tm":"11/27 10:00","c":1,"r":"tw","u":"https://market.ltn.com.tw/article/19095","p":1795741200,"a":1795749600,"t":"AI算力「鉛球級」電網挑戰 台電推動供需有效配置","su":"AI와 반도체(전자기기 속에서 계산하고 기억하는 작은 부품)의 발전 앞에서 안정적인 전력은 발전의 생명선이다. 그러나 AI 컴퓨팅 파워는 '높은 전력 소비'와 '높은 전력 밀도'라는 특성을 갖고 있어 지역 전력망의 잉여분을 빠르게 소모하게 된다. 대규모 상업용 사무실의 전력 수요는 약 2MW인데, 같은 공간의 AI 데이터센터(컴퓨터 수만 대를 모아 둔 건물)는 20MW~40MW에 쉽게 도달할 수 있어 지역 전력망 부하에 대한 '리드볼'과 같다."},{"s":"한전, '2026년 올해의 상생기업대상' 단체 부문 대통령표창 수상…K-전력기기 상생협력 결실","so":"데일리안","tm":"11/27 09:07","c":1,"r":"kr","u":"https://www.dailian.co.kr/news/view/1720393/%ED%95%9C%EC%A0%84-2026%EB%85%84-%EC%98%AC%ED%95%B4-%EC%83%81%EC%83%9D%EA%B8%B0%EC%97%85%EB%8C%80%EC%83%81-%EB%8B%A8-2026","p":1795738020,"a":1795749597,"su":"한국전력이 중소기업 연구개발(RD) 제품 누적 매출(물건을 판 돈 전체) 2조4000억원을 달성하고 816개 창업 기업을 육성한 공로를 인정받았다.한전은 26일 서울 코엑스 마곡 컨벤션센터에서 열린 '2026년 동반성장 주간 기념식'에서 '올해의 상생기업대상' 단체 부문 최고 훈격인 대통령표창을 수상했다고 27일 밝혔다.중소벤처기업부가 주관하는 이 행사에서는 대·중소기업 간 동"},{"s":"JERA, 앤트로픽, 메타 등과 협상 발전소 병설 데이터 센터","so":"日本経済新聞","tm":"11/27 05:00","c":1,"r":"jp","u":"https://www.nikkei.com/article/DGXZQOUC218DJ0R21C26A0000000/","p":1795723200,"a":1795733680,"t":"JERA、アンソロピックやメタなどと交渉 発電所併設データセンター","su":"JERA가 수도권에 정비하는 데이터센터(컴퓨터 수만 대를 모아 둔 건물)를 둘러싸고 미국 앤트로픽과 미국 메타 등 미국 기술 대기업 각사와 유치협상을 하고 있는 것으로 27일까지 알려졌다. 발전소 일체형으로 전력을 직접 사용할 수 있는 메리트를 살려 합의를 목표로 한다. 아마존, 마이크로소프트, 구글 등도 관심 JERA는 앤트로픽과 메타 외에 미국 아마존 닷컴, 미 마이크로소프트, 미 구글과 협상에 들어갔다. JERA의 가아유부 회장 겸 글로벌"},{"s":"데이터 센터 보조금, 주민 배려로 우대 소음·배열 트러블 증가","so":"日本経済新聞","tm":"11/27 05:00","c":1,"r":"jp","u":"https://www.nikkei.com/article/DGXZQOUA1617Q0W6A111C2000000/","p":1795723200,"a":1795737910,"t":"データセンター補助金、住民配慮で優遇 騒音・排熱トラブル増加","su":"총무성은 데이터센터(DC)용 보조금(나라가 지원해 주는 돈) 채택으로 지역주민에 대한 배려를 기준에 더한다. 배열이나 소음을 둘러싸고 주민과의 마찰이 눈에 띄었다. 인공지능(AI) 시대의 인프라의 원활한 정비에 연결한다. DC 건물과 설비비의 반액을 내는 보조금을 2026~30년도 분에 209억엔 계상했다. 앞으로 사업자를 공모한다. 업계 단체의 일본 데이터 센터 협회가 5월에 책정한 '지역 공생 가이드라인'을 준수하고 있으면 우선적으로 선정한다. 동 협회"},{"s":"엔비디아, 냉각 장치 없는 데이터센터 냉각 시스템 개발 스타트업 지원","so":"Data Center Dynamics","tm":"11/27 02:11","c":1,"r":"world","u":"https://www.datacenterdynamics.com/en/news/nvidia-backs-startup-developing-chiller-free-data-center-cooling-system/","p":1795713113,"a":1795733683,"t":"Nvidia backs startup developing chiller-free data center cooling system","su":"새로운 냉각 장치가 없는 시스템으로 데이터 센터 냉각 비용을 절감하겠다고 약속한 스타트업이 엔비디아를 포함한 후원자로부터 500,000달러를 모금했습니다. Y Combinator 비즈니스 인큐베이터 프로그램의 일부인 Madrone은 GPU(인공지능 계산에 많이 쓰는 반도체) 거대 기업은 물론 Y Combinator 자체와 투자 회사 Tekedia Capital의 지원을 받는 시드 라운드에서 현금을 조달했습니다."},{"s":"MiTAC은 장비를 확충하고 전력을 준비하며 운영에 자신감을 갖고 있다. 내년 성장에는 의심의 여지가 없습니다.","so":"經濟日報","tm":"11/27 00:54","c":1,"r":"tw","u":"https://money.udn.com/money/story/5710/9904369","p":1795708469,"a":1795733673,"t":"神達擴充設備並備妥電力 對營運充滿信心 明年成長無懸念","su":"미택(3706)과 자회사(다른 회사가 주인인 회사) 미택디지털(MiTAC Digital)이 어제(26일) 공동기자간담회를 가졌다. 시장 전망을 내다보며 MiTAC 허지우 단장은 2027년 운영에 대해 확신을 갖고 있으며, 내년 성장에 대해서는 '서스펜스'가 없다고 강조했다."},{"s":"AI 전력 수요가 가열되고 있으며 Hongyu Motor는 중요한 전자상거래 비즈니스 기회를 포착하기 위해 시장에 나와 있습니다.","so":"經濟日報","tm":"11/27 00:38","c":1,"r":"tw","u":"https://money.udn.com/money/story/11074/9904566?from=edn_newestlist_cate_side","p":1795707520,"a":1795733677,"t":"AI 用電需求升溫 宏于電機上櫃搶重電商機","su":"중전기산업에서 신입사원을 모집합니다. 홍유전기(7869)가 어제(26일) 주당 NT$201.11에 OTC 시장에 공식 상장됐다. AI 데이터센터(컴퓨터 수만 대를 모아 둔 건물), 반도체(전자기기 속에서 계산하고 기억하는 작은 부품) 공장 확장, 전력망 업그레이드라는 세 가지 주요 비즈니스 기회를 활용해 Acer의 수주 가시성은 2028년에 도달했으며 해외 시장을 적극적으로 확장하고 있습니다. '대만 R&D, 베트남 제조, 북미 상륙'이라는 운영 레이아웃을 만들기 위해 12월 미국 법인을 설립할 예정이다."},{"s":"뉴스케일 Power(SMR)는 AI 전력 수요가 SMR 매력을 높이면서 새로운 투자자의 관심을 끌고 있습니다.","so":"Yahoo Finance","tm":"11/26 23:11","c":1,"r":"us","u":"https://finance.yahoo.com/energy/articles/nuscale-power-smr-draws-fresh-141122724.html","p":1795702282,"a":1795733664,"t":"NuScale Power (SMR) Draws Fresh Investor Focus As AI Power Demand Lifts SMR Appeal","su":"뉴스케일 Power(NYSE: SMR(작게 만든 원자력 발전소))는 AI 전력 수요로 인해 첨단 원자력 옵션(정해진 값에 사거나 팔 권리)의 인지도가 높아짐에 따라 투자자들의 관심이 높아지고 있습니다. 이 회사는 원자력 규제 위원회(Nuclear Regulatory Commission)로부터 연방 인증을 받은 소형 모듈형 원자로 설계를 보유하고 있어 오클로보다 규제 우위를 제공합니다. 분석가들은 뉴스케일을 지적합니다."},{"s":"SNPS 대 VICR: AI 전력 수요로 인해 어느 주식이 이익을 얻을 수 있습니까?","so":"Yahoo Finance","tm":"11/26 22:20","c":1,"r":"us","u":"https://finance.yahoo.com/markets/stocks/articles/snps-vs-vicr-stock-stands-132000637.html","p":1795699200,"a":1795785225,"t":"SNPS vs. VICR: Which Stock Stands to Gain From AI Power Demand?","su":"Synopsys는 EDA 수요 확대, Ansys 통합 및 에이전트 AI 기회를 통해 더욱 강력한 AI 인프라 투자로서 Vicor를 앞지릅니다."},{"s":"중국 임차인이 높은 비율을 차지하며 새로운 미국 컴퓨팅 전력 규정이 조호르 컴퓨팅 전력 허브에 영향을 미침","so":"财新","tm":"11/26 21:29","c":1,"r":"cn","u":"https://companies.caixin.com/2026-11-26/102509013.html","p":1795696140,"a":1795699393,"t":"中资租户占比高 美国算力新规冲击柔佛算力枢纽","su":"[Caixin.com] 미국이 중국 기업의 해외 선진 컴퓨팅 파워 접근에 대한 제한을 더욱 강화해 최근 몇 년간 데이터센터(컴퓨터 수만 대를 모아 둔 건물) 건설이 급속도로 확대되고 있는 말레이시아에 새로운 신용위험을 안겨주고 있다. 11월 25일, S&P Global Ratings 이사이자 아시아 태평양 디지털 인프라 이사인 Gu Lifu는 기자 회견에서 말레이시아 조호르에 있는 데이터 센터가 심각한 위험에 노출되어 있다고 말했습니다. 많은 데이터 센터가 중국 기업에 의해 임대되기 때문에 일부 사업자는 새로운 고객을 찾아야 한다는 압박에 직면할 수 있습니다. 싱가포르와 인접한 말레이시아 조호르는 최근 몇 년간 동남아시아에서 데이터센터 투자가 가장 활발한 지역 중 하나로 꼽힌다. S&P 산하 데이터센터 연구 기관인 datacenterHawk의 통계에 따르면 현재 조호르에서 운영 중인 데이터센터의 전력 용량은 2,632MW에 달하며, 이 중 멀티 테넌트 데이터센터가 1,654MW, 초대형 데이터센터가 978MW를 차지한다. Cushman & Wakefield의 모니터링에 따르면 조호르(Johor) 데이터 센터의 코로케이션 공실률은 0.7%에 불과해 아시아 태평양 지역의 주요 시장 중 가장 낮은 것으로 나타났습니다. 이는 새로 생산된 용량이 거의 즉시 채워짐을 의미합니다."},{"s":"용량 확장이 Vicor가 증가하는 AI 전력 수요를 충족하는 데 도움이 될 수 있습니까?","so":"Yahoo Finance","tm":"11/26 21:13","c":1,"r":"us","u":"https://finance.yahoo.com/technology/ai/articles/capacity-expansion-help-vicor-meet-121300058.html","p":1795695180,"a":1795780892,"t":"Can Capacity Expansion help Vicor Meet Rising AI Power Demand?","su":"VICR은 급증하는 AI 전력 수요를 충족하기 위해 제조 역량을 확장하고 있으며, 상당한 장기적 성장 잠재력을 제공하는 두 개의 계획된 시설을 갖추고 있습니다."},{"s":"시코쿠 전력, 새롭게 약 25만 건의 유출 판명 플레이드에 대한 무단 액세스로","so":"日本経済新聞","tm":"11/26 19:00","c":1,"r":"jp","u":"https://www.nikkei.com/article/DGXZQOCC268L20W6A121C2000000/","p":1795687200,"a":1795699394,"t":"四国電力、新たに約25万件の流出判明 プレイドへの不正アクセスで","su":"시코쿠 전력은 지난 26일 회원제 웹서비스 ‘욘덴 컨시어지’를 이용하는 고객 정보가 새롭게 약 25만 건 외부로 유출됐다고 발표했다. 당초 약 60만건과 함께 누출은 약 85만건이 됐다. 무단 액세스를 받은 플레이드의 서비스를 이용하고 있었다. 새로운 유출"},{"s":"Datong은 미국으로부터 345kV 변압기 주문을 받고 모듈형 AIDC 케이스의 첫 주문을 받았습니다.","so":"DIGITIMES","tm":"11/26 18:37","c":1,"r":"tw","u":"https://www.digitimes.com.tw/tech/dt/n/shwnws.asp?id=776155","p":1795685820,"a":1795694337,"t":"大同拿下美國345kV變壓器訂單 模組化AIDC整案首單到手","su":"다퉁그룹은 26일 2026년 3분기 공동법무대리인 설명회를 열었다. Datong은 회의에서 전기, 컴퓨팅 능력, 토지가 성장의 세 가지 주요 축이라고 말했습니다. 이 중 전력업계는 미국 텍사스와 캘리포니아에서 345kV 대형 변압기(전기의 세기(전압)를 바꿔 주는 기계)를 수주(일감 주문을 받는 것)했으며, AI데이터센터(AIDC)가 최초로 엣지AI(Edge AI) 완제품 수주를 따냈다. 게다가 최근 화잉 사건도 합의에 이르렀는데…"},{"s":"발전소부터 케이블까지…물 만난 K전력기기","so":"한국경제","tm":"11/26 18:23","c":1,"r":"kr","u":"https://www.hankyung.com/article/2026112630811","p":1795685001,"a":1795694333,"su":"발전소부터 케이블까지…물 만난 K전력기기, 美 전력 인프라 확대 수혜 두산에너빌, 가스터빈(가스를 태워 전기를 만드는 기계) 12기 계약 가온전선, 빅테크서 5조 수주(일감 주문을 받는 것)"},{"s":"도호쿠 전력이 4년 연속 초임급 인상으로 27년도 최대 1.3만엔","so":"日本経済新聞","tm":"11/26 18:15","c":1,"r":"jp","u":"https://www.nikkei.com/article/DGXZQOCC2623I0W6A121C2000000/","p":1795684500,"a":1795699395,"t":"東北電力が4年連続の初任給引き上げへ 27年度、最大1.3万円","su":"도호쿠 전력과 송배전을 다루는 도호쿠 전력 네트워크(센다이시)는 26일 2027년도 신입사원의 초임급을 최대 1만3000엔 끌어올릴 것이라고 발표했다. 인상은 4년 연속. 물가(물건값 전체의 수준) 상승과 인재 획득 경쟁의 격화를 바탕으로 채용 경쟁력을 높인다. 고졸부터 대학원 졸업까지 학력별로 1만~1만3000엔 인상한다. 고졸은 현행보다 1만엔 높은 22만3000엔, 고전·단대졸은 1만3000엔 높은 24만7000엔, 대졸은 1만2000엔 높음"},{"s":"중부전력, 하마오카 원전 관계자를 처분 카츠노 전 회장은 보수 5할 감소 6개월","so":"日本経済新聞","tm":"11/26 16:59","c":1,"r":"jp","u":"https://www.nikkei.com/article/DGXZQOFD267RU0W6A121C2000000/","p":1795679976,"a":1795699396,"t":"中部電力、浜岡原発関係者を処分 勝野前会長は報酬5割減6カ月","su":"중부전력은 26일 하마오카 원자력발전소(시즈오카현 오마에자키시)의 데이터 부정 문제를 둘러싸고, 카츠노 테츠마에 회장 등 당시 임원 7명에게 감급처분에 해당하는 자주 반납을 요청한다고 발표했다. 재가동이 심사신청 취하로 전망할 수 없는 가운데 책임을 명확히 하고 조직 개혁을 서두른다. 이날 경제산업상에 업무개선계획을 제출했다. 하마오카 원전 3, 4호기의 재가동 심사에 관한 데이터 부정 외, 전기 요금의 과대 청구 문제와 1, 2호기의 폐로 수속에 관련된 부정이 대상. 법"},{"s":"도치기현 지사 「AI 관련 산업의 집적 목표로 한다」 데이터 센터 유치를 평가","so":"日本経済新聞","tm":"11/26 15:28","c":1,"r":"jp","u":"https://www.nikkei.com/article/DGXZQOCC261Q10W6A121C2000000/","p":1795674505,"a":1795699398,"t":"栃木県知事「AI関連産業の集積目指す」 データセンター誘致を評価","su":"도치기현의 후쿠다 토미이치 지사는 현내에서 데이터 센터 유치와 데이터 센터를 정비·운영하는 사업자의 선정이 진행되고 있는 점을 평가했다. 유치를 계기로 장래에는 현내에서 \"인공지능(AI) 관련 산업의 집적을 목표로 한다\"고 말했다. 25일 기자회견에서 발언했다. 데이터센터(컴퓨터 수만 대를 모아 둔 건물)가 새로운 산업단지 조성과 분양 등의 효과를 낳을 것이라고 말해 기대를 모았다. 앞으로 “우량기업 진출을 전망해 산업단지 조성과 영업활동에 임할 것”이라고 말했다."},{"s":"광주교통공사, AI 전력관제 교육용 시뮬레이터 자체 개발","so":"전기신문","tm":"11/26 15:01","c":1,"r":"kr","u":"https://www.electimes.com/news/articleView.html?idxno=375336","p":1795672875,"a":1795676860,"su":"광주교통공사가 실제 전력관제 시스템과 같은 화면과 조작 결과를 구현한 인공지능(AI) 기반 교육용 시뮬레이터를 개발해 관제 인력의 실습 교육에 활용한다.광주교통공사는 AI를 활용해 실제 전력관제 시스템의 화면과 조작 결과를 구현한 교육용 시뮬레이터를 자체 개발했다고 26일 밝혔다.시뮬레이터는 실제 제어망과 분리된 독립 환경에서 운영된다. 교육생은 실제 설비에 영향을 주지 않고 현장과 유사한 조건에서 전력관제 조작과 장애 대응을 연습할 수 있다. 실제 설비를 제어하는 시스템을 교육에 사용하기 어려웠던 기존의 제약을 해소한 것이다.그동"},{"s":"SOLUM과 Infineon, AI 데이터 센터용 HVDC 전력 솔루션 확장","so":"ET Datacenters","tm":"11/26 13:37","c":1,"r":"us","u":"https://datacenters.economictimes.indiatimes.com/news/ai-compute-infrastructure/solum-and-infineon-expand-hvdc-power-solutions-for-ai-data-centers/136178184?utm_source=latest_news&utm_medium=latestNews","p":1795667862,"a":1795676861,"t":"SOLUM and Infineon expand HVDC power solutions for AI data centers","su":"솔럼(SOLUM)과 인피니언 테크놀로지스(Infineon Technologies)가 AI 데이터센터(컴퓨터 수만 대를 모아 둔 건물)용 고전압 직류(HVDC) 전력 솔루션에 대한 협력을 확대할 예정이다. 확장된 작업은 중간 버스 컨버터, 배터리 백업 장치 및 전원 공급 장치에 중점을 둡니다."},{"s":"도쿄 전력, 원전 테러 대책 시설의 완성을 재차 연기 카시와자키 카리바 7호기","so":"日本経済新聞","tm":"11/26 12:35","c":1,"r":"jp","u":"https://www.nikkei.com/article/DGXZQOCC261T00W6A121C2000000/","p":1795664100,"a":1795694340,"t":"東京電力、原発テロ対策施設の完成を再度延期 柏崎刈羽7号機","su":"도쿄전력홀딩스는 26일 카시와자키 카리바 원자력발전소(니가타현) 7호기에 정비하는 테러 대책 시설에 대해 2029년 8월로 했던 완성 시기를 연기할 방침을 표명했다. 이날 기자회견한 이나가키 타케유키·발전소장은 새로운 완성 시기의 메드로서 “31년 4월을 목표로 하고 싶다”고 말했다. 연기 표명은 25년에 이어 2회째. 11월 초순에 시공사로부터 주요 구축물의 공정을 1년 이상 지연시킬 필요가 있다고 하는 보고를 받은 호"},{"s":"목표주가표 살펴보기》전자제품 비중이 높은 방어주! 발전하면 AI의 엄격한 요구를 공격할 수 있습니다. 후퇴하면 공공전력망의 핵심을 지킬 수 있다. 화성, 시뎬, ZTE... 외 6개 레벨. 법인만이 선택할 수 있습니다.","so":"旺得富理財網","tm":"11/26 12:11","c":1,"r":"tw","u":"https://wantrich.chinatimes.com/news/20261126900141-420101","p":1795662675,"a":1795663027,"t":"目標價一表看》重電躍防禦股！進可攻AI剛需 退可守公共電網保底 華城、士電、中興電...等6檔 法人只選它","su":"대만 주식시장은 날이 갈수록 오르락내리락하는 등 격앙된 모습을 보이고 있습니다. 격렬한 변동이 불안합니다. 기관투자자들은 중전기산업이 '전진, 공격, 후퇴, 방어'가 가능한 방어주라고 낙관하고 있다. 글로벌 전력망 업데이트 + AI 데이터센터(컴퓨터 수만 대를 모아 둔 건물) 등 크게 두 가지 혜택을 갖고 있다. 오늘(11/26) 화청이 상한가(하루에 오를 수 있는 가장 높은 값) 상승 선두를 차지하며 Yali가 6% 이상 상승했고, TECO와 Shiden이 4% 이상 상승, ZTE가 3% 이상 상승했다. OTC 시장에 상장된 홍유전기는 11% 이상 하락했다. 3분기에 1주 이상의 자본금을 획득했습니다. 구글, 마이크로소프트 등 CSP에도 진출했다. 법인..."},{"s":"(품질경영 No.1) HD현대일렉트릭, 클라우드 기반 ‘INTEGRICT CEMS’로 에너지·탄소감축 통합 관리 선도","so":"전기신문","tm":"11/26 12:00","c":1,"r":"kr","u":"https://www.electimes.com/news/articleView.html?idxno=375209","p":1795662000,"a":1795663024,"su":"제조업의 경쟁력을 높이기 위해서는 제품과 공정뿐 아니라 생산에 투입되는 에너지도 체계적으로 관리해야 한다. 산업 현장의 에너지관리는 단순한 계측 시스템 구축만으로 구현할 수 있는 영역이 아니다. 전력, 가스, 스팀 등 다양한 에너지원과 수많은 설비에서 발생하는 데이터를 실시간으로 수집하고, 이를 생산량·가동률·공정 정보와 연계해 의미 있는 분석 결과로 제공해야 한다.HD현대일렉트릭은 클라우드(인터넷으로 빌려 쓰는 컴퓨터) 기반 에너지관리 솔루션 ‘INTEGRICT CEMS(Cloud Energy Management System)’를 통해 산업 현장의 에너지 효율 향상을 지원하고 있다. 2020년 반월·시화 산업단지를 시작으로 전국 9개 국가산업단지, 700개 이상 기업에 솔루션을 구축하며 기술력과 현장 적용성을 입증했다. 최근에는 이러한"},{"s":"성균관대, '지능화 에너지 솔루션 국가연구소' 공식 출범… AI 전력 수요 대응 본격화","so":"팝콘뉴스","tm":"11/26 11:39","c":1,"r":"kr","u":"http://www.popcornnews.net/news/articleViewAmp.html?idxno=141658","p":1795660790,"a":1795737910,"su":"성균관대, '지능화 에너지 솔루션 국가연구소' 공식 출범… AI 전력 수요 대응 본격화 과기정통부·교육부 '국가연구소(NRL2.0)' 선정… 10년간 최대 950억 원 투입 4대 연구그룹 가동해 '마이크로그리드-디지털트윈' 플랫폼 개발 추진 (팝콘뉴스=김은교 기자) 인공지능(AI) 데이터센터(컴퓨터 수만 대를 모아 둔 건물) 확산과 첨단산업 고도화로 전력 수요가 급증하는 가운데, AI와 에너지 기술을 결합해 이를 해결할 국가 연구 거점이 본격적인 가동에 들어갔다."},{"s":"송전선의 사고로부터의 복구를 훈련 규슈 전력 자회사, 태풍에서의 정전을 상정 [사가현]","so":"朝日新聞","tm":"11/26 11:30","c":1,"r":"jp","u":"https://www.asahi.com/articl 국민투표는 토요일에 실시될 예정이다. 학자들, 원자력 평가 재개 촉구: 대만은 포기해서는 안 된다 - Life","so":"工商時報","tm":"11/25 13:12","c":1,"r":"tw","u":"https://www.ctee.com.tw/news/20261125701086-431401","p":1795579920,"a":1795589929,"t":"核能公投周六登場學者呼籲重啟核電評估：台灣不應放棄- 生活","su":"국민당이 제안한 '비핵 조국 폐지' 국민투표를 포함해 핵 9대1 선거와 국민투표가 토요일에 치러질 예정이며 이 역시 여론에 따라 결정될 예정이다. 이에 따라 원자력 문제는 다시 한번 선거운동의 화두가 됐다. 유명한 원자력 학자인 Li Min은 최근 온라인 프로그램에서 대만이 원자력 옵션(정해진 값에 사거나 팔 권리)을 포기해서는 안 되며 기존 원자력 발전소의 서비스를 확장하거나 원자력 4개 제조업체로 전환할 가능성을 재평가해야 한다고 촉구했습니다. Li Min과 Li Jiawei 칭화대학교 생명과학과 명예교수가 최근 초청을 받았습니다."},{"s":"AI 데이터센터부터 노후 전력망까지, 전력기기 3사 설비투자 급증","so":"아시아경제","tm":"11/25 11:23","c":1,"r":"kr","u":"https://www.asiae.co.kr/article/2026112415292557621","p":1795573380,"a":1795574656,"su":"AI 데이터센터(컴퓨터 수만 대를 모아 둔 건물) 확산과 노후 전력망(발전소 전기를 집·공장까지 보내는 전깃줄 그물) 교체 수요가 맞물리면서 국내 전력기기 업종에 대한 투자자들의 관심이 높아지."},{"s":"중원대학교 홍잉이(Hong Yingyi) 학생은 전력 에너지 연구 및 산학 혁신에 깊이 참여하여 \"학술 우수 공헌상\" 수상 | 산학연 연구 및 교육 | 사업정보","so":"經濟日報","tm":"11/25 11:04","c":1,"r":"tw","u":"https://money.udn.com/money/story/5723/9899418?from=edn_subcatelist_cate","p":1795572251,"a":1795574659,"t":"中原大學洪穎怡深耕電力能源研究與產學創新 獲「學界傑出貢獻獎」 | 產學研訓 | 商情","su":"지능형 알고리즘부터 양자 인공지능까지, 중원대학교 전기공학과 홍잉이 석좌교수는 42년 넘게 전기에너지 연구에 깊이 관여해 왔다. 그녀는 국제학술연구에서 많은 성과를 거두었을 뿐만 아니라, 산학협력을 적극적으로 추진하고 국가 전력정책에 참여하며 전문인재를 양성해 왔다. 그는 장기간 축적된 학문적 성과와 실질적인 기여로 전력 시스템 및 에너지 기술 분야에서 뛰어난 공헌을 인정받아 대만전력에너지공학협회로부터 2026년 '학술 우수 공헌상'을 수상했습니다. 대만 전력 및 에너지 공학 협회는 전력 및 에너지 분야에서 뛰어난 연구 결과와 산업적 공헌을 한 전문가를 표창하기 위해 \"산업 및 학계에 대한 뛰어난 공헌상\"을 제정했습니다. 올해 '뛰어난 학계공헌상' 수상자는 중원대학교와 국립중앙대학교 두 명입니다. 중원대학교 에너지기술센터장 홍잉이 석좌교수는 오랫동안 스마트그리드, 딥러닝, 양자인공지능 등 미래지향적 기술을 다루며 전력 및 에너지 분야에서 인공지능 연구와 응용에 전념해 왔다. 지금까지 그는 165편의 SCI 저널 논문을 발표했으며 구글 Scholar에서 8,700회 이상 인용되었습니다. 그는 2020년부터 2026년까지 세계 최고 과학자 중 상위 2%에 지속적으로 선정되었으며, ScholarGPS 전력 시스템 전문 순위에서 상위 2%에 속합니다."},{"s":"효성중공업 \"시행사 고의 지연\"…잠원동 빚 3464억 대신 갚았다","so":"팝콘뉴스","tm":"11/25 09:00","c":1,"r":"kr","u":"https://www.popcornnews.net/news/articleView.html?idxno=141375","p":1795564800,"a":1795576858,"su":" 뉴스핌] 김가희 기자 = 미래에셋자산운용은 26일 자사 'TIGER 코리아휴머노이드로봇산업' 상장지수펀드(ETF)가 올해 개인 순매수 5000억원을 돌파했다고 밝혔다."},{"s":"샤오펑의 휴머노이드 로봇 IRON, 내년 1월 하드웨어 양산 돌입","so":"第一财经","tm":"11/25 17:26","c":6,"r":"cn","u":"https://www.yicai.com/news/103453873.html","p":1795595197,"a":1795608239,"t":"小鹏人形机器人IRON将于明年1月进入硬件量产","su":"제일재경 2026-11-25 16:22:31 편집자: Gao Mingyan 샤오펑 Motors 뉴스에 따르면 샤오펑의 휴머노이드 로봇(사람을 닮은 로봇) IRON은 2027년 1월 하드웨어 대량 생산 단계에 진입할 예정이며 2분기에 공식 출시될 예정입니다. 다음주에 주목하세요 | 9월 경제 데이터가 발표될 예정이며, 이러한 투자 기회는 가장 신뢰할 수 있습니다. BMW는 2027년까지 중국 시장에 약 20종의 차세대 기술 플랫폼 모델을 출시하고, 2030년까지 국내 생산 모델의 비중을 95% 이상으로 늘릴 계획이다. 유리 기반 패키징(반도체 칩을 포장하고 연결하는 공정) 트랙의 미래 시장 규모는 엄청난 잠재력을 가지고 있지만, 중국 국내 기업은 여전히 수율 향상, 고객 인증, 대량 생산 속도 등 산업화 과제에 직면해 있다."},{"s":"유니트리 Wang Xingxing: 5~10년 안에 본토의 로봇 생산량이 자동차를 능가할 것입니다 | 내륙항 경제 및 무역 | 양안","so":"UDN","tm":"11/26 20:54","c":4,"r":"tw","u":"https://udn.com/news/story/7333/9904298","p":1795694055,"a":1795694362,"t":"宇樹科技王興興：5至10年內大陸機器人產量超越汽車| 陸港經貿| 兩岸","su":"유니트리의 창립자이자 회장인 Wang Xingxing은 오늘 비즈니스 회의에서 로봇 생산의 엔지니어링 프로세스가 자동차의 엔지니어링 프로세스보다 약간 적다고 말했습니다. 5~10년 안에 중국의 로봇이 상용화(실제로 팔고 쓰이기 시작하는 것)될 것으로 예상된다."},{"s":"나무가, 북미 휴머노이드 카메라 단독 공급…피지컬 AI 기업으로 변신-밸류파인더","so":"이데일리","tm":"11/26 08:31","c":4,"r":"kr","u":"https://www.edaily.co.kr/News/Read?newsId=01813846645649656&mediaCodeNo=257","p":1795649476,"a":1795651390,"su":"독립리서치 밸류파인더는 26일 나무가(190510)에 대해 북미 휴머노이드 로봇(사람을 닮은 로봇) 공급망(부품·재료가 오가는 연결망) 진입을 계기로 스마트폰 카메라 모듈 제조업체에서 피지컬 인공지능(AI) 비전 솔루션 기업으로의 전환이 본격화하고 있다고 분석했다. 로봇용 센서 탑재량 증가와 고부가가치 제품 확대에..."},{"s":"Xiaopeng Technology Day는 IRON 휴머노이드 로봇에 중점을 두고 연말까지 대량 생산을 목표로 하며 2027년 상용화 확대를 목표로 하고 있습니다.","so":"DIGITIMES","tm":"11/25 21:00","c":3,"r":"tw","u":"https://www.digitimes.com.tw/tech/dt/n/shwnws.asp?id=776077","p":1795608000,"a":1795612563,"t":"小鵬科技日聚焦IRON人形機器人 年底拚量產、2027拓展商用","su":"샤오펑 그룹은 11월 25일 광저우에서 2026년 기술의 날을 개최하여 '원산지'라는 주제로 물리적 AI(물리적 AI) 기술의 진행 상황을 공유했으며, 여기서 휴머노이드 로봇(사람을 닮은 로봇) IRON이 회의의 초점이 되었습니다."},{"s":"2027년까지 AI 개선으로 휴머노이드 로봇에 대한 중국 투자 증가","so":"ET CIO","tm":"11/2 은 부품) 제조사로부터 각각 주문을 받아 내년 말까지 가시화될 예정이라고 밝혔다."},{"s":"YYForce, 엔비디아 기술을 사용하여 호텔 컨시어지 서비스용 휴머노이드 로봇 출시","so":"Yahoo Finance","tm":"11/25 00:28","c":2,"r":"us","u":"https://finance.yahoo.com/technology/ai/articles/yyforce-launches-humanoid-robot-hotel-152808508.html","p":1795534088,"a":1795560850,"t":"YYForce Launches Humanoid Robot for Hotel Concierge Services Using NVIDIA Technology","su":"YYForce Inc.(나스닥(미국 기술 회사들이 많이 모인 주식시장):YFOR)는 엔비디아 젯슨 엣지 AI 컴퓨팅 및 엔비디아 아이작 심 시뮬레이션 기술을 사용하여 호텔 컨시어지 운영을 위해 개발된 휴머노이드 로봇(사람을 닮은 로봇)의 출시를 발표했습니다."},{"s":"Qianjue Robot, Luma 고정밀 지형 측정 장비 출시","so":"Jiemian.com","tm":"11/27 21:24","c":1,"r":"cn","u":"https://www.jiemian.com/article/15385145.html","p":1795782279,"a":1795785235,"t":"千觉机器人发布Luma高精度形貌测量仪","su":"11월 27일 제28회 중국 하이테크 박람회에서 Xense Robotics는 Luma 고정밀 프로파일 측정 장비를 출시했습니다. 보고에 따르면 Luma는 휴대가 가능하며 현장의 주변광에 의해 제한되지 않습니다. 최대 10μm의 평면 정확도와 최대 15μm의 깊이 정확도로 표면의 3차원 기복을 신속하게 재구성하고 결함의 길이, 너비 및 깊이를 읽을 수 있습니다. 이 솔루션은 실물 크기의 범용 휴머노이드 로봇(사람을 닮은 로봇)을 대규모로 배치할 필요가 없으며, 경량 독립형 단말기 형태로 시각 및 촉각 인식이 산업 최전선에 직접 진입할 수 있도록 해준다. 원본 뉴스 출처: 제몐뉴스"},{"s":"먼저 결과를 추론한 후 실행: Huilun AWAM-1.8B는 로봇에 \"안전 벨트\"를 추가합니다.","so":"Jiemian.com","tm":"11/27 18:35","c":1,"r":"cn","u":"https://www.jiemian.com/article/15383884.html","p":1795772146,"a":1795780915,"t":"先推演后果再执行：慧仑 AWAM-1.8B 给机器人加了一道“安全带”","su":"로봇이 실제 현장에 진입하는 경우 작업을 완료하는 것은 첫 번째 단계일 뿐입니다. 안전하고 안정적으로 완료할 수 있는지 여부도 마찬가지로 중요합니다. 11월 27일, GAC가 인큐베이팅한 휴머노이드 로봇(사람을 닮은 로봇) 회사인 Huilun Technology가 광저우 모터쇼에서 기자회견을 열었습니다. 창업자이자 회장 겸 CEO(회사의 가장 높은 책임자)인 Zhang Aimin은 3층 설계에 안전성을 통합한 AWAM-1.8B를 출시했습니다. 알고리즘의 첫 번째 수준: 실행 전 추론. 모델은 여러 가지 가능한 미래 상태를 생성합니다. 이 작업이 계속되면 객체는 어디로 갈지, 어떤 것과 마주칠지, 주변에 사람이 있을지 등을 알 수 있습니다. 가치평가 브랜치는 각 미래에 점수를 매기고, 기준에 맞지 않는 행동은 바로 포기합니다. 장아이민은 \"세계 모델은 결과를 상상하는 역할을 하고, 행동 전문가는 행동 선택을 담당한다\"고 설명했다. '불집행'이 처음으로 법적 출력이 되었습니다. 안전은 단순히 실수하지 않는 것뿐만 아니라, 움직이거나 멈추지 않고 불확실할 때 다른 사람이 살펴보기를 기다리는 것이기도 합니다."},{"s":"'다항' 골드만삭스: 중국의 휴머노이드 로봇 출하량은 2035년 330만대에 달해 전 세계 로봇 출하량의 절반 이상을 차지할 것으로 예상된다.","so":"AAstocks","tm":"11/27 17:30","c":1,"r":"hk","u":"https://www.aastocks.com/tc/stocks/news/aafn-news/NOW.1557025/2","p":1795768200,"a":1795780921,"t":"《大行》高盛：中國人形機械人出貨量2035年料達330萬部 佔全球逾半","su":"골드만삭스는 휴머노이드 로봇(사람을 닮은 로봇) 산업이 기술 검증, 실험실 시연 및 비공개 데이터 수집을 거쳐 다년간의 실제 산업 및 상업 배포 단계에 진입하고 있다는 연구 보고서를 발표했습니다. 중국은 계속해서 물리적 인공지능 분야에서 세계 최대의 지역 시장이 될 것으로 예상됩니다. 휴머노이드 로봇 출하량은 초기 시험 단계에서 2030년 약 524,000개, 2035년 약 330만 개로 확대되어 전 세계 출하량 약 650만 개 중 51%를 차지하며, 이는 전 세계 도달 가능한 시장 규모 1,380억 달러에 해당합니다. 은행은 중국의 수요가 기술 검증에서 실질적인 생산성으로 전환되고 있다고 지적했다. 2025년부터 2035년까지 국내 수요에서 연구, 교육 및 인공지능 데이터 팩토리 애플리케이션의 비율은 약 42%에서 약 5%로 줄어들 것으로 예상됩니다. 산업 운영 및 상업용/소비자 애플리케이션은 약 240만 개로 확장되어 2035년 중국 전체 수요의 약 95%를 차지할 것으로 예상됩니다. 산업용으로는 약 100만 개, 상업용/소비자 애플리케이션은 각각 약 140만 개에 이를 것으로 예상됩니다. 2035년 중국의 약 330만 개 출하량 중 77%는 국내 수요에 맞춰지고 23%는 순수출에 사용될 것으로 예상됩니다."},{"s":"중국 하이테크 박람회에서 Jukun Robot의 손재주를 위한 풀스택 솔루션의 속도를 높이기 위해 임바디드 AI가 구현되었습니다.","so":"Jiemian.com","tm":"11/27 17:29","c":1,"r":"cn","u":"https://www.jiemian.com/article/15383635.html","p":1795768179,"a":1795780916,"t":"具身智能落地提速 炬坤机器人携灵巧手全栈方案亮相高交会","su":"제28회 중국국제첨단기술박람회(하이테크박람회)가 최근 선전에서 막을 내렸다. 이번 전시회에는 5,000개 이상의 기술 기업이 모여 인공 지능, 임바디드 AI(로봇처럼 몸을 가진 인공지능), 고급 장비 제조 및 기타 분야의 최첨단 성과를 선보입니다. 그중에서도 인간형 로봇과 산업 자동화의 핵심 실행 끝인 손재주는 산업 체인에서 가장 주목받는 트랙 중 하나가 되었습니다. 이번 전시회에서 절강대학교 Grasp Lab에서 탄생한 Hangzhou Jukun Robot는 처음으로 다양한 손재주 제품을 전시했습니다. 자체 개발한 공간 분리 메커니즘, 압저항 촉각 센싱, 코깅리스 모터 등 3가지 핵심 기술을 공개했다. 현장의 다양한 산업 고객과 심층적인 도킹을 완료했습니다. 절강대학교 기술의 산업화 성과는 업계에서 높은 평가를 받고 있습니다."},{"s":"[이주의 ETF] 신한자산운용 'SOL 우주항공밸류체인' 32%대 올라 상승률 1위, 휴머노이드 테마도 강세","so":"비즈니스포스트","tm":"11/27 17:05","c":1,"r":"kr","u":"https://www.businesspost.co.kr/BP?command=article_view&num=453169","p":1795766720,"a":1795780912},{"s":"한국 제조업 ‘로봇 밀도’ 세계 1위…세계 평균 7배 [데이터로 보는 세상]","so":"매일경제","tm":"11/27 16:45","c":1,"r":"kr","u":"https://www.mk.co.kr/news/economy/12220293","p":1795765543,"a":1795780912,"su":"한국이 제조업 자동화 수준을 보여주는 ‘로봇 밀도’에서 세계 1위를 기록했다. 국제로봇연맹(IFR)의 최근 발표 자료에 따르면, 2025년 기준 한국의 로봇 밀도는 제조업 근로자 1만명당 1066대로 913,"a":1795737920,"su":"두산로보틱스가 북미 자동화 솔루션 사업 확대에 힘입어 내년 매출(물건을 판 돈 전체) 1000억원을 넘어설 것이라는 전망이 나왔다. 같은 분기 협동로봇(사람 옆에서 함께 일하는 로봇) 매출은 45억원으로 29.8% 줄었다."},{"s":"화태증권: 구체화된 데이터 표준이 가속화되고 있으며 옵티머스 및 T-chain의 데뷔에 주목","so":"Jiemian.com","tm":"11/27 08:37","c":1,"r":"cn","u":"https://m.jiemian.com/article/15379478.html","p":1795736227,"a":1795737920,"t":"华泰证券：具身数据标准提速，关注Optimus亮相与T链","su":"화타이증권 연구 보고서에 따르면 지난 주 CSI 로봇 및 CSI 스마트 자동차 지수는 각각 10.69% 및 10.11% 하락하여 상하이 및 선전 300(-1.54%)보다 실적이 저조했으며 주로 글로벌 AI 자산 조정으로 인해 하락했습니다. 로봇 분야에서는 산업정보기술부가 휴머노이드 로봇(사람을 닮은 로봇) 산업 표준 5개와 체화 데이터 국가 표준을 발표하고 개발에 착수했다. 주요 AI 제조사들은 로봇을 직접 제어하기 위해 일반 대형 모델을 활용하기 시작했다. 옵티머스(테슬라가 만드는 사람 닮은 로봇)는 12월 초 공개될 예정이다. 스마트 운전 측면에서 WeRide와 Pony.com Robotaxi의 매출은 3분기에 크게 증가했지만 손실과 단일 차량 수는 아직 개선되지 않았습니다. 테슬라는 FSD v15를 추진하기 시작했고, 회사는 핵심 개입 비율이 25배 향상되었다고 밝혔습니다. 함대가 가벼운 자산 확장으로 전환할 수 있는지 여부는 12월 v15의 포괄적인 추진과 소유자의 파일럿 차량 액세스에 달려 있습니다."},{"s":"두산로보틱스, 내년 영업손실 303억 전망...적자 축소","so":"파이낸셜뉴스","tm":"11/27 08:23","c":1,"r":"kr","u":"https://www.fnnews.com/news/202611270820227849","p":1795735381,"a":1795737920,"su":"iM증권은 27일 두산로보틱스에 대해 내년 매출(물건을 판 돈 전체)액 1045억원, 영업손실 303억원을 전망했다. 이상수 iM증권 연구원은 \"자동화 솔루션 매출액 584억원, 협동로봇(사람 옆에서 함께 일하는 로봇) 매출액 376억원을 가정했다."},{"s":"유진證 \"2040년 휴머노이드 787만대 시대…현장 성과 입증 기업·병목 부품사 주목\"","so":"이투데이","tm":"11/27 08:23","c":1,"r":"kr","u":"https://www.etoday.co.kr/news/view/2653720","p":1795735380,"a":1795737920,"su":"▲휴머노이드 시장 전망. (출처=유진투자증권)전 세계 휴머노이드 로봇(사람을 닮은 로봇) 설치 대수가 2030년 13만대에서 2040년 787만대로 급증할 것이라는 전망이 나왔"},{"s":"스웨덴 볼보자동차, 벨기에 공장에 휴머노이드 로봇 투입","so":"로봇신문","tm":"11/27 06:43","c":1,"r":"kr","u":"https://www.irobotnews.com/news/articleView.html?idxno=49833","p":1795729422,"a":1795733692,"su":"스웨덴 자동차 제조업체 볼보자동차는 헥사곤 로보틱스(Hexagon Robotics)의 휴머노이드 로봇(사람을 닮은 로봇) '이온(AEON)'을 벨기에 겐트(Ghent) 공장에 배치했"},{"s":"휴머노이드 열풍에 냉정한 토요타 본거지… “화려한 묘기보다 신뢰성이 우선”","so":"글로벌이코노믹","tm":"11/27 05:45","c":1,"r":"kr","u":"https://www.g-enews.com/article/Global-Biz/2026/11/2026112618345395420c8c1c064d_1","p":1795725900,"a":1795733692,"su":"토요타 본거지 아이치현 '팩토리 이노베이션 위크 2026' 개막… 쿵푸·백플립 시연에도 현장 반응은 냉정 유니트리 유통사 \"시각 인식 한계로 무작위 부품 집기 어려워… 대학·기업 연구용 주문이 대부분\" 토요타, 2028~2040년 로봇 40만 대 배치 추진… 휴머노이드(사람을 닮은 로봇) 대신 용접 코봇·바퀴형 양팔 로봇 등 검증된 실용 자동화 집중 전 세계 테크 업계가 '물리적 인공지능(Physical AI)'과 휴머노이드(인간형) 로봇 상용화(실제로 팔고 쓰이기 시작하는 것) 경쟁에 열을 올리고 있으나, 정작 세계 최대 완성차 기업 토요타자동차의 심장부인 일본 아이치현 제조현장에서는 이족보행 휴머노이드에 대해 냉정한 신중론이 지배하고 있다."},{"s":"피지컬 AI 시대의 로봇 산업 로보넥스트 2026(9) 화낙 상무 집행 임원","so":"日刊工業新聞","tm":"11/27 05:00","c":1,"r":"jp","u":"https://www.nikkan.co.jp/articles/view/798257","p":1795723200,"a":1795733702,"t":"フィジカルAI時代のロボット産業 ロボネクスト2026（9）ファナック常務執行役員 ロボット研究開発統括本部長・安部健一郎氏"},{"s":"휴머노이드 로봇이 \"해체\"되었습니다! 하이테크 박람회의 Baoan 부스에서는 전체 산업 체인을 선보입니다.","so":"21财经","tm":"11/27 00:33","c":1,"r":"cn","u":"https://www.21jingji.com/article/20261126/herald/86de3d22f2fb1db508be44ce936426dd.html","p":1795707180,"a":1795733695,"t":"人形机器人被“拆”了！高交会宝安展台， 亮出整条产业链","su":"하이테크 박람회에서 휴머노이드 로봇(사람을 닮은 로봇)을 볼 때 모든 사람들은 손을 흔들고, 걷고, 물을 주고, 공중제비를 돌리고, 춤을 추고, \"실제\"이고 기능적인 진화를 칭찬하는 등 로봇의 움직임을 따라가는 데 익숙합니다. 올해 선전 바오안(Shenzhen Baoan)은 얼마나 똑똑한지 보여주는 대신 전시 방식을 바꿔 휴머노이드 로봇을 분해하고 관객이 로봇의 '내부 장기'를 직접 볼 수 있도록 했다. 11월 26일, 제28회 중국국제첨단기술박람회가 선전국제전시센터에서 개막했다. 15번 홀에 있는 340제곱미터 규모의 Baoan 이미지 전시 공간은 \"Baozhi Chain New Embodied Competition\"이라는 주제로 42개 회사가 모입니다. 중앙에는 해체된 휴머노이드 로봇이 있습니다. 평소 동체 안에 촘촘하게 숨겨져 있던 것들이 이제 전시대 위에 하나씩 펼쳐집니다. 각 작품 뒤에는 Baoan의 해당 지능형 제조 회사를 거의 찾을 수 있습니다."},{"s":"선전 난산(Nanshan)의 42개 기술 기업이 하이테크 박람회에 등장해 로봇 공학과 양자 기술을 전시했습니다.","so":"Jiemian.com","tm":"11/27 00:02","c":1,"r":"cn","u":"https://www.jiemian.com/article/15379221.html","p":1795705323,"a":1795733699,"t":"深圳南山42家科技企业亮相高交会，机器人、量子科技集中展示","su":"11월 26일, 제28회 중국국제첨단기술박람회가 선전에서 개막했습니다. 휴머노이드 로봇(사람을 닮은 로봇), 반도체 칩, 생명과 건강, 첨단 기술, 지능형 하드웨어, 신에너지 등 6개 주요 방향을 다루는 선전 난산(Nanshan)의 42개 기술 기업이 함께 등장했다. 이 가운데 Zhongqing Robotics, Zhisquare, Lesen Robotics 등의 기업은 로봇 산업에서의 성과를 시연했으며, Weiling Medical, Bose Quantum, Lingnan Quantum 등의 기업은 뇌-컴퓨터 인터페이스, 양자 컴퓨팅 등 첨단 기술을 선보였습니다. Nanshan은 이번에도 혁신 인큐베이션 결과를 보여주는 데 중점을 두었습니다. Moliying AI 생태 커뮤니티에서 인큐베이션한 Yuanshi Intelligence, Huilu Intelligence 및 Handy Technology와 Shenzhen Science and Technology Innovation Institute에서 인큐베이션한 Shibu Technology, Jiangxin Era 및 기타 스타트업이 같은 장소에 등장하여 AI 대형 모델, 임바디드 AI(로봇처럼 몸을 가진 인공지능)형 데이터, 뇌-컴퓨터 인터페이스, 지능형 하드웨어 및 기타 분야를 포함하여 스타트업 인큐베이션부터 산업 구현에 이르기까지 Nanshan의 과학 기술 혁신 생태를 보여주었습니다."},{"s":"Xiaopeng의 휴머노이드 로봇은 수동 원격 제어가 필요하지 않으며 실시간으로 사람들을 독립적으로 관찰하고 상호 작용할 수 있습니다.","so":"TVB","tm":"11/26 20:39","c":1,"r":"hk","u":"https://news.tvb.com/sc/1208632-%E5%B0%8F%E9%B5%AC%E4%BA%BA%E5%BD%A2%E6%A9%9F%E6%A2%B0%E4%BA%BA%E5%85%A8%E7%A8%8B%E4%B8%8D%E7%94%A8%E4%BA%BA%E5%B7%A5%E9%81%99%E6%8E%A7%E5%8F%AF%E8%87%AA%E4%B8%BB%E8%A7%80%E5%AF%9F%E8%88%87%E4%BA%BA%E5%AF%A6%E6%99%82%E4%BA%92%E5%8B%95","p":1795693140,"a":1795699409,"t":"小鵬人形機械人全程不用人工遙控 可自主觀察、與人實時互動","su":"Xiaopeng Group은 수동 원격 제어가 필요하지 않고 실시간으로 사람들을 독립적으로 관찰하고 생각하고 상호 작용할 수 있는 차세대 휴머노이드 로봇(사람을 닮은 로봇)을 출시했습니다. 마이크를 들고 무대에 올라 자신을 소개하세요. 샤오펑 Robot IRON은 \"안녕하세요 여러분. 저는 샤오펑 Robot IRON입니다. 왼쪽에 있는 친구들이 안녕하세요. 전 세계의 친구들을 환영합니다.\"라고 말했습니다. 관객들과도 유머러스하게 소통할 예정이다. 아이언은 “2000명이 넘는 무대에 서는 건 처음이다. 확실히 조금 떨리긴 하지만 꼭 보셔야 할…"},{"s":"휴머노이드 로봇이 생각보다 빨리 온다","so":"The Economist","tm":"11/26 19:48","c":1,"r":"world","u":"https://www.economist.com/briefing/2026/11/26/humanoid-robots-are-coming-sooner-than-you-think","p":1795690118,"a":1795733709,"t":"Humanoid robots are coming—sooner than you think"},{"s":"중롄중커, bauma CHINA 2026에서 엠보디드 인텔리전스를 탑재한 업계 최초의 AI 드릴링 로봇 발표","so":"時事ドットコム","tm":"11/26 19:46","c":1,"r":"jp","u":"https://www.jiji.com/jc/article?k=v1AsYCRq&g=prn","p":1795689960,"a":1795694363,"t":"Zoomlion、bauma CHINA 2026にて、エンボディド・インテリジェンスを搭載した業界初のAI掘削ロボットを発表","su":"상하이, 2026년 11월 26일/PRNewswire/--ZoomlionHeavyIndustryScience&TechnologyCo.,Ltd.(\"중롄중커\" 또는 \"당사\")는, 11월 24일에 개최된 baumaCHINA2026에 있어서 엠보디드 인텔리전을 발표. 시연에서는 자동 적재 및 기타 건설 작업 지원 기술이 소개되었습니다. 또한 이 장치는 음성 조작, 환경 인식 및 자율 운전 기능을 갖추고 있습니다. 회사는 또한 Z01 및 Z03…"},{"s":"제일재경 앵커가 말했다 | 2년 만에 로봇회사 30개가 망했다. 유행은 죽지 않았지만 이야기꾼이 먼저 죽었습니다.","so":"第一财经","tm":"11/26 18:44","c":1,"r":"cn","u":"https://www.yicai.com/video/103455320.html","p":1795686299,"a":1795694354,"t":"一财主播说 | 两年倒掉30家机器人公司 风口没死 讲故事的先死了","su":"제일재경 공식 홈페이지에서는 주식시장 상황, 경제동향, 금융정책, 산업동향, 전문가 분석 등 금융정보를 24시간 7시간 제공한다. 또한 주식 토크와 금융, 오늘의 주식 시장, 기업과 산업, 금융 해독, 브레인스토밍 등 중국 비즈니스 네트워크 TV 프로그램의 단독 생방송을 방송합니다."},{"s":"9500만 명이 우울증에 시달리고 있으며 9.5%만이 치료를 받고 있다: 지칸은 인간형 로봇을 상담에 사용한다","so":"36Kr","tm":"11/26 17:12","c":1,"r":"cn","u":"https://www.36kr.com/p/4072080090731399","p":1795680729,"a":1795694356,"t":"抑郁症 9500 万人、仅 9.5% 就医：季灿用人形机器人问诊","su":"우울증을 앓고 있는 9,500만 명 중 치료를 받는 사람은 9.5%에 불과합니다. Ji Can은 상담을 위해 휴머노이드 로봇(사람을 닮은 로봇)을 사용합니다. 하이테크 박람회가 다가옴에 따라 Shenzhen Jican 인공 지능 연구소는 우울증 진단 및 치료를 위한 휴머노이드 로봇 솔루션을 대중의 눈에 띄게 했으며 정신적, 심리적 디지털화의 장기적인 트랙에서 과학적 연구 검증부터 제품화까지 핵심 단계를 완료하려고 노력했습니다. 1. 프로젝트의 유래 이 프로젝트는 당초 심천 강녕병원과의 사업 도킹에서 출발했으며, 칭화대학교 AI 연구개발팀의 기술 축적이 겹쳐졌다. 우울증 진단과 치료라는 시급한 임상(새 약을 사람에게 시험하는 것)적 필요성을 시작으로 칭화대학교, 코닝병원 등 과학연구 및 의료기관과 팀을 이뤄 프로젝트 형태로 과학적 연구 검증을 시작하고 점차 시장 구현을 향해 나아갔다. 이 프로젝트는 현재 제품 개발의 마지막 단계에 있습니다. 소프트웨어 수준에서 완전한 협의 과정이 진행되었으며, 동시에 구현 로봇의 통합도 진행되고 있습니다."},{"s":"中 두코로보틱스, 태국 진출...동남아서 입지 확대","so":"로봇신문","tm":"11/26 16:49","c":1,"r":"kr","u":"https://www.irobotnews.com/news/articleView.html?idxno=49819","p":1795679364,"a":1795694350,"su":"중국 산업용 로봇 기업이 지능형 로봇 브랜드를 필두로 태국을 비롯한 동남아 시장에서 보폭을 넓힌다.24일 중국 로봇 전문 포털 중국로봇망에 따르면 두코로보틱스(D"},{"s":"샤오펑 로봇 IRON, 대본 없이 강의 \"조금 긴장되지만 얼굴 붉히지는 않을 것\"","so":"udn","tm":"11/26 15:27","c":1,"r":"tw","u":"https://udn.com/news/story/7333/9903514?from=udn-ch1_breaknews-1-0-news","p":1795674420,"a":1795676879,"t":"小鵬機器人IRON無腳本開講 「我有點緊張 但不會臉紅」","su":"샤오펑 Technology는 25일 광동에서 샤오펑의 고급형 범용 휴머노이드 로봇(사람을 닮은 로봇) IRON을 출시했습니다. 많은 사람들을 놀라게 한 것은 IRON이 샤오펑 Technology의 창립자인 He Xiaopeng과 직접 대면하여 소통하면서 대본도 없는 공개 대화를 현장에 가져왔다는 것입니다. 모든 응답은 실시간으로 로봇이 독립적으로 생성했으며 중국어와 영어로 자체 음성을 시작했으며 손바닥 온도는 25~40°C였습니다. IRON은 유머와도 상호작용할 수 있습니다. 언론이 \"나와 허샤오펑 중 누가 더 똑똑한가?\"라고 묻자 \"각자 고유의 장점이 있다\"고 답했다. 샤오펑 Group의 He Xia     for(var t in HI.s){ for(var k in HI.s[t]){ if(HI.s[t][k][i] != null){ ok = true; break; } } if(ok) break; }
    HI.av.push(ok); }

  while(y < ey || (y === ey && m <= em)){
    var a = dIdx(y+'-'+('0'+m).slice(-2)+'-01'), ny = m===12 ? y+1 : y, nm = m===12 ? 1 : m+1;
    var b = Math.min(HI.n, dIdx(ny+'-'+('0'+nm).slice(-2)+'-01'));

    $('s-cs').dataset.q = '이 페이지의 기사 전체를 처음부터 끝까지 읽고 한국어로 요약해 줘. 핵심 내용 3~5줄, 그리고 투자자 입장에서 중요한 숫자와 의미를 짧게 정리해 줘.';
    $('s-ct').dataset.q = "너는 어려운 경제 뉴스를 초등학생도 이해할 수 있게 풀어 주는 친절한 번역가야.\n이 페이지의 뉴스 기사 전체를 쉬운 한국어로 번역해 줘.\n\n[가장 중요한 규칙]\n- 쉽게 쓰더라도 기사 내용은 정확해야 해. 사실을 빼거나, 바꾸거나, 지어내지 마.\n- 기사 순서대로, 빠지는 내용 없이 번역해 줘.\n\n[쉽게 쓰는 방법]\n1. 한 문장에는 한 가지 내용만 써 줘. 문장은 짧게.\n2. \"~습니다/~해요\"체로 친절하게 써 줘.\n3. 어려운 말은 쉬운 말로 바꾸고, 꼭 필요한 전문 용어는 처음 나올 때 괄호로 뜻을 풀어 줘.\n   (예: 금리(돈을 빌릴 때 내는 이자의 비율), 실적(회사가 번 돈과 성과), 주가(회사 주식 한 주의 가격))\n4. 한자어·외래어보다 쉬운 우리말을 먼저 써 줘. (예: 하락 → 떨어졌어요, 상승 → 올랐어요)\n5. 큰 숫자는 읽기 쉽게 바꾸되 정확한 값은 지켜 줘. (예: $2.5 billion → 25억 달러(약 3조 5천억 원쯤))\n   환율로 바꾼 값은 \"약\"을 붙여서 대략이라는 걸 알려 줘.\n6. 회사·사람 이름은 한국에서 부르는 이름으로 쓰고, 처음 나올 때만 괄호에 영어 이름을 적어 줘. (예: 엔비디아(Nvidia))\n7. 누가 한 말인지 분명하게 써 줘. (예: 젠슨 황 대표는 \"…\"라고 말했어요.)\n\n[출력 형식]\n① 한 줄 요약: 이 기사가 무슨 이야기인지 한 문장으로\n② 쉬운 번역: 기사 순서대로\n③ 어려운 말 풀이: 기사에 나온 경제 용어 3~5개를 한 줄씩 쉽게 설명\n④ 그래서 무슨 뜻이야?: 이 소식이 주식 투자하는 사람에게 왜 중요한지 2~3줄\n   (기사에 나온 사실만 근거로, 내 생각이나 예측은 넣지 마)\n\n기사가 길어서 한 번에 다 못 하면, 어디까지 했는지 알려 주고 내가 \"계속\"이라고 하면 이어서 해 줘.";
  }
  $('dim').hidden = false; $('sheet').hidden = false; $('sheet').scrollTop = 0;
  document.body.style.overflow = 'hidden';
});
// ✦ 버튼: Gemini 요청 문장을 복사하고 원문을 엶 → 원문 화면에서 Gemini 를 불러 붙여넣기
function askAI(a){
  var q = a.dataset.q || '';
  try { if(navigator.clipboard) navigator.clipboard.writeText(q); } catch(e){}
  toast('요청 문장을 복사했어요 · 원문에서 측면 버튼 길게 → 「이 페이지에 관해 질문하기」 → 붙여넣기');
  setTimeout(closeSheet, 50);
}
function toast(msg){ var t = $('toast'); t.textContent = msg; t.hidden = false; clearTimeout(toast._t); toast._t = setTimeout(function(){ t.hidden = true; }, 4000); }
function closeSheet(){ $('dim').hidden = true; $('sheet').hidden = true; document.body.style.overflow = ''; }
document.addEventListener('keydown', function(e){ if(e.key==='Escape') closeSheet(); });
</script></body></html>
