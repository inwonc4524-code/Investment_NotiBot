뉴스핌","tm":"11/23 08:36","c":1,"r":"kr","u":"https://www.newspim.com/news/view/20261123000236","p":1795390560,"a":1795403788,"su":"[서울=뉴스핌] 로보뉴스 = 하나증권에서 23일 LG에너지솔루션(373220)에 대해 '2027년 전망'라며 투자의견(전문가가 사라·팔라고 내는 의견) 'BUY'의 신규 리포트를 발행하였고, 목표가 480,000원을 내놓았다. 전일 종가 기준으로 볼 때, 이 종목의 주가는 목표가 대비 60.3%의 추가 상승여력이 있다는 해석이 가능하다. ◆ LG에너지솔루션 리포트 주요내용 하나증권에서 LG에너지솔루션(373220)에 대해 '향후 2년간 EV 매출 성장 정체 및 적자 유지 가정하더라도 ESS(전기를 저장해 두는 큰 배터리) 성장 힘입어 2028년 순익 3.1조원 충분히 달성 가능하다고 판단."},{"s":"주가 반토막에 풋옵션 폭탄… 에코프로비엠, 기존 FI들에 ‘CB 돌려막기’","so":"Chosunbiz","tm":"11/23 06:00","c":1,"r":"kr","u":"https://biz.chosun.com/stock/market_trend/2026/11/23/HCHCDI5F3VAFHGIX7N6GPUZGGE/","p":1795381200,"a":1795389909,"su":"주가 반토막에 풋옵션 부담 에코프로비엠, 기존 FI와 CB 재발행 추진 4200억 CB 조기상환 후 신규 발행 만기이자율 2% → 3% 상향 유력 상환금, 신규 CB 인수대금과 상계"},{"s":"탄산리튬 가격의 상승과 하락 사이에서 리튬 배터리 사이클은 조용히 기어를 전환합니다. 세 가지 주요 차원이 경쟁 순위를 재정의합니다.","so":"财联社电报","tm":"11/23 05:48","c":1,"r":"cn","u":"https://m.cls.cn/detail/2542142","p":1795380480,"a":1795440092,"t":"碳酸锂价格起落之间 锂电周期悄然换挡：三大维度重新划分竞争座次","su":"차이롄서, 11월 23일(류멍그란 기자) 소비세 재개, 수출세 환급 인하, 해외 관세(수입품에 붙이는 세금) 및 규정 준수 장벽의 지속적인 증가 등으로 인해 이번 리튬배터리 산업 사이클이 정점에 이르렀는지 여부를 둘러싼 목소리가 나오고 있다. 올해 10월 CATL(300750.SZ)의 3분기 실적(회사가 번 돈 성적표) 보고에서 회사 경영진은 중국의 국내 자전거 충전 용량이 증가하고 상업용 차량의 전기화가 가속화되었으며 유럽과 신흥 시장은 여전히 잠재력이 있고 에너지 저장에 대한 내부 및 외부 수요가 계속 증가하고 있으며 전 세계 전력 및 에너지 저장 수요가 예상보다 낫다고 밝혔습니다. 그러나 이러한 반응은 시장의 의구심을 해소하지 못했습니다. 최근 개최된 제11회 국제전력배터리응용서밋(CBIS2026)에서 많은 업계 관계자들이 연설에서 “기존 시장은 30% 이상의 복합성장에 시장이 익숙해져 있었지만, 기관에서는 2027년 배터리 출하량 증가율이 20%로 다시 하락할 것으로 전망하고 있다”고 밝혔다. 이는 업계가 ‘눈 감고 성장’ 단계에서 성장률 전환, 차별화, 전환이라는 새로운 단계로 전환했음을 의미하기도 한다."},{"s":"CATL은 유럽 시장으로 확장할 계획이며 EU에 정유용 폐배터리 재활용을 개방할 것을 촉구합니다.","so":"DIGITIMES","tm":"11/23 03:22","c":1,"r":"tw","u":"https://www.digitimes.com.tw/tech/dt/n/shwnws.asp?id=0000775544_4V64DOMZ59G7MF3Y1EBUT","p":1795371720,"a":1795389911,"t":"寧德時代布局歐洲市場 籲歐盟開放廢棄電池回送中精煉","su":"CATL 창립자이자 회장인 Zeng Yuqun은 유럽이 현지 배터리 재활용을 장려한다면 높은 비용에 직면하게 될 것이라고 경고했습니다. 그는 사용한 배터리를 중국으로 보내고, 재활용된 금속을 정제한 뒤 다시 유럽으로 운송하자고 제안했습니다. 이 계획은 유럽 공무원과 일부 자동차 제조업체에 제안되었습니다."},{"s":"CATL을 곤경에 빠뜨린 미국산 포드의 LFP는 중대한 조치를 취한다","so":"DIGITIMES","tm":"11/23 03:21","c":1,"r":"tw","u":"https://www.digitimes.com.tw/tech/dt/n/shwnws.asp?id=0000775525_ZD24WADF3PB7LO4GXA71T","p":1795371660,"a":1795389912,"t":"攜寧德時代惹一身腥 福特LFP美國自製跨出關鍵一步","su":"최근 포드는 인산철리튬(LFP) 배터리가 공식적으로 생산에 들어가고 전기 픽업트럭에도 탑재될 것이라고 발표해 미국이 LFP 배터리를 제조하는 데 중요한 발걸음을 내디뎠다. 유럽, 미국, 일본, 한국의 주류 자동차 제조업체를 살펴보면 Ford는 자체 제작에 성공한 몇 안 되는 사례 중 하나입니다. 외신은 CATL 턴키 의존도에 대해 의구심을 갖고 있지만, 공급망(부품·재료가 오가는 연결망)에서는 여전히 긍정적인 기대를 갖고 있다. ..."},{"s":"CATL은 배터리에서 에너지 통합으로 전환하여 라틴 아메리카 에너지 저장 시장에서 입지를 확대하고 있습니다.","so":"DIGITIMES","tm":"11/23 03:04","c":1,"r":"tw","u":"https://www.digitimes.com.tw/tech/dt/n/shwnws.asp?id=775366","p":1795370640,"a":1795389914,"t":"寧德時代從電池走向能源整合 擴大布局拉美儲能市場","su":"전기 자동차의 글로벌 인기가 둔화되고 시장 경쟁이 심화됨에 따라 CATL 회장 겸 CEO(회사의 가장 높은 책임자)인 Zeng Yuqun은 회사가 표준화된 통합 솔루션을 만들기 위해 미국에서 수요가 높은 독립형 전원 공급 장치 시스템을 확보했다고 밝혔습니다. 또한 라틴 아메리카에서 에너지 저장 사업 기회를 완전히 포착하기 위해 아르헨티나에 상업 사무소를 설립했습니다."},{"s":"전기차도 국내생산세액공제 대상 포함 유력…이르면 이번주 결론 - 머니투데이","so":"머니투데이","tm":"11/22 14:34","c":1,"r":"kr","u":"https://www.mt.co.kr/amp/industry/2026/11/22/2026112210573377519","p":1795325668,"a":1795403788,"su":"당초 지원 대상에서 제외됐던 전기차가 국회 논의단계에서 국내생산세액공제 대상에 추가될 가능성에 무게가 실리고 있다. 앞서 정부는 지난 8월 발표한 세제개편안에서 국내생산세액공제 지원 분야로 △태양광 발전 △풍력 발전 △이차전지 △반도체(전자기기 속에서 계산하고 기억하는 작은 부품) △핵심소재 △AI(인공지능) 로봇부품 등 6개 분야를 선정했다."},{"s":"압력을 받고 있는 리튬 광부들은 중국의 재고량이 낮다고 믿습니다.","so":"AFR","tm":"11/22 14:00","c":1,"r":"us","u":"https://www.afr.com/companies/mining/under-pressure-lithium-miners-put-faith-in-low-chinese-stockpiles-20261122-p61frh","p":1795323600,"a":1795334537,"t":"Under pressure lithium miners put faith in low Chinese stockpiles","su":"PLS, MinRes 및 Liontown은 모두 가격이 5월 최고치보다 60% 하락하자 생산량을 늘렸습니다. 모두 반등(내렸다가 다시 오르는 것)이 곧 다가올 것이라고 확신하고 있습니다."},{"s":"서울 폐가전 수거 1만7천t…이차전지 전용수거함 4천100개 늘렸다","so":"SBS Biz","tm":"11/22 11:52","c":1,"r":"kr","u":"https://biz.sbs.co.kr/article/20000348017","p":1795315920,"a":1795334537,"su":"[2026년 폐가전제품 및 폐전지 공공 회수체계 우수 지자체 경진대회서 수상한 서울시 (서울시 제공=연합뉴스)]서울시의 폐가전제품 수거량이 1년 새 20% 넘게 늘고, 중소형 폐가전 수거량은 50% 이상 증가한 것으로 나타났습니다. 휴대용 보조배터리 등 리튬(배터리에 꼭 들어가는 아주 가벼운 금속)배터리 사용 증가에 대응해 이차전지 전용 수거함도 4천100여개 추가 설치했습니다.서울시는 …"}]},{"name":"⚡ 전고체배터리·ESS","note":"보유: KODEX 전고체배터리ESS TOP2플러스","breaking":false,"items":[{"s":"아이씨에이치, 美 친환경 정책 기대감…ESS 배터리 소재 공급 확대","so":"뉴시스","tm":"11/25 10:54","c":2,"r":"kr","u":"https://www.newsis.com/view/NISX20261125_0003882444","p":1795571652,"a":1795574646,"su":"[서울=뉴시스] 김경택 기자 = 첨단 전자소재 전문기업 아이씨에이치는 미국의 친환경 에너지 정책 강화 기대감이 커지고 있는 가운데 에너지저장장치(ESS(전기를 저장해 두는 큰 배터리)) 배터리용 소재 공급을 확대할 예정이라고 25일 밝혔다.회사 측에 따르면 미국 중간선거 이후 친환경 에너지 정책이 강화될 것이라는 기대감에 ESS 산업이 다시 주목받고 있다. 미국의 정책 변화로 ESS 투자.."},{"s":"중국 손해보험과 Xiqing Energy는 에너지 저장 보험을 '경험 가격 책정'에서 '데이터 가격 책정'으로 촉진하기 위한 전략적 협력에 도달했습니다.","so":"經濟日報","tm":"11/23 21:00","c":2,"r":"tw","u":"https://money.udn.com/money/story/123828/9897045?from=edn_next_story","p":1795435231,"a":1795440104,"t":"中意財險與西清能源達成戰略合作，推動儲能保險從「經驗定價」邁向「數據定價」","su":"홍콩, 2026년 11월 23일 /PRNewswire/ -- 최근 중국그룹 손해보험유한공사(이하 '중국그룹 손해보험')와 베이징시칭에너지기술유한회사(이하 '시칭에너지')가 공식적으로 전략적 협력 계약을 체결했다. 이번 협력은 중국 최고의 에너지 저장 보안 기술 회사와 세계적으로 유명한 보험 그룹 간의 심층적인 협력을 의미합니다. Xiqing Energy의 능동 안전 기술은 GICC의 에너지 저장 발전소 인수 및 위험 가격 책정 프로세스에 깊이 통합될 것입니다. 양 당사자는 에너지 저장 자산 위험 관리를 위한 새로운 표준을 공동으로 확립하고, \"RaaS(Risk as a Service)\"를 핵심으로 하는 \"수동적 청구\" 모델에서 \"능동적 방어\"로 업계의 전환을 촉진하고, 업계를 선도하여 고품질, 저위험 개발 모델을 구축하고 글로벌 지속 가능한 개발에 힘을 실어줄 것입니다. AI 기반 언더라이팅 양 당사자는 실제 발전소 운영 정보와 배터리 안전 등급을 기반으로 지능형 언더라이팅 플랫폼을 공동 개발할 예정입니다. 플랫폼은 인수 양식을 기반으로 구조화된 자금 수집을 수행합니다. 과거 경험적 결함 라이브러리의 배터리 안전 위험 평가, 발전소 운영 정보의 비정형 특징 재구성, 도메인 수직형 대형 모델을 기반으로 한 포괄적인 위험 진화 추세 분석 및 판단과 같은 기술적 수단을 통해 에너지 저장 발전소의 주요 위험 매개변수를 표준화되고 비교 가능한 위험 점수로 변환하고 맞춤형 인수 계획을 동적으로 생성합니다. 해야 한다"},{"s":"에너지 저장 정책은 장기적으로 좋습니다. Southern Fund의 신에너지 ETF Southern(516160)은 이전 거래일에 3.00% 하락한 기초 지수 CSI New Energy Index(399808.SZ)를 추적합니다.","so":"财联社","tm":"11/23 15:45","c":2,"r":"cn","u":"https://www.cls.cn/detail/2541481","p":1795416359,"a":1795417562,"t":"储能政策长期利好，南方基金旗下新能源ETF南方(516160)跟踪标的指数中证新能源指数(399808.SZ) 前一交易日收跌3.00%"},{"s":"Jinlang Technology는 태양 에너지 저장에 5억 4400만 위안을 투자하여 태양광 발전소의 오래된 장부를 찢었습니다. 에너지 저장이 모든 것에 대한 답이 될까요? -36Kr","so":"www.36kr.com","tm":"11/23 11:48","c":2,"r":"cn","u":"https://www.36kr.com/p/4080484433974919","p":1795402092,"a":1795403803,"t":"锦浪科技5.44亿弃光投储，撕开光伏电站的旧账本，储能成为一切的答案？-36氪","su":"Jinlang Technology는 태양 에너지 저장에 5억 4400만 위안을 투자하여 태양광 발전소의 오래된 장부를 찢었습니다. 에너지 저장이 모든 것에 대한 답이 될까요? 소득 모델에 따라 태양광 에너지 저장 트랙 사이에 새로운 에너지 자금이 흐릅니다. Foresight Energy는 11월 20일 저녁 Jinlang Technology가 이사회에서 \"분산형 태양광 발전소 프로젝트\"를 종료했다고 발표했다는 사실을 알게 되었습니다. 본 프로젝트는 당초 3억 5400만 위안을 투자할 계획이었으나 11월 13일 현재 한 푼도 투자하지 않았다. 회사는 2개의 인버터 프로젝트에서 1억 8900만 위안을 추가로 조정하여 8GWh 에너지 저장 시스템의 연간 생산량에 5억 4400만 위안을 투자했습니다. 이에 앞서 GCL Energy Technology도 유사한 자금 재분배를 수행했지만 에너지 저장 절감액을 다시 태양광 발전으로 이전한 회사도 있었습니다. 돈이 두 선로 사이를 오가며 그 이유는 송풍구의 순환만큼 단순하지 않습니다. 전기 가격 메커니즘, 그리드 연결 규칙 및 수익 모델이 동시에 다시 작성되었습니다. 지붕은 여전히 그대로인데 계산대에서 결제방법이 바뀌었습니다."},{"s":"세계 최대의 액체 공기 에너지 저장 프로젝트를 방문해 보세요","so":"中国新闻网","tm":"11/22 15:17","c":2,"r":"cn","u":"https://www.chinanews.com.cn/cj/shipin/cns-d/2026/11-22/news1075696.shtml","p":1795328220,"a":1795334544,"t":"探访全球最大液态空气储能项目","su":"세계 최대 액체 공기 에너지 저장 프로젝트 방문 출시 시간: 2026년 11월 22일 14:17 출처: 중국 뉴스 네트워크 11월 22일 기자들은 칭하이 성 하이시 몽골 및 티베트 자치주 거얼무시에 위치한 세계 최대 60메가와트 액체 공기 에너지 저장 국가 시범 프로젝트를 방문했습니다. 이 프로젝트는 중국의 액체 공기 에너지 저장 기술에 대한 포괄적인 숙달을 의미하며 장비 국산화율은 100%에 달하고 에너지 저장 전력 및 용량은 세계 1위를 차지합니다. 올해 10월 30일 전력망(발전소 전기를 집·공장까지 보내는 전깃줄 그물)에 성공적으로 연결됐다. 공기에너지저장장치(전기를 저장해 두는 큰 배터리)는 공기를 영하 194도까지 냉각해 액체 상태로 만든 뒤 저장했다가 전력이 필요할 때 방출해 전기를 생산하는 방식이다. 풍력과 태양광발전은 급속도로 발전하고 있지만 날씨에 따라 변동폭이 크고 변동폭이 크다. 그것들은 저장될 수도 없고 양도될 수도 없습니다. 이 프로젝트는 신에너지 전력의 \"낮은 계곡 저장 및 피크 사용\"을 실현하여 풍력 및 태양열 소비 문제를 효과적으로 해결합니다."},{"s":"11월 24일, 중국남방전력망의 주요 에너지 저장 자금이 순유출되었습니다. 지난 5일 동안 시가총액은 역사적으로 낮은 수준이었습니다.","so":"经济观察网","tm":"11/25 10:06","c":1,"r":"cn","u":"http://www.eeo.com.cn/2026/1125/1101666.shtml","p":1795568760,"a": 되다","so":"新华网客户端","tm":"11/24 18:48","c":1,"r":"cn","u":"https://app.xinhuanet.com/news/article.html?articleId=2026112499348981925e4c8ea497bd4a8e6bada0","p":1795513739,"a":1795521542,"t":"前沿科技科普解读丨动画：虚拟电厂——移动储能，电动汽车化身调节单元","su":"최첨단 과학 기술의 해석 | 애니메이션: 가상 발전소 - 이동형 에너지 저장 장치, 전기 자동차가 규제 장치가 됨 - 주차 공간에 주차된 전기 자동차, 마이크로 에너지 저장 장치로 전환할 수 있는 전기차 배터리(전기차를 움직이는 큰 충전 배터리)가 장착됨. 양방향 충전 파일의 V2G 차량 네트워크 상호 작용 기술을 기반으로 전기 에너지가 양방향으로 흐르며 차량은 더 이상 단순한 전기 장비가 아닙니다. 가상발전소(흩어진 태양광·배터리를 하나의 발전소처럼 묶어 쓰는 것)는 신에너지 차량을 대거 모아 전력과 주차기간을 조율하고 충전과 방전을 자동으로 계획한다. 자동차 소유자의 여행 전력 안전 보장을 전제로 전력망 규제에 참여하고 피크-밸리 가격 차이를 통해 수익을 얻을 수 있습니다. 이 애니메이션에서 자동차-네트워크 상호작용의 미스터리를 함께 풀어봅시다. 과학 고문: State Grid Jiangsu Electric Power Co., Ltd. 마케팅 서비스 센터 부하 관리 부서 부국장 및 수석 엔지니어 Zhou Yuqi, 중국 과학 기술 협회 과학 대중화 부서, 중국 에너지 연구 협회, Xinhuanet, 공동 제작"},{"s":"출시된 지 반년도 안 돼 매출이 10배나 늘었다. GEYOTO는 어떻게 북미 에너지 저장 시장을 돌파할 수 있나요?","so":"Jiemian.com","tm":"11/24 18:46","c":1,"r":"cn","u":"https://www.jiemian.com/article/15368524.html","p":1795513584,"a":1795521544,"t":"上线不到半年，销量增长十倍，GEYOTO如何破局北美储能市场？","su":"해외 진출에 관해 이야기할 때, 대부분의 사람들은 중국 기업이 자사의 제품 강점과 공급망(부품·재료가 오가는 연결망) 이점을 활용하여 어떻게 글로벌 시장에서 성숙한 브랜드에 도전할 수 있는지에 대해 더 많이 생각할 것입니다. 그러나 휴대용 에너지 저장 산업에서는 중국 브랜드의 역할이 바뀌었습니다. Frost & Sullivan 데이터에 따르면 2025년 전 세계 휴대용 에너지 저장 시장의 상위 5개 기업 중 4개가 중국 기업이 될 것이며 전체 시장 점유율은 60.5%가 될 것입니다. [1] 많은 중국 브랜드가 글로벌 시장에서 선도적인 위치를 차지하고 성숙한 제품 시스템과 브랜드 인지도를 확립했습니다. 글로벌 휴대용 에너지 저장 시장의 선두주자로서 중국 브랜드는 해당 카테고리의 글로벌 시장을 확장하는 임무를 짊어질 뿐만 아니라 변화하는 소비자 수요에 맞춰 자신만의 성장 공간을 찾고 차별화된 브랜드 우위를 구축해야 합니다."},{"s":"전고체 배터리는 언제 사용할 수 있나요? 한 번 설명을 해보자.","so":"Jiemian.com","tm":"11/24 17:06","c":1,"r":"cn","u":"https://m.jiemian.com/video/AGUCMghmB2YBPlVl.html","p":1795507614,"a":1795530518,"t":"固态电池，到底啥时候能用上？一次给你说明白","su":"CATL, EVE에너지, 선그로우 등 전고체 배터리(액체 대신 고체를 넣은 안전한 배터리) 함유량 82% 이상, 동일 지수 1위, 20cm 전고체 배터리 투자 도구, 유연하고 \"완전한\" # 보석 배터리 ETF(여러 주식을 묶어 파는 상품) 화안 158079 #배터리 #고체 배터리 # 신에너지 # 투자 #ETF #华安ETF"},{"s":"화웨이 스마트 스트링 그리드 포밍 ESS 플랫폼, TÜV SÜD로부터 업계 최초로 최고 수준(L4) 그리드 포밍 기능 인증 령관을 제외한 우주비행사 장즈위안과 홍콩 최초의 우주비행사 라이자잉이 다음주 지구로 귀환할 예정이다. 중국 유인 우주 공학 사무국 대변인은 화요일 Shen-23의 우주 비행사 3명이 궤도에 반년 동안 머물렀다고 말했습니다. 지상팀의 지원을 받아 일련의 우주과학 실험과 기술 테스트를 진행해 우주생명과학, 우주재료과학, 항공우주의학, 항공우주 신기술 분야에서 단계별 성과를 달성했다."},{"s":"나가노현에서 잇따르는 축전지나 태양광 발전 시설 계획 현이 신고 기준을 강화로","so":"信濃毎日新聞デジタル","tm":"11/24 06:03","c":1,"r":"jp","u":"https://www.shinmai.co.jp/news/article/gf01dc21008vbt4um9igs1eg","p":1795467780,"a":1795474296,"t":"長野県で相次ぐ蓄電池や太陽光発電施設計画 県が届け出基準を厳格化へ","su":"현의 새로운 경관 계획에서는, 사업자가 전기 공급 시설이나 태양광 발전 시설을 설치할 때, 사전의 신고를 의무화하는 대상을 확대했다=그림. 현내를 포함한 각지에서 전기 공급 시설의 설치 계획이 잇따르는 등, 최근의 시설 정비의 동향을 근거로 엄격화한다. 2027년 4월 1일에 운용을 시작해 5월 2일 이후에 착수하는 공사로부터 적용한다. 축전지 시"},{"s":"해외조사 및 선정 | 골드만삭스: 글로벌 배터리 수급 비율은 2029년 바닥을 칠 수 있고, 에너지 저장 성장은 초과분을 상쇄하기 어려울 것","so":"财联社","tm":"11/24 05:26","c":1,"r":"cn","u":"https://www.cls.cn/detail/2506034","p":1795465591,"a":1795503278,"t":"海外研选 | 高盛：全球电池供需比或2029年触底 储能增长难抵过剩","su":"① 미국은 전기차 배터리(전기차를 움직이는 큰 충전 배터리) 과잉을 지속하고 있으나, 에너지 저장 배터리의 현지 생산 능력이 부족하다. ② 한국 배터리 업체들의 유럽 시장 점유율은 부분적으로 안정됐지만, 중국의 수입 경쟁은 여전히 치열하다. ③ 국내 배터리셀 제조사들은 2027년과 2028년 이익 전망치를 평균 10% 낮췄는데, CATL의 에너지 저장장치 전환이 유망하다. 차이롄서, 10월 15일(편집자 Xia Junxiong) 골드만삭스는 10월 14일 글로벌 배터리 산업 조사 보고서를 발표했습니다. 이는 에너지 저장 시장의 급속한 확장으로 배터리 수요 전망이 개선되고 있지만, 글로벌 배터리 산업은 여전히 과잉 생산 능력, 지역 시장 수급 불균형 및 치열한 시장 경쟁에 직면해 있으며, 이는 업계가 사이클이 바닥을 쳤다는 것을 확인하기에 충분한 신호를 아직 보지 못했다는 것을 의미합니다. 은행은 중국 외 배터리 시장의 수급 공급률은 2027년을 바닥으로, 글로벌 시장은 2029년까지 수급 전환점이 이뤄지지 않을 것으로 내다봤다."},{"s":"에너지 인허가 개편안 美상원 통과에 태양광·ESS 수혜 가속화 - 머니투데이","so":"머니투데이","tm":"11/24 05:20","c":1,"r":"kr","u":"https://www.mt.co.kr/amp/industry/2026/11/24/2026112314435883552","p":1795465200,"a":1795490316,"su":"미국 상원의 에너지 인허가 개편안 통과로 국내 태양광·배터리 업계의 수혜 기대감이 커지고 있다. 데이터센터(컴퓨터 수만 대를 모아 둔 건물) 전력 공급과 전력망 확충 비용 부담을 사업자에게 부과하고 신재생에너지 발전사업의 인허가 절차를 간소화하는 내용이 담기면서 미국 내 발전·ESS(에너지저장장치(전기를 저장해 두는 큰 배터리)) 프로젝트 확대와 기자재 수요 증가로 이어질 수 있다는 분석이다."},{"s":"지역 경제의 지금 (34) 도쿠시마 배터리 밸리 구상 축전지 산업, 성장의 기둥에","so":"日刊工業新聞","tm":"11/24 05:00","c":1,"r":"jp","u":"https://www.nikkan.co.jp/articles/view/797784","p":1795464000,"a":1795474297,"t":"地域経済の今（34）徳島バッテリーバレイ構想 蓄電池産業、成長の柱に"},{"s":"인도 올라 전기(올라 일렉트릭)는 중장기적으로 배터리 셀 용량을 6GWh에서 20GWh로 확장하는 것을 목표로 하고 있다.","so":"AutoTechInsight","tm":"11/23 23:51","c":1,"r":"world","u":"https://autotechinsight.spglobal.com/news/5291559/indias-ola-electric-aims-to-scale-battery-cell-capacity-from-6-gwh-to-20-gwh-in-mid-to-long-term","p":1795445496,"a":1795478670,"t":"India’s Ola Electric aims to scale battery-cell capacity from 6 GWh to 20 GWh in mid- to long-term","su":"이번 확장은 인도의 첨단 화학 셀 생산 연계 인센티브 프로그램에 따라 Ola가 최대 20GWh를 할당한 것과 일치합니다."},{"s":"Ges 수소-망간 배터리: 이탈리아에 첫 설치","so":"Il Sole 24 ORE","tm":"11/23 21:40","c":1,"r":"world","u":"https://en.ilsole24ore.com/art/ges-branded-hydrogen-manganese-batteries-first-installation-in-italia-AJq2n0PC","p":1795437651,"a":1795504275,"t":"Ges hydrogen-manganese batteries: first installation in Italia","su":"Intesa는 Trentino 기반 스타트업의 확장을 돕기 위해 천만 달러를 제공하고 있습니다. 계획에는 이탈리아와 스페인에 두 번째 데모 공장도 포함됩니다."},{"s":"[Q&A룸] 당성기술(Dangsheng Technology): 다양한 고체전해질이 주요 고객들로부터 검증을 거쳐 소량으로 구현되었습니다.","so":"中证网","tm":"11/23 21:07","c":1,"r":"cn","u":"https://jnzstatic.cs.com.cn/zzb/htmlInfo/138993.html","p":1795435620,"a":1795440102,"t":"【答疑室】当升科技： 多款固态电解质已通过头部客户验证并实现小批量应用","su":"[Q&A룸] 당성기술(Dangsheng Technology): 다수의 고체 전해질(배터리 안에서 전기 알갱이가 지나다니는 길)이 주요 고객들로부터 검증을 거쳐 소량으로 구현되었습니다. 최근 한 투자자가 대화형 플랫폼에서 Dangsheng Technology에 질문했습니다. 회사의 전고체 양극재(배터리에서 전기를 내보내는 쪽의 핵심 재료) 연구 개발 및 마케팅에 새로운 진전이 있습니까? 에너지 저장을 위한 15차 5개년 계획은 회사에 어떤 개발 기회를 제공합니까?"},{"s":"Tonghe Technology: 10억 3천만 위안을 투자하여 컴퓨팅 전력 및 에너지 저장 통합 전력 장비 프로젝트 구축 계획","so":"第一财经","tm":"11/23 20:12","c":1,"r":"cn","u":"https://www.yicai.com/brief/103450754.html","p":1795432320,"a":1795435007,"t":"通合科技：拟投资10.03亿元建设算力储能一体化电源装备项目","su":"Tonghe Technology는 회사가 스자좡시 하이테크 구역 과학 기술 기업 단지 관리 사무실과 구역 진입 계약을 체결하고 총 투자액 10.0의 통합 컴퓨팅 성능 및 에너지 저장 지능형 완전 전원 공급 장치 산업화 프로젝트 건설에 투자할 계획이라고 발표했습니다."},{"s":"포스코 AI데이터센터·ESS용 새 철강재 개발 박차, '지속가능소재 포럼'서 협약 26건 체결","so":"비즈니스포스트","tm":"11/23 16:44","c":1,"r":"kr","u":"https://www.businesspost.co.kr/BP?command=article_view&num=452684","p":1795419882,"a":1795424019,"su":"포럼에는 포스코의 국내외 고객사 450여 곳의 관계자 1000여 명이 참석했다. 포럼에서는 AI 데이터센터(컴퓨터 수만 대를 모아 둔 건물), 전력 인프라, 에너지저장장치(전기를 저장해 두는 큰 배터리) 등에 요구되는 고내식성, 전자파 차폐, 고효율, 저탄소 배출 등의 요건을 충족하는 철강재 사업과 관련한 현황과 전략이 제시됐다. 조너선 브릴 스페셜프로젝트에이전시 대표이사의 기조강연을 시작으로 구글 클라우드, 유비테크 로보틱스 등의 기업 관계자들까지 총 31건의 강연이 진행됐다."},{"s":"오늘 1차 액티브 ETF가 상장됐고, 배터리 리더는 12개 ETF로 공동배분됐다 - 배터리 ETF에 주목하고 영원히 승리하라(158019)","so":"21财经","tm":"11/23 16:40","c":1,"r":"cn","u":"https://www.21jingji.com/article/20261123/herald/c93a35e27a33056579250b5814ea5f3c.html","p":1795419600,"a":1795447031,"t":"首批主动ETF今日挂牌、电池龙头获12家ETF共同配置——关注电池ETF永赢（158019）","su":"11월 23일, 첫 번째 18개 활성 ETF(여러 주식을 묶어 파는 상품)가 상하이 및 선전 증권거래소에 공식 상장되어 총 360억 위안을 모금했습니다. 신청 및 환매 목록에 따르면 목록의 예상 포지션 규모를 기준으로 구이저우 마오타이, 메이디그룹 및 CATL이 상위 3대 비중 주식에 속합니다. ETF 배정수량은 CATL이 12개 ETF로 배정돼 전체 종목 중 1위를 기록했다(자료출처: Wind, 2026/11/20 기준). 지수 가중치에 따라 기계적으로 구매되는 패시브 상품과 달리 액티브 ETF 포지션은 펀드매니저가 독립적으로 선택합니다. 배터리 리더는 서로 다른 전략을 가진 12개의 액티브 ETF로 공동 할당되었습니다. 이는 가치, 배당(회사가 주주에게 나눠주는 돈), 균형 및 성장과 같은 다양한 스타일을 가진 액티브 운용 펀드가 배터리 산업 체인의 핵심 리더에 대해 공동으로 낙관적이라는 것을 의미합니다."},{"s":"전고체전지 안전표준사업이 정식 제정되어 서던펀드의 저가제품배터리 ETF 서던(159147)이 시장에서 활발히 활동하고 있습니다.","so":"Jiemian.com","tm":"11/23 16:30","c":1,"r":"cn","u":"https://www.jiemian.com/article/15362130.html","p":1795419035,"a":1795424020,"t":"固态电池安全标准正式立项，南方基金旗下低费率产品电池ETF南方(159147)盘中活跃","su":"14시 45분 현재 배터리 ETF(여러 주식을 묶어 파는 상품) Southern(159147)은 장중 거래량이 3705.69만위안으로 2.83% 변동되었습니다. 추적지수 CSI 배터리테마지수(931719)는 한때 3.13% 이상 상승했다가 현재 2.12% 상승 중이다."},{"s":"[기고] 1조달러 수출 강국 도약, 다음 10년 주역은 K배터리다","so":"전자신문","tm":"11/23 16:00","c":1,"r":"kr","u":"https://www.etnews.com/20261123000183","p":1795417200,"a":1795417560,"su":"대한민국 경제가 마침내 세계 네 번째로 '수출 1조달러'라는 금자탑을 쌓아 올렸다. 1964년 수출 1억달러를 달성한 지 62년 만에 이뤄낸 1만 배의 성장이자, 세계 4대 수출 강국으로 우뚝 선 역사적 쾌거다. 이번 성과는 일제 강점기의 아픔을 딛고 한국전쟁의 잿더미 속에서 맨손으로 일어나 '한강의 기적'을 일궈낸 대한민국이기에 더욱 벅찬 감동으로 다가온다. 1조달러 고지를 밟은 국가 중 식민 지배와 전쟁의 폐허를 모두 경험하고 이처럼 눈부신 성장을 이룬 나라는 대한민국이 유일하다."},{"s":"Puyuan Energy x QPO Energy, 글로벌 레이아웃을 위해 에너지 저장 소프트웨어와 하드웨어 통합 | 녹색산업 | 사업정보","so":"經濟日報","tm":"11/23 11:00","c":1,"r":"tw","u":"https://money.udn.com/money/story/5722/9891959","p":1795399233,"a":1795403805,"t":"普元能源x QPO Energy 整合儲能軟硬體 布局全球 | 綠色產業 | 商情","su":"이 글은 총 1,383개의 단어로 구성되어 있습니다. 전 세계적으로 에너지 전환이 가속화되고 있으며, 에너지 저장 산업은 전력 시스템에서 없어서는 안 될 부분이 되었습니다. Puyuan Energy Technology와 미국 회사인 QPO Energy는 소프트웨어 및 하드웨어 분야에서 각각의 기술적 이점을 결합하여 전략적 파트너가 되었습니다. 에너지 저장 시스템 통합, 에너지 관리 기술 및 국제 시장 자원을 통해 대만 및 해외 시장을 적극적으로 확장하고 경쟁이 치열한 에너지 저장 시장에서 시장 입지를 확립할 것입니다. QPO Energy 창립자 Joseph Lu는 그리드 에너지 저장 분야의 거인입니다. 그는 세계적으로 유명한 에너지 저장 시스템 통합업체인 포윈(Powin)을 설립하고 회장을 맡고 있다. 7년 연속 성공적인 창업 경험을 쌓은 그는 4년 전 QPO에너지를 창업해 에너지 저장 사업의 새 장을 열었다."},{"s":"ASX 배터리 주식, 전력망 저장장치(ESS) 지출 변화에 따라 자세히 살펴보기","so":"Yahoo Finance","tm":"11/23 10:07","c":1,"r":"us","u":"https://finance.yahoo.com/energy/articles/asx-battery-stocks-getting-closer-010751113.html","p":1795396020,"a":1795478669,"t":"ASX Battery Stocks Getting A Closer Look As Grid Storage Spending Shifts","su":"Snowy 2.0의 예산은 약 A$20억에서 A$250억에 달하며 대규모 전력 저장장치(ESS(전기를 저장해 두는 큰 배터리))를 호주의 첫 페이지 뉴스로 바꾸었고 프로젝트가 크고 복잡해지면 무엇이 잘못될 수 있는지에 대해 가혹한 조명을 보냈습니다. 이제 투자자들은 자본과 정책의 관심이 대안적인 저장 경로를 더 면밀히 살펴보면서 위험과 잠재적인 상승 여력을 모두 보고 있습니다. 이 기사에서는 이에 노출된 세 가지 주식을 살펴봅니다."},{"s":"유진證 “AI가 바꾸는 ESS 시장⋯LG엔솔·삼성SDI, 전력망 제어로 사업 확대”","so":"이투데이","tm":"11/23 08:04","c":1,"r":"kr","u":"https://www.etoday.co.kr/news/view/2651421","p":1795388640,"a":1795389922,"su":"▲월간 EV 판매량 추이. (출처=유진투자증권)인공지능(AI) 데이터센터(컴퓨터 수만 대를 모아 둔 건물) 확산으로 에너지저장장치(ESS(전기를 저장해 두는 큰 배터리)) 산업의 경쟁 기준이 배터리 저장용량에서 전력망"},{"s":"AI 데이터 센터 전력 공급, 에너지 저장 및 마이크로그리드 사업 기회로 대만의 중전력 산업 플레이어 유치","so":"DIGITIMES","tm":"11/23 01:51","c":1,"r":"tw","u":"https://www.digitimes.com.tw/tech/dt/n/shwnws.asp?id=775552","p":1795366282,"a":1795389924,"t":"AI資料中心搶通電 儲能、微電網商機引台重電業者卡位","su":"AI 데이터센터(컴퓨터 수만 대를 모아 둔 건물) 구축에 대한 열정은 식지 않고 있다. 미국의 승인 절차가 까다로워지고 일부 프로젝트가 지연됐지만 장기적인 so":"自由時報","tm":"11/24 15:53","c":2,"r":"tw","u":"https://stock.ltn.com.tw/article/cwjbdsqjdsut","p":1795503232,"a":1795504104,"t":"野村投信看好2027美國資料中心商機 台廠供應鏈受惠","su":"노무라투자신탁은 오늘(24일) 대만 주식 투자 전망 기자간담회를 열었습니다. 국내 주식 투자 부서 Yao Yuru 부사장은 내년에도 세계 경제가 계속 성장할 것으로 예상되며, 제조업 붐의 개선과 함께 대만의 수출은 여전히 전자 제품에 의해 뒷받침될 것이며 기업 흑자(번 돈이 쓴 돈보다 많은 것)는 계속 증가할 것으로 예상된다고 지적했습니다. 단기적으로는 정책 불확실성과 자본 비용, AI 투자 회복 우려 등이 있지만 AI 애플리케이션 확대와 하드웨어 사양 업그레이드 추세에는 변함이 없다. 2027년 미국 데이터센터(컴퓨터 수만 대를 모아 둔 건물) 전원공급장치"},{"s":"케이티이, 해군과 이지스함 전력기기 기술 교류회 개최","so":"아시아경제","tm":"11/24 08:13","c":2,"r":"kr","u":"https://www.asiae.co.kr/article/2026112408131163432","p":1795475592,"a":1795478679,"su":"케이티이가 해군과 기술 교류회를 열었다. 24일 케이티이에 따르면 이번 행사는 올해 초 HD현대중공업에 공급한 '이지스함 주파수변환기'의 후속 협력 차원에서 마련됐으며 장비의 기술적 특성을 공유하고 운용∙유지보수에 필요한 지원 방안을 논의하기 위해 진행됐다. 방문단은 주파수변환기 생산∙시험 설비를 둘러보고 국산화 장비의 주요 기술 사양과 함정 전력 시스템 운용에 관한 의견을 교환했다. 특히 해상 운용 환경에서의 요구 사항과 향후 유지보수(MRO) 효율화 방안 등 실무 협력 과제를 논의했다."},{"s":"LS일렉트릭 송·배전 수주잔고 7조 육박…AI 투자 둔화는 '변수' - 머니투데이","so":"머니투데이","tm":"11/23 16:20","c":2,"r":"kr","u":"https://www.mt.co.kr/amp/industry/2026/11/23/2026112313483428648","p":1795418400,"a":1795474306,"su":"LS일렉트릭(LS ELECTRIC)이 북미 AI(인공지능) 데이터센터(컴퓨터 수만 대를 모아 둔 건물) 전력기기 수요 확대에 힘입어 송·배전 사업 수주잔고(받아 놓고 아직 못 끝낸 일감의 양)를 1년새 76% 넘게 늘렸다. 납품 규모 확대에도 신규 수주가 더 빠르게 증가한 결과다."},{"s":"AI 반도체가 전력 인재 전쟁을 시작했다. 전력공학회 엘리트 표창, 학생 53명 수상 | 업계 뉴스 | 사업정보","so":"經濟日報","tm":"11/23 11:01","c":2,"r":"tw","u":"https://money.udn.com/money/story/11799/9892202","p":1795399308,"a":1795403819,"t":"AI半導體掀電力人才爭奪戰 電力工程協會表揚菁英、53人次學生獲獎 | 產業動態 | 商情","su":"인공지능(AI)과 반도체(전자기기 속에서 계산하고 기억하는 작은 부품) 산업의 급속한 발전으로 대만의 전력 수요는 지속적으로 증가하고 있으며, 전력 산업 역시 인재 확보를 위한 산업 간 경쟁의 도전에 직면해 있습니다. 대만 전력 에너지 공학 협회는 전력 공학 분야의 뛰어난 인재를 표창하는 주요 축으로 \"권력 상속, 인재 육성 및 유지\"를 주제로 11월 20일 제8회 \"전력망 인재 개발 연합 장학금\"과 제7회 \"류수성 기념상\" 시상식을 개최했습니다. 그 중 39개 그룹과 53명의 학생이 전력망 인재 장학금을 수여받아 대만의 전력 인재 양성 성과를 입증했습니다. 총통부 참사관 심롱진(Shen Rongjin)은 전기는 국력이라고 말했다. AI 시대에는 컴퓨팅 파워의 발전을 위해서는 안정적인 전력 지원이 필요하다. AI 데이터센터(컴퓨터 수만 대를 모아 둔 건물)와 반도체 산업이 성장하는 가운데 정부는 전력 개발, 저탄소 에너지, 그리드 탄력성 구축을 지속적으로 추진하고 있다. 그러나 건전한 에너지 정책은 여전히 전문 인재에 의해 구현되어야 합니다. 기업과 산학계가 함께 인재양성에 투자해 주기를 바랍니다. 대만전력공사의 Kuo Tianhe 총책임자는 AI와 반도체 산업이 전력 소비의 수요와 패턴을 변화시키고 있다고 지적했습니다. 대만전력공사는 전력망의 탄력성을 강화하고 장비를 업그레이드하며 재생 가능 에너지를 통합하는 것 외에도 시스템의 디지털화를 적극적으로 추진하고 있습니다. 산업 간 인재 경쟁이 심화되는 가운데, 앞으로도 전문전수와 산학협력을 심화해 청년들이 전력분야에 투자할 수 있도록 유치해 나가겠습니다. 협회 명예회장 Liu Wenxiong은 전기가 지원뿐만 아니라"},{"s":"AI 데이터센터부터 노후 전력망까지, 전력기기 3사 설비투자 급증","so":"아시아경제","tm":"11/25 11:23","c":1,"r":"kr","u":"https://www.asiae.co.kr/article/2026112415292557621","p":1795573380,"a":1795574656,"su":"AI 데이터센터(컴퓨터 수만 대를 모아 둔 건물) 확산과 노후 전력망(발전소 전기를 집·공장까지 보내는 전깃줄 그물) 교체 수요가 맞물리면서 국내 전력기기 업종에 대한 투자자들의 관심이 높아지."},{"s":"중원대학교 홍잉이(Hong Yingyi) 학생은 전력 에너지 연구 및 산학 혁신에 깊이 참여하여 \"학술 우수 공헌상\" 수상 | 산학연 연구 및 교육 | 사업정보","so":"經濟日報","tm":"11/25 11:04","c":1,"r":"tw","u":"https://money.udn.com/money/story/5723/9899418?from=edn_subcatelist_cate","p":1795572251,"a":1795574659,"t":"中原大學洪穎怡深耕電力能源研究與產學創新 獲「學界傑出貢獻獎」 | 產學研訓 | 商情","su":"지능형 알고리즘부터 양자 인공지능까지, 중원대학교 전기공학과 홍잉이 석좌교수는 42년 넘게 전기에너지 연구에 깊이 관여해 왔다. 그녀는 국제학술연구에서 많은 성과를 거두었을 뿐만 아니라, 산학협력을 적극적으로 추진하고 국가 전력정책에 참여하며 전문인재를 양성해 왔다. 그는 장기간 축적된 학문적 성과와 실질적인 기여로 전력 시스템 및 에너지 기술 분야에서 뛰어난 공헌을 인정받아 대만전력에너지공학협회로부터 2026년 '학술 우수 공헌상'을 수상했습니다. 대만 전력 및 에너지 공학 협회는 전력 및 에너지 분야에서 뛰어난 연구 결과와 산업적 공헌을 한 전문가를 표창하기 위해 \"산업 및 학계에 대한 뛰어난 공헌상\"을 제정했습니다. 올해 '뛰어난 학계공헌상' 수상자는 중원대학교와 국립중앙대학교 두 명입니다. 중원대학교 에너지기술센터장 홍잉이 석좌교수는 오랫동안 스마트그리드, 딥러닝, 양자인공지능 등 미래지향적 기술을 다루며 전력 및 에너지 분야에서 인공지능 연구와 응용에 전념해 왔다. 지금까지 그는 165편의 SCI 저널 논문을 발표했으며 구글 Scholar에서 8,700회 이상 인용되었습니다. 그는 2020년부터 2026년까지 세계 최고 과학자 중 상위 2%에 지속적으로 선정되었으며, ScholarGPS 전력 시스템 전문 순위에서 상위 2%에 속합니다."},{"s":"성스러운 능선을 밝혀라! Mooshan Mountain House는 마이크로그리드 업그레이드를 완료하고 침대에는 전용 충전소를 갖추고 있습니다.","so":"自由時報","tm":"11/25 10:37","c":1,"r":"tw","u":"https://news.ltn.com.tw/news/life/breakingnews/5652430","p":1795570672,"a":1795574661,"t":"點亮聖稜線！桃山山屋完成微電網升級 床位設專屬充電座","su":"산장 전원 공급 안정성을 개선하고 순 제로 배출을 구현하기 위해 셰이파 국립공원 관리사무소는 민간 업계와 협력하여 \"세이파 보호, 산 여행을 밝게 하세요\" 프로젝트를 추진하고 첫 번째 시범 현장인 \"타오산 마운틴 하우스\"의 마이크로그리드 시스템 교체 및 업데이트를 완료하여 20년 이상 사용된 장비의 노후화 문제를 해결했습니다. 또한 생태 보전과 산악 이용자의 편의성을 고려하여 각 침대에 개인 휴대폰 전용 충전 소켓을 추가했습니다. 눈관리국은 공원 내 고산 가옥에 설치된 태양광 발전 공급 장비 대부분이 20년 이상 사용됐다고 밝혔다. 낮은 산기온, 강풍, 낮과 밤의 기온차 등의 장기적인 영향으로 인해 점차 노후화되어 불안정한 전력 공급, 유지 관리의 어려움 등의 과제에 직면해 있습니다. 이번에 업계에서는 태양광 패널과 에너지 저장장치를 기증하고, 산악헬기 자재 걸이 지원을 위한 기술인력도 지원했다. 교통부 민간항공청의 지도 아래 해발 3,000m 이상의 저온 및 운송 문제를 극복하고 100kg이 넘는 장비의 매달기와 업데이트를 성공적으로 완료했다."},{"s":"다우의 Xe-100 HTGR 원자력 프로젝트의 다음 단계를 안내하는 랜드마크 NRC 건설 허가","so":"POWER Magazine","tm":"11/25 06:59","c":1,"r":"us","u":"https://www.powermag.com/landmark-nrc-construction-permit-ushers-in-next-phase-for-dows-xe-100-htgr-nuclear-project/","p":1795557570,"a":1795565223,"t":"Landmark NRC Construction Permit Ushers in Next Phase for Dow’s Xe-100 HTGR Nuclear Project","su":"11월 9일 원자력규제위원회(NRC)는 거의 6년 만에 처음으로 고온가스냉각로(HTGR) 건설 허가를 발표했습니다."},{"s":"\"데이터 센터는 쓰레기 버리는 곳\"","so":"日本経済新聞","tm":"11/25 01:50","c":1,"r":"jp","u":"https://www.nikkei.com/article/DGXZQOGN150OK0V11C26A1000000/","p":1795539010,"a":1795565225,"t":"「データセンターはゴミ捨て場」 テック嫌悪渦巻く米ラストベルト","su":"미 중간선거에서 공화당의 아성이었던 미 중서부 오하이오주에서 민주당이 대승했다. 농지에는 거대한 데이터센터(컴퓨터 수만 대를 모아 둔 건물)가 세워져 반발은 당파를 넘어 퍼진다. 과거도 정책에 휘두르며 산업의 공동화가 진행된 '라스트벨트(녹슨 공업지대)'는 다시 흔들리고 있다. 11월 3일 지사선에서 민주당인 에이미 액턴씨가 52%의 표를 얻어 공화당 비벡 라마스와미씨(44%)를 꺾었다. 상원선도 민주당 셰로드 브라운 씨가 부활. 과거의 큰"},{"s":"상업 수요가 주도하는 경우: 새로운 부하 시대를 위한 전력망 계획 재고","so":"POWER Magazine","tm":"11/25 00:53","c":1,"r":"us","u":"https://www.powermag.com/when-commercial-demand-takes-the-lead-rethinking-grid-planning-for-a-new-load-era-2/","p":1795535634,"a":1795565225,"t":"When Commercial Demand Takes the Lead: Rethinking Grid Planning for a New Load Era","su":"수십 년 동안 전력회사는 인구 증가, 경제 활동, 날씨 및 환경 간의 상대적으로 예측 가능한 관계를 계획해 왔습니다."},{"s":"대만 해협 양측의 인기 인물/AI 삽 상인 Hu Haiyang, 컴퓨팅 파워 사업 기회를 포착하고 하드 기술 기업가 정신의 신화를 쓰다","so":"UDN","tm":"11/25 00:49","c":1,"r":"tw","u":"https://udn.com/news/story/7241/9899841","p":1795535380,"a":1795574663," 反弹 数据中心相关业务增长亮眼","su":"경제관측망 이튼(ETN) 주가는 최근 AI 분야 전반의 반등으로 상승세(오르는 흐름)를 보이고 있다. 데이터센터(컴퓨터 수만 대를 모아 둔 건물) 사업이 급속히 성장했지만, 기관들은 여전히 업계의 장기적인 수요와 회사의 부채에 대해 우려하고 있다. 부문 변경 11월 23일, 엔비디아 이사회는 만장일치로 젠슨 황을 사장, CEO 및 이사로 복귀시키기로 결정했습니다."},{"s":"대만전력공사의 강력한 전력망 사업 기회를 활용하여 Spectrum Electrician의 주문 가시성은 2027년 하반기에 도달합니다.","so":"DIGITIMES","tm":"11/24 01:24","c":1,"r":"tw","u":"https://www.digitimes.com.tw/tech/dt/n/shwnws.asp?id=775768","p":1795451069,"a":1795474309,"t":"搭上台電強韌電網商機 光譜電工訂單能見度達2H27","su":"옵토일렉트로닉스(Optoelectronics) 자회사 스펙트럼 일렉트리컬(Spectrum Electrical)은 지난 23일 기자간담회를 열고 대형 변압기(전기의 세기(전압)를 바꿔 주는 기계)를 중심으로 PCB 소모품을 보완하는 듀얼 엔진 운영 구조를 형성했다고 밝혔다. 매출 비중은 변압기 사업이 75%, PCB 소모품이 25%를 차지한다. 연초에도 여전히 존재하던 뷰티 제품 매출이 '0'으로 돌아왔다. 2026년 첫 3분기에는 매출총이익률이 30%로 증가하고, 주당순이익(주식 한 주가 번 돈)은 0.86위안으로 2위안을 넘어설 예정이다."},{"s":"COP31 반대 의견…펑치밍: 원자력을 재가동하면 전력 탄소 배출을 줄일 수 있다","so":"UDN","tm":"11/24 01:02","c":1,"r":"tw","u":"https://udn.com/news/story/7314/9897383","p":1795449769,"a":1795474310,"t":"COP31分歧…彭啓明：重啟核電 可降電力排碳","su":"제31차 유엔기후변화협약 당사국총회(COP31)가 어제 끝났습니다. 다만 화석연료라는 단어는 삭제됐고, 구체적인 조정자금 규모도 명시되지 않았다. 협상이 결렬되었습니다. 초안에서는 \"35×35\" 전기화 목표를 유지했습니다. Peng Qiming 환경부 장관은 어제 국제 사회가 화석 연료로의 전환을 둘러싸고 분열되어 있으며 대만은 기다리지 않을 것이라고 말했습니다. 화석연료로부터의 전환은 변하지 않는 방향이다."},{"s":"AI 전력 수요 급증: API CEO, 에너지 수요 증가 경고","so":"Fox Business","tm":"11/24 00:16","c":1,"r":"us","u":"https://www.foxbusiness.com/video/6408768385112","p":1795447007,"a":1795474307,"t":"AI power demand is surging: API CEO warns of growing energy needs","su":"American Petroleum Institute의 회장 겸 CEO(회사의 가장 높은 책임자)인 Mike Sommers는 UN 기후 회담의 결렬, 화석 연료 분쟁 및 미국 에너지 정책의 미래에 대해 논의합니다."},{"s":"친환경 전력에서 친환경 전력망까지: Bauma Shanghai 첫날 SANY Group은 신에너지와 건설 기계 간의 긴밀한 협력을 위한 친환경 답안지를 제공했습니다.","so":"經濟日報","tm":"11/23 23:00","c":1,"r":"tw","u":"https://money.udn.com/money/story/123828/9897249","p":1795442444,"a":1795447040,"t":"從一度綠電到一張綠色電網：上海寶馬展開展首日，三一集團交出新能源與工程機械深度協同的綠色答卷","su":"상하이, 2026년 11월 23일 /PRNewswire/ -- 11월 23일부터 27일까지 bauma CHINA 2026이 상하이의 이중 전시관에서 공동으로 개최됩니다. Sany Group은 \"길을 선도하고 함께 미래를 건설하는 스마트 전기\"라는 주제로 데뷔했습니다. 세계 엑스포 전시 컨벤션 센터의 마이크로그리드 전시관에 위치한 \"스마트 전기 에너지 스테이션\"은 광전지 모듈, 풍력 터빈 모델, 수소 전해조, 대형 트럭 배터리 에너지 저장 장치 및 디젤 발전기 세트로 구성된 완전한 하드웨어 매트릭스를 선보입니다. 일회성 녹색 전기 생산부터 완전한 마이크로그리드 네트워크 세트의 구현 및 제공에 이르기까지 전체 체인 디스플레이를 실현합니다. \"마이크로그리드 + 풍력, 태양광, 수소 및 장작 저장: 하나의 네트워크에 있는 \"5가지 작업\" 전시장에서는 5가지 유형의 에너지 장치가 \"풍력, 태양광, 수소 및 장작 저장\" 다중 에너지 보완 시스템을 구성합니다. 태양광은 기본 전원으로 낮 동안 주요 부하를 지원하고, 풍력 터빈은 위치를 채우고 밤과 비오는 날에 전력 공급을 지속하는 역할을 담당하며, 수소 에너지는 잉여 전기를 전기분해하여 수소를 생산하고 저장하는 \"곡물 저장소\" 역할을 합니다. 오랫동안 새로운 에너지의 변동을 완화하는 에너지 저장 장치는 비상 백업 전력을 고려하여 피크 방전 및 밸리 충전 기능을 갖추고 있으며 극한의 작업 조건에서 \"예비 타이어\"이며 에너지 저장과 밀접한 관련이 있습니다."},{"s":"데이터 센터 전력이 그리드를 초과함에 따라 전기 유틸리티 노출에 대한 3개 자금","so":"Yahoo Finance","tm":"11/23 21:09","c":1,"r":"us","u":"https://finance.yahoo.com/energy/articles/3-funds-electric-utility-exposure-120915255.html","p":1795435755,"a":1795447039,"t":"3 Funds With Electric Utility Exposure As Data Center Power Outruns The Grid","su":"전력 사용량이 많은 세 가지 펀드는 실제로 얼마나 다를 수 있으며, 실제로 전력 스토리에서 원하는 조합은 무엇입니까? 이제 데이터 센터 전력 수요가 연간 약 19% 증가하고 그리드가 약 2% 증가하고 있기 때문에 이 질문은 더욱 중요해졌습니다. 규제 기관이 더 빠른 그리드 업그레이드를 통해 유틸리티가 수익을 얻도록 허용하고 고객이 그리드 전력을 현장 발전기로 완전히 교체하지 않는 경우"},{"s":"삼성전기: 2억 7,800만 위안 규모의 국가 전력망 입찰 및 조달 프로젝트 예비 수주","so":"第一财经","tm":"11/23 16:45","c":1,"r":"cn","u":"https://m.yicai.com/news/103450373.html","p":1795419927,"a":1795424027,"t":"三星电气：预中标2.78亿元国家电网招标采购项目","su":"삼성전기는 최근 2026년 중국 동부 지역에서 10kV 변압기(전기의 세기(전압)를 바꿔 주는 기계)와 10kV 주상 변압기 세트의 2차 공동 조달을 위한 중국 국가 전력망(발전소 전기를 집·공장까지 보내는 전깃줄 그물) 공사의 2차 공동 조달 기본 협약(계약 재고)에서 삼성전기의 100% 자회사인 닝보옥스 인텔리전트 테크놀로지(Ningbo Oaks Intelligent Technology Co., Ltd.)가 낙찰자로 추천됐다고 밝혔습니다. 총 낙찰가는 약 2억 7,800만 위안(약 2억 7,800만 위안)이 될 것으로 예상됩니다."},{"s":"전력기기 40여년 한우물…태양광· SMR도 공략","so":"매일경제","tm":"11/23 15:29","c":1,"r":"kr","u":"https://www.mk.co.kr/news/business/12216164","p":1795415377,"a":1795417568,"su":"이재광 이엔에스일렉트릭 회장 신입서 오너까지 오른 주역 수배전반 등 주요 기기 생산 공공·민간에서 경쟁력 확보 전력 저장~송전 통합 솔루션 태양광·SMR(작게 만든 원자력 발전소) 시대 대 /www.hansbiz.co.kr/news/articleView.html?idxno=885984","p":1795392159,"a":1795403812,"su":"| 서울=한스경제 김혜지 기자 | 한국수력원자력(한수원)이 대우건설·두산에너빌리티 컨소시엄과 체결한 체코 두코바니 원전사업 시공분야 공동협력 협약을 종료했다.한수원은 지난 20일 대우건설·두산에너빌리티 컨소시엄과의 시공분야 공동협력 협약을 종료했다고 밝혔다.한수원과 컨소시엄은 지난해 6월 체코 발주사와 본계약을 체결한 이후 원전 주설비공사 시공계약 체결을 위한 협상을 진행해 왔다.그러나 계약 조건에 대한 최종 합의에 이르지 못하면서 지난 10월 말 협상을 마무리했다. 이번 공동협력 협약 종료는 협상 중단에 따른 후속 조치다.한수원은"},{"s":"트럼프, 또 관세 부과…해외 데이터센터 짓는 미국 기업에 과중한 세금 부과 - 국제투데이","so":"工商時報","tm":"11/23 08:53","c":1,"r":"tw","u":"https://www.ctee.com.tw/news/20261123700557-430702","p":1795391580,"a":1795403821,"t":"川普又揮關稅大刀美企海外蓋資料中心恐挨重稅- 國際","su":"트럼프 미국 대통령은 20일 인공지능(AI) 분야 미국의 경쟁력 강화를 위해 미국 기업의 해외 데이터센터(컴퓨터 수만 대를 모아 둔 건물) 구축을 제한할 계획이라고 밝혔다. 기업이 해외 진출을 고집할 경우 높은 세금 부담을 안게 될 수 있어 시장의 주목을 받고 있다. 로이터 등 외신들은 트럼프 대통령이 지난 20일 백악관 기자회견에서 미국은 데이터센터 투자에 힘써야 하며 기업이 AI 인프라를 해외로 이전하는 것을 허용할 수 없다고 밝혔다고 보도했다. 이에 해외에 데이터센터를 짓는 미국 기업에 대한 제재를 검토하고 있다."},{"s":"[전일 주요공시] 롯데관광개발·금호건설·효성중공업·롯데케미칼 등","so":"이투데이","tm":"11/23 08:29","c":1,"r":"kr","u":"https://www.etoday.co.kr/news/view/2651440","p":1795390140,"a":1795403812,"su":"△마스턴프리미어리츠, 종속회사인 해외 투자기구 보유 투자부동산 매각(2026년 10월) 관련 예상 손실을 당기 투자부동산손상차손으로 인식△롯데관광개"},{"s":"[단독] 효성重, AI 전력난 뚫을 '게임 체인저'⋯반도체 변압기 전담팀 띄웠다 [차세대 전력망戰]","so":"이투데이","tm":"11/23 05:00","c":1,"r":"kr","u":"https://www.etoday.co.kr/news/view/2650523","p":1795377600,"a":1795389932,"su":"중공업연구소 내 SST TFT 신설, 핵심 인력 재배치22.9kV급 개발 이어 고압 대응 제품 연구개발 추진전력기기·ESS(전기를 저장해 두는 큰 배터리) 연계해 AI 데이터센터(컴퓨터 수만 대를 모아 둔 건물) 종합 솔루션"},{"s":"공장 적용부터 고객 선정까지…국내외 SST 사업화 경쟁 [차세대 전력망戰]","so":"이투데이","tm":"11/23 05:00","c":1,"r":"kr","u":"https://www.etoday.co.kr/news/view/2650526","p":1795377600,"a":1795389932,"su":"LS일렉트릭 DC팩토리 운영…HD현대일렉트릭도 개발 나서GE버노바, 옥외형 공급업체 선정…이튼·지멘스도 상용화 가세AI 데이터센터(컴퓨터 수만 대를 모아 둔 건물)용 반도체(전자기기 속에서 계산하고 기억하는 작은 부품) 변압기(SST"},{"s":"Formosa Plastics의 Four Treasures 전략은 전자 및 반도체로 확장되었으며 다양한 신에너지 및 전력망 프로젝트도 이에 따랐습니다. - Daily News","so":"工商時報","tm":"11/23 04:00","c":1,"r":"tw","u":"https://www.ctee.com.tw/news/20261123700093-439901","p":1795374000,"a":1795403823,"t":"台塑四寶大布局搶進電子、半導體不稀奇各式新能源、電網項目也跟上- 日報","su":"Formosa Plastics Group은 에너지 수요와 공급 탄력성의 비즈니스 기회를 목표로 삼고 새로운 에너지 레이아웃을 가속화하고 있습니다. Nanya 및 Formosa New Intelligence에서 태양열 및 풍력 발전 투자와 중전력, 배터리, 에너지 저장 및 기타 비즈니스 프로젝트 개시 외에도 Formosa Plastics는 13억 2,600만 위안의 투자를 예상하면서 신에너지 확대를 위한 노력을 강화했습니다. Mailiao Automobile and Electric Company와 협력하여 자본금 26억 위안의 Taihua Maidian Renewable Energy Company를 설립할 예정이며 Taihua의 지분(회사를 나눠 가진 몫)율은 51%입니다. Taihua Maidian Renewable Energy의 초기 계획 투자 프로젝트에는 다음이 포함되는 것으로 알려졌습니다."},{"s":"미국 AI 데이터센터, 전력 연결 가속화 계획, 2개 주요 전력망 개혁 검토 제출","so":"DIGITIMES","tm":"11/23 03:40","c":1,"r":"tw","u":"https://www.digitimes.com.tw/tech/dt/n/shwnws.asp?id=0000775529_PVC63JJ716H7UNLAMJUTT","p":1795372800,"a":1795389935,"t":"美AI資料中心拚加快接電 兩大電網改革送審","su":"미국에서는 인공지능(AI) 데이터센터(컴퓨터 수만 대를 모아 둔 건물) 구축에 대한 수요가 계속 늘어나고 있지만, 일부 지역에서는 전력망(발전소 전기를 집·공장까지 보내는 전깃줄 그물) 확장과 신규 전력공급 속도가 이를 따라가지 못해 산업 확장의 중요한 병목 현상이 되고 있다. 미국 지역전력망 운영업체인 PJM과 캘리포니아독립시스템배치기구(CAISO)는 최근 대규모 전력시설에 대한 전력망 연결 개혁을 제안했다. 그리드 연결 연구 기간을 단축하고 조건부 전력 연결을 사전에 개방함으로써 속도를 높일 수 있기를 희망합니다."},{"s":"'타이밍 불일치': 데이터 센터 전력 수요는 매년 19% 증가하고 있습니다. 그리드는 2% 성장하고 있다","so":"Fortune","tm":"11/23 01:34","c":1,"r":"us","u":"https://fortune.com/2026/11/22/ai-data-centers-power-grid-capacity/","p":1795365240,"a":1795389933,"t":"A ‘mismatch in timing’: Data center power demand is growing 19% a year. The grid is growing 2%","su":"보험 중개인인 Howden은 데이터 센터의 전력 수요가 2000년 이후 그리드보다 10배 빠르게 증가했다는 사실을 발견했습니다. 유권자들은 압박을 강화했고 Big Tech는 자체 가스 공장으로 눈을 돌리고 있습니다."},{"s":"AI 데이터센터 전력 증강에 편승한 3가지 주식","so":"Yahoo Finance","tm":"11/23 01:07","c":1,"r":"us","u":"https://finance.yahoo.com/markets/stocks/articles/3-stocks-riding-ai-data-160704018.html","p":1795363624,"a":1795389934,"t":"3 Stocks Riding The AI Data Center Power Buildout","su":"스페이스X는 740억 달러 이상의 AI 중심 데이터 센터 캠퍼스를 계획하면서 전력, 물, 그리드 용량을 주목받게 되었고 이는 상장(주식시장에 처음 들어오는 것) 유틸리티에 곧바로 파급됩니다. AI 컴퓨팅을 공급하기 위한 경쟁은 누가 주스를 공급하고 누가 정치적 열기를 전달하는지에 따라 승자와 후발자를 만들 수 있습니다. 이 글은 해당 스토리에 노출된 세 가지 주식을 분석하고 해당 주식의 역할이 무엇인지 설명합니다."},{"s":"전기가 곧 경쟁력이다! 대만전력공사: 타이난 시가 \"Greater Nanke\"의 전력 소비 증가를 지원하기 위해 자체 전력을 강화할 수 있기를 바랍니다 | 금융 포커스 | 산업경제학","so":"UDN","tm":"11/22 22:59","c":1,"r":"tw","u":"https://udn.com/news/story/7238/9895106","p":1795355989,"a":1795356526,"t":"電力是競爭力！台電：盼台南市增加自有電力支撐「大南科」用電成長| 財經焦點| 產經","su":"첨단 제조 공정의 도입으로 '대타이난 과학단지'의 전력 소비량은 계속해서 증가하고 있습니다. 타이파워는 “전력은 국가의 힘이자 도시의 경쟁력”이라고 주장한다. 그러나 타이난시는 현재 Nanke의 안정적인 전력 공급의 중추로서 총 110만 킬로와트에 달하는 센바 1단계와 2단계만 보유하고 있습니다. 나머지는 Xingda 발전소의 자금 지원에 의존합니다. 대만전력공사는 계획된 Senba 3단계 민간 발전소(IPP)를 포함하여 타이난 시에서 자체적으로 안정적인 전력 공급을 개발하기 위해 노력하고 있습니다."},{"s":"백악관은 '현지화'를 추진하고 싶어하지만 지방선거에서 적신호가 켜졌다. 미국의 AI 데이터센터 구축이 곧 제동을 걸 것인가?","so":"第一财经","tm":"11/22 19:02","c":1,"r":"cn","u":"https://www.yicai.com/news/103449268.html","p":1795341764,"a":1795351430,"t":"白宫欲推“本土化”，地方选举却亮红灯：美国AI数据中心建设要踩刹车了吗？","su":"시장은 미국의 인공지능(AI) 인프라 개발이 직면한 역풍을 재현하고 있습니다. 현지 시간으로 지난 11월 20일, 트럼프 미국 대통령은 APEC 정상회담을 마친 뒤 백악관 기자회견에서 미국 기업이 해외에 데이터센터(컴퓨터 수만 대를 모아 둔 건물)를 짓는 것이 허용되지 않고, 그렇지 않으면 '거대한 세금'이나 '거대한 벌금'을 물게 될 것이라고 밝혔다. 그러나 트럼프 대통령은 이 아이디어가 그의 팀과 충분히 논의되지 않았으며 현재 공식적인 행정 명령이나 구체적인 세율 세부 사항이 없다는 점도 인정했습니다. 지난 11월 초 미국 중간선거 결과가 발표된 뒤 미국 증시 AI 부문은 지역 차원의 데이터센터에 대한 거센 반발로 급격한 조정을 겪었다. 지난 한 달간 11월 22일 기준 나스닥(미국 기술 회사들이 많이 모인 주식시장) 지수는 13% 하락했고, 엔비디아 주가는 41% 가까이 하락했고, AMD 주가는 16% 이상 하락했다."},{"s":"AI 전력망 호황에 대형 변압기 수출 31% 증가…소형은 39% 급감","so":"한국경제","tm":"11/22 18:10","c":1,"r":"kr","u":"https://www.hankyung.com/article/2026112224611","p":1795338615,"a":1795351428,"su":"AI 전력망 호황에 대형 변압기(전기의 세기(전압)를 바꿔 주는 기계) 수출 31% 증가…소형은 39% 급감, 한경Aicel K변압기 수출 양극화 데이터센터(컴퓨터 수만 대를 모아 둔 건물)發 초고압 수요 폭증 북미 변전소에 2030년까지 납품 대형 수출, 이미 작년 실적 넘어서 소형 변압기 가격&middot;납기 경쟁 격화 제룡전기 상반기 美매출 41% 감소"}]},{"name":"🤖 로봇","note":"","breaking":false,"items":[{"s":"[포토] 휴머노이드 로봇과 함께 전달하는 전략보고서","so":"전자신문","tm":"11/24 17:27","c":9,"r":"kr","u":"https://www.etnews.com/20261124000481","p":1795508841,"a":1795521569,"su":"2026 민관 R&D 혁신 포럼이 24일 서울 서초구 엘타워에서 열렸다. 구 , 추진 일정을 공유하고 산학연 관계자 의견을 수렴했다."},{"s":"2-Link Changhua Group: 완전한 인간형 로봇 사업에 종사하고 있지 않으며 유성 롤러 스크류 제품은 아직 연구 개발 단계에 있습니다.","so":"Jiemian.com","tm":"11/23 21:04","c":3,"r":"cn","u":"https://www.jiemian.com/article/15363971.html","p":1795435444,"a":1795440125,"t":"2连板长华集团：不从事人形机器人整机业务，行星滚柱丝杠产品仍处于研发阶段","su":"장화그룹은 2026년 11월 20일과 11월 23일 연속 2거래일 주식의 일일 종가 상승 편차가 20%를 초과했다고 23일 발표했다. '상하이 증권거래소 거래규칙' 관련 규정에 따르면 이는 주식 거래의 비정상적인 변동을 의미합니다. 검증 결과 회사는 최근 일부 언론에서 자사를 휴머노이드 로봇(사람을 닮은 로봇) 테마주로 상장한 사실을 알아냈다. 회사는 현재 다음과 같이 명시됩니다. 회사는 상장된 자동차 부품 회사로서 주로 자동차 금속 부품의 연구 개발, 생산 및 판매에 종사합니다. 핵심 제품은 패스너, 스탬핑 및 용접 부품입니다. 휴머노이드 로봇 완성기계 사업에는 종사하지 않습니다. 고객에게 액추에이터 특수 구조 부품 및 기타 관련 부품 제품만 제공합니다. 현재까지 약 88,000위안의 영업이익(장사해서 남긴 돈)을 달성했습니다. 위 제품은 회사의 주요 비즈니스 제품의 응용 시나리오 확장을 기반으로 합니다. 이는 회사 전체 영업이익에서 아주 작은 부분을 차지하며 순이익에 큰 영향을 미치지 않습니다. 유성 롤러 스크류 제품에 관해서는 아직 연구 개발 단계에 있습니다. 아직 고객 승인을 받지 못했고, 영업이익도 달성하지 못한 상태여서 실적에 영향은 없을 것으로 보인다."},{"s":"\"레인보우로보틱스, 본격 성장궤도 진입\"...주가 '57만원' 파격 전망","so":"파이낸셜뉴스","tm":"11/23 09:02","c":3,"r":"kr","u":"https://www.fnnews.com/news/202611230856104772","p":1795392159,"a":1795392947,"su":"유진투자증권은 23일 레인보우로보틱스에 대해 삼성전자와의 협력 확대와 로봇 양산 준비를 바탕으로 본격적인 성장 궤도에 진입할 것으로 전망하며 투자의견(전문가가 사라·팔라고 내는 의견) '매수'와 목표주가(전문가가 예상한 앞날의 주가) 57만원을 제시했다."},{"s":"근육을 자랑하는 동유다 로봇","so":"UDN","tm":"11/25 03:19","c":2,"r":"tw","u":"https://udn.com/news/story/7252/9899462","p":1795544384,"a":1795560852,"t":"東佑達機器人展秀肌肉","su":"'2026 타이중 무인차량 및 로봇 응용 전시회'가 어제(24일) 타이중 국제컨벤션전시센터에서 첫 선을 보였습니다. 정밀 자동화 솔루션 제조사 동유다(7942)는 이번 전시회에 처음 참가해 6축 광커플러, 정렬 플랫폼, 산업용 로봇이 CPO 장비 제조사, 반도체(전자기기 속에서 계산하고 기억하는 작은 부품) 제조사로부터 각각 주문을 받아 내년 말까지 가시화될 예정이라고 밝혔다."},{"s":"YYForce, 엔비디아 기술을 사용하여 호텔 컨시어지 서비스용 휴머노이드 로봇 출시","so":"Yahoo Finance","tm":"11/25 00:28","c":2,"r":"us","u":"https://finance.yahoo.com/technology/ai/articles/yyforce-launches-humanoid-robot-hotel-152808508.html","p":1795534088,"a":1795560850,"t":"YYForce Launches Humanoid Robot for Hotel Concierge Services Using NVIDIA Technology","su":"YYForce Inc.(나스닥(미국 기술 회사들 노이드 로봇(사람을 닮은 로봇) 산업은 기술 혁신에서 대규모 상용화(실제로 팔고 쓰이기 시작하는 것)로의 전환기를 맞이하고 있으며, 산업 상용화 전망이 계속해서 주목받고 있습니다. 최근 여러 가지 유리한 요인이 합쳐져 업계 기대치가 높아졌습니다. 11월 23일 국가발전개혁위원회, 민정부, 국가보건위원회, 교육부는 ''노인 한 아이' 서비스 시스템 구축을 위한 구현 계획을 발표하여 노인 돌봄 및 보육 기관이 지능형 관리 서비스, 스마트 화재 보안 및 기타 시스템을 적용하여 관리 수준을 향상할 수 있도록 지원할 것을 제안했습니다. 노인 돌봄 기관에 지능형 건강 모니터링, 보조 장치 및 기타 장비를 갖추도록 장려합니다. 인공 지능 기관, 서비스 등 신제품 개발을 장려합니다. 노인 돌봄 시나리오에 적합한 로봇, 스마트 웨어러블 장치 및 외골격을 노인 돌봄 기관, 커뮤니티 및 기타 시나리오에 적용하거나 체험 영역을 설정하도록 지원합니다."},{"s":"NEXCOM AI 로봇 생태계 파트너 채용 확대 - Daily News","so":"工商時報","tm":"11/24 04:00","c":2,"r":"tw","u":"https://www.ctee.com.tw/news/20261124700343-439901","p":1795460400,"a":1795474323,"t":"新漢AI機器人生態系夥伴擴大招募- 日報","su":"\"RoboWIZ AI 로봇 생태계 파트너\" 모집 페이지에서 자세한 내용을 확인하려면 QR 코드를 스캔하세요. 넥스컴그룹 계열사 넥스코봇(NEXCOM Robotic Solutions)은 지난달 엔비디아 베를린 GTC 컨퍼런스에서 독일, 미국 로봇 생태계 파트너들과 힘을 합쳐 로보위즈(RoboWIZ) AI 로봇 오픈 플랫폼을 공동 출시해 국제 시장과 로봇 관련 분야에서 즉각 주목을 받았다."},{"s":"Kelai Electromechanical: 현재 휴머노이드 로봇 분야와 관련된 제품은 포함되어 있지 않습니다.","so":"Jiemian.com","tm":"11/23 19:27","c":2,"r":"cn","u":"https://www.jiemian.com/article/15363669.html","p":1795429627,"a":1795435025,"t":"克来机电：目前不涉及人形机器人领域相关产品","su":"클레이전기기계는 자사 주식 거래가 2026년 11월 20일과 2026년 11월 23일 연속 2거래일 동안 일일 종가 상승률을 20% 이상 벗어나 비정상적인 주식 거래 변동이 발생했다고 23일 밝혔다. 현재의 생산 및 운영 활동은 정상적이며, 시장 환경 및 업계 정책에 큰 변동은 없으며, 생산비 및 매출(물건을 판 돈 전체)에 큰 변동은 없으며, 내부 생산 및 운영 순서도 정상적인 것으로 확인되었습니다. 산업용 로봇 분야의 주요 제품은 자동화 물류 분야에서 사용되는 밴 컨테이너 내 물품을 위한 완전 자동 지능형 하역 기계 운영 시스템입니다. 2025년 매출액과 비중은 극히 낮다. 현재 휴머노이드 로봇(사람을 닮은 로봇) 분야와 관련된 제품은 포함되어 있지 않습니다."},{"s":"A주 마감 코멘트: 창업판(차이넥스트) 지수가 3% 이상 상승했고, 전체 시장이 100개 주식 한도를 초과했으며, 영화 및 텔레비전 극장, 감속기, 휴머노이드 로봇 등 부문이 강화되었습니다.","so":"Jiemian.com","tm":"11/23 16:08","c":2,"r":"cn","u":"https://www.jiemian.com/article/15362236.html","p":1795417731,"a":1795424039,"t":"A股收评：创业板指涨超3%，全市场超百股涨停，影视院线、减速器、人形机器人等板块走强","su":"11월 23일, 중국 3대 A주(중국 본토(상하이·선전) 주식시장의 주식) 지수가 종합적으로 상승했습니다. 마감 기준 상하이종합지수는 0.15%, 선전종합지수는 1.93%, 창업판(중국의 기술·성장 회사 주식시장)지수는 3.08%, 노스증권50은 4.67% 상승했다. 상하이와 선전 증시 거래액은 약 1조5528억8000만 위안으로 전 거래일보다 약 1306억8000만 위안 증가했다. 시장에서는 4,658개 종목이 상승했고, 783개 종목이 하락했는데, 그 중 한도상향 종목은 151개, 하락 종목은 7개였다."},{"s":"13:33:52 [초기 거래에서 영화 및 TV 극장, 귀금속, 휴머노이드 로봇 부문이 강세를 보였으며, A500 ETF E 펀드(159361)는 반나절 만에 2억 건 이상의 순청약을 받았습니다]","so":"财联社","tm":"11/23 14:33","c":2,"r":"cn","u":"https://www.cls.cn/detail/2541421","p":1795412032,"a":1795414373,"t":"13:33:52【影视院线、贵金属、人形机器人板块早盘走强，A500ETF易方达（159361）半日获超2亿份净申购】","su":"영화 및 TV 극장, 귀금속, 휴머노이드 로봇(사람을 닮은 로봇) 부문이 장 초반 강세를 보였습니다. A500 ETF E 펀드(159361)는 반나절 만에 2억 건 이상의 순청약을 받았습니다. 11월 23일 오전 거래에서는 하락세를 보이다 다시 상승세(오르는 흐름)를 보였다. 중국 3대 A주 지수는 상승과 하락을 반복했습니다. 전체 시장의 반나절 매출액은 9000억 위안을 넘어섰다. 업종별로는 영화와 텔레비전 극장, 귀금속, 부품, 휴머노이드 로봇, 감속기가 가장 많이 상승한 반면, 부동산, 물류, 석유 및 가스 탐사 및 서비스, 전력 부문은 가장 많이 하락했습니다. 홍콩 주요 지수는 엔터테인먼트, 통신 장비, 의료 서비스 부문이 상승세를 주도하는 등 조정을 이어갔습니다. 정오 마감 기준으로 CSI A500 지수는 0.5%, CSI 300 지수는 0.6%, 창업판(차이넥스트) 지수는 1.2%, 과학 기술 혁신 50 지수는 2.7%, 항셍 중국 기업 지수는 0.8% 하락했다. Flush iFinD 데이터에 따르면 A500 ETF E 펀드(159361, 피더 펀드 A/C/Y: 022459/022460/022930)는 반나절 만에 2억 건 이상의 순 청약을 받았습니다."},{"s":"슈퍼브에이아이, ‘마트 환경 기반 휴머노이드 로봇 경진대회’ 은상 수상","so":"한스경제","tm":"11/23 14:04","c":2,"r":"kr","u":"https://www.hansbiz.co.kr/news/articleView.html?idxno=885972","p":1795410262,"a":1795414372,"su":"| 서울=한스경제 김종효 기자 | 슈퍼브에이아이는 14일 대구 엑스코에서 개최된 '제21회 국제로봇콘테스트(2026 IRC)' 세부 대회인 '마트 환경 기반 휴머노이드 로봇(사람을 닮은 로봇) 경진대회'에서 은상을 받았다고 23일 밝혔다. 국제로봇콘테스트는 산업통상부와 대구광역시가 주최하고 한국로봇산업진흥원이 주관하는 행사다. 13일부터 이틀 동안 대구 엑스코에서 12개 세부 대회가 진행됐다. 이 가운데 마트 환경 기반 휴머노이드 로봇 경진대회는 숭실대학교와 카이로바가 주관하고 로보티즈가 후원해, 참가팀들이 휴머노이드 로봇에 AI 기술을 도입해 마트 환경 임무 수행 능력을 겨뤘다."},{"s":"아이엘, 中 로봇핸드 유니콘과 독점 공급계약…휴머노이드 부품사업 진출","so":"한국경제","tm":"11/23 13:19","c":2,"r":"kr","u":"https://www.hankyung.com/article/202611234083i","p":1795407581,"a":1795408891,"su":"AI 추천 뉴스 아이엘, 中 로봇핸드 유니콘과 독점 공급계약…휴머노이드(사람을 닮은 로봇) 부품사업 진출 코스닥(한국 중소·기술 회사들이 모인 주식시장) 상장사 아이엘이 중국 로봇핸드 전문기업 자이노바(XYNOVA)와 국내 독점 공급계약을 체결하고 휴머노이드 핵심부품 사업에 진출한다. 아이엘은 자이노바의 로봇핸드 전 제품군과 휴머노이드 관절 구동장치(액추에이터)에 대한 국내 독점 공급권을 확보했다고 23일 밝혔다. 지난 20일 열린 계약식에는 송성근 아이엘 의장과 샤위쉬안 자이노바 창업자 겸 최고경영자(CEO)가 참석했다."},{"s":"휴머노이드 로봇 테마가 계속해서 상승하고 있으며, 서던펀드의 로봇 ETF 서던(159258)의 기초지수가 2% 이상 상승했습니다.","so":"Jiemian.com","tm":"11/23 11:39","c":2,"r":"cn","u":"https://www.jiemian.com/article/15360344.html","p":1795401555,"a":1795403836,"t":"人形机器人概念持续拉升，南方基金旗下机器人ETF南方(159258)标的指数涨超2%","su":"10시 6분 현재, Robot ETF(여러 주식을 묶어 파는 상품) Southern(159258)은 장중 거래량이 1,892.57만 위안으로 1.58% 변동되었습니다. 추적지수인 CSI 로봇지수(H30590)는 한때 2.15% 넘게 올랐고, 현재는 1.45% 상승 중이다."},{"s":"유니트리 급등, 주가 600위안 이상 회복","so":"第一财经","tm":"11/23 11:01","c":2,"r":"cn","u":"https://www.yicai.com/news/103449720.html","p":1795399306,"a":1795403832,"t":"宇树科技大涨 股价重回到600元以上","su":"제일재경 2026-11-23 09:58:55 편집자: Zhang Xiao 유니트리 기술이 급등했습니다. 보도 시간 현재 주가는 600위안 이상으로 회복되었으며 장중 최대 상승률은 8% 이상이다."},{"s":"미국/중국 제조사 야스카와 전기(야스카와전기 Electric) 따라잡기: 2030년 AI 휴머노이드 로봇 출시 - 국제","so":"工商時報","tm":"11/23 10:53","c":2,"r":"tw","u":"https://www.ctee.com.tw/news/20261123700818-430702","p":1795398780,"a":1795403837,"t":"追趕美/中廠安川電機：2030年推AI人形機器人- 國際","su":"일본 산업용 로봇 제조사 야스카와전기(야스카와전기 Electric)가 미국, 중국 제조사를 따라잡기 위해 2030년 AI를 탑재한 휴머노이드 로봇(사람을 닮은 로봇)을 출시해 시장 점유율을 선점할 예정이다. 교도통신은 야스카와전기의 AI 로봇 사업 코디네이터 구보타 유미가 인터뷰에서 개발 중인 AI 휴머노이드 로봇이 \"2030년에 출시될 것\"이라고 말했다고 20일 보도했다. 구보타 유미 씨는 고객 수요에 따라 사전 출시도 고려할 것이라고 지적했다. ..."},{"s":"Ant Group은 중국의 휴머노이드 경쟁에서 성공하기 위해 Simplexity에 투자했습니다.","so":"Bloomberg.com","tm":"11/23 08:00","c":2,"r":"us","u":"https://www.bloomberg.com/news/articles/2026-11-22/ant-group-bets-on-simplexity-to-thrive-in-china-s-humanoid-race","p":1795388400,"a":1795403831,"t":"Ant Group Bets on Simplexity to Thrive in China’s Humanoid Race"},{"s":"ASUS의 첫 번째 휴머노이드 로봇 공개 - Financial News - Business Times","so":"中時新聞網","tm":"11/23 05:10","c":2,"r":"tw","u":"https://www.chinatimes.com/newspapers/20261123000212-260202","p":1795378200,"a":1795389945,"t":"華碩首款人形機器人曝光- 財經要聞- 工商時報","su":"ASUS의 첫 번째 휴머노이드 로봇(사람을 닮은 로봇)이 공개되었습니다. 최근 외국 언론과의 인터뷰에서 ASUS 공동 CEO(회사의 가장 높은 책임자) Xu Xianyue는 ASUS의 첫 번째 인간형 로봇 Gallop을 공개하고 첫 번째 작업인 ASUS 자체 스마트 공장에서 마더보드 액세서리를 포장하는 작업을 소개했습니다. 쉬셴웨(Xu Xianyue) 역시 갤럽이 이르면 내년 하반기 오픈할 것으로 예상했다."},{"s":"605018, 초 단위로 한계 업! 휴머노이드 로봇, 다중 연선 보드","so":"21财经","tm":"11/25 11:17","c":1,"r":"cn","u":"https://www.21jingji.com/article/20261125/herald/bac7713cbb817e683e85f4ace7a6a922.html","p":1795573020,"a":1795574673,"t":"605018，秒涨停！人形机器人，多股连板","su":"11월 25일 오픈하여 휴머노이드 로봇(사람을 닮은 로봇)이라는 컨셉이 계속해서 활발히 활동하고 있습니다. 장화그룹(605018) 오픈 후 초 제한 상한액으로 4회 연속 보드 달성; Ningbo Dongli에는 3개의 연속 보드가 있습니다. 창립자 모터(Founder Motor), 고요(Koyo Co., Ltd.), 헝공정밀(Henggong Precision), 푸라이 신소재(Fulai New Materials)가 그 뒤를 따랐습니다. 이 소식에 샤오펑 Motors는 휴머노이드 로봇 IRON의 최신 워밍업 영상을 공개했습니다. 짧은 영상은 로봇이 수동 원격 제어 없이 일상생활에 가까운 여러 가지 정교한 작업을 독립적으로 완료할 수 있다는 점을 보여주는 데 중점을 둡니다. 장화그룹은 11월 24일 주식거래 위험 경고를 발령했다. 이 회사는 상장 자동차 부품회사이다. 주로 자동차 금속 부품의 연구 개발, 생산 및 판매에 종사하고 있습니다. 핵심 제품은 패스너, 스탬핑 및 용접 부품입니다. 완전한 휴머노이드 로봇 사업에 종사하고 있지 않습니다. 액추에이터 및 기타 관련 부품 제품에 대한 특수 구조 부품만 고객에게 제공합니다. 현재까지 약 88,000위안의 영업이익(장사해서 남긴 돈)을 달성했습니다. 위에서 언급한 제품은 회사의 주요 비즈니스 제품의 응용 시나리오 확장을 기반으로 합니다. 이는 회사 전체 영업이익에서 아주 작은 부분을 차지하며 순이익에 큰 영향을 미치지 않습니다. 유성 롤러 스크류 제품에 관해서는 아직 연구 개발 단계에 있습니다. 아직 고객 승인을 받지 못했고, 영업이익도 달성하지 못한 상태여서 실적에 영향은 없을 것으로 보인다."},{"s":"'본토 주식시장' 3대 지수 모두 하락, 휴머노이드 로봇, 소매판매는 추세를 거스르고 상승 - 국제","so":"旺得富理財網","tm":"11/25 11:03","c":1,"r":"tw","u":"https://wantrich.chinatimes.com/news/20261125900101-420201","p":1795572225,"a":1795574674,"t":"《大陸股市》三大指數齊跌人形機器人、零售逆勢上漲- 國際","su":"[타임즈-타이페이] 중국 본토 증시가 25일 개장했다. 주요 3개 지수가 하락했다. 상하이증권거래소지수는 1.03% 하락한 3511.711포인트를 기록했다. 선전 구성요소 지수는 1.46% 하락한 10,271.862포인트를 기록했습니다. ChiNext 지수는 1.95% 하락한 2234.593포인트를 기록했습니다. 시장에서는 장화그룹(Changhua Group), 닝보 동리(Ningbo Dongli) 제한, 파운더 모터(Founder Motor), 고요(Kyo Co., Ltd.), 헝공정밀(Henggong Precision), 푸라이 신소재(Fulai New Materials) 등이 뒤를 잇는 등 휴머노이드 로봇(사람을 닮은 로봇) 테마가 반복적으로 활성화됐다. 소매 부문이 단기적으로 상승한 항저우..."},{"s":"산업 고도화를 지원하기 위한 로봇 일반화 지침. 공동 대응을 위해 24개 전략적 파트너를 모았습니다. 업계 플레이어가 국제 공급망에 진입할 수 있도록 지원하기 위해 핵심 구성 요소 기술의 개발 및 적용에 중점을 둡니다.","so":"經濟日報","tm":"11/25 11:03","c":1,"r":"tw","u":"https://money.udn.com/money/story/5639/9899934?from=edn_subcatelist_cate","p":1795572193,"a":1795574675,"t":"機器人通用化指引 助產業升級 集結 24 家策略夥伴共同響應 聚焦關鍵零組件技術發展與應用 協助業者切入國際供應鏈","su":"대만 산업이 시장 기회를 포착하고 로봇 생태계에 진입할 수 있도록 돕기 위해 지난 11월 12일 경제부 산업진흥청이 주최하고 정보정책심의회와 정밀기계센터가 시행하고 전자장비협회와 지능형 모빌리티 협회가 공동 주최한 'ROBOT READY 2026 로봇 일반화 지침 발표 및 기술 생태계 포럼'이 열렸다. 가이드라인 발표, 기술 포럼, 실제 전시회를 통해 핵심 부품의 기술 개발 및 적용에 중점을 두고 다음 단계의 대만 로봇 산업 발전 방향을 제시했습니다. 다양한 제조업체의 부품을 로봇 시스템에 성공적으로 적용하려면 기술 자체 외에도 공통 개발 기반과 산업 협력도 필요합니다. 지난 12일 공식 출시된 'ROS 2 기반 로봇 시스템 일반 소개 가이드'는 ROS 2 오픈소스 개발 프레임워크를 기반으로 로봇 개발 관행, 하드웨어 인터페이스, 통신 프로토콜, 일반적으로 사용되는 알고리즘을 통합하고 기본 로봇 모델, 국제 규정 준수 등의 주제를 담고 있다. 기술지식의 정리와 공유를 통해 국내 로봇공학 분야 업계 종사자들의 학습과 발전 과정을 단축할 것으로 기대된다. 글로벌 스마트 로봇 시장이 가속화되면서 대만의 정보통신 및 전자부품 제조사들도 적극적으로 새로운 시장 기회를 모색하고 있다. 이 연례 가이드는 INTEL Taiwan, Novatek Technology 및 Zhishen이 담당합니다."},{"s":"중국 본토에서 휴머노이드 로봇 판매가 두 자릿수 증가 돼지 가격이 안정되고 반등할 조짐을 보임 | 라이브 뉴스 - 뉴스","so":"etnet 經濟通","tm":"11/25 10:41","c":1,"r":"hk","u":"http://www.etnet.com.hk/www/tc/news/home_categorized_news_detail.php?newsid=ETR361125371","p":1795570860,"a":1795574677,"t":"內地人形機械人銷售雙位數增；豬價呈現企穩回升跡象 | 即時新聞 - 新聞","su":"2026/11/25 09:02 \"소문\" 중국 본토의 휴머노이드 로봇(사람을 닮은 로봇) 판매량이 두 자릿수 증가했습니다. 돼지고기 가격은 안정과 회복세를 보였다. '소문' 미국 증시 반등이 홍콩 증시 상승에 실패했지만 본토 휴머노이드 로봇 주가는 좋은 성과를 냈다. 본토 내 휴머노이드 로봇 판매량은 두 자릿수 성장을 유지하며 산업도 꾸준히 성장한 것으로 전해졌다. 유비텍(09880)은 어제(24일) 2.65위안 오른 62.9위안으로 마감했다. 시장 소식에 따르면, 수급이 개선되면서 최근 본토 돼지는 안정되고 반등하는 추세를 보이고 있습니다. 목원주식(02714) 주가가 상승세(오르는 흐름)를 이어갔다. 어제 거래액은 9천만 위안 이상으로 0.04위안 소폭 하락한 39.96위안으로 마감했습니다. '편집자주' 이 칼럼은 현재 시장에 떠도는 루머를 수집한 칼럼이지만 아직 확정된 소식은 아니며, '경제뉴스'는 내용의 정확성을 보장하지 않습니다."},{"s":"뉴로메카, 휴머노이드 수술보조로봇 실증 성공","so":"뉴스핌","tm":"11/25 08:50","c":1,"r":"kr","u":"https://www.newspim.com/news/view/20261125000184","p":1795564200,"a":1795565234,"su":"[서울=뉴스핌] 이나영 기자= 피지컬 인공지능(AI) 로봇 및 자동화 전문기업 뉴로메카는 자체 개발 로봇 플랫폼"},{"s":"티로보틱스, '8시간 연속 작업' 휴머노이드 북미 본격 진출…핵심 부품 풀 내재화 '주목'","so":"프라임경제","tm":"11/25 08:28","c":1,"r":"kr","u":"https://m.newsprime.co.kr/section_view.html?no=756359&menu=1","p":1795562907,"a":1795574671,"su":"포드에너지향 AMR 매출 인식까지…피지컬 AI(몸을 갖고 실제 세상에서 움직이는 인공지능(로봇 등)) 다크팩토리 '카이로스' 핵심 주자 자리 [프라임경제] SK증권은 25일 티로보틱스(117730)에 대해 △진공로봇 출하 회복 △포드에너지향 에너지저장시스템(ESS) 자율주행로봇(AMR) 매출 인식 △'카이로스(KAIROS)' 및 CES를 통한 휴머노이드(사람을 닮은 로봇) 사업 가시화를 바탕으로 올해 별도 흑자전환에 이어 내년 연결 흑자전환을 기록할 것이기에 주목해야 할 시점이라고 평가했다."},{"s":"'삼성 로봇'에 올라탈 기업은…로봇 부품주 옥석 가리기 시작","so":"한국경제","tm":"11/25 08:25","c":1,"r":"kr","u":"https://www.hankyung.com/article/2026112583446","p":1795562701,"a":1795565234,"su":"'삼성 로봇'에 올라탈 기업은…로봇 부품주 옥석 가리기 시작, 삼성전자, CES 2027서 휴머노이드(사람을 닮은 로봇) 첫 공개 전망"},{"s":"자기 몸무게만큼 짐 운반…90kg '괴력 휴머노이드'","so":"전자신문","tm":"11/25 06:00","c":1,"r":"kr","u":"https://www.etnews.com/20261124000443","p":1795554000,"a":1795560850,"su":"자기 몸무게만큼 무거운 짐을 운반할 수 있다는 휴머노이드 로봇(사람을 닮은 로봇)이 공개됐습니다. 미국 로봇기업 파운데이션 퓨처 인더스트리스는 지난 18일(현지시간) 2세대 휴머노이드 로봇"},{"s":"AI 다음은 로봇…‘탈중국’에 기회 잡는 K부품 [화제의 리포트]","so":"한경매거진","tm":"11/25 05:57","c":1,"r":"kr","u":"https://magazine.hankyung.com/business/article/202611196657b","p":1795553820,"a":1795574671,"su":"몇 년 사이 인공지능(AI)이 거대한 시장을 만들었듯이 휴머노이드가 생산과 노동 방식을 바꾸는 ‘안드로노믹스’ 시대도 머지않았다. 올해 말부터 휴머노이드 로봇(사람을 닮은 로봇)의 양산이 시작되면 상용화(실제로 팔고 쓰이기 시작하는 것)에도 속도가 붙을 것으로 전망된다. 윤 애널리스트는 휴머노이드가 만들어낼 미래에 대한 기대와 함께 그 성장을 실제 수주와 매출로 연결할 기업을 살펴볼 때라고 지적했다. 특히 미국이 중국산 부품 의존도를 낮추려는 상황에서 자동차·가전 등의 부품 기술을 축적한 한국의 역할에 주목했다."},{"s":"글로벌 출하량 97% 장악한 中 휴머노이드 굴기… 애지봇 등 ‘6대 천왕’ 패권 경쟁","so":"글로벌이코노믹","tm":"11/25 05:45","c":1,"r":"kr","u":"https://www.g-enews.com/article/Global-Biz/2026/11/202611242211132330c8c1c064d_1","p":1795553100,"a":1795565234,"su":"중국이 전 세계 휴머노이드(인간형) 로봇 시장의 압도적인 주도권을 거머쥐면서 자국 내 주요 로봇 개발사 간 시장점유율과 상용화(실제로 팔고 쓰이기 시작하는 것) 영토 확장 경쟁이 한층 달아오르고 있다. 지난주 중국"},{"s":"‘로봇 강국’ 타이틀 탈환 나선 일본의 역습 … 휴머노이드 부품 패권 지도 [맥킨지·매경 산업분석]","so":"매일경제","tm":"11/25 05:00","c":1,"r":"kr","u":"https://www.mk.co.kr/news/business/12217342","p":1795550400,"a":1795560850,"su":"최근 세계 1위 자동차 기업 도요타자동차가 지난 5일 2분기 실적 발표 이후 16.68% 급등했다. 40년 만에 최대 폭 상승이다. 비용절감 등 경쟁력 강화로 영업이익(장사해서 남긴 돈)이 34%나 급등한 실적 개선과 주주환원 확대가 동시에 확인되면서 매수세(사려는 힘)가 강해진 것으로 풀이된다. 북미시장 하이브리드 자동차 판매 호조로 연간 이익 전망도 상향 조정했다. 도요타자동차는 로봇 투입으로 생산성 증대를 노린다는 포석을 드러낸 바 있다."},{"s":"TSMC 진출의 규슈, 싹트는 피지컬 AI 야스카와 전기와 미쓰이 부동산도 투자","so":"日本経済新聞","tm":"11/25 05:00","c":1,"r":"jp","u":"https://www.nikkei.com/article/DGXZQOJC133NT0T11C26A1000000/","p":1795550400,"a":1795560855,"t":"TSMC進出の九州、芽吹くフィジカルAI 安川電機や三井不動産も投資","su":"규슈에서는 인공지능(AI) 관련 반도체(전자기기 속에서 계산하고 기억하는 작은 부품)가 새로운 기간산업이 된다. 기계나 로봇을 자율적으로 움직이는 피지컬 AI(몸을 갖고 실제 세상에서 움직이는 인공지능(로봇 등))에 승기를 찾았고, 야스카와 전기나 미쓰이 부동산 등 기업이 투자를 추진하고 있다. 경제산업성은 10월 대만적체전로제조(TSMC)가 건설 중인 구마모토 제2공장(구마모토현 기쿠요초)에서 첨단 반도체를 건설할 계획을 보조금 대상으로 인정했다. 회로선 폭 3나노(나노는 10억분의 1) 미터 세대의 AI 반도체 등을 생산한다. 2028년"},{"s":"피지컬 AI 범용 로봇에 가장 중요한 「기반 모델」개발의 열쇠","so":"日経BOOKプラス","tm":"11/25 05:00","c":1,"r":"jp","u":"https://bookplus.nikkei.com/atcl/column/110600809/110600002/","p":1795550400,"a":1795560856,"t":"フィジカルAI 汎用ロボットに最重要の「基盤モデル」開発のカギ","su":"대상물의 위치나 형태, 주위의 환경이 변화해도, 스스로 상황을 인식해, 취해야 할 행동을 선택할 수 있는 범용 로봇. 실현의 열쇠를 잡는 두뇌가 되는 로봇 기반 모델의 진화를 Preferred Networks의 피지컬 AI(몸을 갖고 실제 세상에서 움직이는 인공지능(로봇 등)) 사업을 통괄하는 카미노 히로야씨에게 묻는다."},{"s":"AI가 현실 세계를 통제하기 시작하면 누가 안전을 유지할 것인가? 상업용 로봇 시대가 온다, VicOne은 포괄적인 정보 보안 보호를 만듭니다","so":"天下雜誌","tm":"11/25 01:01","c":1,"r":"tw","u":"https://www.cw.com.tw/article/5143693","p":1795536060,"a":1795560854,"t":"當 AI 開始控制真實世界，誰來守住安全底線？商用機器人時代來臨，VicOne 打造全方位資安防護"},{"s":"처음으로 생산이 이야기를 넘어섰다: 휴머노이드 로봇이 '누가 물건을 배달할 수 있는가'를 놓고 서로 경쟁하기 시작했고, 로봇 ETF 인베스코(159559)는 완성 기계보다는 부품에 베팅했다.","so":"Jiemian.com","tm":"11/24 17:20","c":1,"r":"cn","u":"https://www.jiemian.com/article/15368129.html","p":1795508402,"a":1795521570,"t":"产量第一次超过故事：人形机器人开始比“谁交得出货”，机器人ETF景顺(159559)押的是零件而不是整机","su":"로봇 ETF(여러 주식을 묶어 파는 상품) Invesco(159559)는 Invesco Great Wall Fund에서 발행합니다. 국가증권 로봇산업지수(980022.CNI)를 밀접하게 추종하는 패시브 지수 ETF입니다. The performance comparison benchmark is the National Securities Robot Industry Index return rate."},{"s":"[ETF 시황] '젠슨 황 복귀' AI 훈풍에 휴머노이드 로봇 ETF 17%대↑","so":"뉴스핌","tm":"11/24 16:30","c":1,"r":"kr","u":" function regLoad(){ S.region = load(regKey(), regKey()==='sregion' ? 'us' : 'all'); }
regLoad();

function visible(t){
  return t.items.filter(function(n){ return S.region==='all' || n.r===S.region; });
}
function sorted(list, breaking){
  var k = breaking ? 'p' : S.sort;
  return list.slice().sort(function(x,y){
    var c = y.c - x.c, p = y.p - x.p; return k==='c' ? (c||p) : (p||c);
  });
}
function renderTabs(){
  $('tabs').innerHTML = D.themes.map(function(t, i){
    var sn = S.seen[t.name] || 0;           // 지금 고른 나라에서 보이는 기사 중 새 기사가 있을 때만 (0개인데 레드닷 뜨던 문제)
    var dot = i !== S.tab && !t.stats && visible(t).some(function(n){ return n.a > sn; });
    return '<button class="tab'+(i===S.tab?' on':'')+'" onclick="openTab('+i+')">'+esc(t.name)+
           (t.stats ? '' : '<b>'+visible(t).length+'</b>')+(dot?'<span class="dot" title="새 뉴스"></span>':'')+'</button>';
  }).join('');
  var on = $('tabs').children[S.tab]; if(on && on.scrollIntoView) on.scrollIntoView({block:'nearest', inline:'center'});
}
function renderCtrl(){
  var br = D.themes[S.tab].breaking || D.themes[S.tab].stats;
  var h = '';
  if(!br){
    h += '<button class="'+(S.sort==='c'?'on':'')+'" onclick="setSort(\'c\')">🔥 화제순</button>';
    h += '<button class="'+(S.sort==='p'?'on':'')+'" onclick="setSort(\'p\')">🕒 최신순</button><span class="sep"></span>';
  }
  h += '<button class="'+(S.region==='all'?'on':'')+'" onclick="setRegion(\'all\')">전체</button>';
  D.regions.forEach(function(r){
    h += '<button class="'+(S.region===r.k?'on':'')+'" onclick="setRegion(\''+r.k+'\')">'+esc(r.l)+'</button>';
  });
  $('ctrl').innerHTML = h;
}
function card(n, prev){
  var hot = n.c > 1 ? '<span class="hot'+(n.c>=5?' big':'')+'">🔥 언론 '+n.c+'곳</span>' : '';
  var isNew = prev && n.a > prev ? ' <span class="new">NEW</span>' : '';
  return '<a class="card" href="'+esc(n.u)+'" target="_blank" rel="noopener" data-s="'+esc(n.su||'')+'" data-so="'+esc(n.so)+'">'+
    '<div class="meta">'+hot+esc(RL[n.r]||'')+' · '+esc(n.so)+' · '+esc(n.tm)+isNew+'</div>'+
    '<div class="title">'+esc(n.s)+'</div>'+(n.t?'<div class="orig">'+esc(n.t)+'</div>':'')+'</a>';
}
function renderMain(){
  if(D.themes[S.tab].stats){ renderStats(D.themes[S.tab]); return; }
  var t = D.themes[S.tab], list = sorted(visible(t), t.breaking), prev = S.prev[t.name] || 0;
  var h = '<h2>'+esc(t.name)+'</h2>' + (t.note ? '<p class="note">'+esc(t.note)+'</p>' : '');
  var fresh = prev ? list.filter(function(n){ return n.a > prev; }).length : 0;
  if(S.onlyNew){                                // '새 기사만 보기' 중
    list = list.filter(function(n){ return n.a > prev; });
    h += '<button class="newbar" onclick="onlyNew(false)">🆕 새 기사 '+list.length+'개만 보는 중 · 전체 보기</button>';
  } else if(fresh && !t.breaking){              // 새 기사가 정렬 때문에 아래로 밀려도 바로 찾을 수 있게
    h += '<button class="newbar" onclick="onlyNew(true)">🆕 새 기사 '+fresh+'개 · 새 기사만 보기</button>';
  }
  if(!list.length) h += '<p class="none">'+(S.region==='all' ? '최근 ' + (t.breaking?'속보':'기사') + ' 없음' : esc(RL[S.region])+' 기사 없음')+'</p>';
  h += list.slice(0, S.shown).map(function(n){ return card(n, prev); }).join('');
  var extra = list.length - S.shown;
  if(extra > 0) h += '<button class="more" onclick="more()">더보기 ▾  ('+extra+'개 더)</button>';
  else if(S.shown > D.show) h += '<button class="more" onclick="less()">접기 ▴</button>';
  var auto = Object.keys(D.auto);
  h += '<footer>업데이트 '+esc(D.updated)+' · 최근 3일 · 믿을 만한 언론사 기사만 · 기사를 누르면 한국어 요약 → 원문 보기<br>'+
       '🔥 언론 N곳 = 같은 소식을 보도한 언론사 수예요 (많을수록 큰 소식) · <span style="color:var(--red)">●</span> = 새 뉴스'+
       '<br><br><b>봇이 스스로 추가한 언론사</b> (큰 언론사보다 먼저 보도하고, 큰 언론사도 따라 보도한 소식이 많은 곳 · 최근 14일)'+
       (auto.length ? auto.map(function(k){ return '<div>'+esc(k)+': '+esc(D.auto[k].join(', '))+'</div>'; }).join('') : '<div>아직 없음</div>')+
       '</footer>';
  $('main').innerHTML = h;
}
function openTab(i){
  var t = D.themes[i];
  S.tab = i; S.shown = D.show; S.onlyNew = false; save('tabname', t.name); regLoad();
  if(!(t.name in S.prev)) S.prev[t.name] = S.seen[t.name] || 0;     // 이 탭에서 NEW 로 보여줄 기준
  S.seen[t.name] = Math.max(S.seen[t.name] || 0, newest(t)); save('seen', S.seen);  // 탭에 들어오면 레드닷 지움
  history.replaceState(null, '', t.stats ? '#stats' : '#t'+i);
  renderTabs(); renderCtrl(); renderMain(); window.scrollTo(0, 0);
}
function setSort(k){ S.sort = k; save('sort', k); S.shown = D.show; renderCtrl(); renderMain(); }
function setRegion(k){ S.region = k; save(regKey(), k); S.shown = D.show; renderTabs(); renderCtrl(); renderMain(); }
function more(){ S.shown += 20; renderMain(); }
function onlyNew(on){ S.onlyNew = on; S.shown = D.show; renderMain(); }
function less(){ S.shown = D.show; renderMain(); window.scrollTo(0, 0); }
$('upd').textContent = '업데이트 ' + D.updated + ' · 탭을 눌러 테마별 뉴스 보기';

// 🚨 미국 속보 · 🌏 해외 속보는 페이지를 새로 올리지 않아도 최신 내용을 바로 가져옴
function refreshBreaking(){
  if(!window.fetch) return;
  fetch(D.breaking_url + '?t=' + Date.now(), {cache:'no-store'}).then(function(r){ return r.json(); }).then(function(b){
    var all = b.items || [];
    D.themes.forEach(function(t, i){
      if(!t.breaking) return;
      var items = all.filter(function(n){ return n.theme === t.name; }).map(function(n){
        var d = {s:n.show, so:n.source||'', tm:n.time||'', c:n.count||1, r:n.rk||'us', u:n.url||n.link, p:Math.floor(n.pub), a:Math.floor(n.added||n.pub)};
        if(n.show !== n.title) d.t = n.title; if(n.sum) d.su = n.sum; return d;
      });
      if(!items.length && t.items.length) return;
      t.items = items;
      if(S.tab === i){ S.seen[t.name] = Math.max(S.seen[t.name]||0, newest(t)); save('seen', S.seen); renderMain(); }
    });
    renderTabs();
  }).catch(function(){});
}

function cnt(day, th){                     // 하루·테마의 뉴스 수 (국가 필터 반영) — 봇이 세기 전 날은 GDELT 원본으로 센 추정치(ST.hist)
  var src = (ST.days||{})[day] ? ST.days : ((ST.hist||{})[day] ? ST.hist : {});
  var v = (src[day]||{})[th] || {}, n = 0;

// 분기 (2026-11-24 사용자 요청): 달력 분기(1~3월·4~6월·7~9월·10~12월), 바로 앞 분기와 비교
function qDays(y, n){ var out = [], a = Date.UTC(y, (n-1)*3, 1), b = Date.UTC(n===4 ? y+1 : y, n===4 ? 0 : n*3, 1), last = kdate(1);
  for(var t=a; t<b; t+=86400e3){ var d = new Date(t).toISOString().slice(0,10); if(d > last) break; out.push(d); } return out; }
function qList(){ var out = [], y = 2026, n = 1, ty = +kdate(1).slice(0,4), tn = Math.floor((+kdate(1).slice(5,7)-1)/3)+1;
  while(y < ty || (y === ty && n <= tn)){ out.push(y+'-'+n); n++; if(n > 4){ n = 1; y++; } } return out; }
function period(){                         // [이번 기간 날짜들, 비교할 이전 기간 날짜들, 이름]
  if(S.sp === 'q'){ var ql = qList(); if(ql.indexOf(S.qn) < 0) S.qn = ql[ql.length-1];
    var y = +S.qn.split('-')[0], n = +S.qn.split('-')[1], cur = qDays(y, n), full = qDays(y, n).length === Math.round((Date.UTC(n===4?y+1:y, n===4?0:n*3, 1) - Date.UTC(y,(n-1)*3,1))/86400e3);
    var py = n===1 ? y-1 : y, pn = n===1 ? 4 : n-1, prev = qDays(py, pn);
    if(!full) prev = prev.slice(0, cur.length);                       // 진행 중인 분기는 앞 분기도 같은 날 수만큼만 비교
    return [cur, prev, y+'년 '+n+'분기'+(full ? '' : ' (진행 중)')]; }
  var L = {today:[0,1,'오늘(진행 중)'], yday:[1,1,'어제'], w:[1,7,'최근 7일'], m:[1,30,'최근 30일'],
           h:[1,182,'최근 6개월'], y:[1,365,'최근 1년']}[S.sp] || [1,1,'어제'];
  var cur = [], prev = [];
  for(var i=0;i<L[1];i++){ cur.push(kdate(L[0]+i)); prev.push(kdate(L[0]+L[1]+i)); }
  return [cur, prev, L[2]];
}
function have(days){ var n=0; days.forEach(function(d){ if((ST.days||{})[d] || (ST.hist||{})[d]) n++; }); return n; }   // 기간 안에 실제로 모인 날 수
function firstDay(){ var k = Object.keys(ST.days||{}).sort(); return k[0] || ''; }
function sum(days, th){ var n=0; days.forEach(function(d){ n += cnt(d, th); }); return n; }
// 긍정·부정·중립 (2026-11-22~): [긍정, 부정, 중립, 판정 다름] — 낱말 판정과 AI 모델 판정이 같거나, 규칙(sentiment.RESOLVE)으로 정해진 기사를 셈
function scnt(d, th){ var o = (((ST.senti||{})[d])||{})[th] || {}, v = [0,0,0,0];
  for(var k in o){ if(S.region==='all' || k===S.region){ for(var i=0;i<4;i++) v[i] += o[k][i]||0; } } return v; }
function ssum(days, th){ var v = [0,0,0,0]; days.forEach(function(d){ var x = scnt(d, th); for(var i=0;i<4;i++) v[i] += x[i]; }); return v; }
function sentHtml(v){
  if(!(v[0]+v[1]+v[2]+v[3])) return '<span class="sent"></span>';
  return '<span class="sent" title="좋은 소식 '+v[0]+' · 나쁜 소식 '+v[1]+' · 그냥 소식 '+v[2]+' · 판단 엇갈림 '+v[3]+'">'+
    '<i class="s-p">'+v[0].toLocaleString()+'</i><i class="s-n">'+v[1].toLocaleString()+'</i><i class="s-u">'+v[2].toLocaleString()+'</i></span>';
}
// 1월~11/14 긍정·부정·중립 비율 (월별 표본 약 40건 · Claude 판정) — 그 기간은 기사 수를 믿을 수 없어 비율만
function mratio(months, th){
  var acc = [0,0,0], k = 0;
  months.forEach(function(m){ var o = (((ST.senti_month||{})[m])||{})[th] || {}, v = [0,0,0];
    for(var r in o){ if(S.region==='all' || r===S.region){ for(var i=0;i<3;i++) v[i] += o[r][i]||0; } }
    var n = v[0]+v[1]+v[2]; if(n >= 5){ for(var i=0;i<3;i++) acc[i] += v[i]/n; k++; } });
  return k ? [acc[0]/k, acc[1]/k, acc[2]/k, k] : null;
}
function monthRatio(days, f, rows){
  if(!ST.senti_month || !f) return '';
  var ms = []; days.forEach(function(d){ var m = d.slice(0,7); if(d < f && ms.indexOf(m) < 0 && ST.senti_month[m]) ms.push(m); });
  if(!ms.length) return '';
  ms.sort();
  var lab = function(m){ return m.slice(2).replace('-','.'); };
  var h = '<h3 class="mrh">🟢🔴⚪ '+lab(ms[0])+(ms.length>1?'~'+lab(ms[ms.length-1]):'')+' 좋은·나쁜·그냥 소식 비율</h3>'+
          '<p class="note">'+f.slice(5).replace('-','/')+' 전 기사는 달마다 테마별로 약 40개씩 다시 모아 Claude가 직접 읽었어요. 좋은·나쁜·그냥 소식이 <b>몇 %</b>였는지 보여 줘요.</p>';
  h += rows.map(function(r){ var v = mratio(ms, r.th); if(!v) return '';
    var p = Math.round(v[0]*100), n = Math.round(v[1]*100), u = Math.max(0, 100 - p - n);
    return '<div class="mrow"><span class="sn">'+esc(r.th)+'</span><span class="rbar"><i class="b-p" style="width:'+p+'%"></i><i class="b-n" style="width:'+n+'%"></i><i class="b-u" style="width:'+u+'%"></i></span>'+
      '<span class="rpct"><i class="s-p">'+p+'%</i><i class="s-n">'+n+'%</i><i class="s-u">'+u+'%</i></span></div>'; }).join('');
  return h;
}
// 화제·쟁점 테마 (관심도 = 위키백과 조회수·구글 트렌드를 테마마다 '자기 평소'와 비교한 배수) — attention.py / news_stats.apply_attn
function heatBg(x){

  return 'rgba(96,165,250,'+Math.min(0.85, (1-x)*1.6).toFixed(2)+')';

function rcnt(day, th, rk){ var src = (ST.days||{})[day] ? ST.days : ((ST.hist||{})[day] ? ST.hist : {}); return (((src[day]||{})[th]||{})[rk]) || 0; }
function weeksOf(days){ var d = days.slice().sort(), out = []; for(var i=0;i<d.length;i+=7) out.push(d.slice(i, i+7)); return out.filter(function(w){ return w.length >= 4; }); }
function corr(a, b){ var n = a.length; if(n < 4) return null; var ma=0, mb=0; for(var i=0;i<n;i++){ ma+=a[i]; mb+=b[i]; } ma/=n; mb/=n;
  var sab=0, saa=0, sbb=0; for(var i=0;i<n;i++){ sab+=(a[i]-ma)*(b[i]-mb); saa+=(a[i]-ma)*(a[i]-ma); sbb+=(b[i]-mb)*(b[i]-mb); }
  return (saa && sbb) ? sab/Math.sqrt(saa*sbb) : null; }
function usKr(th, days){
  days = days.filter(function(d){ return (ST.days||{})[d] || (ST.hist||{})[d]; });   // 자료 없는 날(0)은 빼야 상관이 부풀지 않음
  var W = weeksOf(days), u = W.map(function(w){ var n=0; w.forEach(function(d){ n += rcnt(d, th, 'us'); }); return n*7/w.length; }),
      k = W.map(function(w){ var n=0; w.forEach(function(d){ n += rcnt(d, th, 'kr'); }); return n*7/w.length; });
  return {u:u, k:k, w:W, c:corr(u, k)};
}
function usKrChart(th){
  var r = usKr(th, period()[0]); if(r.u.length < 4) return '';
  var avg = function(a){ var s=0; a.forEach(function(x){ s+=x; }); return s/a.length || 1; }, au = avg(r.u), ak = avg(r.k);
  var U = r.u.map(function(x){ return x/au; }), K = r.k.map(function(x){ return x/ak; });
  var mx = Math.max.apply(null, U.concat(K).concat([1.5])), W = chartW(), H = 96, n = U.length;

  return '<div class="dt">🇺🇸 미국 vs 🇰🇷 한국 주마다 기사 수 (각자 평소 = 1)'+c+'</div>'+
    '<svg class="bars" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(th)+' 미국 한국 비교">'+
    '<line x1="0" y1="'+y1+'" x2="'+W+'" y2="'+y1+'" stroke="var(--line)" stroke-dasharray="3 3"/>'+
    '<polyline points="'+pt(U)+'" fill="none" stroke="#60a5fa" stroke-width="2"/>'+
    '<polyline points="'+pt(K)+'" fill="none" stroke="#f472b6" stroke-width="2"/>'+
    '<text x="0" y="'+(H-2)+'" class="ax">'+r.w[0][0].slice(5).replace('-','/')+'</text><text x="'+W+'" y="'+(H-2)+'" class="ax" text-anchor="end">'+r.w[n-1][r.w[n-1].length-1].slice(5).replace('-','/')+'</text>'+
    '<text x="0" y="9" class="ax"><tspan fill="#60a5fa">━ 미국</tspan>  <tspan fill="#f472b6">━ 한국</tspan></text></svg>';
}

function capped(days, th){

  days.forEach(function(d){ (c[d]||[]).forEach(function(s){ var p = s.split('|');

  return hit;

function byN(a,b){ return b.n - a.n || (a.th < b.th ? -1 : 1); }        // 많은 순 (같으면 이름순으로 고정)
function ranks(rows, ok){                  // 이전 기간 순위 (r.pr) — 이전 기간 자료가 없으면 표시 안 함
  rows.forEach(function(r){ r.pr = null; });
  if(!ok) return;
  rows.slice().sort(function(a,b){ return b.p - a.p || (a.th < b.th ? -1 : 1); }).forEach(function(r, i){ r.pr = i; });
}
function mv(r, i){                         // 순위 변동: 🔺 빨강 몇 계단 오름 · 🔻 파랑 몇 계단 내림
  if(r.pr === null) return '<span class="mv"></span>';                       // 비교할 이전 기간 자료 없음
  if(!r.n && !r.p) return '<span class="mv same" title="두 기간 모두 0건">-</span>';
  var d = r.pr - i;
  if(d > 0) return '<span class="mv up" title="이전 기간 '+(r.pr+1)+'위 → '+d+'계단 상승">▲<i class="gap"></i>'+d+'</span>';
  if(d < 0) return '<span class="mv dn" title="이전 기간 '+(r.pr+1)+'위 → '+(-d)+'계단 하락">▼<i class="gap"></i>'+(-d)+'</span>';
  return '<span class="mv same" title="순위 그대로 ('+(i+1)+'위)">-</span>';   // 변동 없음
}
function chg(n, p, hc, hp){
  if(hp === 0) return '<span class="chg">·</span>';          // 비교할 이전 기간 자료가 아직 없음
  if(hc && hp && hc !== hp){ n = n/hc; p = p/hp; }            // 모인 날 수가 다르면 하루 평균끼리 비교
  if(!p) return n ? '<span class="chg">신규</span>' : '';
  var pct = Math.round((n-p)/p*100);
  if(pct > 0) return '<span class="chg up">▲'+pct+'%</span>';
  if(pct < 0) return '<span class="chg dn">▼'+(-pct)+'%</span>';
  return '<span class="chg">–</span>';
}

    for(var t in HI.s){ for(var k in HI.s[t]){ if(HI.s[t][k][i] != null){ ok = true; break; } } if(ok) break; }
    HI.av.push(ok); }
  var y = +HI.since.slice(0,4), m = +HI.since.slice(5,7), ey = +HI.end.slice(0,4), em = +HI.end.slice(5,7);
  while(y < ey || (y === ey && m <= em)){
    var a = dIdx(y+'-'+('0'+m).slice(-2)+'-01'), ny = m===12 ? y+1 : y, nm = m===12 ? 1 : m+1;
    var b = Math.min(HI.n, dIdx(ny+'-'+('0'+nm).slice(-2)+'-01'));

  $('s-sum').textContent = sm || '이 기사는 요약을 가져오지 못했어요. (사이트가 자동 접속을 막았거나 아직 준비 중)';
  $('s-sum').className = 's-sum' + (sm ? '' : ' empty');
  $('s-go').href = c.href;
  // 외국어 기사면 ✦ Gemini 버튼 보이기 (한국어 기사는 숨김)
  var foreign = !!o || !/[가-힣]/.test(c.querySelector('.title').textContent);   // 번역이 안 됐어도 외국 기사면 버튼 표시
  $('s-cs').hidden = $('s-ct').hidden = $('s-cnote').hidden = !foreign;
  if(foreign){
    // 원문을 열고, Gemini 가 '지금 화면'의 기사를 읽고 답하도록 요청 문장만 복사
    $('s-cs').href = $('s-ct').href = c.href;
    $('s-cs').dataset.q = '이 페이지의 기사 전체를 처음부터 끝까지 읽고 한국어로 요약해 줘. 핵심 내용 3~5줄, 그리고 투자자 입장에서 중요한 숫자와 의미를 짧게 정리해 줘.';
    $('s-ct').dataset.q = "너는 어려운 경제 뉴스를 초등학생도 이해할 수 있게 풀어 주는 친절한 번역가야.\n이 페이지의 뉴스 기사 전체를 쉬운 한국어로 번역해 줘.\n\n[가장 중요한 규칙]\n- 쉽게 쓰더라도 기사 내용은 정확해야 해. 사실을 빼거나, 바꾸거나, 지어내지 마.\n- 기사 순서대로, 빠지는 내용 없이 번역해 줘.\n\n[쉽게 쓰는 방법]\n1. 한 문장에는 한 가지 내용만 써 줘. 문장은 짧게.\n2. \"~습니다/~해요\"체로 친절하게 써 줘.\n3. 어려운 말은 쉬운 말로 바꾸고, 꼭 필요한 전문 용어는 처음 나올 때 괄호로 뜻을 풀어 줘.\n   (예: 금리(돈을 빌릴 때 내는 이자의 비율), 실적(회사가 번 돈과 성과), 주가(회사 주식 한 주의 가격))\n4. 한자어·외래어보다 쉬운 우리말을 먼저 써 줘. (예: 하락 → 떨어졌어요, 상승 → 올랐어요)\n5. 큰 숫자는 읽기 쉽게 바꾸되 정확한 값은 지켜 줘. (예: $2.5 billion → 25억 달러(약 3조 5천억 원쯤))\n   환율로 바꾼 값은 \"약\"을 붙여서 대략이라는 걸 알려 줘.\n6. 회사·사람 이름은 한국에서 부르는 이름으로 쓰고, 처음 나올 때만 괄호에 영어 이름을 적어 줘. (예: 엔비디아(Nvidia))\n7. 누가 한 말인지 분명하게 써 줘. (예: 젠슨 황 대표는 \"…\"라고 말했어요.)\n\n[출력 형식]\n① 한 줄 요약: 이 기사가 무슨 이야기인지 한 문장으로\n② 쉬운 번역: 기사 순서대로\n③ 어려운 말 풀이: 기사에 나온 경제 용어 3~5개를 한 줄씩 쉽게 설명\n④ 그래서 무슨 뜻이야?: 이 소식이 주식 투자하는 사람에게 왜 중요한지 2~3줄\n   (기사에 나온 사실만 근거로, 내 생각이나 예측은 넣지 마)\n\n기사가 길어서 한 번에 다 못 하면, 어디까지 했는지 알려 주고 내가 \"계속\"이라고 하면 이어서 해 줘.";
  }
  $('dim').hidden = false; $('sheet').hidden = false; $('sheet').scrollTop = 0;
  document.body.style.overflow = 'hidden';
});
// ✦ 버튼: Gemini 요청 문장을 복사하고 원문을 엶 → 원문 화면에서 Gemini 를 불러 붙여넣기
function askAI(a){
  var q = a.dataset.q || '';
  try { if(navigator.clipboard) navigator.clipboard.writeText(q); } catch(e){}
  toast('요청 문장을 복사했어요 · 원문에서 측면 버튼 길게 → 「이 페이지에 관해 질문하기」 → 붙여넣기');
  setTimeout(closeSheet, 50);
}
function toast(msg){ var t = $('toast'); t.textContent = msg; t.hidden = false; clearTimeout(toast._t); toast._t = setTimeout(function(){ t.hidden = true; }, 4000); }
function closeSheet(){ $('dim').hidden = true; $('sheet').hidden = true; document.body.style.overflow = ''; }
document.addEventListener('keydown', function(e){ if(e.key==='Escape') closeSheet(); });
</script></body></html>
