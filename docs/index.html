000348-260210","p":1795119000,"a":1795128488,"t":"創櫃新星2美格儲能（7409） 首創電力膠囊具五大優勢- 產業特刊- 工商時報","su":"Meige는 세계적인 탄소 감소 추세를 고려하여 \"에너지 생성\"과 \"저장\"을 동시에 수행할 수 있는 세계 유일의 시스템 개발에 전념하고 있습니다. 탄력적인 새로운 전력망을 구축하고 2050년 순 제로를 향한 전환을 가속화하기 위한 최초의 \"파워 캡슐\" 기술입니다. 회사 설립자 Ding Lianjun이 개발한 \"파워 캡슐\"은 미국, 대만 및 중국에서 20년 동안 특허를 취득했습니다."},{"s":"Daya는 계속해서 태양광 발전 및 에너지 저장을 홍보합니다.","so":"中時新聞網","tm":"11/20 05:10","c":2,"r":"tw","u":"https://www.chinatimes.com/newspapers/20261120000432-260206","p":1795119000,"a":1795128490,"t":"大亞續推太陽能光電、儲能","su":"다야(1609)는 19일 연설회를 열고 태양광발전, 에너지저장장치(전기를 저장해 두는 큰 배터리) 등 녹색에너지 산업 배치를 지속적으로 추진하겠다고 밝혔다. Zhiguang Energy에 대한 Daya의 투자는 에너지부로부터 건설 허가를 받은 타이난의 35MW 어업 및 전기 공생 태양광 발전 프로젝트 부지의 Qigu Phase II에 위치하고 있습니다. 올해 말 착공, 내년 3분기 완공, 4분기 상장(주식시장에 처음 들어오는 것)을 목표로 하고 있다. 마음"},{"s":"Guangding의 운영은 올해 압박을 받고 있지만 내년에는 광통신 및 에너지 저장 분야의 성장 모멘텀에 대해 낙관하고 있습니다 | 주식정보 | 주식 시장","so":"UDN","tm":"11/19 17:58","c":2,"r":"tw","u":"https://udn.com/news/story/7252/9889437","p":1795078718,"a":1795089987,"t":"廣錠今年營運承壓看好明年光通訊、儲能成長動能| 個股情報| 股市","su":"산업용 컴퓨터 제조업체 Guangding(6441)은 올해 단기 운영이 어려움에 직면할 것이라고 인정했지만 회사는 다음 단계의 성장을 위한 기반을 구축하고 있습니다. 광딩은 2027년을 기대하며 실제 주문이 있는 AI 광통신과 대규모 프로젝트 납품을 촉진하는 에너지 저장 사업이 먼저 수익에 기여할 가능성이 가장 높은 두 가지 주요 원동력이 될 것으로 기대하고 있다. 회사는 점차 손실을 흑자(번 돈이 쓴 돈보다 많은 것)로 바꾸는 목표를 향해 나아갈 것입니다."},{"s":"'전자 주변기기' 광둥은 첫 3분기 동안 주당 4.54위안의 손실을 입었고 AI 광통신과 에너지 저장 트윈 엔진은 내년에 흑자를 낼 것이다","so":"中時新聞網","tm":"11/19 08:57","c":2,"r":"tw","u":"https://www.chinatimes.com/realtimenews/20261119001144-260410","p":1795046275,"a":1795058061,"t":"《電週邊》廣錠前3季每股虧4.54元 明年AI光通訊、儲能雙引擎拚轉盈","su":"Guangding(6441)은 미국 비규제 게임 시장의 수요 약화와 신제품 및 기존 제품의 대량 생산 지연으로 인해 영향을 받았습니다. 올해 3분기 누적 영업이익(장사해서 남긴 돈)은 9900만 위안으로 전년 동기 대비 53.56% 감소했다. 세후 순손실은 2억4200만 위안, 주당 손실은 4.54위안이다. 단기적인 운영 압박에 직면한 Guangding은 비즈니스 혁신을 적극적으로 추진합니다. 내년"},{"s":"\"AI로 사흘전 감지\"…삼성SDI, ESS 화재예방 소프트웨어 도입","so":"연합뉴스","tm":"11/19 08:03","c":2,"r":"kr","u":"https://www.yna.co.kr/view/AKR20261119021700003","p":1795043033,"a":1795046344,"su":"(서울=연합뉴스) 조성흠 기자 = 삼성SDI가 인공지능(AI)을 활용한 화재 예방 소프트웨어를 국내 에너지저장장치(ESS(전기를 저장해 두는 큰 배터리))용 배터리 솔루션에 본..."},{"s":"Yulon Law Conference/사업다각화 가속화, 에너지저장 및 배터리 사업 확대, 해외시장 확대","so":"UDN","tm":"11/18 16:03","c":2,"r":"tw","u":"https://udn.com/news/story/7252/9886704","p":1794985392,"a":1795003486,"t":"裕隆法說會／加速多元事業布局擴大儲能與電池業務、拓展海外市場","su":"Yulon Motors(2201)는 18일 성명을 통해 “향후에도 자동차 제조, 에너지, 채널 및 해외 서비스 레이아웃을 지속적으로 추진하고 차량 OEM, 에너지 저장 애플리케이션 및 전기 자동차 서비스 사업을 확장하고 사업 다각화로 발전할 것”이라고 밝혔습니다. 3분기 영업이익(장사해서 남긴 돈)은 17억 200만 위안에 달해 연간 증가율 15%로 4년 연속 연간 증가율을 기록했으며, 운영 관리 및 비용 통제 성과가 점차 나타나고 있다."},{"s":"삼성SDI는 16GWh 수준으로 잠긴다. 중국 제조업체는 미국 에너지 저장 셀의 \"규정 준수 프리미엄\"을 몇 년 동안 유지할 수 있습니까? -36Kr","so":"36kr","tm":"11/20 16:17","c":1,"r":"cn","u":"https://www.36kr.com/p/4077533371258754","p":1795159072,"a":1795175827,"t":"三星SDI锁单16GWh，美国储能电芯的“合规溢价”还能给中国厂商留几年？-36氪","su":"삼성SDI는 16GWh 수준으로 잠긴다. 중국 제조업체는 미국 에너지 저장 셀의 \"규정 준수 프리미엄\"을 몇 년 동안 유지할 수 있습니까? 삼성 SDI signed a long-term LFP order with the US Reserve, and the FEOC compliance threshold has been rising year by year. The North American compliance premium window for Chinese manufacturers is about 2027-2029, and is expected to narrow after that. Foresight Energy noticed that the deal announced by 삼성 SDI on November 16 was not complicated: the US subsidiary signed a contract with Jupiter Power, a subsidiary of 블랙록, to supply 16GWh lithium iron phosphate batteries from 2029 to 2031. The contract is estimated to be about 5 billion yuan, all produced at the StarPlus factory in Indiana. Taking into account previous agreements, the cumulative amount locked by both parties is approximately 27GWh."},{"s":"격차는 4.4배에 이르며 에너지저장장치 입찰과 설치가 가속화되고 있다.","so":"经济观察网","tm":"11/20 15:42","c":1,"r":"cn","u":"https://www.eeo.com.cn/2026/1120/1097760.shtml","p":1795156942,"a":1795175828,"t":"落差达4.4倍 储能招标与装机加速背离","su":"2026년 1월부터 9월까지 중국 국내 에너지저장산업 입찰 규모는 451.9GWh로 전년 동기 대비 48% 증가했지만, 신규 설치된 용량은 102.3GWh로 6% 증가에 그쳐 둘 사이의 격차가 약 4.4배에 달했다. 시기적 지연 외에도 수익모델 변화, 전력망 지원 병목현상, 해외 고마진 전환 등의 요인으로 전환 어려움이 가중됐다. 최근 기한이 지난 프로젝트가 여러 곳에서 청산되고 종이 주문으로 인해 실물 자산이 밀려나고 있습니다. 2027년 전력망 연결 규모를 늘릴 수 있을지 여부는 전력 가격 메커니즘의 시행과 자본 비용 개선에 달려 있다."},{"s":"ESS로 활로 찾은 K배터리..공장 가동률 회복세 접어들어 - 머니투데이","so":"머니투데이","tm":"11/20 15:25","c":1,"r":"kr","u":"https://www.mt.co.kr/amp/industry/2026/11/20/2026112014354645196","p":1795155906,"a":1795175825,"su":"국내 배터리업계가 에너지저장장치(ESS(전기를 저장해 두는 큰 배터리)) 시장 성장 등에 힘입어 생산시설 가동률을 끌어올리고 있다. 내년부터는 북미 지역 생산거점에서 ESS용 배터리 생산라인이 본격 가동되면서 회복세가 더욱 뚜렷해질 것이란 전망이 나온다."},{"s":"'2026년 중국 전고체전지 산업 발전 블루북' : 2030년 전고체전지 출하량의 약 20% 차지","so":"21财经","tm":"11/20 15:08","c":1,"r":"cn","u":"https://www.21jingji.com/article/20261120/herald/ed8e272e3d94dfb487633c8049aced63.html","p":1795154880,"a":1795158263,"t":"《2026中国固态电池行业发展蓝皮书》：2030年全固态电池占总出货量约20%","su":"11월 20일 개최된 제11차 파워 배터리 응용 국제 정상회의에서 '2026년 중국 전고체 배터리(액체 대신 고체를 넣은 안전한 배터리) 산업 발전 블루북'이 공식적으로 발표되었습니다. 보고서는 2026년부터 2027년이 전고체전지 파일럿 라인의 중앙 집중식 완성 및 운영을 위한 핵심 기간이라고 언급했습니다. 중국은 총 20개 이상의 파일럿 라인을 건설 및 건설 중이며 단일 라인 생산 능력은 0.2GWh에서 2GWh에 이르며 기술 경로는 황화물, 산화물, 할로겐화물의 세 가지 주요 시스템을 포괄합니다. 2027년에는 선도 기업들이 약 2.3GWh의 설치 용량으로 소규모 배치 차량급 배송을 시작할 예정입니다. 2028년부터 2029년까지는 수율이 증가하고 비용이 감소함에 따라 대규모 생산 능력 확장 단계에 진입하게 됩니다. 2030년 중국 전고체전지 출하량은 21.9GWh로 전체 출하량의 약 20%를 차지할 것으로 예상된다."},{"s":"에너지 저장 정책은 장기적으로 좋습니다. Southern Fund의 신에너지 ETF Southern(516160)이 추적하는 기본 지수는 어제 1.29% 하락으로 마감했습니다.","so":"Jiemian.com","tm":"11/20 12:14","c":1,"r":"cn","u":"https://www.jiemian.com/article/15353677.html","p":1795144475,"a":1795158264,"t":"储能政策长期利好，南方基金旗下新能源ETF南方(516160)跟踪标的指数昨日收跌1.29%","su":"2026년 11월 19일 거래 마감 현재, 신에너지 ETF(여러 주식을 묶어 파는 상품) Southern(516160)은 거래량 7724.44만 건으로 2.69% 손이 바뀌었고, 추적 기초 지수인 CSI New Energy Index(399808.SZ)는 1.29% 하락했습니다."},{"s":"중개 아침회의 하이라이트: 새로운 에너지 저장 장치 \"15차 5개년 계획\" 시행, 3억 킬로와트, 새로운 시장화 단계 정립","so":"财联社","tm":"11/20 11:28","c":1,"r":"cn","u":"https://www.cls.cn/detail/2537312","p":1795141697,"a":1795158268,"t":"券商晨会精华：新型储能“十五五”方案落地，3亿千瓦锚定市场化新阶段","su":"Huatai Securities는 새로운 에너지 저장을 위한 '15차 5개년 계획'이 구현되었으며 3억 킬로와트가 새로운 시장화 단계를 정립했다고 믿습니다. Zhongtai Securities는 Ciyuan이 새로운 기회를 찾기 위해 해외로 나갈 것이라고 믿습니다. CITIC건설투자는 해외 컴퓨팅파워 투자가 지속적으로 확대될 것으로 보고 27년간 수요 연속성과 공급 납품에 중점을 둘 것이라고 밝혔다. Cailian News Agency는 11월 18일에 시장이 상승한 후 장 후반에 소폭 반등(내렸다가 다시 오르는 것)했다고 보도했습니다. GEM지수는 1% 넘게 하락했다. 이전에는 거의 1% 상승했습니다. 과학기술혁신50지수는 장 초반 3% 이상 상승했다. 상하이·선전 증시 거래액은 1조4600억원으로 전 거래일보다 268억원 감소했다. 전체 시장에서 4,100개 이상의 주식이 하락했고, 거의 80개 주식이 제한 아래에 있었습니다. 시장에서는 테마 회전이 약하고 칩 산업 체인이 활발하며 가전 부문이 반복적으로 활성화되고 화웨이의 컴퓨팅 파워 개념이 부분적으로 강력합니다. 단점으로는 물리 AI 개념이 계속 하락하고 AI 만화 개념이 더 낮아지며 많은 주식이 제한적이라는 것입니다. 장을 마감한 시점에서 상하이 증권거래소 지수는 0.5% 하락했고, 선전 구성요소 지수는 0.49% 하락했으며, 차이넥스트 지수는 1.2% 하락했다."},{"s":"베트남의 새로운 녹색 에너지 스타트업은 자금 부족에 직면해 있습니다. 대만 사업가: 대만의 스마트 에너지 저장 기술이 변화를 도울 것입니다","so":"中央社 CNA","tm":"11/20 10:39","c":1,"r":"tw","u":"https://netzero.cna.com.tw/news/202611200040/","p":1795138743,"a":1795144495,"t":"越南綠能新創陷融資荒 台商：台灣智慧儲能技術有助轉型","su":"베트남은 에너지 전환을 적극적으로 추진하고 있지만 최신 보고서에 따르면 지역 기후 기술 혁신이 심각한 자금 조달(사업에 쓸 돈을 모으는 것) 격차에 빠진 것으로 나타났습니다. 지난해 전체 자금조달 규모는 절반으로 줄었고, 사업확장을 위한 핵심 자금조달도 그대로 사라졌다. 녹색 에너지 야망은 재정적 병목 현상에 직면해 있습니다. 대만 사업가 Chien Chi-ming은 대만이 기후 기술 분야에서 우위를 점하고 있으며 스마트 에너지 저장 기술이 베트남이 새로운 에너지를 촉진하는 데 도움이 될 것이라고 말했습니다."},{"s":"Huatai Securities: 허난성의 새로운 사용 시간 전기 가격 정책에 대한 의견을 구하면 에너지 저장 프로젝트에 이익이 될 수 있음","so":"第一财经","tm":"11/20 10:14","c":1,"r":"cn","u":"https://www.yicai.com/news/103447386.html","p":1795137282,"a":1795144493,"t":"华泰证券：河南分时电价新政征求意见 储能项目或受益","su":"제일재경 2026-11-20 09:12:34 편집자: Tang Yanbei Huatai Securities 연구 보고서에 따르면 허난성 개발 개혁 위원회는 11월 16일 \"우리 성의 산업 및 상업을 위한 사용 시간 전기 가격 정책 최적화 및 개선에 관한 고시\"에 대한 의견을 공개적으로 모집하고 사용 시간 변동 가격에 시스템 운영 비용을 포함하고 송배전 가격을 이전하고 확립할 계획이라고 밝혔습니다. 피크 및 밸리 기간 동안의 연간 동적 조정 메커니즘. 저장(Zhejiang), 산둥(Shandong), 산시(Shaanxi)에 이어 허난(Henan)은 시스템 운영 비용에 대한 사용 시간 가격 책정을 추가로 조사하며, 이는 현지 가격 메커니즘이 에너지 저장 및 충전 비용 상승에 점차적으로 대응하고 있음을 반영합니다. 최저점 기간 동안의 비용 하락은 에너지 저장 운영의 경제성을 향상시킬 것으로 예상됩니다. 최근 국가의 에너지저장장치(전기를 저장해 두는 큰 배터리) 건설 지원 정책과 탄산리튬 가격 하락으로 인해 에너지저장 수요는 더욱 늘어날 것으로 예상된다."},{"s":"Xijiao International(01765)은 5,390만 위안을 지출하여 태국 태양광 발전 설치 및 에너지 저장 솔루션 제공업체의 지분 51%를 인수했습니다.","so":"etnet 經濟通","tm":"11/20 09:19","c":1,"r":"hk","u":"https://www.etnet.com.hk/www/tc/news/news-article.php?section=categorized&category=company&newsid=20261120978","p":1795133940,"a":1795144497,"t":"希教國際(01765)斥5390萬元，收購泰國光伏安裝及儲能解決方案商51%股權","su":"2026/11/20 08:19 Xijiao International Holdings(01765)는 RMB 5,390만 달러를 지출하여 태국의 태양광 발전 설치 및 에너지 저장 솔루션 제공업체의 지분(회사를 나눠 가진 몫) 51%를 인수했습니다. Xijiao International Holdings(01765)는 DINGLI & SF SOLAR ENERGY COMPANY LIMITED의 지분 51%를 RMB 4,614만 달러에 인수했다고 발표했습니다. (약 5,390만 홍콩달러). 그룹은 DINGLI가 태국에 등록된 회사로 태양광 발전 및 기타 신에너지 프로젝트의 설계, 설치, 유지 관리 및 관리뿐만 아니라 에너지 저장 솔루션을 제공하는 회사라고 지적했습니다. 올해 8월말 현재 연간 164만바트의 적자(쓴 돈이 번 돈보다 많은 것)를 냈다. 그룹 측은 이번 인수가 동남아 신재생에너지 분야 진출과 사업영역 확장을 위한 전략적 기회를 제공한다고 밝혔다. 매도인은 Gaoli가 통제하는 법인이고 Gaoli는 그룹의 지배주주이자 전무이사인 Wang Huiwu가 설립한 취소 불가능한 가족 신탁인 Maysunshine Trust의 수혜자 중 한 명이므로 이번 인수는 연결된 거래로 간주되며 독립적인 주주 승인 요건이 면제됩니다."},{"s":"CITIC 증권: 비용 절감 및 이익 증대, 중국 국내 독립 에너지 저장 장치 경제 전환점이 다가오고 있습니다.","so":"Jiemian.com","tm":"11/20 09:16","c":1,"r":"cn","u":"https://m.jiemian.com/article/15352807.html","p":1795133762,"a":1795144494,"t":"中信证券：降本增利，国内独立储能经济性拐点将至","su":"CITIC Securities 연구 보고서에 따르면 2026년부터 새로운 에너지 저장 장치의 비용 측면과 수익 측면이 동시에 압박을 받고 있습니다. 탄산리튬 가격 인상으로 배터리 셀 비용이 증가했고, 시스템 운영비 증가로 매출(물건을 판 돈 전체) 손실이 발생했다. 중국 국내 프로젝트의 전반적인 경제 상황은 압박을 받아왔습니다. 이는 2026년 중국 국내 대용량 스토리지 설치 용량에 어느 정도 영향을 미쳤습니다. CESA에 따르면 2026년 첫 9개월 동안 중국 국내 신규 설치 용량은 111GWh로 전년 대비 87% 증가했다. 현 단계에서는 탄산리튬 가격이 2026년 5월 고점 대비 톤당 10만위안 이상 하락해 배터리 셀 원가도 하락할 여지가 있다. 시스템 운영 비용 공유 메커니즘의 최적화는 새로운 에너지 저장을 위한 \"15차 5개년 계획\"에 기록되었습니다. 중국의 많은 지방에서는 계곡 구간에서 충전할 때 새로운 에너지 저장 장치의 충전 비용을 줄이기 위해 시스템 운영 비용을 시분할 변동에 통합하는 정책을 연속적으로 발표했습니다. 중국의 새로운 국내 에너지 저장 프로젝트의 경제성이 미래에 뚜렷한 한계 개선을 볼 것이라고 판단하고, 새로운 에너지 저장 산업 체인에 대해 낙관적이며, 먼저 혜택을 받을 대규모 에너지 저장 통합업체를 추천하는 데 중점을 두고, 설치 용량 증가로 인한 리튬 배터리 및 재료에 대한 수요 증가에 주의를 기울입니다."},{"s":"라틴 아메리카에서 디젤을 태양광 및 배터리로 교체","so":"POWER Magazine","tm":"11/20 08:50","c":1,"r":"us","u":"https://www.powermag.com/partner-content/replacing-diesel-with-solar-and-batteries-in-latin-america/","p":1795132218,"a":1795132840,"t":"Replacing Diesel With Solar and Batteries in Latin America","su":"화웨이와 태양광 파트너는 원격 라틴 아메리카 지역사회에 전력을 공급하기 위해 디젤을 태양광 및 배터리 저장 장치로 대체하고 있습니다."},{"s":"리튬 기업들은 금속 리튬의 물성을 테스트하고 전고체 배터리 소재를 늘린다.","so":"第一财经","tm":"11/20 08:42","c":1,"r":"cn","u":"https://www.yicai.com/news/103447295.html","p":1795131724,"a":1795132841,"t":"锂企“试水”金属锂 加码固态电池材料","su":"상하이 증권 뉴스에 따르면 전고체 배터리(액체 대신 고체를 넣은 안전한 배터리)는 아직 진행 중이며 리튬 회사는 이미 재료 측면에서 조치를 취했습니다. 최근에는 연간 1,000톤의 고에너지 리튬 배터리 소재를 생산하는 Tianqi Lithium의 배터리급 금속 리튬 프로젝트가 충칭 퉁량구에서 완료되었습니다. 프로젝트가 가동되면 Tianqi Lithium의 총 리튬 금속 생산 능력은 연간 1,600톤으로 증가될 것입니다. 기자는 Tianqi Lithium에서 현재 제품이 샘플 검증을 위해 다운스트림 헤드 배터리 및 고급 합금 고객에게 전송되었다는 사실을 알게 되었습니다. Tianqi Lithium뿐만이 아닙니다. Ganfeng Lithium Industry의 Qinghai 장치는 시험 운전 중입니다. Shengxin Lithium Energy의 초박형 리튬 스트립은 일괄 공급되었습니다. Beterui와 Zhongyi Technology도 음극과 호일의 양쪽 끝에서 금속 리튬까지 확장하고 있습니다. 전고체 배터리 양극의 잠재적으로 중요한 재료로서 금속 리튬은 점차 \"앞줄\"로 밀려나고 있습니다. \"가장 큰 수요는 전고체전지용 리튬금속 음극에서 나올 것으로 예상된다.\" 리튬 배터리 업계에 정통한 사람들은 리튬 금속 양극이 높은 비용량 및 높은 작동 전압과 같은 장점을 갖고 있지만 수지상 결정 성장 및 계면층의 불안정성과 같은 문제는 여전히 해결되어야 한다고 생각합니다."},{"s":"[더벨]한중엔시에스, ESS 수냉식 열관리로 경영혁신 대상 - 머니투데이","so":"머니투데이","tm":"11/20 08:22","c":1,"r":"kr","u":"https://www.mt.co.kr/amp/stock/2026/11/20/2026112008089680830","p":1795130551,"a":1795144493,"su":"에너지저장장치(ESS(전기를 저장해 두는 큰 배터리)) 통합 열관리 솔루션 전문기업 한중엔시에스는 '2026 중소기업 경영혁신 대상'에서 중소벤처기업부 장관상을 수상했다고 20일 밝혔다. 한중엔시에스는 19일 충북 청주 오스코(OSCO)에서 개최된 '2026 중소기업 혁신주간'(K-INNO WEEK) 행사에서 경영혁신 대상 수상기업으로 선정됐다."},{"s":"우에다시의 대규모 축전지 시설 계획, 퍼지는 반대 지역을 포함한 지구 전체에서 결의","so":"信濃毎日新聞デジタル","tm":"11/20 06:01","c":1,"r":"jp","u":"https://www.shinmai.co.jp/news/article/gf01dbvdp5v6q3v49iv1kh4g","p":1795122060,"a":1795128491,"t":"上田市の大規模蓄電池施設計画、広がる反対 地元を含む地区全体で決議","su":"우에다시 오카에서 부상하고 있는 대규모 계통용 축전지 시설의 정비 계획을 둘러싸고, 현지의 오카를 포함한 10자치회에서 만드는 가와니시 지구 자치회 연합회는 19일, 「가와니시 지구 전체에서 계획에 반대한다」라고 결의했다. 대책위원회를 마련해 시나 현에 조례 정비를 요구해 가는 것 외, 전문가를 초대한 공부회 등을 연다. 이날 임시총회에서 결정했다. 사업 계획 \""},{"s":"1차는 삼성SDI, 2차는 SK온…2조원 ESS 수주전, 이번 승부처는?","so":"데일리안","tm":"11/20 06:00","c":1,"r":"kr","u":"https://www.dailian.co.kr/news/view/1717295/1%EC%B0%A8-%EC%82%BC%EC%84%B1SDI-2%EC%B0%A8-SK%EC%98%A82%EC%A1%B0%EC%9B%90-E-2026","p":1795122000,"a":1795175825,"su":"삼성SDI와 SK온이 2조원대로 추산되는 에너지저장장치(ESS(전기를 저장해 두는 큰 배터리)) 수주(일감 주문을 받는 것)전에서 다시 맞붙었다. 이번에 나온 물량은 앞선 두 차례 낙찰분을 합친 것보다 많은데 배터리 공급사는 LG에너지솔루션의 불참으로 두 곳으로 줄었다. 양사가 수익성을 지킬 여지는 커졌지만 배터리를 사들이는 발전사업자들은 여전히 낮은 입찰가를 써내야 유리하다. 삼성SDI와 SK온이 어느 선에서"},{"s":"배터리 구동 공장의 LEGO 스위치","so":"Design and Development Today","tm":"11/20 03:00","c":1,"r":"sg","u":"https://www.designdevelopmenttoday.com/industries/manufacturing/news/22978702/lego-switches-on-batterypowered-factory","p":1795111212,"a":1795128493,"t":"LEGO Switches on Battery-Powered Factory"},{"s":"Yunbao Energy는 친환경 전력, 에너지 저장, AIDC를 통해 AI 인프라 비즈니스 기회를 포착합니다.","so":"UDN","tm":"11/19 18:36","c":1,"r":"tw","u":"https://udn.com/news/story/7252/9889534","p":1795081007,"a":1795089990,"t":"雲豹能源搶攻AI基建商機 綠電、儲能、AIDC三箭齊發","su":"아시아 통합 저탄소 신에너지 그룹 Cloud Leopard Energy(6869)가 자회사 Tianneng Green Power(7842), Taipuwei Energy(7921)와 손잡고 핵심 사업 성장과 AI 인프라 사업 기회에 집중하는 3분기 기업 설명회를 오늘 열었습니다. AI 컴퓨팅 파워에 대한 수요 증가와 에너지 전환 과제에 직면한 Yunbao Energy는 AI 데이터 센터, 저탄소 에너지, 지속 가능한 재활용이라는 세 가지 핵심 비즈니스를 통합하여 그린 컴퓨팅 파워 시장을 적극적으로 공격합니다."},{"s":"'기술적이며 논란의 여지 없음': 뉴질랜드 규제 당국이 배터리 저장 가격 범위 규칙 날짜를 수정함","so":"Energy-Storage.News","tm":"11/19 18:21","c":1,"r":"us","u":"https://www.energy-storage.news/nz-regulator-corrects-bess-price-band-rule-date/","p":1795080062,"a":1795158261,"t":"'Technical and non-controversial': New Zealand regulator corrects battery storage price band rule date"},{"s":"APEC 심천 정상회담 참관: 에너지 저장 회사가 140개국에 현지화된 답변을 제공합니다.","so":"经济观察网","tm":"11/19 17:25","c":1,"r":"cn","u":"http://www.eeo.com.cn/2026/1119/1097234.shtml","p":1795076751,"a":1795089980,"t":"APEC深圳峰会观察：一家储能公司的140国本地化答卷","su":"2026년 APEC 비즈니스 리더스 서밋은 '아시아태평양 에너지 공동체' 공동 건설이 처음 제안된 선전에서 개최될 예정이다. 선전에서 출발한 에너지 저장 기업인 Zhenghao EcoFlow는 140개국을 포괄하는 '1지역, 1정책' 현지화 실천으로 이에 대응했습니다."},{"s":"시플리(Shipley) 전 뉴질랜드 총리: 중국의 광전지 에너지는 글로벌 에너지 전환에 핵심적인 지원을 제공합니다","so":"中国新闻网","tm":"11/19 17:22","c":1,"r":"cn","u":"https://www.chinanews.com.cn/cj/2026/11-19/10734697.shtml","p":1795076529,"a":1795089982,"t":"新西兰前总理希普利：中国光伏储能为全球能源转型提供关键支撑","su":"시플리(Shipley) 전 뉴질랜드 총리: 중국의 태양광 에너지 저장 장치는 글로벌 에너지 변혁을 위한 핵심 지원을 제공합니다 중국 뉴스 서비스, 청두, 11월 19일(Wang Liwen) \"중국은 다양한 국가에 제품을 제공할 뿐만 아니라 에너지 인프라가 부족한 개발도상국이 태양광 발전 및 에너지 저장 장치를 신속하게 배치할 수 있도록 지원하는 등 글로벌 태양광 산업에서 큰 역할을 하고 있습니다.\" 뉴질랜드 전 총리이자 아시아 보아오 포럼 자문위원회 위원인 제니 시플리(Jenny Shipley)는 청두에서 열린 인터뷰에서 이렇게 말했습니다. 2026년 11월 17일부터 20일까지 제9회 국제 태양광 및 에너지 저장 산업 컨퍼런스가 청두에서 개최되었습니다. 세계에서 가장 완벽한 태양광 및 에너지 저장 산업 체인을 보유한 국가인 중국 기업이 어떻게 개발 배당(회사가 주주에게 나눠주는 돈)금을 세계와 공유하고 업계 과제에 대응하는지가 이번 컨퍼런스의 초점이 되었습니다."},{"s":"제9회 국제 태양광 및 에너지 저장 산업 회의에서 총 금액 535억 위안의 태양광 및 저장 프로젝트가 체결되었습니다.","so":"Jiemian.com","tm":"11/19 17:01","c":1,"r":"cn","u":"https://www.jiemian.com/article/15351035.html","p":1795075285,"a":1795089984,"t":"总金额535亿元，第九届国际光伏与储能产业大会上光储项目集中签约","su":"원본 뉴스 Xi Jinghua · 출처: Jiemian News 11월 19일 Jiemian News는 2026년 제9차 중국 국제 태양광 및 에너지 저장 산업 컨퍼런스에서 회의 기간 동안 정부와 기업이 여러 차례 도킹을 진행했으며 총 535억 위안에 달하는 협력 프로젝트가 집중적으로 체결되었다는 사실을 알게 되었습니다. 투자 레이아웃은 태양광 발전, 다양한 에너지 저장 장치, 새로운 배터리, 핵심 장비 및 스마트 에너지를 포함한 전체 광 저장 산업 체인을 포괄합니다."},{"s":"10월 중국 전력 및 에너지 저장 배터리 판매량은 전월 대비 3.4% 증가","so":"中证网","tm":"11/19 17:00","c":1,"r":"cn","u":"https://jnzstatic.cs.com.cn/zzb/htmlInfo/138705.html","p":1795075200,"a":1795158269,"t":"10月我国动力和储能电池销量环比增长3.4%","su":"10월 중국 전력 및 에너지 저장 배터리 판매량은 전월 대비 3.4% 증가했습니다. Li Xianfei CSI Taurus 11월 19일 중국 자동차 전력 배터리 산업 혁신 연합이 발표한 자료에 따르면 10월 중국 전력 및 에너지 저장 배터리 판매량은 230.4GWh로 전월 대비 3.4%, 전년 대비 38.8% 증가했습니다. 이 중 동력전지 판매량은 159.3GWh로 전체 판매량의 69.1%를 차지해 전월 대비 6.7%, 전년 동기 대비 28.1% 증가했다. 에너지저장전지 매출(물건을 판 돈 전체)액은 71.1GWh로 전체 매출액의 30.9%를 차지했으며, 전월 대비 3.3% 감소, 전년 동기 대비 70.5% 증가했다. 1월부터 10월까지 중국의 전력 및 에너지 저장 배터리 판매량은 1912.1GWh로 전년 대비 55.1% 증가했습니다. 그 중 동력전지 판매량은 1245.6GWh로 전체 판매량의 65.1%를 차지해 전년 대비 36.8% 증가했다. 에너지저장전지 판매량은 666.4GWh로 전체 매출의 34.9%를 차지해 전년 대비 106.5% 증가했다."},{"s":"Waaree Energies 암백, 배터리 저장 프로젝트를 위한 NTPC 주문 ₹100 crore 이상","so":"ET EnergyWorld","tm":"11/19 16:34","c":1,"r":"us","u":"https://energy.economictimes.indiatimes.com/news/renewable/waaree-energies-arm-bags-over-100-crore-ntpc-order-for-battery-storage-project/135981546","p":1795073683,"a":1795089979,"t":"Waaree Energies arm bags over ₹100 crore NTPC order for battery storage project","su":"Waaree Energies의 자회사인 Waaree Transpower는 NTPC로부터 ₹100 crore 상당의 주문을 확보하여 배터리 에너지 저장 부문에서 중요한 이정표를 세우고 인도의 재생 가능 전력 인프라를 강화했습니다."},{"s":"노르딕 3국과 친환경 배터리 미래 논의…전주서 국제 콘퍼런스","so":"연합뉴스","tm":"11/19 15:24","c":1,"r":"kr","u":"https://www.yna.co.kr/view/AKR20261119123600055","p":1795069477,"a":1795071803,"su":"(전주=연합뉴스) 임채두 기자 = 전북특별자치도는 19일 전주 더메이 호텔에서 노르딕 3국(핀란드·스웨덴·노르웨이)과 국내의 배터리 산업 관계자..."},{"s":"니치콘과 중부 전력계, 가정용 축전지 제어로 연계 실적으로 포인트 부여","so":"日本経済新聞","tm":"11/19 14:47","c":1,"r":"jp","u":"https://www.nikkei.com/article/DGXZQOUF192PY0Z11C26A1000000/","p":1795067238,"a":1795071805,"t":"ニチコンと中部電力系、家庭用蓄電池制御で連携 実績でポイント付与","su":"니치콘과 중부전력 자회사 중부전력 미라이즈는 19일 가정용 축전지의 원격조작 서비스를 시작했다고 발표했다. 니치콘제의 축전지를 대상으로 전력의 수급 상황에 따라 충방전을 자동으로 제어한다. 계절이나 날씨로 발전량이 바뀌는 재생 가능 에너지의 유효 활용에 연결한다. 중부 전력 미라이즈는 가정용 축전지로 전력 수급의 밸런스를 조정하는 디맨드 리스폰스(DR) 서비스"},{"s":"Enli Power 난징 전고체 배터리 R&D 센터 및 파일럿 기지 완공 및 개장","so":"Jiemian.com","tm":"11/19 14:40","c":1,"r":"cn","u":"https://www.jiemian.com/article/15350270.html","p":1795066855,"a":1795071803,"t":"恩力动力南京固态电池研发中心与中试基地落成启用","su":"11월 19일, Enli Power Nanjing 전고체 배터리(액체 대신 고체를 넣은 안전한 배터리) R&D 센터와 파일럿 기지가 완공되어 난징 장베이 신구에 문을 열었습니다. 신제품 출시 세션에서 Enli Nanjing 고체 배터리 연구소 전무이사 황 Fei는 리튬 금속 준고체 배터리 'ENLi Sky Ultra' 시리즈와 저고도 경제를 위한 새로운 음극 리튬 금속 배터리 셀을 출시했습니다. Enli Power Research Institute의 Wu Zhongyou 사장은 높은 특정 에너지의 엄격한 수요 시나리오에 초점을 맞춘 전고체 제품인 전고체 배터리 \"ENLI Interstellar\" 시리즈를 출시했습니다."},{"s":"녹색 배터리가 붙어 있습니까? Lai Jianxin은 유럽 비즈니스 조언에 응답합니다: GDP가 11%를 초과하고 풍력, 태양광 발전 및 에너지 저장이 동시에 발전하고 있습니다.","so":"鉅亨網","tm":"11/19 14:39","c":1,"r":"tw","u":"https://news.cnyes.com/news/id/6667409","p":1795066758,"a":1795071804,"t":"綠電卡關？賴建信回應歐商建言：GDP拚破11% 風電光電與儲能3頭並進","su":"Lai Jianxin은 유럽 상공회의소의 제안에 응답하여 풍력, 태양광 발전, 전력망 및 에너지 저장 장치 건설을 가속화하는 것이 정부의 2차 에너지 전환 방향과 일치한다고 말했습니다.\n그는 지난해 경제성장률이 8.76%에 달했고 올해 회계감사원에서는 11%를 넘을 것으로 추산했다고 지적했다. 반도체(전자기기의 두뇌 부품)와 AI 산업은 친환경 전력에 대한 수요가 시급하다.\n경제부는 계속해서 지방 정부, 공공 및 민간 당사자와 협력하여 행정적 장애물을 제거하고 유럽 상공회의소와의 커뮤니케이션을 유지하여 정책 투명성을 촉진할 것입니다."},{"s":"\"에너지 저장 장치 1호\"에서 \"원천 저장 장치 1호\"로: Shaangu 장비는 300MW 인공 챔버 압축 공기 에너지 저장 발전소를 지원합니다.","so":"新华网","tm":"11/19 12:26","c":1,"r":"cn","u":"http://www.sn.xinhuanet.com/20261119/61a80360a2344f19a6a34805647d789b/c.html","p":1795058807,"a":1795089986,"t":"从“能储一号”到“源储一号”：陕鼓装备支撑300兆瓦人工硐室压缩空气储能电站","su":"\"에너지 저장 장치 1호\"에서 \"원 저장 장치 1호\"로: Shaangu 장비가 300MW 인공 챔버 압축 공기 에너지 저장 발전소를 지원 - 11월 16일, 300MW 인공 챔버 압축 공기 에너지 저장 발전소 실증 프로젝트 \"원 저장 장치 1호\"가 간쑤성 주취안에서 전기를 생산하기 위해 그리드에 성공적으로 연결되었습니다. Xi'an Shaangu Power Co., Ltd.는 이 프로젝트의 핵심 압축기 장치를 제공했습니다."},{"s":"수자원 계획 연구소 수석 전문가 Jiang Hao와의 단독 인터뷰: 중국의 해외 에너지 저장은 제품 수출에서 서비스 수출로 이동하고 있습니다.","so":"21财经","tm":"11/19 11:52","c":1,"r":"cn","u":"https://www.21jingji.com/article/20261119/herald/45d510c58dcb2d415de8f2de4c936e27.html","p":1795056720,"a":1795058053,"t":"专访水规院首席专家姜昊：中国储能出海正从产品出口迈向服务输出","su":"21세기 비즈니스 헤럴드 기자 Lei Ye와 Li Deshangyu가 안탈리아에서 보도했습니다. 현재 글로벌 에너지 전환은 가속화되고 구현으로 전환되고 있습니다. 새로운 전력 시스템의 핵심 지원 장치인 에너지 저장 장치는 에너지 전환을 촉진하는 데 중요한 역할을 합니다. 터키 안탈리아에서 열린 제31차 유엔기후변화협약 당사국 총회(COP31)에서 수력 및 물 보존 계획 및 설계 종합 연구소, 중관촌 에너지 저장 산업 기술 연합, 중국 남부 전력망 에너지 저장 유한 회사는 개방적이고 포괄적인 국제 협력 플랫폼 구축을 목표로 국내외 여러 기업과 함께 글로벌 에너지 저장 연합 이니셔티브(이하 'GESA')를 공동 출범시켰습니다."},{"s":"보도자료 : 축전지의 운용이라면 맡겨주세요! WATT-TUNE과 RENON POWER가 업무 제휴에! (PR TIMES)","so":"毎日新聞","tm":"11/19 09:22","c":1,"r":"jp","u":"https://mainichi.jp/articles/20261119/pr2/00m/020/007000c","p":1795047765,"a":1795058065,"t":"プレスリリース：蓄電池の運用なら任せてください！WATT-TUNEとRENON POWERが業務提携へ！（PR TIMES）","su":"JC-STAR★1 취득에 이어, RENON POWER가 「수급 조정 시장 전용 모델」(133kWh)을 연내에 개발 완료 예정. 판매는 REVIX JAPAN, 운용은 EPRX 거래 회원의 WATT-TUNE이 담당하는 WATT-TUNE 주식회사(본사: 도쿄도 미나토구, 대표 이사: 이토카와 카츠히로)는, 미국발의 축전지 메이커"},{"s":"CITIC Securities: 중국의 국내 에너지 저장 장치 설치에 대한 수요 증가와 선도 기업의 개발 기회에 대해 계속 낙관적이었습니다.","so":"第一财经","tm":"11/19 09:02","c":1,"r":"cn","u":"https://www.yicai.com/news/103445850.html","p":1795046578,"a":1795058058,"t":"中信证券：持续看好国内储能装机需求增长及头部企业的发展机会","su":"CITIC 증권 연구 보고서에 따르면 11월 13일 국가발전개혁위원회와 국가 에너지청은 공동으로 '15차 5개년 계획 신에너지 저장 구현 계획'을 발표했으며, 이 계획에서는 2030년에 새로운 에너지 저장 장치 설치 용량이 300GW에 도달하고 평균 에너지 저장 시간은 약 3시간에 달할 것이라고 밝혔으며, 시스템 운영 비용 공유 방법을 연구 및 최적화하고 나트륨 이온 배터리(리튬 대신 소금 성분을 쓰는 배터리) 에너지 저장의 적용을 촉진할 것을 제안했습니다. CITIC 증권은 이 정책의 세 가지 주요 하이라이트가 있다고 믿습니다. 1) 300GW 설치 용량 목표는 최소 목표이며, 에너지 저장 기간의 증가로 수요 공간이 더욱 확대될 것으로 예상됩니다. 2) 시스템 운영비 개혁이 국가 계획 수준으로 올라갔고, 후속 지방 정책의 시행이 가속화되어 독립 에너지 저장의 경제성이 지속적으로 개선될 것으로 예상됩니다. 3) 나트륨이온전지의 에너지 저장 응용에 대한 명확한 '홍보'는 기술 상용화 가속화의 신호탄을 제시하며 나트륨 전기에너지 저장 규모의 급속한 성장을 촉진할 것으로 기대된다. 용량 전기 가격 메커니즘의 개선과 시스템 비용의 하락과 함께 CITIC 증권은 중국 내 국내 에너지 저장 장치에 대한 수요 증가와 선도 기업의 개발 기회에 대해 계속 낙관하고 있습니다."},{"s":"[스타트UP] 델타엑스 “소프트뱅크 ESS 생태계 파트너 선정…세계 에너지 시장 공략”","so":"Chosunbiz","tm":"11/19 06:04","c":1,"r":"kr","u":"https://biz.chosun.com/industry/business-venture/2026/11/19/AB263HUQ7JDXBAB4A5T6BI2GSQ/","p":1795035844,"a":1795041997,"su":"스타트UP 델타엑스 소프트뱅크 ESS(전기를 저장해 두는 큰 배터리) 생태계 파트너 선정세계 에너지 시장 공략 SBA 서울창업허브 지원기업 김수훈 델타엑스 대표 ESS 설계, 제조, 부품 공급까지 2028년 매출(물건을 판 돈 전체) 2500억 목표"},{"s":"SK온 대만 1.2GWh ESS 수주전 뛰어든다…12월 입찰 - 머니투데이","so":"머니투데이","tm":"11/19 05:50","c":1,"r":"kr","u":"https://www.mt.co.kr/index.php/amp/industry/2026/11/19/2026111813284883136","p":1795035000,"a":1795041997,"su":"미국 에너지 기업 GE버노바(GE Vernova), 대만 ESS(전기를 저장해 두는 큰 배터리) 기업 씨텔(Seetel)과의 첫 공동 사업을 통해 비중국산 배터리 수요가 높은 대만 공공 ESS 시장을 공략하고 향후 미국과 일본 등 글로벌 시장으로 협력 범위를 확대할 계획이다."},{"s":"테슬라는 에너지 저장에서 전원 공급으로 이동, Powercore는 AI 데이터 센터를 목표로 합니다.","so":"鉅亨網","tm":"11/19 02:01","c":1,"r":"tw","u":"https://news.cnyes.com/news/id/6666736","p":1795021290,"a":1795041998,"t":"特斯拉從儲能跨向供電Powercore瞄準AI資料中心","su":"테슬라는 에너지 저장에서 전원 공급 장치로 이동, Powercore는 AI 데이터 센터를 목표로 합니다. Uanalyze 2026년 11월 19일(Uanalyze/산업 데이터 센터 보고서) ⸺ 테슬라(TSLA-US)의 에너지 사업은 에너지 저장 배터리를 판매할 뿐만 아니라 AI 데이터 센터 전원 공급 장치 장비를 배치하기 시작합니다. 회사는 2027년 출시 예정인 전력 변환 제품인 파워코어(Powercore)를 출시했다. 메가팩 에너지 저장 시스템과 함께 배터리, 전력망, 데이터센터(컴퓨터 수만 대를 모아 둔 건물)를 직렬로 연결해 800V DC 전원공급장치 사업 기회를 잡을 수 있다. Powercore는 반도체(전자기기의 두뇌 부품) 부품을 사용하여 전기를 변환하고 원래 여러 장치에 분산되어 있던 기능을 통합하는 고체 변압기입니다. AI 서버의 전력 소비가 증가함에 따라 데이터 센터에서는 800V DC 아키텍처를 도입하기 시작했으며 Powercore는 이러한 유형의 전원 공급 수요를 충족하도록 설계되었습니다."},{"s":"닝샤는 새로운 에너지 토지 안보 구조를 최적화하고 에너지 저장 지원 시설로 요소 공급을 기울입니다.","so":"中国新闻网","tm":"11/18 22:13","c":1,"r":"cn","u":"https://www.chinanews.com.cn/cj/2026/11-18/10734351.shtml","p":1795007580,"a":1795007776,"t":"宁夏优化新能源用地保障结构 要素供给向储能配套倾斜","su":"닝샤는 신에너지 토지 안보 구조를 최적화하고 에너지 저장 지원 시설에 요소 공급을 기울입니다 중국 뉴스 서비스 인촨, 11월 18일(유징 기자) 18일 기자는 닝샤 회족 자치구 천연자원부로부터 올해부터 닝샤가 토지 요소를 정확하게 할당하여 태양광, 풍력, 신에너지 등 신에너지 프로젝트의 구현을 보장하기 위해 토지 및 공간 계획에 의존해 왔다는 사실을 알게 되었습니다. 저장. 토지 안보의 초점은 점차적으로 새로운 에너지 시스템 구축을 지원하기 위한 에너지 저장과 같은 산업 체인의 핵심 링크로 옮겨졌습니다. 10월 말 현재 닝샤는 태양광 프로젝트용 토지 187.2에이커, 풍력 프로젝트용 토지 625.9에이커, 에너지 저장 프로젝트용 토지 3,232.7에이커를 포함해 태양광, 풍력, 에너지 저장 및 기타 신에너지원을 위한 총 4,045.8에이커의 신규 건설 토지를 확보했습니다. 또한 송전 및 변전 지원 프로젝트를 위해 833에이커의 토지를 확보했습니다. 2025년 같은 기간에 비해 태양광 및 풍력 발전 토지의 규모는 질서있게 감소하고 토지 이용 구조는 지속적으로 최적화되고 있습니다."},{"s":"보도자료 : SEETEL Group · AUROSI, \"저압 축전지 시스템\"판매 개시 (PR TIMES)","so":"毎日新聞","tm":"11/18 16:53","c":1,"r":"jp","u":"https://mainichi.jp/articles/20261118/pr2/00m/020/729000c","p":1794988389,"a":1795003488,"t":"プレスリリース：SEETEL Group・AUROSIが「低圧蓄電池システム」の販売を開始（PR TIMES）","su":"～EMS・축전 시스템・PCS를 일체로 제공～ AUROSI 통합형 축전지 시스템 ENSO NEW ENERGY(화희 신능원 합동회사)는, 대만의 그룹 회사인 AUROSI가 개발한 「AUROSI 저압 축전지 시스템」의 일본 시장에서의 판매를 개시합니다. 본 제품은 삼상 삼선"},{"s":"[단독] \"中배터리도 몰려온다\"…'CATL' 이어 '고션'도 韓ESS 시장 상륙 채비","so":"뉴시스","tm":"11/18 16:36","c":1,"r":"kr","u":"https://mobile.newsis.com/view_amp.html?ar_id=NISX20261118_0003873346","p":1794987417,"a":1795003482,"su":"[서울=뉴시스]남주현 이창훈 기자 = 글로벌 전기차 배터리 시장 점유율 4위인 중국 고션하이테크(Gotion High-Tech)가 서울 근무 영업 인력 채용에 나서며 국내 에너지저장장치(ESS(전기를 저장해 두는 큰 배터리)) 시장 진출을 준비하고 있다"},{"s":"보도자료 : 에코 스타일, 저압 계통용 축전소의 「기기 패키지」(킷 판매) 제공 개시~최신 연계 규격 대응・선택할 수 있는 3 메이커・200kWh/100kWh(1,300만엔/950만엔~・세금 별도)~(PR TIMES)","so":"毎日新聞","tm":"11/18 13:23","c":1,"r":"jp","u":"https://mainichi.jp/articles/20261118/pr2/00m/020/455000c","p":1794975795,"a":1794985260,"t":"プレスリリース：エコスタイル、低圧系統用蓄電所の「機器パッケージ」（キット販売）提供開始～最新連系規格対応・選べる3メーカー・200kWh／100kWh（1,300万円／950万円～・税抜）～（PR TIMES）","su":"태양광 발전 개발 사업을 핵심으로 재생 가능 에너지의 보급 촉진을 전개하는 주식회사 에코 스타일(대표 이사 사장 집행 임원:키노시타 공귀, 본사:오사카시 주오구, 이하 “에코 스타일”)은, EPC(설계·조달·건설)·시공 회사 및 발전 사업자용으로, 저압 계통용 축전소에 필요한 부재 일"},{"s":"Yiwei Lithium Energy, AI 에너지 기반 36氪 구축을 위한 AIDC 전체 시나리오 에너지 저장 솔루션 출시","so":"www.36kr.com","tm":"11/18 12:39","c":1,"r":"cn","u":"https://www.36kr.com/newsflashes/4074714789155716","p":1794973158,"a":1794985258,"t":"亿纬锂能首发AIDC全场景储能解决方案，构筑AI能源底座-36氪","su":"현지 시간 11월 17일, Yiwei Lithium Energy는 RE+2026에서 소스 네트워크 측면, 배전 측면 및 랙 측면을 포괄하는 AIDC 전체 시나리오 에너지 저장 솔루션을 출시했습니다. 20피트 5MWh 1P 고전력 에너지 저장 시스템, 전용 주파수 변조 셀, 6.9MWh 에너지 저장 시스템, 초고속 BBU+CBU, Pandun 6C/10C 백업 전원 캐비닛 및 하이브리드 슈퍼커패시터가 포함됩니다. 회사 측은 풀시나리오 솔루션으로 AI 시대를 위한 에너지 기반을 구축하겠다고 밝혔다."},{"s":"전고체 배터리로 '체인 보충' 가속화 Tianqi Lithium의 연간 1,000톤 리튬 금속 프로젝트 완료","so":"财联社","tm":"11/18 11:30","c":1,"r":"cn","u":"https://www.cls.cn/detail/2534227","p":1794969013,"a":1795007777,"t":"固态电池加速“补链” 天齐锂业年产1000吨金属锂项目竣工","su":"① Tianqi Lithium의 연간 1,000톤 고에너지 리튬 배터리급 금속 리튬 프로젝트 생산이 완료되었으며, 해당 제품은 현재 샘플 테스트를 위해 다운스트림 헤드 배터리 및 고급 합금 고객에게 보내지고 있습니다. ② 실리콘카본과 금속리튬이 양극재 반복적용의 핵심 루트가 되면서 전고체전지의 산업화가 가속화되고 있다. 차이롄서, 11월 13일(유멍란 기자) 전고체전지 산업화는 소재체계 전반의 조화로운 지원과 불가분의 관계다. Cailian News의 기자는 Tianqi Lithium Industry(002466.SZ)로부터 연간 1,000톤의 고에너지 리튬 배터리 소재를 생산하는 회사의 배터리급 금속 리튬 프로젝트가 최근 충칭 퉁량구에서 완료되었다는 소식을 들었습니다. 회사 관계자는 오늘 차이롄서 기자들에게 제품이 샘플 검증을 위해 다운스트림 헤드 배터리 및 고급 합금 고객에게 보내졌으며 제품 품질 및 생산 공정이 고객 요구에 따라 계속 최적화되고 제품 시장 적용이 꾸준히 추진될 것이라고 말했습니다."},{"s":"엠플러스, 삼성SDI 혁신기술 경진대회 대상 수상","so":"디일렉","tm":"11/18 11:04","c":1,"r":"kr","u":"https://www.thelec.kr/news/articleView.html?idxno=65596","p":1794967482,"a":1794972181,"su":"엠플러스가 삼성SDI 혁신기술 경진대회에서 각형 배터리 캔캡 레이저 용접 기술로 대상을 수상했다.엠플러스는 18일 삼성SDI가 주최한 'S-NOVA'에서 최고상을"},{"s":"디와이덕양 \"사용후 배터리 ESS 신사업 속도\"","so":"뉴시스","tm":"11/18 10:47","c":1,"r":"kr","u":"https://mobile.newsis.com/view_amp.html?ar_id=NISX20261118_0003872840","p":1794966471,"a":1794985257,"su":"[서울=뉴시스] 김경택 기자 = 디와이덕양은 전기차 사용후 배터리를 활용한 에너지저장장치(ESS(전기를 저장해 두는 큰 배터리)) 신사업에 속도를 내고 있다고 18일 밝혔다"},{"s":"축전지 개발 용지는 데이터 센터로 향하는가? BLUEHOUR, '데이터 센터 전용 전망' 시작","so":"株式会社共同通信社","tm":"11/18 10:30","c":1,"r":"jp","u":"https://www.kyodo.co.jp/pr/2026-11-18_4049927/","p":1794965400,"a":1794972183,"t":"蓄電池の開発用地はデータセンターに向くか。BLUEHOUR が「データセンター転用の見立て」を開始","su":"답변서와 용지의 조건으로부터 정해진 형태로 추론. 협력 파트너 5사는 무료. 사고 싶은 조건의 등록도 개시 2026년 11월 18일 RIA PARTNERS 주식회사 RIA PARTNERS 주식회사"},{"s":"20개 이상의 상장 기업이 AIDC 에너지 저장 트랙에 집중적으로 진입했습니다.","so":"中证网","tm":"11/18 10:04","c":1,"r":"cn","u":"https://www.cs.com.cn/ssgs/01/2026/11/18/detail_2026111810052927.html","p":1794963840,"a":1795046345,"t":"20余家上市公司密集入局AIDC储能赛道"},{"s":"Linxon과 Fluence, 통합 에너지 저장 제공을 발전시키기 위해 전략적 협력 체결","so":"Financial Times","tm":"11/18 03:06","c":1,"r":"world","u":"https://markets.ft.com/data/announce/detail?dockey=600-202611171306PR_NEWS_USPRX____HS00394-1","p":1794938760,"a":1794955480,"t":"Linxon and Fluence form Strategic Collaboration to advance integrated energy storage delivery"},{"s":"Avantus는 대규모 에너지 저장 장치와 결합된 800MW의 태양광 발전을 위해 PG&E와 20년 전력 구매 계약을 체결했습니다.","so":"鉅亨網","tm":"11/18 02:31","c":1,"r":"tw","u":"https://news.cnyes.com/news/id/6665618","p":1794936665,"a":1794955478,"t":"Avantus與PG&E簽20年購電協議800MW太陽能搭配大型儲能","su":"Avantus는 800MW의 태양광 발전 및 대규모 에너지 저장을 위해 PG&E와 20년 전력 구매 계약을 체결했습니다. Uanalyze 2026년 11월 18일(Uanalyze/산업 데이터 센터 보고서) ⸺ Avantus는 캘리포니아주 Kern 카운티의 Buttonbush 1A 및 1B 프로젝트에서 총 800MW의 태양광 발전과 3,200MWh의 배터리 에너지 저장 장치를 제공하는 Pacific Gas & Electric(PG&E)과 20년 전력 구매 계약을 체결했다고 발표했습니다. 이 계약은 여전히 캘리포니아 공공사업위원회(CPUC)의 승인을 받아야 합니다. 두 프로젝트는 2027년 착공, 2029년 상업 이전이 예정돼 있다. 아반투스는 인프라 투자 규모를 약 30억 달러로 추산하고, 프로젝트 부지를 보유·운영할 계획이다. 에너지 저장 장비는 낮 동안 태양 에너지를 이동하여 저녁에 전력을 공급하고 다른 시간에는 캘리포니아 전력망의 요구 사항을 지원할 수 있습니다."},{"s":"스웨덴 에너지 대기업 Vattenfall은 독일의 배터리 및 재생 가능 자산 관리를 위해 Kraken을 선택했습니다.","so":"Data Center Dynamics","tm":"11/18 02:29","c":1,"r":"us","u":"https://www.datacenterdynamics.com/en/news/swedish-energy-giant-vattenfall-selects-kraken-to-manage-battery-and-renewable-assets-in-germany/","p":1794936558,"a":1794955473,"t":"Swedish energy giant Vattenfall selects Kraken to manage battery and renewable assets in Germany","su":"Vattenfall의 BESS(전기를 저장해 두는 큰 배터리) 및 재생 가능 자산 전반에 걸쳐 클라우드 기반 제어 계층을 제공합니다."},{"s":"중국의 신에너지 자동차 배터리가 대규모 '퇴역' 단계에 진입하고 있다. 우리는 무엇을 해야 합니까? 상무부가 말하다","so":"ThePaper.cn","tm":"11/17 23:45","c":1,"r":"cn","u":"https://www.thepaper.cn/newsDetail_forward_34494842","p":1794926700,"a":1794955475,"t":"我国新能源车电池正进入规模化“退役”阶段，怎么办？商务部发声","su":"\"현재 중국의 신에너지 자동차 동력 배터리는 대규모 폐기 단계에 진입하고 있으며 태양광 모듈과 풍력 터빈 블레이드도 폐기의 정점에 도달할 것입니다. 최근 몇 년 동안 '신 3종' 고형 폐기물 재활용 시스템이 구체화되기 시작했으며 기본적으로 정책 프레임워크가 형성되었습니다."},{"s":"Minebea Mitsumi는 축전지 보호 모듈의 실증 사업 AI 데이터 센터 용 필리핀에서","so":"信濃毎日新聞デジタル","tm":"11/17 22:27","c":1,"r":"jp","u":"https://www.shinmai.co.jp/news/article/gf01dbu2v7gvbt4um9ig9ndg","p":1794922020,"a":1794955479,"t":"ミネベアミツミが蓄電池保護モジュールの実証事業 AIデータセンター向け、フィリピンで","su":"미네베아 미츠미(기타사쿠군 미요다초)는 17일 AI(인공지능) 데이터 센터의 축전지 보호 모듈에 관한 실증 사업을 필리핀에서 실시한다고 발표했다. 글로벌 사우스(신흥·도상국)와의 경제 연계를 강화하기 위해 일본 기업이 실시하는 실증 사업을 보조하는 경제산업성 사업 채택을 받았다. …"}]},{"name":"🏭 AI 전력","note":"보유: ACE 코리아AI전력TOP10","breaking":false,"items":[{"s":"경남도, 두산에너빌리티와 SMR 글로벌 생산거점 육성 협력","so":"아시아투데이","tm":"11/19 17:41","c":15,"r":"kr","u":"https://www.asiatoday.co.kr/kn/view.php?key=20261119010007776","p":1795077714,"a":1795090005,"su":"경남도가 두산에너빌리티의 소형모듈원자로(SMR) 사업 확대를 지역 투자와 일자리 창출로 연결하기 위한 협력에 나섰다. 박완수 지사는 19일 도청에서 송용진 두산에너빌리티 신임 최고운영책임자 :1795158279,"su":"(창원=연합뉴스) 박영민 기자 = 조합원 1천300여명이 전면 파업 중인 효성중공업 사무기술직 노동조합이 사측의 올해 임금·단체협약(임단협) 1..."},{"s":"미국 상원, 데이터 센터가 전력망 업그레이드 비용을 지불하도록 요구하는 에너지 라이센스 개혁 법안 통과","so":"UDN","tm":"11/20 15:47","c":2,"r":"tw","u":"https://udn.com/news/story/6813/9891393","p":1795157241,"a":1795158281,"t":"美參院通過能源許可改革法案 資料中心須自付電網升級","su":"미국 상원은 오늘 대규모 에너지 및 인프라 건설에 대한 검토를 가속화하고 데이터 센터가 자체 전력 비용을 지불하도록 요구하는 에너지 라이센스 개혁 법안을 정당 전체에서 통과시키기 위해 62대 33으로 투표했습니다."},{"s":"Liu Wenxiong: 업계에는 다양한 분야에 걸쳐 T자형 인재가 필요합니다. 전력안정을 위해서는 재정적 지원이 필요하다 | 산업경제학","so":"中央社 CNA","tm":"11/20 15:11","c":2,"r":"tw","u":"https://www.cna.com.tw/news/afe/202611200106.aspx","p":1795155060,"a":1795158283,"t":"劉文雄：產業需跨領域T型人才電力穩定度需資金支持| 產經","su":"Power Grid 인재 개발 연합 장학금 및 Liu Shusheng 기념상 시상식이 오늘 거행되었습니다. 대만전력에너지공학협회 명예회장 Liu Wenxiong은 전기가 인공지능(AI) 컴퓨팅 능력을 뒷받침할 뿐만 아니라 산업 발전의 핵심이라고 말했습니다. 앞으로는 전문적 역량과 크로스필드 역량을 모두 갖춘 'T형 인재'가 필요하다. 그는 추모상과 장학금을 통해 더 많은 우수한 인재들이 전력산업에 진출할 수 있기를 기대하고 있다."},{"s":"글로벌 데이터 센터의 전력 소비는 2030년까지 두 배로 늘어날 수 있습니다.","so":"工商時報","tm":"11/20 04:00","c":2,"r":"tw","u":"https://www.ctee.com.tw/news/20261120700130-439901","p":1795114800,"a":1795128514,"t":"2030全球資料中心用電恐翻倍- 日報","su":"국제 에너지 기구(IEA)는 전 세계 데이터 센터의 전력 소비가 2030년까지 두 배로 증가해 연간 약 1,000테라와트시(TWh)에 도달해 다양한 국가의 전원 공급 장치와 그리드에 큰 부담을 줄 것이라고 경고했습니다. 부족한 전력 인프라와 공급망(부품·재료가 오가는 연결망) 긴장, 지역사회의 반대로 인해 새로운 데이터 센터 건설이 지연될 수 있습니다. IEA는 세계 에너지 전망 2026의 \"명시된 정책 시나리오\"(STEPS)에서 이 보고서를 제안했습니다."},{"s":"AI 인프라 급증, 전력망 부족, IEA는 4년 안에 탄소 배출량이 70% 증가할 것으로 예상 | 글로벌 금융 | 글로벌","so":"UDN","tm":"11/20 03:44","c":2,"r":"tw","u":"https://udn.com/news/story/6811/9890045","p":1795113854,"a":1795128507,"t":"AI基建激增電網吃緊IEA預期四年後碳排增七成| 全球財經| 全球","su":"국제에너지기구(IEA)는 인공지능(AI) 데이터센터(컴퓨터 수만 대를 모아 둔 건물)에 대한 투자 급증이 전 세계 전력망을 압도할 수 있다고 경고했다. IEA는 또 일부 국가들이 액화천연가스(LNG) 생산 확대를 위해 투자했지만 중동 전쟁으로 인해 아시아가 외부 에너지 의존에 점점 더 조심스러워지고 있어 변수가 커질 수 있다고 밝혔다."},{"s":"전력 수요가 새로운 성장주기에 진입, Fubon Investment Consulting, 대만 공장 5개 선정","so":"UDN","tm":"11/19 15:56","c":2,"r":"tw","u":"https://udn.com 을 확충한다."},{"s":"Peng Qiming: 대만의 탄소 감소는 글로벌 AI 탄소 감소입니다. Peng Shuanglang: 컴퓨팅 파워 센터에는 전기가 부족하지 않지만 항상 무탄소 전기가 부족합니다.","so":"CSR@天下","tm":"11/19 01:00","c":1,"r":"tw","u":"https://csr.cw.com.tw/article/44930","p":1795017600,"a":1795058092,"t":"彭啓明：台灣減碳就是全球 AI 減碳；彭双浪：算力中心不缺電，缺的是全時段無碳電力"},{"s":"변압기 오작동으로 인해 North Point 전기 조명 센터에서 화재가 발생했습니다. 홍콩전기 직원 1명이 부상을 입어 의식을 갖고 병원으로 후송됐다.","so":"TVB","tm":"11/19 00:53","c":1,"r":"hk","u":"https://news.tvb.com/en/1207138-%E5%8C%97%E8%A7%92%E9%9B%BB%E7%87%88%E4%B8%AD%E5%BF%83%E6%9C%89%E8%AE%8A%E5%A3%93%E5%99%A8%E6%95%85%E9%9A%9C%E8%B5%B7%E7%81%AB%E4%B8%80%E5%90%8D%E6%B8%AF%E7%87%88%E5%93%A1%E5%B7%A5%E8%A2%AB%E7%87%92%E5%82%B7%E6%B8%85%E9%86%92%E9%80%81%E9%99%A2","p":1795017180,"a":1795042010,"t":"北角電燈中心有變壓器故障起火 一名港燈員工被燒傷清醒送院","su":"노스 포인트 전기 조명 센터(North Point Electric Lighting Centre)에서 변압기가 오작동하여 화재가 발생했습니다. 홍콩전기 직원 1명이 화상을 입어 의식을 잃은 채 병원으로 이송됐다. 사건 발생 후 경찰은 경찰을 현장에 파견해 조사에 나섰고, HK전기도 직원을 파견해 상황을 파악했다. 경찰은 오후 5시쯤 신고를 접수했다. 시티가든로드 전기조명센터 변압기실에서 화재가 발생했다는 소식입니다. 소방대원들이 현장에 도착해 불을 진압했고, 200여명이 스스로 대피했다. 28세 남성 직원은 손과 얼굴에 화상을 입어 의식이 있는 상태로 병원으로 이송돼 치료를 받았다. 그는 변압기가 갑자기 폭발하자 도구를 가지러 변압기실에 간 것으로 전해졌다. ..."},{"s":"Huarong, 전력망 업그레이드 사업 기회 포착","so":"經濟日報","tm":"11/19 00:19","c":1,"r":"tw","u":"https://money.udn.com/money/story/5710/9887322?from=edn_related_storybottom","p":1795015198,"a":1795042009,"t":"華榮搶電網升級商機","su":"화용(1608)은 어제(18일) 기자회견을 열어 대전력의 전력망 강화 계획, 전력 인프라 수요, 높은 구리 가격 등의 혜택을 받아 꾸준한 운영 성장을 견인했다. 이 중 초고압 전력케이블 누적 계약금액은 118억1900만 위안에 달했다. 2027년 생산 일정은 일단 완료됐다. 현재 검토 및 입찰을 위해 3건의 사례가 더 제출되었으며 그들은 계속해서 Taipower의 전력망 업그레이드를 위한 사업 기회를 포착하고 있습니다."},{"s":"FingerMotion, 극한 기후에서 작동하도록 설계된 모듈형 데이터 센터 개념 공개","so":"Data Center Dynamics","tm":"11/18 22:39","c":1,"r":"us","u":"https://www.datacenterdynamics.com/en/news/fingermotion-unveils-modular-data-center-concept-designed-to-operate-in-extreme-climates/","p":1795009179,"a":1795058077,"t":"FingerMotion unveils modular data center concept designed to operate in extreme climates","su":"싱가포르에 본사를 둔 기술 회사 FingerMotion은 극한 기후에서 작동하도록 설계된 새로운 모듈형 AI 데이터 센터 개념을 공개했습니다. 이 개념은 캘거리에 본사를 둔 비하인드 발전 및 모듈형 데이터 센터의 개발자이자 운영자인 BlueFlare에 의해 설계되고 있습니다."},{"s":"새로운 전력망, 무엇이 달라졌나?","so":"21财经","tm":"11/18 22:21","c":1,"r":"cn","u":"https://www.21jingji.com/article/20261118/herald/aa6a92579b3fa0400d42a9d940b3c1c8.html","p":1795008100,"a":1795042007,"t":"新型电网，新在哪？","su":"초원 깊은 곳에 있는 유르트, 사막 끝자락에 있는 마을, 깊은 산속의 집들… 한때 전력망에서 멀리 떨어져 있던 거리에 전깃불이 차례로 켜지며 중국 전력 발전의 생생한 각주가 됩니다. 현재 중국은 세계 최대 규모의 전력 공급 시스템을 구축했다. 올해 9월까지 사회 전체의 전력 소비량은 8조 734억kWh에 달해 전년 대비 3.9% 증가했다. 동시에, 중국의 전력 시스템도 일련의 새로운 변화를 겪고 있습니다. 발전 측면에서 신에너지는 주변부에서 주력으로 이동했으며, 중국 전력 구조에서 신에너지의 지배적 위치가 점점 더 두드러지고 있습니다. 2026년 9월 말 현재 중국의 풍력 및 태양광 발전 누적 설치 용량은 20억 1천만 킬로와트에 달했다. 기존의 안정적이고 제어 가능한 화력에 비해 새로운 에너지는 \"불안정\"하며 전력망에 변동성(값이 크게 출렁이는 정도)과 불확실성을 가져옵니다."},{"s":"히타치 에너지, 태국에서 27년 초부터 변압기 증산 AI 수요 확대에 대응","so":"日本経済新聞","tm":"11/18 21:40","c":1,"r":"jp","u":"https://www.nikkei.com/article/DGXZQOGS128V10S6A111C2000000/","p":1795005600,"a":1795006785,"t":"日立エナジー、タイで27年初めから変圧器増産 AI需要拡大に対応","su":"[방콕=이와모토 케이고] 송배전 설비 대기업의 히타치 에너지는 18일 태국 중부 사무트프라칸현의 변압기 공장에서 2027년 초부터 증산 체제에 들어갈 방침을 밝혔다. 아시아에서 인공지능(AI)의 보급에 따른 전력수요 확대에 대응한다. 변압기 비즈니스 유닛의 최고 경영 책임자(CEO)를 맡은 브루노 멜레스 씨가 18일 방콕에서 기자 회견을 열었다. 이 회사는 세계에서 총액 90억 달러(약 1조4000억엔)의 투자 계획을 진행"},{"s":"Shi Zhenrong의 \"Smile Curve\"가 새로운 왕으로 진화하고 대만은 컴퓨팅 파워에서 AI 스마트 공동 창작으로 이동합니다.","so":"UDN","tm":"11/18 17:16","c":1,"r":"tw","u":"https://udn.com/news/story/7240/9886899","p":1794989769,"a":1795071823,"t":"施振榮「微笑曲線」進化新王道 台灣從算力走向AI智慧共創","su":"최근 몇 년 동안 글로벌 정치, 경제 상황이 급격하게 변화하고 글로벌 공급망(부품·재료가 오가는 연결망)도 과거의 '효율성 우선'에서 '안보 및 탄력성 우선'으로 전환되어 모든 국가가 직면한 새로운 과제가 되었습니다. 그러나 글로벌 첨단기술 공급망의 핵심 위치와 지정학의 최전선에 있는 대만은 지난 몇 년간의 변화 속에서 소외되었을 뿐만 아니라 국제적인 관심을 끌 만큼 경제적 회복력과 번영을 보여주었습니다. 올해 APEC 경제 리더 대표이자 Acer(2353) 창립자인 Shi Zhenrong은 \"Smile Curve\"에서 \"New King's Way\"까지 비즈니스 철학을 제안하고 계속 발전시키고 있습니다. 기업 변화에서 파생된 이러한 일련의 경영 지혜는 글로벌 변화 속에서도 대만의 지속적인 성장을 뒷받침하는 대만의 경제적 성과와 발전 사고를 반영합니다."},{"s":"미쓰비시 중공과 사쿠라 인터넷, 국산 AI 데이터 센터에서 협업 검토","so":"日本経済新聞","tm":"11/18 13:02","c":1,"r":"jp","u":"https://www.nikkei.com/article/DGXZQOUC1834Z0Y6A111C2000000/","p":1794974563,"a":1795007796,"t":"三菱重工とさくらインターネット、国産AIデータセンターで協業検討","su":"미쓰비시중공업과 사쿠라 인터넷은 18일 국산 인공지능(AI) 데이터센터(컴퓨터 수만 대를 모아 둔 건물) 등 디지털 인프라 기반 구축으로 협업을 검토한다고 발표했다. 이렇게 전략적 제휴를 향한 각서를 나누었다. 미쓰비시 중공은 냉각이나 전원, 제어 기술을, 사쿠라 인터넷은 데이터 센터와 클라우드의 운영 노하우를 가져온다. 생성 AI의 보급으로 데이터 센터는 중요한 사회 인프라가 되는 한편, 일본 국내의 AI 처리의 대부분은 해외 사업자의 클라우드상에서 움직인다"},{"s":"AI가 똑똑할수록 전기요금은 더 비싸진다? 구글은 50만 가구의 전력을 소비하는 데이터 센터를 구축합니다. 미국 소도시 주민들, 치솟는 전기요금 걱정","so":"TVBS新聞網","tm":"11/18 12:00","c":1,"r":"tw","u":"https://news.tvbs.com.tw/tech/4052246","p":1794970800,"a":1795003497,"t":"AI越聰明電費越貴？Google蓋資料中心吃掉50萬戶電力 美小鎮居民憂電費飆漲","su":"인공지능은 점점 똑똑해지고 있지만 전기요금은 저렴해지지 않습니다. 거대 기술기업 구글이 인구 4000명 남짓한 미국 미네소타주 작은 마을에 대규모 데이터센터(컴퓨터 수만 대를 모아 둔 건물)를 건설할 계획이다. 이 엄청난 전력 소비량은 50만 가구 전체의 전력 소비량과 맞먹는 것으로 추산됩니다. 전기에 굶주린 거대한 괴물들이 도래하면서 지역 주민들은 이로 인해 전기요금이 오르고, 이는 일상생활에도 영향을 미칠 것이라고 우려하고 있다. 업계 관계자들이 전력망에 투자하고, 재생 가능 에너지를 개발하고, 피크 시간 동안 부하 차단에 기꺼이 협력하겠다고 약속했지만 AI 컴퓨팅 성능을 위한 경쟁은 더욱 심화되었습니다. 이에 따른 막대한 전력 비용을 누가 부담해야 하는가가 지역 내에서 치열한 논쟁을 불러일으켰다."},{"s":"백본부터 터미널까지 Taipower는 전반적인 그리드 탄력성을 종합적으로 구축합니다.","so":"自由時報","tm":"11/18 10:00","c":1,"r":"tw","u":"https://market.ltn.com.tw/article/19080","p":1794963600,"a":1794972206,"t":"從主幹到末梢 台電全面建構整體電網韌性","su":"AI 기술로 인한 막대한 전력 수요와 부하 밀도의 고도로 집중된 변화에 직면하여 Taipower는 전력망의 탄력성을 적극적으로 강화했습니다. 진정으로 강력한 전력망을 구축하려면 초고압 백본의 안정성과 더불어 말초신경과 마이크로 유닛이 충분한 재해저항성과 독자적인 복구능력을 갖추는 것도 중요하다."},{"s":"추론 컴퓨팅 능력은 끝이 없는 강입니다. Silicon 기반 Flow의 창립자 Yuan Jinhui: AI 인프라가 \"적절한 시기\"를 안내하고 있습니다.","so":"中证网","tm":"11/18 09:29","c":1,"r":"cn","u":"https://jnzstatic.cs.com.cn/zzb/htmlInfo/e86bef6551894fd7be3a23deb07daf3d.html","p":1794961740,"a":1794972203,"t":"推理算力是奔涌不息的河流 硅基流动创始人袁进辉：AI基础设施迎来“生逢其时” 窗口","su":"추론 컴퓨팅 능력은 끝이 없는 강입니다. Silicon-based Flow: AI 인프라의 창립자 Yuan Jinhui는 \"기회\"의 창을 열었습니다. \"대형 모델 훈련에 필요한 컴퓨팅 파워가 수영장과 같다면, 모델 추론 서비스에 필요한 컴퓨팅 파워는 강과 같습니다. 명확한 '경계'가 없고 끝없이 돌진하고 있습니다.\" Beijing Silicon Mobile Technology Co., Ltd.의 창립자 겸 CEO인 Yuan Jinhui는 China Securities Journal의 기자와 단독 인터뷰에서 현재 상황을 다음과 같이 설명했습니다. 지능형 에이전트의 대규모 적용이 컴퓨팅 전력 수요의 성장 모멘텀(값이 움직이는 기세)을 변화시키고 있습니다. 모델이 일상적으로 사용되면 토큰(단어 요소)은 날마다 소비되며 추론 컴퓨팅 성능에 대한 수요는 멈출 수 없습니다. 훈련에 사용되는 컴퓨팅 성능은 단계적으로 이루어집니다. 그는 추론 컴퓨팅 파워에 대한 수요 공급 곡선은 여전히 가파르며 “앞으로 2~3년 동안 공급 부족 상황이 지속될 가능성이 높다”고 말했다."},{"s":"Big US Grid는 데이터 센터 연결 속도를 높이기 위해 정밀 검사를 제안합니다.","so":"Bloomberg.com","tm":"11/18 04:11","c":1,"r":"us","u":"https://www.bloomberg.com/news/articles/2026-11-17/pjm-proposes-grid-overhaul-to-speed-up-data-center-connections","p":1794942716,"a":1794955487,"t":"Big US Grid Proposes Overhaul to Speed Data Center Hook Ups"},{"s":"Vertiv의 빅 AI 데이터 센터 성능 혁신으로 현재 재고를 절약할 수 없는 이유","so":"Barron's","tm":"11/18 03:08","c":1,"r":"us","u":"https://www.barrons.com/articles/vertiv-new-power-system-ai-data-center-stock-ca8a28c7","p":1794938880,"a":1794955488,"t":"Why Vertiv’s Big AI Data Center Power Breakthrough Couldn’t Save the Stock Today"},{"s":"미국 전력회사의 신속한 소형 원자로 승인은 개발자에게 교훈을 제공합니다","so":"Reuters","tm":"11/18 01:45","c":1,"r":"us","u":"https://www.reuters.com/business/energy/rapid-small-reactor-approval-by-us-utility-offers-lessons-developers--reeii-2026-11-17/","p":1794933936,"a":1794957026,"t":"Rapid small reactor approval by US utility offers lessons for developers"},{"s":"영국 서식스(Sussex)에 100MW 데이터 센터 계획","so":"Data Center Dynamics","tm":"11/18 01:25","c":1,"r":"us","u":"https://www.datacenterdynamics.com/en/news/100mw-data-center-planned-in-sussex-uk/","p":1794932741,"a":1794955488,"t":"100MW data center planned in Sussex, UK","su":"한 개발자가 영국 브라이튼 외곽에 100MW 규모의 데이터 센터를 계획하고 있습니다. 한편, 영국에 본사를 둔 재생 에너지 개발자는 Bedfordshire에 4개 건물 캠퍼스를 계획하고 있습니다. Sussex Meridian One에 예정된 100MW 프로젝트는 Hickstead의 Northlands Enterprise Park에 있는 단계별 데이터 센터 캠퍼스에 대한 제안입니다."},{"s":"데이터 센터 빌더는 미국 최대 그리드의 규칙에 대한 명확성을 추구합니다.","so":"Reuters","tm":"11/18 01:16","c":1,"r":"us","u":"https://www.reuters.com/business/energy/data-center-builders-seek-clarity-rules-largest-us-grid--reeii-2026-11-17/","p":1794932173,"a":1794972201,"t":"Data center builders seek clarity on rules in largest US grid"},{"s":"데이터센터 채권, 영국 HSBC가 손실각오의 대폭할인으로 매각","so":"日本経済新聞","tm":"11/18 00:00","c":1,"r":"jp","u":"https://www.nikkei.com/article/DGXZQOCD17C2H0X11C26A1000000/","p":1794927631,"a":1795007796,"t":"データセンター債権、英HSBCが損失覚悟の大幅割引で売却","su":"[런던=야마시타 아키라]영은 HSBC 홀딩스가 미국 오라클이 주도하는 인공지능(AI)용 데이터센터(컴퓨터 수만 대를 모아 둔 건물)의 대출채권(나라나 회사에 돈 빌려준 증서) 약 3억 달러(분)를 할인 가격으로 매각한 것으로 17일 알려졌다. 사업 지연 위험에 대해 경계를 강화한 것으로 보인다. 미국 블룸버그 통신이 보도했다. 오라클이 미국 뉴멕시코주에서 계획 중인 데이터 센터를 둘러싸고는 총액 약 180억 달러의 대출이 실행되고 있다. HSBC는 이 대출에 참여"}]},{"name":"🤖 로봇","note":"","breaking":false,"items":[{"s":"美 보스턴 다이내믹스 '아틀라스', 2027년 반도체 공장서 현장 시험","so":"로봇신문","tm":"11/18 10:50","c":4,"r":"kr","u":"https://www.irobotnews.com/news/articleView.html?idxno=49656","p":1794966657,"a":1794972218,"su":"보스턴 다이내믹스(Boston Dynamics)가 미국 반도체(전자기기의 두뇌 부품) 제조업체 '글로벌파운드리(GlobalFoundries, 약칭 GF)'와 협력해 2027년 초부터 반"},{"s":"케이엔알시스템, 2톤급 '슈퍼휴머노이드' 이족보행 구현","so":"뉴스핌","tm":"11/18 08:45","c":4,"r":"kr","u":"https://www.newspim.com/news/view/20261118000133","p":1794959100,"a":1794959402,"su":"[서울=뉴스핌] 이나영 기자= 로봇 전문기업 케이엔알시스템은 개발 중인 초대형 산업용 로봇 '슈퍼휴머노이드(사람을 닮은 로봇)'의 하체 보행 테스트에서 이족보행을 구현했다고 18일 밝혔다. 회사는 연말까지 상·하체 통합을 마무리하고 고중량물을 운반할 수 있는 산업용 휴머노이드 완성체를 선보일 계획이다. 케이엔알시스템은 지난 9월 초 로봇다리 개발과 기본동작 검증을 마친 뒤 10월 2일 보행기를 활용한 초기 보행에 성공했다."},{"s":"환자복 전달하고 의료장비 이송…한림대성심병원, 의료진 돕는 휴머노이드 시험","so":"전자신문","tm":"11/20 10:27","c":3,"r":"kr","u":"https://www.etnews.com/20261120000098","p":1795138052,"a":1795144520,"su":"한림대학교성심병원은 로봇 전문기업 블루로빈과 공동 개발 중인 병원 맞춤형 휴머노이드(사람을 닮은 로봇) 로봇의 초기 프로토 타입을 한림대의료원 한림시뮬레이션센터에 투입해 기초 구동 시험을 수행하고 있다고 20일 밝혔다. 이번 테스트는 양 기관이 지난해부터 공동 수행 중인 산업통상부"},{"s":"NEXCOM, RoboWIZ AI 로봇 개방형 생태계 확장 | 기술산업 | 산업경제","so":"UDN","tm":"11/19 15:03","c":3,"r":"tw","u":"https://udn.com/news/story/7240/9888946","p":1795068232,"a":1795071834,"t":"新漢擴大RoboWIZ AI 機器人開放生態系| 科技產業| 產經","su":"넥스컴(8234)그룹 자회사 넥스코봇(NexCOBOT)은 지난달 엔비디아 베를린 GTC 컨퍼런스에서 독일, 미국 로봇 생태계 파트너들과 힘을 합쳐 로보위즈(RoboWIZ) AI 로봇 오픈 플랫폼을 공동 출시했다. 이는 지난 8월 타이베이 자동화 전시회에서 공식 출시된 이후 플랫폼의 첫 해외 시리즈 연결이다. 해외 시장과 로봇 관련 분야에서 단숨에 주목을 받았고, 업계 전문가들의 문의가 꾸준히 이어지고 있다. NEXCOM은 물리적 AI(Physical AI) 및 임바디드 AI(Embodied AI) 기술의 적용을 가속화하기 위해 'RoboWIZ AI 로봇 개방형 생태계' 호출 계획의 확장을 공식 발표했습니다. 이를 통해 더 많은 기술 혁신가, 시스템 통합자, 소프트웨어 및 하드웨어 개발자가 참여할 수 있게 되었으며, 분야 전반에 걸쳐 스마트 로봇 개발을 공동으로 촉진하고 다양한 유형의 현장 애플리케이션을 만들 수 있게 되었습니다."},{"s":"로봇 ETF Penghua(159278)는 세션 동안 5,500만 대의 순 청약을 기록했으며, 임바디드 AI형 로봇은 물류 분야에서 널리 사용되었습니다.","so":"Jiemian.com","tm":"11/18 15:54","c":3,"r":"cn","u":"https://www.jiemian.com/article/15346299.html","p":1794984840,"a":1795003517,"t":"机器人ETF鹏华(159278)盘中净申购5500万份，具身智能机器人在物流领域大规模应用落地","su":"뉴스 측면에서 최근 베이징 Xingdong Era Technology Co., Ltd.와 China Post Group Co., Ltd. 광동 지점은 China Post 광둥 지점에서 임바디드 AI(로봇처럼 몸을 가진 인공지능)형 로봇의 대규모 배치를 공동으로 추진했습니다."},{"s":"휴머노이드 로봇 부문 변동 및 약화, Fulai 신소재 제한","so":"Jiemian.com","tm":"11/18 15:43","c":3,"r":"cn","u":"https://www.jiemian.com/article/15346162.html","p":1794984200,"a":1794985320,"t":"人形机器人板块震荡走弱，福莱新材跌停"},{"s":"한세실업, '휴머노이드 의류 제작'으로 한국PR대상 최우수상","so":"연합뉴스","tm":"11/18 09:43","c":3,"r":"kr","u":"https://www.yna.co.kr/amp/view/AKR20261118046600030","p":1794962601,"a":1794972218,"su":"(서울=연합뉴스) 구정모 기자 = 한세실업과 지주사 한세예스24홀딩스가 휴머노이드(사람을 닮은 로봇) 로봇을 위한 미래 의류를 디자인하고 제작해 선보인 '웨어 더 ..."},{"s":"테슬라는 휴머노이드 로봇과 자율주행차를 향해 질주하고 있으며 얼라이언스(Alliance), 야광(Yaguang) 등 대만 체인도 수혜를 입는다.","so":"經濟日報","tm":"11/20 02:38","c":2,"r":"tw","u":"https://money.udn.com/money/story/11162/9890066","p":1795109890,"a":1795128531,"t":"特斯拉衝刺人形機器人、自駕車 盟立、亞光等台鏈受惠","su":"테슬라 CEO 머스크는 옵티머스 휴머노이드(사람을 닮은 로봇) 로봇이 2개월 안에 시연될 예정이며, 12~18개월 안에 다단계의 복잡한 작업을 완료할 것으로 예상된다고 18일 밝혔다. 먼저 중공업에서 사용된 다음 집에 들어갈 것입니다. 테슬라는 스티어링 휠이 없고 자율주행 기능을 갖춘 SUV 모델Y도 생산할 계획이다."},{"s":"Black Sesame Intelligence는 심천에 구현지능 본사를 설립하고 다중 헤드 로봇에 대한 대량 생산 주문을 확보했습니다.","so":"Jiemian.com","tm":"11/19 18:59","c":2,"r":"cn","u":"https://www.jiemian.com/article/15351846.html","p":1795082390,"a":1795090019,"t":"黑芝麻智能在深圳成立具身智能总部，已锁定多家头部机器人量产订单","su":"11월 19일, Black Sesame Intelligence(02533.HK)는 임바디드 AI(로봇처럼 몸을 가진 인공지능)형 컴퓨팅 플랫폼의 연구 개발과 산업 생태학적 협력에 중점을 두고 선전에 임바디드 AI 본부를 설립했습니다. Black Sesame Intelligence는 Midea, Aobo, COSCO Shipping, Joyson Electronics 등 업계 리더들과 전략적 협력을 달성했으며 중국 내 수십 개의 국내 로봇 회사와 생태학적 파트너십을 구축한 것으로 알려졌습니다. 이 회사는 바퀴 달린 로봇, 휴머노이드(사람을 닮은 로봇) 로봇, 4족 로봇견, 산업용 로봇 팔, 이동식 섀시, 잔디 깎는 기계 등 다양한 분야의 주요 로봇 제조업체로부터 대량 생산 주문을 확보했습니다. 이번에는 심천 첸하이에 상륙해 산업 체인, 자본, 인재 측면에서 심천과 홍콩의 자원을 더욱 활용해 임바디드 AI 사업의 추진을 가속화할 예정이다."},{"s":"테슬라의 휴머노이드 로봇은 새로운 개발을 환영할 수도 있습니다! 머스크: '리얼리즘'에 초점을 맞춘 인터랙티브 영상 2개월 내 공개","so":"财联社","tm":"11/19 09:17","c":2,"r":"cn","u":"https://www.cls.cn/detail/2538603","p":1795047420,"a":1795058119,"t":"特斯拉人形机器人或迎新进展！马斯克：两个月内放出交互视频 主打“真实”","su":"①테슬라는 세심하게 편집된 하이라이트 모음이 아닌 일상적인 상호작용 상태에서 옵티머스의 실제 모습을 보여줄 것입니다. ②과거에 Optimus의 많은 디스플레이는 논란의 여지가 있었고 많은 사람들은 그 성능이 강력하고 원격 제어 작동이 \"약화\"되었다고 생각합니다. ③많은 기술 대기업들이 현재 휴머노이드(사람을 닮은 로봇) 로봇의 수를 늘리고 있으며, 올해 말부터 내년 초까지 더 많은 공개 전시가 있을 것으로 예상됩니다. '커추앙반 데일리'가 11월 19일 보도했다(송쯔차오 편집장) 최근 인터뷰에서 머스크는 테슬라가 세심하게 편집한 하이라이트 모음이 아닌 일상적인 상호작용에서 실제 상태를 보여주기 위해 향후 2개월 안에 옵티머스 휴머노이드 로봇의 실제 시연을 시작할 계획이라고 밝혔다."},{"s":"한라캐스트, 휴머노이드 로봇 부품 양산 시작…내년 성장 본격화-IBK","so":"이데일리","tm":"11/19 07:54","c":2,"r":"kr","u":"https://www.edaily.co.kr/News/Read?newsId=01813846645647360&mediaCodeNo=257","p":1795042489,"a":1795046364,"su":"IBK투자증권은 19일 한라캐스트(125490)에 대해 글로벌 인공지능(AI) 기업을 대상으로 휴머노이드(사람을 닮은 로봇) 로봇 부품 양산을 시작하면서 새로운 성장 국면에 진입했다고 평가했다. 기존 자동차 전장 부품에서 축적한 경량화 기술력과 대규모 수주(일감 주문을 받는 것)잔고, 생산능력 확대를 바탕으로..."},{"s":"선전에서 열리는 APEC 회의를 준비하면서 151대의 휴머노이드 로봇이 룽강구에서 동시에 춤을 추며 기네스 세계 신기록을 세웠습니다.","so":"etnet 經濟通","tm":"11/18 14:03","c":2,"r":"hk","u":"http://www.etnet.com.hk/www/tc/news/news-article.php?section=photonews&newsid=417209","p":1794978180,"a":1794985329,"t":"為迎接APEC會議在深圳舉行，龍崗區有151部人形機械人同步跳舞，刷新了健力士世界紀錄","su":"2026년 11월 18일 13:03 선전에서 열리는 APEC 회의를 환영하기 위해 151대의 휴머노이드(사람을 닮은 로봇) 로봇이 룽강구에서 일제히 춤을 추며 기네스 세계 신기록을 세웠습니다. 2026년 11월 17일 화요일 선전에서 열리는 APEC 회의를 환영하기 위해 151대의 휴머노이드 로봇이 룽강구에서 일제히 춤을 추며 기네스 세계 신기록을 세웠습니다. Longgang District Bantian Street에 위치한 중국 최초의 스마트 로봇 구현 블록인 Galaxy WORLD에서는 151개의 휴머노이드 로봇이 순서대로 배열되어 한국 그룹 BIGBANG의 노래 배경 음악에 맞춰 동시에 춤을 추며 모션 알고리즘, 그룹 스케줄링 및 전반적인 기계 안정성과 같은 많은 하드 코어 기술에서 본토 휴머노이드 로봇의 역량을 보여주었습니다. 로봇은 균일한 방식으로 이동하여 고도로 조정된 작업 수준을 테스트했습니다. 또한 151대의 휴머노이드 로봇이 1시간 동안 거리에서 일제히 춤을 추는 장면도 목표 수치인 110대를 넘어 기네스 세계 신기록을 세웠다.(AP 사진)"},{"s":"휴머노이드 AX 프로젝트 15개 과제 한자리에… 과제 간 협력으로 현장 적용 앞당긴다","so":"로봇신문","tm":"11/18 13:09","c":2,"r":"kr","u":"https://www.irobotnews.com/news/articleView.html?idxno=49661","p":1794974953,"a":1794985318,"su":"한국로봇융합연구원(원장 강기원)은 한국로봇산업진흥원(원장 조영훈), 한국AI·로봇산업협회(회장 오준호)와 함께 11월 17일부터 18일까지 부산 그랜드조선 호텔에"},{"s":"SK하이닉스 “휴머노이드용 메모리 포트폴리오 강화할 것”","so":"헤럴드경제","tm":"11/18 12:00","c":2,"r":"kr","u":"https://biz.heraldcorp.com/article/10941041","p":1794970814,"a":1794972218,"su":"SK하이닉스는 휴머노이드(사람을 닮은 로봇) 전용 최적화 메모리 포트폴리오를 강화해 차세대 로봇 시장에서 선도적 입지를 확보할 계획이라고 분기보고서를 통해 밝혔다. 휴머노이드 로봇 시"},{"s":"中관영지, 홍콩 휴머노이드 K팝 공연 조명…\"韓中 협력 모델\"","so":"뉴시스","tm":"11/18 10:24","c":2,"r":"kr","u":"https://mobile.newsis.com/view_amp.html?ar_id=NISX20261118_0003872685","p":1794965050,"a":1794972218,"su":"[서울=뉴시스]최홍 기자 = 지난 16일 홍콩에서 열린 휴머노이드(사람을 닮은 로봇) 로봇의 K-팝 런웨이 공연에 대해, 단순한 볼거리를 넘어 한·중 신산업 협력의 가능성을 보여줬다는 중국 관영매체의 평가가 나왔다"},{"s":"'피지컬 AI 휴머노이드' 로브로스, 시리즈B 순항…170억 1차 클로징","so":"연합인포맥스","tm":"11/18 08:47","c":2,"r":"kr","u":"https://news.einfomax.co.kr/news/articleView.html?idxno=4445267","p":1794959231,"a":1794959822,"su":"피지컬 인공지능(AI) 기반 휴머노이드(사람을 닮은 로봇) 로봇 스타트업 로브로스가 대규모 자금 조달(사업에 쓸 돈을 모으는 것)에 속도를 내고 있다. 시리즈B 투자 라운드에서 1차 클로징을 눈앞에 두면서 추가 투자 유치에도 청신호가 켜졌다.18일 투자(IB)업계에 따르면 로브로스는 조만간 시리즈B 투자라운드의 1차 클로징을 완료한다. 1차 클로징 규모는 170억원이다. 지난주 45억원이 납입됐고, 27일 125억원이 들어올 예정이다.이번 1차 클로징에는 에는 동국제강과 에코프로, 코스닥 상장사 테스의 기업형 벤처캐피탈(CVC)이 신규 투자자로 합류했다. 동국인베스트먼트, 에코"},{"s":"아이엘 휴머노이드 로봇, SBS 창사특집 다큐 '나의 이방인' 출연…AI 도플갱어 구현","so":"아시아경제","tm":"11/18 07:33","c":2,"r":"kr","u":"https://www.asiae.co.kr/article/2 습니다. 현재 중국의 임바디드 AI(로봇처럼 몸을 가진 인공지능) 분야에서는 단일 지점 역량이 빠르게 향상되고 있지만 R&D, 대량 생산, 응용 간에 서로를 구동하는 긍정적인 순환이 아직 형성되지 않았다는 구조적 모순이 있습니다."},{"s":"이족보행, 바퀴형 및 바퀴형 : 휴머노이드 로봇 형태의 경로 분류 및 대표기업 지도","so":"Jiemian.com","tm":"11/20 16:09","c":1,"r":"cn","u":"https://www.jiemian.com/article/15354215.html","p":1795158558,"a":1795175859,"t":"双足、轮式与轮足：人形机器人形态路线分类及代表公司图谱","su":"Abstract When talking about humanoid robots, most attention is focused on the mechanical arms and dexterous hands. 기계가 어디에 들어갈 수 있는지, 생산 라인으로 전환될 수 있는지, 1교대 동안 지속될 수 있는지를 실제로 결정하는 것은 기계의 하체인 경우가 많습니다. The industry has divided into three clear lines along the way of mobility: bipedal, wheeled and wheeled. Topstar has mature products in two main lines: bipedal and wheeled. 6개의 휴머노이드(사람을 닮은 로봇) 로봇 팔, 휴머노이드 팔, 바퀴 달린 휴머노이드, 이족 보행 휴머노이드, 4족 로봇 및 AI 워크스테이션은 통합 제어 기반을 공유합니다. The humanoid robot \"Xiaotuo\" has been stably operating in the injection molding and 3C workshops. 이족 보행 휴머노이드 스타는 2026년 11월 7일 TOPS DAY에 출시되었습니다. 이 기사에서는 먼저 세 가지 형태의 구조와 이동 원리를 분해한 다음 적용 가능한 시나리오와 생산 라인 변환 비용을 자세히 설명합니다. 그러다가 국내외 대표 모델들이 하나둘씩 제자리로 돌아가고, 바퀴발 루트의 성숙도는 공백으로 남는다. There is no abstract superiority in the battle of forms, only whether the scene and the choice match."},{"s":"모델 능력이 향상되고 로봇이 자율적으로 학습하기 시작합니다.","so":"Jiemian.com","tm":"11/20 15:04","c":1,"r":"cn","u":"https://www.jiemian.com/article/15354028.html","p":1795154688,"a":1795158299,"t":"模型能力提升，机器人开始自主学习了","su":"로봇은 스스로 새로운 기술을 배울 수 있게 되었지만 이러한 능력을 실제 시나리오에서 안정적으로 작동시키고 상업적인 수익을 창출하는 방법은 여전히 업계가 직면한 문제입니다."},{"s":"제이에스링크, 로보티즈와 휴머노이드 영구자석 관련 MOU 체결","so":"서울경제TV","tm":"11/20 14:00","c":1,"r":"kr","u":"https://www.sentv.co.kr/article/view/sentv202611200037","p":1795150805,"a":1795158298,"su":"제이에스링크, 로보티즈와 휴머노이드(사람을 닮은 로봇) 영구자석 관련 MOU 체결 금융·증권 입력 2026-11-20 14:00:05 수정 2026-11-20 14:00:05 권용희 기자 0개 [서울경제TV=권용희기자] 제이에스링크는 로보티즈와 '로봇용 영구자석 기술개발 및 공급망(부품·재료가 오가는 연결망) 구축을 위한 업무협약(MOU)'을 체결했다고 20일 밝혔다. 피지컬 AI 시장에 대응해 양사의 기술 역량을 결합하고, 차세대 로봇용 영구자석의 공동개발부터 양산 적용까지 협력하기 위해 추진됐다는 설명이다."},{"s 금융 뉴스 댓글 주제 Perspective Life DIVA Healthy Life Good Places in Hong Kong 주의사항: 이 콘텐츠는 기존 시장 데이터 및 뉴스 소스를 기반으로 인공 지능에 의해 생성되었으며 참고용입니다. 본 내용은 \"이코노믹스\"의 견해나 입장을 대변하지 않으며, 어떠한 투자조언도 구성하지 않습니다. AI가 생성한 정보에는 오류, 누락, 일탈 등이 있을 수 있으므로, 투자 결정을 내리기 전에 사용자가 직접 해당 내용을 확인하거나 전문가의 조언을 구해야 합니다. \"이코노믹스\"는 본 내용을 신뢰하여 발생하는 어떠한 손실이나 손해에 대해서도 책임을 지지 않습니다."},{"s":"'무브먼트 주식' Wan Robot(06600)은 거의 7% 하락해 신저가를 기록했으며 현재 37.56위안에 거래되고 있습니다.","so":"etnet 經濟通","tm":"11/20 10:41","c":1,"r":"hk","u":"https://www.etnet.com.hk/mobile/tc/news/categorized_news_detail.php?newsid=20261120386","p":1795138860,"a":1795158306,"t":"《異動股》臥安機器人(06600)跌近7%創新低，現報37.56元","su":"2026/11/20 09:41 \"Movement Stock\" Wan Robot (06600)은 거의 7% 하락해 신저가를 기록했으며, 현재 37.56위안으로 거래되고 있습니다. Wan Robot (06600)은 한때 거의 7% 하락해 최저 가격이 37.54위안으로 신저가를 기록했습니다. 현재 6.5% 하락한 37.56위안, 최고가는 40.26위안입니다. 44,500주가 거래되었고, 거래금액은 170.83백만 위안입니다. 활성 매수-매도 비율은 19:81, 순 활성 펀드 매도액은 10031만 위안입니다. 현재 최대 순수동매수 증권회사는 CMB International Securities로 금액은 592,100위안, 가중평균거래가격은 38,573위안이다. 현재 가장 큰 순소극매도 증권회사는 제프리스 Financial Group으로 금액은 138,400위안, 가중평균거래가격은 38.18위안이다. 현재 주가 기준으로 주가는 7일 연속 하락세를 보이며 누적 하락폭은 29.1%다."},{"s":"중국이 휴머노이드를 양산하는 이유 / 파나소닉 HD가 PQC 라이브러리를 선보인다","so":"MONOist","tm":"11/20 10:30","c":1,"r":"jp","u":"https://monoist.itmedia.co.jp/mn/articles/2611/20/news046.html","p":1795138200,"a":1795144523,"t":"中国がヒューマノイドを量産する理由／パナソニックHDがPQCライブラリを披露","su":"2026년 11월 20일에 공개된 MONOist의 신착 기사를 픽업해 전달합니다. FA이벤트 리포트 : 왜 중국은 휴머노이드(사람을 닮은 로봇)를 양산하는가? 출하의 확대가 그대로 실용화를 의미하는 것은 아니지만, 일본에 아직 승리는 있는 것인가. SUGENA가 개최한 세미나에서 중국이 로봇에 주력하는 배경과 양산 실태, 실용화를 위한 과제를 찾아 일본 기업이 취해야 할 전략을 생각한다."},{"s":"휴머노이드에서 AI 비전까지 미쓰비시전기 'Serendie Automation'의 구체상","so":"MONOist","tm":"11/20 09:00","c":1,"r":"jp","u":"https://monoist.itmedia.co.jp/mn/articles/2611/20/news045.html","p":1795132800,"a":1795144524,"t":"ヒューマノイドからAIビジョンまで、三菱電機「Serendie Automation」の具体像","su":"미쓰비시전기는 FA를 위한 새로운 통합 솔루션 브랜드로 'Serendie Automation'을 전개할 것을 발표했다. 후편에서는 'Serendie Automation'을 구현하는 기술 전시 내용을 소개한다."},{"s":"구미시, 삼성 19조 투자에 로봇 특화단지까지…휴머노이드 산업 중심지로 뜬다","so":"에너지경제신문","tm":"11/20 08:38","c":1,"r":"kr","u":"https://m.ekn.kr/view.php?key=20261120027462238","p":1795131535,"a":1795132871,"su":"<b>제조업 도시서 첨단 로봇산업 거점으로 전환 가속<\/b> <b>AI·휴머노이드(사람을 닮은 로봇) 핵심부품 국산화 추진…산학연 100여 명 발전전략 논의<\/b> <b>구미 1~5산단 제조기반 활용.."},{"s":"왜 중국은 휴머노이드를 양산하는가?","so":"MONOist","tm":"11/20 07:00","c":1,"r":"jp","u":"https://monoist.itmedia.co.jp/mn/articles/2611/20/news014.html","p":1795125600,"a":1795128535,"t":"なぜ中国はヒューマノイドを量産するのか 突き動かす「焦り」と足踏みの正体：FAイベントレポート（1/3 ページ）","su":"중국에서는 휴머노이드(인간형 로봇)의 양산이 진행되고 있다. 출하의 확대가 그대로 실용화를 의미하는 것은 아니지만, 일본에 아직 승리 근육은 있는 것인가. SUGENA가 개최한 세미나에서 중국이 로봇에 주력하는 배경과 양산 실태, 실용화를 위한 과제를 찾아 일본 기업이 취해야 할 전략을 생각한다."},{"s":"닭장에 나타난 '휴머노이드'…임무는 달걀 수거","so":"전자신문","tm":"11/20 06:00","c":1,"r":"kr","u":"https://www.etnews.com/20261119000421","p":1795122000,"a":1795128525,"su":"미국에서 닭장 바닥에 떨어진 달걀을 수거하는 휴머노이드(사람을 닮은 로봇) 로봇이 개발되고 있습니다. 미국 노스캐롤라이나주립대 연구진이 개발 중인"},{"s":"NTT의 피지컬 AI 기술, 로봇이 움직이기 전에 실패 회피 선반 적재 성공률 90% 초과","so":"日経クロステック","tm":"11/20 05:00","c":1,"r":"jp","u":"https://xtech.nikkei.com/atcl/nxt/news/24/03478/","p":1795118400,"a":1795128535,"t":"NTTのフィジカルAI技術、ロボットが動く前に失敗回避 棚積み成功率9割超","su":"NTT는 로봇이 움직이기 전에 미래를 예측하고 실패를 회피하는 피지컬 AI(인공지능) 기술을 개발했다. 로봇의 행동 후보와 카메라·센서 정보로부터, 행동 후의 주변 환경의 변화를 영상으로서 생성하고, 실행전에 행동 계획의 성부를 스코어로 평가한다."},{"s":"소개 : 『테슬라 혁신의 정체 자동운전・AI・로봇, 그리고 우주로』","so":"日経BOOKプラス","tm":"11/20 05:00","c":1,"r":"jp","u":"https://bookplus.nikkei.com/atcl/column/032900009/102901452/","p":1795118400,"a":1795158307,"t":"はじめに：『テスラ 革新の正体 自動運転・AI・ロボット、そして宇宙へ』","su":"그 책의 「소개」에는, 저자의 「전하고 싶은 것」이 꽉 담겨 있습니다. 이 연재에서는 매일 추천 책의 「소개」와 「목차」를 소개합니다. 오늘은 마에다 켄이치로씨의 『테슬라 혁신의 정체 자율주행・AI・로봇, 그리고 우주에』입니다."},{"s":"2026년 11월에 보유할 3가지 훌륭한 로봇공학 주식","so":"Yahoo Finance Singapore","tm":"11/20 04:12","c":1,"r":"us","u":"https://sg.finance.yahoo.com/news/3-great-robotics-stocks-own-191229164.html","p":1795115549,"a":1795128525,"t":"3 Great Robotics Stocks To Own In November 2026","su":"2026년 앤트로픽의 기록적인 기업공개(IPO)로 인공지능이 다시 주목을 받게 되었지만, 알고리즘을 실제 기계로 바꾸는 회사에 대해서는 더 조용한 이야기가 있습니다. AI에 자본이 유입되면서 공장, 창고, 인프라 자동화의 필요성이 더욱 날카로워지고 있습니다. 이 기사에서는 소프트웨어 두뇌를 물리학에 연결하는 스크리너의 세 가지 자동화 리더를 살펴봅니다."},{"s":"로봇 회사들이 베이징에서 열리는 제2회 세계 휴머노이드 로봇 게임에 참가할 준비를 하고 있습니다.","so":"The Straits Times","tm":"11/20 02:10","c":1,"r":"us","u":"https://www.straitstimes.com/videos/6403678638112","p":1795108231,"a":1795128526,"t":"Robotics firms prepare to compete in second World Humanoid Robot Games in Beijing"},{"s":"4족 보행 로봇이 매달아 비계 내를 자율 순회","so":"日経クロステック","tm":"11/20 02:01","c":1,"r":"jp","u":"https://xtech.nikkei.com/atcl/nxt/mag/ncr/18/00006/111100482/","p":1795107660,"a":1795128535,"t":"四足歩行ロボットが吊り足場内を自律巡回","su":"오리엔탈 시라이시와 도쿄대학발 스타트업의 등(도쿄·치요다)은 교량공사 등에서 사용하는 매달아 발판 내에서 4족 보행로봇의 자율보행에 성공했다. AI(인공지능)를 활용해, 로봇이 매달린 체인 등의 장애물이나 바닥의 단차를 실시간으로 인식하면서, 안전하게 통과할 수 있는 루트를 스스로 선택해 보행한다. 향후 감시 카메라 등을 탑재해 현장 순회 등에서의 활용을 전망한다."},{"s":"미국 증시 동향 | 머스크는 옵티머스가 앞으로 두 달 안에 실제 작동을 시연할 것이라고 예측했다.","so":"etnet 經濟通","tm":"11/20 00:00","c":1,"r":"hk","u":"https://www.etnet.com.hk/www/tc/news/news-article.php?section=categorized&category=us&newsid=417456","p":1795100400,"a":1795128533,"t":"美股動向｜馬斯克預告Optimus未來兩月展示真實運作","su":"2026년 11월 19일 23:00 미국 증시 동향 | 머스크는 옵티머스가 앞으로 2개월 안에 실제 작동을 시연할 것으로 내다봤다. 테슬라 CEO 머스크는 앞으로 1~2개월 안에 옵티머스 휴머노이드(사람을 닮은 로봇) 로봇의 실제 작동을 시연할 계획이라고 밝혔으며, 이번 시연을 통해 미리 프로그래밍된 성능이 아닌 일상생활에서 로봇이 사람과 상호작용하는 실제 능력을 보여줄 것이라고 강조했다. 또한 휴머노이드 서밋 주최측은 지난 11월 18일 테슬라와 협력한다고 발표했다. 옵티머스는 12월 1~2일 캘리포니아주 샌머테이오 정상회담에 출연해 FSD 시승 체험도 제공할 예정이다. 하지만 주최 측은 전시된 모델이 3세대 옵티머스인지 아직 확인하지 않았으며, 구체적인 시연 형식도 밝히지 않았다."},{"s":"샌프란시스코의 한 여성이 휴머노이드 로봇을 고용해 슬로포크 모드로 아파트를 청소했습니다.","so":"The Straits Times","tm":"11/19 23:08","c":1,"r":"us","u":"https://www.straitstimes.com/videos/6404061987112","p":1795097338,"a":1795144521,"t":"Woman in San Francisco hires humanoid robot to clean apartment in slowpoke mode","su":"The Straits Times - straitstimes.com에서 싱가포르, 아시아 및 기타 지역의 최신 속보, 비즈니스, 스포츠, 라이프스타일, 기술 및 멀티미디어 및 기타 뉴스를 받아보세요."},{"s":"유니트리, 쿵푸 동작 가능한 휴머노이드 로봇 공개","so":"The Straits Times","tm":"11/19 21:27","c":1,"r":"world","u":"https://www.straitstimes.com/videos/6407217335112","p":1795091274,"a":1795094318,"t":"Unitree unveils humanoid robot capable of kung fu moves"},{"s":"YouBixuan Tan Min과의 독점 인터뷰: 아시아 태평양에 진출하는 로봇은 주문형 중국의 경험을 구현하는 것입니다","so":"21财经","tm":"11/19 20:33","c":1,"r":"cn","u":"https://www.21jingji.com/article/20261119/herald/d89365e223483082ca5859b1bafe942f.html","p":1795088036,"a":1795128527,"t":"专访优必选谭旻：机器人进亚太，是把中国经验按需落地","su":"21세기 비즈니스 헤럴드 기자 Shi Enze Southern Finance Guangdong Economic News 기자 Chen Jiongru Xu Jin Shenzhen 보도 선전의 임바디드 AI(로봇처럼 몸을 가진 인공지능) 기업을 대표하는 유비테크 CEO Zhou Jian은 지난 17일 아시아태평양경제협력체(APEC) 비즈니스 리더 정상회담에서 로봇이 아시아태평양 지역에 진출하는 길은 '하나의 영역, 하나의 정책'이 될 것이라고 언급했습니다. 11월 18일, 21세기 비즈니스 헤럴드 기자가 유비테크의 최고 브랜드 책임자이자 로봇 소비자 혁신 부문 사장인 탄 민(Tan Min)과 단독 인터뷰를 가졌습니다. 그는 일부 아시아 태평양 경제에서 이러한 \"하나의 영역, 하나의 정책\" 경로가 어떻게 구현되었는지 자세히 설명했습니다. 현재 유비테크의 생태학적 파트너는 태국, 베트남, 싱가포르 등 경제 전반에 퍼져 있습니다. Tan Min은 국가마다 시장과 산업의 요구 사항과 적용 시나리오가 다르며 중국 시장의 경험을 현지 특성에 맞게 조정하는 것이 \"하나의 영역, 하나의 정책\"의 핵심이라고 말했습니다."},{"s":"로보테라, 2년 연속 APEC CEO 서밋에 초청받아 실제 휴머노이드 로봇 애플리케이션 선보여","so":"The Straits Times","tm":"11/19 19:41","c":1,"r":"sg","u":"https://www.straitstimes.com/paid-press-releases/robotera-invited-to-apec-ceo-summit-for-second-consecutive-year-showcases-real-world-humanoid-robot-applications-20261119","p":1795084860,"a":1795090023,"t":"ROBOTERA Invited to APEC CEO Summit for Second Consecutive Year, Showcases Real-World Humanoid Robot Applications","su":"베이징, 2026년 11월 19일 /PRNewswire/ -- AI 기반 임바디드 AI(로봇처럼 몸을 가진 인공지능) 기업 ROBOTERA가 두 번째 공동으로 2026 APEC CEO 서밋에 초대되었습니다. 자세한 내용은 straitstimes.com에서 확인하세요."},{"s":"옵티머스로봇 빅뉴스, 성장성이 높은 종목을 소개합니다","so":"21财经","tm":"11/19 19:26","c":1,"r":"cn","u":"https://www.21jingji.com/article/20261119/herald/7f268a856c81d21e6adc930c171a649b.html","p":1795083960,"a":1795158300,"t":"Optimus机器人大消息，高成长潜力股有这些","su":"(원제 : 603931, 직선상한가! 옵티머스 로봇 빅뉴스, 성장가능성 높은 종목들이다) A주 시장 휴머  투모로우엑스 서밋(TomorrowX Summit)에 영상 링크를 통해 참석해 여러 사업 진행 상황을 공개했다. 그는 옵티머스 휴머노이드(사람을 닮은 로봇) 로봇이 앞으로 12~18개월 안에 설거지, 청소, 건조, 보관 등 집안일을 완료할 것으로 예상된다고 말했다. 테라팹 연구공장은 내년 6월 첫 번째 테스트 칩을 시험생산할 계획이며, 2028년 말까지 1단계 대량생산을 달성하기 위해 노력하고 있다. xAI는 현재 매월 약 0.5기가와트의 컴퓨팅 성능을 추가하며, 내년에는 이를 월 1기가와트 이상으로 늘릴 예정입니다. 머스크는 또한 우주선이 완전하고 신속하게 재사용되면 궤도 진입 비용이 약 100배 감소할 것으로 예상한다고 말했습니다. Neuralink는 30명 이상의 피험자에게 뇌-컴퓨터 인터페이스 장치를 이식했습니다. 그는 엔비디아에 대해 이야기할 때 젠슨 황 CEO를 마이클 조던(Michael Jordan)에 비유하며 자신이 기술 기업 창업자 중 최고의 인물이라고 말했다. 젠슨 황의 리더십을 잃으면 엔비디아는 큰 타격을 입을 것입니다."},{"s":"벨기에 인텔리프로브, 270만 유로 투자 유치…휴머노이드에 생체 신호 측정 기술 적용","so":"로봇신문","tm":"11/19 16:58","c":1,"r":"kr","u":"https://www.irobotnews.com/news/articleView.html?idxno=49692","p":1795075137,"a":1795090018,"su":"벨기에 헬스테크 스타트업 인텔리프로브(IntelliProve)가 카메라로 심박수와 혈압 등 생체 신호를 측정하는 기술을 휴머노이드(사람을 닮은 로봇) 로봇에 적용하기 위해 270만"},{"s":"중국 휴머노이드 로봇, 공장 투입 본격화…작업 속도는 숙련공의 절반 수준","so":"로봇신문","tm":"11/19 16:37","c":1,"r":"kr","u":"https://www.irobotnews.com/news/articleView.html?idxno=49689","p":1795073854,"a":1795090018,"su":"중국 휴머노이드(사람을 닮은 로봇) 로봇기업들이 제조업 생산현장에 로봇을 본격 투입하고 있지만, 작업 속도와 경제성 측면에서는 여전히 개선해야 할 과제가 많은 것으로 나타났다.중국"},{"s":"현대모비스, 휴머노이드 부품 공급 속도…미래 경쟁력 높인다","so":"한국경제","tm":"11/19 15:10","c":1,"r":"kr","u":"https://www.hankyung.com/article/202611197574i","p":1795068620,"a":1795071831,"su":"AI 추천 뉴스 현대모비스, 휴머노이드(사람을 닮은 로봇) 부품 공급 속도…미래 경쟁력 높인다 현대모비스가 자동차를 넘어 로봇 부품으로 사업 영역을 넓히고 있다. 현대자동차그룹의 로봇 계열사 보스턴다이내믹스의 휴머노이드 ‘아틀라스’에 장착할 액추에이터 시제품을 이달부터 생산하는 등 차세대 기술을 대거 선보이면서다. 현대모비스는 지난달 3분기 실적(회사가 번 돈 성적표) 발표에서 액추에이터, 제어기, 핸드그리퍼(로봇 손) 등 로봇 부품 기술을 확보해 국내외 휴머노이드 업체에 공급하겠다는 구상을 밝혔다."},{"s":"마음AI, 한양대 ERICA·두산로보틱스와 피지컬AI 산학협력 업무협약 체결","so":"로봇신문","tm":"11/19 14:27","c":1,"r":"kr","u":"https://www.irobotnews.com/news/articleView.html?idxno=49684","p":1795066028,"a":1795071831,"su":"마음AI가 한양대학교 ERICA, 두산로보틱스와 피지컬AI 분야 인재양성과 산학협력을 위한 협력체계를 구축했다.마음AI는 18일 한양대학교 ERICA에서 열린 ‘"},{"s":"길을 닦는 4족 탐사, 휴머노이드 진입 검증 : 보스턴 다이나믹스 아틀라스 휴머노이드 로봇이 반도체 제조 분야에 처음으로 진입","so":"财联社","tm":"11/19 13:14","c":1,"r":"cn","u":"https://www.cls.cn/detail/2539331","p":1795061640,"a":1795094317,"t":"四足探勘铺路、人形进场验证：波士顿动力Atlas人形机器人首次进入半导体制造领域","su":"①보스턴다이내믹스 Atlas는 2027년 초 테스트를 위해 GF의 웨이퍼 공장에 들어갈 예정이며, 이로써 GF는 휴머노이드(사람을 닮은 로봇) 로봇을 테스트하는 최초의 반도체 제조업체가 될 것입니다. ②GlobalFoundries는 4년 동안 검사에 Spot을 사용했으며 90,000개 이상의 작업을 완료했습니다. 아틀라스의 차별점은 반복적인 검사가 아닌 듀얼 암 작동에 있습니다. '계장반일보'가 19일 보도했다(왕추판 기자) 최근 현대차그룹 로봇 자회사 보스턴다이내믹스가 반도체 제조사 글로벌파운드리(남의 반도체를 대신 만들어 주는 공장)와 협력해 휴머노이드 로봇 '아틀라스'의 현장 테스트를 진행하고, 4족 로봇 '스팟'의 적용 범위를 확대한다고 밝혔다."},{"s":"일반 모델과 로봇 전용 모델이 함께 진화합니다. 어떤 로봇 테마 ETF를 선택할 것인가? Robotics ETF Invesco(159559)는 로봇 산업 체인의 여러 링크를 다루고 있습니다.","so":"Jiemian.com","tm":"11/19 12:44","c":1,"r":"cn","u":"https://www.jiemian.com/article/15349768.html","p":1795059873,"a":1795071833,"t":"通用模型与机器人专用模型协同演进，机器人主题类ETF选哪个？机器人ETF景顺(159559)覆盖机器人产业链多个环节","su":"Robot ETF(여러 주식을 묶어 파는 상품) Invesco(159559)는 National Securities Robot Industry Index(980022)를 밀접하게 추적합니다. 풍력 데이터에 따르면 Shenwan 1급 산업에 따르면 국가 증권 로봇 지수의 상위 3대 가중치 산업은 기계 및 장비(43.23%), 자동차(14.32%), 전력 장비(13.83%)입니다."},{"s":"휴머노이드 투성이의 electronica 반도체 각사가 노리는 신상기 : 모노즈쿠리 종합판 메일 매거진","so":"EE Times Japan","tm":"11/19 12:30","c":1,"r":"jp","u":"https://eetimes.itmedia.co.jp/ee/articles/2611/19/news013.html","p":1795059000,"a":1795071835,"t":"ヒューマノイドだらけのelectronica 半導体各社が狙う新商機：モノづくり総合版メルマガ 編集後記","su":"독일 뮌헨에서 개최된 세계 최대급의 일렉트로닉스 전시회 「electronica 2026」(2026년 11월 10~13일)의 회장은 휴머노이드(사람을 닮은 로봇) 투성이였습니다."},{"s":"인도, 스타트업들이 글로벌 시장을 노리는 가운데 Bengaluru Tech Summit에서 로봇 공학 야망 선보여","so":"CNA","tm":"11/19 11:20","c":1,"r":"sg","u":"https://www.channelnewsasia.com/asia/india-robotics-bengaluru-tech-summit-global-market-6562626","p":1795054824,"a":1795058122,"t":"India showcases robotics ambitions at Bengaluru Tech Summit as startups eye global market","su":"인도의 스타트업들은 산업 부문을 위한 휴머노이드(사람을 닮은 로봇)를 개발하고 있지만 자금 제약과 수입 부품에 대한 의존도 때문에 어려움을 겪고 있습니다."},{"s":"평가 1점: GPT의 구현 능력은 도약했고, 북미 로봇 체인은 규모 측면에서 변곡점에 도달했습니다.","so":"第一财经","tm":"11/19 10:40","c":1,"r":"cn","u":"https://www.yicai.com/news/103446094.html","p":1795052441,"a":1795128529,"t":"壹评级：GPT具身能力跃升，北美机器人链迎放量拐点","su":"GPT-6.2는 공식적으로 출시되었으며 실제 기계 평가에서 이전 세대보다 훨씬 앞서 있었습니다. 일반 모델의 로봇 조작 능력은 계속 진화하고 있습니다. 제일재경의 \"One Rating\"은 모델 일반화 기능의 획기적인 발전이 하드웨어 외에 중요한 산업 원동력이 되었으며 북미 공급망(부품·재료가 오가는 연결망)의 규모가 증가할 것으로 예상하고 있다고 믿습니다. \"One Rating\"은 시각적 피드백과 결합된 일반 모델이 다단계 계획과 결과 자체 검토를 실현하여 장면 적응 비용을 크게 줄이고 전용 분해 모델의 가치 공간을 압축할 수 있다고 지적했습니다. 데스크톱 평가는 아직 휴머노이드(사람을 닮은 로봇) 로봇의 연속 작동 시나리오에 직접적으로 적용할 수는 없지만 API 비용 절감으로 상용화 기반이 개선되었으며 데이터 요구 사항이 고품질 실제 상호 작용에 초점을 맞추게 되었습니다. 모델이 점차 사용 가능한 수준에 가까워짐에 따라 주요 고객은 실제 기계 테스트 및 온톨로지 반복을 가속화하며 이는 액추에이터, 정밀 변속기 및 감지 하드웨어에 대한 R&D 투자 확대를 직접적으로 주도합니다."},{"s":"트럼프·시진핑은 포옹하는데…中 로봇 기술자 줄줄이 美 비자 퇴짜 [차이나 워치]","so":"한국경제","tm":"11/19 10:05","c":1,"r":"kr","u":"https://www.hankyung.com/article/202611196635i","p":1795050323,"a":1795058110,"su":"트럼프·시진핑은 포옹하는데…中 로봇 기술자 줄줄이 美 비자 퇴짜 [차이나 워치], 中 로봇 기술자 40% 비자 거부 당해 美, 중국 로봇 기업에 비자 장벽 반도체(전자기기의 두뇌 부품) 이어 로봇까지&hellip;中 기술자 입국 차단"},{"s":"국산 휴머노이드 키운다면서…대학 로봇 10대 중 9대 중국산","so":"파이낸셜뉴스","tm":"11/19 09:46","c":1,"r":"kr","u":"https://www.fnnews.com/news/202611181405437966","p":1795049161,"a":1795058110,"su":"정부가 국산 휴머노이드(사람을 닮은 로봇) 로봇 산업 육성에 속도를 내고 있지만 국내 대학 연구 현장에서는 중국산 로봇이 시장을 장악한 것으로 나타났다."},{"s":"장원테크, 20년 마그네슘 기술로 휴머노이드 공략…2027년 양산 목표","so":"에너지경제신문","tm":"11/19 09:15","c":1,"r":"kr","u":"https://www.ekn.kr/web/view.php?key=20261119024061843","p":1795047300,"a":1795058110,"su":"장원테크가 20여년간 축적한 마그네슘 경량화 기술을 앞세워 휴머노이드(사람을 닮은 로봇) 로봇 부품시장에 진출한다. 글로벌 전장업체와 로봇부품 공급을 협의하고 있으며 2027년 양산을 목표로 사업화에.."},{"s":"미국 비자 거부로 CES를 앞두고 Xpeng과 다른 중국 로봇 제조업체가 타격을 입었습니다.","so":"Nikkei Asia","tm":"11/19 09:05","c":1,"r":"us","u":"https://asia.nikkei.com/business/technology/us-visa-denials-hit-xpeng-other-chinese-robot-makers-ahead-of-ces","p":1795046700,"a":1795058113,"t":"US visa denials hit Xpeng, other Chinese robot makers ahead of CES","su":"기술 통제가 확대됨에 따라 기술 직원은 이동 장애에 직면함"},{"s":"Humyn Labs는 로봇공학에 대한 실제 데이터를 수집하기 위해 4,700만 달러를 모금했습니다.","so":"The Rob es/view/797594","p":1795032000,"a":1795046365,"t":"フィジカルAI時代のロボット産業 ロボネクスト2026（1）安川電機上席執行役員ロボット事業部長・岡久学氏"},{"s":"소블린 AI로 움직이는 일본 로봇 시대의 국산 기반과 데이터 주권 지키는 도전","so":"日経ビジネス電子版","tm":"11/19 05:00","c":1,"r":"jp","u":"https://business.nikkei.com/atcl/gen/19/00081/102800990/","p":1795032000,"a":1795042028,"t":"ソブリンAIへ動く日本 ロボット時代の国産基盤とデータ主権守る挑戦","su":"생성 AI가 일과 생활에 들어가는 가운데 AI를 해외 거대 테크 기업에 의지하는 위협이 의식되기 시작했다. 서비스 정지 및 정보 유출 위험 외에도 해외로의 디지털 관련 지급도 부풀어오고 있다. 일본에서는 정부가 국산 기반 모델 개발을 뒷받침해 노에트라의 시동, 로봇 대기업의 데이터 연계, 기업의 안전 대책과 대처가 펼쳐진다. 자국에서 AI를 가진 '소블린 AI'의 현재지를 과거 기사에서 되돌아 본다."},{"s":"피지컬 AI 세계에 존재감을 보여주는 일본 로봇 개발의 강점","so":"日経BOOKプラス","tm":"11/19 05:00","c":1,"r":"jp","u":"https://bookplus.nikkei.com/atcl/column/110600809/110600001/","p":1795032000,"a":1795042029,"t":"フィジカルAI 世界に存在感を示せる日本のロボット開発の強み","su":"데이터 수집·기반 개발, 기업이나 연구 기관의 개발 지원을 다루는 일반 사단법인 AI 로봇 협회, 통칭 AIRoA는, 장래의 로봇상을 어떻게 그려, 일본이 진행해야 할 방향을 어떻게 생각하고 있는지. 이사장·오가타 테츠야씨에게 물었다."},{"s":"대만 공장의 휴머노이드 로봇 부품은 2027년 샘플 검증을 위해 함께 보내질 예정이며, 2028년은 대규모 생산에 중요한 해가 될 것입니다.","so":"DIGITIMES","tm":"11/19 03:44","c":1,"r":"tw","u":"https://www.digitimes.com.tw/tech/dt/n/shwnws.asp?id=775229","p":1795027440,"a":1795042026,"t":"台廠人形機器人零組件2027拚送樣驗證 2028成放量關鍵年","su":"테슬라의 옵티머스가 캘리포니아 공장에서 조기 양산을 시작한다고 발표해, 휴머노이드(사람을 닮은 로봇) 로봇 산업이 프로토타입 개발에서 상용화로 점차 옮겨가는 구체적인 타임라인에 대한 기대감이 높아지고 있다. 대만 공장은 전체 기계에 관여하지 않지만 핵심 부품 공급망(부품·재료가 오가는 연결망) 역할을 합니다. 샘플 배송부터 고객 검증, 소량 공급 단계 진입까지 오리는 수년간 노를 저으며 테이블 위를 움직이기 시작했습니다. <b..."},{"s":"휴머노이드 로봇이 수익에 기여할 때까지 기다리세요. 공급망은 주요 제조업체의 주문을 차단하는 두 가지 조건을 밝힙니다.","so":"DIGITIMES","tm":"11/19 03:17","c":1,"r":"tw","u":"https://www.digitimes.com.tw/tech/dt/n/shwnws.asp?id=775242","p":1795025820,"a":1795042027,"t":"人形機器人貢獻營收再等等 供應鏈揭兩條件卡位大廠訂單","su":"휴머노이드(사람을 닮은 로봇) 로봇 시장은 아직까지 비즈니스 모델을 모색하는 단계이다. 공급망(부품·재료가 오가는 연결망) 업계 관계자들은 현 단계에서 업계는 제품 설계의 지속적인 조정 필요성, 높은 부품 비용 등의 과제에 직면할 뿐만 아니라 단말기 애플리케이션 시나리오 및 고객 요구 사항도 아직 완전히 확정되지 않았다고 말했습니다. 미래에는 로봇의 발전이 이족 보행 휴머노이드 형태로만 국한되지 않을 수도 있습니다. 특정 작업 요구에 맞게 설계된 전문 로봇도 중요한 시장이 될 것입니다... var ST = null, STLOAD = false;

function kdate(off){ var d = new Date(Date.now() + 9*3600e3 - off*86400e3); return d.toISOString().slice(0,10); }
function loadStats(){

function cnt(day, th){                     // 하루·테마의 뉴스 수 (국가 필터 반영)
  var v = ((ST.days||{})[day]||{})[th] || {}, n = 0;

  return n;
}
function period(){                         // [이번 기간 날짜들, 비교할 이전 기간 날짜들, 이름]
  var L = {today:[0,1,'오늘(진행 중)'], yday:[1,1,'어제'], w:[1,7,'최근 7일'], m:[1,30,'최근 30일'],
           h:[1,182,'최근 6개월'], y:[1,365,'최근 1년']}[S.sp] || [1,1,'어제'];
  var cur = [], prev = [];
  for(var i=0;i<L[1];i++){ cur.push(kdate(L[0]+i)); prev.push(kdate(L[0]+L[1]+i)); }
  return [cur, prev, L[2]];
}
function have(days){ var n=0; days.forEach(function(d){ if((ST.days||{})[d]) n++; }); return n; }   // 기간 안에 실제로 모인 날 수
function firstDay(){ var k = Object.keys(ST.days||{}).sort(); return k[0] || ''; }
function sum(days, th){ var n=0; days.forEach(function(d){ n += cnt(d, th); }); return n; }
function capped(days, th){
  var c = ST.capped || {}, hit = false;
  days.forEach(function(d){ (c[d]||[]).forEach(function(s){ var p = s.split('|');
    if(p[0]===th && (S.region==='all' || p[1]===S.region)) hit = true; }); });
  return hit;
}
function byN(a,b){ return b.n - a.n || (a.th < b.th ? -1 : 1); }        // 많은 순 (같으면 이름순으로 고정)
function ranks(rows, ok){                  // 이전 기간 순위 (r.pr) — 이전 기간 자료가 없으면 표시 안 함
  rows.forEach(function(r){ r.pr = null; });
  if(!ok) return;
  rows.slice().sort(function(a,b){ return b.p - a.p || (a.th < b.th ? -1 : 1); }).forEach(function(r, i){ r.pr = i; });
}
function mv(r, i){                         // 순위 변동: 🔺 빨강 몇 계단 오름 · 🔻 파랑 몇 계단 내림
  if(r.pr === null) return '<span class="mv"></span>';                       // 비교할 이전 기간 자료 없음
  if(!r.n && !r.p) return '<span class="mv same" title="두 기간 모두 0건">-</span>';
  var d = r.pr - i;
  if(d > 0) return '<span class="mv up" title="이전 기간 '+(r.pr+1)+'위 → '+d+'계단 상승">▲<i class="gap"></i>'+d+'</span>';
  if(d < 0) return '<span class="mv dn" title="이전 기간 '+(r.pr+1)+'위 → '+(-d)+'계단 하락">▼<i class="gap"></i>'+(-d)+'</span>';
  return '<span class="mv same" title="순위 그대로 ('+(i+1)+'위)">-</span>';   // 변동 없음
}
function chg(n, p, hc, hp){
  if(hp === 0) return '<span class="chg">·</span>';          // 비교할 이전 기간 자료가 아직 없음
  if(hc && hp && hc !== hp){ n = n/hc; p = p/hp; }            // 모인 날 수가 다르면 하루 평균끼리 비교
  if(!p) return n ? '<span class="chg">신규</span>' : '';
  var pct = Math.round((n-p)/p*100);
  if(pct > 0) return '<span class="chg up">▲'+pct+'%</span>';
  if(pct < 0) return '<span class="chg dn">▼'+(-pct)+'%</span>';
  return '<span class="chg">–</span>';
}

// ───────── 📈 장기 추이 (2021.1~, GDELT) ─────────
var HI = null, HILOAD = false;
S.sm = load('sm', 'd'); S.lp = load('lp', 'all'); S.ly = load('ly', 0);
if(S.lp === 'ly') S.lp = 'yr';          // 예전 '작년' 버튼 → 연도별
function loadHist(){
  if(HILOAD) return; HILOAD = true;
  fetch(D.history_url + '?t=' + Date.now(), {cache:'no-store'}).then(function(r){ return r.json(); })
    .then(function(j){ HI = j; prepHist(); if(D.themes[S.tab].stats) renderMain(); })
    .catch(function(){ HI = {err:1}; if(D.themes[S.tab].stats) renderMain(); });
}
function dIdx(s){ return Math.round((Date.parse(s+'T00:00:00Z') - Date.parse(HI.since+'T00:00:00Z'))/86400e3); }
function iDate(i){ return new Date(Date.parse(HI.since+'T00:00:00Z') + i*86400e3).toISOString().slice(0,10); }
function prepHist(){                       // 달 경계(배열 위치) 미리 계산
  if(!HI || !HI.s || !HI.end) return;
  HI.n = dIdx(HI.end) + 1; HI.months = []; HI.av = [];
  for(var i=0;i<HI.n;i++){ var ok = false;      // GDELT 자료가 있는 날 (서버가 멈춰 통째로 빠진 날은 false)
    for(var t in HI.s){ for(var k in HI.s[t]){ if(HI.s[t][k][i] != null){ ok = true; break; } } if(ok) break; }
    HI.av.push(ok); }
  var y = +HI.since.slice(0,4), m = +HI.since.slice(5,7), ey = +HI.end.slice(0,4), em = +HI.end.slice(5,7);
  while(y < ey || (y === ey && m <= em)){
    var a = dIdx(y+'-'+('0'+m).slice(-2)+'-01'), ny = m===12 ? y+1 : y, nm = m===12 ? 1 : m+1;
    var b = Math.min(HI.n, dIdx(ny+'-'+('0'+nm).slice(-2)+'-01'));
    HI.months.push({y:y, m:m, a:a, b:b, full: b - a === dIdx(ny+'-'+('0'+nm).slice(-2)+'-01') - a});
    y = ny; m = nm;
  }
}
function hsum(th, a, b, rk){               // [a, b) 날짜 칸의 합 (국가 필터 반영) · 자료 없는 날(null)은 건너뜀
  var s = (HI.s||{})[th] || {}, n = 0;
  for(var k in s){ if(rk ? k !== rk : !(S.region==='all' || k===S.region)) continue;
    var arr = s[k]; for(var i=Math.max(0,a); i<Math.min(b, arr.length); i++) if(arr[i] != null) n += arr[i]; }
  return n;
}
function avn(a, b){ var n=0; for(var i=Math.max(0,a); i<Math.min(b, HI.n); i++) if(HI.av[i]) n++; return n; }   // 자료 있는 날 수
function years(){ var a = [], y0 = +HI.since.slice(0,4), ty = +HI.end.slice(0,4); for(var y=ty-1; y>=y0; y--) a.push(y); return a; }   // 다 지난 해 (최근 먼저)
function pickYear(){ var ys = years(); return ys.indexOf(S.ly) >= 0 ? S.ly : (ys[0] || +HI.end.slice(0,4)); }
function lperiod(){                        // [이번 a,b] [비교 a,b 또는 null] 이름
  var M = HI.months, last = M[M.length-1], lf = last.full ? M.length-1 : M.length-2, ty = +HI.end.slice(0,4);
  if(S.lp === 'lm' && lf >= 0){ var x = M[lf], p = M[lf-1];
    return [[x.a, x.b], p ? [p.a, p.b] : null, x.y+'년 '+x.m+'월', '전달 대비']; }
  if(S.lp === 'ty'){ var a = dIdx(ty+'-01-01'), pa = dIdx((ty-1)+'-01-01'), len = HI.n - a;
    return [[a, HI.n], pa >= 0 ? [pa, pa+len] : null, ty+'년 (1월 1일~'+HI.end.slice(5).replace('-','/')+')', '작년 같은 기간 대비']; }
  if(S.lp === 'yr'){ var yy = pickYear(), ya = Math.max(0, dIdx(yy+'-01-01')), yb = Math.min(HI.n, dIdx((yy+1)+'-01-01')), pa = dIdx((yy-1)+'-01-01');
    return [[ya, yb], pa >= 0 ? [pa, ya] : null, yy+'년 전체', yy-1+'년 대비']; }
  return [[0, HI.n], null, HI.since.slice(0,7).replace('-','.')+' ~ '+HI.end.replace(/-/g,'.')+' 전체', ''];
}
function mspark(th){                       // 달별 흐름 (작은 선, 진행 중인 달은 빼고)
  var M = HI.months.filter(function(x){ return x.full; }), vals = M.map(function(x){ var d = avn(x.a, x.b); return d ? hsum(th, x.a, x.b)/d : 0; });
  if(vals.length < 2) return '';
  var mx = Math.max.apply(null, vals.concat([1])), w = 64, h = 20;
  var pts = vals.map(function(v,i){ return (i*(w/(vals.length-1))).toFixed(1)+','+(h-2-(v/mx)*(h-4)).toFixed(1); }).join(' ');
  return '<svg class="spark" viewBox="0 0 '+w+' '+h+'" width="'+w+'" height="'+h+'" aria-hidden="true"><polyline points="'+pts+'" fill="none" stroke="var(--acc)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></svg>';
}
function ldetail(th){                      // 달별 막대 + 나라별 구성
  var M = HI.months, dn = M.map(function(x){ return avn(x.a, x.b); });
  var vals = M.map(function(x, i){ return dn[i] ? hsum(th, x.a, x.b)/dn[i] : 0; });   // 하루 평균 (자료 빠진 날 영향 없게)
  var mx = Math.max.apply(null, vals.concat([1])), W = chartW(), H = 120, bw = W/M.length;
  var bars = vals.map(function(v,i){
    var x = M[i], bh = Math.max(v ? 2 : 0, (v/mx)*(H-32)), bx = i*bw + 1, y = H-14-bh;
    return '<g class="bar"><rect x="'+bx.toFixed(1)+'" y="0" width="'+(bw-2).toFixed(1)+'" height="'+(H-14)+'" fill="transparent"/>'+
      '<rect x="'+bx.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+(bw-2).toFixed(1)+'" height="'+bh.toFixed(1)+'" rx="2" fill="var(--acc)"'+(x.full?'':' opacity=".55"')+'/>'+
      '<title>'+x.y+'년 '+x.m+'월'+(x.full?'':' (진행 중)')+' · 하루 평균 '+Math.round(v).toLocaleString()+'건 · 한 달 '+hsum(th, x.a, x.b).toLocaleString()+'건'+
      (dn[i] < x.b - x.a ? ' (자료 '+dn[i]+'일치)' : '')+'</title></g>';
  }).join('');
  var ticks = M.map(function(x,i){ return x.m===1 ? '<line x1="'+(i*bw).toFixed(1)+'" y1="'+(H-14)+'" x2="'+(i*bw).toFixed(1)+'" y2="'+(H-9)+'" stroke="var(--sub)"/>'+
      '<text x="'+(i*bw+2).toFixed(1)+'" y="'+(H-1)+'" class="ax">'+x.y+'</text>' : ''; }).join('');
  var axis = ticks + '<line x1="0" y1="'+(H-14)+'" x2="'+W+'" y2="'+(H-14)+'" stroke="var(--line)"/>'+
             '<text x="0" y="9" class="ax">최대 하루 평균 '+Math.round(mx).toLocaleString()+'건</text>';
  var P = lperiod(), parts = D.regions.filter(function(r){ return (HI.regions||[]).indexOf(r.k) >= 0; }).map(function(r){
    return [r, hsum(th, P[0][0], P[0][1], r.k)]; }).filter(function(x){ return x[1] > 0; }).sort(function(a,b){ return b[1]-a[1]; });
  var pm = parts.length ? parts[0][1] : 1;
  var rows = parts.map(function(x){
    return '<div class="crow"><span class="cl">'+esc(x[0].l)+'</span><span class="cb"><i style="width:'+Math.max(2, x[1]/pm*100)+'%"></i></span><span class="cn">'+x[1].toLocaleString()+'</span></div>';
  }).join('') || '<div class="note">이 기간 기사 없음</div>';
  return '<div class="det"><div class="dt">달별 하루 평균 뉴스 수 ('+HI.since.slice(0,4)+'년 1월~)'+(S.region==='all'?'':' · '+esc(RL[S.region]))+'</div>'+
    '<svg class="bars" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(th)+' 달별 뉴스 수">'+bars+axis+'</svg>'+
    '<div class="dt">'+esc(P[2])+' 나라별</div>'+rows+'</div>';
}
function renderLong(h){
  if(!HI){ loadHist(); $('main').innerHTML = h + '<p class="none">장기 추이를 불러오는 중…</p>'; return; }
  if(HI.err || !HI.s || !HI.months || !HI.months.length){ $('main').innerHTML = h + '<p class="none">장기 추이를 아직 받는 중이에요. 처음 한 번은 몇 시간 걸려요. 조금 뒤에 다시 열어 주세요.</p>'; return; }
  if(S.region === 'world'){ $('main').innerHTML = h + '<p class="none">장기 추이는 나라별(한국·미국·중국·대만·홍콩·일본·싱가포르)로만 셀 수 있어요. 위에서 \'전체\'나 다른 나라를 골라 주세요.</p>'; return; }
  var P = lperiod();
  h += '<p class="note">GDELT(전 세계 뉴스 기록) 자료 · 본문에 테마 단어가 나온 기사 수 · 일주일에 한 번 갱신 · '+esc(HI.end.slice(5).replace('-','/'))+'까지 · 업데이트 '+esc(HI.updated||'')+'</p>';
  if(!HI.complete) h += '<div class="warn">⏳ '+HI.since.slice(0,4)+'년 1월부터 자료를 아직 받는 중이에요. 다 받기 전엔 일부 테마·나라·연도가 0이나 빈칸으로 보여요. 자료 서버가 느려서 하루쯤 걸려요 (봇이 알아서 이어 받음).</div>';
  h += '<div class="seg lp">' + [['all','전체'],['lm','지난달'],['ty','올해'],['yr','연도별']].map(function(x){
    return '<button data-lp="'+x[0]+'" class="'+(S.lp===x[0]?'on':'')+'">'+x[1]+'</button>'; }).join('') + '</div>';
  if(S.lp === 'yr') h += '<div class="seg ly">' + years().slice().reverse().map(function(y){   // 옛날 → 최근 순서로 (기본 선택은 최근 해)
    return '<button data-ly="'+y+'" class="'+(pickYear()===y?'on':'')+'">'+y+'</button>'; }).join('') + '</div>';
  var dc = avn(P[0][0], P[0][1]), dp = P[1] ? avn(P[1][0], P[1][1]) : 0, span = P[0][1] - P[0][0];
  if(span - dc > 0) h += '<div class="warn">ℹ️ 이 기간 중 '+(span-dc)+'일은 GDELT 서버 사정으로 자료가 비어 있어요 ('+span+'일 중 '+dc+'일치). 합계는 그만큼 적게 잡히고, ▲▼ 비교는 하루 평균끼리 해요.</div>';
  var rows = (HI.themes||[]).map(function(th){ return {th:th, n:hsum(th, P[0][0], P[0][1]), p: P[1] ? hsum(th, P[1][0], P[1][1]) : null}; })
                            .sort(byN);
  ranks(rows, !!P[1] && dp > 0);
  var mx = rows.length ? Math.max(1, rows[0].n) : 1, total = 0; rows.forEach(function(r){ total += r.n; });
  h += '<div class="tot">'+esc(P[2])+(S.region==='all'?' · 7개 나라':' · '+esc(RL[S.region]))+' · 총 <b>'+total.toLocaleString()+'</b>건 <span class="chgnote">'+(P[1]?'('+P[3]+')':'')+'</span></div>';
  h += rows.map(function(r, i){
    var open = S.open['L'+r.th];
    return '<div class="srow'+(open?' open':'')+'" data-th="'+esc(r.th)+'" data-l="1">'+
      '<div class="sline">'+mv(r, i)+'<span class="rk">'+(i+1)+'</span><span class="sn">'+esc(r.th)+'</span>'+
      '<span class="sb"><i style="width:'+Math.max(r.n?2:0, r.n/mx*100)+'%"></i></span>'+
      '<span class="sc">'+r.n.toLocaleString()+'</span>'+(r.p===null ? '<span class="chg"></span>' : chg(r.n, r.p, dc, dp))+mspark(r.th)+'</div>'+
      (open ? ldetail(r.th) : '') + '</div>';
  }).join('');
  h += '<footer>· 순위 왼쪽 <span style="color:#f87171">▲</span>/<span style="color:#60a5fa">▼</span> = 비교 기간(전달·작년 같은 기간·전년)보다 몇 계단 오르고 내렸는지<br>· 오른쪽 작은 선 = '+HI.since.slice(0,4)+'년 1월부터 달별 흐름(하루 평균), 줄을 누르면 달별 그래프와 나라별 구성<br>'+
       '· 일별 집계(기사 제목 기준, 구글 뉴스)와 세는 방법이 달라 숫자 크기는 서로 비교하지 말고 흐름만 보세요<br>'+
       '· 한국·중국·일본 기사도 GDELT 가 영어로 번역해 둔 것을 영어 검색어로 셉니다 · 자료가 빠진 날은 0이 아니라 빈칸으로 둠</footer>';
  $('main').innerHTML = h;
