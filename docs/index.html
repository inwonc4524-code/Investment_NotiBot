.none{color:var(--sub);margin:24px 4px;text-align:center}

.card:hover{background:var(--card2)}.card:active{opacity:.75}
.meta{color:var(--sub);font-size:12px}
.title{font-weight:500;margin-top:3px}
.orig{color:var(--sub);font-size:12px;margin-top:3px}
.new{margin-left:4px;color:var(--red);font-size:11px;font-weight:700;letter-spacing:.3px}

footer{margin:36px 4px 0;padding-top:14px;border-top:1px solid var(--line);color:var(--sub);font-size:12px;line-height:1.7}
footer b{color:var(--text);font-weight:600}

#dim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:5}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:6;max-width:760px;margin:auto;max-height:82vh;overflow-y:auto;

.grab{width:38px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 12px}
.s-title{font-size:17px;font-weight:600;margin:4px 0 2px;line-height:1.45}
.s-label{margin:16px 0 4px;color:var(--acc);font-size:12px;font-weight:700;letter-spacing:.5px}
.s-sum{font-size:15px;line-height:1.75}.s-sum.empty{color:var(--sub);font-size:13.5px}
.s-btns{display:flex;gap:8px;margin-top:20px}
.s-btns button,.s-btns a{flex:1;text-align:center;padding:12px;border-radius:10px;font:inherit;font-size:14.5px;text-decoration:none}
.s-btns button{background:transparent;border:1px solid var(--line);color:var(--sub)}
.s-btns a{background:var(--acc);color:#1f1e1d;font-weight:600}

"p":1794196080,"a":1794205981,"t":"Dow, S&P 500, Nasdaq Futures Rebound After Sharp AI Selloff Last Week: NVDA, AMD, VIR, SNDK In Focus","su":"지난 주 시장은 11월 중간선거 결과에 의해 지배되었으며, 민주당이 상원과 하원을 모두 휩쓸었습니다."},{"s":"Jensen Huang은 자신의 불신앙에 대해 Nvidia에 사과했습니다. 그의 아이들이 직원에 있습니다.","so":"WSJ","tm":"11/09 12:38","c":1,"r":"us","u":"https://www.wsj.com/tech/ai/jensen-huang-apologized-to-nvidia-for-his-infidelity-his-kids-are-on-staff-190f3176","p":1794195480,"a":1794205981,"t":"Jensen Huang Apologized to Nvidia for His Infidelity. His Kids Are On Staff."},{"s":"S&P500 선물, AI주 회복 여부 주시하며 상승…美 국채금리↑","so":"연합인포맥스","tm":"11/09 12:29","c":1,"r":"kr","u":"https://news.einfomax.co.kr/news/articleView.html?idxno=4443759","p":1794194958,"a":1794205981,"su":"9일 오전 아시아 시장에서 미국 주가지수 선물은 최근 급락했던 인공지능(AI) 관련주의 회복 가능성을 주시하면서 상승세를 나타냈다. 미국 국채금리는 전반적으로 올랐다.연합인포맥스 지수선물 통합화면(화면번호 6520)에 따르면 한국 시각으로 오전 10시5분 기준 E-미니 S&P500 지수 선물은 전장 대비 0.26% 오른 7,421.25에 거래됐다.기술주 중심의 E-미니 나스닥100 지수 선물은 전장 대비 0.16% 상승한 27,126.50를 나타냈다.지난주 금요일 뉴욕증시는 지난주 급락했던 반도체주를 중심으로 저가 매수세가 유입되"},{"s":"아크는 AI 버블을 두려워하지 않고 '이 주식'에 돈을 더 추가해 추세를 거스른다! 무무 자매: 시장이 걱정될수록 저는 더 낙관적입니다. 강세장은 아직 끝나지 않았습니다.","so":"鉅亨網","tm":"11/09 12:23","c":1,"r":"tw","u":"https://m.cnyes.com/news/id/6652398","p":1794194616,"a":1794195210,"t":"方舟不怕AI泡沫逆勢加碼「這一股」！木頭姐：市場越擔憂我越樂觀、牛市未完","su":"우드는 AI에 대한 우려가 신뢰를 훼손하지 않았으며 현재의 변동을 기술 혁명의 \"두 단계 전진, 한 단계 후퇴\"로 간주했다고 말했습니다.\nARK는 가장 자신 있는 보유량으로 지난 주 보유량을 늘렸고 SpaceX 포지션도 높아졌습니다. 그녀는 주가가 반등할 때 이익을 취하고 하락할 때 더 많은 것을 추가할 것을 제안했습니다.\n그녀는 AI 혁명이 아직 끝나지 않았다고 예측했으며, 이를 2027년까지 연장할 것으로 예상됩니다. ARKK는 올해 35% 이상 상승했습니다."},{"s":"수익 보고서가 통과되었지만 놀라움이 부족합니다. 미국 기업 이익은 기대치를 초과하며 지난 4년 중 가장 적을 수 있습니다.","so":"鉅亨網","tm":"11/09 12:20","c":1,"r":"tw","u":"https://m.cnyes.com/news/id/6652533","p":1794194403,"a":1794195212,"t":"財報過關卻少了驚喜 美企獲利超預期幅度恐創近4年最小","su":"3분기 S&P 500 이익은 대부분 예상보다 좋았지만, 평균은 2.7% 더 높았는데, 이는 2022년 4분기 이후 가장 작은 초과 폭이었습니다.\n현재 S&P 500의 84%가 재무 보고서를 발표했으며, 주당 순이익의 84%가 기대치를 초과했습니다. 기대에 미치지 못한 기업의 주가는 평균 1.1% 하락하는데 그쳤는데, 이는 최근 5년간 3.1%보다 낮은 수준이다.\n지난 목요일 기술주는 2020년 이후 최악의 날을 보냈습니다. 시장은 민주당 집권 이후 규제 강화 전망과 AI 인프라 및 데이터 센터 확장 전망을 우려했습니다."},{"s":"나가사키 기타요다이와 나가사키 미나미야마가 결승 진출에 고교 럭비 나가사키현 예선","so":"毎日新聞","tm":"11/09 12:08","c":1,"r":"jp","u":"https://mainichi.jp/articles/20261109/k00/00m/310/041000c","p":1794193697,"a":1794195183,"t":"長崎北陽台と長崎南山が決勝進出へ 高校ラグビー長崎県予選","su":"제106회 전국 고교 럭비 대회(매일 신문사 등 주최) 나가사키현 예선은 8일, 오무라시 모리조노마치의 현영 방호원 럭비장에서 준결승 2 시합이 있어, 나가사키 기타요다이가 99-0으로 나가사키 북을, 나가사키 남산이 26-24로 나가사키공을 각각 내리고, 결승"},{"s":"독일인 82%, 메르츠 총리 정권에 불만족, 취임 이후 최고치","so":"鉅亨網","tm":"11/09 12:04","c":1,"r":"tw","u":"https://m.cnyes.com/news/id/6652468","p":1794193485,"a":1794195213,"t":"82%德國人對總理梅爾茨執政不滿 執政以來新高","su":"독일인의 82%는 메르츠 총리의 집권에 불만족스러워했는데, 이는 총리 취임 이후 최고치다. Juheng.com과 Zhong Yongxiang이 편집했습니다. 종합외국뉴스. 지난 7일 독일 언론이 발표한 여론조사에 따르면, 조사 대상 독일인의 82%가 메르츠 총리의 집권에 불만족스러워하는 것으로 나타났다. 이 비율은 그가 취임한 이후 새로운 최고치다. 독일 신사회문제연구소의 여론조사 결과에 따르면 메르츠의 집권 성과에 대해 질문했을 때 응답자의 82%가 불만족스러운 것으로 나타났습니다. 이는 10월 초 이전 여론조사보다 2%포인트 증가한 수치입니다. 응답자의 13%만이 만족했습니다. 연초와 비교해 독일인의 메르츠에 대한 불만은 크게 높아졌다. 올해 1월 응답자의 67%는 그의 직무 수행에 불만족했고, 24%는 찬성했다."},{"s":"미국 주식의 AI 썰물은 스토리 주식을 씻어내고, 홍콩 주식의 \"수익성 있는 AI\"는 재평가 창을 환영합니다 | 실시간 뉴스 - 뉴스","so":"etnet 經濟通","tm":"11/09 12:04","c":1,"r":"hk","u":"http://www.etnet.com.hk/www/tc/news/home_categorized_news_detail.php?newsid=ETN361109704","p":1794193440,"a":1794206005,"t":"美股AI退潮洗走故事股，港股「盈利AI」迎重估窗口 | 即時新聞 - 新聞","su":"2026/11/09 11:04 \"Jiajia Viewpoint - Mai Jiajia\" 미국 주식 시장에서 AI의 썰물이 스토리 주식을 휩쓸었고 홍콩 주식의 \"수익성 있는 AI\"가 재평가 창을 맞이했습니다. '지아지아 관점' 최근 미국 증시에서 인공지능(AI) 주식이 급락한 것은 AI 수요가 갑자기 사라진 것이 아니라, 가치평가 기준이 다시 쓰여지고 있다는 점이다. 시장에서는 데이터 센터, 칩, 컴퓨팅 성능에 대한 투자를 성장의 보장으로 여겼습니다. 이제는 막대한 자본 지출이 언제 수익, 이익, 현금 수익으로 전환될지에 대해 더욱 관심을 기울이고 있습니다. 규제 위험, 자금 조달 비용 및 투자 회수 기간에 대한 불확실성으로 인해 가치가 높은 컨셉 주식, 차입에 대한 의존도 또는 아직 수익을 내지 못한 주식이 가장 먼저 타격을 입게 되었습니다. 즉, AI 트레이딩은 '많이 투자할수록 좋다'에서 '투자하면 돈을 벌 수 있다'로 바뀌고 있는 것이다."},{"s":"버핏과 애크먼도 비슷한 경고를 내립니다! 이제 투자자들은 무엇을 해야 할까요?","so":"鉅亨網","tm":"11/09 12:00","c":1,"r":"tw","u":"https://news.cnyes.com/news/id/6652473","p":1794193206,"a":1794195214,"t":"巴菲特和阿克曼發出相似警告！投資者現在該做什麼？","su":"AI 열풍에 힘입어 미국 증시는 2023년 초 이후 약 100% 상승했고, S&P 500 지수는 계속해서 신고가를 경신하고 있다.\n버핏과 애크먼은 투기와 레버리지 거래가 과열되고 있으며 시장은 카지노와 같다고 경고했다.\nHuida와 Amazon의 주가 수익 비율은 각각 약 21배와 24배입니다. 되돌림은 레이아웃 기회로 간주될 수 있습니다."},{"s":"대만 주식이 좋은데, 미국 주식도 놓치지 마세요! 펀드 대모 Xiao Biyan: \"풍수는 교대로 진행해야 한다\", \"시장, 폭, 성과\"라는 주식 선택 사고방식을 마스터해야 함","so":"TVBS新聞網","tm":"11/09 11:54","c":1,"r":"tw","u":"https://news.tvbs.com.tw/money/4047768","p":1794192840,"a":1794195216,"t":"台股好，美股也別錯過！基金教母蕭碧燕：「風水要輪流轉」掌握「市、寬、績」選股心法","su":"대만 주식은 최근 AI 공급망 강화로 수혜를 입어 많은 투자자들의 관심을 끌었다. 펀드 대모 Xiao Biyan은 TVBS '금융 권력' 프로그램에서 사람들이 대만 주식의 뛰어난 성과 때문에 미국 주식에 투자할 필요가 없다고 느낄 수 있다고 상기시켰습니다. 그러나 시장 회전은 예측하기 어렵고 \"풍수는 차례대로 진행되어야 합니다.\" 다른 시장의 기회를 살펴볼 수도 있습니다. 그녀는 대만 주식을 급하게 팔 필요가 없다고 제안했다. 개인 상황에 따라 매달 신규 투자 자금을 조정하고 점차적으로 해외 시장에 통합할 수 있습니다."},{"s":"보도자료 : 11월 8일 「좋은 치아의 날」, 개 고양이의 이빨을 “가르치는 사람”을 기르는 인정 강좌가 접수 개시(PR TIMES)","so":"毎日新聞","tm":"11/09 11:53","c":1,"r":"jp","u":"https://mainichi.jp/articles/20261109/pr2/00m/020/157000c","p":1794192783,"a":1794195186,"t":"プレスリリース：11月8日「いい歯の日」、犬猫の歯みがきを“教える人”を育てる認定講座が受付開始（PR TIMES）","su":"―수의사·독 트레이너·치과 위생사가 지도. 3세 이상의 개의 약 80%에 치주병 등의 구강 질환이 보인다는 과제에 도전한다"},{"s":"월스트리트와 경쟁하다 - Wen Jie | 정책 리스크 증가, AAOI의 장기 전망은 변함 없음(영화 포함) | 특별 주제 - 뉴스","so":"etnet 經濟通","tm":"11/09 11:44","c":1,"r":"hk","u":"https://www.etnet.com.hk/www/tc/news/news-article.php?section=features&category=interview&newsid=415928","p":1794192240,"a":1794195198,"t":"比拼華爾街－溫傑 | 政策風險上升，AAOI長期前景未變（有片） | 專題透視 - 新聞","su":"월스트리트와 경쟁하다 - Wen Jie | 정책 리스크 높아져, AAOI의 장기 전망은 변함없다(필름 포함) 최근 조정 끝에 지난 금요일(6일) 자금이 일시적으로 인공지능(AI)과 칩주에 복귀하면서 필라델피아 반도체 지수(페이반)가 4.2% 반등했다. 그러나 미국 3대 주가지수는 S&P 500과 나스닥이 각각 1.1%, 0.3% 하락한 반면 다우존스산업평균지수는 0.5% 하락하는 등 또다시 서로 다른 흐름을 보였다. 일주일 내내 반도체 부문은 여전히 ​​큰 폭으로 하락했으며, 비용은 12.2% 감소했다. Blue Wave가 AI 인프라 기대에 미치는 영향 지난주 AI 컨셉주가 급락한 이유는 미국 중간선거에서 비롯됐다. 민주당은 뜻밖의 '블루 웨이브'를 일으키며 상하원 장악력을 탈환했다. 특히 텍사스 주지사의 변화는 주목할 만하다."},{"s":"A ,"t":"オリコンニュース：［あすから］吉野家「牛すき祭」開催 「牛すき鍋膳」が100円引きに","su":"요시노야는, 10일 오전 11시부터 24일 오후 3시까지, 전국의 요시노가 점포에서, 「규스키나베젠」등의 대상 상품을 부가세 포함 가격으로부터 100엔 할인으로 판매하는 「규스키 축제」를 개최한다. 【사진】자택에서 모두 즐길 수 있는 「소 냄비 패밀리 팩」"},{"s":"올해의 IPO 투자, 격언대로 고전 IPOs Struggle in Tech Selloff. Berkshire Has a Winner.｜【일간】2026년 11월 9일호","so":"バロンズ・ダイジェスト","tm":"11/09 11:20","c":1,"r":"jp","u":"https://barrons.jiji.com/article/9074","p":1794190838,"a":1794195189,"t":"今年のIPO投資、格言通り苦戦 IPOs Struggle in Tech Selloff. Berkshire Has a Winner.｜【日刊】2026年11月9日号","su":"신규주식공개(IPO) 종목에 대한 투자는 피해야 한다는 낡은 투자 격언은 올해도 우호했다. 많은 유명 상표가 IPO 가격 미만으로 거래되고 있다. 본지는 2026년 미국 주식시장에 신규 상장한 18종목을 조사했다. 스페이스X＜SPCX＞나 셀러브라스 시스템즈＜CBRS＞, 인니오＜INIO＞, 매디슨 에어 솔루션즈＜MAIR＞, 저지・마이크스・서브즈＜JMKE＞등의 주목 안건이 대상. 그 결과 15종목이 IPO가격을 밑돌고 있는 것으로 나타났다. 많은 유명 상표는 IPO 가격… 올해 IPO 투자, 말 그대로 고전 열기는 식기 쉬운 Michael Nagle/Bloomberg"},{"s":"월스트리트 트레이더들은 지금이 낮은 가격으로 돈을 벌 수 있는 좋은 시기라고 말합니다. S&P 500 지수는 이번 주 동안 2.7% 하락했으며 연말까지 8,000에 도달할 것으로 예상됩니다. 미국 선거 추적 - 특별 주제","so":"信報網站","tm":"11/09 11:20","c":1,"r":"hk","u":"https://www.hkej.com/features/article/%E7%BE%8E%E5%9C%8B%E5%A4%A7%E9%81%B8%E9%81%B8%E6%83%85%E8%BF%BD%E8%B9%A4/1431049423/%E8%8F%AF%E7%88%BE%E8%A1%97%E4%BA%A4%E6%98%93%E5%93%A1%E5%96%8A%E4%BD%8E%E6%92%88%E5%A5%BD%E6%99%82%E6%A9%9F","p":1794190819,"a":1794195201,"t":"華爾街交易員喊低撈好時機 標指一周跌2.7% 年底仍上望8000 美國大選選情追蹤 - 專題","su":"지난 주 미국 증시는 급격한 하락세를 보였으며, S&P 500 지수는 이번 주 동안 2.7% 하락했습니다. 대형 기술주들이 주도하는 나스닥 100 지수는 4.91% 더 하락했다. Morgan Stanley, Goldman Sachs 등 주요 은행의 전략가들은 지금이 바닥을 찾을 수 있는 기회라고 믿습니다. Bank of America와 Standard Chartered는 중간 선거 결과가 미국 달러에 대한 낙관적인 전망을 바꾸지 못했다고 지적했습니다. 매도파 끝에는 비AI 거래가 무너지고 인공지능(AI) 언와인딩이 대세였다. 지난 목요일 현재 미국 주식시장의 가치는 10월 6일 최고치 이후 5조7000억 달러나 증발했다. 모건스탠리 전략가 마이클 윌슨은 앞으로 2~3주는 위험 노출을 늘리는 기간이 될 것이라고 말했다."},{"s":"아시아주 반발, 나스닥 내리막에서 안도 엔비디아 불륜은 중석","so":"株探","tm":"11/09 11:20","c":1,"r":"jp","u":"https://s.kabutan.jp/news/n202611090445/","p":1794190800,"a":1794195190,"t":"アジア株反発、ナスダック下げ止まりで安堵 エヌビディア不倫は重石","su":"아시아주 반발, 나스닥 하락 정지로 안도 3675.36(+ , 투자 결정을 내리기 전에 사용자가 직접 해당 내용을 확인하거나 전문가의 조언을 구해야 합니다. \"이코노믹스\"는 본 내용을 신뢰하여 발생하는 어떠한 손실이나 손해에 대해서도 책임을 지지 않습니다."},{"s":"19개 아랍 정당이 아이젠코트를 지지해 네타냐후를 곤경에 빠뜨렸다","so":"公視新聞","tm":"11/09 10:00","c":1,"r":"tw","u":"https://news.pts.org.tw/article/834590","p":1794186000,"a":1794195258,"t":"阿拉伯政黨19席挺艾森科特 納坦雅胡陷困境","su":"선거 후 이스라엘 내각 구성의 진전 측면에서 야당 지도자 아이젠코트는 의회 120석 중 절반 이상인 아랍 정당 합동목록(Joint List of Arab Party)을 포함해 총 67명의 의회 의원으로부터 추천을 받았다. 네타냐후 총리는 46석을 얻었다. 그러나 67석 추천이 연립정부 구성을 의미하는 것은 아니다. 공동명단에는 정부 외부 지원 의지는 있지만 내각 참여 의사는 없다고 명시돼 있기 때문이다. 병역, 종교, 안보 정책에 있어서도 정당 간에는 분명한 차이가 있습니다. 헤르조그 대통령은 추가 협의가 진행될 것이며 내각을 구성할 후보자가 8일 공식적으로 지정될 것으로 예상된다고 말했습니다."},{"s":"일본 소비자 시장 : 귀여운 핀치 뮤직 힐링 트렌드가 불고있다","so":"公視新聞","tm":"11/09 10:00","c":1,"r":"tw","u":"https://news.pts.org.tw/article/834595","p":1794186000,"a":1794206066,"t":"日本消費市場 吹起可愛捏捏樂療癒風","su":"최근 몇 년 동안 일본 학교와 소셜 플랫폼에서는 '핀치 토이' 트렌드를 선보였습니다. 부드럽고 부드러우며, 꼬집었을 때 스트레스를 완화하고, 천천히 튀어오를 수 있는 이런 종류의 부드러운 실리콘 장난감은 성인과 어린이들에게 꽤 인기가 있습니다. '핀치펀'이 인기를 끈 이유는 장난감의 소재가 사람 피부의 부드러운 촉감에 가까워 만졌을 때 편안함을 느낄 수 있고, '행복 호르몬'으로 불리는 호르몬인 옥시토신을 분비해 힐링과 스트레스 해소 효과가 있기 때문이라고 의사들은 분석했다."},{"s":"iM증권 \"엘앤에프 수익성 부진에 목표주가 하향, LFP양극재 출하 증가로 중장기 성장성 높아\"","so":"비즈니스포스트","tm":"11/09 09:50","c":1,"r":"kr","u":"https://www.businesspost.co.kr/BP?command=article_view&num=451478","p":1794185440,"a":1794206048},{"s":"은시전기차신소재(06128)가 리튬전지 소재업체를 1억 달러 투자에 매각했고, 인수자는 현금과 주식배당으로 대금을 지불했다.","so":"etnet 經濟通","tm":"11/09 09:43","c":1,"r":"hk","u":"https://www.etnet.com.hk/www/tc/news/news-article.php?section=categorized&category=latest&newsid=20261109183","p":1794184980,"a":1794195246,"t":"烯石電車新材料(06128)售鋰電池材料公司涉資1億美元，買方以現金及配股支付","su":"2026-09-11 08:43 그래펙스 전기차신소재(06128)가 리튬전지 소재업체를 1억 달러 투자에 매각했고, 매수자는 현금과 주식배당금으로 지급했다. Graphex Electric Vehicle New Materials(06128)는 인수자인 M2i Global과 총 1억 달러 규모의 자회사 Graphex Technologies LLC 매각에 관한 최종 계약을 체결했다고 발표했습니다. 대가는 3단계에 걸쳐 지급됩니다. 계약 체결이 완료되면 구매자는 3000만 달러를 먼저 지불하고, 이 중 300만 달러는 현금으로 지불하게 된다. 구매자는 이를 위해 노트를 발행하고 나머지 2,700만 달러는 주당 3달러 다행히도 두 지진 모두 쓰나미 위기를 촉발하지 않았습니다."},{"s":"가오슝 대기오염 방지 시위, 시장 후보들에게 PM2.5 농도 낮추기 노력 촉구","so":"公視新聞","tm":"11/08 20:28","c":1,"r":"tw","u":"https://news.pts.org.tw/article/834835","p":1794137295,"a":1794145920,"t":"高雄反空污遊行 籲市長候選人承諾降PM2.5濃度","su":"남부대기오염방지연합은 오늘(8일) 센트럴파크에서 시청까지 걸어가며 대기오염 퇴치, 숲 보호, 가오슝 살리기의 염원을 담은 행진을 시작했습니다. 그들은 모든 시장 후보들에게 다음 임기 동안 가오슝의 PM2.5 농도를 대폭 낮추고 국가적으로 개정된 법적 기준인 입방미터당 12마이크로그램에 도달하도록 노력할 것을 촉구했습니다. 매년 가을에는 중국 이남에서도 여러 노동계와 사회운동 단체가 공동으로 주최하는 집회와 시위가 열려 대기오염 방지 운동을 지지하고 있다."},{"s":"주식시장 안정을 위해 11월 9일 5차례 항공금지 조치를 시행했고, 시장 보호를 위해 5000억 국가안보기금이 시장에 진입했다.","so":"公視新聞","tm":"11/08 20:22","c":1,"r":"tw","u":"https://news.pts.org.tw/article/834834","p":1794136952,"a":1794145920,"t":"11/9起祭5項禁空令穩定股市 5千億國安基金進場護盤","su":"AI 전망에 대한 우려로 대만 증시는 지난 6일 엄청난 붕괴를 겪었다. 한때 장중 3,700포인트 이상 급락해 역사상 최대 장중 하락 및 일일 충격 기록을 세웠습니다. 지난 달 지수는 약 10,000포인트 하락했습니다. 정부는 주식시장을 안정시키고 9일 5대 시장안정대책을 내놨다. 공매도 주문이 시작됐고, 시장을 보호하기 위해 5000억 국가 안보 기금이 출시됐다. 업계에서는 시장 패닉 영향을 완화할 수 있을 것으로 기대하고 있다. 게다가 지난 6일에는 대만 주식 조달이 급락하고 미국 증시는 반등했다. 9일 대만 증시 실적은 각계각층의 관심을 끌었다."},{"s":"가족들은 이 10대가 사기를 당한 혐의를 받고 결국 해외로 갔다고 말했다. 몸값 60만 달러를 요구했고, 관련 부대가 그를 구출하는 데 도움을 주기를 바랐다.","so":"公視新聞","tm":"11/08 20:18","c":1,"r":"tw","u":"https://news.pts.org.tw/article/834832","p":1794136692,"a":1794148491,"t":"家屬稱少年疑受騙淪落海外 遭索60萬贖金盼相關單位協助救人","su":"타이중의 한 어머니는 아들이 올해(2026년) 9월 초 친구들과 함께 북쪽으로 여행을 가겠다고 말했지만 그 이후로 연락이 끊길 줄은 몰랐다고 말했다. 어머니는 휴대전화로 위치를 추적한 결과 그가 태국 방콕에 있는 것으로 확인됐다. 그러다가 그는 밀수꾼 단체로부터 20만 위안에서 60만 위안 사이의 몸값을 요구하는 메시지를 받았다. 이제 가난에서 탈출한 또 다른 사람은 미얀마 공원에서 수상한 십대의 모습을 봤다며 어머니를 걱정하게 만들고 관련 부서에서 사람들을 구출할 수 있기를 바란다고 말했습니다."},{"s":"Li Sichuan은 Lao Fu의 법률에 반대 서명하지 않은 Zhuo Rongtai를 비난했습니다. Su Qiaohui는 이를 강제로 통과시키는 것은 위헌이라고 말했습니다.","so":"公視新聞","tm":"11/08 20:06","c":1,"r":"tw","u":"https://news.pts.org.tw/article/834807","p":1794136001,"a":1794148492,"t":"李四川批卓榮泰不副署老福法 蘇巧慧稱強行通過違憲","su":"9대 1 총선이 막바지에 접어들면서 곳곳에서 총리 선거에도 연기가 피어오르고 있다. 신베이시 국민당 리 쓰촨(Li Sichuan) 인민당 주석과 황궈창(Huang Guochang) 인민당 주석이 다시 한 번 연합하여 청백의 기세를 만들어냈습니다. DPP Su Qiaohui는 오늘 밤 Xiao Meiqin 부주석에게 투표 통합을 도와달라고 요청할 것입니다. 그러나 Zhuo Rongtai 행정주석은 노인복지법 개정안에 반대 서명하지 않았습니다. Li Sichuan은 Zhuo Rongtai에게 말을 할 수 없다고 Su Qiaohui를 비난했습니다. 두 사람 모두 신베이시 원로들에게 사과해야 합니다. 쑤차오후이는 이에 맞서 법안이 위헌적으로 통과되도록 강요하고 거버넌스를 몰아내며 예산 논의가 헌법 정신으로 돌아갈 것을 촉구했습니다."},{"s":"침대 센서 시스템의 개발 PM【후지사와】◆대형 종합 부품 메이커/연봉 1,000만엔～","so":"日経転職版","tm":"11/08 18:20","c":1,"r":"jp","u":"https://career.nikkei.com/agent/170/jobdetail5420406/","p":1794129621,"a":1794148486,"t":"ベッドセンサーシステムの開発PM【藤沢】◆大手総合部品メーカー／年収1,000万円～"},{"s":"칫솔은 상자에 넣어도 괜찮나요? 전문가들이 밝히는 \"3가지 규칙\": 최대 1개월 동안 휴대용 칫솔을 사용하세요 - 국제","so":"中時新聞網","tm":"11/08 18:01","c":1,"r":"tw","u":"https://www.chinatimes.com/realtimenews/20261108002190-260408","p":1794128467,"a":1794148494,"t":"牙刷放進盒子就沒事？專家揭「3大守則」 攜帶型牙刷最多用1個月- 國際","su":"휴대가 간편한 칫솔로 이동 중에 사용할 때나 직장에서 점심 식사 후 이를 닦을 때 매우 실용적입니다. 그런데 이런 종류의 칫솔을 제대로 세척하고 있나요? 어떤 사람들은 집에서 사용하는 칫솔을 정기적으로 바꾸지만, 휴대용 칫솔은 자주 사용하지 않고 더 오래 사용할 수 있다고 생각합니다. 일본 마이니치방송(MBS) 투데이"},{"s":"투자 넘어 수주·양산으로…LFP 양극재 사업화 속도","so":"이투데이","tm":"11/08 17:34","c":1,"r":"kr","u":"https://www.etoday.co.kr/news/view/2645037","p":1794126840,"a":1794128040,"su":"엘앤에프, 국내 셀 3사 고객사 확보…9월부터 양산포스코퓨처엠, 기존 설비 전환·전용공장 건설 병행북미 ESS 성장에 비중국산 소재 확보 수요 확대▲엘"},{"s":"금주의 사건/행정부는 '노인복지법'에 반대하지 않고 민주당이 미국 중간선거에서 승리(2026.11.2~11.8)","so":"公視新聞","tm":"11/08 17:13","c":1,"r":"tw","u":"https://news.pts.org.tw/article/834805","p":1794125585,"a":1794128040,"t":"一週大事／行政院不副署《老人福利法》 美期中選舉民主黨勝選（2026.11.2-11.8）","su":"\"PSTV 뉴스 네트워크\"는 이번 주 국내외 주요 행사를 선정해 드립니다. 초점은 다음과 같습니다: 정치 위안부가 \"노인복지법\" 개정안에 반대 서명하지 않음, 두 번째 F-16V 전투기가 대만에 도착함, Gao Jin Sumei가 공산당 간첩 사건에 연루되어 기소되어 14년 형을 선고받았음, 대만 주식 시장이 시장에서 최대 하락세를 기록함, Yongfeng 은행 계좌가 해킹됨, 대만 64호선 패킷 손실 사건의 운전사가 형을 선고받았음. 13년 만에 미국 중간선거에서 민주당이 승리했다."},{"s":"9년 전 산시성(陝西省)에서 호주로 가던 음식 배달 기사가 노숙자에게 칼에 찔려 사망했다. 중국 커뮤니티는 충격을 받았습니다 | 본토 팩스 | 양안","so":"UDN","tm":"11/08 16:57","c":1,"r":"tw","u":"https://udn.com/news/story/7332/9864712?from=udn-catelistnews_ch2","p":1794124641,"a":1794128040,"t":"9年前從陝西赴澳洲外賣騎手被流浪漢捅死華人圈震驚| 大陸傳真| 兩岸","su":"중국 음식 배달 기사 펑젠밍(47)씨가 호주 멜버른에서 음식을 배달하던 중 51세 노숙자에게 칼을 찔려 숨진 혐의를 받고 있다. 이번 사건은 국내외 중국인 커뮤니티를 충격에 빠뜨렸다. 많은 현지 중국인들이 고인을 추모하며 꽃을 바쳤습니다. 멜버른 주재 중국 총영사관은 호주가 이번 사건에 대해 철저한 조사를 실시하고 엄중히 처벌할 것을 요구했다. 사건이 발생한 빅토리아 주지사도 충격을 표하며 살인범을 엄중히 처벌할 것이라고 말했다. Feng Nan은 중국에 있는 가족의 생계를 유지하기 위해 호주에서 9년 동안 열심히 일했습니다. 그는 아침부터 밤까지 음식을 배달하는 일을 한다. 지역 상점에서는 모금 행사를 시작했습니다. 한 점원은 너무 겁에 질려 현지 치안 환경이 불안하다며 중국으로 돌아가기 위해 밤새 비행기표를 샀다."},{"s":"이스라엘 대통령, 야당 지도자 아이센코트에게 정부 구성 승인 발표","so":"公視新聞","tm":"11/08 14:23","c":1,"r":"tw","u":"https://news.pts.org.tw/article/834797","p":1794115412,"a":1794128040,"t":"以色列總統宣布 授權反對派領袖艾森科特組閣","su":"이스라엘 총선 이후 여당은 과반수 확보 없이 교착상태에 빠졌다. 헤르조그 현 이스라엘 대통령은 지난 7일 새 정부 구성을 위해 전 참모총장인 야당 지도자 아이젠코트에게 우선권을 주겠다고 공식 발표했다. 네타냐후 총리는 즉각 긴급성명을 발표해 연립정부 수립을 촉구하고, 야당이 정부를 구성하면 국가안보를 위협할 것이라고 경고했다."},{"s":"일본의 새로운 세금 환급 시스템 | 새로운 절차는 아직 조정이 필요합니다. 최종 세금 환급금이 현금으로 손실되어 승객이 불만을 나타냄","so":"Now 新聞","tm":"11/08 14:18","c":1,"r":"hk","u":"https://news.now.com/home/international/player?newsId=668776","p":1794115118,"a":1794128040,"t":"日本退稅新制｜新手續尚待適應 旅客不滿現金退稅蝕尾數","su":"[나우뉴스채널] 일본의 새로운 세금환급 제도가 시행된 지 일주일이 지났지만 여권, 신용카드 인증 실패 등 운영상의 문제가 여전히 많다. 많은 관광객들은 새로운 시스템 하에서 높은 처리 수수료와 나머지 금액에서 현금 환불이 차감된다는 사실에 불만을 갖고 있습니다."},{"s":"내일 COP31이 개최되고 환경부는 일련의 포럼을 개최할 예정입니다.","so":"自由時報","tm":"11/08 14:11","c":1,"r":"tw","u":"https://news.ltn.com.tw/news/life/breakingnews/5633488","p":1794114706,"a":1794177868,"t":"COP31明登場 環境部將舉辦系列論壇","su":"COP31將於明天登場，環境部將同步啟動「氣候脈動．台灣同行」系列論壇，每場論壇將特別安排COP31現場快報，將自土耳其連線傳回最新動態，以讓國人掌握最新情報，將國際氣候議題實質轉化為國內政策與產業轉型契機。2026年第31屆聯合國氣候變化綱要公約締約方大會 （UNFCCC COP31） 將於9日至20日在土耳其安塔利亞舉行，環境部表示，今年COP31將以「從承諾走向落實」為核心，推動各國執行國家自定貢獻，並提出2035年量化目標，包括全球電氣化比例達35%；全球廢棄物產生量的成長幅度減半；建築部門能源消耗密集度至少降低25%。"},{"s":"타이중에서 SUV 차량 운전자가 정지하지 않아 사고를 냈습니다. 한 여성이 줄을 건너던 중 부상을 입어 심각한 부상을 입어 사망했습니다.","so":"公視新聞","tm":"11/08 14:09","c":1,"r":"tw","u":"https://news.pts.org.tw/article/834798","p":1794114594,"a":1794128040,"t":"台中休旅車駕駛未停讓肇事 婦人行穿線遭輾傷重不治","su":"어제(7일) 저녁 6시쯤, 타이중시 시툰구에서 치명적인 교통사고가 발생했습니다. 61세 여성이 횡단보도를 건너다가 신호등이 녹색으로 바뀌자 좌회전하는 SUV 차량에 치였습니다. 운전자도 눈치 채지 못한 것 같습니다. 그 결과 앞바퀴와 뒷바퀴가 차례로 여성을 덮쳐 심각한 부상을 입어 사망했다. 경찰 예비 조사 결과, 운전자의 음주 및 약물 검사에서는 이상이 없는 것으로 나타났으며, 자세한 사고 원인은 아직 밝혀지지 않았다."},{"s":"펑지아 야시장에서 한 관광객의 배낭에 불이 붙었고, 모바일 전원 공급 장치의 리튬 배터리가 사고 원인으로 의심됩니다.","so":"公視新聞","tm":"11/08 14:06","c":1,"r":"tw","u":"https://news.pts.org.tw/article/834799","p":1794114387,"a":1794128040,"t":"逢甲夜市遊客背包起火 疑行動電源鋰電池肇禍","su":"타이중 펑지아 야시장에서는 어젯밤(7일) 한 관광객의 배낭에 불이 붙었는데, 내부에 있던 리튬 배터리가 불탔던 것으로 의심됩니다. 다행히 인근 상인이 공용 건조분말소화기를 가져와 진화에 성공해 인명피해는 없었다. 그러나 일부 전문가들은 건조 분말 소화기가 리튬 배터리나 이동식 전원 공급 장치로 인한 화재를 진압하는 데 적합하지 않다는 점을 상기시킵니다. 연소열을 중화시키기 위해 다량의 물을 사용하는 것이 화재를 진압하는 데 더 적절한 방법입니다."},{"s":"가오슝 냐오송 양철집 화재, 두 형제 탈출 전 사망","so":"公視新聞","tm":"11/08 14:04","c":1,"r":"tw","u":"https://news.pts.org.tw/article/834800","p":1794114240,"a":1794148496,"t":"高雄鳥松鐵皮屋民宅火警 2兄弟逃生不及身亡","su":"가오슝시 냐오송구 중청로의 한 주택에서 화재가 발생했습니다. 불은 삽시간에 옆집 다경간 철제 건물까지 번졌다. 그 결과 왕아무개(19세, 17세) 형제 2명이 금속 건물 2층에 갇혀 탈출할 시간도 없이 불동굴에서 사망했다. 8일 이른 아침에도 링야구 5층 티안추 빌딩에서 화재가 발생했다. 건물 전체가 임대아파트였기 때문에 여러 세입자가 한꺼번에 갇혔습니다. 경찰이 도착한 뒤 13명이 대피했고, 이 중 11명은 질식 등 신체적 불편을 호소해 병원으로 이송됐다."},{"s":"레독스 플로우 전지는 왜 장시간 방전을 향하는가――탱크를 크게 하면 용량이 늘어나는 발상을 해독하는 웨비나를 개최","so":"時事ドットコム","tm":"11/08 13:10","c":1,"r":"jp","u":"https://www.jiji.com/jc/article?k=000000090.000181124&g=prt","p":1794111000,"a":1794148488,"t":"レドックスフロー電池はなぜ長時間放電に向くのか――タンクを大きくすれば容量が増える発想を読み解くウェビナーを開催","su":"[재팬 브랜딩 주식회사]~홋카이도·미나미하야시 변전소에서 출력 1.5만 kW·용량 6만 kWh, 1년 경과 후에도 현저한 열화 없음. 출력과 용량을 따로 설계할 수 있는 특성을, 재팬 브랜딩 대표·마에다 유요시가 해설~축전 시스템의 기획·설계로부터 운영까지를 다루는 재팬 브랜딩 주식회사(본점:아이치현 이누야마시, 대표 이사:마에다 유요시, 이하 “당사”)는, GUS Technology(격대과기) 축전지의 일본 총대리점으로서 재생가능에너지의 보급에 따라 도입이 급증하는 「계통용 축전지」를 테마로 한 웨비나를, 20…"},{"s":"칠레 도로서 버스·트럭 충돌해 12명 사망","so":"公視新聞","tm":"11/08 12:00","c":1,"r":"tw","u":"https://news.pts.org.tw/article/834787","p":1794106849,"a":1794148498,"t":"智利公路車禍 巴士與貨車相撞已知12死","su":"칠레 교통사고: 버스와 트럭이 충돌해 12명이 사망. 출시 시간: 업데이트 시간: 칠레 중부 발파라이소 지역에서 심각한 교통사고가 발생해 최소 12명이 사망했습니다. 이번 대형 교통사고는 토요일 오전 9시경 산토도밍고 고속도로에서 발생했습니다. 여성과 어린이를 태운 버스가 트럭과 정면으로 충돌했고, 승용차도 피해를 입었습니다. 충돌한 두 차량의 앞부분은 심하게 변형되고 손상되었습니다. 현재 병원에서는 부상자 15명이 치료를 받고 있다. 사고 이후 당국은 사고 원인을 조사하는 동안 해당 구간의 통행을 중단했다. 우시찬/편집자"},{"s":"호주 열대 과일은 시장 수요를 공급하기 위해 남쪽으로 운송됩니다. 소셜 미디어가 구매 심리를 높인다","so":"公視新聞","tm":"11/08 11:58","c":1,"r":"tw","u":"https://news.pts.org.tw/article/834778","p":1794106696,"a":1794148500,"t":"澳洲熱帶水果南運供應市場需求 社群媒體助漲買氣","su":"잭프루트, 망고스틴과 같은 열대 과일은 주로 호주 퀸즈랜드 북부에서 재배되었습니다. 이제 그들은 주요 도시의 시장에 진출했습니다. 고향의 맛을 찾아 떠나는 이민자들에 더해, 커뮤니티에 올라온 짧은 영상의 도움으로 많은 사람들이 구매하고 맛보게 되면서 열대과일의 인기가 뜨겁게 달아오르고 있다."},{"s":"그만 물어보세요! 비행기를 탈 때 '1가지 요구 사항', 승무원이 정말 도와줄 수 없는 3가지 팁 - Life","so":"中時新聞網","tm":"11/08 11:41","c":1,"r":"tw","u":"https://www.chinatimes.com/realtimenews/20261108001098-260405","p":1794105698,"a":1794109980,"t":"別再問了！搭飛機「1要求」空姐真幫不了3招自救- 生活","su":"너무 춥거나 더운 기내에서 비행할 때 많은 승객들이 승무원에게 온도를 조절할 수 있는지 문의하지만 실제로 승무원이 할 수 있는 일은 없습니다. 한 고위 승무원은 모든 승객이 기내 온도에서 편안함을 느끼기는 어렵다고 말했습니다. 승객들은 추위를 두려워하기 때문에 기내 온도 변화에 따라 쉽게 옷을 추가하거나 벗을 수 있도록 탑승 시 양파 스타일의 옷을 입는 것이 좋습니다."},{"s":"메카트로닉스 엔지니어(오픈 포지션)【원칙 팀 배속/프라임 비율 91.1%】","so":"日経転職版","tm":"11/08 09:30","c":1,"r":"jp","u":"https://career.nikkei.com/agent/170/jobdetail5420424/","p":1794097855,"a":1794148489,"t":"メカトロニクスエンジニア（オープンポジション）【原則チーム配属/プライム比率91.1%】"},{"s":"5000선 턱밑까지 밀린 코스피…美 물가·AI 실적에 달린 반등 [증시전망대]","so":"www.dt.co.kr","tm":"11/08 05:03","c":1,"r":"kr","u":"https://www.dt.co.kr/article/12093673","p":1794081780,"a":1794148485,"su":"코스피가 한 주 만에 11% 넘게 추락하며 5000선마저 위협받고 있다. 미국 중간선거 이후 인공지능(AI) 데이터센터 규제 강화 우려가 기존의 투자 수익성 논란과 맞물리면서 국내 증시를 짓눌렀다. 이번 주에는 미국 물가 지표와 AI 클라우드 기업 코어위브의 실적 발표"}]},{"name":"⚡ 전고체배터리·ESS","note":"보유: KODEX 전고체배터리ESS TOP2플러스","breaking":false,"items":[{"s":"TECO, New Fiber 및 Chang Gungu Energy와 손을 잡고 국내 최초의 비하인드 에너지 저장 프로젝트를 시작하여 연간 전기 요금을 450만 위안 이상 절약 | 업계 종합 | 산업경제학","so":"UDN","tm":"11/09 15:13","c":6,"r":"tw","u":"https://udn.com/news/story/7241/9866794?from=udn-ch1_breaknews-1-cate6-news","p":1794204832,"a":1794206099,"t": om/jc/article?k=000000003.000187675&g=prt","p":1794190560,"a":1794195269,"t":"エコ革、系統用蓄電池事業が本格稼働フェーズへ。全国11か所の系統用蓄電所が系統連系完了、3か所が運転開始。","su":"[주식회사 에코 가죽]전국 6현에서 11안건·축전지 용량 합계 약 82.7MWh. 7개소가 시운전 중, 1개소가 계통 연계를 완료 주식회사 에코 가죽(본사:도치기현 사노시, 대표 이사 사장:이토 시게조)은, 전국 각지에서 추진하는 계통용 축전지 사업에 있어서, 2026년 11월 4일 현재, 11개소의 축전소에서 계통 연계가 완료한 것을 알고 있습니다. 이 중 3개소가 운전을 개시하고, 7개소가 시운전중, 남은 1개소도 계통 연계를 완료하고 있습니다. 11건의 설비 규모는 최대 수전 전력 합계 약 21.9MW, 축전지 용량 합계 약 82.7MWh에 이르렀습니다. 2026…"},{"s":"CNPC와 파나소닉, 쿤산 과학기술대학교와 손잡고 수소 에너지, AI 및 지속 가능한 혁신에 초점을 맞춘 Net Zero 포럼 개최 | 업계 뉴스 | 사업정보","so":"經濟日報","tm":"11/09 11:02","c":1,"r":"tw","u":"https://money.udn.com/money/story/11799/9862088","p":1794189738,"a":1794195286,"t":"中油、Panasonic攜手崑山科大辦淨零論壇 聚焦氫能、AI與永續創新 | 產業動態 | 商情","su":"이 글은 총 1904개의 단어로 구성되어 있습니다. 글로벌 기후 변화, 에너지 전환 및 녹색 공급망 구조 조정 추세에 직면하여 업계, 정부, 학계 및 연구 간의 영역 간 협력이 대만의 순제로 전환을 촉진하는 데 중요한 힘이 되었습니다. 대만 중국석유공사와 대만 파나소닉 그룹이 공동 주최하고 쿤산과학기술대학교가 주최하는 '2026 넷제로 전환. 지속가능한 대만 포럼'이 오늘(6일) 타이베이 JR 도쿄 호텔에서 개최된다. 이 행사에는 위안 행정고문 Li Mengyan, 환경부 기후 변화 행정관 Tsai Ling-yi 및 에너지, 기술 및 학계 대표자들이 참여하도록 초대됩니다. 이번 포럼은 2050년 순제로배출을 핵심으로 수소기술, AI 에너지 활용, 스마트 드론, 플라스틱 재활용, 친환경 인재 양성 등 5가지 주요 주제에 초점을 맞췄다. 포럼에서는 정책 교환과 산업 관행 공유를 통해 대만의 에너지 전환과 지속 가능한 혁신을 위한 개발 기회를 모색했습니다."},{"s":"전기버스가 대형 보조배터리로 변신! ITRI와 국립중성대학교, 마이크로그리드 시연 완료 | 산학연 연구 및 교육 | 사업정보","so":"經濟日報","tm":"11/09 11:02","c":1,"r":"tw","u":"https://money.udn.com/money/story/5723/9862144?from=edn_subcatelist_cate","p":1794189732,"a":1794195287,"t":"電動巴士變身大型行動電源！工研院攜手中正大學完成微電網實證 | 產學研訓 | 商情","su":"전기버스는 승객을 태울 뿐만 아니라 주차 시 '대형 보조 배터리'로 변신합니다! 경제부 에너지청 지원으로 산업기술연구소와 국립중성대학교가 '전기차 양방향 충방전 및 마이크로그리드 통합 포럼 및 시연행사'를 지난 6일 개최했다. 전기 버스는 양방향 충전 및 방전 기술을 사용하여 온보드 전력을 마이크로그리드에 피드백하고, 주차된 버스를 \"이동 에너지 저장 리소스\"로 전환하여 미래 피크 전력 조절, 비상 백업 및 그리드 복원력 향상을 위한 새로운 애플리케이션을 창출한다는 점을 성공적으로 입증했습니다. 경제부 에너지 관리 국장 Wu Zhiwei는 정부가 국가 '에너지 전환 2.0' 정책에 따라 재생 에너지, 심층적인 에너지 절약 및 분산형 마이크로그리드의 적용을 적극적으로 장려하고 있다고 말했습니다. 전기 자동차의 인기로 인해 온보드 배터리는 구동력을 제공할 뿐만 아니라 전력망을 지원할 수 있는 잠재력도 가지고 있습니다. 양방향 충전 및 방전과 스마트 에너지 관리 시스템(EMS)을 통해 미래에는 가상 발전소(VPP) 급전을 결합하여 오프 피크 충전, 피크 방전 및 비상 전력 공급을 실현하고 전력 시스템의 급전 유연성과 재해 복원력을 향상시킬 수 있습니다. 이번에 시연에 참가한 전기버스에는 280kWh 용량의 배터리가 탑재됐다. 이는 평균 소규모 가족이 한 달 가까이 소비하는 전력량과 맞먹는다. 충청대학교는 캠퍼스 마이크로그리드가 올해 2월 출범해 9월 캠퍼스 정전 시 즉각적인 전력 공급 역할을 했다고 지적했다."},{"s":"홍콩 주식 동향 | 항셍 지수는 100포인트 이상 상승했고, 칩 주식은 개선되고 있습니다.","so":"信報網站","tm":"11/09 10:57","c":1,"r":"hk","u":"https://m.hkej.com/landing/mobarticle2/id/4560904/%E6%B8%AF%E8%82%A1%E8%B5%B0%E5%8B%A2%E4%B8%A8%E6%81%92%E6%8C%87%E9%AB%98%E9%96%8B%E9%80%BE%E7%99%BE%E9%BB%9E%20%E6%99%B6%E7%89%87%E8%82%A1%E5%90%91%E5%A5%BD","p":1794189455,"a":1794195278,"t":"港股走勢丨恒指高開逾百點 晶片股向好","su":"지난 목요일 미국 AI 관련 주식이 큰 폭락세를 보인 뒤 지난 금요일 하락세는 일시적으로 멈췄고, 중국 컨셉주 성과를 반영하는 골든드래곤지수는 1.67% 상승했다. 항셍지수는 지난주 1187포인트 상승한 데 이어 오늘 아침에도 100포인트 이상 상승했다. 항셍지수는 143포인트(0.59%) 오른 24,625포인트로 출발했다. 전국지수는 51포인트(0.62%) 오른 8325포인트로 출발했다. S&P 500 지수는 41포인트(1.02%) 상승한 4119포인트로 출발했습니다. HSBC(00005)는 RMB 137.5에 보합세로 개장했습니다. HKEX(00388)는 결과 이후 0.3% 하락한 RMB 384.6에 시가를 기록했습니다. 이온(01299)"},{"s":"[신주 IPO] Yuanxin Energy Storage 9621이 장초기 1.24배 상승하여 랏당 6,060위안을 벌었습니다.","so":"香港經濟日報HKET","tm":"11/09 10:51","c":1,"r":"hk","u":"https://inews.hket.com/article/4221827/%E3%80%90%E6%96%B0%E8%82%A1IPO%E3%80%91%E9%81%A0%E4%BF%A1%E5%84%B2%E8%83%BD9621%E9%A6%96%E6%8E%9B%E6%97%A9%E6%AE%B5%E5%8D%871.24%E5%80%8D%E3%80%80%E6%AF%8F%E6%89%8B%E5%B8%B3%E9%9D%A2%E8%B3%BA6,060%E5%85%83","p":1794189109,"a":1794195280,"t":"【新股IPO】遠信儲能9621首掛早段升1.24倍 每手帳面賺6,060元"},{"s":"배터리 시장 판도 바뀐다… 韓은 美 ESS 성장에 ‘미소’, 中은 공급 과잉에 ‘울상’","so":"Chosunbiz","tm":"11/09 10:42","c":1,"r":"kr","u":"https://biz.chosun.com/industry/company/2026/11/09/5GVNFBVHXBAODESK3ZTXMDKTDI/","p":1794188520,"a":1794195264,"su":"배터리 시장 판도 바뀐다 韓은 美 ESS 성장에 미소, 中은 공급 과잉에 울상 CATL, 기대 이하 실적 외형 성장 속 수익성 고민 LG엔솔·삼성SDI는 美 ESS 수혜로 어닝 서프라이즈"},{"s":"주요 은행 보고서 | Morgan Stanley는 Meituan의 등급과 목표 가격을 하향 조정했습니다.","so":"信報網站","tm":"11/09 10:19","c":1,"r":"hk","u":"https://www.hkej.com/instantnews/stock/article/4560898/%E5%A4%A7%E8%A1%8C%E5%A0% r":"cn","u":"http://www.eeo.com.cn/2026/1109/1088426.shtml","p":1794202440,"a":1794206136,"t":"*ST赛为（300044）实控人周勇所持102万股将被司法拍卖","su":"경제 관찰자 네트워크 * ST Saiwei(300044)의 대주주이자 실제 지배자인 Zhou Yong이 보유한 회사 주식 102만 주가 사법 경매에 부쳐집니다. 질권 및 동결 주식 비중이 높고, 회사 지배권의 안정성이 주목받고 있다. 지배주주이자 실제 지배자인 Zhou Yong은 102만 주를 보유하고 있습니다(총 주식 수 기준)."},{"s":"강세 보복, 대만 지수 선물 2,000포인트 이상 급등","so":"旺得富理財網","tm":"11/09 14:28","c":1,"r":"tw","u":"https://wantrich.chinatimes.com/news/20261109900236-420101","p":1794202133,"a":1794206145,"t":"多頭報復反彈 台指期噴漲逾2,000點","su":"대만 지수 선물 강세장은 9일 반격에 나섰고, 장중 2,000포인트 이상의 강한 반등을 기록했으며, 일시적 최고치인 42,317포인트, 56,000로트가 거래되었습니다. 전자 선물은 146.7포인트 하락해 2,427.45포인트를 기록했습니다. 금융선물은 124포인트 0.4포인트 상승했고 거래가격은 3,650포인트였습니다. 마이크로 대만 지수는 2,443포인트 상승해 잠정 보고된 42,095포인트를 기록했습니다. 소규모 대만 지수 거래 가격은 39,778포인트로 2,062포인트 하락했습니다. 대만 중형주 100 선물 거래가격은 32,000원이었습니다."},{"s":"한지아디지털지능(300746)의 본업이 압박을 받고 있다. 중앙화된 보장과 중첩된 정책이 실현될지는 두고 볼 일이다.","so":"经济观察网","tm":"11/09 14:22","c":1,"r":"cn","u":"http://www.eeo.com.cn/2026/1109/1088423.shtml","p":1794201720,"a":1794206138,"t":"汉嘉数智（300746）主业承压 担保集中叠加政策兑现待观察","su":"경제관찰망 한지아디지털지능(300746)은 비주업적 손실을 공제하고, 보증금액은 순자산의 약 40%를 차지한다. 우호적인 정책의 이행은 여전히 ​​성과를 통해 검증될 필요가 있다. 성과 및 운영 조건: 이 수치는 \"하락\"보다 더 무거운 의미를 갖습니다. 단일 분기 손실은 매출 감소가 단순한 매출이 아닌 이익 측면으로까지 침투하기 시작했음을 나타냅니다."},{"s":"오구리 아이는 4위 모토 GP : 시사닷컴","so":"時事ドットコム","tm":"11/09 14:14","c":1,"r":"jp","u":"https://www.jiji.com/jc/article?k=2026110900535&g=spo","p":1794201240,"a":1794206153,"t":"小椋藍は４位 モトＧＰ：時事ドットコム","su":"오토바이의 로드 레이스 세계 선수권 시리즈 제20전, 카타르 그랑프리(GP)는 8일, 도하 근교의 루사일에서 각 클래스의 결승이 이뤄졌고, 최고봉 모토 GP 클래스에서 오구아이(아프리아)는 4위였다. 마르코 베체키(이탈리아, 아프리아)가 이번 시즌 6승을 거뒀다. (시사)"},{"s":"AI, 금속 채굴, CITIC 투자의 핵심을 마스터, 11/23부터 두 가지 신규 자금 동시 조달 - 재무 관리","so":"工商時報","tm":"11/09 14:00","c":1,"r":"tw","u":"https://www.ctee.com.tw/news/20261109701117-430402","p":1794200400,"a":1794206147,"t":"掌握AI關鍵金屬礦業中信投信兩檔新基金11／23起同步募集- 理財","su":"과거에는 기업들이 \"비용 절감 및 효율성 향상\"에 중점을 두고 공급망을 구축했습니다. 이제 그들은 \"체인의 안정성과 연속성\"을 우선시하고 있으며, 국가들도 글로벌 분업에서 자체 전략적 자원을 구축하기 위해 동맹을 형성하는 방식으로 전환했습니다. 금속, 광물, 에너지는 AI 인프라 구축에 없어서는 안 될 요소로 차세대 투자의 주류가 될 것으로 예상된다. 중국신탁투자공사 양딩궈 최고투자책임자(CIO)는 9일 CITIC Metal and Mining(009830)과 중국신탁미래핵심전략펀드를 출시한다고 밝혔다."},{"s":"CFA 연구소: \"다음 금융 위기는 은행에서 시작되지 않을 수도 있다\" 지정학 및 AI 사이버 공격으로 금융 안정성 위협","so":"香港經濟日報HKET","tm":"11/09 12:46","c":1,"r":"hk","u":"https://wealth.hket.com/article/4221911/","p":1794195961,"a":1794206151,"t":"CFA協會：「下一場金融危機未必始於銀行」 地緣政治與AI網絡攻擊威脅金融穩定"},{"s":"엄격한 감독은 장기적인 개발을 방해하지 않습니다. 법인: 컴퓨팅 파워 혁명으로 새로운 비즈니스 기회 창출","so":"經濟日報","tm":"11/09 12:17","c":1,"r":"tw","u":"https://money.udn.com/money/story/5607/9866363?from=edn_newest_index","p":1794194238,"a":1794195306,"t":"監管趨嚴不阻長線發展 法人：算力革命帶動新商機","su":"프랭클린증권투자컨설팅은 민주당의 승리로 AI 규제가 더욱 엄격해졌으나 AI 발전은 미국의 국가경쟁력과 직결돼 여전히 양당의 공감대라고 지적했다. 민주당의 정책 입장은 AI 개발을 중단하는 것이 아니라, 주민의 공과금에 영향을 미치지 않도록 업계 운영자가 전력망 업그레이드 비용을 더 많이 공유하도록 요구하는 것입니다. 따라서 AI 데이터센터 구축 진행이 취소되기보다는 늦어질 수도 있을 것으로 예상된다. 정책 방향이 명확해지면서 관련 주가는 점차 부정적인 소식을 흡수할 것으로 예상된다."},{"s":"ITRI, 소규모 농부들이 AI를 사용하여 와인과 차를 만들 수 있도록 ESG×AI 이중 축 권한 부여 출시 | 정치적, 경제적 초점 | 소식","so":"經濟日報","tm":"11/09 12:12","c":1,"r":"tw","u":"https://money.udn.com/money/story/7307/9866346","p":1794193969,"a":1794195308,"t":"工研院啟動 ESG×AI 雙軸賦能 助小農用 AI 釀酒、製茶 | 政經焦點 | 要聞","su":"AI가 농업 부산물을 밝은 녹색 금으로 바꿔줍니다! ITRI는 경제부 산업기술부의 지도 하에 지난 5일 가오슝에서 'ESG×AI: 농업 부산물 순환에서 새로운 비즈니스 기회 창출' 행사를 개최했다. ITRI의 스마트 기술 부가가치 환경 제어 및 발효 기술을 통해 전통 기장주, 토종 동백 등 농업 부산물이 눈길을 끄는 그린 골드로 업그레이드됐다. AR 및 생성 AI는 몰입형 오리엔티어링 투어를 만드는 데에도 사용되었으며, 이를 통해 ITRI의 기술이 업계에 진출하고 대만 순환 경제에 새로운 이정표를 세울 수 있었습니다."},{"s":"Taipower 2027 직원 선발 583명의 새로운 인재 모집 브로셔 12/23 발표 예정","so":"中央社 CNA","tm":"11/09 12:04","c":1,"r":"tw","u":"https://www.cna.com.tw/postwrite/chi/449398","p":1794193440,"a":1794195309,"t":"台電2027僱員甄試招募583名新血 簡章預定12/23公告","su":"2027 타이파워 채용 채용이 다가왔습니다! 타이파워는 전기산업 인재 채용을 위해 내년에 16개 분야 약 583명을 신규 채용할 예정이다. 취업 훈련 기간 동안 합격한 지원자의 초봉은 약 NT$37,000입니다. Taipower의 관련 규정을 충족하고 실제로 현장 기술 작업에 종사하거나 전력 관련 전문 자격증을 보유한 전력 기술자는 NT$40,000를 초과할 수 있습니다. 타이파워는 선발 브로셔가 12월 23일 온라인에 게재될 예정이며, 예선심사는 내년 5월 9일 타이베이, 타이중, 가오슝, 화련 등 4개 시험지역에서 공동으로 진행될 예정이라고 밝혔다. 각 분야의 전력 전문가 여러분, 서둘러 신청 일정을 확인하시기 바랍니다!"},{"s":"Zhaoqing 220kV Yanyan 송변전 프로젝트가 성공적으로 가동되었습니다.","so":"21财经","tm":"11/09 11:23","c":1,"r":"cn","u":"https://www.21jingji.com/article/20261109/herald/fadebe12c87d824d1f144b43796b58ad.html","p":1794190980,"a":1794206140,"t":"肇庆220千伏燕岩输变电工程顺利投产送电","su":"최근 Xin Investment Group Holding Huineng Company의 자회사인 Hengdian Company가 건설한 Zhaoqing 220kV Yanyan 송변전 프로젝트가 성공적으로 가동되었습니다. 이 역은 화이지현의 두 번째 220kV 허브 변전소입니다. 이 단계에서는 2개의 180MVA 주 변압기와 3개의 새로운 220kV 출력 라인, 6개의 110kV 출력 라인 및 20개의 10kV 출력 라인을 갖추고 있습니다. Yanyan 발전소가 가동된 후 Huaiji, Ganxiang, Cuizhu, Yucheng 및 기타 변전소와 연결되어 현 전체의 220kV 이중 루프 네트워크를 형성할 예정이며, 이는 Huaiji 전력망의 고장 위험을 견딜 수 있는 능력을 크게 향상시킬 것입니다. 동시에 이 프로젝트는 인근 지역에서 250MW의 태양광 발전을 소비할 수 있는 새로운 에너지 전송 채널을 열어 지역 산업 발전과 사람들의 생활을 위한 충분한 전력 공급 능력을 제공했습니다. 이 프로젝트는 2025년 12월 6일 건설 시작부터 2026년 11월 2일 송전 완료까지 320일 이상 지속되었습니다. Hengdian Company는 골드 모델 프로젝트의 표준을 엄격히 준수했으며 프로젝트는 계약 기간보다 일찍 완료되어 마침내 \"무결함\" 납품을 달성했습니다."},{"s":"故 조석래 효성 명예회장, 한미우호상 수상","so":"디일렉","tm":"11/09 10:40","c":1,"r":"kr","u":"https://www.thelec.kr/news/articleView.html?idxno=65081","p":1794188456,"a":1794195299,"su":"고(故) 조석래 효성그룹 명예회장이 한미 경제협력과 우호 증진에 기여한 공로로 제24회 한미우호상을 수상했다. 효성은 지난 6일 서울 워커힐호텔에서 열린 '한미우"},{"s":"AI 주가 폭락, 데이터센터 위기인가 아니면 전환점인가? |홍콩경제신문","so":"香港經濟日報HKET","tm":"11/09 10:11","c":1,"r":"hk","u":"https://invest.hket.com/article/4221604/ai-stocks-selloff-data-centre-outlook","p":1794186669,"a":1794195302,"t":"AI股急跌 數據中心危機還是轉機？|香港經濟日報"},{"s":"COP31, 터키에서 전쟁과 AI로 인한 압박 속에서 기후 목표를 열다","so":"The Straits Times","tm":"11/09 10:08","c":1,"r":"sg","u":"https://www.straitstimes.com/world/europe/cop31-to-open-in-turkey-with-climate-goals-under-pressure-from-war-and-ai?ref=latest","p":1794186480,"a":1794195312,"t":"COP31 to open in Turkey, with climate goals under pressure from war and AI","su":"안탈리아, 터키, 11월 9일 - 전쟁으로 인한 에너지 안보에 대한 우려, 급증하는 AI 전력 수요, 미국의 탈퇴로 인해 지구 온난화에 맞서 싸우는 데 새로운 압력이 가해짐에 따라 약 200개 국가의 대표들이 월요일 터키의 지중해 연안에 모여 2주간의 기후 회담을 가질 예정입니다. straitstimes.com에서 자세한 내용을 읽어보세요."},{"s":"라오스 풍력발전을 베트남으로 이전하지만 에너지 개발은 현지 주민에게 도움이 되기 어렵다","so":"公視新聞","tm":"11/09 10:00","c":1,"r":"tw","u":"https://news.pts.org.tw/article/834593","p":1794186000,"a":1794195310,"t":"寮國風電輸越南 能源發展難惠及在地人","su":"라오스는 풍력발전을 적극적으로 개발하고 있다. 남부 산악 지역에는 133개의 풍력 터빈이 있어 이웃 베트남에 전력을 전달합니다. 이 아시아 최초의 국경을 넘는 풍력 발전 프로젝트는 베트남의 전력 수요 충족에 도움이 될 뿐만 아니라 라오스를 동남아시아 재생 에너지 개발의 신흥 강자로 만들었습니다. 그러나 전력을 해외로 수출할 경우, 지역 주민들은 향상된 전력공급을 누리지 못할 수도 있습니다."},{"s":"데이터독은 '아웃퍼폼', 카맥스를 '중립'","so":"バロンズ・ダイジェスト","tm":"11/09 09:11","c":1,"r":"jp","u":"https://barrons.jiji.com/article/9073","p":1794183104,"a":1794195299,"t":"データドッグは「アウトパフォーム」、カーマックスを「中立」","su":"조사 리포트 데이터독은 ‘아웃퍼폼’, 카맥스를 ‘중립’ 내용은 애널리스트의 견해이며 본지의 분석이나 추천 종목이 아니다. 리포트 작성자의 일부는 대상기업에 투자은행 업무 등의 서비스를 제공하고 있거나 제공하고자 한다. 〔에버 코어 ISI〕 IT 인프라의 자동 감시·제어 소프트웨어 기업 데이터 독 <DDOG>(나스닥 증권 거래소)를 「아웃퍼폼」이라고 평가한다. 11월 4일 종가는 220.52달러."},{"s":"거품이 사라져야 진짜 이야기를 볼 수 있다: AI 사이클의 거시적 펑크와 산업 재탄생|Chen Xinshen","so":"星島頭條","tm":"11/09 09:00","c":1,"r":"hk","u":"https://www.stheadline.com/macroeconomics/3634821/%E6%B3%A1%E6%B2%AB%E8%A4%AA%E5%8E%BB%E6%96%B9%E8%A6%8B%E7%9C%9F%E7%AB%A0AI%E5%91%A8%E6%9C%9F%E7%9A%84%E5%AE%8F%E8%A7%80%E5%88%BA%E7%A0%B4%E8%88%87%E7%94%A2%E6%A5%AD%E9%87%8D%E7%94%9F%E9%99%B3%E6%96%B0%E7%87%8A","p":1794182447,"a":1794195304,"t":"泡沫褪去方見真章：AI周期的宏觀刺破與產業重生｜陳新燊","su":"[칼럼 소개] 밀물이 빠져야 알몸으로 헤엄치고 있는 사람이 누구인지 알 수 있다. 2026년 AI 시장은 쇠퇴와 제방 건설을 동시에 하고 있다. 기술의 상승 추세는 장기적인 일반 추세이고 금융 거품의 하락 추세는 실제주기입니다. 이 기사에서는 정치적 여론, 규제 전환, 지리적 이동성 및 신용 영향력이라는 4차원 프레임워크를 사용하여 이번 AI 버블을 제거하는 경로를 분석합니다. 인공지능 산업의 가치를 부정하는 것이 아니라, 고레버리지 확장의 단계적 리스크만을 분석한다. 연구와 판단은 정직하고 객관적이도록 노력하며 투자자와 산업 사이클에 대한 참고 자료 역할을 합니다. 1. 주기 분할: 기술은 실제로 상승하고 있으며 금융 거품은 하락하고 있습니다. 2026년 글로벌 AI 시장은 흥미로운 이분법적 분할을 선보일 것입니다."},{"s":"[리포트 브리핑]LS ELECTRIC, '한국 AI DC의 길은 LS일렉트릭으로 통한다' 목표가 220,000원 - 하나증권","so":"뉴스핌","tm":"11/09 08:35","c":1,"r":"kr","u":"https://www.newspim.com/news/view/20261109000116"," P in midterm elections. Investors should pay attention."},{"s":"Infineon(XTRA:IFX) 주식은 AI 데이터 센터 이후 14% 저평가될 수 있습니다.","so":"Yahoo Finance","tm":"11/07 23:13","c":1,"r":"us","u":"https://finance.yahoo.com/markets/stocks/articles/infineon-xtra-ifx-stock-may-141315208.html","p":1794060795,"a":1794093180,"t":"Infineon (XTRA:IFX) Stock May Be 14% Undervalued Following AI Data Center Power News","su":"Infineon Technologies has delivered a 60.5% gain over the past three years, yet recent share price swings put the spotlight squarely on a different issue: whether today"},{"s":"다퉁 AI 데이터센터 사업 기회가 발효됐다. 국내외 고객사 30여 명 방문, 전력산업 수주 지속 증가 | 업계 핫스팟 | 산업","so":"經濟日報","tm":"11/07 22:48","c":1,"r":"tw","u":"https://money.udn.com/money/story/5612/9864242?from=edn_newestlist_rank","p":1794059324,"a":1794059580,"t":"大同 AI 資料中心商機發酵 逾30家海內外客戶參訪、電力事業訂單續增 | 產業熱點 | 產業","su":"Datong(2371)은 전력과 AI 인프라의 이중 엔진을 적극적으로 배포하고 있으며 운영 모델이 점차 성과를 보이고 있습니다. 장성빈 본부장은 오늘(7일) 그룹이 최근 몇 년간 운영상의 어려움을 점차 극복해 왔으며, 전력 사업 수주가 지속적으로 축적되고 있다고 말했습니다. 새로 합류한 전력 관련 기업 3개사도 잇달아 인증을 획득했다. 또한, 지난 9월 말 출시한 모듈형 AI 데이터센터 솔루션 'TTG AIDC' 큐브(CUBE)'는 현재까지 국내외 30여 고객사를 방문했으며, 향후 점진적으로 실제 수주로 전환돼 그룹의 새로운 성장 모멘텀을 열어줄 것으로 기대된다."},{"s":"분석가들은 이들 5개 주식 그룹이 민주당 중간선거 이후 반등할 수 있다고 말합니다.","so":"CNBC","tm":"11/07 21:54","c":1,"r":"us","u":"https://www.cnbc.com/2026/11/07/these-five-stock-types-could-rally-after-us-midterms-analysts-say.html","p":1794056087,"a":1794059580,"t":"These five stock groups could rally after Democrats' midterms sweep, analysts say","su":"월스트리트 분석가에 따르면 청정 에너지 회사, 전문 REIT, 항공 회사 등이 2026년 미국 중간 선거의 수혜자가 될 수 있습니다."}]},{"name":"🤖 로봇","note":"","breaking":false,"items":[{"s":"Innodisk 재무 보고서/AI 서버는 3분기 이익을 13배 이상 늘렸고 EPS는 93.09위안이라는 새로운 최고치를 기록했습니다.","so":"UDN","tm":"11/06 19:54","c":4,"r":"tw","u":"https://udn.com/news/story/7252/9862585","p":1793962476,"a":1793974680,"t":"宜鼎財報／AI 伺服器推升第3季獲利年增逾13倍、EPS 93.09元 再創新高","su":"메모리 모듈 제조사 이노디스크(5289)가 6일 3분기 재무보고서를 발표했다. AI 서버가 주도하는 고급 메모리 및 스토리지 수요에 힘입어 해당 분기 세후 순이익은 90억 6천만 위안으로 연간 1,310.7% 증가했습니다. 주당 순이익은 93.09위안으로 영업 최고치를 경신했습니다. 회사 측은 그룹 AI 관련 애플리케이션 매출이 40% 이상을 차지하며 글로벌 클라우드 서비스 제공업체(CSP), AI 서버 공급망, 휴머노이드 로봇 고객사를 성공적으로 확대했다고 밝혔다. 고급 컴퓨팅 비즈니스 기회를 포착하기 위해 AI 인프라와 엣지 AI 시스템의 이중 트랙 레이아웃을 이어갈 것입니다."},{"s":"신화통신, 세계 최초의 AI 생체공학 로봇 앵커 출시, 장이모우가 이미지 디자인","so":"星島頭條","tm":"11/06 16:39","c":4,"r":"hk","u":"https://www.stheadline.com/realtime-china/3634227/%E6%96%B0%E8%8F%AF%E7%A4%BE%E6%8E%A8%E5%85%A8%E7%90%83%E9%A6%96%E5%80%8BAI%E4%BB%BF%E7%94%9F%E6%A9%9F%E6%A2%B0%E4%BA%BA%E4%B8%BB%E6%92%AD-%E5%BC%B5%E8%97%9D%E8%AC%80%E6%93%8D%E5%88%80%E8%A8%AD%E8%A8%88%E5%BD%A2%E8%B1%A1","p":1793950797,"a":1793955540,"t":"新華社推全球首個AI仿生機械人主播 張藝謀操刀設計形象","su":"기술 및 미디어 애플리케이션은 최근 새로운 혁신을 가져왔습니다. 신화통신과 인공지능(AI) 기업 'Ubtech'가 공동 개발한 세계 최초의 생체 공학 휴머노이드 로봇 뉴스 앵커 'Xinyan'과 'Xinyu'가 11월 5일 제7회 세계 미디어 서밋에서 공식 공개되었습니다. 두 로봇은 실제 사람을 1:1 비율로 채택했으며 본토의 유명 감독인 Zhang Yimou가 이미지 크리에이티브 디자이너로 활동하며 현장 보도 능력도 갖추고 있습니다. AI 환상을 피하기 위해 실시간으로 정보를 추출합니다. 신화통신은 이번에 출연한 여성 앵커 '신옌'과 남성 앵커 '신위'의 이름이 '새로운 말이 새로운 지식을 열고, 신옌이 정직하게 말한다'는 의미를 갖고 있어 뉴스 전달에 대한 신뢰를 갖고 있다고 지적했다."},{"s":"이번 세션 동안 휴머노이드 로봇 개념이 치솟았고 Shanwei New Materials와 Xiangzhi Intelligent를 포함한 10개 주식이 일일 한도에 도달했고 Yushu Technology는 거의 14% 상승했습니다.","so":"21财经","tm":"11/09 12:26","c":3,"r":"cn","u":"https://www.21jingji.com/article/20261109/herald/63e08bc2d762c92dc9320c59cb7a75a9.html","p":1794194760,"a":1794206165,"t":"人形机器人概念盘中飙升，上纬新材、祥明智能等10股涨停，宇树科技涨近14%","su":"11월 9일, A주 휴머노이드 로봇 콘셉트가 급등해 10개 상장사가 일일 한도에 도달했다. 보도 시간 현재 Shangwei New Materials 및 Xiangming Intelligent는 일일 한도 20cm에 도달했으며 Koyo, Jinghua New Materials, Huapei Power, Jingu, Aistar, Fulai New Materials, Riying Electronics 및 Shiyun Circuit은 일일 한도 10cm에 도달했습니다. Audiway와 Hechuan Technology는 16% 이상 상승했고 Yushu Technology는 거의 14% 상승했으며 Alt, Hanwei Technology, Pan Asia Microscope 등이 그 뒤를 이었습니다. 소식에 따르면 지난 11월 5일부터 10일까지 진행된 제9회 중국국제수입박람회 기간 중 Revo 3, Lens Technology의 Dexterous Hand, Zhiyuan Genie G2, Yuanzheng A3 휴머노이드 로봇 등의 전시품이 중국관에서 공개됐다."},{"s":"\"홍콩 주식\" 기술주가 항셍지수를 더 높 테스트하는 것입니다. 삼성전자는 타일러에 위치한 첫 번째 공장이 올해 말까지 완전 가동될 예정이며 내년에는 생산을 확대할 것이라고 밝혔습니다. 이 공장은 내년 하반기에 테슬라의 차세대 I6 칩을 생산할 계획이다. 타일러 팹 건설은 2022년 시작돼 당초 2024년 생산 시작 예정이었지만 약 2년 정도 지연됐다."},{"s":"카라크리와 Highlanders, 음성AI×휴머노이드에 의한 「AI대도 연예인」을 공동 개발","so":"朝日新聞","tm":"11/09 01:04","c":1,"r":"jp","u":"https://www.asahi.com/and/pressrelease/16980127","p":1794153884,"a":1794177888,"t":"カラクリとHighlanders、音声AI×ヒューマノイドによる「AI大道芸人」を共同開発","su":"～「大道芸ワールドカップin静岡2026」にて、AIとロボット制御のリアルタイム統合を実証～ 国産AIの開発・実装を手がけるカラクリ株式会社（本社：東京都中央区、代表取締役CEO：小田 志門、以下カラクリ）と、国産ヒューマノイドを開発する株…"},{"s":"AI 에이전트 카풀 거대 기업 메타·오픈AI '귀여움'으로 사업 경쟁 | 외신분석 | 국제적인","so":"經濟日報","tm":"11/09 00:17","c":1,"r":"tw","u":"https://money.udn.com/money/story/122381/9865432","p":1794151054,"a":1794206181,"t":"AI 代理車拚 Meta、OpenAI 兩巨頭「賣萌」搶生意 | 外媒解析 | 國際","su":"양대 기술 대기업인 Meta와 OpenAI는 AI 에이전트를 잇달아 출시했습니다. 서로 다른 사용자 그룹이 있지만 모두 Muse와 Dots의 비즈니스를 돕기 위해 \"귀여운\" 경로를 택합니다..."},{"s":"중국 유니트리, 로봇 양산에도 조립은 여전히 사람 중심…자동화 초기 단계","so":"로봇신문","tm":"11/08 23:43","c":1,"r":"kr","u":"https://www.irobotnews.com/news/articleView.html?idxno=49455","p":1794149004,"a":1794177888,"su":"중국의 대표적인 휴머노이드 및 사족보행 로봇 기업 유니트리로보틱스(Unitree Robotics)가 대규모 로봇 생산능력을 확보하고 있지만, 실제 제조공정의 상당"},{"s":"보스턴다이내믹스 '아틀라스', 삼성SDI 배터리 70개 탑재 전망…용량 1.3kWh","so":"로봇신문","tm":"11/08 23:34","c":1,"r":"kr","u":"https://www.irobotnews.com/news/articleView.html?idxno=49454","p":1794148471,"a":1794177888,"su":"현대자동차그룹의 로봇 전문기업 보스턴다이내믹스(Boston Dynamics)가 개발한 휴머노이드 로봇 '아틀라스(Atlas)'에 삼성SDI의 원통형 배터리 셀 7"},{"s":"중국 푸두로보틱스, 휴머노이드 시장 본격 공략…테슬라와 경쟁 예고","so":"로봇신문","tm":"11/08 23:19","c":1,"r":"kr","u":"https://www.irobotnews.com/news/articleView.html?idxno=49452","p":1794147582,"a":1794177888,"su":"중국의 대표적인 상업용 서비스로봇 기업 푸두로보틱스(Pudu Robotics)가 휴머노이드를 차세대 성장동력으로 삼고 글로벌 시장 공략에 나선다. 기존 서빙·청소"},{"s":"中 애지봇 휴머노이드 6대 편의점에서 알바...\"4대만 정규직 취직\"","so":"로봇신문","tm":"11/08 22:29","c":1,"r":"kr","u":"https://www.irobotnews.com/news/articleView.html?idxno=49450","p":1794144573,"a":1794195319,"su":"중국 휴머노이드 로봇의 편의점 취직 현장이 공개됐다.8일 중국 지역 언론 하이샤왕에 따르면 애지봇(AgiBot, 智元机器人)의 '지니(Genie, 精灵) G2'"},{"s":"Agility Robotics(AGLT)는 확장된 휴머노이드 로봇 출시를 통해 무엇을 얻나요?","so":"Yahoo Finance","tm":"11/08 21:12","c":1,"r":"us","u":"https://finance.yahoo.com/technology/ai/articles/does-agility-robotics-aglt-gain-121258864.html","p":1794139978,"a":1794145920,"t":"What Does Agility Robotics (AGLT) Gain From Its Expanded Humanoid Robot Rollout?","su":"Agility Robotics(NasdaqGM:AGLT)와 GXO Logistics는 더 많은 물류 현장에 Digit 휴머노이드 로봇을 출시하기 위해 파트너십을 확대했습니다. 양사는 이번 확대 출시가 일회성 하드웨어 판매가 아닌 서비스형 로봇 모델을 기반으로 구축됐다고 밝혔습니다. Digit 부서는 이미 GXO 시설 내에서 작업하며 실제 상업 운영에서 창고 작업을 처리하고 있습니다. Digi의 광범위한 GXO 배포"},{"s":"프랑스 ID 로지스틱스, 휴머노이드 로봇 물류 적용 실증 추진","so":"로봇신문","tm":"11/08 21:11","c":1,"r":"kr","u":"https://www.irobotnews.com/news/articleView.html?idxno=49432","p":1794139915,"a":1794206162,"su":"프랑스 오르공에 본사를 두고 있는 세계적인 계약 물류(Contract Logistics) 전문기업인 ID 로지스틱스(ID Logistics)가 독일 로봇기업 테라"},{"s":"애플, 휴머노이드 로봇 '브레인' HALO 공개! 테스트용 Yushu G1 장착, 낯선 환경에서의 임무 성공률 91% 달성","so":"鉅亨網","tm":"11/08 21:00","c":1,"r":"tw","u":"https://news.cnyes.com/news/id/6652095","p":1794139207,"a":1794145920,"t":"蘋果公開人形機器人「大腦」HALO！搭載宇樹G1測試 陌生環境任務成功率達91%","su":"애플 연구팀이 G1이 낯선 환경에서도 지시에 따라 상자 밀기, 의자에 앉기, 장애물 건너기 등의 작업을 완료할 수 있게 해주는 휴머노이드 로봇 자율 제어 시스템 HALO를 출시했다.\nHALO는 VLM, 동작 생성 및 추적을 결합한 3계층 아키텍처를 채택합니다. 6개의 스캔되지 않은 환경을 360회 테스트했으며 단일 작업 성공률은 91%였습니다.\n복합 작업의 성공률은 70%로 떨어졌고, 가장 어려운 연속 작업은 50%에 불과합니다. 시스템은 여전히 ​​수동 설계에 의존하고 있으며 촉각 인식이 후속 방향입니다."},{"s":"아틀라스에 메모리 공급…자율주행·차세대 칩까지 동맹 넓힌다","so":"서울경제","tm":"11/08 18:39","c":1,"r":"kr","u":"https://www.sedaily.com/article/20111673","p":1794130746,"a":1794145920,"su":"삼성과 현대차(005380)그룹이 사상 처음 최고위급 경영진 교류 행사를 개최하며 파트너십 확대를 추진하는 것은 기존 차량용 반도체와 배터리·전장(차량용 전자장비) 협력을 넘어 휴머노이드 로봇과 자율주행차 등 피지컬 인공지능(AI) 신사업에서도 양 그룹간 시너지를 발휘할 공동 전선이 빠르게 넓어지고 있어서다. 삼성·현대차그룹 CEO(최고경영자)들이 대거 부부 동반 행사를 통해 협력의 폭과 깊이를 확대하면서 현대차그룹 휴머노이드 ‘아틀라스’의 메모리 공급과 차세대 칩 개발 등 신사업 협력에 속도가 붙을 전망이다."},{"s":"숙련공 의존하던 감광액 교체·불량 검사, 삼전닉스 반도체 공장선 로봇이 한다","so":"서울경제","tm":"11/08 17:51","c":1,"r":"kr","u":"https://m.sedaily.com/amparticle/20111617","p":1794127876,"a":1794145920,"su":"고도의 정밀성이 요구되는 반도체 제조 현장에서 로봇 활용 범위가 넓어지고 있다. 단순 물류·이송 자동화를 넘어 감광액 교체, 웨이퍼 테스트 등 작업자의 숙련도와 정교한 조작이 필요한 영역까지 로봇 적용을 검토하는 단계에 이르렀다. 까다로운 반도체 공정이 로봇의 성능과 정밀도를 검증하는 테스트베드로 활용되면서 로봇 기술 고도화에도 속도가 붙을 것으로 전망된다"},{"s":"로봇 눈 달고, 숫자 읽는 AI…'실전 딥테크'에 몰린 뭉칫돈 - 머니투데이","so":"머니투데이","tm":"11/08 17:00","c":1,"r":"kr","u":"https://www.mt.co.kr/future/2026/11/08/2026110813265917222","p":1794124800,"a":1794128040,"su":"[이 기사에 나온 스타트업에 대한 보다 다양한 기업정보는 유니콘팩토리 빅데이터 플랫폼 '데이터랩'에서 볼 수 있습니다. ] 11월 첫째 주(2~6일)에는 AI(인공지능)와 로보틱스, 반도체, 커머스 등 다양한 분야의 스타트업에 투자금이 유입됐다."},{"s":"휴머노이드의 다양한 훈련 방식 중 모방 학습×강화 학습의 차이점!","so":"programs.sbs.co.kr","tm":"11/08 17:00","c":1,"r":"kr","u":"https://programs.sbs.co.kr/culture/humanoidbigbang/clip/90860/OC483066928","p":1794124800,"a":1794206162,"su":"휴머노이드의 훈련 방식 중 모방 학습과 강화 학습의 차이점에 대해 설명한다. 교 양ㅣ휴머노이드 빅뱅 1회 본방송ㅣ11월 8일 일요일 밤 11시 5분 Copyright ⓒ SBS. All rights reserved. 무단 전재, 재배포 및 AI학습 이용 금지"},{"s":"사람처럼 정교한 움직임이 가능해진 ‘휴머노이드’들의 격투 리그♨","so":"programs.sbs.co.kr","tm":"11/08 17:00","c":1,"r":"kr","u":"https://programs.sbs.co.kr/culture/humanoidbigbang/clip/90860/OC483066874","p":1794124800,"a":1794206162,"su":"사람처럼 정교한 움직임이 가능해진 휴머노이드들의 격투 리그에 대해 설명한다. 교 양ㅣ휴머노이드 빅뱅 1회 본방송ㅣ11월 8일 일요일 밤 11시 5분 Copyright ⓒ SBS. All rights reserved. 무단 전재, 재배포 및 AI학습 이용 금지"},{"s":"휴머노이드 빅뱅 : 로봇이 고도로 발달한 시대에 인간이 맡게 될 일자리의 변화와 미래","so":"programs.sbs.co.kr","tm":"11/08 17:00","c":1,"r":"kr","u":"https://programs.sbs.co.kr/culture/humanoidbigbang/clip/90860/OC483067063","p":1794124800,"a":1794206162,"su":"로봇이 발달한 시대에 인간이 맡게 될 일자리의 변화에 대해 설명한다. 교 양ㅣ휴머노이드 빅뱅 1회 본방송ㅣ11월 8일 일요일 밤 11시 5분 Copyright ⓒ SBS. All rights reserved. 무단 전재, 재배포 및 AI학습 이용 금지"},{"s":"AI는 산업용 로봇 시장을 확대하지만 장비 제조업체는 제한적인 이익을 볼 수 있습니다: S&P Global","so":"ET Enterprise AI","tm":"11/08 16:05","c":1,"r":"us","u":"https://enterpriseai.economictimes.indiatimes.com/news/industry/ai-to-expand-industrial-robotics-market-but-robot- <script>
var D = JSON.parse(document.getElementById('data').textContent);
var RL = {}; D.regions.forEach(function(r){ RL[r.k] = r.l; });
function $(id){ return document.getElementById(id); }
function esc(t){ return String(t==null?'':t).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
// 휴대폰에 기억해 두는 값 (마지막 탭, 탭별로 마지막에 본 시각, 정렬, 국가)
function load(k, d){ try { var v = localStorage.getItem('nb_'+k); return v===null ? d : JSON.parse(v); } catch(e){ return d; } }
function save(k, v){ try { localStorage.setItem('nb_'+k, JSON.stringify(v)); } catch(e){} }
var S = { tab: load('tab', 0), seen: load('seen', null), sort: load('sort', 'c'), region: load('region', 'all'), shown: D.show, prev: {} };
function newest(t){ var m = 0; t.items.forEach(function(n){ if(n.a > m) m = n.a; }); return m; }
if(S.seen === null){ S.seen = {}; D.themes.forEach(function(t){ S.seen[t.name] = newest(t); }); save('seen', S.seen); }  // 처음 방문: 레드닷 없이 시작
if(location.hash && /^#t\d+$/.test(location.hash)) S.tab = +location.hash.slice(2);
if(S.tab >= D.themes.length) S.tab = 0;

function visible(t){
  return t.items.filter(function(n){ return S.region==='all' || n.r===S.region; });
}
function sorted(list, breaking){
  var k = breaking ? 'p' : S.sort;
  return list.slice().sort(function(x,y){
    var c = y.c - x.c, p = y.p - x.p; return k==='c' ? (c||p) : (p||c);
  });
}
function renderTabs(){
  $('tabs').innerHTML = D.themes.map(function(t, i){
    var dot = newest(t) > (S.seen[t.name] || 0) && i !== S.tab;
    return '<button class="tab'+(i===S.tab?' on':'')+'" onclick="openTab('+i+')">'+esc(t.name)+
           '<b>'+visible(t).length+'</b>'+(dot?'<span class="dot" title="새 뉴스"></span>':'')+'</button>';
  }).join('');
  var on = $('tabs').children[S.tab]; if(on && on.scrollIntoView) on.scrollIntoView({block:'nearest', inline:'center'});
}
function renderCtrl(){
  var br = D.themes[S.tab].breaking;
  var h = '';
  if(!br){
    h += '<button class="'+(S.sort==='c'?'on':'')+'" onclick="setSort(\'c\')">🔥 화제순</button>';
    h += '<button class="'+(S.sort==='p'?'on':'')+'" onclick="setSort(\'p\')">🕒 최신순</button><span class="sep"></span>';
  }
  h += '<button class="'+(S.region==='all'?'on':'')+'" onclick="setRegion(\'all\')">전체</button>';
  D.regions.forEach(function(r){
    h += '<button class="'+(S.region===r.k?'on':'')+'" onclick="setRegion(\''+r.k+'\')">'+esc(r.l)+'</button>';
  });
  $('ctrl').innerHTML = h;
}
function card(n, prev){
  var hot = n.c > 1 ? '<span class="hot'+(n.c>=5?' big':'')+'">🔥 언론 '+n.c+'곳</span>' : '';
  var isNew = prev && n.a > prev ? ' <span class="new">NEW</span>' : '';
  return '<a class="card" href="'+esc(n.u)+'" target="_blank" rel="noopener" data-s="'+esc(n.su||'')+'">'+
    '<div class="meta">'+hot+esc(RL[n.r]||'')+' · '+esc(n.so)+' · '+esc(n.tm)+isNew+'</div>'+
    '<div class="title">'+esc(n.s)+'</div>'+(n.t?'<div class="orig">'+esc(n.t)+'</div>':'')+'</a>';
}
function renderMain(){
  var t = D.themes[S.tab], list = sorted(visible(t), t.breaking), prev = S.prev[t.name];
  var h = '<h2>'+esc(t.name)+'</h2>' + (t.note ? '<p class="note">'+esc(t.note)+'</p>' : '');
  if(!list.length) h += '<p class="none">'+(S.region==='all' ? '최근 ' + (t.breaking?'속보':'기사') + ' 없음' : esc(RL[S.region])+' 기사 없음')+'</p>';
  h += list.slice(0, S.shown).map(function(n){ return card(n, prev); }).join('');
  var extra = list.length - S.shown;
  if(extra > 0) h += '<button class="more" onclick="more()">더보기 ▾  ('+extra+'개 더)</button>';
  else if(S.shown > D.show) h += '<button class="more" onclick="less()">접기 ▴</button>';
  var auto = Object.keys(D.auto);
  h += '<footer>업데이트 '+esc(D.updated)+' · 최근 3일 · 믿을 만한 언론사 기사만 · 기사를 누르면 한국어 요약 → 원문 보기<br>'+
       '🔥 언론 N곳 = 같은 소식을 보도한 언론사 수 (많을수록 화제) · <span style="color:var(--red)">●</span> = 새 뉴스'+
       '<br><br><b>자동으로 추가된 언론사</b> (주요 언론보다 먼저 보도하고, 주요 언론도 함께 다룬 소식이 많은 곳 · 최근 14일)'+
       (auto.length ? auto.map(function(k){ return '<div>'+esc(k)+': '+esc(D.auto[k].join(', '))+'</div>'; }).join('') : '<div>아직 없음</div>')+
       '</footer>';
  $('main').innerHTML = h;
}
function openTab(i){
  var t = D.themes[i];
  S.tab = i; S.shown = D.show; save('tab', i);
  if(!(t.name in S.prev)) S.prev[t.name] = S.seen[t.name] || 0;     // 이 탭에서 NEW 로 보여줄 기준
  S.seen[t.name] = Math.max(S.seen[t.name] || 0, newest(t)); save('seen', S.seen);  // 탭에 들어오면 레드닷 지움
  history.replaceState(null, '', '#t'+i);
  renderTabs(); renderCtrl(); renderMain(); window.scrollTo(0, 0);
}
function setSort(k){ S.sort = k; save('sort', k); S.shown = D.show; renderCtrl(); renderMain(); }
function setRegion(k){ S.region = k; save('region', k); S.shown = D.show; renderTabs(); renderCtrl(); renderMain(); }
function more(){ S.shown += 20; renderMain(); }
function less(){ S.shown = D.show; renderMain(); window.scrollTo(0, 0); }
$('upd').textContent = '업데이트 ' + D.updated + ' · 탭을 눌러 테마별 뉴스 보기';

// 🚨 미국 속보 · 🌏 해외 속보는 페이지를 새로 올리지 않아도 최신 내용을 바로 가져옴
function refreshBreaking(){
  if(!window.fetch) return;
  fetch(D.breaking_url + '?t=' + Date.now(), {cache:'no-store'}).then(function(r){ return r.json(); }).then(function(b){
    var all = b.items || [];
    D.themes.forEach(function(t, i){
      if(!t.breaking) return;
      var items = all.filter(function(n){ return n.theme === t.name; }).map(function(n){
        var d = {s:n.show, so:n.source||'', tm:n.time||'', c:n.count||1, r:n.rk||'us', u:n.url||n.link, p:Math.floor(n.pub), a:Math.floor(n.added||n.pub)};
        if(n.show !== n.title) d.t = n.title; if(n.sum) d.su = n.sum; return d;
      });
      if(!items.length && t.items.length) return;
      t.items = items;
      if(S.tab === i){ S.seen[t.name] = Math.max(S.seen[t.name]||0, newest(t)); save('seen', S.seen); renderMain(); }
    });
    renderTabs();
  }).catch(function(){});
}
openTab(S.tab);
refreshBreaking();
setInterval(refreshBreaking, 5 * 60 * 1000);
document.addEventListener('visibilitychange', function(){ if(!document.hidden) refreshBreaking(); });

// 기사를 누르면 먼저 한국어 요약 → 원문 볼지 선택
document.addEventListener('click', function(e){
  var c = e.target.closest('a.card'); if(!c) return;
  if(e.ctrlKey||e.metaKey||e.shiftKey) return;
  e.preventDefault();
  $('s-meta').innerHTML = c.querySelector('.meta').innerHTML;
  $('s-title').textContent = c.querySelector('.title').textContent;
  var o = c.querySelector('.orig'); $('s-orig').textContent = o ? o.textContent : '';
  var sm = c.dataset.s || '';
  $('s-sum').textContent = sm || '이 기사는 요약을 가져오지 못했어요. (사이트가 자동 접속을 막았거나 아직 준비 중)';
  $('s-sum').className = 's-sum' + (sm ? '' : ' empty');
  $('s-go').href = c.href;
  $('dim').hidden = false; $('sheet').hidden = false; $('sheet').scrollTop = 0;
  document.body.style.overflow = 'hidden';
});
function closeSheet(){ $('dim').hidden = true; $('sheet').hidden = true; document.body.style.overflow = ''; }
document.addEventListener('keydown', function(e){ if(e.key==='Escape') closeSheet(); });
</script></body></html>
