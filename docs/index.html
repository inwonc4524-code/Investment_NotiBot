.dot{position:absolute;top:-3px;right:-3px;width:11px;height:11px;border-radius:50%;background:var(--red);border:2px solid var(--bg)}

.ctrl{display:flex;gap:6px;overflow-x:auto;padding:0 16px 10px;scrollbar-width:none}.ctrl::-webkit-scrollbar{display:none}

.ctrl button.on{background:var(--card2);border-color:var(--card2);color:var(--text)}
.ctrl .sep{flex:none;width:1px;background:var(--line);margin:2px 4px}
main{padding:6px 12px 48px}

.note{margin:0 4px 10px;color:var(--sub);font-size:12px}
.none{color:var(--sub);margin:24px 4px;text-align:center}
.card{display:block;background:var(--card);border-radius:12px;padding:12px 14px;margin:8px 0;color:var(--text);text-decoration:none;transition:background .15s}
.card:hover{background:var(--card2)}.card:active{opacity:.75}
.meta{color:var(--sub);font-size:12px}
.title{font-weight:500;margin-top:3px}
.orig{color:var(--sub);font-size:12px;margin-top:3px}
.new{margin-left:4px;color:var(--red);font-size:11px;font-weight:700;letter-spacing:.3px}

.hot.big{background:var(--acc);color:#1f1e1d}
.more{display:block;width:100%;margin:4px 0 0;padding:10px;border:1px dashed var(--line);border-radius:12px;background:transparent;color:var(--sub);font:inherit;font-size:13px}
footer{margin:36px 4px 0;padding-top:14px;border-top:1px solid var(--line);color:var(--sub);font-size:12px;line-height:1.7}
footer b{color:var(--text);font-weight:600}

#dim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:5}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:6;max-width:760px;margin:auto;max-height:82vh;overflow-y:auto;

.grab{width:38px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 12px}
.s-title{font-size:17px;font-weight:600;margin:4px 0 2px;line-height:1.45}
.s-label{margin:16px 0 4px;color:var(--acc);font-size:12px;font-weight:700;letter-spacing:.5px}
.s-sum{font-size:15px;line-height:1.75}.s-sum.empty{color:var(--sub);font-size:13.5px}
.s-btns{display:flex;gap:8px;margin-top:20px}
.s-btns button,.s-btns a{flex:1;text-align:center;padding:12px;border-radius:10px;font:inherit;font-size:14.5px;text-decoration:none}
.s-btns button{background:transparent;border:1px solid var(--line);color:var(--sub)}
.s-btns a{background:var(--acc);color:#1f1e1d;font-weight:600}

tm":"11/08 20:00","c":1,"r":"world","u":"https://www.kiplinger.com/personal-finance/health-insurance/open-enrollment-dont-just-click-same-as-last-year","p":1794135600,"a":1794145920,"t":"Before You Click 'Same as Last Year' During Open Enrollment, Read This","su":"귀하의 재정 상황은 1년 전과 지금은 매우 달라 보일 수 있습니다. 가족을 구할 기회가 있을 수도 있습니다"},{"s":"다른 사람들은 두려워서 탐욕스러워야 합니까? 월스트리트 전략가들은 \"미국 증시 하락세가 매수 포인트로 바뀌었다\"며 더 많은 투자를 촉구하고 있다.","so":"經濟日報","tm":"11/08 19:44","c":1,"r":"hk","u":"https://money.udn.com/money/story/123398/9865349?from=edn_search_tag_result","p":1794134652,"a":1794145920,"t":"別人恐懼就應該貪婪？華爾街策略師喊加碼「美股回檔反成買點」","su":"이 글은 총 702개의 단어로 구성되어 있습니다. AI 초점: 월스트리트 전략가들은 단기 매도 압력이 거의 끝났다고 믿고 하락 시 더 많은 위험 자산을 추가할 것을 제안합니다. 윌슨은 S&P 500의 연말 목표를 8,000포인트로 유지하여 금리 인하로 이익을 얻을 수 있는 소비자주와 목표를 선호했습니다. 많은 애널리스트들은 AI 시장이 붕괴되지 않았다고 보고 있지만, 반도체와 AI 인프라주는 여전히 압박을 받고 있다. 월스트리트의 많은 주식시장 전략가들은 중간선거 이후 미국 주식에 대한 단기 매도 압력이 투자자들에게 할인된 매수 기회를 제공했다고 보고 고객들에게 이 기회를 활용해 시장에 진입할 것을 촉구하고 있다. S&P 500 지수는 6일 0.3% 소폭 상승했지만 여전히 3일 종가보다는 2.5% 낮은 수준이다. 모건스탠리의 미국 주식 전략가 윌슨은 \"향후 2~3주에 걸쳐 위험 자산을 추가해야 하는 수준\"이라고 말했다. 그는 지난 5일 미국 증시 하락세에 놀랐지만, 미국 증시 반등을 확신하며 올해 말까지 S&P 500 지수가 6일 종가 대비 8.4% 오른 8,000포인트에 도달할 것이라는 목표를 여전히 유지하고 있다."},{"s":"\"미국 증시 반등할 것\" 확신한 월스트리트 전략가: 단기 매도 압력이 매수 기회 제공 | 글로벌 금융 | 글로벌","so":"UDN","tm":"11/08 19:44","c":1,"r":"tw","u":"https://udn.com/news/story/6811/9865349","p":1794134647,"a":1794145920,"t":"有信心「美股將回升」 華爾街策略師：短期賣壓提供買進機會| 全球財經| 全球","su":"뉴스 듣기 0:00 / 0:00 \"미국 주식 반등할 것\" 확신 월스트리트 전략가들: 단기 매도 압력은 매수 기회 제공 월스트리트의 많은 주식 시장 전략가들은 중간 선거 이후 미국 주식의 단기 매도 압력이 투자자들에게 할인된 매수 기회를 제공한다고 믿고 있으며, 고객들에게 시장 진입 기회를 활용할 것을 촉구하고 있습니다. S&P 500 지수는 6일 0.3% 소폭 상승했지만 여전히 3일 종가보다는 2.5% 낮은 수준이다. 모건스탠리의 미국 주식 전략가 윌슨은 \"향후 2~3주에 걸쳐 위험 자산을 추가해야 하는 수준\"이라고 말했다. 그는 지난 5일 미국 증시 하락세에 놀랐지만, 미국 증시 반등을 확신하며 올해 말까지 S&P 500 지수가 6일 종가 대비 8.4% 오른 8,000포인트에 도달할 것이라는 목표를 여전히 유지하고 있다."},{"s":"잇단 급락장에…국내 ETF 순자산 400조 아래로 역주행","so":"서울경제","tm":"11/08 18:16","c":1,"r":"kr","u":"https://m.sedaily.com/amparticle/20111652","p":179 "su":"Ark Invest CEO는 현재 시장을 사로잡는 \"걱정의 벽\"이 있다고 말했습니다."},{"s":"S&P 500: 축소, 과거 고점은 여전히 ​​핵심","so":"The Globe and Mail","tm":"11/08 14:40","c":1,"r":"us","u":"https://www.theglobeandmail.com/investing/markets/indices/JX/pressreleases/8718746/sp-500-zoom-out-old-highs-are-still-the-key/","p":1794116431,"a":1794128040,"t":"S&P 500: Zoom Out, Old Highs Are Still the Key","su":"매수 또는 매도 지표, 분석, 차트, 과거 실적, 뉴스 등과 함께 TSX Venture Composite Index(JX)의 실시간 지수 가격"},{"s":"'블루웨이브' 후폭풍... 외국인 '셀코리아' 속 K-산업 해법은?","so":"YTN","tm":"11/08 14:29","c":1,"r":"kr","u":"https://www.ytn.co.kr/_ln/0102_202611081429050217","p":1794115740,"a":1794145920,"su":"미 중간선거 블루 웨이브 후폭풍에지난 주 우리 증시 몸살을 앓았는데요. 미국 정치 지형이 급격히 바뀌면서 우리 주식시장뿐만 아니라 반도체, 자동차, 배터리 등 핵심 산업 전반에도 파장이 불가피해 보입니다. 김대호 글로벌이코노믹연구소장와 함께 자세한 상황 짚어봅니다. 안녕하십니까? 지난주 우리 주식시장 정말 파랗게 질렸습니다."},{"s":"AI 거품 공포에 흔들리는 美 증시…中, 물가·수출 성적표에 촉각","so":"한국경제","tm":"11/08 14:03","c":1,"r":"kr","u":"https://www.hankyung.com/article/202611082964i","p":1794114239,"a":1794128040,"su":"AI 거품 공포에 흔들리는 美 증시…中, 물가·수출 성적표에 촉각, 코어위브 실적&middot;中 수출 지표에 쏠린 눈 美 물가 쇼크냐 AI 반등이냐 中 수출 성적표까지 숨죽인 글로벌 증시"},{"s":"미국 기업이 비용을 계산함에 따라 미국 인플레이션이 다시 나타날 것을 두려워합니다.","so":"The Business Times","tm":"11/08 13:31","c":1,"r":"sg","u":"https://www.businesstimes.com.sg/international/us-inflation-fears-return-corporate-america-counts-cost","p":1794112260,"a":1794148465,"t":"US inflation fears return as corporate America counts the cost","su":"은행과 같이 일반적으로 더 잘 격리된 부문조차도 인플레이션을 점점 더 높이고 있습니다. The Business Times에서 자세히 알아보세요."},{"s":"다음주 미국 주식 전망/AI 주식, 조정 후 CPI 테스트 직면, CoreWeave 수익 보고서가 주목","so":"鉅亨網","tm":"11/08 13:00","c":1,"r":"tw","u":"https://news.cnyes.com/news/id/6652281","p":1794110413,"a":1794128040,"t":"美股下週展望／AI股修正後迎CPI考驗CoreWeave財報成焦點","su":"다음 주 미국 주식 시장 전망/AI 주식은 조정 후 CPI 테스트에 직면, CoreWeave 재무 보고서가 초점이 됨 Uanalyze 2026년 11월 8일(Uanalyze/산업 데이터 센터 보고서) ⸺ 기술주 급락 이후 미국 주식은 11월 9일부터 13일까지 인플레이션 및 기업 재무 보고서의 이중 테스트에 직면하게 됩니다. 11월 10일에 발표된 미국 10월 소비자물가지수(CPI)는 12월 금리 인상에 대한 연준의 기대에 영향을 미칠 것입니다. CoreWeave(CRWV-US), Applied Materials(AMAT-US) 및 Cisco(CSCO-US)는 시장이 AI 투자 및 기술 산업 수요를 조사하는 중요한 창구인 재무 보고서를 연속으로 발표했습니다."},{"s":"역사는 지난 하락장에서 에너지가 모든 부문을 주도했다고 말합니다. 이제 달라진 점은 다음과 같습니다.","so":"The Globe and Mail","tm":"11/08 12:28","c":1,"r":"us","u":"https://www.theglobeandmail.com/investing/markets/stocks/CVX/pressreleases/8722382/history-says-energy-led-all-sectors-in-the-last-bear-market-heres-whats-different-now/","p":1794108515,"a":1794109980,"t":"History Says Energy Led All Sectors in the Last Bear Market. Here's What's Different Now.","su":"차트 및 거래를 포함한 The Globe and Mail의 Chevron Corp(CVX-N)에 대한 자세한 가격 정보입니다."},{"s":"대만 주식 배틀로얄! Guoan Fund가 곧 시장에 진입할 예정인데 안정적입니까? 전문가들 “안정화까지는 시간 걸릴 것”","so":"TVBS新聞網","tm":"11/08 12:27","c":1,"r":"tw","u":"https://news.tvbs.com.tw/money/4047420","p":1794108420,"a":1794109980,"t":"台股大逃殺！國安基金要進場、穩了嗎？專家這麼看：止穩還要時間","su":"대만 주식시장은 지난 주 엄청난 폭락을 겪었고, 일주일 만에 5,500포인트 이상 급락해 연간선 아래로 떨어졌습니다. 시장 패닉이 빠르게 커지고 있다. 그러나 지난 금요일 미국 증시는 거센 반격을 펼쳤고 국가안보기금(National Security Fund)도 시장에 진입할 예정이다. 다음주 대만 증시는 안정될까? 수석 분석가 Cai Minghan은 현재 대만 주식에 대한 가장 큰 압력의 원인은 여전히 ​​​​미국 기술주의 급격한 변동이라고 지적했습니다. 다음 주에 시장이 일시적으로 반등할 수도 있지만, 단기적으로 완전히 안정되려면 아직 시간이 좀 걸릴 수 있습니다."},{"s":"미국 증시, 급락 후 반전? 월스트리트 투자은행, 헐값 사냥 요구, S&P 연말 목표주가 노출 - 국제","so":"工商時報","tm":"11/08 11:41","c":1,"r":"tw","u":"https://www.ctee.com.tw/news/20261108700329-430702","p":1794105660,"a":1794109980,"t":"美股暴跌後反轉？華爾街投行喊抄底標普年底目標價曝光- 國際","su":"미국 중간선거에서 민주당이 승리하면서 AI 데이터센터 규제와 거대 기술기업의 자본지출 감소에 대한 시장의 우려가 촉발됐다. 미국 기술주가 극심한 매도세를 보였습니다. 지난 목요일(5일) S&P 500 지수는 하루 만에 4.4%, 나스닥 100 지수는 6.4% 급락했다. 하루 만에 시장 가치가 3조 달러 이상 증발했습니다. 그러나 이런 엄청난 조정의 물결에도 월스트리트의 주요 투자기관들은 완전히 마이너스로 전환하지 않고 오히려 바닥매수 신호를 잇달아 내놨다. 이번엔 미국 증시가 무겁다…"},{"s":"\"손절하고 도망쳐?\" 괴로운 개미들…美 물가·코어위브 실적 주목하라는데 - 머니투데이","so":"머니투데이","tm":"11/08 11:34","c":1,"r":"kr","u":"https://www.mt.co.kr/stock/2026/11/08/2026110811240385851","p":1794105273,"a":1794145920,"su":"블루웨이브 여진이 남아있는 상황에서 증시에 영향을 줄 수 있는 AI 기업 실적 발표, 미국 물가 지표 등에 시장의 관심이 쏠리고 있다. 지난주 AI 수익성 논란이 커진 상황에서 미국 중간선거 결과 민주당이 승리하며 AI주 투자심리가 악화했다."},{"s":"미국 증시 급락, 아시아 증시도 뒤따르며 급락 후 '주항매입펀드' 투자 기회 밝아","so":"經濟日報","tm":"11/08 11:33","c":1,"r":"hk","u":"https://money.udn.com/money/story/5607/9864675","p":1794105236,"a":1794109980,"t":"美股暴跌、亞股跟殺 「鉅亨買基金」揭急跌後投資機會","su":"11월 5일 미국 증시는 극심한 매도 압력을 받았습니다. 나스닥 지수는 5.5%, 필라델피아 반도체 지수는 12.3% 급락했습니다. 패닉은 빠르게 아시아로 퍼졌다. 지난 6일 대만, 일본, 한국 증시가 동시에 폭락하면서 글로벌 기술주들이 심각한 시험대에 올랐다. AI 투자 붐, 과연 바뀔 것인가? '주행바이펀드'는 미국 중간선거 이후 AI 규제에 대한 우려가 시장 신뢰도에 영향을 미친 것은 사실이지만 주가가 전반적으로 하락했다고 해서 기업 이익이 동시에 악화된 것은 아니라고 지적했다. 최근 재무 보고서에 따르면 미국 기업 이익은 여전히 ​​28% 크게 증가했는데, 이는 시장의 비관론과 뚜렷한 대조를 이룹니다. 투자자들은 단기적인 패닉과 펀더멘털의 변화를 구분해야 하며, 주식시장 급락으로 인해 성급하게 빠져나가서는 안 된다."},{"s":"\"취임식 끝나면 만납시다\"…미 중간선거가 데이터센터에 던진 숙제 [취재파일]","so":"SBS 뉴스","tm":"11/08 11:17","c":1,"r":"kr","u":"https://news.sbs.co.kr/news/endPage.do?news_id=N1008835796","p":1794104235,"a":1794109980,"su":"그 팻말의 바람은 이틀 뒤 투표함에서 현실이 됐습니다. 지난 3일 치러진 중간선거에서 민주당은 연방 상·하원 다수당을 모두 차지했습니다. 주지사 당선인 36명 가운데 34명이 데이터센터 규제를 하나 이상 지지했습니다."},{"s":"버크셔는 3분기 영업이익이 6% 감소함에 따라 새 CEO 그렉 아벨(Greg Abel) 아래 자사주 매입을 늘렸습니다.","so":"The Business Times","tm":"11/08 10:53","c":1,"r":"sg","u":"https://www.businesstimes.com.sg/companies-markets/berkshire-ramps-buybacks-under-new-ceo-greg-abel-q3-operating-profit-falls-6","p":1794102780,"a":1794148466,"t":"Berkshire ramps up buybacks under new CEO Greg Abel as Q3 operating profit falls 6%","su":"버크셔는 7월과 9월 사이에 96억 달러 규모의 자사주를 매입했다고 밝혔습니다. The Business Times에서 자세히 알아보세요."},{"s":"중간선거는 AI 열풍의 마지막 지푸라기에 불과할까? JP Morgan은 순환 자금 조달 위험을 밝힙니다.","so":"鉅亨網","tm":"11/08 10:40","c":1,"r":"tw","u":"https://news.cnyes.com/news/id/6652032","p":1794102005,"a":1794128040,"t":"期中選舉只是AI熱潮最後一根稻草？摩根大通揭循環融資風險","su":"미국 중간선거 이후 AI 붐의 구조적 리스크가 대두됐다. 나스닥과 S&P 500이 동시에 급락했고, 기술펀드는 올해 상승세를 반납했다.\nJ.P. Morgan Adler는 대규모 클라우드 기업이 외부 자금 조달로 전환하고 있으며 AI 순환 자금 조달 및 공급망 위험을 더 이상 무시하기 쉽지 않다고 경고했습니다.\nAI 공급망이 매각되고 헤지펀드가 압박을 받고 있다. 그러나 타일러는 AI 투자의 냉각이 GDP를 하락시킬 뿐 경기침체를 촉발하지 않을 수 있다고 말했다."},{"s":"투자자들이 주택 건설업자에게 희망을 찾는 이유","so":"WSJ","tm":"11/08 10:02","c":1,"r":"us","u":"https://www.wsj.com/finance/stocks/why-investors-are-searching-for-hope-in-home-builders-07a525bd","p":1794099764,"a":1794109980,"t":"Why Investors Are Searching for Hope in Home Builders"},{"s":"블루쓰나미 후폭풍…TIGER 미국S&P500, 국내 1위 ETF 등극","so":"한국경제","tm":"11/08 09:35","c":1,"r":"kr","u":"https://www.hankyung.com/article/202611061620i","p":1794098152,"a":1794109980,"su":"- 기사 스크랩 - 댓글 - 공유 - 글자크기 - 프린트 Google 검색에서 한국경제 기사를 더 자주 볼 수 있습니다. 미국 선거 이후 AI 데이터센터 투자 둔화 우려로 국내 반도체주와 코스피가 급락하면서, 'TIGER 미국S&P500' ETF가 'KODEX 200'을 제치고 국내 ETF 순자산 1위를 차지했습니다. 한경 프리미엄9의 모든 콘텐츠는 한국경제신문의 저작물로 저작권법의 보호를 받습니다."},{"s":"시장이 중간 선거 결과를 기다리면서 미국 주식은 오전 거래에서 혼조세를 보였습니다.","so":"經濟日報","tm":"11/08 09:30","c":1,"r":"tw","u":"https://money.udn.com/money/story/123398/9855581","p":1794097832,"a":1794109980,"t":"市場靜待期中選舉結果 美股早盤漲跌互見","su":"미국 중간선거 결과가 발표되기 전에는 시장 거래가 조심스러웠습니다. 오늘 오전 장 초반 월스트리트의 주요 주가지수는 혼조세를 보였으며, 애플사의 주가가 발표되었습니다."},{"s":"'정도전 고향' 논란 속 충북 단양군 홍보물 정비 가시화","so":"매일경제 마켓","tm":"11/08 09:13","c":1,"r":"kr","u":"https://stock.mk.co.kr/news/view/1193212","p":1794096781,"a":1794128040,"su":"'정도전 고향' 논란 속 충북 단양군 홍보물 정비 가시화 \"내달 국가유산청 심의 결과 따라 문구 등 수정 계획\" 천경환 입력 : 2026.11.08 09:13:01 (단양=연합뉴스) 천경환 기자 = 조선 개국 공신인 정도전(1342∼1398)을 지역 대표 인물로 내세워 홍보해 온 충북 단양군이 조만간 출생지 정정에 따른 후속 조치에 나설 것으로 보인다. 한국학중앙연구원이 지난 9월 정도전의 고향을 단양이 아닌 경북 영주로 수정하면서 문제가 불거진 것이다."},{"s":"뉴욕증시 이번 주 CPI·코어위브에 달렸다… AI주 바닥 확인할까","so":"핀포인트뉴스","tm":"11/08 07:41","c":1,"r":"kr","u":"https://www.pinpointnews.co.kr/news/articleViewAmp.html?idxno=502117","p":1794091300,"a":1794109980,"su":"뉴욕증시 이번 주 CPI·코어위브에 달렸다… AI주 바닥 확인할까 뉴욕증시가 4주 연속 하락하며 조정 압력을 받고 있는 가운데 이번 주 미국 소비자물가지수(CPI)와 인공지능(AI) 데이터센터 기업 코어위브의 실적이 시장 방향을 결정할 핵심 변수로 떠올랐다. 스테이트스트리트에 따르면 물가 상승 압력이 다시 강해질 경우 연방준비제도(Fed)의 추가 긴축 우려가 커질 수 있는 데다, 코어위브의 실적과 자금조달 상황은 AI 인프라 투자 열기가 실제 수익으로 이어지고 있는지를 가늠할 시험대가 될 전망이다."},{"s":"폴란드 시장 광장에서 총격 사건으로 6명 사망","so":"WSJ","tm":"11/08 07:27","c":1,"r":"us","u":"https://www.wsj.com/wo 08 20:28","c":1,"r":"tw","u":"https://news.pts.org.tw/article/834835","p":1794137295,"a":1794145920,"t":"高雄反空污遊行 籲市長候選人承諾降PM2.5濃度","su":"남부대기오염방지연합은 오늘(8일) 센트럴파크에서 시청까지 걸어가며 대기오염 퇴치, 숲 보호, 가오슝 살리기의 염원을 담은 행진을 시작했습니다. 그들은 모든 시장 후보들에게 다음 임기 동안 가오슝의 PM2.5 농도를 대폭 낮추고 국가적으로 개정된 법적 기준인 입방미터당 12마이크로그램에 도달하도록 노력할 것을 촉구했습니다. 매년 가을에는 중국 이남에서도 여러 노동계와 사회운동 단체가 공동으로 주최하는 집회와 시위가 열려 대기오염 방지 운동을 지지하고 있다."},{"s":"주식시장 안정을 위해 11월 9일 5차례 항공금지 조치를 시행했고, 시장 보호를 위해 5000억 국가안보기금이 시장에 진입했다.","so":"公視新聞","tm":"11/08 20:22","c":1,"r":"tw","u":"https://news.pts.org.tw/article/834834","p":1794136952,"a":1794145920,"t":"11/9起祭5項禁空令穩定股市 5千億國安基金進場護盤","su":"AI 전망에 대한 우려로 대만 증시는 지난 6일 엄청난 붕괴를 겪었다. 한때 장중 3,700포인트 이상 급락해 역사상 최대 장중 하락 및 일일 충격 기록을 세웠습니다. 지난 달 지수는 약 10,000포인트 하락했습니다. 정부는 주식시장을 안정시키고 9일 5대 시장안정대책을 내놨다. 공매도 주문이 시작됐고, 시장을 보호하기 위해 5000억 국가 안보 기금이 출시됐다. 업계에서는 시장 패닉 영향을 완화할 수 있을 것으로 기대하고 있다. 게다가 지난 6일에는 대만 주식 조달이 급락하고 미국 증시는 반등했다. 9일 대만 증시 실적은 각계각층의 관심을 끌었다."},{"s":"가족들은 이 10대가 사기를 당한 혐의를 받고 결국 해외로 갔다고 말했다. 몸값 60만 달러를 요구했고, 관련 부대가 그를 구출하는 데 도움을 주기를 바랐다.","so":"公視新聞","tm":"11/08 20:18","c":1,"r":"tw","u":"https://news.pts.org.tw/article/834832","p":1794136692,"a":1794148491,"t":"家屬稱少年疑受騙淪落海外 遭索60萬贖金盼相關單位協助救人","su":"타이중의 한 어머니는 아들이 올해(2026년) 9월 초 친구들과 함께 북쪽으로 여행을 가겠다고 말했지만 그 이후로 연락이 끊길 줄은 몰랐다고 말했다. 어머니는 휴대전화로 위치를 추적한 결과 그가 태국 방콕에 있는 것으로 확인됐다. 그러다가 그는 밀수꾼 단체로부터 20만 위안에서 60만 위안 사이의 몸값을 요구하는 메시지를 받았다. 이제 가난에서 탈출한 또 다른 사람은 미얀마 공원에서 수상한 십대의 모습을 봤다며 어머니를 걱정하게 만들고 관련 부서에서 사람들을 구출할 수 있기를 바란다고 말했습니다."},{"s":"Li Sichuan은 Lao Fu의 법률에 반대 서명하지 않은 Zhuo Rongtai를 비난했습니다. Su Qiaohui는 이를 강제로 통과시키는 것은 위헌이라고 말했습니다.","so":"公視新聞","tm":"11/08 20:06","c":1,"r":"tw","u":"https://news.pts.org.tw/article/834807","p":1794136001,"a":1794148492,"t":"李四川批卓榮泰不副署老福法 蘇巧慧稱強行通過違憲","su":"9대 1 총선이 막바지에 접어들면서 곳곳에서 총리 선거에도 연기가 피어오르고 있다. 신베이시 국민당 리 쓰촨(Li Sichuan) 인민당 주석과 황궈창(Huang Guochang) 인민당 주석이 다시 한 번 연합하여 청백의 기세를 만들어냈습니다. DPP Su Qiaohui는 오늘 밤 Xiao Meiqin 부주석에게 투표 통합을 도와달라고 요청할 것입니다. 그러나 Zhuo Rongtai 행정주석은 노인복지법 개정안에 반대 서명하지 않았습니다. Li Sichuan은 Zhuo Rongtai에게 말을 할 수 없다고 Su Qiaohui를 비난했습니다. 두 사람 모두 신베이시 원로들에게 사과해야 합니다. 쑤차오후이는 이에 맞서 법안이 위헌적으로 통과되도록 강요하고 거버넌스를 몰아내며 예산 논의가 헌법 정신으로 돌아갈 것을 촉구했습니다."},{"s":"침대 센서 시스템의 개발 PM【후지사와】◆대형 종합 부품 메이커/연봉 1,000만엔～","so":"日経転職版","tm":"11/08 18:20","c":1,"r":"jp","u":"https://career.nikkei.com/agent/170/jobdetail5420406/","p":1794129621,"a":1794148486,"t":"ベッドセンサーシステムの開発PM【藤沢】◆大手総合部品メーカー／年収1,000万円～"},{"s":"칫솔은 상자에 넣어도 괜찮나요? 전문가들이 밝히는 \"3가지 규칙\": 최대 1개월 동안 휴대용 칫솔을 사용하세요 - 국제","so":"中時新聞網","tm":"11/08 18:01","c":1,"r":"tw","u":"https://www.chinatimes.com/realtimenews/20261108002190-260408","p":1794128467,"a":1794148494,"t":"牙刷放進盒子就沒事？專家揭「3大守則」 攜帶型牙刷最多用1個月- 國際","su":"휴대가 간편한 칫솔로 이동 중에 사용할 때나 직장에서 점심 식사 후 이를 닦을 때 매우 실용적입니다. 그런데 이런 종류의 칫솔을 제대로 세척하고 있나요? 어떤 사람들은 집에서 사용하는 칫솔을 정기적으로 바꾸지만, 휴대용 칫솔은 자주 사용하지 않고 더 오래 사용할 수 있다고 생각합니다. 일본 마이니치방송(MBS) 투데이"},{"s":"투자 넘어 수주·양산으로…LFP 양극재 사업화 속도","so":"이투데이","tm":"11/08 17:34","c":1,"r":"kr","u":"https://www.etoday.co.kr/news/view/2645037","p":1794126840,"a":1794128040,"su":"엘앤에프, 국내 셀 3사 고객사 확보…9월부터 양산포스코퓨처엠, 기존 설비 전환·전용공장 건설 병행북미 ESS 성장에 비중국산 소재 확보 수요 확대▲엘"},{"s":"금주의 사건/행정부는 '노인복지법'에 반대하지 않고 민주당이 미국 중간선거에서 승리(2026.11.2~11.8)","so":"公視新聞","tm":"11/08 17:13","c":1,"r":"tw","u":"https://news.pts.org.tw/article/834805","p":1794125585,"a":1794128040,"t":"一週大事／行政院不副署《老人福利法》 美期中選舉民主黨勝選（2026.11.2-11.8）","su":"\"PSTV 뉴스 네트워크\"는 이번 주 국내외 주요 행사를 선정해 드립니다. 초점은 다음과 같습니다: 정치 위안부가 \"노인복지법\" 개정안에 반대 서명하지 않음, 두 번째 F-16V 전투기가 대만에 도착함, Gao Jin Sumei가 공산당 간첩 사건에 연루되어 기소되어 14년 형을 선고받았음, 대만 주식 시장이 시장에서 최대 하락세를 기록함, Yongfeng 은행 계좌가 해킹됨, 대만 64호선 패킷 손실 사건의 운전사가 형을 선고받았음. 13년 만에 미국 중간선거에서 민주당이 승리했다."},{"s":"9년 전 산시성(陝西省)에서 호주로 가던 음식 배달 기사가 노숙자에게 칼에 찔려 사망했다. 중국 커뮤니티는 충격을 받았습니다 | 본토 팩스 | 양안","so":"UDN","tm":"11/08 16:57","c":1,"r":"tw","u":"https://udn.com/news/story/7332/9864712?from=udn-catelistnews_ch2","p":1794124641,"a":1794128040,"t":"9年前從陝西赴澳洲外賣騎手被流浪漢捅死華人圈震驚| 大陸傳真| 兩岸","su":"중국 음식 배달 기사 펑젠밍(47)씨가 호주 멜버른에서 음식을 배달하던 중 51세 노숙자에게 칼을 찔려 숨진 혐의를 받고 있다. 이번 사건은 국내외 중국인 커뮤니티를 충격에 빠뜨렸다. 많은 현지 중국인들이 고인을 추모하며 꽃을 바쳤습니다. 멜버른 주재 중국 총영사관은 호주가 이번 사건에 대해 철저한 조사를 실시하고 엄중히 처벌할 것을 요구했다. 사건이 발생한 빅토리아 주지사도 충격을 표하며 살인범을 엄중히 처벌할 것이라고 말했다. Feng Nan은 중국에 있는 가족의 생계를 유지하기 위해 호주에서 9년 동안 열심히 일했습니다. 그는 아침부터 밤까지 음식을 배달하는 일을 한다. 지역 상점에서는 모금 행사를 시작했습니다. 한 점원은 너무 겁에 질려 현지 치안 환경이 불안하다며 중국으로 돌아가기 위해 밤새 비행기표를 샀다."},{"s":"LG에너지솔루션, 3분기 영업익 7560억원…ESS가 실적 견인","so":"핀포인트뉴스","tm":"11/08 15:53","c":1,"r":"kr","u":"https://www.pinpointnews.co.kr/news/articleViewAmp.html?idxno=502167","p":1794120805,"a":1794128040,"su":"LG에너지솔루션, 3분기 영업익 7560억원…ESS가 실적 견인 LG에너지솔루션이 에너지저장장치(ESS) 사업의 출하 확대와 원통형 배터리 매출 증가에 힘입어 올해 3분기 시장 기대치를 크게 웃도는 실적을 기록했다. 키움증권은 최근 보고서에서 글로벌 ESS 수요 확대가 이어지는 가운데 향후 수익성을 얼마나 안정적으로 확보하느냐가 기업가치 상승의 핵심 변수가 될 것이라고 밝혔다. LG에너지솔루션의 3분기 연결 기준 매출액은 9조6000억원으로 전 분기보다"},{"s":"포스코퓨처엠, LFP 양극재로 반전 노린다…2027년 실적 회복 기대","so":"핀포인트뉴스","tm":"11/08 15:53","c":1,"r":"kr","u":"https://www.pinpointnews.co.kr/news/articleViewAmp.html?idxno=502168","p":1794120805,"a":1794145920,"su":"포스코퓨처엠, LFP 양극재로 반전 노린다…2027년 실적 회복 기대 포스코퓨처엠의 실적 개선 기대가 커지고 있다. 대신증권은 최근 보고서에서 리튬 가격 하락에 따른 실적 추정치 조정에도 불구하고 리튬인산철(LFP) 양극재 생산라인 가동과 2027년 신규 납품을 통해 물량 증가와 수익성 회복이 가시화될 것으로 전망했다. 포스코퓨처엠은 전기차 배터리 소재 시장의 수요 둔화와 리튬 가격 하락이라는 이중 부담을 겪어왔다."},{"s":"이스라엘 대통령, 야당 지도자 아이센코트에게 정부 구성 승인 발표","so":"公視新聞","tm":"11/08 14:23","c":1,"r":"tw","u":"https://news.pts.org.tw/article/834797","p":1794115412,"a":1794128040,"t":"以色列總統宣布 授權反對派領袖艾森科特組閣","su":"이스라엘 총선 이후 여당은 과반수 확보 없이 교착상태에 빠졌다. 헤르조그 현 이스라엘 대통령은 지난 7일 새 정부 구성을 위해 전 참모총장인 야당 지도자 아이젠코트에게 우선권을 주겠다고 공식 발표했다. 네타냐후 총리는 즉각 긴급성명을 발표해 연립정부 수립을 촉구하고, 야당이 정부를 구성하면 국가안보를 위협할 것이라고 경고했다."},{"s":"일본의 새로운 세금 환급 시스템 | 새로운 절차는 아직 조정이 필요합니다. 최종 세금 환급금이 현금으로 손실되어 승객이 불만을 나타냄","so":"Now 新聞","tm":"11/08 14:18","c":1,"r":"hk","u":"https://news.now.com/home/international/player?newsId=668776","p":1794115118,"a":1794128040,"t":"日本退稅新制｜新手續尚待適應 旅客不滿現金退稅蝕尾數","su":"[나우뉴스채널] 일본의 새로운 세금환급 제도가 시행된 지 일주일이 지났지만 여권, 신용카드 인증 실패 등 운영상의 문제가 여전히 많다. 많은 관광객들은 새로운 시스템 하에서 높은 처리 수수료와 나머지 금액에서 현금 환불이 차감된다는 사실에 불만을 갖고 있습니다."},{"s":"타이중에서 SUV 차량 운전자가 정지하지 않아 사고를 냈습니다. 한 여성이 줄을 건너던 중 부상을 입어 심각한 부상을 입어 사망했습니다.","so":"公視新聞","tm":"11/08 14:09","c":1,"r":"tw","u":"https://news.pts.org.tw/article/834798","p":1794114594,"a":1794128040,"t":"台中休旅車駕駛未停讓肇事 婦人行穿線遭輾傷重不治","su":"어제(7일) 저녁 6시쯤, 타이중시 시툰구에서 치명적인 교통사고가 발생했습니다. 61세 여성이 횡단보도를 건너다가 신호등이 녹색으로 바뀌자 좌회전하는 SUV 차량에 치였습니다. 운전자도 눈치 채지 못한 것 같습니다. 그 결과 앞바퀴와 뒷바퀴가 차례로 여성을 덮쳐 심각한 부상을 입어 사망했다. 경찰 예비 조사 결과, 운전자의 음주 및 약물 검사에서는 이상이 없는 것으로 나타났으며, 자세한 사고 원인은 아직 밝혀지지 않았다."},{"s":"지룽시민그룹은 후보자들에게 Tong Ziwei와 Xie Guoliang이 서명한 약속 서한을 준수할 것을 요구하는 12개의 요구서를 제출했습니다. │20261108 공영 텔레비전 점심 시간 뉴스 ｜ 공영 텔레비전 뉴스 PNN","so":"公視新聞","tm":"11/08 14:08","c":1,"r":"tw","u":"https://news.pts.org.tw/video/23018","p":1794114526,"a":1794128040,"t":"基隆民團提12訴求籲候選人兌現童子瑋、謝國樑均簽署承諾書｜20261108 公視午間新聞｜ 公視新聞PNN","su":"지룽시의 16개 시민단체는 환경, 교육 및 기타 측면에 대한 4가지 주요 비전과 12가지 정책 요구를 공동으로 제안했습니다. 그들은 이번 선거에 출마하는 시장 후보들에게 향후 당선된 후 정책 공약을 실현하기 위한 공약 및 성과 서한에 서명할 것을 촉구했습니다. 이에 청·녹색 후보를 포함한 후보들은 물론, 당원이 없는 무소속 후보들도 서명을 완료하며, 요구사항을 면밀히 검토하고 평가하겠다는 점을 강조했다. 자세한 뉴스 내용은 [공영 텔레비전 뉴스 네트워크] https://news.pts.org...를 참조하세요."},{"s":"펑지아 야시장에서 한 관광객의 배낭에 불이 붙었고, 모바일 전원 공급 장치의 리튬 배터리가 사고 원인으로 의심됩니다.","so":"公視新聞","tm":"11/08 14:06","c":1,"r":"tw","u":"https://news.pts.org.tw/article/834799","p":1794114387,"a":1794128040,"t":"逢甲夜市遊客背包起火 疑行動電源鋰電池肇禍","su":"타이중 펑지아 야시장에서는 어젯밤(7일) 한 관광객의 배낭에 불이 붙었는데, 내부에 있던 리튬 배터리가 불탔던 것으로 의심됩니다. 다행히 인근 상인이 공용 건조분말소화기를 가져와 진화에 성공해 인명피해는 없었다. 그러나 일부 전문가들은 건조 분말 소화기가 리튬 배터리나 이동식 전원 공급 장치로 인한 화재를 진압하는 데 적합하지 않다는 점을 상기시킵니다. 연소열을 중화시키기 위해 다량의 물을 사용하는 것이 화재를 진압하는 데 더 적절한 방법입니다."},{"s":"가오슝 냐오송 양철집 화재, 두 형제 탈출 전 사망","so":"公視新聞","tm":"11/08 14:04","c":1,"r":"tw","u":"https://news.pts.org.tw/article/834800","p":1794114240,"a":1794148496,"t":"高雄鳥松鐵皮屋民宅火警 2兄弟逃生不及身亡","su":"가오슝시 냐오송구 중청로의 한 주택에서 화재가 발생했습니다. 불은 삽시간에 옆집 다경간 철제 건물까지 번졌다. 그 결과 왕아무개(19세, 17세) 형제 2명이 금속 건물 2층에 갇혀 탈출할 시간도 없이 불동굴에서 사망했다. 8일 이른 아침에도 링야구 5층 티안추 빌딩에서 화재가 발생했다. 건물 전체가 임대아파트였기 때문에 여러 세입자가 한꺼번에 갇혔습니다 662,"a":1794059580,"su":"재고평가손실에 발목 잡힌 엘앤에프…시장은 LFP 성장성 주목 엘앤에프가 올해 3분기 리튬 가격 하락에 따른 재고평가손실과 환율 하락의 영향으로 영업적자로 돌아서며 시장 기대치를 밑도는 실적을 기록했다. DS투자증권은 최근 보고서에서 이번 실적 부진은 일회성 비용에 따른 영향이 크다며, 단기 실적보다 리튬인산철(LFP) 배터리 소재 수주 확대 가능성에 주목해야 한다고 말했다. 엘앤에프의 3분기 잠정 매출액은 8744억원으로 전 분기 대비 1.2% 감소했지만 전년 동기보다는 34.1% 증가했다."},{"s":"토요타의 인기 비즈니스 여행자가 고급 캠핑카로 변신! 가지고 다닐 수 있는 편안한 침대 3개와 매우 편리한 빌트인 화장실","so":"自由電子報汽車頻道","tm":"11/07 10:00","c":1,"r":"tw","u":"https://auto.ltn.com.tw/news/33373","p":1794013200,"a":1794023400,"t":"Toyota 熱門商旅化身高級露營車！三張舒適床鋪帶著走 內建廁所超方便","su":"최근 개막한 2026 나고야 캠핑카페어 가을캠핑카 박람회에서 유명 캠핑카 브랜드 OMC 캠퍼가 토요타의 인기 비즈니스 트래블러 하이에이스(Hiace)를 기반으로 한 '갤럭시(Galaxy)' 캠핑카를 메인쇼로 출시했다. 넓은 기내 공간을 내 집처럼 편안한 생활 공간으로 탈바꿈시켰고, 야외 캠프 생활을 보다 쉽고 편리하게 만들기 위해 간이 화장실까지 계획했습니다. '갤럭시' 캠퍼밴의 현지 가격은 735만엔, 약 NT$152만이다."},{"s":"신한투자증권 \"북미 전기차 부진에도…에코프로비엠, ESS·신규 고객으로 돌파구\" |","so":"핀포인트뉴스","tm":"11/07 09:30","c":1,"r":"kr","u":"https://www.pinpointnews.co.kr/news/articleViewAmp.html?idxno=502033","p":1794011453,"a":1794023400,"su":"신한투자증권 \"북미 전기차 부진에도…에코프로비엠, ESS·신규 고객으로 돌파구\" 에코프로비엠이 헝가리 생산라인의 정상 가동을 발판으로 중장기 실적 회복에 나선다. 신한투자증권은 최근 보고서에서 북미 전기차 시장의 부진과 유럽 완성차 업체들의 차종 변경에 따른 단기 출하 공백이 이어지겠지만, 헝가리 공장 가동률 상승과 신규 고객사 물량 확대가 향후 실적 개선을 이끌 것으로 전망했다. 에코프로비엠은 전기차 배터리용 양극재를 생산하는 기업으로, 글로벌 전기차 시장의 성장 속도와 배터리 업체들의 생산 계획에 따라 실적 변동성이 큰 사업 구조를 갖고 있다."},{"s":"정부는 여섯 번째 트랜치에서 ECMS에 따라 Rs 7,503 crore 투자를 청산했습니다.","so":"The Economic Times","tm":"11/07 09:30","c":1,"r":"us","u":"https://m.economictimes.com/tech/technology/government-clears-rs-7503-crore-investments-under-ecms-in-sixth-tranche/articleshow/135618211.cms","p":1794011400,"a":1794059580,"t":"Government clears Rs 7,503 crore investments under ECMS in sixth tranche","su":"최근 12명의 지원자 그룹에는 양극 및 음극 재료와 같은 업스트림 재료 제조업체가 포함되었습니다. 이들 회사는 함께 10개 주의 시설에서 182,243억 달러 상당의 상품을 생산하고 9,500명 이상의 근로자를 고용할 계획입니다."},{"s":"[주간 코스닥 외국인] 반도체 장비주 집중 매수…2차전지·로봇주는 매도","so":"핀포인트뉴스","tm":"11/07 05:45","c":1,"r":"kr","u":"https://www.pinpointnews.co.kr/news/articleView.html?idxno=502010","p":1793997933,"a":1794023400,"su":"외국인 투자자들이 지난주 코스닥시장에서 반도체 장비와 부품 관련 종목을 집중적으로 사들인 것으로 나타났다. 반면 2차전지와 일부 반도체 소재·장비주, 로봇 관련 종목에서는 매도세가 두드러졌다. 인공지능(AI) 산업 확대에 따른 반도체 투자 기대감이 이어지는 가운데 외국인 자금이 업종 내에서도 실적 성장 가능성과 기술 경쟁력을 갖춘 기업을 중심으로 움직이는 모습이다.7일 한국거래소에 따르면 외국인은 지난 2일부터 6일까지 코스닥시장에서 테스, 두산테스나, 티씨케이 등을 순매수 상위 종목에 올렸다. 반도체 전공정 장비와 테스트, 소재"},{"s":"아시아프로야구교류대회 피치몽키, 신인선수 파견","so":"中時新聞網","tm":"11/07 05:10","c":1,"r":"tw","u":"https://www.chinatimes.com/newspapers/20261107000694-260111","p":1793995800,"a":1794007140,"t":"亞洲職棒交流賽 桃猿派新秀出征","su":"'2026 타오위안 아시아 프로야구 교류대회'가 11월 7일과 8일 양일간 롯데 타오위안 야구장에서 뜨거운 열기 속에 개막한다. 롯데 몽키스는 한국 직업훈련 히어로즈, 일본 직업 도호쿠 롯데 골든 이글스와 각각 대결한다. 6일 오전에는 킥오프 기자간담회가 열린다. 타오위안시 부시장 Su Junbin은 타오위안이 대만과 일본을 유치한 것은 올해가 두 번째라고 말했습니다."},{"s":"아시아프로야구교류대회 피치몽키, 신인선수 파견 - 스포츠","so":"中時新聞網","tm":"11/07 05:10","c":1,"r":"tw","u":"https://www.chinatimes.com/newspapers/20261107000694-260111","p":1793995800,"a":1794059580,"t":"亞洲職棒交流賽桃猿派新秀出征- 運動","su":"'2026 타오위안 아시아 프로야구 교류대회'가 11월 7일과 8일 양일간 롯데 타오위안 야구장에서 뜨거운 열기 속에 개막한다. 롯데 몽키스는 한국 직업훈련 히어로즈, 일본 직업 도호쿠 롯데 골든 이글스와 각각 대결한다. 6일 오전에는 킥오프 기자간담회가 열린다. 타오위안시 부시장 Su Junbin은 타오위안이 대만과 일본을 유치한 것은 올해가 두 번째라고 말했습니다."},{"s":"뉴발란스 990v7 혁신 데뷔 - 패션 소비 - China Times","so":"中時新聞網","tm":"11/07 04:40","c":1,"r":"tw","u":"https://www.chinatimes.com/newspapers/20261107000676-260113","p":1793994003,"a":1794007140,"t":"New Balance 990v7革新登場- 時尚消費- 中國時報","su":"뉴발란스의 클래식 990 시리즈는 7세대 혁신을 맞이합니다. 새로운 MADE in USA 990v7이 출시되었습니다. 신발 본체의 비율, 소재 수준, 구조적 세부 사항 조정을 통해 더욱 깨끗하고 부드러운 외관을 만들어냅니다. 기술적인 구성으로는 퓨얼셀(FuelCell) 미드솔 기술을 적용해 쿠셔닝 성능과 에너지 피드백을 향상시켰으며, ENCAP의 안정성도 결합했다."},{"s":"의견 | 메탄 규제와 기후 논쟁","so":"WSJ","tm":"11/07 01:03","c":1,"r":"us","u":"https://www.wsj.com/opinion/methane-regulations-and-the-climate-debate-70e14c5a","p":1793980980,"a":1794007140,"t":"Opinion | Methane Regulations and the Climate Debate"},{"s":"Zhida Technology, 태국 최초의 해외 스마트 에너지 솔루션 출시: 현지 제조 및 시나리오 역량을 통해 태국의 국가 에너지 전환 지원","so":"經濟日報","tm":"11/07 01:01","c":1,"r":"tw","u":"https://money.udn.com/money/story/123828/9863045","p":1793980895,"a":1794007140,"t":"摯達科技泰國首發海外智慧能源解決方案：以本土製造與場景能力服務泰國國家能源轉型","su":"촌부리, 태국, 2026년 11월 6일 /PRNewswire/ -- 11월 6일, Zhida Technology(02650.HK)는 태국 촌부리에서 해외 AI 스마트 에너지 솔루션 및 충전 로봇 제품 출시 행사를 열었습니다. 이 회사는 태국에서 가정 및 공공 현장을 위한 스마트 에너지 솔루션을 공식 출시했으며 최초의 메가와트급 유연한 액체 냉각식 충전 파일을 출시했습니다. 같은 날, 태국에서 관련 제품과 서비스를 홍보하기 위해 여러 파트너와 전략적 협력을 체결했습니다. 태국 촌부리에서 열린 Zhida Technology 기자간담회. 이번 기자간담회에는 인도네시아, 말레이시아, 라오스, 스리랑카, 캄보디아 및 기타 동남아시아 및 중동 국가의 고객과 파트너가 참석했습니다. 회사는 시나리오 솔루션과 신제품 출시를 위해 태국을 선택한 것은 태국을 깊이 육성하고 현지 녹색 에너지 전환에 봉사하겠다는 의지를 반영한다고 밝혔습니다. Zhida는 보다 완벽한 제품 매트릭스와 \"가정 + 공공\" 전체 시나리오 적용 범위 기능을 통해 현지 가족, 운영자, 공원 및 상업 단체를 위한 통합 녹색 에너지 솔루션을 제공하고 더 많은 파트너와 협력하여 태국의 녹색 여행 생태계를 구축할 것입니다. 태국 최초의 전문 충전 파일 공장으로 이중 카테고리 시장 점유율 1위를 차지했습니다. Zhida의 태국 현지 레이아웃은 2022년부터 시작됩니다. 중국과 태국의 신에너지 산업 간의 시너지를 배경으로 Zhida는 태국을 최초의 종합 해외 목적지로 만들 것입니다."},{"s":"SNE리서치: 중국 OEM이 글로벌 EV 배터리 시장 장악","so":"electrive.com","tm":"11/06 22:30","c":1,"r":"us","u":"https://www.electrive.com/2026/11/06/sne-research-chinese-oems-increasingly-dominate-global-ev-battery-market/","p":1793971800,"a":1793974680,"t":"SNE Research: Chinese OEMs increasingly dominate global EV battery market","su":"올해 첫 9개월 동안 중국 제조업체는 중국 이외의 전기 및 하이브리드 차량용 배터리 시장의 절반 이상을 확보했습니다."},{"s":"닝더타임스 03750 샤오미 01810 ｜ 대가족들은 추세를 거스르고 2억 상당의 물품을 구입하여 베이수이와 철수 및 유통 경쟁을 벌였다 | 홍콩경제신문","so":"香港經濟日報HKET","tm":"11/06 20:17","c":1,"r":"hk","u":"https://invest.hket.com/article/4218872/01810-xiaomi-03750-catl-northbound-capital-flow","p":1793963820,"a":1793974680,"t":"寧德時代03750小米01810 ｜ 大戶逆勢掃貨2億對決北水撤退派發|香港經濟日報"},{"s":"현대 아틀라스에 삼성SDI 배터리 70개 탑재","so":"디일렉","tm":"11/06 19:32","c":1,"r":"kr","u":"https://www.thelec.kr/news/articleView.html?idxno=65065","p":1793961162,"a":1794007140,"su":"삼성SDI가 현대차그룹의 로봇 전문 계열사 보스턴 다이내믹스의 휴머노이드 로봇 '아틀라스'에 배터리를 공급한다. LG에너지솔루션과 함께 공급하지만, 물량이 많지"},{"s":"[홍콩증시 마감] 항셍지수 315포인트 하락, 5연속 상승세 중단","so":"Now 新聞","tm":"11/06 18:14","c":1,"r":"hk","u":"https://news.now.com/home/ 시 종료하고 주식 회수 준비를 발표했습니다."},{"s":"항셍 지수 추세 丨 친구의 반격이 한때 100 포인트 미만으로 하락하고 24700 수준으로 돌아 왔습니다.","so":"信報網站","tm":"11/06 11:23","c":1,"r":"hk","u":"https://www2.hkej.com/instantnews/stockConnect/article/4559576","p":1793931832,"a":1793943180,"t":"恒指走勢丨好友反攻曾跌不足百點 返24700水平","su":"미국 증시는 밤새 급락했고 일본, 한국, 대만 등 주요 아시아태평양 주식시장은 오늘 아침 매도세를 보였다. A주도 1% 이상 하락했다. 홍콩 주식은 분명히 상대적으로 약세를 보였습니다. 항셍지수는 초반 400포인트 이상 하락한 뒤 하락폭을 대부분 회복했다. 하락폭은 한때 100포인트 미만으로 좁혀지며 50일 이동평균선(현재 24,414포인트)을 회복했습니다. 항셍지수는 392포인트 하락하며 24,404포인트에 마감했다. 하락폭은 447포인트까지 확대됐다. 24,349포인트로 최저치를 기록한 후 안정되었습니다. 친구들이 반격을 가해 하락세는 점차 좁아졌다. 한때 94포인트 하락에 그쳐 24,702포인트까지 최고치를 기록하기도 했습니다. 오전 10시 21분 현재 항셍지수는 224포인트(0.91%) 하락한 24,572포인트를 기록하고 있다. 전국지수는 66포인트, 0으로 떨어졌다."},{"s":"'무브먼트 주식' Xinyi Solar(00968)는 한때 5% 이상 상승했으며 현재 2.21위안에 거래되고 있습니다.","so":"etnet 經濟通","tm":"11/06 11:03","c":1,"r":"hk","u":"https://www.etnet.com.hk/mobile/tc/news/categorized_news_detail.php?newsid=20261106397","p":1793930580,"a":1793943180,"t":"《異動股》信義光能(00968)曾升逾5%，現報2.21元","su":"2026/11/06 10:03 \"무브먼트 주식\" Xinyi Solar(00968)는 한때 5% 이상 상승하여 현재 2.21위안에 거래되고 있습니다. Xinyi Solar(00968)는 한때 5% 이상 상승했으며 최고 가격은 1개월 최고치인 2.235위안에 도달했습니다. 현재 4% 오른 2.21위안, 최저 가격 2.065위안입니다. 3,033만 주가 거래되었으며 거래 가치는 6,601만 위안입니다. 활성 매수 및 매도 비율은 55:45, 순 활성 펀드 구매액은 664.35만 위안입니다. 현재 최대 순소극적 매수 중개업체는 JPMorgan Chase로 금액은 237만2000위안, 가중평균 거래가격은 2183위안이다. 현재 최대 순소극판매중개업은 중국투자정보(China Investment Information)로 금액은 238.13만원, 가중평균거래가격은 2187위안이다. 현재 주가 기준으로 주가는 4일 연속 상승해 누적 상승률은 21.8%다."},{"s":"케이지에이, 매출 15% 규모 신규 수주…\"이차전지 넘어 물류자동화까지\"","so":"파이낸셜뉴스","tm":"11/06 10:49","c":1,"r":"kr","u":"https://www.fnnews.com/news/202611061046432792","p":1793929779,"a":1793930100,"su":"케이지에이가 지난해 매출액의 15%를 웃도는 물류자동화 설비 공급계약을 확보했다.이차전지 전극공정 장비를 주력으로 하는 가운데 자동화 설비 분야에서도 수주 기반을 넓히는 모습이다.6일 금융감독원 전자공시에 따르면 케이지에이는 국내 고객사와 28억원 규모의 .."}]},{"name":"⚡ 전고체배터리·ESS","note":"보유: KODEX 전고체배터리ESS TOP2플러스","breaking":false,"items":[{"s":"신성이엔지, 3분기 영업이익 6억원…ENG 역대 최대 수주","so":"전자신문","tm":"11/06 14:33","c":3,"r":"kr","u" "su":"다카이치 사나에 일본 총리가 2025년 11월 7일 '대만은 곤란하다' 관련 발언을 해 중일관계 긴장을 촉발한 지 1년만이다. 최근 중국과 일본 관계자들이 관련 발언을 놓고 충돌하면서 지난해와 같은 규모로 상하이에서 열리는 제9회 중국국제수입박람회에는 일본 기업 320여개사가 참가한다. 인터뷰에서 많은 일본 기업은 중국 시장을 중요하게 생각한다고 밝혔습니다. 현지 입지를 지속적으로 확대하는 것 외에도 현지 R&D 및 공장 설립 투자를 통해 입지를 더욱 심화해 왔습니다."},{"s":"에너지 전환에 역풍이 불고 있지만 산업 생산량은 추세에 반해 증가하고 있습니까? ITRI는 내년에 5334억 위안에 이를 것으로 예상한다.","so":"自由時報","tm":"11/07 13:32","c":2,"r":"tw","u":"https://stock.ltn.com.tw/article/py6zc3bgbahh","p":1794025946,"a":1794041640,"t":"能源轉型遇逆風、產業產值逆勢上升?工研院估明年達5334億元","su":"AI 데이터센터의 전력 수요가 급증하고 있으며, 세계는 '전력 시대'에 진입해 중전력, 에너지 저장, 재생에너지 산업에서 사업 기회를 창출하고 있습니다. 산업연구원 산하 국제 산과 상업 연구소는 대만의 에너지 전환 관련 산업의 생산 가치가 2026년에 4,910억 위안에 도달하고, 2027년에는 5,334억 위안으로 증가해 연간 8.6% 증가할 것으로 예상합니다. 성장 모멘텀은 전력망, 중전기기 수요를 견인하는 AI 데이터센터 확대와 에너지 저장 기술 업그레이드, 신재생에너지 개발, 해외 시장 확대에서 비롯된다."},{"s":"신흥 산업은 수요를 증가시킵니다. 상하이에서는 매년 3개의 새로운 전력 소비가 추가됩니다.","so":"經濟日報","tm":"11/07 01:50","c":2,"r":"tw","u":"https://money.udn.com/money/story/5603/9862902","p":1793983806,"a":1794007140,"t":"新興產業推升需求 陸每年新增三個上海用電量","su":"중국 본토 국가에너지국은 컴퓨팅 파워와 같은 신흥 산업이 주도하는 '15차 5개년 계획' 기간(2026~2030) 동안 전체 전력 수요가 여전히 완고하게 증가할 것이라고 밝혔습니다. 연간 평균 증가량은 6,000억kWh에 달할 것으로 예상되며, 이는 연간 증가율 6%로 상하이 3개 도시의 연간 전력 소비량 증가분과 맞먹는다. 이 중 컴퓨팅 파워에 사용되는 전력은 1000억kWh로 신규 전력 소비량의 약 17%를 차지한다."},{"s":"비오는 날에도 안심하고 버스를 기다리실 수 있습니다. 난시정부, 기업과 손잡고 스마트 그린 에너지 버스 부스 출시","so":"UDN","tm":"11/07 01:08","c":2,"r":"tw","u":"https://udn.com/news/story/7326/9863026","p":1793981318,"a":1794007140,"t":"雨天也能安心候車 南市府攜手企業推智慧綠能公車亭","su":"타이난시는 넷제로 전환을 추진하고 있으며 현지 기업 3곳과 손을 잡고 올그린 전기 스마트 버스 부스를 구축했습니다. 태양광 발전, 에너지 저장 배터리 및 AI 스마트 조명을 결합합니다. 버스를 기다리는 사람이 없으면 조명 밝기가 자동으로 10%로 감소됩니다. 매년 약 2,500도의 전기를 절약하고, 약 1,300kg의 이산화탄소 배출량을 줄일 수 있는 것으로 추정된다. 비가 오는 날에도 최소 3일 연속으로 작동을 유지할 수 있습니다."},{"s":"폴란드 대표 Liu Yongjian은 대만의 유엔 기후 협약 참여를 촉구하는 서한을 썼습니다.","so":"經濟日報","tm":"11/06 22:00","c":2,"r":"tw","u":"https://money.udn.com/money/story/7307/9862760","p":1793970057,"a":1793974680,"t":"駐波蘭代表劉永健投書 籲挺台參與聯合國氣候公約","su":"폴란드 주재 류용젠(Liu Yo s":"'켄텍 총장 선임, 공공기관 이전'…신정훈, 지역 현안 건의","so":"뉴시스","tm":"11/08 11:45","c":1,"r":"kr","u":"https://mobile.newsis.com/view_amp.html?ar_id=NISX20261108_0003859269","p":1794105922,"a":1794128040,"su":"[나주·화순=뉴시스]이창우 기자 = 신정훈 더불어민주당 의원(전남광주 나주·화순)이 한국에너지공과대학교(켄텍·KENTECH) 정상화와 나주 에너지산업 기반 확충, 공공기관 이전을 통한 전남광주 성장거점 구축을 위해 청와대와 당 지도부를 잇달아 찾았다"},{"s":"“코스피 5000도 위태롭다”…4500선 추락 가능성까지 경고","so":"전자신문","tm":"11/08 11:40","c":1,"r":"kr","u":"https://www.etnews.com/20261108000033","p":1794105600,"a":1794109980},{"s":"1주 배포 | AI에 대한 미국 민주당의 입장이 핵심이며 본토는 블록버스터 데이터를 다수 공개합니다.","so":"etnet 經濟通","tm":"11/08 11:30","c":1,"r":"hk","u":"https://www.etnet.com.hk/www/tc/news/news-article.php?section=features&category=financenews&newsid=415792","p":1794105000,"a":1794109980,"t":"一周部署 | 美民主黨對AI取態成關鍵，內地公布多項重磅數據","su":"주간 배포 | AI에 대한 미국 민주당의 입장이 핵심인데, 본토에서는 블록버스터급 데이터를 대거 공개했다. \"주간 배포\" 다음 주에 주목해야 할 금융 이벤트: 고용 데이터는 다음 달 미국 준비은행의 금리 인상을 지원하기 위해 상향 조정되었습니다. 미국은 10월 신규 비농업 고용이 예상 6만5000명을 크게 웃도는 16만5000명에 달했다고 발표했다. 더 중요한 것은 8월과 9월을 합친 데이터가 최대 84,000명으로 크게 수정되었다는 점입니다(이 중 9월은 원래 매우 낮은 수치인 29,000명에서 60,000명으로 수정되었습니다). 이는 기업의 최근 채용 노력이 이전에 평가했던 것보다 더 탄력적임을 나타냅니다. 최근 실업률도 4.1%로 예상이나 이전 수치보다 낮다. 일자리 증가는 주로 전문 및 비즈니스 서비스 산업과 의료 산업이 주도했으며 AI 인프라 및 데이터 센터 구축이 주도했습니다. 컴퓨터 및 전자제품 제조업이 4년 만에 월간 최대 성장률을 기록했다. 이 데이터는 연준이 12월에 금리를 인상할 것이라는 시장의 강력한 베팅을 다시 불러일으켰습니다. 미국 채권수익률이 전반적으로 상승했고, 달러지수 역시 강한 반등세를 기록했다. 금리선물시장에서는 다음 달 금리 인상 확률이 75%를 넘는 것으로 나타났다. 다음에 발표되는 소비자물가지수(CPI)에서 인플레이션이 다시 가속세를 보이고 있는 것으로 나타나면 시장은 추가 금리 인상을 예상할 수밖에 없을 것이며, 이는 조정권에 진입한 미국 증시에 하락 압력을 더 가중시킬 수 있다."},{"s":"AI넷제로/COP31, 환경부 출석해 정보 파악 포럼 동시 개최 | 삶","so":"中央社 CNA","tm":"11/08 11:16","c":1,"r":"tw","u":"https://www.cna.com.tw/news/ahel/202611080023.aspx","p":1794104160,"a":1794109980,"t":"AI淨零／COP31將登場環境部同步啟動論壇掌握資訊| 生活","su":"COP31이 내일 공식적으로 데뷔합니다. 환경부는 회의 기간 동안 일련의 포럼이 시작될 것이라고 밝혔습니다. 국제 기후 문제의 본질은 실시간 정보 파악은 물론, 국내 정책과 산업 변혁의 기회로도 전환될 것입니다."},{"s":"Yantian에서 Lantian까지 학교 교장은 토지에 있습니다 | 잡지","so":"UDN","tm":"11/08 11:14","c":1,"r":"tw","u": ."},{"s":"신방 통합 62 구매 01 활발","so":"經濟日報","tm":"11/08 02:07","c":1,"r":"tw","u":"https://money.udn.com/money/story/5739/9864099","p":1794071270,"a":1794093180,"t":"信邦統一62購01 活跳跳","su":"信邦今年前十個月累計合併營收305.72億元，創同期新高，年增16.89%。10月營收33.88億元，月增1.19%、年增32%，連續七個月改寫單月歷史新高，營收表現優於預期，主要受惠汽車及通訊、電子周邊出貨成長；其中，工業應用為最主要成長動能。"},{"s":"PPL과 Blackstone, 2GW 데이터센터 전원 공급 케이스 추진 QTS, 20년 장기 계약으로 신규 발전소 지원 계획","so":"鉅亨網","tm":"11/07 21:00","c":1,"r":"tw","u":"https://news.cnyes.com/news/id/6652107","p":1794052805,"a":1794109980,"t":"PPL、黑石推2GW資料中心供電案QTS擬以20年長約支應新電廠","su":"PPL과 Blackstone, 2GW 데이터 센터 전원 공급 프로젝트 추진 QTS는 20년 계약으로 새로운 발전소를 지원할 계획 Uanalyze 2026년 11월 7일(Uanalyze/Industrial Data Center Report) ⸺ 미국 전력 회사 PPL(PPL-US)과 Blackstone Infrastructure의 합작 투자사인 Invitium Energy는 데이터 센터 운영업체인 QTS의 Salem Township 캠퍼스에 약 2GW의 전력을 공급할 계획입니다. 펜실베니아. 두 당사자는 주요 상업 조건을 협상했으며 새로운 천연가스 발전, 연료 전지 및 배터리 에너지 저장을 지원하기 위해 장기적인 전원 공급 장치를 사용할 계획입니다. 총 투자액은 당초 50억~70억 달러로 추산된다. 골드만삭스의 최근 전망에 따르면 미국 데이터센터 용량은 2026년 말까지 64GW에 이를 것으로 예상된다. PPL의 2GW 전력공급 계획 규모는 미국 전체 용량의 약 3.1%에 해당한다."},{"s":"더럼 카운티 데이터 센터 계획, 지역사회에 '추가 타격' - 캠페인 활동가","so":"BBC","tm":"11/07 16:19","c":1,"r":"world","u":"https://www.bbc.com/news/articles/crgqwwn8vq58o","p":1794035994,"a":1794041640,"t":"County Durham data centre plan 'further blow' to communities - campaigners","su":"지역 주민들은 다른 에너지 개발이 제안되는 가운데 전력망 압력과 수질 오염에 대해 걱정하고 있습니다."},{"s":"타이난 뎅기열 17번째 사례, 관광을 마치고 베트남으로 이주하다 병에 걸렸다 | 난 윤자 ​​| 현지의","so":"UDN","tm":"11/07 12:17","c":1,"r":"tw","u":"https://udn.com/news/story/7326/9863335","p":1794021435,"a":1794041640,"t":"台南第17例登革熱境外移入越南旅遊返國發病| 雲嘉南| 地方","su":"타이난시 정부 위생국은 올해 타이난에서 17번째 뎅기열 해외유입 사례가 발생했다고 오늘 발표했습니다. 이번 사례는 용강구 출신 40대 여성으로 10월 28일부터 11월 1일까지 베트남을 여행했다가 귀국했다."},{"s":"영화/노소 모두가 후투피에서 Uni-President Enterprise Social Welfare Charitable Foundation이 주최한 \"녹색 및 은색 어린이 놀이 카니발\"을 축하합니다.","so":"UDN","tm":"11/07 11:43","c":1,"r":"tw","u":"https://udn.com/news/story/7326/9863402","p":1794019396,"a":1794093180,"t":"影／老少同歡 統一企業社福慈善基金會虎頭埤辦「青銀 6%95%B8%E6%93%9A%E4%B8%AD%E5%BF%83","p":1794002499,"a":1794007140,"t":"【OpenAI】第三季業務按季增70% 企業AI需求倍增 美國多地選民反對仍續建數據中心"},{"s":"항셍지수 야간 세션丨은 165포인트 상승한 24647에 마감되었습니다.","so":"信報網站","tm":"11/07 04:42","c":1,"r":"hk","u":"https://www.hkej.com/instantnews/stock/article/4560615/%E6%81%92%E6%8C%87%E5%A4%9C%E6%9C%9F%E4%B8%A8%E6%94%B6%E5%A0%B124647+%E9%AB%98%E6%B0%B4165%E9%BB%9E","p":1793994132,"a":1794007140,"t":"恒指夜期丨收報24647 高水165點","su":"항셍 지수 선물은 야시장에서 24,647포인트로 마감했는데, 이는 어제 종가 24,481포인트보다 165포인트 높은 148포인트 상승한 수치이며, 21,168계약이 거래되었습니다. 전국지수선물은 야시장에서 어제 종가보다 57포인트 오른 8,331포인트에 마감했다. 현물 선물 지수에 대한 자세한 내용은 \"홍콩 주식 360\" 선물 지수 페이지를 참조하세요."},{"s":"UBS는 국내 은행에 대해 낙관적이며 주요 국영은행을 선호한다. 순이자마진은 안정적이며, 이익과 배당금도 증가할 것으로 예상됩니다.","so":"信報網站","tm":"11/07 04:38","c":1,"r":"hk","u":"https://www.hkej.com/dailynews/finnews/article/4560152/%E7%91%9E%E9%8A%80%E7%9C%8B%E5%A5%BD%E5%85%A7%E9%8A%80+%E9%A6%96%E9%81%B8%E5%9C%8B%E6%9C%89%E5%A4%A7%E8%A1%8C","p":1793993924,"a":1794007140,"t":"瑞銀看好內銀 首選國有大行淨息差穩定 利潤及派息料齊升","su":"많은 대형 본토 은행들이 앞서 3분기 실적을 발표했습니다. UBS의 아시아 금융산업 연구 책임자인 Yan Meizhi는 본토 은행주에 대해 계속해서 낙관적인 입장을 취하고 있습니다. 그는 순이자 마진이 안정적으로 유지되는 동시에 수익 증가로 이익과 배당금이 증가할 것으로 기대하고 있습니다. 주가순자산비율(P⁄B)은 현재 평균 0.6배에서 0.8배로 상승할 것으로 예상된다. 그 중에서도 대형 국책은행을 선호하는 이유는 기업 대출 사업이 빠르게 성장하고 있기 때문이다. 시가총액비율은 0.8배까지 상승할 것으로 예상된다. Yan Meizhi는 올해 은행의 순이자 마진이 안정되었다고 언급했는데, 이는 주로 3년 만기 예금이 많이 만기되어 주요 은행 예금 비용이 감소했기 때문이라고 말했습니다. 내년에는 만기규모가 줄어들겠지만 이자지급비용은 여전히 ​​감소할 것으로 보인다."},{"s":"대만시멘트, 재건축 사업 기회 모색 위해 COP31 참가 - Daily News","so":"工商時報","tm":"11/07 04:00","c":1,"r":"tw","u":"https://www.ctee.com.tw/news/20261107700120-439901","p":1793991600,"a":1794007140,"t":"台泥赴COP31 爭取重建商機- 日報","su":"제31차 유엔기후변화총회(COP31)가 9일 터키 안탈리아에서 개최된다. TCC는 유럽 자회사 CIMPOR 및 터키 자회사 OYAK Cement와 손잡고 실내외 이중 전시장을 마련하고, 유럽에서 대규모 3D 건축 프린팅 장비를 컨퍼런스 현장으로 운송해 현재 터키 지진 피해 주택 재건축에 활용되고 있는 혁신 기술을 선보이고 재건축 사업 기회를 위해 노력할 것이라고 6일 밝혔다. 대만 시멘트가 개발한 시멘트 에너지 저장 시스템..."},{"s":"AI위기는 금융에 새로운 변화를 가져온다》미국 기술주, 법인 직격탄: 중장기적으로 너무 비관하지 말라 - 일간투데이","so":"工商時報","tm":"11/07 04:00","c":1,"r":"tw","u":"https://www.ctee.com.tw/news/20261107700059-439901","p":1793991600,"a":1794007140,"t":"AI風雲起金融新變局》美科技股重災法人：中長線不必太悲觀- 日報","su":"시장은 미국 민주당의 '블루 웨이브'가 불러온 AI 규제 패닉에 계속 빠져들고 있다. 미국과 대만 증시가 '고통받는 형제'가 됐다. 미국 4대 증시가 5일 흑자세로 마감했고, 필라델피아 반도체지수는 하루 기준 역사상 두 번째로 큰 하락폭을 기록했다. 기술주가 가장 큰 타격을 입었고 후이다, 마이크론 등 거대 기업은 하루 만에 1000억 달러 이상의 시장 가치를 잃었다. 법무법인은 장기적으로 봤을 때 여전히 AI가 최고의 투자 대상이라고 지적했다. 적당히 다각화된 레이아웃 외에도 민주당의 정책이 주도하는 산업 기회에도 주목할 수 있습니다."},{"s":"'파괴증명서' 불법 폐기 의혹! 우산터우 저수지 옆에서 파낸 쓰레기, 지독한 냄새…물 사용에 미칠 영향 우려","so":"UDN","tm":"11/07 03:50","c":1,"r":"tw","u":"https://udn.com/news/story/7326/9863020","p":1793991011,"a":1794007140,"t":"疑非法棄置「覆土滅證」！烏山頭水庫旁挖出廢棄物飄刺鼻臭味…環團憂影響用水","su":"환경 단체는 신고를 받고 항공사진을 통해 타이난 우샨터우 저수지 보호 구역 옆 옛 매장지 주변 지역이 불법 폐기물 투기로 의심되어 밤새 굴착기로 은폐된 사실을 발견했습니다. 어제 환경부 남부지구 환경관리센터, 타이난시 환경보호국과 함께 깊이가 약 4m인 6개 유적지를 발굴했습니다. 그 중 4곳에서는 건설폐기물과 장식폐기물이 묻혀 있는 채 발견됐고, 유기휘발성 화합물의 톡 쏘는 화학적 냄새가 났다. 검사를 위해 샘플을 채취하고, 주변 모니터와 협의해 불법 폐기의 출처와 가해자를 추적했다."},{"s":"상장부동산신탁은 인지세가 면제되며 해당 부동산을 2년 동안 보유해야 합니다.","so":"信報網站","tm":"11/07 03:35","c":1,"r":"hk","u":"https://www.hkej.com/dailynews/finnews/article/4560150/%E4%B8%8A%E5%B8%82%E6%88%BF%E8%A8%97%E5%85%8D%E5%8D%B0%E8%8A%B1%E7%A8%85+%E9%A0%88%E6%8C%81%E7%89%A9%E6%A5%AD%E5%85%A9%E5%B9%B4","p":1793990134,"a":1794007140,"t":"上市房託免印花稅 須持物業兩年","su":"금융 서비스국과 재무국은 상장될 부동산 투자 신탁 기금에 대해 인지세 면제를 제공하는 법안을 제안했습니다. 재무국 부국장 Chen Haolian은 금요일(6일) 입법회 금융서비스위원회에서 지역 주거용 부동산 시장에 영향을 미치지 않기 위해 제안된 인지세 면제가 주거용 부동산 양도에 적용되지 않을 것이라고 말했습니다. 남용을 방지하기 위해 REIT는 해당 부동산을 최소 2년 동안 보유해야 하며 최소 2년 동안 증권 거래소에 상장을 유지해야 합니다. 양도방법으로는 부동산을 REIT로 직접 양도하거나 특수목적투자기구에 주식을 양도하는 경우 인지세가 면제됩니다. 주거용 부동산 양도에는 적용되지 않습니다."},{"s":"SpaceXAI는 애리조나에 데이터 센터를 계획하고 있으며 Musk의 회사는 6GW 용량을 보유할 것이라고 주장합니다.","so":"Data Center Dynamics","tm":"11/07 02:36","c":1,"r":"us","u":"https://www.datacenterdynamics.com/en/news/spacexai-data-center-arizona-cochise-county-elon-musk/","p":1793986565,"a":1794007140,"t":"SpaceXAI plans data center in Arizona, Musk's firm claims it will have 6GW capacity","su":"SpaceXAI는 애리조나 주 코치스 카운티에 새로운 데이터 센터 단지를 계획하고 있으며 Elon Musk의 회사는 전체 구축에 6GW의 전력이 필요할 수 있다고 주장합니다. 이 회사는 Tucson에서 동쪽으로 80마일 떨어진 마른 호수인 Willcox Playa 근처에 총 747에이커 규모의 두 부지를 개발하려고 합니다."},{"s":"[체팅펑 | 류다류 | 리우 루안시옹 | 캠비 | 양수청] 니콜라스 체(Nicholas Tse)가 침사추이 롤렉스 플래그십 스토어 오픈에 참석해 캔톤 로드에 수백 명의 팬들이 몰려들었습니다.","so":"香港經濟日報HKET","tm":"11/07 01:05","c":1,"r":"hk","u":"https://inews.hket.com/article/4221466/%E3%80%90%E8%AC%9D%E9%9C%86%E9%8B%92%E3%80%91%E5%B0%96%E6%B2%99%E5%92%80%E5%87%BA%E5%B8%AD%E5%8B%9E%E5%8A%9B%E5%A3%AB%E6%97%97%E8%89%A6%E5%BA%97%E9%96%8B%E5%B9%95%E3%80%80%E6%95%B8%E7%99%BE%E7%B2%89%E7%B5%B2%E8%BF%AB%E7%88%86%E5%BB%A3%E6%9D%B1%E9%81%93","p":1793981151,"a":1794007140,"t":"【謝霆鋒｜大劉｜劉鑾雄｜甘比｜楊受成】謝霆鋒尖沙咀出席勞力士旗艦店開幕 數百粉絲迫爆廣東道"},{"s":"타오시 음식물 쓰레기 처리기 보조금 50kg으로 완화, 보조금 대상에는 야시장, 전통시장 포함","so":"UDN","tm":"11/07 01:00","c":1,"r":"tw","u":"https://udn.com/news/story/7324/9862926","p":1793980800,"a":1794023400,"t":"桃市廚餘機補助放寬至50公斤級 補助對象納夜市、傳統市場","su":"타오위안시 환경보호국은 지난 7월 무게가 100kg 이상인 상업용 음식물 쓰레기 기계에 보조금을 지급하기 시작했습니다. 어제부터 기준이 완화되었습니다. 즉, 무게가 50kg 이상인 모든 음식물 쓰레기 처리 기계에 적용할 수 있다는 것입니다. 이 방식은 신야시장, 전통시장, 특정 상권에 적용 가능하다. 환경질 개선을 위해 신청일도 내년 8월 말로 연장됐다."},{"s":"백악관, 과학기술자문위원회 회의 연기","so":"信報網站","tm":"11/07 00:20","c":1,"r":"hk","u":"https://www.hkej.com/instantnews/international/article/4560587/%E7%99%BD%E5%AE%AE%E6%8E%A8%E9%81%B2%E7%A7%91%E6%8A%80%E9%A1%A7%E5%95%8F%E5%A7%94%E5%93%A1%E6%9C%83%E6%9C%83%E8%AD%B0","p":1793978407,"a":1794007140,"t":"白宮推遲科技顧問委員會會議","su":"미국 에너지부 대변인은 도널드 트럼프 미국 대통령 행정부가 금요일로 예정됐던 백악관 과학기술자문위원회 회의를 연기했다고 밝혔습니다. 위원회 구성원에는 Nvidia CEO Jensen Huang과 Meta 창립자 Mark Zuckerberg가 포함됩니다. 새 의회가 인공지능(AI) 개발을 지연시킬 수 있다는 우려와 AI 인프라 구축을 위한 기업의 막대한 자본 지출이 충분한 수익을 제공하지 못할 것이라는 우려가 커지면서 목요일 기술주가 급락세를 보였습니다. 시장 혼란으로 인해 실리콘 밸리 경영진과 워싱턴 정책 입안자들 사이에서 업계에 대한 우려가 커지고 있습니다."},{"s":"[AI 증시 폭락 + 아시아 증시 블랙프라이데이] 기술주 숨죽이고 나스닥100선물 개장 전 300포인트 가까이 반등, SK하이닉스 ADR 4% 이상 반등 (지속 업데이트)","so":"香港經濟日報HKET","tm":"11/06 22:57","c":1,"r":"hk","u":"https://inews.hket.com/artic 사업부 부장에게 보고합니다."},{"s":"DRAM의 급격한 증가는 휴대폰 가격에 타격을 줍니다. 내년에는 해체자재 비율이 더 늘어날 것이라는 연구결과가 나왔다.","so":"經濟日報","tm":"11/06 18:31","c":1,"r":"tw","u":"https://money.udn.com/money/story/5612/9862412","p":1793957516,"a":1794041640,"t":"DRAM大漲傷手機成本　研調估明年採用拆機料比例增","su":"메모리 가격 상승으로 인해 스마트폰 브랜드의 비용이 크게 상승했습니다. 조사기관 트렌드포스(TrendForce)는 D램 고가 정상화로 '분해재료' 활용이 늘어나고 있다고 밝혔다."},{"s":"전자재료는 공급이 부족합니다. 난야는 고급 소재 비중을 확대해 4분기 매출 증가를 기대하고 있다.","so":"經濟日報","tm":"11/06 18:25","c":1,"r":"tw","u":"https://money.udn.com/money/story/5612/9862392?form=udn_ch2_common3_cate","p":1793957112,"a":1794023400,"t":"電子材料供不應求 南亞擴大高階材料比重、第4季營收看增","su":"난야(1303)는 오늘 4분기 매출과 시장 전망을 발표했다. 회사는 11월과 4분기에도 각종 전자재료 및 캐리어보드 수요 호조, 가격 및 물량 상승 등으로 매출 성장세를 이어갈 것으로 기대하고 있다."},{"s":"윈린448 커뮤니티 대회에서 금메달을 획득한 마을이 발표됐다. 다부(Dabu), 마위안(Mayuan), 산지에(Sanjie)가 우승을 차지해 전국대회에 출전하게 됐다.","so":"UDN","tm":"11/06 18:25","c":1,"r":"tw","u":"https://udn.com/news/story/7326/9862391","p":1793957105,"a":1794023400,"t":"雲林448社區競逐獲金牌農村揭曉 大埔、麻園、三結奪冠將出征全國賽","su":"윈린현 정부는 독특한 특징을 지닌 지역사회 발전을 장려하기 위해 '금메달 농촌 대회'를 시작했습니다. 카운티 내 448개 커뮤니티가 경쟁했습니다. 구켕향의 다부(Dabu), 마위안(Mayuan), 다피산지에(Dapi Sanjie) 등 3개 공동체는 지역 산업을 연결해 지역 활성화를 위한 특별한 여정을 시작하거나 농경지 공간을 활용해 오리논과 생태연못을 조성했습니다. 그들은 금메달을 획득했으며 전국 금메달 농촌 대회에서 윤린을 대표하여 윤린의 농촌 특성을 계속해서 볼 수 있도록 노력할 것입니다."},{"s":"영창달마대회/4분기는 올해 최고치를 기록하고 향후 3년간 두 자릿수 성장을 유지할 것으로 예상된다.","so":"經濟日報","tm":"11/06 18:13","c":1,"r":"tw","u":"https://money.udn.com/money/story/5612/9862365","p":1793956425,"a":1794041640,"t":"榮昌法說會／第4季可望為全年最高峰 未來三年維持雙位數成長","su":"영창(3684)기술이 오늘 기자회견을 열었습니다. Chen Jiarong 회장은 위성 통신 출하의 추진력이 증가했다고 지적했습니다. WiFi 7, 다기능 안테나, 자동차 안테나는 발효되지 않습니다. 올해 4분기 매출이 최대치를 기록할 것으로 예상된다. 연간 매출과 이익은 두 자릿수 성장에 도전할 것입니다."},{"s":"유가변동 심화 대만화학: 고가 원자재 가격으로 인한 이익 훼손 방지를 위해 재고관리 엄격","so":"經濟日報","tm":"11/06 18:00","c":1,"r":"tw","u":"https://money.udn.com/money/story/5612/9862332","p":1793955628,"a":1794041640,"t":"油價波動加劇　台化：嚴控庫存避免高價原料侵蝕利益","su":"이 글은 총 737개의 단어로 구성되어 있습니다. Taiwan Chemical의 Lu Wenjin 총책임자는 유가가 상당히 급격하게 변동하기 때문에 Taiwan Chemical은 시장 변화를 면밀히 모니터링하고 고가의 원자재와 고비용 재고로 인해 이익이 훼손되는 것을 피하기 위해 재고를 통제하려고 노력할 것이라고 말했습니다. 미국 중간선거 기간 동안 국제유가는 큰 폭의 변동을 겪었다. 브렌트유 가격을 예로 들어보겠습니다. 10월 말 배럴당 110달러를 넘던 고점은 선거 불과 며칠 만에 갑자기 95달러에 도달했다가 다시 100달러 안팎까지 올랐다. Formosa Plastics Sibao는 오늘 10월 매출과 운영 전망을 발표했습니다. Lu Wenjin은 포모사의 10월 매출이 9월에 비해 크게 증가했으며, 이는 대부분 가격 차이로 인해 발생했다고 말했습니다. 중동의 긴축 상황으로 인해 원유 가격이 상승하고 석유화학 플라스틱 제품 시장이 활성화되었습니다. 그러나 다운스트림 시장 여건이 약하고 고객이 가격 인상을 거부했으며 매출 성장도 제한적이었습니다."},{"s":"토륨 개척자를 위한 은메달: Emerald Horizon, 2026년 \"올해의 혁신가\"에서 2위 차지","so":"Financial Times","tm":"11/06 17:42","c":1,"r":"world","u":"https://markets.ft.com/data/announce/detail?dockey=600-202611060342DGAP____CORPNEWS_corporate_2429934_en-1","p":1793954520,"a":1793974680,"t":"Silver for the Thorium Pioneer: Emerald Horizon Takes Second Place at “Innovator of the Year” 2026"}]},{"name":"🏭 AI 전력","note":"보유: ACE 코리아AI전력TOP10","breaking":false,"items":[{"s":"우태희 효성중공업 대표, '글로벌품질경영인대상' 수상","so":"아시아경제","tm":"11/06 14:45","c":10,"r":"kr","u":"https://www.asiae.co.kr/article/IT/2026110614453379341","p":1793943934,"a":1793944200,"su":"우태희 효성중공업 대표가 품질경영 성과를 인정받아 한국품질경영학회가 수여하는 &#039;글로벌품질경영인대상&#039;을 ."},{"s":"미국 AI 규제 우려로 투자 신뢰도 높아져: 아시아 기술주, 밸류에이션 압박에 직면 | 증권","so":"中央社 CNA","tm":"11/08 12:09","c":3,"r":"tw","u":"https://www.cna.com.tw/news/afe/202611080016.aspx","p":1794107340,"a":1794109980,"t":"美國AI監管疑慮升高投信：亞洲科技股面臨估值壓力| 證券","su":"미국 중간선거에서 민주당이 대승을 거두면서 시장에서는 AI 구축 규제가 강화될 수 있다는 우려가 커지며 글로벌 기술주 매도압력이 촉발됐다. 모건자산운용은 이번 조정 물결은 AI 시장 서사가 변화하고 있다는 점을 강조하며 그 영향이 미국에서 대만, 한국, 일본 등 아시아 AI 공급망으로 더욱 확산될 수 있으며 아시아 기술주가 새로운 가치평가 압력에 직면할 수 있음을 상기시켰다."},{"s":"미국 중간 선거는 청정 에너지에 대한 전망을 바꾸었고, 대만의 태양광 발전소는 내년에 빛을 보게 될 것입니다.","so":"自由時報","tm":"11/08 11:50","c":2,"r":"tw","u":"https://stock.ltn.com.tw/article/nbk14b7nxbbk","p":1794106200,"a":1794128040,"t":"美期中選舉變天潔淨能源大漲 台太陽能廠明年迎曙光","su":"미국 중간선거 결과가 발표됐고, 민주당이 상하원을 모두 장악하게 됐다. 시장에서는 내년 민주당이 공식 집권한 이후 태양광, 풍력 등 신재생에너지 산업에 대한 투자 환경이 크게 개선될 것으로 기대하고 있다. 미국 청정에너지 주가 급등했다. 11월 6일 대만 주식은 급락했다. 하지만 Yuanjing(6443), United Renewables(3576), Motech(6244), Canghe(6538) 등 국내 태양광 주식은 흑자에서 적자로 전환하는 데 어려움을 겪었다. 위안징과 다논(36)"},{"s":"Fei Ban의 폭락으로 AI 가격 조정 시작 | 시장 포커스 | 증권","so":"經濟日報","tm":"11/08 11:33","c":2,"r":"tw","u":"https://money.udn.com/money/story/5607/9864674?from=edn_newestlist_rank","p":1794105225,"a":1794109980,"t":"費半重挫揭開 AI 重新定價序幕 | 市場焦點 | 證券","su":"미국의 정치적 동향이 기술주의 새로운 진원지가 되었습니다! 시장에서는 민주당이 의회를 장악한 후 AI 규제 강도가 높아져 데이터센터 건립과 기술산업 자본지출에 영향을 미칠 수 있다고 우려하고 있다. 11월 5일 미국 증시는 폭락했습니다. S&P 500 지수는 하루 만에 4.4% 하락했고, 500개 구성종목 중 무려 430개 종목이 흑자로 마감했다. 나스닥 지수는 5.5% 하락했고 필라델피아 반도체 지수는 12.3% 급락했다. 안전자산인 미국 국채가 몰리면서 미국 10년만기 국채수익률이 하루 만에 5bp 하락했다."},{"s":"미국 AI 정책 변수가 중전기산업에 영향을 미칠까? 전문가들은 공장의 두 가지 주요 장점을 지적합니다.","so":"自由財經","tm":"11/07 11:35","c":2,"r":"tw","u":"https://ec.ltn.com.tw/article/breakingnews/5632438","p":1794018906,"a":1794023400,"t":"美國AI政策變數衝擊重電業？專家點出台廠具2大優勢","su":"[린징화 기자/타이베이 취재] 미국 중간선거가 막을 내렸지만 이어진 AI 데이터센터 제한 우려로 글로벌 증시는 폭락할 뻔했다. 이 가운데 대만의 중전기 산업이 미국 수출을 지향하고 있어 주가도 급락했다. 하지만 전문가들은 단기적으로 미국의 정책에 큰 변화가 없을 것으로 보고 있다."},{"s":"Huaxin은 주당 1.78위안을 벌고 있으며 강력한 주문을 받고 있습니다.","so":"UDN","tm":"11/07 03:51","c":2,"r":"tw","u":"https://udn.com/news/story/7252/9862958","p":1793991068,"a":1794007140,"t":"華新每股賺1.78元 訂單強勁","su":"Taipower의 전력망 강화 계획, 반도체 공장 확장, AI 데이터센터 구축 수요가 전선 및 케이블 실적을 견인했습니다. 화신은 어제(6일) \"아직 정점에 도달하지 않았다\"고 낙관적으로 밝혔습니다. 전선 및 케이블 사업의 수주 모멘텀이 강하고, 현재 초고압 케이블 생산 능력이 가득 찼습니다. Taipower의 전력망 건설에 대한 최대 수요는 2029년에서 2030년 사이에 감소할 것으로 예상되며, 이때 수요는 현재 수준보다 훨씬 높아질 것입니다."},{"s":"[미국 증시 현황] 텍사스 민주당이 머스크와 협력할 의향이 있다. AMD는 14% 상승, SpaceX와 Nvidia는 7% 상승(지속 업데이트)","so":"香港經濟日報HKET","tm":"11/07 00:58","c":2,"r":"hk","u":"https://inews.hket.com/article/4218350/%E3%80%90%E7%BE%8E%E8%82%A1%E5%B8%82%E6%B3%81%E3%80%91%E5%BE%B7%E5%B7%9E%E6%B0%91%E4%B8%BB%E9%BB%A8%E9%A1%98%E8%88%87%E9%A6%AC%E6%96%AF%E5%85%8B%E5%90%88%E4%BD%9C%E3%80%80AMD%E6%9B%BE%E5%BD%8814-%E3%80%81SpaceX%E5%8F%8A%E8%8B%B1%E5%81%89%E9%81%94%E6%9B%BE%E5%8D%877-%EF%BC%88%E4%B8%8D%E6%96%B7%E6%9B%B4%E6%96%B0%  깨끗한 전력을 제공할 수 있는 잠재력을 가지고 있습니다. 이제 세계 최초의 상업용 플랜트 개발 경쟁이 시작되었습니다."},{"s":"OpenAI, 첫 번째 110억 달러 자금 조달 완료 CFO: 중간 선거는 IPO 계획에 영향을 미치지 않습니다.","so":"星島頭條","tm":"11/07 13:00","c":1,"r":"hk","u":"https://www.stheadline.com/realtime-finance/3634501/OpenAI%E5%AE%8C%E6%88%90110%E5%84%84%E7%BE%8E%E5%85%83%E9%A6%96%E6%89%B9%E8%9E%8D%E8%B3%87-CFO%E4%B8%AD%E6%9C%9F%E9%81%B8%E8%88%89%E7%84%A1%E5%BD%B1%E9%9F%BFIPO%E8%A8%88%E5%8A%83","p":1794024029,"a":1794041640,"t":"OpenAI完成110億美元首批融資 CFO：中期選舉無影響IPO計劃","su":"Bloomberg는 이 문제에 정통한 소식통을 인용하여 OpenAI가 약 110억 달러에 달하는 새로운 1차 자금 조달을 완료했으며 회사의 최근 가치는 1조 2500억 달러에 달했다고 보도했습니다. 또한 OpenAI 재무 이사 Sarah Friar는 중간 선거가 OpenAI의 IPO 계획을 변경하지 않았다고 말했습니다. 앞으로 몇 주 안에 전체 자금 조달이 완료될 예정입니다. 자금 조달 라운드의 나머지 부분은 앞으로 몇 주 안에 완료될 것으로 예상되며, 총 자금 조달 규모는 결국 최대 200억 달러까지 늘어날 수 있다고 이 문제에 정통한 소식통이 말했습니다. 이전 보고서에서는 목요일 AI 주가가 폭락하기 전 OpenAI의 초기 목표는 1을 추구하는 것이라고 지적했습니다."},{"s":"COP31에서는 글로벌 전기화 목표를 35%로 설정했습니다! IEA는 2035년 기준 충족의 핵심 분석: 전력망 확장 속도를 40% 가속화해야 함","so":"ESG永續台灣","tm":"11/07 12:39","c":1,"r":"tw","u":"https://esg.businesstoday.com.tw/article/category/190807/post/202611050035/COP31%E8%A8%82%E5%85%A8%E7%90%83%E9%9B%BB%E6%B0%A3%E5%8C%9635%EF%BC%85%E7%9B%AE%E6%A8%99%EF%BC%81IEA%E8%A7%A3%E6%9E%902035%E5%B9%B4%E9%81%94%E6%A8%99%E9%97%9C%E9%8D%B5%EF%BC%8C%E9%9B%BB%E7%B6%B2%E6%93%B4%E5%BB%BA%E9%80%9F%E5%BA%A6%E9%A0%88%E5%8A%A0%E5%BF%AB40%EF%BC%85","p":1794022770,"a":1794041640,"t":"COP31訂全球電氣化35％目標！IEA解析2035年達標關鍵，電網擴建速度須加快40％","su":"글로벌 전기화는 COP31의 중요한 논의 주제 중 하나입니다. COP31 의장단은 2035년 전 세계 전화율을 35%로 높이겠다는 목표를 제시했다. 국제에너지기구(IEA)의 '전기화' 특별 보고서는 현행 정책을 따르면 2035년까지 전 세계 전화율이 30% 안팎에 달할 것으로 예상하고 있지만 이는 아직 목표와는 거리가 멀다. 보고서는 또한 에너지 안보, 탄소 감소 및 경제에 대한 전기화의 이점뿐만 아니라 촉진 과정에서 다양한 국가가 직면한 과제를 분석합니다. 본 보고서는 COP31 의장단과 IEA의 파트너십을 통해 터키와 호주의 요청으로 작성되었으며, 글로벌 전기화 개발의 현재 상태, 잠재력 및 정책 권장 사항을 제안합니다."},{"s":"녹색 에너지 발전과 체육 교육을 고려한 Miaoli Zhaonan 중학교 광전자 경기장 개장","so":"自由時報","tm":"11/07 11:52","c":1,"r":"tw","u":"https://news.ltn.com.tw/news/life/breakingnews/5632462","p":1794019927,"a":1794023400,"t":"苗栗照南國中光電球場啟用 兼顧綠能發電與體育教學","su":"Miaoli County Zhaonan 중학교 태양광 경기장이 공식적으로 개장되었습니다. 태양광 경기장은 건축면적은 약 1,203.4㎡, 태양광 설치용량은 261.36kW이다. 캠퍼스 공간이 다양한 기능을 수행할 수 있도록 스포츠 경기장과 재생 에너지 응용 프로그램을 결합합니다. Miaoli 현 치안 Zhong Dongjin은 완벽한 스포츠 시설이 체육 교육 증진을 위한 중요한 기반이라고 말했습니다. 그는 태양광 경기장이 설치된 후 학교의 스포츠 및 훈련 자원이 풍부해지고, 학생들이 운동 기회를 늘리고, 규칙적인 습관을 개발하고, 신체적, 정신적 건강을 증진할 수 있기를 바라고 있습니다. 교육 책임자인 Ye Xinhui는 태양광 발전 경기장은 발전 기능 외에도 녹색 에너지, 에너지 절약 및 탄소 감소 적용을 구현하고 환경 보호 개념을 학습에 통합하는 생활 중심 교육 자료라고 지적했습니다."},{"s":"Lumai는 광학 AI 서버를 테스트하여 데이터 센터 전력을 절감합니다.","so":"ET Datacenters","tm":"11/07 11:34","c":1,"r":"us","u":"https://datacenters.economictimes.indiatimes.com/news/ai-compute-infrastructure/lumai-tests-optical-ai-servers-to-cut-data-center-power/135624664","p":1794018862,"a":1794023400,"t":"Lumai tests optical AI servers to cut data center power","su":"Lumai는 영국 연구소에 Iris Nova 광학 AI 추론 서버를 배포하고 있습니다. 이는 GPU에서 사전 채우기 AI 워크로드를 오프로드하여 데이터 센터 전력 소비를 줄이는 것을 목표로 합니다."},{"s":"祥碩, 樺漢, 전 태담 전망","so":"經濟日報","tm":"11/07 10:00","c":1,"r":"tw","u":"https://money.udn.com/money/story/5612/9864236","p":1794013200,"a":1794093180,"t":"祥碩、樺漢、元太談展望","su":"科技指標廠法說會下周接力登場，祥碩、樺漢、元太將依序於10日、11日及12日舉行，市場聚焦高速傳輸晶片新品進度、工業電腦零組件供需，以及電子紙跨足AI材料的新布局，三家公司對第4季與明年營運看法，將成為掌握科技產業需求的重要風向球。"},{"s":"Vistra: 데이터 센터 전력 수요는 텍사스 그리드에서 벗어나지 않았으며 여전히 주요 병목 현상으로 남아 있습니다.","so":"鉅亨網","tm":"11/07 06:32","c":1,"r":"tw","u":"https://news.cnyes.com/news/id/6651766","p":1794000755,"a":1794007140,"t":"Vistra：資料中心用電需求未轉離德州併網仍是主要瓶頸","su":"Vistra: 데이터 센터 전력 수요는 텍사스에서 벗어나지 않았고 그리드 연결은 여전히 ​​주요 병목 현상입니다. Uanalyze 2026년 11월 7일(Uanalyze/Industrial Data Center Report) ⸺ 미국 발전 회사인 Vistra(VST-US)는 11월 6일 중간 선거 이후 대규모 전력 고객이 텍사스에서 미국 동부의 PJM 전력 시장으로 수요를 이동하는 것을 보지 못했다고 말했습니다. 클라우드 거대 기업과 데이터센터 운영자는 여전히 전력공급 협상을 활발히 진행하고 있다. 프로젝트 진행에 실제로 영향을 미치는 것은 전력망에 연결될 수 있을 때입니다. Vistra 경영진은 3분기 입법 회의에서 텍사스가 여전히 매력적인 시장이라고 언급했습니다. 데이터 센터는 물 사용, 토지 및 세금 부담에 대한 조사를 받고 있으며 이는 텍사스에만 국한되지 않습니다. 고객이 위치를 평가할 때 가장 중요하게 생각하는 것은 전력 확보 속도와 지역 사회 및 정부의 지원 여부입니다. 이 회사는 기존 및 신규 가스 화력 발전소를 포괄하는 텍사스의 대규모 전력 프로젝트를 위해 PJM과 계속해서 협상하고 있습니다. 또한 후속 원자력 구매 계약의 기회에 대해 낙관하고 있지만 서명 일정을 확정하지는 않았습니다."},{"s":"Anthropic의 가치는 7조 8천억으로 줄어들 수도 있고, IPO도 차갑고, 의구심으로 자금조달도 20% 줄여야 한다","so":"信報網站","tm":"11/07 04:38","c":1,"r":"hk","u":"https://www.hkej.com/dailynews/international/article/4560214/Anthropic%E4%BC%B0%E5%80%BC%E6%81%90%E5%89%8A%E8%87%B37.8%E8%90%AC%E5%84%84","p":1793993924,"a":1794007140,"t":"Anthropic估值恐削至7.8萬億 IPO遇冷 受質疑集資應縮兩成","su":"월스트리트저널은 인공지능(AI) 스타트업 앤트로픽(Anthropic)이 당초 기업가치 1조5000억 달러(약 11조7000억 홍콩달러)로 기업을 공개하고 최대 1000억 달러를 조달할 계획이었다고 보도했다. 그런데 최근 AI 관련 주식이 매도됐다. 매각 후 일부 주요 투자자들은 평가 목표에 대해 의문을 제기했습니다. 일부에서는 가치 평가액이 미화 1조 달러(약 HK$ 7조 8000억)에 가까워야 한다고 믿었고, 다른 투자자들은 조달 자금 규모가 약 800억 달러(약 HK$ 6240억)로 20% 감소해야 한다고 믿었습니다. 결정을 내리기 전에 10월에 결과를 기다려 보십시오. Anthropic은 미국 추수감사절 일주일 전에 상장할 계획입니다."},{"s":"'27조' 원전 수출 잭팟 뒤집은 '1조' 공사비…비상등 켜진 '팀코리아' - 머니투데이","so":"머니투데이","tm":"11/07 04:30","c":1,"r":"kr","u":"https://www.mt.co.kr/amp/estate/2026/11/07/2026110610091294957","p":1793993400,"a":1794059580,"su":"체코 두코바니 원전 수주로 유럽 원전 시장 진출의 교두보를 마련한 한국 원전업계가 뜻 밖의 암초를 만났다. 사업을 함께 준비해 온 한국수력원자원(한수원)과 대우건설·두산에너빌리티 컨소시엄이 공사비와 위험 분담 문제를 놓고 충돌하면서 '팀코리아'가 해체 위기에 내몰렸다."},{"s":"Wistron과 Wiwynn의 10월 매출은 같은 기간 동안 최고치를 기록했습니다.","so":"UDN","tm":"11/07 03:51","c":1,"r":"tw","u":"https://udn.com/news/story/7252/9862954","p":1793991078,"a":1794007140,"t":"緯創、緯穎10月營收創同期新高","su":"주요 파운드리 제조사인 위스트론(Wistron)과 위윙(Wiwing)은 6일 10월 연결 매출을 동시에 발표해, 두 회사 모두 같은 기간 최고치를 경신했고, 한 달 역사상 두 번째로 높은 실적을 기록했다. 법률 관계자는 Wistron과 Wiwynn의 4분기 합산 매출이 AI 서버 출하의 지속적인 지원으로 계속 이익을 얻었으며 새로운 단일 분기 최고치를 설정하여 연간 실적을 최고점에 도전할 수 있다고 낙관하고 있다고 지적했습니다."},{"s":"야마토, 선제공격하고 신화목표주가 하향","so":"UDN","tm":"11/07 03:32","c":1,"r":"tw","u":"https://udn.com/news/story/7252/9862918","p":1793989931,"a":1794007140,"t":"大和開第一槍 調降信驊目標價","su":"대만 주식은 어제(6일) 왕신화 주가가 한계점까지 떨어지는 등 큰 매도압력을 받았다. 신화통신이 3분기 재무보고서를 발표한 후 다이와캐피털은 첫 번째 시도에 나서 목표주가를 26,660위안에서 21,800위안으로 18.2% 하락한 수준으로 낮췄다. '매수' 등급을 유지했지만 AI 데이터센터 자본 지출의 미래에 대한 시장의 우려가 커지고 있음을 반영했습니다."},{"s":"에어비앤비, 세 번째로 매출 전망 상향 조정","so":"信報網站","tm":"11/07 03:26","c":1,"r":"hk","u":"https://www.hkej.com/dailynews/international/article/4560216/Airbnb%E7%AC%AC%E4%B8%89%E5%BA%A6%E4%B8%8A%E8%AA%BF%E6%94%B6%E5%85%A5%E9%A0%90%E6%B8%AC","p":1793989586,"a":1794007140,"t":"Airbnb第三度上調收入預測","su":"단기 숙소 임대 플랫폼 에어비앤비(Airbnb)의 3분기 매출은 전년 동기 대비 19% 증가해 3년 만에 최대 증가율인 48억7000만 달러를 기록해 시장 기대치인 47억5000만 달러를 넘어섰다. 회사는 세 번째로 연간 매출 전망을 상향 조정하고 최대 120억 달러에 달하는 새로운 자사주 매입 계획을 발표했습니다. 이에 따라 미국 금요일 오전에 주가는 8.6% 반등한 미화 184,825달러를 기록했습니다. 지난 분기에 38% 더 많은 수익을 올렸고 새로운 자사주 매입을 시작했습니다. 강력한 여행 수요와 결제 지연, 보다 유연한 취소 정책 등 지난 해 도입된 기타 상품 기능 덕분에 에어비앤비의 총 주문 금액은 지난 분기에 21% 증가한 27건이 되었습니다."},{"s":"캐나다는 그리드 산림 채굴에 대한 투자를 늘릴 계획입니다","so":"信報網站","tm":"11/07 03:26","c":1,"r":"hk","u":"https://www.hkej.com/dailynews/international/article/4560215/%E5%8A%A0%E6%8B%BF%E5%A4%A7%E6%93%AC%E5%A2%9E%E6%8A%95%E8%B3%87%E9%9B%BB%E7%B6%B2%E6%9E%97%E6%A5%AD%E6%8E%A1%E7%A4%A6","p":1793989586,"a":1794007140,"t":"加拿大擬增投資電網林業採礦","su":"프랑수아-필립 샴페인 캐나다 재무장관(사진)은 5일(현지시간) 예산안을 발표해 투자 슈퍼사이클을 시작하고 유가 상승으로 인한 세금 인상을 일부 활용해 경제적 자립을 강화하고 미국에 대한 의존도를 낮추겠다는 계획을 밝혔다. 경제적 독립을 강화하고 미국에 대한 의존도를 줄입니다. 예산에 따르면 캐나다 정부는 전력망, 원자력 발전소, 광업 및 임업에 수십억 달러를 투자하는 동시에 일부 기업가와 소규모 회사 투자에 대해 양도소득세 면제를 제공할 계획입니다. 캐나다 정부는 이전에 \"생산성 초과 공제\"를 발표했습니다."},{"s":"미국산 강철로 더욱 강력한 그리드 구축","so":"POWER Magazine","tm":"11/07 03:25","c":1,"r":"us","u":"https://www.powermag.com/white-papers/building-a-stronger-grid-with-american-made-steel/","p":1793989520,"a":1794007140,"t":"Building a Stronger Grid with American-Made Steel","su":"미국 송전선의 약 70%는 25년 이상 된 것입니다. 이제 공공 시설에서는 데이터 센터, 첨단 제조 및 운송 전기화를 위한 새로운 용량을 구축하는 동시에 노후된 자산을 교체하고 있습니다. 강철 전송 및 배전 폴은 목재보다 더 긴 서비스 수명, 더 큰 내구성 및 더 낮은 유지 관리 요구 사항을 제공할 수 있습니다."},{"s":"Formosa Plastics는 4분기 실적이 호조를 보일 것으로 예상합니다. Formosa Plastics, Nanya의 매출은 성장할 것으로 예상됩니다.","so":"UDN","tm":"11/07 02:53","c":1,"r":"tw","u":"https://udn.com/news/story/7252/9862950","p":1793987607,"a":1794007140,"t":"台塑看旺第4季營運 台塑、南亞營收可望成長","su":"포모사플라스틱그룹의 주요 4개사가 어제(6일) 11월과 4분기 영업전망을 발표했다. Formosa Plastics는 4분기가 일부 제품의 최고 수요 시즌을 맞이할 것이며 매출도 증가할 것으로 예상하고 있습니다. 난야는 전자재료 모멘텀에 대해 계속 낙관하고 있으며, 11월과 4분기에도 매출은 계속 증가할 것으로 예상된다. Formosa Plastics는 정제 스프레드가 계속해서 높아질 것으로 예측합니다. 대만화학은 국제유가 하락으로 단기 재고가격 하락 리스크가 발생했지만, 방향족 탄화수소 제품은 여전히 ​​스프레드를 유지할 것으로 예상되며, 변화에 대응하기 위해 신중하게 재고를 규제할 것이라고 강조했다."},{"s":"구조적 장점, 중국과 미국의 대형 모델 간 격차 축소 | 홍콩경제신문","so":"香港經濟日報HKET","tm":"11/07 01:28","c":1,"r":"hk","u":"https://invest.hket.com/article/4221405/","p":1793982480,"a":1794007140,"t":"結構性優勢 中美大模型差距收窄|香港經濟日報"},{"s":"Morgan Asset Management: 아시아 태평양 하드웨어 가치는 4년 만에 최저 수준이며 중국, 일본, 대만 및 한국의 장기적인 기회에 대해 낙관적입니다 | 홍콩경제신문","so":"香港經濟日報HKET","tm":"11/07 01:28","c":1,"r":"hk","u":"https://invest.hket.com/article/4221404/","p":1793982480,"a":1794007140,"t":"摩根資管：亞太硬件估值4年低 看好中日台韓長綫機會|香港經濟日報"},{"s":"회사 생일 축하합니다/Zhitong 지퍼 산업은 꾸준한 변화를 겪고 있습니다","so":"經濟日報","tm":"11/07 01:18","c":1,"r":"tw","u":"https://money.udn.com/money/story/5612/9862582","p":1793981926,"a":1794007140,"t":"企業生日快樂／智通拉鍊業轉型 穩步向上","su":"Zhitong은 올해 창립 48주년을 맞이했습니다. 원래 지퍼 사업에서 현재는 소프트웨어 및 정보통신 서비스에 주력하고 있습니다. 그 핵심 인물 중 하나가 다름 아닌 차이쿤황 단장이다. Zhitong의 향후 운영 방향과 관련하여 Cai Huanghuang은 회사가 정보 통신 서비스 분야에서 Zhitong의 운영을 계속 확장하고 Zhitong의 미래 운영 역량을 위한 성장을 위한 탄탄한 기반을 마련할 것으로 기대합니다."},{"s":"Shuotian Q3 EPS는 8.06위안으로 급등했습니다.","so":"UDN","tm":"11/07 01:03","c":1,"r":"tw","u":"https://udn.com/news/story/7252/9862658","p":1793981018,"a":1794059580,"t":"碩天Q3 EPS衝上8.06元","su":"무정전전원공급장치(UPS) 브랜드 제조사 Shuotian(3617)은 올해 3분기 세후 순이익이 7억 5,800만 위안으로 분기 대비 15%, 연간 증가율 14.6%로 단일 분기 최고치를 기록했다고 어제(6) 밝혔다. 세후 주당 순이익(EPS)은 8.06위안이었습니다. 올해 첫 3분기 세후 누적 순이익은 18억 500만 위안으로 연간 증가율 65%로 지난해 전체 연도를 능가했으며 주당 세후 순이익은 19.18위안이었다."},{"s":"상업 수요가 주도하는 경우: 새로운 부하 시대를 위한 전력망 계획 재고","so":"POWER Magazine","tm":"11/07 00:48","c":1,"r":"us","u":"https://www.powermag.com/when-commercial-demand-takes-the-lead-rethinking-grid-planning-for-a-new-load-era/","p":1793980100,"a":1794007140,"t":"When Commercial Demand Takes the Lead: Rethinking Grid Planning for a New Load Era","su":"수십 년 동안 전력회사는 인구 증가, 경제 활동, 날씨 및 환경 간의 상대적으로 예측 가능한 관계를 계획해 왔습니다."},{"s":"아일랜드의 데이터 센터에 에너지 탄력성에 대한 새로운 접근 방식이 필요한 이유","so":"Data Center Dynamics","tm":"11/07 00:30","c":1,"r":"us","u":"https://www.datacenterdynamics.com/en/opinions/why-irelands-data-centers-need-a-new-approach-to-energy-resilience/","p":1793979055,"a":1794023400,"t":"Why Ireland’s data centers need a new approach to energy resilience","su":"데이터 센터와 신기술 부하는 2024년 아일랜드 전력 수요의 약 24%를 차지했습니다. 이 비율은 2032년까지 30%에 이를 것으로 예상됩니다. 수요가 계속 증가함에 따라 데이터 센터와 전력 시스템 간의 관계가 변화하고 있습니다."},{"s":"주요 태양광 발전, 에너지 저장 회사가 전주 거래로 합병","so":"POWER Magazine","tm":"11/07 00:13","c":1,"r":"us","u":"https://www.powermag.com/major-solar-power-energy-storage-companies-merge-in-all-stock-deal/","p":1793978000,"a":1794007140,"t":"Major Solar Power, Energy Storage Companies Merge in All-Stock Deal","su":"유틸리티 규모의 태양광을 위한 구조적 시스템 균형(SBOS) 솔루션 제공업체인 ARRAY Technologies와 공급업체인 Shoals Technologies Group"},{"s":"DTE Energy는 데이터 센터 수요를 언급하며 5개년 유틸리티 투자 계획을 440억 달러로 늘립니다.","so":"Data Center Dynamics","tm":"11/06 23:51","c":1,"r":"us","u":"https://www.datacenterdynamics.com/en/news/dte-energy-ups-five-year-utility-investment-plan-to-44bn-cites-data-center-demand/","p":1793976702,"a":1794023400,"t":"DTE Energy ups five-year utility investment plan to $44bn, cites data center demand","su":"미시간 전력회사인 DTE Energy는 데이터 센터 수요가 중요한 요인이라는 점을 이유로 5개년 전력회사 투자 계획을 약 100억 달러에서 약 440억 달러로 늘렸습니다. 전력회사는 3분기 실적 발표에서 이러한 증가세를 보고했습니다."},{"s":"디지털 애플리케이션과 AI가 발전소 및 차량의 \"시장 내 가용성\"을 향상시키는 방법","so":"POWER Magazine","tm":"11/06 22:25","c":1,"r":"us","u":"https://www.powermag.com/webinars/how-digital-applications-and-ai-can-improve-the-in-market-availability-of-power-generating-stations-and-fleets/","p":1793971521,"a":1793974680,"t":"How Digital Applications and AI can Improve the “In-Market Availability” of Power Generating Stations and Fleets"},{"s":"Rongchang: 캘리포니아와 텍사스의 Netcom 인프라 시장을 목표로 IoT 및 기타 스마트 애플리케이션에 대해 낙관적","so":"經濟日報","tm":"11/06 21:45","c":1,"r":"tw","u":"https://money.udn.com/money/story/5612/9862721","p":1793969140,"a":1793974680,"t":"榮昌：看好IoT等智能應用　攻加州、德州網通基建市場","su":"Rongchang Technology의 Hong Jianwen 총책임자는 오늘 미국 민주당이 중간 선거에서 승리했으며 시장은 AI 데이터 센터 건설 지연이 대만의 공급망에 영향을 미칠 것이라고 우려했지만 사물 인터넷(IOT)은..."},{"s":"Cathay Financial Holdings는 수백 개의 공급업체를 모아 새로운 친환경 및 지속 가능한 가치를 창출합니다.","so":"UDN","tm":"11/06 21:10","c":1,"r":"tw","u":"https://udn.com/news/story/7252/9862683","p":1793967045,"a":1793974680,"t":"國泰金控匯聚百家供應商力量 共創綠色永續新價值","su":"Cathay Financial Holdings(2882)는 지속 가능성에 지속적으로 영향력을 행사하고 공급업체와 협력하여 녹색 공급망의 변화를 심화하고 있습니다. 지난 6일 '2026 캐세이파이낸셜홀딩스 지속가능 공급업체 컨퍼런스'를 개최했다. \"지속 가능성과 미래를 함께 공유\"라는 주제로 102개의 공급업체 파트너가 참여하여 녹색 변혁 사례를 교환하고 지속 가능한 개발을 공동으로 촉진할 수 있는 능력을 보여줄 것을 요청했습니다. 공급망의 지속 가능한 탄력성을 더욱 강화하기 위해 캐세이퍼시픽 홀딩스는 2027년에 공급업체 설문지를 포괄적으로 최적화하고, 환경 관리, 정보 보안, 인권 등 지속 가능한 위험 관리를 심화하고, 공급업체가 보다 완전한 평가 및 코칭 메커니즘을 통해 지속 가능한 관리 역량을 향상시키고 녹색 공급망의 영향력을 확대하도록 유도할 것으로 기대합니다."},{"s":"Aishanlin, 약 NT$66억 투자로 'Xindianxi' 공공 사무실 개조 프로젝트 수주","so":"UDN","tm":"11/06 20:11","c":1,"r":"tw","u":"https://udn.com/news/story/7252/9862612","p":1793963498,"a":1793974680,"t":"愛山林奪「新店曦」公辦都更案 預計投入66億元","su":"아이산린(2540)은 '신뎬시(Xindianxi)' 관공서 도시재생사업 최우수 지원자로 선정됐다고 6일 밝혔다. 프로젝트 부지면적은 약 2,408.24㎡이며, 투자액은 66억 위안에 달한다. 주거용 건물 2채와 법원 건물 1채를 지을 계획이다."},{"s":"Xinlizi의 매출은 10월에 22개월 만에 최고치를 기록했으며 HPE와 협력하여 새로운 시스템을 출시하고 컴퓨팅 파워 센터 구축 계획을 세웠습니다.","so":"UDN","tm":"11/06 20:10","c":1,"r":"tw","u":"https://udn.com/news/story/7252/9862611","p":1793963420,"a":1794023400,"t":"昕力資營收／10月創22個月新高 攜手 HPE 推新機、規劃建置算力中心","su":"정보 서비스 공장인 Xinli Information(7781)은 10월 연결 매출이 1억 500만 위안으로 22개월 만에 월간 최고치를 기록했으며, 연간 증가율은 50.39%, 월간 증가율은 47.03%라고 발표했습니다. Xinli는 또한 자체 개발한 엔터프라이즈급 Agentic AI 플랫폼 OrientAI를 사용하여 HPE의 엔터프라이즈급 AI 인프라와 협력하여 온프레미스 \"AI 개발 올인원 머신\"을 출시할 예정이며 AI 운영 컴퓨팅 센터(AIDC) 구축에 투자하여 재무, 의료, 제조 및 정부 부서에 컴퓨팅 성능, 애플리케이션 및 거버넌스를 통합하는 주권 AI \"지능형 컴퓨팅\" 서비스 솔루션을 제공할 계획이라고 발표했습니다."},{"s":"Phison Group의 법률 회의 / 상품 구매는 내년 이후 다시 뜨거워 질 것이며 본토 시장에 대해 낙관적이며 AI 수익은 65 %를 차지할 것입니다","so":"UDN","tm":"11/06 19:39","c":1,"r":"tw","u":"https://udn.com/news/story/7240/9862561","p":1793961584,"a":1794023400,"t":"群聯法說會／明年年後拉貨再升溫、看好大陸市場 AI 營收占比衝65%","su":"낸드플래시 제어IC 대표 제조사 파이슨(8299)이 6일 기자간담회를 열었다. 판젠청(Pan Jiancheng) CEO는 엔터프라이즈급 스토리지와 AI 애플리케이션에 대한 수요가 강해 내년 설 이후 출하 모멘텀이 다시 뜨거워질 것으로 예상된다고 말했다. 특히 중국 본토 시장에 대해 낙관적이며, Phison의 AI 관련 사업 매출 비중은 3분기 57%에서 10월 65%로 상승했습니다."},{"s":"AI 데이터 센터로 원자력 에너지 부흥 주도, 2029년까지 500억 달러 투자","so":"ET Datacenters","tm":"11/06 18:50","c":1,"r":"us","u":"https://datacenters.economictimes.indiatimes.com/news/energy-cooling-sustainability/ai-data-centers-drive-nuclear-energy-revival-50-billion-investment-by-2029/135572260","p":1793958630,"a":1793974680,"t":"AI data centers drive nuclear energy revival, $50 billion investment by 2029","su":"AI 데이터 센터의 긴급한 전력 수요로 인해 원자력 에너지 부문이 활성화되고 있으며, 새로운 프로젝트 지출은 2029년까지 약 500억 달러에 이를 것으로 추산됩니다. 이러한 성장에는 소형 모듈식 원자로에 대한 상당한 투자와 북미 전역의 기존 발전소 개조가 포함됩니다."},{"s":"[표] 주간 거래소 기관 순매수도 상위종목","so":"연합뉴스","tm":"11/06 18:20","c":1,"r":"kr","u":"https://www.yna.co.kr/view/AKR20261106173100008","p":1793956829,"a":1793974680,"su":"(2026-11-02~2026-11-06)(단위:억원, 만주)"},{"s":"Phison Financial Report/Q3 EPS 138위안, 3개 재무 지표 모두 역사상 같은 기간 사상 최고치를 기록","so":"UDN","tm":"11/06 18:17","c":1,"r":"tw","u":"https://udn.com/news/story/7252/9862372","p":1793956650,"a":1794023400,"t":"群聯財報／第3季 EPS 138元 三項財務指標均刷歷史同期新高","su":"낸드 컨트롤칩과 AI컴퓨팅 스토리지 솔루션 분야 선두업체 파이슨일렉트로닉스(8299)가 6일 2026년 3분기 영업실적을 발표했다. AI 인프라 및 엔터프라이즈급 스토리지에 대한 수요의 지속적인 증가에 힘입어 3분기 연결 영업 실적은 매출 NT$860억7천6백만 달러, 영업 총 이익 NT$513억8천7백만 달러, 세후 주당 순이익(EPS)은 NT$138를 기록했습니다. 세 가지 재무 지표 모두 역사상 같은 기간 동안 새로운 최고치를 기록했으며, 이는 Phison이 Phison 3.0의 구체적인 전략적 변화 결과를 홍보하고 있음을 보여줍니다."},{"s":"Shixin Fahui 회의/1~3분기 누적 이익 전년 동기 대비 50% 이상 증가, EPS 75.94위안","so":"UDN","tm":"11/06 18:12","c":1,"r":"tw","u":"https://udn.com/news/story/7252/9862358","p":1793956343,"a":1794023400,"t":"世芯法說會／累計前三季獲利年增逾五成 EPS 75.94元","su":"석신(3661)은 6일 기자간담회를 열고 3분기 주당 순이익이 37.7위안으로 단일분기 이익의 두 배 가까이 됐다고 밝혔다. 1~3분기 누적 이익은 전년 동기 대비 50% 이상 증가했으며, 주당 순이익은 75.94위안을 기록했습니다."},{"s":"효성重 노조 파업 ‘시끌’…임금 못 올려주는 속사정 있나 [재계톡톡]","so":"매일경제","tm":"11/06 16:39","c":1,"r":"kr","u":"https://www.mk.co.kr/news/business/12200569","p":1793950791,"a":1793955540,"su":"효성중공업 사무기술직 노조가 출범 이후 첫 파업에 돌입하며 재계가 시끌시끌하다. 업계에 따르면, 효성중공업 사무기술직 노조는 11월 4일 오전 0시부터 72시간 전면파업을 진행했다. 노조는 앞서 10월 23일 회사와의 임금·단체협약 교섭 결렬을 선언하고 노동위원회에 조정을 신청했다. 노조는 연간 기본급 10% 인상과 성과급 지급 기준 마련, 직군 간 복리후생 격차 완화 등을 요구해왔다. 전력 인프라 호황으로 실적이 날개를 단 만큼 보상을 대폭 늘려야 한다는 입장이다."},{"s":"교토의 본래 의도를 계승하고 아시아의 비전을 정립하다: 2026 아시아 컬러 컨퍼런스가 푸본 미술관에서 성대하게 첫 선을 보였습니다. 10개국 AIC 회장 세 명과 유력 인사들이 타이페이에 모였습니다 | 지역 하이라이트","so":"中央社好生活","tm":"11/06 16:31","c":1,"r":"tw","u":"https://howlife.cna.com.tw/local/20261106s003.aspx","p":1793950260,"a":1793955540,"t":"傳承京都初衷、擘劃亞洲願景： 2026亞洲色彩會議於富邦美術館盛大登場三位AIC主席與十國色彩巨擘齊聚台北| 地方亮點","su":"아시아 색채과학계의 연례행사인 아시아색채협회컨퍼런스 2026이 오늘(6일) 타이베이 현대미술의 랜드마크인 푸본미술관 메이관에서 성대하게 개막됐다. 유럽, 미국, 아시아 10개 국가 및 지역의 최고 컬러 과학자 및 종사자 총 70명이 한 자리에 모였습니다. 이 가운데 이번 행사에는 국제색채연구소(AIC) 전직 회장 3명이 직접 참석해 색과학과 시각예술에 관한 3일간의 대화를 공동으로 진행했다."},{"s":"무료강의》코어4를 TSMC에 팔면 문제가 해결될 수 있을까? 대만은 먼저 에너지 장부를 확산시켜야 한다","so":"自由評論網","tm":"11/06 16:00","c":1,"r":"tw","u":"https://talk.ltn.com.tw/article/breakingnews/5624307","p":1793948400,"a":1793955540,"t":"自由開講》核四賣給台積電就能解困？台灣需要先攤開能源帳本","su":"◎ 린런빈 TSMC의 전력수요가 계속해서 주목받고 있다. Taipower는 여전히 손실이 누적되어 있으며 AI 산업에도 안정적인 저탄소 전력이 필요합니다. 최근 Taipower의 금융 및 산업 전력 문제를 동시에 해결하기 위해 Core 4를 TSMC에 판매하고 다른 발전소 부지를 통합하여 녹색 전력 산업 클러스터를 개발하자는 의견이 나왔습니다. 일부 사람들은 Taiwan Power의 금융 및 산업 전력 문제를 동시에 해결하기 위해 Core 4를 TSMC에 판매하고 다른 발전소 부지를 통합하여 녹색 전력 산업 클러스터를 개발할 것을 제안했습니다. 사진은 4차 원전 모습. (자료사진) 대규모 전력이용자가 전력공급 및 관련 인프라 투자에 좀 더 직접적으로 참여할 수 있을지는 논의해볼 만하다. 그러나 에너지 투자에 대한 기업의 참여와 Core IV를 특정 기업에 판매해야 하는지 여부는 서로 다른 문제입니다. 원자력 4호기는 즉시 생산에 투입될 수 있는 기성 발전소가 아니며, 자산을 매각해도 Taipower의 재정적 압박이 자동으로 완화되지는 않습니다. 실제로 테스트해야 할 것은 자산 가치, 전원 공급 장치 효율성, 프로젝트 비용 및 공적 책임이 에너지 원장에 대한 완전한 검사를 견딜 수 있는지 여부입니다."},{"s":"[거래소 외국인] 삼성전자· SK하이닉스 대거 팔고 NAVER·LS ELECTRIC 담았다","so":"핀포인트뉴스","tm":"11/06 15:57","c":1,"r":"kr","u":"https://www.pinpointnews.co.kr/news/articleView.html?idxno=501966","p":1793948223,"a":1794023400,"su":"외국인 투자자들이 6일 유가증권시장에서 SK하이닉스와 삼성전자 등 반도체 대형주를 대거 순매도한 반면 NAVER와 LS ELECTRIC, 한미반도체 등은 순매수한 것으로 나타났다.인공지능(AI) 반도체와 전력 인프라, 전자부품 등 성장 산업 관련 종목을 중심으로 매수세가 유입됐지만, 시가총액 상위 반도체주와 금융·자동차·배터리 종목에서는 차익실현 움직임이 두드러졌다.한국거래소에 따르면 이날 외국인 순매수 상위 종목에는 NAVER가 가장 먼저 이름을 올렸다. 이어 LS ELECTRIC, 한미반도체, 대덕전자, 두산, 이수페타시스 순으"},{"s":"그리드에 연결되는 재생에너지 확장카드 그리드 용량 연간 60% 증가","so":"鉅亨網","tm":"11/06 15:00","c":1,"r":"tw","u":"https://news.cnyes.com/news/id/6650048","p":1793944806,"a":1793955540,"t":"再生能源擴張卡電網待併網容量一年增六成","su":"그리드에 연결될 재생 에너지 확장 카드 그리드 용량은 1년 만에 60% 증가했습니다. Uanalyze 2026년 11월 6일(Uanalyze/산업 데이터 센터 보고서) ⸺ 재생 에너지원 건설은 전 세계적으로 계속 증가하고 있지만 전력 그리드는 새로운 프로젝트가 온라인에 등장하는 데 병목 현상이 되었습니다. 국제에너지기구(IEA)의 최신 보고서에 따르면 전 세계적으로 그리드에 연결되기를 기다리는 재생에너지 프로젝트 규모가 지난 한 해 동안 60% 증가했는데, 이는 같은 기간 실제 그리드에 연결된 풍력 및 태양광 발전량의 4배에 해당한다. IEA는 2026년부터 2031년까지 전 세계 신재생에너지 설치 용량이 4,800GW에 가까울 것으로 추산하지만, 전력망 제약으로 인해 선진국의 성장이 둔화될 것으로 예상된다. 2031년까지 유럽의 연간 신규 생산능력은 대략 2025년 수준으로 유지될 것으로 예상된다."},{"s":"정유·석화 NO…AI 전력서 ‘노다지’ 캔다 [CEO 라운지]","so":"mkbn.mk.co.kr","tm":"11/06 14:55","c":1,"r":"kr","u":"https://mkbn.mk.co.kr/news/business/12200441","p":1793944510,"a":1793955540},{"s":"Macquarie는 호주가 미국 데이터 센터로부터 이익을 얻고 있다고 보고 있습니다.","so":"Bloomberg.com","tm":"11/06 14:26","c":1,"r":"us","u":"https://www.bloomberg.com/news/articles/2026-11-06/macquarie-sees-australia-gaining-from-us-data-center-woes","p":1793942760,"a":1793945100,"t":"Macquarie Sees Australia Gaining From US Data Center Woes"},{"s":"위조약 사지 마시고, 환경약품 안심하고 구매하세요! 환경부, 부처간 위원회, 전자상거래 플랫폼과 손잡고 공동방역 강화 | 로하스 인텔리전스","so":"中央社好生活","tm":"11/06 14:10","c":1,"r":"tw","u":"https://howlife.cna.com.tw/life/20261106s001.aspx","p":1793941811,"a":1793943180,"t":"偽藥不買、環境用藥安心購！環境部攜手跨部會及電商平臺強化聯防| 樂活情報","su":"환경부는 승인되지 않은 환경의약품의 시장 진입을 막기 위해 오늘(5일) '위조의약품을 사지 말고 환경의약품을 안심하고 구매하세요' 기자간담회를 열고 디지털진흥부 디지털산업진흥원 및 쇼피, 쿨펭, 피홈 등 유명 전자상거래 플랫폼과 손잡고 공동 협력을 발표했다. 이번에는 '엄격한 통제', '민관 협력', '위조품 식별 및 사기 방지', '국가 신고'라는 4가지 핵심 우선순위에 중점을 두고 있습니다. 원산지 관리, 온라인 검수, 소비자 교육을 통해 정부, 업계, 국민의 힘을 모아 중국인민의 건강과 생활환경의 안전을 공동으로 보호합니다."},{"s":"코스피 8% 급락 후 5000선 횡보…삼전 -5%·하닉 -9% [코주부]","so":"서울경제","tm":"11/06 14:07","c":1,"r":"kr","u":"https://www.sedaily.com/article/20111154","p":1793941666,"a":1793943180,"su":"개장 직후 8% 급락했던 코스피가 5000포인트 회복 후 횡보하고 있다. 기관과 연기금 매수세가 유입되고 있고 정부가 변동성 확대에 대응하기 위한 방안들을 내놓은 영향으로 관측된다. 다만 외국인들은 여전히 1조 원이 넘는 주식을 팔아치우는 등 비우호적인 수급 상황이 한동안 이어질 것으로 전망되고 있다. 6일 한국거래소에 따르면 오후 2시 기준 코스피는 전 거래일 대비 264.29포인트(4.91%) 내린 5118.73포인트에서 거래되고 있다."}]},{"name":"🤖 로봇","note":"","breaking":false,"items":[{"s":"Liu Siming: 자본 재배치, 과학 기술 소비주 반등이 예상됩니다 - 20261106 - 전문가 의견 Liu Siming","so":"明報財經網","tm":"11/06 05:31","c":5,"r":"hk","u":"https://finance.mingpao.com/fin/columnist1463481131770/20261106/1793899502173/%E5%8A%89%E6%80%9D%E6%98%8E-%E8%B3%87%E9%87%91%E9%87%8D%E6%96%B0%E9%83%A8%E7%BD%B2-%E7%A7%91%E7%B6%B2%E6%B6%88%E8%B2%BB%E8%82%A1%E5%80%99%E5%9B%9E%E8%AA%BF%E5%90%B8%E7%B4%8D","p":1793910718,"a":1793943180,"t":"劉思明：資金重新部署 科網消費股候回調吸納 - 20261106 - 專家觀點 劉思明"},{"s":"Innodisk 재무 보고서/AI 서버는 3분기 이익을 13배 이상 늘렸고 EPS는 93.09위안이라는 새로운 최고치를 기록했습니다.","so":"UDN","tm":"11/06 19:54","c":4,"r":"tw","u":"https://udn.com/news/story/7252/9862585","p":1793962476,"a":1793974680,"t":"宜鼎財報／AI 伺服器推升第3季獲利年增逾13倍、EPS 93.09元 再創新高","su":"메모리 모듈 제조사 이노디스크(5289)가 6일 3분기 재무보고서를 발표했다. AI 서버가 주도하는 고급 메모리 및 스토리지 수요에 힘입어 해당 분기 세후 순이익은 90억 6천만 위안으로 연간 1,310.7% 증가했습니다. 주당 순이익은 93.09위안으로 영업 최고치를 경신했습니다. 회사 측은 그룹 AI 관련 애플리케이션 매출이 40% 이상을 차지하며 글로벌 클라우드 서비스 제공업체(CSP), AI 서버 공급망, 휴머노이드 로봇 고객사를 성공적으로 확대했다고 밝혔다. 고급 컴퓨팅 비즈니스 기회를 포착하기 위해 AI 인프라와 엣지 AI 시스템의 이중 트랙 레이아웃을 이어갈 것입니다."},{"s":"신화통신, 세계 최초의 AI 생체공학 로봇 앵커 출시, 장이모우가 이미지 디자인","so":"星島頭條","tm":"11/06 16:39","c":4,"r":"hk","u":"https://www.stheadline.com/realtime-china/3634227/%E6%96%B0%E8%8F%AF%E7%A4%BE%E6%8E%A8%E5%85%A8%E7%90%83%E9%A6%96%E5%80%8BAI%E4%BB%BF%E7%94%9F%E6%A9% t":"Pakistan-built robots serve taste of future to Karachi diners"},{"s":"경제사설/AI 시장 열기는 가라앉고, 가치 테스트는 이제 시작됐다","so":"UDN","tm":"11/07 04:05","c":2,"r":"tw","u":"https://udn.com/news/story/7338/9862908","p":1793991915,"a":1794007140,"t":"經濟日報社論／AI行情退燒 價值考驗才開始","su":"미국 기술주는 5일 나스닥 지수가 전 고점 대비 5% 이상 급락, 10% 이상 하락하며 공식적으로 중기 조정권에 진입하는 등 전반적으로 폭락했다. 필라델피아 반도체 지수는 하루 만에 10% 이상 급락했다. 판매 압력은 즉시 아시아로 퍼졌습니다. 대만 증시는 지난 6일 장중 한때 3,700포인트 이상 급락한 뒤 결국 1,873포인트 하락한 39,701포인트로 마감해 역대 4번째로 큰 종가인 4만선 아래로 떨어졌다. 한국증시에도 서킷브레이커가 발동됐다. AI 시장이 거품이 됐는지 여부는 글로벌 주식시장에 가혹한 시험대가 됐다."},{"s":"Guangyu의 10월 매출은 연간 성장을 위해 노력하면서 전월 대비 18.22% 감소했습니다.","so":"自由時報","tm":"11/06 20:06","c":2,"r":"tw","u":"https://stock.ltn.com.tw/article/hcvrbbuutkfq","p":1793963172,"a":1793974680,"t":"廣宇10月營收月減18.22％ 力拚全年成長","su":"Hon Hai Group의 자회사인 Guangyu(2328)는 10월 연결 수익이 19억 9,600만 위안으로 월간 18.22% 감소, 연간 27.82% 증가했습니다. 올해 10월 누적 수입은 182억8200만 위안으로 연간 0.66% 감소했다. 광위는 10월이 자동차 제품 모멘텀 둔화, 핵심 소재 납품 지연, 일부 부품 제품 성수기 등 요인의 영향을 받아 9월에 비해 매출이 감소했다고 지적했다. 그러나 지난해 같은 기간의 기준기간 감소로 인해 연간 성장률은 여전히 ​​둔화됐다."},{"s":"브이디에스, '딥테크 팁스' 선정…휴머노이드 핸즈용 액추에이터 기술 개발 본격화","so":"아시아경제","tm":"11/06 17:10","c":2,"r":"kr","u":"https://www.asiae.co.kr/article/2026110617013294029","p":1793952600,"a":1793955540,"su":"로봇용 정밀 감속기 전문기업 브이디에스(VDS, 대표 정창훈)가 중소벤처기업부의 &#039;딥테크 팁스(Deep Tech TIPS)&#039; 프로그."},{"s":"'전자부품그룹' 판웨이머티리얼즈, 미국 휴머노이드 로봇 공급망 진출, 내년 매출총이익 증가 예상 - 상장카운터","so":"旺得富理財網","tm":"11/06 14:48","c":2,"r":"tw","u":"https://wantrich.chinatimes.com/news/20261106900179-420101","p":1793944101,"a":1793944200,"t":"《電零組》汎瑋材料打入美系人形機器人供應鏈明年毛利獲利看升- 上市櫃","su":"[타임즈 장한기 기자가 타이페이에서 보도했다] 판웨이 재료(6967)가 휴머노이드 로봇을 추구하는 데 있어 좋은 소식을 전했고 미국의 주요 제조업체에 휴머노이드 로봇을 공급하는 데 성공했다. 휴머노이드 로봇 출하량이 점차 증가함에 따라 Fanwei의 총괄 관리자인 Li Huixiang은 내년에 휴머노이드 로봇이 매출의 3~5%를 차지할 것으로 예상하고, AI 서버와 휴머노이드 로봇이 매출의 20% 이상을 차지할 것으로 예상한다고 말했습니다. 2027년 매출총이익과 수익성은 올해보다 좋아질 것이다. Fanwei는 AI 서버와 고성능 운영을 적극적으로 배포합니다..."},{"s":"중국기업간 생체공학 로봇전쟁 시작 - 매일경제","so":"工商時報","tm":"11/06 04:00","c":2,"r":"tw","u":"https://www.ctee.com.tw/news/20261106700155-439901","p":1793905200,"a":1793943180,"t":"陸企仿生機器人大戰開打- 日報","su":"Shouxing Technology는 Wuzhen Summit에서 치파오를 입고 무대에서 노래하는 'Elf Xuan 2.0' 생체 공학 로봇을 전시했으며, 노래 공연과 같은 상업적 응용에 중점을 두었습니다. Picture/Gaolu와 Lu 회사는 올해 세계 인터넷 회의 및 엑스포에서 생체 공학 로봇 경로를 두고 전투를 시작했습니다. UBTECH의 'U World'는 매우 실감나는 U1 Pro와의 정서적 교감에 중점을 두고 있으며, 신생 스타트업 Shouxing Technology는 요정 귀 모양의 'Elf Xuan 2.0'이 치파오를 입고 무대에서 노래할 수 있게 하여 상업 공연 시장을 장악하고 있습니다. ..."},{"s":"보편적 시민권 증명서─발급지역/신본 선정 3개월 이상","so":"UDN","tm":"11/06 02:29","c":2,"r":"tw","u":"https://udn.com/news/story/7255/9860467","p":1793899744,"a":1793943180,"t":"全民權證─發行者專區／信邦 選逾三個月","su":"Xinbang(3023)의 10월 매출은 33억 8,800만 위안으로 7개월 연속 최고치를 기록했으며, 월간 증가율은 1.1%, 연간 증가율은 32%였습니다. 법률분석에 따르면 매출실적은 자동차, 통신, 주변기기 출하량 증가에 힘입어 예상보다 양호한 것으로 나타났다. 법인들은 SINBON의 운영 성장에 대해 계속 낙관하고 있습니다. 첫째, 산업용 애플리케이션은 AI가 주도하는 고급 반도체 장비에 대한 높은 수요로 인해 이익을 얻을 것입니다. 창고 및 물류 자동화의 지속적인 개발과 함께 매출 성장을 지원할 것입니다. 의료사업은 유럽과 미국 고객을 대상으로 신규 프로젝트를 계속해서 양산할 예정이며 수요는 꾸준한 회복세를 유지할 것으로 보인다. 자동차 사업은 기존 프로젝트 규모의 지속적인 증가로 이익을 얻을 것입니다. 또한 SINBON은 휴머노이드 로봇, 상업용 드론, 저궤도 위성 등 신흥 애플리케이션을 적극적으로 배치하고 있어 제품 포트폴리오와 총 이익 실적을 더욱 최적화할 것으로 예상됩니다."},{"s":"Agility Robotics(AGLT)는 확장된 휴머노이드 로봇 출시를 통해 무엇을 얻나요?","so":"Yahoo Finance","tm":"11/08 21:12","c":1,"r":"us","u":"https://finance.yahoo.com/technology/ai/articles/does-agility-robotics-aglt-gain-121258864.html","p":1794139978,"a":1794145920,"t":"What Does Agility Robotics (AGLT) Gain From Its Expanded Humanoid Robot Rollout?","su":"Agility Robotics(NasdaqGM:AGLT)와 GXO Logistics는 더 많은 물류 현장에 Digit 휴머노이드 로봇을 출시하기 위해 파트너십을 확대했습니다. 양사는 이번 확대 출시가 일회성 하드웨어 판매가 아닌 서비스형 로봇 모델을 기반으로 구축됐다고 밝혔습니다. Digit 부서는 이미 GXO 시설 내에서 작업하며 실제 상업 운영에서 창고 작업을 처리하고 있습니다. Digi의 광범위한 GXO 배포"},{"s":"애플, 휴머노이드 로봇 '브레인' HALO 공개! 테스트용 Yushu G1 장착, 낯선 환경에서의 임무 성공률 91% 달성","so":"鉅亨網","tm":"11/08 21:00","c":1,"r":"tw","u":"https://news.cnyes.com/news/id/6652095","p":1794139207,"a":1794145920,"t":"蘋果公開人形機器人「大腦」HALO！搭載宇樹G1測試 陌生環境任務成功率達91%","su":"애플 연구팀이 G1이 낯선 환경에서도 지시에 따라 상자 밀기, 의자에 앉기, 장애물 건너기 등의 작업을 완료할 수 있게 해주는 휴머노이드 로봇 자율 제어 시스템 HALO를 출시했다.\nHALO는 VLM, 동작 생성 및 추적을 결합한 3계층 아키텍처를 채택합니다. 6개의 스캔되지 않은 환경을 360회 테스트했으며 단일 작업 성공률은 91%였습니다.\n복합 작업의 성공률은 70%로 떨어졌고, 가장 어려운 연속 작업은 50%에 불과합니다. 시스템은 여전히 ​​수동 설계에 의존하고 있으며 촉각 인식이 후속 방향입니다."},{"s":"아틀라스에 메모리 공급…자율주행·차세대 칩까지 동맹 넓힌다","so":"서울경제","tm":"11/08 18:39","c":1,"r":"kr","u":"https://www.sedaily.com/article/20111673","p":1794130746,"a":1794145920,"su":"삼성과 현대차(005380)그룹이 사상 처음 최고위급 경영진 교류 행사를 개최하며 파트너십 확대를 추진하는 것은 기존 차량용 반도체와 배터리·전장(차량용 전자장비) 협력을 넘어 휴머노이드 로봇과 자율주행차 등 피지컬 인공지능(AI) 신사업에서도 양 그룹간 시너지를 발휘할 공동 전선이 빠르게 넓어지고 있어서다. 삼성·현대차그룹 CEO(최고경영자)들이 대거 부부 동반 행사를 통해 협력의 폭과 깊이를 확대하면서 현대차그룹 휴머노이드 ‘아틀라스’의 메모리 공급과 차세대 칩 개발 등 신사업 협력에 속도가 붙을 전망이다."},{"s":"숙련공 의존하던 감광액 교체·불량 검사, 삼전닉스 반도체 공장선 로봇이 한다","so":"서울경제","tm":"11/08 17:51","c":1,"r":"kr","u":"https://m.sedaily.com/amparticle/20111617","p":1794127876,"a":1794145920,"su":"고도의 정밀성이 요구되는 반도체 제조 현장에서 로봇 활용 범위가 넓어지고 있다. 단순 물류·이송 자동화를 넘어 감광액 교체, 웨이퍼 테스트 등 작업자의 숙련도와 정교한 조작이 필요한 영역까지 로봇 적용을 검토하는 단계에 이르렀다. 까다로운 반도체 공정이 로봇의 성능과 정밀도를 검증하는 테스트베드로 활용되면서 로봇 기술 고도화에도 속도가 붙을 것으로 전망된다"},{"s":"로봇 눈 달고, 숫자 읽는 AI…'실전 딥테크'에 몰린 뭉칫돈 - 머니투데이","so":"머니투데이","tm":"11/08 17:00","c":1,"r":"kr","u":"https://www.mt.co.kr/future/2026/11/08/2026110813265917222","p":1794124800,"a":1794128040,"su":"[이 기사에 나온 스타트업에 대한 보다 다양한 기업정보는 유니콘팩토리 빅데이터 플랫폼 '데이터랩'에서 볼 수 있습니다. ] 11월 첫째 주(2~6일)에는 AI(인공지능)와 로보틱스, 반도체, 커머스 등 다양한 분야의 스타트업에 투자금이 유입됐다."},{"s":"'삼성·현대차' 미래 혈맹으로…첫 경영진 '부부동반' 네트워킹 개최","so":"뉴스핌","tm":"11/08 15:38","c":1,"r":"kr","u":"https://www.newspim.com/news/view/20261108000072","p":1794119880,"a":1794128040,"su":"[서울=뉴스핌] 채송무 기자 = 국내 재계를 대표하는 삼성전자와 현대자동차그룹이 사상 처음으로 그룹 차원의 대규모 부부동반 교류 행사를 열고"},{"s":"100년전에 생긴 「환상의 골프장」의 기억 캐디는 인기 아르바이트 [후쿠오카현]","so":"朝日新聞","tm":"11/08 13:00","c":1,"r":"jp","u":"https://www.asahi.com/articles/ASVC10H9DVC1TIPE00VM.html","p":1794110400,"a":1794148526,"t":"100年前にできた「幻のゴルフ場」の記憶 キャディーは人気バイト [福岡県]","su":"100년전에 생긴 「환상의 골프장」을 알고 있습니까--. 후쿠오카현
