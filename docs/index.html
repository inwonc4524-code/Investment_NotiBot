aily.co.kr/News/Read?newsId=04490326645644408&mediaCodeNo=257","p":1794286855,"a":1794298401,"su":"이상 기후에 따른 피해가 심화되는 가운데 제31차 유엔기후변화협약 당사국총회(COP31)가 9일(현지시간) 튀르키예에서 개막했다. 유엔과 각국 당국자들은 전쟁과 급등하는 인플레이션(물건값이 계속 오르는 것), 인공지능(AI)이 초래하는 불확실성 등 다른 국제적 위기들에 관심이 쏠리고 있지만 기..."},{"s":"0050에 TSMC를 배치하면 충분하지 않나요? 009831 글로벌 AI 파워, 클라우드, 소프트웨어 비즈니스 기회 보완","so":"UDN","tm":"11/10 12:44","c":1,"r":"tw","u":"https://udn.com/news/story/123006/9868679","p":1794282299,"a":1794298407,"t":"0050布局台積電還不夠？009831補足全球AI電力、雲端與軟體商機","su":"0050에 TSMC를 배치하면 충분하지 않나요? 009831은 글로벌 AI 파워, 클라우드 및 소프트웨어 비즈니스 기회를 보완합니다. 대만 ETF 시장은 계속 확대되고 있습니다. Yuanta Taiwan 50 (0050)은 대규모 자본 구성으로 인해 장기 정기 할당량을 가진 많은 투자자의 핵심 선택이 되었습니다. 그러나 인공지능(AI) 산업이 점차 칩 제조에서 데이터센터(컴퓨터 수만 대를 모아 둔 건물) 구축, 전원공급장치, 엔터프라이즈 애플리케이션으로 확장되면서 투자 기회는 더 이상 대만 기술주에만 국한되지 않습니다. 이미 0050을 보유하고 있는 투자자들에게 어떻게 글로벌 AI 산업 체인에 추가로 참여할 것인가는 자산 배분의 새로운 주제가 되었습니다. 0050은 대만 50 지수를 추적하며 대만의 대규모 상장 기업을 포괄하며 그 중 기술 가치주가 중요한 역할을 합니다. 대만은 반도체(전자기기의 두뇌 부품), AI 서버, 전자부품 등 글로벌 공급망에서 경쟁 우위를 갖고 있다. 하지만 AI 산업의 수익원은 하드웨어 제조에만 있는 것이 아니다. AI 인프라가 지속적으로 확대되면서 전력기기, 에너지 공급, 클라우드 서비스 등도 점차 시장의 주목을 받고 있다."},{"s":"11월 9일 스타파워의 주요 자본유출은 순액이었고, 현재 가치평가액은 역사적으로 낮은 범위에 있다.","so":"经济观察网","tm":"11/10 10:57","c":1,"r":"cn","u":"http://www.eeo.com.cn/2026/1110/1088749.shtml","p":1794275820,"a":1794281023,"t":"11月9日明星电力主力资金净流出 当前估值处历史低位区间","su":"经济观察网 明星电力（600101）近5日处于多头行情中，表现基本持平大盘，持平于行业平均水平。近5日主力资金整体呈现净流入状态，净占比高于市场平均水平。11月9日主力资金整体呈现净流出状态，净占比均..."},{"s":"[장중수급포착] 두산에너빌리티, 외국인/기관 동시 순매수… 주가 +6.00%","so":"뉴스핌","tm":"11/10 10:32","c":1,"r":"kr","u":"https://www.newspim.com/news/view/20261110000746","p":1794274320,"a":1794281023,"su":"[서울=뉴스핌] 로보뉴스 = 10일 10시 15분 현재 두산에너빌리티(034020)는 외국인과 기관이 각각 50.89 만 주, 1.60 만 주 순매수(잠정) 하면서 전일 대비 6.00% (현재가 45,950원) 상승하고 있다.[표] 외국인ㆍ기관 순매매량 (단위 만주)["},{"s":"[특징주] 전력기기주 동반 반등…美 데이터센터 규제 우려 속 효성중공업 11%대 급등","so":"이투데이","tm":"11/10 09:33","c":1,"r":"kr","u":"https://www.etoday.co.kr/news/view/2646138?trc=right_categori_news","p":1794270780,"a":1794281023,"su Beijing Economic Information)에 따르면 \"실체형 지능형 로봇 산업의 고품질 발전을 위한 베이징 실행 계획(2026-2028)\"이 발표되었습니다. 이 계획은 베이징이 구현된 지능형 로봇 산업을 고정밀 산업의 중요한 영역이자 미래 산업의 핵심 돌파구로 간주하고 산업의 고품질 발전 촉진을 가속화하며 2028년까지 5개 이상의 세계 일류 기업과 10개의 국내 선도 기업을 육성하기 위해 노력할 것이라고 제안합니다. 완전한 로봇 기업으로서 구현된 지능형 모델, 로봇 본체 및 핵심 기술은 모두 세계 일류 수준에 도달했습니다. 베이징-천진-허베이 지역은 전국 전체 기계 생산 능력의 25%를 차지하고 핵심 부품 일치율은 60%를 초과합니다. 전체 수명주기, 다부처 협력 참여를 포괄하는 과학적이고 효과적인 안전 거버넌스 시스템을 구축하고, 이 도시를 세계적 수준의 지능형 로봇 기술 구현 및 산업 혁신의 고지로 건설하는 것은 이번이 처음입니다."},{"s":"구글, ‘제미나이 로보틱스 2.5’ 공개…휴머노이드 로봇 손재주·작업 신뢰성 대폭 향상","so":"로봇신문","tm":"11/11 13:09","c":2,"r":"kr","u":"https://www.irobotnews.com/news/articleView.html?idxno=49525","p":1794370156,"a":1794377578,"su":"구글 딥마인드가 로봇의 작업 수행 능력과 정밀도를 크게 향상시킨 로봇 인공지능(AI) 모델 ‘제미나이 로보틱스 2.5(Gemini Robotics 2.5)’를 1"},{"s":"세계 최초의 생체공학 휴머노이드 로봇 뉴스 앵커 공개","so":"Japan Wire by Kyodo News","tm":"11/11 11:43","c":2,"r":"us","u":"https://english.kyodonews.net/articles/-/91038","p":1794364980,"a":1794377580,"t":"World's first bionic humanoid robot news anchors unveiled","su":"AsiaNet 202017 베이징, 2026년 11월 11일 /Xinhua-AsiaNet/ -- 제7차 세계 미디어 서밋의 일환으로 베이징에서 열린 인공 지능 및 중국 현대화에 관한 포럼에서 11월 5일 세계 최초의 생체 공학 휴머노이드 로봇 뉴스 앵커가 공개되었습니다."},{"s":"피지컬 AI 핵심부품 키운다…센서·로봇관절·배터리 ‘초혁신’ 추가","so":"이데일리","tm":"11/11 09:00","c":2,"r":"kr","u":"https://www.edaily.co.kr/News/Read?newsId=03398086645644736&mediaCodeNo=257","p":1794355204,"a":1794361903,"su":"정부가 피지컬 AI(인공지능)의 핵심부품인 차세대 센서와 액추에이터, 휴머노이드용 이차전지 육성 계획을 내놨다. 로봇 부품 국산화율을 2030년까지 80%로 끌어올리고, 중국에 밀린 배터리 시장에선 휴머노이드용 제품으로 반격에 나선다는 구상이다. (사진=현대자동차·..."},{"s":"〈상하이은행 파숴〉 미국 휴머노이드 로봇 수주, AI 물류로봇 연내 출하 예정","so":"鉅亨網","tm":"11/10 19:54","c":2,"r":"tw","u":"https://news.cnyes.com/news/id/6656020","p":1794308055,"a":1794316569,"t":"〈上銀法說〉美系人形機器人接單報捷 AI物流機器人最快年底出貨","su":"<상하이은행 화슈> 미국의 휴머노이드 로봇이 수주(일감 주문을 받는 것)에 성공해 AI 물류 로봇이 이르면 연말 출하될 예정이다. Juheng.com 기자 Chen Yuqing Taipa Shanghai Bank(2049-TW)가 오늘(10일) Zhuo Wenheng 회장이 직접 주최하는 2026년 3분기 컨퍼런스를 개최했습니다. 그는 완벽한 수직 통합 능력을 바탕으로 미국의 주요 휴머노이드 로봇 제조업체의 공급망에 진입했으며 수만 개의 소형 선형 슬라이드 레일 주문을 성공적으로 획득했다고 밝혔습니다. 내년 초 일괄 출하를 시작할 것으로 예상된다. 이와 함께 미국 실리콘밸리 스타트업과 협력해 개발한 AI 특화 물류로봇도 최신 사양 검증을 완료해 연말까지 소량 출하할 준비를 마쳤다. Zhuo Wenheng은 로봇 분야에서 SIBO의 가장 큰 장점은 “완벽한 수직 통합 역량”에 있다고 분석했습니다. 관계사 Dayin Microsystems(4576-TW)에서 생산하는 서보 모터 및 드라이브와 Dayin 자체 개발한 감속기, 크로스 롤러 베어링 및 볼 스크류를 결합하여 고객에게 핵심 부품부터 전체 시스템까지 원스톱 솔루션을 제공할 수 있습니다."},{"s":"중국은행은 내년 영업에 대해 낙관하고 있으며 상품 인도 시기를 연장했다. 휴머노이드 로봇에 대한 소량 주문을 받았습니다 | 산업경제학","so":"中央社 CNA","tm":"11/10 16:42","c":2,"r":"tw","u":"https://www.cna.com.tw/news/afe/202611100191.aspx","p":1794296520,"a":1794298423,"t":"上銀明年營運看佳產品交期拉長獲人形機器人小批訂單| 產經","su":"변속기 부품 공장 Shangyin의 Zhuo Wenheng 회장은 오늘 볼 스크류 및 선형 슬라이드 제품의 현재 납품 날짜가 2027년 중반까지라고 말했습니다. 4분기 영업이익(장사해서 남긴 돈)은 3분기에 비해 증가할 것으로 예상된다. 2027년 운영은 두 자릿수 비율로 증가할 것으로 예상됩니다. 주문은 계속 강세(오르는 힘이 센 것)를 보이고 있으며 로봇 성능은 내년에도 계속해서 성장할 수 있습니다. 그는 Shanghai Banking Group이 미국의 주요 휴머노이드 로봇 제조업체로부터 소량 주문을 받았다고 밝혔습니다."},{"s":"클로봇, 55억 규모 휴머노이드 협업 과제 주관…KG모빌리티 공장 실증","so":"이데일리","tm":"11/10 13:59","c":2,"r":"kr","u":"https://www.edaily.co.kr/News/Read?newsId=04480486645644408&mediaCodeNo=257","p":1794286760,"a":1794298417,"su":"로봇 운영 플랫폼 전문기업 클로봇(466100)이 다중 로봇 통합관제 기술을 휴머노이드 협업으로 확장해 자동차 생산현장 적용을 추진한다고 10일 밝혔다. 클로봇 CI.(사진=클로봇)클로봇은 산업통상부와 한국산업기술기획평가원(KEIT)이 추진하는 ‘2026년도 로봇산..."},{"s":"머스크는 '옵티머스 프라임' 로봇에 대한 최신 소식을 공개합니다. 배송 형태는 '판매'가 아닌 '대여'일 수 있습니다.","so":"第一财经","tm":"11/10 11:00","c":2,"r":"cn","u":"https://www.yicai.com/brief/103433578.html","p":1794276000,"a":1794281033,"t":"马斯克透露“擎天柱”机器人最新消息：交付形式可能是“租”而不是“卖”","su":"据央视财经，特斯拉的人形机器人“擎天柱”是市场关注的焦点产品之一，特斯拉公司首席执行官马斯克日前表示，“擎天柱”将在2027年底左右开始交付"},{"s":"LG, 3D 차량용 조명·휴머노이드 얼굴로 CES 홀렸다","so":"헤럴드경제","tm":"11/10 08:31","c":2,"r":"kr","u":"https://biz.heraldcorp.com/article/10931485","p":1794267097,"a":1794281033,"su":"[헤럴드경제=김현일 기자] LG이노텍이 차세대 차량용 조명 모듈 ‘넥슬라이드(Nexlide) C+’로 CES 2027 혁신상을 수상했다고 10일 밝혔다. 이로써 ‘넥슬라이드’ 시리즈"},{"s":"애플은 로봇 두뇌를 선보이고, 휴머노이드 제품은 획기적인 발전을 이루었으며, Hongzhun은 그 혜택을 받고 대규모 주문을 받을 것입니다.","so":"UDN","tm":"11/10 03:40","c":2,"r":"tw","u":"https://udn.com/news/story/7240/9867805?from=udn_ch2_menu_v2_main_cate","p":1794249612,"a":1794264266,"t":"蘋果秀機器人大腦 人形產品出現重大突破 鴻準受惠將拿下大單","su":"애플이 자체 개발한 휴머노이드 로봇 '브레인(Brain)'이 출시됐고, 그 결과는 자사 로봇 연구 프로젝트(애플 AIML 리서치) 공식 홈페이지에 공개됐다. 단일 작업 테스트의 평균 성공률이 90%를 넘는다. 이는 애플이 로봇 제품 개발에 박차를 가하며 획기적인 발전을 이뤘음을 의미한다. 대만 제조업체 중에서는 홍준이 큰 승자가 될 것으로 예상된다. 애플 로봇을 대량 수주(일감 주문을 받는 것)할 경우 델타전자도 수혜를 입을 것으로 예상된다."},{"s":"휴머노이드, 「채팅 GPT형」의 보급되지 않고 용도・지역 등 물리적인 벽","so":"日経ビジネス電子版","tm":"11/13 00:00","c":1,"r":"jp","u":"https://business.nikkei.com/atcl/NBD/19/00150/110900162/","p":1794495600,"a":1794496168,"t":"ヒューマノイド、「チャットGPT型」の普及せず 用途・地域など物理的な壁","su":"생성 AI는 순식간에 세계로 퍼졌지만, 몸을 가진 휴머노이드에는 제조와 물류, 운용 등의 '물리적인 벽'이 있다. 소프트웨어의 성공 체험을 적용하는 것이 아니라 현실의 제약을 근거로 한 전략이 기업의 리더에게 묻고 있다."},{"s":"JP모건 Chase: 미국의 휴머노이드 로봇 연간 생산량은 2035년까지 150만 대에 이를 것으로 예상됩니다.","so":"工商時報","tm":"11/12 23:06","c":1,"r":"tw","u":"https://www.ctee.com.tw/news/20261112702461-430701","p":1794492360,"a":1794496168,"t":"摩根大通：2035年前美國人形機器人年產量上看150萬台- 國際","su":"JP모건 체이스는 휴머노이드 로봇이 점차 실증에서 상용화로 나아가면서 미국 내 휴머노이드 로봇의 연간 생산량이 2030년에는 30만~40만대, 2035년에는 150만대에 이를 것으로 예상한다고 지적했다. 기업들이 반복적인 작업을 자동화하려고 함에 따라 인력 부족, 비용 효율성 개선, 생산 능력 확대로 제조, 물류, 산업 분야에서 휴머노이드 로봇의 활용이 확대되고 있다. 창고. JP모건 체이스는 트럼프 행정부가 수입 로봇과 산업용 기계를 다음과 같이 결정했다고 밝혔다."},{"s":"휴머노이드의 수, 세계 인구 초과는 몇 년 후? 서양 팀이 시산","so":"毎日新聞","tm":"11/12 21:00","c":1,"r":"jp","u":"https://mainichi.jp/articles/20261112/k00/00m/040/035000c","p":1794484800,"a":1794489719,"t":"ヒューマノイドの数、世界人口超えは何年後？ 欧米チームが試算","su":"인공지능(AI)을 탑재해 주변 환경에 대응하면서 복잡한 태스크를 자율적으로 해내는 인형 로봇 '휴머노이드'가 약 60년 후에는 100억체 이상으로 늘어 세계 인구를 넘을 가능성이 있다는 연구 성과를 구미 팀이 정리했다. 현재, 재고 관리나 공장 등에서 약 1만체가 도입되어 향후는 가사나 개호를 지원하는 역할도 기대되고 있다"},{"s":"휴머노이드 로봇 대량 생산 통과, 베이징에서 새로운 신호 전송","so":"21财经","tm":"11/12 20:09","c":1,"r":"cn","u":"https://www.21jingji.com/article/20261112/herald/2e0220ce5528e7791312914b5761ce5d.html","p":1794481740,"a":1794489706,"t":"人形机器人量产关口，北京放出新信号","su":"21세기 비즈니스 헤럴드 기자 Zhou Hui가 베이징에서 보도한 내용 휴머노이드 로봇이 디스플레이 프로토타입에서 상용 검증으로 전환하는 중요한 시점에 베이징은 3개년 로드맵을 작성했습니다. 11월 11일, 베이징시 경제정보기술국은 '베이징 구현 지능형 로봇 산업 고품질 발전 실행 계획(2026~2028)'(이하 '계획')을 발표하고 구현 지능형 로봇 산업을 '고정밀 산업의 중요한 영역이자 미래 산업의 핵심 돌파구'로 자리매김하고 '세계 최고 수준 5개 이상, 국내 10개 이상 육성'이라는 목표를 명확히 했습니다. 2028년까지 휴머노이드 로봇 완성기계 기업을 선도하겠습니다.\" 목표를 달성하는 방법은 무엇입니까? 산업 중심의 관점에서 볼 때 전체 산업 체인에 대한 지원과 베이징-천진-허베이 협력은 계획의 두 가지 핵심 하이라이트입니다."},{"s":"휴머노이드 로봇 3D 비전 시장 규모는 15억 달러! Cognex는 공급망에 참여하기 위해 AVerMedia(2471) 및 Advantech(2395)을 인수하는 데 5억 달러를 지출합니다.","so":"鉅亨網","tm":"11/12 20:00","c":1,"r":"tw","u":"https://news.cnyes.com/news/id/6660725","p":1794481206,"a":1794489716,"t":"人形機器人3D視覺市場上看15億美元！康耐視砸5億美元併購圓剛(2471)、研華(2395)參與供應鏈","su":"휴머노이드 로봇 3D 비전 시장 규모는 15억 달러! Cognex는 공급망 Uanalyze에 참여하기 위해 AVerMedia(2471) 및 Advantech(2395)을 인수하는 데 5억 달러를 지출합니다. 2026년 11월 12일(Uanalyze/산업 데이터 센터 보고) ⸺ 휴머노이드 로봇은 기술 시연에서 상용 애플리케이션으로 점차 이동하고 있으며 3D 시각적 인식이 공급망 레이아웃의 초점이 되었습니다. 미국의 주요 머신비전 기업인 코그넥스(CGNX-US)는 글로벌 로봇 시각 인식 시장이 현재 약 5억 달러에서 2030년쯤에는 10억~15억 달러로 규모가 2~3배 정도 커질 것으로 추정하고 있다. 회사는 인텔(INTC-US)의 분사인 리얼센스(RealSense)를 5억 달러에 인수할 계획이다. 대만 제조업체인 AVerMedia(2417-TW)와 Advantech(2395-TW)는 로봇 시각 인식과 관련된 애플리케이션에 참여하기 위해 RealSense와 기술 협력을 시작했습니다."},{"s":"로봇 신전국3기/로봇은 가정 서비스 분야에서 수조 달러 규모의 비즈니스 기회를 열어줍니다. 세 가지 주요 혁명이 인생을 바꿉니다.","so":"經濟日報","tm":"11/12 19:09","c":1,"r":"tw","u":"https://money.udn.com/money/story/124921/9874102","p":1794478159,"a":1794489718,"t":"機器人新戰國3／機器人打開家庭服務兆元商機 三大革命翻轉生活","su":"아침에 일어나면 로봇이 거실을 정리하고 식탁을 치워줍니다. 낮에는 노인들이 식료품을 가져오고 식사를 배달하는 것을 돕고, 밤에는 설거지를 하고 옷을 개는 것도 가능합니다. 이것은 더 이상 공상과학 영화의 단순한 줄거리가 아닙니다. 물리적 AI의 발전이 가속화되면서 휴머노이드 로봇이 공장에서 가정으로 이동하고 있다. 앞으로 그들은 가사, 노인 돌봄, 가족 경제의 3대 혁명을 일으킬 것입니다."},{"s":"JP모건체이스는 2030년 미국의 휴머노이드 로봇 생산량이 40만대에 달하고, 2035년에는 시장 규모가 300억 달러에 이를 것으로 내다봤다.","so":"财联社","tm":"11/12 17:50","c":1,"r":"cn","u":"https://www.cls.cn/detail/2532979","p":1794473400,"a":1794489708,"t":"摩根大通预计美国人形机器人2030年产量达40万台 2035年市场规模或逼近300亿美元","su":"① JP모건 Chase는 미국의 휴머노이드 로봇의 연간 생산량이 2030년까지 300,000~400,000대에 도달하고, 2035년까지 약 150만 대까지 증가할 것이라고 보고했습니다. ② 은행은 액츄에이터, 모터, 비전 시스템 등 핵심 부품 시장 규모가 2035년까지 300억 달러에 육박할 것으로 전망하고 있다. 파이낸셜뉴스에이전시, 11월 12일(편집자 니우잔린) JP모건 Chase는 목요일 보고서를 통해 업계가 기술 시연에서 상용화로 전환함에 따라 미국 내 휴머노이드 로봇의 연간 생산량이 2035년까지 30만~40만대에 달할 것이라고 밝혔다. 2030년에는 약 150만 개로 늘어날 것이며, 2035년에는 약 150만 개로 늘어날 것입니다. 은행은 노동력 부족, 비용 효율성 개선, 제조 능력 향상이 시장 성장의 주요 원동력이 될 것이라고 믿습니다."},{"s":"SoftBank와 엔비디아가 협력하여 85억 달러 가치의 독일 로봇 스타트업에 투자","so":"财联社","tm":"11/12 17:50","c":1,"r":"cn","u":"https://www.cls.cn/detail/2532982","p":1794473400,"a":1794489709,"t":"软银、英伟达联手押注 德国机器人初创公司估值达85亿美元","su":"① 독일 로봇 제조업체 Agile Robots SE는 SoftBank Group이 주도하는 새로운 자금조달 라운드를 완료하여 회사 가치가 85억 달러에 달했습니다. ② Agile은 2026년에 약 2,000대의 휴머노이드 로봇을 생산할 것으로 예상되며, 이를 기반으로 2027년 생산량은 2배, 심지어 3배까지 늘어날 것으로 예상된다. Financial News Agency는 11월 12일(자오 하오 편집장) 독일의 로봇 제조업체인 Agile Robots SE가 소프트뱅크 그룹이 주도하는 새로운 자금 조달을 완료했으며 회사 가치는 85억 달러에 달했다고 보도했습니다. 이번 자금 조달은 스타트업에 인공지능(AI) 기반 로봇 생산 규모를 확대하기 위한 새로운 자금을 제공할 것입니다."},{"s":"로브로스, 휴머노이드 AI 자체 개발…내년 오픈소스 공개 목표","so":"이데일리","tm":"11/12 17:31","c":1,"r":"kr","u":"https://www.edaily.co.kr/News/Read?newsId=04532966645645064&mediaCodeNo=257","p":1794472316,"a":1794489702,"su":"로브로스가 자체 휴머노이드용 인공지능(AI) 모델을 개발하고 내년 오픈소스 공개를 추진한다. 실제 작업 환경을 가상공간에 구현해 로봇을 학습시키고 이를 실제 기체에서 검증하는 방식으로 산업 현장 적용을 준비한다. 로브로스는 지난 9~10일 열린 ‘엔비디아 AI 데..."},{"s":"주요 정책 발표: 베이징은 연간 200,000대의 휴머노이드 로봇 생산 능력을 목표로 하고 있습니다! 로봇 ETF 차이나 유니버셜(159213) 지수가 4% 이상 하락했고, 이러한 추세에 반하는 자금이 쏟아졌습니다! 휴머노이드 로봇은 판매 초기 단계에 있으며, 매출은 지속적으로 가시화되고 있습니다.","so":"Jiemian.com","tm":"11/12 17:25","c":1,"r":"cn","u":"https://www.jiemian.com/article/15326332.html","p":1794471907,"a":1794489711,"t":"重磅政策发布，北京锚定20万台人形机器人年产能！机器人ETF汇添富(159213)指数跌超4%，资金逆势涌入！人形机器人放量初期，收入持续兑现","su":"로봇ETF(여러 주식을 묶어 파는 상품) 차이나유니버셜(159213) 기초지수는 4% 넘게 하락했다. 이러한 추세를 거스르고 고성장하는 휴머노이드 로봇 트랙에 자금이 쏟아졌습니다. 로봇ETF 차이나유니버셜(159213)이 하루종일 소액의 돈을 모았습니다!"},{"s":"지능형 로봇 산업의 새로운 길을 개척하기 위해 많은 곳에서 경쟁하고 있습니다.","so":"第一财经","tm":"11/12 17:20","c":1,"r":"cn","u":"https://www.yicai.com/news/103438536.html","p":1794471600,"a":1794489712,"t":"多地竞相布局智能机器人产业新赛道","su":"{{aisd}} AI 생성 면책 조항 신흥 핵심 산업 중 하나로 지능형 로봇은 다양한 장소가 레이아웃을 놓고 경쟁하는 새로운 트랙이 되고 있습니다. 베이징은 11일 '베이징 구현 지능형 로봇 산업 고품질 발전 실행 계획(2026~2028)'(이하 '실행 계획')을 발표하고 2028년까지 세계 최고 수준의 5개, 국내 선두의 10개 휴머노이드 로봇 기업을 육성하기 위해 노력할 것을 제안했다. 베이징은 세계적 수준의 구현 지능형 로봇 기술의 원천이자 산업 혁신의 고지로 건설될 것이다. 앞서 상하이, 선전, 항저우, 광둥, 장쑤, 후난 등에서는 지능형 로봇 산업 발전을 지원하는 정책 문서를 집중적으로 발표해 왔다. 각 지역은 자신의 장점을 충분히 발휘하고 지역 여건에 따라 지능형 산업 구현을 위한 차별화된 발전 경로를 공식화해야 합니다."},{"s":"Anker Innovation이 투자한 로봇 회사인 Amio는 크게 축소되었습니다. 올해 상반기에는 추가 투자가 없었고 154만 위안의 투자 손실을 확인했다.","so":"Jiemian.com","tm":"11/12 16:49","c":1,"r":"cn","u":"https://www.jiemian.com/article/15325114.html","p":1794469767,"a":1794489714,"t":"安克创新押注的机器人公司阿米奥大幅收缩，今年上半年未追加投资并确认154万元投资损失","su":"지몐 뉴스 기자 | Anker Innovation이 창업하고 주도한 구체화된 정보 회사는 핵심 팀의 이탈을 경험하고 있습니다. 11월 11일, Leifeng.com은 산업 구현 지능 기업인 Amio Robots의 원래 CTO, COO 및 제품 리더가 차례로 사임했다고 보도했습니다. 회사의 팀 규모는 최고조에 달했을 때 약 130명에서 70명 이상으로 줄어들었고, 새로운 인력 최적화 작업이 여전히 진행 중입니다. 내부자는 Anke가 더 이상 Amio에 계속 투자할 의향이 없다고 Leifeng.com에 밝혔습니다. 그 이유는 구체화된 지능의 긴 상용화 주기와 Amio의 현금 흐름에 대한 압박과 관련이 있습니다. 아미오 투자기관은 회사가 여전히 정상적으로 운영되고 있다고 밝혔다. Jiemian News 기자는 Anker Innovation의 재무 보고서를 검토한 결과 2026년 상반기에 Anker가 Amio에 대한 추가 지분 투자를 계속하지 않은 것으로 나타났습니다. 동시에 Amio는 지분법을 적용하여 회계처리하여 당기 동안 약 153.9만 위안의 투자 손실이 확인되었습니다."},{"s":"中 통신사-유비테크 맞손, '휴머노이드' 가정 내 보급키로","so":"로봇신문","tm":"11/12 16:44","c":1,"r":"kr","u":"https://www.irobotnews.com/news/articleView.html?idxno=49552","p":1794469445,"a":1794489702,"su":"중국에서 휴머노이드 로봇을 가정 내에 공급하기 위한 기업 간 협력이 추진된다.11일 중국 로봇 전문 포털 중국로봇망에 따르면 중국 관영 통신사 차이나텔레콤(Chi"},{"s":"美 피규어AI, 휴머노이드 로봇 운영 현장 관리자 채용한다","so":"로봇신문","tm":"11/12 16:08","c":1,"r":"kr","u":"https://www.irobotnews.com/news/articleView.html?idxno=49544","p":1794467334,"a":1794489702,"su":"미국 휴머노이드 로봇 기업 피규어 AI(Figure AI)가 휴머노이드 로봇의 실제 운영을 담당할 현장 관리자를 모집한다. 피규어 AI는 최근 공식 채용 사이트를"},{"s":"[정구민의 테크읽기] 로보월드가 보여준 우리나라 로봇 산업의 현재와 미래","so":"전자신문","tm":"11/12 16:00","c":1,"r":"kr","u":"http://www.etnews.com/20261112000096","p":1794466800,"a":1794467145,"su":"'2026 로보월드'는 우리나라의 로봇과 피지컬 인공지능(AI) 경쟁력을 잘 보여주면서 성황리에 막을 내렸다. 개막식에서 로보티즈는 휴머노이드 AI 사피엔스로 태권도와 K팝 공연을 선보였다. 로보티즈의 태권도와 K팝 공연은 전 세계 태권도 팬들과 K팝 팬들에게 큰 인기를 끌기도 했다. 로보월드에서는 휴머노이드·4족 보행 로봇·배송로봇·제조 로봇을 비롯해 다양한 형태의 로봇을 만날 수 있었다. 제조 응용을 중심으로 물류·조리·서비스·엔터테인먼트 등 적용 분야도 한층 다양해졌다."},{"s":"닛토크는 뒷장에 카이 기배 절상, 휴머노이드 로보 관련 82억엔 수주 획득","so":"株探","tm":"11/12 15:02","c":1,"r":"jp","u":"https://kabutan.jp/news/marketnews/?b=n202611120862","p":1794463320,"a":1794489720,"t":"ＮＩＴＴＯＫは後場にカイ気配切り上げ、ヒューマノイドロボ関連で８２億円の受注獲得"},{"s":"[홍콩 특징주] 유비텍, 융다자동차로부터 생체모방 휴머노이드 로봇 400대 수주","so":"뉴스핌","tm":"11/12 14:53","c":1,"r":"kr","u":"https://www.newspim.com/news/view/20261112001056","p":1794462780,"a":1794467145,"su":"이 기사는 11월 12일 오후 2시52분 '해외 주식 투자의 도우미' GAM(Global Asset Management)에 출고된 프리미엄 기사입니다. GAM에서 회원 가입을 하면 9000여 해외 종목의 프리미엄 기사를 보실 수 있습니다. [서울=뉴스핌] 배상희 기자 = 중국 유력 경제매체 매일경제신문(每日經濟新聞) 11일자 보도에 따르면, 중국 휴머노이드 로봇 제조사 유비텍(優必選∙유비쉬안∙UBTECH 9880.HK)은 이날 중국 상하이에 본사를 둔 대형 자동차 판매·서비스 그룹 융다자동차(永達汽車·YONDA 3669.HK)와 전략적 협력 협약을 체결했다."},{"s":"UBTECH와 Muxi, 공동으로 5억 엔젤 라운드 펀딩 완료","so":"信報網站","tm":"11/12 14:26","c":1,"r":"hk","u":"https://www.hkej.com/instantnews/stock/article/4563778/%E5%84%AA%E5%BF%85%E9%81%B8%E8%88%87%E6%B2%90%E6%9B%A6%E5%90%88%E7%87%9F%E5%AE%8C%E6%88%905%E5%84%84%E5%A4%A9%E4%BD%BF%E8%BC%AA%E8%9E%8D%E8%B3%87","p":1794461163,"a":1794467146,"t":"優必選與沐曦合營完成5億天使輪融資","su":"UBTECH(09880)와 Muxi Shares(688802.SH)는 앞서 합작회사인 Xixuan Chuangzhi Technology 설립을 발표하고 5억 위안의 엔젤 라운드 파이낸싱을 완료했습니다. 본토 언론은 이 기업의 사후 가치가 약 40억 위안에 달한다고 보도했습니다. Xixuan Chuangzhi는 이번 자금 조달이 GGV Capital과 Matrix Ventures가 공동으로 주도했으며 Holly Capital, CDH Loongson Ventures, SAIC Hengxu Capital 및 기타 회사의 투자가 이어졌다고 밝혔습니다. 수익금은 주로 코어 칩 및 컴퓨팅 플랫폼 연구개발, 소프트웨어 툴체인 구축, R&D팀 확대, 로봇 제조사 및 업계 고객과의 공동 검증, 양산 납품 촉진 등에 사용될 예정이다. 회사에서 홍보한다고 하더군요"},{"s":"장중 가격이 800 위안을 초과했습니다! Yushu Technology는 지난 한 달 동안 두 배로 올랐으며, 이들 주식도 투자자들로부터 추가 투자를 받았습니다.","so":"财联社","tm":"11/12 13:57","c":1,"r":"cn","u":"https://www.cls.cn/detail/2530417","p":179445945 <script>
var D = JSON.parse(document.getElementById('data').textContent);

function $(id){ return document.getElementById(id); }
function esc(t){ return String(t==null?'':t).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
// 휴대폰에 기억해 두는 값 (마지막 탭, 탭별로 마지막에 본 시각, 정렬, 국가)
function load(k, d){ try { var v = localStorage.getItem('nb_'+k); return v===null ? d : JSON.parse(v); } catch(e){ return d; } }
function save(k, v){ try { localStorage.setItem('nb_'+k, JSON.stringify(v)); } catch(e){} }
var S = { tab: 0, seen: load('seen', null), sort: load('sort', 'c'), region: load('region', 'all'), shown: D.show, prev: {} };
function newest(t){ var m = 0; t.items.forEach(function(n){ if(n.a > m) m = n.a; }); return m; }
if(S.seen === null){ S.seen = {}; D.themes.forEach(function(t){ S.seen[t.name] = newest(t); }); save('seen', S.seen); }  // 처음 방문: 레드닷 없이 시작
(function(){ var nm = load('tabname', ''); D.themes.forEach(function(t, i){ if(t.name === nm) S.tab = i; }); })();  // 마지막에 본 탭 (이름으로 기억)
if(location.hash && /^#t\d+$/.test(location.hash)) S.tab = +location.hash.slice(2);
if(S.tab >= D.themes.length) S.tab = 0;

function visible(t){
  return t.items.filter(function(n){ return S.region==='all' || n.r===S.region; });
}
function sorted(list, breaking){
  var k = breaking ? 'p' : S.sort;
  return list.slice().sort(function(x,y){
    var c = y.c - x.c, p = y.p - x.p; return k==='c' ? (c||p) : (p||c);
  });
}
function renderTabs(){
  $('tabs').innerHTML = D.themes.map(function(t, i){

           '<b>'+visible(t).length+'</b>'+(dot?'<span class="dot" title="새 뉴스"></span>':'')+'</button>';
  }).join('');

    h += '<button class="'+(S.sort==='c'?'on':'')+'" onclick="setSort(\'c\')">🔥 화제순</button>';

  }

}

  var hot = n.c > 1 ? '<span class="hot'+(n.c>=5?' big':'')+'">🔥 언론 '+n.c+'곳</span>' : '';
  var isNew = prev && n.a > prev ? ' <span class="new">NEW</span>' : '';
  return '<a class="card" href="'+esc(n.u)+'" target="_blank" rel="noopener" data-s="'+esc(n.su||'')+'" data-so="'+esc(n.so)+'">'+
    '<div class="meta">'+hot+esc(RL[n.r]||'')+' · '+esc(n.so)+' · '+esc(n.tm)+isNew+'</div>'+
    '<div class="title">'+esc(n.s)+'</div>'+(n.t?'<div class="orig">'+esc(n.t)+'</div>':'')+'</a>';
}
function renderMain(){
  var t = D.themes[S.tab], list = sorted(visible(t), t.breaking), prev = S.prev[t.name] || 0;
  var h = '<h2>'+esc(t.name)+'</h2>' + (t.note ? '<p class="note">'+esc(t.note)+'</p>' : '');
  var fresh = prev ? list.filter(function(n){ return n.a > prev; }).length : 0;
  if(S.onlyNew){                                // '새 기사만 보기' 중
    list = list.filter(function(n){ return n.a > prev; });
    h += '<button class="newbar" onclick="onlyNew(false)">🆕 새 기사 '+list.length+'개만 보는 중 · 전체 보기</button>';
  } else if(fresh && !t.breaking){              // 새 기사가 정렬 때문에 아래로 밀려도 바로 찾을 수 있게
    h += '<button class="newbar" onclick="onlyNew(true)">🆕 새 기사 '+fresh+'개 · 새 기사만 보기</button>';
  }
  if(!list.length) h += '<p class="none">'+(S.region==='all' ? '최근 ' + (t.breaking?'속보':'기사') + ' 없음' : esc(RL[S.region])+' 기사 없음')+'</p>';
  h += list.slice(0, S.shown).map(function(n){ return card(n, prev); }).join('');
  var extra = list.length - S.shown;
  if(extra > 0) h += '<button class="more" onclick="more()">더보기 ▾  ('+extra+'개 더)</button>';
  else if(S.shown > D.show) h += '<button class="more" onclick="less()">접기 ▴</button>';
  var auto = Object.keys(D.auto);
  h += '<footer>업데이트 '+esc(D.updated)+' · 최근 3일 · 믿을 만한 언론사 기사만 · 기사를 누르면 한국어 요약 → 원문 보기<br>'+
       '🔥 언론 N곳 = 같은 소식을 보도한 언론사 수 (많을수록 화제) · <span style="color:var(--red)">●</span> = 새 뉴스'+
       '<br><br><b>자동으로 추가된 언론사</b> (주요 언론보다 먼저 보도하고, 주요 언론도 함께 다룬 소식이 많은 곳 · 최근 14일)'+
       (auto.length ? auto.map(function(k){ return '<div>'+esc(k)+': '+esc(D.auto[k].join(', '))+'</div>'; }).join('') : '<div>아직 없음</div>')+
       '</footer>';
  $('main').innerHTML = h;
}
function openTab(i){
  var t = D.themes[i];
  S.tab = i; S.shown = D.show; S.onlyNew = false; save('tabname', t.name);
  if(!(t.name in S.prev)) S.prev[t.name] = S.seen[t.name] || 0;     // 이 탭에서 NEW 로 보여줄 기준
  S.seen[t.name] = Math.max(S.seen[t.name] || 0, newest(t)); save('seen', S.seen);  // 탭에 들어오면 레드닷 지움
  history.replaceState(null, '', '#t'+i);
  renderTabs(); renderCtrl(); renderMain(); window.scrollTo(0, 0);
}
function setSort(k){ S.sort = k; save('sort', k); S.shown = D.show; renderCtrl(); renderMain(); }
function setRegion(k){ S.region = k; save('region', k); S.shown = D.show; renderTabs(); renderCtrl(); renderMain(); }
function more(){ S.shown += 20; renderMain(); }
function onlyNew(on){ S.onlyNew = on; S.shown = D.show; renderMain(); }
function less(){ S.shown = D.show; renderMain(); window.scrollTo(0, 0); }
$('upd').textContent = '업데이트 ' + D.updated + ' · 탭을 눌러 테마별 뉴스 보기';

// 🚨 미국 속보 · 🌏 해외 속보는 페이지를 새로 올리지 않아도 최신 내용을 바로 가져옴
function refreshBreaking(){
  if(!window.fetch) return;
  fetch(D.breaking_url + '?t=' + Date.now(), {cache:'no-store'}).then(function(r){ return r.json(); }).then(function(b){
    var all = b.items || [];
    D.themes.forEach(function(t, i){
      if(!t.breaking) return;
      var items = all.filter(function(n){ return n.theme === t.name; }).map(function(n){
        var d = {s:n.show, so:n.source||'', tm:n.time||'', c:n.count||1, r:n.rk||'us', u:n.url||n.link, p:Math.floor(n.pub), a:Math.floor(n.added||n.pub)};
        if(n.show !== n.title) d.t = n.title; if(n.sum) d.su = n.sum; return d;
      });
      if(!items.length && t.items.length) return;
      t.items = items;
      if(S.tab === i){ S.seen[t.name] = Math.max(S.seen[t.name]||0, newest(t)); save('seen', S.seen); renderMain(); }
    });
    renderTabs();
  }).catch(function(){});
}
openTab(S.tab);
refreshBreaking();
setInterval(refreshBreaking, 5 * 60 * 1000);
document.addEventListener('visibilitychange', function(){ if(!document.hidden) refreshBreaking(); });

// 기사를 누르면 먼저 한국어 요약 → 원문 볼지 선택
document.addEventListener('click', function(e){
  var c = e.target.closest('a.card'); if(!c) return;
  if(e.ctrlKey||e.metaKey||e.shiftKey) return;
  e.preventDefault();
  $('s-meta').innerHTML = c.querySelector('.meta').innerHTML;
  $('s-title').textContent = c.querySelector('.title').textContent;
  var o = c.querySelector('.orig'); $('s-orig').textContent = o ? o.textContent : '';
  var sm = c.dataset.s || '';
  $('s-sum').textContent = sm || '이 기사는 요약을 가져오지 못했어요. (사이트가 자동 접속을 막았거나 아직 준비 중)';
  $('s-sum').className = 's-sum' + (sm ? '' : ' empty');
  $('s-go').href = c.href;
  // 외국어 기사면 ✦ Gemini 버튼 보이기 (한국어 기사는 숨김)
  var foreign = !!o || !/[가-힣]/.test(c.querySelector('.title').textContent);   // 번역이 안 됐어도 외국 기사면 버튼 표시
  $('s-cs').hidden = $('s-ct').hidden = $('s-cnote').hidden = !foreign;
  if(foreign){
    // 원문을 열고, Gemini 가 '지금 화면'의 기사를 읽고 답하도록 요청 문장만 복사
    $('s-cs').href = $('s-ct').href = c.href;
    $('s-cs').dataset.q = '이 페이지의 기사 전체를 처음부터 끝까지 읽고 한국어로 요약해 줘. 핵심 내용 3~5줄, 그리고 투자자 입장에서 중요한 숫자와 의미를 짧게 정리해 줘.';
    $('s-ct').dataset.q = "너는 어려운 경제 뉴스를 초등학생도 이해할 수 있게 풀어 주는 친절한 번역가야.\n이 페이지의 뉴스 기사 전체를 쉬운 한국어로 번역해 줘.\n\n[가장 중요한 규칙]\n- 쉽게 쓰더라도 기사 내용은 정확해야 해. 사실을 빼거나, 바꾸거나, 지어내지 마.\n- 기사 순서대로, 빠지는 내용 없이 번역해 줘.\n\n[쉽게 쓰는 방법]\n1. 한 문장에는 한 가지 내용만 써 줘. 문장은 짧게.\n2. \"~습니다/~해요\"체로 친절하게 써 줘.\n3. 어려운 말은 쉬운 말로 바꾸고, 꼭 필요한 전문 용어는 처음 나올 때 괄호로 뜻을 풀어 줘.\n   (예: 금리(돈을 빌릴 때 내는 이자의 비율), 실적(회사가 번 돈과 성과), 주가(회사 주식 한 주의 가격))\n4. 한자어·외래어보다 쉬운 우리말을 먼저 써 줘. (예: 하락 → 떨어졌어요, 상승 → 올랐어요)\n5. 큰 숫자는 읽기 쉽게 바꾸되 정확한 값은 지켜 줘. (예: $2.5 billion → 25억 달러(약 3조 5천억 원쯤))\n   환율로 바꾼 값은 \"약\"을 붙여서 대략이라는 걸 알려 줘.\n6. 회사·사람 이름은 한국에서 부르는 이름으로 쓰고, 처음 나올 때만 괄호에 영어 이름을 적어 줘. (예: 엔비디아(Nvidia))\n7. 누가 한 말인지 분명하게 써 줘. (예: 젠슨 황 대표는 \"…\"라고 말했어요.)\n\n[출력 형식]\n① 한 줄 요약: 이 기사가 무슨 이야기인지 한 문장으로\n② 쉬운 번역: 기사 순서대로\n③ 어려운 말 풀이: 기사에 나온 경제 용어 3~5개를 한 줄씩 쉽게 설명\n④ 그래서 무슨 뜻이야?: 이 소식이 주식 투자하는 사람에게 왜 중요한지 2~3줄\n   (기사에 나온 사실만 근거로, 내 생각이나 예측은 넣지 마)\n\n기사가 길어서 한 번에 다 못 하면, 어디까지 했는지 알려 주고 내가 \"계속\"이라고 하면 이어서 해 줘.";
  }
  $('dim').hidden = false; $('sheet').hidden = false; $('sheet').scrollTop = 0;
  document.body.style.overflow = 'hidden';
});
// ✦ 버튼: Gemini 요청 문장을 복사하고 원문을 엶 → 원문 화면에서 Gemini 를 불러 붙여넣기
function askAI(a){
  var q = a.dataset.q || '';
  try { if(navigator.clipboard) navigator.clipboard.writeText(q); } catch(e){}
  toast('요청 문장을 복사했어요 · 원문에서 측면 버튼 길게 → 「이 페이지에 관해 질문하기」 → 붙여넣기');
  setTimeout(closeSheet, 50);
}
function toast(msg){ var t = $('toast'); t.textContent = msg; t.hidden = false; clearTimeout(toast._t); toast._t = setTimeout(function(){ t.hidden = true; }, 4000); }
function closeSheet(){ $('dim').hidden = true; $('sheet').hidden = true; document.body.style.overflow = ''; }
document.addEventListener('keydown', function(e){ if(e.key==='Escape') closeSheet(); });
</script></body></html>
