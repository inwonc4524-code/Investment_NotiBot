<style>
@font-face{font-family:'ChosunIlboMyungjo';src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_one@1.0/Chosunilbo_myungjo.woff') format('woff');font-weight:normal;font-display:swap}
:root{color-scheme:dark;--bg:#262624;--card:#30302e;--card2:#3a3a37;--text:#faf9f5;--sub:#a6a39a;--line:#3e3e3a;--acc:#d97757;--red:#ef4444}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.55 'ChosunIlboMyungjo',Georgia,"Noto Serif KR",serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:760px;margin:auto}
header{padding:20px 16px 8px}
h1{font:600 22px/1.3 'ChosunIlboMyungjo',Georgia,serif;margin:0 0 4px}
.upd{color:var(--sub);font-size:12.5px}
/* 테마 탭 */
.tabs{position:sticky;top:0;z-index:3;background:rgba(38,38,36,.96);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.tabrow{display:flex;gap:8px;overflow-x:auto;padding:12px 16px 10px;scrollbar-width:none}.tabrow::-webkit-scrollbar{display:none}
.tab{position:relative;flex:none;padding:9px 15px;border-radius:12px;border:1px solid var(--line);background:var(--card);

.tab b{margin-left:5px;color:var(--sub);font-weight:400;font-size:12px}
.tab.on{background:var(--acc);border-color:var(--acc);color:#1f1e1d;font-weight:600}.tab.on b{color:#1f1e1d}
.dot{position:absolute;top:-3px;right:-3px;width:11px;height:11px;border-radius:50%;background:var(--red);border:2px solid var(--bg)}
/* 정렬·국가 */
.ctrl{display:flex;gap:6px;overflow-x:auto;padding:0 16px 10px;scrollbar-width:none}.ctrl::-webkit-scrollbar{display:none}
.ctrl button{flex:none;border:1px solid var(--line);background:transparent;color:var(--sub);border-radius:8px;padding:5px 11px;font:inherit;font-size:12.5px}
.ctrl button.on{background:var(--card2);border-color:var(--card2);color:var(--text)}
.ctrl .sep{flex:none;width:1px;background:var(--line);margin:2px 4px}
main{padding:6px 12px 48px}
h2{font:600 19px/1.3 'ChosunIlboMyungjo',Georgia,serif;margin:16px 4px 2px}
.note{margin:0 4px 10px;color:var(--sub);font-size:12px}
.none{color:var(--sub);margin:24px 4px;text-align:center}
.card{display:block;background:var(--card);border-radius:12px;padding:12px 14px;margin:8px 0;color:var(--text);text-decoration:none;transition:background .15s}
.card:hover{background:var(--card2)}.card:active{opacity:.75}
.meta{color:var(--sub);font-size:12px}
.title{font-weight:500;margin-top:3px}
.orig{color:var(--sub);font-size:12px;margin-top:3px}
.new{margin-left:4px;color:var(--red);font-size:11px;font-weight:700;letter-spacing:.3px}
.hot{display:inline-block;margin-right:6px;padding:0 6px;border-radius:4px;background:rgba(217,119,87,.16);color:var(--acc);font-weight:600}
.hot.big{background:var(--acc);color:#1f1e1d}
.newbar{display:block;width:100%;margin:2px 0 6px;padding:9px;border:0;border-radius:10px;background:rgba(239,68,68,.14);color:#fca5a5;font:inherit;font-size:13px;text-align:left}
.more{display:block;width:100%;margin:4px 0 0;padding:10px;border:1px dashed var(--line);border-radius:12px;background:transparent;color:var(--sub);font:inherit;font-size:13px}
footer{margin:36px 4px 0;padding-top:14px;border-top:1px solid var(--line);color:var(--sub);font-size:12px;line-height:1.7}
footer b{color:var(--text);font-weight:600}
/* 요약 창 */
#dim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:5}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:6;max-width:760px;margin:auto;max-height:82vh;overflow-y:auto;
  background:var(--card);border-radius:16px 16px 0 0;padding:10px 18px calc(18px + env(safe-area-inset-bottom));box-shadow:0 -8px 30px rgba(0,0,0,.4)}
.grab{width:38px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 12px}
.s-title{font-size:17px;font-weight:600;margin:4px 0 2px;line-height:1.45}
.s-label{margin:16px 0 4px;color:var(--acc);font-size:12px;font-weight:700;letter-spacing:.5px}
.s-sum{font-size:15px;line-height:1.75}.s-sum.empty{color:var(--sub);font-size:13.5px}
.s-btns{display:flex;gap:8px;margin-top:20px}
.s-btns a{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;padding:11px 6px;border-radius:10px;font:inherit;font-size:13.5px;line-height:1.3;text-decoration:none;
  background:var(--acc);color:#1f1e1d;font-weight:600}
.s-btns a.cl{background:transparent;border:1px solid var(--acc);color:var(--acc)}
.s-close button{width:100%;margin-top:8px;padding:11px;border-radius:10px;background:transparent;border:1px solid var(--line);color:var(--sub);font:inherit;font-size:14px}
.s-cnote{margin-top:8px;color:var(--sub);font-size:11.5px;text-align:center}
#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);z-index:9;max-width:90%;padding:10px 16px;border-radius:10px;background:#faf9f5;color:#1f1e1d;font-size:13.5px;box-shadow:0 6px 20px rgba(0,0,0,.4)}

":"11/10 19:57","c":6,"r":"cn","u":"https://m.cls.cn/detail/2530500","p":1794308273,"a":1794316482,"t":"美联储12月会议悬念升级 理事沃勒称不排除加息50基点","su":"Financial Associated Press, 11월 10일자(자오 하오 편집자) 크리스토퍼 월러 연방준비제도(Fed) 총재는 화요일(11월 10일)에 연방준비제도(Fed)가 12월에 금리를 인상하는 것을 지지한다고 말했습니다. 그는 또한 인플레이션이 계속 가속화되면 연준의 신뢰도를 유지하기 위해 50bp의 일회성 금리 인상을 지원할 것이라고 경고했습니다. Waller의 무뚝뚝한 진술은 연준 관계자로부터 나온 가장 강력한 매파적 신호 중 하나입니다. 그는 정책 입안자들이 12월에 금리를 인상해야 할 뿐만 아니라 금리 인상이 현재 시장에서 예상되는 25bp를 초과해야 할 수도 있다고 생각합니다. 월러는 런던에서 미국 경제가 여전히 강하고 노동시장도 안정적이지만 인플레이션은 여전히 ​​너무 높다고 말했습니다."},{"s":"[뉴욕증시] 반등 흐름에 찬물 끼얹은 CPI…하락 마감","so":"연합인포맥스","tm":"11/11 06:57","c":5,"r":"kr","u":"https://news.einfomax.co.kr/news/articleView.html?idxno=4444062","p":1794347844,"a":1794350618,"su":"뉴욕증시의 3대 주가지수가 동반 약세를 보였다.미국 10월 소비자물가지수(CPI)가 예상보다 더 뜨겁게 나오면서 연말 금리인상이 불가피하다는 인식이 매도 심리를 자극했다.크리스토퍼 월러 미국 연방준비제도(Fed·연준) 이사가 50bp 금리인상 가능성을 들고나온 점도 국채금리 급등을 유도하며 증시에 부담을 줬다.10일(미국 동부시간) 뉴욕증권거래소(NYSE)에서 다우존스30산업평균지수는 전장보다 157.86포인트(0.30%) 떨어진 52,231.89에 마감했다.스탠더드앤드푸어스(S&P) 500지수는 전장보다 29.01포인트(0.38"},{"s":"[모닝포스트] 한밤중에 발생한 대규모 지진으로 미국 증시와 원유, 금이 일제히 하락했다. 연준의 금리 인상에 대한 베팅이 늘었고 미국 채권은 매도세를 겪었습니다. 인류의 IPO가 새로운 진전을 이루었습니다","so":"财联社电报","tm":"11/11 10:11","c":4,"r":"cn","u":"https://m.cls.cn/detail/2530870","p":1794359491,"a":1794361862,"t":"【早报】深夜巨震，美股、原油、黄金全线下挫；美联储加息押注升温，美债遭遇抛售潮；Anthropic IPO有新进展","su":"宏观新闻 1、国务院总理李强日前签署国务院令，公布修订后的《基金会管理条例》，自2027年1月1日起施行。《条例》共8章79条，修订内容主要包括完善总体原则要求、健全登记管理制度、完善内部治理机制、规范活动管理、加强信息公开和行业自律、强化综合监管。 2、中共中央政治局委员、国务院副总理张国清9日至10日在上海调研。他强调，要扎实推进科技创新和产业创新深度融合，持续提升产业创新能力，更好服务支撑经济高质量发展。他还强调，要创新消费场景、推动消费升级，以“六张网”建设为契机推进重大项目建设，纵深推进全国统一大市场建设，深化“内卷式”竞争综合整治，加力解决拖欠企业账款问题。"},{"s":"‘빅스텝 올 수도’ 금리 우려에 뉴욕증시 또 충격…불륜 스캔들發 엔비디아 추락도 계속 [투자360]","so":"헤럴드경제","tm":"11/11 08:00","c":4,"r":"kr","u":"https://biz.heraldcorp.com/article/10932887","p":1794351624,"a":1794361763,"su":"미국의 10월 소비자물가지수(CPI)가 시장 예상치를 웃돈 가운데 연방준비제도(Fed·연준) 고위 인사들이 추가 긴축 필요성을 강조하면서 뉴욕증시 3대 지수가 일제히 하락"},{"s":"미국 주식 ｜ CPI가 뜨겁고 4대 지수가 모두 어둠 속에 있고 Huida가 다시 5% 이상 하락했으며 TSMC AD 現優異 留意回檔布局機會 | 市場焦點 | 證券","su":"통계에 따르면 1950년 이후 미국 중간선거 이후 12개월 동안 S&P500 지수는 평균 15.1% 상승했다. 법무법인은 정치적 불확실성 해소가 주식시장에 이익이 되겠지만 여전히 지정학과 AI 투자가 2대 관측지표라고 지적했다."},{"s":"\"미국 주식\" 뉴스: 골드만삭스 CEO는 AI 자금 조달 수요에 대해 낙관적이며 Fed 관계자는 인플레이션 압력을 경고합니다.","so":"旺得富理財網","tm":"11/10 11:40","c":2,"r":"tw","u":"https://wantrich.chinatimes.com/news/20261110900178-420201","p":1794278415,"a":1794298326,"t":"《美股》消息面：高盛執行長看好AI融資需求聯準會官員示警通膨壓力- 國際","su":"[류지강 종합외신보도 타임즈 편집] 뉴스: ● 지난 9일 미국 상원은 미국의 중요 인프라 검토 과정을 대폭 가속화할 수 있는 초당적 법안을 발의했습니다. 법안이 찬성 73표, 반대 25표로 통과된 뒤 상원은 향후 의회에서 공식 통과될 것으로 예상되는 초당적 미국 일자리 창출법(BAAJA)에 대한 논의를 시작할 수 있었다. 동시에 트럼프 대통령도 법안에 대한 지지를 표명했다. BAAJA를 사용하면 다음을 수정할 수 있습니다..."},{"s":"미국 CPI가 12월 금리 인상 베팅을 굳히면서 주식은 이익, 달러 및 수익률을 줄였습니다.","so":"Reuters","tm":"11/10 11:23","c":2,"r":"us","u":"https://www.reuters.com/world/china/global-markets-wrapup-1-2026-11-10/","p":1794277380,"a":1794320958,"t":"Stocks cut gains, dollar and yields up as US CPI cements December rate hike bets"},{"s":"MAG7의 수익 엔진은 계속 작동합니다. 이 미국 주식 ETF는 미국 주식의 혁신과 성장을 위한 새로운 기회를 포착합니다.","so":"經濟日報","tm":"11/10 08:57","c":2,"r":"tw","u":"https://money.udn.com/money/story/5618/9868104?from=edn_newest_index","p":1794268639,"a":1794298328,"t":"MAG7獲利引擎持續運轉 這檔美股 ETF 掌握美股創新成長新契機","su":"미국 중간선거가 끝난 뒤 시장에서는 AI 데이터센터 규제정책, 에너지 공급, 대형 기술기업의 자본지출 실효성에 대한 의구심이 커지면서 미국 기술주에 단기적인 큰 변동이 발생했다. 그러나 투자자들이 기업 이익, AI 상용화 진행, 클라우드 수요 증가에 다시 초점을 맞추면서 UOB투자신탁은 이러한 조정의 물결이 AI 산업 추세의 역전보다는 재평가 쪽으로 더 편향되어 있다고 보고 있다."},{"s":"Xie Jinhe: 월스트리트 AI 경기장의 학살, 절단된 손과 발 | 잡지","so":"UDN","tm":"11/11 14:56","c":1,"r":"tw","u":"https://udn.com/news/story/6851/9871397","p":1794376568,"a":1794377515,"t":"謝金河：血洗華爾街AI擂台斷手斷腳| 雜誌","su":"지난 11월 4일 전 세계의 이목을 집중시켰던 미국 중간선거가 발표됐다. 예상대로 트럼프가 이끄는 공화당은 완패했다. 상원에 대한 안정적인 통제권을 잃었을 뿐만 아니라, 하원도 빼앗겨 완전히 무기력한 대통령이 됐다. 이 결과는 월스트리트에 충격을 주었다."},{"s":"미국 주식은 하루 23시간 거래됩니다. 개인 투자자들에게는 축복일까요, 저주일까요? |량 웨이콩","so":"加拿大星島日報","tm":"11/11 14:56","c":1,"r":"hk","u":"https://www.singtao.ca/7681199/2026-11-10/news-%E7%BE%8E%E8%82%A1%E6%AF%8F%E6%97%A5%E4%BA%A4%E6%98%9323%E5%B0%8F%E6%99%82+%E6%95%A3%E6%88%B6%E6%98%AF%E7%A6%8F%E9%82%84%E6%98%AF%E7%A6%8D%EF%BC%9F%EF%BD%9C%E6%A2%81%E5%81%89%E8%81%B0/","p":1794376562,"a":1794377521,"t":"美股每日交易23小時 散戶是福還是禍？｜梁偉聰","su":"미국 주식은 하루 23시간 거래됩니다. 개인투자자들은 축복인가, 저주인가? | Waichung Leung 과거 홍콩 투자자들은 엔비디아와 테슬라를 사고 싶어했지만 미국 주식을 보기 위해 밤늦게까지 자야 하는 경우가 많았습니다. 하지만 다음 달부터는 상황이 완전히 달라질 수도 있다. 나스닥(나스닥)은 12월 6일부터 미국 주식 거래 시간을 주 5일, 하루 23시간으로 연장할 계획이다. 미국 겨울 시간을 환산하기 위해 새로운 야간 거래 시간이 추가됐다. 홍콩 주식 거래 시간은 정확히 오전 10시부터 오후 5시로 홍콩 주식 거래 시간과 거의 겹친다. 즉, 앞으로 홍콩 투자자들은 중개업체가 관련 서비스를 제공하는 한 아침 식사 후에 텐센트와 엔비디아를 구입할 수 있습니다. 브로커에게 반드시 나쁜 소식은 아니지만 홍콩 증권사에 반드시 나쁜 소식은 아닙니다. 과거에는 미국 주식이 홍콩에서 주로 심야에 거래되었지만 이제는 고객이 낮에도 사고 팔 수 있게 되어 중개회사가 더 많은 투자자를 유치하고 거래 수수료 및 외환 수익을 늘릴 수 있는 기회를 제공합니다."},{"s":"미국 주식은 흑자 마감, 대만 주식은 상승, TSMC의 \"AI 거인에 대한 투자\"는 이익 발표","so":"公視新聞","tm":"11/11 14:28","c":1,"r":"tw","u":"https://news.pts.org.tw/article/835236","p":1794374923,"a":1794377516,"t":"美股收黑、台股開高 台積電「投資AI巨頭」釋利多","su":"AI 투자 우려와 인플레이션 문제의 지속적인 영향으로 미국 4대 주요 주가지수가 화요일 모두 흑자로 마감됐다. 그러나 대만 주식을 보면 지난 9일 금융감독위원회가 단기 명령을 내렸고, 국가안보기금도 10차 시장보호에 나섰다. 그 과정에서 \"사기 안정\" 상황이 발생했습니다. 오늘(11일) 대만 증시는 43,135포인트 상승하며 43,000포인트를 회복했습니다. 전자주식 TSMC도 2,330위안으로 상승세를 기록했다. 또한, TSMC는 두 개의 주요 AI 거대 기업인 앤트로픽과 오픈AI에 최대 10억 달러를 투자하겠다고 발표하면서 업계에 긍정적인 소식을 가져왔습니다."},{"s":"다우, S&P500, 나스닥 선물은 뜨거운 인플레이션 데이터 및 엔비디아 손실 이후 상승: CRWV, TTWO, NLST, NBIS 초점","so":"Yahoo Finance","tm":"11/11 12:51","c":1,"r":"us","u":"https://finance.yahoo.com/markets/stocks/articles/dow-p-500-nasdaq-futures-035115158.html","p":1794369060,"a":1794377512,"t":"Dow, S&P 500, Nasdaq Futures Edge Higher After Red-Hot Inflation Data And Nvidia Losses: CRWV, TTWO, NLST, NBIS In Focus","su":"10월 소비자물가지수 데이터는 전월 대비 0.4% 상승해 컨센서스 예상치를 웃도는 상승세를 보였습니다."},{"s":"[뉴스프레소] 뉴욕증시, 물가 부담에 하락…코어위브 호실적, AI 투심 되살아나나 - 머니투데이","so":"머니투데이","tm":"11/11 12:40","c":1,"r":"kr","u":"https://www.mt.co.kr/world/2026/11/11/2026111111327039163","p":1794368418,"a":1794377512,"su":"주거비를 뺀 근원 서비스물가도 0.4% 올랐고, 나스닥은 0.74% 하락했습니다. ▶ 월러가 제시한 0.3%…12월 빅스텝 논의 월러 연준 이사는 지표 발표 전 근원 CPI가 0.3% 이상 오르면 12월에 0.5%포인트 인상도 검토해야 한다고 밝혔습니다."},{"s":"Huida는 계속 하락하고 반도체주은 거의 5조 달러 증발했으며 Bank of America는 S&P500 자체가 더 위험하다고 경고합니다.","so":"鉅亨網","tm":"11/11 12:20","c":1,"r":"tw","u":"https://news.cnyes.com/news/id/6657920","p":1794367205,"a":1794377519,"t":"輝達跌不停、晶片股蒸發近5兆美元 美銀示警標普500本身風險更大","su":"Bank of America Subramanian은 세계에서 가장 붐비는 거래 대상은 S&P 지수 자체라며 S&P500 지수가 고위험 지수라고 경고했습니다.\n10월 CPI가 예상보다 높았던 이후 S&P500 선물은 5분 만에 약 0.5% 하락했습니다. 미국 5년만기 국채수익률은 9월 이후 최대 상승률을 기록했고, 10년만기 국채수익률은 잠시 5%를 넘어섰다.\nHuida는 화요일에 약 6% 하락했고, 반도체주은 10월 6일 이후 시장 가치가 거의 5조 달러 손실되었습니다. 같은 기간 S&P500 동일가중지수는 약 4% 상승했다."},{"s":"S&P500 선물, CPI 소화 속 코어위브 실적 발표 후 반등","so":"연합인포맥스","tm":"11/11 12:03","c":1,"r":"kr","u":"https://news.einfomax.co.kr/news/articleView.html?idxno=4444176","p":1794366194,"a":1794367352,"su":"11일 오전 아시아 시장에서 미국 주가지수 선물은 예상보다 강한 미국 물가 지표를 소화하는 가운데, 인공지능(AI) 클라우드 기업 코어위브 실적 발표 후 반등하는 모습을 나타냈다.연합인포맥스 지수선물 통합화면(화면번호 6520)에 따르면 한국 시각으로 오전 10시3분 기준 E-미니 S&P500 지수 선물은 전장 대비 0.38% 오른 7,572.00에 거래됐다.기술주 중심의 E-미니 나스닥100 지수 선물은 전장 대비 0.73% 상승한 28,046.00을 나타냈다.간밤 뉴욕증시는 엔비디아 약세와 예상보다 높은 미국 10월 소비자물가"},{"s":"Fed Goolsby: 가격 압력이 확산되고 있는 것으로 보이며 서비스 부문 인플레이션은 줄어들지 않았습니다.","so":"Jiemian.com","tm":"11/11 12:00","c":1,"r":"cn","u":"https://m.jiemian.com/article/15319597.html","p":1794366002,"a":1794367417,"t":"美联储古尔斯比：价格压力似乎正在蔓延，服务业通胀并未回落","su":"美联储古尔斯比表示，最新的政府通胀报告显示潜在趋势并未好转，这“令人有些担忧”；尤其值得关注的是，价格压力似乎正在蔓延，已不仅限于能源价格或人工智能（AI）相关领域。古尔斯比称，“我所担心的是，这种通胀压力正演变为整体经济过热——各类商品和服务价格的上涨速度过快，远高于我们设定的2%的通胀目标。”（新华财经）"},{"s":"피터 쉬프 \"美 물가상승률 내년 7% 넘을 것…연준, 금리 200bp 올려야\"","so":"연합인포맥스","tm":"11/11 11:56","c":1,"r":"kr","u":"https://news.einfomax.co.kr/news/articleView.html?idxno=4444170","p":1794365781,"a":1794367352,"su":"월가의 대표적인 비관론자이자 금 투자 옹호론자인 피터 쉬프가 미국의 인플레이션이 내년 7%를 넘어설 것이라며 연방준비제도(Fed·연준)의 공격적인 금리 인상을 촉구했다.쉬프는 10일(현지시간) 자신의 엑스(X·옛 트위터)를 통해 \"미국의 소비자물가지수(CPI) 상승률이 올해 5%에 달하고, 내년에는 7%를 넘어설 가능성이 크다\"며 이같이 전망했다.그는 \"연준이 계획하고 있는 ews Agency, 11월 10일(Liu Rui 편집자) 최근 Royal Bank of Canada Capital Markets, JP모건 Chase 및 모건스탠리의 전략가들은 연구 보고서를 통해 고객에게 최근 미국 주식 매도세가 끝날 가능성이 높다고 말했지만 2027년에도 여전히 펀더멘털이 핵심 변수가 될 것임을 상기시켰습니다."},{"s":"미국 CPI는 10월 발표되며 연준의 금리 결정에 결정적인 변수가 될 예정이다.","so":"21财经","tm":"11/10 10:52","c":1,"r":"cn","u":"https://www.21jingji.com/article/20261110/herald/18341fdf7efaef7fe35cfd9b026c5980.html","p":1794275520,"a":1794298320,"t":"10月美国CPI将公布，将是美联储利率决议的最终决定性变量","su":"많은 기대를 모았던 미국 10월 CPI가 11월 10일 베이징 시간 21시 30분에 공식 발표됩니다. 이는 연준의 12월 금리 결정에 영향을 미치는 핵심 지표입니다. 연방기금 금리선물의 가격을 보면, 현재 시장에서는 연준이 12월에 금리를 0.25%포인트 인상할 확률이 최대 80%에 달해 완전 가격 수준에 근접할 것으로 예상하고 있습니다. 10월 비농업 지표는 기대치를 뛰어넘었습니다(165,000개의 신규 일자리 창출, 실업률은 4.1%로 하락, 시급은 전월 대비 0.4% 증가). 고용 측면은 더 이상 금리 인상에 대한 제약이 되지 않습니다. 12월 금리 인상 여부를 결정하는 최종 결정변수는 CPI다. 최근 많은 고위 연준 관리들이 매파적인 신호를 발표했습니다. 데일리 샌프란시스코 연은 총재, 무살렘 세인트루이스 연은 총재, 윌리엄스 뉴욕 연은 총재는 모두 인플레이션이 여전히 높으며 인플레이션을 더 줄여야 한다고 강조했습니다."},{"s":"사진과 잠재력이 있습니다 | 미국 증시는 2% 상승하며 본격적인 반격에 나섰고, 유가는 4% 하락하며 중동은 희망을 보였다.","so":"香港經濟日報HKET","tm":"11/10 10:51","c":1,"r":"hk","u":"https://invest.hket.com/article/4222421/%E6%9C%89%E5%9C%96%E6%9C%89%E5%8B%A2%EF%BD%9C%E7%BE%8E%E8%82%A1%E6%BC%B22-%E5%85%A8%E9%9D%A2%E5%8F%8D%E6%94%BB%20%E6%B2%B9%E5%83%B9%E8%B7%8C4-%E4%B8%AD%E6%9D%B1%E7%8F%BE%E6%9B%99%E5%85%89%20HSI%E6%80%A5%E5%BD%88%E5%BE%8C%E6%95%B4%E5%9B%BA%E5%BE%85%E7%A0%B4%EF%BC%88%E6%8C%81%E7%BA%8C%E6%9B%B4%E6%96%B0%EF%BC%89","p":1794275484,"a":1794298334,"t":"有圖有勢｜美股漲2%全面反攻 油價跌4%中東現曙光 HSI急彈後整固待破（持續更新）|香港經濟日報"},{"s":"미국 주식 동향 | 중간선거 이후 투자에 대한 5대 오해, 국회 변화에 따른 성급한 매도 경고 전문가들","so":"etnet 經濟通","tm":"11/10 05:40","c":1,"r":"hk","u":"https://www.etnet.com.hk/www/tc/us-stocks/news-article/416070/%E7%BE%8E%E8%82%A1%E5%8B%95%E5%90%91+%7C+%E4%B8%AD%E6%9C%9F%E9%81%B8%E8%88%89%E5%BE%8C%E4%BA%94%E5%A4%A7%E6%8A%95%E8%B3%87%E8%AA%A4%E5%8D%80%EF%BC%8C%E5%B0%88%E5%AE%B6%E8%AD%A6%E5%91%8A%E5%8B%BF%E5%9B%A0%E5%9C%8B%E6%9C%83%E8%AE%8A%E5%A4%A9%E5%80%89%E4%BF%83%E6%8B%8B%E5%94%AE","p":1794256800,"a":1794298336,"t":"美股動向 | 中期 新药及递送系统全面合作协议","su":"온리콘은 쑤저우 루이지지에(Suzhou Ruizhijie), 마이크로엑스(MicroX)와 '혁신적인 약물 및 전달 시스템에 관한 포괄적 협력 협약'을 체결하고 3개의 혁신적인 약물 파이프라인에 대한 협력을 체결했다고 9일 밝혔다. 총 전임상 R&D 예산은 8,950만 위안이 될 것으로 예상된다. 올해 PCC 단계의 신규 R&D 투자액은 약 2,050만 위안이 될 것으로 예상된다. Jiemian News는 독립적으로 생각하는 사람들에게만 서비스를 제공합니다. 광고 등 상업적 협력을 원하시면 여기를 클릭하세요"},{"s":"3분기 보고서는 혁신적인 제약 산업 체인이 호황을 누리고 있음을 확인시켜 줍니다. 혁신신약 관련 ETF상품은 무엇을 선택해야 할까요? 홍콩 혁신 약물 ETF Invesco(513780)는 \"혁신 약물 + CXO\"의 이중 기회를 고려합니다.","so":"界面新闻","tm":"11/09 14:58","c":2,"r":"cn","u":"https://m.jiemian.com/article/15310497.html","p":1794203892,"a":1794206031,"t":"三季报验证创新药产业链高景气，创新药相关ETF产品选哪个？港股创新药ETF景顺(513780)兼顾“创新药+CXO”双线机遇","su":"홍콩 혁신 의약품 ETF Invesco(513780)는 CSI Hong Kong Stock Connect Innovative Drug Index(931250)를 밀접하게 추적합니다. 풍력 데이터에 따르면 Shenwan 2차 산업 분류에 따르면 지수의 상위 3대 가중치 산업은 생물 제품(44.45%), 화학 의약품(38.53%), 의료 서비스(17.02%)입니다."},{"s":"13:09:02 [홍콩 주식의 제약 부문은 초기 거래가 활발했으며 홍콩 증권 연결 혁신 약물 ETF E 펀드(159316)의 기초 지수가 1.6% 상승했습니다.]","so":"财联社","tm":"11/09 14:09","c":2,"r":"cn","u":"https://www.cls.cn/detail/2528744","p":1794200942,"a":1794206027,"t":"13:09:02【港股医药板块早盘活跃，港股通创新药ETF易方达（159316）标的指数上涨1.6%】","su":"회사 소개 웹사이트 성명 연락처 사용자 피드백 사이트 맵 도움말 홈 텔레그램 주제 시장 VIP FM 투자 연구 다운로드 모두 추가 Red Company 시청 홍콩 및 미국 주식 펀드 알림 2026년 11월 9일 13:09:02 홍콩 주식 제약 부문이 초기 거래에서 활발했고, Hong Kong Stock Connect Innovative Drug ETF E Fund(159316)의 기본 지수가 1.6% 상승했습니다. 홍콩 주식의 제약 부문이 초기 거래에서 활발했습니다. 정오 마감 기준으로 Hang Seng Stock Connect Hong Kong Innovative Drug Index는 1.6%, CSI Hong Kong Stock Connect Pharmaceutical and Healthcare Composite Index는 1.8%, CSI Innovative Drug Industry Index는 0.2%, CSI Biotechnology Theme Index는 0.2%, CSI 300 Healthcare Index는 0.2% 하락했다."},{"s":"Abbott, 이식형 심장율동전환기 제세동기 리드에 대해 FDA 승인 및 CE 마크 획득","so":"Fierce Biotech","tm":"11/11 15:25","c":1,"r":"us","u":"https://www.fiercebiotech.com/medtech/abbott-nabs-fda-approval-ce-mark-implantable-cardioverter-defibrillator-lead","p":1794378304,"a":1794378681,"t":"Abbott nabs FDA approval, CE Mark for implantable cardioverter-defibrillator lead","su":"Abbott는 UltiSynq 제세동 리드 기술에 대해 FDA와 CE 마크 승인을 모두 받았습니다. 이 기술은 | Abbott는 전도 시스템 조율 및 제세동 치료를 모두 제공하도록 설계된 UltiSynq 제세동 리드 기술에 대해 FDA 및 CE 마크 승인을 받았습니다."},{"s":"[너겟ETF] 통신ETF의 물량과 가격 모두 상승세를 보이고 있으며, 홍콩혁신신약ETF는 주로 저가 사냥을 하고 있다. 어느 것이 더 중요합니까?","so":"第一财经","tm":"11/11 15:06","c":1,"r":"cn","u":"https://www.yicai.com/vip/news/103436063.html","p":1794377185,"a":1794377537,"t":"[ 掘金ETF ] 通信ETF量价齐升，港股创新药ETF主力抄底，孰轻孰重？","su":"[오늘의 퀵뷰] 시장 스타일이 극단적으로 순환하고 있습니다. 자금은 방어적 소비, 의료, 고급 반도체에서 저급 기술 성장(AI, 통신, 컴퓨팅 파워)으로 전환되고 있습니다. 대중적인 커뮤니케이션 ETF의 자본 흐름을 추적한 결과, 대부분의 ETF가 거래량 및 가격 조정 추세를 보이는 것으로 나타났습니다. 반면 GEM 인공지능 ETF는 대부분 상승세를 통해 현금화하는 추세를 보입니다. 혁신의약품 홍콩주와 의료 ETF 홍콩주도 차별화를 보인다. 비교하면,"},{"s":"6가지 \"고가 항암제\"를 포함하여 상업적으로 보험이 적용되는 혁신 약물 권장 목록의 업계 버전이 여기에 있습니다.","so":"Jiemian.com","tm":"11/11 13:41","c":1,"r":"cn","u":"https://www.jiemian.com/article/15320099.html","p":1794372090,"a":1794377538,"t":"行业版商保创新药推荐清单来了，纳入6款“天价抗癌药”","su":"국가의료보험국의 상업 보험 혁신 의약품 목록 업데이트 전날, 중국 보험 협회(이하 '중국 보험 협회')가 편찬한 '상업 보험 의약품 권장 목록'의 산업판이 1년의 준비 끝에 마침내 발표되었습니다. 1차 배치에는 58개 의료기기가 포함됐는데, 이 중 의료보험 외 자기부담 의약품이 약 60%를 차지했고, 혁신 의약품이 전체의 거의 절반을 차지했다. 이 산업별 목록은 상업적으로 보장되는 혁신 의약품 목록과 다릅니다. 양 당사자 모두 기본 의료 보험 이외의 자체 자금 조달 혁신 제품에 초점을 맞추고 있지만 중국 보험 협회의 목록에는 혁신 및 임상 가치와 같은 차원 외에도 약물의 임상 적용, 보험 청구 경험 및 약물 수요 변화와 같은 시장 지향 변수가 추가로 포함됩니다. 이로 인해 선택된 품종의 첫 번째 배치는 \"종양학 약물 함량이 더 높다\"는 특징을 갖습니다. 더 많은 오리지널 약물과 CAR-T 제품이 포함되며, 신경퇴행성 질환 및 일부 희귀 질환 분야에서는 보다 신중한 선택 기준이 유지됩니다."},{"s":"독일 머크 힘줄 윤활막 거대 세포종 신약 FDA 승인","so":"약업신문","tm":"11/11 13:16","c":1,"r":"kr","u":"http://www.yakup.com/news/index.html?mode=view&cat=16&nid=335072","p":1794370560,"a":1794377535,"su":"독일 머크社는 자사의 새로운 1일 1회 경구용 집락형성 촉진인자-1 수용체(CSF-1R) 저해제의 일종인 ‘핌젯미’(Pimjetmi: 피미코티닙)가 FDA의 허가를 취득했다고 10일 공표했다.‘핌젯미’는 외과적 절제수술..."},{"s":"PIMJETMI®(피미코티닙)는 Abbisko Therapeutics에서 개발하고 Merck KGaA(독일 다름슈타트 소재)에서 라이선스를 받아 TGCT에 대해 미국 FDA 승인을 받았습니다. - 회사 발표 - FT.com","so":"Financial Times","tm":"11/11 13:05","c":1,"r":"world","u":"https://markets.ft.com/data/announce/detail?dockey=600-202611102305PR_NEWS_USPRX____CN94839-1","p":1794369900,"a":1794377539,"t":"PIMJETMI® (pimicotinib) Developed by Abbisko Therapeutics and Licensed by Merck KGaA, Darmstadt, Germany Receive U.S. FDA Approval for TGCT – Company Announcement - FT.com"},{"s":"등급 1점: 타이거메드, 해외 실험실 사업 매각하고 주요 임상 CRO 사업 집중","so":"第一财经","tm":"11/11 10:29","c":1,"r":"cn","u":"https://www.yicai.com/news/103435407.html","p":1794360589,"a":1794361870,"t":"壹评级：泰格医药剥离海外实验室业务，聚焦临床CRO主业","su":"{{aisd}} AI生成 免责声明 泰格医药近日公告，拟联合查尔斯河等主体先将控股子公司方达控股私有化，再实施分拆交易。第一财经“壹评级”认为，此举旨在剥离重资产海外实验室业务，将资源集中至具备比较优势的临床CRO主业，优化全球业务布局。 “壹评级”指出，海外实验室业务与临床CRO在运营模式、资产属性和资源投入上差异明显。在地缘环境复杂的背景下，单纯依靠项目交付难以快速提升海外市占率。公司选择保留境内业务及Acme Bioscience, Inc.，体现了对海外扩张路径的理性取舍。本次交易预计产生一次性收益，金额超过公司最近一个会计年度经审计净利润50%；其中，公司直接持股对应税费前现金对价约4.61亿元人民币。公司计划将约60%的交易所得用于海外业务拓展及潜在收购，以增强临床业务的获客能力。"},{"s":"FDA는 GLP-1 약물이 안과 질환의 위험을 증가시키고 시력을 영구적으로 손상시킬 수 있음을 의약품 제조업체에 표시하도록 요구합니다(Donnie Yen 보고).","so":"Now 新聞","tm":"11/11 08:38","c":1,"r":"hk","u":"https://news.now.com/home/international/player?newsId=669101","p":1794353905,"a":1794361870,"t":"FDA要求藥廠標明GLP-1藥物或增眼疾風險 可能令視力永久受損(甄子慧報道)","su":"【Now新聞台】美國食品及藥物管理局宣布，包括俗稱「瘦瘦針」的GLP-1藥物，必須標明可能引致罕見副作用，有機會令視力永久受損。"},{"s":"머크 KGaA, 희귀 종양 질환에 대해 FDA 승인을 받아 오노와 다이이치의 대결이 예고됨","so":"Fierce Pharma","tm":"11/11 07:45","c":1,"r":"us","u":"https://www.fiercepharma.com/pharma/merck-kgaa-lands-fda-nod-rare-tumor-disorder","p":1794350736,"a":1794362980,"t":"Merck KGaA lands FDA nod in rare tumor disorder, portending Ono, Daiichi showdown","su":"Merck KGaA just secured an FDA approval for its new once-daily oral colony stimulating factor-1 receptor (CSF-1R) inhibitor, adding to a growing list of regulatory checkmarks around the globe. | The FDA’s decision was based on Merck’s phase 3 Maneuver trial and follows similar approvals by other global regulators, including in China, Canada and Switzerland."},{"s":"의료기기 매출 ‘0’…5년만에 신약사업 포기도","so":"서울경제","tm":"11/11 07:00","c":1,"r":"kr","u":"https://www.sedaily.com/article/20112519","p":1794348006,"a":1794377535,"su":"의료기기 매출 ‘0’…5년만에 신약사업 포기도 ■바이오 신사업 진출기업 ‘빨간불’ 일진, 신약개발 계열사 철수 수순 웰리시스는 3년 영업손실 124억 KT도 6년전 진입에도 성과 없어 “ODM 협업 등 전략 없인 어려워” 바이오·헬스케어를 미래 성장동력으로 내세웠던 기업들의 신사업에 경고등이 켜졌다. 신약 개발 계열사의 직원이 7명에 그쳐 사업 정리를 검토하거나 수백억 원의 투자금을 유치하고도 적자를 벗어나지 못하는 사례가 잇따르고 있기 때문이다."},{"s":"희귀 양성 연조직 종양에 대한 또 다른 옵션이 FDA 승인을 받았습니다.","so":"MedPage Today","tm":"11/11 05:22","c":1,"r":"sg","u":"https://www.medpagetoday.com/hematologyoncology/othercancers/123817","p":1794342175,"a":1794350725,"t":"Another Option for Rare Benign Soft-Tissue Tumor Wins FDA Approval","su":"Pimicotinib achieved 54% objective response rate in unresectable tenosynovial giant cell tumor"},{"s":"바이엘, 2차 뇌졸중 위험 감소제로 선하보(Sunharbo) FDA 승인 획득","so":"Yahoo Finance","tm":"11/11 03:39","c":1,"r":"us","u":"https://finance.yahoo.com/healthcare/articles/bayer-wins-fda-approval-sunharbo-183900909.html","p":1794335940,"a":1794350725,"t":"Bayer Wins FDA Approval for Sunharbo for Secondary Stroke Risk Reduction","su":"Bayer gains FDA approval for Sunharbo, the first Factor XIa inhibitor approved worldwide, opening new growth opportunities in stroke prevention."},{"s":"这类创新药，不再受医院药品考核指标约束","so":"21财经","tm":"11/10 22:28","c":1,"r":"cn","u":"https://www.21jingji.com/article/20261110/herald/94f08eb3082d0ddc7b9f459735fdfa0e.html","p":1794317280,"a":1794350725,"su":"11月10日，国家卫生健康委、国家医保局、国家中医药局和国家疾控局联合印发《关于进一步做好创新药安全合理配备使用工作的通知》，围绕创新药安全合理配备使用的重点环节，从促进合理配备、加强培训指导、优化使用条件、完善管理举措等方面提出了具体政策措施。 ●二级以上医疗机构要优化完善创新药进院制度和工作流程，及时召开药事管理与药物治疗学委员会会议，讨论本机构基本用药供应目录更新调整事项，根据本机构业务能力和诊疗工作需要，及时将相关创新药纳入本机构用药目录。"},{"s":"上海莱士徐俊：中国创新药高质量发展，需要研发与制造协同发力","so":"新华网上海","tm":"11/10 22:13","c":1,"r":"cn","u":"http://sh.news.cn/20261110/fe45aa1826e2431d99d9e3fde244c5cf/c.html","p":1794316427,"a":1794350725,"su":"第九届进博会 | 上海莱士徐俊：中国创新药高质量发展，需要研发与制造协同发力-﻿视频链接：https:vodpub1.v.news.cnoriginal20261110567f98c952284e85ae05c3521a960afd.mp4新华网上海11月10日电（史依灵）第九届中国国际进口博览会期间，上海莱士副董事长、总经理徐俊在接受新华网专访时表示，公司正以“拓浆+脱浆”双轮驱动，在拓展血液制品品种及临床应用的同时，向创新药研发延伸，持续布局出凝血、炎症和免疫三大领域。"},{"s":"GenScript Biotech (01548) 기타-사업개발 최신","so":"信報網站","tm":"11/10 21:46","c":1,"r":"hk","u":"https://m.hkej.com/landing/mobarticle2/id/4562530/%25E9%2587%2591%25E6%2596%25AF%25E7%2591%259E%25E7%2594%259F%25E7%2589%25A9%25E7%25A7%2591%25E6%258A%2580%252801548%2529%2520%25E5%2585%25B6%25E4%25BB%2596-%25E6%25A5%25AD%25E5%258B%2599%25E7%2599%25BC%25E5%25B1%2595%25E6%259C%2580%25E6%2596%25B0%25E6%2583%2585%25E6%25B3%2581","p":1794314797,"a":1794316523,"t":"金斯瑞生物科技(01548) 其他-業務發展最新情況","su":"GenScript Biotech (01548) 자발적 발표: 상장 계열사 Legend Biotech Co., Ltd.의 2026년 9월 30일 마감 3분기 재무 결과(238KB, pdf)"},{"s":"中保协推出首版商业保险药品清单 医保局商业健康险创新药纳入9种","so":"财新","tm":"11/10 21:09","c":1,"r":"cn","u":"https://finance.caixin.com/2026-11-10/102503176.html","p":1794312540,"a":1794350725,"su":"【财新网】在医保的基础上，商业保险如何保障消费者在基本医保外的保障需求？11月10日，中国保险行业协会（下称“中保协”）针对商业医疗保险发布了三个示范条款和一份配套使用的药品清单，为短期、长期医疗险以及“惠民保”三类商业保险产品提供了条款和药品的基本“样板”。 中保协表示，近年来，商业医疗保险成为行业发展的主要增长点，也是服务民生保障的重要支撑，但与人民群众日益增长的健康保障需求相比仍有差距。一是各公司条款表述差异较大，免责条款、理赔材料等内容要求各异，免赔额等常用概念口径不一。二是行业已承担了相当数量的创新药保障，但离人民群众实际需求仍有差距，社会公众对相关保障的了解也比较有限，为将更多创新药纳入保障范围、更好管控风险、提升经营可持续性，亟需制定符合行业实际、契合商保经营规律的商保药品推荐清单。"},{"s":"Novocure denied FDA approval for Optune Mya cancer device after efficacy concerns","so":"Fierce Biotech","tm":"11/10 19:52","c":1,"r":"us","u":"https://www.fiercebiotech.com/medtech/novocure-denied-fda-approval-optune-mya-cancer-device-after-efficacy-concerns","p":1794307924,"a":1794350725,"su":"Novocure has been hit with a relatively rare “not approvable” letter from the FDA for its tumor-treating electric fields device. | Novocure has been hit with a relatively rare “not approvable” letter from the FDA for its tumor-treating electric fields device."},{"s":"판밍: 시장은 점차 바닥을 치고 반등을 준비하고 있습니다. 소비 및 혁신 의약품 분야에 주목하십시오.","so":"第一财经","tm":"11/10 16:41","c":1,"r":"cn","u":"https://www.yicai.com/video/103434373.html","p":1794296514,"a":1794316522,"t":"凡明：大盘逐渐筑底 酝酿反弹 关注消费和创新药板块"},{"s":"혁신신약, 바이오의약품, 생명과학서비스산업(1편)","so":"21财 위의 등장은 회사의 제품 구조 최적화와 전반적인 운영 효율성 향상을 직관적으로 반영합니다. 동시에 혁신의약품 매출 비중은 2024년 50% 분수령을 넘은 이후 꾸준히 증가해 2025년에는 의약품 매출 매출의 약 60%를 차지할 것으로 예상돼 항서제약의 성장동력과 가치평가 논리가 재편됐다."},{"s":"중국 국제 수입 박람회 개최: 25개 제약 회사가 AI를 활용하여 상업 보험 접근을 계획했으며 혁신적인 약품의 가격이 \"계리적 계산\"을 통해 조정되었습니다.","so":"每日经济新闻","tm":"11/08 22:33","c":1,"r":"cn","u":"https://www.nbd.com.cn/articles/2026-11-08/4641614.html","p":1794144780,"a":1794207263,"t":"直击进博会：25家药企借力AI布局商保准入，创新药被“精算”重新标价","su":"제9회 중국국제수입박람회 의약품전시관에는 수리겐오론자주사(상품명:카이리메이)라는 제품이 많은 관람객들의 눈길을 끌었다. 이는 고형암에 대해 승인된 세계 최초의 CAR-T 세포치료제입니다. CLDN18.2 양성, HER2 음성, 최소한 2차 치료에 실패한 환자에게 적합합니다."},{"s":"경산성 개산 요구, 바이오 의약의 제조 기술 개발과 거점 정비의 강화 목표","so":"日経バイオテクONLINE","tm":"11/08 20:30","c":1,"r":"jp","u":"https://bio.nikkeibp.co.jp/atcl/news/p1/26/09/18/15034/","p":1794137437,"a":1794148478,"t":"経産省概算要求、バイオ医薬の製造技術開発と拠点整備の強化目指す","su":"경제산업성은 2027년도 바이오 관련 예산으로 전년도 당초 예산비 513.2% 증가한 2129억엔을 요구했다. 2027년도부터 AMED 대상 경비인 '의료·건강추진사업'에서 '차세대치료·진단실현을 위한 창약기반기술개발사업'에서 새로운 테마를 설정함으로써 2026년도 예산비 151.7% 증가한 146억엔을 요구했으며, '재생의료·유전치료 산업화를 위한 2기 5개 기술 사업 또 2021년도, 2022년도의 보정예산으로 총 3500억엔을 기금으로 시작한 '창약벤처 에코시스템 강화사업'에 대해 2027년도에는 320억엔을 추가할 요구가 되었다. 본지에서는 경산성 예산 중 의약품·재생의료·의료기기·헬스케어 관련, 그린바이오 관련, 기타 바이오 관련, 독립행정법인의 운영비 교부금, 특허청의 바이오 관련 사업 등을 바이오 관련 예산으로 집계하고 있다."},{"s":"의약품 보험 게임은 '하나의 보험, 하나의 정책' 단계에 진입했으며 혁신적인 제약회사는 상업 보험과의 대화 방법을 모색하고 있습니다.","so":"第一财经","tm":"11/08 20:14","c":1,"r":"cn","u":"https://www.yicai.com/news/103431200.html","p":1794136470,"a":1794207264,"t":"药险博弈进入“一保一策”阶段，创新药企探寻商保对话路径","su":"{{aisd}} AI 생성 면책조항 제약회사 액세스 팀은 새로운 딜레마에 빠질 수 있습니다. 통합된 카탈로그가 없고 \"하나의 보증, 하나의 정책\"만 있을 뿐입니다. 상업 보험 시장은 정보가 분산되어 있고, 규칙이 혼란스럽고, 여러 질병 분야에서 보험 부채와 지급 조건이 중복되어 접근 기회를 선별하고 우선순위를 정하기가 어렵습니다. 한 제약회사의 인터뷰 대상자는 신약이 출시된 후 \"희민바오를 도시마다 운영하면서 지역 희민바오 특수 의약품 카탈로그와 전국 상업 보험 혁신 의약품 카탈로그의 변화를 동시에 모니터링\"해야 한다고 언급한 적이 있습니다. 상업용 보험이 혁신적인 의약품의 상용화를 위한 중요한 지불 수단으로 자리잡고 있습니다. 그러나 기본 의료보험의 '국가 1게임'에 비해 상업 보험 시장은 더욱 세분화되어 있습니다. 국민을 위한 200개 이상의 '1시 1정책' 혜택이 있고, 백만 달러 의료 보험, 전문 의약품 보험과 같은 상품은 피보험자 그룹, 약물 접근 및 보상 한도 측면에서 다양합니다. 초과 손실 위험 노출에 대한 보험 회사의 강화와 함께, 혁신적인 약물의 \"출시 시 보험\"은 점차 과거의 일이 되었습니다."},{"s":"State Street SPDR S&P 생명공학 ETF(XBI) | 주가 및 최신 뉴스","so":"Reuters","tm":"11/08 19:15","c":1,"r":"us","u":"https://www.reuters.com/markets/companies/XBI/financials/","p":1794132920,"a":1794145920,"t":"State Street SPDR S&P Biotech ETF (XBI) | Stock Price & Latest News"}]},{"name":"🔋 2차전지","note":"보유: TIGER 2차전지테마 · KODEX 2차전지산업 · TIGER 2차전지소재Fn","breaking":false,"items":[{"s":"BMW그룹, 삼성SDI·LG엔솔과 맞손…\"유럽·미국 공급망 강화\"","so":"연합뉴스 한민족센터","tm":"11/10 11:58","c":10,"r":"kr","u":"https://www.koreancenter.or.kr/news/articleView.html?idxno=1437244","p":1794279504,"a":1794281005,"su":"삼성SDI는 유럽, LG엔솔은 미국서 생산한 고전압 배터리 셀 공급 BMW '현지 생산·현지 공급' 원칙…\"K-배터리와 파트너십 공고히\" (서울=연합뉴스) 장하나 기자 = 삼성SDI와 LG에너지솔루션이 나란히 독일 BMW그룹의 차세대 전기차용 배터리 셀 공급사로 선정됐다. BMW그룹 공급망 다변화 전략의 일환이다. BMW그룹은 9일(현지시간) 삼성SDI와 LG에너지솔루션을 차세대 젠6(Gen6) 고전압 배터리용 셀 공급업체로 추가 선정하고 공급 계약을 체결했다고 밝혔다."},{"s":"[리포트 브리핑]에코프로비엠, '양극재 출하 부진 지속' 목표가 90,000원 - iM증권","so":"뉴스핌","tm":"11/09 10:53","c":6,"r":"kr","u":"https://www.newspim.com/news/view/20261109000504","p":1794189180,"a":1794195231,"su":"[서울=뉴스핌] 로보뉴스 = iM증권에서 09일 에코프로비엠(247540)에 대해 '양극재 출하 부진 지속'라며 투자의견 'Hold'의 신규 리포트를 발행하였고, 목표가 90,000원을 내놓았다. 전일 종가 기준으로 볼 때, 이 종목의 주가는 목표가 대비 8.3%의 추가 상승여력이 있다는 해석이 가능하다. ◆ 에코프로비엠 리포트 주요내용 iM증권에서 에코프로비엠(247540)에 대해 '3분기 실적은 미국 전기차 세액공제 종료에 따른 수요 둔화와 셀 고객사의 점유율 하락으로 시장기대치를 크게 하회했다."},{"s":"에코프로비엠, 인니 자회사 유상증자에 6271억 투입…제련소 지분 취득 추진","so":"이데일리","tm":"11/10 19:10","c":4,"r":"kr","u":"https://www.edaily.co.kr/News/Read?newsId=05884326645644408&mediaCodeNo=257","p":1794305433,"a":1794316532,"su":"에코프로비엠(247540)이 인도네시아 현지 자회사 유상증자에 약 6271억원을 투입한다. 자회사를 통해 현지 제련소 지분을 취득하고 주주대여금 재원을 마련하기 위한 것이다. 인도네시아 BNSI 제련소 건설 현장.(사진=에코프로비엠 제공)에코프로비엠은 10일 인도네..."},{"s":"센서·액추에이터·로봇 이차전지로 신산업 주도권 확보한다","so":"한국일보","tm":"11/11 09:00","c":3,"r":"kr","u":"https://www.hankookilbo.com/news/article/A2026111023060003621","p":1794355200,"a":1794361879,"su":"① 정부는 차세대 센서와 액추에이터 및 휴머노이드용 이차전지를 신산업 핵심 과제로 선정했습니다. ② 정부는 2027년부터 온센서 기술 개발과 실증 체계를 로봇과 방산 및 모빌리티 중심으로 추진할 계획입니다. ③ 정부는 2030년까지 로봇 부품 국산화율을 80%로 높이고 2031년까지 배터리 개발에 2714억 원을 투입하기로 했습니다."},{"s":"SP삼화, 이차전지 전해액용 '염소화 공정없는 제조법' 특허 취득","so":"연합뉴스 한민족센터","tm":"11/10 16:18","c":3,"r":"kr","u":"https://www.koreancenter.or.kr/news/articleView.html?idxno=1437379","p":1794295097,"a":1794298368,"su":"(서울=연합뉴스) 강태우 기자 = SP삼화는 리튬이온 배터리 전해액 소재로 활용되는 '설포닐 플루오라이드 화합물'의 제조 방법에 관한 특허를 취득했다고 10일 공시했다. 이번 특허는 촉매를 활용해 기존 제조 과정에 필요했던 염소화 공정을 생략하면서도 높은 수율로 설포닐 플루오라이드 화합물을 생산할 수 있는 기술이다. 설포닐 플루오라이드 화합물은 배터리의 화학적 안정성과 내구성을 높이는 데 활용되는 소재다."},{"s":"LG에너지솔루션, 사용후 배터리 진단 ‘리.펄스’로 CES 혁신상 수상","so":"경향신문","tm":"11/10 10:36","c":3,"r":"kr","u":"https://www.khan.co.kr/article/202611101036001","p":1794274560,"a":1794281005,"su":"LG에너지솔루션이 전기차에서 다 쓴 배터리 상태를 10분 안에 진단하는 소프트웨어 기술로 ‘CES 2027 혁신상’을 수상했다. LG에너지솔루션은 소프트웨어 기반 사용 후 배터리 진단 솔루션 ‘리.펄스(Re.Pulse)’가 CES 2027 혁신상을 받았다고 9일(현지시간) 밝혔다. 미국소비자기술협회(CTA)가 선정하는 상으로, 첨단 모빌리티 부문에서 받았다. 리.펄스는 배터리에 특정 전류 펄스를 흘려 전압 변화를 측정한다."},{"s":"CATL, 연말까지 배터리 교환소 3000개 구축 계획 - 글로벌 파이낸스 - Business Times","so":"中時新聞網","tm":"11/11 05:10","c":2,"r":"tw","u":"https://www.chinatimes.com/newspapers/20261111000304-260203","p":1794341400,"a":1794350734,"t":"寧德時代年底前擬建3,000座換電站- 全球財經- 工商時報","su":"外媒報導，大陸電池巨頭寧德時代計劃於今年底前，在大陸建成3,000座乘用車換電站，有助於鈉離子電池普及化，減低消費者對其續航力疑慮。寧德時代董事長曾毓群10日出席上海Benchmark Mineral Intelligence會議時表示"},{"s":"[르포] 쇳물부터 리튬·LNG까지…포스코, 전남광주 핵심 거점 가보니[장인화號 트리플코어]","so":"뉴시스","tm":"11/10 14:00","c":2,"r":"kr","u":"https://www.newsis.com/view/NISX20261110_0003861374","p":1794286800,"a":1794316532,"su":"[광양=뉴시스]이창훈 기자 = 이달 2~3일 방문한 전남광주통합특별시(전남광주) 내 포스코그룹의 주요 사업장은 장인화 회장이 주도해 온 그룹 미래 핵심 동력 트리플 코어(산업 자원, 전략 자원, 에너지 자원 중심의 포트폴리오 대전환)의 핵심 거점이다. 친환경 철강 생산 확대, '리튬·전구체→양극재'로 이어지는 이차전지 소재, 액화천연가스(LNG) 등 트리플.."},{"s":"특징주, 대한유화-2차전지 테마 상승세에 5.23% ↑","so":"매일경제 마켓","tm":"11/10 09:48","c":2,"r":"kr","u":"https://stock.mk.co.kr/news/view/1194676","p":1794271690,"a":1794281005,"su":"특징주, 대한유화-2차전지 테마 상승세에 "t":"リチウムイオン電池の負極材、アルミ箔で低コスト化 東北大学","su":"東北大学の中田優樹助教らはリチウムイオン電池の負極に適用できるアルミ箔を開発した。マンガンを添加したのが特徴で、蓄電容量を維持しながら充放電による劣化を抑えた。実用化すれば電池の製造工程を減らすことができる。現在普及するリチウムイオン電池の負極には粉末状の黒鉛が使われる。負極として使うには銅箔や接着剤などと組み合わせる工程が必要になる。製造時のコストがかさむため、代替材料が研究されている。"},{"s":"'배터리 선도도시 포항 국제 콘퍼런스'…북유럽 협력 방안 논의","so":"뉴시스","tm":"11/11 14:56","c":1,"r":"kr","u":"https://www.newsis.com/view/NISX20261111_0003863970","p":1794376564,"a":1794377547,"su":"[포항=뉴시스]송종욱 기자 = 경북 포항시는 글로벌 배터리 산업의 변화를 공유하고, 이차전지 산업의 글로벌 교류 협력을 강화를 위해 18일 포스코 국제관에서 '배터리 선도 도시 포항 국제 콘퍼런스'를 개최한다.콘퍼런스는 '글로벌 배터리 시장의 변화와 새로운 협력의 기회'란 주제로 전기차 수요 둔화와 글로벌 공급망 재편에 K-배터리 산업의 경쟁력을 진단하고,.."},{"s":"도호쿠대, 축전지의 전극 재료에 있어서 이온의 종류에 의해 터널 내에서의 점유 위치 등이 다른 것을 해명","so":"日本経済新聞","tm":"11/11 14:33","c":1,"r":"jp","u":"https://www.nikkei.com/article/DGXZRSP715116_11112026000000","p":1794375184,"a":1794377549,"t":"東北大、蓄電池の電極材料においてイオンの種類によってトンネル内での占有位置などが異なることを解明","su":"【프레스 릴리스】발표일:2026년 11월 11일 전지 재료에 들어가는 이온의 「거처」의 차이를 해명-도호쿠 대학 도호쿠 첨단 현미경 센터와 3GeV 고휘도 방사광 시설 NanoTerasu를 활용해, 원자 레벨 의 변화를 밝혀 -【발표의 포인트】 ●1차원 터널 구조를 가지는 축전지의 전극 재료에 있어서, 이온의 종류에 의해, 터널 내에서의 점유 위치와 입자 내부·표면에 있어서의 농도 분포가 크게 다른 것을 밝혀"},{"s":"중국 리튬 거대 기업, 가격 변동폭이 더욱 극심해졌다","so":"Bloomberg.com","tm":"11/11 14:24","c":1,"r":"us","u":"https://www.bloomberg.com/news/articles/2026-11-11/chinese-lithium-giant-says-price-swings-have-turned-more-extreme","p":1794374640,"a":1794377548,"t":"Chinese Lithium Giant Says Price Swings Have Turned More Extreme"},{"s":"긴축 우려 딛고 코스피 반등…반도체·이차전지 강세","so":"연합인포맥스","tm":"11/11 13:26","c":1,"r":"kr","u":"https://news.einfomax.co.kr/news/articleView.html?idxno=4444197","p":1794371160,"a":1794377547,"su":"코스피가 장 초반 약세를 딛고 2% 가까이 상승 중이다.코스닥 시장은 반도체 소부장(소재·부품·장비)과 이차전지 관련주 급등에 힘입어 이틀 연속 매수 사이드카가 발동됐다.11일 오후 코스피는 전 거래일 대비 101.32포인트(1.93%) 오른 5,340.45를 나타내고 있다. 전날 4.39% 급등하며 4거래일 만에 반등한 이후 이틀째 강세 흐름이다.지수는 간밤 미국발 긴축 우려에 하락 출발했다. 미국의 10월 소비자물가지수(CPI)가 시장 예상치를 웃돈 가운데, 크리스토퍼 월러 연방준비제도(Fed·연준) 이사가 기준금리 50bp"},{"s":"'외국인 투자 하이라이트' 씨티, 내년 글로벌 배터리 출하량 20% 이상 증가, 리튬 수요도 전년 대비 증가할 것으로 전망","so":"etnet 經濟通","tm":"11/11 12:02","c":1,"r":"hk","u":"https://www.etnet.com.hk/www/tc/news/categorized_news_detail.php?newsid=20261108257&page=1&category=latest","p":1794366120,"a":1794367469,"t":"《外資精點》花旗料明年全球電池出貨量增逾兩成，鋰需求按年增長","su":"11/11/2026 11:02 《外資精點》花旗料明年全球電池出貨量增逾兩成，鋰需求按年增長 花旗研究報告指，近日該行分析師在內地與交易員探討鋰電池材料市場最新走勢。交易員已預期電池龍頭企業將減產，主要因去庫存，以及電動車及儲能系統(ESS)電池需求前景轉弱。 出貨量方面，交易員預測明年全球電動車電池出貨量按年增長15%至20%，全球ESS電池出貨量按年增長低於30%，帶動整體電池出貨量按年增長20%以上，意味鋰需求按年增長40萬噸以上。交易員預期明年海外ESS需求維持強勁增長，國內ESS需求則取決於政策。"},{"s":"[장중수급포착] 에코프로비엠, 외국인/기관 동시 순매수… 주가 +11.39%","so":"뉴스핌","tm":"11/11 11:35","c":1,"r":"kr","u":"https://www.newspim.com/news/view/20261111000784","p":1794364500,"a":1794377547,"su":"[서울=뉴스핌] 로보뉴스 = 11일 11시 33분 현재 에코프로비엠(247540)은 외국인과 기관이 각각 11.90 만 주, 0.20 만 주 순매수(잠정) 하면서 전일 대비 11.39% (현재가 91,900원) 상승하고 있다.[표] 외국인ㆍ기관 순매매량 (단위 만주)["},{"s":"[홍콩 증시현황] 항셍지수는 202포인트 하락 마감, HSBC는 1% 이상 하락, CATL은 추세를 뒤집고 2% 이상 상승 (지속 업데이트)","so":"香港經濟日報HKET","tm":"11/11 10:23","c":1,"r":"hk","u":"https://inews.hket.com/article/4223160/%E3%80%90%E6%B8%AF%E8%82%A1%E5%B8%82%E6%B3%81%E3%80%91%E6%81%92%E6%8C%87%E4%BD%8E%E9%96%8B202%E9%BB%9E%E3%80%80%E6%BB%99%E8%B1%90%E8%B7%8C%E9%80%BE1-%E3%80%80%E5%AF%A7%E5%BE%B7%E6%99%82%E4%BB%A3%E9%80%86%E5%B8%82%E5%8D%87%E9%80%BE2-%EF%BC%88%E4%B8%8D%E6%96%B7%E6%9B%B4%E6%96%B0%EF%BC%89","p":1794360238,"a":1794361879,"t":"【港股市況】恒指低開202點 滙豐跌逾1% 寧德時代逆市升逾2%（不斷更新）"},{"s":"씨케이솔루션, 3분기 영업익 109억원…반도체·배터리 수주 확대","so":"전자신문","tm":"11/11 10:16","c":1,"r":"kr","u":"https://www.etnews.com/20261111000108","p":1794359769,"a":1794361879,"su":"씨케이솔루션이 반도체 제조시설과 이차전지 드라이룸 공사 수주 확대에 힘입어 3분기 연결기준 매출 1077억원, 영업이익 109억원을 기록했다고 11일 밝혔다. 매출은 전년 동기 대비 61%, 전 분기 대비 27% 증가했다. 영업이익은 전 분기 6억원에서 103억원 늘어나며 2분기 연속 흑자를 이어갔다. 실적 개선은 기존 이차전지 드라이룸 중심에서 반도체와 데이터센터, 방산 등으로 사업 영역을 확대한 영향으로 풀이된다. 씨케이솔루션은 지난 9월"},{"s":"케이엔에스, 3분기 누적 영업익 144% 증가…이차전지·로봇 자동화 사업 성장","so":"이투데이","tm":"11/11 09:32","c":1,"r":"kr","u":"https://www.etoday.co.kr/news/view/2646661?trc=main_list_news","p":1794357120,"a": 爆发，闪耀两市！碳酸锂，暴跌近5%！中证2000，再度领涨！","su":"11월 9일, 3대 A주 지수는 상승세를 보였다가 하락세를 보이며 엇갈린 이익과 손실로 마감했습니다. 상하이종합지수는 0.32% 상승한 3660.79포인트로 마감했고, 선전 구성지수는 0.27% 하락한 11145.49포인트에 마감했고, GEM 지수는 0.27% 하락한 2458.56포인트에 마감했다. 과학기술혁신50 지수는 0.30% 상승한 1256.96포인트에 마감했다."},{"s":"허난성: 연료전지 차량의 시범 적용을 지속적으로 장려하고 수소화 장비 및 센서 부문의 선두 기업 개발을 지원합니다.","so":"界面新闻","tm":"11/09 17:57","c":1,"r":"cn","u":"https://www.jiemian.com/article/15311932.html","p":1794214679,"a":1794214962,"t":"河南：持续推进燃料电池汽车示范应用，支持加氢装备和传感器领军企业发展","su":"허난성 상무부를 포함한 19개 부서는 공동으로 \"풀체인 자동차 소비 촉진을 위한 자동차 애프터마켓 육성 및 강화를 위한 허난성 실행 계획\"을 발표했습니다. 그 중에는 자동차 부품 기술 연구개발의 창의성을 높이는 것도 언급된다. 체인 강화, 지능형 네트워크 연결, 연료전지 차량 실증 및 리더십, 기술 혁신 플랫폼 구축을 위한 핵심 자동차 부품 및 부품을 공동으로 추진합니다. 조향 기어, 충격 흡수 장치, 구동축, 워터 펌프, 실린더 라이너 및 동력 배터리와 같은 부품의 장점을 통합하고 개선합니다. 지능형 연결 버스의 선점자 이점을 최대한 활용하고 온보드 감지, 제어 의사 결정 및 정보 보안과 같은 핵심 기술의 적용을 가속화하십시오. 계속해서 연료전지 차량의 시범 적용을 촉진하고, 수소화 장비 및 센서 분야 선도 기업의 발전을 지원하며, 구현을 통해 기업의 생산 능력 출시를 가속화합니다. \"상용차용 지능형 전기 섀시 핵심 기술 연구 개발 및 적용\"과 같은 주요 과학 기술 프로젝트의 구현을 가속화하고 결과의 산업적 적용을 촉진합니다. 새로운 전력 및 에너지 저장 배터리 소재, 차량 충격 흡수 장치 등에 중점을 둔 다수의 파일럿 기지를 구축하여 산업 독립성 및 제어 가능성 수준을 향상시킵니다. 해외 시장 개척 노력을 강화하고 제품 수출을 촉진해 브랜드, 기술 수출 등 가치사슬 내 고급 연계까지 점진적으로 확대한다."},{"s":"BMW, 삼성·LG에너지와 배터리 부품 공급업체 확대","so":"Bloomberg.com","tm":"11/09 17:44","c":1,"r":"us","u":"https://www.bloomberg.com/news/articles/2026-11-09/bmw-widens-battery-component-suppliers-with-samsung-lg-energy","p":1794213891,"a":1794214961,"t":"BMW Widens Battery Component Suppliers With Samsung, LG Energy"},{"s":"10월 승용차 판매는 27% 감소했고, 배터리는 조정으로 반응했다. CATL은 2% 이상 하락했고, 배터리 ETF China Universal(159796) 지수는 2% 이상 하락했으며, 5일 연속 6억 6천만 위안 이상의 자금이 쏟아졌습니다!","so":"Jiemian.com","tm":"11/09 17:35","c":1,"r":"cn","u":"https://m.jiemian.com/article/15311611.html","p":1794213303,"a":1794216096,"t":"10月乘用车销量下降27%，电池应声回调，宁德时代跌超2%，电池ETF汇添富(159796)指数跌超2%，资金连续5日坚定涌入超6.6亿元！","su":"11월 9일 A주 시장은 상하이 증권 거래소 지수가 0.32% 소폭 상승하는 등 상승세를 보였습니다. 배터리 ETF 차이나 유니버셜(159796)의 기초지수는 추세를 거스르며 2% 이상 하락했다. 하지만 여전히 자금은 꾸준히 쏟아져 들어왔다. 배터리 E ategory=latest&newsid=20261109183","p":1794184980,"a":1794195246,"t":"烯石電車新材料(06128)售鋰電池材料公司涉資1億美元，買方以現金及配股支付","su":"2026-09-11 08:43 그래펙스 전기차신소재(06128)가 리튬전지 소재업체를 1억 달러 투자에 매각했고, 매수자는 현금과 주식배당금으로 지급했다. Graphex Electric Vehicle New Materials(06128)는 인수자인 M2i Global과 총 1억 달러 규모의 자회사 Graphex Technologies LLC 매각에 관한 최종 계약을 체결했다고 발표했습니다. 대가는 3단계에 걸쳐 지급됩니다. 계약 체결이 완료되면 구매자는 3000만 달러를 먼저 지불하고, 이 중 300만 달러는 현금으로 지불하게 된다. 구매자는 이를 위해 노트를 발행하고 나머지 2,700만 달러는 주당 3달러의 대가 주식 형태로 지급됩니다. Enshi Electric Vehicle New Materials는 구매자에게 비용을 지불하고 당사자가 공장의 기본 설계를 전달하고 구매자가 설계를 수락한 후 구매자는 주당 미화 3달러의 가격으로 3천만 달러를 유상 주식 형태로 지불하게 됩니다. 공장이 완공되고 생산 승인을 받은 후, 구매자는 주당 미화 4달러의 대가 지분 형태로 Enshi Tram New Materials에 미화 4천만 달러를 지불하게 됩니다."},{"s":"가디언은 영국이 2030년 전기차 판매 목표를 60%로 낮출 것으로 예상한다고 밝혔다.","so":"Reuters","tm":"11/09 08:24","c":1,"r":"world","u":"https://www.reuters.com/world/uk/uk-government-expected-cut-2030-ev-sales-target-60-guardian-reports-2026-11-08/","p":1794180240,"a":1794206082,"t":"Britain expected to cut 2030 EV sales target to 60%, Guardian says"},{"s":"iM증권 \"美블루웨이브 이차전지엔 기회\"…'비중확대' 권고 |","so":"연합인포맥스","tm":"11/09 08:08","c":1,"r":"kr","u":"https://news.einfomax.co.kr/news/articleViewAmp.html?idxno=4443665","p":1794179333,"a":1794195231,"su":"iM증권 \"美블루웨이브 이차전지엔 기회\"…'비중확대' 권고 \"데이터센터 규제, 전력·ESS 수요 키운다\"…삼성SDI 최선호 (서울=연합인포맥스) 정원 기자 = iM증권이 미국 중간선거 이후 불거진 데이터센터 규제 우려가 이차전지 업종에는 오히려 기회가 될 수 있다며 투자의견을 '중립'에서 '비중확대'로 상향 조정했다. 최선호주는 삼성SDI를 차선호주에는 LG에너지솔루션을 제안했다. 정원석 iM증권 연구원은 9일 보고서에서 \"정책의 핵심은 전력과 용수, 환경 부담이 주민에게 전가되지 않도록 사업자의 책임을 강화하는데 있다\"며 \"특히 가스터빈의 공급 제약과 운영 비용 절감 등을 고려하면 가스발전과 '태양광+에너지저장장치(ESS)'를 병행하는 구조가 확대될 가능성이 높다\"고 강조했다."},{"s":"Hongchen, 산업연구소와 손잡고 NASA 항공우주 배터리 세미나 참석 - 비즈니스 정보","so":"工商時報","tm":"11/09 07:00","c":1,"r":"tw","u":"https://www.ctee.com.tw/news/20261109700014-431202","p":1794175200,"a":1794177868,"t":"泓辰攜手工研院登上NASA航太電池研討會- 商情","su":"美國國家航空暨太空總署(NASA)訂於11月17日至19日在美國阿拉巴馬州舉辦「2026 NASA Aerospace Battery Workshop」，將有來自全球7個國家，33場專題演講；NASA航太電池研討會是全球航太與頂級電池技術領域，最具權威與指標 —废弃—污染”的线性路径。当前，氢能的发展战场正发生转移，从“车端竞争”转向“工业脱碳 + 长时储能 + 绿色分子”。 她强调，虽然交通端被锂电压挤，但这并不意味着能源端与化工端无解；相反，绿氢、绿氨、绿醇正在接棒，成为难减排行业的必选项。"},{"s":"미국 전고체 배터리 기업 '팹리스 모델' 도입, \"제조 파트너 SK온 공장 활용\"","so":"비즈니스포스트","tm":"11/11 10:08","c":1,"r":"kr","u":"https://www.businesspost.co.kr/BP?command=article_view&num=451691","p":1794359330,"a":1794362997},{"s":"요건화까지 반년을 끊은 JC-STAR 제도── 태양광·축전지 사업자가 재확인하고 싶은 제도의 포인트","so":"ITmedia","tm":"11/11 07:00","c":1,"r":"jp","u":"https://www.itmedia.co.jp/smartjapan/articles/2611/11/news009.html","p":1794348000,"a":1794350741,"t":"要件化まで半年を切ったJC-STAR制度──太陽光・蓄電池事業者が再確認したい制度のポイント","su":"2027年4月以降、太陽光発電・蓄電池の系統連系にはJC-STAR制度への対応が必須となる。制度運用開始まで半年を切った。対応製品が増えていく一方で、海外メーカーをめぐる審査の在り方も論点に浮上している。制度の概要と現状を改めて整理し、とりわけ影響の大きい系統用蓄電所の事業者がいまとるべき対応を前後編にわたって紹介する。"},{"s":"계통용 축전지에 의한 수급 조정 시장 가격은 \"대폭 하락한다\"고 전력 소매 벤처 대표가 예상, 축전지 버블 종말에 의한 \"국익 손실 리스크\"에 경종도 | 에너지 동란","so":"ダイヤモンド・オンライン","tm":"11/11 04:35","c":1,"r":"jp","u":"https://diamond.jp/articles/-/402729","p":1794339300,"a":1794350741,"t":"系統用蓄電池による需給調整市場価格は「大幅下落する」と電力小売りベンチャー代表が予想、蓄電池バブル終焉による“国益損失リスク”に警鐘も | エネルギー動乱","su":"電力の送配電網に直接接続し、電力の需給バランスを調整する系統用蓄電池への投資が拡大している。ENEOSグループのほか、大阪ガスや伊藤忠商事、オリックスなどが大型蓄電所を手掛けるなど各地で開発が進む。「3年で元が取れる」ともいわれる高収益への期待から投資バブルの様相も呈してきたが、経済産業省による接続手続きの厳格化や、収益源となる市場の上限価格の引き下げで事業環境は一変しつつある。蓄電池市場はバブルからサバイバルへ向かうのか。蓄電池事業者協議会（BBA）代表も務める、電力小売りスタートアップ、しろくま電力の谷本貫造代表に、蓄電池市場で生き残る条件と蓄電池普及を巡る政策の課題を聞いた。"},{"s":"Calibrant Energy는 PJM의 하이퍼스케일 데이터 센터 고객을 위한 배터리 스토리지를 포함하여 프로젝트 파이낸싱에서 1억 4,500만 달러를 확보했습니다.","so":"POWER Magazine","tm":"11/11 03:19","c":1,"r":"us","u":"https://www.powermag.com/calibrant-energy-secures-145-million-in-project-financing-including-battery-storage-for-hyperscale-data-center-customer-in-pjm/","p":1794334750,"a":1794350741,"t":"Calibrant Energy Secures $145 Million in Project Financing, Including Battery Storage for Hyperscale Data Center Customer in PJM","su":"Calibrant Energy, a leading provider of on-site energy solutions, on November 10 announced the close of a $145-million debt faci 트(0.13%) 하락한 24,484.95포인트로 마감했다."},{"s":"산터우 사장 선전의 에너지 저장 사업은 상장 첫날 급등했지만 다시 하락해 59%를 마감했다.","so":"21财经","tm":"11/09 19:23","c":1,"r":"cn","u":"http://www.21jingji.com/article/20261109/herald/b70ba5c5696db39606ebc5348efe3f94.html","p":1794219828,"a":1794230102,"t":"汕头老板深圳做储能，上市首日冲高回落收涨59%","su":"21세기 비즈니스 헤럴드 Lin Dianchi 기자 11월 9일 Farsonic Energy Storage(09621.HK)가 홍콩 증권거래소 메인보드에 상장되었습니다. 7년 전, 광둥성 산터우 출신의 Wang Yu와 Zhang Jiajing이 심천에서 에너지 저장 시스템 통합업체를 설립했습니다. 이번 IPO에서 Yuanxin Energy Storage는 H주 약 5,754만 주를 주당 HK$9.78에 매각하여 총 약 HK$5억6,300만 달러와 약 HK$5억200만 순수익을 조달했습니다. 상장 첫날 Yuanxin Energy Storage는 발행가보다 114.72% 오른 HK$21에 개장했으며, 초 거래에서 최고가인 HK$22.40을 기록했습니다. 정오에 HK$21.60에 마감되었고 오후에는 크게 하락했습니다. 최종적으로 정오 종가보다 약 28% 하락한 HK$15.55에 마감되었으며 여전히 발행가보다 59% 상승했습니다. 총 마감 시장 가치는 약 63억 6,800만 홍콩 달러였습니다."},{"s":"가정용 ESS 152% 급성장에도…K배터리 3사는 '전력망' 집중","so":"이데일리","tm":"11/09 18:30","c":1,"r":"kr","u":"https://www.edaily.co.kr/News/Read?newsId=04250886645644080&mediaCodeNo=257","p":1794216617,"a":1794230099,"su":"글로벌 가정용 리튬이온 에너지저장장치(ESS) 배터리 시장이 지난해보다 2.5배 이상 빠르게 성장한 것으로 나타났다. 유럽 중심으로 시장이 커지면서 전력망과 산업·상업용 성장세를 뛰어넘었다. 가정용 ESS 시장은 사실상 중국이 장악한 가운데 국내 배터리사는 대형 ES..."},{"s":"ETF 시장일보 | 상업용 항공우주가 집중적으로 촉매됩니다! 위성 테마 ETF 급증, 과학 기술 혁신 광범위한 기반 및 배터리 에너지 저장 방향 조정","so":"Jiemian.com","tm":"11/09 17:52","c":1,"r":"cn","u":"https://m.jiemian.com/article/15311832.html","p":1794214323,"a":1794216107,"t":"ETF市场日报｜商业航天密集催化！卫星主题ETF大涨，科创宽基与电池储能方向调整","su":"3대 A주 지수는 위축되고 등락을 거듭했고, 시장 규모도 크게 줄었습니다. 구조적인 시장 상황은 사건에 의해 촉진되었습니다. 상업용 항공우주 부문은 여러 긍정적 요인의 영향으로 크게 강화되었습니다. 석탄 등 고배당 방향이 활발해 전체 시장 매출액이 1조4000억위안대로 떨어졌다."},{"s":"Li Yuanheng: 전고체 배터리 라인 프로젝트가 주요 고객사에 납품되었습니다.","so":"界面新闻","tm":"11/09 17:27","c":1,"r":"cn","u":"https://m.jiemian.com/article/15311582.html","p":1794212823,"a":1794214286,"t":"利元亨：全固态电池整线项目已完成向头部客户交付","su":"11월 9일, Li Yuanheng은 투자자 커뮤니케이션 기록 시트에 대한 발표를 발표했습니다. 회사의 전고체전지 장비 사업은 기술 연구개발 단계에서 고객 검증 및 소규모 납품 단계로 전환되고 있다. 전체 라인 및 주요 모델이 꾸준히 진행되고 있습니다. 전고체전지 전체 라인 프로젝트가 주요 고객사에 납품을 완료했으며, 기타 주요 고객사의 일부 주요 모델도 납품 단계에 진입했습니다. 전반적인 진행 상황은 기대에 부합합니다. 전고체 배터리 장비는 회사의 주요 레이아웃 방향 중 하나입니다. 2026년 예정된 이번 증설사업에도 전고체전지 장비 관련 레이아웃이 포함돼 건식전극, 라미네이션, 등방압성프레스 등 핵심 공정 장비 역량 강화에 중점을 두고 있다."},{"s":"최대 규모 ESS 수주전 맞붙은 삼성SDI·SK온…저가 경쟁 완화될까 - 머니투데이","so":"머니투데이","tm":"11/09 17:10","c":1,"r":"kr","u":"https://www.mt.co.kr/index.php/amp/industry/2026/11/09/2026110913383630024","p":1794211800,"a":1794214284,"su":"앞선 두 차례 입찰에서 과도한 저가 경쟁이 벌어진 것과 달리 이번에는 공급사가 줄어들면서 배터리 가격이 상승할 것이라는 전망이 나온다. 9일 배터리업계에 따르면 정부는 오는 11일 제3차 ESS 중앙계약시장 입찰과 관련해 사업계획서와 증빙서류 제출을 마감한다."},{"s":"Yuanxin Energy Storage는 연구 개발, 해외 레이아웃 및 Wuzhen의 새 공장에 투자하기 위해 5억 6,300만 홍콩달러를 모금했습니다.","so":"鉅亨網","tm":"11/09 17:00","c":1,"r":"tw","u":"https://news.cnyes.com/news/id/6653286","p":1794211219,"a":1794214291,"t":"遠信儲能募資5.63億港元投入研發、海外布局與烏鎮新廠","su":"YuanSin Energy Storage는 Wuzhen Uanalyze의 R&D, 해외 레이아웃 및 신규 공장에 투자하기 위해 HK$5억6천3백만을 모금했습니다. 2026년 11월 9일(Uanalyze/산업 데이터 센터 보고서) ⸺ 중국 에너지 저장 시스템 회사 YuanSin Energy Storage RelyEZ(9621-HK)가 홍콩에 상장되어 약 HK$5억6천3백만을 모금했습니다. 이 자금은 소프트웨어 및 하드웨어 연구개발, 해외 시장 확장, 우전 신공장 등에 사용될 예정이다. 지난해 회사 매출이 63% 증가한 후 제품 및 생산 레이아웃을 확장하기 위해 자금을 추가로 조달했습니다. 왕위 회장은 상장이 글로벌 확장을 가속화하는 새로운 출발점이 될 것이라고 말했다. 이전 자금 조달 계획에 따르면 Yuanxin Energy Storage는 순수익의 약 45%를 연구 개발에 투자하고, 25%는 현지 팀, 주요 해외 시장에서의 협력 및 생산 기회에, 20%는 Wuzhen의 새로운 공장, 장비 및 실험실 건설에, 나머지 10%는 운전 자본으로 투자할 것으로 예상됩니다. 위 비율은 순모금액을 기준으로 계산한 것으로, 상장을 통해 모금된 총액과는 다릅니다."},{"s":"심지구에너지저장 핵심기술을 중심으로 산둥성 태안에서 국가수준의 고급훈련강좌가 개최되었습니다.","so":"中国新闻网","tm":"11/09 16:20","c":1,"r":"cn","u":"https://www.chinanews.com.cn/gn/2026/11-09/10728801.shtml","p":1794208829,"a":1794214288,"t":"聚焦深地储能关键技术 国家级高级研修班在山东泰安开班","su":"심지구 에너지 저장 핵심 기술을 중심으로 산둥성 타이안에서 국가 수준의 고급 교육 강좌가 개최되었습니다. 중국 통신사, 타이안, 11월 9일(Zhou Yiwei) 11월 9일 산둥성 타이안에서 \"지하 공간 탐지 및 심지구 에너지 저장 활용을 위한 핵심 기술\"에 관한 국가 수준 고급 교육 강좌(이하 '교육 강좌')가 개최되었습니다. 심지구 인재 팀 구성을 더욱 강화하고 심지구 에너지 저장 프로젝트의 실제 문제 해결 능력을 향상시키는 것을 목표로 합니다. 이번 교육에는 에너지저장공학, 심토지구공학, 지질학 및 광물자원, 지구물리탐사, 지하공간 활용 등 관련 분야에 종사하는 국내 인력이 참여했다. 개회식에서 산둥성 천연자원부 2급 검사관 Duan Xiuming은 지하 공간이 국가 우주 시스템의 중요한 부분이자 발전 잠재력이 큰 전략적 국가 우주 자원이라고 소개했습니다. 산둥성의 뛰어난 소금 자원 보유량과 안정된 지질 구조는 소금 동굴 에너지 저장 산업 발전에 독특한 자원 조건을 제공합니다. 부서는 소금 광산 및 기타 광물 자원의 탐사, 평가 및 모니터링을 지속적으로 장려하고, 채굴권의 전체 과정을 엄격하게 관리하며, 광물 자원 개발과 지하 공동 에너지 저장 재사용 간의 연결을 조정하고, 소금 동굴 에너지 저장 프로젝트를 지원하고 산둥성 지하 심층 에너지 저장 산업의 표준화되고 질서 있는 발전을 돕기 위해 노력하고 있습니다."},{"s":"정부 '저가 입찰'에 ESS 도입 차질 우려, 배터리 업계 ESS 배터리 공급 부족한데 낮은 수익성에 갈수록 기피 가능성","so":"비즈니스포스트","tm":"11/09 15:55","c":1,"r":"kr","u":"https://www.businesspost.co.kr/BP?command=article_view&num=451529","p":1794207303,"a":1794242692},{"s":"김성환 \"반도체 산단 전력·용수 적기 공급\"…변전소 선제 확충·ESS 송전망 구축","so":"뉴시스","tm":"11/09 15:36","c":1,"r":"kr","u":"https://www.newsis.com/view/NISX20261109_0003860712","p":1794206180,"a":1794207281,"su":"[세종=뉴시스]손차민 기자 = 김성환 기후에너지환경부 장관이 \"3대 메가프로젝트를 뒷받침하도록 전력·용수 인프라를 적기에 구축하겠다\"고 9일 밝혔다.김 장관은 이날 오후 국회 기후에너지환경노동위원회 전체회의에서 \"호남권 반도체 산단과 충청권 첨단 산업에 필요한 용수 공급 시설도 차질 없이 구축하겠다\"며 기후부 예산안 운용 방향을 설명했다. 김 장관은 \"첨단.."},{"s":"업튼 마그나(Upton Magna) 학부모, 학교 근처 배터리 부지 계획에 반대","so":"BBC","tm":"11/09 15:12","c":1,"r":"world","u":"https://www.bbc.com/news/articles/c63ellz584wqo","p":1794204720,"a":1794206122,"t":"Upton Magna parents oppose plans for battery site near school","su":"부지 계획에 따르면 세인트 루시아의 CofE 초등학교 및 보육원에서 1km 미만 거리에 있습니다."},{"s":"델: 전고체전지 생산라인은 시험생산 및 증설 단계에 있다.","so":"第一财经","tm":"11/09 12:09","c":1,"r":"cn","u":"https://www.yicai.com/news/103431950.html","p":1794193793,"a":1794206097,"t":"德尔股份：固态电池产线处于试生产及产能爬坡阶段","su":"WeChat을 열고 하단의 \"검색\"을 클릭한 다음 \"스캔\"을 사용하여 웹페이지를 친구들과 공유하세요. 중국 비즈니스 뉴스 2026-11-09 11:07:05 편집자: Qi Xinyi Dell 주식이 공개한 투자자 관계 활동 기록에 따르면 회사는 최근 Guolian Minsheng Securities와 같은 기관으로부터 설문조사를 받은 것으로 나타났습니다. 델(Del Co., Ltd.)은 다양한 적용 시나리오에 따라 에너지 밀도, 속도 성능, 사이클 수명 등 다양한 지표의 종합적인 균형을 맞출 수 있는 독립적인 전해질 소재 공식 시스템을 구축했다고 밝혔다. 생산능력 측면에서는 외부 협력업체와 위탁가공 계약을 체결했다. 파트너의 원래 리튬 배터리 생산 라인을 기반으로 회사의 전고체 배터리 생산 프로세스 요구 사항에 따라 특수 수정 및 장비 디버깅을 구현하여 회사의 전고체 배터리 제품 생산을 담당했습니다. 생산라인은 현재 시험생산 및 생산능력 확대 단계에 있다."},{"s":"거의 1,389회 과매수를 기록하며 역사적인 '과매수 왕'이 되었습니다. YuanSin Energy Storage는 상장 첫날 거의 130% 급등했습니다.","so":"财联社","tm":"11/09 11:51","c":1,"r":"cn","u":"https://www.cls.cn/detail/2528615","p":1794192660,"a":1794214973,"t":"超购近1389倍跻身历史级“超购王” 远信储能上市首日盘中一度狂飙近130%","su":"① Yuanxin Energy Storage의 상장 첫날, 2차 시장에서 집중적인 자금 조달을 촉발한 이유는 무엇입니까? ② 출하량 상위 10위권에 진입했고, 해외 점유율도 급등했다. Farsonic Energy Storage가 AIDC 컴퓨팅 전력 분배 및 스토리지에 투자하여 성장을 위한 새로운 공간을 열 수 있습니까? 파이낸셜뉴스(Financial News Agency)가 11월 9일 보도했다(편집자 후자롱). 홍콩 증시의 신에너지 부문이 또 하나의 큰 이슈를 맞이했다. Yuanxin Energy Storage(09621.HK)가 오늘 공식적으로 상장되었습니다. 초기 거래에서 급격히 상승했고 빠르게 상승했습니다. 장중 증가율은 130%에 가까웠다. 보도 시점 기준으로 119.84% 상승한 HK$21.50을 기록했습니다. Yuanxin Energy Storage는 1000배가 넘는 초과 청약 배수와 콤팩트한 순환 칩 구조로 유통 시장에서 집중적인 자금 추적을 촉발시켰습니다. 공모가는 1,389배 가까이 과매수돼 홍콩 주식 역사상 '과매수 왕'이 됐다. Yuanxin Energy Storage는 IPO 단계에서 선도적인 청약 열정을 보여주었습니다. 홍콩 공모는 1,388.75배 초과 청약을 기록해 같은 기간 다른 공모 주식보다 훨씬 많았을 뿐만 아니라 홍콩 주식 시장 역사상 '과매수 왕'에 직접 이름을 올렸다."},{"s":"이온어스, 美 THOR Energy와 북미 ESS 시장 공략","so":"전기신문","tm":"11/09 11:25","c":1,"r":"kr","u":"https://www.electimes.com/news/articleViewAmp.html?idxno=374518","p":1794191140,"a":1794195264,"su":"이온어스, 美 THOR Energy와 북미 ESS 시장 공략 빅스포서 이동형·컨테이너형 ESS 협력 MOU 텍사스서 실증 거쳐 중남미까지 사업 확대 추진 국내 레퍼런스 바탕으로 해외 사업 기회 모색 이동형 에너지저장장치(ESS) 전문기업 이온어스가 미국 텍사스의 에너지 프로젝트 개발 기업과 손잡고 북미 시장 문을 두드린다. 국내에서 다진 이동형 전력 공급 사업 경험을 미국 현지 실증으로 검증한 뒤 중남미까지 무대를 넓히겠다는 구상이다."},{"s":"보도자료 : RENON POWER, 저압 계통용 축전지 누계 수주 1,500사이트 돌파(PR TIMES)","so":"毎日新聞","tm":"11/09 11:22","c":1,"r":"jp","u":"https://mainichi.jp/articles/20261109/pr2/00m/020/112000c","p":1794190977,"a":1794195267,"t":"プレスリリース：RENON POWER、低圧系統用蓄電池の累計受注1,500サイト突破（PR TIMES）","su":"2026년 말 누계 수주 목표 1,000사이트를 앞당겨 달성, 약 75MW/300MWh의 수주 규모에 미국발의 축전지 메이커 RENON POWER 주식회사(이하 「RENON POWER」)는, 저압 계통용 축전지 패키지의 누계 수주수가 1,500사이트를 돌파한 것을 알렸습니다. 당사는 2026"},{"s":"홍콩 주식 플래시 보고서 | 홍콩 증시는 상승세로 출발했고 Hengke는 1% 이상 상승했습니다. 신규 주식의 어는점은 지났나요? Yuanxin Energy Storage 상장 가격 120% 이상 상승","so":"每日经济新闻","tm":"11/09 11:12","c":1,"r":"cn","u":"https://www.nbd.com.cn/articles/2026-11-09/4642014.html","p":1794190320,"a":1794207283,"t":"港股速报 | 港股高开恒科涨超1% 新股冰点已过？远信储能上市涨超120%","su":"오늘(11월 9일) 홍콩 증시는 장 초반 상승세로 출발했습니다. 보도 시간 현재 항셍지수는 143.85포인트(0.59%) 상승한 24,625.71포인트로 출발했다. 항셍기술지수는 41.75포인트(1.02%) 오른 4119.98포인트로 출발했다. 뉴스, 오늘"},{"s":"이번주 홍콩 증시 뉴스 미리보기 │ Yuanxin Energy Storage 등 다수의 신규 주식이 함께 상장되고 AI 산업 체인이 여러 촉매 이벤트를 맞이하고 있습니다","so":"财联社电报","tm":"11/09 11:00","c":1,"r":"cn","u":"https://m.cls.cn/detail/2528350","p":1794189616,"a":1794214290,"t":"港股本周要闻前瞻｜远信储能等一批新股集中挂牌 AI产业链迎来多重催化事件","su":"Financial Associated Press, 11월 9일(편집자: Feng Yi) Financial Associated Press는 이번 주 홍콩 주식 뉴스를 전합니다: 해외 매크로 월요일(11월 9일): Goolsby 시카고 연준 의장과 Barkin 리치몬드 연준 의장이 연설을 했습니다. 일본은행은 10월 통화정책회의 검토위원회 의견을 요약해 공개했다. 화요일(11월 10일): 10월 미국 CPI, 10월 24일까지 한 주 동안 미국 ADP 고용. G7 외무장관 회의가 열리고, 미국, 러시아, 우크라이나가 11월 10일부터 11일까지 아부다비에서 만날 예정입니다. 목요일(11월 12일): 11월 7일로 끝나는 주 동안 미국의 최초 실업수당 청구 건수. 하맥 클리블랜드 연은 총재, 데일리 샌프란시스코 연은 총재, 윌리엄스 뉴욕 연은 총재가 연설을 했습니다."},{"s":"[신주 IPO] Yuanxin Energy Storage 9621이 장초기 1.24배 상승하여 랏당 6,060위안을 벌었습니다.","so":"香港經濟日報HKET","tm":"11/09 10:51","c":1,"r":"hk","u":"https://inews.hket.com/article/4221827/%E3%80%90%E6%96%B0%E8%82%A1IPO%E3%80%91%E9%81%A0%E4%BF%A1%E5%84%B2%E8%83%BD9621%E9%A6%96%E6%8E%9B%E6%97%A9%E6%AE%B5%E5%8D%871.24%E5%80%8D%E3%80%80%E6%AF%8F%E6%89%8B%E5%B8%B3%E9%9D%A2%E8%B3%BA6,060%E5%85%83","p":1794189109,"a":1794195280,"t":"【新股IPO】遠信儲能9621首掛早段升1.24倍 每手帳面賺6,060元"},{"s":"배터리 시장 판도 바뀐다… 韓은 美 ESS 성장에 ‘미소’, 中은 공급 과잉에 ‘울상’","so":"Chosunbiz","tm":"11/09 10:42","c":1,"r":"kr","u":"https://biz.chosun.com/industry/company/2026/11/09/5GVNFBVHXBAODESK3ZTXMDKTDI/","p":1794188520,"a":1794195264,"su":"배터리 시장 판도 바뀐다 韓은 美 ESS 성장에 미소, 中은 공급 과잉에 울상 CATL, 기대 이하 실적 외형 성장 속 수익성 고민 LG엔솔·삼성SDI는 美 ESS 수혜로 어닝 서프라이즈"},{"s":"중국 최대의 단일 동력 플라이휠 에너지 저장 프로젝트 가동","so":"人民日报","tm":"11/09 09:10","c":1,"r":"cn","u":"http://paper.people.com.cn/rmrbhwb/pc/content/202611/09/content_30190098.html","p":1794183047,"a":1794207285,"t":"中国单体最大功率飞轮储能项目投运","su":"란저우, 11월 8일(Zeng Yichen 기자) 중국 최대의 단일 전력 플라이휠 에너지 저장 프로젝트가 최근 간쑤성 란저우 시의 그리드에 연결되어 화력 기지의 플라이휠 에너지 저장을 위한 중국의 빠른 주파수 변조 기술에 중요한 돌파구를 마련했습니다. 플라이휠 에너지 저장 장치는 고속 회전 로터를 사용하여 전기 에너지를 저장합니다. 전력이 충분할 때 전기 에너지는 로터를 고속으로 회전시켜 전기 에너지를 회전 운동 에너지로 변환하여 저장합니다. 전력망에 전원 공급이 필요할 때 고속 회전 로터는 운동 에너지를 전기 에너지로 변환하여 외부로 전달합니다. 충전 및 방전을 신속하게 완료하여 전력망의 원활한 작동을 보장합니다. 높은 변환 효율, 강력한 적응성 및 긴 장비 수명이라는 장점이 있습니다. 이 그리드 연결 플라이휠 에너지 저장 프로젝트는 \"5MW 고출력 플라이휠 + 0.5MW 관성 플라이휠\"의 협업 모델을 혁신적으로 채택합니다. 기존의 단일 플라이휠 모드와 달리 듀얼 플라이휠의 조화로운 작동은 보완적인 이점과 계층적 응답을 얻을 수 있습니다. 5MW 대형 플라이휠은 전력망의 큰 주파수 변동에 효과적으로 대처할 수 있으며, 0.5MW 소형 플라이휠은 작은 일일 전력망 주파수 변동을 안정화하는 역할을 합니다. 듀얼 플라이휠 에너지 저장 장치가 장착된 화력 발전 장치는 100밀리초 이내에 그리드 주파수 조정에 응답할 수 있으며 조정 정확도는 99.5%를 초과합니다. 보다 복잡한 상황에서 장치의 주파수 조절 성능을 효과적으로 향상시키고 그리드 주파수 안정성을 신속하게 지원할 수 있습니다."},{"s":"현재와 ​​미래의 경제 동향에 관한 메모: Yuanxin Energy Storage가 상장되었습니다. 신세계 파트너십 투자 촉진국 서커우 베이두의 첫 번째 프로젝트 기자회견 | 인스턴트 뉴스 - 뉴스","so":"etnet 經濟通","tm":"11/09 08:46","c":1,"r":"hk","u":"https://www.etnet.com.hk/www/tc/news/news-article.php?section=categorized&category=latest&newsid=2026110901","p":1794181560,"a":1794206114,"t":"今明經濟動向備忘：遠信儲能掛牌；新世界夥招商局蛇口北都首個項目記者會 | 即時新聞 - 新聞","su":"오늘의 경제동향, 2026년 11월 9일(월): 09:00 Yuanxin Energy Storage(09621) 상장식 - 홍콩 금융..."},{"s":"4조 들여 ‘초대형 배터리 단지’ 짓는다면서… 화재 대책은 방치","so":"조선일보","tm":"11/09 06:04","c":1,"r":"kr","u":"https://www.chosun.com/economy/industry-company/2026/11/09/LROTY4ON5ZDAVCR7H7KO2OKA64/","p":1794171877,"a":1794177875,"su":"정부가 송전망 한계 극복을 위해 4조 원을 들여 대규모 ESS를 설치할 계획이나, 기존 방식 외 별도의 화재 안전 대책이 없어 반복되는 배터리 열 폭주 사고에 대한 국민적 우려와 안전성 강화 요구가 커지고 있습니다."},{"s":"나카니시 유스케 관방 부장관, 도쿠시마의 축전지 관련 기업을 시찰… 「원료의 희토류 조달이 열쇠」라고 지원 명언","so":"読売新聞","tm":"11/08 18:34","c":1,"r":"jp","u":"https://www.yomiuri.co.jp/politics/20261108-GYT1T00117/","p":1794130440,"a":1794148508,"t":"中西祐介官房副長官、徳島の蓄電池関連企業を視察…「原料のレアアース調達が鍵」と支援明言","su":"[요미우리 신문] 나카니시 유스케 관방 부장관은 8일, 도쿠시마현내의 축전지 관련 기업을 시찰했다. 간사이와 중국·시코쿠의 결절점에 위치한 도쿠시마현의 축전지 산업은 지역 미래 전략에 근거한 선행 사례로 정부가 뒷받침하고 있다. 나카니시 씨는 시찰 후 기자단에 \"원료가되는 레어"},{"s":"홍콩 주식 I nters: Seven Must-Do Items for Renewable Energy Developers","su":"이제 그리드의 부하 증가는 기하급수적이며 주로 데이터 센터에 의해 주도된다는 점은 잘 알려져 있습니다. 다양한 세대 유형이 만나기 위해 경쟁하고 있습니다."},{"s":"TenneT, 우주에서 주요 네덜란드 전기 고속도로 건설을 모니터링하기 위해 Orbital Eye 선택","so":"POWER Magazine","tm":"11/10 02:04","c":1,"r":"us","u":"https://www.powermag.com/tennet-selects-orbital-eye-to-monitor-construction-of-major-dutch-electricity-highway-from-space/","p":1794243899,"a":1794244302,"t":"TenneT Selects Orbital Eye to Monitor Construction of Major Dutch Electricity Highway from Space","su":"TenneT는 Orbital Eye의 위성 플랫폼을 활용하여 263개 파일론의 Rilland-Tilburg 전력선 건설을 우주에서 모니터링합니다."},{"s":"태양열, 저장 장치, 그리고 전력망이 어두워지는 날","so":"POWER Magazine","tm":"11/10 01:46","c":1,"r":"us","u":"https://www.powermag.com/solar-storage-and-the-day-the-grid-goes-dark/","p":1794242815,"a":1794243078,"t":"Solar, Storage, and the Day the Grid Goes Dark","su":"미국 에너지(U.S. Energy)에 따르면, 미국 전력 고객은 2024년 평균 11시간의 정전을 겪었고, 주요 사건으로 인해 그 시간의 80%가 발생했습니다."},{"s":"의회의 통제권 변경은 컴퓨팅 능력에 충격을 주었습니다. 기술산업은 준비가 되어 있는가?","so":"香港經濟日報HKET","tm":"11/10 01:15","c":1,"r":"hk","u":"https://paper.hket.com/article/4222325/%E5%9C%8B%E6%9C%83%E6%98%93%E4%B8%BB%E7%AE%97%E5%8A%9B%E9%9C%87%E7%9B%AA%20%E7%A7%91%E6%8A%80%E7%95%8C%E6%97%A9%E6%9C%89%E6%BA%96%E5%82%99%EF%BC%9F?mtc=70029","p":1794240900,"a":1794242707,"t":"國會易主算力震盪 科技界早有準備？"},{"s":"노르웨이, 데이터 센터에 대한 전력 접근 용량 예약 중단","so":"信報網站","tm":"11/10 00:27","c":1,"r":"hk","u":"https://www.hkej.com/instantnews/international/article/4561780/%E6%8C%AA%E5%A8%81%E6%9A%AB%E5%81%9C%E7%82%BA%E6%95%B8%E6%93%9A%E4%B8%AD%E5%BF%83%E9%A0%90%E7%95%99%E9%9B%BB%E5%8A%9B%E6%8E%A5%E5%85%A5%E5%AE%B9%E9%87%8F","p":1794238075,"a":1794242707,"t":"挪威暫停為數據中心預留電力接入容量","su":"노르웨이는 이러한 시설이 그리드에 가하는 부담을 처리하는 방법을 연구하는 동안 데이터 센터에 대한 추가 전력 접근 용량 예약을 중단할 예정입니다. 전송 시스템 운영업체인 Statnett AS는 발표를 통해 관련 조치에는 새로운 그리드 연결 용량 예약을 일시적으로 중단하는 것이 포함된다고 밝혔습니다. 늦어도 내년 8월 1일까지는 정지가 해제될 것으로 예상된다. 기술 기업들이 인공지능을 실행하고 훈련시키기 위한 인프라 구축에 수천억 달러를 투자하면서 글로벌 데이터센터 건설이 가속화되고 있다. 급속한 확장 속도는 미국과 유럽의 많은 지역에서 반발을 불러일으켰고, 지역 사회는 토지와 전력 수요를 걱정하고 있습니다."},{"s":"전 세계적인 '변압기 부족 현상'이 나아지고 있나요? CIIE에 참가한 에너지 거대 기업: 생산 확대 외에도 장애물이 있습니다","so":"第一财经","tm":"11/09 18:31","c":1,"r":"cn","u":"https://www.yicai.com/news/103432270.html","p":1794216693,"a":1794230116,"t":"全球“变压器荒”好转了吗？进博会上的能源巨头：扩产之外还有这道坎","su":"{{aisd}} AI 생성 면책 조항 작년에 시작된 전 세계적인 변압기 부족 현상이 개선되었습니까? 제9회 중국 국제 수입 박람회에서 세계 최대 변압기 장비 제조업체인 Hitachi Energy의 글로벌 수석 부사장 겸 북아시아 책임자인 Zhao Yongzhan은 최근 China Business News에 변압기에 대한 \"공급이 수요를 초과하는\" 추세가 계속되고 있다고 말했습니다. \"글로벌 컴퓨팅 전력 센터 건설과 결합된 글로벌 에너지 전환, 특히 인공지능(AI) 컴퓨팅 전력 센터의 에너지 수요가 전례 없는 속도로 증가하고 있습니다. 이는 글로벌 공급 및 제조 역량에 대한 테스트입니다. 전력을 공급할 수 있는지 여부는 그 자체로 큰 테스트입니다.\" 국제에너지기구(IEA)는 지난 10월 발표한 최신 \"AI 개발 추진: 데이터센터를 전력 시스템에 통합하기 위한 전략\"에서 2030년까지 글로벌 데이터센터 전력 수요가 두 배 이상 증가해 약 945테라와트시가 될 것이라고 언급했다."},{"s":"jpp-KY는 1분기에 자기자본의 절반 이상을 벌면서 전력망 병목 현상을 살펴 새로운 비즈니스 기회를 창출했습니다.","so":"鉅亨網","tm":"11/09 17:25","c":1,"r":"tw","u":"https://news.cnyes.com/news/id/6653316","p":1794212759,"a":1794214300,"t":"jpp-KY首見一季賺超過半個股本 看電網瓶頸將帶動新商機","su":"Jingbao Precision의 3분기 세후 순이익은 2억 9,200만 위안으로 연간 28% 증가했습니다. EPS는 5.51위안으로 단일 분기 최고치를 기록해 분기에 자기자본의 절반 이상을 벌어들인 것은 처음이다.\n시장 전망을 내다보면 AI 서버와 전력 시스템 구성 요소에 대한 수요가 강하고, 전원 공급 장치와 무정전 전원 관리 아키텍처가 이번 분기에 대규모 대량 생산에 돌입했습니다.\nJingbao는 또한 Airbus A350에 대한 여러 프로세스 인증을 통과하여 Aerospace를 두 번째 성장 엔진으로 만들었습니다."},{"s":"신입사원이 왔습니다! 홍유자동차, 내년 북미 AI 전력시장 진출 위해 인수가격 208위안 잠정 확정","so":"UDN","tm":"11/09 16:52","c":1,"r":"tw","u":"https://udn.com/news/story/7240/9867045?from=udn-relatednews_ch2","p":1794210769,"a":1794214302,"t":"重電新兵來了！宏于電機暫定承銷價208元 明年搶進北美AI電力市場","su":"스마트 전력 및 에너지 시스템 통합 공장인 홍유 자동차(7869)는 상장 전 공공 인수와 협력해 외부 입찰을 위해 1,844개를 경매했으며, 최저 입찰 가격은 180.87위안, 최고 입찰 수는 253개, 잠정 인수 가격은 208위안이었다. 입찰기간은 11월 11일부터 13일까지이며 입찰은 11월 17일에 시작된다. 공개 청약은 11월 16일부터 18일까지 진행되며, 추첨은 11월 20일에 진행됩니다. 11월 26일 상장 예정입니다."},{"s":"AI 컴퓨팅 성능 '샷볼 수준' 전력망이 Taipower에 도전하여 수요와 공급의 효과적인 할당 촉진 | 지역 하이라이트","so":"中央社好生活","tm":"11/09 16:41","c":1,"r":"tw","u":"https://howlife.cna.com.tw/local/20261109s004.aspx","p":1794210060,"a":1794214304,"t":"AI 算力「鉛球級」電網挑戰台電推動供需有效配置| 地方亮點"},{"s":"한화오션, ABB 플로팅 데이터센터 전력시스템 파트너","so":"ET Datacenters","tm":"11/09 15:58","c":1,"r":"us","u":"https://datacenters.economictimes.indiatimes.com/news/energy-cooling-sustainability/hanwha-ocean-abb-partner-on-floating-data-center-power-systems/135673860","p":1794207483,"a":1794230114,"t":"Hanwha Ocean, ABB partner on floating data center power systems","su":"한화오션과 ABB가 부유형 데이터센터용 전력 및 제어 기술 개발을 위한 MOU를 체결했다. 이 파트너십은 AI 컴퓨팅 수요 증가로 인해 육상 기반 인프라에 대한 증가하는 압력을 해결합니다."},{"s":"블루진영은 'AI 컴퓨팅 파워 안정화'를 위한 핵 국민투표를 지지한다. 그린에너지보다 배치 비용이 높아 산업이 위축되고 있다.","so":"公視新聞","tm":"11/09 15:45","c":1,"r":"tw","u":"https://news.pts.org.tw/article/834885","p":1794206721,"a":1794207297,"t":"藍營挺核公投「穩定AI算力」 民團批成本比綠能高、拖累產業","su":"국민당은 11월 28일 원자력 국민투표 카운트다운을 앞두고 원자력을 활용해 AI 컴퓨팅 역량과 산업 경쟁력을 안정화하는 데 초점을 맞춘 공식 홈페이지와 홍보 영상을 공개했다. 그러나 시민사회 단체와 학자들은 새로운 원자력 에너지 SMR은 비용이 많이 들고 즉각적인 구제책을 제공하기에는 느리며, 경직된 원자력 발전은 녹색 에너지 개발을 밀어낼 것이라는 국제 보고서를 작성했습니다."},{"s":"하얼빈용접화통(Harbin Welding Huatong)은 핵용접재료 시장점유율에 대한 입장을 분명히 밝혔고, 주제에 따라 자금조달 측면도 냉각됐다.","so":"经济观察网","tm":"11/09 15:21","c":1,"r":"cn","u":"http://www.eeo.com.cn/2026/1109/1088444.shtml","p":1794205260,"a":1794206133,"t":"哈焊华通澄清核电焊材市占率说法 题材驱动下融资端降温","su":"경제 관찰자 네트워크 하얼빈용접화통(301137) 이사회 비서가 11월 6일 원자력 용접재료 시장점유율에 대한 제3자 성명을 명확히 밝혔다. 관련 주제가 주가 변동을 주도하고 자금 조달 측면에서 냉각 조짐이 나타나고 있다. 최근 눈길을 끄는 사건은 지난 11월 6일 이사장과 사무총장의 대화에서 \"원자력용접재료 시장점유율이 40%를 초과한다\"는 발언이 1차에서 나온 것이라고 밝힌 것이다."},{"s":"엄격한 감독은 장기적인 개발을 방해하지 않습니다. 법인: 컴퓨팅 파워 혁명으로 새로운 비즈니스 기회 창출","so":"經濟日報","tm":"11/09 12:17","c":1,"r":"tw","u":"https://money.udn.com/money/story/5607/9866363?from=edn_newest_index","p":1794194238,"a":1794195306,"t":"監管趨嚴不阻長線發展 法人：算力革命帶動新商機","su":"프랭클린증권투자컨설팅은 민주당의 승리로 AI 규제가 더욱 엄격해졌으나 AI 발전은 미국의 국가경쟁력과 직결돼 여전히 양당의 공감대라고 지적했다. 민주당의 정책 입장은 AI 개발을 중단하는 것이 아니라, 주민의 공과금에 영향을 미치지 않도록 업계 운영자가 전력망 업그레이드 비용을 더 많이 공유하도록 요구하는 것입니다. 따라서 AI 데이터센터 구축 진행이 취소되기보다는 늦어질 수도 있을 것으로 예상된다. 정책 방향이 명확해지면서 관련 주가는 점차 부정적인 소식을 흡수할 것으로 예상된다."},{"s":"AI 주가 폭락, 데이터센터 위기인가 아니면 전환점인가? |홍콩경제신문","so":"香港經濟日報HKET","tm":"11/09 10:11","c":1,"r":"hk","u":"https://invest.hket.com/article/4221604/ai-stocks-selloff-data-centre-outlook","p":1794186669,"a":1794195302,"t":"AI股急跌 數據中心危機還是轉機？|香港經濟日報"},{"s":"[리포트 브리핑]LS ELECTRIC, '한국 AI DC의 길은 LS일렉트릭으로 통한다' 목표가 220,000원 - 하나증권","so":"뉴스핌","tm":"11/09 08:35","c":1,"r":"kr","u":"https://www.newspim.com/news/view/20261109000116","p":1794180900,"a":1794195299,"su":"[서울=뉴스핌] 로보뉴스 = 하나증권에서 09일 LS ELECTRIC(010120)에 대해 '한국 AI DC의 길은 LS일렉트릭으로 통한다'라며 투자의견 'BUY'의 신규 리포트를 발행하였고, 목표가 220,000원을 내놓았다. 전일 종가 기준으로 볼 때, 이 종목의 주가는 목표가 대비 88.8%의 추가 상승여력이 있다는 해석이 가능하다. ◆ LS ELECTRIC 리포트 주요내용 하나증권에서 LS ELECTRIC(010120)에 대해 '▶ 아직 해외 데이터센터향 수요 감소의 징후는 없는 상황 ▶ 해외 진출을 뒷받침할 내수 수요 증가."},{"s":"캐터필러의 \"컴퓨팅 파워 라벨\"이 CIIE에 도입되었습니다: 건설 기계 대기업에서 AI 전력 공급업체까지","so":"财联社","tm":"11/09 08:33","c":1,"r":"cn","u":"https://www.cls.cn/detail/2528031","p":1794180821,"a":1794242705,"t":"卡特彼勒“算力标签”带到进博：从工程机械巨头到AI电力供应商","su":"①제9회 중국국제수입박람회에서 캐터필러 부스 중 가장 눈에 띄는 자리는 디젤 발전기 세트였다. ② 캐터필라는 '굴삭기 판매업체'로서 '전력에너지 장비 및 솔루션 판매업체'라는 라벨을 추가하였습니다. 파이낸셜뉴스, 11월 7일(리용준 기자) 제9회 중국국제수입박람회에서 캐터필러(NYSE:CAT) 부스 중 가장 눈에 띄는 자리는 디젤 발전기 세트였다. FG Wilson 5000 시리즈 PE2500-2는 중국 국제 수입 박람회에서 세계 최초로 선보였으며 공식적인 포지셔닝은 매우 명확합니다. 이는 빠르게 증가하는 데이터 센터의 전력 수요를 위해 특별히 제작되었다는 것입니다. 이런 세부 사항은 불과 몇 년 전만 해도 상상하기 어려웠을 것입니다. 캐터필러의 가장 널리 알려진 이미지는 노란색 굴삭기와 불도저로, 인프라와 광산 분야의 \"철갑 거인\"입니다. 하지만 2026 CIIE에서는 AI 컴퓨팅 인프라를 위한 전력 시설 및 솔루션 제공업체라는 새로운 아이덴티티를 외부 세계에 알리는 데 앞장서고 있습니다."},{"s":"31차 기후총회 개막에 시민사회 \"AI 전력·물 사용 관리해야\"","so":"뉴스1","tm":"11/09 08:00","c":1,"r":"kr","u":"https://www.news1.kr/economy/env-policy/6346679","p":1794178800,"a":1794195299},{"s":"[기업이슈] 코스피도 ‘블루웨이브’…반도체·전력기기 급락","so":"SBS Biz","tm":"11/09 07:42","c":1,"r":"kr","u":"https://biz.sbs.co.kr/amp/article/20000345015","p":1794177720,"a":1794195299,"su":"[기업이슈] 코스피도 ‘블루웨이브’…반도체·전력기기 급락 SBS Biz 입력2026.11.09 07:42 수정2026.11.09 08:30 ■ 머니쇼 '기업이슈' - 도지은 어제장에서 이슈가 있었던 업종 살펴보는 기업이슈 시 발부터 양산·검증에 이르는 산업화 체계를 살펴본다."},{"s":"보스턴다이내믹스, 바퀴형 로봇 공개...\"360도 회전\"","so":"YTN 사이언스","tm":"11/10 16:01","c":4,"r":"kr","u":"https://science.ytn.co.kr/program/view.php?mcd=0082&key=202611101601571649","p":1794294117,"a":1794316566,"su":"현대차그룹 로봇 전문 계열사 보스턴다이내믹스가 360도 회전 점프를 비롯해 고난도 동작을 수행하는 휴머노이드 로봇 아틀라스의 모습을 공개했습니다. 영상에는 발 대신 다리에 바퀴를 단 아틀라스가 360도 회전 점프 외에도 바퀴 하나로 몸 전체를 지탱하거나 바닥에서 스스로 몸을 일으켜 세운 뒤 돌진하는 등 전신의 균형과 움직임을 조절하는 모습이 담겼습니다. 보스턴다이내믹스는 이번 프로젝트를 통해 정밀한 모터 제어와 강화 학습 간의 긴밀한 연계가 전신 제어 기술 고도화에 중요하다는 점을 확인했다고 설명했습니다."},{"s":"이번 세션 동안 휴머노이드 로봇 개념이 치솟았고 Shanwei New Materials와 Xiangzhi Intelligent를 포함한 10개 주식이 일일 한도에 도달했고 Yushu Technology는 거의 14% 상승했습니다.","so":"21财经","tm":"11/09 12:26","c":4,"r":"cn","u":"https://www.21jingji.com/article/20261109/herald/63e08bc2d762c92dc9320c59cb7a75a9.html","p":1794194760,"a":1794206165,"t":"人形机器人概念盘中飙升，上纬新材、祥明智能等10股涨停，宇树科技涨近14%","su":"11월 9일, A주 휴머노이드 로봇 콘셉트가 급등해 10개 상장사가 일일 한도에 도달했다. 보도 시간 현재 Shangwei New Materials 및 Xiangming Intelligent는 일일 한도 20cm에 도달했으며 Koyo, Jinghua New Materials, Huapei Power, Jingu, Aistar, Fulai New Materials, Riying Electronics 및 Shiyun Circuit은 일일 한도 10cm에 도달했습니다. Audiway와 Hechuan Technology는 16% 이상 상승했고 Yushu Technology는 거의 14% 상승했으며 Alt, Hanwei Technology, Pan Asia Microscope 등이 그 뒤를 이었습니다. 소식에 따르면 지난 11월 5일부터 10일까지 진행된 제9회 중국국제수입박람회 기간 중 Revo 3, Lens Technology의 Dexterous Hand, Zhiyuan Genie G2, Yuanzheng A3 휴머노이드 로봇 등의 전시품이 중국관에서 공개됐다."},{"s":"KTL, AI 휴머노이드 안전·보안 평가 기반 구축…기업 시험인증 지원","so":"파이낸셜뉴스","tm":"11/09 15:10","c":3,"r":"kr","u":"https://www.fnnews.com/news/202611091509000339","p":1794204623,"a":1794206162,"su":"한국산업기술시험원이 인공지능 휴머노이드 로봇의 산업현장 도입을 지원하기 위해 안전·보안 평가 기반 구축에 나선다.이번 세미나는 올해부터 5년간 추진되는 'AI 휴머노이드 안전성 및 보안 평가 기반구축' 사업의 일환으로 마련됐다.한국전자기술연구원이 주관하고.."},{"s":"Yushu Technology의 장중 시장 가치가 3000억 위안 -36 크립톤으로 회복되었습니다.","so":"36kr","tm":"11/09 12:04","c":3,"r":"cn","u":"https://36kr.com/newsflashes/4061920649745287","p":1794193496,"a":1794206166,"t":"宇树科技盘中市值重回3000亿元-36氪","su":"볼케이노 엔진이 보안 점검을 진행 니다. 신청 조직은 회사, 클럽, 입법회/구 의회 의원 등 홍콩의 대중 또는 지역 주민을 위해 설립된 조직이어야 합니다."},{"s":"'커뮤니티 속의 로봇' 파일럿 프로그램 신청 접수, 휴머노이드 로봇이 커뮤니티 활동에 참여","so":"RTHK News","tm":"11/09 17:17","c":2,"r":"hk","u":"https://news.rthk.hk/rthk/ch/component/k2/1877133-20261109.htm","p":1794212220,"a":1794214320,"t":"「機器人走入社區」試驗計劃接受申請 人形機器人參與社區活動","su":"디지털 정책실은 이제 \"커뮤니티 속의 로봇\" 파일럿 프로그램을 통해 자격을 갖춘 조직이 무료 커뮤니티 행사에서 공연할 로봇 대여 신청을 허용할 것이라고 발표했습니다. 마감일은 이달 20일이며, 전형료는 무료다. 시범 프로젝트를 통해 시민들은 \"Youzhhibao\"라는 휴머노이드 로봇을 무료로 빌려주고 지역 사회 단체가 주최하는 활동에 참여할 수 있어 휴머노이드 로봇과 더 가까이 다가갈 수 있습니다."},{"s":"애플, 휴머노이드 로봇 자율 제어시스템 '헤일로' 개발","so":"로봇신문","tm":"11/09 17:13","c":2,"r":"kr","u":"https://www.irobotnews.com/news/articleView.html?idxno=49466","p":1794212018,"a":1794242717,"su":"애플이 사람의 원격 조작 없이 가상 환경에서 학습 데이터를 생성하고, 실제 환경에 적용할 수 있는 휴머노이드 로봇 자율제어 시스템 ‘헤일로(HALO)’를 공개했다"},{"s":"AI 아침뉴스 | 엔비디아는 대규모 강도 사건을 겪었고 7,600만 위안 이상의 상품이 미스터리하게 사라졌습니다. 애플 연구팀, 로봇 '브레인'의 발전과정 공개","so":"Jiemian.com","tm":"11/09 09:34","c":2,"r":"cn","u":"https://m.jiemian.com/article/15308219.html","p":1794184443,"a":1794207316,"t":"AI早报 | 英伟达遭遇大劫案，超7600万元货物离奇失踪；苹果研究团队披露机器人“大脑”进展","su":"China Mobile Cloud Company는 Beijing Zhipu Huazhang Technology Co., Ltd.와 협력 계약을 체결했습니다. 탑스타는 양 팔의 하중이 10kg에 달하는 산업용 이족보행 휴머노이드 로봇 '스타'를 출시했다."},{"s":"Shanghai Silver와 Yateli Youxi가 애플을 따라 로봇 사업 기회를 포착했습니다.","so":"經濟日報","tm":"11/09 09:00","c":2,"r":"tw","u":"https://money.udn.com/money/story/5612/9867939?from=udnamp-referralnews_ch1001artbottom","p":1794182400,"a":1794242721,"t":"上銀、雅特力有喜 跟著蘋果搶機器人商機","su":"애플은 자체 개발한 휴머노이드 로봇 두뇌 'HALO'를 출시해 본토 로봇 대기업 Yushu의 제품에 탑재했다. 업계에서는 Yushu도 향후 애플 로봇의 핵심 파트너가 될 것이라고 낙관하고 있으며, Shangyin(2049), Yatli-KY(6907) 등 Yushu 공급망도 그 뒤를 따를 것입니다."},{"s":"[다시보기] 휴머노이드 빅뱅 1회","so":"programs.sbs.co.kr","tm":"11/09 00:43","c":2,"r":"kr","u":"https://programs.sbs.co.kr/programTemplate/amp/vod/humanoidbigbang/22000639386","p":1794152602,"a":1794177888,"su":"1회 휴머노이드 빅뱅 육체를 얻은 AI, 공존의 조건 방송일 2026.11.08 (월) 로봇의 관절인 액추에이터와 손가락에 숨겨진 비밀부터, 중국의 600만 원짜리 보  사전 훈련을 기반으로 하며 자기 촉각, 시각 촉각 및 압저항의 세 가지 주요 감지 원리를 다루고 있습니다. 다양한 손재주와 액션 모델이 사용할 수 있도록 다양한 신호를 동일한 촉각 표현 세트로 변환할 수 있습니다. Sinolink Securities는 물리적 AI의 핵심에는 접촉력, 접선력, 변형, 접촉 타이밍 및 기타 데이터와 같은 물리적 상태 데이터가 필요하다고 지적했습니다. 이러한 촉각 데이터에는 실제 상호 작용 수집 및 주석이 필요합니다. 2026년 초에 고품질의 실제 물리적 상호 작용 데이터의 전 세계 재고는 약 500,000시간인 반면, 일반 구현 모델 교육에는 최소 1,000만 시간이 필요합니다. 재고는 수요의 5% 미만이다. 중장기적으로 촉각 획득 관련 장비에 대한 수요가 많습니다."},{"s":"[리포트 브리핑]두산로보틱스, 'Automation에서 Autonomy로' 목표가 68,000원 - NH투자증권","so":"뉴스핌","tm":"11/11 13:55","c":1,"r":"kr","u":"https://www.newspim.com/news/view/20261111000950","p":1794372900,"a":1794377578,"su":"[서울=뉴스핌] 로보뉴스 = NH투자증권에서 11일 두산로보틱스(454910)에 대해 'Automation에서 Autonomy로'라며 투자의견 'BUY(신규)'의 신규 리포트를 발행하였고, 목표가 68,000원을 내놓았다. 전일 종가 기준으로 볼 때, 이 종목의 주가는 목표가 대비 34.1%의 추가 상승여력이 있다는 해석이 가능하다. ◆ 두산로보틱스 리포트 주요내용 NH투자증권에서 두산로보틱스(454910)에 대해 '두산로보틱스는 리레이팅을 위한 과도기를 거치는 중."},{"s":"베이징: 2028년까지 세계 최고 수준의 5개 이상, 국내 최고의 휴머노이드 로봇 완성 기계 기업 10개 이상 육성 노력","so":"第一财经","tm":"11/11 13:43","c":1,"r":"cn","u":"https://www.yicai.com/news/103435910.html","p":1794372239,"a":1794377583,"t":"北京：力争到2028年培育不少于5家国际一流、10家国内领先的人形机器人整机企业","su":"{{aisd}} AI 생성 면책조항 베이징 경제 정보(Beijing Economic Information)에 따르면 \"실체형 지능형 로봇 산업의 고품질 발전을 위한 베이징 실행 계획(2026-2028)\"이 발표되었습니다. 이 계획은 베이징이 구현된 지능형 로봇 산업을 고정밀 산업의 중요한 영역이자 미래 산업의 핵심 돌파구로 간주하고 산업의 고품질 발전 촉진을 가속화하며 2028년까지 5개 이상의 세계 일류 기업과 10개의 국내 선도 기업을 육성하기 위해 노력할 것이라고 제안합니다. 완전한 로봇 기업으로서 구현된 지능형 모델, 로봇 본체 및 핵심 기술은 모두 세계 일류 수준에 도달했습니다. 베이징-천진-허베이 지역은 전국 전체 기계 생산 능력의 25%를 차지하고 핵심 부품 일치율은 60%를 초과합니다. 전체 수명주기, 다부처 협력 참여를 포괄하는 과학적이고 효과적인 안전 거버넌스 시스템을 구축하고, 이 도시를 세계적 수준의 지능형 로봇 기술 구현 및 산업 혁신의 고지로 건설하는 것은 이번이 처음입니다."},{"s":"베이징: '두 세션과 하나의 경쟁'을 위해 로봇 브랜드를 계속해서 연마합니다.","so":"第一财经","tm":"11/11 13:43","c":1,"r":"cn","u":"https://www.yicai.com/brief/103435914.html","p":1794372180,"a":1794377808,"t":"北京：持续擦亮机器人“两会一赛”品牌","su":"베이징경제정보(Beijing Economic Information)에 따르면, '베이징 구현 지능형 로봇 산업 고품질 발전 실행 계획(2026-2028)'이 발표되었으며, 이 계획은 로봇의 '두 세션과 하나의 경쟁' 브랜드를 지속적으로 연마할 것을 제안합니다. 사람을 키우다"}, }
function renderTabs(){
  $('tabs').innerHTML = D.themes.map(function(t, i){
    var dot = newest(t) > (S.seen[t.name] || 0) && i !== S.tab;
    return '<button class="tab'+(i===S.tab?' on':'')+'" onclick="openTab('+i+')">'+esc(t.name)+
           '<b>'+visible(t).length+'</b>'+(dot?'<span class="dot" title="새 뉴스"></span>':'')+'</button>';
  }).join('');
  var on = $('tabs').children[S.tab]; if(on && on.scrollIntoView) on.scrollIntoView({block:'nearest', inline:'center'});
}
function renderCtrl(){
  var br = D.themes[S.tab].breaking;
  var h = '';
  if(!br){
    h += '<button class="'+(S.sort==='c'?'on':'')+'" onclick="setSort(\'c\')">🔥 화제순</button>';
    h += '<button class="'+(S.sort==='p'?'on':'')+'" onclick="setSort(\'p\')">🕒 최신순</button><span class="sep"></span>';
  }
  h += '<button class="'+(S.region==='all'?'on':'')+'" onclick="setRegion(\'all\')">전체</button>';
  D.regions.forEach(function(r){
    h += '<button class="'+(S.region===r.k?'on':'')+'" onclick="setRegion(\''+r.k+'\')">'+esc(r.l)+'</button>';
  });
  $('ctrl').innerHTML = h;
}
function card(n, prev){
  var hot = n.c > 1 ? '<span class="hot'+(n.c>=5?' big':'')+'">🔥 언론 '+n.c+'곳</span>' : '';
  var isNew = prev && n.a > prev ? ' <span class="new">NEW</span>' : '';
  return '<a class="card" href="'+esc(n.u)+'" target="_blank" rel="noopener" data-s="'+esc(n.su||'')+'" data-so="'+esc(n.so)+'">'+
    '<div class="meta">'+hot+esc(RL[n.r]||'')+' · '+esc(n.so)+' · '+esc(n.tm)+isNew+'</div>'+
    '<div class="title">'+esc(n.s)+'</div>'+(n.t?'<div class="orig">'+esc(n.t)+'</div>':'')+'</a>';
}
function renderMain(){
  var t = D.themes[S.tab], list = sorted(visible(t), t.breaking), prev = S.prev[t.name] || 0;
  var h = '<h2>'+esc(t.name)+'</h2>' + (t.note ? '<p class="note">'+esc(t.note)+'</p>' : '');
  var fresh = prev ? list.filter(function(n){ return n.a > prev; }).length : 0;
  if(S.onlyNew){                                // '새 기사만 보기' 중
    list = list.filter(function(n){ return n.a > prev; });
    h += '<button class="newbar" onclick="onlyNew(false)">🆕 새 기사 '+list.length+'개만 보는 중 · 전체 보기</button>';
  } else if(fresh && !t.breaking){              // 새 기사가 정렬 때문에 아래로 밀려도 바로 찾을 수 있게
    h += '<button class="newbar" onclick="onlyNew(true)">🆕 새 기사 '+fresh+'개 · 새 기사만 보기</button>';
  }
  if(!list.length) h += '<p class="none">'+(S.region==='all' ? '최근 ' + (t.breaking?'속보':'기사') + ' 없음' : esc(RL[S.region])+' 기사 없음')+'</p>';
  h += list.slice(0, S.shown).map(function(n){ return card(n, prev); }).join('');
  var extra = list.length - S.shown;
  if(extra > 0) h += '<button class="more" onclick="more()">더보기 ▾  ('+extra+'개 더)</button>';
  else if(S.shown > D.show) h += '<button class="more" onclick="less()">접기 ▴</button>';
  var auto = Object.keys(D.auto);
  h += '<footer>업데이트 '+esc(D.updated)+' · 최근 3일 · 믿을 만한 언론사 기사만 · 기사를 누르면 한국어 요약 → 원문 보기<br>'+
       '🔥 언론 N곳 = 같은 소식을 보도한 언론사 수 (많을수록 화제) · <span style="color:var(--red)">●</span> = 새 뉴스'+
       '<br><br><b>자동으로 추가된 언론사</b> (주요 언론보다 먼저 보도하고, 주요 언론도 함께 다룬 소식이 많은 곳 · 최근 14일)'+
       (auto.length ? auto.map(function(k){ return '<div>'+esc(k)+': '+esc(D.auto[k].join(', '))+'</div>'; }).join('') : '<div>아직 없음</div>')+
       '</footer>';
  $('main').innerHTML = h;
}
function openTab(i){
  var t = D.themes[i];
  S.tab = i; S.shown = D.show; S.onlyNew = false; save('tabname', t.name);
  if(!(t.name in S.prev)) S.prev[t.name] = S.seen[t.name] || 0;     // 이 탭에서 NEW 로 보여줄 기준
  S.seen[t.name] = Math.max(S.seen[t.name] || 0, newest(t)); save('seen', S.seen);  // 탭에 들어오면 레드닷 지움
  history.replaceState(null, '', '#t'+i);
  renderTabs(); renderCtrl(); renderMain(); window.scrollTo(0, 0);
}
function setSort(k){ S.sort = k; save('sort', k); S.shown = D.show; renderCtrl(); renderMain(); }
function setRegion(k){ S.region = k; save('region', k); S.shown = D.show; renderTabs(); renderCtrl(); renderMain(); }
function more(){ S.shown += 20; renderMain(); }
function onlyNew(on){ S.onlyNew = on; S.shown = D.show; renderMain(); }
function less(){ S.shown = D.show; renderMain(); window.scrollTo(0, 0); }
$('upd').textContent = '업데이트 ' + D.updated + ' · 탭을 눌러 테마별 뉴스 보기';

// 🚨 미국 속보 · 🌏 해외 속보는 페이지를 새로 올리지 않아도 최신 내용을 바로 가져옴
function refreshBreaking(){
  if(!window.fetch) return;
  fetch(D.breaking_url + '?t=' + Date.now(), {cache:'no-store'}).then(function(r){ return r.json(); }).then(function(b){
    var all = b.items || [];
    D.themes.forEach(function(t, i){
      if(!t.breaking) return;
      var items = all.filter(function(n){ return n.theme === t.name; }).map(function(n){
        var d = {s:n.show, so:n.source||'', tm:n.time||'', c:n.count||1, r:n.rk||'us', u:n.url||n.link, p:Math.floor(n.pub), a:Math.floor(n.added||n.pub)};
        if(n.show !== n.title) d.t = n.title; if(n.sum) d.su = n.sum; return d;
      });
      if(!items.length && t.items.length) return;
      t.items = items;
      if(S.tab === i){ S.seen[t.name] = Math.max(S.seen[t.name]||0, newest(t)); save('seen', S.seen); renderMain(); }
    });
    renderTabs();
  }).catch(function(){});
}
openTab(S.tab);
refreshBreaking();
setInterval(refreshBreaking, 5 * 60 * 1000);
document.addEventListener('visibilitychange', function(){ if(!document.hidden) refreshBreaking(); });

// 기사를 누르면 먼저 한국어 요약 → 원문 볼지 선택
document.addEventListener('click', function(e){
  var c = e.target.closest('a.card'); if(!c) return;
  if(e.ctrlKey||e.metaKey||e.shiftKey) return;
  e.preventDefault();
  $('s-meta').innerHTML = c.querySelector('.meta').innerHTML;
  $('s-title').textContent = c.querySelector('.title').textContent;
  var o = c.querySelector('.orig'); $('s-orig').textContent = o ? o.textContent : '';
  var sm = c.dataset.s || '';
  $('s-sum').textContent = sm || '이 기사는 요약을 가져오지 못했어요. (사이트가 자동 접속을 막았거나 아직 준비 중)';
  $('s-sum').className = 's-sum' + (sm ? '' : ' empty');
  $('s-go').href = c.href;
  // 외국어 기사면 ✦ Gemini 버튼 보이기 (한국어 기사는 숨김)
  var foreign = !!o;
  $('s-cs').hidden = $('s-ct').hidden = $('s-cnote').hidden = !foreign;
  if(foreign){
    // 원문을 열고, Gemini 가 '지금 화면'의 기사를 읽고 답하도록 요청 문장만 복사
    $('s-cs').href = $('s-ct').href = c.href;
    $('s-cs').dataset.q = '이 페이지의 기사 전체를 처음부터 끝까지 읽고 한국어로 요약해 줘. 핵심 내용 3~5줄, 그리고 투자자 입장에서 중요한 숫자와 의미를 짧게 정리해 줘.';
    $('s-ct').dataset.q = "너는 한국 경제신문의 국제부 전문 번역 기자야.\n이 페이지의 뉴스 기사 전체를 한국어로 번역해 줘.\n\n[번역 원칙]\n1. 정확성: 내용을 빼거나 보태지 말고, 문단 순서를 그대로 지켜 줘. 추측이나 의견은 넣지 마.\n2. 자연스러움: 직역투(~되어지다, ~에 의해, ~하는 것이다)를 피하고, 한국 경제신문 기사처럼 간결한 문장으로 써 줘. 긴 문장은 뜻이 바뀌지 않는 선에서 나눠도 돼.\n3. 숫자·단위: 금액, 퍼센트, 날짜는 정확히 옮기고 한국식으로 바꿔 줘. (예: $2.5 billion → 25억 달러, 3.2 percentage points → 3.2%포인트, Q3 → 3분기)\n4. 이름·용어: 회사명·인물명·기관명은 한국 언론에서 쓰는 표기를 따르고, 처음 나올 때만 괄호로 원문을 적어 줘. (예: 연방준비제도(Fed), 엔비디아(Nvidia))\n5. 금융 용어: 한국 증권가에서 쓰는 표현으로 옮겨 줘. (예: guidance → 실적 전망, bearish → 약세, short squeeze → 숏 스퀴즈)\n6. 인용문: 따옴표 안 발언은 말투를 살려 번역하고, 누가 한 말인지 분명히 해 줘.\n7. 애매한 부분: 원문 뜻이 둘 이상으로 읽히거나 확실하지 않은 표현은 번역 뒤에 [번역 메모]로 짧게 알려 줘.\n\n[출력 형식]\n- 첫 줄: 한국어 제목\n- 둘째 줄: 출처 · 날짜 (페이지에 있으면)\n- 본문: 원문 문단 순서대로 번역\n- 맨 끝: 「투자 포인트」 3줄 이내 (기사에 나온 사실만 근거로)\n\n기사가 길어서 한 번에 다 못 하면, 끝난 지점을 알려 주고 내가 \"계속\"이라고 하면 이어서 번역해 줘.";
  }
  $('dim').hidden = false; $('sheet').hidden = false; $('sheet').scrollTop = 0;
  document.body.style.overflow = 'hidden';
});
// ✦ 버튼: Gemini 요청 문장을 복사하고 원문을 엶 → 원문 화면에서 Gemini 를 불러 붙여넣기
function askAI(a){
  var q = a.dataset.q || '';
  try { if(navigator.clipboard) navigator.clipboard.writeText(q); } catch(e){}
  toast('요청 문장을 복사했어요 · 원문에서 측면 버튼 길게 → 「이 페이지에 관해 질문하기」 → 붙여넣기');
  setTimeout(closeSheet, 50);
}
function toast(msg){ var t = $('toast'); t.textContent = msg; t.hidden = false; clearTimeout(toast._t); toast._t = setTimeout(function(){ t.hidden = true; }, 4000); }
function closeSheet(){ $('dim').hidden = true; $('sheet').hidden = true; document.body.style.overflow = ''; }
document.addEventListener('keydown', function(e){ if(e.key==='Escape') closeSheet(); });
</script></body></html>
