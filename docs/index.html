<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#262624">
<title>투자 테마 뉴스</title>
<style>
@font-face{font-family:'ChosunIlboMyungjo';src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_one@1.0/Chosunilbo_myungjo.woff') format('woff');font-weight:normal;font-display:swap}
:root{color-scheme:dark;--bg:#262624;--card:#30302e;--card2:#3a3a37;--text:#faf9f5;--sub:#a6a39a;--line:#3e3e3a;--acc:#d97757;--red:#ef4444}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.55 'ChosunIlboMyungjo',Georgia,"Noto Serif KR",serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:760px;margin:auto}
header{padding:20px 16px 8px}
h1{font:600 22px/1.3 'ChosunIlboMyungjo',Georgia,serif;margin:0 0 4px}
.upd{color:var(--sub);font-size:12.5px}
/* 테마 탭 */
.tabs{position:sticky;top:0;z-index:3;background:rgba(38,38,36,.96);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.tabrow{display:flex;gap:8px;overflow-x:auto;padding:12px 16px 10px;scrollbar-width:none}.tabrow::-webkit-scrollbar{display:none}
.tab{position:relative;flex:none;padding:9px 15px;border-radius:12px;border:1px solid var(--line);background:var(--card);
  color:var(--sub);font:inherit;font-size:14px;cursor:pointer}
.tab b{margin-left:5px;color:var(--sub);font-weight:400;font-size:12px}
.tab.on{background:var(--acc);border-color:var(--acc);color:#1f1e1d;font-weight:600}.tab.on b{color:#1f1e1d}
.dot{position:absolute;top:-3px;right:-3px;width:11px;height:11px;border-radius:50%;background:var(--red);border:2px solid var(--bg)}
/* 정렬·국가 */
.ctrl{display:flex;gap:6px;overflow-x:auto;padding:0 16px 10px;scrollbar-width:none}.ctrl::-webkit-scrollbar{display:none}
.ctrl button{flex:none;border:1px solid var(--line);background:transparent;color:var(--sub);border-radius:8px;padding:5px 11px;font:inherit;font-size:12.5px}
.ctrl button.on{background:var(--card2);border-color:var(--card2);color:var(--text)}
.ctrl .sep{flex:none;width:1px;background:var(--line);margin:2px 4px}
main{padding:6px 12px 48px}
h2{font:600 19px/1.3 'ChosunIlboMyungjo',Georgia,serif;margin:16px 4px 2px}
.note{margin:0 4px 10px;color:var(--sub);font-size:12px}
.none{color:var(--sub);margin:24px 4px;text-align:center}
.card{display:block;background:var(--card);border-radius:12px;padding:12px 14px;margin:8px 0;color:var(--text);text-decoration:none;transition:background .15s}
.card:hover{background:var(--card2)}.card:active{opacity:.75}
.meta{color:var(--sub);font-size:12px}
.title{font-weight:500;margin-top:3px}
.orig{color:var(--sub);font-size:12px;margin-top:3px}
.new{margin-left:4px;color:var(--red);font-size:11px;font-weight:700;letter-spacing:.3px}
.hot{display:inline-block;margin-right:6px;padding:0 6px;border-radius:4px;background:rgba(217,119,87,.16);color:var(--acc);font-weight:600}
.hot.big{background:var(--acc);color:#1f1e1d}
.newbar{display:block;width:100%;margin:2px 0 6px;padding:9px;border:0;border-radius:10px;background:rgba(239,68,68,.14);color:#fca5a5;font:inherit;font-size:13px;text-align:left}
.more{display:block;width:100%;margin:4px 0 0;padding:10px;border:1px dashed var(--line);border-radius:12px;background:transparent;color:var(--sub);font:inherit;font-size:13px}
footer{margin:36px 4px 0;padding-top:14px;border-top:1px solid var(--line);color:var(--sub);font-size:12px;line-height:1.7}
footer b{color:var(--text);font-weight:600}
/* 요약 창 */
#dim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:5}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:6;max-width:760px;margin:auto;max-height:82vh;overflow-y:auto;
  background:var(--card);border-radius:16px 16px 0 0;padding:10px 18px calc(18px + env(safe-area-inset-bottom));box-shadow:0 -8px 30px rgba(0,0,0,.4)}
.grab{width:38px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 12px}
.s-title{font-size:17px;font-weight:600;margin:4px 0 2px;line-height:1.45}
.s-label{margin:16px 0 4px;color:var(--acc);font-size:12px;font-weight:700;letter-spacing:.5px}
.s-sum{font-size:15px;line-height:1.75}.s-sum.empty{color:var(--sub);font-size:13.5px}
.s-btns{display:flex;gap:8px;margin-top:20px}
.s-btns a{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;padding:11px 6px;border-radius:10px;font:inherit;font-size:13.5px;line-height:1.3;text-decoration:none;
  background:var(--acc);color:#1f1e1d;font-weight:600}
.s-btns a.cl{background:transparent;border:1px solid var(--acc);color:var(--acc)}
.s-close button{width:100%;margin-top:8px;padding:11px;border-radius:10px;background:transparent;border:1px solid var(--line);color:var(--sub);font:inherit;font-size:14px}
.s-cnote{margin-top:8px;color:var(--sub);font-size:11.5px;text-align:center}
#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);z-index:9;max-width:90%;padding:10px 16px;border-radius:10px;background:#faf9f5;color:#1f1e1d;font-size:13.5px;box-shadow:0 6px 20px rgba(0,0,0,.4)}
.seg{display:flex;gap:4px;margin:6px 4px 10px}.seg button{flex:1;min-width:0;border:1px solid var(--line);background:transparent;color:var(--sub);border-radius:8px;padding:7px 0;font:inherit;font-size:12.5px;white-space:nowrap}
.seg.ly{margin-top:-4px}.seg.ly button{padding:5px 0;font-size:12px}.seg.ly button.on{background:var(--card2);border-color:var(--acc);color:var(--text);font-weight:600}
.seg.sm{margin-bottom:8px}.seg.sm button{padding:9px 0;font-size:13px}.seg.sm button.on{background:var(--card2);border-color:var(--acc);color:var(--text)}
.warn{margin:0 4px 10px;padding:8px 10px;border-radius:8px;background:rgba(250,204,21,.08);color:var(--sub);font-size:12.5px;line-height:1.5}.warn b{color:var(--text)}
.seg button.on{background:var(--acc);border-color:var(--acc);color:#1f1e1d;font-weight:600}
.tot{margin:2px 4px 10px;color:var(--sub);font-size:13px}.tot b{color:var(--text)}.chgnote{font-size:11px}
.srow{background:var(--card);border-radius:12px;margin:6px 0;padding:10px 12px;cursor:pointer}.srow.open{background:var(--card2)}
.sline{display:flex;align-items:center;gap:8px}
.rk{width:18px;color:var(--sub);font-size:12px;text-align:right;flex:none}
.mv .gap{display:inline-block;width:3px}.mv{width:30px;flex:none;font-size:11px;font-weight:600;text-align:left;font-variant-numeric:tabular-nums;margin-right:-4px}.mv.up{color:#f87171}.mv.dn{color:#60a5fa}.mv.same{color:#a8a29e;font-size:15px;font-weight:700;line-height:1;padding-left:3px}
.sn{width:86px;flex:none;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb{flex:1;height:10px;background:rgba(255,255,255,.05);border-radius:5px;overflow:hidden;min-width:30px}.sb i{display:block;height:100%;background:var(--acc);border-radius:0 4px 4px 0}
.sc{width:54px;flex:none;text-align:right;font-size:14px;font-variant-numeric:tabular-nums}
.chg{width:48px;flex:none;text-align:right;font-size:11.5px;color:var(--sub)}.chg.up{color:#f87171}.chg.dn{color:#60a5fa}
.spark{flex:none}
.det{margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.dt{color:var(--sub);font-size:12px;margin:6px 0 4px}
.bars{width:100%;height:120px;display:block}.bars .ax{fill:var(--sub);font-size:9px}.bars .bar:hover rect+rect{opacity:.8}
.crow{display:flex;align-items:center;gap:8px;margin:3px 0;font-size:12.5px}.cl{width:86px;flex:none}.cb{flex:1;height:8px;background:rgba(255,255,255,.05);border-radius:4px;overflow:hidden}
.cb i{display:block;height:100%;background:var(--acc);opacity:.8;border-radius:0 3px 3px 0}.cn{width:50px;text-align:right;flex:none;font-variant-numeric:tabular-nums}
@media(max-width:400px){.spark{display:none}.sn{width:74px}}
</style></head><body>

디아는 지난주 13% 가까이 하락해 6개월 연속 하락세를 이어갔다."},{"s":"젠슨 황이 제단에서 떨어졌습니다! 인류의 기업공개(IPO)가 7배 가까이 초과 청약됐고, 월스트리트는 AI 골드러시의 새로운 주인공에 베팅","so":"自由時報","tm":"11/16 10:52","c":3,"r":"tw","u":"https://stock.ltn.com.tw/article/hytyrxrs8jjy","p":1794793957,"a":1794794320,"t":"黃仁勳跌落神壇！Anthropic IPO超額認購近7倍 華爾街押注AI淘金新主角","su":"엔비디아 CEO 젠슨 황이 큰 어려움에 처해 있는 동안, 인공지능 스타트업 앤트로픽은 역사상 최대 규모의 기업공개(IPO) 중 하나를 준비하고 있습니다. Dario Amodei CEO가 이끄는 앤트로픽은 상장(주식시장에 처음 들어오는 것) 이후 거의 7차례 청약을 받았으며 시장 목표 가치는 1조 4천억 달러(약 NT$ 45조 9600억)에 달해 AI 투자에 대한 월스트리트의 새로운 베팅을 촉발시켰습니다. 투자로"},{"s":"엔비디아 실적, 인류 최초 공모(IPO) 테스트 기술 상승세 전에 아시아 주가 하락","so":"CNA","tm":"11/16 10:35","c":3,"r":"sg","u":"https://www.channelnewsasia.com/business/asian-shares-fall-nvidia-earnings-anthropic-ipo-test-tech-rally-6553841","p":1794792936,"a":1794794321,"t":"Asian shares fall before Nvidia earnings, Anthropic IPO test tech rally","su":"시드니, 11월 16일 : 엔비디아 CEO 젠슨 황의 충격적인 사임으로 인해 일주일 동안 아시아 증시는 하락세를 보였습니다. 이번 주 반도체(전자기기의 두뇌 부품) 회사의 수익과 앤트로픽의 기업공개(IPO)는 AI가 주도하는 강세(오르는 힘이 센 것)장이 아직 더 진행될지 테스트할 예정입니다. 또한 이번 주 후반에는 도널드 트럼프 미국 대통령이"},{"s":"[마켓무버]뉴욕증시 혼조 마감…엔비디아 리더십 공백에 기술주 약세","so":"이데일리","tm":"11/16 08:12","c":3,"r":"kr","u":"https://www.edaily.co.kr/News/Read?newsId=01341526645646376&mediaCodeNo=257","p":1794784332,"a":1794784750,"su":"11월16일 이데일리TV 마켓시그널지난 13일(현지시간) 뉴욕증시는 엔비디아의 경영 불확실성과 금리 부담 속에 혼조세로 마감했다. 다우지수는 0.10% 상승했지만 나스닥과 S&P500(미국 큰 회사 500곳 지수)지수는 각각 0.91%, 0.40% 하락했다. 필라델피아 반도체(전자기기의 두뇌 부품)지수도 3.43% 떨어지..."},{"s":"K뷰티 ETF, 뉴욕증시에 떴다","so":"매일경제 마켓","tm":"11/15 17:24","c":3,"r":"kr","u":"https://stock.mk.co.kr/news/view/1199134","p":1794731077,"a":1794784750,"su":"K뷰티 ETF(여러 주식을 묶어 파는 상품), 뉴욕증시에 떴다 문가영 기자(moon31@mk.co.kr) 입력 : 2026.11.15 17:24:37 기네스 앳킨슨 K-뷰티 ETF 한국콜마 등 25개 종목 투자 한국 화장품 산업이 가파른 성장세를 이어가면서 미국 월가에 한국 뷰티 기업에 집중 투자하는 상장(주식시장에 처음 들어오는 것)지수펀드(ETF)가 출시됐다. 미국 자산운용사 기네스 앳킨슨 자산운용에 따르면 지난 12일(현지시간) 한국 화장품 제조사 등 25개 기업으로 구성된 인덱스를 추종하는 '기네스 앳킨슨 K-뷰티 ETF'(KBTY)가 뉴욕증권거래소 아르카에 신규 상장됐다."},{"s":"미국 증시의 급격한 하락 영향으로 대만 증시는 오늘 2,635포인트 급락해 역사상 두 번째로 큰 하락폭을 기록했다.","so":"經濟日報","tm":"11/16 15:01","c":2,"r":"tw","u":"https://money.udn.com/money/story/5607/9881677","p":1794808893,"a":1794809524,"t":"受美股重挫波及 台股今暴跌2635點 創史上第二大跌點紀錄","su":"오늘 대만 증시는 또 급락했습니다. 미국 반도체(전자기기의 두뇌 부품)주 폭락 영향으로 젠슨 엔비디아 CEO 황 회장 사임 논란 확산과 미국 물가·금리(돈을 빌릴 때 내는 이자 비율) 인상 우려가 닥치자 대만 증시는 하락세로 출발하고 매도압력이 계속 높아지며 4만3000포인트, 4만2000포인트를 연달아 돌파했다. 최종 가중지수는 2,635.04포인트(6.03%) 하락한 41,040포인트로 마감했다. 거래량은 NT$8,450억 6천만으로 증가했습니다. 이는 대만 주식 역사상 두 번째로 큰 마감점 하락폭으로, 올해 7월 17일의 2,953.71포인트 하락에 이어 두 번째입니다."},{"s":"미국 기술주의 큰 하락으로 대만 주식은 초반 거래에서 500포인트 이상 하락했습니다. 외환시장에서 외국자본에 대한 송금 압력이 완화되었습니다.","so":"經濟日報","tm":"11/16 10:45","c":2,"r":"tw","u":"https://money.udn.com/money/story/5607/9880985?from=udnamp-referralnews_ch1001artbottom","p":1794793536,"a":1794794317,"t":"美股科技股重挫拖累台股早盤跌逾500點　匯市外資匯出壓力趨緩","su":"미국 기술주는 계속해서 압박을 받고 있으며, 이로 인해 대만의 주식 시장과 외환 시장이 동시에 약세(내리는 흐름)를 보이고 있습니다. 대만 증시는 장 초반 43512.42포인트에 개장한 뒤 곧바로 매도 압력이 나타나 한때 700포인트 넘게 하락했다. 하락폭은 이후 수렴됐지만 하락폭은 여전히 ​​500포인트를 넘었다. 신대만달러는 미국 달러 대비 32.87대만달러로 출발한 후 32.9대만달러로 하락해 6.2센트 하락해 주식과 환차손이 모두 동반되는 패턴을 보였다."},{"s":"젠슨 황은 월스트리트에서 사임하고 엔비디아의 발언을 하향 조정했습니다. 소매 투자자들은 여전히 ​​바닥을 추측하기 위해 시장에 진입했습니다.","so":"自由時報","tm":"11/16 10:32","c":2,"r":"tw","u":"https://stock.ltn.com.tw/article/zryycxg2nxp8","p":1794792724,"a":1794792894,"t":"黃仁勳去職華爾街降輝達評價 散戶仍進場炒底","su":"엔비디아 주가는 젠슨 황 전 CEO의 갑작스러운 사임으로 급락했다. 그러나 미국 개인 투자자들은 딥을 매수하기 위해 시장에 진입할 기회를 잡았습니다. 단 30분 만에 엔비디아 주식 1억1100만 달러(약 36억4000만 달러)를 순매수(산 돈이 판 돈보다 많은 것)해 주식 개장 후 30분 동안 개인 투자자 순매수액 역대 최고 기록을 세웠다. 보고서는 미국의 일부 개인 투자자들이 여전히 주가 급락을 매수 기회로 여기고 있다는 점을 지적했는데, 이는 주로 인공지능(AI) 칩 시장에서 엔비디아의 지배력을 낙관하고 있기 때문이다."},{"s":"엔비디아, 해외 시장 뷰 & 미국 주식 픽업 ​​(11월 16일)","so":"日本経済新聞","tm":"11/16 10:17","c":2,"r":"jp","u":"https://www.nikkei.com/prime/veritas/article/DGXZQOKC1615K0W6A111C2000000","p":1794791871,"a":1794792895,"t":"エヌビディア、海外市場ビュー&米国株ピックアップ（11月16日）","su":"모든 기사를 무제한 1개월 무료 체험 실시중! 코어위브, 테라다인 해외시장 뷰&미국주 픽업(11월 12일) 엔비디아, 코어위브 해외시장 뷰&미국주 픽업(11월 11일) 해외시장뷰&미국주 픽업(9월 15일)"},{"s":"이익마진 초과한 S&P500 기업 수 감소 - 글로벌 금융 - Business Times","so":"中時新聞網","tm":"11/16 05:10","c":2,"r":"tw","u":"https://www.chinatimes.com/newspapers/20261116000213-260203","p":1794773400,"a":1794784778,"t":"標普500企業獲利超標家數急縮- 全球財經- 工商時報","su":"미국 기업들의 3분기 실적 보고서가 전반적으로 시장 기대치를 상회했지만, 이익 초과 폭이 크게 줄어들면서 기업 이익 성장 모멘텀(값이 움직이는 기세)이 점차 줄어들 수도 있다. 금융 데이터 조사 기관인 팩트셋(FactSet)이 발표한 보고서에 따르면 현재 S&P500(미국 큰 회사 500곳 지수) 지수 기업 중 88%가 3분기 실적 보고서를 발표했고, 그 중 84%가 3분기 실적 보고서를 발표했다."},{"s":"딥을 살 때까지 기다리시겠습니까? 월스트리트의 60%는 금 가격이 3,200달러까지 하락할 수 있다고 생각합니다.","so":"自由時報","tm":"11/15 22:03","c":2,"r":"tw","u":"https://stock.ltn.com.tw/article/bagn1djytcck","p":1794747829,"a":1794751314,"t":"抄底再等等？華爾街6成看空黃金 最慘恐跌至3200美元","su":"국제 금 가격은 계속 약세를 보이며 온스당 3,900달러라는 중요한 수준 아래로 떨어졌습니다. 지금은 하락세에 매수하기에 좋은 시기입니까, 아니면 또 다른 하락세의 시작입니까? 최신 Kitco Gold Weekly Survey에 따르면 월스트리트에 대한 약세 감정이 크게 증가한 것으로 나타났습니다. 많은 분석가들은 미국 달러 강세, 미국 채권 수익률(넣은 돈에 비해 얻는 이익 비율) 상승, 미 연준의 금리(돈을 빌릴 때 내는 이자 비율) 인상 기대로 인해 금값이 3,200달러까지 하락할 수 있다는 것이 가장 비관적인 전망이라고 경고했다."},{"s":"이번 주 미국 증시에서는 엔비디아의 실적 보고서 외에 또 어떤 변수를 관찰할 수 있을까?","so":"經濟日報","tm":"11/15 17:46","c":2,"r":"tw","u":"https://money.udn.com/money/story/6710/9880104","p":1794732405,"a":1794746284,"t":"輝達財報之外 本周美股還有哪些觀察變數？","su":"프랭클린인베스트먼트컨설팅은 이번 주 미국 증시에 주목해야 할 주요 변수를 5가지로 꼽았다. 첫 번째는 중동 정세와 유가다. 미-이란 협상의 진전 상황, 호르무즈 해협과 홍해의 교통 상황, 유가 변동 등을 주목해야 한다. 두 번째는 연준: 연방공개시장운영위원회(FOMC) 의사록과 경제, 고용, 인플레이션(물건값이 계속 오르는 것), 금리(돈을 빌릴 때 내는 이자 비율) 등에 대한 관료들의 견해를 주목하세요. 10월의 소매 판매, 산업 생산, 건축 허가, 신규 주택 착공 등. 넷째, 기업 실적 보고서: 이번 주 실적 보고서를 발표할 16개 기업에는 엔비디아, Intuition, Palo Alto Internet, Red Cat, Wal-Mart, Ross Department Store, Target Department Store, Home Depot, Lowe's Company, Bath & Body Works, 윌리엄스-Sonoma, Disney 등이 있습니다."},{"s":"젠슨 황이 사임한 후 엔비디아 주식을 구매해야 합니까? 월스트리트는 투자자들에게 답변을 제공합니다","so":"自由財經","tm":"11/15 15:52","c":2,"r":"tw","u":"https://ec.ltn.com.tw/article/breakingnews/5641488","p":1794725574,"a":1794727052,"t":"黃仁勳下台後該買進輝達股票嗎？華爾街給了投資者答案","su":"[금융채널/종합보도] 외신 'The Motley Fool'은 젠슨 황의 퇴임과 승계 계획이 여전히 불분명한 상황에서 투자자들이 엔비디아의 운영 위험을 재평가하기 시작했으며 주가도 매도 압력에 직면했다고 보도했습니다. 그러나 월스트리트 분석가들은 엔비디아의 시장 전망에 대해 다른 견해를 가지고 있습니다."},{"s":"거의 120억 달러에 달하는 엔비디아 칩 거래가 노출되었습니다! 월스트리트저널은 중국이 말레이시아의 컴퓨팅 파워 네트워크를 이용하고 있다고 폭로했다.","so":"自由財經","tm":"11/15 13:13","c":2,"r":"tw","u":"https://ec.ltn.com.tw/article/breakingnews/5641312","p":1794715999,"a":1794727055,"t":"近120億美元輝達晶片交易曝光！華爾街日報揭中國借道大馬算力網","su":"[Chen Chengliang 편집/종합 보고서] 미국은 고급 AI 칩의 중국 수출을 제한하고 있지만, 중국 기업은 동남아시아 데이터센터(컴퓨터 수만 대를 모아 둔 건물)를 통해 엔비디아 칩을 계속 사용할 수도 있다. 월스트리트저널이 입수한 거래 기록에 따르면 젠슨 황의 혼외 관계 파트너 앨리스 후는"},{"s":"나스닥 100 선물 하락폭 1%로 확대","so":"Jiemian.com","tm":"11/16 14:55","c":1,"r":"cn","u":"https://m.jiemian.com/article/15336668.html","p":1794808513,"a":1794809522,"t":"纳斯达克100指数期货跌幅扩大至1%","su":"등록/로그인 개인 센터 홈 세계 중국 매크로 엔터테인먼트 스포츠 패션 문화 여행 생활 게임 비뚤어진 건물 데이터 정오 예술 비즈니스 기술 자동차 부동산 증권 금융 소비 산업 교통 투자 마케팅 직장 관리 기업가 정신 해외 부동산 시장 부 건강 광역 베이지역 주류 산업 블록체인 ESG 싱크탱크 더 많은 뉴스 인기 기사 동영상 사진 주문 특별 주제 라이브 앱 다운로드 원본 뉴스 나스닥(미국 기술 회사들이 많은 주식시장) 100 선물 1% 하락, S&P500(미국 큰 회사 500곳 지수) 선물 하락 0.48%, 다우존스 선물은 0.16% 하락했습니다."},{"s":"연준의 금융 안정성 보고서는 AI 관련 위험에 대해 경고합니다. 데이터 센터 건설에 사용되는 전방 임대 및 백업 보증 규모는 약 3조 달러에 달합니다.","so":"ThePaper.cn","tm":"11/16 14:21","c":1,"r":"cn","u":"https://www.thepaper.cn/newsDetail_forward_34488735","p":1794806464,"a":1794806806,"t":"美联储金融稳定报告预警AI相关风险：用于数据中心建设的远期租赁与兜底担保规模已达约3万亿美元","su":"近日，美联储发布新一期金融稳定报告显示，通过调查发现，AI相关风险成为受访者提及最多的未来12至18个月美国金融稳定潜在风险，87%的受访者将其列为重要风险，较"},{"s":"민주당이 의회에서 승리하면 AI 규제에 대한 불확실성이 높아지고 미국의 두 가지 주요 주식 ETF에 도입 기회가 생길 것입니다.","so":"UDN","tm":"11/16 13:55","c":1,"r":"tw","u":"https://udn.com/news/story/123006/9881527","p":1794804955,"a":1794806405,"t":"民主黨若奪國會AI監管變數升高 兩大美股ETF迎布局契機","su":"미국 중간선거가 2027년 정책 동향에 영향을 미치게 된다. 민주당이 의회를 장악하게 되면 AI 규제, 관세, 그린에너지 정책 등이 새로운 변수를 낳을 수 있고, 시장 변동성(값이 크게 출렁이는 정도)은 커질 수밖에 없다. 그러나 역사적 경험으로 볼 때 미국 증시는 중간 선거 이후 더 나은 성과를 보이는 경향이 있으며 다우 Jones와 S&P500(미국 큰 회사 500곳 지수) 지수 ETF는 자본 헤징 옵션이 되었습니다."},{"s":"모건스탠리 “S&P500 15% 상승 여력…대만보다 한국 주식 선호”｜Global Money Club","so":"중앙일보","tm ,"p":1794799980,"a":1794806412,"t":"比拼華爾街－溫傑 | AI股重挫拖累大市，微軟趁回調分段部署（有片）","su":"월스트리트와 경쟁하다 - Wen Jie | AI주 폭락하며 시장 하락세, 마이크로소프트는 조정을 틈타 단계적 전개(일부)로 지난주 금요일(13일) 시장이 인공지능(AI) 부문 조정과 미 연방준비제도(연준)의 정책 전망에 촛점을 맞추는 가운데 미국 증시 실적이 양분됐다. AI주 매도 압력으로 필라델피아 반도체지수와 나스닥 종합지수는 각각 3.4%, 0.9% 하락했고, S&P500(미국 큰 회사 500곳 지수) 지수도 0.4% 하락했다. 그러나 10월 미국 생산자물가(공장에서 파는 물건값 수준)지수(PPI) 증가율이 시장 전망보다 낮아 연준의 추가 긴축 통화정책에 대한 일부 투자자들의 우려가 완화되었습니다. 다우존스 산업평균지수는 추세를 거스르고 0.1% 상승했습니다. 또한 고평가 성장주에서 금융, 유틸리티 등 방어 부문에 이르기까지 자본 흐름에 상당한 변화가 있었습니다."},{"s":"충격 걱정은 NO! 모건스탠리, 글로벌 주식시장에 '최대 비중 확대' 외침, AI 지출 낙관, 안정적, S&P 15% 추가 상승","so":"經濟日報","tm":"11/16 12:22","c":1,"r":"tw","u":"https://money.udn.com/money/story/123398/9881266","p":1794799368,"a":1794806410,"t":"無懼震盪！大摩高喊「最大加碼」全球股市 看好 AI 支出穩 標普再漲15%","su":"모건스탠리는 AI 자본 지출 사이클이 견조하게 유지되고 경제 및 기업 이익 성장의 회복력이 내년까지 연장될 것이라는 점을 근거로 글로벌 주식에 '최대 비중확대' 배분을 권고했다."},{"s":"[월스트리트 오리지널 보이스] 연방준비제도(연준)가 AI 자금조달 리스크를 우려하면서 시장의 우려도 크게 높아졌다.","so":"财新数据","tm":"11/16 12:17","c":1,"r":"cn","u":"https://database.caixin.com/2026-11-16/102505178.html","p":1794799020,"a":1794806401,"t":"【华尔街原声】美联储关注AI融资风险，市场担忧显著升温","su":"설문 조사에 따르면 응답자의 87%가 AI를 잠재적 위험으로 꼽았으며 민간 신용의 투명성 부족이 우려의 원인인 것으로 나타났습니다."},{"s":"반도체 중심 증시 약세 속 연준 금리 전망까지 이시각 주요뉴스","so":"연합인포맥스","tm":"11/16 11:39","c":1,"r":"kr","u":"https://news.einfomax.co.kr/news/articleView.html?idxno=4444937","p":1794796746,"a":1794797179,"su":"반도체(전자기기의 두뇌 부품) 불확실성이 국내 증시에 미친 영향은 무엇일까요? 코스피(한국 대표 주식시장 지수)·코스닥 동향과 알리안츠의 미국 금리 전망, 은행연합회장 선출, 엔비디아 지분 이슈, 자동차 수출 실적을 살펴봅니다. 주요 경제 흐름을 놓치지 않도록 구독해 주세요."},{"s":"【마츠이 증권】앤트로픽 상장 기념 「미국 주식 데뷔 CP」 개최","so":"株探","tm":"11/16 11:21","c":1,"r":"jp","u":"https://s.kabutan.jp/news/n202611160440/","p":1794795703,"a":1794797184,"t":"【松井証券】アンソロピック上場記念「米国株デビューCP」開催","su":"[마츠이 증권] 앤트로픽 상장(주식시장에 처음 들어오는 것) 기념 '미국 주식 데뷔 CP' 개최 마츠이 증권 <도쿄 P>는 미국 AI 개발 기업 앤트로픽 <ANT>의 상장을 기념하여 AI 관련 유명 상표를 대상으로 한 '미국 주식 데뷔 캠페인'을 개최하고 있다. 내년 1월 29일까지. 마츠이 증권으로 처음으로 미국 주식을 거래하고, 기간 중에 대상 종목을 현물로 매입해, 전용 폼으로부터 엔트리한 사람이 대상(거래와 엔트리의 순서는 불문). NISA 계좌에서의 매입이나 매각만은 대상외가 된다. 조건을 만족하면 약정대금(상한 2000달러)에 걸리는 거래수수료가 캐쉬백된다."},{"s":"연준의 금리 인상 속도가 바뀌었나요? 보스턴 연준 총재 \"내년 금리 예상보다 높아질 수도\"","so":"鉅亨網","tm":"11/16 11:10","c":1,"r":"tw","u":"https://m.cnyes.com/news/id/6662743","p":1794795004,"a":1794795237,"t":"聯準會升息步調有變？波士頓聯準銀行總裁：未來一年利率恐高於預期","su":"콜린스 보스턴 연준 총재는 경제 전망의 불확실성에 대응하여 연준이 안정적이고 점진적인 속도로 금리를 약간 인상할 것을 지지합니다.\n그녀는 미국의 인플레이션(물건값이 계속 오르는 것)이 여전히 높고 고용도 안정적이라고 지적했습니다. 시장에서는 9월 이후 12월 8일과 9일 금리를 4~4.25%로 0.25%포인트(퍼센트끼리 뺀 차이) 더 인상할 것으로 예상하고 있다.\n콜린스는 올해 초 중장기 금리 인상이 수요를 억제할 수는 있지만 여전히 금리 인상 속도를 높일 이유가 없다고 말했다. 내년 정책 금리는 이전에 예상했던 것보다 약간 높을 수 있습니다."},{"s":"젠슨 황의 사임 논란이 확산됩니다! 엔비디아의 실적 보고서는 미국 상위 50개 주식에 배치된 8%, 0.09813백만 위안에 충격을 줄 수 있습니다.","so":"UDN","tm":"11/16 11:09","c":1,"r":"tw","u":"https://udn.com/news/story/123006/9881046","p":1794794985,"a":1794797181,"t":"黃仁勳卸任風波延燒！輝達財報恐震8％ 009813萬元布局美股50強","su":"뉴스 듣기 0:00 / 0:00 젠슨 황의 사임이 논란을 불러일으켰습니다! 엔비디아의 실적(회사가 번 돈 성적표) 보고서는 8%에 충격을 줄 수 있습니다. NT$0.09813백만은 미국 상위 50개 주식에 배치됩니다. 엔비디아는 대만 시간으로 11월 18일 이른 아침에 3분기 실적 보고서를 발표하고 기자 회견을 가질 예정입니다. 창업자인 젠슨 황이 사임한 후 처음으로 분기 실적을 발표하는 만큼 시장의 위험회피 성향이 급격히 높아졌다. 옵션시장에서는 엔비디아 주가가 최대 8%까지 등락할 수 있다고 전망하고 있다. 이러한 불확실성의 영향으로 오늘(16일) 대만 증시는 장 초반 1,450포인트 이상 하락했고, 미국 기술주도 최근 높은 변동성(값이 크게 출렁이는 정도)을 보이며 블랙록 S&P 엑설런트 50(009813)이 오늘 장 초반 소폭 하락세를 보였다. , 장중 최저가는 NT$11.35를 기록했고 오전 10시 현재 NT$11.37(지난주 종가는 NT$11.47)에 거래되어 최근 52주 최고가인 NT$11.85에서 보기 드문 되돌림 공간을 남겼습니다."},{"s":"다우, S&P500, 나스닥 Futures Edge Lower As Markets Brace For 엔비디아 수익, 인류 최초 공모(IPO), 연준 회의록: SMMT, NBIS, HELP, MSTR 집중","so":"Yahoo Finance","tm":"11/16 11:04","c":1,"r":"us","u":"https://finance.yahoo.com/markets/stocks/articles/dow-p-500-nasdaq-futures-020421221.html","p":1794794640,"a":1794797181,"t":"Dow, S&P 500, Nasdaq Futures Edge Lower As Markets Brace For Nvidia Earnings, Anthropic IPO, Fed Minutes: SMMT, NBIS, HELP, MSTR In Focus","su":"엔비디아는 11월 17일 임시 CEO 콜레트 크레스의 지휘 하에 3분기 실적(회사가 번 돈 성적표)을 발표할 예정입니다."},{"s":"모건스탠리는 2027년 S&P500 지수 목표를 8,700포인트로 높이고 독일과 영국 채권에 대해 낙관적이다.","so":"21财经","tm":"11/16 10:25","c":1,"r":"cn","u":"https://www.21jingji.com/article/20261116/herald/dbc10d0ccf84109520190063df45283e.html","p":1794792300,"a":1794794316,"t":"摩根士丹利上调2027年标普500指数目标点位至8700点 看好德债和英债","su":"모건스탠리의 2027년 시장 전망에서 은행은 미국 주식과 일부 G10 국채에 대해 낙관적입니다. 마리나 자보록(Marina Zavolock)을 포함한 전략가들은 11월 15일 보고서에서 은행이 S&P500(미국 큰 회사 500곳 지수) 목표를 8,700으로 상향 조정했으며 이는 약 15%의 상승 여력을 암시한다고 썼습니다. 은행은 또한 일본 Topix 지수의 목표 지점을 약 22% 상승 여력에 해당하는 4,800포인트로 상향 조정했습니다. 금리 측면에서 모건스탠리는 독일 국채와 영국 국채에 대해 낙관적입니다. 매튜 혼바흐(Matthew Hornbach) 등 전략가들은 보고서에서 2028년 영란은행의 금리 인상에 대한 시장의 기대는 은행의 기대보다 높은 반면, 유럽중앙은행(ECB)의 완화 정책에 대한 기대는 은행의 기대보다 낮다고 밝혔습니다. 미국 10년 만기 국채 금리(나라가 돈 빌릴 때 내는 이자 비율)는 5% 안팎을 유지할 것으로 예상된다. 연준은 3월까지 금리를 4.375% 중반까지 인상하고 내년에도 이 수준을 유지할 것으로 예상된다."},{"s":"또 다른 연준 관계자는 \"매파적\"이다.","so":"21财经","tm":"11/16 10:24","c":1,"r":"cn","u":"https://www.21jingji.com/article/20261116/herald/5448135692bec7d5fb6aa6c8c1a1a5b1.html","p":1794792240,"a":1794806402,"t":"又一美联储官员“放鹰”","su":"제프 슈미드 캔자스시티 연은총재는 \"연준은 과열된 가격 압력에 대처할 수 있는 도구와 책임을 갖고 있으며 중앙은행은 여전히 ​​인플레이션(물건값이 계속 오르는 것)에 대해 할 일이 남아 있다\"고 말했다. 슈미드는 하와이에서 열린 신용조합 회의에서 인플레이션이 \"물가안정 목표인 2%를 충격적으로 초과했으며 잘못된 방향으로 움직이고 있다\"고 말했다. 그는 추가 금리(돈을 빌릴 때 내는 이자 비율) 인상을 명시적으로 요구하지 않았습니다. 슈미드는 최근 인플레이션의 현재 성격과 연준의 이를 억제할 수 있는 능력에 대해 형성된 지배적인 견해가 현실과는 거리가 멀다고 말했습니다. 그는 높은 인플레이션이 반복되는 공급 충격으로 인해 발생한다는 생각은 요점을 놓치고 있다고 말했습니다. 인플레이션은 항상 공급과 수요의 불균형의 결과입니다. 수요가 강하기 때문에 공급 측면의 충격으로 인해 가격이 상승할 수 있습니다. 수요는 항상 인플레이션에서 핵심적인 역할을 해왔으며, 연준은 수요에 미치는 영향을 통해 인플레이션을 처리할 수 있는 도구와 책임을 항상 갖고 있었습니다."},{"s":"알리안츠 \"연준, 금리 세 번 더 올린 뒤 2028년 말 3.75%까지 인하\"","so":"연합인포맥스","tm":"11/16 10:17","c":1,"r":"kr","u":"https://news.einfomax.co.kr/news/articleView.html?idxno=4444905","p":1794791855,"a":1794792435,"su":"알리안츠그룹은 미국 연방준비제도(Fed·연준(미국의 중앙은행))가 올해 12월과 내년 1월 및 3월에 세 차례 금리(돈을 빌릴 때 내는 이자 비율)를 더 인상해 최종 금리 범위가 4.50~4.75%가 될 것이라고 16일 예상했다.알리안츠는"},{"s":"미국 증시는 혼합되어 있습니다! 대만 증시는 하락세로 출발하며 500포인트 이상 하락했습니다. TSMC는 NT$2,340로 하락했습니다.","so":"TVBS新聞網","tm":"11/16 10:08","c":1,"r":"tw","u":"https://news.tvbs.com.tw/money/4051109","p":1794791280,"a":1794792443,"t":"美股漲跌互見！台股開低一度跌逾500點 台積電下跌報2340元","su":"금요일 미국 증시는 혼조세를 보였습니다. 대만 증시는 오늘(16일) 162.7포인트 하락세로 출발했다. 이후 가중지수는 하락세를 확대해 500포인트 이상 하락했고 최저점은 43126.73포인트에 이르렀다. TSMC는 NT$10에서 NT$2,340로 개장했습니다."},{"s":"전략 미국 증시는 밤새 거래에서 8% 이상 하락했습니다.","so":"Jiemian.com","tm":"11/16 10:06","c":1,"r":"cn","u":"https://www.jiemian.com/article/15334977.html","p":1794791196,"a":1794792437,"t":"Strategy美股夜盘跌超8%"},{"s":"미국 주식│자금 대규모 이동, AI주 급락, 금융소비주 반등 강세 - 국제","so":"工商時報","tm":"11/16 10:01","c":1,"r":"tw","u":"https://www.ctee.com.tw/news/20261116700468-430702","p":1794790860,"a":1794792444,"t":"美股｜資金大挪移AI股重挫金融消費股逆勢走強- 國際","su":"11월 미국 증시는 큰 변화를 보였다. AI 기술주가 시장 매도 압력의 주요 원천이 되면서 자본 순환 조짐이 나타났습니다. 통계에 따르면 11월 1일부터 13일까지 엔비디아는 20.42% 하락했습니다. 마벨, 씨게이트(Seagate), 마이크론 등 AI 공급망도 동시에 약화됐다. 반도체(전자기기의 두뇌 부품) ETF(여러 주식을 묶어 파는 상품)는 6.84% 하락했다. 반면 금융ETF는 추세를 거스르며 3.84% 상승했다. 다우존스산업지수 ETF도 1.16% 상승해 미국 주식이 과거 AI 기술과 달라진 모습을 보였다."},{"s":"모건스탠리 Wealth Management Shalett: AI 자본 지출이 주도하는 강세장 논리는 여전히 견고합니다 | 미국 증시 동향 | 국제적인","so":"經濟日報","tm":"11/16 09:51","c":1,"r":"tw","u":"https://money.udn.com/money/story/123398/9880835","p":1794790277,"a":1794797183,"t":"摩根士丹利財富管理 Shalett：AI 資本支出驅動的牛市邏輯依然穩固 | 美股動態 | 國際","su":"[블룸버그] -- 엔비디아 리더십의 격동과 중간 선거에서 민주당의 승리는 인공 지능 붐에 대한 우려를 고조시켰지만 모건 스탠리 웰스 매니지먼트의 리사 샬렛은 이러한 요인들이 이 강세(오르는 힘이 센 것)장의 주요 동인인 AI 인프라 자본 지출을 흔들리지 않을 것이라고 말했다."},{"s":"'아침해석' 미국 증시는 더 많이 하락하고 덜 올랐습니다. 대만 주식 주식이 지지를 받고 있습니다 - 상장 OTC 주식","so":"旺得富理財網","tm":"11/16 09:47","c":1,"r":"tw","u":"https://wantrich.chinatimes.com/news/20261116900072-420101","p":1794790069,"a":1794792447,"t":"《晨間解盤》美股跌多漲少台股權值股有撐- 上市櫃","su":"[타임스-타이페이] 미국의 인플레이션(물건값이 계속 오르는 것)이 여전히 높은 수준을 유지하고 있다. 미국 증시는 상승보다 하락이 더 컸습니다. 대만 증시는 반등세를 이어갈 것으로 예상된다. 미국의 인플레이션 압력은 여전히 ​​높으며 연준이 12월에 금리를 인상할 것이라는 기대를 계속해서 높이고 있습니다. 10년 만기 미국 국채 금리(나라가 돈 빌릴 때 내는 이자 비율)는 10월 중순 이후 최고치를 경신했다. 기술주는 다시 한번 매도 압력을 받았습니다. 미국 4대 주요 주가지수는 -3.43%에서 0.10%까지 상승보다 하락폭이 더 컸다. TSMC ADR은 1.67% 하락했고, 대만지수선물도 1% 하락했습니다."},{"s":"홍콩 주식 모닝 포스트 | 엔비디아는 CEO 후계자 소문에 대응하고 연준은 AI 데이터 센터 활용 위험을 상기시킵니다.","so":"财联社","tm":"11/16 09:36","c":1,"r":"cn","u":"https://www.cls.cn/detail/2534866","p":1794789360,"a":1794792439,"t":"港股早报 | 英伟达回应CEO继任者传闻 美联储提示AI数据中心杠杆风险","su":"①엔비디아는 헤드헌팅 에이전시를 선정 중이며 아직 CEO 후보자들과 공식적으로 접촉하지 않았다고 말했습니다. ②연준(미국의 중앙은행)의 블록버스터 보고서: “AI 열풍”이 자산 가치 평가를 높이고 있으며 금융 시스템에 위험을 초래할 수 있습니다. ③테슬라 Cybercab은 개별 구독이 가능하며 가격은 US$30,000입니다. ④마이크로소프트의 글로벌 서비스 장애는 다음날까지 이어졌고, 일부 서비스는 점차 복구됐다. 핫스팟 1. 젠슨 황의 후임자 선정에 대한 소문을 둘러싸고 엔비디아 이사회는 지난 금요일 언론에 대한 답변에서 \"우리는 엔비디아의 CEO 자리에 적합한 헤드헌팅 회사를 선택하는 과정 중입니다. 우리는 아직 잠재적인 후보자와 공식적으로 접촉하지 않았습니다.\"라고 말했습니다. 이전 언론 보도에 따르면 엔비디아 이사회가 Arm CEO Rene 하스에게 연락한 것으로 나타났습니다. 하스는 엔비디아에서 7년 동안 근무했으며 컴퓨팅 제품 부문 부사장을 역임했습니다. 현재 엔비디아는 CFO 콜레트 크레스가 임시 CEO로 이끌고 있습니다."},{"s":"지난 금요일 미국 증시의 AI 스토리지 부문이 종합적으로 마감됐고, SK하이닉스는 4.30% 하락했다. 미국 주식 마감 리뷰","so":"21财经","tm":"11/16 09:33","c":1,"r":"cn","u":"https://www.21jingji.com/article/20261116/herald/42c51e2e94cff64565a6dc8b65aeb6c2.html","p":1794789180,"a":1794792440,"t":"美股AI存储板块上周五集体收跌，SK海力士跌4.30%丨美股复盘","su":"동부시간 11월 13일, AI 스토리지 부문이 일괄 폐쇄됐다. 엔비디아의 실적 영향으로 스토리지 부문 유명 테마주가 전반적으로 약세를 보였고, 메모리반도체(전자기기의 두뇌 부품) 주가도 전반적으로 하락했다. 마이크론는 2.52% 하락한 $778.31에 마감했습니다. SK하이닉스는 4.30% 하락한 131.79달러에 마감했다. 메모리반도체 주가는 전반적으로 하락했다. 금요일 동부시간에는 미국 3대 주가지수가 엇갈렸습니다. 마감 기준 다우지수는 0.1% 상승한 52,347.55포인트, 나스닥지수는 0.91% 하락한 25,136.27포인트, S&P500(미국 큰 회사 500곳 지수)지수는 0.4% 하락한 7,561.67포인트에 마감했습니다. 메모리반도체 주가는 전반적으로 하락했다. 마이크론 테크놀로지는 2% 이상, 샌디스크는 5% 이상, SK하이닉스는 4% 이상, 웨스턴디지털은 5%, 씨게이트 테크놀로지는 3% 이상 하락했다."},{"s":"연준의 Schmid : 인플레이션은 여전히 ​​​​너무 높으며 연준는 여전히해야 할 일이 있습니다","so":"Jiemian.com","tm":"11/16 09:12","c":1,"r":"cn","u":"https://www.jiemian.com/article/15334770.html","p":1794787927,"a":1794789702,"t":"美联储施密德：通胀仍过高，美联储还有工作要做","su":"슈미드 캔자스시티 연준(미국의 중앙은행) 총재는 현지 시간으로 일요일 현지 시간으로 연준이 \"과열\" 가격 압력에 대처할 수 있는 정책 도구를 갖고 있으며 조치를 취할 책임도 있다고 말했습니다. 연준은 현재 “인플레이션(물건값이 계속 오르는 것)을 통제하기 위해 아직 해야 할 일이 남아 있습니다.” 슈미드는 인플레이션 수준이 \"물가 안정 목표인 2%를 불편할 정도로 높게 유지하고 있으며 잘못된 방향으로 움직이고 있다\"고 말했다. 현재 인플레이션의 성격과 이를 통제하는 연준의 능력에 관해 최근 형성된 지배적인 견해 중 일부는 현실과 일치하지 않습니다. (신화금융)"},{"s":"연준은 정말로 지속적으로 금리를 인상할 것인가? 월스트리트는 오늘밤 워시 연설에 집중합니다!","so":"财联社","tm":"11/16 09:11","c":1,"r":"cn","u":"https://www.cls.cn/detail/2534854","p":1794787860,"a":1794792441,"t":"美联储真会连续加息吗？华尔街聚焦今晚沃什讲话！","su":"① 다음 주에 발표되는 주요 미국 경제 데이터가 거의 없기 때문에 투자자들의 관심은 전적으로 후속 관리들의 성명에 쏠릴 것입니다. ② 케빈 워시 연준 의장, 존 윌리엄스 뉴욕 연은 총재, 닐 카슈카리 미니애폴리스 연은 총재의 연설이 모두 큰 관심을 끌었습니다. 차이롄서, 11월 16일(Editor Xiaoxiang) 비참한 한 주를 보낸 후 월스트리트 채권 거래자들은 향후 금리 경로에 대한 단서를 찾기 위해 연준의 집중적인 공식 연설과 최근 회의록에 관심을 돌리고 있습니다. 앞서 시장에서는 이번 금리 인상이 장기화될 것이라는 기대감이 크게 높아졌다. 지난 주, 많은 연준 관리들의 강경한 매파주의와 결합된 놀라운 인플레이션(물건값이 계속 오르는 것) 데이터는 이전에 미국 부채를 AI 위험을 피하기 위한 \"안전한 피난처\"로 보았던 투자자들에게 심각한 피해를 입혔습니다. 이에 따라 미국 2년만기 국채수익률은 일주일 만에 무려 0.37%포인트(퍼센트끼리 뺀 차이)나 급등했고, 벤치마크인 10년만기 미국 국채수익률도 5%대로 복귀했다."},{"s":"젠슨 황 사퇴로 월스트리트 '집단적 체면 변화'. 이번 주 엔비디아의 실적 보고서가 압박을 견딜 수 있을까요?","so":"财联社","tm":"11/16 09:11","c":1,"r":"cn","u":"https://www.cls.cn/detail/2534856","p":1794787860,"a":1794792442,"t":"华尔街因黄仁勋离职“集体变脸”，本周英伟达财报能否顶住压力？","su":"① 젠슨 황이 CEO직을 사임하면서 최소 10명의 월스트리트 최고 분석가들이 엔비디아 주식의 '매수' 등급을 '보유'로 하향 조정했습니다. ② 엔비디아는 현지 시간으로 다음 주 화요일 시장이 개장한 후 2027회계연도 3분기 실적(회사가 번 돈 성적표)을 발표할 예정입니다. 차이롄서, 11월 16일(황준지 편집장) 최근 글로벌 칩 리더 엔비디아의 주가는 '젠슨 황 스캔들'로 인해 계속 압박을 받고 있다. 젠슨 황이 CEO직을 사임하면서 엔비디아 주식에 대한 월스트리트 분석가들의 견해가 바뀌었습니다. 통계에 따르면 시장이 이 극적인 사건을 소화함에 따라 최소 10명의 월스트리트 최고 분석가들이 엔비디아 주식의 '매수' 등급을 '보유'로 하향 조정했습니다. 골드만삭스, JP모건, RBC 및 기타 여러 기관이 목표주가(전문가가 예상한 앞날의 주가)를 낮췄습니다."},{"s":"현재 미국 증시: S&P500, 나스닥, 다우 Jones, Russell 2000을 결정하는 요인; 엔비디아, 기타 W","so":"The Economic Times","tm":"11/16 09:05","c":1,"r":"us","u":"https://m.economictimes.com/news/international/us/us-stock-market-today-factors-that-will-dictate-sp-500-nasdaq-dow-jones-russell-2000-nvidia-other-wall-street-ai-stocks-under-scanner/articleshow/135868576.cms","p":1794787528,"a":1794789700,"t":"US Stock Market today: Factors that will dictate S&P 500, Nasdaq, Dow Jones, Russell 2000; Nvidia, other W","su":"S&P500(미국 큰 회사 500곳 지수), 나스닥(미국 기술 회사들이 많은 주식시장), 다우존스 투자자들은 화요일 실적 발표를 발표할 예정인 엔비디아에 모든 시선이 쏠릴 것이기 때문에 월요일부터 긍정적인 출발을 보일 것입니다."},{"s":"지난 금요일 밤 미국 주요 주식의 성과를 살펴보세요","so":"etnet 經濟通","tm":"11/16 08:56","c":1,"r":"hk","u":"https://www.etnet.com.hk/www/tc/news/news-article.php?section=categorized&category=latest&newsid=2026111631","p":1794786960,"a":1794789708,"t":"主要美股上周五晚表現一覽","su":"2026-11-16 07:56 지난 금요일 밤 미국 주요 주식의 성과 개요 요약 면책조항 이 내용은 기존 시장 데이터 및 뉴스 소스를 기반으로 인공지능에 의해 생성되었으며 참고용입니다. 본 내용은 \"이코노믹스\"의 견해나 입장을 대변하지 않으며, 어떠한 투자조언도 구성하지 않습니다. AI가 생성한 정보에는 오류, 누락, 일탈 등이 있을 수 있으므로, 투자 결정을 내리기 전에 사용자가 직접 해당 내용을 확인하거나 전문가의 조언을 구해야 합니다. \"이코노믹스\"는 본 내용을 신뢰하여 발생하는 어떠한 손실이나 손해에 대해서도 책임을 지지 않습니다. ▷ 지난 금요일 미국 주식 종가와 증감자료가 공개되었습니다 ▷ 홍콩달러에 대한 미국달러 환율(다른 나라 돈과 바꾸는 비율)은 7.8455 였습니다"},{"s":"\"National Finance Headlines\" 미국 3대 주가지수가 지난주 상승세를 기록했습니다. 젠슨 황 사건으로 인해 엔비디아는 일주일 동안 13% 급락했으며 시가총액은 일주일 만에 5,700억 달러 이상 증발했습니다.","so":"etnet 經濟通","tm":"11/16 08:55","c":1,"r":"hk","u":"https://www.etnet.com.hk/www/tc/news/news-article.php?section=categorized&category=daily&newsid=2026111610","p":1794786900,"a":1794789710,"t":"《國金頭條》美股三大指數上周錄升幅，黃仁勳事件令英偉達全周大跌13%，一周市值蒸發逾5700億美元","su":"2026/11/16 07:55 \"National Finance Headlines\" 미국 3대 주가지수가 지난주 상승세를 기록했습니다. 젠슨 황 사건으로 인해 엔비디아는 일주일 동안 13% 급락했으며 시가총액(회사 전체 몸값)은 일주일 만에 5,700억 달러 이상 증발했습니다. 요약 면책 조항 이 콘텐츠는 기존 시장 데이터 및 뉴스 소스를 기반으로 인공 지능에 의해 생성되었으며 참고용으로만 사용됩니다. 본 내용은 \"이코노믹스\"의 견해나 입장을 대변하지 않으며, 어떠한 투자조언도 구성하지 않습니다. AI가 생성한 정보에는 오류, 누락, 일탈 등이 있을 수 있으므로, 투자 결정을 내리기 전에 사용자가 직접 해당 내용을 확인하거나 전문가의 조언을 구해야 합니다. \"이코노믹스\"는 본 내용을 신뢰하여 발생하는 어떠한 손실이나 손해에 대해서도 책임을 지지 않습니다. ▷ 미국 3대 주가지수는 모두 일주일 내내 상승세를 기록했습니다. ▷ 엔비디아 주가는 일주일 내내 13% 하락했고, 시가총액은 5,700억 달러 이상 증발했습니다. ▷ 미국 달러는 한때 엔화 대비 160을 돌파했습니다. 다우지수는 50.46포인트(0.1%) 소폭 상승한 52347.55포인트로 마감했습니다. S&P500(미국 큰 회사 500곳 지수)은 30.73포인트, 즉 0.4% 하락한 7561.67포인트를 기록했습니다. 나스닥은 229.82포인트(0.91%) 하락한 25136.27포인트에 거래됐다."},{"s":"KB운용, 'RISE 미국S&P500·나스닥100' 매수 인증 이벤트","so":"아시아경제","tm":"11/16 08:49","c":1,"r":"kr","u":"https://core.asiae.co.kr/article/2026111608494917408","p":1794786540,"a":1794789699,"su":"KB자산운용은 미국 대표지수 상장지수펀드(ETF(여러 주식을 묶어 파는 상품))인 'RISE 미국S&amp;P500'과 'RISE 미국나스닥(미국 기술 회사들이 많은 주식시장)100'을 대상으로 매수 인증 이벤트를 진행한다고 16일 밝혔다. 이번 이벤트는 17일부터 다음 달 31일까지 진행된다. 자녀 계좌 개설과 증여, 연금계좌 납입이 집중되는 연말을 맞아 미국 대표지수 ETF를 활용한 세대별 장기투자를 제안하기 위해 마련됐다. 단기적인 시장 흐름에 일희일비하기보다 장기적인 관점에서 투자 원칙을 세우고 꾸준히 실천하는 투자 문화를 확산한다는 취지다. 이벤트 기간 중 대상 ETF를 1주 이상 매수"},{"s":"올해 미국 주식에 크리스마스 시장이 열릴까? 골드만삭스는 인플레이션이 아직 가라앉지 않았으며 내년 1월부터 가격 재설정이 시작될 수 있다고 경고했다.","so":"鉅亨網","tm":"11/16 08:42","c":1,"r":"tw","u":"https://news.cnyes.com/news/id/6662478","p":1794786179,"a":1794789707,"t":"美股今年還有聖誕行情嗎？高盛警告通膨未退、明年1月恐掀價格重訂潮","su":"골드만삭스, 모건스탠리, JP모건 등은 디레버리징, 밸류에이션 하락, 계절적 상승 등이 도움이 될 것으로 믿으며 연말 미국 증시의 반등을 낙관하고 있다.\n골드만삭스는 AI 주식이 15년 만에 가장 긴 부채 축소를 겪었다고 지적했다. MSCI 글로벌 지수의 선도 주가수익비율은 15.6배로 떨어졌고, S&P500(미국 큰 회사 500곳 지수)은 약 17.9배로 떨어졌다.\n그러나 글로벌 상류 인플레이션(물건값이 계속 오르는 것)이 가열되고 있어 수입 가격이 연평균 약 24%에 이르고, 내년 1분기에는 그 비용이 소비자에게 전가될 수도 있다."},{"s":"연준이 12월에 금리를 0.25%포인트 인상할 확률은 95%입니다.","so":"Jiemian.com","tm":"11/16 08:42","c":1,"r":"cn","u":"https://www.jiemian.com/article/15334644.html","p":1794786126,"a":1794789703,"t":"美联储12月加息25个基点的概率为95%","su":"CME의 '페드워치'에 따르면 연준이 12월 금리(돈을 빌릴 때 내는 이자 비율)를 0.25%포인트(퍼센트끼리 뺀 차이) 인상할 확률은 95%, 0.5%포인트 인상 확률은 5%이다. 연준이 내년 1월까지 금리를 누적 0.25%포인트 인상할 확률은 25.2%, 누적 0.5%포인트 인상할 확률은 71.1%, 누적 0.75%포인트 인상할 확률은 3.7%이다."},{"s":"이번 주 시장이 열리기 전에 알아야 할 5가지 국제 사항 | 미국 증시 동향 | 국제적인","so":"經濟日報","tm":"11/16 08:22","c":1,"r":"hk","u":"https://money.udn.com/money/story/123398/9880789?from=edn_related_storybottom","p":1794784923,"a":1794789712,"t":"本周開盤前 五件國際事不可不知 | 美股動態 | 國際","su":"금요일 미국 증시는 필라델피아 반도체(전자기기의 두뇌 부품) 지수가 3.4% 급락하면서 하락세로 마감했는데, 이는 엔비디아 CEO 젠슨 황의 해임이 동료들에게 영향을 미쳤음을 반영합니다. 오늘 아시아 주식이 개장했으며 반도체주에 대한 매도 압력에 주목해야 합니다."},{"s":"MPF 관리丨미국 주식 매수의 지름길: MPF 미국 주식 펀드 챔피언 보유 노출 | 홍콩경제신문","so":"香港經濟日報HKET","tm":"11/16 08:10","c":1,"r":"hk","u":"https://invest.hket.com/article/4225036/MPF%E7%AE%A1%E7%90%86%E 고, 중소기업도 다른 기업보다 나은 성과를 냈습니다. 올해 상반기, 특히 강력한 2분기를 경험한 월스트리트 기관들은 최근 하반기 미국 주식 강세(오르는 힘이 센 것)장에 대한 합의에 도달했습니다. 그러나 월스트리트 애널리스트들은 이전의 주요 투자 라인인 칩과 인공지능(AI) '삽질주'에 대해서는 여전히 낙관적인 반면, 산업, 의료, 소재, 중소형주 등 더 넓은 부문과 테마도 '만개할' 것이라고 믿고 있다. '강세장 컨센서스'는 하반기에도 변하지 않을 전망이다. 상반기 미국 증시의 성과는 월스트리트가 하반기에도 강세장이 이어질 것이라는 컨센서스를 이끌어낸 것이다."},{"s":"월스트리트는 금리 기대감을 긴급히 높인다! 미국 주식이 연준이 되는 가장 큰 위험은 무엇일까요?","so":"第一财经","tm":"11/15 18:49","c":1,"r":"cn","u":"https://www.yicai.com/news/103437262.html","p":1794736142,"a":1794746280,"t":"华尔街紧急上调利率预期！美股最大风险变成美联储？","su":"최근 인플레이션(물건값이 계속 오르는 것) 보고서가 예상을 뛰어넘으면서 시장은 연준의 정책 경로를 빠르게 재평가하고 있습니다. 반면, 연준의 '과도한 힘' 리스크는 2027년 주식시장에 점점 더 심각한 위협이 되고 있다. 기관들은 집중적인 상향 조정을 단행했다. 뱅크오브아메리카, Citigroup 및 Standard Chartered Bank는 모두 최신 연구 보고서에서 Waller 연준 총재의 발언이 12월에 0.5%포인트(퍼센트끼리 뺀 차이) 금리 인상의 문을 열었다고 경고했습니다. 스탠더드차타드은행의 이코노미스트 스티브 잉글랜더는 \"12월 0.5%포인트 금리 인상 가능성은 우리가 예상했던 것보다 강력하지만 아직 확인되지 않았다\"고 말했다. 이번 주 초, 크리스토퍼 월러 연준 총재는 다음 달 금리를 0.25%포인트 인상하고, 가격 압력이 가속화되면 더 큰 금리 인상을 권고했습니다."},{"s":"미국 연방준비제도(연준)의 금리 인상이 글로벌 채권시장에 영향을 미쳤다. Fidelity International Zhu Lei: 중국 채권 배분 가치는 하락 대신 상승했습니다.","so":"第一财经","tm":"11/15 18:41","c":1,"r":"cn","u":"https://www.yicai.com/news/103373834.html","p":1794735708,"a":1794751313,"t":"美联储加息冲击全球债市，富达国际朱蕾：中国债券配置价值不降反升","su":"지난주 연준은 3년여 만에 처음으로 0.25%포인트(퍼센트끼리 뺀 차이) 금리 인상을 발표해 연방기금 금리 목표 범위를 3.75~4.00%로 높였다. 결의안 발표 이후 미국 채권시장은 '매파적 충격'에서 '신뢰회복'으로 급속히 전환됐다. 현재 미국 10년 만기 국채수익률은 5% 밑으로 떨어졌지만, 후속 추이는 여전히 불분명하다. 선진국 국채가 집단 매도세(팔려는 힘)를 보이면서 중국과 미국 간 금리 역전 현상이 오랫동안 지속됐다. 월요일(9월 21일) 현재 중국 10년만기 국채수익률은 약 1.68%로, 둘 사이의 격차는 여전히 320BP(베이시스포인트)를 넘어섰다. 그렇다면 연준의 변화는 전 세계 주류 채권 자산에 어떤 영향을 미치게 될까요? 중국 채권시장의 매력이 바뀔까? 불확실성 시대에 자금유지에 영향을 미치는 핵심요소는 무엇인가? 최근 위의 뜨거운 주제에 초점을 맞춰 제일재경은 Fidelity International의 아시아 채권 부문 책임자인 Zhu Lei와 단독 인터뷰를 진행했습니다."},{"s":"4년 전에도 긴급 정리해고가 있었어요... 올해는 너무 바빠서 밤을 새웠어요. 월스트리트가 중국 본토에서 돈을 벌었나요?","so":"UDN","tm":"11/15 17:56","c":1,"r":"tw","u":"https://udn.com/news/story/7333/9880076","p":1794732980,"a":1794746286,"t":"4年前急裁員…今年忙到熬通宵 華爾街在大陸賺到錢了嗎？","su":"2022년 11월, 홍콩 모건스탠리의 중국 기업 투자 은행 직원 수십 명이 일시적으로 사무실 46층에 호출돼 동료들이 해고되고 건물에서 나가라는 요청을 받는 모습을 지켜봤다. 당시 일부 외국인 투자자들은 중국을 '투자할 수 없는' 국가로 간주했습니다."},{"s":"[3분증시] 뉴욕증시, CPI 경계감 속 이틀째 약세","so":"연합뉴스TV","tm":"11/15 17:02","c":1,"r":"kr","u":"https://m.yonhapnewstv.co.kr/newsFeed/7356","p":1794729766,"a":1794746279,"su":"<출연 : 권용욱 연합인포맥스 기자> 세계 증시와 우리 증시를 짚어보는 시간 '3분 증시'입니다. 연합인포맥스 권용욱 기자 나와있습니다. 먼저 간밤 미국 증시부터 정리해주시죠. [기자] 네. 간밤 뉴욕 증시는 3대 주가지수가 이틀째 동반 약세를 보였습니다. 유가는 오르고 미국 국채금리(돈을 빌릴 때 내는 이자 비율)는 내리는 엇갈린 흐름이 나타났는데요. 증시는 중요한 물가(물건값 전체의 수준) 지표 발표를 기다리며 조정을 이어갔습니다. 마감가를 살펴보면 다우지수는 전장보다"},{"s":"스테이트 스트리트, 유럽 증시 상승세의 픽텟 콜타임","so":"Bloomberg.com","tm":"11/15 17:00","c":1,"r":"us","u":"https://www.bloomberg.com/news/articles/2026-11-15/state-street-pictet-call-time-on-europe-s-stock-market-rally","p":1794729600,"a":1794751311,"t":"State Street, Pictet Call Time on Europe’s Stock Market Rally"},{"s":"연준의 금리 인상 폭풍이 다가오고 있습니다! 기술주는 추세를 거스르고 노무라 급등 : 이것은 아마도 반등의 환상 일 것입니다 - 국제","so":"工商時報","tm":"11/15 16:37","c":1,"r":"tw","u":"https://www.ctee.com.tw/news/20261115700519-430702","p":1794728220,"a":1794728505,"t":"聯準會升息風暴殺到！科技股竟逆勢狂飆野村：這恐怕只是反彈假象- 國際","su":"최근 미국 국채수익률(넣은 돈에 비해 얻는 이익 비율)이 큰 폭으로 올랐지만, 기술주와 신용채권도 강하게 반등했다. '주식과 채권이 동시에 상승'하는 보기 드문 현상이 발생했다. 당초 고금리(돈을 빌릴 때 내는 이자 비율)의 최대 피해자로 여겨졌던 기술주는 금리 인상에 대한 시장 기대가 크게 높아지면서 추세를 거스르고 상승했다. 투자자들은 이번 반등이 AI 투자 신뢰의 회복을 의미하는지, 아니면 이전 좌절 이후의 단순한 기술적 수리인지 의문을 제기하기 시작했습니다. '월스트리트 인사이트'는 노무라증권 전략가 나카의 말을 인용했다."},{"s":"월스트리트, 스페이스X의 첫 실적 보고서 미리보기: 성과 외에도 향후 지침이 더 중요","so":"财联社","tm":"11/15 15:56","c":1,"r":"cn","u":"https://www.cls.cn/detail/2445335","p":1794725784,"a":1794784769,"t":"华尔街前瞻SpaceX首份财报：业绩之外更看重未来指引","su":"①스페이스X는 베이징 시간으로 수요일 이른 아침에 2분기 재무 운영 결과를 발표할 예정입니다. 현재 주가는 114.53달러로 발행가보다 15% 낮고, 시가총액(회사 전체 몸값)은 1조5000억 달러를 조금 넘는다. ②시장과 분석가들이 가장 주목하게 될 것은 인공지능, 스타링크, 로켓 발사 사업의 진행 상황에 대한 스페이스X 경영진의 최근 성명이 될 것이다. 차이롄서, 8월 4일(자오 하오 편집자) 스페이스X의 기업공개(IPO) 이후 첫 번째 실적(회사가 번 돈 성적표) 보고서는 올 여름 월스트리트에서 가장 주목받는 이벤트 중 하나가 될 것입니다. 그러나 이 성적표가 투자자들  황은 11월 12일 공식적으로 CEO, 사장 및 이사직에서 물러났습니다. 이러한 움직임은 자본 시장에 파장을 일으켰을 뿐만 아니라 전 세계 직원, 주주 및 기술 리더들이 공개적으로 지지 서명을 하기 위해 \"Stand with Jensen(Support 젠슨 황)\"을 시작하도록 촉발했습니다. 그러나 국가 안보 조사에 대한 압박과 이사회의 지배 구조에 직면하여 예측 시장은 젠슨 황의 짧은..."},{"s":"미국 주식 팁丨통화를 보유하고 기다려 보세요! 통화기금 순유입 6년 만에 최고치, 반등 어디까지 갈까?","so":"第一财经","tm":"11/15 11:37","c":1,"r":"cn","u":"https://www.yicai.com/news/103388790.html","p":1794710266,"a":1794746283,"t":"美股点金丨持币观望！货币基金净流入创六年新高，反弹能走多远","su":"미국 증시는 처음에는 하락했다가 이번 주에 상승했으며, 미국 채권 수익률(넣은 돈에 비해 얻는 이익 비율)은 계속해서 높은 수준을 유지했습니다. 9월 연방공개시장위원회(FOMC) 회의록은 매파적인 신호를 내놨다. 늦은 거래에서 기술주의 안정화는 3대 주요 주가지수가 주중 손실을 회복하는 데 도움이 되었습니다. 그러나 자본 흐름이 다시 조심스러워졌고, 위험 회피로 인해 자금 펀드 매수가 늘어났습니다. 미국 주식의 새로운 실적 시즌이 다음 주에 시작될 예정이며, 인공지능의 성과 향상이 위험 선호도에 영향을 미칠 수 있습니다. 동시에, 중동 상황과 미국 채권 수익률 추세는 계속해서 투자자들의 신경을 불안하게 할 것입니다. 가격 압박은 무시할 수 없습니다. 이번 주에 발표된 주요 데이터는 가격 압력이 여전히 높은 가운데 경제의 회복력을 계속해서 보여줍니다. 미국 ISM 서비스 PMI는 9월 54.9를 기록하며 2개월 연속 상승세(오르는 흐름)를 이어갔다. 그러나 이 지수는 27개월 연속 50 호황-불황선을 넘어섰으며, 이는 서비스 기업 활동이 지속적으로 확대되고 있음을 나타냅니다. ISM 서비스 물가지수는 72.6에서 74.0으로 상승해 2022년 7월 이후 최고치를 기록했고, 112개월 연속 상승세를 이어갔다."},{"s":"미국 주식에 대한 팁 | 엔비디아는 AI 분야를 혼란의 시기로 몰아넣었다. 다음 주 세 가지 주요 위험 사건이 미국 주식을 어떻게 움직일 것인가?","so":"第一财经","tm":"11/15 11:04","c":1,"r":"cn","u":"https://www.yicai.com/news/103440906.html","p":1794708266,"a":1794730716,"t":"美股点金丨英伟达将AI板块带入迷茫期，下周三大风险事件如何搅动美股？","su":"젠슨 황이 엔비디아 CEO 사임을 발표하면서 AI 분야는 변동을 겪었습니다. 그러나 미국 3대 주가지수는 여전히 전반적으로 반등했다. 나스닥 종합지수와 S&P500(미국 큰 회사 500곳 지수) 지수는 모두 4주 연속 하락세를 마감했습니다. 다음 주에 시장은 연준 회의록과 엔비디아의 실적 발표를 발표할 것입니다. 한편, 인공지능 기업 앤트로픽의 기업공개(IPO)는 기존 인공지능 대기업에 대한 투자자의 관심을 테스트할 수도 있습니다. 연준의 금리 인상에 대한 기대도 높아졌다. 이번 주에 발표된 데이터에 따르면 10월 소비자물가(가게에서 사는 물건값 수준)지수(CPI) 증가율은 둔화되었지만 여전히 월스트리트 예측을 초과했습니다. 동시에, 10월 미국 생산자 물가(PPI)의 연간 상승률은 에너지 비용이 치솟는 가운데 거의 4년 만에 최고 수준에 도달했습니다."},{"s":"위기에 빠져도 엔비디아는 역시 사다 Even in Crisis, 엔비디아 Stock Is Still a Buy | 【WEEKLY】2026년 11월 15일호","so":"バロンズ・ダイジェスト","tm":"11/15 10:06","c":1,"r":"jp","u":"https://barrons.jiji.com/article/9088","p":1794704780,"a":1794784811,"t":"危機に陥っても、エヌビディアはやはり買い Even in Crisis, Nvidia Stock Is Still a Buy｜【WEEKLY】2026年11月15日号","su":"나쁜 소식이 나오고 조사가 모두 끝나고 새로운 리더가 선정된 새벽에는 엔비디아 <NVDA>는 반도체(전자기기의 두뇌 부품) 제조로 돌아갈 것이다. 지난주도 그랬지만, 세계는 엔비디아의 반도체를 필요로 할 것이다. 엔비디아가 세계의 톱에 올라간 이유의 대부분은 카리스마적인 창업자인 젠슨 황씨에 의한 것이다. 후안씨가 생성 인공지능(AI)의 경이적인 대두에 큰 영향을 준 것에 이의를 제기할 자는 없다. 대규모 언어 모델(LLM)은 컴퓨팅…"},{"s":"굿모닝 월드》미국 10월 도매 인플레이션은 4년 만에 최고치를 기록했으며 시장은 연준이 12월 금리를 인상할 것으로 예상하고 있습니다 | 삶","so":"中央社 CNA","tm":"11/15 08:26","c":1,"r":"tw","u":"https://www.cna.com.tw/news/ahel/202611155001.aspx","p":1794698760,"a":1794727059,"t":"早安世界》美10月躉售通膨創4年來新高市場押注聯準會12月升息| 生活","su":"최근 미국 경제지표에 따르면 10월 도매인플레이션(물건값이 계속 오르는 것) 연간 증가율은 6.5%로 4년 만에 최고치를 기록했다. 월간 증가율은 9월 1.4%보다 낮아진 수준으로 크게 둔화됐지만 식료품 가격이 급등했고, 미-이란 전쟁으로 에너지 비용이 늘어나 인플레이션 냉각 경로에 변수가 추가됐고, 연준의 12월 금리(돈을 빌릴 때 내는 이자 비율) 인상에 대한 시장 기대감도 깊어졌다."},{"s":"엔비디아의 CEO로 젠슨 황의 복귀를 지원하십시오. 테슬라 CEO 머스크도 청원에 동참 | 미국 주식 뉴스 | 국제적인","so":"經濟日報","tm":"11/15 03:05","c":1,"r":"tw","u":"https://money.udn.com/money/story/123398/9879202","p":1794679531,"a":1794746287,"t":"挺黃仁勳回任輝達 CEO 特斯拉執行長馬斯克也加入連署 | 美股動態 | 國際","su":"경제일보 Liu Zhongyong 작성/외신 종합 뉴스 테슬라 CEO 머스크와 엔비디아 직원 및 주주들은 젠슨 황이 엔비디아 CEO로 복귀할 것을 요구하는 청원에 동참했습니다. '젠슨과 함께하라(Stand with Jensen)'라는 제목의 청원은 보도 당시 약 9만 명의 서명을 받았다. 공동 서명 웹사이트에 나열된 서명자에는 현재 엔비디아 직원 4,800명과 기존 주주 47,000명이 포함됩니다. 다른 잘 알려진 서명자로는 유명한 월스트리트 황소인 Fundstrat의 Tom Lee와 Shopify의 CEO인 Tobi Lutke가 있습니다. 머스크는 공개 서한에서 젠슨 황이 엔비디아를 구축하는 데 33년을 투자했으며 그의 리더십과 공헌이 갑자기 교체되기보다는 공정한 대우와 적법한 절차를 밟아야 한다고 믿었음을 확인했습니다. 공동 서명자들은 또한 젠슨 황이 교체되기 전에 상당한 적법 절차 보장을 받지 못했다는 점에 의문을 제기했으며, 사건에 연루된 여성이 스파이라는 것을 증명할 증거를 아무도 그들에게 제공하지 않았다고 말했습니다."},{"s":"뉴욕증시, 반도체 약세ㆍ사우디 피격","so":"이투데이","tm":"11/15 00:33","c":1,"r":"kr","u":"https://m.etoday.co.kr/view_photo.php?idxno=2634887&seq=1","p":1794670395,"a":1794751311,"su":"뉴욕증시, 반도체(전자기기의 두뇌 부품) 약세ㆍ사우디 피격 속 혼조 마감⋯나스닥(미국 기술 회사들이 많은 주식시장) 0.44%↓[종합] 관련 이미지 원본을 이투데이에서 확인하세요"},{"s":"미국 증시 마감: PCE 인플레이션은 예상을 소폭 상회했고, 3대 주요 지수는 소폭 하락세로 마감했으며, 시장은 더 많은 정책 신호를 기다리고 있었습니다.","so":"财联社","tm":"11/14 23:09","c":1,"r":"cn","u":"https://www.cls.cn/detail/2465573","p":1794665358,"a":1794727046,"t":"美股收盘：PCE通胀略超预期 三大指数小幅收跌 市场静待更多政策信号","su":"①애플의 가을 컨퍼런스가 9월 10일 이른 아침에 예정되어 있습니다. ②췌장암 치료는 획기적인 발전을 이루었고 미국 FDA는 레볼루션(Revolution) 신약을 승인했습니다. ③앤트로픽은 AI 컴퓨팅 능력을 확보하기 위해 450억 달러를 지출한 것으로 보고되었습니다. 차이롄서, 8월 27일(편집자 Niu Zhanlin) 수요일 동부 표준시 기준으로 미국 3대 주가 지수는 소폭 하락세로 마감했습니다. 최근 미국 PCE 인플레이션(물건값이 계속 오르는 것) 데이터는 예상보다 약간 높았습니다. 동시에 많은 투자자들은 AI 분야의 벤치마크인 엔비디아가 실적 보고서를 발표하기 전에 지켜보는 쪽을 선택했습니다. 미국 상무부가 발표한 자료에 따르면 7월 PCE는 전년 동기 대비 3.7% 상승해 시장 예상치를 소폭 웃돌았으며 핵심 PCE는 3.3% 상승한 것으로 나타났습니다. 7월 PCE 물가(물건값 전체의 수준)지수는 전월대비 0.2% 상승해 예상치 0.1%보다 높았다. 핵심 PCE도 6월의 0.1% 증가에 비해 전월 대비 0.2% 증가했습니다."},{"s":"Yicai 앵커가 말했다 | 미국 증시 AI가 하룻밤 사이에 거의 3조 달러 증발했지만 A주의 일부 사람들은 추세를 거스르고 급등했습니다. \"동쪽에서 상승하고 서쪽에서 하락\"이 정말로 올까요?","so":"第一财经","tm":"11/14 20:02","c":1,"r":"cn","u":"https://www.yicai.com/video/103429566.html","p":1794654174,"a":1794727048,"t":"一财主播说 | 美股AI一夜蒸发近3万亿，A股却有人逆势大涨——“东升西落”真的来了？"},{"s":"Lin Mingtian: 10월에 연준이 금리를 인상할 가능성이 높아졌으며 국제 금 가격은 추세를 반전시키기보다는 조정하게 될 것입니다.","so":"第一财经","tm":"11/14 19:10","c":1,"r":"cn","u":"https://www.yicai.com/video/103382895.html","p":1794651028,"a":1794727050,"t":"林铭添：美联储10月加息概率上升 国际金价调整而非趋势逆转"}]},{"name":"🧬 나스닥 바이오","note":"보유: TIGER 미국나스닥바이오","breaking":false,"items":[{"s":"새로운 최고 기록 달성, 51종의 1급 신약이 새 버전의 국민의료보험 의약품 목록에 등재되었습니다.","so":"第一财经","tm":"11/14 11:50","c":5,"r":"cn","u":"https://www.yicai.com/news/103440686.html","p":1794624638,"a":1794628689,"t":"再创新高，51个一类新药进入新版国家医保药品目录","su":"국민의료보험청과 인사사회보장부는 오늘(14일) '국민기본의료보험·모성보험·산재보험 의약품 카탈로그'와 '상업건강보험 혁신 의약품 카탈로그'(2026)를 공개했다. 국민의료보험청 출범 이후 국민기본의료보험 약품목록의 9번째 조정이다. 이번 조정에는 총 107개 신약이 추가됐으며, 이 중 카테고리 1 혁신신약(세상에 처음 나온 새로운 약)은 51개로 역대 최고치를 경신했다. 이번 국가 기본의료보험 의약품 목록이 조정되어 신품종은 종양, 희귀질환, 만성질환, 정신질환 등 긴급하게 필요한 임상 치료 분야를 포괄합니다. 동시에 임상적 가치가 제한적이거나 더 나은 대안이 있거나 지침에 대한 정보가 누락되어 사용할 수 없는 34개 의약품이 목록에서 삭제되었습니다. 포괄적인 이전, 이전 및 제형 병합을 거쳐 2026년판 국민기본의료보험 의약품 목록의 총 의약품 수는 3,331개에 달합니다."},{"s":"[시판 전 팁: 새로운 의료보험 카탈로그! 혁신신약 'C-포지션' 공개 새로운 에너지 저장 블록버스터 계획 발표; 광칩 리더, 대규모 주문 수주","so":"第一财经","tm":"11/16 08:16","c":4,"r":"cn","u":"https://www.yicai.com/vip/news/103441088.html","p":1794784610,"a":1794784823,"t":"[ 盘前点金 医保目录上新！创新药“C位”亮相；新型储能重磅方案发布；光芯片龙头拿下大单","su":"[오늘의 상식] ① 2026년 의료보험 카탈로그가 출시되었습니다! 51개 카테고리 1 혁신신약(세상에 처음 나온 새로운 약)이 포함돼 CAR-T가 최초로 의료보험에 진입한다(아래첨부). ② 인산염의 새로운 에너지 저장 여정: 인산철리튬에 대한 수요가 급증하고 있으며, 주요 제조업체의 이익이 향상될 것으로 예상됩니다(주제 첨부). ③ 중국 증권감독관리위원회 위원장 우칭(Wu Qing)이 최근 성명을 발표했는데, 이는 2억 명이 넘는 주식 투자자들에게 영향을 미칩니다. ④ 본 회사는 3억 6백만 위안의 자산을 인수하고 \"광학 저장 및 컴퓨팅\" 테스트를 늘릴 계획입니다. ⑤ 소속사가 지적한"},{"s":"12가지 새로운 유형의 약물이 추가되어 2026년 상업 건강 보험 혁신 약물 카탈로그에 총 28가지 유형이 추가되었습니다.","so":"Jiemian.com","tm":"11/14 11:43","c":4,"r":"cn","u":"https://www.jiemian.com/article/15333030.html","p":1794624194,"a":1794628691,"t":"新增12种药品，2026年商业健康保险创新药品目录共有28种","su":"국민의료보험청 관계자는 11월 14일 2026년 시행 예정인 상업건강보험 혁신의약품 목록 조정에 12개 신약이 추가된다고 밝혔다. 상업 건강 보험 혁신 약물 카탈로그의 새 버전에는 세계 최초의 고형 종양 CAR-T, 중국 최초의 혈우병 유전자 치료 약물 및 기타 주요 혁신 약물이 포함됩니다. 이와 동시에 상업 보험 혁신 의약품 목록과 기본 의료 보험 목록 간의 연계 메커니즘을 구축했으며 2025년 상업 보험 혁신 의약품 2종을 의료 보험 목록에 포함했습니다. 조정을 거쳐 2026년 상업건강보험에는 총 28종의 혁신의약품이 포함될 예정이다."},{"s":"상업보험 혁신의약품 카탈로그에 12개 신약 신규 추가, 가격협상 성공률 100%","so":"经济观察网","tm":"11/14 13:39","c":3,"r":"cn","u":"http://www.eeo.com.cn/2026/1114/1092864.shtml","p":1794631140,"a":1794642669,"t":"12款药新入商保创新药目录，价格协商成功率100%","su":"경제 관찰자 팔로우 2026-11-14 12:39 경제 관찰자 기자 Liu Xiaonuo 11월 14일, 2026년 국가 의료 보험 약품 목록과 상업 보험 혁신 약품 목록이 소주에서 발표되었습니다. 국민의료보험청 약품서비스관리국 황신위 국장은 현장에서 11개 기업의 12개 혁신의약품이 상업적으로 보장되는 혁신의약품 목록에 포함됐다고 발표했다. 2026년 9월 경제옵저버는 상업보험 혁신의약품 카탈로그 현장에서 이번에 가격협상에 총 11개사, 12개 의약품이 참여했다는 사실을 알게 됐다. 이는 상업적으로 보장되는 혁신적인 의약품 카탈로그의 가격 협상에 참여하는 모든 의약품이 카탈로그에 성공적으로 포함되었음을 나타냅니다. 2025년에 국민의료보험청은 처음으로 상업적으로 보장되는 혁신의약품 목록에 대한 가격 협상을 시작했습니다. 정식심사를 통과한 의약품은 총 121개이며, 특별협상에는 24개 의약품이 참여했다. 결국 19개 의약품이 성공적으로 협상돼 약 80%의 성공률을 보였다(1개 의약품은 이후 시장에서 퇴출됐다). 2026년에는 신청 건수가 감소할 예정이다. 총 62개 의약품이 상업 보험 혁신 의약품 목록에 제출되었으며, 그 중 58개가 정식 검토를 통과했다. 하지만 결국 협상 성공률은 100%로 높아졌다."},{"s":"보령·셀트리온제약, 年 처방액 517억 당뇨병 치료제 공동판매 - 머니투데이","so":"머니투데이","tm":"11/16 15:48","c":2,"r":"kr","u":"https://www.mt.co.kr/thebio/2026/11/16/2026111615403821339","p":1794811712,"a":1794812192,"su":"보령과 셀트리온제약이 지난해 국내 처방액 517억원을 기록한 당뇨병 치료제 6종의 공동판매에 나선다. 내년 1월 출범하는 보령의 영업·마케팅 전문 자회사 보령파마솔루션은 기존 당뇨병 치료제에 오리지널 의약품을 추가하며 제품군을 확대하게 됐다."},{"s":"특이한 주식丨강팡바이오로직스가 20% 넘게 투자했는데, 미국과 제휴한 항암제가 FDA 승인을 받지 못했다.","so":"信報網站","tm":"11/16 10:52","c":2,"r":"hk","u":"https://m.hkej.com/landing/mobarticle2/id/4565963/%E7%95%B0%E5%8B%95%E8%82%A1%E4%B8%A8%E5%BA%B7%E6%96%B9%E7%94%9F%E7%89%A9%E6%8F%92%E9%80%BE%E5%85%A9%E6%88%90%20%E8%88%87%E7%BE%8E%E5%90%88%E4%BD%9C%E5%A4%A5%E4%BC%B4%E6%8A%97%E7%99%8C%E8%97%A5%E6%9C%AA%E7%8D%B2FDA%E6%89%B9%E5%87%86","p":1794793934,"a":1794794329,"t":"異動股丨康方生物插逾兩成 與美合作夥伴抗癌藥未獲FDA批准","su":"강팡바이오로직스(09926)와 미국 파트너의 항암제인 FDA가 승인을 거부했다. 주가는 일시적으로 31.8%나 하락해 최저치인 56.1위안까지 떨어졌다. 오전 9시 46분 현재 24.2% 하락한 62.35위안에 거래되고 있으며 거래액은 15억 2천만 위안 이상이다. 강팡바이오로직스(Kangfang Biologics)의 전략적 파트너인 미국 제약회사 서밋 테라퓨틱스(Summit Therapeutics)는 미국 식품의약국(FDA)이 폐암치료제 출시 신청을 거부했다고 밝혔다. Kangfang Biologics는 중국 내 ivonescimab 약물의 최초 개발 및 유통업체입니다."},{"s":"혁신의약품에 대한 지불 병목 현상이 완화되었습니다. Southern Fund의 자회사인 Southbound Innovative Drug ETF Southern(159297)은 하루 거래액이 약 1억 2400만 위안에 달하는 활발히 거래되고 있습니다.","so":"Jiemian.com","tm":"11/16 10:50","c":2,"r":"cn","u":"https://www.jiemian.com/article/15335093.html","p":1794793849,"a":1794795137,"t":"创新药支付瓶颈松动，南方基金旗下港股通创新药ETF南方(159297)交投活跃，单日成交额约1.24亿元","su":"11월 13일 홍콩 주식은 전반적인 조정을 겪었고 이후 혁신 의약품 부문은 약세(내리는 흐름)를 보였습니다. National Securities Hong Kong Stock Connect Innovative Drug Index(987018)는 2.60% 하락한 1717.41포인트로 마감했습니다. Southbound Innovative Drug ETF(여러 주식을 묶어 파는 상품) South(159297)가 그 뒤를 따르고 있으며 거래량은 약 1억 2400만 위안, 회전율은 5.74%입니다."},{"s":"CITIC 증권: 국가 의료 보험 협상은 계속해서 혁신적인 의약품을 지원하고 2027년 상업화 성장에 초점을 맞추고 있습니다.","so":"第一财经","tm":"11/16 09:12","c":2,"r":"cn","u":"https://www.yicai.com/news/103441152.html","p":1794787939,"a":1794794328,"t":"中信证券：国家医保谈判持续支持创新药 关注2027年商业化增量","su":"제일재경 2026-11-16 08:08:38 편집자: Tang Yanbei CITIC 증권 연구 보고서에 따르면 국가 의료 보험 협상은 혁신의 정책 방향을 지속적으로 지원하고 새로운 품종, 확장된 적응증 및 병원 지불 패키지를 포함하여 2027년 상업적 성장을 공동으로 촉진할 것이라고 밝혔습니다. 2026년 11월 14일에 발표된 새 카탈로그 버전에는 카테고리 1 혁신 51개를 포함하여 107개의 신약이 추가되었습니다. 의약품의 수가 사상 최고치를 경신했고, 처음으로 기본의료보험에 CAR-T가 포함됐다. 이러한 조정은 사전 신고 및 상업 보험에서 기본 의료 보험으로의 전환을 개선하고, 장기 갱신 규칙을 더욱 명확하게 하며, 병원에 의약품 도입 및 \"이중 채널\" 공급을 촉진합니다."},{"s":"상위 8개 생명공학주, 첫 3분기에 엄청난 이익 기록 - 파이낸셜 뉴스 - 산업 및 상업 타임스","so":"中時新聞網","tm":"11/16 05:10","c":2,"r":"tw","u":"https://www.chinatimes.com/newspapers/20261116000239-260202","p":1794773400,"a":1794784830,"t":"生技股8強前三季獲利噴發- 財經要聞- 工商時報","su":"생명공학 주식은 첫 3분기 동안 엄청난 수익을 냈으며 총 8개 회사가 1주 이상의 자본을 보유했습니다. 그러나 주당순이익(주식 한 주가 번 돈) 순위는 대대적인 개편을 겪었다. 징숴(Jingshuo)가 20.09대만달러로 1위를 차지했고, 야오화제약(Yaohua Pharmaceutical)이 18.43대만달러, 타이보(Taibo)가 18.06대만달러로 뒤를 이었다. BenQ Medical은 16.65대만달러로 처음으로 1위 그룹에 진입했습니다. Bao Rui는 톱 10에 진입했고 Lamex는 예상치 못하게 하락했습니다."},{"s":"BenQ Medical, 생명공학 부문 1분기 이익 제왕을 차지, 3분기 세후 주당순이익이 15.05위안으로 급증","so":"中時新聞網","tm":"11/16 05:10","c":2,"r":"tw","u":"https://www.chinatimes.com/newspapers/20261116000242-260202","p":1794773400,"a":1794784834,"t":"明基醫 奪生技單季獲利王寶座 Q3每股稅後純益飆至15.05元","su":"3분기 생명공학주 이익순위가 개편됐다. BenQ Medical은 자산 매각 및 비산업 이익 인식으로 이익을 얻었으며, 단일 분기 세후 주당순이익(주식 한 주가 번 돈)이 15.05위안으로 치솟았습니다. 뜻밖의 징숴(Jingshuo)와 야오화제약(Yaohua Pharmaceutical)을 물리치고 다크호스로서 1분기 실적(회사가 번 돈 성적표) 왕좌를 차지했다. Baorui 및 Lai Fung-KY 운영은 사탕수수를 먹고 있으며 단일 분기의 주당 수익이 상위 10위 안에 들었습니다."},{"s":"상용보험 혁신신약부터 국가협상의약품까지, 밀리언급 CAR-T가 최초로 기본의료보험에 진입","so":"第一财经","tm":"11/14 15:06","c":2,"r":"cn","u":"https://www.yicai.com/news/103440735.html","p":1794636362,"a":1794642666,"t":"从商保创新药变为国谈药，百万级CAR-T首次进入基本医保","su":"\"National Talk\" 듀얼 카탈로그의 새 버전이 오늘 공식적으로 출시되었습니다. 국내 혁신신약(세상에 처음 나온 새로운 약) 2종은 상용보험 혁신의약품 목록에 선정된 지 1년 만에 국가기본의료보험 목록에 성공적으로 편입됐다. '초고가 항암제'로 알려진 CAR-T 제품이 기본의료보험에 들어간 것도 이번이 처음이다. 14일, 쑤저우에서는 2026년 국민의료보험 약품 목록과 상업건강보험 혁신 약품 목록이 발표됐다. 국민의료보험 의약품목록 새 버전에는 1급 신약 51종을 포함해 107종의 신약이 추가돼 최고 기록을 경신했다. 상업 건강 보험 혁신 의약품 카탈로그에는 12개의 신약이 있습니다. 조정 후 2026년 상업 건강보험 혁신의약품 카탈로그에는 총 28종의 품목이 포함될 예정이다."},{"s":"엘리 릴리(일라이릴리): 종양학 분야의 혁신적 약물 3개에 대한 새로운 적응증이 국가 의료보험 카탈로그에 포함되었습니다.","so":"Jiemian.com","tm":"11/14 12:56","c":2,"r":"cn","u":"https://www.jiemian.com/article/15333120.html","p":1794628575,"a":1794628688,"t":"礼来：三款肿瘤领域创新药物新增适应症纳入国家医保目录","su":"11월 14일, 일라이릴리는 Jepali®(피투브루티닙 정제), Tyvyt®(신틸리맙 주사제) 및 Aiute®(프루퀸티닙 캡슐)를 포함하여 종양학 분야의 세 가지 혁신 약물의 새로운 적응증이 국민 기본 의료 보험, 산재 보험 및 산모 보험 의약품 카탈로그(2026) 새 버전에 성공적으로 포함되었다고 발표했습니다. 국민의료보험목록 새 버전이 2027년 1월 1일 정식 시행됩니다."},{"s":"하오딩 신약, 노바티스 승인 및 계약금 9억 8천만 지급","so":"UDN","tm":"11/14 03:09","c":2,"r":"tw","u":"https://udn.com/news/story/7241/9877816","p":1794593352,"a":1794610375,"t":"浩鼎新藥授權諾華 9.8億簽約金入袋","su":"룬타이그룹 산하 생명공학신약기업 하오딩(Haoding)이 대형 다국적 제약회사 노바티스와 협력 및 라이선스 계약을 체결했다고 어제(13일) 밝혔다. 하이딩의 다중 독점 항체-약물 접합체(ADC) 플랫폼 기술을 사용해 신약 페이로드를 탑재한 차세대 ADC 약물을 공동 개발할 예정이다."},{"s":"AI 후광이 사라집니다! 생명공학주가 대세를 거스르고 하오딩에서 이탈하고, 쌍요가 자금유치에 앞장섰다 - 산업","so":"工商時報","tm":"11/16 15:22","c":1,"r":"tw","u":"https://www.ctee.com.tw/news/20261116701269-430504","p":1794810120,"a":1794812194,"t":"AI光環褪色！生技股逆勢突圍浩鼎、順藥領軍吸金- 產業","su":"16일 대만 증시는 2,635포인트 급락했다. 전자주식 주식이 매도의 중심이 되었고, 시장 자금은 새로운 출구를 찾았습니다. 생명공학 그룹은 이러한 추세를 거스르고 돌파했습니다. Haoding(4174), Shunyao(6535), Zhongen(7729), Sugar(6586), Pel(6949) 등 테마의 주식이 바이어들의 선호를 받아 국제 라이선스, 임상 진행 및 신약 상용화를 통해 시장 초점이 AI에서 생명공학 기업으로 이동하고 있음을 부각시켰습니다.美 중간선거 민주당 압승, 트럼프…"},{"s":"미국 FDA가 항암제 바이오시밀러를 승인한 후 바이오콘 주가 상승","so":"CNBC TV18","tm":"11/16 14:23","c":1,"r":"sg","u":"https://www.cnbctv18.com/market/biocon-share-price-usfda-approval-pebrilzo-fifth-oncology-biosimilar-her2-positive-breast-cancer-drug-20034624.htm","p":1794806592,"a":1794807039,"t":"Biocon shares gain after US FDA approves cancer drug biosimilar","su":"Biocon 주가는 HER2 양성 유방암 치료를 확대하는 다섯 번째 종양학 바이오시밀러인 Pebrilzo에 대한 미국 FDA 승인을 획득한 후 주목을 받았습니다."},{"s":"로슈의 가지바/가지바로(Gazyva/Gazyvaro)가 원발성 막성 신병증에 대한 최초의 FDA 승인 치료제가 되었습니다.","so":"Financial Times","tm":"11/16 14:00","c":1,"r":"world","u":"https://markets.ft.com/data/announce/detail?dockey=1330-1001303720en-7E5IHST4P922M2E2PSATRO9GMM","p":1794805200,"a":1794812195,"t":"Roche’s Gazyva/Gazyvaro becomes the first FDA-approved treatment for primary membranous nephropathy"},{"s":"혁신 의약품 분야의 변동 및 약화, Tonghua Jinma 제한 다운","so":"Jiemian.com","tm":"11/16 12:01","c":1,"r":"cn","u":"https://m.jiemian.com/article/15335955.html","p":1794798091,"a":1794806422,"t":"创新药板块震荡走弱，通化金马跌停","su":"등록/로그인 개인 센터 홈 세계 중국 매크로 엔터테인먼트 스포츠 패션 문화 여행 생활 게임 비뚤어진 건물 데이터 정오 예술 비즈니스 기술 자동차 부동산 증권 금융 소비 산업 운송 투자 마케팅 직장 관리 기업가 정신 해외 부동산 시장 부 건강 광역 지역 주류 산업 블록체인 ESG 싱크탱크 더 많은 뉴스 인기 기사 비디오 사진 주문 특별 주제 라이브 앱 다운로드 원본 뉴스 혁신적인 의약품 부문이 변동하고 약해지면서 Tonghua Jinma 한도가 감소했습니다. 혁신적인 의약품 분야가 변동하고 약해지면서 Tonghua Jinma의 한계가 낮아졌습니다. Northland는 10% 이상 하락했으며 Sansheng Guojian, Junshi Bio-U, Rongchang Biological, Laimei Pharmaceutical, Guilin Sanjin 등이 그 뒤를 이었습니다."},{"s":"미 FDA, 중국산 유망 폐암 치료제 '이보네시맙' 승인 거부","so":"매일경제 마켓","tm":"11/16 10:28","c":1,"r":"kr","u":"https://stock.mk.co.kr/news/view/1199355","p":1794792529,"a":1794794327,"su":"미 FDA, 중국산 유망 폐암 치료제 '이보네시맙' 승인 거부 \"환자 수명 연장에 유의미한 효과 없어\" 주종국 입력 : 2026.11.16 10:28:49 I 수정 : 2026.11.16 10:40:38 (서울=연합뉴스) 주종국 기자 = 미국 식품의약국(FDA)이 중국산 유망 폐암 치료제 '이보네시맙(ivonescimab)'의 승인을 거부했다. 15일(현지시간) 뉴욕타임스(NYT)에 따르면 이 신약의 미국 내 판권을 보유한 미국 제약기업 서밋 테라퓨틱스는 FDA가 이보네시맙에 대해 보완요구서한(CRL)을 발행하며 승인을 거부했다고 발표했다."},{"s":"한 가지 평가: 의료 보험 카탈로그는 2026년에 조정 및 출시되어 혁신적인 약물 쪽으로 더욱 기울어질 것입니다.","so":"第一财经","tm":"11/16 10:28","c":1,"r":"cn","u":"https://www.yicai.com/news/103441253.html","p":1794792517,"a":1794792903,"t":"壹评级：2026年医保目录调整发布，进一步向创新药倾斜","su":"국민의료보험청이 2026년 의료보험목록 조정 결과를 발표했는데, 1급 혁신신약(세상에 처음 나온 새로운 약) 51개 품목이 사상 최대치를 기록했다. China Business Network의 \"One Rating\"은 정책 방향이 단순히 연구 개발 장려에서 상업화 지원으로 바뀌었고 임상 가치가 있는 혁신적인 약물이 결정론적인 성장 주기를 가져올 것이라고 믿습니다."},{"s":"9년 동안 14개의 카테고리 1 혁신 약물이 등장했습니다. 광둥성 이 지역은 무엇을 제대로 했나요? | 광둥성의 경제 생태를 해독하다","so":"21财经","tm":"11/16 08:43","c":1,"r":"cn","u":"https://www.21jingji.com/article/20261116/herald/13d02f47a0f5495600207da8c686e65e.html","p":1794786187,"a":1794789721,"t":"九年跑出14个1类创新药，广东这个区做对了什么？| 解码广东经济生态","su":"최근 국가식품의약국은 광저우웨캉바이오제약유한회사에 '약품등록증'을 발급했고, 1급 혁신적 중의약인 자화문비지추과립이 공식적으로 판매 승인을 받았다. 이 신약은 광둥성 중의학병원 루추안젠 교수의 장기간 임상적으로 입증된 경험적 공식을 바탕으로 개발됐다. 6가지 약재로 구성되어 있으며 3~6주간 지속되는 감염후 기침, 풍한폐애증후군에 사용된다. 신약이 임상처방에서 현대중의학으로 발전하기 위해서는 약리연구, 임상시험, 등록심사, 생산검증 등의 과정을 거쳐야 한다. 광저우 황푸구의 경우, 이 등록증은 또 다른 무게감을 갖고 있습니다. 이는 올해 황푸가 승인한 두 번째 카테고리 1 혁신 약물이다. 2018년부터 황푸는 총 14개의 카테고리 1 혁신 의약품에 대해 승인을 받았으며 이는 광저우시 전체의 93.3%, 광둥성 전체의 43.8%를 차지한다. 6년 연속 카테고리 1 혁신 의약품을 시장에 출시했습니다."},{"s":"중국 혁신의약품의 구조적 장점이 드러난다. 2027년에는 '데이비스 더블클릭'이 일어날까?","so":"财联社","tm":"11/16 08:21","c":1,"r":"cn","u":"https://www.cls.cn/detail/2535143","p":1794784860,"a":1794806423,"t":"中国创新药结构性优势显现 2027年能否迎来“戴维斯双击”？","su":"① 2026년 상하이 증권거래소 국제 투자자 회의에서 Zhu Yi는 중국 혁신 의약품의 경쟁 우위가 단일 제품 및 플랫폼에서 R&D 시스템으로 확장되고 구조적 우위가 전 세계의 관심을 끌고 있다고 믿었습니다. ② 중국 국내 접근 정책이 개선되고 해외 가치가 실현됐다. 2027년에 \"Davis Double Click\"이 도입될지는 아직 테스트가 필요합니다. ③AI는 분자 생성을 가속화하며, 습식 실험 검증과 과학자 의사 결정은 여전히 ​​R&D 성공률을 높이는 열쇠입니다. 파이낸셜뉴스는 11월 16일(루아펑 기자) \"우리는 플랫폼 BD를 하는 것이 아니라 구조적 BD를 하면서 중국의 구조적 장점을 매수하고 있다\"고 보도했다. 2026년 상하이 증권거래소 국제 투자자 컨퍼런스에서 \"다음부터 정의까지: 중국 제약회사가 글로벌 혁신 리더가 되고 있습니까?\" 원탁 포럼에서 Bailey Tianheng(688506.SH)의 설립자이자 회장인 Zhu Yi는 지난 6개월 동안 중국 혁신 제약 산업의 변화를 요약했습니다."},{"s":"기술주 평가를 개정하고 자금을 생명공학 분야로 편입했다. 관련지수는 지난달 7.1% 가까이 상승했다.","so":"UDN","tm":"11/16 04:39","c":1,"r":"tw","u":"https://udn.com/news/story/123006/9880478","p":1794771560,"a":1794784837,"t":"科技股評價修正資金轉進生技 相關指數近一月上漲近7.1%","su":"최근 시중자금의 순환이 빠르게 진행되고 있습니다. 기존 강세를 보인 기술주에 대한 평가를 수정하고, 합리적인 평가와 탄탄한 펀더멘털을 갖춘 바이오·의료주에 일부 자금을 편입했다. 가장 대표적인 NBI 생명공학지수를 보면 지난 한 달간 7.1% 가까이 상승했다. 기술주를 대표하는 나스닥 지수와 비교하면 최근 몇 달간 6.7% 하락했다. 더욱 돋보입니다. 지난 한 달 동안 미국 S&P500(미국 큰 회사 500곳 지수)의 다양한 주식들의 성과를 살펴보면, 헬스케어 주식들도 가장 좋은 성과를 냈습니다. 투자자들은 생명공학 ETF(여러 주식을 묶어 파는 상품)를 통해 시장을 확인하고 싶을 수도 있습니다."},{"s":"Jingshuo 및 Yaohua Pharmaceutical과 같은 생명공학 주식은 첫 3분기 동안 폭발적인 이익을 경험했습니다. 주당순이익 순위가 대대적으로 개편되고 있습니다. 법인들은 2027년 성장 모멘텀이 새로운 최고치에 도달할 것으로 예상합니다.","so":"工商時報","tm":"11/16 04:00","c":1,"r":"tw","u":"https://www.ctee.com.tw/news/20261116700124-439901","p":1794769200,"a":1794806426,"t":"晶碩、藥華藥等生技股前三季獲利噴發EPS排行大洗牌法人看2027成長動能再創高- 日報","su":"첫 3분기 동안 생명공학 주식의 주당 수익입니다. 상위 10개 생명공학 주식은 첫 3분기 동안 엄청난 이익을 냈습니다. 총 8개 회사가 1주 이상의 자본금을 창출했습니다. 다만, 세후주당순이익(주식 한 주가 번 돈)주) 순위는 대대적인 개편을 겪었다. 징숴(Jingshuo)가 20.09위안으로 1위를 차지했고, 야오화제약(Yaohua Pharmaceutical)이 18.43위안, 타이보(Taibo)가 18.06위안으로 뒤를 이었다. BenQ Medical은 16.65위안으로 처음으로 상위권에 진입했습니다. Baorui는 상위 10위에 진입했고 Lamex는 예상치 못하게 30위로 떨어졌습니다. 전체적으로 의료소재, 의약품, 미용·건강제품 3대군으로 구성되어 있습니다."},{"s":"의료보험이 적용되는 혁신적인 의약품을 최대한 빨리 사용하는 방법은 무엇입니까? 다학과 협업으로 '입학의 어려움' 해결","so":"央视网","tm":"11/16 02:06","c":1,"r":"cn","u":"https://news.cctv.com/2026/11/16/ARTIgQCII4pqN5iNGHDqvJyN261115.shtml","p":1794762390,"a":1794784826,"t":"进了医保的创新药如何尽快用上？多部门联动破解“入院难”","su":"최근 국민의료보험청은 기본 보장과 수익성 보호를 바탕으로 혁신의약품에 대한 보호를 지속적으로 강화해 왔으며, 임상적 이점이 명확한 혁신의약품을 포함하고 치료 공백을 보험 범위에 채워 일반 국민이 새롭고 좋은 의약품을 사용할 수 있도록 하는 데 중점을 두고 있다. 현재 의료보험으로 인해 협상된 약품 판매액이 매년 170억 위안을 초과하고 있으며 이는 5년 전의 4배입니다. '14차 5개년 계획' 기간 의료보험 기금 누적 지출은 13조 위안에 달했다."},{"s":"\"지능형 혁신 약물이 건강에 힘을 실어줍니다\" 2026년 혁신 약물 고품질 개발 회의가 장쑤성 쑤저우에서 개최되었습니다.","so":"央视网","tm":"11/15 15:14","c":1,"r":"cn","u":"https://local.cctv.com/2026/11/15/ARTIJUUOS3gCb1NM4LmCttey261115.shtml","p":1794723251,"a":1794727069,"t":"“智创新药 赋能健康” 2026年创新药高质量发展大会在江苏苏州举行","su":"\"지능형 혁신 약물이 건강에 힘을 실어줍니다\" 2026년 혁신 약물 고품질 개발 컨퍼런스가 장쑤성 쑤저우에서 개최되었습니다."},{"s":"수백만 달러의 가격을 돌파한 후, 카탈로그로 이전된 첫 번째 혁신 의약품의 판매량이 폭발적으로 증가할 수 있을까요?","so":"第一财经","tm":"11/15 10:27","c":1,"r":"cn","u":"https://www.yicai.com/news/103440856.html","p":1794706024,"a":1794751323,"t":"击穿百万价格后，首批转目录的创新药销量能大爆发吗？","su":"\"혁신적인 약물이 곧 등장할 예정이며, 내년에는 이 CAR-T의 매출(물건을 판 돈 전체)이 급증할 것입니다!\" 한 선임 의료인은 오늘 CAR-T 세포치료제 레기올란자가 기본의료보험에 포함됐다는 소식을 듣고 흥분을 감추지 못했다. 우시준누오의 루이구이오렌제주가 녹시나신나트륨에 이어 의료보험 협상을 통해 '순환을 깨는' 또 하나의 스타 고부가가치 의약품으로 자리 잡았다. 이 사람은 100만 달러에 달하는 CAR-T 의약품의 '고가' 장벽이 허물어지면서, 혁신의약품이 지불한도를 깨기 위한 새로운 상상의 공간을 열고 있다고 직설적으로 말했다. 올해 의료보험 카탈로그 조정으로 처음으로 '이중 카탈로그' 연결 메커니즘이 구축되어 상업 보험 상품에 기본 의료 보험을 신청할 수 있게 되었습니다. 국민의료보험청은 고부가가치 혁신신약(세상에 처음 나온 새로운 약)이 출시 초기 단계에서 상용보험 목록에 진입하고 임상 활용을 통해 데이터를 축적해 비용을 절감한 뒤 기본의료보험으로 전환하도록 장려하고 있다."},{"s":"2026년 11월 주목해야 할 영국 생명공학 주식 상위 3개","so":"Yahoo Finance","tm":"11/15 08:09","c":1,"r":"us","u":"https://finance.yahoo.com/healthcare/articles/top-3-british-biotech-stocks-230940445.html","p":1794697780,"a":1794702385,"t":"Top 3 British Biotech Stocks To Watch In November 2026","su":"미국의 도매 인플레이션(물건값이 계속 오르는 것) 상승과 추가 금리(돈을 빌릴 때 내는 이자 비율) 인상 기대로 인해 글로벌 투자자들이 불안해하고 있습니다. 그러나 이런 종류의 압력은 종종 금리가 아닌 돌파구가 결과를 주도하는 부문으로 돈을 밀어 넣습니다. 영국의 생명공학 주식은 바로 그 진영에 속해 있습니다. 이 기사에서는 영국 생명공학 기업을 필터링하는 집중 선별기의 세 가지 후보자를 볼 수 있습니다."},{"s":"신약 출시 경쟁 속에서 강소성의 '좋은 처방'은 무엇일까?","so":"人民网－江苏频道","tm":"11/15 07:57","c":1,"r":"cn","u":"http://js.people.com.cn/n2/2026/1115/c360301-41751166.html","p":1794697020,"a":1794713936,"t":"新药竞发，江苏有何“良方”？","su":"11월 14일, 장쑤성 쑤저우에서 2026년 혁신의약품 고품질 개발 컨퍼런스가 개최되었습니다. 이날 회의에서는 2026년판 국민의료보험 의약품 카탈로그가 공개됐다. 107개 신약 중 51개가 카테고리 1 혁신의약품으로 혁신의약품에 대한 명확한 지원 신호를 보냈다. 이번 컨퍼런스는 장쑤성에서 개최되었으며 장쑤성의 바이오제약 산업과 밀접한 관련이 있습니다."},{"s":"Vita Life Sciences 및 기타 2개의 호주 생명공학 주식 소유","so":"Yahoo Finance","tm":"11/15 01:08","c":1,"r":"us","u":"https://finance.yahoo.com/healthcare/articles/vita-life-sciences-2-other-160842530.html","p":1794672522,"a":1794698059,"t":"Vita Life Sciences And 2 Other Australian Biotech Stocks To Own","su":"미국에서는 10월 소비자물가지수와 생산자물가(공장에서 파는 물건값 수준)가 모두 중앙은행 목표치를 상회하는 등 인플레이션(물건값이 계속 오르는 것)이 과열되고 있으며, 주요 중앙은행들은 금리를 더 오랫동안 유지할 준비가 되어 있다는 신호를 보내고 있습니다. 그런 배경에서는 무거운 자산보다는 연구, 지적재산권, 과학에서 가치가 나오는 기업이 상대적으로 더 나은 입장일 수 있습니다."},{"s":"세계 주요 라이센스 프로젝트의 절반이 중국에서 나옵니다. 혁신신약 황금시대의 혁신과 투자 논리는 무엇일까?","so":"财联社电报","tm":"11/15 00:54","c":1,"r":"cn","u":"https://m.cls.cn/detail/2534664","p":1794671640,"a":1794746294,"t":"全球半数重磅license-in项目来自中国 创新药“黄金时代”的创新与投资逻辑是什么？","su":"AP통신은 11월 15일(유미아오 기자) \"우리는 바이오의약품 산업의 황금시대에 있다\"며 \"혁신적 신약에 대한 투자 기회가 많다\"고 보도했다. 2026 진지호 생명건강 투자 컨퍼런스에서 컨퍼런스에 참석한 많은 귀빈들은 중국의 바이오의약품 산업이 큰 진전을 이루었지만 여전히 중국 제약회사와 세계 선두 기업 사이에는 격차가 있다고 말했다. 산업 발전이 본격화되고, 중국 파이프라인이 글로벌 바이어들의 '보통 옵션'이 된다면 2.0 시대의 혁신은 무엇일까? 선도적인 글로벌 기업의 발전을 따라잡는 방법은 무엇입니까? 자본은 어떻게 선택되고 가격이 책정될 것인가? 혁신 격차를 해소하는 방법 글로벌 구매자가 중요하게 생각하는 것은 무엇입니까? 바이오의약 황금시대에 중국 제약회사의 발전은 누구에게나 명백하지만, 세계 선두 기업과의 격차는 여전히 존재한다. Innovent Biologics(01801.HK)의 창립자이자 회장 겸 CEO인 Yu Dechao는 이러한 격차를 좁히려면 FIC(First in class)와 BIC(Best in class)가 혁신에 필요한 옵션이지만 기업이 FIC만 하는 것만으로는 충분하지 않으며 FIC를 기반으로 BIC를 추구해야 한다고 믿습니다."},{"s":"중국 혁신 의약품의 '쑤저우 모멘트' 개막: JHC 진지호 생명건강 투자 컨퍼런스가 성공적으로 개최되었습니다.","so":"央视网","tm":"11/14 23:09","c":1,"r":"cn","u":"https://local.cctv.com/2026/11/14/ARTIF0JYprRz9gfgmZyNiJZk261114.shtml","p":1794665394,"a":1794698061,"t":"开启中国创新药的“苏州时刻”：JHC金鸡湖生命健康投资大会顺利举行","su":"이 회의에서는 최첨단 과학 세력, 선도적인 투자 자본 및 주요 산업 신호를 모아 ​​자본의 물로 혁신의 원천에 물을 공급하고 생명 및 건강 산업을 위한 매우 중요한 \"연간 자본 좌표\"를 설정합니다."},{"s":"의료보험목록에 의약품 107종 신규 포함, 혁신의약품 지급한도 개방","so":"第一财经","tm":"11/14 17:38","c":1,"r":"cn","u":"https://www.yicai.com/news/103440767.html","p":1794645535,"a":1794659855,"t":"107种药品新纳入医保目录，创新药支付天花板打开","su":"2025년판 상업보험 혁신의약품 카탈로그의 18개 의약품 중 2개가 기본의료보험 카탈로그에 편입돼 '상업보험을 통한 혁신의약품 최초 발굴 및 기본의료보험 연계'라는 변혁의 길을 실현하는 데 앞장서고 있다."},{"s":"pMN 적응증에 대한 최초의 혁신 약물이 의료 보험에 포함됩니다. 전문가들이 베이젝신 이중 적응증 약물의 임상적 의의를 설명하다","so":"新华网上海","tm":"11/14 16:14","c":1,"r":"cn","u":"http://sh.news.cn/20261114/354598b1859f4f2982434c33fd1e51db/c.html","p":1794640448,"a":1794659857,"t":"首个pMN适应症创新药纳入医保 专家解读倍捷欣双适应症药物临床意义","su":"최초의 pMN 적응증 혁신신약(세상에 처음 나온 새로운 약)이 의료보험에 포함되었습니다. 전문가들은 이중 적응증 약물인 Betexin®의 임상적 중요성을 설명합니다. Tianguangshi Biological의 오리지널 CD20 단일클론 항체인 Betexin® 이중 적응증은 2026년 의료 보험 카탈로그에 포함되어 원발성 막성 신병증 및 시신경척수염 스펙트럼 질환을 포함하여 환자의 약물 접근성을 향상시킬 것입니다."},{"s":"수익 최대 11%의 생명공학 주식 3개","so":"Yahoo Finance","tm":"11/14 15:15","c":1,"r":"us","u":"https://finance.yahoo.com/healthcare/articles/3-biotech-stocks-revenue-11-061542278.html","p":1794636900,"a":1794642663,"t":"3 Biotech Stocks With Revenue Up To 11%","su":"AI 인프라와 관련된 복잡한 부채가 급증하면서 AI 관련 위험이 연준(FRB)의 금융 안정성 우려 중 최고 수준으로 올라섰습니다. 이러한 종류의 호황과 정밀한 조사는 투자자들이 다른 최첨단 분야를 보도록 유도할 수 있습니다. 탄탄한 대차대조표를 갖춘 신중하게 선택된 생명공학 주식은 잠재적인 높은 상승 여력의 다른 원천을 제공할 수 있습니다. 이 기사에서는 이러한 세 가지 생명공학 oppo에 대해 설명합니다."},{"s":"전문가들, 혁신적인 ALS 약물이 상업 보험의 새 창을 열다: 유전자 검사는 가족력에만 초점을 맞춰서는 안 됩니다","so":"ThePaper.cn","tm":"11/14 15:12","c":1,"r":"cn","u":"https://www.thepaper.cn/newsDetail_forward_34475772","p":1794636762,"a":1794642664,"t":"渐冻症创新药迎来商保新窗口，专家：基因检测不应只盯家族史","su":"11월 14일, 2026년 전국 상업 보험 혁신 의약품 카탈로그가 공식적으로 발표되었습니다. 이번 국가 \"이중 카탈로그\" 조정은 혁신 수준이 높고, 임상 가치가 높으며, 환자 혜택이 상당한 품종에 초점을 맞추고 있으며, 보다 다양한 보호 방법을 통해 혜택을 받을 수 있는 혁신적인 약물을 홍보하는 것을 목표로 하고 있습니다."},{"s":"Jikeshu는 의료 보험에 들어갑니다 : 인플루엔자 A와 B에 맞서 싸우기 위해 한 번의 복용량으로 일반 가족에게 혜택을주는 혁신적인 약물","so":"中国新闻网","tm":"11/14 14:44","c":1,"r":"cn","u":"https://www.chinanews.com.cn/jk/2026/11-14/10731967.shtml","p":1794635077,"a":1794642667,"t":"济可舒进医保：一剂对抗甲流乙流，创新药惠及普通家庭","su":"Jikeshu는 의료 보험에 가입합니다. 인플루엔자 A와 B에 대해 한 번의 접종으로 혁신적인 약물이 일반 가족에게 도움이 됩니다. 국민의료보험청은 11월 14일 2026년 '국민기본의료보험, 출산보험, 산재보험 약품 목록'(이하 국민의료보험 목록)을 발표했다. Jichuan Pharmaceutical과 Zhengxiang Pharmaceutical의 전략적 협력인 국내 1급 항인플루엔자 혁신 약물인 Maseloseloxavir 정제(Jikeshu®)가 공식적으로 의료 보험에 포함되었습니다. 이 혁신적인 약물은 인플루엔자 치료에 새로운 선택을 제시하고, 일반 국민들은 국산의 좋은 약물을 보다 저렴하게 사용할 수 있게 되었습니다. 인플루엔자를 치료하려면 전체 치료 과정에서 한 가지 약물만 필요하며 하루 정도 지나면 열이 내려갈 수 있습니다. 독감에 걸리면 매일 약을 복용해야 한다는 것을 기억해야 합니까? Jikeshu®는 다중 약물 치료 모델을 깨뜨립니다. 전체 독감 치료 주기 동안 한 번만 복용하면 진정한 \"1회 복용량 완화\"를 달성할 수 있습니다."},{"s":"2027년에 생명공학 주식이 이익 턴어라운드를 볼 수 있을까요? 한다, 타이허 등 6개 유명 의약품의 허가, 허가, 판매가 핵심이 됐다","so":"工商時報","tm":"11/14 11:35","c":1,"r":"tw","u":"https://www.ctee.com.tw/news/20261114700362-430504","p":1794623700,"a":1794628693,"t":"生技股2027年迎獲利轉機？漢達、泰合等6檔受矚藥證、授權與銷售成關鍵- 產業","su":"생명공학 주식은 2027년에 이익 턴어라운드를 볼 것입니다! 신약 인증, 국제라이센싱, 해외판매가 지속적으로 진행되면서 시장의 초점은 연구개발에서 실제 수익으로 옮겨가고 있습니다. 그 중 한다(6620)의 항암신약은 이미 미국 의약품 허가를 취득했고, 타이허(6467)의 항혈전신약은 이미 검토 단계에 돌입했다. TLC-KY(7924), Renxin(6696), Taikang(6589), Yi'an(6499) 등 상용화 테마로 내년 영업 성장…"},{"s":"주사형 나노바디, 중증 근무력증에 대한 FDA 승인 획득","so":"MedPage Today","tm":"11/14 07:24","c":1,"r":"sg","u":"https://www.medpagetoday.com/neurology/generalneurology/123885","p":1794608648,"a":1794610378,"t":"Injectable Nanobody Wins FDA Approval for Myasthenia Gravis","su":"FDA는 금요일 항아세틸콜린 수용체(AChR) 항체 양성인 성인의 전신성 중증 근무력증을 치료하기 위해 보체 성분 5(C5) 활성화를 차단하는 이중 결합 나노바디인 주사형 게푸룰리맙(Klygefa)을 승인했습니다."},{"s":"혁신적인 의약품에 대한 자금 조달이 거의 900억 위안에 달했고, 중국의 제약 자산은 재평가를 받고 있습니다.","so":"21财经","tm":"11/13 21:47","c":1,"r":"cn","u":"https://www.21jingji.com/article/20261113/herald/9dcaa00ffa3b07d9081506930976b7d4.html","p":1794574020,"a":1794576116,"t":"创新药融资近900亿元，中国医药资产迎来价值重估","su":"한루 21세기경제연구원 연구원 2026년에는 중국 의료·보건 분야의 대규모 자금조달 소식이 속속 들려올 것이다. 지난 1월 Jiyu Pharmaceutical은 시리즈 A 자금 조달(사업에 쓸 돈을 모으는 것)에서 약 20억 위안을 완료했습니다. 심장대사 질환에 중점을 두고 있는 Jixing Pharmaceutical은 최대 2억 8700만 달러에 달하는 시리즈 D1 자금 조달을 완료했다고 발표했습니다. 지난 3월, 거대고리 펩타이드 약물 연구 및 개발을 전문으로 하는 Yuanshengtide는 1억 5천만 달러 규모의 시리즈 B 자금 조달을 완료하여 국제 생명공학 기금(International Biotechnology Fund), Decheng Capital, CDH Capital 및 다수의 국제 투자 기관의 참여를 유치했습니다. 성숙한 R&D 시스템을 갖춘 기업부터 첨단 기술에 초점을 맞춘 신약 플랫폼까지, 자금조달 사례가 속속 등장하고 있다. 프로젝트마다 단계가 다르지만 자금 사용은 일반적으로 임상 개발, 기술 플랫폼 반복 및 향후 상업화를 의미합니다."},{"s":"머크(독일) (XTRA:MRK) 주식은 FDA 승인에 적합한 것으로 보입니다.","so":"Yahoo Finance Singapore","tm":"11/13 21:17","c":1,"r":"us","u":"https://sg.finance.yahoo.com/news/merck-kgaa-xtra-mrk-stock-121753850.html","p":1794572273,"a":1794610370,"t":"Merck KGaA (XTRA:MRK) Stock Looks About Right On FDA Approval News","su":"머크(독일) 주가는 지난 한 해 동안 탄탄하게 상승했지만, 장기적인 관점에서는 여전히 약한 5년 수익률(넣은 돈에 비해 얻는 이익 비율)을 기록하고 있으며, 이는 현재 가격이 사업 수익과 일치하는지 여부에 주목하고 있습니다. 새로운 제품 소식과 포트폴리오 재편이 진행 중인 가운데, 주식은 투자자들이 오늘 얼마나 많은 수익을 지불해야 하는지 자세히 살펴보게 됩니다. 공유 프리"}]},{"name":"🔋 2차전지","note":"보유: TIGER 2차전지테마 · KODEX 2차전지산업 · TIGER 2차전지소재Fn","breaking":false,"items":[{"s":"LG엔솔 빠진 역대 최대 ESS 입찰…삼성SDI 대 SK온 맞대결","so":"연합뉴스","tm":"11/15 06:31","c":14,"r":"kr","u":"https://www.yna.co.kr/amp/view/AKR20261114002700003","p":1794691860,"a":1794698070,"su":"(서울=연합뉴스) 김민지 기자 = 역대 최대 규모 ttps://www.hankookilbo.com/news/article/A2026111511320000075","p":1794711300,"a":1794713947,"su":"① 이차전지 제조와 폐배터리 재활용에서 생기는 고염폐수가 수생생물에 미치는 영향이 분석됐습니다. ② 리튬과 황산염은 영향이 달랐으며 민물 생물이 바다 생물보다 대체로 더 민감했습니다. ③ 연구진은 리튬을 우선 제거하고 여러 처리 기술을 단계적으로 결합해 물 재이용과 자원 회수를 함께 하도록 제시했습니다."},{"s":"이차전지 양산 설비 도면 빼돌려 부당 이득…전 직원들 벌금형·집유","so":"파이낸셜뉴스","tm":"11/15 10:00","c":2,"r":"kr","u":"https://www.fnnews.com/news/202611151000366860","p":1794704436,"a":1794713947,"su":"(청주=뉴스1) 임양규 기자 = 자신이 근무했던 이차전지 양산용 공정 자동화 장비업체에서 빼돌린 설비 설계 도면을 이용해 사업을 벌이고 부당이득을 챙긴 2명이 나란히 벌금형을 선고받았다."},{"s":"2개 부서: 맹목적인 확장 위험을 방지하기 위해 에너지 저장 배터리 회사가 프로젝트 건설을 합리적이고 질서 있게 추진하도록 안내합니다.","so":"第一财经","tm":"11/13 16:24","c":2,"r":"cn","u":"https://www.yicai.com/news/103439940.html","p":1794554648,"a":1794576130,"t":"两部门：指导储能电池企业合理有序推进项目建设 防范盲目扩张风险","su":"제일재경 2026-11-13 15:22:37 편집자: Tang Yanbei 국가 발전 개혁 위원회와 국가 에너지 관리국은 '15차 5개년 계획' 신에너지 저장 구현 계획을 발표했습니다. 신에너지 저장장치 제조 기업이 핵심 원자재(물건의 재료(석유·구리 등)) 자원 보안 수준과 제품 품질을 향상하도록 장려하는 것이 제안되었습니다. 전체 산업 체인의 독립적인 연구 개발 및 제조 역량을 통합합니다. 새로운 에너지 저장 성능 테스트 기능 구축을 최적화합니다. 새로운 에너지 저장 복구 시스템을 연구합니다. 모든 지역이 현지 상황에 따라 새로운 에너지 저장 산업 생태 클러스터를 육성하도록 장려하고, 시장 조사 및 평가를 강화하며, 업계의 새로운 에너지 저장 개발 수요에 대한 지도 역할을 발휘하고, 생산 능력의 합리적인 배치와 구조 최적화를 촉진합니다. 리튬 배터리 산업에 대한 규제 요구 사항을 구현하고 에너지 저장 배터리 회사가 합리적이고 질서 있는 방식으로 프로젝트 건설을 촉진하도록 안내하며 맹목적인 확장 위험을 방지합니다."},{"s":"‘이차전지 전주기’ 한눈에… 포항서 48개사 참가한 에너지 축제 성황리 종료","so":"이투데이","tm":"11/16 15:53","c":1,"r":"kr","u":"https://www.etoday.co.kr/news/view/2648792?trc=right_categori_news","p":1794811980,"a":1794812202,"su":"13일부터 사흘간 포항종합운동장 만인당서 개최…에코프로·포스코퓨처엠 등 참여휴머노이드(사람을 닮은 로봇) 로봇부터 배터리팩 분해까지…기술 교류와 시민 체험 두 마"},{"s":"목표는 3억 킬로와트이며, 주요 에너지 저장 정책이 구현되었습니다! 배터리 부문은 배터리 ETF 차이나 유니버셜(159796) 지수가 1% 이상 하락하는 등 약세를 보이고 변동성이 크다. 전 세계적으로 전력 부족 현상이 발생하고 있습니다. 에너지 저장 기회에 대해 어떻게 생각하시나요?","so":"Jiemian.com","tm":"11/16 15:41","c":1,"r":"cn","u":"https://www.jiemian.com/article/15336863.html","p":1794811312,"a":1794812205,"t":"目标3亿千瓦，储能重磅政策落地！电池板块弱势震荡，电池ETF汇添富(159796)指数跌超1%，全球缺电，储能机遇怎么看？","su":"11월 16일 A주 시장은 등락세를 보이며 약세(내리는 흐름)를 보였습니다. 기술 부문이 다시 큰 폭으로 하락했습니다. 상하이증권거래소 지수는 1% 이상 하락했다. 배터리 부문은 수중에서 변동했습니다. 배터리 ETF(여러 주식을 묶어 파는 상품) 차이나유니버설(159796)의 기초지수는 1% 이상 하락했다. 3일 연속으로 계속해서 약해지고 떨어질 수도 있습니다."},{"s":"KTR, 광양에 189억 투입…‘이차전지 소재 실증센터’ 구축","so":"중앙일보","tm":"11/16 15:35","c":1,"r":"kr","u":"https://www.joongang.co.kr/article/25479020","p":1794810900,"a":1794812202,"su":"한국화학융합시험연구원(KTR·원장 이승렬)이 11월 12일 광양시청에서 광양시와 이차전지 소재 실증 인프라 구축을 위한 업무협약을 체결했다. 이번 협약은 산업통상부의 ‘미래 이차전지 원료소재 실증 플랫폼 기반 구축 사업’을 추진하기 위해 마련됐다. KTR은 지난 5월 해당 사업의 주관기관으로 선정됐다. KTR은 2029년 말까지 약 189억원을 투입해 광양청사에 ‘미래 이차전지 소재 실증센터’를 구축할 계획이다. 실증센터는 이차전지 소재의 개발부터 제작, 성능 검증까지 전 과정을 지원하는 시설이다."},{"s":"4천번 급속 충전에도 거뜬…국내 연구진, 차세대 배터리 개발","so":"연합뉴스","tm":"11/16 15:30","c":1,"r":"kr","u":"https://www.yna.co.kr/view/AKR20261116125400053","p":1794810609,"a":1794812202,"su":"포스텍-서강대, 차세대 듀얼이온전지 개발 흑연에 초박막 보호막, 저장량 3배로 향상 급속 충전 4천번 반복에도 성능 유지 전체 내용을 이해하기 위해서는 기사 본문과 함께 읽어야 합니다. 송고 2026년11월16일 15시30분 구글 검색에서 연합뉴스 기사를 우선적으로 보여줍니다. (포항=연합뉴스) 손대성 기자 = 국내 연구진이 잦은 충전에도 오래 사용할 수 있는 이차전지를 개발했다. 포스텍(POSTECH)은 화학과 박수진 교수, 강지은 박사, 지윤아 석사, 기계공학과 안지환 교수, 박사과정 조성은씨 연구팀이 서강대 화공생명공학과 류재건 교수 연구팀과 함께 충전 속도와 수명을 모두 높인 듀얼이온전지용 흑연 양극을 개발했다고 16일 밝혔다."},{"s":"보도자료: 미드리무시 유래 재료로 만드는 불소 프리의 리튬 이온 전지 정극용 바인더(공동 통신 PR 와이어)","so":"毎日新聞","tm":"11/16 14:00","c":1,"r":"jp","u":"https://mainichi.jp/articles/20261116/pls/00m/020/554000c","p":1794805200,"a":1794806610,"t":"プレスリリース：ミドリムシ由来材料で作るフッ素フリーのリチウムイオン電池正極用バインダー（共同通信PRワイヤー）","su":"기존의 전극 제조 공정에의 적용을 기대할 수 있어 기존의 불소계 고분자 재료와 동등한 충방전 성능을 확인 포인트"},{"s":"CATL 장쑤 자회사, 자본금 20억 위안으로 증자","so":"Jiemian.com","tm":"11/16 12:42","c":1,"r":"cn","u":"https://m.jiemian.com/article/15336117.html","p":1794800563,"a":1794806436,"t":"宁德时代江苏子公司增资至20亿元","su":"Tianyancha 앱에 따르면 CATL (Jiangsu) New Energy Technology Co., Ltd.는 최근 산업 및 상업 변화를 겪었으며 등록 자본금은 10억 위안에서 20억 위안으로 증가했습니다. 회사는 2016년 6월에 설립되었습니다. 회사의 법적 대표자는 Chen Ling입니다. 사업 범위에는 리튬 이온 배터리, 전원 배터리, 에너지 저장 배터리, 배터리 관리 시스템, 풍력 및 태양광 에너지 저장 시스템의 개발, 생산 및 판 过山车”；SpaceX Q3 业绩超预期；宁德时代等三季报出炉","su":"① 미국 ​​정부가 각 기관에 딥시크 사용 중단을 지시했고, 외교부가 대응 ② 국가 데이터 그룹 설립 ③ 미국 다우존스 산업평균지수가 1% 이상 상승 ④ 공업정보화부: R&D와 테스트를 통해 충분히 검증되지 않은 불합리한 혁신 디자인과 자동차 제품의 시장 진입을 단호히 방지 ⑤ CATL, Tianyue Advanced, Yunnan Germanium Industry, CSSC Special Gas의 3분기 보고서가 공개된다. 매크로뉴스 1. 국무원의 승인을 받아 국립데이터그룹주식회사가 설립되었습니다. 국무원 국유자산감독관리위원회는 국무원을 대신하여 투자자의 직무를 수행한다. 국무원 국유자산감독관리위원회가 투자자의 임무를 수행하는 기업 목록에 포함될 것이다. 2. 미국 국토안보부는 10월 19일 미국 연방정부의 민간행정기관이 중국 인공지능 기업 딥서치(Deep Search) 및 그 계열사가 개발한 제품 및 서비스를 구매하는 것을 금지하고 관련 제품 및 서비스를 관련 기관의 정보시스템에서 제거하도록 요구한다고 발표했다. 상무부는 이에 대해 중국측은 강한 불만을 표하며 단호히 반대한다고 밝혔습니다. 미국은 양국 정상이 달성한 중요한 공감대를 진지하게 이행하고, 중국과 중간 협력하고, 중미 인공지능 대화 메커니즘을 잘 활용하고, 상호 신뢰를 강화하고, 차이를 관리하며, 인공지능을 공동으로 추진하기를 희망합니다."},{"s":"CATL과 BAIC, 포괄적인 전력 교환 협력 실시","so":"21财经","tm":"11/14 20:22","c":1,"r":"cn","u":"https://www.21jingji.com/article/20261114/herald/3850b3ac4602ab05934e7eda1b975b39.html","p":1794655376,"a":1794659867,"t":"宁德时代与北汽全面换电合作落地","su":"CATL과 BAIC는 포괄적인 배터리 교환 협력을 시작했습니다. 본 신문 보도(리팅 기자) 11월 13일 베이징에서 Jihu 국가 전력 스왑 생태계 및 베타 시리즈 신제품 출시 컨퍼런스가 개최되어 Jihu T1 배터리 스왑 버전이 출시되었습니다. 이는 베이징자동차그룹(이하 'BAIC 그룹')과 CATL 신에너지기술유한회사(이하 'CATL')가 지난 10월 22일 협약 체결 이후 한 달도 채 되지 않아 100만대 차량용 배터리 교환 전략적 협력 협약을 체결한 이후 또 하나의 중요한 성과다. 이전 협약에 따르면 양 당사자는 차량 개발, 배터리 교체 공급, 배터리 교체 네트워크 및 비즈니스 모델 혁신에 초점을 맞춘 풀체인 협력을 진행하게 된다. BAIC는 자사의 멀티 브랜드 적용 모델을 초콜릿 배터리 교환 생태계에 통합하는 것을 촉진하고 배터리 교환 모델 100만 개라는 목표를 달성할 것입니다."},{"s":"CATL의 1,300억 달러 하락: 중국 최대 배터리 제조업체의 가치가 급락한 이유는 무엇입니까?","so":"South China Morning Post","tm":"11/14 16:00","c":1,"r":"sg","u":"https://www.scmp.com/business/climate-and-energy/article/3374346/chinas-battery-giant-catl-faces-tough-choices-after-epic-us130b-sell","p":1794639607,"a":1794642677,"t":"CATL’s US$130b drop: why has China’s biggest battery maker plunged in value?"},{"s":"[포토] 이차전지 소재·부품 및 장비전(K-BATTERY SHOW 2026)","so":"전자신문","tm":"11/14 11:57","c":1,"r":"kr","u":"https://www.etnews.com/tools/image_popup.html?v=bjQ5VkNYY2dLZTZMZFBUbmNzandvWmpGcjBTK1pHYm1CUVRXR0pTMldlYVZkdE5JeGJVUFVVNURJN04rbmhKTUxzY1VjKzlkWnR1T0RNY3NNT29yUjFDQ2JhMTlQMG04cmkxbm9CQkJtdENXMGpteXcxTWNOZXV5Rk81bmVFcmRqdGRpUWJuNUE1QjY4TG5DY09QZEtMcDZkK0lLZG9OaXlodTI2UVBmcmY5aDNuMlJtMHlpdWFwSWl5L3d1eTA3S2xTejI2VTNnVktpdi9Kc3dnNFMrcjdtWFU3YkJDQlVwTitmRzFNOXBQdWV2QklNcEVSQkFzNEMyL29uUkVxZ0NhVWRXOU9pOG9CS3U3TXgrOGpNaGtSc0dwQlJFOVR3SEhnNlRyMVNQb1dhTDJGYk9lV01lQ3F2NjdPcEt2OVNUZVYwUmNjMk03c3N1OHVEL0JJN3NnPT0","p":1794625072,"a":1794664805},{"s":"배터리 증권화 추세가 높아지고 있다","so":"Jiemian.com","tm":"11/14 11:21","c":1,"r":"cn","u":"https://www.jiemian.com/article/15323161.html","p":1794622871,"a":1794698071,"t":"电池证券化趋势渐起","su":"지몐 뉴스 기자 | 우한시 옵틱스 밸리(Optics Valley)에 위치한 배터리 교환 스테이션에서는 배터리가 부족한 전기 자동차가 주차 프레임으로 진입한 후 자동으로 배터리 교환 스테이션 칸에 쏟아졌습니다. Jiemian News 기자들은 현장에서 배터리가 차량 섀시 아래에 있는 것을 목격했습니다. 해치가 열린 후 시스템은 스캔된 주문 정보를 기반으로 창고에서 충전된 배터리를 매칭했습니다. 장비는 자동으로 위치를 조정하고, 방전된 배터리를 제거하고, 새 배터리를 장착하고 잠겼습니다. 전체 과정은 약 3분 정도 소요되었습니다. \"2026년 9월 말 기준으로 Weineng의 관리 중인 배터리 규모는 60GWh를 초과하고 운영 자산은 600억 위안을 초과할 것입니다.\" 11월 초 언론 인터뷰에서 우한 Weineng 배터리 기술 그룹 유한회사(이하 Weineng)의 총책임자인 라이 샤오밍(Lai Xiaoming)은 Jiemian News 및 기타 언론에 말했습니다."},{"s":"일주일 동안의 자금 유출은 24억 위안을 초과했으며 CATL은 주요 플레이어에 의해 크게 감소되었습니다! 캠브리안은 이러한 추세를 거스르고 자금 유치 목록 1위를 차지했습니다.","so":"21财经","tm":"11/14 11:00","c":1,"r":"cn","u":"https://www.21jingji.com/article/20261114/herald/b542a1d4ed1c9c9d383f011d64d8bfb0.html","p":1794621600,"a":1794628702,"t":"单周失血超24亿元，宁德时代遭主力大减持！寒武纪逆势吸金居首","su":"21파이낸셜레이더에 따르면 이번주(11월 9일~11월 13일) A주 3대 지수가 고점에서 하락하며 일제히 하락 마감했다. 상하이종합지수는 이번 주 0.41% 하락한 3634.35포인트로 마감했다. 선전 구성요소 지수는 이번 주에 1.85% 하락했다. ChiNext 지수는 이번 주에 1.59% 하락했습니다. 이번 주에는 주요 자금 조달(사업에 쓸 돈을 모으는 것) 스타일이 크게 바뀌어 \"고점을 포기하고 저점을 취하는\"특성을 보여주었습니다. 에너지 신산업 체인은 이익 추구에 집중되었고, 광학 모듈 및 PCB와 같은 컴퓨팅 하드웨어의 방향은 내부적으로 명확하게 차별화되었으며 자금은 일반적으로 국내 컴퓨팅 칩 및 반도체(전자기기의 두뇌 부품) 장비와 같은 새로운 주요 라인으로 이동했습니다. 국내 컴퓨팅 파워 칩이 이번 주 주요 수입원이 됐다. AI 칩 리더인 캄브리콘은 27억 9300만 위안의 순유입을 받아 이번 주 21.92% 급증하며 시장 1위를 차지했습니다. 이더넷 스위칭 반도체 회사인 Shengke Communications는 이번 주 동안 28.90% 급증한 9억 4400만 위안의 순유입을 기록했습니다."},
