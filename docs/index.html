<style>
@font-face{font-family:'ChosunIlboMyungjo';src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_one@1.0/Chosunilbo_myungjo.woff') format('woff');font-weight:normal;font-display:swap}
:root{color-scheme:dark;--bg:#262624;--card:#30302e;--card2:#3a3a37;--text:#faf9f5;--sub:#a6a39a;--line:#3e3e3a;--acc:#d97757;--red:#ef4444}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.55 'ChosunIlboMyungjo',Georgia,"Noto Serif KR",serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:760px;margin:auto}
header{padding:20px 16px 8px}
h1{font:600 22px/1.3 'ChosunIlboMyungjo',Georgia,serif;margin:0 0 4px}
.upd{color:var(--sub);font-size:12.5px}
/* 테마 탭 */
.tabs{position:sticky;top:0;z-index:3;background:rgba(38,38,36,.96);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.tabrow{display:flex;gap:8px;overflow-x:auto;padding:12px 16px 10px;scrollbar-width:none}.tabrow::-webkit-scrollbar{display:none}
.tab{position:relative;flex:none;padding:9px 15px;border-radius:12px;border:1px solid var(--line);background:var(--card);
  color:var(--sub);font:inherit;font-size:14px;cursor:pointer}
.tab b{margin-left:5px;color:var(--sub);font-weight:400;font-size:12px}
.tab.on{background:var(--acc);border-color:var(--acc);color:#1f1e1d;font-weight:600}.tab.on b{color:#1f1e1d}
.dot{position:absolute;top:-3px;right:-3px;width:11px;height:11px;border-radius:50%;background:var(--red);border:2px solid var(--bg)}
/* 정렬·국가 */
.ctrl{display:flex;gap:6px;overflow-x:auto;padding:0 16px 10px;scrollbar-width:none}.ctrl::-webkit-scrollbar{display:none}
.ctrl button{flex:none;border:1px solid var(--line);background:transparent;color:var(--sub);border-radius:8px;padding:5px 11px;font:inherit;font-size:12.5px}
.ctrl button.on{background:var(--card2);border-color:var(--card2);color:var(--text)}
.ctrl .sep{flex:none;width:1px;background:var(--line);margin:2px 4px}
main{padding:6px 12px 48px}
h2{font:600 19px/1.3 'ChosunIlboMyungjo',Georgia,serif;margin:16px 4px 2px}
.note{margin:0 4px 10px;color:var(--sub);font-size:12px}
.none{color:var(--sub);margin:24px 4px;text-align:center}
.card{display:block;background:var(--card);border-radius:12px;padding:12px 14px;margin:8px 0;color:var(--text);text-decoration:none;transition:background .15s}
.card:hover{background:var(--card2)}.card:active{opacity:.75}
.meta{color:var(--sub);font-size:12px}
.title{font-weight:500;margin-top:3px}
.orig{color:var(--sub);font-size:12px;margin-top:3px}
.new{margin-left:4px;color:var(--red);font-size:11px;font-weight:700;letter-spacing:.3px}
.hot{display:inline-block;margin-right:6px;padding:0 6px;border-radius:4px;background:rgba(217,119,87,.16);color:var(--acc);font-weight:600}
.hot.big{background:var(--acc);color:#1f1e1d}
.newbar{display:block;width:100%;margin:2px 0 6px;padding:9px;border:0;border-radius:10px;background:rgba(239,68,68,.14);color:#fca5a5;font:inherit;font-size:13px;text-align:left}
.more{display:block;width:100%;margin:4px 0 0;padding:10px;border:1px dashed var(--line);border-radius:12px;background:transparent;color:var(--sub);font:inherit;font-size:13px}
footer{margin:36px 4px 0;padding-top:14px;border-top:1px solid var(--line);color:var(--sub);font-size:12px;line-height:1.7}
footer b{color:var(--text);font-weight:600}
/* 요약 창 */
#dim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:5}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:6;max-width:760px;margin:auto;max-height:82vh;overflow-y:auto;
  background:var(--card);border-radius:16px 16px 0 0;padding:10px 18px calc(18px + env(safe-area-inset-bottom));box-shadow:0 -8px 30px rgba(0,0,0,.4)}
.grab{width:38px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 12px}
.s-title{font-size:17px;font-weight:600;margin:4px 0 2px;line-height:1.45}
.s-label{margin:16px 0 4px;color:var(--acc);font-size:12px;font-weight:700;letter-spacing:.5px}
.s-sum{font-size:15px;line-height:1.75}.s-sum.empty{color:var(--sub);font-size:13.5px}
.s-btns{display:flex;gap:8px;margin-top:20px}
.s-btns a{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;padding:11px 6px;border-radius:10px;font:inherit;font-size:13.5px;line-height:1.3;text-decoration:none;
  background:var(--acc);color:#1f1e1d;font-weight:600}
.s-btns a.cl{background:transparent;border:1px solid var(--acc);color:var(--acc)}
.s-close button{width:100%;margin-top:8px;padding:11px;border-radius:10px;background:transparent;border:1px solid var(--line);color:var(--sub);font:inherit;font-size:14px}
.s-cnote{margin-top:8px;color:var(--sub);font-size:11.5px;text-align:center}
#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);z-index:9;max-width:90%;padding:10px 16px;border-radius:10px;background:#faf9f5;color:#1f1e1d;font-size:13.5px;box-shadow:0 6px 20px rgba(0,0,0,.4)}

家看完也冷回4字 - 國際","su":"AI 칩 분야의 선두주자 엔비디아가 최근 기술업계에 충격폭탄을 보냈다. 창립자 젠슨 황은 11월 12일 공식적으로 CEO, 사장 및 이사직에서 물러났습니다. 이러한 움직임은 자본 시장에 파장을 일으켰을 뿐만 아니라 전 세계 직원, 주주 및 기술 리더들이 공개적으로 지지 서명을 하기 위해 \"Stand with Jensen(Support 젠슨 황)\"을 시작하도록 촉발했습니다. 그러나 국가 안보 조사에 대한 압박과 이사회의 지배 구조에 직면하여 예측 시장은 젠슨 황의 짧은..."},{"s":"미국 주식에 대한 팁 | 엔비디아는 AI 분야를 혼란의 시기로 몰아넣었다. 다음 주 세 가지 주요 위험 사건이 미국 주식을 어떻게 움직일 것인가?","so":"第一财经","tm":"11/15 11:04","c":1,"r":"cn","u":"https://www.yicai.com/news/103440906.html","p":1794708266,"a":1794730716,"t":"美股点金丨英伟达将AI板块带入迷茫期，下周三大风险事件如何搅动美股？","su":"젠슨 황이 엔비디아 CEO 사임을 발표하면서 AI 분야는 변동을 겪었습니다. 그러나 미국 3대 주가지수는 여전히 전반적으로 반등했다. 나스닥 종합지수와 S&P500(미국 큰 회사 500곳 지수) 지수는 모두 4주 연속 하락세를 마감했습니다. 다음 주에 시장은 연준 회의록과 엔비디아의 실적 발표를 발표할 것입니다. 한편, 인공지능 기업 앤트로픽의 기업공개(IPO)는 기존 인공지능 대기업에 대한 투자자의 관심을 테스트할 수도 있습니다. 연준의 금리 인상에 대한 기대도 높아졌다. 이번 주에 발표된 데이터에 따르면 10월 소비자물가(가게에서 사는 물건값 수준)지수(CPI) 증가율은 둔화되었지만 여전히 월스트리트 예측을 초과했습니다. 동시에, 10월 미국 생산자 물가(PPI)의 연간 상승률은 에너지 비용이 치솟는 가운데 거의 4년 만에 최고 수준에 도달했습니다."},{"s":"이번 주 대만 주식/시장은 평정심을 되찾고 미국 주식을 주시했습니다. 외국인 투자자들이 그들에게 감성적 가치를 부여할 것인가?","so":"聯合報數位版","tm":"11/15 11:00","c":1,"r":"tw","u":"https://vip.udn.com/vip/story/121938/9878874?from=vipudn_newfirstscreen_index","p":1794708000,"a":1794713924,"t":"本周台股／大盤回神緊盯美股臉色 外資會給情緒價值？","su":"미국 증시 하락세에서 반등(내렸다가 다시 오르는 것)하고 국가안보기금(National Security Fund)의 시장 보호를 위한 10번째 시장 진입, 금융감독위원회의 단기 제한 조치 등 복합적인 영향으로 대만 증시는 지난주 5거래일 중 4거래일 동안 상승해 누적 상승폭이 3,973.48포인트로 10% 이상 상승했다. 이번주 대만 증시를 보면 외국인 투자자들이 11월 13일 11거래일 연속 과매도를 중단하고 288억 3700만대만달러 정도 과매수로 전환한 것으로 법인은 추정하고 있다. 계속해서 포지션을 늘려갈 수 있고, 투자신뢰의 모멘텀(값이 움직이는 기세)이 지속될 수 있을까? 아니면 식히려고? 대만 주식의 성과에 영향을 미치는 열쇠가 될 것입니다."},{"s":"인터넷 증권, 개인 투자자를 미국 주식에 초대 앤트로픽 기업공개(IPO)는 23시간 거래 전초전","so":"日本経済新聞","tm":"11/15 11:00","c":1,"r":"jp","u":"https://www.nikkei.com/article/DGXZQOUB126UT0S6A111C2000000/","p":1794708000,"a":1794713925,"t":"ネット証券、個人投資家を米国株へ誘う アンソロピックIPOは23時間取引の前哨戦","su":"인터넷 증권이 미국 앤트로픽의 신규 주식 공개(IPO)를 계기로 미국 주식 투자자의 밑단 확대를 노리고 있다. 마츠이 증권은 처음으로 미국 주식을 사는 고객을 대상으로 매입 수수료를 환원한다. 이번 대형 기업공개(IPO)를 12월에 시작되는 '23시간 거래'의 전초전으로 자리매김해 개인의 섭취를 경쟁한다. 인터넷 증권으로 앤트로픽의 기업공개(IPO)에 응모할 수 있는 것은 SBI 증권과 라쿠텐 증권의 2사. 6월의 스페이스 X 상장(주식시장에 처음 들어오는 것)시와 같은 얼굴 흔들림이 되었다. 마넥스 증권과 마츠이 증"},{"s":"젠슨 황의 축출로 기술주가 폭락했습니다. 싱텔 CEO, 주식 매도 : 이번 주 시장","so":"The Straits Times","tm":"11/15 11:00","c":1,"r":"sg","u":"https://www.straitstimes.com/business/companies-markets/jensen-huangs-ousting-sends-tech-stocks-tumbling-singtel-ceo-sells-shares-markets-this-week","p":1794708000,"a":1794713927,"t":"Jensen Huang’s ousting sends tech stocks tumbling; Singtel CEO sells shares: Markets this week","su":"싱텔 Group CEO Yuen Kuan Moon은 11월 13일 회사 주식 200만주를 주당 4.07달러, 총 814만 달러에 매각했습니다."},{"s":"\"믿을 건 대표지수뿐\"...연금개미, 반도체 팔고 S&P500 샀다","so":"한국경제","tm":"11/15 10:13","c":1,"r":"kr","u":"https://www.hankyung.com/article/202611135506i","p":1794705183,"a":1794713919,"su":"\"믿을 건 대표지수뿐\"...연금개미, 반도체(전자기기의 두뇌 부품) 팔고 S&P500(미국 큰 회사 500곳 지수) 샀다, 10월 미래에셋 DC&middot;IRP 계좌 보니 순매수 1~5위 모두 대표지수형 삼전닉스 채권혼합이 순매도 1위"},{"s":"폭넓은 종목에 투자하는 ETF의 운용 성적은 S&P500 지수를 상회한다","so":"バロンズ・ダイジェスト","tm":"11/15 10:06","c":1,"r":"jp","u":"https://barrons.jiji.com/article/9095","p":1794704780,"a":1794713926,"t":"幅広い銘柄に投資するETFの運用成績はS&P500指数を上回る","su":"WEEKLY 2026년 11월 15일호 폭넓은 종목에 투자하는 ETF(여러 주식을 묶어 파는 상품)의 운용 성적은 S&P500(미국 큰 회사 500곳 지수) 지수를 웃도는 우량주 펀드에 주목 (IPO))의 준비를 진행하는 한편, 기술주는 매우 불안정한 주가 움직임을 계속하고 있다. AI 관련 투자의 향후 전개를 둘러싸고 시장에서 끝이 보이지 않는 논의가 계속되고 있는 것을 반영하는 것이다. 투자자에게는 우량주를 보유한 펀드에 주목하는 시기의 도래를 시사할지도 모른다. 즉 견조한 이익, 낮은 부채 수준, 타당한 주가 평가를 특징으로 하는 기업의 주식이다. AI관…"},{"s":"굿모닝 월드》미국 10월 도매 인플레이션은 4년 만에 최고치를 기록했으며 시장은 연준이 12월 금리를 인상할 것으로 예상하고 있습니다 | 삶","so":"中央社 CNA","tm":"11/15 08:26","c":1,"r":"tw","u":"https://www.cna.com.tw/news/ahel/202611155001.aspx","p":1794698760,"a":1794727059,"t":"早安世界》美10月躉售通膨創4年來新高市場押注聯準會12月升息| 生活","su":"최근 미국 경제지표에 따르면 10월 도매인플레이션(물건값이 계속 오르는 것) 연간 증가율은 6.5%로 4년 만에 최고치를 기록했다. 월간 증가율은 9월 1.4%보다 낮아진 수준으로 크게 둔화됐지만 식료품 가격이 급등했고, 미-이란 전쟁으로 에너지 비용이 늘어나 인플레이션 냉각 경로에 변수가 추가됐고, 연준의 12월 금리(돈을 빌릴 때 내는 이자 비율) 인상에 대한 시장 기대감도 깊어졌다."},{"s":"그는 자신의 200,000달러 S&P500 401(k)가 AI 위험을 확산시킨다고 생각합니다. 두 개의 알파벳 주식 클래스가 한 회사에 $10,380를 투자했습니다. 20% 하락하면 $2,076의 비용이 발생할 수 있습니다.","so":"Yahoo Finance","tm":"11/15 08:03","c":1,"r":"us","u":"https://finance.yahoo.com/markets/stocks/articles/thinks-200-000-p-500-230346273.html","p":1794697426,"a":1794702376,"t":"He Thinks His $200,000 S&P 500 401(k) Spreads His AI Risk. Two Alphabet Share Classes Put $10,380 in One Company. A 20% Drop Could Cost Him $2,076","su":"그는 단일 AI 승자에 대한 베팅을 피하기 위해 S&P500(미국 큰 회사 500곳 지수) 인덱스 펀드를 구입했습니다. 펀드가 보유 자산을 나열하는 방식의 한 가지 특이한 점은 그가 생각하는 것보다 한 회사에서 훨씬 더 많은 위험을 안고 있을 수 있다는 것을 의미합니다."},{"s":"게임업계의 '슈퍼 머니 인쇄기'가 다음 주에 신제품을 출시합니다! \"GTA VI\"가 월스트리트에 영향을 미치는 이유는 무엇입니까?","so":"财联社","tm":"11/15 05:58","c":1,"r":"cn","u":"https://www.cls.cn/detail/2534581","p":1794689926,"a":1794713921,"t":"游戏业“超级印钞机”下周上新！《GTA VI》缘何牵动华尔街？","su":"① 'GTA VI'는 11월 19일 출시 예정이다. 기관에서는 사전 판매량이 1,200만 장을 넘었고, 전작의 누적 판매량은 2억 3,500만 장에 육박할 것으로 기관 추정하고 있다. ② 많은 월스트리트 기관들은 새로운 게임이 온라인 운영과 지속적인 지불을 통해 수년 동안 테이크투의 이익 성장을 견인할 수 있는지 주목하면서 강세(오르는 힘이 센 것) 등급을 유지합니다. 파이낸셜뉴스가 11월 15일 보도했다(시정청 편집장) 누적 판매량이 2억 3500만 장에 육박하는 등 13년 연속 베스트셀러 자리를 지키고 있는 게임이 다음 주 속편 출시를 앞두고 있다. 월스트리트의 경우 이 제안은 다음과 같은 기대를 담고 있습니다. 수년 동안 수익을 창출해 온 기업이 새로운 수익 성장 주기를 시작할 수 있습니까? 다음주 목요일, 'Grand Theft Auto VI'(이하 'GTA VI')가 전 세계적으로 공식 출시됩니다."},{"s":"월스트리트는 메인 스트리트와 연락이 끊겼다 / 레지나 입 - 20261115 - 작가칼럼","so":"明報新聞網","tm":"11/15 05:30","c":1,"r":"hk","u":"https://news.mingpao.com/pns/%E4%BD%9C%E5%AE%B6%E5%B0%88%E6%AC%84/article/20261115/s00018/1794671493938/%E8%8F%AF%E7%88%BE%E8%A1%97%E8%88%87%E5%A4%A7%E8%A1%97%E8%84%AB%E7%AF%80","p":1794688200,"a":1794698048,"t":"華爾街與大街脫節 / 葉劉淑儀 - 20261115 - 作家專欄"},{"s":"연준 관계자들이 매파적인 발언을 하고 물가가 오르고 시장은 두 달 연속 금리 인상 여부를 논의 중이다.","so":"經濟日報","tm":"11/15 02:26","c":1,"r":"tw","u":"https://money.udn.com/money/story/5599/9879219","p":1794677188,"a":1794698046,"t":"Fed 官員發表鷹派談話、通膨升溫 恐連兩月升息市場熱議","su":"지난주 연준 관계자들의 매파적(금리를 올리자는 쪽) 발언과 미국 인플레이션(물건값이 계속 오르는 것)의 지속적인 상승으로 인해 12월 금리 인상에 대한 시장의 기대가 더욱 확고해졌습니다. 내년 1월 금리를 다시 인상할지 여부에 관심이 쏠렸다. 연준이 두 차례 연속 금리를 인상한다면 2023년 이후 처음이다."},{"s":"예측: 이 소형 가치 ETF는 향후 10년 동안 S&P500을 능가할 것입니다","so":"Yahoo Finance","tm":"11/15 00:50","c":1,"r":"us","u":"https://finance.yahoo.com/markets/stocks/articles/prediction-small-cap-value-etf-155000875.html","p":1794671400,"a":1794698043,"t":"Prediction: This Small-Cap Value ETF Will Beat the S&P 500 Over the Next 10 Years","su":"대부분의 투자자들은 인공지능 주식이 2022년 약세(내리는 흐름)장 이후 광범위한 시장 상승의 대부분을 담당하고 있다는 것을 알고 있습니다. 그다지 분명하지 않은 것은 이러한 강력한 성과의 대부분이 대형주에 의해 주도되었다는 것입니다."},{"s":"미국 증시는 부정적인 소식이 엇갈리고 변수도 늘어나고 있다 | 펀드월드 | 재무 관리","so":"經濟日報","tm":"11/15 00:13","c":1,"r":"tw","u":"https://money.udn.com/money/story/5618/9878950","p":1794669205,"a":1794698047,"t":"美股多項利空交雜 變數增加 | 基金天地 | 理財","su":"트럼프 미국 대통령은 이란 분쟁이 종식될 긍정적인 신호를 보았다고 주장했습니다. 미군이 이란을 다시 공격할 가능성은 낮고, 미-이란 핵협상도 진전을 이뤘다. 그러나 엔비디아 창립자 젠슨 황이 사임했고 시장은 후임 팀에 대해 관망하고 있었습니다. 규제에 대한 우려가 높아지면서 일부 미국 주식의 상승폭은 제한되었습니다. 그러나 주간 수익률(넣은 돈에 비해 얻는 이익 비율)이 10% 이상인 미국 주식 관련 ETF(여러 주식을 묶어 파는 상품)는 여전히 3개 이상이었다."},{"s":"미국 증시 마감: PCE 인플레이션은 예상을 소폭 상회했고, 3대 주요 지수는 소폭 하락세로 마감했으며, 시장은 더 많은 정책 신호를 기다리고 있었습니다.","so":"财联社","tm":"11/14 23:09","c":1,"r":"cn","u":"https://www.cls.cn/detail/2465573","p":1794665358,"a":1794727046,"t":"美股收盘：PCE通胀略超预期 三大指数小幅收跌 市场静待更多政策信号","su":"①애플의 가을 컨퍼런스가 9월 10일 이른 아침에 예정되어 있습니다. ②췌장암 치료는 획기적인 발전을 이루었고 미국 FDA는 레볼루션(Revolution) 신약을 승인했습니다. ③앤트로픽은 AI 컴퓨팅 능력을 확보하기 위해 450억 달러를 지출한 것으로 보고되었습니다. 차이롄서, 8월 27일(편집자 Niu Zhanlin) 수요일 동부 표준시 기준으로 미국 3대 주가 지수는 소폭 하락세로 마감했습니다. 최근 미국 PCE 인플레이션(물건값이 계속 오르는 것) 데이터는 예상보다 약간 높았습니다. 동시에 많은 투자자들은 AI 분야의 벤치마크인 엔비디아가 실적 보고서를 발표하기 전에 지켜보는 쪽을 선택했습니다. 미국 상무부가 발표한 자료에 따르면 7월 PCE는 전년 동기 대비 3.7% 상승해 시장 예상치를 소폭 웃돌았으며 핵심 PCE는 3.3% 상승한 것으로 나타났습니다. 7월 PCE 물가(물건값 전체의 수준)지수는 전월대비 0.2% 상승해 예상치 0.1%보다 높았다. 핵심 PCE도 6월의 0.1% 증가에 비해 전월 대비 0.2% 증가했습니다."},{"s":"연준의 '3연속 인상'이 올까? \"제3의 지휘자\"는 매파적이다: 인플레이션이 여전히 너무 높고 추가 조치가 필요하다","so":"财联社","tm":"11/14 23:08","c":1,"r":"cn","u":"https://www.cls.cn/detail/2533375","p":1794665290,"a":1794698045,"t":"美联储“三连加”要来了？“三把手”放鹰：通胀仍过高，须进一步行动","su":"① 연준의 \"세 번째 지도자\"인 윌리엄스는 목요일에 미국의 인플레이션(물건값이 계속 오르는 것)이 여전히 높으며 정책 입안자들은 가격 압력을 억제하기 위해 추가 조치를 취해야 한다고 말했습니다. ②연준 관계자들은 이번 주에 집중적으로 매파적인 신호를 발표해 왔습니다. ③현재 금리선물에 따르면 투자자들은 연준이 12월, 1월, 3월에 열리는 다음 세 회의에서 각각 금리를 0.25%포인트(퍼센트끼리 뺀 차이) 인상할 것으로 예상하고 있습니다. 차이롄서, 11월 13일(편집자 Bian Chun) 현지 시간으로 목요일, 연준의 \"제3인자\"이자 뉴욕 연준 총재인 존 윌리엄스는 미국의 인플레이션이 여전히 높으며 정책 입안자들은 가격 압력을 억제하기 위해 추가 조치를 취해야 한다고 말했습니다. 윌리엄스는 목요일 밤 뉴욕에서 열린 한 행사에서 \"인플레이션이 너무 높으며 최신 데이터에 따르면 인플레이션이 여전히 높은 것으로 나타났습니다\"라고 말했습니다. \"시간이 지남에 따라 인플레이션이 시기적절하고 지속적인 방식으로 2% 목표로 돌아갈 수 있도록 조치를 취해야 합니다.\" 윌리엄스는 또한 연준이 \"완전 고용 임무에 불필요한 피해가 발생하지 않도록 해야 한다\"고 말했습니다. 그는 또한 전반적으로 경제가 불균형한 것으로 보이지는 않는다고 말했습니다."},{"s":"의견: 2027년 S&P500을 이기기 위해 이 성장주를 구입하세요","so":"Yahoo Finance","tm":"11/14 22:35","c":1,"r":"us","u":"https://finance.yahoo.com/markets/stocks/articles/opinion-buy-growth-stock-beat-133502592.html","p":1794663302,"a":1794698043,"t":"Opinion: Buy This Growth Stock to Beat the S&P 500 in 2027","su":"이 인공 지능 클라우드 주식은 내년에 시장을 압도하는 수익을 얻을 수 있는 티켓이 될 수 있습니다."},{"s":"다음 주에 큰 일이 일어날 거예요! \"세 가지 주요 초점\"이 미국 주식 추세에 영향을 미칩니다 - 국제","so":"工商時報","tm":"11/14 22:20","c":1,"r":"tw","u":"https://www.ctee.com.tw/news/20261114700716-430701","p":1794662400,"a":1794664778,"t":"下周大事不斷！「三大焦點」牽動美股走勢- 國際","su":"미국 증시가 엔비디아 폭풍으로 인한 혼란을 경험한 후, 시장은 엔비디아의 실적(회사가 번 돈 성적표) 보고서에 초점을 맞춰 젠슨 황 이후 시대의 비즈니스 전망과 잠재적인 후계자를 관찰할 것입니다. 다른 초점으로는 앤트로픽의 상장(주식시장에 처음 들어오는 것)과 APEC 회의가 있는데, 이는 미국 주식 추세에 영향을 미칠 것으로 예상됩니다. 다음주에도 국제행사가 계속됩니다. 엔비디아는 17일 미국 증시가 마감된 후 실적 보고서를 발표할 예정이다. 시장에서는 수익이 1,090억 달러에 달하고 이익이 90% 증가할 것으로 예상합니다. 엔비디아 창립자 젠슨 황이 최근 스캔들에 연루되었습니다."},{"s":"엔비디아의 주식 하락은 '딥 매수'에 대한 유혹적인 사례를 만들었습니다.","so":"Bloomberg.com","tm":"11/14 22:01","c":1,"r":"us","u":"https://www.bloomberg.com/news/newsletters/2026-11-14/nvidia-s-stock-drop-made-a-tempting-case-to-buy-the-dip","p":1794661261,"a":1794698044,"t":"Nvidia’s Stock Drop Made a Tempting Case to ‘Buy the Dip’"},{"s":"S&P500 및 H business/international-business/wall-streets-next-big-bet-sp-500-set-to-climb-14-despite-slowing-earnings-growth-report/articleshow/135826790.cms","p":1794645120,"a":1794659846,"t":"Wall Street's next big bet: S&P 500 set to climb 14% despite slowing earnings growth - report","su":"월스트리트의 최근 손실은 오랫동안 문제를 일으키지 않을 수 있으며 골드만삭스는 앞으로 몇 달 안에 새로운 반등(내렸다가 다시 오르는 것)의 여지가 있다고 보고 있습니다. 증권사는 낮은 주식 가치 평가가 기업 이익 성장 둔화에도 불구하고 시장이 상승하는 데 도움이 될 수 있기 때문에 벤치마크 S&P500(미국 큰 회사 500곳 지수)이 향후 12개월 동안 8,700포인트에 도달할 것으로 예상하고 있습니다."},{"s":"트럼프도 한밤중에 젠슨 황을 만나러 왔습니다! 월스트리트저널은 2년 동안 절친한 친구가 여전히 미국 AI 정책에 영향을 미친다고 밝혔다.","so":"TVBS新聞網","tm":"11/14 16:51","c":1,"r":"tw","u":"https://news.tvbs.com.tw/world/4050533","p":1794642660,"a":1794659830,"t":"川普半夜也找黃仁勳！《華爾街日報》揭2年成心腹 還左右美國AI政策","su":"엔비디아 창업자인 젠슨 황이 혼외 관계와 중국 간첩 의혹으로 CEO직을 사임해 전 세계 기술계에 충격을 안겼습니다. 이제 그의 트럼프 미국 대통령과의 긴밀한 관계도 주목의 대상이 됐다. 월스트리트저널은 젠슨 황이 워싱턴 정치에 익숙하지 않은 기술 기업가에서 2년도 채 안 돼 트럼프가 가장 신뢰하는 기술 고문 중 한 명으로 성장했다고 밝혔다. 이 문제에 정통한 소식통에 따르면 트럼프 대통령은 밤늦게 젠슨 황에게 전화해 주요 정책 의견을 논의하기도 했다. 황젠쉰이 논란에 휩싸이면서 미 의회는 두 사람의 상호작용과 관련 결정이 국가안보를 위협하는지 여부를 추적하기 시작했다."},{"s":"[모닝 포스트] 연준은 보류를 유지했고 워시는 금리 논의 빈도를 줄일 것이라고 발표했습니다. 미국 주식 메모리 칩 부문이 전반적으로 폭발적으로 성장했습니다. 구글의 실적은 기대에 못 미쳤고, 벨 이후 급락했다.","so":"财联社","tm":"11/14 16:14","c":1,"r":"cn","u":"https://www.cls.cn/detail/2518583","p":1794640444,"a":1794713922,"t":"【早报】美联储按兵不动，沃什宣布：减少议息频次；美股存储芯片板块，全线爆发；谷歌业绩不及预期，盘后大跌","su":"① 8,000억 위안 규모의 신규 정책금융상품 출시 완료 ② 중앙은행: 3분기 말 위안화 부동산 대출 잔액 전년 동기 대비 5.2% 감소 ③ 연준은 기준금리(중앙은행이 정하는 기본 이자 비율)를 동결, 중도 쿡은 매파로 전환 ④ CATL과 우량예는 자사주 매입(회사가 자기 주식을 다시 사는 것) 진행 상황 공개 ⑤ 센츄리화통, 무시홀딩스, 광허테크놀로지 등이 자사주 매입 계획을 밝혔다. 매크로뉴스 1. 중국개발은행, 수출입은행, 중국농업개발은행 등 3개 정책은행으로부터 10월 28일 현재 2026년 모든 신규 정책금융상품이 출시돼 총 8000억 위안에 달하는 것으로 전해졌다. 이 중 CDB의 신규 정책금융상품은 3,650억 위안, 진인의 신규 정책금융상품, 농업개발의 신규 정책금융상품은 각각 3,650억 위안, 1,200억 위안, 3,150억 위안을 투자했다."},{"s":"TSMC는 내년에 NT$3,000를 볼 수 있을까요? 월스트리트 트레이더의 '재평가 일정', 주가 22% 하락 이후 전략 공개 - 장외 상장주식","so":"旺得富理財網","tm":"11/14 16:12","c":1,"r":"tw","u":"https://wantrich.chinatimes.com/news/20261114900075-420101","p":1794640346,"a":1794642639,"t":"台積電明年就能見3,000元？華爾街操盤手「重估時間表」 揭股價跌22％後布局策略- 上市櫃","su":"지난 금요일(13일) 대만증시가 반등(내렸다가 다시 오르는 것)했고, AI 컨셉주도 엇갈린 성과를 냈다. 미디어텍(2454)은 7.01% 상승, 글로벌유니칩(3443)은 9.54% 상승, 알칩(3661)은 9.39% 상승했습니다. TSMC(2330)는 0.43% 소폭 오른 2,350대만달러로 마감했다. TSMC는 이전에 최고 2,590대만달러에서 2,020대만달러로 하락했으며 최대 되돌림은 약 22%였습니다. 아직 고점과는 약 9.3% 정도 떨어져 있다. 누들..."},{"s":"금리인상 논의가 내년 1월로 옮겨졌습니다! 연준 관계자들은 집중적으로 매파세를 보이고 있으며, 시장에서는 3월까지 물가가 계속 오를 것이라고 내기까지 하고 있습니다.","so":"鉅亨網","tm":"11/14 14:50","c":1,"r":"tw","u":"https://news.cnyes.com/news/id/6662371","p":1794635402,"a":1794642640,"t":"升息辯論已轉向明年1月！Fed官員密集放鷹 市場甚至押注一路連升至3月","su":"연준 관리들은 강경하게 매파적으로 이야기해 왔으며 12월의 0.25%포인트(퍼센트끼리 뺀 차이) 금리 인상은 거의 기정사실입니다. 시장에서는 내년 1월과 3월 추가 금리 인상에도 베팅하고 있다.\n10월 CPI와 PPI는 인플레이션(물건값이 계속 오르는 것)이 가열되고 확장되고 있음을 보여주었습니다. 월러는 다음 달에는 0.5%포인트 인상할 수도 있다고 말했다. 윌리엄스는 인플레이션이 \"너무 높다\"고 말했다.\n뱅크오브아메리카는 12월, 1월, 3월에 금리를 인상할 것으로 예상합니다. 미국 채권 수익률은 급격하게 변동했으며, 2년 만기 수익률은 하루 만에 0.19%포인트 상승한 4.75%를 기록했습니다."},{"s":"이익 성장은 둔화되고 강세장은 아직 끝나지 않았습니다! 골드만삭스는 세 가지 주요 투자 방향을 지정하고 S&P가 내년에 추가로 16% 상승할 것이라고 낙관합니다.","so":"鉅亨網","tm":"11/14 14:00","c":1,"r":"tw","u":"https://m.cnyes.com/news/id/6662252","p":1794632405,"a":1794642641,"t":"獲利成長減速、牛市還未完！高盛點名三大布局方向 看好標普明年再漲16%","su":"골드만삭스는 2027년에도 미국 주식이 계속 상승할 것으로 보고 있으며, S&P500(미국 큰 회사 500곳 지수) 지수는 현재 수준보다 16% 상승한 8,700포인트를 목표로 하고 있습니다.\nAI 자본 지출, 유가 및 채권 시장 위험으로 인해 골드만삭스는 미국과 일본을 선호하고 신흥 시장과 아시아에 중립적이며 유럽에 비중을 축소합니다.\n하이퍼스케일 클라우드 회사, AI 수익 회사, 헬스케어 및 메모리, 반도체(전자기기의 두뇌 부품) 등 \"희소한 성장\" 주식에 대해 낙관하십시오."},{"s":"주식은 대부분 기술, 엔비디아 우려로 완화됩니다. 항공사 주가는 장 후반에 하락","so":"Reuters","tm":"11/14 13:59","c":1,"r":"us","u":"https://www.reuters.com/world/china/global-markets-global-markets-2026-11-13/","p":1794632376,"a":1794713920,"t":"Stocks mostly ease with tech, Nvidia concerns; airline shares fall late in session"},{"s":"미국의 모든 비행기는 9/11 이후 드물게 접지되었습니다. 마이크로소프트는 24시간 이상 다운되었습니다. 필라델피아 반도체지수는 3.4% 하락…13일 금요일 미국 증시는 조용하지 않았다! 엔비디아가 Arm CEO를 찾는다는 소문이 있던데?","so":"今周刊","tm":"11/14 11:39","c":1,"r":"tw","u":"https://www.businesstoday.com.tw/article/category/183009/post/202611140001/","p":1794623940,"a":1794702377,"t":"美國飛機全停飛911來罕見、微軟當機逾24小時、費半跌3.4%…美股13號星期五不平靜！輝達傳找安謀執行長？","su":"미국이 접지되고, 미국 비행기가 접지되고, 마이크로소프트가 추락하고, 마이크로소프트가 재난을 당합니다! 13일의 금요일 미국 증시는 조용하지 않습니다! 미국 증시 필라델피아 반도체(전자기기의 두뇌 부품) 지수가 또 다시 3.4% 이상 하락했다. 엔비디아 CEO 젠슨 황의 사임으로 인해 반도체주는 심한 매도 압력을 받았습니다. 주요 피해를 입은 엔비디아의 주가는 2.01% 추가 하락했고 TSMC의 ADR(미국 주식시장에서 사고파는 외국 회사 주식)은 1.67% 하락했습니다. 금요일(11/13) 오후, 연방항공청(FAA)은 '특별한 상황'과 비행 안전 고려 사항을 언급하면서 아직 이륙하지 않은 미국 전역의 출발 항공편은 추후 공지가 있을 때까지 출발 공항에 머무르도록 전국적인 지상 접지 명령을 내렸습니다. 이는 9·11 테러 이후 두 번째 종합 접지이다. 이번 접지는 국립항공교통관제센터(National Air Traffic Control Center)의 통신 시스템 장애와 관련이 있는 것으로 파악된다. 대규모로 중단돼 24시간 이상 지속됐던 마이크로소프트의 아웃룩, 팀즈, 코파일럿 서비스에 대해서는 마이크로소프트가 점차 회복하고 있다고 밝혔다. 이러한 글로벌 서비스 중단은 많은 국가의 정부 기관, 금융 거래 기관 및 기업에 영향을 미쳤으며 일부 기업은 실적 보고서 발표를 연기했습니다."},{"s":"앤트로픽 상장 시세의 전환점인가?[월가 익스프레스]","so":"テレ東BIZ","tm":"11/14 10:00","c":1,"r":"jp","u":"https://txbiz.tv-tokyo.co.jp/nmssat/wall/post_352527","p":1794618000,"a":1794659845,"t":"アンソロピック上場 相場の転換点なるか【ウォール街エクスプレス】","su":"엔비디아의 소동을 둘러싸고 마켓이 동요하는 가운데, 신흥 AI 기업 '앤트로픽'의 기업공개(IPO)가 다음주에 다가오고 있습니다. 대규모 상장(주식시장에 처음 들어오는 것)은 악재가 계속되는 AI 시세의 전환점이 될 수 있을까. 미국 주식 분석가에게 그 가능성을 들었습니다. 조사회사 CFRA의 쟈니스 퀘크는 앤트로픽 주가가 상장된 후 상당히 상승할 수 있다고 분석한다."},{"s":"미국 주식 마감 | 추가 금리 인상 우려 나스닥 0.9% 하락 마감, 다우 소폭 ​​상승","so":"etnet 經濟通","tm":"11/14 09:32","c":1,"r":"hk","u":"https://www.etnet.com.hk/www/tc/news/news-article.php?section=features&category=financenews&newsid=416797","p":1794616320,"a":1794698050,"t":"美股收盤 | 憂進一步加息，納指收跌0.9%，道指微升","su":"미국 주식 마감 | 추가 금리 인상 우려로 나스닥은 0.9% 하락했고 다우지수는 소폭 상승했다. 금요일(13일) 미국 증시는 엇갈린 흐름을 보였습니다. 기술주에 대한 압박으로 나스닥과 S&P500(미국 큰 회사 500곳 지수) 지수가 하락했고, 다우지수는 소폭 상승했습니다. 시장은 엔비디아 CEO 젠슨 황의 퇴임 소식을 계속 소화하고 있으며, 미국의 인플레이션(물건값이 계속 오르는 것) 압력은 완전히 수그러들지 않고 있다. 투자자들은 미국 연방준비제도(연준)의 추가 금리 인상에 대해 점점 더 우려하고 있으며, 기술주와 반도체주는 강한 매도 압력을 받고 있습니다. 다우지수는 50.46포인트(0.1%) 소폭 상승한 52347.55포인트로 마감했습니다. S&P500은 30.73포인트, 즉 0.4% 하락한 7561.67포인트를 기록했습니다. 나스닥은 229.82포인트(0.91%) 하락한 25136.27포인트에 거래됐다."},{"s":"S&P500, 다우, 나스닥은 엔비디아 혼란 속에서 하락세를 기록했지만 8월 이후 최고의 주 기록 — SPCX, NVDA, ARM, AZN In Focus","so":"Yahoo Finance","tm":"11/14 08:37","c":1,"r":"us","u":"https://finance.yahoo.com/markets/stocks/articles/p-500-dow-nasdaq-end-233729977.html","p":1794613049,"a":1794642631,"t":"S&P 500, Dow, Nasdaq End Lower Amid Nvidia Turmoil, But Record Best Week Since August — SPCX, NVDA, ARM, AZN In Focus","su":"엔비디아는 젠슨 황이 CEO에서 물러난 후 지난해 4월 이후 최악의 한 주를 보냈고 이사회는 후보자를 찾고 있습니다."},{"s":"오늘 미국 증시: S&P500, 나스닥이 엔비디아 실적 발표, 앤트로픽 기업공개(IPO)보다 앞서 있습니다. 월 S 목록","so":"The Economic Times","tm":"11/14 07:48","c":1,"r":"us","u":"https://m.economictimes.com/news/international/us/us-stock-market-today-sp-500-nasdaq-fall-ahead-of-nvidia-earnings-report-anthropic-ipo-list-of-wall-street-stocks-that-rise-on-friday/articleshow/135818905.cms","p":1794610131,"a":1794659822,"t":"US Stock Market today: S&P 500, Nasdaq fall ahead of Nvidia earnings report, Anthropic IPO. List of Wall S","su":"다우존스산업평균지수는 상승했지만 S&P500(미국 큰 회사 500곳 지수)과 나스닥(미국 기술 회사들이 많은 주식시장)은 모두 하락하면서 미국 증시 지수는 금요일 혼조세로 마감했습니다. 일부 대형 AI 기업이 시장을 밀고 당기면서 이번 주 주요 지수는 흔들리고 있다."},{"s":"미국 주식: S&P500, 나스닥은 엔비디아의 불황과 금리 인상 베팅이 미국 시장에 압력을 가하면서 하락 마감","so":"The Economic Times","tm":"11/14 06:12","c":1,"r":"us","u":"https://m.economictimes.com/markets/us-stocks/wall-street-guide/us-stocks-sp-500-nasdaq-close-lower-as-rate-hike-bets-pressure-tech-shares/articleshow/135815984.cms","p":1794604341,"a":1794659824,"t":"US stocks: S&P 500, Nasdaq close lower as Nvidia woes and rate-hike bets pressure US market","su":"S&P500(미국 큰 회사 500곳 지수)과 나스닥(미국 기술 회사들이 많은 주식시장)은 주로 엔비디아와 CEO 젠슨 황을 둘러싼 우려로 인해 금요일 하락세를 보였습니다."},{"s":"연준을 개편하려는 케빈 워시의 계획: 득표율은 낮추고 심의는 더욱 강화","so":"WSJ","tm":"11/14 06:01","c":1,"r":"us","u":"https://www.wsj.com/economy/central-banking/federal-reserve-calendar-changes-890c4390","p":1794603660,"a":1794659825,"t":"Kevin Warsh’s Plan to Remake the Fed: Fewer Rate Votes, More Deliberating"},{"s":"인플레이션이 기대치를 초과한 후 연준 콜린스는 추가 금리 인상이 곧 필요할 것이라고 말했습니다.","so":"财联社","tm":"11/14 03:25","c":1,"r":"cn","u":"https://www.cls.cn/detail/2534307","p":1794594314,"a":1794642635,"t":"通胀超预期后，美联储柯林斯表态：很快需要进一步加息","su":"① 수잔 콜린스 보스턴 연준 총재는 인플레이션(물건값이 계속 오르는 것) 압력이 더 많은 지역으로 확산됨에 따라 연준이 금리를 \"곧\" 추가로 인상해야 할 것이라고 말했습니다. ② 그녀는 \"나는 얼마나 높은 금리를 올려야 하는지, 얼마나 빨리 금리를 올려야 하는지에 대해 성급한 결론을 내리고 싶지 않다\"고 말했다. 차이롄서, 11월 14일(자오 하오 편집자) 수잔 콜린스 보스턴 연은 총재는 인플레이션 압력이 더 많은 지역으로 확산됨에 따라 연준이 금리를 \"곧\" 추가 인상해야 할 것이라고 말했습니다. 그러나 금리 인상 규모와 속도에 대해서는 명확한 입장을 밝히지 않았고, 12월 0.5%포인트(퍼센트끼리 뺀 차이) 인상 지지 여부에 대해서도 직접 답변하지 않았다. 인플레이션 압력이 확산되고 긴축 정책의 방향이 명확해졌습니다. 콜린스 총리는 지난 11월 13일 금요일 인터뷰에서 \"곧 정책을 더욱 긴축해야 할 것\"이라며 \"내 생각에는 통화정책이 어느 방향으로 조정되어야 하는지 분명하다\"고 말했다. 이 발언은 그녀가 통화 정책을 더욱 긴축함으로써 계속되는 물가 압력에 대응할 의향이 있음을 의미하지만 구체적으로 어떻게 행동할지는 아직 판단할 수 없습니다. 콜린스는 12월의 0.5%포인트 인상이나 연속 인상을 지지하는 다른 정책 입안자들의 의견에 대해 질문을 받았을 때 직접적으로 응답하지 않았습니다."},{"s":"\"백미러만 보지 마세요!\" 미 재무장관, 연준에 “에너지 쇼크 때문에 금리 인상하지 말라” 경고","so":"鉅亨網","tm":"11/14 02:28","c":1,"r":"tw","u":"https://news.cnyes.com/news/id/6662168","p":1794590922,"a":1794642643,"t":"「別只看後照鏡！」美財長喊話Fed：別因能源衝擊升息","su":"베선트는 연준(미국의 중앙은행)이 이란 전쟁으로 인한 에너지 공급 충격 때문에 금리(돈을 빌릴 때 내는 이자 비율)를 인상해서는 안 되지만 열린 마음을 갖고 미래를 바라봐야 한다고 말했습니다.\n그는 미국 경제의 펀더멘털이 여전히 튼튼하고 에너지 쇼크가 완화되고 있는 만큼 시끄러운 데이터에 과민반응을 해서는 안 된다고 생각한다.\n지난주의 예상보다 좋은 고용 보고서는 금리를 인상할 이유를 추가했지만 연준은 지난달 금리를 변동 없이 유지했으며 계속해서 데이터를 모니터링할 것입니다."},{"s":"미국 증시 동향 | 오픈AI, ChatGPT 지갑 출시, AI 지능형 에이전트가 사용자를 대신하여 쇼핑하고 결제할 수 있음","so":"etnet 經濟通","tm":"11/14 02:15","c":1,"r":"hk","u":"https://www.etnet.com.hk/www/tc/us-stocks/news-article/416744/%E7%BE%8E%E8%82%A1%E5%8B%95%E5%90%91+%7C+OpenAI%E6%8E%A8ChatGPT+Wallet%EF%BC%8CAI%E6%99%BA%E8%83%BD%E9%AB%94%E5%8F%AF%E4%BB%A3%E7%94%A8%E6%88%B6%E8%B3%BC%E7%89%A9%E6%94%AF%E4%BB%98","p":1794590100,"a":1794642646,"t":"美股動向 | OpenAI推ChatGPT Wallet，AI智能體可代用戶購物支付"},{"s":"미국 증시 동향 | 파이퍼샌들러 분석가는 AI 인프라 수요 전망에 대해 낙관적인 아리스타를 최고의 주식으로 선정했습니다.","so":"etnet 經濟通","tm":"11/14 01:55","c":1,"r":"hk","u":"https://w 年增卻創近四年新高","su":"미국 10월 PPI(공장에서 파는 물건값 수준)는 월별 0.3% 상승해 예상보다 낮았으나 연간 상승률은 6.5%로 2022년 11월 이후 최고치를 기록하며 물가상승압력은 여전히 ​​높다.\n핵심 PPI는 월간 0.3% 증가했고, 식품 도매는 1.3% 증가했으며, 운송 및 창고업은 2% 증가하여 업스트림 비용이 계속 증가했음을 나타냅니다.\n시장은 여전히 ​​연준이 12월에 금리를 0.25%포인트(퍼센트끼리 뺀 차이) 인상할 것이라는 데 베팅하고 있으며, 2%도 배제하지 않습니다. 10월 PCE는 11월 25일에 발표됩니다."},{"s":"S&P500은 최근 2025년 이후 최악의 날을 경험했습니다. 투자자들이 걱정하지 말아야 할 이유는 다음과 같습니다.","so":"Yahoo Finance","tm":"11/13 22:15","c":1,"r":"us","u":"https://finance.yahoo.com/markets/stocks/articles/p-500-recently-experienced-worst-131502974.html","p":1794575702,"a":1794642632,"t":"The S&P 500 Recently Experienced Its Worst Day Since 2025. Here's Why Investors Shouldn't Worry.","su":"지난 목요일 - 11월 5일 - S&P500(SNPINDEX: ^GSPC) 지수는 4.4% 급락해 2025년 4월 이후 최악의 날이었습니다. 시장 하락을 많이 본 적이 없는 신규 투자자들에게는 확실히 두렵게 보입니다. 하지만 투자자들은 걱정할 필요가 없습니다. 시장이 가끔씩 작은 조정과 하락을 하면 초과된 부분이 원상태로 돌아가고 앞으로 더 큰 조정이 일어나는 것을 방지할 수 있기 때문입니다."},{"s":"이 S&P500 주식은 엔비디아 혼란의 승자가 될 수 있습니다","so":"Yahoo Finance UK","tm":"11/13 20:43","c":1,"r":"us","u":"https://uk.finance.yahoo.com/news/p-500-stock-could-winner-114328801.html","p":1794570208,"a":1794642633,"t":"This S&P 500 stock could be a winner from the Nvidia turmoil","su":"Jon Smith는 이번 주의 모든 엔비디아 뉴스 이후 최근 변동성(값이 크게 출렁이는 정도)에서 나타날 수 있는 S&P500(미국 큰 회사 500곳 지수) 주식 중 하나를 지적합니다."},{"s":"SPDR S&P500 ETF(SPY), 11월 11일에 3억 3,590만 달러 추가로 애플 매입","so":"Yahoo Finance","tm":"11/13 20:03","c":1,"r":"us","u":"https://finance.yahoo.com/markets/stocks/articles/spdr-p-500-etf-spy-110304063.html","p":1794567784,"a":1794642633,"t":"SPDR S&P 500 ETF (SPY) Buys $335.9 Million More Apple on Nov. 11","su":"이 펀드는 총 구매액이 42억 5천만 달러를 추가했지만 아무것도 판매하지 않아 502개 포지션이 증가했습니다."}]},{"name":"🧬 나스닥 바이오","note":"보유: TIGER 미국나스닥바이오","breaking":false,"items":[{"s":"12가지 새로운 유형의 약물이 추가되어 2026년 상업 건강 보험 혁신 약물 카탈로그에 총 28가지 유형이 추가되었습니다.","so":"Jiemian.com","tm":"11/14 11:43","c":4,"r":"cn","u":"https://www.jiemian.com/article/15333030.html","p":1794624194,"a":1794628691,"t":"新增12种药品，2026年商业健康保险创新药品目录共有28种","su":"국민의료보험청 관계자는 11월 14일 2026년 시행 예정인 상업건강보험 혁신의약품 목록 조정에 12개 신약이 추가된다고 밝혔다. 상업 건강 보험 혁신 약물 카탈로그의 새 버전에는 세계 최초의 고형 종양 CAR-T, 중국 최초의 혈우병 유전자 치료 약물 및 기타 주요 혁신 약물이 포함됩니다. 이와 동시에 상업 보험 혁신 의약품 목록과 기본 의료 보험 목록 간의 연계 메커니즘을 구축했으며 2025년 상업 보험 혁신 의약품 2종을 의료 보험 목록에 포함했습니다. 조정을 거쳐 2026년 상업건강보험에는 총 28종의 혁신의약품이 포함될 예정이다."},{"s":"상업보험 혁신의약품 카탈로그에 12개 신약 신규 추가, 가격협상 성공률 100%","so":"经济观察网","tm":"11/14 13:39","c":3,"r":"cn","u":"http://www.eeo.com.cn/2026/1114/1092864.shtml","p":1794631140,"a":1794642669,"t":"12款药新入商保创新药目录，价格协商成功率100%","su":"경제 관찰자 팔로우 2026-11-14 12:39 경제 관찰자 기자 Liu Xiaonuo 11월 14일, 2026년 국가 의료 보험 약품 목록과 상업 보험 혁신 약품 목록이 소주에서 발표되었습니다. 국민의료보험청 약품서비스관리국 황신위 국장은 현장에서 11개 기업의 12개 혁신의약품이 상업적으로 보장되는 혁신의약품 목록에 포함됐다고 발표했다. 2026년 9월 경제옵저버는 상업보험 혁신의약품 카탈로그 현장에서 이번에 가격협상에 총 11개사, 12개 의약품이 참여했다는 사실을 알게 됐다. 이는 상업적으로 보장되는 혁신적인 의약품 카탈로그의 가격 협상에 참여하는 모든 의약품이 카탈로그에 성공적으로 포함되었음을 나타냅니다. 2025년에 국민의료보험청은 처음으로 상업적으로 보장되는 혁신의약품 목록에 대한 가격 협상을 시작했습니다. 정식심사를 통과한 의약품은 총 121개이며, 특별협상에는 24개 의약품이 참여했다. 결국 19개 의약품이 성공적으로 협상돼 약 80%의 성공률을 보였다(1개 의약품은 이후 시장에서 퇴출됐다). 2026년에는 신청 건수가 감소할 예정이다. 총 62개 의약품이 상업 보험 혁신 의약품 목록에 제출되었으며, 그 중 58개가 정식 검토를 통과했다. 하지만 결국 협상 성공률은 100%로 높아졌다."},{"s":"새로운 최고 기록 달성, 51종의 1급 신약이 새 버전의 국민의료보험 의약품 목록에 등재되었습니다.","so":"第一财经","tm":"11/14 11:50","c":3,"r":"cn","u":"https://www.yicai.com/news/103440686.html","p":1794624638,"a":1794628689,"t":"再创新高，51个一类新药进入新版国家医保药品目录","su":"국민의료보험청과 인사사회보장부는 오늘(14일) '국민기본의료보험·모성보험·산재보험 의약품 카탈로그'와 '상업건강보험 혁신 의약품 카탈로그'(2026)를 공개했다. 국민의료보험청 출범 이후 국민기본의료보험 약품목록의 9번째 조정이다. 이번 조정에는 총 107개 신약이 추가됐으며, 이 중 카테고리 1 혁신신약(세상에 처음 나온 새로운 약)은 51개로 역대 최고치를 경신했다. 이번 국가 기본의료보험 의약품 목록이 조정되어 신품종은 종양, 희귀질환, 만성질환, 정신질환 등 긴급하게 필요한 임상 치료 분야를 포괄합니다. 동시에 임상적 가치가 제한적이거나 더 나은 대안이 있거나 지침에 대한 정보가 누락되어 사용할 수 없는 34개 의약품이 목록에서 삭제되었습니다. 포괄적인 이전, 이전 및 제형 병합을 거쳐 2026년판 국민기본의료보험 의약품 목록의 총 의약품 수는 3,331개에 달합니다."},{"s":"하오딩 신약, 노바티스 승인 및 계약금 9억 8천만 지급","so":"UDN","tm":"11/14 03:09","c":2,"r":"tw","u":"https://udn.com/news/story/7241/9877816","p":1794593352,"a":1794610375,"t":"浩鼎新藥授權諾華 9.8億簽約金入袋","su":"룬타이그룹 산하 생명공학신약기업 하오딩(Haoding)이 대형 다국적 제약회사 노바티스와 협력 및 라이선스 계약을 체결했다고 어제(13일) 밝혔다. 하이딩의 다중 독점 항체-약물 접합체(ADC) 플랫폼 기술을 사용해 신약 페이로드를 탑재한 차세대 ADC 약물을 공동 개발할 예정이다."},{"s":"혁신적인 약물을 병원에 도입하는 것이 더 이상 어렵지 않을 수 있습니까?","so":"21财经","tm":"11/13 07:14","c":2,"r":"cn","u":"https://www.21jingji.com/article/20261113/herald/022080244c296f17e106f901a9a6f48d.html","p":1794521640,"a":1794523817,"t":"创新药进医院，如何不再难？","su":"혁신의약품의 의료보험 진입은 쉽지만 병원 진입은 어렵다는 딜레마를 어떻게 극복할 것인가? 11월 10일, 국가보건위원회와 기타 4개 부서는 혁신적인 약물의 병원 진입에 대한 제한을 \"완화\"하기 위한 \"혁신 약물의 안전하고 합리적인 유통 및 사용 추가 개선에 관한 통지\"를 공동으로 발표했습니다. 본 고시에서 해당 병원은 안전성, 합리성, 장비, 용도 등에 어떤 변화가 있게 됩니까? 중국의 혁신적인 의약품이 국민의 다양한 의약품 수요를 어떻게 더 잘 충족할 수 있습니까? 이번 '뉴스 1+1' 에피소드에서는 상하이 위생건강 발전 연구센터 소장 Jin Chunlin과 북경대학교 의과대학 보건 정책 및 기술 평가 센터 부주임 Tao Libo가 분석과 해석을 전해 드립니다. 제도적 장애물이 제거되면 근본적인 예산 제약을 어떻게 처리할 것인가?"},{"s":"\"지능형 혁신 약물이 건강에 힘을 실어줍니다\" 2026년 혁신 약물 고품질 개발 회의가 장쑤성 쑤저우에서 개최되었습니다.","so":"央视网","tm":"11/15 15:14","c":1,"r":"cn","u":"https://local.cctv.com/2026/11/15/ARTIJUUOS3gCb1NM4LmCttey261115.shtml","p":1794723251,"a":1794727069,"t":"“智创新药 赋能健康” 2026年创新药高质量发展大会在江苏苏州举行","su":"\"지능형 혁신 약물이 건강에 힘을 실어줍니다\" 2026년 혁신 약물 고품질 개발 컨퍼런스가 장쑤성 쑤저우에서 개최되었습니다."},{"s":"2026년 11월 주목해야 할 영국 생명공학 주식 상위 3개","so":"Yahoo Finance","tm":"11/15 08:09","c":1,"r":"us","u":"https://finance.yahoo.com/healthcare/articles/top-3-british-biotech-stocks-230940445.html","p":1794697780,"a":1794702385,"t":"Top 3 British Biotech Stocks To Watch In November 2026","su":"미국의 도매 인플레이션(물건값이 계속 오르는 것) 상승과 추가 금리(돈을 빌릴 때 내는 이자 비율) 인상 기대로 인해 글로벌 투자자들이 불안해하고 있습니다. 그러나 이런 종류의 압력은 종종 금리가 아닌 돌파구가 결과를 주도하는 부문으로 돈을 밀어 넣습니다. 영국의 생명공학 주식은 바로 그 진영에 속해 있습니다. 이 기사에서는 영국 생명공학 기업을 필터링하는 집중 선별기의 세 가지 후보자를 볼 수 있습니다."},{"s":"신약 출시 경쟁 속에서 강소성의 '좋은 처방'은 무엇일까?","so":"人民网－江苏频道","tm":"11/15 07:57","c":1,"r":"cn","u":"http://js.people.com.cn/n2/2026/1115/c360301-41751166.html","p":1794697020,"a":1794713936,"t":"新药竞发，江苏有何“良方”？","su":"11월 14일, 장쑤성 쑤저우에서 2026년 혁신의약품 고품질 개발 컨퍼런스가 개최되었습니다. 이날 회의에서는 2026년판 국민의료보험 의약품 카탈로그가 공개됐다. 107개 신약 중 51개가 카테고리 1 혁신의약품으로 혁신의약품에 대한 명확한 지원 신호를 보냈다. 이번 컨퍼런스는 장쑤성에서 개최되었으며 장쑤성의 바이오제약 산업과 밀접한 관련이 있습니다."},{"s":"Vita Life Sciences 및 기타 2개의 호주 생명공학 주식 소유","so":"Yahoo Finance","tm":"11/15 01:08","c":1,"r":"us","u":"https://finance.yahoo.com/healthcare/articles/vita-life-sciences-2-other-160842530.html","p":1794672522,"a":1794698059,"t":"Vita Life Sciences And 2 Other Australian Biotech Stocks To Own","su":"미국에서는 10월 소비자물가지수와 생산자물가(공장에서 파는 물건값 수준)가 모두 중앙은행 목표치를 상회하는 등 인플레이션(물건값이 계속 오르는 것)이 과열되고 있으며, 주요 중앙은행들은 금리를 더 오랫동안 유지할 준비가 되어 있다는 신호를 보내고 있습니다. 그런 배경에서는 무거운 자산보다는 연구, 지적재산권, 과학에서 가치가 나오는 기업이 상대적으로 더 나은 입장일 수 있습니다."},{"s":"중국 혁신 의약품의 '쑤저우 모멘트' 개막: JHC 진지호 생명건강 투자 컨퍼런스가 성공적으로 개최되었습니다.","so":"央视网","tm":"11/14 23:09","c":1,"r":"cn","u":"https://local.cctv.com/2026/11/14/ARTIF0JYprRz9gfgmZyNiJZk261114.shtml","p":1794665394,"a":1794698061,"t":"开启中国创新药的“苏州时刻”：JHC金鸡湖生命健康投资大会顺利举行","su":"이 회의에서는 최첨단 과학 세력, 선도적인 투자 자본 및 주요 산업 신호를 모아 ​​자본의 물로 혁신의 원천에 물을 공급하고 생명 및 건강 산업을 위한 매우 중요한 \"연간 자본 좌표\"를 설정합니다."},{"s":"의료보험목록에 의약품 107종 신규 포함, 혁신의약품 지급한도 개방","so":"第一财经","tm":"11/14 17:38","c":1,"r":"cn","u":"https://www.yicai.com/news/103440767.html","p":1794645535,"a":1794659855,"t":"107种药品新纳入医保目录，创新药支付天花板打开","su":"2025년판 상업보험 혁신의약품 카탈로그의 18개 의약품 중 2개가 기본의료보험 카탈로그에 편입돼 '상업보험을 통한 혁신의약품 최초 발굴 및 기본의료보험 연계'라는 변혁의 길을 실현하는 데 앞장서고 있다."},{"s":"pMN 적응증에 대한 최초의 혁신 약물이 의료 보험에 포함됩니다. 전문가들이 베이젝신 이중 적응증 약물의 임상적 의의를 설명하다","so":"新华网上海","tm":"11/14 16:14","c":1,"r":"cn","u":"http://sh.news.cn/20261114/354598b1859f4f2982434c33fd1e51db/c.html","p":1794640448,"a":1794659857,"t":"首个pMN适应症创新药纳入医保 专家解读倍捷欣双适应症药物临床意义","su":"최초의 pMN 적응증 혁신신약(세상에 처음 나온 새로운 약)이 의료보험에 포함되었습니다. 전문가들은 이중 적응증 약물인 Betexin®의 임상적 중요성을 설명합니다. Tianguangshi Biological의 오리지널 CD20 단일클론 항체인 Betexin® 이중 적응증은 2026년 의료 보험 카탈로그에 포함되어 원발성 막성 신병증 및 시신경척수염 스펙트럼 질환을 포함하여 환자의 약물 접근성을 향상시킬 것입니다."},{"s":"수익 최대 11%의 생명공학 주식 3개","so":"Yahoo Finance","tm":"11/14 15:15","c":1,"r":"us","u":"https://finance.yahoo.com/healthcare/articles/3-biotech-stocks-revenue-11-061542278.html","p":1794636900,"a":1794642663,"t":"3 Biotech Stocks With Revenue Up To 11%","su":"AI 인프라와 관련된 복잡한 부채가 급증하면서 AI 관련 위험이 연준(FRB)의 금융 안정성 우려 중 최고 수준으로 올라섰습니다. 이러한 종류의 호황과 정밀한 조사는 투자자들이 다른 최첨단 분야를 보도록 유도할 수 있습니다. 탄탄한 대차대조표를 갖춘 신중하게 선택된 생명공학 주식은 잠재적인 높은 상승 여력의 다른 원천을 제공할 수 있습니다. 이 기사에서는 이러한 세 가지 생명공학 oppo에 대해 설명합니다."},{"s":"전문가들, 혁신적인 ALS 약물이 상업 보험의 새 창을 열다: 유전자 검사는 가족력에만 초점을 맞춰서는 안 됩니다","so":"ThePaper.cn","tm":"11/14 15:12","c":1,"r":"cn","u":"https://www.thepaper.cn/newsDetail_forward_34475772","p":1794636762,"a":1794642664,"t":"渐冻症创新药迎来商保新窗口，专家：基因检测不应只盯家族史","su":"11월 14일, 2026년 전국 상업 보험 혁신 의약품 카탈로그가 공식적으로 발표되었습니다. 이번 국가 \"이중 카탈로그\" 조정은 혁신 수준이 높고, 임상 가치가 높으며, 환자 혜택이 상당한 품종에 초점을 맞추고 있으며, 보다 다양한 보호 방법을 통해 혜택을 받을 수 있는 혁신적인 약물을 홍보하는 것을 목표로 하고 있습니다."},{"s":"상용보험 혁신신약부터 국가협상의약품까지, 밀리언급 CAR-T가 최초로 기본의료보험에 진입","so":"第一财经","tm":"11/14 15:06","c":1,"r":"cn","u":"https://www.yicai.com/news/103440735.html","p":1794636362,"a":1794642666,"t":"从商保创新药变为国谈药，百万级CAR-T首次进入基本医保","su":"\"National Talk\" 듀얼 카탈로그의 새 버전이 오늘 공식적으로 출시되었습니다. 국내 혁신신약(세상에 처음 나온 새로운 약) 2종은 상용보험 혁신의약품 목록에 선정된 지 1년 만에 국가기본의료보험 목록에 성공적으로 편입됐다. '초고가 항암제'로 알려진 CAR-T 제품이 기본의료보험에 들어간 것도 이번이 처음이다. 14일, 쑤저우에서는 2026년 국민의료보험 약품 목록과 상업건강보험 혁신 약품 목록이 발표됐다. 국민의료보험 의약품목록 새 버전에는 1급 신약 51종을 포함해 107종의 신약이 추가돼 최고 기록을 경신했다. 상업 건강 보험 혁신 의약품 카탈로그에는 12개의 신약이 있습니다. 조정 후 2026년 상업 건강보험 혁신의약품 카탈로그에는 총 28종의 품목이 포함될 예정이다."},{"s":"Jikeshu는 의료 보험에 들어갑니다 : 인플루엔자 A와 B에 맞서 싸우기 위해 한 번의 복용량으로 일반 가족에게 혜택을주는 혁신적인 약물","so":"中国新闻网","tm":"11/14 14:44","c":1,"r":"cn","u":"https://www.chinanews.com.cn/jk/2026/11-14/10731967.shtml","p":1794635077,"a":1794642667,"t":"济可舒进医保：一剂对抗甲流乙流，创新药惠及普通家庭","su":"Jikeshu는 의료 보험에 가입합니다. 인플루엔자 A와 B에 대해 한 번의 접종으로 혁신적인 약물이 일반 가족에게 도움이 됩니다. 국민의료보험청은 11월 14일 2026년 '국민기본의료보험, 출산보험, 산재보험 약품 목록'(이하 국민의료보험 목록)을 발표했다. Jichuan Pharmaceutical과 Zhengxiang Pharmaceutical의 전략적 협력인 국내 1급 항인플루엔자 혁신 약물인 Maseloseloxavir 정제(Jikeshu®)가 공식적으로 의료 보험에 포함되었습니다. 이 혁신적인 약물은 인플루엔자 치료에 새로운 선택을 제시하고, 일반 국민들은 국산의 좋은 약물을 보다 저렴하게 사용할 수 있게 되었습니다. 인플루엔자를 치료하려면 전체 치료 과정에서 한 가지 약물만 필요하며 하루 정도 지나면 열이 내려갈 수 있습니다. 독감에 걸리면 매일 약을 복용해야 한다는 것을 기억해야 합니까? Jikeshu®는 다중 약물 치료 모델을 깨뜨립니다. 전체 독감 치료 주기 동안 한 번만 복용하면 진정한 \"1회 복용량 완화\"를 달성할 수 있습니다."},{"s":"엘리 릴리(일라이릴리): 종양학 분야의 혁신적 약물 3개에 대한 새로운 적응증이 국가 의료보험 카탈로그에 포함되었습니다.","so":"Jiemian.com","tm":"11/14 12:56","c":1,"r":"cn","u":"https://www.jiemian.com/article/15333120.html","p":1794628575,"a":1794628688,"t":"礼来：三款肿瘤领域创新药物新增适应症纳入国家医保目录","su":"11월 14일, 일라이릴리는 Jepali®(피투브루티닙 정제), Tyvyt®(신틸리맙 주사제) 및 Aiute®(프루퀸티닙 캡슐)를 포함하여 종양학 분야의 세 가지 혁신 약물의 새로운 적응증이 국민 기본 의료 보험, 산재 보험 및 산모 보험 의약품 카탈로그(2026) 새 버전에 성공적으로 포함되었다고 발표했습니다. 국민의료보험목록 새 버전이 2027년 1월 1일 정식 시행됩니다."},{"s":"2027년에 생명공학 주식이 이익 턴어라운드를 볼 수 있을까요? 한다, 타이허 등 6개 유명 의약품의 허가, 허가, 판매가 핵심이 됐다","so":"工商時報","tm":"11/14 11:35","c":1,"r":"tw","u":"https://www.ctee.com.tw/news/20261114700362-430504","p":1794623700,"a":1794628693,"t":"生技股2027年迎獲利轉機？漢達、泰合等6檔受矚藥證、授權與銷售成關鍵- 產業","su":"생명공학 주식은 2027년에 이익 턴어라운드를 볼 것입니다! 신약 인증, 국제라이센싱, 해외판매가 지속적으로 진행되면서 시장의 초점은 연구개발에서 실제 수익으로 옮겨가고 있습니다. 그 중 한다(6620)의 항암신약은 이미 미국 의약품 허가를 취득했고, 타이허(6467)의 항혈전신약은 이미 검토 단계에 돌입했다. TLC-KY(7924), Renxin(6696), Taikang(6589), Yi'an(6499) 등 상용화 테마로 내년 영업 성장…"},{"s":"주사형 나노바디, 중증 근무력증에 대한 FDA 승인 획득","so":"MedPage Today","tm":"11/14 07:24","c":1,"r":"sg","u":"https://www.medpagetoday.com/neurology/generalneurology/123885","p":1794608648,"a":1794610378,"t":"Injectable Nanobody Wins FDA Approval for Myasthenia Gravis","su":"FDA는 금요일 항아세틸콜린 수용체(AChR) 항체 양성인 성인의 전신성 중증 근무력증을 치료하기 위해 보체 성분 5(C5) 활성화를 차단하는 이중 결합 나노바디인 주사형 게푸룰리맙(Klygefa)을 승인했습니다."},{"s":"혁신적인 의약품에 대한 자금 조달이 거의 900억 위안에 달했고, 중국의 제약 자산은 재평가를 받고 있습니다.","so":"21财经","tm":"11/13 21:47","c":1,"r":"cn","u":"https://www.21jingji.com/article/20261113/herald/9dcaa00ffa3b07d9081506930976b7d4.html","p":1794574020,"a":1794576116,"t":"创新药融资近900亿元，中国医药资产迎来价值重估","su":"한루 21세기경제연구원 연구원 2026년에는 중국 의료·보건 분야의 대규모 자금조달 소식이 속속 들려올 것이다. 지난 1월 Jiyu Pharmaceutical은 시리즈 A 자금 조달(사업에 쓸 돈을 모으는 것)에서 약 20억 위안을 완료했습니다.  영향이 분석됐습니다. ② 리튬과 황산염은 영향이 달랐으며 민물 생물이 바다 생물보다 대체로 더 민감했습니다. ③ 연구진은 리튬을 우선 제거하고 여러 처리 기술을 단계적으로 결합해 물 재이용과 자원 회수를 함께 하도록 제시했습니다."},{"s":"\"2차전지 폐수, 리튬이 황산염보다 농도 낮추기 어렵다\"","so":"뉴시스","tm":"11/15 10:27","c":1,"r":"kr","u":"https://www.newsis.com/view/NISX20261115_0003868432","p":1794706047,"a":1794713947,"su":"[안동=뉴시스] 류상현 기자 = 2차전지(충전해서 다시 쓰는 배터리) 산업에서 나오는 고염폐수 오염원 가운데 리튬이 황산염보다 농도를 낮추기 어렵고 폐수로 인한 영향은 담수생물이 해양생물보다 더 많이 받는 것으로 나타났다.경북도보건환경연구원과 포항산업과학연구원(RIST)은 2차전지 산업에서 나오는 고염폐수의 이같은 생태독성을 분석하고 지역에 맞는 처리와 자원회수를 위한 전략을 제시했다.."},{"s":"이차전지 양산 설비 도면 빼돌려 부당 이득…전 직원들 벌금형·집유","so":"파이낸셜뉴스","tm":"11/15 10:00","c":1,"r":"kr","u":"https://www.fnnews.com/news/202611151000366860","p":1794704436,"a":1794713947,"su":"(청주=뉴스1) 임양규 기자 = 자신이 근무했던 이차전지 양산용 공정 자동화 장비업체에서 빼돌린 설비 설계 도면을 이용해 사업을 벌이고 부당이득을 챙긴 2명이 나란히 벌금형을 선고받았다."},{"s":"2차전지 제조장비 기술 자료 빼돌려 새 회사 차린 2명 벌금형","so":"연합뉴스","tm":"11/15 10:00","c":1,"r":"kr","u":"https://www.yna.co.kr/amp/view/AKR20261113054800064","p":1794704403,"a":1794713947,"su":"(청주=연합뉴스) 이성민 기자 = 전 직장의 2차전지(충전해서 다시 쓰는 배터리) 기술 설계 도면 등을 빼돌려 새 회사를 차린 남성 2명이 벌금형을 선고받았다."},{"s":"[모닝포스트] 국제유가가 밤새 '롤러코스터'를 겪었다. 스페이스X 3분기 실적은 기대치를 초과했습니다. CATL 및 기타 3분기 보고서가 발표되었습니다.","so":"财联社","tm":"11/15 07:41","c":1,"r":"cn","u":"https://www.cls.cn/detail/2510447","p":1794696099,"a":1794727082,"t":"【早报】国际油价，一夜“过山车”；SpaceX Q3 业绩超预期；宁德时代等三季报出炉","su":"① 미국 ​​정부가 각 기관에 딥시크 사용 중단을 지시했고, 외교부가 대응 ② 국가 데이터 그룹 설립 ③ 미국 다우존스 산업평균지수가 1% 이상 상승 ④ 공업정보화부: R&D와 테스트를 통해 충분히 검증되지 않은 불합리한 혁신 디자인과 자동차 제품의 시장 진입을 단호히 방지 ⑤ CATL, Tianyue Advanced, Yunnan Germanium Industry, CSSC Special Gas의 3분기 보고서가 공개된다. 매크로뉴스 1. 국무원의 승인을 받아 국립데이터그룹주식회사가 설립되었습니다. 국무원 국유자산감독관리위원회는 국무원을 대신하여 투자자의 직무를 수행한다. 국무원 국유자산감독관리위원회가 투자자의 임무를 수행하는 기업 목록에 포함될 것이다. 2. 미국 국토안보부는 10월 19일 미국 연방정부의 민간행정기관이 중국 인공지능 기업 딥서치(Deep Search) 및 그 계열사가 개발한 제품 및 서비스를 구매하는 것을 금지하고 관련 제품 및 서비스를 관련 기관의 정보시스템에서 제거하도록 요구한다고 발표했다. 상무부는 이에 대해 중국측은 강한 불만을 표하며 단호히 반대한다고 밝혔습니다. 미국은 양국 정상이 달성한 중요한 공감대를 진지하게 이행하고, 중국과 중간 협력하고, 중미 인공지능 대화 메커니즘을 잘 활용하고, 상호 신뢰를 강화하고, 차이를 관리하며, 인공지능을 공동으로 추진하기를 희망합니다."},{"s":"CATL과 BAIC, 포괄적인 전력 교환 협력 실시","so":"21财经","tm":"11/14 20:22","c":1,"r":"cn","u":"https://www.21jingji.com/article/20261114/herald/3850b3ac4602ab05934e7eda1b975b39.html","p":1794655376,"a":1794659867,"t":"宁德时代与北汽全面换电合作落地","su":"CATL과 BAIC는 포괄적인 배터리 교환 협력을 시작했습니다. 본 신문 보도(리팅 기자) 11월 13일 베이징에서 Jihu 국가 전력 스왑 생태계 및 베타 시리즈 신제품 출시 컨퍼런스가 개최되어 Jihu T1 배터리 스왑 버전이 출시되었습니다. 이는 베이징자동차그룹(이하 'BAIC 그룹')과 CATL 신에너지기술유한회사(이하 'CATL')가 지난 10월 22일 협약 체결 이후 한 달도 채 되지 않아 100만대 차량용 배터리 교환 전략적 협력 협약을 체결한 이후 또 하나의 중요한 성과다. 이전 협약에 따르면 양 당사자는 차량 개발, 배터리 교체 공급, 배터리 교체 네트워크 및 비즈니스 모델 혁신에 초점을 맞춘 풀체인 협력을 진행하게 된다. BAIC는 자사의 멀티 브랜드 적용 모델을 초콜릿 배터리 교환 생태계에 통합하는 것을 촉진하고 배터리 교환 모델 100만 개라는 목표를 달성할 것입니다."},{"s":"CATL의 1,300억 달러 하락: 중국 최대 배터리 제조업체의 가치가 급락한 이유는 무엇입니까?","so":"South China Morning Post","tm":"11/14 16:00","c":1,"r":"sg","u":"https://www.scmp.com/business/climate-and-energy/article/3374346/chinas-battery-giant-catl-faces-tough-choices-after-epic-us130b-sell","p":1794639607,"a":1794642677,"t":"CATL’s US$130b drop: why has China’s biggest battery maker plunged in value?"},{"s":"[포토] 이차전지 소재·부품 및 장비전(K-BATTERY SHOW 2026)","so":"전자신문","tm":"11/14 11:57","c":1,"r":"kr","u":"https://www.etnews.com/tools/image_popup.html?v=bjQ5VkNYY2dLZTZMZFBUbmNzandvWmpGcjBTK1pHYm1CUVRXR0pTMldlYVZkdE5JeGJVUFVVNURJN04rbmhKTUxzY1VjKzlkWnR1T0RNY3NNT29yUjFDQ2JhMTlQMG04cmkxbm9CQkJtdENXMGpteXcxTWNOZXV5Rk81bmVFcmRqdGRpUWJuNUE1QjY4TG5DY09QZEtMcDZkK0lLZG9OaXlodTI2UVBmcmY5aDNuMlJtMHlpdWFwSWl5L3d1eTA3S2xTejI2VTNnVktpdi9Kc3dnNFMrcjdtWFU3YkJDQlVwTitmRzFNOXBQdWV2QklNcEVSQkFzNEMyL29uUkVxZ0NhVWRXOU9pOG9CS3U3TXgrOGpNaGtSc0dwQlJFOVR3SEhnNlRyMVNQb1dhTDJGYk9lV01lQ3F2NjdPcEt2OVNUZVYwUmNjMk03c3N1OHVEL0JJN3NnPT0","p":1794625072,"a":1794664805},{"s":"배터리 증권화 추세가 높아지고 있다","so":"Jiemian.com","tm":"11/14 11:21","c":1,"r":"cn","u":"https://www.jiemian.com/article/15323161.html","p":1794622871,"a":1794698071,"t":"电池证券化趋势渐起","su":"지몐 뉴스 기자 | 우한시 옵틱스 밸리(Optics Valley)에 위치한 배터리 교환 스테이션에서는 배터리가 부족한 전기 자동차가 주차 프레임으로 진입한 후 자동으로 배터리 교환 스테이션 칸에 쏟아졌습니다. Jiemian News 기자들은 현장에서 배터리가 차량 섀시 아래에 있는 것을 목격했습니다. 해치가 열린 후 시스템은 스캔된 주문 정보를 기반으로 창고에서 충전된 배터리를 매칭했습니다. 장비는 자동으로 위치를 조정하고, 방전된 배터리를 제거하고, 새 배터리를 장착하고 잠겼습니다. 전체 과정은 약 3분 정도 소요되었습니다. \"2026년 9월 말 기준으로 Weineng의 관리 중인 배터리 규모는 60GWh를 초과하고 운영 자산은 600억 위안을 초과할 것입니다.\" 11월 초 언론 인터뷰에서 우한 Weineng 배터리 기술 그룹 유한회사(이하 Weineng)의 총책임자인 라이 샤오밍(Lai Xiaoming)은 Jiemian News 및 기타 언론에 말했습니다."},{"s":"일주일 동안의 자금 유출은 24억 위안을 초과했으며 CATL은 주요 플레이어에 의해 크게 감소되었습니다! 캠브리안은 이러한 추세를 거스르고 자금 유치 목록 1위를 차지했습니다.","so":"21财经","tm":"11/14 11:00","c":1,"r":"cn","u":"https://www.21jingji.com/article/20261114/herald/b542a1d4ed1c9c9d383f011d64d8bfb0.html","p":1794621600,"a":1794628702,"t":"单周失血超24亿元，宁德时代遭主力大减持！寒武纪逆势吸金居首","su":"21파이낸셜레이더에 따르면 이번주(11월 9일~11월 13일) A주 3대 지수가 고점에서 하락하며 일제히 하락 마감했다. 상하이종합지수는 이번 주 0.41% 하락한 3634.35포인트로 마감했다. 선전 구성요소 지수는 이번 주에 1.85% 하락했다. ChiNext 지수는 이번 주에 1.59% 하락했습니다. 이번 주에는 주요 자금 조달(사업에 쓸 돈을 모으는 것) 스타일이 크게 바뀌어 \"고점을 포기하고 저점을 취하는\"특성을 보여주었습니다. 에너지 신산업 체인은 이익 추구에 집중되었고, 광학 모듈 및 PCB와 같은 컴퓨팅 하드웨어의 방향은 내부적으로 명확하게 차별화되었으며 자금은 일반적으로 국내 컴퓨팅 칩 및 반도체(전자기기의 두뇌 부품) 장비와 같은 새로운 주요 라인으로 이동했습니다. 국내 컴퓨팅 파워 칩이 이번 주 주요 수입원이 됐다. AI 칩 리더인 캄브리콘은 27억 9300만 위안의 순유입을 받아 이번 주 21.92% 급증하며 시장 1위를 차지했습니다. 이더넷 스위칭 반도체 회사인 Shengke Communications는 이번 주 동안 28.90% 급증한 9억 4400만 위안의 순유입을 기록했습니다."},{"s":"포스코퓨처엠 포항 양극재 공장 전경","so":"전자신문","tm":"11/14 09:20","c":1,"r":"kr","u":"https://www.etnews.com/tools/image_popup.html?v=bjQ5VkNYY2dLZTZMZFBUbmNzandvWmpGcjBTK1pHYm1CUVRXR0pTMldlYVZkdE5JeGJVUFVVNURJN04rbmhKTXYxQjJsVlBmamRQN2NBUmJxSFpERkFzd2dSbVRBUzZYdTI1VkdvdDVidGdWcS9scTViZFVKZWxONmZLc3lLbDlML0x2N1FtMnRRTytEcyt3OGhqWXEwOVUrd2JaS3A4MExYUkZZOXpySUF6bnBSVHY1aWd5VFFHdlRiNGVlTEJFWVo1aWFub1ozeVp5QzhxMWtGa1lzcEtVYngxUnRlUWExVWF3V2J5QnhmWXZZdTFoSmtQNTRVeTB2cEhZWmh1R01jYThwbGdKYmtFWlpRWk9OUnpaNnhFZzFkMnluYmpsVEM0T2N1VGg2UVFsSzNIYTkvMWtiYVBKMTAza1IxaGE","p":1794615646,"a":1794698070},{"s":"'산소'부터 '불소'까지, 리튬전지는 강인한 심장을 키운다 (학자가 말하는 대중과학) --경제·기술","so":"人民网","tm":"11/14 06:47"," ","su":"[방콕=아카마 건재] 태국 아누틴 총리는 13일 방콕을 방문 중인 중국 이강 총리와 회담했다. 전기자동차(EV) 개발과 농산물 무역확대 등에 관한 8개의 협력문서를 나눴다. 투자 확대를 통해 양국의 경제관계를 강화한다. 2027년 초 양국의 외상과 국방상에 의한 ‘2플러스2’ 회의의 첫 회합을 열 방침에서도 일치했다. 양국은 7월 2플러스 2의 틀을 신설하기로 합의했다. 이씨가 23"},{"s":"리튬배터리 산업체인 주간일지 | 리튬 배터리 관련 수출 규제가 내년 1월까지 유예된다. '15차 5개년 계획'을 위한 새로운 에너지 저장 솔루션이 구현됩니다.","so":"Jiemian.com","tm":"11/13 23:24","c":1,"r":"cn","u":"https://www.jiemian.com/article/15332436.html","p":1794579852,"a":1794610396,"t":"锂电产业链周记 | 锂电池相关出口管制暂停实施至明年1月 “十五五”新型储能方案落地","su":"짐바브웨는 2027년 1월 리튬 정광 수출 금지 조치를 유지했고, 궈쉬안의 2GWh 전고체 대량 생산 라인이 가동됐으며, Tianci Materials는 50만 톤 전해질 프로젝트를 건설하기 위해 50억 위안 이하를 투자할 계획이다."},{"s":"온세미, AI·EV·에너지 애플리케이션 겨냥한 4세대 SiC 플랫폼 선보여","so":"AutoTechInsight","tm":"11/13 23:06","c":1,"r":"world","u":"https://autotechinsight.spglobal.com/news/5291465/onsemi-introduces-fourth-generation-sic-platform-targeting-ai-ev-and-energy-applications","p":1794578777,"a":1794610415,"t":"Onsemi introduces fourth-generation SiC platform targeting AI, EV and energy applications","su":"EliteSiC M4 750V 자동차 트랙션 베어 다이는 현재 사용 가능하며 2027년에는 최대 1,200V의 추가 전압 옵션이 예상됩니다."},{"s":"결산 : artience의 순이익 84% 증가 26년 12월기 EV 수요 감소로 하향 수정","so":"日本経済新聞","tm":"11/13 20:24","c":1,"r":"jp","u":"https://www.nikkei.com/article/DGXZQOUC135O50T11C26A1000000/","p":1794569088,"a":1794576135,"t":"決算:artienceの純利益84％増 26年12月期、EV需要減で下方修正","su":"artience(아티엔스, 구 동양 잉크 SC 홀딩스)는 13일, 2026년 12월기의 연결 결산은 순이익(모든 비용을 빼고 남은 돈)이 전기 대비 84% 증가한 190억엔이 될 것이라고 발표했다. 기존 예상을 20억엔 하향 수정한다. 전기자동차(EV) 수요 감속으로 리튬이온 전지 재료가 떨어지고 손상차손 92억엔을 계상한다. 매출은 11% 증가한 3880억엔, 영업이익(장사해서 남긴 돈)은 25% 증가한 260억엔을 전망한다. 종래 예상으로부터 각각 280억엔,"},{"s":"CATL은 이달 들어 eVTOL 기업 2개사 연속 계약을 맺었고, 배터리 제조사들은 저고도 분야 배치를 가속화했다.","so":"财新","tm":"11/13 20:13","c":1,"r":"cn","u":"https://companies.caixin.com/2026-11-13/102504602.html","p":1794568380,"a":1794576129,"t":"宁德时代月内连签两家eVTOL企业 电池厂商加速布局低空领域","su":"[카이신닷컴] 동력배터리 업체들이 저고도 항공기 고객 확대에 속도를 내고 있다. 11월 12일, CATL(300750.SZ)은 Yivit(Hangzhou) Aviation Technology Co., Ltd.와 유인 및 화물 차량용 전기 수직 이착륙 항공기(eVTOL)에 항공 전력 배터리를 제공하는 독점 배터리 파트너 역할을 하는 계약을 체결했다고 발표했습니다. CATL이 eVTOL 기업과의 협력을 발표한 것은 11월 이후 두 번째다. 첫 번째는 11월 2일이었습니다. 협력 파트너는 Blue Vector Aviation Technology (Shanghai) Co., Ltd.였으며 CATL은 SKYLA V30 순수 전기 틸트 로터 eVTOL용 배터리를 맞춤형으로 개발했습니다. 양 당사자는 또한 독점적인 협력 모델을 채택합니다."},{"s":"BESS 업계 소식: CATL 나트륨 이온 사양, BESS 가용성 및 전력 공급 속도 가격","so":"Energy-Storage.News","tm":"11/13 19:01","c":1,"r":"us","u":"https://www.energy-storage.news/bess-industry-buzz-catl-sodium-ion-specs-bess-availability-and-the-price-of-speed-to-power/","p":1794564102,"a":1794576126,"t":"BESS Industry Buzz: CATL sodium-ion specs, BESS availability and the price of speed-to-power"},{"s":"장안자동차 : 전고체 배터리는 파워 배터리 소재 시스템의 근본적인 변화","so":"36Kr","tm":"11/13 17:22","c":1,"r":"cn","u":"https://m.36kr.com/newsflashes/4067880412484740","p":1794558156,"a":1794576130,"t":"长安汽车：固态电池是动力电池材料体系的根本性变革"},{"s":"“에코프로 그룹, 내년 1분기 실적 회복·3분기 본격 반등 전망” [찐코노미]","so":"이투데이","tm":"11/13 16:38","c":1,"r":"kr","u":"https://www.etoday.co.kr/news/view/2648043","p":1794555480,"a":1794576125,"su":"2차전지(충전해서 다시 쓰는 배터리) 소재 기업 에코프로 그룹이 올해 4분기를 실적(회사가 번 돈 성적표) 저점으로 내년 1분기부터 회복세에 접어들어 3분기에는 본격적인 반등에 나설 것이라는 분석이"},{"s":"강원에너지, 이차전지 소재 성장에 실적 개선 본격화","so":"뉴스핌","tm":"11/13 16:34","c":1,"r":"kr","u":"https://www.newspim.com/news/view/20261113001315","p":1794555240,"a":1794576125,"su":"[서울=뉴스핌] 양태훈 기자 = 강원에너지가 이차전지 소재 사업 성장에 힘입어 올해 3분기 영업손실을 크게 줄이고 당기순이익(모든 비용을 빼고 남은 돈) 흑자전환에 성공했다. 주력인 무수수산화리튬 사업의 매출이 증가한 가운데 인공지능(AI) 데이터센터(컴퓨터 수만 대를 모아 둔 건물) 관련 설비 사업으로 영역을 확대하고"},{"s":"\"China News\" 두 부서: 에너지 저장 배터리 회사가 합리적이고 질서 있는 방식으로 프로젝트 건설을 촉진하고 맹목적인 확장 위험을 방지하도록 안내","so":"etnet 經濟通","tm":"11/13 16:30","c":1,"r":"hk","u":"https://www.etnet.com.hk/www/tc/news/news-article.php?section=categorized&category=china&newsid=20261113775","p":1794555000,"a":1794576133,"t":"《中國要聞》兩部門：指導儲能電池企業合理有序推進項目建設，防範盲目擴張風險","su":"2026/11/13 15:30 \"China News\"의 두 부서: 에너지 저장 배터리 회사가 합리적이고 질서 있는 방식으로 프로젝트 건설을 촉진하고 맹목적인 확장 위험을 방지하도록 안내 요약 면책 조항 이 내용은 기존 시장 데이터 및 뉴스 소스를 기반으로 인공 지능에 의해 생성되었으며 참고용입니다. 본 내용은 \"이코노믹스\"의 견해나 입장을 대변하지 않으며, 어떠한 투자조언도 구성하지 않습니다. AI가 생성한 정보에는 오류, 누락, 일탈 등이 있을 수 있으므로, 투자 결정을 내리기 전에 사용자가 직접 해당 내용을 확인하거나 전문가의 조언을 구해야 합니다. \"이코노믹스\"는 본 내용을 신뢰하여 발생하는 어떠한 손실이나 손해에 대해서도 책임을 지지 않습니다."},{"s":"CATL과 시드니 뉴사우스웨일스대학교, 에너지 전환 공동 추진을 위한 협력 양해각서 체결","so":"Jiemian.com","tm":"11/13 16:13","c":1,"r":"cn","u":"https://www.jiemian.com/article/15329814.html","p":1794553980,"a":1794576132,"t":"宁德时代与悉尼新南威尔士大学签署合作谅解备忘录 共促能源转型","su":"최근 2026년 호주 국제에너지쇼가 멜버른에서 열렸습니다. 남반구에서 가장 크고 가장 영향력 있는 청정 에너지 행사인 이 전시회는 효율적인 지식 공유 플랫폼일 뿐만 아니라 호주와 아시아 태평양 지역의 산업 자원을 연결하는 중요한 가교 역할을 합니다. 전시회 기간 동안 CATL은 시드니 뉴사우스웨일스 대학교(UNSW Sydney)와 협력 양해각서를 체결하여 공식적으로 전략적 파트너십을 구축했습니다. 양 당사자는 호주의 청정 에너지 전환에 필요한 전문 기술과 산업 역량을 공동으로 강화하여 혁신 결과, 기술 배당(회사가 주주에게 나눠주는 돈)금 및 산업 기회가 더 많은 사람들에게 혜택을 줄 수 있도록 할 계획입니다. 뉴 사우스 웨일즈는 호주의 재생 에너지 및 에너지 저장 인프라 개발의 최전선에 있습니다. 관련 산업의 확장이 가속화되면서 현지 전문인력에 대한 수요도 급속히 늘어나고 있다. 이를 위해 양 당사자는 에너지저장전지 인재양성, 기술 실증 및 검증, 공동과학연구 등 3대 방향을 중심으로 협력해 나갈 예정이다. 동시에 시드니 뉴사우스웨일스대학교의 50년 이상 축적된 재생에너지 혁신에 의존하여 학교의 장기간 축적된 과학 연구 보유량이 실용적인 산업 기술로 전환될 것입니다. 기술 혁신과 반복을 촉진하는 동시에 지역 고용 기회를 창출하고 지역 생산 능력의 기반을 강화하여 에너지 전환의 결과가 더 많은 어린 학생들, 지역 사회 생계 및 지역 경제에 도움이 될 것입니다."},{"s":"2차전지 연구실·소재공장 찾아 독일 날아간 경남정보대 학생들","so":"아시아경제","tm":"11/13 15:49","c":1,"r":"kr","u":"https://www.asiae.co.kr/article/2026111315495389236","p":1794552594,"a":1794553606,"su":"2차전지(충전해서 다시 쓰는 배터리) 연구실·소재공장 찾아 독일 날아간 경남정보대 학생들 재학생 13명 독일서 5박 7일 현장교육 MEET·BASF 방문 연구·생산과정 살펴 이차전지를 공부하는 대학생들이 독일 연구기관과 기업을 찾아 배터리 산업의 현장을 살폈다. 강의실에서 익힌 이론이 연구와 소재 생산 과정에 어떻게 적용되는지 확인하고 유럽의 기술 동향도 접했다. 경남정보대학교(총장 김태상)는 재학생 13명이 최근 5박 7일 일정으로 독일 프랑크푸르트와 뮌스터 일대에서 이차전지 산업·연구 현장교육을 받았다고 13일 알렸다."},{"s":"소재부터 로봇까지, 이차전지 미래 기술 포항에 집결","so":"서울경제","tm":"11/13 15:14","c":1,"r":"kr","u":"https://www.sedaily.com/article/20114052","p":1794550460,"a":1794576125,"su":"소재부터 로봇까지, 이차전지 미래 기술 포항에 집결 ‘국제 배터리 엑스포 2026 포항’ 13일 개막 입력2026-11-13 15:14 배터리 기술과 활용 가능성을 한자리에서 확인할 수 있는 ‘국제 배터리 엑스포 2026 포항’이 13일 포항 만인당에서 개막했다. 경북도와 포항시가 주최하는 엑스포는 ‘일상을 충전하다, 미래를 향한 움직임’을 주제로 15일까지 3일간 이어진다. 행사에는 53개 기업·기관이 131개 부스를 마련했다."},{"s":"LG에너지솔루션 미국 자회사, ESS 운영 최적화 플랫폼 '에어로스 인텔리전스' 출시","so":"비즈니스포스트","tm":"11/13 14:32","c":1,"r":"kr","u":"https://www.businesspost.co.kr/BP?command=article_view&num=451957","p":1794547972,"a":1794553606},{"s":"제19회 대한민국소통어워즈 시상…대상에 한화그룹·포스코퓨처엠","so":"전자신문","tm":"11/13 14:23","c":1,"r":"kr","u":"https://www.etnews.com/20261113000199","p":1794547399,"a":1794553606,"su":"한국인터넷소통협회는 13일 한국프레스센터에서 제19회 대한민국소통어워즈 시상식을 개최하고, 고객과의 소통에서 탁월한 성과를 거둔 기업과 공공기관을 발표했다. 해당 어워즈는 디지털 플랫폼을 기반으로 고객과 적극적으로 소통하고 차별화된 콘텐츠와 고객 경험을 제공한 기업과 공공기관을 발굴·시상하는 행사다. 올해의 소통대상에는 디지털 소통효과 평가에서 S등급의 우수한 성과를 유지해 온 한화그룹(브랜드미디어), 포스코퓨처엠(유튜브) 등이 선정됐다. 이들"},{"s":"LG엔솔 배터리 가동률 57.1%로 회복…R&D 투자 1.1조 돌파","so":"이데일리","tm":"11/13 14:10","c":1,"r":"kr","u":"https://www.edaily.co.kr/News/Read?newsId=03624406645645392&mediaCodeNo=257","p":1794546651,"a":1794553606,"su":"LG에너지솔루션의 배터리 공장 평균 가동률이 57%를 넘어섰다. 전기차 캐즘(일시적 수요 정체)으로 지난해 50% 아래까지 떨어졌던 가동률이 에너지저장장치(ESS(전기를 저장해 두는 큰 배터리)) 사업 확대와 전기차 배터리 생산 회복에 힘입어 개선되는 모습이다. LG에너지솔루션 폴란드 브로츠와프..."},{"s":"빈패스트의 무제한 마일리지 배터리 보증은 운전의 자유를 보상합니다 – 회사 발표","so":"Financial Times","tm":"11/13 14:08","c":1,"r":"world","u":"https://markets.ft.com/data/announce/detail?dockey=600-202611130008PR_NEWS_USPRX____LA96736-1","p":1794546480,"a":1794553611,"t":"VinFast's Unlimited-Mileage Battery Warranty Rewards the Freedom to Drive – Company Announcement","su":"순자산가치, 성과, 보유 및 부문 가중치, 의결권 변경, 이사 및 거래를 포함한 최신 회사 정보."},{"s":"자체 제작 배터리로 RC카 구동...인하대 미니카 경진대회","so":"한국경제","tm":"11/13 13:45","c":1,"r":"kr","u":"https://www.hankyung.com/article/202611135075h","p":1794545146,"a":1794553606,"su":"AI 추천 뉴스 자체 제작 배터리로 RC카 구동...인하대 미니카 경진대회 대학생이 직접 만든 배터리로 구동하는 미니카 경진대회가 열렸다. 인하대는 이차전지특성화대학사업단이 개최한 미니카 경진대회에 참가한 무선조종 자동차(RC카)의 배터리를 학생들이 직접 설계했다고 13일 밝혔다. 이번 대회는 학생들이 배터리 소재의 특성과 전기화학적 원리를 실제 제품에 적용해 보는 실험실습 차원으로 열렸다. 직접 설계한 배터리로 RC카를 구동하며 설계 조건과 실제 성능의 관계를 이해하고, 제작 과정에서 발생하는 기술적 문제를 해결하는 데 초점을 맞췄다."},{"s":"CATL은 등록 자본금 4억 4600만-36Kr으로 베이징에 Times Beicheng Technology Company를 설립했습니다.","so":"www.36kr.com","tm":"11/13 13:35","c":1,"r":"cn","u":"https://www.36kr.com/newsflashes/4067648557896577","p":1794544509,"a":1794610399,"t":"宁德时代在北京成立时代北成科技公司，注册资本4.46亿-36氪","su":"36Kr은 Tianyancha 앱을 통해 Beijing Times Beicheng Technology Co., Ltd.가 최근 설립되었다는 사실을 알게 되었습니다. 법적 대표자는 Xie Gangyi이며 등록 자본금은 4억 4600만 위안입니다. 사업 범위에는 기계 장비 연구 및 개발, 엔지니어링 및 기술 연구 및 실험 개발, 인공 지능 응용 소프트웨어 개발 등이 포함됩니다. 주주 정보에 따르면 이 회사는 CATL의 자회사인 Times Electronic Services Technology Co., Ltd.가 전액 소유하고 있습니다."},{"s":"센서의 자사 개발을 고집하는 Vaisala 반도체나 전지 제조로 존재감:일본법인이 첫 기자 설명회 개최(1/2 페이지)","so":"EE Times Japan","tm":"11/13 12:30","c":1,"r":"jp","u":"https://eetimes.itmedia.co.jp/ee/articles/2611/13/news068.html","p":1794540600,"a":1794553609,"t":"センサーの自社開発にこだわるVaisala 半導体や電池製造で存在感：日本法人が初の記者説明会開催（1/2 ページ）","su":"핀란드의 계측기기 메이커 Vaisala의 일본법인 바이사라가 일본에서 처음으로 기자 설명회를 개최했다. 바이사라의 대표 이사 사장을 맡은 다카하시 히로유키씨가, Vaisala의 개요나 일본 시장에서의 사업 전개에 대해 말했다."},{"s":"탄산리튬 주계약은 하루 동안 4% 상승했다.","so":"第一财经","tm":"11/13 11:42","c":1,"r":"cn","u":"https://www.yicai.com/news/103439413.html","p":1794537745,"a":1794553607,"t":"碳酸锂主力合约日内涨幅达4%","su":"제일재경 2026-11-13 10:41:06 편집자: Tang Yanbei 탄산리튬의 주요 계약은 하루 동안 4% 상승하여 현재 92,660위안/톤으로 거래되고 있습니다. 전방 수급 반전과 비관적인 시장 기대로 인해 탄산리튬 선물 가격이 급락했고, 업계에서는 고비용 생산 능력 청산과 개편에 속도를 냈다. 메모리 반도체(전자기기의 두뇌 부품) 회사들은 여전히 ​​가격 인상을 의향하고 있지만, PC나 휴대폰 등 가전제품 단말기는 가격 압박에 영향을 받고 있다. 전체 기계업체들은 구매에 있어 보수적인 경향을 보이고 있으며, 메모리반도체 단가 추가 상승 모멘텀(값이 움직이는 기세)도 약화되고 있다. 주요 참가자들은 오늘 늦은 거래에서 이러한 주식을 사고 팔고 있습니다. 비닐렌카보네이트(VC) 가격이 지난주 21% 이상 올랐다. 탄산리튬 가격은 지난해 같은 기간 톤당 8만위안에서 현재 톤당 18만위안으로 올랐다."},{"s":"Fengjing Shares: 회사의 리튬 배터리 제품은 현재 협상 단계에 있습니다.","so":"Jiemian.com","tm":"11/13 11:21","c":1,"r":"cn","u":"https://www.jiemian.com/article/15328713.html","p":1794536478,"a":1794539817,"t":"峰璟股份：公司锂电池产品目前在洽谈阶段","su":"11월 13일 뉴스에 따르면, Fengjing Co., Ltd.는 대화형 플랫폼을 통해 회사의 리튬 배터리 제품이 현재 협상 단계에 있다고 밝혔습니다."},{"s":"배터리 설계부터 주행까지…인하대, 이차전지 인재 키운다","so":"데일리안","tm":"11/13 10:39","c":1,"r":"kr","u":"https://www.dailian.co.kr/news/view/1714604/%EB%B0%B0%ED%84%B0%EB%A6%AC-%EC%84%A4%EA%B3%84-%EC%A3%BC%ED%96%89%EA%B9%8C%EC%A7%80%EC%9D%B8%ED%95%98%EB%8C%80-%EC%9D%B4%EC%B0%A8%EC%A0%84%EC%A7%80-2026","p":1794533940,"a":1794539816,"su":"인하대가 학생들의 이차전지 설계·제작 역량을 높이기 위한 실무형 교육 프로그램을 운영했다.인하대는 이차전지특성화대학사업단이 최근 학생들을 대상으로 배터리 설계부터 제작, 성능 평가까지 직접 수행하는 미니카 경진대회를 개최했다고 13일 밝혔다.이번 대회는 배터리 소재와 전기화학 원리에 대한 이론을 실제 제품에 적용하는 실습 중심으로 진행됐다.학생들이 직접 만"},{"s":"이차전지 특화단지 광양만권 중마동에 ‘두산위브 시그니처 광양’ 이달 분양","so":"동아일보","tm":"11/13 10:00","c":1,"r":"kr","u":"https://www.donga.com/news/amp/all/20261112/135015558/1","p":1794531600,"a":1794539816,"su":"전남 광양시 중마동에 들어서는 ‘두산위브 시그니처 광양’이 이달 중 견본주택을 열고 일반분양에 나선다. 12일 분양업계에 따르면 이 단지는 지상 최고 32층, 총 575세대 규모로 이 중 120세대가 일반분양된다. 전용면적은 66㎡·84㎡&middo…"},{"s":"머리효과는 분명해 파워배터리 업체들의 실적은 엇갈린다.","so":"中证网","tm":"11/13 08:48","c":1,"r":"cn","u":"https://jnzstatic.cs.com.cn/zzb/htmlInfo/d34a74e7566ce54d2059416557985fdb.html","p":1794527280,"a":1794539819,"t":"头部效应明显动力电池企业业绩分化","su":"머리 효과는 분명합니다. 전력배터리 업체들의 실적(회사가 번 돈 성적표)은 엇갈린다. A주 및 홍콩 상장 기업들 사이에서 차량 및 배터리 부문에 대한 3분기 보고서가 많은 관심을 끌었으며 실적 차이는 이 두 부문 기업의 공통된 특징이 되었습니다. BYD, Chery Automobile, Geely Automobile은 각각 223억 4,500만 위안, 139억 6,300만 위안, 139억 2,800만 위안을 달성하여 자동차 회사 수익 목록에서 상위 3위를 차지했습니다. 전원 배터리 부문에서는 CATL이 모회사 순이익(모든 비용을 빼고 남은 돈) 645억3000만 위안으로 1위를 차지했고, 이웨이리튬에너지와 중국혁신항공은 각각 모회사 순이익 52억4000만 위안, 13억6600만 위안을 기록했다. 키워드로 나누어 보면 매출액 기준으로 확고한 업계 선두를 달리고 있는 BYD는 여전히 이익 측면에서 업계 내 가격 경쟁의 압박을 받고 있다. BYD는 1~3분기에 전년도와 기본적으로 동일한 5,663억 4천만 위안의 영업 이익을 달성했습니다. 모회사에 귀속되는 순이익은 223억 4500만 위안으로 전년 동기 대비 4.2% 감소했습니다. 3분기 모기업 순이익은 100억2000만 위안으로 전년 동기 대비 28.08% 증가했다. 판매 측면에서는 해외 판매량이 133만7800개로 전년 동기 대비 91% 증가했다. 팡바오, 덴자, 양왕은 총 41만대가 판매돼 전년 동기 대비 75% 증가했다."},{"s":"Lunar의 새로운 가정용 DC 고속 충전기는 EV 배터리를 작동시킵니다.","so":"Electrek","tm":"11/13 06:41","c":1,"r":"us","u":"https://electrek.co/2026/11/12/lunars-new-home-dc-fast-charger-puts-your-ev-battery-to-work/","p":1794519660,"a":1794523826,"t":"Lunar’s new home DC fast charger puts your EV battery to work","su":"Lunar의 새로운 가정용 DC 고속 충전기는 한 시간 안에 100마일의 주행 거리를 제공하며 정전 시 집에 전력을 공급하여 자동차가 에너지를 회복할 수 있도록 해줍니다."},{"s":"중국 딥시크, 6월에 이어 150억 달러의 거액 조달 텐센트·CATL이 참가","so":"日経クロステック","tm":"11/13 05:00","c":1,"r":"jp","u":"https://xtech.nikkei.com/atcl/nxt/column/18/03065/111100023/?i_cid=nbpnxt_new_top_it_06","p":1794513600,"a":1794523827,"t":"中国DeepSeek、6月に続き150億ドルの巨額調達 テンセント・CATLが参加","su":"중국의 AI(인공지능) 연구기업인 딥시크(딥 시크)은 2026년 10월, 텐센트(텐센트 홀딩스)와 전지 메이커 대기업의 CATL 등이 참여하는 자금 조달(사업에 쓸 돈을 모으는 것)이 약 150억 달러에 달했다고 보도됐다."},{"s":"'훨씬, 훨씬 더 빠르다': 중국의 배터리 교체 전기 트럭이 EV 주행 거리 불안에 대한 해답이 될 수 있을까요?","so":"The Guardian","tm":"11/12 23:48","c":1,"r":"world","u":"https://www.theguardian.com/environment/2026/nov/12/china-battery-swapping-e-trucks-catl-ev-range-anxiety","p":1794494880,"a":1794523828,"t":"‘It is much, much faster’: could China’s battery-swapping e-trucks be the answer to EV range anxiety?","su":"배터리 제조업체 CATL은 2027년 말까지 중국에 2,000개의 교환소를 확보하고 해당 기술을 유럽으로 가져오는 것을 목표로 하고 있습니다."},{"s":"리튬 이온 전지 원인의 화재 방지 오사카 시내의 25 소방서에서 회수 개시에, 12월부터","so":"産経ニュース","tm":"11/12 18:35","c":1,"r":"jp","u":"https://www.sankei.com/article/20261112-QEJUYWX4NRNYLDBRBDSMUJKAWM/","p":1794476122,"a":1794489665,"t":"リチウムイオン電池原因の火災防げ 大阪市内の25消防署で回収開始へ、12月から","su":"리튬 이온 전지가 원인으로 일어나는 화재 방지를 위해 오사카시는 시내 소방서 25곳에서 12월부터 전지 등의 회수를 시작한다고 발표했다. 현재는 시내에 10곳의 환경사업…"},{"s":"전기자전거 리튬배터리에서 연기가 나고 폭발, 오레곤 가옥 불탔다｜#공영TV 뉴스 네트워크 #단편 ｜ 공영TV 뉴스 PNN","so":"公視新聞","tm":"11/12 18:20","c":1,"r":"tw","u":"https://news.pts.org.tw/video/23131","p":1794475202,"a":1794489664,"t":"電動自行車鋰電池冒煙爆炸 美奧勒岡州一房屋遭燒毀｜#公視新聞網 #Shorts ｜ 公視新聞 PNN","su":"🔋리튬 배터리가 폭발하고 미국 가옥이 불타버렸습니다. 미국의 한 가족이 갑자기 담배를 피우고 전기자전거의 리튬 배터리로 인해 불이 붙고 폭발해 오레곤주 2층짜리 주택이 전소되는 일이 발생했습니다. 15세 소년은 현지 ​​언론과의 인터뷰에서 사건 발생 직전에도 잠시 자전거를 탔다고 말했다. 집에 돌아온 그는 리튬 배터리를 충전도 하지 않고 의자 위에 올려두었는데, 얼마 지나지 않아 집에서 이상한 냄새가 났다. 확인 결과, 배터리에서 연기가 나는 것으로 확인됐고, 이후 폭발이 일어나며 불은 빠르게 집안 전체로 번졌습니다. 그 때 그의 어머니는 재빨리 위층 세입자에게 말했는데…"},{"s":"KTR, 광양에 이차전지 소재 실증센터 구축…AI 활용 개발기간 단축","so":"데일리안","tm":"11/12 17:47","c":1,"r":"kr","u":"https://www.dailian.co.kr/news/view/1714380/KTR-%EA%B4%91%EC%96%91-%EC%9D%B4%EC%B0%A8%EC%A0%84%EC%A7%80-%EC%86%8C%EC%9E%AC-%EC%8B%A4%EC%A6%9D%EC%84%BC%ED%84%B0-2026","p":1794473220,"a":1794489657,"su":"전남 광양에 약 189억원을 투입해 인공지능(AI) 기반 이차전지 소재 개발부터 제작과 성능 검증까지 한곳에서 지원하는 실증센터가 2029년 말까지 구축된다.한국화학융합시험연구원(KTR)은 12일 광양시청에서 광양시와 ‘이차전지 소재 산업 거점 육성 인프라 구축을 위한 업무협약’을 체결했다.협약식에는 이승렬 KTR 원장과 박성현 광양시장이 참석했다. 양 기"},{"s":"도레이, 나노 여과막 3 시리즈 투입 사용후 전지로부터 리튬 회수","so":"日本経済新聞","tm":"11/12 17:30","c":1,"r":"jp","u":"https://www.nikkei.com/article/DGXZQOMG00003_S6A111C2000000/","p":1794472234,"a":1794489666,"t":"東レ、ナノろ過膜3シリーズ投入 使用済み電池からリチウム回収","su":"도레이는 고분자 재료에 미세한 구멍이 있는 '나노 여과(NF)막'의 신제품을 출시했다. 산업용도별로 3시리즈를 투입했다. 리튬 추출용 막의 LXM 시리즈는 사용이 끝난 리튬 이온 전지를 재자원화할 때 발생하는 강산성 침출액용 고내산 NF막이다. 리튬 이온을 투과시키면서 니켈, 코발트, 망간, 마그네슘"}]},{"name":"⚡ 전고체배터리·ESS","note":"보유: KODEX 전고체배터리ESS TOP2플러스","breaking":false,"items":[{"s":"국가에너지청 관계자들이 '15차 5개년 신에너지저장장치 이행계획' 기자들의 질의에 답변했다.","so":"Jiemian.com","tm":"11/13 21:26","c":7,"r":"cn","u":"https://www.jiemian.com/article/15332228.html","p":1794572762,"a":1794576145,"t":"国家能源局有关负责同志就《“十五五”新型储能实施方案》答记者问","su":"최근 국가발전개혁위원회와 국가에너지국은 공동으로 '15차 5개년 계획 신에너지저장 시행계획'(이하 '시행계획')을 발표했다. 기자는 국가 에너지 관리국의 관련 책임자 동지들과 인터뷰했습니다. 1. 실시계획을 발표하게 된 배경은 무엇입니까? 답변: 당 중앙위원회와 국무원은 새로운 에너지 저장 장치의 개발을 매우 중요하게 생각합니다. 신에너지저장장치 개발은 3년 연속 '정부사업보고서'에 포함됐다. '국가경제사회발전을 위한 15차 5개년 계획'에서는 신에너지저장장치 개발을 본격화할 것을 제안하고 있으며, 이는 '15차 5개년 계획'에서 신에너지저장장치 개발 방향을 제시한 바 있다."},{"s":"2030년까지 중국의 새로운 에너지 저장 장치 설치 용량은 3억 킬로와트에 도달할 계획입니다.","so":"中国新闻网","tm":"11/13 22:01","c":5,"r":"cn","u":"https://www.chinanews.com.cn/cj/2026/11-13/10731719.shtml","p":1794574910,"a":1794576145,"t":"到2030年中国新型储能装机规模计划达3亿千瓦","su":"2030년까지 중국의 새로운 에너지 저장 장치 설치 용량은 3억 킬로와트에 도달할 계획입니다. 중국신사서비스, 베이징, 11월 13일(왕멍야오 기자) 중국 국가에너지국이 13일 발표한 '15차 5개년 계획 신에너지저장 실행계획'에서는 2030년까지 신에너지저장이 대규모 개발단계에서 시장지향적 발전단계로 진입해 국가 신에너지저장 설치용량이 3억 킬로와트에 달하고 평균 에너지 저장시간은 약 3시간에 달한다는 목표를 세웠다. '이중 탄소' 목표의 지도 하에 중국의 신에너지는 급속히 발전했으며 시스템 피크 조절 및 전원 공급 보장에 대한 압력은 계속해서 높아지고 있습니다. 중요한 유연성 조정 자원으로서 새로운 에너지 저장 장치는 새로운 전력 시스템을 구축하기 위한 객관적인 요구 사항이 되었습니다. 2025년 말까지 중국은 1억 3,600만 킬로와트/3억 5,100만 킬로와트 시간에 달하는 새로운 에너지 저장 장치 설치 용량을 완료하고 가동했습니다."},{"s":"2개 부서: 그리드 측에서 독립적인 신에너지 저장 용량 전기 가격 메커니즘 구축","so":"36氪","tm":"11/13 16:58","c":3,"r":"cn","u":"https://36kr.com/newsflashes/4067858999317376","p":1794556730,"a":1794576147,"t":"两部门：建立电网侧独立新型储能容量电价机制"},{"s":"컴퓨팅 파워의 확장은 파워 반복을 강요하고 있으며, 에너지 저장 증가를 위한 공간이 열리고 있습니다. 업계에서는 2035년에는 전고체전지의 스케일업이 가능할 것으로 예상하고 있다.","so":"36Kr","tm":"11/13 09:41","c":3,"r":"cn","u":"https://www.36kr.com/newsflashes/4067444532614016","p":1794530503,"a":1794539829,"t":"算力扩容倒逼电力迭代，储能增量空间打开，业内预计全固态电池2035年规模化可期","su":"컴퓨팅 파워가 급증하면서 에너지 저장의 가치 경계가 재정의되고 있습니다. 최근 닝보에서 열린 제13회 중국(닝보) 배터리 신에너지 산업 국제 서밋 포럼(ABEC 2026)에서는 컴퓨팅 파워의 물결로 촉발된 인공지능 데이터센터(AIDC) 유통 및 저장 트랙이 청중의 이목을 집중시켰다. 회의에 참석한 전문가들은 AIDC BBU 배터리가 인증 기간에 진입하고 있으며 컴퓨팅 성능에 대한 수요 증가로 인해 전원 공급 장치가 반복되어 에너지 저장을 위한 새로운 증분 공간이 열릴 것이라고 믿었습니다. 이런 배경에서 전고체전지의 대규모 상용화 시기는 2035년이 될 것으로 예상된다. (상하이증권 뉴스)"},{"s":"2개 부서: 리튬이온 배터리 에너지 저장 장치의 반복적 업그레이드를 가속화하고 나트륨 이온 배터리 에너지 저장 장치의 적용을 촉진합니다.","so":"第一财经","tm":"11/13 16:16","c":2,"r":"cn","u":"https://www.yicai.com/news/103439922.html","p":1794554168,"a":1794610448,"t":"两部门：加快锂离子电池储能迭代升级 推广钠离子电池储能应用","su":"국가 발전 개혁 위원회와 국가 에너지 관리국은 \"15차 5개년 계획 새로운 에너지 저장 구현 계획\"을 발표했습니다. 새로운 에너지 저장 혁신 방향의 과학적인 레이아웃을 제안합니다. 리튬이온 배터리 에너지 저장의 반복적 업그레이드를 가속화하고 나트륨 이온 배터리(리튬 대신 소금 성분을 쓰는 배터리) 에너지 저장의 적용을 촉진합니다. 압축공기 에너지 저장장치, 흐름전지 에너지 저장장치, 플라이휠 에너지 저장장치 등을 파일럿 애플리케이션에서 상용 애플리케이션으로 전환을 촉진합니다. 슈퍼커패시터, 압축 이산화탄소 에너지 저장, 액체 공기 에너지 저장, 중력 에너지 저장, 용융염 열 저장과 같은 기술의 시범 적용을 장려합니다. 전고체 배터리(액체 대신 고체를 넣은 안전한 배터리), 히트펌프 전력저장, 열에너지 저장, 수소 에너지 저장 등 첨단 기술 보유량을 지원합니다. 네트워크 기반 에너지 저장 장치의 개발을 더욱 촉진합니다. 시나리오 요구에 따라 네트워크형 에너지 저장 장치의 레이아웃 및 적용을 적극적이고 꾸준히 추진하고, 네트워크형 에너지 저장 기술의 신뢰성과 전력망 지원 능력을 검증하며, 네트워크형 에너지 저장 장치 계획 및 구성, 장비 기술 요구 사항 등 표준 및 사양을 점진적으로 개선합니다."},{"s":"2개 부서: 대용량 및 고출력 배터리 에너지 저장에 대한 연구와 고출력 배터리 에너지 저장 및 슈퍼커패시터의 시범 적용을 촉진합니다.","so":"第一财经","tm":"11/13 16:12","c":2,"r":"cn","u":"https://www.yicai.com/brief/103439907.html","p":1794553920,"a":1794576147,"t":"两部门：研究大容量高比功率电池储能 推动高比功率电池储能、超级电容器试点应用","su":"국가발전개혁위원회와 국가에너지국은 '신에너지저장 실시계획 15차 5개년 계획'을 발표했다. 단기 고주파 전력 에너지 저장 기술 개발을 언급했다. 저비용, 고강도 소재, 고성능 베어링, 실생활 플라이휠 에너지 저장 소재를 개발합니다."},{"s":"테슬라 실적 발표 대본: 로봇 공학, 자율 주행 및 에너지 저장에 크게 투자하고 자본 지출이 계속 확대되고 있습니다.","so":"财联社","tm":"11/15 10:43","c":1,"r":"cn","u":"https://www.cls.cn/detail/2434633","p":1794707026,"a":1794727091,"t":"特斯拉财报会实录：大举押注机器人、自动驾驶与储能 资本开支持续扩张","su":"① 머스크는 실적(회사가 번 돈 성적표)발표에서 테슬라가 \"제2차 세계대전 이후 미국에서 가장 빠른 산업 규모 확장\"을 겪고 있다고 말하고, 올해 자본 지출이 250억 달러를 초과할 것으로 예상되며 향후 2~3년간 계속 증가할 것이라고 거듭 강조했다. ②테슬라 경영진은 휴머노이드(사람을 닮은 로봇) 로봇, 자율주행 택시, 에너지 저장장치, 자체 개발 칩 등 4대 주요 사업을 중심으로 자본 지출을 계속 늘릴 것이라고 밝히며 시장의 핵심 질문에 답했다. 차이롄서, 7월 23일(편집자 Liu Rui) 테슬라는 수요일 동부 표준시 시장 마감 후 2분기 재무 결과를 발표했습니다. 차량 납품 및 에너지저장장치 설치 데이터는 인상적이었지만 분기 매출총이익률 하락과 생산 확대에 대한 높은 투자로 시장 우려가 컸고, 장 마감 후 주가가 하락했다. 머스크 테슬라 최고경영자(CEO)는 실적 보고서 발표 후 컨퍼런스콜에서 “테슬라는 제2차 세계대전 이후 미국에서 가장 빠른 산업 규모 확장을 겪고 있다”며 “올해 자본 지출이 250억 달러를 넘어설 것으로 예상되며 향후 2~3년간 계속해서 성장할 것”이라고 거듭 강조했다."},{"s":"해외조사 및 선정 | 골드만삭스: 글로벌 배터리 수급 비율은 2029년 바닥을 칠 수 있고, 에너지 저장 성장은 초과분을 상쇄하기 어려울 것","so":"财联社","tm":"11/15 05:55","c":1,"r":"cn","u":"https://www.cls.cn/detail/2506034","p":1794689708,"a":1794727317,"t":"海外研选 | 高盛：全球电池供需比或2029年触底 储能增长难抵过剩","su":"① 미국은 전기차 배터리 과잉을 지속하고 있으나, 에너지 저장 배터리의 현지 생산 능력이 부족하다. ② 한국 배터리 업체들의 유럽 시장 점유율은 일부 안정됐지만, 중국의 수입 경쟁은 여전히 ​​치열하다. ③ 국내 배터리셀 제조사들은 2027년과 2028년 이익 전망치를 평균 10% 하향 조정했는데, CATL의 에너지 저장장치 전환이 유망하다. 차이롄서, 10월 15일(편집자 Xia Junxiong) 골드만삭스는 10월 14일 글로벌 배터리 산업 조사 보고서를 발표했습니다. 이는 에너지 저장 시장의 급속한 확장으로 배터리 수요 전망이 개선되고 있지만, 글로벌 배터리 산업은 여전히 ​​과잉 생산 능력, 지역 시장 수급 불균형 및 치열한 시장 경쟁에 직면해 있으며, 이는 업계가 사이클이 바닥을 쳤다는 것을 확인하기에 충분한 신호를 아직 보지 못했다는 것을 의미합니다. 은행은 중국 외 배터리 시장의 수급 공급률은 2027년을 바닥으로, 글로벌 시장은 2029년까지 수급 전환점이 이뤄지지 않을 것으로 내다봤다."},{"s":"화웨이, 새로운 20kW 가정용 배터리로 테슬라 파워월에 도전","so":"Electrek","tm":"11/15 01:25","c":1,"r":"us","u":"https://electrek.co/2026/11/14/huawei-set-to-challenge-tesla-powerwall-with-new-20-kw-home-battery/","p":1794673500,"a":1794698079,"t":"Huawei set to challenge Tesla Powerwall with new, 20 kW home battery","su":"이 하이테크 화웨이 홈 배터리 팩은 실리콘 카바이드 기술, AI 기반 에너지 관리 기능을 갖춘 테슬라의 최신 파워월을 저지하기를 희망합니다."},{"s":"에너지 저장 산업의 글로벌 협력을 촉진하기 위해 글로벌 에너지 저장 동맹 이니셔티브(Global Energy Storage Alliance Initiative) 발표","so":"财新","tm":"11/14 21:37","c":1,"r":"cn","u":"https://companies.caixin.com/2026-11-14/102504955.html","p":1794659820,"a":1794664813,"t":"全球储能联盟倡议发布 推动储能产业全球合作","su":"[Caixin.com] 글로벌 에너지 전환이 심화됨에 따라 새로운 전력 시스템의 핵심 인프라인 에너지 저장 장치는 글로벌 시장에서 꾸준히 수요가 증가하고 있습니다. 국제 교류와 협력을 촉진하는 방법은 중국의 에너지 저장 '세계화'의 다음 초점이 되었습니다. 이러한 배경에서 지난 11월 14일 제31차 유엔기후회의(COP31) 차이나코너에서 수력 및 물 보존 계획 및 설계 종합연구소, 중관촌 에너지저장산업기술연맹, 중국남방그리드에너지저장소(600995.SH)가 국내외 유수 기업들과 함께 글로벌 에너지 저장 동맹 이니셔티브(이하 이니셔티브)를 공동 출범시켰다. 동맹의 행동 방향에는 국제 대화 및 교환 플랫폼 구축, 글로벌 에너지 저장 데이터베이스 및 표준 시스템 구축, 첨단 기술의 연구 개발 및 홍보 강화, 시장 메커니즘 개선 및 비즈니스 모델 혁신 촉진, 공급망(부품·재료가 오가는 연결망) 협력 강화 및 글로벌 무역 발전 촉진, 투자, 자금 조달(사업에 쓸 돈을 모으는 것) 및 프로젝트 협력 촉진이 포함됩니다."},{"s":"에너지저장전지 ETF E펀드 순청약액은 11월 12일 기준 1,300만좌 감소해 전년 대비 36.09% 감소했다.","so":"经济观察网","tm":"11/14 11:49","c":1,"r":"cn","u":"http://www.eeo.com.cn/2026/1114/1092713.shtml","p":1794624540,"a":1794659877,"t":"储能电池ETF易方达11月12日净申购减少1300万份，近一年跌36.09%","su":"경제 관찰자 네트워크 에너지 저장 배터리 ETF(여러 주식을 묶어 파는 상품) E 펀드(159566)는 11월 12일 기준 -1,300만주의 순청약을 기록했으며 이는 이 ETF 펀드 지분의 0.55%를 차지합니다. 펀드의 최근 주식수는 23억5300만주로 상장(주식시장에 처음 들어오는 것) 이후 누적 증가액은 21억3200만주다. 최신 스케일 34...."},{"s":"본토는 새로운 에너지 저장 장치의 시장화를 촉진합니다.","so":"信報網站","tm":"11/14 03:26","c":1,"r":"hk","u":"https://www.hkej.com/dailynews/finnews/article/4565207/%E5%85%A7%E5%9C%B0%E6%8E%A8%E9%80%B2%E6%96%B0%E5%9E%8B%E5%84%B2%E8%83%BD%E5%B8%82%E5%A0%B4%E5%8C%96","p":1794594400,"a":1794610457,"t":"內地推進新型儲能市場化","su":"신흥 기간 산업을 적극적으로 육성하고 새로운 에너지 저장 장치를 적극적으로 개발하기 위해 국가 발전 개혁위원회와 국가 에너지 관리국은 공동으로 \"신 에너지 저장 장치 실행 계획을 위한 15차 5개년 계획\"(이하 \"계획\"이라고 함)을 발표했습니다. 15차 5개년 계획 기간 동안 신에너지 저장을 '대규모 개발'에서 '시장 지향적 개발' 단계로 추진하고 신 에너지 저장을 위한 다양한 응용 시나리오를 구축하며 신 에너지 저장 기술 혁신과 연구를 지원해야 한다고 제안되었습니다. 2030년까지 국가 신에너지 저장장치 설치 용량은 3억kW에 도달하고, 평균 에너지 저장 시간은 약 3시간이 되는 것이 목표다. 허베이의 설치 용량은 2030년까지 3억 킬로와트에 도달할 것으로 예상됩니다. \"계획\"에서는 15차 5개년 계획 기간 동안 새로운 에너지 저장 장치가 주로 시스템의 \"소스 네트워크\" 요구를 충족할 것이라고 지적합니다."},{"s":"美민주당 집권, 에너지저장산업 폭발 기대","so":"信報網站","tm":"11/14 03:20","c":1,"r":"hk","u":"https://www.hkej.com/dailynews/investment/article/4565313/%E7%BE%8E%E6%B0%91%E4%B8%BB%E9%BB%A8%E5%BE%97%E5%8B%A2+%E5%84%B2%E8%83%BD%E7%94%A2%E6%A5%AD%E6%96%99%E7%88%86%E7%99%BC","p":1794594007,"a":1794610460,"t":"美民主黨得勢 儲能產業料爆發","su":"미국 중간선거 이후 민주당은 상원과 하원을 다시 장악했다. 정치 판 전체가 바뀌었을 뿐만 아니라, 공화당의 본거지이자 미국 미래인공지능데이터센터(AIDC)의 중심지인 텍사스의 3선 주지사도 축출됐다. 시장에서는 다수의 AIDC 프로젝트가 전력 공급 계획을 재검토해야 하고 이로 인해 건설 속도가 위장 둔화될 수 있다는 점을 우려하고 있습니다. 중간선거가 시작된 뒤 필라델피아 반도체(전자기기의 두뇌 부품) 지수는 급락했고, AI주도 급락했다. 정책 기울기가 예상되어 많은 주에서 이를 배포하고 있습니다. 이번 중간선거 전체를 돌이켜보면 미국 국민들은 트럼프 대통령이 중동 전쟁을 촉발한 것뿐 아니라, 데이터센터를 대규모로 개발해 인구를 늘린 것에 대해 가장 불만을 품고 있다."},{"s":"퀀텀스케이프, 전고체 배터리 Osprey용 개방형 플랫폼 출시","so":"AutoTechInsight","tm":"11/14 02:49","c":1,"r":"world","u":"https://autotechinsight.spglobal.com/news/5291472/quantumscape-launches-open-platform-for-all-solid-state-batteries-osprey","p":1794592195,"a":1794610464,"t":"QuantumScape launches open platform for all-solid-state-batteries Osprey","su":"퀀텀스케이프는 1,000사이클 내구성과 5분 고속 충전, 저압 작동을 결합한 전고체 배터리(액체 대신 고체를 넣은 안전한 배터리) 플랫폼인 Osprey를 공개하여 QSE 셀을 넘어 기술 로드맵을 확장했습니다."},{"s":"ESS의 다음 단계, 진화하는 에너지 시장을 위한 LG에너지솔루션의 전략","so":"Energy-Storage.News","tm":"11/13 23:14","c":1,"r":"us","u":"https://www.energy-storage.news/the-next-phase-of-ess-lg-energy-solutions-strategy-for-an-evolving-energy-market/","p":1794579249,"a":1794610427,"t":"The next phase of ESS: LG Energy Solution’s strategy for an evolving energy market"},{"s":"납-탄소 에너지 저장 벤치마크 프로젝트가 품질 분쟁에 빠졌고 Jingwei Co., Ltd. 및 기타 자회사가 1억이 넘는 소송을 당했습니다 | 빠른 읽기 공지","so":"财联社电报","tm":"11/13 23:09","c":1,"r":"cn","u":"https://m.cls.cn/detail/2534236","p":1794578948,"a":1794628712,"t":"铅炭储能标杆项目陷质量纠纷 经纬股份子公司等被诉超1亿 | 速读公告","su":"중국금융신문(China Finance News)이 11월 13일 보도했다(뤄이첸 기자) 전력계획 컨설팅업체 징웨이유한공사(301390.SZ)가 소송으로 몸살을 앓고 있다. 수년 전 자사가 전액 출자한 자회사가 참여한 납-탄소 에너지 저장 벤치마크 프로젝트는 배터리 품질 문제로 기소되어 법원에 고소를 당했다. 이로 인해 2026년 1월 17일부터 현재까지 Jingwei Co., Ltd.와 그 두 자회사가 피고인으로 관련된 소송, 중재 및 기타 문제에 관련된 총액은 1억 8백만 위안에 달했습니다. 상장(주식시장에 처음 들어오는 것)회사는 자사의 전액 출자 자회사인 Hangzhou Hongsheng Electric Power Design Consulting Co., Ltd.(이하 \"Hongsheng Electric Power\")가 최근 \"피신청인 통지\"를 받았다고 오늘 발표했습니다. Power Investment Zhejiang Storage (Changxing) Smart Energy Co., Ltd. (이하 \"Power Investment Zhejiang Storage\")는 원고로서 Hongsheng Electric Power를 상대로 소송을 제기했으며 Zhejiang Taihu Energy Valley Technology Co., Ltd. (이하 \"Taihu Energy Valley\")와 Zhejiang Changxing Electrical Engineering Co., Ltd. (이하 \"Changxing Electric\")는 다음 사항으로 인한 방전 손실에 대해 공동으로 보상했습니다. 배터리 품질 문제, 자본 점유 기간 동안의 이자, 배터리 교체 손실, 이 사건으로 인해 지불된 법적 비용 및 기타 비용 총 1억 3백만 위안."},{"s":"저장성: 2026 이우 신에너지 및 에너지 저장 수출 박람회 개막","so":"中国新闻网","tm":"11/13 22:22","c":1,"r":"cn","u":"https://www.chinanews.com.cn/cj/2026/11-13/10731735.shtml","p":1794576155,"a":1794610431,"t":"浙江：2026义乌新能源与储能出口博览会启幕","su":"저장성: 2026 이우 신에너지 및 에너지 저장 수출 박람회가 중국 이우에서 11월 13일 개최됩니다. (Dong Yixin, Gong Shuhong) \"테스트 결과, 태양광 발전소를 5일 이상 청소하지 않으면 발전 수익이 20~30% 직접적인 영향을 받는 것으로 나타났습니다.\" 11월 13일, 2026년 이우 신에너지 및 에너지 저장 수출 박람회가 저장성 이우에서 개막했습니다. 현장에서 후베이의 광전지 지능형 청소 장비 전문 전시업체인 Fang Changsheng은 이렇게 말했습니다. 부스에서는 태양광 스마트 청소장비가 슬라이드레일을 타고 규칙적으로 앞뒤로 미끄러지는 모습을 보였다. 내장된 태양광 패널은 또한 에너지 자급자족을 달성할 수 있어 우간다와 파키스탄의 구매자를 빠르게 끌어 모았습니다. 우간다 바이어인 Sam은 \"이것은 확실히 태양광 발전을 위한 가장 중요한 지원 제품이 될 것이며 우리는 그것에 매우 관심이 있습니다\"라고 말했습니다."},{"s":"새로운 에너지 저장 장치는 새로운 시장화 단계에 진입했으며 '15차 5개년 계획'에서는 3억 kW의 개발 목표를 설정했습니다.","so":"第一财经","tm":"11/13 21:53","c":1,"r":"cn","u":"https://www.yicai.com/news/103440392.html","p":1794574403,"a":1794576149,"t":"新型储能迈入市场化新阶段，“十五五”方案划定3亿千瓦发展目标","su":"11월 13일 국가발전개혁위원회와 국가에너지청은 공동으로 '15차 5개년 계획 신에너지저장 구현계획'(이하 '계획')을 발표했는데, 이 계획에서는 2030년까지 신에너지저장장치가 대규모 개발단계에서 시장지향적 개발단계로 진입할 것임을 명시했다. 국가 신에너지 저장장치 설치 용량은 3억kW에 달하고, 평균 에너지 저장 시간은 약 3시간이 될 전망이다. \"계획\"은 \"15차 5개년 계획\" 기간 동안 신에너지 저장 장치가 주로 시스템의 \"소스, 그리드 및 부하\" 측면의 일중 조정 요구를 충족하고, 신에너지 소비 촉진, 전력 공급 보장, 전력 시스템의 안전하고 안정적인 운영 지원을 위한 신에너지 저장 장치의 적용을 심화하고, 혁신적인 응용 시나리오를 확장하고 신에너지의 비전기적 활용 실천을 지원한다는 전체 요구 사항을 명시합니다. 동시에, 제도적 메커니즘과 비즈니스 모델의 혁신을 가속화해야 하며, 새로운 에너지 저장 장치의 가치를 합리적으로 반영하는 전력 시장 메커니즘과 가격 메커니즘이 더욱 완전해지고, 새로운 에너지 저장 장치의 안정적인 용량 가치가 더 잘 반영될 수 있습니다."},{"s":"마켓 오픈 후 에너지저장 혜택이 옵니다!","so":"21财经","tm":"11/13 20:01","c":1,"r":"cn","u":"https://www.21jingji.com/article/20261113/herald/b9cce244c32cd152cb230552f8976edf.html","p":1794567700,"a":1794576152,"t":"盘后，储能利好来了！","su":"[소개] 국가발전개혁위원회와 국가에너지국은 '15차 5개년 계획 신에너지 저장 실시 계획'을 발표했습니다. 중국 기금 뉴스 기자 Chen Xi 신에너지 저장과 관련하여 좋은 소식이 다가오고 있습니다! 11월 13일 국가발전개혁위원회 공식 홈페이지에는 국가발전개혁위원회와 국가에너지청이 '15차 5개년 계획 신에너지저장 시행계획'(이하 '시행계획')을 발표했다고 밝혔다. \"구현 계획\"에서는 \"15차 5개년 계획\" 기간 동안 새로운 에너지 저장 장치가 전력 시스템, 소스, 그리드, 부하 및 저장의 모든 링크의 통합과 상호 작용을 효과적으로 촉진하고 더욱 다양한 가치를 발휘하며 새로운 전력 시스템 구축을 지원할 것이라고 지적합니다. 2030년까지 신에너지저장장치는 대규모 개발단계에서 시장지향적 개발단계로 전환될 것이다. 국가 신에너지 저장장치 설치 용량은 3억kW에 달하고, 평균 에너지 저장 시간은 약 3시간이 될 전망이다."},{"s":"쉬지 않고 은퇴하고 폐기물을 보물로 전환 - State Grid Nanjing Power Supply Company는 기업의 폐기된 에너지 저장 배터리 재활용을 촉진합니다.","so":"ThePaper.cn","tm":"11/13 19:55","c":1,"r":"cn","u":"https://www.thepaper.cn/newsDetail_forward_34468912","p":1794567324,"a":1794610435,"t":"退而不休 变废为宝——国网南京供电公司推动企业退役储能电池循环利用","su":"11월 11일, State Grid Nanjing Power Supply Company의 Liuhe 전원 공급 서비스 센터 주요 계정 관리자는 난징 공공 Ganfeng 폐기 리튬 배터리 종합 활용 프로젝트의 1단계에 참여하여 전기 안전 검사 및 기술을 수행했습니다."},{"s":"검사관리부터 ESS 진단까지…전기안전 혁신 관통하는 키워드 ‘AI’","so":"전기신문","tm":"11/13 19:17","c":1,"r":"kr","u":"https://www.electimes.com/news/articleViewAmp.html?idxno=374736","p":1794565020,"a":1794628711,"su":"검사관리부터 ESS(전기를 저장해 두는 큰 배터리) 진단까지…전기안전 혁신 관통하는 키워드 ‘AI’ 2026 KESCO 우수사례 경진대회 12-13일 개최…분야별 우수사례 대상 선정 업무 효율화부터 설비 진단·정보 전달까지…현장 개선 경험 공유·확산 우리 일상에 자리 잡은 인공지능(AI)이 이제 전기안전 현장의 혁신을 관통하는 핵심 키워드로 떠오르고 있다. 검사·점검 관
