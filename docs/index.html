지 저장 셀의 \"규정 준수 프리미엄\"을 몇 년 동안 유지할 수 있습니까? -36Kr","so":"36kr","tm":"11/20 16:17","c":1,"r":"cn","u":"https://www.36kr.com/p/4077533371258754","p":1795159072,"a":1795175827,"t":"三星SDI锁单16GWh，美国储能电芯的“合规溢价”还能给中国厂商留几年？-36氪","su":"삼성SDI는 16GWh 수준으로 잠긴다. 중국 제조업체는 미국 에너지 저장 셀의 \"규정 준수 프리미엄\"을 몇 년 동안 유지할 수 있습니까? 삼성 SDI signed a long-term LFP order with the US Reserve, and the FEOC compliance threshold has been rising year by year. The North American compliance premium window for Chinese manufacturers is about 2027-2029, and is expected to narrow after that. Foresight Energy noticed that the deal announced by 삼성 SDI on November 16 was not complicated: the US subsidiary signed a contract with Jupiter Power, a subsidiary of 블랙록, to supply 16GWh lithium iron phosphate batteries from 2029 to 2031. The contract is estimated to be about 5 billion yuan, all produced at the StarPlus factory in Indiana. Taking into account previous agreements, the cumulative amount locked by both parties is approximately 27GWh."},{"s":"격차는 4.4배에 이르며 에너지저장장치 입찰과 설치가 가속화되고 있다.","so":"经济观察网","tm":"11/20 15:42","c":1,"r":"cn","u":"https://www.eeo.com.cn/2026/1120/1097760.shtml","p":1795156942,"a":1795175828,"t":"落差达4.4倍 储能招标与装机加速背离","su":"2026년 1월부터 9월까지 중국 국내 에너지저장산업 입찰 규모는 451.9GWh로 전년 동기 대비 48% 증가했지만, 신규 설치된 용량은 102.3GWh로 6% 증가에 그쳐 둘 사이의 격차가 약 4.4배에 달했다. 시기적 지연 외에도 수익모델 변화, 전력망 지원 병목현상, 해외 고마진 전환 등의 요인으로 전환 어려움이 가중됐다. 최근 기한이 지난 프로젝트가 여러 곳에서 청산되고 종이 주문으로 인해 실물 자산이 밀려나고 있습니다. 2027년 전력망 연결 규모를 늘릴 수 있을지 여부는 전력 가격 메커니즘의 시행과 자본 비용 개선에 달려 있다."},{"s":"중국 CATL 미국 '독립 전력망' AI 데이터센터 노린다, K배터리 3사 ESS 시장 경쟁력 촉각","so":"비즈니스포스트","tm":"11/20 15:41","c":1,"r":"kr","u":"https://www.businesspost.co.kr/BP?command=article_view&num=452525","p":1795156896,"a":1795226172},{"s":"ESS로 활로 찾은 K배터리..공장 가동률 회복세 접어들어 - 머니투데이","so":"머니투데이","tm":"11/20 15:25","c":1,"r":"kr","u":"https://www.mt.co.kr/amp/industry/2026/11/20/2026112014354645196","p":1795155906,"a":1795175825,"su":"국내 배터리업계가 에너지저장장치(ESS(전기를 저장해 두는 큰 배터리)) 시장 성장 등에 힘입어 생산시설 가동률을 끌어올리고 있다. 내년부터는 북미 지역 생산거점에서 ESS용 배터리 생산라인이 본격 가동되면서 회복세가 더욱 뚜렷해질 것이란 전망이 나온다."},{"s":"'2026년 중국 전고체전지 산업 발전 블루북' : 2030년 전고체전지 출하량의 약 20% 차지","so":"21财经","tm":"11/20 15:08","c":1,"r":"cn","u":"https://www.21jingji.com/article/20261120/herald/ed8e272e3d94dfb487633c8049aced63.html","p":1795154880,"a":1795158263,"t":"《2026中国固态电池行业发展蓝皮书》：2030年全固态电池占总出货量约20%","su":"11월 20일 개최된 제11차 파워 배터리 응용 국제 정상회의에서 '2026년 중국 전고체 배터리(액체 대신 고체를 넣은 안전한 배터리) 산업 발전 블루북'이 공식적으로 발표되었습니다. 보고서는 2026년부터 2027년이 전고체전지 파일럿 라인의 중앙 집중식 완성 및 운영을 위한 핵심 기간이라고 언급했습니다. 중국은 총 20개 이상의 파일럿 라인을 건설 및 건설 중이며 단일 라인 생산 능력은 0.2GWh에서 2GWh에 이르며 기술 경로는 황화물, 산화물, 할로겐화물의 세 가지 주요 시스템을 포괄합니다. 2027년에는 선도 기업들이 약 2.3GWh의 설치 용량으로 소규모 배치 차량급 배송을 시작할 예정입니다. 2028년부터 2029년까지는 수율이 증가하고 비용이 감소함에 따라 대규모 생산 능력 확장 단계에 진입하게 됩니다. 2030년 중국 전고체전지 출하량은 21.9GWh로 전체 출하량의 약 20%를 차지할 것으로 예상된다."},{"s":"에너지 저장 정책은 장기적으로 좋습니다. Southern Fund의 신에너지 ETF Southern(516160)이 추적하는 기본 지수는 어제 1.29% 하락으로 마감했습니다.","so":"Jiemian.com","tm":"11/20 12:14","c":1,"r":"cn","u":"https://www.jiemian.com/article/15353677.html","p":1795144475,"a":1795158264,"t":"储能政策长期利好，南方基金旗下新能源ETF南方(516160)跟踪标的指数昨日收跌1.29%","su":"2026년 11월 19일 거래 마감 현재, 신에너지 ETF(여러 주식을 묶어 파는 상품) Southern(516160)은 거래량 7724.44만 건으로 2.69% 손이 바뀌었고, 추적 기초 지수인 CSI New Energy Index(399808.SZ)는 1.29% 하락했습니다."},{"s":"SK온, 25년 장주기 제주 ESS 사업 도전","so":"디일렉","tm":"11/20 11:39","c":1,"r":"kr","u":"https://www.thelec.kr/news/articleView.html?idxno=65705","p":1795142345,"a":1795226172,"su":"SK온이 리튬인산철(LFP) 배터리를 앞세워 제주 에너지저장장치(ESS(전기를 저장해 두는 큰 배터리)) 장기계약 시장에 도전한다. 통상 15년 안팎인 리튬이온 배터리의 운용기간을 25년까지 늘"},{"s":"중개 아침회의 하이라이트: 새로운 에너지 저장 장치 \"15차 5개년 계획\" 시행, 3억 킬로와트, 새로운 시장화 단계 정립","so":"财联社","tm":"11/20 11:28","c":1,"r":"cn","u":"https://www.cls.cn/detail/2537312","p":1795141697,"a":1795158268,"t":"券商晨会精华：新型储能“十五五”方案落地，3亿千瓦锚定市场化新阶段","su":"화타이증권은 새로운 에너지 저장을 위한 '15차 5개년 계획'이 구현되었으며 3억 킬로와트가 새로운 시장화 단계를 정립했다고 믿습니다. Zhongtai Securities는 Ciyuan이 새로운 기회를 찾기 위해 해외로 나갈 것이라고 믿습니다. CITIC건설투자는 해외 컴퓨팅파워 투자가 지속적으로 확대될 것으로 보고 27년간 수요 연속성과 공급 납품에 중점을 둘 것이라고 밝혔다. Cailian News Agency는 11월 18일에 시장이 상승한 후 장 후반에 소폭 반등(내렸다가 다시 오르는 것)했다고 보도했습니다. GEM지수는 1% 넘게 하락했다. 이전에는 거의 1% 상승했습니다. 과학기술혁신50지수는 장 초반 3% 이상 상승했다. 상하이·선전 증시 거래액은 1조4600억원으로 전 거래일보다 268억원 감소했다. 전체 시장에서 4,100개 이상의 주식이 하락했고, 거의 80개 주식이 제한 아래에 있었습니다. 시장에서는 테마 회전이 약하고 칩 산업 체인이 활발하며 가전 부문이 반복적으로 활성화되고 화웨이의 컴퓨팅 파워 개념이 부분적으로 강력합니다. 단점으로는 물리 AI 개념이 계속 하락하고 AI 만화 개념이 더 낮아지며 많은 주식이 제한적이라는 것입니다. 장을 마감한 시점에서 상하이 증권거래소 지수는 0.5% 하락했고, 선전 구성요소 지수는 0.49% 하락했으며, 차이넥스트 지수는 1.2% 하락했다."},{"s":"“영화 9년도를 향한 발전·축전 설비에 대한 세제 우대·보조금”이라고 제목을 붙여, 주식회사 KKR 컨설팅","so":"毎日新聞","tm":"11/20 10:53","c":1,"r":"jp","u":"https://mainichi.jp/articles/20261120/pr2/00m/020/121000c","p":1795139586,"a":1795215182,"t":"「令和9年度に向けた発電・蓄電設備に対する税制優遇・補助金」と題し、株式会社KKRコンサルティング 山田純也税理士事務所 山田 純也氏/池田 美香氏によるセミナーを2026年12月22日(火)開催!!（PR TIMES）"},{"s":"베트남의 새로운 녹색 에너지 스타트업은 자금 부족에 직면해 있습니다. 대만 사업가: 대만의 스마트 에너지 저장 기술이 변화를 도울 것입니다","so":"中央社 CNA","tm":"11/20 10:39","c":1,"r":"tw","u":"https://netzero.cna.com.tw/news/202611200040/","p":1795138743,"a":1795144495,"t":"越南綠能新創陷融資荒 台商：台灣智慧儲能技術有助轉型","su":"베트남은 에너지 전환을 적극적으로 추진하고 있지만 최신 보고서에 따르면 지역 기후 기술 혁신이 심각한 자금 조달(사업에 쓸 돈을 모으는 것) 격차에 빠진 것으로 나타났습니다. 지난해 전체 자금조달 규모는 절반으로 줄었고, 사업확장을 위한 핵심 자금조달도 그대로 사라졌다. 녹색 에너지 야망은 재정적 병목 현상에 직면해 있습니다. 대만 사업가 Chien Chi-ming은 대만이 기후 기술 분야에서 우위를 점하고 있으며 스마트 에너지 저장 기술이 베트남이 새로운 에너지를 촉진하는 데 도움이 될 것이라고 말했습니다."},{"s":"파워엑스---반락, 중동만안지역에서 축전시스템의 공동판매를 위한 제휴도","so":"株探","tm":"11/20 10:16","c":1,"r":"jp","u":"https://kabutan.jp/news/marketnews/?b=n202611200494","p":1795137360,"a":1795219464,"t":"パワーエックス---反落、中東湾岸地域で蓄電システムの共同販売に向け提携も"},{"s":"화타이증권: 허난성의 새로운 사용 시간 전기 가격 정책에 대한 의견을 구하면 에너지 저장 프로젝트에 이익이 될 수 있음","so":"第一财经","tm":"11/20 10:14","c":1,"r":"cn","u":"https://www.yicai.com/news/103447386.html","p":1795137282,"a":1795144493,"t":"华泰证券：河南分时电价新政征求意见 储能项目或受益","su":"제일재경 2026-11-20 09:12:34 편집자: Tang Yanbei 화타이증권 연구 보고서에 따르면 허난성 개발 개혁 위원회는 11월 16일 \"우리 성의 산업 및 상업을 위한 사용 시간 전기 가격 정책 최적화 및 개선에 관한 고시\"에 대한 의견을 공개적으로 모집하고 사용 시간 변동 가격에 시스템 운영 비용을 포함하고 송배전 가격을 이전하고 확립할 계획이라고 밝혔습니다. 피크 및 밸리 기간 동안의 연간 동적 조정 메커니즘. 저장(Zhejiang), 산둥(Shandong), 산시(Shaanxi)에 이어 허난(Henan)은 시스템 운영 비용에 대한 사용 시간 가격 책정을 추가로 조사하며, 이는 현지 가격 메커니즘이 에너지 저장 및 충전 비용 상승에 점차적으로 대응하고 있음을 반영합니다. 최저점 기간 동안의 비용 하락은 에너지 저장 운영의 경제성을 향상시킬 것으로 예상됩니다. 최근 국가의 에너지저장장치(전기를 저장해 두는 큰 배터리) 건설 지원 정책과 탄산리튬 가격 하락으로 인해 에너지저장 수요는 더욱 늘어날 것으로 예상된다."},{"s":"Xijiao International(01765)은 5,390만 위안을 지출하여 태국 태양광 발전 설치 및 에너지 저장 솔루션 제공업체의 지분 51%를 인수했습니다.","so":"etnet 經濟通","tm":"11/20 09:19","c":1,"r":"hk","u":"https://www.etnet.com.hk/www/tc/news/news-article.php?section=categorized&category=company&newsid=20261120978","p":1795133940,"a":1795144497,"t":"希教國際(01765)斥5390萬元，收購泰國光伏安裝及儲能解決方案商51%股權","su":"2026/11/20 08:19 Xijiao International Holdings(01765)는 RMB 5,390만 달러를 지출하여 태국의 태양광 발전 설치 및 에너지 저장 솔루션 제공업체의 지분(회사를 나눠 가진 몫) 51%를 인수했습니다. Xijiao International Holdings(01765)는 DINGLI & SF SOLAR ENERGY COMPANY LIMITED의 지분 51%를 RMB 4,614만 달러에 인수했다고 발표했습니다. (약 5,390만 홍콩달러). 그룹은 DINGLI가 태국에 등록된 회사로 태양광 발전 및 기타 신에너지 프로젝트의 설계, 설치, 유지 관리 및 관리뿐만 아니라 에너지 저장 솔루션을 제공하는 회사라고 지적했습니다. 올해 8월말 현재 연간 164만바트의 적자(쓴 돈이 번 돈보다 많은 것)를 냈다. 그룹 측은 이번 인수가 동남아 신재생에너지 분야 진출과 사업영역 확장을 위한 전략적 기회를 제공한다고 밝혔다. 매도인은 Gaoli가 통제하는 법인이고 Gaoli는 그룹의 지배주주이자 전무이사인 Wang Huiwu가 설립한 취소 불가능한 가족 신탁인 Maysunshine Trust의 수혜자 중 한 명이므로 이번 인수는 연결된 거래로 간주되며 독립적인 주주 승인 요건이 면제됩니다."},{"s":"CITIC 증권: 비용 절감 및 이익 증대, 중국 국내 독립 에너지 저장 장치 경제 전환점이 다가오고 있습니다.","so":"Jiemian.com","tm":"11/20 09:16","c":1,"r":"cn","u":"https://m.jiemian.com/article/15352807.html","p":1795133762,"a":1795144494,"t":"中信证券：降本增利，国内独立储能经济性拐点将至","su":"CITIC Securities 연구 보고서에 따르면 2026년부터 새로운 에너지 저장 장치의 비용 측면과 수익 측면이 동시에 압박을 받고 있습니다. 탄산리튬 가격 인상으로 배터리 셀 비용이 증가했고, 시스템 운영비 증가로 매출(물건을 판 돈 전체) 손실이 발생했다. 중국 국내 프로젝트의 전반적인 경제 상황은 압박을 받아왔습니다. 이는 2026년 중국 국내 대용량 스토리지 설치 용량에 어느 정도 영향을 미쳤습니다. CESA에 따르면 2026년 첫 9개월 동안 중국 국내 신규 설치 용량은 111GWh로 전년 대비 87% 증가했다. 현 단계에서는 탄산리튬 가격이 2026년 5월 고점 대비 톤당 10만위안 이상 하락해 배터리 셀 원가도 하락할 여지가 있다. 시스템 운영 비용 공유 메커니즘의 최적화는 새로운 에너지 저장을 위한 \"15차 5개년 계획\"에 기록되었습니다. 중국의 많은 지방에서는 계곡 구간에서 충전할 때 새로운 에너지 저장 장치의 충전 비용을 줄이기 위해 시스템 운영 비용을 시분할 변동에 통합하는 정책을 연속적으로 발표했습니다. 중국의 새로운 국내 에너지 저장 프로젝트의 경제성이 미래에 뚜렷한 한계 개선을 볼 것이라고 판단하고, 새로운 에너지 저장 산업 체인에 대해 낙관적이며, 먼저 혜택을 받을 대규모 에너지 저장 통합업체를 추천하는 데 중점을 두고, 설치 용량 증가로 인한 리튬 배터리 및 재료에 대한 수요 증가에 주의를 기울입니다."}]},{"name":"🏭 AI 전력","note":"보유: ACE 코리아AI전력TOP10","breaking":false,"items":[{"s":"ASEAN 전력망 프로젝트가 주목받고 있음 싱가포르는 지역 경제 성장을 촉진하기 위해 투자 유치를 희망 | 글로벌 금융 | 글로벌","so":"UDN","tm":"11/20 17:52","c":3,"r":"tw","u":"https://udn.com/news/story/6811/9891696","p":1795164753,"a":1795175842,"t":"東協電網計畫受矚新加坡盼吸引投資促區域經濟成長| 全球財經| 全球","su":"아세안 전력망 계획과 비전이 주목받고 있다. 에너지 및 산업을 담당하는 싱가포르 통상산업부 장관 Tan Shilong은 ASEAN 회원국 간의 전력 거래는 국가가 전력 공급을 보장하는 데 도움이 될 뿐만 아니라..."},{"s":"효성중공업 사무직노조, 파업 중 사측 임단협 제시안 거부","so":"연합뉴스","tm":"11/20 15:56","c":3,"r":"kr","u":"https://www.yna.co.kr/view/AKR20261120133100052","p":1795157797,"a":1795158279,"su":"(창원=연합뉴스) 박영민 기자 = 조합원 1천300여명이 전면 파업 중인 효성중공업 사무기술직 노동조합이 사측의 올해 임금·단체협약(임단협) 1..."},{"s":"알렉시스, 데이터센터 건설과 반도체 공장 증설로 수혜 130억위안 수주 보유","so":"UDN","tm":"11/21 02:54","c":2,"r":"tw","u":"https://udn.com/news/story/7252/9892175","p":1795197288,"a":1795215197,"t":"亞力在手訂單130億元 受惠資料中心建置、半導體擴廠","su":"얄리(1514)가 어제(20일) 기자회견을 열었다. Yali는 AI 데이터 센터 건설, 국내외 반도체(전자기기의 두뇌 부품) 공장 확장, Taipower의 전력망 강화 계획 덕분에 전력 장비에 대한 수요가 계속 뜨거워지고 있다고 말했습니다. 현재 수주액은 130억 위안에 달해 향후 모멘텀(값이 움직이는 기세)이 확보돼 있다."},{"s":"중국 본토, 연말 이전에 세계 최초의 육상 기반 SMR 출시 및 상업 이전 달성 | 본토 정치 및 경제 | 양안","so":"經濟日報","tm":"11/20 22:11","c":2,"r":"tw","u":"https://money.udn.com/money/story/5603/9892174?from=edn_related_storybottom","p":1795180302,"a":1795215202,"t":"中國大陸年底前將啟動全球首座陸上SMR，並達成商轉 | 大陸政經 | 兩岸","su":"중국 본토의 '링룽 1호' 소형모듈원자로(SMR)가 올해 말 이전에 발사돼 상업운전에 들어갈 것으로 예상된다. 그러면 이 원자로는 완전한 상업 운전에 들어가는 세계 최초의 육상 소형 가압경수로가 될 것이며, 이는 SMR 원자력 분야에서 중국의 발전이 미국을 능가했음을 입증할 것입니다."},{"s":"보도자료: 후쿠시마현 후타바초의 분산형 AI 데이터 센터가 2026년 12월 16일 준공(예정)(PR TIMES)","so":"毎日新聞","tm":"11/20 16:54","c":2,"r":"jp","u":"https://mainichi.jp/articles/20261120/pr2/00m/020/792000c","p":1795161246,"a":1795175847,"t":"プレスリリース：福島県双葉町の分散型AIデータセンターが2026年12月16日竣工（予定）（PR TIMES）","su":"～일본 아시아투자와의 합작회사가 사업을 추진, 당사가 GPU서버의 설치·운용을 담당～"},{"s":"미국 상원, 데이터 센터가 전력망 업그레이드 비용을 지불하도록 요구하는 에너지 라이센스 개혁 법안 통과","so":"UDN","tm":"11/20 15:47","c":2,"r":"tw","u":"https://udn.com/news/story/6813/9891393","p":1795157241,"a":1795158281,"t":"美參院通過能源許可改革法案 資料中心須自付電網升級","su":"미국 상원은 오늘 대규모 에너지 및 인프라 건설에 대한 검토를 가속화하고 데이터 센터가 자체 전력 비용을 지불하도록 요구하는 에너지 라이센스 개혁 법안을 정당 전체에서 통과시키기 위해 62대 33으로 투표했습니다."},{"s":"Liu Wenxiong: 업계에는 다양한 분야에 걸쳐 T자형 인재가 필요합니다. 전력안정을 위해서는 재정적 지원이 필요하다 | 산업경제학","so":"中央社 CNA","tm":"11/20 15:11","c":2,"r":"tw","u":"https://www.cna.com.tw/news/afe/202611200106.aspx","p":1795155060,"a":1795158283,"t":"劉文雄：產業需跨領域T型人才電力穩定度需資金支持| 產經","su":"Power Grid 인재 개발 연합 장학금 및 Liu Shusheng 기념상 시상식이 오늘 거행되었습니다. 대만전력에너지공학협회 명예회장 Liu Wenxiong은 전기가 인공지능(AI) 컴퓨팅 능력을 뒷받침할 뿐만 아니라 산업 발전의 핵심이라고 말했습니다. 앞으로는 전문적 역량과 크로스필드 역량을 모두 갖춘 'T형 인재'가 필요하다. 그는 추모상과 장학금을 통해 더 많은 우수한 인재들이 전력산업에 진출할 수 있기를 기대하고 있다."},{"s":"[단독] 효성重, AI 전력난 뚫을 '게임 체인저'⋯반도체 변압기 전담팀 띄웠다 [차세대 전력망戰]","so":"이투데이","tm":"11/23 05:00","c":1,"r":"kr","u":"https://www.etoday.co.kr/news/view/2650523","p":1795377600,"a":1795389932,"su":"중공업연구소 내 SST TFT 신설, 핵심 인력 재배치22.9kV급 개발 이어 고압 대응 제품 연구개발 추진전력기기·ESS(전기를 저장해 두는 큰 배터리) 연계해 AI 데이터센터(컴퓨터 수만 대를 모아 둔 건물) 종합 솔루션"},{"s":"공장 적용부터 고객 선정까지…국내외 SST 사업화 경쟁 [차세대 전력망戰]","so":"이투데이","tm":"11/23 05:00","c":1,"r":"kr","u":"https://www.etoday.co.kr/news/view/2650526","p":1795377600,"a":1795389932,"su":"LS일렉트릭 DC팩토리 운영…HD현대일렉트릭도 개발 나서GE버노바, 옥외형 공급업체 선정…이튼·지멘스도 상용화 가세AI 데이터센터(컴퓨터 수만 대를 모아 둔 건물)용 반도체(전자기기의 두뇌 부품) 변압기(SST"},{"s":"미국 AI 데이터센터, 전력 연결 가속화 계획, 2개 주요 전력망 개혁 검토 제출","so":"DIGITIMES","tm":"11/23 03:40","c":1,"r":"tw","u":"https://www.digitimes.com.tw/tech/dt/n/shwnws.asp?id=0000775529_PVC63JJ716H7UNLAMJUTT","p":1795372800,"a":1795389935,"t":"美AI資料中心拚加快接電 兩大電網改革送審","su":"미국에서는 인공지능(AI) 데이터센터(컴퓨터 수만 대를 모아 둔 건물) 구축에 대한 수요가 계속 늘어나고 있지만, 일부 지역에서는 전력망 확장과 신규 전력공급 속도가 이를 따라가지 못해 산업 확장의 중요한 병목 현상이 되고 있다. 미국 지역전력망 운영업체인 PJM과 캘리포니아독립시스템배치기구(CAISO)는 최근 대규모 전력시설에 대한 전력망 연결 개혁을 제안했다. 그리드 연결 연구 기간을 단축하고 조건부 전력 연결을 사전에 개방함으로써 속도를 높일 수 있기를 희망합니다."},{"s":"'타이밍 불일치': 데이터 센터 전력 수요는 매년 19% 증가하고 있습니다. 그리드는 2% 성장하고 있다","so":"Fortune","tm":"11/23 01:34","c":1,"r":"us","u":"https://fortune.com/2026/11/22/ai-data-centers-power-grid-capacity/","p":1795365240,"a":1795389933,"t":"A ‘mismatch in timing’: Data center power demand is growing 19% a year. The grid is growing 2%","su":"보험 중개인인 Howden은 데이터 센터의 전력 수요가 2000년 이후 그리드보다 10배 빠르게 증가했다는 사실을 발견했습니다. 유권자들은 압박을 강화했고 Big Tech는 자체 가스 공장으로 눈을 돌리고 있습니다."},{"s":"AI 데이터센터 전력 증강에 편승한 3가지 주식","so":"Yahoo Finance","tm":"11/23 01:07","c":1,"r":"us","u":"https://finance.yahoo.com/markets/stocks/articles/3-stocks-riding-ai-data-160704018.html","p":1795363624,"a":1795389934,"t":"3 Stocks Riding The AI Data Center Power Buildout","su":"스페이스X는 740억 달러 이상의 AI 중심 데이터 센터 캠퍼스를 계획하면서 전력, 물, 그리드 용량을 주목받게 되었고 이는 상장(주식시장에 처음 들어오는 것) 유틸리티에 곧바로 파급됩니다. AI 컴퓨팅을 공급하기 위한 경쟁은 누가 주스를 공급하고 누가 정치적 열기를 전달하는지에 따라 승자와 후발자를 만들 수 있습니다. 이 글은 해당 스토리에 노출된 세 가지 주식을 분석하고 해당 주식의 역할이 무엇인지 설명합니다."},{"s":"전기가 곧 경쟁력이다! Taipower: 타이난 시가 \"Greater Nanke\"의 전력 소비 증가를 지원하기 위해 자체 전력을 강화할 수 있기를 바랍니다 | 금융 포커스 | 산업경제학","so":"UDN","tm":"11/22 22:59","c":1,"r":"tw","u":"https://udn.com/news/story/7238/9895106","p":1795355989,"a":1795356526,"t":"電力是競爭力！台電：盼台南市增加自有電力支撐「大南科」用電成長| 財經焦點| 產經","su":"첨단 제조 공정의 도입으로 '대타이난 과학단지'의 전력 소비량은 계속해서 증가하고 있습니다. 타이파워는 “전력은 국가의 힘이자 도시의 경쟁력”이라고 주장한다. 그러나 타이난시는 현재 Nanke의 안정적인 전력 공급의 중추로서 총 110만 킬로와트에 달하는 센바 1단계와 2단계만 보유하고 있습니다. 나머지는 Xingda 발전소의 자금 지원에 의존합니다. Taipower는 계획된 Senba 3단계 민간 발전소(IPP)를 포함하여 타이난 시에서 자체적으로 안정적인 전력 공급을 개발하기 위해 노력하고 있습니다."},{"s":"백악관은 '현지화'를 추진하고 싶어하지만 지방선거에서 적신호가 켜졌다. 미국의 AI 데이터센터 구축이 곧 제동을 걸 것인가?","so":"第一财经","tm":"11/22 19:02","c":1,"r":"cn","u":"https://www.yicai.com/news/103449268.html","p":1795341764,"a":1795351430,"t":"白宫欲推“本土化”，地方选举却亮红灯：美国AI数据中心建设要踩刹车了吗？","su":"시장은 미국의 인공지능(AI) 인프라 개발이 직면한 역풍을 재현하고 있습니다. 현지 시간으로 지난 11월 20일, 트럼프 미국 대통령은 APEC 정상회담을 마친 뒤 백악관 기자회견에서 미국 기업이 해외에 데이터센터(컴퓨터 수만 대를 모아 둔 건물)를 짓는 것이 허용되지 않고, 그렇지 않으면 '거대한 세금'이나 '거대한 벌금'을 물게 될 것이라고 밝혔다. 그러나 트럼프 대통령은 이 아이디어가 그의 팀과 충분히 논의되지 않았으며 현재 공식적인 행정 명령이나 구체적인 세율 세부 사항이 없다는 점도 인정했습니다. 지난 11월 초 미국 중간선거 결과가 발표된 뒤 미국 증시 AI 부문은 지역 차원의 데이터센터에 대한 거센 반발로 급격한 조정을 겪었다. 지난 한 달간 11월 22일 기준 나스닥(미국 기술 회사들이 많은 주식시장) 지수는 13% 하락했고, 엔비디아 주가는 41% 가까이 하락했고, AMD 주가는 16% 이상 하락했다."},{"s":"AI 전력망 호황에 대형 변압기 수출 31% 증가…소형은 39% 급감","so":"한국경제","tm":"11/22 18:10","c":1,"r":"kr","u":"https://www.hankyung.com/article/2026112224611","p":1795338615,"a":1795351428,"su":"AI 전력망 호황에 대형 변압기 수출 31% 증가…소형은 39% 급감, 한경Aicel K변압기 수출 양극화 데이터센터(컴퓨터 수만 대를 모아 둔 건물)發 초고압 수요 폭증 북미 변전소에 2030년까지 납품 대형 수출, 이미 작년 실적(회사가 번 돈 성적표) 넘어서 소형 변압기 가격&middot;납기 경쟁 격화 제룡전기 상반기 美매출 41% 감소"},{"s":"회장님 한마디/2027년에는 AI 붐이 거세질까? Delta Electronics의 Zheng Ping: 데이터 센터는 한두 시즌 동안 구축되지 않았지만 주문 가시성은 여전히 높습니다.","so":"經濟日報","tm":"11/22 10:00","c":1,"r":"tw","u":"https://money.udn.com/money/story/124921/9892511","p":1795309250,"a":1795351432,"t":"董事長的一句話／2027年AI景氣還能旺？台達電鄭平：資料中心不是蓋一兩季 訂單能見度仍高","su":"Delta Electronics(2308)는 AI 서버 전원 공급 장치 분야의 세계 선두 기업입니다. Zheng Ping 회장은 최근 몇 년간 Delta Electronics의 주요 성장 모멘텀(값이 움직이는 기세)은 AI 데이터 센터의 지속적인 확장에서 비롯되었다고 말했습니다. 하지만 데이터센터(컴퓨터 수만 대를 모아 둔 건물) 구축은 1~2분기가 아니라 수년이 소요된다. 자재 부족, 전력 부족, 인력 부족 등의 요인으로 인해 \"전체적인 주문 가시성은 여전히 매우 높습니다.\""},{"s":"美 설비 부족…HD현대·효성·LS, K-전력기기 '동맹국 프리미엄' 정조준","so":"파이낸셜포스트","tm":"11/22 08:05","c":1,"r":"kr","u":"https://www.financialpost.co.kr/news/articleView.html?idxno=302346","p":1795302300,"a":1795303173,"su":"인공지능(AI) 데이터센터(컴퓨터 수만 대를 모아 둔 건물) 및 전기자동차(EV) 확산으로 미국의 전력 수요가 급증하면서 내년부터 전력망 지원 설비(GSE) 공급난이 본격화할 것이라는 경고가 나왔"},{"s":"대동(Tatung)의 9월 매출은 전년 동기 대비 13% 감소했으며 전력 인프라 건설에서 AI 컴퓨팅 성능을 지속적으로 심화하고 있습니다.","so":"經濟日報","tm":"11/22 02:14","c":1,"r":"tw","u":"https://money.udn.com/money/story/5612/9810044?from=edn_next_story","p":1795281296,"a":1795334553,"t":"大同9月營收年減13%　持續深化電力基礎建設AI算力","su":"대동(Tatung)은 오늘 9월 연결 매출(물건을 판 돈 전체)이 NT$36억 8,700만으로 전년 동기 대비 13.29% 감소했다고 발표했습니다. 첫 9개월 동안의 통합 수익은 NT$362.5억으로 연간 NT$2.1 감소했습니다."},{"s":"데이터 센터와 그리드 간의 조화 추구","so":"POWER Magazine","tm":"11/21 23:47","c":1,"r":"us","u":"https://www.powermag.com/blog/seeking-harmony-between-data-centers-and-the-grid/","p":1795272470,"a":1795278567,"t":"Seeking Harmony Between Data Centers and the Grid","su":"2024년 7월, 북부 버지니아의 송전선에 결함이 발생한 후 약 1,500MW의 데이터 센터 부하가 한꺼번에 그리드에서 떨어졌습니다. 걱정스럽기는 했지만 각 측의 보호 기능은 설계된 대로 작동했습니다. 전력회사의 자동 재폐로가 회선 복원을 반복적으로 시도했고, 시도할 때마다 전압 강하가 발생했습니다."},{"s":"터빈 보안은 전투의 절반에 불과합니다. 데이터 센터 전원에 대한 배출 모니터링 경로입니다.","so":"Data Center Dynamics","tm":"11/21 20:05","c":1,"r":"us","u":"https://www.datacenterdynamics.com/en/opinions/securing-the-turbine-is-only-half-the-battle-the-emissions-monitoring-path-to-data-center-power/","p":1795259149,"a":1795259728,"t":"Securing the turbine is only half the battle: the emissions monitoring path to data center power","su":"데이터 센터 전력 이야기는 일반적으로 부족 이야기로 전달됩니다. AI 및 클라우드 수요로 인해 개발자와 대규모 운영자는 주로 천연 가스 터빈 및 왕복 엔진과 같은 비현실적(회사가 번 돈 성적표)인 세대로 이동했으며 대부분의 적용 범위는 장비를 충분히 빠르게 구축할 수 있는지 여부에 따라 수정되었습니다."},{"s":"데이터센터 전기│앨라배마주, 전기요금 1억6천만달러 절감 계획 대규모 사용자는 전력망 비용을 어떻게 공유합니까?","so":"鉅亨網","tm":"11/21 19:13","c":1,"r":"tw","u":"https://news.cnyes.com/news/id/6669774","p":1795256016,"a":1795303174,"t":"資料中心用電｜阿拉巴馬州擬降電費1.6億美元，大用戶如何分攤電網成本？","su":"데이터센터(컴퓨터 수만 대를 모아 둔 건물) 전기│앨라배마주, 전기요금 1억6천만달러 절감 계획 대규모 사용자는 전력망 비용을 어떻게 공유합니까? Uanalyze 2026년 11월 21일(Uanalyze/산업 데이터 센터 보고서) ⸺ Southern Company(SO-US)의 자회사인 Alabama Power는 2027년 1월 청구서부터 사용자 요금을 인하할 계획이며 연간 총 1억 6천만 달러의 수익이 감소할 것이라고 주 규제 기관에 보고했습니다. 회사는 월 1,000kWh의 전기를 사용하는 가구가 연간 50달러 이상을 절약할 수 있을 것으로 추정하고 있으며, 이는 주로 내년에 대규모 데이터 센터의 전기 판매 수익이 증가할 것으로 예상되는 데 기인합니다."},{"s":"3개의 데이터 센터 전력 주식이 기록 대비 1/3 이상 하락하여 지금 구매하고 2030년까지 보유","so":"Yahoo Finance","tm":"11/21 18:03","c":1,"r":"us","u":"https://finance.yahoo.com/markets/stocks/articles/3-data-center-power-stocks-090302581.html","p":1795251782,"a":1795259729,"t":"3 Data Center Power Stocks Down More Than a Third From Their Records to Buy Now and Hold Through 2030","su":"그 중 한 회사의 수익은 지난 분기에 두 배 이상 증가했습니다. 그렇다면 왜 세 주식 모두 지금까지 최고점보다 훨씬 낮은 걸까요?"},{"s":"李대통령, AI 전력·인력 확보 강조…\"AIDC·메모리 수요 더 늘 것\" (종합)","so":"아시아경제","tm":"11/21 16:19","c":1,"r":"kr","u":"https://www.asiae.co.kr/article/2026112116192801624","p":1795245569,"a":1795248156,"su":"이재명 대통령은 21일 인공지능(AI) 기술이 발전할수록 AI데이터센터(컴퓨터 수만 대를 모아 둔 건물)와 메모리 반도체(전자기기의 두뇌 부품)에 대한 수요가 더욱 늘어날 ."},{"s":"Taiping Island 마이크로그리드가 온라인화되면 Liqi의 수익에 어떤 기여를 하게 될까요?","so":"UDN","tm":"11/21 10:57","c":1,"r":"tw","u":"https://udn.com/news/ai/answer/%E5%A4%AA%E5%B9%B3%E5%B3%B6%E5%BE%AE%E9%9B%BB%E7%B6%B2-60330799","p":1795226239,"a":1795270310,"t":"太平島微電網上線後，對立碁的營收有何貢獻？","su":"Formosa New Intelligence와 Liqi는 함께 협력하여 난사(Nansha)의 타이핑 섬(Taiping Island)에 마이크로그리드를 구축했으며, 이는 공식적으로 가동에 들어가 Liqi에 수익을 가져오기 시작했습니다. 이 협력 모델은 향후 낙도 및 지역 방재를 위한 마이크로그리드 입찰의 기반이 될 것입니다. 양 당사자는 Liqi의 사업에 더 많은 성장 모멘텀(값이 움직이는 기세)을 가져오기 위해 후속 프로젝트를 위해 공동으로 노력할 것으로 예상됩니다. 이번 협력은 에너지 저장 장비와 에너지 관리 시스템 통합의 중요성을 강조하고 분산 에너지 개발에서 대만의 점진적인 발전을 반영합니다."},{"s":"[산업X파일] ‘작은 원전’ SMR, 곳곳서 차질… 한국 계획은 괜찮나","so":"조선일보","tm":"11/21 06:04","c":1,"r":"kr","u":"https://www.chosun.com/economy/economy_general/2026/11/21/HMRSXGFH6FAHVEUCJTGGIZTKXU/","p":1795208664,"a":1795265115,"su":"소형모듈원전(SMR)이 차세대 전력원으로 주목받고 있으나, 세계 곳곳에서 공사 지연과 비용 급증으로 어려움을 겪고 있음. 한국 또한 2035년 도입을 목표로 하지만, 전문가들은 해외 사례를 반면교사 삼아 기술적 난관과 막대한 예산 문제를 사전에 면밀히 검토해야 한다고 강조하고 있음."},{"s":"SKT, 효성중공업과 GW급 AIDC 구축","so":"이투데이","tm":"11/21 05:03","c":1,"r":"kr","u":"https://m.etoday.co.kr/view_photo.php?idxno=2648527&seq=1","p":1795204996,"a":1795265115,"su":"SKT, 효성중공업과 GW급 AIDC 구축 협력…안정적 전력 인프라 확보 관련 이미지 원본을 이투데이에서 확인하세요"},{"s":"[미국 증시시장] AI 주식 분할 심화, 나스닥 4.3% 하락, 트럼프 미국 기업 해외 데이터센터 구축 제한 계획(지속 업데이트)","so":"香港經濟日報HKET","tm":"11/21 04:55","c":1,"r":"hk","u":"https://inews.hket.com/article/4225700/%E3%80%90%E7%BE%8E%E8%82%A1%E5%B8%82%E6%B3%81%E3%80%91AI%E8%82%A1%E6%8B%86%E5%80%89%E5%8A%A0%E5%8A%87%E7%B4%8D%E6%8C%87%E7%80%89 t only supports competition in computing power, but also affects industrial layout. 그는 장학금과 기념상을 통해 전문 인재의 투자와 계승을 장려하고 전력 및 에너지 산업을 홍보하여 AI 개발 열차를 따라잡고 대만에서 새로운 성장 모멘텀(값이 움직이는 기세)을 창출하기를 희망합니다."},{"s":"AI 시대에는 에너지 전환이 필요하다. Liu Wenxiong은 신세대가 전력 산업에 투자하도록 격려합니다.","so":"經濟日報","tm":"11/20 17:36","c":1,"r":"tw","u":"https://money.udn.com/money/story/5612/9891709","p":1795163807,"a":1795175845,"t":"AI 時代需要能源轉型 劉文雄鼓勵新生代投入電力產業","su":"AI와 반도체(전자기기의 두뇌 부품) 산업이 호황을 누리면서 전력 인재는 산업간 경쟁을 위한 중요한 자원이 됐다. 류웬시옹(Liu Wenxiong) 대만전력에너지공학협회 명예회장은 지난 20일 '전력망 인재개발연맹 장학금 및 류수성 기념상 시상식' 행사에 참석해 AI 산업이 전기에 대한 세계의 기대에 변화를 가져왔고, 대만이 미래 AI 산업의 열차를 탈 수 있으려면 더 많은 첨단기술 인재의 유입이 필요하다고 지적했다."},{"s":"도쿄전력, 원전의 테러 대책 시설의 완성 연기에 가시와자키 카리바 7호기","so":"日本経済新聞","tm":"11/20 17:18","c":1,"r":"jp","u":"https://www.nikkei.com/article/DGXZQOUC205P80Q6A121C2000000/","p":1795162738,"a":1795175845,"t":"東京電力、原発のテロ対策施設の完成延期へ 柏崎刈羽7号機","su":"도쿄전력홀딩스가 카시와자키 카리바 원자력발전소 7호기(니가타현)에 정비하는 테러 대책 시설에 대해 2029년 8월로 하고 있던 완성 시기의 연기를 검토하고 있는 것이 20일, 알았다. 테러대책시설은 '특정 중대사고 등 대처시설'로 불리며 국가 기준으로 설치가 의무화되고 있다. 공사가 길어지면 7호기 재가"},{"s":"ESCO, 메거 인수로 전력망 검사 영역 확대 전력회사가 주요 고객","so":"鉅亨網","tm":"11/20 16:00","c":1,"r":"tw","u":"https://news.cnyes.com/news/id/6669012","p":1795158024,"a":1795158285,"t":"ESCO併購Megger擴大電網檢測版圖電力公司是主力客戶","su":"ESCO, 전력망 감지 영역 확장 위해 Megger 인수 전력회사가 주요 고객이다. 유애널라이즈 2026년 11월 20일 (유애널라이즈/산업데이터센터(컴퓨터 수만 대를 모아 둔 건물) 리포트) ⸺ 미국 산업용 시험장비 제조사인 에스코테크놀로지스(ESE-US)가 전력망 탐지업체 메거(Megger) 인수를 완료했다. 2027회계연도 매출은 연간 55~58% 증가한 20억 5천만~20억 9천만 달러에 이를 것으로 예상된다. 인수합병(회사를 사거나 합치는 것)을 통해 전력망 탐지 시장에서 ESCO의 규모가 확대되고 있으며 주요 고객은 전력회사입니다. ESCO 경영진은 데이터센터 구축과 직접 관련된 매출이 도블과 메거 합산 매출의 1~2%에 불과한 것으로 추정하고 있다."},{"s":"LS ELECTRIC 9%대 급락…전력기기주 동반 약세 [종목NOW]","so":"파이낸셜뉴스","tm":"11/20 15:10","c":1,"r":"kr","u":"https://www.fnnews.com/news/202611201440354507","p":1795155032,"a":1795158279,"su":"국내 증시가 급락하면서 전력기기주도 동반 약세(내리는 흐름)를 보이고 있다. 주가는 40만1000원으로 출발해 장중 38만4500원까지 하락했다. 이날 전력기기주 약세는 국내 증시 전반의 위험회피 흐름과 맞물린 것으로 풀이된다."},{"s":"싱가포르 기반 DayOne은 시장 51440,"su":"대만 로봇 부품업체들이 휴머노이드(사람을 닮은 로봇) 로봇 핵심 부품 공급망(부품·재료가 오가는 연결망) 진입을 서두르고 있다.대만 경제매체 디지타임스(DIGITIMES) 보도에 따르면, 테슬라의 휴머노이드 로"},{"s":"코스닥 시총 상위 10등에 2곳…이젠 '로봇' 시대","so":"매일경제 마켓","tm":"11/22 17:23","c":1,"r":"kr","u":"https://stock.mk.co.kr/news/view/1203782","p":1795335834,"a":1795351440,"su":"코스닥 시총 상위 10등에 2곳…이젠 '로봇' 시대 추경아 기자(choo.kyoungah@mk.co.kr) 입력 : 2026.11.22 17:23:54 CES 신제품 공개 기대감 로보티즈 10위로 신규 편입 코스닥 시가총액(회사 전체 몸값) 상위권에서 로봇주 약진이 두드러지고 있다. 국내 증시가 급락한 지난주에도 레인보우로보틱스와 로보티즈가 강세를 보이며 각각 시총 4위와 10위에 올랐다. 지난해 말 코스닥 시총 상위권을 지배했던 바이오 기업들이 잇단 악재로 밀려났고, 상승세를 나타내던 반도체(전자기기의 두뇌 부품) 소부장(소재·부품·장비) 업체도 주춤한 사이 벌어진 일이다."},{"s":"엔비디아 주가 14% 하락, 시장은 클라우드 AI의 미래를 걱정하고 있습니다! 휴머노이드 로봇, 보안 비디오 감시 등 엔드사이드 AI가 주목을 받게 될까요?","so":"每日经济新闻","tm":"11/22 15:21","c":1,"r":"cn","u":"https://www.nbd.com.cn/articles/2026-11-22/4655004.html","p":1795328460,"a":1795351442,"t":"英伟达股价大跌14%，市场担忧云端AI前景！人形机器人、安防视频监控等端侧AI将站上风口？","su":"Mejing.com은 24시간 뉴스 웹사이트입니다. 최첨단 금융일간지 '매일경제뉴스'를 활용해 브랜드 가치, 자동차 정보, 영상, 펀드, 금융, 부동산, 금융뉴스, 증권사, 기업 등을 다루는 중국 내 영향력 있는 뉴스 웹사이트를 구축하고 종합 금융뉴스 플랫폼이다."},{"s":"JP모건체이스는 2030년 미국의 휴머노이드 로봇 생산량이 40만대에 달하고, 2035년에는 시장 규모가 300억 달러에 이를 것으로 내다봤다.","so":"财联社","tm":"11/22 14:13","c":1,"r":"cn","u":"https://www.cls.cn/detail/2532979","p":1795324422,"a":1795356536,"t":"摩根大通预计美国人形机器人2030年产量达40万台 2035年市场规模或逼近300亿美元","su":"① JP모건은 미국의 휴머노이드(사람을 닮은 로봇) 로봇의 연간 생산량이 2030년까지 300,000~400,000대에 도달하고, 2035년까지 약 150만 대까지 증가할 것이라고 보고했습니다. ② 은행은 액츄에이터, 모터, 비전 시스템 등 핵심 부품 시장 규모가 2035년까지 300억 달러에 육박할 것으로 전망하고 있다. 차이롄서, 11월 12일(편집자 니우잔린) JP모건은 목요일 보고서를 통해 업계가 기술 시연에서 상용화로 전환함에 따라 미국 내 휴머노이드 로봇의 연간 생산량이 2035년까지 30만~40만대에 달할 것이라고 밝혔다. 2030년에는 약 150만 개로 늘어날 것이며, 2035년에는 약 150만 개로 늘어날 것입니다. 은행은 노동력 부족, 비용 효율성 개선, 제조 능력 향상이 시장 성장의 주요 원동력이 될 것이라고 믿습니다."},{"s":"로봇 전문가들이 테슬라의 Optimus 로봇에 대해 어떻게 생각합니까?","so":"IEEE Spectrum","tm":"11/22 11:27","c":1,"r":"world","u":"https://spectrum.ieee.org/robotics-experts-tesla-bot-optimus/particle-16","p":1795314433,"a":1795392948,"t":"What Robotics Experts Think o 뉴시스","tm":"11/22 00:00","c":1,"r":"kr","u":"https://www.newsis.com/view/NISX20261119_0003874253","p":1795273200,"a":1795278575,"su":"[서울=뉴시스]이준형 인턴 기자 = 최근 증시 급락으로 가계의 주식 자산이 큰 타격을 입었으나, 현 밸류에이션(주가가 비싼지 싼지 따진 값) 상 펀더멘털 관점에서의 저평가 매력이 극에 달해 있어 투매보다는 인내가 필요한 시점이라는 진단이 나왔다.유튜브 채널 '증시각도기TV'에 출연한 곽상준 매트릭스투자자문 대표는 최근 국내 증시의 등락 배경과 주요 경제 지표, 그리고 반도체(전자기기의 두뇌 부품) 및 로봇 섹.."},{"s":"5G-A는 조정 검사를 수행하는 여러 휴머노이드 로봇을 통해 선전-홍콩 Hui 스마트 데모 파크에 힘을 실어줍니다.","so":"广东新闻","tm":"11/21 23:04","c":1,"r":"cn","u":"http://www.gd.chinanews.com.cn/2026/2026-11-21/450699.shtml","p":1795269840,"a":1795278576,"t":"5G-A赋能深港汇智慧示范园区 多台人形机器人协同巡检","su":"중국 뉴스 서비스, 광동 뉴스, 11월 20일(Sun Qiuxia, Li Yingxin) 선전-강휘 스마트 시범단지에서는 다수의 휴머노이드(사람을 닮은 로봇) 검사 로봇이 건물, 옥외 도로 및 기타 지역을 함께 순찰합니다. 고화질 영상은 실시간으로 스마트 관리 플랫폼으로 다시 전송되며, AI 지능형 분석을 통해 적시에 안전 위험을 식별하고 경보를 울립니다. 수동 검사부터 로봇 클러스터 협업 운영까지 이 스마트 보안 시나리오는 심천-홍콩 Hui 스마트 데모 파크에 힘을 실어주는 5G-A의 생생한 사례입니다. 심천-홍콩 후이 스마트 시범단지는 심천 첸하이 첸완 핵심 지역에 위치해 있습니다. 첸하이(Qianhai)에 있는 핵심 심천-홍콩 양방향 본부 기지입니다. Guangdong Mobile은 China Mobile Internet of Things, 화웨이, Leju Robots 등과 협력하여 5G-A 네트워크를 핵심 지원으로 사용하고 IoT, 디지털 트윈 및 기타 기술을 통합하여 지능형 보안, 스마트 운영 및 다국어 서비스를 통합하는 스마트 캠퍼스 시스템을 만들었습니다."},{"s":"테슬라 옵티머스가 '렌탈'로 바뀔 수도 있다! 애플, HALO 휴머노이드 로봇 제어 솔루션 공개! 노보노디스크, 체중 감량 이외의 시장으로 확장 기대 丨20261110월스트리트에서 루자쭈이까지","so":"第一财经","tm":"11/21 20:57","c":1,"r":"cn","u":"https://www.yicai.com/video/103433753.html","p":1795262279,"a":1795270321,"t":"特斯拉Optimus或转向“出租”！苹果披露HALO人形机器人控制方案！诺和诺德有望拓展减重之外的市场丨20261110从华尔街到陆家嘴","su":"저자: 월스트리트에서 루자쭈이까지 편집자: Han Luyang ①테슬라는 \"Optimus 임대\"로 전환할 수 있습니다. 초기 비용은 약 US$30,000이며 2027년 말까지 배송될 예정입니다. 머스크는 최근 테슬라가 인간형 로봇 Optimus를 판매하는 대신 고객에게 임대할 가능성이 있다고 말했습니다. 단일 장치의 초기 비용은 약 US$30,000이며, 향후 약 US$20,000까지 하락할 것으로 예상됩니다. 납품 전 테슬라 자체 공장에서 사용할 예정이며, 작업 효율은 일반인의 5배 정도다. 테슬라가 프리몬트 공장에서 옵티머스 조기 양산을 시작했다. 생산라인은 연간 100만개 생산능력을 갖출 계획이다. 테슬라는 12월 3일 주주총회에서 자세한 내용을 발표할 예정이다. 업계에 따르면 테슬라는 12월 초 신형 휴머노이드(사람을 닮은 로봇) 로봇 옵티머스에 대한 고객 예약을 개시할 예정이지만, 로봇 배송은 여전히 1년을 기다려야 한다. 임대 모델은 테슬라가 일회성 하드웨어 수익에서 반복 수익으로 전환하는 과정의 일부로 간주됩니다. FSD 가입자는 3분기에 새로운 최고치를 기록했습니다. 북미 신규 주문의 75%가 FSD를 선택하고 연간 반복 수익이 미화 10억 달러에 육박했습니다. Optimus는 다음 구독 제품이 될 것으로 예상되며 구체적인 임대 가격 및 조건은 아직 발표되지 않았습니다."},{"s":"품질이 낮은 로봇 데이터의 확산: 나쁜 데이터는 어떻게 생성되는가","so":"第一财经","tm":"11/21 20:43","c":1,"r":"cn","u":"https://www.yicai.com/news/103449077.html","p":1795261428,"a":1795265125,"t":"机器人低质数据泛滥：糟糕的数据是如何产生的","su":"“물리적 AI가 대중화되면서 실제 기계가 수집하는 데이터의 비중은 점점 줄어들 것입니다.” 최근 Motphys의 설립자이자 CTO인 Zhang Heng은 제일재경와의 인터뷰에서 위와 같은 판단을 내렸습니다. 로봇 훈련에는 엄청난 양의 데이터가 필요하며, 실제 기계에서 데이터를 수집하는 것은 비용이 너무 많이 들고 비효율적입니다. 물리 시뮬레이션 엔진은 점점 더 강력해지고 있으며 가상 세계에서 물리적 피드백을 통해 무제한의 데이터를 생성할 수 있습니다. 안경, 촉각 장갑 및 기타 장치를 착용한 인간이 수집한 자아 데이터도 폭발적으로 증가하고 있습니다. 이는 훈련 데이터 부족 문제를 상당 부분 해결하지만, 동시에 품질이 낮은 데이터도 범람 조짐을 보이고 있습니다."},{"s":"'53개 손가락' 연주는…로봇 151대가 \"뱅뱅뱅\"","so":"연합뉴스 한민족센터","tm":"11/21 15:42","c":1,"r":"kr","u":"https://www.koreancenter.or.kr/news/articleView.html?idxno=1443086","p":1795243332,"a":1795248163,"su":"[앵커] 인간 피아니스트와 로봇 피아니스트의 연주는 어떤 차이가 있을까요? 지난 APEC 정상회의 기간 150대가 넘는 휴머노이드(사람을 닮은 로봇) 로봇들이 군무를 펼쳐 세계 기록을 세웠다는데요. 어떤 내용인지 화면으로 만나보시죠. [기자] 53개의 손가락을 자유자재로 움직이며 쇼팽의 '녹턴'을 연주하는 로봇 <연주 현장음> \"이번엔 인간 피아니스트 차례입니다.\" <연주 현장음> \"인간과 로봇의 피아노 연주 대결이 펼쳐졌습니다.\" <테오트로니코 / 로봇 피아니스트> \"객관적으로 제가 더 뛰어납니다."},{"s":"3대3 완전 자율 휴머노이드 로봇 축구 초청 토너먼트가 마카오에서 개최됩니다.","so":"21财经","tm":"11/21 15:26","c":1,"r":"cn","u":"https://www.21jingji.com/article/20261121/herald/c264fa0d8544851fb70c9051b7e1155f.html","p":1795242411,"a":1795248164,"t":"3对3全自主人形机器人足球邀请赛即将登陆澳门","su":"휴머노이드(사람을 닮은 로봇) 로봇이 그린 필드로 이동할 때 원격 제어 제어에 의존할 필요가 없습니다. 자체 AI 알고리즘에만 의존하여 인식, 이동, 대결 및 촬영을 완료합니다. 특별한 기술 축구 경기가 준비되었습니다. 12월 3일부터 5일까지 베네시안 마카오 코타이 전시컨벤션센터에서 3대3 완전 자율 휴머노이드 로봇 축구 초청 토너먼트가 개최됩니다. AIE 전자 전시회의 주요 지원 행사로 광둥-홍콩-마카오 대만 지역과 베이징의 8개 중학교 팀이 완전 자율 모드에서 로봇 축구 대회에 참가할 예정입니다. 8개의 참가팀이 경쟁을 펼쳤습니다. 이번 대회의 가장 큰 하이라이트는 완전 자율주행 경쟁이다. 경쟁 규칙에서는 수동 원격 제어, 의사 결정을 위한 외부 컴퓨터 및 외부 전원 공급 장치를 명확하게 금지합니다. 로봇은 공중 쌍안경 깊이 카메라를 사용하여 경쟁 환경을 감지하고 공중 컴퓨팅 능력은 컴퓨팅 결정을 완료하여 \"인식-결정-실행\" 폐쇄 루프를 완전히 실현하고 각 팀의 알고리즘 개발 및 전략 조정 수준을 위해 경쟁합니다."},{"s":"휴머노이드 로봇 대량생산 가속화, 감속기 수요 급증","so":"信報網站","tm":"11/21 03:33","c":1,"r":"hk","u":"https://www.hkej.com/dailynews/investment/article/4570872/%E4%BA%BA%E5%BD%A2%E6%A9%9F%E6%A2%B0%E4%BA%BA%E5%8A%A0%E5%BF%AB%E9%87%8F%E7%94%A2+%E6%B8%9B%E9%80%9F%E5%99%A8%E9%9C%80%E6%B1%82%E9%A3%86","p":1795199626,"a":1795215226,"t":"人形機械人加快量產 減速器需求飆","su":"인공지능(AI) 대형모형과 구현지능 기술이 점점 성숙해지면서 글로벌 휴머노이드(사람을 닮은 로봇) 로봇 산업은 실험실 연구개발에서 상업적 대량생산 단계로 옮겨가고 있다. 로봇 산업 체인에서 변속기 부품은 항상 시장에서 무시되어 왔지만 이제는 조용히 시장의 가장 큰 관심을 끄는 핵심 부품 중 하나가 되었습니다. 감속기는 동력(모터)과 액츄에이터(Actuator)를 연결하는 중간 전달 장치입니다. 기어, 웜 등의 구조를 통해 고속, 저토크 입력을 저속, 고토크 출력으로 변환하는 동시에 전달 정밀도와 부하 용량을 향상시킵니다. 정밀감속기의 핵심가치는 동력 전달 과정을 개선하는 것입니다."},{"s":"Yada와 Robot Godfather가 AI 스마트 의료 애플리케이션 개발 | 핫 하이라이트 | 사업정보","so":"經濟日報","tm":"11/21 00:53","c":1,"r":"tw","u":"https://money.udn.com/money/story/5635/9892203","p":1795190037,"a":1795215223,"t":"亞大攜機器人教父 攻AI智慧醫療應用 | 熱門亮點 | 商情","su":"글로벌 노령화와 의료 인력 부족으로 인해 AI 스마트 로봇 애플리케이션에 대한 수요가 증가하고 있습니다! 아시아대학교는 스마트 의료 산업을 적극적으로 전개하고 있습니다. 차이진파 총장은 대표단을 이끌고 일본 오사카대학을 방문했다. 지난 11월 16일에는 '일본 로봇공학의 대부'로 불리는 이시구로 히로시 교수가 이끄는 스마트로봇연구소와 협력각서(MOU)를 체결했다. 미국 스탠퍼드대 로봇센터와 일본의 휴머노이드(사람을 닮은 로봇) 로봇 기술, 대만의 의료 임상(새 약을 사람에게 시험하는 것) 분야를 결합해 AI 로봇을 연구실부터 의료현장까지 확산할 예정이다. Ishiguro는 휴머노이드 로봇 연구의 세계적인 선구자입니다. 그는 미국 CNN이 선정한 '세상을 바꾸는 8명의 천재' 중 한 명으로 선정됐다. 그는 제미노이드(Geminoid), 에리카(Erica) 등 국제적으로 유명한 로봇을 개발했습니다. 그는 오랫동안 인간과 컴퓨터의 상호작용, 원격제어, 아바타 로봇 기술에 투자해 왔으며, 인간의 삶과 사회 서비스에 AI 로봇을 적용하는 방안을 탐구했다. 아시아대학과 오사카대학의 협력에는 몰입형 로봇, 원격 제어 복제 기술, 소셜 로봇 및 AI 대화 시스템이 포함됩니다. 양 당사자는 공동 연구, 대학원생 교류, 단기 연수 및 국제 연구 프로젝트를 추진하고 스마트 의료와 노인 간호를 중요한 발전 방향으로 삼을 것입니다. 차이진파 아시아대학교 총장은 초기 단계에서는 외래진료 지도, 의료정보 설명, 원격 방문, 노인과의 상호작용 등을 평가할 것이라고 지적했다."},{"s":"한국 베이스그룹, 트럼프 일가 ‘군용 로봇 업체’에 2천억원 투자 준비","so":"한겨레","tm":"11/21 00:17","c":1,"r":"kr","u":"https://www.hani.co.kr/arti/international/international_general/1288324.html","p":1795187820,"a":1795248163,"su":"한국 기업 베이스그룹이 도널드 트럼프 미국 대통령의 차남이 고문으로 있는 군용 로봇 개발 업체에 1억5천만달러(2천억원)를 투자할 준비를 하고 있다고 로이터 통신이 19일(현지시각) 보도했다. 직원 급여조차 제때 주지 못할 만큼 자금난에 빠진 이 업체에 베이스그룹이 ‘"},{"s":"Hot Finance | 수십 대의 휴머노이드 로봇이 휴대폰 테스트 생산 라인에 진입했으며 Zhiyuan Innovation과 Lens Technology가 협력을 맺었습니다.","so":"21财经","tm":"11/20 20:55","c":1,"r":"cn","u":"https://www.21jingji.com/article/20261120/herald/3b873cf32c1b8f6fa5c933c92e90e740.html","p":1795175700,"a":1795180935,"t":"热财经｜数十台人形机器人进驻手机测试产线 智元创新与蓝思科技达成合作","su":"최근 AGIBOT은 스마트 단말기 정밀 제조 기업인 Lens Technology와 전략적 협력을 맺고 Lens Technology의 휴대폰 테스트 생산 라인에 수십 대의 AGIBOT 로봇을 대규모로 배치했습니다. 이 로봇 배치는 3C 소비자 전자 제품 테스트를 위한 표준화된 응용 모델을 만드는 것을 목표로 테스트 스테이션의 자동 로딩 및 언로딩 및 장비 상호 작용과 같은 작업을 담당합니다. 이 생산 라인의 구현은 주로 MMI, ANT, CAM 및 CAMCV와 같은 고주파수 반복 테스트 프로세스를 다루고 있습니다. 신속한 모델 반복과 잦은 생산 라인 조정이라는 3C 업계의 특성에 부응하여 Genie G2는 Zhiyuan의 \"3가지 지능이 하나로 통합된\" 기술 아키텍처를 사용합니다. 범용 차체 설계와 전천후 작동 기능을 통해 신속한 교차 생산 라인 적응과 완전 자동 자재 이동을 달성하여 생산 라인 수정 비용을 효과적으로 줄이고 노동 압력을 완화할 수 있습니다."},{"s":"가케시 / 규슈 · 야마구치, 야스카와 전기의 로봇 제 5 공장 견학","so":"日刊工業新聞","tm":"11/20 17:53","c":1,"r":"jp","u":"https://www.nikkan.co.jp/articles/view/797744","p":1795164799,"a":1795248165,"t":"かけはし／九州・山口、安川電機のロボット第5工場見学"},{"s":"로봇이 연주하고 순찰... APEC서 과시한 중국","so":"조선일보","tm":"11/20 17:20","c":1,"r":"kr","u":"https://www.chosun.com/international/international_general/2026/11/20/YQ62E4R3J5GR3KUGKKDGV7XTZM/","p":1795162838,"a":1795248163,"su":"APEC 정상회의가 열린 중국 선전에서 휴머노이드(사람을 닮은 로봇) 로봇과 하모니OS 기반 AI 기술이 공개됨. 중국은 선전을 무대로 자국 첨단 제조업의 경쟁력을 세계에 과시하며, 제조업 기반을 결합한 피지컬 AI 분야에서 미국을 추월하겠다는 기술적 의지를 드러냈음."},{"s":"안드로이드 창시자 '앤디 루빈', 휴머노이드 로봇 공개…겐키 로보틱스 첫 공식 행보","so":"로봇신문","tm":"11/20 16:31","c":1,"r":"kr","u":"https://www.irobotnews.com/news/articleView.html?idxno=49710","p":1795159887,"a":1795175855,"su":"안드로이드 창시자 앤디 루빈(Andy Rubin)이 설립한 일본 휴머노이드(사람을 닮은 로봇) 로봇 스타트업 겐키 로보틱스(Genki Robotics)가 창업 이후 처음으로 공개 석"},{"s":"삼성전자는 2027년 1월 자체 개발한 로봇을 선보일 예정이다. 로봇 산업은 대규모 구현기에 돌입했다.","so":"财联社","tm":"11/20 16:22","c":1,"r":"cn","u":"https://www.cls.cn/detail/2476465","p":1795159334,"a":1795231024,"t":"三星将于2027年1月首秀自研机器人 机器人产业已迈入规模化落地期","su":"① 삼성전자는 2027년 1월 미국 라스베이거스에서 개최되는 세계 최대 가전전시회 CES 2027에서 자체 개발한 휴머노이드(사람을 닮은 로봇) 로봇 최초 공개를 목표로 휴머노이드 로봇 시제품 개발에 박차를 가하고 있다. ② 갤럭시오토 석진만 팀은 중국 내 휴머노이드 로봇 일괄 배치가 가속화돼 상반기 글로벌 출하량이 97%를 차지하며 업계는 1단계 진입에 진입했다고 지적했다. 대규모 시행 기간. 7일(현지시간) 언론보도에 따르면 삼성전자는 2027년 1월 미국 라스베이거스에서 열리는 세계 최대 가전전시회 CES 2027에서 자체 개발한 휴머노이드 로봇을 최초로 공개하는 것을 목표로 휴머노이드 로봇 시제품 개발에 박차를 가하고 있다. 업계 관계자는 “인공지능(AI) 기술의 발전으로 휴머노이드 로봇의 상용화 시기가 앞당겨질 것으로 예상돼 삼성전자가 속도를 높이고 있다”고 말했다. 발전의."},{"s":"유비 미녀미남들 집에 들어가고 싶다면 기다려주세요 - 36Kr","so":"36kr","tm":"11/20 16:12","c":1,"r":"cn","u":"http://www.36kr.com/p/4076727621457793","p":1795158768,"a":1795175857,"t":"优必选的美女帅哥们，想进家门再等等-36氪","su":"The beauties and handsome guys of 유비테크, if you want to enter your home, please wait. 2026 APEC에서 특별세미나에 참여한 구현지능 분야 대표자는 YuShu의 창립자이자 CEO인 Wang Xingxing이었고, 두 번째는 유비테크의 창립자이자 이사회 의장이자 CEO인 Zhou Jian이었습니다. 유비테크의 본사는 심천에 위치하고 있습니다. As a listed company focusing on full-size humanoid robots, 유비테크 is an important platform to showcase the level of China's robot industry. Zhou Jian은 휴머노이드(사람을 닮은 로봇) 로봇의 산업 규모가 \"여전히 연구 개발, 대량 생산 및 실제 적용 간의 연결을 열어야 한다\"고 말했습니다. 이 문장이 머리에 박혔습니다. 현재 중국의 임바디드 AI(로봇처럼 몸을 가진 인공지능) 분야에서는 단일 지점 역량이 빠르게 향상되고 있지만 R&D, 대량 생산, 응용 간에 서로를 구동하는 긍정적인 순환이 아직 형성되지 않았다는 구조적 모순이 있습니다."},{"s":"이족보행, 바퀴형 및 바퀴형 : 휴머노이드 로봇 형태의 경로 분류 및 대표기업 지도","so":"Jiemian.com","tm":"11/20 16:09","c":1,"r":"cn","u":"https://www.jiemian.com/article/15354215.html","p":1795158558,"a":1795175859,"t":"双足、轮式与轮足：人形机器人形态路线分类及代表公司图谱","su":"Abstract When talking about humanoid robots, most attention is focused on the mechanical arms and dexterous hands. 기계가 어디에 들어갈 수 있는지, 생산 라인으로 전환될 수 있는지, 1교대 동안 지속될 수 있는지를 실제로 결정하는 것은 기계의 하체인 경우가 많습니다. The industry has divided into three clear lines along the way of mobility: bipedal, wheeled and wheeled. Topstar has mature products in two main lines: bipedal and wheeled. 6개의 휴머노이드(사람을 닮은 로봇) 로봇 팔, 휴머노이드 팔, 바퀴 달린 휴머노이드, 이족 보행 휴머노이드, 4족 로봇 및 AI 워크스테이션은 통합 제어 기반을 공유합니다. The humanoid robot \"Xiaotuo\" has been stably operating in the injection molding and 3C workshops. 이족 보행 휴머노이드 스타는 2026년 11월 7일 TOPS DAY에 출시되었습니다. 이 기사에서는 먼저 세 가지 형태의 구조와 이동 원리를 분해한 다음 적용 가능한 시나리오와 생산 라인 변환 비용을 자세히 설명합니다. 그러다가 국내외 대표 모델들이 하나둘씩 제자리로 돌아가고, 바퀴발 루트의 성숙도는 공백으로 남는다. There is no abstract superiority in the battle of forms, only whether the scene and the choice match."},{"s":"모델 능력이 향상되고 로봇이 자율적으로 학습하기 시작합니다.","so":"Jiemian.com","tm":"11/20 15:04","c":1,"r":"cn","u":"https://www.jiemian.com/article/15354028.html","p":1795154688,"a":1795158299,"t":"模型能力提升，机器人开始自主学习了","su":"로봇은 스스로 새로운 기술을 배울 수 있게 되었지만 이러한 능력을 실제 시나리오에서 안정적으로 작동시키고 상업적인 수익을 창출하는 방법은 여전히 업계가 직면한 문제입니다."},{"s":"제이에스링크, 로보티즈와 휴머노이드 영구자석 관련 MOU 체결","so":"서울경제TV","tm":"11/20 14:00","c":1,"r":"kr","u":"https://www.sentv.co.kr/article/view/sentv202611200037","p":1795150805,"a":1795158298,"su":"제이에스링크, 로보티즈와 휴머노이드(사람을 닮은 로봇) 영구자석 관련 MOU 체결 금융·증권 입력 2026-11-20 14:00:05 수정 2026-11-20 14:00:05 권용희 기자 0개 [서울경제TV=권용희기자] 제이에스링크는 로보티즈와 '로봇용 영구자석 기술개발 및 공급망(부품·재료가 오가는 연결망) 구축을 위한 업무협약(MOU)'을 체결했다고 20일 밝혔다. 피지컬 AI 시장에 대응해 양사의 기술 역량을 결합하고, 차세대 로봇용 영구자석의 공동개발부터 양산 적용까지 협력하기 위해 추진됐다는 설명이다."},{"s":"사진첩｜APEC 정상회의에서 '일하고 봉사할 수 있는' 로봇 등장","so":"财新","tm":"11/20 13:25","c":1,"r":"cn","u":"https://photos.caixin.com/2026-11-20/102506923.html","p":1795148700,"a":1795219482,"t":"图集｜“会干活、能服务” APEC峰会机器人上岗","su":"[차이신] 2026년 11월 18일부터 19일까지 아시아태평양경제협력체(APEC) 정상회의가 선전에서 개최됩니다. 정상회담 기간 동안 심천에서는 '지능형 로봇' 콘텐츠가 증가했으며 Qianhai Mountain Dew는 'Bay Area Living Room' 기술 전시회를 시작했습니다. 이번 전시회에는 \"부드러운 여행을 위한 지능적 창조, 생활을 위한 지능적 창조, 번영을 위한 지능적 창조\"라는 세 가지 주요 주제를 중심으로 87개 베이지역 기업이 154개 제품을 가져와 전시회에 참가했습니다. 전시실은 거실, 주방, 작업실, 전력망에 따라 공간으로 구분됩니다. 로봇은 실제 장면에서 직접 작업에 투입됩니다. 거실, 주방, 공장, 작업장에 이르기까지 '일하고 봉사할 수 있는' 로봇 그룹이 함께 등장합니다. 휴머노이드(사람을 닮은 로봇) 로봇은 춤을 추며 손님을 맞이하고, 아침 식사를 준비하고, 꽃꽂이를 독립적으로 수행합니다. 일반 로봇은 현장에서 음료를 만듭니다. 산업용 로봇이 생산 라인에 들어가 분류를 완료합니다. Longgang Robot Street에서는 500대 이상의 로봇이 생활 서비스 및 지능형 제조라는 4가지 주요 주제를 중심으로 22가지 응용 시나리오를 제시합니다."},{"s":"'전자 주변기기' 아이온, 물리적 AI 사업 기회 포착하고 휴머노이드 로봇과 경쟁할 신제품 박서 출시 - 증권" <script>
var D = JSON.parse(document.getElementById('data').textContent);
var RL = {}; D.regions.forEach(function(r){ RL[r.k] = r.l; });
function $(id){ return document.getElementById(id); }
function esc(t){ return String(t==null?'':t).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
// 휴대폰에 기억해 두는 값 (마지막 탭, 탭별로 마지막에 본 시각, 정렬, 국가)
function load(k, d){ try { var v = localStorage.getItem('nb_'+k); return v===null ? d : JSON.parse(v); } catch(e){ return d; } }
function save(k, v){ try { localStorage.setItem('nb_'+k, JSON.stringify(v)); } catch(e){} }
var S = { tab: (D.themes[0] && D.themes[0].stats && D.themes.length > 1) ? 1 : 0, seen: load('seen', null), sort: load('sort', 'c'), region: load('region', 'all'), shown: D.show, prev: {} };
function newest(t){ var m = 0; t.items.forEach(function(n){ if(n.a > m) m = n.a; }); return m; }
if(S.seen === null){ S.seen = {}; D.themes.forEach(function(t){ S.seen[t.name] = newest(t); }); save('seen', S.seen); }  // 처음 방문: 레드닷 없이 시작
(function(){ var nm = load('tabname', ''); D.themes.forEach(function(t, i){ if(t.name === nm) S.tab = i; }); })();  // 마지막에 본 탭 (이름으로 기억)
if(location.hash && /^#t\d+$/.test(location.hash)) S.tab = +location.hash.slice(2);
if(location.hash === '#stats') D.themes.forEach(function(t, i){ if(t.stats) S.tab = i; });
if(S.tab >= D.themes.length) S.tab = D.themes.length > 1 ? 1 : 0;

function visible(t){
  return t.items.filter(function(n){ return S.region==='all' || n.r===S.region; });
}
function sorted(list, breaking){
  var k = breaking ? 'p' : S.sort;
  return list.slice().sort(function(x,y){
    var c = y.c - x.c, p = y.p - x.p; return k==='c' ? (c||p) : (p||c);
  });
}
function renderTabs(){
  $('tabs').innerHTML = D.themes.map(function(t, i){
    var sn = S.seen[t.name] || 0;           // 지금 고른 나라에서 보이는 기사 중 새 기사가 있을 때만 (0개인데 레드닷 뜨던 문제)
    var dot = i !== S.tab && !t.stats && visible(t).some(function(n){ return n.a > sn; });
    return '<button class="tab'+(i===S.tab?' on':'')+'" onclick="openTab('+i+')">'+esc(t.name)+
           (t.stats ? '' : '<b>'+visible(t).length+'</b>')+(dot?'<span class="dot" title="새 뉴스"></span>':'')+'</button>';
  }).join('');
  var on = $('tabs').children[S.tab]; if(on && on.scrollIntoView) on.scrollIntoView({block:'nearest', inline:'center'});
}
function renderCtrl(){
  var br = D.themes[S.tab].breaking || D.themes[S.tab].stats;
  var h = '';
  if(!br){
    h += '<button class="'+(S.sort==='c'?'on':'')+'" onclick="setSort(\'c\')">🔥 화제순</button>';
    h += '<button class="'+(S.sort==='p'?'on':'')+'" onclick="setSort(\'p\')">🕒 최신순</button><span class="sep"></span>';
  }
  h += '<button class="'+(S.region==='all'?'on':'')+'" onclick="setRegion(\'all\')">전체</button>';
  D.regions.forEach(function(r){
    h += '<button class="'+(S.region===r.k?'on':'')+'" onclick="setRegion(\''+r.k+'\')">'+esc(r.l)+'</button>';
  });
  $('ctrl').innerHTML = h;
}
function card(n, prev){
  var hot = n.c > 1 ? '<span class="hot'+(n.c>=5?' big':'')+'">🔥 언론 '+n.c+'곳</span>' : '';
  var isNew = prev && n.a > prev ? ' <span class="new">NEW</span>' : '';
  return '<a class="card" href="'+esc(n.u)+'" target="_blank" rel="noopener" data-s="'+esc(n.su||'')+'" data-so="'+esc(n.so)+'">'+
    '<div class="meta">'+hot+esc(RL[n.r]||'')+' · '+esc(n.so)+' · '+esc(n.tm)+isNew+'</div>'+
    '<div class="title">'+esc(n.s)+'</div>'+(n.t?'<div class="orig">'+esc(n.t)+'</div>':'')+'</a>';

// ───────── 📈 장기 추이 (2021.1~, GDELT) ─────────
var HI = null, HILOAD = false;
S.sm = load('sm', 'd'); S.lp = load('lp', 'all'); S.ly = load('ly', 0);
if(S.lp === 'ly') S.lp = 'yr';          // 예전 '작년' 버튼 → 연도별
function loadHist(){
  if(HILOAD) return; HILOAD = true;
  fetch(D.history_url + '?t=' + Date.now(), {cache:'no-store'}).then(function(r){ return r.json(); })
    .then(function(j){ HI = j; prepHist(); if(D.themes[S.tab].stats) renderMain(); })
    .catch(function(){ HI = {err:1}; if(D.themes[S.tab].stats) renderMain(); });
}
function dIdx(s){ return Math.round((Date.parse(s+'T00:00:00Z') - Date.parse(HI.since+'T00:00:00Z'))/86400e3); }
function iDate(i){ return new Date(Date.parse(HI.since+'T00:00:00Z') + i*86400e3).toISOString().slice(0,10); }
function prepHist(){                       // 달 경계(배열 위치) 미리 계산
  if(!HI || !HI.s || !HI.end) return;
  HI.n = dIdx(HI.end) + 1; HI.months = []; HI.av = [];
  for(var i=0;i<HI.n;i++){ var ok = false;      // GDELT 자료가 있는 날 (서버가 멈춰 통째로 빠진 날은 false)
    for(var t in HI.s){ for(var k in HI.s[t]){ if(HI.s[t][k][i] != null){ ok = true; break; } } if(ok) break; }
    HI.av.push(ok); }
  var y = +HI.since.slice(0,4), m = +HI.since.slice(5,7), ey = +HI.end.slice(0,4), em = +HI.end.slice(5,7);
  while(y < ey || (y === ey && m <= em)){
    var a = dIdx(y+'-'+('0'+m).slice(-2)+'-01'), ny = m===12 ? y+1 : y, nm = m===12 ? 1 : m+1;
    var b = Math.min(HI.n, dIdx(ny+'-'+('0'+nm).slice(-2)+'-01'));
    HI.months.push({y:y, m:m, a:a, b:b, full: b - a === dIdx(ny+'-'+('0'+nm).slice(-2)+'-01') - a});
    y = ny; m = nm;
  }
}
function hsum(th, a, b, rk){               // [a, b) 날짜 칸의 합 (국가 필터 반영) · 자료 없는 날(null)은 건너뜀
  var s = (HI.s||{})[th] || {}, n = 0;
  for(var k in s){ if(rk ? k !== rk : !(S.region==='all' || k===S.region)) continue;
    var arr = s[k]; for(var i=Math.max(0,a); i<Math.min(b, arr.length); i++) if(arr[i] != null) n += arr[i]; }
  return n;
}
function avn(a, b){ var n=0; for(var i=Math.max(0,a); i<Math.min(b, HI.n); i++) if(HI.av[i]) n++; return n; }   // 자료 있는 날 수
function years(){ var a = [], y0 = +HI.since.slice(0,4), ty = +HI.end.slice(0,4); for(var y=ty-1; y>=y0; y--) a.push(y); return a; }   // 다 지난 해 (최근 먼저)
function pickYear(){ var ys = years(); return ys.indexOf(S.ly) >= 0 ? S.ly : (ys[0] || +HI.end.slice(0,4)); }
function lperiod(){                        // [이번 a,b] [비교 a,b 또는 null] 이름
  var M = HI.months, last = M[M.length-1], lf = last.full ? M.length-1 : M.length-2, ty = +HI.end.slice(0,4);
  if(S.lp === 'lm' && lf >= 0){ var x = M[lf], p = M[lf-1];
    return [[x.a, x.b], p ? [p.a, p.b] : null, x.y+'년 '+x.m+'월', '전달 대비']; }
  if(S.lp === 'ty'){ var a = dIdx(ty+'-01-01'), pa = dIdx((ty-1)+'-01-01'), len = HI.n - a;
    return [[a, HI.n], pa >= 0 ? [pa, pa+len] : null, ty+'년 (1월 1일~'+HI.end.slice(5).replace('-','/')+')', '작년 같은 기간 대비']; }
  if(S.lp === 'yr'){ var yy = pickYear(), ya = Math.max(0, dIdx(yy+'-01-01')), yb = Math.min(HI.n, dIdx((yy+1)+'-01-01')), pa = dIdx((yy-1)+'-01-01');
    return [[ya, yb], pa >= 0 ? [pa, ya] : null, yy+'년 전체', yy-1+'년 대비']; }
  return [[0, HI.n], null, HI.since.slice(0,7).replace('-','.')+' ~ '+HI.end.replace(/-/g,'.')+' 전체', ''];
}
function mspark(th){                       // 달별 흐름 (작은 선, 진행 중인 달은 빼고)
  var M = HI.months.filter(function(x){ return x.full; }), vals = M.map(function(x){ var d = avn(x.a, x.b); return d ? hsum(th, x.a, x.b)/d : 0; });
  if(vals.length < 2) return '';
  var mx = Math.max.apply(null, vals.concat([1])), w = 64, h = 20;
  var pts = vals.map(function(v,i){ return (i*(w/(vals.length-1))).toFixed(1)+','+(h-2-(v/mx)*(h-4)).toFixed(1); }).join(' ');
  return '<svg class="spark" viewBox="0 0 '+w+' '+h+'" width="'+w+'" height="'+h+'" aria-hidden="true"><polyline points="'+pts+'" fill="none" stroke="var(--acc)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></svg>';
}
function ldetail(th){                      // 달별 막대 + 나라별 구성
  var M = HI.months, dn = M.map(function(x){ return avn(x.a, x.b); });
  var vals = M.map(function(x, i){ return dn[i] ? hsum(th, x.a, x.b)/dn[i] : 0; });   // 하루 평균 (자료 빠진 날 영향 없게)
  var mx = Math.max.apply(null, vals.concat([1])), W = chartW(), H = 120, bw = W/M.length;
  var bars = vals.map(function(v,i){
    var x = M[i], bh = Math.max(v ? 2 : 0, (v/mx)*(H-32)), bx = i*bw + 1, y = H-14-bh;
    return '<g class="bar"><rect x="'+bx.toFixed(1)+'" y="0" width="'+(bw-2).toFixed(1)+'" height="'+(H-14)+'" fill="transparent"/>'+
      '<rect x="'+bx.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+(bw-2).toFixed(1)+'" height="'+bh.toFixed(1)+'" rx="2" fill="var(--acc)"'+(x.full?'':' opacity=".55"')+'/>'+
      '<title>'+x.y+'년 '+x.m+'월'+(x.full?'':' (진행 중)')+' · 하루 평균 '+Math.round(v).toLocaleString()+'건 · 한 달 '+hsum(th, x.a, x.b).toLocaleString()+'건'+
      (dn[i] < x.b - x.a ? ' (자료 '+dn[i]+'일치)' : '')+'</title></g>';
  }).join('');
  var ticks = M.map(function(x,i){ return x.m===1 ? '<line x1="'+(i*bw).toFixed(1)+'" y1="'+(H-14)+'" x2="'+(i*bw).toFixed(1)+'" y2="'+(H-9)+'" stroke="var(--sub)"/>'+
      '<text x="'+(i*bw+2).toFixed(1)+'" y="'+(H-1)+'" class="ax">'+x.y+'</text>' : ''; }).join('');
  var axis = ticks + '<line x1="0" y1="'+(H-14)+'" x2="'+W+'" y2="'+(H-14)+'" stroke="var(--line)"/>'+
             '<text x="0" y="9" class="ax">최대 하루 평균 '+Math.round(mx).toLocaleString()+'건</text>';
  var P = lperiod(), parts = D.regions.filter(function(r){ return (HI.regions||[]).indexOf(r.k) >= 0; }).map(function(r){
    return [r, hsum(th, P[0][0], P[0][1], r.k)]; }).filter(function(x){ return x[1] > 0; }).sort(function(a,b){ return b[1]-a[1]; });
  var pm = parts.length ? parts[0][1] : 1;
  var rows = parts.map(function(x){
    return '<div class="crow"><span class="cl">'+esc(x[0].l)+'</span><span class="cb"><i style="width:'+Math.max(2, x[1]/pm*100)+'%"></i></span><span class="cn">'+x[1].toLocaleString()+'</span></div>';
  }).join('') || '<div class="note">이 기간 기사 없음</div>';
  return '<div class="det"><div class="dt">달별 하루 평균 뉴스 수 ('+HI.since.slice(0,4)+'년 1월~)'+(S.region==='all'?'':' · '+esc(RL[S.region]))+'</div>'+
    '<svg class="bars" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(th)+' 달별 뉴스 수">'+bars+axis+'</svg>'+
    '<div class="dt">'+esc(P[2])+' 나라별</div>'+rows+'</div>';
}

  setTimeout(closeSheet, 50);
}
function toast(msg){ var t = $('toast'); t.textContent = msg; t.hidden = false; clearTimeout(toast._t); toast._t = setTimeout(function(){ t.hidden = true; }, 4000); }
function closeSheet(){ $('dim').hidden = true; $('sheet').hidden = true; document.body.style.overflow = ''; }
document.addEventListener('keydown', function(e){ if(e.key==='Escape') closeSheet(); });
</script></body></html>
