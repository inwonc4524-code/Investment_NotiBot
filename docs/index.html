 소스를 기반으로 인공 지능에 의해 생성되었으며 참고용입니다. 해당 내용은 \"Economics\"의 견해나 입장을 대변하지 않으며, 어떠한 투자 조언도 구성하지 않습니다. AI가 생성한 정보에는 오류, 누락, 일탈 등이 있을 수 있으므로, 투자 결정을 내리기 전에 사용자가 직접 해당 내용을 확인하거나 전문가의 조언을 구해야 합니다. \"이코노믹스\"는 본 내용을 신뢰하여 발생하는 어떠한 손실이나 손해에 대해서도 책임을 지지 않습니다."},{"s":"포스코퓨처엠, 계열사 거래 통해 3117.6억 매출 달성","so":"한스경제","tm":"11/25 10:10","c":1,"r":"kr","u":"http://www.hansbiz.co.kr/news/articleView.html?idxno=887018","p":1795569024,"a":1795576835,"su":"| 서울=한스경제 임준혁 기자 | 포스코퓨처엠이 직전 분기 계열사(같은 그룹에 속한 회사) 상품·용역 거래로 3117억6000만원의 매출(물건을 판 돈 전체)을 올렸다.25일 금융감독원 전자공시시스템에 따르면 포스코퓨처엠의 계열사별 매출은 포스코 2221억7700만원, 포스코인터내셔널 464억6800만원, 포스코엠씨머티리얼즈 431억1500만원 순이다.포스코 매출은 생석회가 1195억2800만원으로 가장 많았다. 이어 로재정비 406억6800만원, 내화물 319억7800만원, 공장 위탁운영 및 제품판매 274억2900만원, 내화물 공사 25억7400만원 순으로 집계됐다. 거래"},{"s":"이차전지주 지금이 기회?…저가매수 노리는 투자자들 '고민’","so":"아시아경제","tm":"11/25 09:53","c":1,"r":"kr","u":"https://www.asiae.co.kr/article/2026112415102695011","p":1795567980,"a":1795574635,"su":"이차전지 업종의 실적(회사가 번 돈 성적표) 회복 기대감이 커지면서 주가 조정을 매수 기회로 활용하려는 투자자들의 관심이 높아지고."},{"s":"더 이상 CATL만이 아닙니다. 샤오펑이 사내에서 더 많은 배터리 작업을 수행하는 이유","so":"South China Morning Post","tm":"11/25 09:00","c":1,"r":"sg","u":"https://www.scmp.com/business/china-evs/article/3375583/catls-grip-chinese-ev-makers-loosens-xpeng-doubles-down-battery-production?module=top_story&pgtype=subsection","p":1795564839,"a":1795565196,"t":"No longer just CATL: why Xpeng is bringing more battery work in-house"},{"s":"LG화학, LG엔솔 지분 매각 수조원 조달에도 재무 개선 '지지부진' |","so":"연합인포맥스","tm":"11/25 08:57","c":1,"r":"kr","u":"https://news.einfomax.co.kr/news/articleViewAmp.html?idxno=4446375","p":1795564625,"a":1795608186,"su":"LG화학, LG엔솔 지분(회사를 나눠 가진 몫) 매각 수조원 조달에도 재무 개선 '지지부진' LG에너지솔루션 지분 76.6%까지 감소…70%까지 감축 예정 배터리·첨단소재·석유화학 업황 악화로 신용등급 강등 (서울=연합인포맥스) 한종화 기자 = LG화학[051910]이 LG에너지솔루션[373220]의 지분을 매각해 수년째 대규모 자본을 조달하고 있지만 재무 건전성은 크게 개선되지 않은 것으로 나타났다. 25일 업계와 공시에 따르면 LG화학은 지난달 LG에너지솔루션 주식 653만5천939주를 주가수익스왑(PRS) 방식으로 처분한다고 밝혔다."},{"s":"신영證 \"이차전지, 내년엔 '이익 확인'…ESS가 실적 견인\"","so":"연합인포맥스","tm":"11/25 08:48","c":1,"r":"kr","u":"https://news.einfomax.co.kr/news/articleView.html?idxno=4446373","p":1795564139,"a":1795565195,"su":"이차전지 업종이 내년에는 이익을 확인하는 국면에 들어설 것이라는 분석이 나왔다.미국 에너지저장장치(ESS)가 이익 개선세를 이끌고, 부진했던 유럽 전기차 배터리(전기차를 움직이는 큰 충전 배터리) 납품도 바닥을 통과하고 있다는 판단에서다.박진수 신영증권 연구원은 25일 보고서에서 \"2027년 이차전지 업종은 반등의 기대에서 이익 확인으로 넘어가는 시점\"이라며 \"LG에너지솔루션과 삼성SDI의 2027년 합산 영업이익(장사해서 남긴 돈)은 올해 대비 199% 증가할 전망\"이라고 설명했다.이 가운데 ESS 사업부가 약 70%를 차지할 것이라는 분석이다.박 연구원은 \"지난 3년간 실적 부진의"},{"s":"태성, 복합동박 공장 준공…이차전지 소재 경쟁력 강화","so":"한스경제","tm":"11/25 08:08","c":1,"r":"kr","u":"http://www.hansbiz.co.kr/news/articleView.html?idxno=886883","p":1795561709,"a":1795574635,"su":"| 서울=한스경제 김종효 기자 | 코스닥(한국 중소·기술 회사들이 모인 주식시장) 상장(주식시장에 처음 들어오는 것)사 태성이 24일 경기도 안산시 성곡동 복합동박 신소재공장에서 준공식을 열고 차세대 이차전지 소재사업을 넓히기 위한 생산 기반을 마련했다고 25일 밝혔다.준공된 안산 신소재공장은 종전 1512평 규모 건물을 증축하고 개조해 총 2818평 규모의 생산 시설로 탈바꿈했다. 회사는 이곳을 복합동박 소재 생산의 핵심 기지로 삼고, 앞으로 늘어날 고객사 수요에 맞춘 생산체계를 갖춰갈 예정이다.태성은 기존 인쇄회로기판(PCB) 습식공정 장비사업에서 축적한 정밀 표면처리 및 도금 기술을 토대로 복합동"},{"s":"축전지 산업, 성장의 기둥에… 도쿠시마 배터리 밸리 구상의 지금","so":"ニュースイッチ by 日刊工業新聞社","tm":"11/25 06:01","c":1,"r":"jp","u":"https://newswitch.jp/p/50905","p":1795554060,"a":1795560817,"t":"蓄電池産業、成長の柱に…徳島バッテリーバレイ構想の今","su":"도쿠시마현이 축전지 산업을 지역 경제의 기둥으로 키우려고 하고 있다. 2024년 7월에 책정한 「도쿠시마 배터리 밸리 구상」을 축으로, 현내에 집적하는 전지 재료나 부재, 제조 설비 등의 강점을 살리면서, 기업 유치와 현내 기업의 육..."},{"s":"배터리 재활용 사업 매각 계획, 바스프는 양극재로 초점 전환","so":"第一财经","tm":"11/25 04:32","c":1,"r":"cn","u":"https://www.yicai.com/news/103452333.html","p":1795548747,"a":1795560815,"t":"拟出售电池回收业务，巴斯夫将重心转向正极材料","su":"5년 전 독일 화학 대기업 바스프가 배터리 소재 사업에 최대 45억유로(약 4조원) 규모의 투자 계획을 제안했다. 이제 글로벌 전기 자동차 및 배터리 시장 환경이 변화함에 따라 바스프는 배터리 소재 사업 레이아웃을 더욱 조정하고 양극 활물질 분야에 자원을 집중했습니다. 제일재경 기자는 오늘 바스프 공식 웹사이트를 통해 바스프가 11월 20일 독일 배터리 재활용 회사인 Cylib와 유럽과 북미 지역의 배터리 재활용 사업을 Cylib에 매각하기로 계약을 체결했다는 사실을 알게 되었습니다. 이번 거래에는 독일 슈바르츠하이데에 위치한 흑색 화약 생산 공장과 배터리 재활용 프로토타입 공장뿐만 아니라 관련 지적 재산, 고객 계약 및 파트너십도 포함됩니다. 이번 거래는 관련 규제 당국의 승인과 기존 마감 조건 충족을 거쳐 2027년 2분기~3분기에 완료될 것으로 예상된다. 당사자들은 거래 금액을 공개하지 않았습니다."},{"s":"서머셋 전기 배터리 기가팩토리 건설사 탈락","so":"BBC","tm":"11/25 01:22","c":1,"r":"world","u":"https://www.bbc.com/news/articles/cx30g8005684o","p":1795537359,"a":1795560818,"t":"Somerset electric battery gigafactory builder drops out","su":"TSL은 2026년 브리지워터 인근에 기가팩토리(배터리 등을 아주 많이 만드는 거대한 공장) 외관을 건설하는 계약을 체결했다."},{"s":"바스프, CATL 공급: Schwarzheide에서 CAM 선적 시작","so":"electrive.com","tm":"11/24 21:30","c":1,"r":"us","u":"https://www.electrive.com/2026/11/24/basf-supplies-catl-cam-shipments-from-schwarzheide-have-begun/","p":1795523400,"a":1795530504,"t":"BASF supplies CATL: CAM shipments from Schwarzheide have begun","su":"바스프가 CATL에 납품(만든 물건을 주문한 곳에 넘기는 것)을 시작했습니다. 공급 계약에는 슈바르츠하이데에 있는 바스프 공장의 고성능 양극재(배터리에서 전기를 내보내는 쪽의 핵심 재료) 공급이 포함됩니다."},{"s":"정부는 전기차 공급업체에 배터리 재활용 부담금을 사전 부과할 계획이다. 의원들은 그 비용이 소비자에게 전가될 것을 우려하고 있다.","so":"Now 新聞","tm":"11/24 21:10","c":1,"r":"hk","u":"https://news.now.com/home/local/player?newsId=670794","p":1795522233,"a":1795530507,"t":"政府擬向電動車供應商預先徵收電池循環再造徵費 議員憂費用轉嫁消費者","su":"[나우뉴스채널] 정부는 2029년부터 전기차 공급업체로부터 배터리 재활용 부담금을 배터리 중량 기준으로 1kg당 6위안부터 시작해 매년 인상할 계획이다. 일부 회원들은 부과금이 소비자에게 전가될지 여부를 우려하고 있습니다."},{"s":"한 가지 평가: 솔트레이크 주식의 취소형 자사주 매입은 리튬 채굴 부문의 가치 회복으로 이어질 수 있다.","so":"第一财经","tm":"11/24 20:33","c":1,"r":"cn","u":"https://www.yicai.com/news/103451336.html","p":1795520007,"a":1795521527,"t":"壹评级：盐湖股份注销式回购，带动锂矿板块估值修复可期","su":"솔트레이크는 11월 23일 저녁 15억~20억 위안을 들여 A주를 매입해 소각에 모두 사용할 계획이라고 밝혔다. 티안치리튬 회장도 4억~8억 위안을 환매하겠다고 제안했다. 제일재경의 \"One Rating\"은 현재 자원 순환 부문의 가치 평가에 대한 주기적인 압력이 있는 상황에서 선두 기업의 취소형 자사주 매입(회사가 자기 주식을 다시 사는 것)은 산업 자본이 현재 낮은 수준을 인식하고 있음을 보여준다고 믿습니다. 이번 조치로 인해 단기적으로 개별 종목 실적이 개선되고 업종 심리가 회복될 것으로 예상되며, 장기적 배분 가치도 점차 부각되고 있다. \"One Rating\"은 이전에 탄산리튬 가격이 90,000위안/톤 이하로 떨어져 일부 고비용 생산 능력이 청산 압력을 받았으며 시장의 비관적인 기대가 업계 평가에 상당한 압력을 가했다고 지적했습니다. 이번 자사주 매입은 순환주식자본을 직접적으로 감소시킬 뿐만 아니라 시장에 강력한 신뢰 신호를 보냅니다. 솔트레이크 자사주 매입 자금 상한액을 기준으로 계산하면, 전체 주식자본금의 1% 이상인 약 5,942만주를 자사주 매입할 수 있어 주당순이익(주식 한 주가 번 돈) 가치가 크게 높아질 것으로 예상된다."},{"s":"우링 빙고 Pro CATL 배터리판 출시","so":"Jiemian.com","tm":"11/24 18:46","c":1,"r":"cn","u":"https://www.jiemian.com/article/15369043.html","p":1795513583,"a":1795521529,"t":"五菱缤果Pro宁德版上市","su":"11월 24일, SAIC-GM-우링은 빙고 Pro 닝더(CATL) 에디션이 공식적으로 출시되었다고 발표했습니다. 신차는 330km CATL 익스클루시브 에디션, 330km 플래그십 CATL 에디션, 403km CATL 익스클루시브 에디션, 403km 플래그십 CATL 에디션 등 4가지 구성으로 출시됐다. 출시 가이드 가격은 59,800~73,800위안이다. 원본 뉴스 출처: 제몐뉴스"},{"s":"중국 유탄 또 맞았다… K-배터리, 콩고發 공급망 리스크","so":"www.dt.co.kr","tm":"11/24 18:42","c":1,"r":"kr","u":"https://www.dt.co.kr/article/12097035","p":1795513340,"a":1795560813,"su":"전 세계 코발트(배터리에 들어가는 귀한 금속) 공급량의 70% 이상을 차지하는 콩고민주공화국(DRC)이 코발트 수출을 다시 중단하기로 하면서 국내 배터리 업계에 돌발 변수가 생겼다. 지난해 4월에 이은 두 번째 수출 중단이다. 이미 중국발 희토류 수출 통제(특정 물건을 다른 나라에 못 팔게 막는 것)를 경험한 적이 있는 국내 배터리 업계는"},{"s":"㈜이알, 폐배터리 전처리 공정 기술 사업 영역 확대… 기후부·환경산업기술원 지원","so":"www.dt.co.kr","tm":"11/24 17:33","c":1,"r":"kr","u":"https://www.dt.co.kr/article/12097012","p":1795509183,"a":1795560813,"su":"- 기후부·한국환경산업기술원 ‘녹색신산업 사업화 지원사업’ 참여 - 친환경 배터리 재활용 기술 활용, 전해액 유기금속 90% 이상 회수 - 처리 과정서 발생하는 폐수 및 탄소 발생도 5분의 1로 줄여 - 현대글로비스 전략적 투자, 자동차용 배터리 재활용 사업 협력"},{"s":"김동구 위원장 “이차전지 예산 32.7% 증액…성과와 일자리로 답해야\"","so":"한스경제","tm":"11/24 16:58","c":1,"r":"kr","u":"http://www.hansbiz.co.kr/news/articleView.html?idxno=886801","p":1795507083,"a":1795521525,"su":"| 전주=한스경제 이인호 기자 | 전북특별자치도의회 경제산업건설위원회 김동구 위원장(군산2)이 전북 미래첨단산업 예산의 실효성을 정면으로 짚고 나섰다. 특히 전북의 핵심 성장산업으로 꼽히는 이차전지 분야에 예산이 대폭 증액된 만큼, 단순한 사업 확대를 넘어 산업 현장에서 체감할 수 있는 일자리 창출과 구체적인 성과로 이어져야 한다고 강조했다.김 위원장은 24일 열린 전북특별자치도의회 제433회 정례회에서 미래첨단산업국 소관 2027년도 본예산안과 2026년도 제3회 추가경정예산안을 심사하며 이같이 주문했다.이날 심사에서 김 위원장은"},{"s":"iM뱅크, 포항CEO포럼 개최…철강·이차전지 등 내년 산업 전략 모색","so":"뉴스핌","tm":"11/24 16:14","c":1,"r":"kr","u":"https://www.newspim.com/news/view/20261124001224","p":1795504440,"a":1795521525,"su":"젠슨 황 돌아왔지만 HBM(인공지능용 빠른 메모리) 호황 '안갯속' [서울=뉴스핌] 서영욱 기자 = 젠슨 황 엔비디아 최고경영자(CEO)의 복귀로 인공지능(AI) 반도체(전자기기 속에서 계산하고 기억하는 작은 부품) 시장에 대한 기대감이 되살아났다. 삼성전자와 SK하이닉스도 고대역폭메모리(HBM) 장기공급계약을 확대하며 향후 수년간의 수요를 확보하고 있다. 그러나 메모리 가격 급등으로 AI 서버 공급업체들이 이미 체결한 계약의 가격 인상까지 요구하면서 최종 고객 대로 전월 대비 4.16%, 전년 동기 대비 14.25% 감소했으며 거래금액은 937억9700만 위안으로 집계됐다. 2026년 1월부터 10월까지 중고차 누적 거래량은 1587만1200대로 전년 동기 대비 3.76% 감소해 전년 동기 대비 61만9500대가 감소했고, 누적 거래금액은 10억3019만8000만 위안을 기록했다."},{"s":"에너지 모닝 뉴스 │ 간펑리튬 Industry는 3억 6 천만 위안 이하의 주식 환매에 대한 특별 대출 확약서를 받았습니다. 솔트레이크 주식은 회사 주식을 20억 위안 이하로 환매할 계획입니다.","so":"Jiemian.com","tm":"11/24 09:09","c":1,"r":"cn","u":"https://www.jiemian.com/article/15364158.html","p":1795478958,"a":1795490305,"t":"能源早报｜赣锋锂业取得不超3.6亿元股票回购专项贷款承诺函；盐湖股份拟不超过20亿元回购公司股份","su":"간펑리튬 Industry는 3억 6천만 위안 이하의 주식 환매에 대한 특별 대출 확약서를 받았습니다. 11월 23일, 간펑리튬 Industry는 최근 회사가 중국공상은행 신위 첨단기술 지점에서 발행한 대출 금액이 3억 6천만 위안 이하(대출 금액은 이번 환매 총액의 90%를 초과하지 않음)인 '대출 약정서'를 받았다고 발표했습니다. 대출기간은 36개월을 초과하지 않으며, 대출목적은 구체적으로 회사 주식을 환매하는 데 사용됩니다. 구체적인 대출사항은 회사와 은행이 정식으로 체결한 주식환매대출계약에 따릅니다. 앞서 회사는 2026년 11월 19일 제24차 제6기 이사회를 열고 '회사 A주(중국 본토(상하이·선전) 주식시장의 주식) 매입 방안에 관한 제안'을 심의, 승인했으며, 회사가 자체 자금 및/또는 자체 조달 자금 중 일부를 총액 2억 위안(포함) 이상 4억 위안(포함) 이하로 사용하기로 합의했습니다. 회사는 회사의 가치와 주주 권리를 보호하기 위해 중앙 집중식 입찰 방식으로 RMB 보통주(A주)를 발행했습니다."},{"s":"CATL, 젠샤워 리튬 광산 재개, 불확실성은 여전히 남아","so":"Benchmark Mineral Intelligence","tm":"11/24 09:00","c":1,"r":"us","u":"https://source.benchmarkminerals.com/article/catl-restarts-jianxiawo-lithium-mine-uncertainty-remains","p":1795478400,"a":1795560814,"t":"CATL restarts Jianxiawo lithium mine, uncertainty remains","su":"CATL은 10월 30일 개정된 환경 영향 평가가 승인된 후 젠샤워 리튬(배터리에 꼭 들어가는 아주 가벼운 금속) 광산에서의 활동을 신속하게 재개했습니다."},{"s":"키움증권 \"이차전지, 내년부터 실적회복…업종 투자의견 상향\"","so":"연합뉴스","tm":"11/24 08:37","c":1,"r":"kr","u":"https://www.yna.co.kr/view/AKR20261124029600008","p":1795477035,"a":1795478659,"su":"(서울=연합뉴스) 김유향 기자 = 키움증권은 \"내년에는 이차전지 산업의 실적(회사가 번 돈 성적표) 회복이 가능할 것이라고 판단한다\"면서 24일 업종에 대한 투자의견(전문가가 사라·팔라고 내는 의견)을..."},{"s":"제일재경 앵커가 말했다 | 아프리카 코발트 수출이 중단됐고 이틀 만에 가격이 20% 급등했다. 휴대폰과 전기차 가격이 다시 오를까?","so":"第一财经","tm":"11/24 06:28","c":1,"r":"cn","u":"https://www.yicai.com/video/103451871.html","p":1795469324,"a":1795530506,"t":"一财主播说｜非洲钴出口被叫停 价格两天大涨20% 你的手机和电动车又要涨价了吗？"},{"s":"올해 중국서 전기트럭 60만대 팔려…리튬 수요 견인","so":"www.dt.co.kr","tm":"11/24 06:00","c":1,"r":"kr","u":"https://www.dt.co.kr/article/12096797","p":1795467600,"a":1795499049,"su":"고유가 여파로 최근 중국에서 전기트럭 판매가 급증하면서 리튬(배터리에 꼭 들어가는 아주 가벼운 금속) 수요가 늘고 있다. 공급 과잉 우려로 침체기를 겪어온 리튬 시장에 예상치 못한 호재가 나타났다는 평가다. 23일(현지시간) 뱅크오브아메리카(BofA) 글로벌 리서치에 따르면, 세계 최대 전기차 시장이자 배터"},{"s":"CNA938 Rewind - #TalkBack: 작업장에서 EV 화재를 처리하기 위해 정비사가 얼마나 잘 훈련되고 준비되어 있습니까?","so":"CNA","tm":"11/23 22:43","c":1,"r":"sg","u":"https://www.channelnewsasia.com/listen/cna938-rewind/talkback-how-well-trainedprepared-are-mechanics-dealing-ev-fires-in-their-workshops-6575101","p":1795441406,"a":1795447022,"t":"CNA938 Rewind - #TalkBack: How well trained/prepared are mechanics for dealing with EV fires in their workshops?","su":"목요일(11월 19일) 신밍에 있는 작업장에서 포르쉐 타이칸의 EV 배터리에 불이 붙은 것으로 알려졌습니다. 직원들이 차량에서 배터리를 제거하던 중이었습니다. 연기를 흡입한 2명이 병원으로 이송됐다. 더 많은 EV가 싱가포르 도로를 주행함에 따라 기계공은 고전압 배터리를 사용하여 작업하게 될 것입니다."},{"s":"리오토의 'CATL 의존 줄이기'는 치열하다","so":"36Kr","tm":"11/23 21:44","c":1,"r":"cn","u":"http://www.36kr.com/p/4082286201181830","p":1795437851,"a":1795490305,"t":"理想“去宁德化”凶猛","su":"리오토의 'CATL 의존 줄이기'가 격렬하다 지난 9월 리샹과 마둥휘는 젱위췬과 한웨이를 만나기 위해 푸젠성 닝더로 갔다. 양측은 5년간의 포괄적 전략 협력 협정을 체결했습니다. 당시 CATL 배터리를 탑재한 리오토의 누적 납품(만든 물건을 주문한 곳에 넘기는 것)량은 100만 대가 조금 넘었다. 계약 체결 직후 배터리 공급 부족으로 리오토 i6 배송이 지연됐다. 올해 11월에는 채권(나라나 회사에 돈 빌려준 증서)추심과 MEGA 리콜 논란이 확산됐다. 이상형은 두 회사가 여전히 전략적 파트너로 남아 있다고 답했습니다. CATL은 로펌에 편지를 보내도록 의뢰했는데, 그 이메일은 정상적인 화해 및 지불 알림 이메일이었고 MEGA 리콜 개입도 거부했습니다. 두 배터리 공장의 고객 목록을 보면 이상적인 레이아웃과 위치가 변경되었습니다. 중국승용차협회가 수집한 고객 설치 데이터에 따르면, Ideal은 올해 6월에도 여전히 CATL의 4번째로 큰 고객으로 CATL 설치 용량의 6.8%를 차지했다. 같은 기간 순완다 고객사 중 6.4%로 5위를 차지했다. 8월까지 Ideal은 CATL의 상위 5개 고객사에서 사라졌으며 선완다 설치 용량의 39%를 차지하고 선완다 고객 목록에서 1위를 차지했습니다."},{"s":"승용차협회지부 최동수 : 2026년 파워배터리 시장은 \"두 영웅의 점유율이 완화되고, 2세대는 상승세를 가속화한다\"는 추세를 보일 것이다.","so":"Jiemian.com","tm":"11/23 18:04","c":1,"r":"cn","u":"https://www.jiemian.com/article/15362947.html","p":1795424688,"a":1795434999,"t":"乘联分会崔东树：2026年动力电池市场呈现“双雄份额松动，二线梯队加速崛起”态势","su":"11월 23일, Cui Dongshu 승용차협회 사무총장은 \"신에너지 자동차 리튬(배터리에 꼭 들어가는 아주 가벼운 금속) 배터리 시장 분석 - 2026년 10월\"을 발표했습니다. 최동수 분석에 따르면 2026년 파워 배터리 시장은 '두 영웅의 주가는 하락세를 보이고, 2위권은 상승세(오르는 흐름)를 가속화'하는 추세를 보일 것으로 보인다. CATL은 여전히 44.0%의 점유율로 시장을 선도하고 있지만, 분기 대비 감소했습니다(4분기에는 40.5%로). BYD는 19.1%로 소폭 상승했다. 동시에 궈쉬안(6.1%), EVE에너지(5.5%), 지리자동차 Yaoning(2.5%) 등 2위 기업의 주가가 크게 상승했습니다. 후발 기업(Doufuoduo, Funeng Technology 등)의 주식은 기본적으로 청산되었습니다. 전체적인 산업집중도는 낮아지고 경쟁은 더욱 다양해졌습니다."},{"s":"중국의 전기 트럭 붐으로 리튬 수요 증가","so":"Reuters","tm":"11/23 16:31","c":1,"r":"world","u":"https://www.reuters.com/business/autos-transportation/chinas-electric-truck-boom-lifts-demand-lithium-2026-11-23/","p":1795419060,"a":1795424011,"t":"China's electric truck boom lifts demand for lithium"},{"s":"단말측 AI 폭발이 배터리 수요 확대와 기술 발전을 견인하고 있다! Sanhua Intelligent Control과 Kedali는 7% 이상 상승했고, 배터리 ETF China Universal(159796) 지수는 2.5% 이상 상승했으며, CATL은 거의 60억 위안을 환매했습니다!","so":"Jiemian.com","tm":"11/23 16:19","c":1,"r":"cn","u":"https://m.jiemian.com/article/15362201.html","p":1795418376,"a":1795424010,"t":"端侧AI爆发，推动电池需求扩容与技术进步！三花智控、科达利涨超7%，电池ETF汇添富(159796)指数涨超2.5%，宁德时代回购近60亿元！","su":"11월 23일 오후 A주(중국 본토(상하이·선전) 주식시장의 주식) 시장은 급등했고 상하이 주가지수는 하락폭을 줄였습니다! 보도시간 현재 배터리 ETF(여러 주식을 묶어 파는 상품) 차이나유니버셜(159796)의 기초지수가 반격하며 2.5% 이상 상승하며 7년 연속 마이너스 행진을 마감할 것으로 예상된다."},{"s":"[단독] 한진, 에코프로와 합작사 설립…배터리 물류 사업 본격화","so":"서울경제","tm":"11/23 16:10","c":1,"r":"kr","u":"https://www.sedaily.com/article/20117841","p":1795417845,"a":1795424008,"su":"단독한진, 배터리 물류 드라이브...에코프로와 합작법인 설립 에코한진물류 지분(회사를 나눠 가진 몫) 49% 확보 7월부터 가동…사업영역 확대 한진이 에코프로그룹과 손잡고 배터리 물류 합작법인을 설립했다. 이차전지 제조설비 운송과 항공운송 인증 취득 등으로 배터리 관련 역량을 쌓은 데 이어 이차전지 소재 기업과 공동 사업에 나서며 배터리 물류사업을 확대하는 모습이다. 23일 물류업계에 따르면 한진은 에코프로 자회사(다른 회사가 주인인 회사) 에코로지스틱스와 공동 출자해 에코한진물류센터를 설립하고 지분 49%를 확보했다."},{"s":"포스코퓨처엠 \"차세대 음극재, 매달 수백건 테스트\"","so":"한국경제","tm":"11/23 16:08","c":1,"r":"kr","u":"https://www.hankyung.com/article/202611234670i","p":1795417694,"a":1795424008,"su":"포스코퓨처엠 \"차세대 음극재(충전할 때 전기를 받아 모아 두는 쪽 재료), 매달 수백건 테스트\", 세종기술연구소 현장 가보니 저팽창 천연흑연 2세대 연내 출시 실리콘 음극재 양산도 초읽기 \"탈중국 공급망(부품·재료가 오가는 연결망) 수요 적극 대응\""},{"s":"'산업자료' 승용차협회 : 10월 파워배터리 생산량은 245.1GWh로 전년 동기 대비 44% 증가","so":"etnet 經濟通","tm":"11/23 15:44","c":1,"r":"hk","u":"http://www.etnet.com.hk/www/tc/news/news-article.php?section=categorized&category=china&newsid=20261123755","p":1795416240,"a":1795417554,"t":"《行業數據》乘聯分會：10月動力電池產量245.1GWh，同比增44%","su":"2026-11-23 14:44 \"업계 자료\" 승용차협회지부: 10월 파워 배터리 생산량은 245.1GWh로 전년 동기 대비 44% 증가했습니다. 승용차협회 지부 Cui Dongshu는 10월 전력 배터리 생산량이 245.1GWh로 전년 대비(작년 같은 때와 비교해서) 44% 증가했다고 밝혔습니다. 이 중 인산철리튬은 213.1GWh로 전년 동기 대비 56% 증가했고, 삼원리튬은 31.7GWh로 전년 동기 대비 6% 감소했다. 1~10월 누적 생산량은 2078.1GWh로 전년 동기 대비 61% 증가했으며, 인산철리튬 누적 생산량은 1736.4GWh로 전년 대비 70% 증가했다. 2026년 10월에는 전년 대비 18% 증가한 99GWh의 전기차 배터리(전기차를 움직이는 큰 충전 배터리)가 차량에 장착될 예정입니다. 구조는 극도로 차별화됐다. 인산철리튬은 86GWh(87%)로 전년 대비 28% 증가했다. 삼원리튬은 13GWh에 불과해 전년 대비 22% 감소했다. 1월부터 10월까지 총 676GWh가 설치돼 전년 동기 대비 17% 증가했는데, 이 중 인산철리튬이 564GWh(83% 차지)에 달했고 삼원계는 111GWh에 불과했다."},{"s":"LG엔솔, 배터리사 최초 UN 주도 ‘지속가능발전 선도기업’ 선정","so":"Chosunbiz","tm":"11/23 15:40","c":1,"r":"kr","u":"https://biz.chosun.com/industry/company/2026/11/23/QG25EIWP6FEP7C77OZVI5CBMEI/","p":1795416000,"a":1795417549,"su":"LG에너지솔루션이 국내 배터리 기업 가운데 최초로 유엔글로벌콤팩트(UNGC) 한국협회 리드(LEAD) 기업에 선정됐다고 23일 밝혔다. UNGC는 국제연합(UN)이 주도하는 지속가능경영 협의체로, 지속가능발전목표(SDGs) 달성에 기여한 회원사를 대상으로 선도기업을 선정해왔다. LG에너지솔루션은 2022년 4월 UNGC에 가입한 이후 기후변화 대응, 환경·사회·지배구조(ESG) 경영, 지속가능성 의제와 관련한 협회 주요 활동과 프로그램에 적극 참여해왔다."},{"s":"중국 흑연 수출 통제에 실리콘 전지소재 부각, 김종우 SK넥실리스 실리콘 음극재용 동박 선점 나서","so":"비즈니스포스트","tm":"11/23 15:26","c":1,"r":"kr","u":"https://www.businesspost.co.kr/BP?command=article_view&num=452663","p":1795415205,"a":1795424008,"su":"실리콘 음극재(충전할 때 전기를 받아 모아 두는 쪽 재료)는 기존 흑연 음극재보다 에너지밀도가 약 10배 높아, 배터리 성능을 높일 수 있는 차세대 소재로 불린다. 다만 현재 충·방전 과정에서 음극재가 부풀어오르는 기술적 걸림돌로 상용화(실제로 팔고 쓰이기 시작하는 것)가 늦어지고 있다. SK넥실리스는 이같은 기술적 허들을 넘을 수 있는 실리콘 음극재용 전용 동박을 최근 개발하는 데 성공했다. 김종우 SK넥실리스 대표이사 사장은 실리콘 음극재용 동박 시장을 선점해 오랜 실적 부진에서 벗어난다는 계획이다."},{"s":"배터리ETF 인베스코(159757) 추적지수 중국증권 신에너지차 배터리지수는 2.22% 상승해 지난 1년간 최저 평가에 도달했다.","so":"Jiemian.com","tm":"11/23 15:02","c":1,"r":"cn","u":"https://m.jiemian.com/article/15361911.html","p":1795413720,"a":1795417551,"t":"电池ETF景顺(159757)跟踪指数国证新能源车电池指数上涨2.22%，跟踪指数已处近1年估值低位","su":"2026년 11월 23일 14시 2분 기준, 배터리 ETF(여러 주식을 묶어 파는 상품) 인베스코(159757) 추적지수 국가증권 신에너지차 배터리 지수는 2.22% 상승했으며, 추적지수는 지난 1년 동안 낮은 평가를 유지해왔다."},{"s":"직접회사: 탄산리튬 가격 하락 사이클에서 간펑리튬이 최대 4억 위안을 환매하는 것은 어떤 의미가 있습니까? (Zuo Jianming)","so":"第一财经","tm":"11/23 14:48","c":1,"r":"cn","u":"https://www.yicai.com/video/103450115.html","p":1795412904,"a":1795414348,"t":"直通公司：碳酸锂价格下行周期中，赣锋锂业最高4亿元的回购有怎样的意义？（左剑明）","su":"제일재경 2026-11-23 13:46:59 저자: Fang Ruoyuan 편집자: Gu Jie Direct 회사: 탄산리튬(배터리 재료로 쓰는 리튬 가루) 가격 하락 사이클에서 간펑 리튬 산업이 최대 4억 위안을 환매하는 것은 어떤 의미가 있습니까? (Zuo Jianming) Fang Ruoyuan 1118 직접 회사: Shenghong Technology, 손님: 시장 담당자 Zuo Jianming 1117 직접 회사: Liyang Chip, 손님: 시장 담당자 Zuo Jianming 직접 회사: Satellite Chemical은 신소재 프로젝트에 207억 위안을 투자했습니다. 순환 레이아웃의 의도는 무엇입니까? (Zuo Jianming) 1104 직접 회사: Dahua, 손님: 시장 참가자 Zuo Jianming 1021 직접 회사: Hengli Petrochemical, 손님: 시장 참가자 Zuo Jianming"}]},{"name":"⚡ 전고체배터리·ESS","note":"보유: KODEX 전고체배터리ESS TOP2플러스","breaking":false,"items":[{"s":"중국 최초의 600MW 압축 공기 에너지 저장 시스템 확장기가 생산 라인에서 성공적으로 출시되었습니다.","so":"央视网","tm":"11/25 13:31","c":4,"r":"cn","u":"https://news.cctv.com/2026/11/25/ARTIkgQ4mgsDIZQEdz8okktV261125.shtml","p":1795581079,"a":1795582121,"t":"我国首套600MW级压缩空气储能系统膨胀机顺利下线","su":"최근 중국은 압축 공기 에너지 저장 시스템의 연구 개발에 획기적인 발전을 이루었습니다. 중국과학원 열물리공학연구소와 China Reserve Guoneng (Beijing)가 개발한 세계 최초의 600MW 압축 공기 에너지 저장 시스템 확장기가 통합 테스트를 완료하고 성공적으로 생산 라인을 가동했습니다."},{"s":"L&T, 구자라트에서 300MW급 배터리 에너지 저장 프로젝트 개발 수주","so":"The Economic Times","tm":"11/25 15:13","c":3,"r":"us","u":"https://m.economictimes.com/industry/renewables/lt-secures-major-300-mw-battery-energy-storage-project-in-gujarat-to-enhance-renewable-energy-integration/amp_articleshow/136150348.cms","p":1795587180,"a":1795589915,"t":"L&T wins order to develop 300 MW battery energy storage project in Gujarat","su":"Larsen & Toubro는 300MW/900MWh 배터리 에너지 저장 시스템을 개발하기 위한 중요한 주문을 확보했습니다. 이 프로젝트는 구자라트주 카브다(Kavda)에 위치하고 있으며 재생 가능 에너지 저장 능력을 향상시키는 데 중점을 두고 있습니다. 이 시설은 잉여 재생 에너지를 저장했다가 수요가 가장 많은 기간에 공급할 것입니다. 인도 내 전력망(발전소 전기를 집·공장까지 보내는 전깃줄 그물) 안정성과 신뢰성을 향상시키는 것을 목표로 합니다."},{"s":"삼기에너지솔루션즈, UGV 플랫폼용 배터리팩 발주 접수","so":"뉴시스","tm":"11/25 11:07","c":3,"r":"kr","u":"https://www.newsis.com/view/NISX20261125_0003882473","p":1795572443,"a":1795577496,"su":"[서울=뉴시스] 김경택 기자 = 이차전지 부품 전문기업 삼기에너지솔루션즈는 최근 로봇 전문기업 비욘드로봇으로부터 무인지상차량(UGV) 플랫폼용 배터리팩 발주를 접수했다고 25일 밝혔다. 회사 측에 따르면 이번 제품은 과학기술정보통신부 국책과제로 개발 중인 험지주행 UGV 플랫폼에 적용될 예정이다.회사는 배터리관리시스템(BMS(배터리를 안전하게 관리하는 장치))과 배터리팩을 자체 설계·제작하.."},{"s":"아이씨에이치, 美 친환경 정책 기대감…ESS 배터리 소재 공급 확대","so":"뉴시스","tm":"11/25 10:54","c":3,"r":"kr","u":"https://www.newsis.com/view/NISX20261125_0003882444","p":1795571652,"a":1795574646,"su":"[서울=뉴시스] 김경택 기자 = 첨단 전자소재 전문기업 아이씨에이치는 미국의 친환경 에너지 정책 강화 기대감이 커지고 있는 가운데 에너지저장장치(ESS(전기를 저장해 두는 큰 배터리)) 배터리용 소재 공급을 확대할 예정이라고 25일 밝혔다.회사 측에 따르면 미국 중간선거 이후 친환경 에너지 정책이 강화될 것이라는 기대감에 ESS 산업이 다시 주목받고 있다. 미국의 정책 변화로 ESS 투자.."},{"s":"솔리스, 태평양 도서국 태양광·ESS 사업 본입찰 참여","so":"이데일리","tm":"11/25 11:54","c":2,"r":"kr","u":"https://www.edaily.co.kr/News/Read?newsId=02607606645649328&mediaCodeNo=257","p":1795575296,"a":1795577496,"su":"한화플러스제5호스팩(498390)과 합병 상장을 추진 중인 공정 유틸리티 설비 전문기업 솔리스가 태평양 도서국의 태양광·에너지저장장치(ESS(전기를 저장해 두는 큰 배터리)) 구축 사업 본입찰에 참여하며 신재생에너지(햇빛·바람처럼 다시 쓸 수 있는 에너지) 분야로 사업 영역 확대에 나선다. 솔리스는 국제개발기구 재원으로 추진되는 태평양 ..."},{"s":"중국 손해보험과 Xiqing Energy는 에너지 저장 보험을 '경험 가격 책정'에서 '데이터 가격 책정'으로 촉진하기 위한 전략적 협력에 도달했습니다.","so":"經濟日報","tm":"11/23 21:00","c":2,"r":"tw","u":"https://money.udn.com/money/story/123828/9897045?from=edn_next_story","p":1795435231,"a":1795440104,"t":"中意財險與西清能源達成戰略合作，推動儲能保險從「經驗定價」邁向「數據定價」","su":"홍콩, 2026년 11월 23일 /PRNewswire/ -- 최근 중국그룹 손해보험유한공사(이하 '중국그룹 손해보험')와 베이징시칭에너지기술유한회사(이하 '시칭에너지')가 공식적으로 전략적 협력 계약을 체결했다. 이번 협력은 중국 최고의 에너지 저장 보안 기술 회사와 세계적으로 유명한 보험 그룹 간의 심층적인 협력을 의미합니다. Xiqing Energy의 능동 안전 기술은 GICC의 에너지 저장 발전소 인수 및 위험 가격 책정 프로세스에 깊이 통합될 것입니다. 양 당사자는 에너지 저장 자산 위험 관리를 위한 새로운 표준을 공동으로 확립하고, \"RaaS(Risk as a Service)\"를 핵심으로 하는 \"수동적 청구\" 모델에서 \"능동적 방어\"로 업계의 전환을 촉진하고, 업계를 선도하여 고품질, 저위험 개발 모델을 구축하고 글로벌 지속 가능한 개발에 힘을 실어줄 것입니다. AI 기반 언더라이팅 양 당사자는 실제 발전소 운영 정보와 배터리 안전 등급을 기반으로 지능형 언더라이팅 플랫폼을 공동 개발할 예정입니다. 플랫폼은 인수 양식을 기반으로 구조화된 자금 수집을 수행합니다. 과거 경험적 결함 라이브러리의 배터리 안전 위험 평가, 발전소 운영 정보의 비정형 특징 재구성, 도메인 수직형 대형 모델을 기반으로 한 포괄적인 위험 진화 추세 분석 및 판단과 같은 기술적 수단을 통해 에너지 저장 발전소의 주요 위험 매개변수를 표준화되고 비교 가능한 위험 점수로 변환하고 맞춤형 인수 계획을 동적으로 생성합니다. 해야 한다"},{"s":"에너지 저장 정책은 장기적으로 좋습니다. Southern Fund의 신에너지 ETF Southern(516160)은 이전 거래일에 3.00% 하락한 기초 지수 CSI New Energy Index(399808.SZ)를 추적합니다.","so":"财联社","tm":"11/23 15:45","c":2,"r":"cn","u":"https://www.cls.cn/detail/2541481","p":1795416359,"a":1795417562,"t":"储能政策长期利好，南方基金旗下新能源ETF南方(516160)跟踪标的指数中证新能源指数(399808.SZ) 前一交易日收跌3.00%"},{"s":"진랑테크(솔리스)는 태양 에너지 저장에 5억 4400만 위안을 투자하여 태양광 발전소의 오래된 장부를 찢었습니다. 에너지 저장이 모든 것에 대한 답이 될까요? -36Kr","so":"www.36kr.com","tm":"11/23 11:48","c":2,"r":"cn","u":"https://www.36kr.com/p/4080484433974919","p":1795402092,"a":1795403803,"t":"锦浪科技5.44亿弃光投储，撕开光伏电站的旧账本，储能成为一切的答案？-36氪","su":"진랑테크(솔리스)는 태양 에너지 저장에 5억 4400만 위안을 투자하여 태양광(햇빛으로 전기를 만드는 것) 발전소의 오래된 장부를 찢었습니다. 에너지 저장이 모든 것에 대한 답이 될까요? 소득 모델에 따라 태양광 에너지 저장 트랙 사이에 새로운 에너지 자금이 흐릅니다. Foresight Energy는 11월 20일 저녁 진랑테크(솔리스)가 이사회에서 \"분산형 태양광 발전소 프로젝트\"를 종료했다고 발표했다는 사실을 알게 되었습니다. 본 프로젝트는 당초 3억 5400만 위안을 투자할 계획이었으나 11월 13일 현재 한 푼도 투자하지 않았다. 회사는 2개의 인버터 프로젝트에서 1억 8900만 위안을 추가로 조정하여 8GWh 에너지 저장 시스템의 연간 생산량에 5억 4400만 위안을 투자했습니다. 이에 앞서 GCL Energy Technology도 유사한 자금 재분배를 수행했지만 에너지 저장 절감액을 다시 태양광 발전으로 이전한 회사도 있었습니다. 돈이 두 선로 사이를 오가며 그 이유는 송풍구의 순환만큼 단순하지 않습니다. 전기 가격 메커니즘, 그리드 연결 규칙 및 수익 모델이 동시에 다시 작성되었습니다. 지붕은 여전히 그대로인데 계산대에서 결제방법이 바뀌었습니다."},{"s":"동화일렉트로라이트, 북미서 신규 배터리 고객사 확보","so":"디일렉","tm":"11/25 17:26","c":1,"r":"kr","u":"https://www.thelec.kr/news/articleView.html?idxno=65915","p":1795595193,"a":1795608210,"su":"동화일렉트로라이트가 북미 전해액 사업의 고객 기반을 확대했다. 신규 고객사는 글로벌 배터리 시장 점유율 상위 10대 기업 중 한 곳이다.동화일렉트 51)推進鈉離子電池研發及產業項目，規劃建築面積6.6萬平方米","su":"2026/11/25 08:50 차오웨이파워 (00951)는 계획된 건축 면적이 66,000m2에 달하는 나트륨 이온 배터리(리튬 대신 소금 성분을 쓰는 배터리) 연구 개발 및 산업 프로젝트를 추진하고 있다고 발표했습니다. 차오웨이파워 (00951)는 안후이성 안칭시에 있는 그룹의 기존 공장 건물을 활용하고 새로운 R&D, 생산 및 지원 시설과 협력하여 나트륨 이온 배터리 R&D 및 산업화 프로젝트를 촉진할 계획이라고 발표했습니다. 약 66,000평방미터의 건설 계획 면적으로 기술 R&D, 셀 제조 및 배터리 팩 시스템 통합을 통합하는 기반을 구축합니다. 그룹은 이 프로젝트가 자동화 장비를 사용하고 에너지 및 비용 관리 시스템을 도입하여 나트륨 이온 배터리를 생산하는 지능형 생산 라인을 구축하여 생산 효율성, 제품 일관성 및 운영 관리 수준을 향상시킬 계획이라고 밝혔습니다. 그룹은 생산 공정의 디지털화 및 지능화를 촉진하고, 에너지 절약 단지 건설, 에너지 저장 및 전력 배터리 셀(배터리를 이루는 가장 작은 한 칸) 생산 라인 건설과 협력하여 R&D 및 산업화 역량을 강화할 계획입니다."},{"s":"아이씨에이치, 열폭주 늦추고 완충력 높였다…난연 PU폼 美 ESS 공략 - 머니투데이","so":"머니투데이","tm":"11/25 09:48","c":1,"r":"kr","u":"https://www.mt.co.kr/index.php/stock/2026/11/25/2026112509440988304","p":1795567698,"a":1795574646,"su":"첨단 전자소재 전문기업 아이씨에이치가 난연(불이 잘 붙지 않는 성질) 폴리우레탄(PU)폼을 앞세워 미국 에너지저장장치(ESS(전기를 저장해 두는 큰 배터리)) 시장 공략에 나선다. 아이씨에이치는 미국의 친환경 에너지 정책 강화에 따른 ESS 투자 확대가 예상되면서 ESS 배터리 모듈용 소재 공급을 늘릴 계획이라고 25일 밝혔다."},{"s":"[모닝 리포트] \"지투파워, 원전·액침냉각 ESS 성장에 기업가치 재평가 기대\"","so":"뉴스핌","tm":"11/25 09:12","c":1,"r":"kr","u":"https://www.newspim.com/news/view/20261125000096","p":1795565520,"a":1795589915,"su":"[서울=뉴스핌] 이나영 기자= 한국IR협의회 기업리서치센터는 25일 지투파워에 대해 원전용 고압배전반 매출 본격화와 태양광·에너지저장장치(ESS) 사업 확대에 힘입어 내년 사상 최대 실적을 기록할 것으로 전망했다. 투자의견(전문가가 사라·팔라고 내는 의견)과 목표주가(전문가가 예상한 앞날의 주가)는 별도로 제시"},{"s":"장기화하는 데이터 센터나 전력망용 배터리(ESS)의 계통 접속, 해결책에 수전 제한 등을 도입에","so":"ITmedia","tm":"11/25 07:00","c":1,"r":"jp","u":"https://www.itmedia.co.jp/smartjapan/articles/2611/25/news029.html","p":1795557600,"a":1795560830,"t":"長期化するデータセンターや系統用蓄電池の系統接続、解消策に受電制限などを導入へ","su":"자원에너지청의 '차세대 전력계통 워킹그룹'의 제14회 회의에서 데이터센터(컴퓨터 수만 대를 모아 둔 건물) 등의 대규모 수요와 전력망용 배터리(ESS(전기를 저장해 두는 큰 배터리))의 조기연계책으로 'N-1 수전정지'나 특정 시간대의 수전제한 등에 대한 구체적인 검토안이 제시됐다."},{"s":"中 국영 저장 프로젝트, 배터리 성능 미달로 ‘1억 위안 납-탄소 배터리 소송’ 직면","so":"글로벌이코노믹","tm":"11/25 06:05","c":1,"r":"kr","u":"https://www.g-enews.com/view.php?ud=2026112422213726990c8c1c064d_1&ssk=2017011301560109486_1","p":1 9,"a":1795521542,"t":"前沿科技科普解读丨动画：虚拟电厂——移动储能，电动汽车化身调节单元","su":"최첨단 과학 기술의 해석 | 애니메이션: 가상 발전소 - 이동형 에너지 저장 장치, 전기 자동차가 규제 장치가 됨 - 주차 공간에 주차된 전기 자동차, 마이크로 에너지 저장 장치로 전환할 수 있는 전기차 배터리(전기차를 움직이는 큰 충전 배터리)가 장착됨. 양방향 충전 파일의 V2G 차량 네트워크 상호 작용 기술을 기반으로 전기 에너지가 양방향으로 흐르며 차량은 더 이상 단순한 전기 장비가 아닙니다. 가상발전소(흩어진 태양광·배터리를 하나의 발전소처럼 묶어 쓰는 것)는 신에너지 차량을 대거 모아 전력과 주차기간을 조율하고 충전과 방전을 자동으로 계획한다. 자동차 소유자의 여행 전력 안전 보장을 전제로 전력망 규제에 참여하고 피크-밸리 가격 차이를 통해 수익을 얻을 수 있습니다. 이 애니메이션에서 자동차-네트워크 상호작용의 미스터리를 함께 풀어봅시다. 과학 고문: State Grid Jiangsu Electric Power 마케팅 서비스 센터 부하 관리 부서 부국장 및 수석 엔지니어 Zhou Yuqi, 중국 과학 기술 협회 과학 대중화 부서, 중국 에너지 연구 협회, Xinhuanet, 공동 제작"},{"s":"출시된 지 반년도 안 돼 매출이 10배나 늘었다. GEYOTO는 어떻게 북미 에너지 저장 시장을 돌파할 수 있나요?","so":"Jiemian.com","tm":"11/24 18:46","c":1,"r":"cn","u":"https://www.jiemian.com/article/15368524.html","p":1795513584,"a":1795521544,"t":"上线不到半年，销量增长十倍，GEYOTO如何破局北美储能市场？","su":"해외 진출에 관해 이야기할 때, 대부분의 사람들은 중국 기업이 자사의 제품 강점과 공급망(부품·재료가 오가는 연결망) 이점을 활용하여 어떻게 글로벌 시장에서 성숙한 브랜드에 도전할 수 있는지에 대해 더 많이 생각할 것입니다. 그러나 휴대용 에너지 저장 산업에서는 중국 브랜드의 역할이 바뀌었습니다. 프로스트앤설리번 데이터에 따르면 2025년 전 세계 휴대용 에너지 저장 시장의 상위 5개 기업 중 4개가 중국 기업이 될 것이며 전체 시장 점유율은 60.5%가 될 것입니다. [1] 많은 중국 브랜드가 글로벌 시장에서 선도적인 위치를 차지하고 성숙한 제품 시스템과 브랜드 인지도를 확립했습니다. 글로벌 휴대용 에너지 저장 시장의 선두주자로서 중국 브랜드는 해당 카테고리의 글로벌 시장을 확장하는 임무를 짊어질 뿐만 아니라 변화하는 소비자 수요에 맞춰 자신만의 성장 공간을 찾고 차별화된 브랜드 우위를 구축해야 합니다."},{"s":"전고체 배터리는 언제 사용할 수 있나요? 한 번 설명을 해보자.","so":"Jiemian.com","tm":"11/24 17:06","c":1,"r":"cn","u":"https://m.jiemian.com/video/AGUCMghmB2YBPlVl.html","p":1795507614,"a":1795530518,"t":"固态电池，到底啥时候能用上？一次给你说明白","su":"CATL, EVE에너지, 선그로우 등 전고체 배터리(액체 대신 고체를 넣은 안전한 배터리) 함유량 82% 이상, 동일 지수 1위, 20cm 전고체 배터리 투자 도구, 유연하고 \"완전한\" # 보석 배터리 ETF(여러 주식을 묶어 파는 상품) 화안 158079 #배터리 #고체 배터리 # 신에너지 # 투자 #ETF #华安ETF"},{"s":"화웨이 스마트 스트링 그리드 포밍 ESS 플랫폼, TÜV SÜD로부터 업계 최초로 최고 수준(L4) 그리드 포밍 기능 인증 획득","so":"The Straits Times","tm":"11/24 16:42","c":1,"r":"sg","u":"https://www.straitstimes.com/paid-press-releases/huawei-smart-string-grid-forming-ess-platform-receives-the-industry 학, 항공우주 신기술 분야에서 단계별 성과를 달성했다."},{"s":"나가노현에서 잇따르는 축전지나 태양광 발전 시설 계획 현이 신고 기준을 강화로","so":"信濃毎日新聞デジタル","tm":"11/24 06:03","c":1,"r":"jp","u":"https://www.shinmai.co.jp/news/article/gf01dc21008vbt4um9igs1eg","p":1795467780,"a":1795474296,"t":"長野県で相次ぐ蓄電池や太陽光発電施設計画 県が届け出基準を厳格化へ","su":"현의 새로운 경관 계획에서는, 사업자가 전기 공급 시설이나 태양광(햇빛으로 전기를 만드는 것) 발전 시설을 설치할 때, 사전의 신고를 의무화하는 대상을 확대했다=그림. 현내를 포함한 각지에서 전기 공급 시설의 설치 계획이 잇따르는 등, 최근의 시설 정비의 동향을 근거로 엄격화한다. 2027년 4월 1일에 운용을 시작해 5월 2일 이후에 착수하는 공사로부터 적용한다. 축전지 시"},{"s":"해외조사 및 선정 | 골드만삭스: 글로벌 배터리 수급 비율은 2029년 바닥을 칠 수 있고, 에너지 저장 성장은 초과분을 상쇄하기 어려울 것","so":"财联社","tm":"11/24 05:26","c":1,"r":"cn","u":"https://www.cls.cn/detail/2506034","p":1795465591,"a":1795503278,"t":"海外研选 | 高盛：全球电池供需比或2029年触底 储能增长难抵过剩","su":"① 미국은 전기차 배터리(전기차를 움직이는 큰 충전 배터리) 과잉을 지속하고 있으나, 에너지 저장 배터리의 현지 생산 능력이 부족하다. ② 한국 배터리 업체들의 유럽 시장 점유율은 부분적으로 안정됐지만, 중국의 수입 경쟁은 여전히 치열하다. ③ 국내 배터리셀 제조사들은 2027년과 2028년 이익 전망치를 평균 10% 낮췄는데, CATL의 에너지 저장장치 전환이 유망하다. 차이롄서, 10월 15일(편집자 Xia Junxiong) 골드만삭스는 10월 14일 글로벌 배터리 산업 조사 보고서를 발표했습니다. 이는 에너지 저장 시장의 급속한 확장으로 배터리 수요 전망이 개선되고 있지만, 글로벌 배터리 산업은 여전히 과잉 생산 능력, 지역 시장 수급(사려는 사람과 팔려는 사람의 힘겨루기) 불균형 및 치열한 시장 경쟁에 직면해 있으며, 이는 업계가 사이클이 바닥을 쳤다는 것을 확인하기에 충분한 신호를 아직 보지 못했다는 것을 의미합니다. 은행은 중국 외 배터리 시장의 수급 공급률은 2027년을 바닥으로, 글로벌 시장은 2029년까지 수급 전환점이 이뤄지지 않을 것으로 내다봤다."},{"s":"에너지 인허가 개편안 美상원 통과에 태양광·ESS 수혜 가속화 - 머니투데이","so":"머니투데이","tm":"11/24 05:20","c":1,"r":"kr","u":"https://www.mt.co.kr/amp/industry/2026/11/24/2026112314435883552","p":1795465200,"a":1795490316,"su":"미국 상원의 에너지 인허가 개편안 통과로 국내 태양광·배터리 업계의 수혜 기대감이 커지고 있다. 데이터센터(컴퓨터 수만 대를 모아 둔 건물) 전력 공급과 전력망 확충 비용 부담을 사업자에게 부과하고 신재생에너지 발전사업의 인허가 절차를 간소화하는 내용이 담기면서 미국 내 발전·ESS(에너지저장장치(전기를 저장해 두는 큰 배터리)) 프로젝트 확대와 기자재 수요 증가로 이어질 수 있다는 분석이다."},{"s":"지역 경제의 지금 (34) 도쿠시마 배터리 밸리 구상 축전지 산업, 성장의 기둥에","so":"日刊工業新聞","tm":"11/24 05:00","c":1,"r":"jp","u":"https://www.nikkan.co.jp/articles/view/797784","p":1795464000,"a":1795474297,"t":"地域経済の今（34）徳島バッテリーバレイ構想 蓄電池産業、成長の柱に"},{"s":"인도 올라 전기(올라 일렉트릭)는 중장기적으로 배터리 셀 용량을 6GWh에서 20GWh로 확장하는 것을 목표로 하고 있다.","so":"AutoTechInsight","tm":"11/23 23:51","c":1,"r":"world","u":"https://autotechinsight.spglobal.com/news/5291559/indias-ola-electric-aims-to-scale-battery-cell-capacity-from-6-gwh-to-20-gwh-in-mid-to-long-term","p":1795445496,"a":1795478670,"t":"India’s Ola Electric aims to scale battery-cell capacity from 6 GWh to 20 GWh in mid- to long-term","su":"이번 확장은 인도의 첨단 화학 셀 생산 연계 인센티브 프로그램에 따라 Ola가 최대 20GWh를 할당한 것과 일치합니다."},{"s":"Ges 수소-망간 배터리: 이탈리아에 첫 설치","so":"Il Sole 24 ORE","tm":"11/23 21:40","c":1,"r":"world","u":"https://en.ilsole24ore.com/art/ges-branded-hydrogen-manganese-batteries-first-installation-in-italia-AJq2n0PC","p":1795437651,"a":1795504275,"t":"Ges hydrogen-manganese batteries: first installation in Italia","su":"인테사는 Trentino 기반 스타트업의 확장을 돕기 위해 천만 달러를 제공하고 있습니다. 계획에는 이탈리아와 스페인에 두 번째 데모 공장도 포함됩니다."},{"s":"[Q&A룸] 당성기술(당성테크): 다양한 고체전해질이 주요 고객들로부터 검증을 거쳐 소량으로 구현되었습니다.","so":"中证网","tm":"11/23 21:07","c":1,"r":"cn","u":"https://jnzstatic.cs.com.cn/zzb/htmlInfo/138993.html","p":1795435620,"a":1795440102,"t":"【答疑室】当升科技： 多款固态电解质已通过头部客户验证并实现小批量应用","su":"[Q&A룸] 당성기술(당성테크): 다수의 고체 전해질(배터리 안에서 전기 알갱이가 지나다니는 길)이 주요 고객들로부터 검증을 거쳐 소량으로 구현되었습니다. 최근 한 투자자가 대화형 플랫폼에서 당성테크에 질문했습니다. 회사의 전고체 양극재(배터리에서 전기를 내보내는 쪽의 핵심 재료) 연구 개발 및 마케팅에 새로운 진전이 있습니까? 에너지 저장을 위한 15차 5개년 계획은 회사에 어떤 개발 기회를 제공합니까?"},{"s":"Tonghe Technology: 10억 3천만 위안을 투자하여 컴퓨팅 전력 및 에너지 저장 통합 전력 장비 프로젝트 구축 계획","so":"第一财经","tm":"11/23 20:12","c":1,"r":"cn","u":"https://www.yicai.com/brief/103450754.html","p":1795432320,"a":1795435007,"t":"通合科技：拟投资10.03亿元建设算力储能一体化电源装备项目","su":"Tonghe Technology는 회사가 스자좡시 하이테크 구역 과학 기술 기업 단지 관리 사무실과 구역 진입 계약을 체결하고 총 투자액 10.0의 통합 컴퓨팅 성능 및 에너지 저장 지능형 완전 전원 공급 장치 산업화 프로젝트 건설에 투자할 계획이라고 발표했습니다."},{"s":"포스코 AI데이터센터·ESS용 새 철강재 개발 박차, '지속가능소재 포럼'서 협약 26건 체결","so":"비즈니스포스트","tm":"11/23 16:44","c":1,"r":"kr","u":"https://www.businesspost.co.kr/BP?command=article_view&num=452684","p":1795419882,"a":1795424019,"su":"포럼에는 포스코의 국내외 고객사 450여 곳의 관계자 1000여 명이 참석했다. 포럼에서는 AI 데이터센터(컴퓨터 수만 대를 모아 둔 건물), 전력 인프라, 에너지저장장치(전기를 저장해 두는 큰 배터리) 등에 요구되는 고내식성, 전자파 차폐, 고효율, 저탄소 배출 등의 요건을 충족하는 철강재 사업과 관련한 현황과 전략이 제시됐다. 조너선 브릴 스페셜프로젝트에이전시 대표이사의 기조강연을 시작으로 구글 클라우드, 유비테크 로보틱스 등의 기업 관계자들까지 총 31건의 강연이 진행됐다."},{"s":"오늘 1차 액티브 ETF가 상장됐고, 배터리 리더는 12개 ETF로 공동배분됐다 - 배터리 ETF에 주목하고 영원히 승리하라(158019)","so":"21财经","tm":"11/23 16:40","c":1,"r":"cn","u":"https://www.21jingji.com/article/20261123/herald/c93a35e27a33056579250b5814ea5f3c.html","p":1795419600,"a":1795447031,"t":"首批主动ETF今日挂牌、电池龙头获12家ETF共同配置——关注电池ETF永赢（158019）","su":"11월 23일, 첫 번째 18개 활성 ETF(여러 주식을 묶어 파는 상품)가 상하이 및 선전 증권거래소에 공식 상장되어 총 360억 위안을 모금했습니다. 신청 및 환매 목록에 따르면 목록의 예상 포지션 규모를 기준으로 구이저우 마오타이, 메이디그룹 및 CATL이 상위 3대 비중 주식에 속합니다. ETF 배정수량은 CATL이 12개 ETF로 배정돼 전체 종목 중 1위를 기록했다(자료출처: Wind, 2026/11/20 기준). 지수 가중치에 따라 기계적으로 구매되는 패시브 상품과 달리 액티브 ETF(전문가가 골라 담는 ETF) 포지션은 펀드매니저가 독립적으로 선택합니다. 배터리 리더는 서로 다른 전략을 가진 12개의 액티브 ETF로 공동 할당되었습니다. 이는 가치, 배당, 균형 및 성장과 같은 다양한 스타일을 가진 액티브 운용 펀드가 배터리 산업 체인의 핵심 리더에 대해 공동으로 낙관적이라는 것을 의미합니다."},{"s":"전고체전지 안전표준사업이 정식 제정되어 서던펀드의 저가제품배터리 ETF 서던(159147)이 시장에서 활발히 활동하고 있습니다.","so":"Jiemian.com","tm":"11/23 16:30","c":1,"r":"cn","u":"https://www.jiemian.com/article/15362130.html","p":1795419035,"a":1795424020,"t":"固态电池安全标准正式立项，南方基金旗下低费率产品电池ETF南方(159147)盘中活跃","su":"14시 45분 현재 배터리 ETF(여러 주식을 묶어 파는 상품) Southern(159147)은 장중 거래량(하루 동안 사고판 주식 수)이 3705.69만위안으로 2.83% 변동되었습니다. 추적지수 CSI 배터리테마지수(931719)는 한때 3.13% 이상 상승했다가 현재 2.12% 상승 중이다."},{"s":"[기고] 1조달러 수출 강국 도약, 다음 10년 주역은 K배터리다","so":"전자신문","tm":"11/23 16:00","c":1,"r":"kr","u":"https://www.etnews.com/20261123000183","p":1795417200,"a":1795417560,"su":"대한민국 경제가 마침내 세계 네 번째로 '수출 1조달러'라는 금자탑을 쌓아 올렸다. 1964년 수출 1억달러를 달성한 지 62년 만에 이뤄낸 1만 배의 성장이자, 세계 4대 수출 강국으로 우뚝 선 역사적 쾌거다. 이번 성과는 일제 강점기의 아픔을 딛고 한국전쟁의 잿더미 속에서 맨손으로 일어나 '한강의 기적'을 일궈낸 대한민국이기에 더욱 벅찬 감동으로 다가온다. 1조달러 고지를 밟은 국가 중 식민 지배와 전쟁의 폐허를 모두 경험하고 이처럼 눈부신 성장을 이룬 나라는 대한민국이 유일하다."},{"s":"Puyuan Energy x QPO Energy, 글로벌 레이아웃을 위해 에너지 저장 소프트웨어와 하드웨어 통합 | 녹색산업 | 사업정보","so":"經濟日報","tm":"11/23 11:00","c":1,"r":"tw","u":"https://money.udn.com/money/story/5722/9891959","p":1795399233,"a":1795403805,"t":"普元能源x QPO Energy 整合儲能軟硬體 布局全球 | 綠色產業 | 商情","su":"이 글은 총 1,383개의 단어로 구성되어 있습니다. 전 세계적으로 에너지 전환이 가속화되고 있으며, 에너지 저장 산업은 전력 시스템에서 없어서는 안 될 부분이 되었습니다. Puyuan Energy Technology와 미국 회사인 QPO Energy는 소프트웨어 및 하드웨어 분야에서 각각의 기술적 이점을 결합하여 전략적 파트너가 되었습니다. 에너지 저장 시스템 통합, 에너지 관리 기술 및 국제 시장 자원을 통해 대만 및 해외 시장을 적극적으로 확장하고 경쟁이 치열한 에너지 저장 시장에서 시장 입지를 확립할 것입니다. QPO Energy 창립자 Joseph Lu는 그리드 에너지 저장 분야의 거인입니다. 그는 세계적으로 유명한 에너지 저장 시스템 통합업체인 포윈(Powin)을 설립하고 회장을 맡고 있다. 7년 연속 성공적인 창업 경험을 쌓은 그는 4년 전 QPO에너지를 창업해 에너지 저장 사업의 새 장을 열었다."},{"s":"ASX 배터리 주식, 전력망 저장장치(ESS) 지출 변화에 따라 자세히 살펴보기","so":"Yahoo Finance","tm":"11/23 10:07","c":1,"r":"us","u":"https://finance.yahoo.com/energy/articles/asx-battery-stocks-getting-closer-010751113.html","p":1795396020,"a":1795478669,"t":"ASX Battery Stocks Getting A Closer Look As Grid Storage Spending Shifts","su":"Snowy 2.0의 예산은 약 A$20억에서 A$250억에 달하며 대규모 전력 저장장치(ESS(전기를 저장해 두는 큰 배터리))를 호주의 첫 페이지 뉴스로 바꾸었고 프로젝트가 크고 복잡해지면 무엇이 잘못될 수 있는지에 대해 가혹한 조명을 보냈습니다. 이제 투자자들은 자본과 정책의 관심이 대안적인 저장 경로를 더 면밀히 살펴보면서 위험과 잠재적인 상승 여력을 모두 보고 있습니다. 이 기사에서는 이에 노출된 세 가지 주식을 살펴봅니다."},{"s":"유진證 “AI가 바꾸는 ESS 시장⋯LG엔솔·삼성SDI, 전력망 제어로 사업 확대”","so":"이투데이","tm":"11/23 08:04","c":1,"r":"kr","u":"https://www.etoday.co.kr/news/view/2651421","p":1795388640,"a":1795389922,"su":"▲월간 EV 판매량 추이. (출처=유진투자증권)인공지능(AI) 데이터센터(컴퓨터 수만 대를 모아 둔 건물) 확산으로 에너지저장장치(ESS(전기를 저장해 두는 큰 배터리)) 산업의 경쟁 기준이 배터리 저장용량에서 전력망"},{"s":"AI 데이터 센터 전력 공급, 에너지 저장 및 마이크로그리드 사업 기회로 대만의 중전력 산업 플레이어 유치","so":"DIGITIMES","tm":"11/23 01:51","c":1,"r":"tw","u":"https://www.digitimes.com.tw/tech/dt/n/shwnws.asp?id=775552","p":1795366282,"a":1795389924,"t":"AI資料中心搶通電 儲能、微電網商機引台重電業者卡位","su":"AI 데이터센터(컴퓨터 수만 대를 모아 둔 건물) 구축에 대한 열정은 식지 않고 있다. 미국의 승인 절차가 까다로워지고 일부 프로젝트가 지연됐지만 장기적인 확장 추세는 변하지 않았다. 동시에 전력 수요가 증가함에 따라 \"Time to Power\"는 점차 데이터 센터 운영자에게 가장 중요한 문제가 되었으며, 이로 인해 TECO, Shidian, Yali, ZTE 및 Huacheng과 같은 주요 대만 기업을 포함하여 에너지 저장, 마이크로그리드 및 자체 발전 발전에 대한 수요도 증가했습니다."}]},{"name":"🏭 AI 전력","note":"보유: ACE 코리아AI전력TOP10","breaking":false,"items":[{"s":"팀코리아 \"체코 원전사업 차질 없어…적기준공 약속 최우선\"","so":"연합뉴스","tm":"11/23 11:55","c":3,"r":"kr","u":"https://www.yna.co.kr/amp/view/AKR20261123079700003","p":1795402511,"a":1795414363,"su":"(서울=연합뉴스) 장보인 기자 = 체코 두코바니 원전 5·6호기 건설 사업을 진행하는 '팀코리아' 기업들이 적기 준공을 약속했다."},{"s":"Huacheng: 2030년 대규모 전력 주문으로 AIDC 전원 공급 시스템 사업 기회 포착 | 업계 핫스팟 | 산업","so":"經濟日報","tm":"11/25 17:22","c":2,"r":"tw","u":"https://money.udn.com/money/story/5612/9901479?from=edn_newestlist_rank","p":1795594937,"a":1795608227,"t":"華城：重電訂單看到2030年 搶攻AIDC供電系統商機 | 產業熱點 | 產業","su":"주요 중전력 제조업체인 Huacheng Electric의 CEO(회사의 가장 높은 책임자) Xu Yisheng은 AIDC(인공 지능 데이터 센터)가 전력망(발전소 전기를 집·공장까지 보내는 전깃줄 그물) 인프라에 대한 수요가 높으며 Huacheng Heavy Electric 제품의 주문 가시성이 203개로 증가했다고 지적했습니다."},{"s":"AI 컴퓨팅 성능에 대한 수요는 아직 정점에 도달하지 않았습니다. Huacheng: 미국 고객이 적극적으로 주문하고 있으며 가시성은 2030년에 도달할 예정입니다.","so":"自由時報","tm":"11/25 17:06","c":2,"r":"tw","u":"https://stock.ltn.com.tw/article/smykkkrtsejn","p":1795594002,"a":1795608228,"t":"AI算力需求還沒到頂 華城：美客戶積極下單 能見度達2030年","su":"화청(1519) CEO(회사의 가장 높은 책임자) 쉬이셩은 오늘(25일) AI 컴퓨팅 파워에 대한 수요가 아직 정점에 도달하지 않았다고 말했다. 미래에는 로봇, 자율주행(사람 대신 차가 스스로 운전하는 것), 드론과 같은 애플리케이션이 컴퓨팅 파워 구축의 차세대 물결을 주도할 것이며, 시장 수요는 적어도 2~3년 동안 여전히 성장할 여지가 있습니다. 화성은 미국으로의 수출 비중이 높다. 현재 전력회사 고객들은 여전히 적극적으로 상품을 추구하고 있으며, 관련 생산능력 수주 가시성은 2030년까지로 예정돼 있다. AIDC 건설 둔화세는 체감되지 않고, 내년 1분기 시장수요는 유지되고 있다."},{"s":"골드만삭스는 2028년까지 미국 데이터센터 붐으로 전력과 가스 수요가 늘어날 것이라고 말했다.","so":"CNA","tm":"11/25 12:22","c":2,"r":"sg","u":"https://www.channelnewsasia.com/business/goldman-says-us-data-center-boom-through-2028-will-lift-power-and-gas-demand-6580431","p":1795576968,"a":1795577510,"t":"Goldman says US data center boom through 2028 will lift power and gas demand","su":"11월 24일: 골드만삭스는 미국의 데이터 센터 전력 용량의 강력한 성장이 2028년까지 계속될 가능성이 높으며, AI 붐으로 인해 더 많은 규모의 전력 밀도가 높은 시설 건설이 추진됨에 따라 전력 및 천연가스 수요에 상승 위험을 초래할 것이라고 말했습니다. • 중개회사에서는 52기가와트가 추가로 필요하다고 밝혔습니다."},{"s":"성스러운 능선을 밝혀라! Mooshan Mountain House는 마이크로그리드 업그레이드를 완료하고 침대에는 전용 충전소를 갖추고 있습니다.","so":"自由時報","tm":"11/25 10:37","c":2,"r":"tw","u":"https://news.ltn.com.tw/news/life/breakingnews/5652430","p":1795570672,"a":1795574661,"t":"點亮聖稜線！桃山山屋完成微電網升級 床位設專屬充電座","su":"산장 전원 공급 안정성을 개선하고 순 제로 배출을 구현하기 위해 셰이파 국립공원 관리사무소는 민간 업계와 협력하여 \"세이파 보호, 산 여행을 밝게 하세요\" 프로젝트를 추진하고 첫 번째 시범 현장인 \"타오산 마운틴 하우스\"의 마이크로그리드 시스템 교체 및 업데이트를 완료하여 20년 이상 사용된 장비의 노후화 문제를 해결했습니다. 또한 생태 보전과 산악 이용자의 편의성을 고려하여 각 침대에 개인 휴대폰 전용 충전 소켓을 추가했습니다. 눈관리국은 공원 내 고산 가옥에 설치된 태양광(햇빛으로 전기를 만드는 것) 발전 공급 장비 대부분이 20년 이상 사용됐다고 밝혔다. 낮은 산기온, 강풍, 낮과 밤의 기온차 등의 장기적인 영향으로 인해 점차 노후화되어 불안정한 전력 공급, 유지 관리의 어려움 등의 과제에 직면해 있습니다. 이번에 업계에서는 태양광 패널과 에너지 저장장치를 기증하고, 산악헬기 자재 걸이 지원을 위한 기술인력도 지원했다. 교통부 민간항공청의 지도 아래 해발 3,000m 이상의 저온 및 운송 문제를 극복하고 100kg이 넘는 장비의 매달기와 업데이트를 성공적으로 완료했다."},{"s":"노무라투자신탁은 2027년 미국 데이터센터 사업 기회에 대해 낙관하고 있으며, 대만 공장 공급망이 수혜를 입을 것으로 전망","so":"自由時報","tm":"11/24 15:53","c":2,"r":"tw","u":"https://stock.ltn.com.tw/article/cwjbdsqjdsut","p":1795503232,"a":1795504104,"t":"野村投信看好2027美國資料中心商機 台廠供應鏈受惠","su":"노무라투자신탁은 오늘(24일) 대만 주식 투자 전망 기자간담회를 열었습니다. 국내 주식 투자 부서 Yao Yuru 부사장은 내년에도 세계 경제가 계속 성장할 것으로 예상되며, 제조업 붐의 개선과 함께 대만의 수출은 여전히 전자 제품에 의해 뒷받침될 것이며 기업 흑자(번 돈이 쓴 돈보다 많은 것)는 계속 증가할 것으로 예상된다고 지적했습니다. 단기적으로는 정책 불확실성과 자본 비용, AI 투자 회복 우려 등이 있지만 AI 애플리케이션 확대와 하드웨어 사양 업그레이드 추세에는 변함이 없다. 2027년 미국 데이터센터(컴퓨터 수만 대를 모아 둔 건물) 전원공급장치"},{"s":"케이티이, 해군과 이지스함 전력기기 기술 교류회 개최","so":"아시아경제","tm":"11/24 08:13","c":2,"r":"kr","u":"https://www.asiae.co.kr/article/2026112408131163432","p":1795475592,"a":1795478679,"su":"케이티이가 해군과 기술 교류회를 열었다. 24일 케이티이에 따르면 이번 행사는 올해 초 HD현대중공업에 공급한 '이지스함 주파수변환기'의 후속 협력 차원에서 마련됐으며 장비의 기술적 특성을 공유하고 운용∙유지보수에 필요한 지원 방안을 논의하기 위해 진행됐다. 방문단은 주파수변환기 생산∙시험 설비를 둘러보고 국산화 장비의 주요 기술 사양과 함정 전력 시스템 운용에 관한 의견을 교환했다. 특히 해상 운용 환경에서의 요구 사항과 향후 유지보수(MRO) 효율화 방안 등 실무 협력 과제를 논의했다."},{"s":"LS일렉트릭 송·배전 수주잔고 7조 육박…AI 투자 둔화는 '변수' - 머니투데이","so":"머니투데이","tm":"11/23 16:20","c":2,"r":"kr","u":"https://www.mt.co.kr/amp/industry/2026/11/23/2026112313483428648","p":1795418400,"a":1795474306,"su":"LS일렉트릭(LS ELECTRIC)이 북미 AI(인공지능) 데이터센터(컴퓨터 수만 대를 모아 둔 건물) 전력기기 수요 확대에 힘입어 송·배전 사업 수주잔고(받아 놓고 아직 못 끝낸 일감의 양)를 1년새 76% 넘게 늘렸다. 납품 규모 확대에도 신규 수주가 더 빠르게 증가한 결과다."},{"s":"AI 반도체가 전력 인재 전쟁을 시작했다. 전력공학회 엘리트 표창, 학생 53명 수상 | 업계 뉴스 | 사업정보","so":"經濟日報","tm":"11/23 11:01","c":2,"r":"tw","u":"https://money.udn.com/money/story/11799/9892202","p":1795399308,"a":1795403819,"t":"AI半導體掀電力人才爭奪戰 電力工程協會表揚菁英、53人次學生獲獎 | 產業動態 | 商情","su":"인공지능(AI)과 반도체(전자기기 속에서 계산하고 기억하는 작은 부품) 산업의 급속한 발전으로 대만의 전력 수요는 지속적으로 증가하고 있으며, 전력 산업 역시 인재 확보를 위한 산업 간 경쟁의 도전에 직면해 있습니다. 대만 전력 에너지 공학 협회는 전력 공학 분야의 뛰어난 인재를 표창하는 주요 축으로 \"권력 상속, 인재 육성 및 유지\"를 주제로 11월 20일 제8회 \"전력망 인재 개발 연합 장학금\"과 제7회 \"류수성 기념상\" 시상식을 개최했습니다. 그 중 39개 그룹과 53명의 학생이 전력망 인재 장학금을 수여받아 대만의 전력 인재 양성 성과를 입증했습니다. 총통부 참사관 심롱진(Shen Rongjin)은 전기는 국력이라고 말했다. AI 시대에는 컴퓨팅 파워의 발전을 위해서는 안정적인 전력 지원이 필요하다. AI 데이터센터(컴퓨터 수만 대를 모아 둔 건물)와 반도체 산업이 성장하는 가운데 정부는 전력 개발, 저탄소 에너지, 그리드 탄력성 구축을 지속적으로 추진하고 있다. 그러나 건전한 에너지 정책은 여전히 전문 인재에 의해 구현되어야 합니다. 기업과 산학계가 함께 인재양성에 투자해 주기를 바랍니다. 대만전력공사의 Kuo Tianhe 총책임자는 AI와 반도체 산업이 전력 소비의 수요와 패턴을 변화시키고 있다고 지적했습니다. 대만전력공사는 전력망의 탄력성을 강화하고 장비를 업그레이드하며 재생 가능 에너지를 통합하는 것 외에도 시스템의 디지털화를 적극적으로 추진하고 있습니다. 산업 간 인재 경쟁이 심화되는 가운데, 앞으로도 전문전수와 산학협력을 심화해 청년들이 전력분야에 투자할 수 있도록 유치해 나가겠습니다. 협회 명예회장 Liu Wenxiong은 전기가 지원뿐만 아니라"},{"s":"\"국제 산업\" 미국 데이터 센터의 번영으로 2028년에는 더 많은 전력 사용이 증가할 것입니다.","so":"旺得富理財網","tm":"11/25 14:27","c":1,"r":"tw","u":"https://wantrich.chinatimes.com/news/20261125900203-420201","p":1795584450,"a":1795589926,"t":"《國際產業》美資料中心榮景2028年推升更多電力使用- 國際","su":"[Times Compiled by Zhang Chaoqin Comprehensive Foreign Reports] 골드만삭스는 미국 데이터센터(컴퓨터 수만 대를 모아 둔 건물)의 전력 용량 증가가 2028년까지 계속될 가능성이 높으며, AI 붐이 점점 더 크고, 더 전력 집약적인 인프라 건설을 주도함에 따라 전기와 천연가스 수요에 상승 위험을 제기한다고 밝혔습니다. 골드만삭스는 2028년에 52기가와트의 데이터센터 전력 용량이 추가로 가동될 수 있다고 밝혔습니다."},{"s":"[안갯속 전력 청사진] AI 전력수요 재산정에 원전 갈등까지…12차 전기본 셈법 복잡","so":"아주경제","tm":"11/25 14:00","c":1,"r":"kr","u":"https://www.ajunews.com/view/20261125112834042","p":1795582800,"a":1795589924,"su":"국가 전력정책의 밑그림이 될 제12차 전력수급기본계획(전기본) 수립을 둘러싼 불확실성이 짙어지고 있다. 정부가 인공지능(AI) 데이터센터(컴퓨터 수만 대를 모아 둔 건물)의 전력수요 전망을 재검토..."},{"s":"원자력 에너지 국민투표는 토요일에 실시될 예정이다. 학자들, 원자력 평가 재개 촉구: 대만은 포기해서는 안 된다 - Life","so":"工商時報","tm":"11/25 13:12","c":1,"r":"tw","u":"https://www.ctee.com.tw/news/20261125701086-431401","p":1795579920,"a":1795589929,"t":"核能公投周六登場學者呼籲重啟核電評估：台灣不應放棄- 生活","su":"국민당이 제안한 '비핵 조국 폐지' 국민투표를 포함해 핵 9대1 선거와 국민투표가 토요일에 치러질 예정이며 이 역시 여론에 따라 결정될 예정이다. 이에 따라 원자력 문제는 다시 한번 선거운동의 화두가 됐다. 유명한 원자력 학자인 Li Min은 최근 온라인 프로그램에서 대만이 원자력 옵션(정해진 값에 사거나 팔 권리)을 포기해서는 안 되며 기존 원자력 발전소의 서비스를 확장하거나 원자력 4개 제조업체로 전환할 가능성을 재평가해야 한다고 촉구했습니다. Li Min과 Li Jiawei 칭화대학교 생명과학과 명예교수가 최근 초청을 받았습니다."},{"s":"AI 데이터센터부터 노후 전력망까지, 전력기기 3사 설비투자 급증","so":"아시아경제","tm":"11/25 11:23","c":1,"r":"kr","u":"https://www.asiae.co.kr/article/2026112415292557621","p":1795573380,"a":1795574656,"su":"AI 데이터센터(컴퓨터 수만 대를 모아 둔 건물) 확산과 노후 전력망(발전소 전기를 집·공장까지 보내는 전깃줄 그물) 교체 수요가 맞물리면서 국내 전력기기 업종에 대한 투자자들의 관심이 높아지."},{"s":"중원대학교 홍잉이(Hong Yingyi) 학생은 전력 에너지 연구 및 산학 혁신에 깊이 참여하여 \"학술 우수 공헌상\" 수상 | 산학연 연구 및 교육 | 사업정보","so":"經濟日報","tm":"11/25 11:04","c":1,"r":"tw","u":"https://money.udn.com/money/story/5723/9899418?from=edn_subcatelist_cate","p":1795572251,"a":1795574659,"t":"中原大學洪穎怡深耕電力能源研究與產學創新 獲「學界傑出貢獻獎」 | 產學研訓 | 商情","su":"지능형 알고리즘부터 양자 인공지능까지, 중원대학교 전기공학과 홍잉이 석좌교수는 42년 넘게 전기에너지 연구에 깊이 관여해 왔다. 그녀는 국제학술연구에서 많은 성과를 거두었을 뿐만 아니라, 산학협력을 적극적으로 추진하고 국가 전력정책에 참여하며 전문인재를 양성해 왔다. 그는 장기간 축적된 학문적 성과와 실질적인 기여로 전력 시스템 및 에너지 기술 분야에서 뛰어난 공헌을 인정받아 대만전력에너지공학협회로부터 2026년 '학술 우수 공헌상'을 수상했습니다. 대만 전력 및 에너지 공학 협회는 전력 및 에너지 분야에서 뛰어난 연구 결과와 산업적 공헌을 한 전문가를 표창하기 위해 \"산업 및 학계에 대한 뛰어난 공헌상\"을 제정했습니다. 올해 '뛰어난 학계공헌상' 수상자는 중원대학교와 국립중앙대학교 두 명입니다. 중원대학교 에너지기술센터장 홍잉이 석좌교수는 오랫동안 스마트그리드, 딥러닝, 양자인공지능 등 미래지향적 기술을 다루며 전력 및 에너지 분야에서 인공지능 연구와 응용에 전념해 왔다. 지금까지 그는 165편의 SCI 저널 논문을 발표했으며 구글 Scholar에서 8,700회 이상 인용되었습니다. 그는 2020년부터 2026년까지 세계 최고 과학자 중 상위 2%에 지속적으로 선정되었으며, ScholarGPS 전력 시스템 전문 순위에서 상위 2%에 속합니다."},{"s":"효성중공업 \"시행사 고의 지연\"…잠원동 빚 3464억 대신 갚았다","so":"팝콘뉴스","tm":"11/25 09:00","c":1,"r":"kr","u":"https: 터 수만 대를 모아 둔 건물) 전력 소비량이 현재 수준의 거의 두 배인 연간 1,000TWh에 육박하고, 데이터센터 관련 투자 규모도 4조 달러에 달할 것이라고 경고했다. <b..."},{"s":"이튼(ETN), AI 분야로 반등, 데이터센터 관련 사업 밝게 성장","so":"经济观察网","tm":"11/24 01:26","c":1,"r":"cn","u":"https://www.eeo.com.cn/2026/1124/1100572.shtml","p":1795451160,"a":1795490331,"t":"伊顿（ETN）随AI板块反弹 数据中心相关业务增长亮眼","su":"경제관측망 이튼(ETN) 주가는 최근 AI 분야 전반의 반등으로 상승세(오르는 흐름)를 보이고 있다. 데이터센터(컴퓨터 수만 대를 모아 둔 건물) 사업이 급속히 성장했지만, 기관들은 여전히 업계의 장기적인 수요와 회사의 부채에 대해 우려하고 있다. 부문 변경 11월 23일, 엔비디아 이사회는 만장일치로 젠슨 황을 사장, CEO 및 이사로 복귀시키기로 결정했습니다."},{"s":"대만전력공사의 강력한 전력망 사업 기회를 활용하여 Spectrum Electrician의 주문 가시성은 2027년 하반기에 도달합니다.","so":"DIGITIMES","tm":"11/24 01:24","c":1,"r":"tw","u":"https://www.digitimes.com.tw/tech/dt/n/shwnws.asp?id=775768","p":1795451069,"a":1795474309,"t":"搭上台電強韌電網商機 光譜電工訂單能見度達2H27","su":"옵토일렉트로닉스(Optoelectronics) 자회사 스펙트럼 일렉트리컬(Spectrum Electrical)은 지난 23일 기자간담회를 열고 대형 변압기(전기의 세기(전압)를 바꿔 주는 기계)를 중심으로 PCB 소모품을 보완하는 듀얼 엔진 운영 구조를 형성했다고 밝혔다. 매출 비중은 변압기 사업이 75%, PCB 소모품이 25%를 차지한다. 연초에도 여전히 존재하던 뷰티 제품 매출이 '0'으로 돌아왔다. 2026년 첫 3분기에는 매출총이익률이 30%로 증가하고, 주당순이익(주식 한 주가 번 돈)은 0.86위안으로 2위안을 넘어설 예정이다."},{"s":"COP31 반대 의견…펑치밍: 원자력을 재가동하면 전력 탄소 배출을 줄일 수 있다","so":"UDN","tm":"11/24 01:02","c":1,"r":"tw","u":"https://udn.com/news/story/7314/9897383","p":1795449769,"a":1795474310,"t":"COP31分歧…彭啓明：重啟核電 可降電力排碳","su":"제31차 유엔기후변화협약 당사국총회(COP31)가 어제 끝났습니다. 다만 화석연료라는 단어는 삭제됐고, 구체적인 조정자금 규모도 명시되지 않았다. 협상이 결렬되었습니다. 초안에서는 \"35×35\" 전기화 목표를 유지했습니다. Peng Qiming 환경부 장관은 어제 국제 사회가 화석 연료로의 전환을 둘러싸고 분열되어 있으며 대만은 기다리지 않을 것이라고 말했습니다. 화석연료로부터의 전환은 변하지 않는 방향이다."},{"s":"AI 전력 수요 급증: API CEO, 에너지 수요 증가 경고","so":"Fox Business","tm":"11/24 00:16","c":1,"r":"us","u":"https://www.foxbusiness.com/video/6408768385112","p":1795447007,"a":1795474307,"t":"AI power demand is surging: API CEO warns of growing energy needs","su":"American Petroleum Institute의 회장 겸 CEO(회사의 가장 높은 책임자)인 Mike Sommers는 UN 기후 회담의 결렬, 화석 연료 분쟁 및 미국 에너지 정책의 미래에 대해 논의합니다."},{"s":"친환경 전력에서 친환경 전력망까지: Bauma Shanghai 첫날 SANY Group은 신에너지와 건설 기계 간의 긴밀한 협력을 위한 친환경 답안지를 제공했습니다.","so":"經濟日報","tm":"11/23 23:00","c":1,"r":"tw","u":"https://money.udn.com/money/story/123828/9897249","p":1795442444,"a":1795447040,"t":"從一度綠電到一張綠色電網：上海寶馬展開展首日，三一集團交出新能源與工程機械深度協同的綠色答卷","su":"상하이, 2026년 11월 23일 /PRNewswire/ -- 11월 23일부터 27일까지 bauma CHINA 2026이 상하이의 이중 전시관에서 공동으로 개최됩니다. Sany Group은 \"길을 선도하고 함께 미래를 건설하는 스마트 전기\"라는 주제로 데뷔했습니다. 세계 엑스포 전시 컨벤션 센터의 마이크로그리드 전시관에 위치한 \"스마트 전기 에너지 스테이션\"은 광전지 모듈, 풍력(바람으로 전기를 만드는 것) 터빈 모델, 수소 전해조, 대형 트럭 배터리 에너지 저장 장치 및 디젤 발전기 세트로 구성된 완전한 하드웨어 매트릭스를 선보입니다. 일회성 녹색 전기 생산부터 완전한 마이크로그리드 네트워크 세트의 구현 및 제공에 이르기까지 전체 체인 디스플레이를 실현합니다. \"마이크로그리드 + 풍력, 태양광(햇빛으로 전기를 만드는 것), 수소 및 장작 저장: 하나의 네트워크에 있는 \"5가지 작업\" 전시장에서는 5가지 유형의 에너지 장치가 \"풍력, 태양광, 수소 및 장작 저장\" 다중 에너지 보완 시스템을 구성합니다. 태양광은 기본 전원으로 낮 동안 주요 부하를 지원하고, 풍력 터빈은 위치를 채우고 밤과 비오는 날에 전력 공급을 지속하는 역할을 담당하며, 수소 에너지는 잉여 전기를 전기분해하여 수소를 생산하고 저장하는 \"곡물 저장소\" 역할을 합니다. 오랫동안 새로운 에너지의 변동을 완화하는 에너지 저장 장치는 비상 백업 전력을 고려하여 피크 방전 및 밸리 충전 기능을 갖추고 있으며 극한의 작업 조건에서 \"예비 타이어\"이며 에너지 저장과 밀접한 관련이 있습니다."},{"s":"데이터 센터 전력이 그리드를 초과함에 따라 전기 유틸리티 노출에 대한 3개 자금","so":"Yahoo Finance","tm":"11/23 21:09","c":1,"r":"us","u":"https://finance.yahoo.com/energy/articles/3-funds-electric-utility-exposure-120915255.html","p":1795435755,"a":1795447039,"t":"3 Funds With Electric Utility Exposure As Data Center Power Outruns The Grid","su":"전력 사용량이 많은 세 가지 펀드(여러 사람 돈을 모아 전문가가 굴리는 것)는 실제로 얼마나 다를 수 있으며, 실제로 전력 스토리에서 원하는 조합은 무엇입니까? 이제 데이터 센터 전력 수요가 연간 약 19% 증가하고 그리드가 약 2% 증가하고 있기 때문에 이 질문은 더욱 중요해졌습니다. 규제 기관이 더 빠른 그리드 업그레이드를 통해 유틸리티가 수익을 얻도록 허용하고 고객이 그리드 전력을 현장 발전기로 완전히 교체하지 않는 경우"},{"s":"삼성전기: 2억 7,800만 위안 규모의 국가 전력망 입찰 및 조달 프로젝트 예비 수주","so":"第一财经","tm":"11/23 16:45","c":1,"r":"cn","u":"https://m.yicai.com/news/103450373.html","p":1795419927,"a":1795424027,"t":"三星电气：预中标2.78亿元国家电网招标采购项目","su":"삼성전기는 최근 2026년 중국 동부 지역에서 10kV 변압기(전기의 세기(전압)를 바꿔 주는 기계)와 10kV 주상 변압기 세트의 2차 공동 조달을 위한 중국 국가 전력망(발전소 전기를 집·공장까지 보내는 전깃줄 그물) 공사의 2차 공동 조달 기본 협약(계약 재고)에서 삼성전기의 100% 자회사인 닝보옥스 인텔리전트 테크놀로지(Ningbo Oaks Intelligent)가 낙찰자로 추천됐다고 밝  것이라고 경고했다. 데이터 센터 건설, 전력망(발전소 전기를 집·공장까지 보내는 전깃줄 그물) 연결 및 시운전이 계속 지연되면서 기술 대기업은 추가 자금으로 수천억 달러를 조달해야 할 수 있으며 머스크는 \"이 돈은 어디서 나오는가? \"라고 묻지 않을 수 없습니다. 특히 최근 미국 증시는 급격한 조정을 겪으며 AI 버블에 대한 시장의 우려가 커졌다. 과거 기술주의 높은 가치평가를 뒷받침했던 AI 성장스토리가 점점 심각해지고 있다."},{"s":"한수원, 대우건설·두산에너빌리티와 체코 원전 시공 협약 종료","so":"한스경제","tm":"11/23 09:02","c":1,"r":"kr","u":"http://www.hansbiz.co.kr/news/articleView.html?idxno=885984","p":1795392159,"a":1795403812,"su":"| 서울=한스경제 김혜지 기자 | 한국수력원자력(한수원)이 대우건설·두산에너빌리티 컨소시엄과 체결한 체코 두코바니 원전사업 시공분야 공동협력 협약을 종료했다.한수원은 지난 20일 대우건설·두산에너빌리티 컨소시엄과의 시공분야 공동협력 협약을 종료했다고 밝혔다.한수원과 컨소시엄은 지난해 6월 체코 발주사와 본계약을 체결한 이후 원전 주설비공사 시공계약 체결을 위한 협상을 진행해 왔다.그러나 계약 조건에 대한 최종 합의에 이르지 못하면서 지난 10월 말 협상을 마무리했다. 이번 공동협력 협약 종료는 협상 중단에 따른 후속 조치다.한수원은"},{"s":"트럼프, 또 관세 부과…해외 데이터센터 짓는 미국 기업에 과중한 세금 부과 - 국제투데이","so":"工商時報","tm":"11/23 08:53","c":1,"r":"tw","u":"https://www.ctee.com.tw/news/20261123700557-430702","p":1795391580,"a":1795403821,"t":"川普又揮關稅大刀美企海外蓋資料中心恐挨重稅- 國際","su":"트럼프 미국 대통령은 20일 인공지능(AI) 분야 미국의 경쟁력 강화를 위해 미국 기업의 해외 데이터센터(컴퓨터 수만 대를 모아 둔 건물) 구축을 제한할 계획이라고 밝혔다. 기업이 해외 진출을 고집할 경우 높은 세금 부담을 안게 될 수 있어 시장의 주목을 받고 있다. 로이터 등 외신들은 트럼프 대통령이 지난 20일 백악관 기자회견에서 미국은 데이터센터 투자에 힘써야 하며 기업이 AI 인프라를 해외로 이전하는 것을 허용할 수 없다고 밝혔다고 보도했다. 이에 해외에 데이터센터를 짓는 미국 기업에 대한 제재를 검토하고 있다."},{"s":"[전일 주요공시] 롯데관광개발·금호건설·효성중공업·롯데케미칼 등","so":"이투데이","tm":"11/23 08:29","c":1,"r":"kr","u":"https://www.etoday.co.kr/news/view/2651440","p":1795390140,"a":1795403812,"su":"△마스턴프리미어리츠, 종속회사인 해외 투자기구 보유 투자부동산 매각(2026년 10월) 관련 예상 손실을 당기 투자부동산손상차손으로 인식△롯데관광개"},{"s":"[단독] 효성重, AI 전력난 뚫을 '게임 체인저'⋯반도체 변압기 전담팀 띄웠다 [차세대 전력망戰]","so":"이투데이","tm":"11/23 05:00","c":1,"r":"kr","u":"https://www.etoday.co.kr/news/view/2650523","p":1795377600,"a":1795389932,"su":"중공업연구소 내 SST TFT 신설, 핵심 인력 재배치22.9kV급 개발 이어 고압 대응 제품 연구개발 추진전력기기·ESS(전기를 저장해 두는 큰 배터리) 연계해 AI 데이터센터(컴퓨터 수만 대를 모아 둔 건물) 종합 솔루션"},{"s":"공장 적용부터 고객 선정까지…국내외 SST 사업화 경쟁 [차세대 전력망戰]","so":"이투데이","tm":"11/23 05:00","c":1,"r":"kr","u":"https://www.etoday.co.kr/news/view/2650526","p":1795377600,"a":1795389932,"su":"LS일렉트릭 DC팩토리 운영…HD현대일렉트릭도 개발 나서GE버노바, 옥외형 공급업체 선정…이튼·지멘스도 상용화 가세AI 데이터센터(컴퓨터 수만 대를 모아 둔 건물)용 반도체(전자기기 속에서 계산하고 기억하는 작은 부품) 변압기(SST"},{"s":"Formosa Plastics의 Four Treasures 전략은 전자 및 반도체로 확장되었으며 다양한 신에너지 및 전력망 프로젝트도 이에 따랐습니다. - Daily News","so":"工商時報","tm":"11/23 04:00","c":1,"r":"tw","u":"https://www.ctee.com.tw/news/20261123700093-439901","p":1795374000,"a":1795403823,"t":"台塑四寶大布局搶進電子、半導體不稀奇各式新能源、電網項目也跟上- 日報","su":"Formosa Plastics Group은 에너지 수요와 공급 탄력성의 비즈니스 기회를 목표로 삼고 새로운 에너지 레이아웃을 가속화하고 있습니다. Nanya 및 Formosa New Intelligence에서 태양열 및 풍력(바람으로 전기를 만드는 것) 발전 투자와 중전력, 배터리, 에너지 저장 및 기타 비즈니스 프로젝트 개시 외에도 Formosa Plastics는 13억 2,600만 위안의 투자를 예상하면서 신에너지 확대를 위한 노력을 강화했습니다. Mailiao Automobile and Electric Company와 협력하여 자본금 26억 위안의 타이화마이뎬신에너지 Company를 설립할 예정이며 Taihua의 지분(회사를 나눠 가진 몫)율은 51%입니다. 타이화마이뎬신에너지의 초기 계획 투자 프로젝트에는 다음이 포함되는 것으로 알려졌습니다."},{"s":"미국 AI 데이터센터, 전력 연결 가속화 계획, 2개 주요 전력망 개혁 검토 제출","so":"DIGITIMES","tm":"11/23 03:40","c":1,"r":"tw","u":"https://www.digitimes.com.tw/tech/dt/n/shwnws.asp?id=0000775529_PVC63JJ716H7UNLAMJUTT","p":1795372800,"a":1795389935,"t":"美AI資料中心拚加快接電 兩大電網改革送審","su":"미국에서는 인공지능(AI) 데이터센터(컴퓨터 수만 대를 모아 둔 건물) 구축에 대한 수요가 계속 늘어나고 있지만, 일부 지역에서는 전력망(발전소 전기를 집·공장까지 보내는 전깃줄 그물) 확장과 신규 전력공급 속도가 이를 따라가지 못해 산업 확장의 중요한 병목 현상이 되고 있다. 미국 지역전력망 운영업체인 PJM과 캘리포니아독립시스템배치기구(CAISO)는 최근 대규모 전력시설에 대한 전력망 연결 개혁을 제안했다. 그리드 연결 연구 기간을 단축하고 조건부 전력 연결을 사전에 개방함으로써 속도를 높일 수 있기를 희망합니다."},{"s":"'타이밍 불일치': 데이터 센터 전력 수요는 매년 19% 증가하고 있습니다. 그리드는 2% 성장하고 있다","so":"Fortune","tm":"11/23 01:34","c":1,"r":"us","u":"https://fortune.com/2026/11/22/ai-data-centers-power-grid-capacity/","p":1795365240,"a":1795389933,"t":"A ‘mismatch in timing’: Data center power demand is growing 19% a year. The grid is growing 2%","su":"보험 중개인인 Howden은 데이터 센터의 전력 수요가 2000년 이후 그리드보다 10배 빠르게 증가했다는 사실을 발견했습니다. 유권자들은 압박을 강화했고 Big Tech는 자체 가스 공장으로 눈을 돌리고 있습니다."},{"s":"AI 데이터센터 전력 증강에 편승한 3가지 주식","so":"Yahoo Finance","tm":"11/23 01:07","c":1,"r":"us","u":"https://finance.yahoo.com/market -X 휴머노이드 챌린지 사전 설명회를 개최했다. 대회 추진 배경과 주요 사업 내용, 추진 일정을 공유하고 산학연 관계자 의견을 수렴했다."},{"s":"2-Link 창화그룹: 완전한 인간형 로봇 사업에 종사하고 있지 않으며 유성 롤러 스크류 제품은 아직 연구 개발 단계에 있습니다.","so":"Jiemian.com","tm":"11/23 21:04","c":3,"r":"cn","u":"https://www.jiemian.com/article/15363971.html","p":1795435444,"a":1795440125,"t":"2连板长华集团：不从事人形机器人整机业务，行星滚柱丝杠产品仍处于研发阶段","su":"장화그룹은 2026년 11월 20일과 11월 23일 연속 2거래일 주식의 일일 종가 상승 편차가 20%를 초과했다고 23일 발표했다. '상하이 증권거래소 거래규칙' 관련 규정에 따르면 이는 주식 거래의 비정상적인 변동을 의미합니다. 검증 결과 회사는 최근 일부 언론에서 자사를 휴머노이드 로봇(사람을 닮은 로봇) 테마주로 상장한 사실을 알아냈다. 회사는 현재 다음과 같이 명시됩니다. 회사는 상장된 자동차 부품 회사로서 주로 자동차 금속 부품의 연구 개발, 생산 및 판매에 종사합니다. 핵심 제품은 패스너, 스탬핑 및 용접 부품입니다. 휴머노이드 로봇 완성기계 사업에는 종사하지 않습니다. 고객에게 액추에이터(로봇 관절을 움직이는 부품) 특수 구조 부품 및 기타 관련 부품 제품만 제공합니다. 현재까지 약 88,000위안의 영업이익을 달성했습니다. 위 제품은 회사의 주요 비즈니스 제품의 응용 시나리오 확장을 기반으로 합니다. 이는 회사 전체 영업이익에서 아주 작은 부분을 차지하며 순이익에 큰 영향을 미치지 않습니다. 유성 롤러 스크류 제품에 관해서는 아직 연구 개발 단계에 있습니다. 아직 고객 승인을 받지 못했고, 영업이익도 달성하지 못한 상태여서 실적에 영향은 없을 것으로 보인다."},{"s":"\"레인보우로보틱스, 본격 성장궤도 진입\"...주가 '57만원' 파격 전망","so":"파이낸셜뉴스","tm":"11/23 09:02","c":3,"r":"kr","u":"https://www.fnnews.com/news/202611230856104772","p":1795392159,"a":1795392947,"su":"유진투자증권은 23일 레인보우로보틱스에 대해 삼성전자와의 협력 확대와 로봇 양산 준비를 바탕으로 본격적인 성장 궤도에 진입할 것으로 전망하며 투자의견(전문가가 사라·팔라고 내는 의견) '매수'와 목표주가(전문가가 예상한 앞날의 주가) 57만원을 제시했다."},{"s":"근육을 자랑하는 동유다 로봇","so":"UDN","tm":"11/25 03:19","c":2,"r":"tw","u":"https://udn.com/news/story/7252/9899462","p":1795544384,"a":1795560852,"t":"東佑達機器人展秀肌肉","su":"'2026 타이중 무인차량 및 로봇 응용 전시회'가 어제(24일) 타이중 국제컨벤션전시센터에서 첫 선을 보였습니다. 정밀 자동화 솔루션 제조사 동유다(7942)는 이번 전시회에 처음 참가해 6축 광커플러, 정렬 플랫폼, 산업용 로봇이 CPO(빛으로 데이터를 주고받는 칩 포장 기술) 장비 제조사, 반도체(전자기기 속에서 계산하고 기억하는 작은 부품) 제조사로부터 각각 주문을 받아 내년 말까지 가시화될 예정이라고 밝혔다."},{"s":"YYForce, 엔비디아 기술을 사용하여 호텔 컨시어지 서비스용 휴머노이드 로봇 출시","so":"Yahoo Finance","tm":"11/25 00:28","c":2,"r":"us","u":"https://finance.yahoo.com/technology/ai/articles/yyforce-launches-humanoid-robot-hotel-152808508.html","p":1795534088,"a":1795560850,"t":"YYForce Launches Humanoid Robot for Hotel Concierge Services Using NVIDIA Technology","su":"YYForce Inc.(나스닥(미국 기술 회사들이 많이 모인 주식시장):YFOR)는 엔비디아 젯슨 엣지 AI 컴퓨팅 및 엔비디아 아이작 심 시뮬레이션 기술을 사용하여 호텔 컨시어지 운영을 위해 개발된 휴머노이드 로봇(사람을 닮은 로봇)의 출시를 발표했습니다."},{"s":"노란색! GEM은 높게 열렸고 낮게 마감되었으며 \"로봇\"은 추세를 거스르고 활발하게 활동했습니다 | 리뷰 리뷰","so":"第一财经","tm":"11/24 18:41","c":2,"r":"cn","u":"https://www.yicai.com/video/103452273.html","p":1795513289,"a":1795530541,"t":"黄了！创业板高开低走收跌，“机器人”逆势活跃丨复盘论"},{"s":"[특징주] 엔비디아발 훈풍에 로봇주 무더기 급등…휴림로봇 등 5종목 상한가","so":"아주경제","tm":"11/24 13:45","c":2,"r":"kr","u":"https://www.ajunews.com/view/20261124133936063","p":1795495514,"a":1795499085,"su":"젠슨 황 엔비디아 최고경영자(CEO(회사의 가장 높은 책임자)) 복귀에 따른 인공지능(AI) 투자심리 회복에 국내 로봇 관련주가 일제히 급등하고 있다. 최근 AI 산업을 둘러싼 불확실성으로..."},{"s":"2026 타이중 무인 차량 및 로봇 응용 전시회 Dongyou는 새로운 수주를 위해 노력하고 협력 기회를 모색합니다 - 산업","so":"工商時報","tm":"11/24 13:27","c":2,"r":"tw","u":"https://www.ctee.com.tw/news/20261124700988-430503","p":1795494420,"a":1795499094,"t":"2026臺中無人載具暨機器人應用展東佑爭取新訂單及尋求合作機會- 產業","su":"통유다는 반도체(전자기기 속에서 계산하고 기억하는 작은 부품) 자동화, 휴머노이드 로봇(사람을 닮은 로봇) 및 CPO 사업 기회를 계획하고 있으며, 24일 열리는 2026년 타이중 무인차량 및 로봇 응용 전시회에 참가해 신규 수주에 힘쓰고 타 산업과의 협력 기회를 모색한다. Dongyouda는 Automation이 반도체 자동화, 휴머노이드 로봇 부품 및 공동 패키지 광학(CPO)의 세 가지 주요 제품 라인에 중점을 두고 있다고 말했습니다. 정밀 변속기, 모션 제어 및 핵심 부품 제조 역량을 결합하여 고급 장비의 적용을 심화하고 다음 단계를 계획합니다."},{"s":"12:26:11 [시장의 메인라인 : 시장이 지속적으로 상승하고 구조를 수리하며, 로봇 테마주가 계속 강세를 보이고 있다]","so":"财联社","tm":"11/24 13:26","c":2,"r":"cn","u":"https://www.cls.cn/detail/2542704","p":1795494371,"a":1795503308,"t":"12:26:11【市场主线：市场延续普涨修复结构 机器人概念股持续走强】"},{"s":"피규어 AI 휴머노이드 'F.03', F1 라스베이거스 그랑프리에 등장","so":"로봇신문","tm":"11/24 11:22","c":2,"r":"kr","u":"https://www.irobotnews.com/news/articleView.html?idxno=49765","p":1795486949,"a":1795490341,"su":"미국 로봇 기업 피규어 AI(Figure AI)가 휴머노이드 로봇(사람을 닮은 로봇) F.03을 포뮬러원(F1) 라스베이거스 그랑프리에 선보였다.통신기업 T모바일(T-Mobile)과"},{"s":"휴머노이드 로봇은 상용화의 중요한 시기에 접어들었고 다양한 이점으로 인해 업계의 기대가 높아졌습니다.","so":"Jiemian.com","tm":"11/24 09:00","c":2,"r":"cn","u":"https://m.jiemian.com/article/15364882.html","p":1795478415,"a":1795478689,"t":"人形机器人步入商业化关键期，多重利好推动产业预期升温","su":"휴머노이드 로봇(사람을 닮은 로봇) 산업은 기술 혁신에서 대규모 상용화(실제로 팔고 쓰이기 시작하는 것)로의 전환기를 맞이하고 있으며, 산업 상용화 전망이 계속해서 주목받고 있습니다. 최근 여러 가지 유리한 요인이 합쳐져 업계 기대치가 높아졌습니다. 11월 23일 국가발전개혁위원회, 민정부, 국가보건위원회, 교육부는 ''노인 한 아이' 서비스 시스템 구축을 위한 구현 계획을 발표하여 노인 돌봄 및 보육 기관이 지능형 관리 서비스, 스마트 화재 보안 및 기타 시스템을 적용하여 관리 수준을 향상할 수 있도록 지원할 것을 제안했습니다. 노인 돌봄 기관에 지능형 건강 모니터링, 보조 장치 및 기타 장비를 갖추도록 장려합니다. 인공 지능 기관, 서비스 등 신제품 개발을 장려합니다. 노인 돌봄 시나리오에 적합한 로봇, 스마트 웨어러블 장치 및 외골격을 노인 돌봄 기관, 커뮤니티 및 기타 시나리오에 적용하거나 체험 영역을 설정하도록 지원합니다."},{"s":"NEXCOM AI 로봇 생태계 파트너 채용 확대 - Daily News","so":"工商時報","tm":"11/24 04:00","c":2,"r":"tw","u":"https://www.ctee.com.tw/news/20261124700343-439901","p":1795460400,"a":1795474323,"t":"新漢AI機器人生態系夥伴擴大招募- 日報","su":"\"RoboWIZ AI 로봇 생태계 파트너\" 모집 페이지에서 자세한 내용을 확인하려면 QR 코드를 스캔하세요. 넥스컴그룹 계열사(같은 그룹에 속한 회사) 넥스코봇(NEXCOM Robotic Solutions)은 지난달 엔비디아 베를린 GTC 컨퍼런스에서 독일, 미국 로봇 생태계 파트너들과 힘을 합쳐 로보위즈(RoboWIZ) AI 로봇 오픈 플랫폼을 공동 출시해 국제 시장과 로봇 관련 분야에서 즉각 주목을 받았다."},{"s":"커라이전기: 현재 휴머노이드 로봇 분야와 관련된 제품은 포함되어 있지 않습니다.","so":"Jiemian.com","tm":"11/23 19:27","c":2,"r":"cn","u":"https://www.jiemian.com/article/15363669.html","p":1795429627,"a":1795435025,"t":"克来机电：目前不涉及人形机器人领域相关产品","su":"클레이전기기계는 자사 주식 거래가 2026년 11월 20일과 2026년 11월 23일 연속 2거래일 동안 일일 종가 상승률을 20% 이상 벗어나 비정상적인 주식 거래 변동이 발생했다고 23일 밝혔다. 현재의 생산 및 운영 활동은 정상적이며, 시장 환경 및 업계 정책에 큰 변동은 없으며, 생산비 및 매출(물건을 판 돈 전체)에 큰 변동은 없으며, 내부 생산 및 운영 순서도 정상적인 것으로 확인되었습니다. 산업용 로봇 분야의 주요 제품은 자동화 물류 분야에서 사용되는 밴 컨테이너 내 물품을 위한 완전 자동 지능형 하역 기계 운영 시스템입니다. 2025년 매출액과 비중은 극히 낮다. 현재 휴머노이드 로봇(사람을 닮은 로봇) 분야와 관련된 제품은 포함되어 있지 않습니다."},{"s":"A주 마감 코멘트: 창업판(차이넥스트) 지수가 3% 이상 상승했고, 전체 시장이 100개 주식 한도를 초과했으며, 영화 및 텔레비전 극장, 감속기, 휴머노이드 로봇 등 부문이 강화되었습니다.","so":"Jiemian.com","tm":"11/23 16:08","c":2,"r":"cn","u":"https://www.jiemian.com/article/15362236.html","p":1795417731,"a":1795424039,"t":"A股收评：创业板指涨超3%，全市场超百股涨停，影视院线、减速器、人形机器人等板块走强","su":"11월 23일, 중국 3대 A주(중국 본토(상하이·선전) 주식시장의 주식) 지수가 종합적으로 상승했습니다. 마감 기준 상하이종합지수는 0.15%, 선전종합지수는 1.93%, 창업판(중국의 기술·성장 회사 주식시장)지수는 3.08%, 노스증권50은 4.67% 상승했다. 상하이와 선전 증시 거래액은 약 1조5528억8000만 위안으로 전 거래일보다 약 1306억8000만 위안 증가했다. 시장에서는 4,658개 종목이 상승했고, 783개 종목이 하락했는데, 그 중 한도상향 종목은 151개, 하락 종목은 7개였다."},{"s":"13:33:52 [초기 거래에서 영화 및 TV 극장, 귀금속, 휴머노이드 로봇 부문이 강세를 보였으며, A500 ETF E 펀드(159361)는 반나절 만에 2억 건 이상의 순청약을 받았습니다]","so":"财联社","tm":"11/23 14:33","c":2,"r":"cn","u":"https://www.cls.cn/detail/2541421","p":1795412032,"a":1795414373,"t":"13:33:52【影视院线、贵金属、人形机器人板块早盘走强，A500ETF易方达（159361）半日获超2亿份净申购】","su":"영화 및 TV 극장, 귀금속, 휴머노이드 로봇(사람을 닮은 로봇) 부문이 장 초반 강세를 보였습니다. A500 ETF E 펀드(159361)는 반나절 만에 2억 건 이상의 순청약을 받았습니다. 11월 23일 오전 거래에서는 하락세를 보이다 다시 상승세(오르는 흐름)를 보였다. 중국 3대 A주 지수는 상승과 하락을 반복했습니다. 전체 시장의 반나절 매출액은 9000억 위안을 넘어섰다. 업종별로는 영화와 텔레비전 극장, 귀금속, 부품, 휴머노이드 로봇, 감속기가 가장 많이 상승한 반면, 부동산, 물류, 석유 및 가스 탐사 및 서비스, 전력 부문은 가장 많이 하락했습니다. 홍콩 주요 지수는 엔터테인먼트, 통신 장비, 의료 서비스 부문이 상승세를 주도하는 등 조정을 이어갔습니다. 정오 마감 기준으로 CSI A500 지수는 0.5%, CSI300 지수는 0.6%, 창업판(차이넥스트) 지수는 1.2%, 과학 기술 혁신 50 지수는 2.7%, 항셍 중국 기업 지수는 0.8% 하락했다. Flush iFinD 데이터에 따르면 A500 ETF E 펀드(159361, 피더 펀드 A/C/Y: 022459/022460/022930)는 반나절 만에 2억 건 이상의 순 청약을 받았습니다."},{"s":"슈퍼브에이아이, ‘마트 환경 기반 휴머노이드 로봇 경진대회’ 은상 수상","so":"한스경제","tm":"11/23 14:04","c":2,"r":"kr","u":"https://www.hansbiz.co.kr/news/articleView.html?idxno=885972","p":1795410262,"a":1795414372,"su":"| 서울=한스경제 김종효 기자 | 슈퍼브에이아이는 14일 대구 엑스코에서 개최된 '제21회 국제로봇콘테스트(2026 IRC)' 세부 대회인 '마트 환경 기반 휴머노이드 로봇(사람을 닮은 로봇) 경진대회'에서 은상을 받았다고 23일 밝혔다. 국제로봇콘테스트는 산업통상부와 대구광역시가 주최하고 한국로봇산업진흥원이 주관하는 행사다. 13일부터 이틀 동안 대구 엑스코에서 12개 세부 대회가 진행됐다. 이 가운데 마트 환경 기반 휴머노이드 로봇 경진대회는 숭실대학교와 카이로바가 주관하고 로보티즈가 후원해, 참가팀들이 휴머노이드 로봇에 AI 기술을 도입해 마트 환경 임무 수행 능력을 겨뤘다."},{"s":"아이엘, 中 로봇핸드 유니콘과 독점 공급계약…휴머노이드 부품사업 진출","so":"한국경제","tm":"11/23 13:19","c":2,"r":"kr","u":"https://www.hankyung.com/article/202611234083i","p":1795407581,"a":1795408891,"su":"AI 추천 뉴스 아이엘, 中 로봇핸드 유니콘과 독점 공급계약…휴머노이드(사람을 닮은 로봇) 부품사업 진출 코스닥 상장사 아이엘이 중국 로봇핸드 전문기업 자이노바(XYNOVA)와 국내 독점 공급계약을 체결하고 휴머노이드 핵심부품 사업에 진출한다. 아이엘은 자이노바의 로봇핸드 전 제품군과 휴머노이드 관절 구동장치(액추에이터(로봇 관절을 움직이는 부품))에 대한 국내 독점 공급권을 확보했다고 23일 밝혔다. 지난 20일 열린 계약식에는 송성근 아이엘 의장과 샤위쉬안 자이노바 창업자 겸 최고경영자(CEO)가 참석했다."},{"s":"휴머노이드 로봇 테마가 계속해서 상승하고 있으며, 서던펀드의 로봇 ETF 서던(159258)의 기초지수가 2% 이상 상승했습니다.","so":"Jiemian.com","tm":"11/23 11:39","c":2,"r":"cn","u":"https://www.jiemian.com/article/15360344.html","p":1795401555,"a":1795403836,"t":"人形机器人概念持续拉升，南方基金旗下机器人ETF南方(159258)标的指数涨超2%","su":"10시 6분 현재, 로봇 ETF(여러 주식을 묶어 파는 상품) Southern(159258)은 장중 거래량(하루 동안 사고판 주식 수)이 1,892.57만 위안으로 1.58% 변동되었습니다. 추적지수인 CSI 로봇지수(H30590)는 한때 2.15% 넘게 올랐고, 현재는 1.45% 상승 중이다."},{"s":"유니트리 급등, 주가 600위안 이상 회복","so":"第一财经","tm":"11/23 11:01","c":2,"r":"cn","u":"https://www.yicai.com/news/103449720.html","p":1795399306,"a":1795403832,"t":"宇树科技大涨 股价重回到600元以上","su":"제일재경 2026-11-23 09:58:55 편집자: Zhang 샤오 유니트리 기술이 급등했습니다. 보도 시간 현재 주가는 600위안 이상으로 회복되었으며 장중(주식시장이 열려 있는 동안) 최대 상승률은 8% 이상이다."},{"s":"미국/중국 제조사 야스카와 전기(야스카와전기 Electric) 따라잡기: 2030년 AI 휴머노이드 로봇 출시 - 국제","so":"工商時報","tm":"11/23 10:53","c":2,"r":"tw","u":"https://www.ctee.com.tw/news/20261123700818-430702","p":1795398780,"a":1795403837,"t":"追趕美/中廠安川電機：2030年推AI人形機器人- 國際","su":"일본 산업용 로봇 제조사 야스카와전기(야스카와전기 Electric)가 미국, 중국 제조사를 따라잡기 위해 2030년 AI를 탑재한 휴머노이드 로봇(사람을 닮은 로봇)을 출시해 시장 점유율을 선점할 예정이다. 교도통신은 야스카와전기의 AI 로봇 사업 코디네이터 구보타 유미가 인터뷰에서 개발 중인 AI 휴머노이드 로봇이 \"2030년에 출시될 것\"이라고 말했다고 20일 보도했다. 구보타 유미 씨는 고객 수요에 따라 사전 출시도 고려할 것이라고 지적했다. ..."},{"s":"Ant Group은 중국의 휴머노이드 경쟁에서 성공하기 위해 Simplexity에 투자했습니다.","so":"Bloomberg.com","tm":"11/23 08:00","c":2,"r":"us","u":"https://www.bloomberg.com/news/articles/2026-11-22/ant-group-bets-on-simplexity-to-thrive-in-china-s-humanoid-race","p":1795388400,"a":1795403831,"t":"Ant Group Bets on Simplexity to Thrive in China’s Humanoid Race"},{"s":"ASUS의 첫 번째 휴머노이드 로봇 공개 - Financial News - Business Times","so":"中時新聞網","tm":"11/23 05:10","c":2,"r":"tw","u":"https://www.chinatimes.com/newspapers/20261123000212-260202","p":1795378200,"a":1795389945,"t":"華碩首款人形機器人曝光- 財經要聞- 工商時報","su":"ASUS의 첫 번째 휴머노이드 로봇(사람을 닮은 로봇)이 공개되었습니다. 최근 외국 언론과의 인터뷰에서 ASUS 공동 CEO(회사의 가장 높은 책임자) X "t":"聚焦人工智能与机器人、半导体、低空经济，南方基金司南投顾关注科技产业的成果转化窗口| 界面新闻","su":"서던자산운용의 자회사(다른 회사가 주인인 회사)인 신안투자컨설팅은 기술산업 성과의 전환창에 있는 구조적 기회에 중점을 두고, 펀드(여러 사람 돈을 모아 전문가가 굴리는 것) 선택 및 포트폴리오 다각화를 통해 투자자가 산업 동향과 단기 가치평가 간의 관계를 합리적으로 볼 수 있도록 돕습니다."},{"s":"서울과기대 첨단 연구 성과, 태국·베트남 특집 방송에 소개...홍수 대응·휴머노이드 기술 조명","so":"팝콘뉴스","tm":"11/25 12:50","c":1,"r":"kr","u":"https://www.popcornnews.net/news/articleView.html?idxno=141478","p":1795578641,"a":1795582140,"su":"(팝콘뉴스=김은교 기자) 동남아시아 현지의 재난 대응과 미래 로봇 산업을 다룬 해외 특집 방송에 국내 대학 연구실의 기술이 소개됐다. 서울과학기술대학교(총장 김동환)는 문화체육관광부가 주관한 ‘2026 해외미디어 협력 특집 기획 방송 제작’ 사업에 참여해 태국과 베트남 방송을 통해 각각 홍수 시뮬레이션 기술과 휴머노이드 로봇(사람을 닮은 로봇) 연구 현장을 공개했다고 25일 밝혔다. 이번 특집 방송은 이재명 대통령의 아세안 정상회의 참석 및 정상외교 일정에 맞춰 한국의 주요 기술과 산업 현황을 현지에 알리기 위해 마련됐다. 반도체, 피지컬 AI(몸을 갖고 실제 세상에서 움직이는 인공지능(로봇 등)), AI"},{"s":"10개국 개발자들이 자공하이테크존에 모였습니다! 유비테크 해외 휴머노이드 로봇 교육 수익 최종 후보","so":"人民网－四川频道","tm":"11/25 12:04","c":1,"r":"cn","u":"http://sc.people.com.cn/n2/2026/1125/c345458-41760559.html","p":1795575840,"a":1795576874,"t":"十国开发者齐聚自贡高新区！优必选海外人形机器人实训营收官","su":"초겨울에는 Zigong High-tech Zone의 휴머노이드 로봇(사람을 닮은 로봇) 데이터 수집 및 테스트 센터에서 실제 기계 디버깅, 코드 작성, 모델 교육 등이 동시에 수행됩니다. 지난 11월 16일부터 20일까지 BuildWithUBTECH・2026 유비테크 해외 생태형 인간형 개발 훈련 캠프가 성공적으로 개최되었습니다."},{"s":"605018, 순식간에 상한가! 휴머노이드 로봇, 여러 종목 연속 상한가","so":"21财经","tm":"11/25 11:17","c":1,"r":"cn","u":"https://www.21jingji.com/article/20261125/herald/bac7713cbb817e683e85f4ace7a6a922.html","p":1795573020,"a":1795574673,"t":"605018，秒涨停！人形机器人，多股连板","su":"11월 25일 오픈하여 휴머노이드 로봇(사람을 닮은 로봇)이라는 컨셉이 계속해서 활발히 활동하고 있습니다. 장화그룹(605018) 오픈 후 초 제한 상한액으로 4회 연속 보드 달성; 닝보둥리에는 3개의 연속 보드가 있습니다. 창립자 모터(방정전기), 고요(Koyo), 헝공정밀(헝궁정밀), 푸라이 신소재(푸라이신소재)가 그 뒤를 따랐습니다. 이 소식에 샤오펑 Motors는 휴머노이드 로봇 IRON의 최신 워밍업 영상을 공개했습니다. 짧은 영상은 로봇이 수동 원격 제어 없이 일상생활에 가까운 여러 가지 정교한 작업을 독립적으로 완료할 수 있다는 점을 보여주는 데 중점을 둡니다. 장화그룹은 11월 24일 주식거래 위험 경고를 발령했다. 이 회사는 상장 자동차 부품회사이다. 주로 자동차 금속 부품의 연구 개발, 생산 및 판매에 종사하고 있습니다. 핵심 제품은 패스너, 스탬핑 및 용접 부품입니다. 완전한 휴머노이드 로봇 사업에 종사하고 있지 않습니다. 액추에이터(로봇 관절을 움직이는 부품) 및 기타 관련 부품 제품에 대한 특수 구조 부품만 고객에게 제공합니다. 현재까지 약 88,000위안의 영업이익을 달성했습니다. 위에서 언급한 제품은 회사의 주요 비즈니스 제품의 응용 시나리오 확장을 기반으로 합니다. 이는 회사 전체 영업이익에서 아주 작은 부분을 차지하며 순이익에 큰 영향을 미치지 않습니다. 유성 롤러 스크류 제품에 관해서는 아직 연구 개발 단계에 있습니다. 아직 고객 승인을 받지 못했고, 영업이익도 달성하지 못한 상태여서 실적에 영향은 없을 것으로 보인다."},{"s":"인도는 세계 경제의 '마지막 프론티어', 일본 제조업 기업의 유망투자처로 4년 연속 1위… 야스카와 전기 등 생산 강화","so":"読売新聞","tm":"11/25 11:05","c":1,"r":"jp","u":"https://www.yomiuri.co.jp/local/kyushu/news/20261125-GYS1T00003/","p":1795572300,"a":1795582144,"t":"インドは世界経済の「最後のフロンティア」、日本の製造業企業の有望投資先で４年連続１位…安川電機など生産強化","su":"[요미우리 신문] 14억명이 넘는 인구를 안고 세계 경제의 '마지막 프론티어(미개척의 거대 시장)'라고 불리는 인도에는 투자가 모여 있다. 국제협력은행(JBIC)은 지난해 12월 일본 제조업 기업에 의한 해외 유망투자처에 대한 조사로 인도"},{"s":"'본토 주식시장' 3대 지수 모두 하락, 휴머노이드 로봇, 소매판매는 추세를 거스르고 상승 - 국제","so":"旺得富理財網","tm":"11/25 11:03","c":1,"r":"tw","u":"https://wantrich.chinatimes.com/news/20261125900101-420201","p":1795572225,"a":1795574674,"t":"《大陸股市》三大指數齊跌人形機器人、零售逆勢上漲- 國際","su":"[타임즈-타이페이] 중국 본토 증시가 25일 개장했다. 주요 3개 지수가 하락했다. 상하이증권거래소지수는 1.03% 하락한 3511.711포인트를 기록했다. 선전 구성요소 지수는 1.46% 하락한 10,271.862포인트를 기록했습니다. 창업판(차이넥스트) 지수는 1.95% 하락한 2234.593포인트를 기록했습니다. 시장에서는 장화그룹(창화그룹), 닝보 동리(닝보둥리) 제한, 파운더 모터(방정전기), 고요(Kyo), 헝공정밀(헝궁정밀), 푸라이 신소재(푸라이신소재) 등이 뒤를 잇는 등 휴머노이드 로봇(사람을 닮은 로봇) 테마가 반복적으로 활성화됐다. 소매 부문이 단기적으로 상승한 항저우..."},{"s":"산업 고도화를 지원하기 위한 로봇 일반화 지침. 공동 대응을 위해 24개 전략적 파트너를 모았습니다. 업계 플레이어가 국제 공급망에 진입할 수 있도록 지원하기 위해 핵심 구성 요소 기술의 개발 및 적용에 중점을 둡니다.","so":"經濟日報","tm":"11/25 11:03","c":1,"r":"tw","u":"https://money.udn.com/money/story/5639/9899934?from=edn_subcatelist_cate","p":1795572193,"a":1795574675,"t":"機器人通用化指引 助產業升級 集結 24 家策略夥伴共同響應 聚焦關鍵零組件技術發展與應用 協助業者切入國際供應鏈","su":"대만 산업이 시장 기회를 포착하고 로봇 생태계에 진입할 수 있도록 돕기 위해 지난 11월 12일 경제부 산업진흥청이 주최하고 정보정책심의회와 정밀기계센터가 시행하고 전자장비협회와 지능형 모빌리티 협회가 공동 주최한 'ROBOT READY 2026 로봇 일반화 지침 발표 및 기술 생태계 포럼'이 열렸다. 가이드라인 발표, 기술 포럼, 실제 전시회를 통해 핵심 부품의 기술 개발 및 적용에 중점을 두고 다음 단계의 대만 로봇 산업 발전 방향을 제시했습니다. 다양한 제조업체의 부품을 로봇 시스템에 성공적으로 적용하려면 기술 자체 외에도 공통 개발 기반과 산업 협력도 필요합니다. 지난 12일 공식 출시된 'ROS 2 기반 로봇 시스템 일반 소개 가이드'는 ROS 2 오픈소스 개발 프레임워크를 기반으로 로봇 개발 관행, 하드웨어 인터페이스, 통신 프로토콜, 일반적으로 사용되는 알고리즘을 통합하고 기본 로봇 모델, 국제 규정 준수 등의 주제를 담고 있다. 기술지식의 정리와 공유를 통해 국내 로봇공학 분야 업계 종사자들의 학습과 발전 과정을 단축할 것으로 기대된다. 글로벌 스마트 로봇 시장이 가속화되면서 대만의 정보통신 및 전자부품 제조사들도 적극적으로 새로운 시장 기회를 모색하고 있다. 이 연례 가이드는 INTEL Taiwan, Novatek Technology 및 Zhishen이 담당합니다."},{"s":"중국 본토에서 휴머노이드 로봇 판매가 두 자릿수 증가 돼지 가격이 안정되고 반등할 조짐을 보임 | 라이브 뉴스 - 뉴스","so":"etnet 經濟通","tm":"11/25 10:41","c":1,"r":"hk","u":"http://www.etnet.com.hk/www/tc/news/home_categorized_news_detail.php?newsid=ETR361125371","p":1795570860,"a":1795574677,"t":"內地人形機械人銷售雙位數增；豬價呈現企穩回升跡象 | 即時新聞 - 新聞","su":"2026/11/25 09:02 \"소문\" 중국 본토의 휴머노이드 로봇(사람을 닮은 로봇) 판매량이 두 자릿수 증가했습니다. 돼지고기 가격은 안정과 회복세를 보였다. '소문' 미국 증시 반등이 홍콩 증시 상승에 실패했지만 본토 휴머노이드 로봇 주가는 좋은 성과를 냈다. 본토 내 휴머노이드 로봇 판매량은 두 자릿수 성장을 유지하며 산업도 꾸준히 성장한 것으로 전해졌다. 유비텍(09880)은 어제(24일) 2.65위안 오른 62.9위안으로 마감했다. 시장 소식에 따르면, 수급이 개선되면서 최근 본토 돼지는 안정되고 반등하는 추세를 보이고 있습니다. 목원주식(02714) 주가가 상승세(오르는 흐름)를 이어갔다. 어제 거래액은 9천만 위안 이상으로 0.04위안 소폭 하락한 39.96위안으로 마감했습니다. '편집자주' 이 칼럼은 현재 시장에 떠도는 루머를 수집한 칼럼이지만 아직 확정된 소식은 아니며, '경제뉴스'는 내용의 정확성을 보장하지 않습니다."},{"s":"티로보틱스, '8시간 연속 작업' 휴머노이드 북미 본격 진출…핵심 부품 풀 내재화 '주목'","so":"프라임경제","tm":"11/25 08:28","c":1,"r":"kr","u":"https://m.newsprime.co.kr/section_view.html?no=756359&menu=1","p":1795562907,"a":1795574671,"su":"포드에너지향 AMR 매출 인식까지…피지컬 AI(몸을 갖고 실제 세상에서 움직이는 인공지능(로봇 등)) 다크팩토리 '카이로스' 핵심 주자 자리 [프라임경제] SK증권은 25일 티로보틱스(117730)에 대해 △진공로봇 출하 회복 △포드에너지향 에너지저장시스템(ESS) 자율주행로봇(AMR) 매출 인식 △'카이로스(KAIROS)' 및 CES를 통한 휴머노이드(사람을 닮은 로봇) 사업 가시화를 바탕으로 올해 별도 흑자전환에 이어 내년 연결 흑자전환을 기록할 것이기에 주목해야 할 시점이라고 평가했다."},{"s":"'삼성 로봇'에 올라탈 기업은…로봇 부품주 옥석 가리기 시작","so":"한국경제","tm":"11/25 08:25","c":1,"r":"kr","u":"https://www.hankyung.com/article/2026112583446","p":1795562701,"a":1795565234,"su":"'삼성 로봇'에 올라탈 기업은…로봇 부품주 옥석 가리기 시작, 삼성전자, CES 2027서 휴머노이드(사람을 닮은 로봇) 첫 공개 전망"},{"s":"자기 몸무게만큼 짐 운반…90kg '괴력 휴머노이드'","so":"전자신문","tm":"11/25 06:00","c":1,"r":"kr","u":"https://www.etnews.com/20261124000443","p":1795554000,"a":1795560850,"su":"자기 몸무게만큼 무거운 짐을 운반할 수 있다는 휴머노이드 로봇(사람을 닮은 로봇)이 공개됐습니다. 미국 로봇기업 파운데이션 퓨처 인더스트리스는 지난 18일(현지시간) 2세대 휴머노이드 로봇"},{"s":"AI 다음은 로봇…‘탈중국’에 기회 잡는 K부품 [화제의 리포트]","so":"한경매거진","tm":"11/25 05:57","c":1,"r":"kr","u":"https://magazine.hankyung.com/business/article/202611196657b","p":1795553820,"a":1795574671,"su":"몇 년 사이 인공지능(AI)이 거대한 시장을 만들었듯이 휴머노이드가 생산과 노동 방식을 바꾸는 ‘안드로노믹스’ 시대도 머지않았다. 올해 말부터 휴머노이드 로봇(사람을 닮은 로봇)의 양산이 시작되면 상용화(실제로 팔고 쓰이기 시작하는 것)에도 속도가 붙을 것으로 전망된다. 윤 애널리스트는 휴머노이드가 만들어낼 미래에 대한 기대와 함께 그 성장을 실제 수주와 매출로 연결할 기업을 살펴볼 때라고 지적했다. 특히 미국이 중국산 부품 의존도를 낮추려는 상황에서 자동차·가전 등의 부품 기술을 축적한 한국의 역할에 주목했다."},{"s":"글로벌 출하량 97% 장악한 中 휴머노이드 굴기… 애지봇 등 ‘6대 천왕’ 패권 경쟁","so":"글로벌이코노믹","tm":"11/25 05:45","c":1,"r":"kr","u":"https://www.g-enews.com/article/Global-Biz/2026/11/202611242211132330c8c1c064d_1","p":1795553100,"a":1795565234,"su":"중국이 전 세계 휴머노이드(인간형) 로봇 시장의 압도적인 주도권을 거머쥐면서 자국 내 주요 로봇 개발사 간 시장점유율과 상용화(실제로 팔고 쓰이기 시작하는 것) 영토 확장 경쟁이 한층 달아오르고 있다. 지난주 중국"},{"s":"‘로봇 강국’ 타이틀 탈환 나선 일본의 역습 … 휴머노이드 부품 패권 지도 [맥킨지·매경 산업분석]","so":"매일경제","tm":"11/25 05:00","c":1,"r":"kr","u":"https://www.mk.co.kr/news/business/12217342","p":1795550400,"a":1795560850,"su":"최근 세계 1위 자동차 기업 도요타자동차가 지난 5일 2분기 실적 발표(회사가 얼마나 벌었는지 알려 주는 날) 이후 16.68% 급등했다. 40년 만에 최대 폭 상승이다. 비용절감 등 경쟁력 강화로 영업이익(장사해서 남긴 돈)이 34%나 급등한 실적 개선과 주주환원 확대가 동시에 확인되면서 매수세가 강해진 것으로 풀이된다. 북미시장 하이브리드 자동차 판매 호조로 연간 이익 전망도 상향 조정했다. 도요타자동차는 로봇 투입으로 생산성 증대를 노린다는 포석을 드러낸 바 있다."},{"s":"TSMC 진출의 규슈, 싹트는 피지컬 AI 야스카와 전기와 미쓰이 부동산도 투자","so":"日本経済新聞","tm":"11/25 05:00","c":1,"r":"jp","u":"https://www.nikkei.com/article/DGXZQOJC133NT0T11C26A1000000/","p":1795550400,"a":1795560855,"t":"TSMC進出の九州、芽吹くフィジカルAI 安川電機や三井不動産も投資","su":"규슈에서는 인공지능(AI) 관련 반도체(전자기기 속에서 계산하고 기억하는 작은 부품)가 새로운 기간산업이 된다. 기계나 로봇을 자율적으로 움직이는 피지컬 AI(몸을 갖고 실제 세상에서 움직이는 인공지능(로봇 등))에 승기를 찾았고, 야스카와 전기나 미쓰이 부동산 등 기업이 투자를 추진하고 있다. 경제산업성은 10월 TSMC가 건설 중인 구마모토 제2공장(구마모토현 기쿠요초)에서 첨단 반도체를 건설할 계획을 보조금 대상으로 인정했다. 회로선 폭 3나노(나노는 10억분의 1) 미터 세대의 AI 반도체 등을 생산한다. 2028년"},{"s":"피지컬 AI 범용 로봇에 가장 중요한 「기반 모델」개발의 열쇠","so":"日経BOOKプラス","tm":"11/25 05:00","c":1,"r":"jp"," function dIdx(s){ return Math.round((Date.parse(s+'T00:00:00Z') - Date.parse(HI.since+'T00:00:00Z'))/86400e3); }

function prepHist(){                       // 달 경계(배열 위치) 미리 계산
  if(!HI || !HI.s || !HI.end) return;

  for(var i=0;i<HI.n;i++){ var ok = false;      // GDELT 자료가 있는 날 (서버가 멈춰 통째로 빠진 날은 false)
    for(var t in HI.s){ for(var k in HI.s[t]){ if(HI.s[t][k][i] != null){ ok = true; break; } } if(ok) break; }
    HI.av.push(ok); }
  var y = +HI.since.slice(0,4), m = +HI.since.slice(5,7), ey = +HI.end.slice(0,4), em = +HI.end.slice(5,7);
  while(y < ey || (y === ey && m <= em)){
    var a = dIdx(y+'-'+('0'+m).slice(-2)+'-01'), ny = m===12 ? y+1 : y, nm = m===12 ? 1 : m+1;
    var b = Math.min(HI.n, dIdx(ny+'-'+('0'+nm).slice(-2)+'-01'));
    HI.months.push({y:y, m:m, a:a, b:b, full: b - a === dIdx(ny+'-'+('0'+nm).slice(-2)+'-01') - a});
    y = ny; m = nm;
  }
}

document.addEventListener('visibilitychange', function(){ if(!document.hidden) refreshBreaking(); });

// 기사를 누르면 먼저 한국어 요약 → 원문 볼지 선택
document.addEventListener('click', function(e){
  var c = e.target.closest('a.card'); if(!c) return;
  if(e.ctrlKey||e.metaKey||e.shiftKey) return;
  e.preventDefault();
  $('s-meta').innerHTML = c.querySelector('.meta').innerHTML;
  $('s-title').textContent = c.querySelector('.title').textContent;
  var o = c.querySelector('.orig'); $('s-orig').textContent = o ? o.textContent : '';
  var sm = c.dataset.s || '';
  $('s-sum').textContent = sm || '이 기사는 요약을 가져오지 못했어요. (사이트가 자동 접속을 막았거나 아직 준비 중)';
  $('s-sum').className = 's-sum' + (sm ? '' : ' empty');
  $('s-go').href = c.href;
  // 외국어 기사면 ✦ Gemini 버튼 보이기 (한국어 기사는 숨김)
  var foreign = !!o || !/[가-힣]/.test(c.querySelector('.title').textContent);   // 번역이 안 됐어도 외국 기사면 버튼 표시
  $('s-cs').hidden = $('s-ct').hidden = $('s-cnote').hidden = !foreign;
  if(foreign){
    // 원문을 열고, Gemini 가 '지금 화면'의 기사를 읽고 답하도록 요청 문장만 복사
    $('s-cs').href = $('s-ct').href = c.href;
    $('s-cs').dataset.q = '이 페이지의 기사 전체를 처음부터 끝까지 읽고 한국어로 요약해 줘. 핵심 내용 3~5줄, 그리고 투자자 입장에서 중요한 숫자와 의미를 짧게 정리해 줘.';
    $('s-ct').dataset.q = "너는 어려운 경제 뉴스를 초등학생도 이해할 수 있게 풀어 주는 친절한 번역가야.\n이 페이지의 뉴스 기사 전체를 쉬운 한국어로 번역해 줘.\n\n[가장 중요한 규칙]\n- 쉽게 쓰더라도 기사 내용은 정확해야 해. 사실을 빼거나, 바꾸거나, 지어내지 마.\n- 기사 순서대로, 빠지는 내용 없이 번역해 줘.\n\n[쉽게 쓰는 방법]\n1. 한 문장에는 한 가지 내용만 써 줘. 문장은 짧게.\n2. \"~습니다/~해요\"체로 친절하게 써 줘.\n3. 어려운 말은 쉬운 말로 바꾸고, 꼭 필요한 전문 용어는 처음 나올 때 괄호로 뜻을 풀어 줘.\n   (예: 금리(돈을 빌릴 때 내는 이자의 비율), 실적(회사가 번 돈과 성과), 주가(회사 주식 한 주의 가격))\n4. 한자어·외래어보다 쉬운 우리말을 먼저 써 줘. (예: 하락 → 떨어졌어요, 상승 → 올랐어요)\n5. 큰 숫자는 읽기 쉽게 바꾸되 정확한 값은 지켜 줘. (예: $2.5 billion → 25억 달러(약 3조 5천억 원쯤))\n   환율로 바꾼 값은 \"약\"을 붙여서 대략이라는 걸 알려 줘.\n6. 회사·사람 이름은 한국에서 부르는 이름으로 쓰고, 처음 나올 때만 괄호에 영어 이름을 적어 줘. (예: 엔비디아(Nvidia))\n7. 누가 한 말인지 분명하게 써 줘. (예: 젠슨 황 대표는 \"…\"라고 말했어요.)\n\n[출력 형식]\n① 한 줄 요약: 이 기사가 무슨 이야기인지 한 문장으로\n② 쉬운 번역: 기사 순서대로\n③ 어려운 말 풀이: 기사에 나온 경제 용어 3~5개를 한 줄씩 쉽게 설명\n④ 그래서 무슨 뜻이야?: 이 소식이 주식 투자하는 사람에게 왜 중요한지 2~3줄\n   (기사에 나온 사실만 근거로, 내 생각이나 예측은 넣지 마)\n\n기사가 길어서 한 번에 다 못 하면, 어디까지 했는지 알려 주고 내가 \"계속\"이라고 하면 이어서 해 줘.";
  }
  $('dim').hidden = false; $('sheet').hidden = false; $('sheet').scrollTop = 0;
  document.body.style.overflow = 'hidden';
});
// ✦ 버튼: Gemini 요청 문장을 복사하고 원문을 엶 → 원문 화면에서 Gemini 를 불러 붙여넣기
function askAI(a){
  var q = a.dataset.q || '';
  try { if(navigator.clipboard) navigator.clipboard.writeText(q); } catch(e){}
  toast('요청 문장을 복사했어요 · 원문에서 측면 버튼 길게 → 「이 페이지에 관해 질문하기」 → 붙여넣기');
  setTimeout(closeSheet, 50);
}
function toast(msg){ var t = $('toast'); t.textContent = msg; t.hidden = false; clearTimeout(toast._t); toast._t = setTimeout(function(){ t.hidden = true; }, 4000); }
function closeSheet(){ $('dim').hidden = true; $('sheet').hidden = true; document.body.style.overflow = ''; }
document.addEventListener('keydown', function(e){ if(e.key==='Escape') closeSheet(); });
</script></body></html>
