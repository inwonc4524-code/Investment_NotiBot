<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#262624">
<title>투자 테마 뉴스</title>
<style>
@font-face{font-family:'ChosunIlboMyungjo';src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_one@1.0/Chosunilbo_myungjo.woff') format('woff');font-weight:normal;font-display:swap}
:root{color-scheme:dark;--bg:#262624;--card:#30302e;--card2:#3a3a37;--text:#faf9f5;--sub:#a6a39a;--line:#3e3e3a;--acc:#d97757;--red:#ef4444}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.55 'ChosunIlboMyungjo',Georgia,"Noto Serif KR",serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:760px;margin:auto}
header{padding:20px 16px 8px}
h1{font:600 22px/1.3 'ChosunIlboMyungjo',Georgia,serif;margin:0 0 4px}
.upd{color:var(--sub);font-size:12.5px}
/* 테마 탭 */
.tabs{position:sticky;top:0;z-index:3;background:rgba(38,38,36,.96);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.tabrow{display:flex;gap:8px;overflow-x:auto;padding:12px 16px 10px;scrollbar-width:none}.tabrow::-webkit-scrollbar{display:none}
.tab{position:relative;flex:none;padding:9px 15px;border-radius:12px;border:1px solid var(--line);background:var(--card);
  color:var(--sub);font:inherit;font-size:14px;cursor:pointer}
.tab b{margin-left:5px;color:var(--sub);font-weight:400;font-size:12px}
.tab.on{background:var(--acc);border-color:var(--acc);color:#1f1e1d;font-weight:600}.tab.on b{color:#1f1e1d}
.dot{position:absolute;top:-3px;right:-3px;width:11px;height:11px;border-radius:50%;background:var(--red);border:2px solid var(--bg)}
/* 정렬·국가 */
.ctrl{display:flex;gap:6px;overflow-x:auto;padding:0 16px 10px;scrollbar-width:none}.ctrl::-webkit-scrollbar{display:none}
.ctrl button{flex:none;border:1px solid var(--line);background:transparent;color:var(--sub);border-radius:8px;padding:5px 11px;font:inherit;font-size:12.5px}
.ctrl button.on{background:var(--card2);border-color:var(--card2);color:var(--text)}
.ctrl .sep{flex:none;width:1px;background:var(--line);margin:2px 4px}
main{padding:6px 12px 48px}
h2{font:600 19px/1.3 'ChosunIlboMyungjo',Georgia,serif;margin:16px 4px 2px}
.note{margin:0 4px 10px;color:var(--sub);font-size:12px}
.none{color:var(--sub);margin:24px 4px;text-align:center}
.card{display:block;background:var(--card);border-radius:12px;padding:12px 14px;margin:8px 0;color:var(--text);text-decoration:none;transition:background .15s}
.card:hover{background:var(--card2)}.card:active{opacity:.75}
.meta{color:var(--sub);font-size:12px}
.title{font-weight:500;margin-top:3px}
.orig{color:var(--sub);font-size:12px;margin-top:3px}
.new{margin-left:4px;color:var(--red);font-size:11px;font-weight:700;letter-spacing:.3px}
.hot{display:inline-block;margin-right:6px;padding:0 6px;border-radius:4px;background:rgba(217,119,87,.16);color:var(--acc);font-weight:600}
.hot.big{background:var(--acc);color:#1f1e1d}
.newbar{display:block;width:100%;margin:2px 0 6px;padding:9px;border:0;border-radius:10px;background:rgba(239,68,68,.14);color:#fca5a5;font:inherit;font-size:13px;text-align:left}
.more{display:block;width:100%;margin:4px 0 0;padding:10px;border:1px dashed var(--line);border-radius:12px;background:transparent;color:var(--sub);font:inherit;font-size:13px}
footer{margin:36px 4px 0;padding-top:14px;border-top:1px solid var(--line);color:var(--sub);font-size:12px;line-height:1.7}
footer b{color:var(--text);font-weight:600}
/* 요약 창 */
#dim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:5}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:6;max-width:760px;margin:auto;max-height:82vh;overflow-y:auto;
  background:var(--card);border-radius:16px 16px 0 0;padding:10px 18px calc(18px + env(safe-area-inset-bottom));box-shadow:0 -8px 30px rgba(0,0,0,.4)}
.grab{width:38px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 12px}
.s-title{font-size:17px;font-weight:600;margin:4px 0 2px;line-height:1.45}
.s-label{margin:16px 0 4px;color:var(--acc);font-size:12px;font-weight:700;letter-spacing:.5px}
.s-sum{font-size:15px;line-height:1.75}.s-sum.empty{color:var(--sub);font-size:13.5px}
.s-btns{display:flex;gap:8px;margin-top:20px}
.s-btns a{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;padding:11px 6px;border-radius:10px;font:inherit;font-size:13.5px;line-height:1.3;text-decoration:none;
  background:var(--acc);color:#1f1e1d;font-weight:600}
.s-btns a.cl{background:transparent;border:1px solid var(--acc);color:var(--acc)}
.s-close button{width:100%;margin-top:8px;padding:11px;border-radius:10px;background:transparent;border:1px solid var(--line);color:var(--sub);font:inherit;font-size:14px}
.s-cnote{margin-top:8px;color:var(--sub);font-size:11.5px;text-align:center}
#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);z-index:9;max-width:90%;padding:10px 16px;border-radius:10px;background:#faf9f5;color:#1f1e1d;font-size:13.5px;box-shadow:0 6px 20px rgba(0,0,0,.4)}
.seg{display:flex;gap:4px;margin:6px 4px 10px}.seg button{flex:1;min-width:0;border:1px solid var(--line);background:transparent;color:var(--sub);border-radius:8px;padding:7px 0;font:inherit;font-size:12.5px;white-space:nowrap}
.seg.ly{margin-top:-4px}.seg.ly button{padding:5px 0;font-size:12px}.seg.ly button.on{background:var(--card2);border-color:var(--acc);color:var(--text);font-weight:600}
.seg.sm{margin-bottom:8px}.seg.sm button{padding:9px 0;font-size:13px}.seg.sm button.on{background:var(--card2);border-color:var(--acc);color:var(--text)}
.warn{margin:0 4px 10px;padding:8px 10px;border-radius:8px;background:rgba(250,204,21,.08);color:var(--sub);font-size:12.5px;line-height:1.5}.warn b{color:var(--text)}
.seg button.on{background:var(--acc);border-color:var(--acc);color:#1f1e1d;font-weight:600}
.tot{margin:2px 4px 10px;color:var(--sub);font-size:13px}.tot b{color:var(--text)}.chgnote{font-size:11px}
.srow{background:var(--card);border-radius:12px;margin:6px 0;padding:10px 12px;cursor:pointer}.srow.open{background:var(--card2)}
.sline{display:flex;align-items:center;gap:8px}
.rk{width:18px;color:var(--sub);font-size:12px;text-align:right;flex:none}
.mv .gap{display:inline-block;width:3px}.mv{width:30px;flex:none;font-size:11px;font-weight:600;text-align:left;font-variant-numeric:tabular-nums;margin-right:-4px}.mv.up{color:#f87171}.mv.dn{color:#60a5fa}.mv.same{color:#a8a29e;font-size:15px;font-weight:700;line-height:1;padding-left:3px}
.sn{width:86px;flex:none;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb{flex:1;height:10px;background:rgba(255,255,255,.05);border-radius:5px;overflow:hidden;min-width:30px}.sb i{display:block;height:100%;background:var(--acc);border-radius:0 4px 4px 0}
.sc{width:54px;flex:none;text-align:right;font-size:14px;font-variant-numeric:tabular-nums}
.chg{width:48px;flex:none;text-align:right;font-size:11.5px;color:var(--sub)}.chg.up{color:#f87171}.chg.dn{color:#60a5fa}
.spark{flex:none}
.det{margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.dt{color:var(--sub);font-size:12px;margin:6px 0 4px}
.bars{width:100%;height:auto;display:block}.bars .ax{fill:var(--sub);font-size:10px}.bars .bar:hover rect+rect{opacity:.8}
.crow{display:flex;align-items:center;gap:8px;margin:3px 0;font-size:12.5px}.cl{width:86px;flex:none}.cb{flex:1;height:8px;background:rgba(255,255,255,.05);border-radius:4px;overflow:hidden}
.cb i{display:block;height:100%;background:var(--acc);opacity:.8;border-radius:0 3px 3px 0}.cn{width:50px;text-align:right;flex:none;font-variant-numeric:tabular-nums}
@media(max-width:400px){.spark{display:none}.sn{width:74px}}
</style></head><body>

120103609nrc","p":1795138560,"a":1795139987,"su":"항소심 선고 공판 출석하는 김범수 카카오 미래이니셔티브센터장(서울=연합뉴스) 김주형 기자 = SM엔터테인먼트 시세조종 공모 의혹으로 1심에서 무죄를 선고받은 김범수 카카오 미래이니셔티브센터장이 20일 서울 서초구 고등법원에서 열린 항소심 선고 공판에 출석하고 있다. 2026.11.20 kjhpress@yna.co.kr 연합뉴스TV 기사문의 및 제보 : 카톡/라인 jebo23 이경희(sorimoa@yna.co.kr) 당신이 담은 순간이 뉴스입니다!"},{"s":"뉴스/아시아 주식이 피바다가 되었습니다! 닛케이 2,800포인트 급락, 한국 증시는 4% 이상 폭락, 5,000선 아래로 하락","so":"TVBS新聞網","tm":"11/20 10:33","c":1,"r":"tw","u":"https://news.tvbs.com.tw/world/4053290","p":1795138380,"a":1795139270,"t":"快訊／亞股遭血洗！日經狂瀉2800點 韓股崩逾4%失守5000大關","su":"16나노, 14나노 등 첨단 공정 로직 칩의 수출 검사를 강화하는 미국의 새로운 규정이 19일 공식 발효됐다. 외신들은 TSMC(2330)와 삼성전자가 일부 중국 고객들에게 미국 수출 허가를 신청하는 과정에서 일부 프로세서의 출하를 중단하겠다고 통보한 사실도 지적했다. 이와 함께 밤새 미국 증시 급락, 기술주 매도 압력, 칩 수출 통제 우려 등의 영향으로 아시아 증시는 오늘(20일) 장 초반 급락세를 보였다. 닛케이지수는 2,800포인트 이상 급락했고, 한국증시도 4% 이상 하락해 5,000선을 밑돌았다."},{"s":"미국과 아시아 주식시장이 활황입니다! 대만 주식시장은 한때 1,600포인트 이상 하락해 37,000포인트 아래로 떨어졌습니다. Delta Electronics와 Sino-Technology Holdings는 급락했습니다.","so":"UDN","tm":"11/20 10:25","c":3,"r":"tw","u":"https://udn.com/news/story/7251/9890572","p":1795137922,"a":1795138550,"t":"美亞股市殺聲四起！台股一度跌逾1,600點失守37K 台達電、信驊重挫","su":"AI 투자 수익성에 대한 우려가 증폭됐고, 연준의 매파적(금리를 올리자는 쪽) 신호와 맞물려 어젯밤 미국 주요 4대 주가지수가 모두 급락했다. 다우존스 산업평균지수는 1,100포인트 이상 급락했고, 필라델피아 반도체(전자기기의 두뇌 부품) 지수는 2.42% 하락했다. 아시아 증시 역시 매도압력을 벗어나지 못했다. 일본과 한국 증시는 20일 동시에 개장하며 큰 폭으로 하락했다. 장초반 손실폭은 각각 약 4.5%, 3.5%로 확대됐고, 시장의 위험회피심리는 급격하게 높아졌다. 대만 12월 지수 선물은 1,057포인트 급락하며 37,550포인트에서 개장하며 선두를 차지했습니다. 이후 집중 시장 지수는 780.76포인트 하락하여 37,646.13포인트로 개장했습니다."},{"s":"투자자문사 CEO 3명 중 2명 내년 코스피 7000 이상","so":"SBS Biz","tm":"11/20 10:07","c":3,"r":"kr","u":"https://biz.sbs.co.kr/article/20000347763","p":1795136820,"a":1795137801,"su":"시장 전문가 3명 중 2명이 내년 코스피(한국 대표 주식시장 지수) 7000 이상을 전망하고 있다는 조사 결과가 발표됐습니다.오늘(20일) 삼성증권은 국내 주요 투자자문사 및 자산운용사 CEO와 임원들이 참석한 '삼성증권 자문사 CEO 포럼'을 개최했다고 밝혔습니다.삼성증권이 이번 포럼 참석자를 대상으로 실시한 ‘2027년 시장전망 및 행사관련 설문&…"},{"s":"하나에어로, 코스닥 상장 첫날 70%대 급등[종목NOW]","so":"파이낸셜뉴스","tm":"11/20 09:33","c":3,"r":"kr","u":"https://www.fnnews "p":1795066200,"a":1795066583,"su":"한국의 연간 수출액이 사상 처음으로 1조달러를 넘어섰다. 독일·미국·중국에 이어 세계 네 번째다. 1964년 처음 수출 1억달러를 달성한 지 62년 만에 수출 규모가 1만배로 커졌다. 선박·어류·목재·의류 등이 주력 수출품이던 한국의 수출 구조는 반세기 동안 반도체(전자기기의 두뇌 부품) 등"},{"s":"한은 “환율 10% 하락하면 생활비 연 16.5만원 절감… 저소득층에 특히 유리”","so":"Chosunbiz","tm":"11/19 12:03","c":10,"r":"kr","u":"https://biz.chosun.com/policy/policy_sub/2026/11/19/7C4FWRBKGBFLDPR77U5BXMZDNE/","p":1795057414,"a":1795058588,"su":"원·달러 환율(다른 나라 돈과 바꾸는 비율)이 10% 하락하면 생활비가 가구당 연 16만5000원 절감된다는 한국은행 연구 결과가 19일 나왔다. 특히 저소득층의 생활비 절감 효과가 큰 것으로 분석됐다. 최근 빠르게 하락한 환율이 양극화 완화에 기여할 수 있다는 것이다. 한국은행이 이날 발표한 '원화 절상의 경제적 영향: 부문별 파급 차별화와 양극화 완화 가능성'에 따르면, 환율 10% 하락 시 절감되는 생활비는 소득 수준이 가장 높은 5분위(상위 20%)가 1년에 26만3000원으로, 소득이 가장 낮은 1분위(하위 20%)의 8만8000원보다"},{"s":"3분기 韓 해외 순금융자산 역대 최대 2807억달러 증가… “코스피 하락 영향”","so":"Chosunbiz","tm":"11/19 12:00","c":6,"r":"kr","u":"https://biz.chosun.com/policy/policy_sub/2026/11/19/PFDYM3DICNCYRGPTHKX5UY7UHE/","p":1795057254,"a":1795058589,"su":"우리나라 순대외금융자산은 3분기 말 기준 3448억달러로 직전 분기(640억달러)보다 2807억달러 증가했다고 한국은행이 19일 밝혔다. 관련 통계가 집계되기 시작한 1994년 이후 역대 최대 증가 폭이다. 지난 2분기에는 역대 최대 폭 하락을 기록했는데, 3개월 만에 최대 폭 증가를 나타낸 것이다. 순대외금융자산은 국내 거주자가 해외에 보유한 대외금융자산에서 외국인이 우리나라에 보유한 대외금융부채를 뺀 금액이다."},{"s":"홍콩증시는 400포인트 넘게 하락해 2만3000포인트 아래로 떨어졌다.","so":"RTHK News","tm":"11/19 11:17","c":3,"r":"hk","u":"https://news.rthk.hk/rthk/ch/component/k2/1878394-20261119.htm","p":1795054620,"a":1795054962,"t":"港股跌逾400點 失守23000點","su":"홍콩증시 하락폭은 400포인트 이상으로 확대됐다. 항셍지수는 지난 3주 만에 처음으로 23,000포인트 아래로 하락해 거의 425포인트(1.8% 이상) 하락한 22,869포인트로 최저치를 기록했다. 기술지수는 3,655포인트로 약 2.2% 하락했다. 텐센트는 결과 발표 후 6% 가까이 급락했고, 알리바바도 결과 발표 전 5% 이상 하락하며 10거래일 연속 하락세를 이어갔다. 두 사람은 아래로 끌려갔다..."},{"s":"대만 증시는 1,100포인트 이상 급락하며 40,000선 아래로 떨어졌습니다! 엔비디아 후계자 연준 매파와 AI 규제…아시아 증시 3대 부정적 영향","so":"UDN","tm":"11/19 10:56","c":3,"r":"tw","u":"https://udn.com/news/story/7251/9888134","p":1795053383,"a":1795054243,"t":"台股暴跌逾1100點失守4萬！輝達接班、Fed鷹派與AI監管…3大利空衝擊亞股","su":"대만 증시는 1,100포인트 이상 급락하며 40,000선 아래로 떨어졌습니다! 엔비디아의 승계, 연준(미국의 중앙은행) 매파, AI 규제… 3 투자자들의 판단과 직결된 것으로 보고 있다. 연준이 통화 정책을 계속 긴축함에 따라 투자자들은 연준이 금리를 추가로 인상할 수 있다고 베팅하기 시작했으며, 이는 결국 미국 달러와 미국 국채 금리(나라가 돈 빌릴 때 내는 이자 비율)를 계속 강화시켜 투자자들이 금을 보유하는 기회비용을 증가시킵니다. Therefore, many investors choose to sell gold, further amplifying the decline in international gold prices. CME 연준감시툴(CME 페드워치 Tool)에 따르면 연준이 12월 금리를 0.25%포인트(퍼센트끼리 뺀 차이) 인상할 확률은 94.7%로 18일 나타났다. 최근 골드만삭스는 이번 달 두 번째로 금 가격 전망을 낮추어 2027년 말까지 금 가격 목표를 온스당 4,800달러에서 온스당 4,650달러로 더욱 낮췄습니다. 골드만삭스는 연준의 금리 인상 기대감이 커지면서 금값이 단기적으로 하방 리스크와 변동성 확대에 직면할 것으로 내다봤다. (CCTV Finance) Jiemian News only serves people who think independently"},{"s":"'GTA 6' 데뷔, AI 버블 우려에 직면 미국 증시 폭락, 'GTA 금융 저주' 29년 만에 7번째 성취","so":"星島頭條","tm":"11/20 12:25","c":2,"r":"hk","u":"https://www.stheadline.com/realtime-finance/3639197/GTA-6%E7%99%BB%E5%A0%B4%E6%92%9E%E6%AD%A3AI%E6%B3%A1%E6%B2%AB%E7%96%91%E6%85%AE%E5%85%BC%E7%BE%8E%E8%82%A1%E6%80%A5%E7%80%89-GTA%E9%87%91%E8%9E%8D%E9%AD%94%E5%92%9229%E5%B9%B4%E5%85%A77%E5%BA%A6%E6%87%89%E9%A9%97","p":1795145131,"a":1795158216,"t":"《GTA 6》登場撞正AI泡沫疑慮兼美股急瀉 「GTA金融魔咒」29年內7度應驗","su":"전 세계 플레이어들이 13년 넘게 기다려온 Grand Theft Auto VI(이하 GTA 6)가 어제(19일) 정식 출시되었습니다. 최근 인터넷에는 과거 GTA 게임과 금융위기의 시간 비교표가 유포됐다. 많은 게임이 출시될 때 우연히 아시아 금융위기, 닷컴 버블, 금융 쓰나미 등 주요 사건과 동시에 출시된 것으로 나타났다. 인터넷에서는 농담으로 \"GTA 금융 저주\"라고 불렸습니다. 이번 신작 출시는 인공지능(AI) 버블에 대한 의구심이 커지고 있는 가운데 이뤄졌다. 미국 3대 주가지수는 이날 모두 2% 이상 하락했다. 이것은 순전히 우연일까요, 아니면 \"저주\"가 다시 현실이 되는 것일까요? 달력"},{"s":"\"미국 주식\" 뉴스: 트럼프: 이란은 생화학 무기를 개발하고, 미국은 엄격한 검토를 위해 AI 칩을 중국에 수출합니다 - 국제","so":"旺得富理財網","tm":"11/20 11:43","c":2,"r":"tw","u":"https://wantrich.chinatimes.com/news/20261120900117-420201","p":1795142605,"a":1795158205,"t":"《美股》消息面：川普：伊朗研發生化武器美輸中AI晶片審核嚴格- 國際","su":"[타임즈 편찬 류지강종합외신보도] 뉴스: ●트럼프 대통령은 18일 폭스뉴스에 지난 9개월 동안 전쟁의 긴장이 고조된 것으로 보이며 이란이 핵 프로그램이 차단된 후 생화학무기 개발에 나설 가능성이 있다는 징후가 있다고 말했다. 이란은 19일 추가로 유조선 2척이 호르무즈 해협의 기뢰에 부딪혀 화재가 발생했다고 주장했다. 외신들은 이란이 선박이 지뢰에 부딪혔다고 연일 주장하고 있지만 확인된 바는 없다고 지적했다. ..."},{"s":"AI 투자 붐의 우울함이 완화되지 않아 아시아 증시는 2020년 이후 최악의 주를 향하고 있다","so":"CNA","tm":"11/20 10:47 습니다. 메모리칩 주가 전반적으로 하락","so":"21财经","tm":"11/20 11:41","c":1,"r":"cn","u":"https://www.21jingji.com/article/20261120/herald/b27155f355ae0ab3c6c53b6444546808.html","p":1795142507,"a":1795158204,"t":"美股盘后速递：三大股指期货下跌；科技七巨头多数下跌，Meta跌超1%；存储芯片股全线下挫","su":"베이징 시간으로 20일 미국 증시가 마감된 뒤 3대 주가지수 선물이 하락세를 보였다. 7개 기술 대기업 중 대부분이 하락했으며 메타는 1% 이상 하락했습니다. 메모리칩 주가는 전반적으로 하락했고, 마이크론 테크놀로지(마이크론)도 1% 이상 하락했습니다. 미국 석유는 상승했고, 금과 은은 하락했습니다. 3대 주요 주가지수 선물이 하락했습니다. 미국 증시가 마감된 후 3대 주가지수 선물이 하락했습니다. 보도 시간 현재 다우 선물은 0.04%, 나스닥 선물은 0.3%, S&P500(미국 큰 회사 500곳 지수) 선물은 0.11% 하락했습니다. 미국의 7개 기술 대기업 중 대부분은 시장이 마감된 후 하락했습니다. 메타는 1% 이상 하락했고, 테슬라는 0.59% 하락했고, 아마존은 0.15% 하락했으며, 마이크로소프트는 0.32% 하락했고, 엔비디아는 0.04% 상승, 구글은 0.49%, 애플은 0.51% 상승했다. 메모리반도체(전자기기의 두뇌 부품) 주가는 개장 이후 전반적으로 하락했다. 마이크론테크놀로지, 웨스턴디지털, 씨게이트테크놀로지가 1% 이상 하락했고, 샌디스크는 0.99%, SK하이닉스는 0.61% 하락했다."},{"s":"19일 다우존스 산업평균지수가 5만선 아래로 떨어지고 S&P500 지수가 6거래일 연속 하락하는 등 미국 3대 증시가 종합적으로 급락했다. 중국남방자산관리(주)는 금리 인상 기대감이 높아지는 가운데 이번 재평가에 주목하고 있다.","so":"Jiemian.com","tm":"11/20 11:36","c":1,"r":"cn","u":"https://www.jiemian.com/article/15353561.html","p":1795142170,"a":1795144420,"t":"美股19日三大指数集体重挫，道指跌破5万点，标普500连续第六个交易日下跌，南方基金司南投顾关注加息预期升温下的估值重估","su":"서던자산운용의 자회사인 신안투자컨설팅은 금리(돈을 빌릴 때 내는 이자 비율) 기대감 상승 속에서 글로벌 주식자산의 재평가에 주력하고 있으며, 펀드 선택 및 포트폴리오 다각화를 통해 투자자들이 단일 내러티브, 단일 시장에 대한 집중 노출을 줄일 수 있도록 지원합니다."},{"s":"연준의 10월 회의록을 보면 거의 모든 관료들이 금리를 추가 인상할 의향이 있는 것으로 나타났습니다. Nanfang Fund Management Co., Ltd.는 계속되는 고금리가 글로벌 자산 가격에 미치는 영향을 우려하고 있습니다.","so":"Jiemian.com","tm":"11/20 11:36","c":1,"r":"cn","u":"https://www.jiemian.com/article/15353565.html","p":1795142170,"a":1795144422,"t":"美联储10月会议纪要显示几乎所有官员倾向进一步加息，南方基金司南投顾关注利率高位延续对全球资产定价的影响","su":"서던펀드의 자회사인 신안투자컨설팅은 다양한 금리(돈을 빌릴 때 내는 이자 비율) 경로가 글로벌 자산 가격 결정과 자본 흐름에 미치는 영향에 주목하고 있습니다. 다중 자산 배분과 다각화된 레이아웃을 통해 투자자들이 해외 정책 변동이 중국 국내 시장으로 전달되는 것을 합리적으로 볼 수 있도록 도와줍니다."},{"s":"일본 소비자 인플레이션으로 금리 인상 기대감 강화","so":"WSJ","tm":"11/20 11:23","c":1,"r":"us","u":"https://www.wsj.com/economy/japan-consumer-inflation-accelerates-amid-rate-hike-views ":1795138654,"a":1795144422,"t":"从看多到做空：华尔街为何重估铜价？","su":"텍스트 | Wanlian Wanxiang 구리 시장의 추세는 많은 사람들이 예상했던 것보다 빠르게 변화하고 있습니다. 11월 19일, 상하이 구리의 주요 계약은 5.07% 하락한 94,720위안/톤으로 마감되었으며 장중 최저치인 94,120위안/톤을 기록했습니다. 전날 런던금속거래소(LME)의 3개월 구리 가격은 약 4.6% 하락한 톤당 12,471달러로 마감했는데, 이는 4월 이후 최저 수준이다. 불과 며칠 만에 시장 논의의 초점은 구리 가격이 여전히 상승할 수 있는지 여부에서 하락세가 얼마나 오래 지속될 것인지로 옮겨졌습니다. 구리 가격이 계속 하락하자, 한때 구리에 대해 확고한 낙관론을 가졌던 한 전설적인 투자자가 공개적으로 공매도(주식을 빌려서 먼저 파는 것) 편을 들었습니다. 그는 스탠리 드러켄밀러입니다."},{"s":"아시아 주식은 장 초반 하락/대만 주식은 1,600포인트 이상 하락했고, 일본과 한국은 폭락했으며, 미국 반도체주는 매도되었습니다.","so":"鉅亨網","tm":"11/20 10:30","c":1,"r":"tw","u":"https://news.cnyes.com/news/id/6668426","p":1795138208,"a":1795158213,"t":"亞股早盤／台股跌逾1,600點、日韓重挫美股晶片股賣壓延燒","su":"아시아 주식은 장 초반 1,600포인트 이상 하락/대만 주식은 급락, 일본과 한국은 급락, 미국 반도체(전자기기의 두뇌 부품)주는 매도 및 소각되었습니다. Uanalyze 2026년 11월 20일(Uanalyze/산업데이터센터(컴퓨터 수만 대를 모아 둔 건물) 보고서) ⸺ 전날 밤 미국 기술주는 급락했고, 11월 20일 대만 증시, 일본 증시, 한국 증시는 동시에 하락세로 출발했다. 대만 증시는 약 781포인트 하락세를 보였으며, 장 초반 하락폭은 빠르게 1,600포인트 이상으로 확대됐다. 니케이 225 지수는 개장 당시 57,000포인트 아래로 떨어졌고, 한국 코스피 지수는 5,000포인트 아래로 떨어졌습니다. TSMC, 아드반테스트, SK하이닉스 등 반도체주도 동반 약세를 보였다. 대만 증시는 781포인트 하락세로 출발했고, 장 초반 하락폭은 4.27%까지 확대됐다. 대만 주식 가중 지수는 37,646포인트로 개장했으며 거래량은 NT$194억 1900만에 달했습니다. 개장 5분 만에 지수는 36,784포인트로 전날 종가 대비 1,643포인트 하락하며 하락 폭이 2.03%에서 4.27%로 확대됐다. TSMC(2330-TW)는 초반 거래에서 NT$70 하락했습니다."},{"s":"S&P500 지수는 사상 최고치에서 4주 연속 하락했습니다. 내가 딥을 구매하는 이유는 다음과 같습니다.","so":"The Globe and Mail","tm":"11/20 10:29","c":1,"r":"us","u":"https://www.theglobeandmail.com/investing/markets/markets-news/motley/8928383/the-sp-500-just-fell-4-straight-weeks-from-a-record-high-heres-why-im-buying-the-dip/","p":1795138143,"a":1795144414,"t":"The S&P 500 Just Fell 4 Straight Weeks From a Record High. Here’s Why I’m Buying the Dip.","su":"핵심 포인트 - S&P500(미국 큰 회사 500곳 지수)은 사상 최고치를 경신한 후 4주 연속 하락세를 보였습니다. - 역사적으로 이는 6개월 및 12개월 만에 주식에 좋은 신호였습니다. - 이러한 유형의 이벤트는 약세장(주가가 오랫동안 내리는 시기) 지표와는 달리 정상적이고 건전한 하락세임을 시사합니다."},{"s":"연준 굴스비는 12월 금리 인상을 배제하지 않습니다. 마이클 바와 Paulson도 긴축을 옹호합니다 | 글로벌 금융 | 글로벌","so" . AMD가 공매도(주식을 빌려서 먼저 파는 것) 대행사로부터 고발당했습니다. AMD가 공매도 대행사로부터 중국과 관계를 맺고 있다는 비난을 받았습니다."},{"s":"오프닝 바둑 | 미국 증시는 급락했고 앤트로픽은 처음으로 상승 마감했으며 금 가격은 3,700달러 하락했으며 알리바바는 2분기에 92% 더 많은 수익을 얻었습니다.","so":"etnet 經濟通","tm":"11/20 09:43","c":1,"r":"hk","u":"https://www.etnet.com.hk/www/tc/news/news-article.php?newsid=417531","p":1795135380,"a":1795144439,"t":"開市Go | 美股急挫Anthropic首掛高收，金價失3700美元關，阿里次財季多賺92%","su":"오프닝 바둑 | 미국 증시는 폭락했고 앤트로픽은 상승세(오르는 흐름)로 개장했다가 상승세로 마감했으며 금 가격은 미화 3,700달러 하락했으며 알리바바는 2분기에 92% 더 많은 수익을 올렸습니다. 주요뉴스 요약 1. 목요일(19일) 미국 증시는 크게 하락했고, 기술주는 압박이 심해 매도했습니다. 다우존스 산업평균지수는 1,100포인트 이상 하락해 5만포인트 아래로 떨어졌습니다. S&P500(미국 큰 회사 500곳 지수) 지수와 나스닥 종합지수도 2% 이상 하락했습니다. 시장에서는 인공지능 기업이 과대평가됐다고 우려하고 있고, 미 연준은 통화정책을 더욱 긴축하겠다는 신호를 내놓으며 투자자들의 위험선호도가 약화됐다. AI 스타트업 앤트로픽(US.ANT)은 상장 첫날 강세를 보였지만 여전히 시장 하락세를 반전시키지 못했다. 다우지수는 1,101.11포인트, 즉 2.19% 하락한 49,097.06포인트로 마감했습니다. S&P500은 147.8포인트(2.02%) 하락한 7,175.83포인트를 기록했습니다. 나스닥은 550.69포인트, 2.25% 하락한 23,879.2포인트에 거래됐다. 닛케이지수는 1,732포인트 하락한 57,712포인트로 출발했습니다."},{"s":"미국 주식 │ 4대 지수 모두 마감! VIX 15.8% 급등해 경고선 30에 근접, AI기술주 밸류에이션 조정 압력 높아져 - 국제","so":"工商時報","tm":"11/20 09:39","c":1,"r":"tw","u":"https://www.ctee.com.tw/news/20261120700532-430702","p":1795135140,"a":1795144434,"t":"美股｜四大指數全面收黑！VIX飆升15.8％逼近30警戒線AI科技股估值修正壓力升溫- 國際","su":"미국 주식 황소가 다시 큰 타격을 입었습니다! 19일 미국 증시는 고점으로 출발했다가 하락세를 보이며 적자에서 적자로 전환했습니다. 다우존스 산업평균지수는 1,101포인트(2.19%) 하락하며 49,100포인트 아래로 하락하며 하루를 마감했습니다. S&P500(미국 큰 회사 500곳 지수)지수와 나스닥지수, 필라델피아반도체(전자기기의 두뇌 부품)지수가 동시에 2% 이상 하락하며 주요 4개 지수 모두 적자로 마감했다. VIX 패닉 지수가 15.8% 급등해 28.44를 기록하며 경고 수준 30에 가까워지는 등 시장 패닉이 빠르게 가열되고 있다."},{"s":"닛케이 2.9% 하락, 칩, 금속주 하락","so":"WSJ","tm":"11/20 09:38","c":1,"r":"us","u":"https://www.wsj.com/finance/stocks/nikkei-falls-2-9-dragged-by-chip-metals-stocks-0601645e","p":1795135080,"a":1795144415,"t":"Nikkei Falls 2.9%, Dragged by Chip, Metals Stocks"},{"s":"미국 주식과 국제 금 가격이 급락했습니다. 창신메모리(CXMT)는 최대 50억 위안丨 사전 시장 정보로 회사 주식을 재매입할 계획입니다.","so":"21财经","tm":"11/20 09:33","c":1,"r":"cn","u":"https://www.21jingji.com/article/20261120/herald/84b41106f3bdff9410cf53060eb9114e.html","p":1795134780,"a":1795144425,"t":"美股、国际金价大跌；长鑫科技拟最高50亿元回购公司股份丨盘前情报","su":"A주 거래가 재개되었습니다. 시장은 늦은 거래에서 등락을 보이며 상승했습니다. 상하이 종합 50 지수는 바닥을 치고 0.32% 상승했습니다. 3개 주요 지수의 하락세가 축소됐다. 커촹반50 지수 ETF(여러 주식을 묶어 파는 상품) Y Fund, CSI 500 ETF Southern, 커촹반50 지수 ETF Huaxia, GEM ETF Y Fund 및 CSI 300 ETF Huatai-PineBridge의 매출(물건을 판 돈 전체)액은 100억을 초과했습니다. 상하이·선전 증시 거래액은 1조3100억원으로 전 거래일보다 646억원 감소했다. 시장 전체에서 4,800개 이상의 주식이 하락했습니다. 디스크에는 포토레지스트와 첨단 패키징 개념이 활발하다. 단점으로는 컴퓨팅 파워 칩 개념이 등락 및 하락하고 빙설 경제 개념 주식이 일괄 조정되며 AI 만화 드라마 개념이 다시 약화되었습니다. 11월 19일 마감 기준으로 상하이증권거래소지수는 0.28%, 선전부품지수는 0.71%, 차이넥스트지수는 0.79% 하락했다."},{"s":"[미국 증시이 다 떨어졌어요! 대만 주식시장이 다시 붕괴될 가능성이 있는가? ]역사상 톱10 급락은 모두 4번! 황금 오른발인가, 아니면 죽음의 함정인가?","so":"鉅亨網","tm":"11/20 09:28","c":1,"r":"tw","u":"https://m.cnyes.com/news/id/6668166","p":1795134503,"a":1795144435,"t":"【美股全倒！台股恐再崩？】史上十大暴跌包辦4次！黃金右腳還是死亡陷阱？","su":"대만 주식시장은 17일 동안 네 차례나 역사상 최악의 10포인트를 기록했다. 펀딩 콜과 배송 불이행이 빈번히 보고돼 시장은 AI 시장이 끝났는지 불안해하고 있다.\n기사에서는 급격한 하락의 주된 이유는 주요 플레이어와 외국인 투자자가 나쁜 소식을 이용하여 밸류에이션을 수정하고 칩을 씻어냈기 때문이라고 밝혔지만 AI의 장기적인 강세 포지션이 끝난 것은 아닙니다.\n엔비디아의 매출(물건을 판 돈 전체)은 전년 대비 110% 증가했으며 TSMC와 같은 공급망(부품·재료가 오가는 연결망)은 여전히 AI 수요로 혜택을 받고 있습니다. 앞으로 우리는 낮은 기본 기간, 높은 성장, 더 강한 칩에 대해 낙관하고 있습니다."},{"s":"연준, 지역은행 직원 급여 인상 삭감","so":"WSJ","tm":"11/20 09:26","c":1,"r":"us","u":"https://www.wsj.com/economy/central-banking/fed-cuts-pay-raises-for-regional-bank-staff-e3184f2d","p":1795134360,"a":1795144416,"t":"Fed Cuts Pay Raises for Regional-Bank Staff"},{"s":"굴스비 : AI 투자 붐은 인플레이션을 증가시킬 수 있으며 연준은 경제 과열을 방지하기 위해 조심해야합니다 - 국제","so":"工商時報","tm":"11/20 09:16","c":1,"r":"tw","u":"https://www.ctee.com.tw/news/20261120700491-430701","p":1795133760,"a":1795158215,"t":"古爾斯比：AI投資熱潮恐加劇通膨Fed須慎防經濟過熱- 國際","su":"미국에서 인공지능(AI) 투자 붐이 계속 가열되면서 대규모 데이터센터(컴퓨터 수만 대를 모아 둔 건물) 구축과 기업의 자본 지출이 미국 경제 과열의 위험이 될 수 있다. 오스틴 굴스비 시카고 연준 총재는 지난 19일 AI 인프라 투자 규모가 거대해 미국 경제의 수용 능력을 넘어설 수 있어 인플레이션(물건값이 계속 오르는 것)을 더욱 끌어올리고 연준이 더 큰 통화 정책 과제에 직면하게 될 수 있다고 경고했다. 굴스비는 19일 언론과의 인터뷰를 수락했다."},{"s":"앤트로픽이 나스닥 상장 기대와 불안이 교착, 「가치관과 모순」이라는 목소리도","so":"日経クロステック","tm":"11/20 09:10","c":1,"r":"jp","u":"https://xtech.nikkei.com/atcl/nxt/column/18/00001/12193/","p":1795133400,"a":1795144449,"t":"Anthropicがナスダック上場 期待と不安が交錯、「価値観と矛盾」との声も","su":"미국 앤트로픽은 2026년 11월 19일(미국 시간) 미국 나스닥(미국 기술 회사들이 많은 주식시장) 시장에 신규 상장(주식시장에 처음 들어오는 것)했다. 상장 첫날 종가는 97.17달러로 공개가격을 17% 웃돌았다. 앤트로픽에 대한 기대감의 높이를 다시 한번 인상한 한편, 미국 샌프란시스코에 있는 이 회사의 본사 근처에서는 항의 시위가 일어나는 등 불안도 교착한다."},{"s":"미국 주가지수 선물은 소폭 하락세로 출발","so":"Jiemian.com","tm":"11/20 08:34","c":1,"r":"cn","u":"https://www.jiemian.com/article/15352623.html","p":1795131272,"a":1795132787,"t":"美股股指期货小幅低开"},{"s":"엔비디아의 시가총액은 6일 만에 3조 위안 이상 증발했고, 많은 미국 반도체주도 폭락했습니다.","so":"21财经","tm":"11/20 08:33","c":1,"r":"cn","u":"https://www.21jingji.com/article/20261120/herald/2185879cc3bf487a8f54dd184462aa0b.html","p":1795131180,"a":1795144426,"t":"英伟达市值6天蒸发超3万亿元，美股芯片股多股跳水","su":"목요일 동부시간 기준 미국 3대 주가지수는 장중 급락해 전체적으로 2% 이상 하락했다. 이 중 다우존스 지수는 1,100포인트 이상 하락하고 50,000포인트 미만으로 하락해 49,097.059포인트를 기록했습니다. 나스닥 종합지수는 550포인트 이상 하락해 23,879.199포인트를 기록했습니다. S&P500(미국 큰 회사 500곳 지수) 지수는 147포인트 이상 하락해 7,175.830포인트를 기록했습니다. 역사상 최대 규모의 기업공개(IPO)인 앤트로픽이 나스닥에 데뷔했습니다. 발행가보다 17.1% 높은 주당 97.17달러로 마감했으며, 시장가치는 1조 2700억 달러에 이른다. 현재 미국 증시에서는 테슬라(시가총액(회사 전체 몸값) 1조4800억 달러)에 이어 12위다. 필라델피아 반도체 지수는 장중 거의 5% 상승했고, 최종적으로 2.4% 이상 하락 마감했습니다. 반도체 개념의 많은 주식이 급락했으며 AMD는 거의 8% 하락했습니다. 차이롄서에 따르면 공매도 회사인 Hunterbrook은 엔비디아와 유사한 '순환 거래'를 사용했다고 경고했습니다. 엔비디아는 3% 이상 하락하며 6거래일 연속 하락세를 이어갔습니다. 시가총액은 약 4,871억 달러(약 3조 2,500억 위안)만큼 증발했습니다. 마벨 Technology와 ARM은 3% 이상 하락했고, 마이크론, 브로드컴, 샌디스크, SK하이닉스 등은 2% 이상 하락했습니다. 인텔은 추세를 거스르며 거의 2% 상승했고, 퀄컴은 1% 이상 상승했습니다."},{"s":"분석:인류적 상장으로 최대 라이벌인 NYSE에 대한 나스닥의 지배력이 확장되었습니다.","so":"CNA","tm":"11/20 08:19","c":1,"r":"sg","u":"https://www.channelnewsasia.com/business/analysisanthropic-listing-extends-nasdaqs-dominant-run-against-arch-rival-nyse-6567516","p":1795130351,"a":1795132807,"t":"Analysis:Anthropic listing extends Nasdaq's dominant run against arch-rival NYSE","su":"뉴욕, 11월 19일: 미국의 두 상위 거래소 간의 시장 점유율 경쟁이 그 어느 때보다 일방적이었습니다. 수요일에 앤트로픽의 기록적인 기업 공개를 통해 나스닥(미국 기술 회사들이 많은 주식시장)은 올해 뉴욕 증권 거래소에서 또 다른 주요 상장(주식시장에 처음 들어오는 것)을 낚아채고 MA 경쟁에서 이미 큰 선두를 추가했습니다."},{"s":"목요일 주식시장이 폭락하는 가운데 상승한 유일한 주식은 다음과 같습니다.","so":"MarketWatch","tm":"11/20 08:11","c":1,"r":"us","u":"https://www.marketwatch.com/story/these-were-the-only-stocks-that-rose-amid-the-stock-markets-wipeout-thursday-1eaf32ba","p":1795129860,"a":1795132781,"t":"These were the only stocks that rose amid the stock market’s wipeout Thursday"},{"s":"S&P500, 나스닥, 다우는 앤트로픽 Trading 데뷔가 적절한 신뢰를 제공하지 못함에 따라 하락 마감 — ANT, META, AAPL, GME In Focus","so":"Yahoo Finance","tm":"11/20 08:01","c":1,"r":"us","u":"https://finance.yahoo.com/markets/stocks/articles/p-500-nasdaq-dow-end-230105109.html","p":1795129265,"a":1795144416,"t":"S&P 500, Nasdaq, Dow End Lower As Anthropic Trading Debut Fails To Provide Adequate Confidence — ANT, META, AAPL, GME In Focus","su":"앤트로픽은 상장(주식시장에 처음 들어오는 것) 가격인 주당 83달러보다 17% 높은 가격으로 첫 거래 세션을 마감했습니다."},{"s":"마감 후 미국 주식 - 탭","so":"自由時報","tm":"11/20 07:34","c":1,"r":"tw","u":"https://news.ltn.com.tw/topic/%E7%BE%8E%E8%82%A1%E7%9B%A4%E5%BE%8C","p":1795127640,"a":1795175766,"t":"美股盤後 - 標籤頁","su":"미국 증시 마감 이후 관련 뉴스를 볼 수 있는 탭 페이지입니다. U.S. stocks close. \"앤트로픽은 매수 모멘텀(값이 움직이는 기세)을 막을 수 없습니다. 미국 증시는 2% 이상 하락했습니다. TSMC ADR은 2.90% 하락했습니다. 중앙은행이 \"가짜 주택\"으로 비난받는 것이 부당합니까? 전문가들은 추세에 대한 진실을 밝힙니다. 이 정책이 없었다면 타이중과 가오슝은 이미 백만 위안을 넘었을 것입니다. 그들은 왜 감히 높은 레버리지(빌린 돈까지 써서 크게 투자하는 것)를 열까요? \"모기지를 빌리고\" 빌린 신용\"이 최고치를 기록했습니다. 타이중의 다음 전쟁터는 예정보다 일찍 시작됩니다. 건축업자들은 왜 건설이 완료되기 전에 시장에 진입합니까? 1년 간의 부동산 투기 끝에 주택 가격은 여전히 상승하고 있습니다. Xizhi는 1년 만에 56% 급등하여 치두에서 가장 강력한 다크호스가 되었습니다. 미국 주식 마감》애플은 거의 4% 급등하여 새로운 최고치를 기록했습니다. 미국 증시는 상승 마감했고, TSMC ADR은 상승했습니다. 0.89% 미국 주식 마감》다우존스와 S&P가 신고가 기록, TSMC ADR 3.29% 상승 미국 주식 마감》정부 폐쇄를 우려하는 투자자들, 미국 증시는 제한된 이익으로 마감"},{"s":"[홍콩 주식 야간 선물 + ADR + 사우스바운드 펀드] 야간 선물은 49포인트 하락했고 NetEase 미국 증시는 홍콩에서 12% 하락했습니다(지속 업데이트)","so":"香港經濟日報HKET","tm":"11/20 07:23"," 하락 FCF가 대폭 감소=미국주 개별","so":"株探","tm":"11/20 00:50","c":1,"r":"jp","u":"https://s.kabutan.jp/news/n202611200044/","p":1795103400,"a":1795158227,"t":"ワーナー・ミュージック、決算受け下落 ＦＣＦが大幅減＝米国株個別","su":"워너 뮤직, 결산 접수 하락 FCF가 대폭 감소=미국주 개별 (NY시간 10:50)(일본 시간 00:50) 워너 뮤직<WMG> 32.54(-0.42 -1.27%) 워너 뮤직<WMG>가 하락. 거래 개시 전에 7-9월기 결산(3분기)을 발표했고 매출(물건을 판 돈 전체)은 예상을 약간 웃돌았지만 1주 이익이 예상을 밑돌았다. 특히 프리현금흐름(FCF)이 전년부터 대폭 감소한 것이 혐기되고 있다. 전년 2억300만 달러에서 7000만 달러 감소해 1억3300만 달러가 됐다. 영업현금흐름도 전년 2억3100만 달러에서 32% 감소해 1억5800만 달러가 됐다."},{"s":"달러 엔, 상한 무거운 미국 주식의 하락과 미국 장기 금리의 하락이 무거워 |","so":"ザイFX！","tm":"11/20 00:40","c":1,"r":"jp","u":"https://zai.diamond.jp/articles/-/499379","p":1795102800,"a":1795128436,"t":"ドル円、上値重い 米国株の下落と米長期金利の低下が重し｜FX・為替ニュース","su":"달러 엔은 상가가 무겁다. 미국 증시에서는 다우평균이 한때 480달러 초 하락해 고비의 5만달러를 인터럽트했으며 나스닥(미국 기술 회사들이 많은 주식시장) 종합이 낮아졌다. 또한 미국 장기 금리(돈을 빌릴 때 내는 이자 비율)가 하락으로 전환됨에 따라 엔 구매 및 달러 판매가 점차 강해졌습니다."},{"s":"2027년에 오르는 주식 : 민주당 우세 하에서 주목의 미국 주식 20 종목 오야마 시게유키","so":"週刊エコノミスト Online","tm":"11/20 00:03","c":1,"r":"jp","u":"https://weekly-economist.mainichi.jp/articles/20261208/se1/00m/020/043000c","p":1795100634,"a":1795128437,"t":"2027年に上がる株：民主党優勢下で注目の米国株20銘柄 大山季之","su":"미국 중간선거에서 민주당이 약진해 AI 투자에 역풍이 불었다. 정치환경이 바뀌는 가운데 수익력과 성장력을 갖춘 유망주를 찾는다. ＞＞특집 「2027년에 오르는 주식」은 이쪽"},{"s":"\"미국 믿으면 S&P, 기술 혁신 믿으면 나스닥\"…장기 지수 투자의 핵심은 '믿음'","so":"뉴시스","tm":"11/20 00:00","c":1,"r":"kr","u":"https://www.newsis.com/view/NISX20261119_0003874495","p":1795100400,"a":1795128404,"su":"[서울=뉴시스]허준희 인턴 기자 = 장기 지수 투자를 할 때는 단기 변동성(값이 크게 출렁이는 정도)에 흔들리기보다 시스템에 대한 믿음과 위기 대응 계획을 세우고 연금저축·ISA 등 절세 계좌를 활용해 무리하지 않는 선에서 꾸준히 이어가라는 전문가의 조언이 나왔다.19일 구독자 212만명 유튜브 채널 '월급쟁이부자들TV' 영상에 출연한 이효석 HS아카데미 대표는 장기 지수 투자의 핵.."},{"s":"앤트로픽의 시장 데뷔를 앞두고 기술 선두가 상승하면서 나스닥이 상승했습니다.","so":"The Business Times","tm":"11/19 23:57","c":1,"r":"sg","u":"https://www.businesstimes.com.sg/international/nasdaq-climbs-tech-leads-gains-ahead-anthropics-market-debut","p":1795100220,"a":1795128438,"t":"Nasdaq climbs as tech leads gains ahead of Anthropic’s market debut","su":"AI 기업의 움직임은 강력한 시장 데뷔에 대한 기대를 불러일으킵니다."},{"s":"미국 증시 나스닥은 1.6% 상승, 스토리지, 광통신 및 기타 부문 상승","so":"Jiemian.com","tm":"11/19 23:41","c":1,"r":"cn","u":"https://www.jiemian.com/article/15352404.html","p":1795099281,"a":1795128413,"t":"美股纳指高开1.6%，存储、光通信等板块上扬","su":"다우존스지수는 0.44%, S&P500(미국 큰 회사 500곳 지수)지수는 0.98%, 나스닥종합지수는 1.58% 상승하는 등 미국 3대 주가지수가 모두 상승세(오르는 흐름)를 보였다. 앤트로픽의 기업공개(IPO)가 시장 심리를 고조시켰고, AI 산업 체인이 상승했다. 스토리지 부문에서는 하이닉스, 샌디스크, 마이크론 테크놀로지가 4% 이상 상승했다. 광통신업체별로는 코히런트가 6% 이상, 루멘텀이 3% 이상 상승했다. 신규 클라우드 서비스 기업으로는 네비우스(NEBIUS)와 코어위브가 4% 이상 상승했다. 미국 '7대 기술주'가 종합적으로 상승했다. 애플 주가는 0.32%, 마이크로소프트 주가는 2.55%, 엔비디아 주가는 1.98%, 구글A 주가는 4.21%, 아마존 주가는 1.61%, 메타 주가는 1.1%, 테슬라 주가는 1.26% 상승했다."},{"s":"앤트로픽이 데뷔하면서 미국 증시가 열리는 모습을 지켜보세요","so":"Sky News","tm":"11/19 23:31","c":1,"r":"world","u":"https://news.sky.com/story/anthropic-makes-us-stock-market-debut-eyeing-1-5trn-valuation-13613981","p":1795098668,"a":1795128442,"t":"Watch US stock market open as Anthropic debuts"},{"s":"투자 전문가 클레멘은 왜 자신의 보유 자산을 매각하기로 결정했습니까? 미국 증시는 젠슨 황 폭풍으로 인해 약세 신호로 전환되었습니다.","so":"經濟日報","tm":"11/19 23:26","c":1,"r":"tw","u":"https://money.udn.com/money/story/123398/9889989","p":1795098373,"a":1795132792,"t":"投資大師克萊門為何決定出清持股？因黃仁勳風暴觸發美股轉空訊號","su":"투자 전략가 요아킴 클레멘트(Joachim Klement)는 수년 동안 자신의 개인 퇴직 연금 포트폴리오가 100% 주식에 베팅해 왔지만 젠센 황의 혼외 관계 스캔들로 기술주 하락이 가속화되고 짧은 신호가 촉발된 이후 이제 모든 보유 자산을 매도하기로 결정했다고 말했습니다."},{"s":"인플레이션은 완고하며 JP Morgan은 연준의 3 회 연속 금리 인상을 예측합니다.","so":"工商時報","tm":"11/19 23:13","c":1,"r":"tw","u":"https://www.ctee.com.tw/news/20261119702303-430701","p":1795097580,"a":1795128424,"t":"通膨頑固摩根大通預測Fed利率連三升- 國際","su":"JP모건은 연준이 다음 달 금리 인상에 더해 경직된 인플레이션(물건값이 계속 오르는 것)으로 인한 추가 통화긴축 필요성을 고려해 내년 1월과 3월에도 금리를 각각 0.25%포인트(퍼센트끼리 뺀 차이)씩 인상할 것이라고 19일 밝혔다. 마이클 페롤리(Michael Feroli)가 이끄는 J.P. Morgan 전략가 팀은 \"이러한 금리 인상은 고용 시장에 피해를 주려는 것이 아니라 연준이 계속해서 금리 인상을 유지해야 한다\"고 지적했습니다."},{"s":"분석가는 앤트로픽의 기업공개(IPO)일에 자신이 소유한 모든 주식을 매도하게 된 '촉발 요인'에 대해 설명합니다.","so":"CNBC","tm":"11/19 22:48","c":1,"r":"us","u":"https://www.cnbc.com/2026/11/19/anthropic-ipo-ai-bubble-stock-market.html","p":1795096111,"a":1795158201,"t":"An analyst explains the ‘trigger’ that prompted him to sell every stock he owns on Anthropic IPO day","su":"Panmure Liberum의 Joachim Klement는 목요일에 “개인 보유 주식을 팔고 장기 국채(나라에 돈 빌려준 증서)로 이동할 것입니다.”라고 말했습니다."},{"s":"워시 연준(FRB) 의장: AI가 번영을 가져올 수 있지만 위험도 경계해야 함","so":"21财经","tm":"11/19 22:46","c":1,"r":"cn","u":"https://www.21jingji.com/article/20261119/herald/d43c29e26fea385062a933cec020f024.html","p":1795095960,"a":1795132788,"t":"美联储主席沃什：AI可能带来繁荣，但也需警惕风险","su":"21세기 비즈니스 헤럴드(21st Century Business Herald) 기자 장 치(Zhang Chi) 11월 17일, 케빈 워시 연준(미국의 중앙은행) 의장은 연설에서 연준 직원들이 세 가지 시나리오를 포함해 AI 확산 가속화가 미국 경제에 미칠 수 있는 영향을 추론하기 시작했다고 말했습니다. 그의 설명에 따르면, 한 가지 시나리오는 AI가 경제 성장과 생산성 향상을 주도하여 고용주와 근로자가 혜택을 공유하는 번영을 가져오는 것입니다. 두 번째 시나리오는 경제 활동 증가의 이점이 대량 실업으로 상쇄된다는 것입니다. 세 번째 시나리오는 AI 기술이 궁극적으로 기대에 부응하지 못한다는 것입니다. 대규모 자본 투자와 주식 시장 상승 이후 투자 수익이 감소하고 주식 가치가 하락하여 경기 둔화와 실업률 증가로 이어집니다. 결국 경제는 회복되지만 생산성 향상에는 실패합니다."},{"s":"월스트리트 200년: 호황과 불황의 순환은 이미 시작되었습니다","so":"21财经","tm":"11/19 22:08","c":1,"r":"cn","u":"https://www.21jingji.com/article/20261119/herald/f7cd7d09e011bb3f9066b052ac54426e.html","p":1795093680,"a":1795132790,"t":"华尔街两百年：繁荣与萧条的往复轮回早已开启","su":"2026.11.19 이 글의 단어 수 : 3458, 읽는 시간은 약 6분 저자 | Charles Guest 월스트리트가 창립된 이후 금융, 정치 분야에서 발생하고 증권 발행 및 거래 방식을 변화시킨 일련의 주요 사건을 충실히 기록하면서 자신의 역사를 완전히 정리한 적이 없습니다. 월 스트리트는 늘 자립의 전통을 고수해 왔지만, 그 발전에는 외부 영향이 없지 않았다. 수년에 걸쳐 정부와 월스트리트는 금융가들이 인정하는 것보다 더 긴밀한 관계를 유지해 왔습니다."},{"s":"개장 전 거래에서 S&P500 선물 상승; Credicorp, Intercorp Finl 서비스 리드","so":"Barron's","tm":"11/19 21:30","c":1,"r":"us","u":"https://www.barrons.com/articles/s-p-500-futures-rise-in-premarket-trading-credicorp-intercorp-finl-svcs-lead-54b838f5","p":1795091400,"a":1795094231,"t":"S&P 500 Futures Rise in Premarket Trading; Credicorp, Intercorp Finl Svcs Lead"},{"s":"“월가의 제왕”에 직격! AI 시세의 행방과 일본 시장의 잠재력 | 월드 비즈니스 위성 (WBS)","so":"テレ東BIZ","tm":"11/19 21:30","c":1,"r":"jp","u":"https://txbiz.tv-tokyo.co.jp/wbs/netonly/post_352825","p":1795091400,"a":1795094260,"t":"“ウォール街の帝王” に直撃！AI相場の行方と日本市場の潜在力｜ワールドビジネスサテライト（WBS）","su":"2026년 11월 19일 방송 월드 비즈니스 위성(WBS). 운용액이 약 2400조엔에 이르는 세계 최대의 자산운용회사 블랙록의 상승세(오르는 흐름) 핑크 CEO에 인터뷰. 격화하는 지정학 리스크의 행방이나 미중간 선거의 결과가 가져오는 영향, 나아가는 엔비디아의 동향이나 앤트로픽 상장 등, 격동하는 AI 시세의 현재지를 철저 분석합니다. 핑크씨가 「AI는 아직 투자 부족」이라고 말하는 진의란? 또한 심각한 인력 부족과 금리(돈을 빌릴 때 내는 이자 비율) 상승·엔화에 직면하는 일본 경제에 대해 \"AI와 로보틱스의 주도국이 될 수 있다\"고 강한 기대를 보이는 이유에도 육박합니다."},{"s":"주주들에게 잉여현금흐름보다 더 많은 금액을 지급하는 S&P500 배당주 4개","so":"Yahoo Finance","tm":"11/19 21:17","c":1,"r":"us","u":"https://finance.yahoo.com/markets/stocks/articles/4-p-500-dividend-stocks-121716562.html","p":1795090636,"a":1795094232,"t":"4 S&P 500 Dividend Stocks Paying Shareholders More Than Their Free Cash Flow","su":"엄청난 수익률(넣은 돈에 비해 얻는 이익 비율)은 그 뒤의 현금이 고갈될 때까지 선물처럼 보입니다. S&P500(미국 큰 회사 500곳 지수) 4개 가계는 들어오는 돈보다 더 큰 수표를 주주에게 보내고 있으며, 한 테스트에서는 어떤 지불금이 살아남지 못할 수 있는지 보여줍니다."},{"s":"두 배의 배당금을 지급하는 S&P500 주식 4개 — AI가 필요하지 않음","so":"Investor's Business Daily","tm":"11/19 21:16","c":1,"r":"us","u":"https://investors.com/etfs-and-funds/etfs/sp-500-stocks-paying-plump-dividends-double-and-dont-need-ai/","p":1795090560,"a":1795094233,"t":"4 S&P 500 Stocks Paying Plump Dividends Double — And Don't Need AI","su":"올해 S&P500(미국 큰 회사 500곳 지수) 주식으로 돈을 벌기 위해 AI에 막대한 투자를 해야 한다고 가정하지 마십시오. 투자자들은 배당(회사가 주주에게 나눠주는 돈)금으로 큰 이익을 얻고 있습니다."},{"s":"분석가는 AI 버블이 곧 터질 것이기 때문에 S&P500을 매도해야 한다고 말합니다. 대신 이것을 구입하세요.","so":"Barron's","tm":"11/19 20:46","c":1,"r":"us","u":"https://www.barrons.com/articles/ai-stock-bubble-anthropic-sp500-b9aeb122","p":1795088760,"a":1795089894,"t":"Sell the S&P 500 Because the AI Bubble Is About to Burst, Analyst Says. Buy This Instead."},{"s":"미국 주식 저장 부문은 개장을 앞두고 상승세를 보이고 있습니다.","so":"第一财经","tm":"11/19 20:11","c":1,"r":"cn","u":"https://www.yicai.com/news/103446964.html","p":1795086697,"a":1795089900,"t":"美股存储板块盘前进一步走高","su":"제일재경 2026-11-19 19:10:27 편집자: Gao Mingyan SK 하이닉스는 약 6% 상승했으며 샌디스크, 마이크론, Seagate Technology 및 Western Digital은 모두 5% 이상 상승했습니다."},{"s":"월스트리트는 엔비디아에 5000억 달러를 약속했습니다. 달러는 배포되지 않았습니다.","so":"WSJ","tm":"11/19 20:03","c":1,"r":"us","u":"https://www.wsj.com/world/wall-street-pledged-500-billion-for-nvidia-not-a-dollar-has-been-deployed-6bee9560","p":1795086180,"a":1795089895,"t":"Wall Street Pledged $500 Billion for Nvidia. Not a Dollar Has Been Deployed."},{"s":"달러는 19개월 최고치 부근에 머물고, 국채 금리는 상승","so":"WSJ","tm":"11/19 19:36","c":1,"r":"us","u":"https://www.wsj.com/finance/currencies/asian-currencies-consolidate-but-face-drag-from-fed-rate-bets-50c20e86","p":1795084560,"a":1795094234,"t":"Dollar Stays Near 19-Month High, Treasury Yields Rise"},{"s":"연준의 10월 회의록: 아슬아슬한 승리","so":"鉅亨網","tm":"11/19 19:30","c":1,"r":"tw","u":"https://news.google.com/rss/articles/CBMiS0FVX3lxTE5KVENET09DSG92Q1RuTnhKLUdQN1ZLWlVXZDFKcVR0NFN6eVBWZVJuZUo5RldtOS04ZHlxSERxSnJVYWNoX2syUGtvOA?oc=5","p":1795084212,"a":1795132795,"t":"聯準會10月紀要：一次險勝"},{"s":"두 주요 은행이 방금 2027년 S&P500 전망을 발표했습니다!","so":"Yahoo Finance UK","tm":"11/19 19:27","c":1,"r":"us","u":"https://uk.finance.yahoo.com/news/two-major-banks-just-released-102750912.html","p":1795084070,"a":1795089897,"t":"Two major banks just released their S&P 500 forecasts for 2027!","su":"Jon Smith는 내년 S&P500(미국 큰 회사 500곳 지수)에 대한 최신 전망을 보고 눈썹을 치켜올리며 이것이 자신의 투자에 어떤 의미를 갖는지 설명합니다. The post 두 주요 은행이 방금 2027년 S&P500 전망을 발표했습니다! 열두 번째 까치에 처음 등장했습니다."},{"s":"S&P500 ETF에 투자하는 것으로 정말 충분한가요? 여기 내 솔직한 의견이 있습니다.","so":"Yahoo Finance","tm":"11/19 19:22","c":1,"r":"us","u":"https://finance.yahoo.com/markets/stocks/articles/investing-p-500-etf-really-102201392.html","p":1795083721,"a":1795089898,"t":"Is Investing in an S&P 500 ETF Really Enough? Here's My Honest Take.","su":"상장지수펀드는 한 번에 많은 주식에 노출될 수 있는 좋은 방법이며, S&P500(미국 큰 회사 500곳 지수)을 추적하는 펀드는 특히 흥미로울 수 있습니다. 결국, S&P500은 1950년대 후반 지수 출시 이후 연평균 10%의 수익률(넣은 돈에 비해 얻는 이익 비율)을 달성하며 시간이 지나면서 성공적인 투자가 되었습니다."},{"s":"\"시장 전\" 급등, 오늘 밤 미국 주식 초초기공모(IPO) 개시","so":"21财经","tm":"11/19 19:13","c":1,"r":"cn","u":"https://www.21jingji.com/article/20261119/herald/6ce05289fdd90b8f7f9642bf25540c08.html","p":1795083213,"a":1795089901,"t":"“盘前”大涨，美股超级IPO今晚开盘","su":"파생상품 시장은 앤트로픽이 상장되면 더 높은 가격으로 거래될 것이라고 예상하고 있습니다. 보도 시간 현재 암호화폐 플랫폼 하이퍼리퀴드(Hyperliquid)의 앤트로픽과 연계된 무기한 선물 계약의 가격은 약 102달러로 회사의 기업공개(IPO) 발행 가격에 20%가 넘는 프리미엄이 붙은 수준이다. 지난 24시간 동안 이 계약의 거래량은 1억 4,500만 달러를 넘어섰고, 해당 계약의 미결제약정 금액은 1억 7,800만 달러를 넘어섰습니다. 초과 청약 열풍과 개장 전 거래 프리미엄으로 인해 펀드는 상장 첫날 앤트로픽의 성과에 대한 기대가 높습니다. 그러나 Hyperliquid에서 거래되는 것은 실제 주식이 아니라 앤트로픽의 주당 가격을 추적하는 영구 선물 계약으로 설계되었습니다. 이 계약의 보유자는 기본 자산을 소유하지 않으며 거버넌스 투표에 참여할 권리가 없으며 배당(회사가 주주에게 나눠주는 돈)금을 받을 자격도 없습니다. 그러나 이러한 계약은 일부 투자자에게 기초 자산의 예상 가격 변동에 대한 노출을 제공할 수 있습니다. 앤트로픽이 나스닥(미국 기술 회사들이 많은 주식시장)에 공식 상장되면 무기한 계약의 가격은 첫 정규 거래 세션 이후 주가로 전환됩니다. 주식 거래 가격보다 높은 가격으로 무기한 계약을 구매하는 투자자는 돈을 잃게 됩니다. 그 가격 이하로 주식을 구매하는 투자자는 이익을 얻을 것입니다."},{"s":"국제유가는 단기적으로 상승했고, 시장 개장 전 미국의 대형 기술주는 집합적으로 상승했다. SK하이닉스와 샌디스크는 4% 이상 상승했고, NetEase는 5% 이상 하락했으며, 9만명 이상의 사람들이 암호화폐 포지션을 청산했습니다.","so":"21财经","tm":"11/19 18:57","c":1,"r":"cn","u":"http://www.21jingji.com/article/20261119/herald/8b64511166be0bd4f71889ffda222426.html","p":1795082258,"a":1795089903,"t":"国际油价短线拉升，美股大型科技股盘前集体上涨，SK海力士、闪迪涨超4%，网易跌超5%，加密货币超9万人爆仓","su":"21파이낸셜레이더(21 Financial Radar)에 따르면 베이징 시간으로 11월 19일 17시 25분경 현재 미국 3대 주가지수 선물이 종합적으로 상승세(오르는 흐름)를 보였으며, 나스닥 선물도 1.7% 이상 상승했다. 미국의 대규모 기술주는 시장 개장 전에 집합적으로 상승했다. 스페이스X, 구글, 아마존은 2% 이상 상승했고, 엔비디아는 1.6% 이상 상승했습니다. 차이롄서에 따르면 엔비디아 이사회는 예정보다 몇 달 앞당겨진 올해 12월에 모든 직원의 급여 인상과 추가 주식 발행을 받을 것이라고 밝혔습니다. SK하이닉스가 5% 가까이 오르고, 샌디스크와 마이크론이 4% 이상 오르는 등 대부분의 메모리칩 주가는 시장 개장 전에 상승했다. NetEase의 미국 증시는 시장이 열리기 전에 5% 이상 하락했습니다. 3분기 ADS당 회사의 계속 운영 조정 순이익(모든 비용을 빼고 남은 돈)은 14.21위안(추정치는 16.36위안)이었습니다. 매출은 278억 5천만 위안으로 전년 대비 1.8% 감소했으며 추정치는 303억 8천만 위안이었습니다."},{"s":"\"월스트리트에서 가장 미친 돈 버는 기계\", 중국 자산에 포지션 추가","so":"21财经","tm":"11/19 18:36","c":1,"r":"cn","u":"https://www.21jingji.com/article/20261119/herald/bed6a0015543bd99ba334eaa8b883f2e.html","p":1795080960,"a":1795089904,"t":"“华尔街最疯狂的赚钱机器”，加仓中国资产","su":"극심한 글로벌 시장 변동 속에서 중국 자산은 계속해서 월스트리트 최고의 헤지펀드(큰손들 돈을 모아 굴리는 투자 회사)들의 관심을 끌고 있습니다. 최신 데이터에 따르면 '월스트리트의 가장 미친 돈 버는 기계'로 알려진 포인트72는 올해 3분기 알리바바에 새로운 입지를 구축하고 징둥닷컴, 핀둬둬 등 중국 인터넷 리더들에 대규모 투자를 한 것으로 나타났다. 또한 Barclays Bank, Aberdeen Group, Citigroup, Virgin Global Investments 등 해외 유명 자산운용기관들도 3분기에 다수의 중국 컨셉주를 적극적으로 매입했다. Point72는 알리바바에서 입지를 구축합니다. 전설적인 월스트리트 투자자 스티브 코헨(Steve Cohen)이 설립한 Point72는 세계 최고의 멀티 전략 헤지 펀드 중 하나이며 \"월스트리트에서 가장 미친 돈 버는 기계\"로 알려져 있습니다. 코헨이 초창기 SAC 캐피탈을 맡았을 때 그는 연평균 30%가 넘는 수익률(넣은 돈에 비해 얻는 이익 비율)로 월스트리트를 놀라게 했습니다. 이 기록으로 그는 \"헤지펀드 업계의 조던\"이라는 칭호를 얻었습니다. 코헨은 또한 미국의 인기 TV 시리즈 \"Billions\"에 등장하는 금융계의 거물 Bobby Axelrod의 프로토타입이기도 합니다."},{"s":"그레이마켓에서 인류 주가는 약 20% 더 높게 나타남","so":"The Business Times","tm":"11/19 18:36","c":1,"r":"sg","u":"https://www.businesstimes.com.sg/companies-markets/anthropic-shares-indicated-about-20-higher-gray-market","p":1795080960,"a":1795089930,"t":"Anthropic shares indicated about 20% higher on gray market","su":"온라인 중개회사가 제공하는 파생상품의 시가총액(회사 전체 몸값)은 미화 1조 3500억 달러에 달하며, 이는 기업공개(IPO) 가격 대비 24% 이상의 이익을 의미합니다."},{"s":"앤트로픽, 나스닥 데뷔 2조 달러 달성, 스페이스X 6월 상장 1위","so":"The Business Times","tm":"11/19 18:36","c":1,"r":"sg","u":"https://www.businesstimes.com.sg/international/global/anthropic-hits-us2-trillion-nasdaq-debut-tops-spacexs-june-listing","p":1795080960,"a":1795128439,"t":"Anthropic hits US$2 trillion in Nasdaq debut, tops SpaceX’s June listing","su":"주식에 대한 강한 수요는 행복감이 어느 정도 식은 부문에 희망을 제공합니다. The Business Times에서 자세히 읽어보세요."},{"s":"미국 증시 붕괴가 시작됐는가? 전문가: 2000년 닷컴 버블에서 배울 수 있는 교훈","so":"鉅亨網","tm":"11/19 18:10","c":1,"r":"tw","u":"https://news.cnyes.com/news/id/6667518","p":1795079403,"a":1795089910,"t":"美股崩盤開始了嗎？專家：應從2000年網路泡沫吸取教訓","su":"AI 기술주 급락으로 붕괴 우려가 촉발됐다. 오라클, 코어위브, 엔비디아는 각각 고점 대비 60%, 70%, 60% 이상 하락했다.\nTS Lombard의 Dario Perkins는 주식 시장 붕괴가 아직 발생하지 않았고 클라우드 회사가 자본 지출(공장·장비 등에 쓰는 큰돈)을 삭감하지 않았으며 GPU 임대 가격이 여전히 강한 수요를 보이고 있다고 말했습니다.\n그는 현재 상황이 2000년 닷컴버블과 비슷해 대출에 의존해 칩을 구입하고 데이터센터(컴퓨터 수만 대를 모아 둔 건물)를 짓는 기업이 가장 큰 위험에 처해 있다고 경고했다."},{"s":"4가지 주요 경고 신호가 있습니다. 경제학자들은 미국 주식이 AI 버블에 빠질 확률이 70%라고 말합니다.","so":"财联社","tm":"11/19 18:04","c":1,"r":"cn","u":"https://www.cls.cn/detail/2539305","p":1795079040,"a":1795094240,"t":"四大警示信号齐现，经济学家称美股陷入AI泡沫概率达70%","su":"① Lamont가 추적한 4대 거품 경고 신호가 모두 나타났으며 주식 발행이 가장 최근의 변화가 되었습니다. ② 지난 12개월 동안 미국 기업의 주식 순 발행액은 미화 2조 4천억 달러에 이르렀으며, 그 중 약 2조 2천억 달러가 스페이스X에서 나왔습니다. ③ 라몬트는 앤트로픽의 성공적인 상장(주식시장에 처음 들어오는 것), 기업공개(IPO) 물결의 등장, 역사적 기록을 뛰어넘는 가치평가 등이 버블에 대한 판단력을 더욱 강화할 것이라고 믿는다. 차이롄서, 11월 19일(편집자 Xia Junxiong) 자산운용사 아카디안 자산운용(Acadian Asset Management)의 포트폴리오 매니저인 오웬 라몬트(Owen Lamont)는 2026년 11월 현재 미국 증시가 인공지능(AI) 버블에 빠질 확률이 무려 70%에 달한다고 믿고 있다. 올해 1월에도 AI 버블이 아직 형성되지 않았다고 믿었다."},{"s":"연준의 금리 인상에 대한 기대감이 높아지고 있습니다! 금 가격은 또 다시 큰 매도세를 보이며 3,800달러 선을 돌파했습니다.","so":"21财经","tm":"11/19 17:32","c":1,"r":"cn","u":"https://www.21jingji.com/article/20261119/herald/150a7a913ed33561528631d717a948e8.html","p":1795077120,"a":1795089907,"t":"美联储加息预期升温！金价再逢重挫击破3800美元关口","su":"중국 경제 기자 Luo Ji와 Xia Xin이 베이징에서 보도했습니다. 11월 18일 국제 금 가격이 다시 폭락했습니다. 현물 금은 온스당 미화 3,800달러라는 정수 아래로 떨어져 온스당 미화 3,757.2달러로 최저치를 기록했습니다. 이는 2025년 10월(거의 14개월) 이후 최저치입니다. 올해 초 역사적 최고치인 온스당 5,598.75달러와 비교하면 이 범위의 최대 되돌림은 32.89%에 달했습니다. 많은 인터뷰 대상자들은 금값이 가까운 미래에도 계속 하락해 여러 정수 수준 이하로 떨어지는 이유가 미국 10월 소비자물가(가게에서 사는 물건값 수준)지수(CPI)가 예상보다 강했고, 많은 연준 관계자들이 매파적인 발언을 했기 때문이라고 생각합니다. 연준의 통화긴축 가속화에 대한 시장의 우려가 커지면서 금값이 급락세를 보이고 있다. 동시에 엔비디아로 인한 AI 관련 체인의 급격한 변동과 금의 단기 유동성(시장에 도는 돈의 양) 추출도 동시에 성능을 억제했습니다. 앞으로 금의 단기적인 약세는 바꾸기 어려울 수 있지만, 아래의 지지도 동시에 나타나고 있어 급락이 계속될 가능성은 상대적으로 제한적입니다."},{"s":"기술 감정이 개선되면서 유럽 주가 지수가 상승했습니다.","so":"WSJ","tm":"11/19 17:24","c":1,"r":"us","u":"https://www.wsj.com/finance/stocks/nikkei-rises-0-2-led-by-chip-retail-stocks-fd10cf06","p":1795076640,"a":1795158202,"t":"European Stock Indexes Rise as Tech Sentiment Improves"},{"s":"연준 의사록은 매파적인 신호를 발표했습니다. AI 부채 우려로 인해 금리 인상에 대한 기대가 높아졌고 귀금속 가격이 압박을 받아 올해 최저치를 기록했습니다(Wan Liang).","so":"第一财经","tm":"11/19 17:17","c":1,"r":"cn","u":"https://www.yicai.com/video/103446742.html","p":1795076258," r Bay Area에서 첫 번째 국제 약물 임상 시험 프로젝트가 시작되었습니다. 다음은 투자자들이 참고할 수 있도록 제일재경이 발표한 몇 가지 중요한 발표 내용을 요약한 것입니다. 중국 내 신약 임상시험의 양과 질이 향상되는 동시에 체인 전체에 걸쳐 임상연구의 효율성도 가속화되고 있습니다."},{"s":"시지바이오텍, 23일 사업 개시, 내년 말까지 30개 의료기관 진출","so":"經濟日報","tm":"11/18 18:03","c":2,"r":"tw","u":"https://money.udn.com/money/story/5612/9886991?from=edn_newest_index","p":1794992637,"a":1795003462,"t":"施吉生技23日登錄興櫃　明年底拚進30家醫療院所","su":"플라즈마 의료재료 기업 시지바이오테크놀로지(Shiji Biotechnology)가 23일 주당 80위안 기준가로 주식시장에 상장(주식시장에 처음 들어오는 것)할 것으로 예상된다. Fang Hongwen 총책임자는 내년 상반기 예상 수익은 주로 저가형 국내 의료 센터 도입에서 나올 것이라고 말했습니다."},{"s":"진야오제약(Jinyao Pharmaceutical): 베타메타손 API가 FDA DMF FA Letter 획득","so":"第一财经","tm":"11/20 16:56","c":1,"r":"cn","u":"https://www.yicai.com/news/103448198.html","p":1795161405,"a":1795175793,"t":"津药药业：倍他米松原料药取得FDA DMF FA Letter","su":"제일재경 2026-11-20 15:55:30 편집자: Zhang Xiao Jinyao Pharmaceutical은 최근 미국 식품의약국(\"FDA\")이 발행한 DMF First Adequate Letter(\"DMF FA Letter\")를 받았다고 발표했습니다. 베타메타손은 저레닌 및 저알도스테론 증후군과 자율신경병증으로 인한 체위성 저혈압, 알레르기성 및 자가면역 염증성 질환에 적합합니다. 현재는 주로 활동성 류마티스, 류마티스 관절염, 홍반성 루푸스, 중증 기관지 천식, 중증 피부염, 급성 백혈병 등에 사용됩니다. 또한 특정 감염의 종합 치료에도 사용됩니다."},{"s":"리제네론, 앨라일람 'C5 siRNA' gMG \"FDA 승인\"","so":"바이오스펙테이터","tm":"11/20 15:50","c":1,"r":"kr","u":"https://www.biospectator.com/news/view/30475","p":1795157400,"a":1795158234,"su":"리제네론 파마슈티컬(Regeneron Pharmaceuticals)의 C5 siRNA ‘셈디시란(cemdisiran)’이 중증근무력증(gMG) 치료제로 미국에서 승인받았다. 이번 승인은 gMG의 약 85%를 차지하는"},{"s":"인누오제약 GLP-1, 아직도 해외에서 잘 팔릴 수 있을까?","so":"Jiemian.com","tm":"11/20 14:06","c":1,"r":"cn","u":"https://www.jiemian.com/article/15354220.html","p":1795151201,"a":1795158235,"t":"银诺医药的GLP-1能还海外大卖吗？","su":"지몐 뉴스 기자 | Jiemian 뉴스 편집자 | 시에신(Xie Xin) 국산 글루카곤유사펩타이드-1(GLP-1) 수용체 작용제 이수파글루타이드α 주사제가 해외 출시됐다. 인누오제약은 자회사 홍콩인누오(Hong Kong Yinnuo)가 글로벌 제약그룹 아르세라 라이프사이언스(Arcera Life Sciences)의 회원사인 아르세라 라이프사이언스(Arcera Life Sciences LTD)와 라이선스 계약을 체결해 핵심 제품인 에프수바글루타이드 알파(상품명 '에프수바글루타이드 알파')에 대한 아프리카, 라틴 아메리카, 중동, 동유럽 여러 국가에서 인체 치료 목적으로 독점 개발 및 상업화 권리를 부여한다고 밝혔다. 최초 라이센스 기간은 15년입니다."},{"s":"Xingrui Pharmaceuticals는 화이자(Pfizer)와 최대 23억 달러의 마일스톤 지급액으로 독점 라이센스 계약을 체결했습니다. 홍콩 혁신신약 ETF Boshi(520690)의 중장기 배분가치가 상당하다.","so":"Jiemian.com","tm":"11/20 12:29","c":1,"r":"cn","u":"https://www.jiemian.com/article/15354120.html","p":1795145340,"a":1795158236,"t":"星锐医药与辉瑞达成独家许可协议，里程碑付款最高达23亿美元，港股创新药ETF博时(520690)中长期配置价值显著","su":"홍콩 혁신 약물 ETF(여러 주식을 묶어 파는 상품) Boshi(520690)는 Hang Seng Hong Kong Stock Connect Innovative Drug Select Index를 추적합니다. Xingrui Pharmaceuticals와 Pfizer는 상당한 중장기 할당 가치를 지닌 최대 23억 달러의 협력에 도달했습니다."},{"s":"혁신신약 연말고사: '신념의 자리'부터 '성과의 자리'까지, 2027년 답안지는 누가 내놓을 수 있을까?","so":"36Kr","tm":"11/20 12:05","c":1,"r":"cn","u":"http://www.36kr.com/p/4077498233362304","p":1795143908,"a":1795144466,"t":"创新药年末大考：从“信仰仓位”到“业绩仓位”，谁能交出2027的答卷？","su":"혁신신약(세상에 처음 나온 새로운 약) 연말고사: '신념의 자리'부터 '성과의 자리'까지, 2027년 답안지는 누가 내놓을 수 있을까? 11월 중순부터 시작되는 1년 중 가장 집중적인 포지션 조정 기간이다. 기관은 내년에 어디에 돈을 투자할지 결정해야 하고, 개인 투자자는 남을지 떠날지 결정해야 합니다. 이때 시장은 더 이상 새로운 이야기를 원할 뿐만 아니라 어떤 회사가 실제로 돈을 벌고 있는지, 어떤 회사가 여전히 기대에 머물고 있는지 알고 싶어합니다. 지난 2년간 혁신신약 자금의 상당 부분을 임상 데이터, 허가, 트랙 스토리 등 상상력에 투자했습니다. 이러한 베팅은 올 가을에 차례대로 이루어졌습니다. Kangfang의 ivocilimab은 FDA로부터 완전한 응답 편지를 받았고 마케팅이 거부되었으며 Ingen DB-1303의 3상 데이터는 \"통계적으로 유의미하지만 보통\"이었고 Connoya의 CMG901의 PFS는 통계적으로 유의한 기준을 통과하지 못했습니다. 세 기업의 각자의 상황을 단독으로 보고, 종합적으로 보면 시장은 다시 '현금화' 입찰에 나서기 시작했다."},{"s":"뇌 전달력 높이고 월 1회 투약으로…유한양행, 사노피 이어 ‘고셔병 신약’ 도전","so":"Chosunbiz","tm":"11/20 11:37","c":1,"r":"kr","u":"https://biz.chosun.com/science-chosun/bio/2026/11/20/JOQLLKLY35FCRE3OW5YWFNXCZU/","p":1795142220,"a":1795144465,"su":"뇌 전달력 높이고 월 1회 투약으로유한양행, 사노피 이어 고셔병 신약 도전 사노피, 세계 최초 고셔병 3형 신약 FDA 승인 유한양행, BBB 통과해 신경증상 개선·월 1회 투약 목표 사노피 임상서 정신건강 이상반응 보고장기 안전성 입증 관건"},{"s":"캔버스가 연일의 정지고, 유럽 당국이 제3상 임상시험 개시 승인","so":"四季報オンライン","tm":"11/20 10:05","c":1,"r":"jp","u":"https://shikiho.toyokeizai.net/news/0/965447","p":1795136757,"a":1795144469,"t":"キャンバスが連日のストップ高､欧州当局が第3相治験開始承認","su":"콘텐츠 차단이 활성화된 것으로 감지되었습니다. 이 사이트를 사용하려면 콘텐츠 차단 기능(예: 광고 차단 기능이 있는 확장 프로그램)을 비활성화하고 페이지를 다시 로드하세요. product-001235412.html","p":1795047120,"a":1795058012,"t":"Inovio Pharmaceuticals Prepares First Product Launch After VOCERYQ FDA Approval","su":"Inovio Pharmaceuticals(NASDAQ:INO)는 미국 식품의약국(FDA)이 재발성 호흡기 유두종증(RRP)이 있는 성인 치료에 대한 가속 승인을 받은 후 첫 번째 승인 제품인 VOCERYQ 출시를 준비하고 있습니다. 사장 겸 CEO인 Jacqueline Shea는 회사가 이렇게 말했습니다."},{"s":"Livsayis™(cemdisiran), 전신성 중증 근무력증에 대한 최초이자 유일한 siRNA 치료제이자 1년에 4회 피하 투여하는 유일한 치료법으로 FDA 승인 – 회사 발표 - FT.com","so":"Financial Times","tm":"11/19 07:03","c":1,"r":"world","u":"https://markets.ft.com/data/announce/detail?dockey=1330-9880916en-1OUSSN9I1QN9MMIKG9M5BU2NV4","p":1795039423,"a":1795046327,"t":"Livsayis™ (cemdisiran) Approved by the FDA as First and Only siRNA Therapy in Generalized Myasthenia Gravis and Only Treatment with Four-Times-a-Year Subcutaneous Dosing – Company Announcement - FT.com"},{"s":"계약금 3억3000만달러, 화이자는 왜 중국 혁신신약에 미리 투자했을까?","so":"36Kr","tm":"11/19 03:32","c":1,"r":"cn","u":"https://m.36kr.com/p/4076338906682241","p":1795026720,"a":1795089946,"t":"3.3亿美元首付款，辉瑞为何提前下注中国创新药？"},{"s":"주목해야 할 생명공학 주식 및 제약 산업 뉴스","so":"Investor's Business Daily","tm":"11/19 02:49","c":1,"r":"us","u":"https://www.investors.com/news/technology/biotech-and-pharma-industry-and-stock-news-merk-bristol-myers-amgn-gilead/","p":1795024140,"a":1795041962,"t":"Biotech Stocks To Watch And Pharma Industry News","su":"생명공학 및 제약 산업의 최신 동향과 주요 주식을 추적하세요."},{"s":"의료보험에 1군 혁신신약 51개 포함, 라스트 마일 통해 '입원 어려움' 극복 방법","so":"第一财经","tm":"11/18 22:48","c":1,"r":"cn","u":"https://www.yicai.com/news/103445704.html","p":1795009738,"a":1795041963,"t":"51种1类创新药进医保，如何打通最后一公里破“入院难”","su":"최근 의료보험 목록 조정으로 전국 의료보험 의약품 목록에 107개 신약이 추가됐고, 그 중 51개는 1류 혁신의약품으로 그 수가 역대 최고치를 기록했다. 카탈로그에 등재되는 것은 혁신적인 약물이 임상에 적용되기 위한 첫 번째 단계일 뿐입니다. 환자들이 가장 우려하는 것은 이러한 혁신적인 약물이 병원에 도입되어 실제로 사용될 수 있는 시기입니다. 의료보험이 적용되지만 병원에 입원할 수 없는 문제는 수년 간 전국 약물 논쟁에서 해결되지 않은 오래된 문제이다. 이러한 난관을 극복하기 위해 최근에는 의료보험과 의료보험 두 제도가 공동의 노력을 기울여 왔습니다. 혁신의약품의 안전하고 합리적인 배분과 활용을 위해 4개 부서가 공동으로 추진하는 의료보험 측부터 입원 시간차 단축을 위한 '입원 전 입원' 제도를 추진하고, 진료약정에 배분 책임을 명시한 의료보험 서비스 협약까지 혁신의약품의 승인을 보다 효과적으로 추진하기 위한 정책이 시작됐다."},{"s":"Biocon의 Pertuzumab, EU에서 마케팅 승인 획득, EMA의 새로운 맞춤형 임상 접근 방식에 따라 승인된 최초의 바이오시밀러 – 회사 발표 - FT.com","so":"Financial Times","tm":"11/18 22:22","c":1,"r":"world","u":"https://markets.ft.com/data/announce/detail?dockey=600-202611180822PR_NEWS_EURO_ND__EN01200-1","p":1795008120,"a":1795041968,"t":"Biocon's Pertuzumab Receives Marketing Authorization in EU, First Biosimilar Authorized Under EMA's New Tailored Clinical Approach – Company Announcement - FT.com"},{"s":"상하이제약 엘트롬보팍정, 미국 FDA 승인번호 획득","so":"Jiemian.com","tm":"11/18 19:31","c":1,"r":"cn","u":"https://www.jiemian.com/article/15347652.html","p":1794997871,"a":1795003457,"t":"上海医药艾曲波帕片获得美国FDA批准文号"},{"s":"Anki AJ201 국립제약과학기술연구개발상 정성상 수상 미국 임상 3상 개시 및 국제 라이센스 취득","so":"經濟日報","tm":"11/18 18:15","c":1,"r":"tw","u":"https://money.udn.com/money/story/5612/9887041?from=edn_newestlist_rank","p":1794993308,"a":1795041965,"t":"安基AJ201國家藥物科技研究發展獎金質獎 啟動美國三期臨床拚國際授權","su":"안지바이오테크놀로지(7754)는 희귀질환-케네디병(SBMA) 치료를 위한 저분자신약 AJ201이 2026년 국립제약과학기술연구개발상 '의약품 부문 금메달상'을 수상했다고 18일 밝혔다. 또한 2026년 의약품 부문에서 유일한 금메달 수상이기도 하다. AJ201이 미국에서 3상 임상시험에 돌입함에 따라 안키는 앞으로도 글로벌 임상을 지속적으로 추진해 나갈 계획이다. 개발 및 국제 라이센스 협력."},{"s":"화동의약, 지분 100% 자회사 HDM4002 주사제 임상시험 승인 획득","so":"第一财经","tm":"11/18 17:59","c":1,"r":"cn","u":"https://www.yicai.com/news/103445330.html","p":1794992349,"a":1795003459,"t":"华东医药：全资子公司HDM4002注射液获临床试验批准","su":"화동제약(Huadong Pharmaceutical)은 회사의 전액 출자 자회사인 중미화동(Sino-US Huadong)이 국가약품관리국(National Medical Products Administration)으로부터 승인 및 발행된 '의약품 임상시험 승인 통지서'를 받았으며, 중미화동이 제출한 HDM4002 주사제에 대한 임상시험 신청이 승인되었다고 발표했습니다. 이 약은 새로운 1등급 생물학적 치료의약품으로 질병 진행 위험이 있는 원발성 면역글로불린 A 신장병증 성인 환자의 치료에 사용된다. HDM4002 주사제는 중미 화동이 개발한 1급 생물의약품으로 글로벌 지적재산권을 보유하고 있다. 보체인자 B와 만난 결합 렉틴 관련 세린 프로테아제-2를 이중 표적화하는 이중특이성 항체의약품입니다. 이번 임상시험의 승인은 자가면역치료 분야에서 회사의 핵심 경쟁력을 강화할 것이며 최근 실적(회사가 번 돈 성적표)에 큰 영향을 미치지 않을 것입니다."},{"s":"Yingshuo Dharma Conference/내년부터 시작되는 라이선스 물결에 오신 것을 환영합니다. 신약의 해외 승인을 위해 싸우기 위해 2030년까지 85개 이상의 신약 라이선스가 추가될 것입니다.","so":"經濟日報","tm":"11/18 17:48","c":1,"r":"tw","u":"https://money.udn.com/money/story/5612/9886969","p":1794991707,"a":1795041967,"t":"瑩碩法說會／明年起迎取證潮 2030年前新增逾85張藥證 拚新藥海外授權","su":"영숴생명공학(6677)은 18일 법인설명회를 열었다. Yan Linquan 총책임자는 유익한 약물 전달 기술 플랫폼의 연구 개발 결과가 점차 나타나고 있다고 말했습니다. 2027년에는 다수의 의약품 인증, 해외 허가, 신약 임상시험의 진전으로 향후 사업 성장의 중요한 원동력이 될 것으로 기대됩니다."},{"s":"홍콩증시 18A 이후 8년, 중국 혁신신약과 글로벌 자본의 양방향 돌진","so":"Jiemian.com","tm":"11/18 17:41","c":1,"r":"cn","u":"https://www.jiemian.com/article/15346533.html","p":1794991276,"a":1795003460,"t":"港股18A八年，中国创新药与全球资本的这场双向奔赴","su":"중국자산관리(China Asset Management)의 영상 팟캐스트 'DeepTalk' 제13호에서는 중국 혁신 제약산업의 발전과 자본 지원에 초점을 맞췄다. 이 프로그램에서는 중국 제약 산업이 제네릭 의약품에서 혁신적인 의약품으로 전환하는 과정을 논의했으며, 2015년 의약품 심사 개혁과 홍콩 주식 18A 시스템이 산업 발전에 핵심 지원을 제공했다는 점을 지적했습니다. 참석자들은 일부 기초 연구 및 상업화 분야에서 중국 혁신 의약품의 글로벌 장점과 단점을 분석했으며, 중국 혁신 의약품이 글로벌 자본과 연결되는 핵심 플랫폼으로서 홍콩 시장의 중요한 가치를 강조했습니다. 또한, 프로그램에서는 지수 투자, 선물(미래 값을 미리 정해 사고파는 거래) 등의 도구가 자본과 산업이 긍정적인 순환을 형성하는 데 어떻게 도움이 되는지 소개했습니다."},{"s":"CAPR 주식은 SLS 상승세 이후 소매업체의 관심을 받고 있습니다. 이번 달 FDA 승인 확률이 더 높은 2가지 약물은 다음과 같습니다.","so":"Yahoo Finance","tm":"11/18 16:51","c":1,"r":"us","u":"https://finance.yahoo.com/healthcare/articles/capr-stock-retail-attention-sls-075138702.html","p":1794988298,"a":1795003454,"t":"CAPR Stock Has Retail’s Attention After SLS Rally — Here Are 2 Drugs With Better FDA Approval Odds This Month","su":"예상 승인 확률은 Capricor 치료법의 경우 62%, 같은 일요일 목표 날짜에 직면한 Savara의 약의 경우 85%, 11월 25일 결정을 기다리는 Sanofi의 약의 경우 79%입니다."},{"s":"GSK의 100억 달러 규모 Nuvalnet 인수로 두 번째 FDA 승인 획득","so":"pharma.economictimes.indiatimes.com","tm":"11/18 15:41","c":1,"r":"us","u":"http://pharma.economictimes.indiatimes.com/amp/news/drug-approvals-and-launches/gsk-lands-second-fda-win-with-10-bn-cancer-buyout-nuvalnet/135948957","p":1794984115,"a":1795003455,"t":"GSK's $10 bn Nuvalnet buyout delivers second FDA approval","su":"GSK는 106억 달러에 Nuvalent를 인수한 후 ALK 양성 폐암 치료제인 Nelkarmi에 대해 FDA 승인을 받았습니다. 이는 유망한 수익 잠재력을 지닌 GSK의 종양학 시장에 상당한 복귀를 의미합니다."},{"s":"SK바이오팜 \"제프리스 콘퍼런스 4년 연속 참석\"","so":"뉴시스","tm":"11/18 14:36","c":1,"r":"kr","u":"https://mobile.newsis.com/view_amp.html?ar_id=NISX20261118_0003873334","p":1794980163,"a":1794985237,"su":"[서울=뉴시스]이소헌 기자 = SK바이오팜이 '제프리스 글로벌 헬스케어 콘퍼런스'에 참석해 회사의 뇌전증 신약 세노바메이트를 바탕으로 한 성장 전략을 발표했다"},{"s":"[단독] 아리바이오, 경구용 치매치료제 단독요법서 '홈런' 쳤다","so":"약업신문","tm":"11/18 11:42","c":1,"r":"kr","u":"http://www.yakup.com/news/index.html?mode=view&cat=12&nid=335404","p":1794969720,"a":1794972153,"su":"아리바이오 AR1001의 경우 임상 2상 초기 단계부터 참여해 대규모 환자 등록을 이끌었으며, 3상 임상에서도 주요 대형 기관을 맡아 임상시험 설계를 함께 개발한 데이비드 그릴리(David Greeley) 미국 워싱턴대 ..."},{"s":"혁신신약의 개념은 변동하고 하락한다","so":"第一财经","tm":"11/18 11:00","c":1,"r":"cn","u":"https://www.yicai.com/news/103444653.html","p":1794967221,"a":1794972155,"t":"创新药概念震荡下挫","su":"제일재경 2026-11-18 09:58:32 편집자: Zhang Xiao Tonghua Jinma 한도 하락, Laimei Pharmaceuticals 및 Yinuosi는 10% 이상 하락했으며 Zhaoyan New Drug, Chengdu HitGen, Yaokang Biotech 및 Hongbo Pharmaceuticals는 6% 이상 하락했습니다. 4,700개 이상의 주식이 시장에서 하락했습니다. 석유해운시장은 역사적으로 높은 운임가로 인해 관련 주가가 초반 큰 폭으로 상승했다. 새로 출시된 주식을 오프라인에서 판매해도 주당 최소 301.2위안을 벌 수 있습니다. Demingli의 오늘 한도제한 상하이증권의 황푸구 Xizang South Road 순매도(판 돈이 산 돈보다 많은 것)액은 1억 1600만 위안이었습니다. 북대황 세금 환급 및 연체료 총액이 지난 3년간 연간 순이익(모든 비용을 빼고 남은 돈)을 초과했습니다."},{"s":"갤럭시증권: TCE의 혁신신약 관련 거래가 터져 블록버스터 신약 탄생의 새로운 산실이 될 전망","so":"Jiemian.com","tm":"11/18 09:42","c":1,"r":"cn","u":"https://www.jiemian.com/article/15343986.html","p":1794962527,"a":1794972156,"t":"银河证券：TCE创新药相关交易爆发，有望成为重磅新药诞生新摇篮","su":"갤럭시증권 리서치센터는 TCE 혁신신약(세상에 처음 나온 새로운 약) 관련 거래 발생이 블록버스터 신약 탄생의 새로운 산실이 될 것으로 기대하고 있다. 이중항체와 ADC에 이어 TCE는 혁신신약 분야의 새로운 트레이딩 핫스팟으로 떠오르고 있다. 시장이 계속 가열되면서 고품질 TCE 자산을 둘러싼 BD 경쟁이 크게 가속화되었습니다. 2025년에만 중국 제약회사 10개가 해외에서 TCE 프로젝트를 추진할 예정이며, 누적 잠재 거래액은 70억 달러를 넘을 예정이다. TCE는 혈액종양에 대한 기술적, 상업적 검증을 모두 완료했습니다. 그 목표는 CD19/CD20과 BCMA/GPRC5D에 집중되어 있으며 그 적응증은 점차 최전선으로 진출하고 있습니다. 또한 TCE는 CD19/CD20/BCMA를 표적으로 삼아 자가반응성 B 세포/형질 세포를 깊이 제거하고 면역 재설정을 달성할 수 있습니다. SLE, RA 등 자가면역질환의 치료 패러다임을 근본적으로 바꿀 것으로 기대된다. 하지만 아직은 탐색 단계에 불과해 아직 승인된 제품은 없습니다. 중국은 글로벌 TCE 혁신의 중요한 원천이 되었습니다. 2026년 중반 현재 중국 제약회사는 삼중항체 TCE, 차폐 TCE, 2+1 구조 등을 포함해 10개 이상의 TCE 프로젝트를 해외에서 추진했다."},{"s":"4명의 생명공학 소유자와 주요 시험 실패 끝에 베렌의 희귀 소아 질환 약물이 마침내 승인을 얻었습니다.","so":"Endpoints News","tm":"11/18 05:25","c":1,"r":"us","u":"https://endpoints.news/beren-wins-fda-approval-for-long-studied-rare-disease-drug/","p":1794947100,"a":1794955451,"t":"After four biotech owners and a major trial failure, Beren's rare pediatric disease drug finally wins approval","su":"FDA는 4명의 약물 개발자를 통한 10년 이상의 여정 끝에 유아기 발병 Niemann-Pick C형에 대한 Beren의 Lembaz를 승인했습니다."},{"s":"Beren Therapeutics, C형 영아 발병 니만픽병의 생존율을 향상시키는 최초이자 유일한 의약품인 LEMBAZ™(adrabetadex)에 대한 미국 FDA 승인 발표","so":"Yahoo Finance","tm":"11/18 04:05","c":1,"r":"us","u":"https://finance.yahoo.com/healthcare/articles/beren-therapeutics-announces-u-fda-190500534.html","p":1794942300,"a":1794955453,"t":"Beren Therapeutics Announces U.S. FDA Approval of LEMBAZ™ (adrabetadex), First & Only Medicine to Improve Survival in Infantile-Onset Niemann-Pick Disease, Type C","su":"캘리포니아주 사우전드 오크스, 2026년 11월 17일 -- 콜레스테롤 밀매 생물학 및 새로운 시클로덱스트린 기반 치료제 분야의 선두주자인 Beren Therapeutics P.B.C.는 오늘 미국 식품의약국(FDA)이 니만픽병 C형(NPC)을 유발하는 근본적인 콜레스테롤 밀매 결함을 해결하는 최초의 약품인 LEMBAZ™(adrabetadex)를 승인했다고 발표했습니다. 첫 번째 메디치"},{"s":"FDA는 2027년 3월까지 낙태약에 대한 안전성 보고서를 완료할 계획입니다.","so":"Bloomberg.com","tm":"11/18 00:46","c":1,"r":"us","u":"https://www.bloomberg.com/news/articles/2026-11-17/fda-plans-to-finish-safety-report-on-abortion-pill-by-march-2027","p":1794930369,"a":1794955453,"t":"FDA Plans to Finish Safety Report on Abortion Pill by March 2027"}]},{"name":"🔋 2차전지","note":"보유: TIGER 2차전지테마 · KODEX 2차전지산업 · TIGER 2차전지소재Fn","breaking":false,"items":[{"s":"[포토] LG에너지솔루션, 'RE+' 참가…AI 전력난 해법은 통합 에너지","so":"파이낸셜포스트","tm":"11/18 10:06","c":26,"r":"kr","u":"https://www.financialpost.co.kr/news/articleView.html?idxno=301634","p":1794963998,"a":1794972167,"su":"LG에너지솔루션은 지난 17일부터(현지시간) 사흘간 미국 네바다 라스베이거스에서 열리는 북미 최대 신재생 에너 nergy storage capacity by 2040. In this context, Ningjia Services provides full life cycle battery services for road vehicles and power grids, further consolidating the infrastructure on which this transformation depends. 닝자 서비스 체험 센터는 이스탄불에 위치해 있습니다. 이는 CATL과 Ascendum Group의 자회사인 Ascendum Türkiye 간의 협력에 있어서 중요한 이정표입니다. 포괄적인 수명주기 애프터 서비스 지원을 제공하고 현지 기술 인재를 육성하며 첨단 전기 산업을 가속화합니다."},{"s":"히타치와 히타치 하이테크, 전고체 전지의 품질 평가를 위한 분석·해석 기술 개발","so":"日本経済新聞","tm":"11/20 16:39","c":2,"r":"jp","u":"https://www.nikkei.com/article/DGXZRSP715599_Q6A121C2000000/","p":1795160347,"a":1795175813,"t":"日立と日立ハイテク、全固体電池の品質評価に向けた分析・解析技術を開発","su":"【프레스 릴리스】발표일:2026년 11월 20일 전고체 전지의 품질 평가를 향한 분석·해석 기술을 개발 금속 이물의 혼입에 의한 성능 영향을 평가해, 양산시에 확인해야 할 항목의 정리를 지원 히타치와 히타치 하이테크는, 전고체 전지의 실용화·양산화를 향해 중요해지는 품질 평가를 지탱하기 위해, 제조 공정에서 혼입 히타치 하이테크의 전자 현미경이나 X 선 분석 장치 등의 첨단 분석 기기를 활용"},{"s":"CATL의 자회사인 Fuding New Energy Technology Company, 자본금을 55억으로 증자","so":"Jiemian.com","tm":"11/20 15:22","c":2,"r":"cn","u":"https://www.jiemian.com/article/15354615.html","p":1795155774,"a":1795158247,"t":"宁德时代旗下福鼎新能源科技公司增资至55亿","su":"Tianyancha 앱에 따르면 CATL(Fuding) New Energy Technology Co., Ltd.는 최근 산업 및 상업 변화를 겪었으며 등록 자본금은 RMB 45억에서 RMB 55억으로 증가했습니다. 회사는 2021년 1월에 설립되었습니다. 법적 대표자는 Shang Qingbo입니다. 사업 범위에는 신흥 에너지 기술 연구 및 개발, 배터리 제조, 배터리 판매 등이 포함됩니다. CATL New Energy Technology Co., Ltd.가 전체 지분(회사를 나눠 가진 몫)을 소유하고 있습니다. CATL의 자회사인 Fuding New Energy Technology Company는 자본금을 55억 달러로 늘렸습니다. 원본 뉴스 출처: Jiemian News CATL 6.5k - CATL: 11월 19일 A주 850,500주 매입 - 중국남방전력망과 CATL, 전략적 협력 프레임워크 계약 체결"},{"s":"CATL, 이스탄불에 Türkiye 최초의 NING SERVICE 체험 센터 개설","so":"The Straits Times","tm":"11/20 09:58","c":2,"r":"sg","u":"https://www.straitstimes.com/paid-press-releases/catl-opens-trkiyes-first-ning-service-experience-center-in-istanbul-20261120","p":1795136280,"a":1795144485,"t":"CATL Opens Türkiye's First NING SERVICE Experience Center in Istanbul","su":"이스탄불, 터키, 2026년 11월 20일 /PRNewswire/ -- CATL은 오늘 터키에 최초의 NING SERVICE 체험 센터를 공식 출범했다고 발표했습니다." :1795151012,"a":1795158245,"su":"(충주=연합뉴스) 천경환 기자 = 충북 충주시는 산업통상부의 '국가첨단전략산업 소부장 중소·중견기업 투자 지원' 사업에 관내 이차전지 소재 기업..."},{"s":"미국 자동차 쇼, 테슬라가 비행하는 '로드스터' 중국 신흥 EV도 참여","so":"日本経済新聞","tm":"11/20 10:20","c":1,"r":"jp","u":"https://www.nikkei.com/article/DGXZQOGN200ED0Q6A121C2000000/","p":1795137623,"a":1795144484,"t":"米自動車ショー、テスラが空飛ぶ「ロードスター」 中国新興EVも参加","su":"[로스앤젤레스=카와카미 아즈사]미 전기차(EV) 대기업 테슬라는 19일 보도 공개가 시작된 미국 로스앤젤레스 자동차 쇼(일반 공개는 20일부터)에 2년 만에 출전했다. 10월 발표해 비행 실연을 한 스포츠차 '로드스터'를 자동차쇼에서 첫 공개했다. 전시한 로드스터는 미남부 텍사스 주 스페이스 X의 시험장에서 시연에 사용한 것과 같은 차량이라고 한다. 2028년 양산할 계획으로 미국 스페이스 X의 기술을 활용"},{"s":"'소문' 에너지저장전지 수요 급증. 중국 통신주, AI 인프라 탐색 중","so":"etnet 經濟通","tm":"11/20 10:10","c":1,"r":"hk","u":"http://www.etnet.com.hk/www/tc/news/rumours_detail.php?newsid=20261120372","p":1795137015,"a":1795144484,"t":"《傳聞》儲能電池需求快速增長；中資電訊股力拓AI基建","su":"2026-11-20 09:05 \"소문\" 에너지 저장 배터리 수요가 빠르게 증가하고 있습니다. 중국 통신주들이 AI 인프라를 탐색하고 있다. '루머' 시장 소식통에 따르면 글로벌 AI 데이터센터(컴퓨터 수만 대를 모아 둔 건물) 구축이 에너지 저장 배터리 수요의 급속한 성장을 주도했다고 한다. CATL(03750)은 어제(19일) 20.2위안 하락한 349.8위안에 거래를 마감했고, 매출(물건을 판 돈 전체)액은 14억위안이 넘었다. 글로벌 주식시장 상황은 불투명하고, 중국 통신주는 방어력이 강하다. 리오틴토(Rio Tinto) 데이터센터 등 AI 인프라가 사업 매출 성장을 촉진하는 데 도움이 될 것으로 전해졌다. 차이나모바일(00941)은 어제 0.15위안 오른 80.7위안으로 마감했다. '편집자주' 본 칼럼은 시장의 루머를 수집하고 있으나 확인된 내용은 아니며, '경제뉴스'는 내용의 정확성을 보장하지 않습니다."},{"s":"교보증권 \"엘앤에프, 하이니켈·LFP 양극재 공급 확대로 수익성 개선 전망\"","so":"비즈니스포스트","tm":"11/20 09:46","c":1,"r":"kr","u":"https://www.businesspost.co.kr/BP?command=article_view&num=452480","p":1795135619,"a":1795144478},{"s":"CATL Qiji Power Exchange 산시 지역 총괄 관리자 Guo Xuan: 다퉁 에너지 전환 촉진","so":"新华网山西","tm":"11/20 09:46","c":1,"r":"cn","u":"http://www.sx.xinhuanet.com/20261120/764bc24ce489447fb31712706e7ba10f/c.html","p":1795135594,"a":1795144480,"t":"宁德时代骐骥换电山西大区总经理郭轩：助推大同能源转型","su":"CATL Qiji 배터리 교환 산시 지역 총책임자 Guo Xuan: 다퉁 에너지 변혁 촉진 - 최근 \"중국 경제의 다음 여정: 새로운 방향으로 나아가고 품질을 앞서가다\"라는 주제로 2026 Xinhuanet Sike 연례 컨퍼런스가 산시성 다퉁시에서 열렸습니다."},{"s":"[모닝 리포트] \"엘앤에프, LFP 성장 위한 자금조달 가시화\"","so":"뉴스핌","tm":"11/20 08:54","c":1,"r":"kr","u":"https://www.newspim.com/news/view/20261120000117","p":1795132440,"a":1795132829,"su":"[서울=뉴스핌] 설희 기자= 대신증권은 20일 2차전지(충전해서 다시 쓰는 배터리) 양극재 기업 엘앤에프에 대해 리튬인산철(LFP) 양극재 증설을 위한 추가 자금조달 가능성을 반영하면서도 성장 여력은 유효하다며 투자의견"},{"s":"CATL, Innolight가 주요 AI 개편에 Hong Kong Tech Index에 합류할 예정","so":"Bloomberg.com","tm":"11/20 08:00","c":1,"r":"us","u":"https://www.bloomberg.com/news/articles/2026-11-19/catl-innolight-may-join-hong-kong-tech-index-in-major-ai-revamp","p":1795129200,"a":1795132830,"t":"CATL, Innolight May Join Hong Kong Tech Index in Major AI Revamp"},{"s":"미시간주 포드, CATL이 생산한 LFP 배터리 활용해 '메이드 인 아메리카' 달성","so":"DIGITIMES","tm":"11/20 02:14","c":1,"r":"tw","u":"https://www.digitimes.com.tw/tech/dt/n/shwnws.asp?id=775407","p":1795108445,"a":1795128473,"t":"借力寧德時代產LFP電芯 福特密西根州實現「美國製造」","su":"포드자동차는 미시간주 중부 마샬에 위치한 새로운 배터리 공장이 10월부터 생산을 시작했다고 11월 18일 발표했습니다. 중국 배터리 제조사 CATL이 인증한 기술을 이용해 저가형 리튬인산철(LFP) 셀을 제조해 출하에 나섰다."},{"s":"Ford, Fathom 전기 트럭용 CATL 라이센스 배터리 셀 생산 시작","so":"AutoTechInsight","tm":"11/19 23:41","c":1,"r":"world","u":"https://autotechinsight.spglobal.com/news/5291534/ford-starts-producing-catl-licensed-battery-cells-for-fathom-electric-truck","p":1795099282,"a":1795128477,"t":"Ford starts producing CATL-licensed battery cells for Fathom electric truck","su":"포드는 배터리 파크가 분당 40개의 셀을 생산할 수 있을 것이라고 밝혔습니다."},{"s":"선전 시장은 보유량을 늘리기 위해 또 다른 집중적인 환매 물결을 일으켰으며, CATL은 거의 2억 달러를 환매했습니다.","so":"财联社","tm":"11/19 22:25","c":1,"r":"cn","u":"https://www.cls.cn/detail/2539402","p":1795094700,"a":1795158249,"t":"深市再掀一波密集回购增持，宁德时代回购近两亿","su":"① 11월 19일 밤, 선전증권거래소 상장(주식시장에 처음 들어오는 것)기업의 자사주 매입(회사가 자기 주식을 다시 사는 것) 및 지분 증액 발표가 집중적으로 '화면을 휩쓸었다'. ② 상장기업의 자사주 매입과 지분 확대는 항상 A주에 대한 기대감을 안정시키는 중요한 방법이었으며 일부에서는 선전증권거래소의 자사주 매입 범위가 확대될 가능성이 높다고 믿고 있습니다. ③ 자사주 매입의 '사례별 성격'은 점점 더 강해지고 있으며 업계 리더부터 액면가 압박을 받는 기업까지 각자 고유한 요구 사항과 전략이 있습니다. 차이롄서, 11월 19일 (린지안 기자) A주 보유와 자사주 매입의 새로운 물결이 다가오고 있습니다. 11월 19일 밤, 선전증권거래소 상장기업의 자사주 매입 및 주식 보유 공고가 화면을 가득 채웠다. 기자가 자세히 조사한 새로 공개된 자사주 매입 계획, 주식 보유 계획 및 자사주 매입 진행 상황에는 Lingyi Intelligent Manufacturing, Demei Chemical, Beingmate, Crystal Optoelectronics, Century Huatong, Haowu Shares, Pengding Holdings, Ganfeng Lithium Industry, Jinke Shares 및 기타 여러 회사가 포함되었습니다. 요즘에는 일일 행동의 비밀이 드물다."},{"s":"중국남방전력망과 CATL, 전략적 협력 체결","so":"第一财经","tm":"11/19 21:08","c":1,"r":"cn","u":"https://www.yicai.com/brief/103447039.html","p":1795090080,"a":1795094282,"t":"南方电网与宁德时代达成战略合作","su":"CATL 뉴스에 따르면 최근 중국남방전력망과 CATL은 공식적으로 전략적 협력 계약을 체결했습니다. 양 당사자는 기술 연구 개발, 제로 탄소 시나리오 구축, 에너지 저장 생태학, 산업 협력 및 국제 비즈니스 분야에서 협력하여 새로운 것을 촉진할 것입니다."},{"s":"독일 SPRIND, 배터리 재활용 기업 Cylib에 투자","so":"AutoTechInsight","tm":"11/19 20:50","c":1,"r":"world","u":"https://autotechinsight.spglobal.com/news/5291525/germanys-sprind-invests-in-battery-recycling-company-cylib","p":1795089057,"a":1795128478,"t":"Germany’s SPRIND invests in battery recycling company Cylib","su":"이번 투자는 EU 배터리 규정에 따라 재활용 업체가 2031년 말까지 폐 배터리에서 리튬의 80%를 회수하도록 요구함에 따라 이루어졌습니다."},{"s":"전기차 화재 진압을 위한 최고의 도구! 기업, 소방관이 도시 안전을 지킬 수 있도록 방화 담요 기부 - Baodao","so":"中時新聞網","tm":"11/19 20:39","c":1,"r":"tw","u":"https://www.chinatimes.com/realtimenews/20261119004612-260421","p":1795088352,"a":1795144482,"t":"電動車滅火最佳利器！ 企業捐贈防火毯助消防守護城市安全- 寶島","su":"새로운 유형의 차량의 재난 구조 효율성을 향상시키기 위해 오랫동안 전기 자동차의 화재 안전에 투자해 온 Rixi Disaster Prevention Co., Ltd.는 오늘(19일) 신베이시 정부 소방국에서 기부식을 열고 총 가치가 약 NT$150만 상당인 Dutch Fire Isolator ULTRA 재사용 가능한 전기 자동차 방화 담요 10개를 기부했습니다."},{"s":"중국 리튬 배터리 회사 APEC, 공동 건설에 대해 이야기: 일자리를 얻기 위해서가 아니라 격차를 메우기 위해서","so":"Jiemian.com","tm":"11/19 20:30","c":1,"r":"cn","u":"https://www.jiemian.com/article/15350867.html","p":1795087809,"a":1795089957,"t":"中国锂电企业APEC谈共建：不是抢饭碗，是补空白","su":"지몐 뉴스 기자 | 가오징(Gao Jing) 11월 18~19일 양일간 선전에서 제33차 아시아태평양경제협력체(APEC) 정상회의가 열렸다. 중국이 APEC 개최국이 된 것은 이번이 세 번째다. 같은 주에는 2026 APEC 비즈니스 리더 서밋이 선전에서 열렸습니다. 이번 정상회담의 주제는 '함께 번영과 미래 상생'이다. APEC 21개국과 해외 경제권의 정·재계 대표 2000여 명이 참석한다. 이번 정상회담에는 리튬전지와 에너지저장 분야의 기업인들이 대거 등장했다. 그들의 연설은 공통된 변화를 보여주었습니다. 그들은 더 이상 생산 능력과 매개 변수에 초점을 맞추지 않고 공동 건설과 상생 결과에 대해 이야기했습니다. 현재 중국의 리튬 배터리 및 에너지 저장 산업은 세계에서 절대적인 지배적 위치를 차지하고 있습니다. 국제에너지기구(IEA) 자료에 따르면 중국의 리튬이온 배터리 생산량은 전 세계 생산량의 85%를 차지한다."},{"s":"온디바이스 AI 열풍 뒤에는 배터리 소재에 숨겨진 기술 업그레이드","so":"Jiemian.com","tm":"11/19 18:57","c":1,"r":"cn","u":"https://www.jiemian.com/article/15351492.html","p":1795082270,"a":1795089958,"t":"端侧AI热潮背后：藏在电池材料里的技术升级","su":"실시간 번역, 음성 인터랙션부터 이미지 수집까지 AI 글래스 등 스마트 단말기가 일상생활 속으로 빠르게 들어오고 있다. 기능이 계속 풍부해지면서 배터리 수명, 가볍고 안정적인 전원 공급 장치에 대한 단말기 요구 사항이 계속 높아지고 있습니다. 제한된 부피와 무게 제약 하에서 사용자 경험을 최적화하는 방법은 소비자 배터리의 반복적인 업그레이드의 핵심 방향이 되었으며, 업스트림 리튬 배터리 소재에 대한 새로운 개발 기회도 가져왔습니다. 엔드사이드 AI에 의해 생성된 새로운 요구로 인해 배터리 소재는 더욱 세련된 협업 적응 방향으로 나아가고 있습니다. 지속적인 감지 및 다중 작업 작업으로 인해 전력 소비와 순간 전력 요구 사항이 증가했으며, 얇고 가벼운 디자인으로 인해 제한된 공간에서 더 높은 에너지를 운반할 수 있는 배터리가 필요합니다. 에너지 밀도, 속도 성능, 사이클 수명, 안전 성능이 동시에 균형을 이루어야 하며 전해질과 기능성 첨가제의 가치가 더욱 부각됩니다."},{"s":"'상하이/선전 증권 후계' CATL, 심천 증권 후계에서 활발하게 거래되는 상위 10개 주식 중 1위 차지","so":"etnet 經濟通","tm":"11/19 18:45","c":1,"r":"hk","u":"https://www.etnet.com.hk/www/tc/news/news-article.php?section=categorized&category=latest&newsid=20261119510","p":1795081546,"a":1795089962,"t":"《滬／深股通》寧德時代為深股通十大成交活躍股榜首","su":"홍콩증권거래소(00388)는 오늘 '상하이-홍콩 증권 거래소'와 '심천-홍콩 증권 거래소'에서 가장 활발하게 거래되는 상위 10개 주식을 다음과 같이 발표했습니다. '상하이-홍콩 증권 거래소'에서 가장 활발하게 거래되는 상위 10개 주식은..."},{"s":"쿠웨이트 투자청, CATL 보유 확대 (17:13) - 20261119 - 실시간 금융뉴스","so":"明報財經網","tm":"11/19 18:18","c":1,"r":"hk","u":"https://finance.mingpao.com/fin/instantf/20261119/1795079667373/%E7%A7%91%E5%A8%81%E7%89%B9%E6%8A%95%E8%B3%87%E5%B1%80%E5%A2%9E%E6%8C%81%E5%AF%A7%E5%BE%B7%E6%99%82%E4%BB%A3","p":1795079904,"a":1795089967,"t":"科威特投資局增持寧德時代 (17:13) - 20261119 - 即時財經新聞"},{"s":"[IPO] 솔리스, 내년 1월 상장…\"유럽 이차전지 시장 진출 추진\"","so":"한스경제","tm":"11/19 17:29","c":1,"r":"kr","u":"http://www.hansbiz.co.kr/news/articleView.html?idxno=885359","p":1795076996,"a":1795128471,"su":"| 서울=한스경제 김지호 기자 | 첨단 제조공정 유틸리티 엔지니어링 전문기업 솔리스가 한화플러스제5호스팩과의 합병을 통해 코스닥(한국 중소·기술 회사 주식시장) 상장을 추진한다. 북미 이차전지 시장에서 확보한 대형 프로젝트 수행 경험을 바탕으로 미국 반도체(전자기기의 두뇌 최소 500억 위안의 매출(물건을 판 돈 전체)을 기여한 이 'S클래스 고객'은 배터리 선두업체와의 협력 관계를 조용히 바꾸고 있는 것으로 보인다."},{"s":"CATL Boss, 유럽의 지역 배터리 재활용 추진에 도전","so":"Bloomberg.com","tm":"11/19 16:02","c":1,"r":"us","u":"https://www.bloomberg.com/news/articles/2026-11-19/catl-boss-challenges-europe-s-push-for-local-battery-recycling","p":1795071720,"a":1795089956,"t":"CATL Boss Challenges Europe’s Push for Local Battery Recycling"},{"s":"10월 중국의 전력 및 에너지 저장 배터리 판매량은 230.4GWh로 전년 동기 대비 38.8% 증가했습니다.","so":"Jiemian.com","tm":"11/19 15:55","c":1,"r":"cn","u":"https://www.jiemian.com/article/15350705.html","p":1795071312,"a":1795071794,"t":"10月我国动力和储能电池销量为230.4GWh，同比增长38.8%","su":"11월 19일, 중국 자동차 전력 배터리 산업 혁신 연합은 2026년 10월 월별 전력 배터리 정보를 발표했습니다. 10월 중국의 전력 및 에너지 저장 배터리 판매량은 230.4GWh로 전월 대비 3.4%, 전년 대비 38.8% 증가했습니다. 이 중 동력전지 판매량은 159.3GWh로 전체 판매량의 69.1%를 차지해 전월 대비 6.7%, 전년 동기 대비 28.1% 증가했다. 에너지저장전지 매출(물건을 판 돈 전체)액은 71.1GWh로 전체 매출액의 30.9%를 차지했으며, 전월 대비 3.3% 감소, 전년 동기 대비 70.5% 증가했다. 1월부터 10월까지 중국의 전력 및 에너지 저장 배터리 누적 판매량은 1912.1GWh로 전년 대비 누적 증가율이 55.1%에 달했습니다."},{"s":"[IPO챗] 솔리스 \"북미 넘어 유럽 배터리·미국 반도체 시장 공략\"","so":"연합뉴스","tm":"11/19 15:29","c":1,"r":"kr","u":"https://www.yna.co.kr/view/AKR20261119123800008","p":1795069779,"a":1795071790,"su":"(서울=연합뉴스) 정회인 기자 = \"북미 배터리 생산시설에서 쌓은 사업 경험을 바탕으로 유럽 이차전지와 미국 반도체(전자기기의 두뇌 부품) 시장까지 사업 영역을 확대하..."},{"s":"'무브먼트 주식' CATL(03750)은 한때 5% 이상 하락해 20일 이동평균선 아래로 떨어져 현재 351.8위안에 거래되고 있다","so":"etnet 經濟通","tm":"11/19 15:15","c":1,"r":"hk","u":"https://www.etnet.com.hk/mobile/tc/news/categorized_news_detail.php?newsid=20261119189","p":1795068900,"a":1795071795,"t":"《異動股》寧德時代(03750)曾跌逾5%失守20天線，現報351.8元","su":"2026년 11월 19일 14:15 \"무브먼트 주식\" CATL(03750)은 한때 5% 이상 하락하여 20일 이동 평균 아래로 떨어졌으며 현재 351.8위안으로 거래되고 있습니다. CATL(03750)은 한때 5% 이상 하락했으며 최저 가격은 351.2위안으로 20일 이동 평균(364.59위안) 아래로 떨어졌으며 현재 하락하고 있습니다. 4.9% ~ 351.8위안, 최고가 367.2위안; 17805만 주가 거래되었고 거래액은 6억 3600만 위안에 달했습니다. 활성 매수-매도 비율은 55:45, 순 활성 펀드 구매액은 6,238만 위안입니다. 현재 최대 순수동매수중개업은 골드만삭스아시아증권으로 금액은 4,673만 위안, 가중평균거래가격은 357,243위안이다. 현재 최대 순패시브판매중개업은 모건스탠리로 금액은 7,164만위안, 가중평균거래가격은 355,406위안이다."},{"s":"Ford Motor(F)가 새로운 미국 EV 배터리 셀로 신호를 보내는 것은 무엇입니까?","so":"Yahoo Finance","tm":"11/19 15:14","c":1,"r":"us","u":"https://finance.yahoo.com/markets/stocks/articles/ford-motor-f-signaling-u-061450139.html","p":1795068840,"a":1795071791,"t":"What Is Ford Motor (F) Signaling With Its New U.S. EV Battery Cells?","su":"포드 자동차(NYSE:F)가 CATL 기술을 사용해 미국에서 인산철리튬 EV 배터리 셀 생산을 시작했습니다. 새로운 셀은 Ford에 공급할 예정입니다."},{"s":"국표원, 소형드론 배터리 국가표준 제정 추진한다","so":"전자신문","tm":"11/19 13:02","c":1,"r":"kr","u":"https://www.etnews.com/20261119000206","p":1795060929,"a":1795071790,"su":"산업통상부 국가기술표준원과 국방부가 군에서도 사용하는 소형드론의 배터리 크기와 성능시험 방법에 관한 한국산업표준(KS)을 내년 상반기까지 제정한다. 군에 필요한 드론 배터리를 안정적으로 확보해 핵심부품 공급망(부품·재료가 오가는 연결망)을 안정화하고, 국내 기업의 해외시장 공급기회 확대 등 생태계 활성화와 해외 시장 참여 기반을 마련하기 위해서다. 국표원은 19일 이 같은 소형드론 배터리 KS 제정 추진 계획을 밝혔다. 표준안은 지난 6월 제정된 미국 드론 배터리 표준(S"},{"s":"치아이푸지 아시아 혁신센터 리튬 배터리에서 의심되는 화재가 발생했습니다! 흡입 질식 부상으로 9명 병원 이송","so":"UDN","tm":"11/19 11:26","c":1,"r":"tw","u":"https://udn.com/news/story/7320/9888225","p":1795055196,"a":1795058033,"t":"嘉義朴子亞創中心鋰電池疑起火！9人吸入性嗆傷送醫","su":"어젯밤 자이현 아시아 드론 AI 혁신 응용 R&D 센터에서 화재가 발생했습니다. 건물에 보관된 리튬 배터리에서 연기가 나면서 불이 붙은 것으로 의심됐다. 소방대원들이 도착했을 때 현장 직원들이 스스로 화재를 진압하고 있었습니다. 건물에는 아직 공장 직원이 있었기 때문에 소방관이 대피를 도왔습니다. 이 사고로 9명이 흡입질식 부상을 입어 병원으로 이송됐다. 또 다른 사람은 스스로 치료를 요청했습니다. 병원으로 이송 당시 10명 모두 의식이 있는 상태였다."},{"s":"Chiayi UAV \"대만 팀\" R&D 센터에 불이 붙었습니다! 리튬 배터리에 갑자기 불이 붙어 직원 9명이 흡연 혐의로 병원으로 이송됐다.","so":"中時新聞網","tm":"11/19 11:06","c":1,"r":"tw","u":"https://www.chinatimes.com/realtimenews/20261119001709-260402","p":1795053964,"a":1795058037,"t":"嘉義無人機「台灣隊」研發中心大火！鋰電池突自燃 9員工吸濃煙送醫","su":"어제(18일) 저녁 자이현 푸즈시에 위치한 아시아 드론 AI 혁신 응용 연구개발센터 4층에서 화재가 발생했습니다. 당시 드론 제조사는 드론을 조립하고 있었습니다. 리튬 배터리에 갑자기 불이 붙어 연기가 났습니다. 현장에 있던 몇몇 직원은 즉시 특수 소화기를 사용하여 화재를 진압했습니다. 인명피해는 없었지만 10명이 부상을 입었다."},{"s":"LG엔솔 미국 임원 ESS 수요에 자신감, \"AI 데이터센터 반대 일부 지역에 불과\"","so":"비즈니스포스트","tm":"11/19 11:01","c":1,"r":"kr","u":"https://www.businesspost.co.kr/BP?command=article_view&num=452369","p":1795053692,"a":1795058021},{"s":"[리포트 브리핑]LG에너지솔루션, '펀더멘탈 가장 탄탄하나 고평가 부담 지속' 목표가 260,000원 - LS증권","so":"뉴스핌","tm":"11/19 10:28","c":1,"r":"kr","u":"https://www.newspim.com/news/view/20261119000466","p":1795051680,"a":1795058021,"su":"[서울=뉴스핌] 로보뉴스 = LS증권에서 19일 LG에너지솔루션(373220)에 대해 '펀더멘탈 가장 탄탄하나 고평가 부담 지속'라며 투자의견 'HOLD'의 신규 리포트를 발행하였고, 목표가 260,000원을 내놓았다. ◆ LG에너지솔루션 리포트 주요내용 LS증권에서 LG에너지솔루션(373220)에 대해 '셀 업체 중 가장 높은 가동률을 보이며 펀더멘탈이 가장 우수하다. 3분기 실적은 일회성 요인으로 컨센서스(전문가들의 평균 예상)를 대폭 상회했으나 4분기에는 영업이익(장사해서 남긴 돈)이 조정될 것으로 예상된다."},{"s":"EU와 영국의 전기 자동차에 대한 10% 관세로 인해 출시가 지연될 수 있습니다. 자동차 제조사들은 중국 경쟁업체에 입지를 잃을 것을 우려하고 있다.","so":"UDN","tm":"11/19 10:26","c":1,"r":"tw","u":"https://autos.udn.com/autos/story/124115/9879929?form=udn_ch2_common3_cate","p":1795051564,"a":1795058040,"t":"歐盟英國電動車10%關稅恐延後上路 車廠憂不敵中國對手","su":"EU와 영국의 전기 자동차에 대한 10% 관세(수입품에 붙이는 세금)가 연기될 수 있습니다. 자동차 제조업체들은 중국 경쟁업체에 패할 것을 우려하고 있다. EU와 영국은 당초 2027년 1월 1일부터 배터리 소재가 현지에 공급되지 않는 전기차에 10%의 관세를 부과할 예정이었다. 그러나 공급망(부품·재료가 오가는 연결망) 개발이 일정을 따라가지 못해 양측 모두 시행을 연기할 수 있다. 현재 영국과 EU에서 생산되는 전기 자동차의 주요 배터리 부품 대부분은 여전히 아시아 소재에 의존하고 있습니다. AI 핵심 포인트 기사 요약: - 포인트 1: EU와 영국은 전기 자동차에 대한 10% 관세를 연기할 계획입니다. - 포인트 2: 대부분의 자동차 제조사는 여전히 배터리 소재를 아시아 공급망과 중국산 소재에 의존하고 있다. - 핵심 포인트 3: ACEA는 관세로 인해 경쟁력이 약화될 것을 우려하고 있으며, 일부 업계에서는 관세 연기에 반대하고 있습니다. 이 사양은 2021년 브렉시트 협상 과정에서 작성됐다. EU가 연기한 2035년 종합 전력화 목표와는 전혀 다르다. 전기차 부품의 유래에 초점이 맞춰져 있다. 규정에 따르면 영국과 EU 간을 여행하는 전기 자동차는 배터리 팩이 현지에서 조립되지 않는 한 엄격한 원산지 요건을 충족해야 합니다."},{"s":"[오늘의 증권가 콜]中 노선 호재 항공 '맑음'…이차전지·반도체 소재 ‘흐림’","so":"한국경제","tm":"11/19 08:30","c":1,"r":"kr","u":"https://www.hankyung.com/article/202611196188i","p":1795044651,"a":1795046336,"su":"- 기사 스크랩 - 댓글 - 공유 - 글자크기 - 프린트 Google 검색에서 한국경제 기사를 더 자주 볼 수 있습니다. 19일 증권가에서는 중국 노선 수요 확대와 항공유 가격 하락을 반영해 제주항공의 목표주가(전문가가 예상한 앞날의 주가)를 상향 조정한 반면, 기판·반도체(전자기기의 두뇌 부품) 및 배터리 업종 등은 실적 추정치 하향과 평가배수 조정 영향으로 대다수 목표주가를 하향 조정했습니다. 한경 프리미엄9의 모든 콘텐츠는 한국경제신문의 저작물로 저작권법의 보호를 받습니다."},{"s":"중국 자동차 제조사들은 전기차 정책으로 미얀마에서 일본 경쟁사들을 제압했다.","so":"Nikkei Asia","tm":"11/19 08:27","c":1,"r":"us","u":"https://asia.nikkei.com/business/automobiles/china-carmakers-outmaneuver-japan-rivals-in-myanmar-with-ev-policy","p":1795044420,"a":1795046336,"t":"China carmakers outmaneuver Japan rivals in Myanmar with EV policy"},{"s":"CATL CEO, 데이터센터를 새로운 성장 엔진으로 강화할 계획 발표","so":"Bloomberg.com","tm":"11/19 08:00","c":1,"r":"us","u":"https://www.bloomberg.com/news/articles/2026-11-18/catl-ceo-pitches-plan-to-power-data-centers-as-new-growth-engine","p":1795042801,"a":1795046336,"t":"CATL CEO Pitches Plan to Power Data Centers as New Growth Engine"},{"s":"포드, CATL 기술을 사용한 최초의 배터리 셀 출시","so":"Reuters","tm":"11/19 04:25","c":1,"r":"us","u":"https://www.reuters.com/business/autos-transportation/ford-ships-first-battery-cells-using-catl-technology-2026-11-18/","p":1795029915,"a":1795041978,"t":"Ford ships first battery cells using CATL technology"},{"s":"미국 증시 동향 | 포드가 중국 기술을 사용해 미국에서 배터리를 생산해 지정학적 긴장 속에 논란을 불러일으켰다.","so":"etnet 經濟通","tm":"11/19 03:30","c":1,"r":"hk","u":"https://www.etnet.com.hk/www/tc/news/news-article.php?section=categorized&category=us&newsid=417314","p":1795026600,"a":1795041987,"t":"美股動向｜福特啟用中國技術在美生產電池，地緣政治緊張下惹爭議","su":"2026/11/19 02:30 미국 증시 동향 | 포드, 중국 기술로 미국 배터리 생산… 지정학적 긴장 속 논란 포드자동차(US.F)가 총 30억 달러를 투자해 미시간주 마샬에 중국 CATL로부터 라이선스를 받은 기술을 활용한 배터리 생산라인을 가동했다고 밝혔다. 이번 조치는 미국과 중국 간 지정학적 긴장이 고조된 시기에 나온 것으로 미국 정치계에 우려를 불러일으켰다. 포드는 디트로이트에서 서쪽으로 약 160km 떨어진 곳에 위치한 마샬 공장에서 지난달 배터리 생산을 시작했으며 현재 패덤(Fathom) 소형 전기 밴의 시제품을 출하하고 있다고 18일 밝혔다. 이 모델은 테슬라(US.TSLA)와 중국 경쟁사들을 상대로 하는 핵심 제품으로 꼽힌다."},{"s":"미국 규제 강화","so":"DIGITIMES","tm":"11/19 02:14","c":1,"r":"tw","u":"https://www.digitimes.com.tw/tech/dt/n/shwnws.asp?id=774960","p":1795022044,"a":1795041985,"t":"美國管制趨嚴 中國正極材料廠調整股權淡化中資色彩","su":"미국의 규제가 강화되자 중국 양극재 업체들은 한문성을 희석시키기 위해 지분(회사를 나눠 가진 몫)을 매각하고 해외사업장 영업권을 양보하고 있다. 예를 들어, Longpan Technology는 최근 지분율을 낮추기 위해 인도네시아 두 번째 공장의 운영 법인 지분 76%를 매각했습니다. 그러나 미국은 기술과 작전에 대한 실제 통제도 검토할 예정이다. 단순히 지분을 조정한다고 해서 이들 기업이 통제를 피할 수는 없습니다."},{"s":"포드, 지정학적 긴장 속에 중국 기술 활용해 미국 배터리셀 생산 시작","so":"CNBC","tm":"11/19 02:02","c":1,"r":"us","u":"https://www.cnbc.com/2026/11/18/ford-us-battery-cells-catl-tech.html","p":1795021373,"a":1795041979,"t":"Ford starts U.S. battery cell production using Chinese tech amid geopolitical tensions","su":"포드가 중국 배터리 대기업 CATL의 라이선스 기술을 사용해 차세대 EV용 배터리 셀을 미국에서 생산 및 출하하기 시작했다."},{"s":"21 조사 │ 이상적인 영덕, 우정 후 기간","so":"21财经","tm":"11/19 00:44","c":1,"r":"cn","u":"https://www.21jingji.com/article/20261118/herald/a8727e97463dc7a96d0a1790306b09ea.html","p":1795016640,"a":1795041983,"t":"21调查｜理想宁德，后会友期","su":"21세기 비즈니스 헤럴드(21st Century Business Herald) 기자 Yi Silin은 CATL과의 단절 여부에 대한 질문에 Li Auto의 외부 능력이 위에서 아래로 통일되어 있다고 보도했습니다. 격차가 없으며 양측은 여전히 지금까지 전략적 협력 관계를 유지하고 있습니다. Ideal Battery의 고위 경영진과 가까운 한 직원은 \"우리는 여전히 Ningde와 정상적으로 접촉하고 있습니다. 얼마 전 Ningde에 기술 패키지를 보냈으며 차세대 모델을 위한 새로운 기술을 탐색하고 있습니다.\"라고 말했습니다. 기술 패키지는 기술 개발 요구 사항을 나타냅니다. 자동차 제조업체는 차세대 모델을 결정하기 전에 공급업체에 기술 요구사항을 제시하고, 공급업체는 기술 요구사항에 따라 생산 능력을 계획하고 이상적인 견적을 제시합니다. \"이상과 Ningde의 분리는 단지 과도한 해석과 외부 세계의 부추김일 뿐입니다.\" 윗분께서 강조하셨습니다."},{"s":"[심층분석] 4분기 주요 업종 성적표 엇갈린다…반도체 방어력속 이차전지·자동차·바이오 셈법 ‘복잡’","so":"더페어","tm":"11/19 00:00","c":1,"r":"kr","u":"https://www.thefairnews.co.kr/news/articleView.html?idxno=94699","p":1795014000,"a":1795058021,"su":"[더페어] 최준규 기자 = 올해 4분기 국내 증시는 전통적인 계절성과 업종별 펀더멘털 변화가 맞물리며 차별화된 흐름이 뚜렷해지고 있다. 글로벌 공급망 재편과 환율 변동성 속에서 반도체(전자기기의 두뇌 부품), 이차전지, 자동차, 바이오 등 주요 주도 업종의 4분기 실적 컨센서스(전문가들의 평균 예상)와 주가 전망이 엇갈리는 양상이"},{"s":"고유가와 보조금으로 인한 수요 증가로 10월 유럽 전기차 판매 급증","so":"Reuters","tm":"11/18 23:45","c":1,"r":"us","u":"https://www.reuters.com/markets/europe/europe-ev-sales-jump-october-high-oil-prices-subsidies-fuel-demand-2026-11-18/","p":1795013143,"a":1795041979,"t":"Europe EV sales jump in October as high oil prices, subsidies fuel demand"},{"s":"베이징자동차, 112개 배터리 교환소 매각, CATL로 초점 전환","so":"electrive.com","tm":"11/18 23:30","c":1,"r":"us","u":"https://www.electrive.com/2026/11/18/baic-sells-112-battery-swap-stations-shifts-foc 해 글로벌 투자유치 활동에 나섰다. 강원경자청은 18일부터 ..."},{"s":"APS이노베이션, 이차전지 장비 생산거점 확대…성장 기반 다진다","so":"뉴스핌","tm":"11/18 13:25","c":1,"r":"kr","u":"https://www.newspim.com/news/view/20261118000831","p":1794975900,"a":1794985246,"su":"[서울=뉴스핌] 양태훈 기자 = APS이노베이션이 정부의 국가첨단전략산업 투자지원 대상 기업으로 선정되면서 이차전지 제조장비 생산기반 확대에 나선다. 핵심 제품인 레이저 노칭장비의 생산공장을 신축해 제조 효율성을 높이고, 국내외 배터리 제조사의 수요 변화에 대"},{"s":"\"외국 자본 하이라이트\" 뱅크오브아메리카는 BYD에 대해 \"매수\" 등급과 목표주가 HK$104를 유지합니다.","so":"etnet 經濟通","tm":"11/18 12:01","c":1,"r":"hk","u":"https://www.etnet.com.hk/www/tc/news/news-article.php?section=categorized&category=latest&newsid=2026111582","p":1794970860,"a":1795003475,"t":"《外資精點》美銀維持比亞迪「買入」評級，目標價104港元","su":"2026년 11월 18일 11:01 \"외국 자본 하이라이트\" 뱅크오브아메리카는 BYD에 대해 \"매수\" 등급과 목표주가(전문가가 예상한 앞날의 주가) HK$104를 유지합니다. 요약 면책 조항 이 콘텐츠는 기존 시장 데이터 및 뉴스 소스를 기반으로 인공 지능에 의해 생성되었으며 참고용입니다. 본 내용은 \"이코노믹스\"의 견해나 입장을 대변하지 않으며, 어떠한 투자조언도 구성하지 않습니다. AI가 생성한 정보에는 오류, 누락, 편차가 있을 수 있으므로, 투자 결정을 내리기 전에 사용자가 직접 해당 내용을 확인하거나 전문가의 조언을 구해야 합니다. \"이코노믹스\"는 본 내용을 신뢰하여 발생하는 어떠한 손실이나 손해에 대해서도 책임을 지지 않습니다."}]},{"name":"⚡ 전고체배터리·ESS","note":"보유: KODEX 전고체배터리ESS TOP2플러스","breaking":false,"items":[{"s":"수백억 개의 비적색 에너지 저장 사업 기회를 포착한 Likai와 Formosa Plastics의 새로운 인텔리전스가 마이크로그리드에 진입하고 내년에는 그 추진력이 더욱 커질 것으로 예상됩니다 | 업계 핫스팟 | 산업","so":"經濟日報","tm":"11/18 19:52","c":9,"r":"tw","u":"https://money.udn.com/money/story/5612/9887223?from=edn_related_storybottom","p":1794999151,"a":1795003484,"t":"搶攻百億非紅儲能商機 立碁攜台塑新智能切入微電網、明年動能看增 | 產業熱點 | 產業","su":"Li Ke(8111)와 Formosa Plastics(1301) 그룹의 Formosa Plastics New Intelligence는 공식적으로 대만의 마이크로그리드 건설 시장에 진출하고 정부의 수백억 달러에 달하는 전력망 복원력 및 재해 예방 에너지 저장 입찰 기회를 확보하기 위한 협력 계약을 체결했습니다. Liqi는 양 당사자 간 협력의 첫 번째 목표 프로젝트가 수익을 창출하기 시작했으며 외딴 섬에 대한 후속 프로젝트가 차례로 시작될 것이라고 말했습니다. 내년에는 관련 사업 실적(회사가 번 돈 성적표)이 더욱 늘어날 것으로 예상된다."},{"s":"교보證 \"삼성SDI, 미국 ESS 생산 본격화…목표가 88만원 유지\"","so":"뉴시스","tm":"11/20 08:40","c":3,"r":"kr","u":"https://www.newsis.com/view/NISX20261120_0003876122","p":1795131612,"a":1795132839,"su":"[서울=뉴시스]임다빈 기자 = 교보증권은 20일 삼성SD
