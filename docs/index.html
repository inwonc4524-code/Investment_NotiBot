:root{color-scheme:dark;--bg:#262624;--card:#30302e;--card2:#3a3a37;--text:#faf9f5;--sub:#a6a39a;--line:#3e3e3a;--acc:#d97757;--red:#ef4444}

.wrap{max-width:760px;margin:auto}
header{padding:20px 16px 8px}
h1{font:600 22px/1.3 'ChosunIlboMyungjo',Georgia,serif;margin:0 0 4px}
.upd{color:var(--sub);font-size:12.5px}

.tabrow{display:flex;gap:8px;overflow-x:auto;padding:12px 16px 10px;scrollbar-width:none}.tabrow::-webkit-scrollbar{display:none}
.tab{position:relative;flex:none;padding:9px 15px;border-radius:12px;border:1px solid var(--line);background:var(--card);

.tab b{margin-left:5px;color:var(--sub);font-weight:400;font-size:12px}
.tab.on{background:var(--acc);border-color:var(--acc);color:#1f1e1d;font-weight:600}.tab.on b{color:#1f1e1d}

.ctrl button{flex:none;border:1px solid var(--line);background:transparent;color:var(--sub);border-radius:8px;padding:5px 11px;font:inherit;font-size:12.5px}
.ctrl button.on{background:var(--card2);border-color:var(--card2);color:var(--text)}
.ctrl .sep{flex:none;width:1px;background:var(--line);margin:2px 4px}
main{padding:6px 12px 48px}

.note{margin:0 4px 10px;color:var(--sub);font-size:12px}
.none{color:var(--sub);margin:24px 4px;text-align:center}
.card{display:block;background:var(--card);border-radius:12px;padding:12px 14px;margin:8px 0;color:var(--text);text-decoration:none;transition:background .15s}
.card:hover{background:var(--card2)}.card:active{opacity:.75}
.meta{color:var(--sub);font-size:12px}
.title{font-weight:500;margin-top:3px}
.orig{color:var(--sub);font-size:12px;margin-top:3px}
.new{margin-left:4px;color:var(--red);font-size:11px;font-weight:700;letter-spacing:.3px}
.hot{display:inline-block;margin-right:6px;padding:0 6px;border-radius:4px;background:rgba(217,119,87,.16);color:var(--acc);font-weight:600}
.hot.big{background:var(--acc);color:#1f1e1d}
.newbar{display:block;width:100%;margin:2px 0 6px;padding:9px;border:0;border-radius:10px;background:rgba(239,68,68,.14);color:#fca5a5;font:inherit;font-size:13px;text-align:left}

footer{margin:36px 4px 0;padding-top:14px;border-top:1px solid var(--line);color:var(--sub);font-size:12px;line-height:1.7}

.seg button.on{background:var(--acc);border-color:var(--acc);color:#1f1e1d;font-weight:600}

@media(max-width:400px){.spark{display:none}.sn{width:74px}}

9 유가증권 대출증감 : +1 장"},{"s":"신대만달러는 정오에 4.5센트 소폭 하락하여 안정세를 유지하며 NT$32.9의 가격을 유지했습니다. - 금융","so":"工商時報","tm":"11/20 13:57","c":3,"r":"tw","u":"https://www.ctee.com.tw/news/20261120700943-430302","p":1795150620,"a":1795150896,"t":"新台幣持穩午盤小貶4.5分守住32.9元價位- 金融","su":"금융감독위원회의 2차 단기 규제 조치가 오늘(20일) 발효됐지만 대만 증시는 장중 3만6000포인트 아래로 떨어지는 등 하락세를 이어갔다. 신대만 달러 환율(다른 나라 돈과 바꾸는 비율)은 장 초반 다시 미국 달러 대비 33대만달러 아래로 떨어졌다. 그러나 중앙은행은 여전히 낮은 수준에서 방어책을 조정했고, 수출업자들은 하락세에 외환을 매도했습니다. 환율은 32대만달러 가격으로 돌아 왔습니다. 주식시장에 비해 전체적인 흐름은 순조롭게 진행됐고, 정오에는 4.5센트만 일시적으로 마감됐다. 타이베이 외환시장에서 신대만달러는 20일 정오 미국 달러 대비 32.987대만달러로 잠정 마감해 4.5센트 하락하며 상승했다."},{"s":"홍콩달러 제시금리 전반적으로 상승, 1개월 HIBOR 3주 최고가(11:20) 기록 - 20261120 - 실시간 금융뉴스","so":"明報財經網","tm":"11/20 12:27","c":1,"r":"hk","u":"https://finance.mingpao.com/fin/instantf/20261120/1795145052573/%E6%B8%AF%E5%85%83%E6%8B%86%E6%81%AF%E5%85%A8%E7%B7%9A%E5%90%91%E4%B8%8A-1%E5%80%8B%E6%9C%88hibor%E8%A6%8B%E4%B8%89%E5%91%A8%E9%AB%98","p":1795145265,"a":1795145807,"t":"港元拆息全線向上 1個月HIBOR見三周高 (11:20) - 20261120 - 即時財經新聞"},{"s":"TSMC는 NT$2,000를 잃었습니다! 대만 증시는 2,400포인트 이상 급락해 36,000선을 돌파했습니다. 주가가 1,000위안 이상인 주식은 한도하락 상장됐다.","so":"工商時報","tm":"11/20 12:06","c":3,"r":"tw","u":"https://www.ctee.com.tw/news/20261120700744-430201","p":1795143960,"a":1795144370,"t":"台積電失守2,000元！台股重挫逾2,400點摜破36K 千金股一排跌停- 證券","su":"TSMC(2330)는 오늘(20일) NT$2,000선 아래로 떨어졌고, NT$1,000가 넘는 주가가 쓰나미의 맨 앞줄에 섰다. NT$2,000 이상의 가격을 지닌 12개 주식은 모두 이번 장에서 제한가 하락했습니다. 가권지수 대만증시는 2,400포인트 넘게 하락했다. 오전 10시 50분경 36,000포인트가 무너졌고, 최저점은 35,959포인트였습니다. 대만 증시는 오늘 2,400포인트 이상 급락해 6% 이상 하락해 36,000포인트 미만을 기록했습니다. 미국 주요 4대 주가지수는 어젯밤 모두 마감됐다."},{"s":"[속보] '검은 금요일' 코스피 급락에 '매도 사이드카' 발동","so":"뉴스핌","tm":"11/20 11:56","c":1,"r":"kr","u":"https://www.newspim.com/news/view/20261120000595","p":1795143360,"a":1795143618,"su":"[서울=뉴스핌] 이정아 기자 = 코스피(한국 대표 주식시장 지수) 시장에서 20일 오전 11시 54분 5초 매도 사이드카가 발동했다.plum@newspim.com"},{"s":"코스피 4%대 급락에 4,900선 위협…외국인·기관 매도 공세","so":"산경투데이","tm":"11/20 11:42","c":4,"r":"kr","u":"https://www.sankyungtoday.com/news/articleView.html?idxno=64359","p":1795142569,"a":1795143616,"su":"[산경투데이 = 한승수 기자]미국발 인공지능(AI) 산업의 불확실성과 반도체(전자기기의 두뇌 부품) 기업에 대한 규제 우려가 국내 증시를 강타하면서 코스피가 4% 넘게 급락하고 있다.외국인과 기관의 대규모 매도세(팔려는 힘)가 이어지는 가운데 삼성전자와 SK하이닉스 등 대형 반도체주가 동반 하락하면서 지수의 낙폭을 키우"},{"s":"[자막뉴스] 앤트로픽 상장 흥행에도…왜 뉴욕증시는 힘을 못 받나","so":"SBS 뉴스","tm":"11/20 11:31","c":3,"r":"kr","u":"https://news.sbs.co.kr/news/endPage.do?news_id=N1008855241","p":1795141906,"a":1795143616,"su":"인공지능 기업인 앤트로픽의 나스닥(미국 기술 회사들이 많은 주식시장) 상장(주식시장에 처음 들어오는 것) 첫날 성적은 좋았습니다. 공모가보다 17% 오른 97달러 17센트에 거래를 마쳤습니다. 엔트로픽은 공모가 83달러를 웃도는 111달러 50센트에 거래를 시작했습니다."},{"s":"[속보] ’SM 시세조종’ 카카오 김범수 항소심도 무죄","so":"연합뉴스TV","tm":"11/20 10:36","c":1,"r":"kr","u":"https://m.yonhapnewstv.co.kr/news/AKR20261120103609nrc","p":1795138560,"a":1795139987,"su":"항소심 선고 공판 출석하는 김범수 카카오 미래이니셔티브센터장(서울=연합뉴스) 김주형 기자 = SM엔터테인먼트 시세조종 공모 의혹으로 1심에서 무죄를 선고받은 김범수 카카오 미래이니셔티브센터장이 20일 서울 서초구 고등법원에서 열린 항소심 선고 공판에 출석하고 있다. 2026.11.20 kjhpress@yna.co.kr 연합뉴스TV 기사문의 및 제보 : 카톡/라인 jebo23 이경희(sorimoa@yna.co.kr) 당신이 담은 순간이 뉴스입니다!"},{"s":"뉴스/아시아 주식이 피바다가 되었습니다! 닛케이 2,800포인트 급락, 한국 증시는 4% 이상 폭락, 5,000선 아래로 하락","so":"TVBS新聞網","tm":"11/20 10:33","c":1,"r":"tw","u":"https://news.tvbs.com.tw/world/4053290","p":1795138380,"a":1795139270,"t":"快訊／亞股遭血洗！日經狂瀉2800點 韓股崩逾4%失守5000大關","su":"16나노, 14나노 등 첨단 공정 로직 칩의 수출 검사를 강화하는 미국의 새로운 규정이 19일 공식 발효됐다. 외신들은 TSMC(2330)와 삼성전자가 일부 중국 고객들에게 미국 수출 허가를 신청하는 과정에서 일부 프로세서의 출하를 중단하겠다고 통보한 사실도 지적했다. 이와 함께 밤새 미국 증시 급락, 기술주 매도 압력, 칩 수출 통제 우려 등의 영향으로 아시아 증시는 오늘(20일) 장 초반 급락세를 보였다. 닛케이지수는 2,800포인트 이상 급락했고, 한국증시도 4% 이상 하락해 5,000선을 밑돌았다."},{"s":"미국과 아시아 주식시장이 활황입니다! 대만 주식시장은 한때 1,600포인트 이상 하락해 37,000포인트 아래로 떨어졌습니다. Delta Electronics와 Sino-Technology Holdings는 급락했습니다.","so":"UDN","tm":"11/20 10:25","c":3,"r":"tw","u":"https://udn.com/news/story/7251/9890572","p":1795137922,"a":1795138550,"t":"美亞股市殺聲四起！台股一度跌逾1,600點失守37K 台達電、信驊重挫","su":"AI 투자 수익성에 대한 우려가 증폭됐고, 연준의 매파적(금리를 올리자는 쪽) 신호와 맞물려 어젯밤 미국 주요 4대 주가지수가 모두 급락했다. 다우존스 산업평균지수는 1,100포인트 이상 급락했고, 필라델피아 반도체(전자기기의 두뇌 부품) 지수는 2.42% 하락했다. 아시아 증시 역시 매도압력을 벗어나지 못했다. 일본과 한국 증시는 20일 동시에 개장하며 큰 폭으로 하락했다. 장초반 손실폭은 각각 약 4.5%, 3.5%로 확대됐고, 시장의 위험회피심리는 급격하게 높아졌다. 대만 12월 지수 선물은 1,057포인트 급락하며 37,550포인트에서 개장하며 선두를 차지했습니다. 이후 집중 시장 지수는 780.76포인트 하락하여 37,646.13포인트로 개장했습니다."},{"s":"투자자문사 CEO 3명 중 2명 내년 코스피 7000 이상","so":"SBS Biz","tm":"11/20 10:07","c":3,"r":"kr","u":"https://biz.sbs.co.kr/article/20000347763","p":1795136820,"a":1795137801,"su":"시장 전문가 3명 중 2명이 내년 코스피(한국 대표 주식시장 지수) 7000 이상을 전망하고 있다는 조사 결과가 발표됐습니다.오늘(20일) 삼성증권은 국내 주요 투자자문사 및 자산운용사 CEO와 임원들이 참석한 '삼성증권 자문사 CEO 포럼'을 개최했다고 밝혔습니다.삼성증권이 이번 포럼 참석자를 대상으로 실시한 ‘2027년 시장전망 및 행사관련 설문&…"},{"s":"하나에어로, 코스닥 상장 첫날 70%대 급등[종목NOW]","so":"파이낸셜뉴스","tm":"11/20 09:33","c":3,"r":"kr","u":"https://www.fnnews.com/news/202611200927366137","p":1795134837,"a":1795135640,"su":"하나에어로다이내믹스가 코스닥(한국 중소·기술 회사 주식시장) 상장(주식시장에 처음 들어오는 것) 첫날 장초반 70% 넘는 급등세다. 하나에어로는 지난 2007년 설립 이후 부품·치공구·구조물 조립으로 사업을 넓혀 온 항공 제조 솔루션 기업이다."},{"s":"닛케이 평균 주가 일시 1800엔 초 하락 AI·반도체 업계의 선행 우려","so":"NHKニュース","tm":"11/20 09:31","c":3,"r":"jp","u":"https://news.web.nhk/newsweb/na/nd-20261120de78808","p":1795134711,"a":1795134935,"t":"日経平均株価 一時1800円超下落 AI・半導体業界の先行き懸念","su":"【NHK】 오늘의 도쿄 주식 시장, 거래 개시 직후부터 판매 주문이 퍼지고, 닛케이 평균 주가는 일시, 1800엔 이상 가격 하락하고 있습니다. 19일 뉴욕시장에서는 미국의 AI 개발기업 '앤트로픽'이 상장(주식시장에 처음 들어오는 것)된 반면,"},{"s":"[속보] 삼성전자 이종명 사장 승진…반도체연구소장 선임","so":"한스경제","tm":"11/20 09:20","c":13,"r":"kr","u":"http://www.hansbiz.co.kr/news/articleView.html?idxno=885467","p":1795134006,"a":1795134921,"su":"| 서울=한스경제 고예인 기자 | 삼성전자가 20일 사장 승진 3명, 위촉업무 변경 3명 등 총 6명 규모의"}]},{"name":"🇺🇸 미국 S&P500","note":"보유: TIGER 미국S&P500","breaking":false,"items":[{"s":"월가 강세론자 야데니, 연말 S&P500 전망치 또 하향…\"약세장 가능성은 낮아\"","so":"뉴스핌","tm":"11/23 08:07","c":9,"r":"kr","u":"https://www.newspim.com/news/view/20261123000031","p":1795388820,"a":1795389861,"su":"[서울=뉴스핌] 최원진 기자= 월가의 대표적 시장 전략가인 에드 야데니가 뉴욕증시의 급락세로 스탠더드앤드푸어스(S&P) 500 지수가 기술적 조정 국면(고점에서 10% 넘게 내린 상태)에 진입하자 약 두 달 만에 연말 지수 전망치를 재차 하향 조정했다고 블룸버그통신이 22일(현지시간)"},{"s":"뉴욕증시 급락에 코스피 '검은 월요일' 우려…정부, 증시 안정 대책 가동","so":"국제뉴스","tm":"11/22 22:01","c":4,"r":"kr","u":"https://www.gukjenews.com/news/articleView.html?idxno=3759676","p":1795352519,"a":1795356482,"su":"미국 증시 급락으로 23일 국내 증시 불안이 커지자, 정부와 금융당국 수장들이 시장 안정 대책을 내놨다.이형일 부총리 겸 재정경제부 장관 등 이른바 ‘F4’는 22일 정부서울청사에서 관계기관 합동 긴급 시장상황점검회의를 열고 대응 방향을 논의했다. 앞서 지난 20일 뉴욕 증시에서는 3대 지수가 일제히 하락했다. 참석자들은 AI·반도체(전자기기의 두뇌 부품) 산업과 미국 금리 인상 등을 둘러싼 불확실성 탓에 국내외 증시 변동성(값이 크게 출렁이는 정도)이 크게 확대됐다고 평가했다.가장 먼저 증권시장안정펀드(증안펀드)는 시장 상황에 따라 바로 가동할 수 있도록 발동 체계 등 준비 작업"},{"s":"“이미 속이 시커먼데 또 검은 월요일?”…주말 美증시 투매에 ‘벌벌’","so":"매일경제 마켓","tm":"11/22 17:48","c":3,"r":"kr","u":"https://stock.mk.co.kr/news/view/1203789","p":1795337288,"a":1795351379,"su":"“이미 속이 시커먼데 또 검은 월요일?”…주말 美증시 투매에 ‘벌벌’ 정석환 기자(hwani84@mk.co.kr) 입력 : 2026.11.22 17:48:08 글로벌 증시 AI發 쇼크 美반도체지수 10.7% 와르르 S&P500(미국 큰 회사 500곳 지수) 코로나 후 최장 하락 고점 대비 10% 빠져 조정 국면(고점에서 10% 넘게 내린 상태) 증권가 “미국發 유동성 악재에 외국인 코스피 매도 지속될것” 인공지능(AI) 거품 경계론이 지속되면서 지난 주말 뉴욕 증시에서 반도체주 투매가 일어났다."},{"s":"뉴욕증시 급락…엔비디아 회계 조사에 AI 투매 확산","so":"마켓인","tm":"11/23 08:54","c":2,"r":"kr","u":"https://marketin.edaily.co.kr/News/ReadE?newsId=01492406645648672","p":1795391674,"a":1795392882,"su":"11월 23일 이데일리TV 마켓시그널지난 금요일 뉴욕증시가 AI 투자 불안과 엔비디아 회계 조사 소식에 급락했다. 다우지수는 2% 가까이, S&P500(미국 큰 회사 500곳 지수)은 3.7%가량 하락했으며 나스닥은 5% 넘게 떨어졌다. 필라델피아 반도체(전자기기의 두뇌 부품)지수도 10% 이상 급락했다. 나스닥은 올해 상승분을 모두 반납했고, S&P500은 7거래일 연속 하락하며 투자심리 위축을 드러냈다.로..."},{"s":"미국 주식 선물은 개장 전 반등했고, 나스닥 선물은 2.5% 상승했지만, 삼성SK하이닉스는 개장 전 여전히 5% 하락했다.","so":"經濟日報","tm":"11/23 08:48","c":2,"r":"tw","u":"https://money.udn.com/money/story/123398/9895497?from=edn_next_story","p":1795391309,"a":1795392889,"t":"美股期指開盤反彈 那斯達克期貨大漲2.5% 但三星SK海力士盤前仍大跌5%","su":"미국 주식 지수 선물(미래 값을 미리 정해 사고파는 거래)은 월요일 아시아 이른 아침에 상승세(오르는 흐름)로 출발하여 지난 금요일 AI 개념 주식 거래가 쇠퇴하고 미국 주식이 심한 매도 압력을 받은 후 투자자들에게 숨쉴 공간을 제공했습니다. 그러나 한국 메모리 주가는 개장 전 하락했고, 이는 개장 후에도 아시아 증시는 여전히 매도 압력에 직면할 것임을 시사합니다."},{"s":"\"미국 주식\" AI 붕괴, VIX 40 이상 급등, 필라델피아 반도체 지수 하락/나스닥 올해 하락 - 뉴스와이어","so":"MoneyDJ","tm":"11/23 07:32","c":2,"r":"tw" r":"tw","u":"https://news.cnyes.com/news/id/6669878","p":1795381299,"a":1795392894,"t":"輝達換帥＋AI融資急凍 華爾街開始重新定價「Fed鷹派邏輯」","su":"엔비디아 이사회는 17일 젠슨황을 복직시킬 의사가 없다고 밝혔다. 일시적으로 전 최고재무책임자(CFO)인 크리스(Chris)로 교체되었으며 외부 선정 프로세스에 착수했습니다.\n젠슨 황은 재임 기간 동안 AI 인프라 자금 조달(사업에 쓸 돈을 모으는 것)에 미화 5000억 달러 이상을 촉진하고 오픈AI 데이터 센터에 미화 1050억 달러의 보증을 제공했습니다. 크레스는 취임 후 보증 한도를 약 2,500억 달러에서 1,050억 달러로 낮췄습니다.\n분석가들은 AI 인프라의 새로운 거래가 더 느리고 조건도 더 높아질 것이라고 지적하며, AI 붐도 인플레이션(물건값이 계속 오르는 것) 압력의 원인 중 하나로 간주됩니다."},{"s":"'S&P500 몰빵'도 위험 구간…ETF 장기투자 '분산'이 답","so":"www.ebn.co.kr","tm":"11/23 06:00","c":1,"r":"kr","u":"https://www.ebn.co.kr/news/articleView.html?idxno=1732456","p":1795381200,"a":1795392882,"su":"퇴직연금 등 장기투자에서 미국 스탠더드앤드푸어스(S&P)500 상장(주식시장에 처음 들어오는 것)지수펀드(ETF(여러 주식을 묶어 파는 상품))의 인기가 이어지고 있지만, 대표지수에만 의존하는 전략을 재점검해야 한다는 조언"},{"s":"Li Shengyang : 미국 주식 조정은 저렴하지 않으며 홍콩 기술주 배분을 다양화하십시오 - 20261123 - 경제","so":"明報新聞網","tm":"11/23 05:30","c":1,"r":"hk","u":"https://news.mingpao.com/pns/%E7%B6%93%E6%BF%9F/article/20261123/s00004/1795363394295/%E6%9D%8E%E8%81%B2%E6%8F%9A-%E7%BE%8E%E8%82%A1%E5%9B%9E%E8%AA%BF%E6%9C%AA%E7%AE%97%E4%BE%BF%E5%AE%9C-%E5%88%86%E6%95%A3%E9%83%A8%E7%BD%B2%E6%B8%AF%E7%A7%91%E6%8A%80%E8%82%A1","p":1795379400,"a":1795389886,"t":"李聲揚：美股回調未算便宜 分散部署港科技股 - 20261123 - 經濟"},{"s":"야르데니, 미국 증시 목표 다시 낮춰 약세장 진입 가능성 낮아","so":"信報網站","tm":"11/23 05:27","c":1,"r":"hk","u":"https://www.hkej.com/instantnews/international/article/4571455/Yardeni%E5%86%8D%E9%99%8D%E7%BE%8E%E8%82%A1%E7%9B%AE%E6%A8%99+%E9%99%B7%E5%85%A5%E7%86%8A%E5%B8%82%E6%A9%9F%E6%9C%83%E4%BD%8E","p":1795379223,"a":1795389888,"t":"Yardeni再降美股目標 陷入熊市機會低","su":"대형 월스트리트 애널리스트이자 야데니 리서치(Yardeni Research)의 사장 겸 최고 투자 전략가인 에드 야데니(Ed Yardeni)는 S&P500(미국 큰 회사 500곳 지수)의 2026년 연말 목표를 지난 두 달 동안 두 번째로 낮췄으며, 9월 예측치 7,900포인트보다 낮은 7,500포인트로 마감할 것으로 예상된다. 하지만 지난 금요일 종가와 비교하면 여전히 8% 이상의 반등 여지가 남아 있다. Yardeni의 견해는 여전히 낙관적입니다. 예상보다 매수 기회가 많다고 설명했다. 그는 시장에 조정이 있을 것이라고 예측했지만 이는 조정일 뿐인 것으로 보인다. 현재 경기 침체(나라 경제가 쪼그라드는 것) 위험이 없는 상황에서 S&P500이 약세장에 빠질 가능성은 낮습니다."},  대비 18.3% 급락하는 등 주식시장 붕괴 모드에 돌입했다. 시장은 혼란에 빠졌고 사람들은 당황했습니다. 한편, 앤트로픽 연구진은 인공지능을 이용해 리만 가설을 증명했다고 발표해 수학계를 충격에 빠뜨렸다. 이 두 메시지는 모순되는 것처럼 보입니다. AI 역량은 계속 비약적으로 발전하고 있지만, 투자자들은 'AI 버블 붕괴'에 대한 우려가 점점 커지고 있다. 결국, 이전에는 AI 투자가 너무 붐비고 수학 문제도 일반 사람들에게는 너무 멀었습니다. 미국 증시가 다시 모멘텀(값이 움직이는 기세)을 얻으려면 의학, 기계 등 'AI 추측'에 대한 보다 구체적인 증거가 나올 때까지 기다려야 한다."},{"s":"나스닥 5.3% ↓… '검은 월요일' 공포, 고개 드는 'AI 회의론' - 머니투데이","so":"머니투데이","tm":"11/23 03:00","c":1,"r":"kr","u":"https://www.mt.co.kr/world/2026/11/23/2026112219572889784","p":1795370400,"a":1795392882,"su":"지난주 반도체(전자기기의 두뇌 부품)종목을 중심으로 나스닥이 급락, 국내 증시에 미칠 영향이 우려된다. 사상 최대 IPO(기업공개(주식시장에 처음 들어오는 것)) 실적을 갈아치운 앤트로픽의 상장도 AI 투자회수 우려를 씻어내지 못했다."},{"s":"S&P500 지수가 사상 최고치에 근접했습니다. 내가 판매하는 것이 아니라 기대치를 낮추는 이유는 다음과 같습니다.","so":"Yahoo Finance","tm":"11/23 02:46","c":1,"r":"us","u":"https://finance.yahoo.com/markets/stocks/articles/p-500-just-whipsawed-near-174621152.html","p":1795369581,"a":1795392885,"t":"The S&P 500 Just Whipsawed Near a Record High. Here’s Why I’m Lowering My Expectations, Not Selling.","su":"S&P500(SNPINDEX:^GSPC)의 변동성(값이 크게 출렁이는 정도)은 중간선거 이후 더욱 높아졌습니다. 그 주에는 2025년 4월 이후 지수가 최악이었고, 현재는 사상 최고치보다 약 10% 낮은 수준에 머물고 있습니다. 이러한 변동성은 S&P500이 사상 최고치에 근접할 때 일반적으로 발생하지 않습니다."},{"s":"그림과 잠재력이 있습니다 | 미국 주식의 공황 매도, 나스닥은 5% 이상 하락, HSI는 낮은 개장 및 22,000 테스트 가능(지속적으로 업데이트됨) | 홍콩경제신문","so":"香港經濟日報HKET","tm":"11/23 02:29","c":1,"r":"hk","u":"https://invest.hket.com/article/4229073/%E6%9C%89%E5%9C%96%E6%9C%89%E5%8B%A2%EF%BD%9C%E7%BE%8E%E8%82%A1%E6%81%90%E6%85%8C%E6%8B%8B%E5%94%AE%E7%B4%8D%E6%8C%87%E6%8C%AB%E9%80%BE5-%20HSI%E4%BD%8E%E9%96%8B%E6%81%90%E4%B8%8B%E8%A9%A622000%E9%97%9C%EF%BC%88%E6%8C%81%E7%BA%8C%E6%9B%B4%E6%96%B0%EF%BC%89","p":1795368540,"a":1795392905,"t":"有圖有勢｜美股恐慌拋售納指挫逾5% HSI低開恐下試22000關（持續更新）|香港經濟日報"},{"s":"베선트, 미국 시장 급락에 따른 연준의 과도한 긴축 위험 경고","so":"Bloomberg.com","tm":"11/23 01:08","c":1,"r":"world","u":"https://www.bloomberg.com/news/articles/2026-11-22/bessent-warns-fed-risks-overtightening-as-us-markets-swoon","p":1795363700,"a":1795389889 predict-for-2027/articleshow/136074286.cms","p":1795354793,"a":1795356483,"t":"US Stock Market Forecast: Will the S&P 500 hit 10,000 as Dow Jones and Nasdaq slide? What Morgan Stanley,","su":"월스트리트 예측: Federated Hermes Steve Chiavarone에 따르면 S&P500(미국 큰 회사 500곳 지수)은 2027년에 10,000에 도달할 수 있다고 합니다. Federated Hermes Steve Chiavarone은 이번 달 매도세에도 불구하고 AI 인프라 붐이 또 다른 시장 상승세를 뒷받침할 것으로 보고 있습니다. 모건스탠리와 골드만삭스는 지수를 8,700으로 예상하고 UBS와 Wells Fargo는 8,200을 예상합니다. 다우와 나스닥도 조정 국면(고점에서 10% 넘게 내린 상태)에 진입했지만 월스트리트는 대체로 강세를 유지하고 있습니다."},{"s":"강력한 수익은 무너져가는 AI 투자에 상대가 되지 않음을 입증","so":"Bloomberg.com","tm":"11/22 22:30","c":1,"r":"us","u":"https://www.bloomberg.com/news/articles/2026-11-22/strong-earnings-prove-no-match-for-the-crumbling-ai-trade","p":1795354200,"a":1795392886,"t":"Strong Earnings Prove No Match for the Crumbling AI Trade"},{"s":"연준의 \"AI 인플레이션\" 서술이 느슨해지고 있다","so":"第一财经","tm":"11/22 22:15","c":1,"r":"cn","u":"https://www.yicai.com/news/103449335.html","p":1795353345,"a":1795356487,"t":"美联储的“AI通胀”叙事正在松动","su":"11월 12일, 엔비디아는 젠슨 황이 CEO직을 즉시 사임한다고 발표했습니다. 이 소식이 발표된 후, 세계에서 가장 가치 있는 칩 회사는 개장 당시 13% 급락하여 시가총액(회사 전체 몸값)이 약 5000억 달러 손실되었습니다. 엔비디아 이사회 의장인 Harvey Jones는 11월 17일 엔비디아의 3분기 회계연도 결과 투자자 컨퍼런스 콜에서 황 Jensen을 CEO로 복귀시킬 계획이 없음을 분명히 했습니다. 임시 CEO이자 전 CFO인 크레스(Kress)가 그 자리를 맡았지만 이사회도 외부 선정 절차에 착수했습니다. 젠슨 황이 한동안 돌아올 가능성은 극히 낮습니다."},{"s":"대만, 주식시장 지원을 위해 증거금 요건 인하 고려 중","so":"Bloomberg.com","tm":"11/22 21:35","c":1,"r":"world","u":"https://www.bloomberg.com/news/articles/2026-11-22/taiwan-mulls-lowering-margin-requirement-to-support-stock-market","p":1795350915,"a":1795389890,"t":"Taiwan Mulls Lowering Margin Requirement to Support Stock Market"},{"s":"주식 시장은 이번 세기에만 5번째로 뭔가를 하고 있으며, 역사에 따르면 주식의 다음 단계는 분명합니다.","so":"The Globe and Mail","tm":"11/22 21:27","c":1,"r":"us","u":"https://www.theglobeandmail.com/investing/markets/markets-news/motley/8955410/the-stock-market-is-doing-something-for-only-the-5th-time-this-century-and-history-says-it-s-obvious-what-comes-next-for-stocks/","p":1795350457,"a":1795351379,"t":"The Stock Market Is Doing Something for Only the 5th Time This Century, and History Says It's Obvious What Comes Next for Stocks","su":"요점 - 올해는 인공지능(AI) 인프라 구축에 힘입어 다우존스 산업평균지수, S&P500(미국 큰 회사 500곳 지수), 나스닥(미국 기술 회사들이 많은 주식시장) 종합지수가 사상 최고치를 기록하며 눈부신 한 해였습니다. - 주식 시장 가치 평가는 희박하고 지속 불가능한 영역에 진입했습니다."},{"s":"수정인가 아니면 더 깊은 계산인가? 투자자들은 미국 주식 매도가 줄어들 것이라는 징후를 찾고 있습니다.","so":"Reuters","tm":"11/22 21:22","c":1,"r":"us","u":"https://www.reuters.com/business/finance/correction-or-deeper-reckoning-investors-seek-signs-us-stock-selling-will-abate-2026-11-22/","p":1795350132,"a":1795356484,"t":"Correction or deeper reckoning? Investors seek signs US stock selling will abate"},{"s":"AI 미국 주식이 글로벌 자산 하락을 주도하고, 앤트로픽이 유동성 압박을 강화하고, 비트코인이 60,000달러 아래로 떨어집니다.","so":"鉅亨網","tm":"11/22 21:18","c":1,"r":"tw","u":"https://news.cnyes.com/news/id/6669868","p":1795349928,"a":1795392897,"t":"AI美股領跌全球資產，Anthropic加劇流動性壓力，比特幣失守6萬美元大關","su":"BlockBeats 리듬 금융 BlockBeats 뉴스, 어젯밤과 오늘 아침, 11월 21일 글로벌 리스크 시장에 블랙 프라이데이가 시작되었습니다. 미국 주식과 금속은 전반적으로 급락했습니다. S&P500(미국 큰 회사 500곳 지수)은 3.70% 하락한 6,910.39포인트로 7일 연속 하락했으며 200일 이동평균선 아래로 떨어졌습니다. 나스닥(미국 기술 회사들이 많은 주식시장) 종합지수는 5.28% 하락한 22,617.73포인트를 기록했고, 다우존스 지수도 하락했습니다. 48,147.33포인트로 1.93%. 주가가 폭락하면서 시장 패닉을 측정하는 VIX 지수는 지난해 관세 혼란 이후 VIX 지수 종가 중 가장 높은 35.89까지 치솟았다."},{"s":"연준의 금리 인상은 AI 퇴각에 반향을 일으키고 글로벌 자산 가격이 재조정됩니다","so":"第一财经","tm":"11/22 20:35","c":1,"r":"cn","u":"https://www.yicai.com/news/103449341.html","p":1795347352,"a":1795356489,"t":"美联储加息与AI退潮共振，全球资产定价再校准","su":"실리콘 밸리에서 런던, 서울, 도쿄에 이르기까지 글로벌 금융 시장은 일련의 격렬한 조정을 경험했습니다. 앤트로픽은 지난 주 나스닥(미국 기술 회사들이 많은 주식시장)에서 역사상 최대 규모의 기업공개(IPO)를 완료했지만 시장 심리를 무너뜨린 마지막 지푸라기가 되었습니다. 주식, 귀금속, 암호화폐 등이 거의 동시에 집중 매도로 어려움을 겪었습니다. 11월 20일 거래 마감 현재 다우존스 산업평균지수는 주당 8.02%, S&P500(미국 큰 회사 500곳 지수) 지수는 주당 8.61%, 나스닥 100 지수는 한 주 만에 10% 이상 하락해 최근 고점 대비 20% 하락했다. 세션 동안 대규모 기술주가 종합적으로 하락했습니다. VIX 패닉지수는 장중 한때 40을 넘어 2025년 4월 이후 최고치를 기록했다. 귀금속 측면에서는 금과 은 선물 가격도 급락했다."},{"s":"미국 증시의 붕괴 물결은 언제 끝날 것인가? 골드만삭스: 세 가지 바닥 신호 관찰 가능 | 글로벌 금융 | 글로벌","so":"UDN","tm":"11/22 19:47","c":1,"r":"tw","u":"https://udn.com/news/story/6811/9894867","p":1795344428,"a":1795351392,"t":"這波美股重挫何時休？ 高盛：可觀察三個觸底訊號| 全球財經| 全球","su":"뉴스를 들어보세요 0:00 / 0:00 미국 증시의 급격한 하락은 언제 끝날까요? 골드만삭스: 세 가지 바닥 신호가 관찰되었습니다. 글로벌 금융시장에 매도 압력이 가중됐다. 골드만삭스는 주식시장이 바닥을 쳤는지 이해하기 위해 관찰할 수 있는 세 가지 신호가 있다고 지적했습니다. 지난 금요일(20일) BMP파리바가 투자자들이 '패닉 매도' 모드에 돌입했다는 소식이 전해지면서 글로벌 증시는 유혈사태를 겪었다. 그러나 지난 목요일(19일) 골드만삭스가 발표한 보고서에는 관측 가능한 시장 바닥 신호 3가지가 나와 있다. 그 중 어느 하나라도 시장 회복에 도움이 될 것입니다. AI의 이익 전망에 대한 시장의 신뢰가 안정화되었는지 여부입니다. 인공지능(AI) 스타트업 앤쓰로픽(앤트로픽)과 오픈AI의 가격 전쟁이 서로에게 상처를 주고 있다. 앤트로픽은 지난 주에 기업공개(IPO)를 완료했습니다. (IPO)), 지난 19일 상장(주식시장에 처음 들어오는 것) 첫날 17% 급등했지만, 20일에는 급락해 발행가를 거의 밑도는 수준까지 떨어졌다. 이는 AI 투자를 부활시키는 데 실패했으며 지출 대비 수익에 대한 투자자의 높은 우려를 부각시켰습니다."},{"s":"GTA 6가 판매 기록을 경신하고 있습니다! ISA를 위해 S&P500 주식을 구매해야 합니까?","so":"Yahoo Finance UK","tm":"11/22 19:17","c":1,"r":"us","u":"https://uk.finance.yahoo.com/news/gta-6-breaking-sales-records-101729835.html","p":1795342649,"a":1795351380,"t":"GTA 6 is breaking sales records! Should I buy this S&P 500 stock for my ISA?","su":"Grand Theft Auto 6 제작사 뒤에 있는 S&P500(미국 큰 회사 500곳 지수) 회사가 게임에서 돈을 벌 것으로 예상됩니다."},{"s":"월스트리트저널: 민주당은 트럼프 수사에 집중할 계획, 백악관은 정치적 사기 비난하며 협조 거부","so":"鉅亨網","tm":"11/22 19:00","c":1,"r":"tw","u":"https://m.cnyes.com/news/id/6669857","p":1795341605,"a":1795351395,"t":"華爾街日報：民主黨擬定針對川普調查重點 白宮批政治騙局拒配合","su":"월스트리트저널(WSJ)에 따르면 미국 하원 감시위원장을 맡을 것으로 예상되는 로버트 가르시아 캘리포니아 민주당 의원은 최근 트럼프 전 대통령 가족과 정부 관료들에게 기록보존 통지서 12통을 보내 민주당이 내년 새 의회에서 소환권을 얻은 뒤 집중 조사에 나설 것이라고 경고했다. 가르시아는 \"이것은 시작에 불과하다\"고 공개적으로 선언했다. 민주당이 계획한 조사는 네 가지 주요 영역에 초점을 맞추고 있습니다. 1. 가족 사업 이익: 이 서한은 도널드 트럼프 주니어와 에릭 트럼프가 가족 암호화폐 회사인 월드 리버티 파이낸셜(World Liberty Financial)을 이익을 위해 이용하고 있다고 비난합니다. 이에 대해 회사 대변인은 이번 조사를 '근거 없는 마녀사냥'이라고 일축하며 회사가 모든 법률을 준수하고 있다고 강조했다. 이 밖에도 트럼프의 사위 재러드 쿠슈너가 부과한 높은 수수료와 킴벌리 길포일 전 대사의 수수료 징수 의혹도 사례금을 위장한 것이라는 의혹이 제기됐다."},{"s":"CITIC증권 : 2027년 미국 증시 AI 산업 체인은 연초 밸류에이션 압박, 연말 밸류에이션 회복, 연말 실적 차별화 등 단계적 특성을 보일 것으로 예상된다.","so":"Jiemian.com","tm":"11/22 18:56","c":1,"r":"cn","u":"https://www.jiemian.com/article/15359079.html","p":1795341375,"a":1795351382,"t":"中信证券：美股2027年AI产业链预计呈现年初估值承压、年中估值修复、年末表现分化的阶段性特征"},{"s":"AI가 주도하는 트럼프 강세장에 주식시장 붕괴가 임박한 걸까? 역사는 불쾌한 대답으로 가득 차 있습니다.","so":"The Globe and Mail","tm":"11/22 18:33","c":1,"r":"us","u":"https://www.theglobeandmail.com/investing/markets/markets-news/motley/8955033/is-a-stock-market-crash-imminent-for-the-ai-driven-trump-bull-market-history-weighs-in-with-an-unpleasant-answer/","p":1795340037,"a":1795351380,"t":"Is a Stock Market Crash Imminent for the AI-Driven Trump Bull Market? History Weighs In With an Unpleasant Answer.","su":"요점 - 도널드 트럼프 대통령 집권 후 다우존스 산업평균지수, S&P500(미국 큰 회사 500곳 지수), 나스닥(미국 기술 회사들이 많은 주식시장) 종합지수는 좋은 성적을 거두었지만 주식시장은 흔들리는 모습을 보이고 있습니다. - 인공 지능(AI)의 채택은 차트에서 벗어나 있지만 획기적인 기술은 성숙하는 데 오랜 시간이 걸리는 경우가 많습니다."},{"s":"[뉴욕채권-주간] 연준 긴축 증시가 대신 해주나…다가오는 '침묵 기간' |","so":"연합인포맥스","tm":"11/22 18:15","c":1,"r":"kr","u":"https://news.einfomax.co.kr/news/articleViewAmp.html?idxno=4445897","p":1795338910,"a":1795351379,"su":"[뉴욕채권(나라나 회사에 돈 빌려준 증서)-주간] 연준(미국의 중앙은행) 긴축 증시가 대신 해주나…다가오는 '침묵 기간' 증시 급락 속 '빅스텝' 사그라드는 듯…뉴욕 연은 총재 발언 주목 추수감사절로 거래일 짧아져…23~25일 사흘 연속 국채 입찰 (서울=연합인포맥스) 김성진 기자 = 이번 주(23~27일) 뉴욕 채권시장은 뉴욕증시의 반등 여부를 최대 화두로 삼을 것으로 전망된다. 미국 추수감사절 주간을 맞아 거래일은 1.5일 단축된다. 뉴욕증시 대표지수인 S&P 500은 지난주 마지막 거래일인 20일까지 7거래일 연속 밀렸다."},{"s":"구글, 월스트리트 주식 끌어내려","so":"AFP.com","tm":"11/22 16:13","c":1,"r":"world","u":"https://www.afp.com/pt/node/3849984","p":1795331625,"a":1795389890,"t":"Google drags down Wall Street stocks"},{"s":"미국 증시는 대규모 기업공개(IPO) 이후 급락했다. 역사적 현상이 또 반복되는 걸까?","so":"21财经","tm":"11/22 15:39","c":1,"r":"cn","u":"https://www.21jingji.com/article/20261122/herald/6b9fb1314f51f4741476f4d5ef6cb05b.html","p":1795329540,"a":1795351384,"t":"巨型IPO之后美股大跌，历史现象又一次复现？","su":"해설자 Du Hengfeng에 따르면 11월 19일 앤트로픽은 발행가 83달러로 나스닥에 상장되었습니다. 첫날 17.07% 상승률을 기록했고 935억 달러(과잉 할당 포함)를 모금했습니다. 사모를 포함해 총 자금조달 규모는 약 1,195억 달러에 달해 역사상 최대 규모의 기업공개(IPO)가 됐다. 그러나 종소리의 여운은 아직 사라지지 않았고 미국 증시는 하락세로 돌아섰습니다. 19일 미국 3대 주가지수는 모두 2% 이상 하락했습니다. 다음날 매도세(팔려는 힘)는 더욱 거세졌고, 나스닥은 하루 만에 5.28% 하락한 22,617.73포인트로 마감해 2026년 이후 상승세를 모두 청산했다. '공포지수' VIX는 한때 35를 넘기며 급등했다. 기술주, 특히 AI 하드웨어 산업체인이 가장 큰 타격을 입었다. 필라델피아 반도체(전자기기의 두뇌 부품) 지수는 20일 하루 만에 10.73% 하락했고, 30개 구성종목 모두 하락했다. 엔비디아는 7일 연속 하락세인 14.01% 하락했고, 이번 주 누적 하락폭은 22.92%로 2008년 10월 이후 최대 주간 하락폭이다. AMD, 마이크론, 브로드컴 등은 모두 12% 이상 하락했고, TSMC ADR은 9.48% 하락했다. 앤트로픽도 상장 둘째 날 8.5% 하락해 장중 발행가 83달러에 가까웠다."},{"s":"미국 주식에 대한 팁 | 빅스(VIX)가 폭발한다! 공황 매도가 시장을 휩쓸고 있는데, 나스닥은 '곰의 문 두드리는 소리'를 견딜 수 있을까?","so":"第一财经","tm":"11/22 15:27","c":1,"r":"cn","u":"https://www.yicai.com/news/103449207.html","p":1795328875,"a":1795334496,"t":"美股点金丨VIX爆表！恐慌抛售席卷市场，纳指能否顶住“熊敲门”","su":"이번주 미국 증시는 크게 하락했다. 엔비디아는 강력한 수익을 발표했고 인공지능 스타트업인 앤트로픽은 역사상 최대 규모의 기업공개(IPO)를 기록했지만 여전히 연준의 매파적인 태도로 인한 우려를 상쇄하지 못했습니다. S&P500(미국 큰 회사 500곳 지수)과 다우존스 산업평균지수는 조정 국면에 진입했고, 나스닥은 기술적 약세장에 접근하고 있었습니다. 시장 변동성을 측정하는 패닉지수 VIX는 한때 40을 돌파하기도 했다. 투자자들은 반도체 회사와 소프트웨어 인프라 주식의 급격한 매도 속에서 미국 부채로 피난처를 찾았습니다. 다음 주에 발표되는 개인소비지출(PCE) 데이터는 지난 주의 10월 인플레이션(물건값이 계속 오르는 것) 보고서가 예상보다 높았던 이후 연준의 통화 정책 방향을 더욱 명확하게 반영할 수 있습니다. 단기 급락 이후 시장 심리가 회복되기까지는 시간이 걸릴 수 있다."},{"s":"미국 주식이 폭락하면 연준이 퇴임하게 될까요? 뱅크오브아메리카의 Hartnett는 연준의 금리 인상 중단 결정의 핵심을 밝힙니다.","so":"工商時報","tm":"11/22 15:14","c":1,"r":"tw","u":"https://www.ctee.com.tw/news/20261122700452-430702","p":1795328040,"a":1795334501,"t":"美股崩跌逼宮Fed？美銀Hartnett揭聯準會升息喊停關鍵- 國際","su":"미국 주식의 급격한 조정은 연준이 계속해서 금리(돈을 빌릴 때 내는 이자 비율)를 인상하는 것을 막는 가장 빠른 방법이 될 수 있습니다! 뱅크오브아메리카의 수석 투자 전략가인 Michael Hartnett는 최신 \"Flow Show\" 보고서에서 S&P500(미국 큰 회사 500곳 지수)이 2026년 이후 모든 상승폭을 포기하고 6,845포인트로 떨어지면 연준이 긴축 정책을 재평가하게 될 수 있다고 지적했습니다. S&P는 지난 금요일 6,910포인트로 마감했는데, 이는 이 주요 bp에서 불과 65포인트 떨어져 있습니다."},{"s":"6조 달러의 시가총액이 사라졌습니다! 트럼프 \"미국 증시 100% 하락 책임은 민주당에 있다\"","so":"财联社","tm":"11/22 14:12","c":1,"r":"cn","u":"https://www.cls.cn/detail/2541103","p":1795324320,"a":1795392888,"t":"6万亿美元市值灰飞烟灭！特朗普发声：美股下跌100%怪民主党","su":"① 트럼프 미국 대통령은 최근 미국 증시 하락세를 민주당의 중간선거 승리 탓으로 돌렸다. ② 그는 11월 3일 민주당의 승리 이후 시장이 6조 달러 이상 하락했다고 지적했다. ③ 베센트 미국 재무장관은 미국 증시의 하락이 초지능(SI)에 대한 민주당의 불안한 입장과 매파적(금리를 올리자는 쪽)인 연준을 포함한 \"요인들의 조합\"일 수 있다고 말했다. 차이롄서, 11월 23일(편집자 Bian Chun) 트럼프 미국 대통령은 6조 달러에 달하는 미국 증시 가치 손실을 민주당의 중간선거 승리 탓으로 돌렸다. 이번 선거 결과로 당은 하원과 상원을 다시 장악하게 됐다. 트럼프 대통령은 일요일 트루스소셜(Truth Social)에 “11월 3일 민주당의 다소 기이한 승리 이후 시장은 6조 달러 이상 하락했다”고 썼다. \"나스닥(미국 기술 회사들이 많은 주식시장)만 해도 20% 하락했습니다. 민주당이 반성장, 보복 정책 등을 추구하기 때문에 '나쁘기' 때문에 이는 100%입니다.\" \"빨리 변화하지 않으면 상황은 더욱 악화될 뿐입니다. 하지만 두려워하지 마세요. 중국는 곧 다시 강해질 것입니다. 좋은 일이 많이 일어나고 있습니다.\" 트럼프는 말했다."},{"s":"2018년 대본의 반복인가요? 미 증시는 투자자들이 연준의 긴축 정책에 의문을 제기하면서 급락했습니다.","so":"鉅亨網","tm":"11/22 14:00","c":1,"r":"tw","u":"https://news.cnyes.com/news/id/6669834","p":1795323603,"a":1795334502,"t":"2018年劇本重演？美股暴跌 投資人質疑聯準會緊縮政策","su":"미국 증시는 6일 연속 하락했고, S&P500(미국 큰 회사 500곳 지수) 지수는 200일선 아래로 떨어졌습니다. 골드만삭스는 매도 압력이 '포괄적 청산'이라며 금융 여건이 급속히 긴축되고 있다고 말했다.\n연준 관계자들은 매파적인 신호를 보냈고 월러는 금리를 0.5%포인트(퍼센트끼리 뺀 차이) 인상할 가능성을 언급했으며 골드만삭스는 여전히 12월에 0.25% 포인트 금리를 인상하고 2027년 3월에 또 한 번 금리를 인상할 것으로 예상하고 있습니다.\n금은 온스당 미화 3,600달러 아래로 떨어졌고, 구리 가격은 하루 만에 약 5% 하락했습니다. 골드만삭스는 금 주식의 동일한 하락은 유동성 위축을 의미하며 채권 시장은 단기 국채에 편향되어 있다고 말했습니다."},{"s":"나스닥은 하루 23시간 거래되는데, A주와 H주는 어떤 영향을 미칠까? 투자자들은 이러한 점을 주의해야 합니다.","so":"21财经","tm":"11/22 13:48","c":1,"r":"cn","u":"https://www.21jingji.com/article/20261122/herald/41e463756f48643ee80e4390600451a0.html","p":1795322880,"a":1795351387,"t":"纳斯达克一天交易23小时，A股H股影响几何？这几点投资者留意","su":"21세기 비즈니스 헤럴드 기자 최원징(Cui Wenjing) 나스닥(미국 기술 회사들이 많은 주식시장)은 12월 6일부터 매일 거래 시간을 6.5시간에서 23시간으로 늘려 거의 '전천후 거래'를 달성할 예정이다. 그때쯤이면 A주(중국 본토 주식시장 주식)와 H주가 거래될 때 미국 주식도 동시에 거래될 것입니다. 선완홍위안증권의 수석시장전문가 구이하오밍은 거래시간 연장은 “시장 활성화와 시장 효율성 제고를 고려한 것이 아니라 대부분 글로벌 경쟁을 고려한 것”이라고 분석했다. 시행 이후의 영향은 아직 두고 봐야 한다고 판단했지만, 이제 한 가지 영향을 예상해볼 수 있다. A주와 H주의 장중 등락폭이 커질 가능성이 높다는 점이다. Gui Haoming은 세 가지 측면에서 관찰할 것을 제안했습니다. ① A주는 원래 시장 개장 전 밤새 미국 주식의 추세에 대해서만 배웠으며, 그 상승 및 하락은 향후 A주에 실시간 영향을 미칠 것입니다. ② A주의 국제화 정도는 그다지 높지 않으며, 그 영향은 '심리적 수준'에 가깝습니다. ③H주 자금은 전 세계적으로 배분되며, 미국 주식의 운용이 이에 직접적인 영향을 미칩니다."},{"s":"미국 부채의 다른 측면은 “더 이상 호의적이지 않다”는 것입니다. 외국인 투자자들이 미국 주식을 사상 최고치에 매수하고 있습니다!","so":"财联社","tm":"11/22 13:37","c":1,"r":"cn","u":"https://www.cls.cn/detail/2493797","p":1795322225,"a":1795351388,"t":"美债“不香了”的另一面：外资创纪录爆买美股！","su":"① 7월까지 12개월 동안 외국인 투자자의 미국 주식 및 투자 펀드 주식 순매수(산 돈이 판 돈보다 많은 것)액은 9,420억 달러로 사상 최대치를 기록했다. ② 이는 해외자금이 미국 채권(나라나 회사에 돈 빌려준 증서)시장에서 미국 증시으로 이동하는 추세를 어느 정도 반영한다. 차이롄서, 9월 28일(Editor Xiaoxiang) 지난 금요일 발표된 최신 데이터에 따르면 7월까지 12개월 동안 외국인 투자자의 미국 주식 및 투자 펀드 주식 순매수액은 9,420억 달러로 사상 최고치를 기록했습니다. 이는 해외자금이 미국 채권시장에서 미국 증시으로 이동하는 추세를 어느 정도 반영한다. 1985년 이후 미국 재무부 데이터에 따르면 이러한 유입은 12개월 연속 새로운 기록을 세웠습니다."},{"s":"[모닝포스트] 미국 나스닥 지수가 500포인트 넘게 하락했고, 반도체와 스토리지주도 전반적으로 급락했다. 젠슨 황은 \"AI 시장 충격\"에 대해 이야기했습니다. 국제유가가 급등했다. Shenghong Technology, OmniVision Group 등이 자사주 매입 예정","so":"财联社","tm":"11/22 13:35","c":1,"r":"cn","u":"https://www.cls.cn/detail/2507382","p":1795322144,"a":1795351390,"t":"【早报】美股纳指大跌超500点，半导体、存储股全线跳水；黄仁勋谈“AI市场震荡”；国际油价大涨；胜宏科技、豪威集团等计划回购股份"},{"s":"미국 증시가 무너지고 있나요? AI 산업은 버블 붕괴인가, 가격 재평가인가?","so":"鉅亨網","tm":"11/22 13:10","c":1,"r":"tw","u":"https://news.cnyes.com/news/id/6669832","p":1795320609,"a":1795334504,"t":"美股慘崩 AI產業是泡沫破裂還是價格重估？","su":"나스닥은 이번 주에 10% 하락했고 고점 대비 약 18% 하락했습니다. S&P500(미국 큰 회사 500곳 지수)과 다우존스 지수도 기술적 조정 범위에 진입했습니다.\n엔비디아는 일주일 만에 약 23% 하락했으며 시가총액(회사 전체 몸값)은 2조 7천억 달러 증발했습니다. 코어위브, AMD, 알파벳과 같은 AI 공급망은 동시에 압박을 받았습니다.\n시장에서는 AI의 높은 자본지출이 수익으로 전환되기 어렵고, 금리와 자금조달 비용의 상승으로 가치평가 재평가가 심화될 것이라고 우려하고 있다."},{"s":"월요일에 대만 주식이 하락할 때까지 기다리시겠습니까? 골드만삭스 패닉 지수가 9포인트까지 치솟으며 미국 증시가 2조6000억대만달러를 더 매도할 수 있다고 경고했다.","so":"TVBS新聞網","tm":"11/22 12:52","c":1,"r":"tw","u":"https://news.tvbs.com.tw/money/4054251","p":1795319520,"a":1795320021,"t":"台股週一挫咧等？高盛恐慌指數飆至9分 警告美股恐再倒貨2.6兆","su":"미국 기술주들이 블랙프라이데이를 맞이했습니다. 골드만삭스 트레이딩부는 골드만삭스가 내부 집계한 '패닉지수'가 10점 만점에 9포인트까지 급등해 최고 경고 수준에 접근했다고 지적하며 다음 주 미국 증시가 대규모 매도세(팔려는 힘)를 이어갈 수 있음을 시사했다. 미국 증시 기술·반도체(전자기기의 두뇌 부품) 그룹이 전반적으로 급락하면서 미국 증시와 밀접한 연관이 있는 대만 증시는 월요일(23일) 개장하면 손실보전 압박에서 벗어나지 못할 수도 있다."},{"s":"프리토크 뉴스》우크라이나군이 러시아 드론 년 역시 침체되고 있으며 월스트리트는 이미 2027년에 대한 예측을 내놓고 있습니다. 분석가들은 미국이 앞으로 확실한 상승세를 보일 것으로 보고 있습니다."},{"s":"연준, 연말 금리 인상, AI 주식 운용 새 전략 | 잡지","so":"UDN","tm":"11/22 08:41","c":1,"r":"tw","u":"https://udn.com/news/story/6848/9889599?from=udn-relatednews_ch1015","p":1795304469,"a":1795307321,"t":"Fed年底升息AI股操作新策略| 雜誌","su":"10월 미국 소비자물가(가게에서 사는 물건값 수준)지수(CPI)는 전월 대비 0.4% 상승했고, 근원 CPI도 전월 대비 0.3% 상승해 시장 예상치(0.3%, 0.2%)를 크게 웃돌며 미국 금융시장에 통화정책 전환 압력이 가해졌다. 케빈 워시(Kevin Wash. 워시) 연방준비제도(연준) 의장)은 인플레이션(물건값이 계속 오르는 것)에 대한 지속적인 경계심을 표명했고, 연준 관계자들도 금리 인상 신호를 잇따라 내놨다. 시장에서는 연준이 12월에 금리를 최소 1포인트 인상할 것으로 예상하고 있다. 미국과 대만의 금리 격차가 계속 벌어지고 있다. 대만 주식과 신대만 달러 역시 외국 자본이 과도하게 매도한 후 송금 압력을 받게 될 것입니다. 미국 금리 인상 전 대만 주식 운용 전략에 대해 국내 증권사들은 \"종목 선정이 성장 추구에서 이익의 질 중심으로 전환되어야 한다\"고 제안한다."},{"s":"뉴욕증시, AI 투자 불안에 급락…월가, 이번 주 최대 806억달러 추가 매도 경고,","so":"아시아투데이","tm":"11/22 08:32","c":1,"r":"kr","u":"https://www.asiatoday.co.kr/kn/view.php?key=20261122010008242","p":1795303948,"a":1795307316,"su":"【기사 요약】▲ 앤트로픽의 완전희석 기업가치는 상장(주식시장에 처음 들어오는 것) 이틀째 종가 기준 약 1조6000억달러로 평가됐다.▲ 기업들은 2030년까지 AI 인프라에 약 5조달러를 투자할 계획이지만, 월가는 수익성에 의문을 제기하고 있다.▲ 앤트로픽은 12월 15일 약 3억주의 추가 거래 가.."},{"s":"미국 주식 마감: 3개 주요 지수 모두 상승, 나스닥은 2% 이상 상승, 미국과 이란 간의 긴장 완화로 위험 선호도가 높아졌습니다.","so":"财联社","tm":"11/22 07:42","c":1,"r":"cn","u":"https://www.cls.cn/detail/2444660","p":1795300958,"a":1795319993,"t":"美股收盘：三大指数全线走高纳指涨逾2% 美伊局势缓和提振风险偏好","su":"① 나스닥 골든드래곤차이나지수는 0.75% 상승한 6647.91포인트로 마감했다. ② 보잉 737 맥스 7(보잉 737 Max 7)이 수년간의 지연 끝에 마침내 FAA 인증을 받았습니다. ③ 아마존의 주가는 4.58% 상승했고, 시가총액(회사 전체 몸값)은 처음으로 3조 달러를 넘어섰습니다. 차이롄서, 8월 4일(편집자 Niu Zhanlin) 월요일 동부 표준시 기준으로 미국 3대 주가지수는 모두 상승세(오르는 흐름)로 마감했으며 다우지수는 새로운 최고치를 경신했습니다. 미국과 이란 간 긴장이 완화되는 조짐을 보이면서 국제유가와 미국 국채수익률이 하락해 시장 심리가 좋아졌습니다. 트럼프 미국 대통령은 29일(현지시간) 미국과 이란이 호르무즈 해협 재개를 논의하기 위한 회담을 가질 것이라고 밝혔다. 그러나 이란은 관련 회담의 존재를 부인했다."},{"s":"미국 주식의 3분기 실적 시즌이 다음 주에 시작됩니다! Deutsche Bank: 세 가지 핵심 원동력이 놀라움을 가져올 수 있습니다","so":"财联社","tm":"11/22 07:26","c":1,"r":"cn","u":"https://www.cls.cn/detail/2501252","p":1795300003,"a":1795356492,"t":" 이를 노출하는지 알아보십시오."},{"s":"미국 소비자들은 연휴 시즌으로 접어드는 인플레이션을 견디고 있습니다.","so":"Bloomberg.com","tm":"11/22 06:00","c":1,"r":"us","u":"https://www.bloomberg.com/news/articles/2026-11-21/us-consumers-are-holding-up-against-inflation-going-into-holiday-season","p":1795294800,"a":1795319984,"t":"US Consumers Are Holding Up Against Inflation Going Into Holiday Season"},{"s":"앤트로픽이 나스닥 상장 17% 높은 시가총액 280조엔 NY다우는 5개월 만에 5만 달러 균열","so":"テレ東BIZ","tm":"11/22 04:42","c":1,"r":"jp","u":"https://txbiz.tv-tokyo.co.jp/hiru/news/post_352898","p":1795290131,"a":1795351396,"t":"アンソロピックがナスダック上場 17％高 時価総額280兆円 NYダウは5カ月ぶり5万ドル割れ","su":"미국의 AI 개발 기업 앤트로픽이 19일 나스닥(미국 기술 회사들이 많은 주식시장) 시장에 상장했다. 첫날은 기업공개(IPO) = 신규 주식공개 공개가격을 약 17% 상회 거래를 마쳤습니다. 첫 가격은 공개 가격을 34% 웃도는 111달러 50센트, 종가는 17% 상승한 97달러 17센트였다. 종가를 기준으로 한 시가총액(회사 전체 몸값)은 약 1조7600억 달러 = 280조엔에 이릅니다. 다만, AI 투자에 대한 우려는 뿌리 깊고, 19일 뉴욕 주식시장의 다우 평균은 전날보다 1101달러 내린 4만9097달러와 약 5개월 만에 5만달러의 고비를 끼어들어 거래를 마쳤습니다."},{"s":"금은 연속적인 손실을 입었고 $3,500 선에 접근하고 있습니다! 월스트리트는 과매도 영역에 빠졌다고 말했다.","so":"财联社","tm":"11/22 04:14","c":1,"r":"cn","u":"https://www.cls.cn/detail/2540882","p":1795288440,"a":1795319997,"t":"黄金连连溃败，逼近3500美元关口！华尔街齐呼：已跌入超卖区域","su":"① 지난주 국제 금값은 미화 3,800달러, 3,700달러, 3,600달러 선이 잇달아 하락하며 심리적으로 중요한 3,500달러 선에 접근하는 등 급락세를 겪었다. 2월스트리트 분석가들은 금이 주요 지지선 아래로 떨어질 가능성을 배제하지 않았지만, 특히 금이 과매도 영역에 진입했기 때문에 이번 매도 라운드가 매수 기회라고 믿는 많은 견해가 있습니다. 차이롄서, 11월 22일(편찬춘 편집장) 지난주 국제 금값은 3,800달러, 3,700달러, 3,600달러가 차례로 하락하며 심리적으로 중요한 3,500달러 선에 접근하는 등 큰 폭의 하락세를 보였다. 지난 금요일 미국 금 선물(미래 값을 미리 정해 사고파는 거래)은 4% 하락한 온스당 미화 3,539달러에 마감했습니다. 현물 금은 2.41% 하락한 온스당 미화 3,538.11달러로 장을 마감했고, 장중 최저치인 미화 3,502달러를 기록했다. 주간 하락률은 8.9%로 3월 20일 주 이후 최대 주간 하락폭이다."},{"s":"미국 증시는 필라델피아 반도체 지수가 10% 이상 하락하고, 나스닥도 올해 공백기를 기록하는 등 폭등했다. 다음주 이 데이터는 투자자들의 안정에 대한 희망이 되었습니다 - Daily","so":"工商時報","tm":"11/22 04:00","c":1,"r":"tw","u":"https://www.ctee.com.tw/news/20261122700029-439901","p":1795287600,"a":1795320037,"t":"美股大爆破費半瀉逾10％、那指今年白做工下周這數據成投資人穩盤希望- 日報","su":"AI 투자에 대한 우려가 20일에도 S&P 지수와 다우존스 지수가 모두 조정권에 들어가는 등 un은 2026년 금융 거리 포럼 연차 회의 개막식에서 모든 금융 활동이 법에 따라 감독을 받게 될 것이라고 밝혔습니다. Ding Xiangqun은 또한 금융 부문의 기관 개방을 위한 다양한 조치를 확고히 추진하고 중국 내 사업 발전을 위해 더 많은 외자 기관과 장기 자본을 지원할 것이라고 말했습니다."},{"s":"[모닝포스트] 유가는 급등했고, 금과 은은 급락했다. 미국 재고 저장 부문은 전체적으로 하락했습니다. 오늘 상장된 Suiyuan Technology; 오라클, 기대 이상의 성능","so":"财联社","tm":"11/21 23:10","c":1,"r":"cn","u":"https://www.cls.cn/detail/2480154","p":1795270231,"a":1795320006,"t":"【早报】油价大涨，黄金、白银大跌；美股存储板块，集体回落；燧原科技，今日上市；甲骨文，业绩超预期","su":"① A주(중국 본토 주식시장 주식)와 관련하여 중국 증권감독관리위원회는 성명을 발표했습니다. ② 상무부: 중국과 미국은 300억 달러 규모의 상호 세금 감면 기본 협약을 협상 중입니다. ③ 미국 증시는 하락 마감했고, 저장 부문과 구리 개념 주식은 하락했습니다. ④ 이란이 노출되었습니다: 외국 에너지 운송 선박에 대한 10% 운임 할증료를 중단했습니다. ⑤ Suiyuan Technology는 오늘 상장(주식시장에 처음 들어오는 것)했습니다. 매크로뉴스 1. 지난 10일 상무부 정례 기자회견에서 황링 상무부 대변인은 관련 질문에 대해 “중미 양국 경제무역팀은 베이징 회담에서 양국 정상이 합의한 합의를 성실히 이행했으며 300억 달러 규모의 상호 세금 감면 기본 협정에 대해 협상 중이며 조기 이행을 위해 노력하고 있다”고 밝혔다. 2. 국가발전개혁위원회와 국가시장감독관리총국은 중요 공산품의 저가 및 무질서 경쟁 원가계산과 관련된 사항에 관한 통지를 발표했다. 이는 저가 및 무질서 경쟁 문제가 두드러지는 중요 공산품 생산 분야에 초점을 맞추고, 저가 및 무질서 경쟁이 의심되는 경영자에게 상기시키고 경고하며, 필요한 경우 경영자의 관련 비용을 계산하기 위해 원가 조사를 조직한다."},{"s":"미국 10월 비농업 고용 데이터가 예상을 뛰어넘었습니다! AI 컴퓨팅 파워 확장 사이클은 계속될 수 있을까? 전경의 기하학은 무엇입니까? 여러 요인의 교란 속에서 금 가격 추세를 어떻게 추론할 수 있습니까?丨20261109월스트리트에서 루자쭈이까지","so":"第一财经","tm":"11/21 20:42","c":1,"r":"cn","u":"https://www.yicai.com/video/103431959.html","p":1795261370,"a":1795320011,"t":"美国10月非农就业数据大超预期！AI算力扩张周期能否延续？前景几何？多重因素扰动下金价趋势如何推演？丨20261109从华尔街到陆家嘴"},{"s":"미국 증시 전망 : 테크놀로지 주식의 밸류에이션 조정 진행 반전 여지 확산","so":"株探","tm":"11/21 14:29","c":1,"r":"jp","u":"https://kabutan.jp/news/marketnews/?&b=n202611210229","p":1795238958,"a":1795320040,"t":"米国株式市場見通し：テクノロジー株のバリュエーション調整進み反転余地広がる","su":"NY다우는 2영업일 만에 2000달러 초과 하락해 나스닥(미국 기술 회사들이 많은 주식시장)도 주말 하락으로 지난해 말 수준을 인터럽트해 연초래 인상(일시적으로 18.8% 상승)을 폐쇄하고 있다. 테크놀로지주의 PER(주가가 이익의 몇 배인지)은 20년 3월 이후 최저 수준에 이르렀다는 견해도 있습니다."}]},{"name":"🧬 나스닥 바이오","note":"보유: TIGER 미국나스닥바이오","breaking":false,"items":[{"s":"혁신적인 약물 구현을 촉진하기 위해 첫 번째 '의학 및 교육 대면' 스테이션이 광저우에서 개최되었습니다.","so":"中国新闻网","tm":"11/21 21:19","c":2,"r":"cn","u":"https://www.chinanews.com.cn/sh/2026/11-21/10735862.shtml","p":1795263543,"a":1795265090,"t":"“医药保学面对面”首站在穗举办 推动创新药落地","su":"혁신적인 약물의 구현을 촉진하기 위해 첫 번째 '학교 보호를 위한 대면 의학' 행사가 광저우에서 개최되었습니다. 중국신보사, 광저우, 11월 21일(채민제 기자) 21일 광저우에서 2026년 의료보험약품 카탈로그 신품종 대상 '학교보호를 위한 대면의학' 행사(제1차)가 열렸다. 이번 행사에서 발표된 신호는 더욱 명확합니다. 국민의료보험청은 혁신적인 의약품 접근의 초점을 \"카탈로그 입력\"에서 \"병원 입력, 처방전 입력, 강의실 입력\"으로 확대하여 신약이 환자의 실제 요구에 더 빨리 혜택을 줄 수 있도록 하고 있습니다. 혁신적인 의약품의 경우 카탈로그에 포함되는 것은 단지 \"임신 증명서\"일 뿐입니다. 실제 접근성은 해당 약물이 임상(새 약을 사람에게 시험하는 것)적으로 알려져 있는지, 사용할 수 있는지, 환자가 찾을 수 있는지에 따라 달라집니다. 국민의료보험국 약품서비스관리부 황신위 국장은 2026년 의료보험 약품 목록에 신품종과 관련 정책이 추가될 것이라고 소개했다. 2026년판 의료보험 약품 목록에는 총 3,331종의 약품이 있는데, 그중 신규 약품이 107개이고 이전된 약품이 34개이다. 신약 중 103개는 5년 이내에 새로 출시된 신약이고, 51개는 카테고리 1 신약으로 모두 새로운 최고치입니다. 60개 신약에는 화학약품, 36개 생물의약품, 11개 중국전통특허의약품이 포함된다. 신약 중 종양분야는 29개, 만성질환은 21개, 희귀질환은 18개다."},{"s":"강력한 위험 회피, 신흥 생명공학 및 구리 주식 상승","so":"中時新聞網","tm":"11/21 05:10","c":2,"r":"tw","u":"https://www.chinatimes.com/newspapers/20261121000274-260206","p":1795205400,"a":1795215144,"t":"避險情緒濃 興櫃生技、銅板股崛起","su":"대만 증시 폭락이 계속되는 가운데 가치주(제값보다 싸 보이는 주식)들이 공매도(주식을 빌려서 먼저 파는 것)자들의 피바다를 겪고 있다. 시장펀드는 보수적으로 변했고, 신흥시장에서는 생명공학과 저가주가 추세를 거스르고 있다. 이번 주 주간 상승률 상위 10개 기업의 통계에 따르면, 생명공학 주식은 단숨에 7계단 하락했습니다. 시지바이오메디칼(7595)이 주간 15.3% 상승하며 우승을 차지했다. 공황상태의 매도 압력으로 인해 전자는"},{"s":"큐리언트 아드릭세티닙, 급성 골수성 백혈병 1차 치료로 임상 확대… FDA 승인 - 머니투데이","so":"머니투데이","tm":"11/23 08:50","c":1,"r":"kr","u":"https://www.mt.co.kr/index.php/stock/2026/11/23/2026112308460781755","p":1795391403,"a":1795392914,"su":"혁신신약(세상에 처음 나온 새로운 약) 개발기업 큐리언트는 미국 MD앤더슨 암센터가 주관하는 급성 골수성 백혈병(AML) 임상의 임상시험(새 약을 사람에게 시험하는 것)계획 변경이 미국 식품의약국(FDA)으로부터 승인됐다고 23일 밝혔다. 앞선 용량증가 단계에서는 베네토클락스를 포함한 표준 치료에 실패한 R/R AML 환자를 대상으로 Ven/Aza에 아드릭세티닙을 더한 3중 병용요법을 평가했으며, 연구진은 Ven/Aza와 병용할 때 아드릭세티닙의 임상 2상 권장용량을 120mg(1주 투여·1주 휴약)으로 결정했다."},{"s":"주가 방어 위해 생명공학업계, 자사주 희생 - Daily News","so":"工商時報","tm":"11/23 04:00","c":1,"r":"tw","u":"https://www.ctee.com.tw/news/20261123700180-439901","p":1795374000,"a":1795389899,"t":"捍衛股價生技業祭出庫藏股- 日報","su":"3분기부터 자사주(회사가 가진 자기 회사 주식)를 도입한 바이오기업들이 주가를 방어하는 모습을 보였다. 잇따라 자사주를 공모하거나 대주주들이 적극적으로 지분을 늘리고, 경영진이 지분 보유 락업 기간을 연장하는 등의 조치를 취하고 있다. 이로 인해 시장 보호의 물결이 시작되었습니다! 3분기 이후 Kangpei*, Handa, Quanyu-KY, Changjia 등 8개 회사가 자사주를 공모했으며, 총 계획 자사주는 12,814주, 최대 자사주 매입(회사가 자기 주식을 다시 사는 것) 규모는 약 11억 7천만 위안입니다. 또 라멕스 회장은 지분을 늘리기 위해 약 820만 위안을 투자한 한강KY..."},{"s":"16개 바이오기업 대주주, 2개월 연속 자사주 매입 - 매일경제","so":"工商時報","tm":"11/23 04:00","c":1,"r":"tw","u":"https://www.ctee.com.tw/news/20261123700183-439901","p":1795374000,"a":1795389900,"t":"16家生技公司大股東連兩月買進自家股票- 日報","su":"최근 생명공학주 하락세가 심화되고 있으며, 대주주들은 시장 수호에 만만치 않습니다! 9월과 10월 거래통계에 따르면 생명공학기업 주주는 총 16명이다. 청예메디칼의 리디아잉 회장이 누적 1,208주를 매입해 1위에 올랐고, 우딩의 대주주인 산양공업이 766주를 매입해 뒤를 이었다. 이 밖에도 린옌성 공동회장과 린더젠 총지배인은 총 544장의 티켓을 추가했고, 바오타이 투자회사와 송호린 회장 등 3명이 총 166장의 티켓을 구매해 향후 운영에 대한 낙관적인 입장을 내비쳤다."},{"s":"보고서: 희민보험 시장은 규모 확대에서 구조 조정으로 전환했으며, 혁신적인 약품 보호 구현은 여전히 청구 막힘을 해소해야 합니다.","so":"ThePaper.cn","tm":"11/22 19:31","c":1,"r":"cn","u":"https://www.thepaper.cn/newsDetail_forward_34534647","p":1795343515,"a":1795351405,"t":"报告：惠民保市场由规模扩张转向结构调整，创新药保障落地仍需打通理赔堵点","su":"희민바오 시장은 초기 급격한 성장을 경험한 후 주가조정 단계에 진입하고 있다. 11월 21일, 푸단대학교 경제대학 부학장이자 위험 관리 및 보험학과장인 Xu Xian 교수팀이 '2026년 도시 맞춤형 상업 의료'를 발표했습니다."},{"s":"생명공학 개척자, 상장 시작을 위해 영국 자본 이득세 감면 요구","so":"Financial Times","tm":"11/22 14:00","c":1,"r":"world","u":"https://www.ft.com/content/01e128fd-58b4-44e9-8c31-c9d0a909b9b7?syn-25a6b1a6=1","p":1795323606,"a":1795334526,"t":"Biotech pioneer calls for UK capital gains tax cut to kick-start listings"},{"s":"야오화제약의 신약 매출실적 - 데일리","so":"工商時報","tm":"11/22 04:00","c":1,"r":"tw","u":"https://www.ctee.com.tw/news/20261122700175-439903","p":1795287600,"a":1795320052,"t":"藥華藥新藥銷售奏捷- 日報","su":"Yaohua Pharmaceutical(6446)은 핵심 신약인 Ropeg의 글로벌 매출의 지속적인 성장으로 이익을 얻었습니다. 첫 3분기 동안 NT$18.43의 탁월한 세후 주당순이익(주식 한 주가 번 돈)을 달성했습니다. 다만, 시장 하락세로 인해 주가는 하향조정됐다. 지난 5일 동안 20.3% 하락해 20일 NT$1,100에 마감했다. 기술적 그림에서는 숏포지션을 보이고 있지만, 주요 기관투자가 3사가 동시에 2일 이상 매수세(사려는 힘)를 보이고 있어 시장전망에 유리하다. ":1795161405,"a":1795175793,"t":"津药药业：倍他米松原料药取得FDA DMF FA Letter","su":"제일재경 2026-11-20 15:55:30 편집자: Zhang Xiao Jinyao Pharmaceutical은 최근 미국 식품의약국(\"FDA\")이 발행한 DMF First Adequate Letter(\"DMF FA Letter\")를 받았다고 발표했습니다. 베타메타손은 저레닌 및 저알도스테론 증후군과 자율신경병증으로 인한 체위성 저혈압, 알레르기성 및 자가면역 염증성 질환에 적합합니다. 현재는 주로 활동성 류마티스, 류마티스 관절염, 홍반성 루푸스, 중증 기관지 천식, 중증 피부염, 급성 백혈병 등에 사용됩니다. 또한 특정 감염의 종합 치료에도 사용됩니다."},{"s":"리제네론, 앨라일람 'C5 siRNA' gMG \"FDA 승인\"","so":"바이오스펙테이터","tm":"11/20 15:50","c":1,"r":"kr","u":"https://www.biospectator.com/news/view/30475","p":1795157400,"a":1795158234,"su":"리제네론 파마슈티컬(Regeneron Pharmaceuticals)의 C5 siRNA ‘셈디시란(cemdisiran)’이 중증근무력증(gMG) 치료제로 미국에서 승인받았다. 이번 승인은 gMG의 약 85%를 차지하는"},{"s":"인누오제약 GLP-1, 아직도 해외에서 잘 팔릴 수 있을까?","so":"Jiemian.com","tm":"11/20 14:06","c":1,"r":"cn","u":"https://www.jiemian.com/article/15354220.html","p":1795151201,"a":1795158235,"t":"银诺医药的GLP-1能还海外大卖吗？","su":"지몐 뉴스 기자 | Jiemian 뉴스 편집자 | 시에신(Xie Xin) 국산 글루카곤유사펩타이드-1(GLP-1) 수용체 작용제 이수파글루타이드α 주사제가 해외 출시됐다. 인누오제약은 자회사 홍콩인누오(Hong Kong Yinnuo)가 글로벌 제약그룹 아르세라 라이프사이언스(Arcera Life Sciences)의 회원사인 아르세라 라이프사이언스(Arcera Life Sciences LTD)와 라이선스 계약을 체결해 핵심 제품인 에프수바글루타이드 알파(상품명 '에프수바글루타이드 알파')에 대한 아프리카, 라틴 아메리카, 중동, 동유럽 여러 국가에서 인체 치료 목적으로 독점 개발 및 상업화 권리를 부여한다고 밝혔다. 최초 라이센스 기간은 15년입니다."},{"s":"Xingrui Pharmaceuticals는 화이자와 최대 23억 달러의 마일스톤 지급액으로 독점 라이센스 계약을 체결했습니다. 홍콩 혁신신약 ETF Boshi(520690)의 중장기 배분가치가 상당하다.","so":"Jiemian.com","tm":"11/20 12:29","c":1,"r":"cn","u":"https://www.jiemian.com/article/15354120.html","p":1795145340,"a":1795158236,"t":"星锐医药与辉瑞达成独家许可协议，里程碑付款最高达23亿美元，港股创新药ETF博时(520690)中长期配置价值显著","su":"홍콩 혁신 약물 ETF(여러 주식을 묶어 파는 상품) Boshi(520690)는 항셍 Hong Kong Stock Connect Innovative Drug Select Index를 추적합니다. Xingrui Pharmaceuticals와 화이자는 상당한 중장기 할당 가치를 지닌 최대 23억 달러의 협력에 도달했습니다."},{"s":"혁신신약 연말고사: '신념의 자리'부터 '성과의 자리'까지, 2027년 답안지는 누가 내놓을 수 있을까?","so":"36Kr","tm":"11/20 12:05","c":1,"r":"cn","u":"http://www.36kr.com/p/4077498233362304","p":1795143908,"a":1795144466,"t":"创新药年末大考：从“信仰仓位”到“业绩仓位”，谁能交出2027的答卷？","su":"혁신신약(세상에 처음 나온 새로운 약) 연말고사: '신념의 자리'부터 '성과의 자리'까지, 2027년 답안지는 누가 내놓을 수 있을까? 11월 중순부터 시작되는 1년 중 가장 집중적인 포지션 조정 기간이다. 기관은 내년에 어디에 돈을 투자할지 결정해야 하고, 개인 투자자는 남을지 떠날지 결정해야 합니다. 이때 시장은 더 이상 새로운 이야기를 원할 뿐만 아니라 어떤 회사가 실제로 돈을 벌고 있는지, 어떤 회사가 여전히 기대에 머물고 있는지 알고 싶어합니다. 지난 2년간 혁신신약 자금의 상당 부분을 임상(새 약을 사람에게 시험하는 것) 데이터, 허가, 트랙 스토리 등 상상력에 투자했습니다. 이러한 베팅은 올 가을에 차례대로 이루어졌습니다. Kangfang의 ivocilimab은 FDA로부터 완전한 응답 편지를 받았고 마케팅이 거부되었으며 Ingen DB-1303의 3상 데이터는 \"통계적으로 유의미하지만 보통\"이었고 Connoya의 CMG901의 PFS는 통계적으로 유의한 기준을 통과하지 못했습니다. 세 기업의 각자의 상황을 단독으로 보고, 종합적으로 보면 시장은 다시 '현금화' 입찰에 나서기 시작했다."},{"s":"뇌 전달력 높이고 월 1회 투약으로…유한양행, 사노피 이어 ‘고셔병 신약’ 도전","so":"Chosunbiz","tm":"11/20 11:37","c":1,"r":"kr","u":"https://biz.chosun.com/science-chosun/bio/2026/11/20/JOQLLKLY35FCRE3OW5YWFNXCZU/","p":1795142220,"a":1795144465,"su":"뇌 전달력 높이고 월 1회 투약으로유한양행, 사노피 이어 고셔병 신약 도전 사노피, 세계 최초 고셔병 3형 신약 FDA 승인 유한양행, BBB 통과해 신경증상 개선·월 1회 투약 목표 사노피 임상(새 약을 사람에게 시험하는 것)서 정신건강 이상반응 보고장기 안전성 입증 관건"},{"s":"캔버스가 연일의 정지고, 유럽 당국이 제3상 임상시험 개시 승인","so":"四季報オンライン","tm":"11/20 10:05","c":1,"r":"jp","u":"https://shikiho.toyokeizai.net/news/0/965447","p":1795136757,"a":1795144469,"t":"キャンバスが連日のストップ高､欧州当局が第3相治験開始承認","su":"콘텐츠 차단이 활성화된 것으로 감지되었습니다. 이 사이트를 사용하려면 콘텐츠 차단 기능(예: 광고 차단 기능이 있는 확장 프로그램)을 비활성화하고 페이지를 다시 로드하세요. 마이크로소프트 Edge를 사용하는 경우 개인 정보 설정이 영향을 받을 수 있으므로 이 설정 화면 <edge://settings/privacy/trackingPrevention>에 접속하여 \"추적 방지 활성화\" 설정을 \"균형(권장)\"으로 설정하시기 바랍니다. 자세한 내용은 사용자 가이드를 참조하세요."}]},{"name":"🔋 2차전지","note":"보유: TIGER 2차전지테마 · KODEX 2차전지산업 · TIGER 2차전지소재Fn","breaking":false,"items":[{"s":"[HSI 분기리뷰] 항셍지수는 장 마감 후 분기리뷰 결과를 발표할 예정이며, KSE지수 편입종목은 50개 종목으로 늘어난다. 시장에서는 CATL, 중지쉬촹 등이 선정될 것으로 예상하고 있다.","so":"香港經濟日報HKET","tm":"11/20 15:25","c":5,"r":"hk","u":"https://inews.hket.com/article/4228366/%E3%80%90%E6%81%92%E6%8C%87%E5%AD%A3%E6%AA%A2%E3%80%91%E6%81%92%E6%8C%87%E5%85%AC%E5%8F%B8%E6%94%B6%E5%B8%82%E5%BE%8C%E5%85%AC%E5%B8%83%E5%AD%A3%E6%AA%A2%E7%B5%90%E6%9E%9C%E3%80%81%E7%A7%91%E6%8C%87%E6%88%90%E4%BB%BD%E8%82%A1%E5  많은 에너지 저장 프로젝트를 구현하는 데 도움이 될 것입니다."},{"s":"보조배터리가 또 불타버렸어요! 베이징시에서 총 258건의 리튬배터리 화재 발생, 소파 충전으로 2명 사망 - 사회","so":"中時新聞網","tm":"11/20 17:41","c":2,"r":"tw","u":"https://www.chinatimes.com/realtimenews/20261120003434-260402","p":1795164070,"a":1795175810,"t":"行動電源又燒了！北市累計258起鋰電池火警沙發充電險釀雙亡- 社會","su":"며칠 전, 타이베이 시 MRT 역에서 보조 배터리가 승객의 배낭에서 갑자기 담배를 피우기 시작했다는 충격적인 보도가 있었습니다. 마차는 순식간에 연기로 가득 찼고, 승객들은 겁에 질려 자리에서 일어나 회피했습니다. 공교롭게도 또 다른 사람은 잠자리에 들기 전 충전을 하기 위해 모바일 보조배터리를 소파 위에 놓아두었습니다. 이른 아침에 갑자기 불이 붙었습니다. 불이 소파에 빠르게 불을 붙였습니다. 한 부부는 자고 있던 중 경보음에 잠에서 깨어 달아났다."},{"s":"CATL, 이스탄불에 터키 최초의 Ningjia 서비스 체험 센터 개설","so":"經濟日報","tm":"11/20 17:02","c":2,"r":"tw","u":"https://money.udn.com/money/story/123828/9891618","p":1795161776,"a":1795175807,"t":"寧德時代在伊斯坦布爾開設土耳其首個寧家服務體驗中心","su":"이스탄불, 터키, 2026년 11월 20일 /PRNewswire/ -- 11월 19일, 터키에서 CATL의 첫 번째 Ningjia 서비스 체험 센터가 공식적으로 문을 열었습니다. The facility is Turkey's first professional battery compartment repair center and integrated sales and service hub, marking another step for CATL in expanding its localized new energy aftermarket service network and supporting the country's transition to a clean energy system. Located at the intersection of Europe, Asia and the Middle East, Turkey is a regional economic hub with a fast-growing electric vehicle market and a rapidly expanding energy storage industry, and the transition to clean energy is driving demand for specialist battery support. Its \"National Energy 2040\" plan proposes to achieve the goal of 20 million electric vehicles and 140 GWh of energy storage capacity by 2040. In this context, Ningjia Services provides full life cycle battery services for road vehicles and power grids, further consolidating the infrastructure on which this transformation depends. 닝자 서비스 체험 센터는 이스탄불에 위치해 있습니다. 이는 CATL과 Ascendum Group의 자회사인 Ascendum Türkiye 간의 협력에 있어서 중요한 이정표입니다. 포괄적인 수명주기 애프터 서비스 지원을 제공하고 현지 기술 인재를 육성하며 첨단 전기 산업을 가속화합니다."},{"s":"보도자료: EV 등의 사용이 끝난 차재 리튬 이온 전지의 객관적인 안전성·성능 평가 기준을 정한 JIS 제정(PR TIMES)","so":"毎日新聞","tm":"11/20 16:54","c":2,"r":"jp","u":"https://mainichi.jp/articles/20261120/pr2/00m/020/804000c","p":1795161246,"a":1795175816,"t":"プレスリリース：EV等の使用済み車載リチウムイオン電池の客観的な安全性・性能評価基準を定めた JIS制定（PR TIMES）","su":"일본발의 국제 규격에 완전 정합. 2차 이용(리퍼패스)의 평가기준을 명확히 하고, 축전지 시장의 성장과 서큘러 이코노미의 실현을 뒷받침. 일반 재단법인 일본 규격 협회(본부: 도쿄도 미나토구, 이사장: 아사히 히로)는 2026년 11월 20일에 국제 규격 IEC 63330-1:2024와 일치한 이차 전지의 리퍼 패스에 관하여"},{"s":"히타치와 히타치 하이테크, 전고체 전지의 품질 평가를 위한 분석·해석 기술 개발","so":"日本経済新聞","tm":"11/20 16:39","c":2,"r":"jp","u":"https://www.nikkei.com/article/DGXZRSP715599_Q6A121C2000000/","p":1795160347,"a":1795175813,"t":"日立と日立ハイテク、全固体電池の品質評価に向けた分析・解析技術を開発","su":"【프레스 릴리스】발표일:2026년 11월 20일 전고체 전지의 품질 평가를 향한 분석·해석 기술을 개발 금속 이물의 혼입에 의한 성능 영향을 평가해, 양산시에 확인해야 할 항목의 정리를 지원 히타치와 히타치 하이테크는, 전고체 전지의 실용화·양산화를 향해 중요해지는 품질 평가를 지탱하기 위해, 제조 공정에서 혼입 히타치 하이테크의 전자 현미경이나 X 선 분석 장치 등의 첨단 분석 기기를 활용"},{"s":"CATL의 자회사인 Fuding New Energy Technology Company, 자본금을 55억으로 증자","so":"Jiemian.com","tm":"11/20 15:22","c":2,"r":"cn","u":"https://www.jiemian.com/article/15354615.html","p":1795155774,"a":1795158247,"t":"宁德时代旗下福鼎新能源科技公司增资至55亿","su":"Tianyancha 앱에 따르면 CATL(Fuding) New Energy Technology Co., Ltd.는 최근 산업 및 상업 변화를 겪었으며 등록 자본금은 RMB 45억에서 RMB 55억으로 증가했습니다. 회사는 2021년 1월에 설립되었습니다. 법적 대표자는 Shang Qingbo입니다. 사업 범위에는 신흥 에너지 기술 연구 및 개발, 배터리 제조, 배터리 판매 등이 포함됩니다. CATL New Energy Technology Co., Ltd.가 전체 지분(회사를 나눠 가진 몫)을 소유하고 있습니다. CATL의 자회사인 Fuding New Energy Technology Company는 자본금을 55억 달러로 늘렸습니다. 원본 뉴스 출처: Jiemian News CATL 6.5k - CATL: 11월 19일 A주(중국 본토 주식시장 주식) 850,500주 매입 - 중국남방전력망과 CATL, 전략적 협력 프레임워크 계약 체결"},{"s":"[모닝 리포트] \"코스모신소재, 내년 양극재 가동률 회복…하반기 흑자 전환 전망\"","so":"뉴스핌","tm":"11/23 08:59","c":1,"r":"kr","u":"https://www.newspim.com/news/view/20261123000026","p":1795391940,"a":1795392922,"su":"[서울=뉴스핌] 이나영 기자= IBK투자증권은 23일 2차전지(충전해서 다시 쓰는 배터리) 양극재와 MLCC용 이형필름을 생산하는 코스모신소재에 대해 올해는 환율과 증설 고정비 부담으로 수익성이 둔화됐지만, 2027년부터 양극재 가동률 회복과 고부가 이형필름 판매 확대에 힘입어 실적(회사가 번 돈 성적표) 개선이 본격화"},{"s":"전력 병목이 키운 ESS·냉각설비…삼성·LG, K-배터리·전자 '신성장축'","so":"파이낸셜포스트","tm":"11/23 07:35","c":1,"r":"kr","u":"https://www.financialpost.co.kr/news/articleView.html?idxno=302375","p":1795386900,"a":1795389909,"su":"미국 전력망 확충 지연에 따른 설비 병목과 글로벌 AI 소프트웨어·서비스 투자 폭증이 맞물리면서 에너지저장장치(ESS(전기를 저장해 두는 큰 배터리)), AI 데이터센터(AIDC) 냉각솔루션,"},{"s":"주가 반토막에 풋옵션 폭탄… 에코프로비엠, 기존 FI들에 ‘CB 돌려막기’","so":"Chosunbiz","tm":"11/23 06:00","c":1,"r":"kr","u":"https://biz.chosun.com/stock/market_trend/2026/11/23/HCHCDI5F3VAFHGIX7N6GPUZGGE/","p":1795381200,"a":1795389909,"su":"주가 반토막에 풋옵션 부담 에코프로비엠, 기존 FI와 CB 재발행 추진 4200억 CB 조기상환 후 신규 발행 만기이자율 2% → 3% 상향 유력 상환금, 신규 CB 인수대금과 상계"},{"s":"CATL은 유럽 시장으로 확장할 계획이며 EU에 정유용 폐배터리 재활용을 개방할 것을 촉구합니다.","so":"DIGITIMES","tm":"11/23 03:22","c":1,"r":"tw","u":"https://www.digitimes.com.tw/tech/dt/n/shwnws.asp?id=0000775544_4V64DOMZ59G7MF3Y1EBUT","p":1795371720,"a":1795389911,"t":"寧德時代布局歐洲市場 籲歐盟開放廢棄電池回送中精煉","su":"CATL 창립자이자 회장인 Zeng Yuqun은 유럽이 현지 배터리 재활용을 장려한다면 높은 비용에 직면하게 될 것이라고 경고했습니다. 그는 사용한 배터리를 중국으로 보내고, 재활용된 금속을 정제한 뒤 다시 유럽으로 운송하자고 제안했습니다. 이 계획은 유럽 공무원과 일부 자동차 제조업체에 제안되었습니다."},{"s":"CATL을 곤경에 빠뜨린 미국산 포드의 LFP는 중대한 조치를 취한다","so":"DIGITIMES","tm":"11/23 03:21","c":1,"r":"tw","u":"https://www.digitimes.com.tw/tech/dt/n/shwnws.asp?id=0000775525_ZD24WADF3PB7LO4GXA71T","p":1795371660,"a":1795389912,"t":"攜寧德時代惹一身腥 福特LFP美國自製跨出關鍵一步","su":"최근 포드는 인산철리튬(LFP) 배터리가 공식적으로 생산에 들어가고 전기 픽업트럭에도 탑재될 것이라고 발표해 미국이 LFP 배터리를 제조하는 데 중요한 발걸음을 내디뎠다. 유럽, 미국, 일본, 한국의 주류 자동차 제조업체를 살펴보면 Ford는 자체 제작에 성공한 몇 안 되는 사례 중 하나입니다. 외신은 CATL 턴키 의존도에 대해 의구심을 갖고 있지만, 공급망(부품·재료가 오가는 연결망)에서는 여전히 긍정적인 기대를 갖고 있다. ..."},{"s":"CATL은 배터리에서 에너지 통합으로 전환하여 라틴 아메리카 에너지 저장 시장에서 입지를 확대하고 있습니다.","so":"DIGITIMES","tm":"11/23 03:04","c":1,"r":"tw","u":"https://www.digitimes.com.tw/tech/dt/n/shwnws.asp?id=775366","p":1795370640,"a":1795389914,"t":"寧德時代從電池走向能源整合 擴大布局拉美儲能市場","su":"전기 자동차의 글로벌 인기가 둔화되고 시장 경쟁이 심화됨에 따라 CATL 회장 겸 CEO인 Zeng Yuqun은 회사가 표준화된 통합 솔루션을 만들기 위해 미국에서 수요가 높은 독립형 전원 공급 장치 시스템을 확보했다고 밝혔습니다. 또한 라틴 아메리카에서 에너지 저장 사업 기회를 완전히 포착하기 위해 아르헨티나에 상업 사무소를 설립했습니다."},{"s" :"에코프로비엠도 LFP 양극재 경쟁 참전, 송호준 탈중국 ESS 수요 증가에 삼원계 '올인' 철회","so":"비즈니스포스트","tm":"11/22 06:00","c":1,"r":"kr","u":"https://www.businesspost.co.kr/BP?command=article_view&num=452416","p":1795294800,"a":1795303157},{"s":"미드 리무시로부터 리튬 이온 전지의 양극 재료를 개발","so":"日本経済新聞","tm":"11/22 05:00","c":1,"r":"jp","u":"https://www.nikkei.com/article/DGXZQOSG097740Z01C26A1000000/","p":1795291200,"a":1795303158,"t":"ミドリムシからリチウムイオン電池の正極材料を開発 産総研","su":"산업기술종합연구소는 미드리무시 유래의 재료로부터 리튬 이온 전지용 재료를 개발했다. 전지의 정극에 사용하는 접착제로, 종래의 제조 공정에서 사용할 수 있다. 자연계에서 분해하기 어려운 불소계 재료를 포함하지 않고, 폐기시의 환경에의 부하를 저감할 가능성이 있다. 리튬 이온 전지의 정극에는 전기를 축적하는 재료 등을 금속박에 고정하는 접착제를 사용한다. 현재, 접착제에는 불소를 포함하는 고분자 재료가 널리 사용되고 있지만, 환경에서 분해되기 어려운 문제가 있다."},{"s":"전기 자전거 배터리 화재가 증가함에 따라 뉴욕은 더욱 엄격한 제한 조치를 취하고 있습니다.","so":"Reuters","tm":"11/21 20:18","c":1,"r":"us","u":"https://www.reuters.com/world/us/e-bike-battery-fires-mount-new-york-weighs-tougher-restrictions-2026-11-21/","p":1795259936,"a":1795270286,"t":"As e-bike battery fires mount, New York weighs tougher restrictions"},{"s":"정저우시 한 지역에서 화재가 발생해 5명이 사망하고 1명이 부상을 입었습니다. 조사 보고서: 전기 오토바이를 불법 개조하고, 충전을 위해 건물과 주택에 불법 진입했으며, 열 폭주 후 리튬 배터리가 폭발했습니다.","so":"ThePaper.cn","tm":"11/21 17:44","c":1,"r":"cn","u":"https://www.thepaper.cn/newsDetail_forward_34529076","p":1795250697,"a":1795278551,"t":"郑州市一小区发生火灾致5死1伤，调查报告：电动摩托车非法改装，违规进楼入户充电，锂电池热失控后爆燃","su":"2026년 7월 6일, 정저우시 후이지구와 창룽위에 커뮤니티에서 대규모 화재 사고가 발생했습니다. 화재 면적은 약 15㎡로 사망자 5명, 부상 1명이 발생했으며 직접적인 경제적 손실은 530억7500만 위안에 달했다. 11월 20일 정저우 소방방재공식계정에 따르면 화재사고 조사보고서가 공개됐다."},{"s":"테슬라, 중국 CATL과 충전용 배터리 논의 중","so":"ET Auto","tm":"11/21 16:47","c":1,"r":"us","u":"https://auto.economictimes.indiatimes.com/news/industry/tesla-in-talks-with-chinas-catl-for-rechargeable-batteries-report/68357867?next=1","p":1795247229,"a":1795270287,"t":"Tesla in talks with China's CATL for rechargeable batteries: Report"},{"s":"JA Solar가 자체 개발한 배터리 여권 플랫폼이 EU 강제 접근 요구 사항을 충족하기 위해 온라인에 출시되었습니다.","so":"經濟日報","tm":"11/21 16:00","c":1,"r":"tw","u":"https://money.udn.com/money/story/123828/9893297","p":1795244432,"a":1795248137,"t":"晶澳自研電池護照平台上線，滿足歐盟強制准入要求","su":"베이징, 2026년 11월 21일 /PRNewswire/ -- 글로벌 에너지 전환의 물결 속에서 수명 주기 전반에 걸친 배터리의 투명성과 추적성은 에너지 저장의 핵심 운반체로서 국제 시장의 관심의 초점이 되었습니다. EU 배터리 여권 요구 사항이 점진적으로 구현됨에 따라 유럽 시장에 진출하는 배터리 제품은 새로운 정보 관리 요구 사항에 직면하게 됩니다. JA Solar가 자체 개발한 배터리 패스포트 플랫폼 01 '배터리 패스포트'란 정확히 무엇인가요? 배터리 여권은 실제 배터리에 바인딩된 디지털 기록입니다. QR 코드와 고유 식별자(ISO/IEC 15459 표준 기반)를 통해 \"탄생부터 폐기까지\" 배터리의 주요 데이터가 직렬로 연결되어 신원 정보, 재료 구성, 탄소 발자국, 재활용 재료 함량, 성능 내구성, 건강 상태, 공급망(부품·재료가 오가는 연결망) 실사 및 폐기 처리 등 전체 수명 주기 정보를 포괄합니다. 02 주요 일정: 규정 준수 준비를 계속해야 합니다. EU의 배터리 및 폐배터리 규정(규정(EU) 2023/1542)에 따라 2027년 2월 18일부터 EU 시장에 출시되거나 사용되는 소형 자동차 배터리, 2kWh 이상의 산업용 배터리, 전기 자동차 배터리에는 배터리 여권을 장착해야 합니다. 이 요구 사항을 충족하기 위해 JA Solar는"},{"s":"중고차 배터리에서 '블랙 골드'를 찾는 노르웨이","so":"ET Auto","tm":"11/21 14:42","c":1,"r":"us","u":"https://auto.economictimes.indiatimes.com/news/auto-components/norways-quest-for-black-gold-from-used-car-batteries/101384719?next=1","p":1795239724,"a":1795282027,"t":"Norway's quest for 'black gold' from used car batteries"},{"s":"폐전기차 배터리를 금으로 바꿀 수 있을까? 중국 본토에서 '도시 광산' 사업 기회 폭발","so":"中時新聞網","tm":"11/21 14:30","c":1,"r":"tw","u":"https://www.chinatimes.com/realtimenews/20261121001926-260409","p":1795239013,"a":1795248139,"t":"電動車報廢電池變黃金？大陸「城市礦山」商機爆發","su":"폐기된 신에너지 자동차용 동력배터리는 제대로 처리하지 않으면 오염원이 될 수 있지만, 제대로 재활용하면 '도시 광산'이 될 수 있다. 중국 본토에서 신에너지 차량의 수가 급속히 증가하고 있으며, 전력 배터리의 폐기가 다가오고 있습니다. 관계자들은 밀집된 재활용 네트워크 구축을 가속화하고 배터리 흐름을 감시하며 수천억 위안 규모의 순환 경제 시장을 점유하고 있습니다. 중국-싱가포르"},{"s":"촘촘하게 짜여진 중국 배터리 재활용 네트워크, 1000억 규모 '도시 광산'으로 부상 - China News Service","so":"中国新闻网","tm":"11/21 13:50","c":1,"r":"cn","u":"https://www.chinanews.com.cn/cj/2026/11-21/10735679.shtml","p":1795236632,"a":1795278552,"t":"中国织密电池回收网络千亿级“城市矿山”崛起-中新网","su":"중국의 고밀도 배터리 재활용 네트워크 수천억 개의 '도시 광산' 증가 폐기된 신에너지 차량용 동력 배터리는 버리면 오염되지만 재활용하면 풍부한 광석이 될 것입니다. 올해 6월 말 현재 중국의 신에너지차 대수는 4,897만 대에 달했다. 이 숫자 뒤에는 전례 없는 전력 배터리 폐기의 물결이 다가오고 있습니다. 최근 상무부를 포함한 9개 부서가 공동으로 \"재생 가능한 자원 재활용 시스템 구축을 심층적으로 추진하고 재활용 산업의 고품질 발전을 촉진하기 위한 의견\"을 발표하여 특별 장 형태로 \"3가지 새로운 유형\"의 고형 폐기물 재활용 및 활용에 대한 전반적인 조치를 취했습니다. 표면적으로는 '폐기물 수집'에 관한 것처럼 보이지만, 자세히 보면 이는 산업체인의 안보와 관련된 장기화된 자원전쟁이다. 동시에 거대한 시장의 형성이 가속화되고 있다."},{"s":"Yiwei Lithium Energy Liu Jincheng: 2027~2028년 대형 원통형 배터리 납품 규모가 100GWh를 초과할 것","so":"Jiemian.com","tm":"11/21 11:58","c":1,"r":"cn","u":"https://www.jiemian.com/article/15357631.html","p":1795229938,"a":1795230995,"t":"亿纬锂能刘金成：2027‑2028年大圆柱电池交付规模将超100 GWh","su":"원본 뉴스 Gao JingGJ · 출처: Jiemian News 11월 21일, 제11회 파워 배터리 응용 국제 서밋(CBIS2026) 기업가 고위급 포럼이 상하이에서 열렸습니다. Yiwei Lithium Energy의 Liu Jincheng 회장은 회의에서 회사가 대형 원통형 및 대형 사각형 배터리 트랙 레이아웃에 중점을 두고 있다고 소개했습니다. 2027~2028년에는 대형 원통형 배터리 납품 규모가 100GWh를 넘어설 것으로 예상된다. 현재 702Ah 대형 각형 배터리 수요는 강하지만 공급 격차가 존재한다."},{"s":"Zhuhai Guanyu Xu Yanming: 리튬 배터리 산업은 대내외 특허 문제에 직면해 있으며, 내부 차단 소송을 중단하고 외부 세계에 대한 통합적인 접근을 요구하고 있습니다.","so":"Jiemian.com","tm":"11/21 11:36","c":1,"r":"cn","u":"https://www.jiemian.com/article/15357594.html","p":1795228616,"a":1795230995,"t":"珠海冠宇徐延铭：锂电行业面临专利内忧外患，呼吁停止内部阻击式诉讼、抱团一致对外","su":"11월 21일, Zhuhai Guanyu 회장 Xu Yanming은 제11회 국제 전력 배터리 응용 서밋(CBIS2026)의 기업가 고위급 포럼에서 중국 국내 리튬 배터리 산업의 특허 압력이 두드러지고 있으며 많은 해외 기업과 특허 풀이 계속해서 특허 문제를 제기하고 있다고 지적했습니다. 동시에, 중국 국내 동종 기업의 특허 소송이 빈번하고, 많은 소송이 기업공개(IPO) 및 입찰 노드를 대상으로 장벽을 형성하고 있습니다. 그는 업계가 내부소송을 줄이고, 협의와 조정을 정상화하며, 혁신을 중단하고, 해외 지적재산권 리스크에 공동으로 대응하기 위해 한 팀으로 글로벌화할 것을 제안했다. Xu Yanming은 또한 중국의 전체 리튬 배터리 시장 점유율은 세계 1위이지만 기초 기술 특허 축적은 여전히 일본과 한국만큼 좋지 않으며 해외 특허 풀의 압력에 직면해 있다고 지적했습니다. 그는 업계가 기술 리더십을 유지하고 글로벌 관점에서 특허를 배포해야 한다고 제안했습니다. 동시에, 최근 몇 년간 중국 리튬 배터리 산업이 신기술, 신재료, 신시스템 분야에서 형성한 고부가가치 특허를 활용해 전문 지적재산권팀을 구축해 해외 특허 봉쇄를 파악하고 대응하며 심지어 반격해야 한다."},{"s":"[AX 인재 키우는 대학]〈2〉동국대, 이차전지 전 과정에 AI 접목…산업 맞춤형 인재 양성","so":"전자신문","tm":"11/21 11:09","c":1,"r":"kr","u":"https://www.etnews.com/20261120000141","p":1795226940,"a":1795230994,"su":"인공지능(AI)이 이차전지 산업의 소재 개발부터 제조공정, 품질 관리까지 빠르게 확산하면서 배터리 전문지식과 AI 활용 역량을 동시에 갖춘 인재의 중요성이 커지고 있다. 동국대학교는 배터리 소재 설계부터 셀 제조, 성능 평가까지 전 과정에 AI를 접목한 실무교육으로 산업현장이 요구하는 융합인재 양성에 나섰다. 동국대는 교육부가 추진하는"},{"s":"\"엘앤에프, 설비투자 위해 추가 자금조달 불가피… 목표가↓\"-대신 - 머니투데이","so":"머니투데이","tm":"11/21 10:43","c":1,"r":"kr","u":"https://www.mt.co.kr/index.php/stock/2026/11/20/2026112008225688924","p":1795225402,"a":1795259708,"su":"대신증권이 20일 엘앤에프에 대한 목표주가(전문가가 예상한 앞날의 주가)를 기존 15만원에서 11만원으로 낮춰 잡았다. 자금조달에 따른 지분(회사를 나눠 가진 몫)희석(오버행) 물량과 리튬인산철(LFP) 양극재 시장의 경쟁이 심화할 가능성을 반영했다."},{"s":"반도체 흑자에 가려진 '대중국 수출 착시'…자동차·이차전지 적자 급증","so":"파이낸셜포스트","tm":"11/21 09:52","c":1,"r":"kr","u":"https://www.financialpost.co.kr/news/articleView.html?idxno=302335","p":1795222374,"a":1795226153,"su":"올해 한국의 대중 무역수지가 4년 만에 흑자(번 돈이 쓴 돈보다 많은 것)로 돌아섰으나 반도체(전자기기의 두뇌 부품)를 제외하면 오히려 적자 폭이 커진 것으로 나타났다.21일 한국무역협회 및 산업통상부에 따르면, 올"},{"s":"리튬 이온 전지를 둘러싼 화재 등의 사례가 소개되었다=13일, 치바현 이치카와시의 쇼와 학원 초등학교(외자 아키히코 촬영)","so":"産経ニュース","tm":"11/21 07:30","c":1,"r":"jp","u":"https://www.sankei.com/article/20261121-BKRVLT2ET5JT7NIHC4LVFLX55Y/photo/VJYWPZ3Z3RM3TP22TPJUZD6DXI/","p":1795213800,"a":1795226161,"t":"リチウムイオン電池を巡る火災などの事例が紹介された＝13日、千葉県市川市の昭和学院小学校（外崎晃彦撮影）","su":"산케이 뉴스의 기사 「리튬 이온 전지 「바르게 버리고」 산폐업자가 아이용 수업 30회 「화재 공포와 싸움」」의 사진이나 화상의 확대 페이지입니다."},{"s":"리튬이온 전지 「바르게 버려」 산폐업자가 아이용 수업 30회 「화재 공포와 싸움」","so":"産経ニュース","tm":"11/21 07:30","c":1,"r":"jp","u":"https://www.sankei.com/article/20261121-BKRVLT2ET5JT7NIHC4LVFLX55Y/","p":1795213800,"a":1795215161,"t":"リチウムイオン電池「正しく捨てて」 産廃業者が子供向け授業30回 「火災恐怖と戦い」","su":"분별되지 않고 버려진 리튬 이온 전지가 폐기물 처리 시설에서 발화해 화재를 일으킨다고 하는 사안이 전국에서 잇따르고 있는 것을 둘러싸고, 지바현내의 산업 폐기물 처리 사업자가,…"},{"s":"GS유아사 아베 사장 “우주용 전지, 양산에 검사 공정의 자동화 진행한다”","so":"日本経済新聞","tm":"11/21 05:00","c":1,"r":"jp","u":"https://www.nikkei.com/article/DGXZQOUF0613D0W6A101C2000000/","p":1795204800,"a":1795215164,"t":"GSユアサ阿部社長「宇宙用電池、量産へ検査工程の自動化進める」","su":"지에스 유아사 코퍼레이션(GS유아사)은 인공위성용 리튬 이온 전지의 사업 확대를 목표로 한다. 소형 위성용 수요 개척을 위해 양산 기술을 닦아 검사 공정의 자동화도 진행한다. 아베 타카시 사장에게 향후 성장 전략을 들었다. ――2026년도부터 3년간의 제7차 중기 경영 계획으로 「항공・우주・방위」를 독립한 사업에 자리매김했습니다. “방위 용도의 산업용 전지는 당사의 조업의 하나로, 오랜 역사가 있다.안보를 둘러싼 환경이 크"},{"s":"항셍지수 분기별 리뷰 발표 Ningde Changfei Naco Index | 홍콩경제신문","so":"香港經濟日報HKET","tm":"11/21 01:29","c":1,"r":"hk","u":"https://invest.hket.com/article/4228789/","p":1795192140,"a":1795215158,"t":"恒指季檢出爐 寧德長飛納科指|香港經濟日報"},{"s":"항셍테크지수는 큰 조정을 겪게 될 것이다. CATL, 중지쉬촹 등의 주식이 포함될 수 있습니다 | 본토 주식 통찰력 | 양안","so":"經濟日報","tm":"11/20 22:09","c":1,"r":"tw","u":"https://money.udn.com/money/story/5604/9890792?from=edn_subcatelist_cate","p":1795180163,"a":1795180888,"t":"恒生科技指數將迎重大調整 寧德時代和中際旭創等股票或被納入 | 陸股透視 | 兩岸","su":"[블룸버그] - CATL과 중국 InnoLight와 같은 주식이 홍콩 기술주 벤치마크 지수의 대대적인 개편에 포함될 것으로 예상됩니다. 이를 통해 지수가 인공지능 붐을 더 잘 반영하고 아시아의 다른 기술 중심 지수와 경쟁하는 데 도움이 될 것입니다."},{"s":"CATL은 일주일에 세 번씩 200억~400억 위안 규모의 자사주 매입 계획을 가속화합니다.","so":"21财经","tm":"11/20 21:57","c":1,"r":"cn","u":"https://www.21jingji.com/article/20261120/herald/ad352edf292e19be95951dc69c2d885d.html","p":1795179420,"a":1795180882,"t":"一周三度出手，宁德时代加速推进200亿~400亿元回购计划","su":"21세기 비즈니스 헤럴드 Liu Xiafei 기자 이번 주 CATL은 200억~400억 위안 규모의 상각 환매 계획을 가속화하기 위해 세 차례 조치를 취했습니다. CATL은 이날 중앙입찰을 통해 A주(중국 본토 주식시장 주식) 65만7600주를 매입했다고 20일 밝혔다. 최고거래가는 주당 229.58위안, 최저거래가는 주당 226.84위안이다. 지급총액은 1억4998만위안이며, 자사주 매입(회사가 자기 주식을 다시 사는 것)은 소각 예정이었다. 앞서 CATL은 지난 11월 17일과 19일 각각 약 1억5천만 위안과 2억 위안을 환매에 지출했다. 위에 언급된 거래는 모두 해당 연도에 시작된 상각 환매 계획의 일부입니다. 이 계획을 되돌아보면 CATL은 8월 12일 임시 주주총회에서 검토 및 승인을 받았다. CATL은 12개월 동안 중앙 집중식 입찰을 통해 A주를 환매하는 데 자체 자금 또는 자체 조달 자금 중 200억 위안 이상, 400억 위안 이하를 사용할 계획이다. 모든 주식이 소각되고 그에 따라 등록 자본금도 감소됩니다."},{"s":"Shanghai Electronics Co., Ltd., GigaDevice Innovation, Goke Microelectronics, CATL, Shengyi Technology, Hengtong Optoelectronics 및 Tongwei Co., Ltd.는 공동으로 지분 증가 및 환매를 발표했습니다.","so":"21财经","tm":"11/20 20:53","c":1,"r":"cn","u":"https://www.21jingji.com/article/20261120/herald/704a6c7c7cafa050288a7c996fda5a54.html","p":1795175580,"a":1795180884,"t":"沪电股份、兆易创新、国科微、宁德时代、生益科技、亨通光电、通威股份集体宣布增持、回购","su":"11월 20일 저녁, 21 Financial Radar에 따르면 Shanghai Electric Co., Ltd., GigaDevice, CATL, Cyrus, Hengtong Optoelectronics, Tongwei Co., Ltd., Rongsheng Petrochemical, Huaqin Technology 및 기타 회사가 A주 '증가 및 환매 물결'에 동참했습니다. Shanghai Electric Co., Ltd.는 2026년 11월 20일 회사가 주식 환매를 위한 특별 증권 계정을 통한 중앙 집중식 입찰 거래를 통해 처음으로 회사 주식 248,900주를 환매했다고 발표했습니다. 이는 회사 전체 주식 자본금의 0.01%에 해당합니다. 최고 거래가격은 80.85위안/주, 최저 거래가격은 79.92위안/주, 총 거래금액은 199993만원(거래수수료 제외)을 기록했다. 이번 환매 계획은 우리사주 제도나 지분(회사를 나눠 가진 몫) 인센티브를 시행하고 회사 가치와 주주 권리를 유지하기 위해 5억~10억 위안을 환매할 계획이다. 최근 마감 기준으로 Shanghai Electric Co., Ltd.의 시가총액(회사 전체 몸값)은 1,500억 위안을 넘어 전년 대비 10% 이상 증가했으며, 주가는 지난 60일 동안 거의 30% 하락했습니다."},{"s":"1시간만에 증명서 발급! Shaoguan 리튬 배터리의 해외 시장 수출이 가속화되어 수출이 68.6% 증가했습니다.","so":"21财经","tm":"11/20 20:18","c":1,"r":"cn","u":"https://www.21jingji.com/article/20261120/herald/894f2f351e29f047af3506f8f3da0684.html","p":1795173480,"a":1795180887,"t":"1小时内出证！韶关锂电池出海提速，出口比增68.6%","su":"최근 Shaoguan Customs의 감독하에 Guangdong Paidon New Energy Co., Ltd.의 리튬 배터리 수출 위험 패키지 배치는 \"수출 위험물 포장 스마트 감독 시스템\"을 통해 자동으로 온라인 비교 및 확인되어 패키지가 사용 자격이 있는지 확인하고 신속하게 출시되었습니다. 이는 Shaoguan에서 리튬 배터리 패키징을 위한 스마트 감독 모델이 성공적으로 구현되었음을 의미합니다. 최근에는 그린에너지 산업의 급속한 발전과 함께 대외무역의 '3대 신품목' 중 하나인 리튬전지 수출이 폭발적인 성장세를 보이고 있다. 통계에 따르면 2026년 1월부터 10월까지 소관시 리튬 배터리 제품 수출액은 9,395만 위안에 달해 전년 동기 대비 68.6% 증가했다. 제품은 유럽, 미국, 동남아시아 등 많은 국가와 지역으로 수출되어 소관 대외 무역 성장의 새로운 엔진이 되었습니다."},{"s":"규슈전력, 산업기계용 전지팩으로 신회사 정흥전기제작소와 협업","so":"日本経済新聞","tm":"11/20 20:12","c":1,"r":"jp","u":"https://www.nikkei.com/article/DGXZQOJC207IW0Q6A121C2000000/","p":1795173126,"a":1795175814,"t":"九州電力、産業機械向け電池パックで新会社 正興電機製作所と協業","su":"큐덴홀딩스 산하 규슈전력은 20일 산업기계용 전지팩을 개발·판매하는 신회사를 설립했다고 발표했다. 탈탄소를 배경으로 건설기계나 특수차량 등으로 전동화 요구가 확대되고 있어 상기가 있다고 판단했다. 신회사 「BIXSAS(빅사스)」를 1일자로 설립했다. 전지 팩은 리튬 이온 전지에 제어 기판 등을 조합한 것. 구전은 2022년부터 판매하고 있으며, 사업이 궤도를 타고 있기 때문에 신회사에서 본격전"},{"s":"BYD는 일본에서 무엇을 했나요? | 발전소","so":"Jiemian.com","tm":"11/20 19:51","c":1,"r":"cn","u":"https://www.jiemian.com/article/15356470.html","p":1795171892,"a":1795175805,"t":"比亚迪在日本都做了些什么？ | 电厂","su":"한때 일본에서 예약 붐을 일으켰던 BYD Sea Otter(RACCO)가 출시 이후 최대 경쟁자를 맞이하게 되었는지도 모릅니다. 스즈키는 지난 10월 동급 순수 전기경차 e-스카이를 출시했다. 니혼게이자이신문은 '스즈키 e-스카이(Suzuki e-Sky)' 출시 첫 달 주문량이 4,000대를 넘어 BYD RACCO를 제치고 두 모델의 예약량을 비교했다. 일본 종합 뉴스 사이트 '마이나비 신문'은 해달을 경차 경자동차 시장의 '흑선'이라 부르며 'RACCO와 eSKY의 정면 대결'이라는 제목으로 스즈키의 대응을 논했다. BYD는 2023년 일본 승용차 시장에 진출한 뒤 현지에 1만대 이상의 차량을 납품하는 데 거의 4년이 걸렸다. BYD는 올해 상반기 10개월간 일본에서 총 4,693대의 차량을 판매해 시장점유율 약 0.1%를 기록했지만 아직 큰 규모를 형성하지는 못했다."},{"s":"리튬배터리 산업체인 주간일지 | 첫 10개월 동안 중국 국내 배터리 판매량은 전년 대비 50% 이상 증가했습니다. Jiangte Electric의 Xikeng 리튬 광산이 건설 준비 단계에 돌입했습니다.","so":"Jiemian.com","tm":"11/20 19:51","c":1,"r":"cn","u":"https://www.jiemian.com/article/15356217.html","p":1795171890,"a":1795175806,"t":"锂电产业链周记| 前10个月国内电池销量同比增超五成江特电机茜坑锂矿进入开工建设准备阶段","su":"상무부를 포함해 9개 부처는 폐전원 배터리 재활용 및 처리 강화를 요청했다. 파나소닉은 미국 기업 Sila와 10억 달러 이상 규모의 실리콘 탄소 음극 계약을 체결했으며, Xingfa 그룹은 인광석 자원 개발을 위해 20억 4천만 위안 규모의 지주 자회사를 설립할 계획이다."},{"s":"온라인뱅킹 운영도 없이 예금이 도난당했어요! 휴대폰 트로이 목마 OTP 인증코드가 가로채질 수 있습니다. 글로벌 한정판 i8 슈퍼카가 타이난 거리에서 불을 질렀습니다! 리튬 배터리가 30분 동안 타서 남은 뼈대가 파괴되었습니다.","so":"TVBS新聞網","tm":"11/20 19:42","c":1,"r":"tw","u":"https://news.tvbs.com.tw/videos/HggOaRLO-is","p":1795171367,"a":1795230997,"t":"網銀沒操作存款遭盜轉！手機木馬OTP驗證碼恐遭攔截台南全球限量i8超跑街頭起火！鋰電池燒半小時撲滅剩骨架","su":"더 많은 뉴스 속보! 지금 TVBS 뉴스 앱을 다운로드하세요 홈 페이지 | 영상개요 인터넷뱅킹 조작도 없이 예금이 도난당했습니다! 휴대폰 트로이 목마 OTP 인증코드가 가로채질 수 있습니다. 글로벌 한정판 i8 슈퍼카가 타이난 거리에서 불을 질렀습니다! 리튬 배터리는 30분 동안 연소되었고 남은 뼈대는 파괴되었습니다. AI 주식이 완전히 피바다가 되었습니다! 대만 주식은 2,393포인트 급락했고 자금 조달(사업에 쓸 돈을 모으는 것) 요청이 급증했으며 단기 제한 명령 2.0으로 인해 NT$20,000의 일반 발행이 발효되어 50대 46표가 3차 판독을 통과했습니다! 녹색과 흰색이 힘을 합쳐 정치원의 반대 서명에 반대하고 다음 단계가 됩니다. 1시간 전 온라인 뱅킹에서 예금이 작동되지 않고 도난당했습니다! 휴대폰 트로이 목마 OTP 인증코드가 가로채질 수 있습니다. 글로벌 한정판 i8 슈퍼카가 타이난 거리에서 불을 질렀습니다! 리튬 배터리가 30분 동안 연소되었고 남은 뼈대는 2시간 전에 소멸되었습니다. 날씨/에어컨 매스가 위력을 발휘하고 있습니다!"},{"s":"업계 관찰 | 리튬 배터리 가격 상승 채널 진입: 산업 사이클과 가치 논리의 재조정","so":"Jiemian.com","tm":"11/20 18:25","c":1,"r":"cn","u":"https://www.jiemian.com/article/13841727.html","p":1795166707,"a":1795248136,"t":"行业观察 | 锂电池价格进入上行通道：产业周期与价值逻辑的再平衡","su":"리튬 배터리 산업이 수년간 하락세를 겪은 후, 인산철리튬 가격은 2025년 6월부터 상승하기 시작하여 반년 만에 거의 30% 상승했습니다. 이러한 가격 인상은 비용에 의해 주도되며 전체 리튬 배터리 산업의 생태에 영향을 미칩니다. 에너지 신산업 체인이 스스로를 고치고 있고, 대형 원통형 배터리 등 세분화된 영역의 업체들이 레이아웃을 가속화하고 있다. 업계의 압력이 풀리고 신에너지 차량과 에너지 저장 장치에 대한 수요가 시장을 주도했으며 인산철리튬 재료 가격은 큰 조정을 거친 후 반등(내렸다가 다시 오르는 것)했습니다. 인산철리튬 배터리는 신에너지 차량, 에너지 저장 시스템 및 기타 분야에서 지배적인 위치를 차지하고 있으며 시장 수요가 빠르게 증가하고 있습니다."},{"s":"홍콩, 2028년부터 공급업체에 kg당 HK$6의 EV 배터리 부과금 부과 예정","so":"South China Morning Post","tm":"11/20 17:55","c":1,"r":"sg","u":"https://www.scmp.com/news/hong-kong/health-environment/article/3375222/hong-kong-plans-impose-ev-battery-levy-hk6-kg-suppliers-2028","p":1795164931,"a":1795175817,"t":"Hong Kong plans to impose EV battery levy of HK$6 per kg on suppliers from 2028"},{"s":"배터리 소재업계 3분기 한파, 코스모신소재만 웃었다","so":"디일렉","tm":"11/20 17:44","c":1,"r":"kr","u":"https://www.thelec.kr/news/articleView.html?idxno=65723","p":1795164252,"a":1795248133,"su":"국내 배터리 소재업계가 장기 실적(회사가 번 돈 성적표) 부진에 빠졌다. 주요 소재 기업 17곳 가운데 11곳이 3분기에도 영업적자(쓴 돈이 번 돈보다 많은 것)를 기록했다. 배터리 사업에 대한 의존도가 높은 기업들"},{"s":"정부는 공급업체로부터 전기차 배터리 재활용 수수료를 킬로그램당 6위안부터 시작하여 매년 인상할 계획이다.","so":"Now 新聞","tm":"11/20 17:07","c":1,"r":"hk","u":"https://news.now.com/home/local/player?newsId=670311","p":1795162044,"a":1795175812,"t":"政府擬向供應商預徵電動車電池循環再造費 起始每公斤6元每年遞增","su":"[Now News Channel] The government plans to collect a battery recycling levy from electric vehicle suppliers in advance. 배터리 무게를 기준으로 계산하면 1kg당 6위안부터 시작해 매년 인상해 2029년 전면 시행을 목표로 하고 있다."},{"s":"CATL의 중국 배터리 시장 점유율은 자동차 제조사 다각화 속에 6개월 연속 하락세를 이어갔다.","so":"South China Morning Post","tm":"11/20 17:00","c":1,"r":"sg","u":"https://www.scmp.com/business/china-evs/article/3375184/catls-china-battery-market-share-extends-six-month-slide-amid-carmaker-diversification?module=Companies&pgtype=section","p":1795161606,"a":1795175817,"t":"CATL’s China battery market share extends six-month slide amid carmaker diversification"},{"s":"Chen Keqin은 전기 자동차 배터리 부과금 수준이 합리적이며 운영 비용과 차량 소유자 부담의 균형을 이루고 있다고 말했습니다.","so":"RTHK News","tm":"11/20 15:43","c":1,"r":"hk","u":"https://news.rthk.hk/rthk/ch/component/k2/1878592-20261120.htm","p":1795156980,"a":1795158253,"t":"陳克勤稱電動車電池徵費水平合理 已平衡運作成本及車主負擔","su":"정부는 전기 자동차 배터리 생산자 책임 계획을 시행하고 전기 자동차 공급업체에 '재활용 부담금'을 부과할 것을 제안하고 있으며, 이 금액은 킬로그램당 NT$6부터 시작하여 매년 꾸준히 증가합니다. 일반적인 개인용 자동차에 500kg의 배터리가 장착되어 있다는 가정하에 초기 권장 충전금액은 약 NT$3,000이며, 매년 NT$800씩 인상되어 2043년에는 NT$15,000로 인상됩니다. 입법회 환경..."},{"s":"현대자동차, 다양한 이해관계자와 전기차 배터리 리스 사업 MOU 체결","so":"ET Auto","tm":"11/20 14:44","c":1,"r":"us","u":"https://auto.economictimes.indiatimes.com/news/hyundai-signs-mou-with-multiple-stakeholders-for-ev-battery-leasing-business/81104251?next=1","p":1795153495,"a":1795226157,"t":"Hyundai signs MOU with multiple stakeholders for EV battery leasing business"},{"s":"충북대, CO-SHOW서 이차전지 기술 체험·경진대회…금상·은상 수상","so":"국제뉴스","tm":"11/20 14:43","c":1,"r":"kr","u":"https://www.gukjenews.com/news/articleView.html?idxno=3758355","p":1795153439,"a":1795175802,"su":"(청주=국제뉴스) 이재기 기자 = 충북대학교(총장 직무대리 유재수) 이차전지 혁신융합대학사업단이 광주 김대중컨벤션센터에서 11월 18일부터 11월 21일까지 열린 2026 제3회 CO-SHOW에 참가했다.이차전지 체험부스를 운영했으며 배터리 제작 경진대회에서는 금상과 은상을 받았다.11월 19일 진행된 2026 COSS Battery Championship에서 금상(전남광주통합특별시장상)은 충북대 B.A.S.E.팀, 은상(COSS 협의회장상)은 CORE팀에 돌아갔다.학생들이 설계부터 제작까지 맡은 배터리 셀을 로봇에 넣고 작동 시간"},{"s":"충주 이차전지 소재 기업, 첨단전략산업 정부 지원 대상 선정","so":"연합뉴스","tm":"11/20 14:03","c":1,"r":"kr","u":"https://www.yna.co.kr/amp/view/AKR20261120100500064","p":1795151012,"a":1795158245,"su":"(충주=연합뉴스) 천경환 기자 = 충북 충주시는 산업통상부의 '국가첨단전략산업 소부장 중소·중견기업 투자 지원' 사업에 관내 이차전지 소재 기업..."},{"s":"미국 자동차 쇼, 테슬라가 비행하는 '로드스터' 중국 신흥 EV도 참여","so":"日本経済新聞","tm":"11/20 10:20","c":1,"r":"jp","u":"https://www.nikkei.com/article/DGXZQOGN200ED0Q6A121C2000000/","p":1795137623,"a":1795144484,"t":"米自動車ショー、テスラが空飛ぶ「ロードスター」 中国新興EVも参加","su":"[로스앤젤레스=카와카미 아즈사]미 전기차(EV) 대기업 테슬라는 19일 보도 공개가 시작된 미국 로스앤젤레스 자동차 쇼(일반 공개는 20일부터)에 2년 만에 출전했다. 10월 발표해 비행 실연을 한 스포츠차 '로드스터'를 자동차쇼에서 첫 공개했다. 전시한 로드스터는 미남부 텍사스 주 스페이스 X의 시험장에서 시연에 사용한 것과 같은 차량이라고 한다. 2028년 양산할 계획으로 미국 스페이스 X의 기술을 활용"},{"s":"'소문' 에너지저장전지 수요 급증. 중국 통신주, AI 인프라 탐색 중","so":"etnet 經濟通","tm":"11/20 10:10","c":1,"r":"hk","u":"http://www.etnet.com.hk/www/tc/news/rumours_detail.php?newsid=20261120372","p":1795137015,"a":1795144484,"t":"《傳聞》儲能電池需求快速增長；中資電訊股力拓AI基建","su":"2026-11-20 09:05 \"소문\" 에너지 저장 배터리 수요가 빠르게 증가하고 있습니다. 중국 통신주들이 AI 인프라를 탐색하고 있다. '루머' 시장 소식통에 따르면 글로벌 AI 데이터센터(컴퓨터 수만 대를 모아 둔 건물) 구축이 에너지 저장 배터리 수요의 급속한 성장을 주도했다고 한다. CATL(03750)은 어제(19일) 20.2위안 하락한 349.8위안에 거래를 마감했고, 매출(물건을 판 돈 전체)액은 14억위안이 넘었다. 글로벌 주식시장 상황은 불투명하고, 중국 통신주는 방어력이 강하다. 리오틴토(Rio Tinto) 데이터센터 등 AI 인프라가 사업 매출 성장을 촉진하는 데 도움이 될 것으로 전해졌다. 차이나모바일(00941)은 어제 0.15위안 오른 80.7위안으로 마감했다. '편집자주' 본 칼럼은 시장의 루머를 수집하고 있으나 확인된 내용은 아니며, '경제뉴스'는 내용의 정확성을 보장하지 않습니다."},{"s":"교보증권 \"엘앤에프, 하이니켈·LFP 양극재 공급 확대로 수익성 개선 전망\"","so":"비즈니스포스트","tm":"11/20 09:46","c":1,"r":"kr","u":"https://www.businesspost.co.kr/BP?command=article_view&num=452480","p":1795135619,"a":1795144478},{"s":"CATL Qiji Power Exchange 산시 지역 총괄 관리자 Guo Xuan: 다퉁 에너지 전환 촉진","so":"新华网山西","tm":"11/20 09:46","c":1,"r":"cn","u":"http://www.sx.xinhuanet.com/20261120/764bc24ce489447fb31712706e7ba10f/c.html","p":1795135594,"a":1795144480,"t":"宁德时代骐骥换电山西大区总经理郭轩：助推大同能源转型","su":"CATL Qiji 배터리 교환 산시 지역 총책임자 Guo Xuan: 다퉁 에너지 변혁 촉진 - 최근 \"중국 경제의 다음 여정: 새로운 방향으로 나아가고 품질을 앞서가다\"라는 주제로 2026 Xinhuanet Sike 연례 컨퍼런스가 산시성 다퉁시에서 열렸습니다."}]},{"name":"⚡ 전고체배터리·ESS","note":"보유: KODEX 전고체배터리ESS TOP2플러스","breaking":false,"items":[{"s":"중국 남부 그리드 에너지 저장: 회장, 회사 주식 환매를 위해 1억~2억 위안 제안","so":"Jiemian.com","tm":"11/20 18:23","c":2,"r":"cn","u":"https://www.jiemian.com/article/15356109.html","p":1795166621,"a":1795175825,"t":"南网储能：董事长提议1亿元-2亿元回购公司股份","su":"China Southern Grid Energy Storage는 11월 20일에 회사의 Liu Guogang 회장이 자체 자금 또는 자체 조달 자금을 사용하여 회사가 발행한 RMB 보통주(A주(중국 본토 주식시장 주식)) 중 일부를 중앙 집중식 입찰 거래를 통해 재매입하고 향후 앞서 언급한 재매입 주식을 모두 취소하고 회사의 등록 자본금을 줄일 것을 제안했다고 발표했습니다. 환매자금 총액은 1억 위안(포함) 이상, 2억 위안(포함)을 초과할 수 없습니다. 환매가격의 상한은 이사회가 주식환매결의를 심의, 승인하기 전 30거래일 동안 회사 주식의 평균거래가격의 150%를 초과할 수 없다. 구체적인 환매계획은 이사회의 승인을 거쳐야 한다."},{"s":"전기 자동차 배터리 생산자 책임 계획은 킬로그램당 6위안을 옹호하고 2029년에 완전히 시행되는 것을 목표로 합니다.","so":"RTHK News","tm":"11/20 13:25","c":2,"r":"hk","u":"https://news.rthk.hk/rthk/ch/component/k2/1878571-20261120.htm","p":1795148700,"a":1795158270,"t":"電動車電池生產者責任計劃倡每公斤6元 目標2029年全面推行","su":"전기 자동차의 인기로 인해 폐기된 배터리의 수는 올해 약 1,300미터톤에서 2030년에는 약 6,700미터톤으로 점차 증가할 것으로 예상됩니다. 정부는 폐기된 전기 자동차 배터리의 재활용 및 처리를 지원하기 위한 자원을 제공하기 위해 전기 자동차 배터리 생산자 책임 제도를 시행하고 전기 자동차 공급업체에 '재활용 부담금'을 부과할 것을 제안합니다. 환경생태국이 입법회에 문서를 제출했다."},{"s":"최주선 삼성SDI 사장 유임…전고체 양산·수익성 경영 지속","so":"매일일보","tm":"11/20 11:15","c":2,"r":"kr","u":"https://www.m-i.kr/news/articleView.html?idxno=2021328","p":1795140903,"a":1795144493,"su":"매일일보 = 권소윤 기자 | 삼성SDI가 최주선 사장 체제를 이어가며 수익성 중심의 경영 기조를 유지한다. 실적(회사가 번 돈 성적표) 반등을 이끈 최 사장은 내년 전고체 배터리(액체 대신 고체를 넣은 안전한 배터리) 양산과"},{"s":"유진證 “AI가 바꾸는 ESS 시장⋯LG엔솔·삼성SDI, 전력망 제어로 사업 확대”","so":"이투데이","tm":"11/23 08:04","c":1,"r":"kr","u":"https://www.etoday.co.kr/news/view/2651421","p":1795388640,"a":1795389922,"su":"▲월간 EV 판매량 추이. (출처=유진투자증권)인공지능(AI) 데이터센터(컴퓨터 수만 대를 모아 둔 건물) 확산으로 에너지저장장치(ESS(전기를 저장해 두는 큰 배터리)) 산업의 경쟁 기준이 배터리 저장용량에서 전력망"},{"s":"AI 데이터 센터 전력 공급, 에너지 저장 및 마이크로그리드 사업 기회로 대만의 중전력 산업 플레이어 유치","so":"DIGITIMES","tm":"11/23 01:51","c":1,"r":"tw","u":"https://www.digitimes.com.tw/tech/dt/n/shwnws.asp?id=775552","p":1795366282,"a":1795389924,"t":"AI資料中心搶通電 儲能、微電網商機引台重電業者卡位","su":"AI 데이터센터(컴퓨터 수만 대를 모아 둔 건물) 구축에 대한 열정은 식지 않고 있다. 미국의 승인 절차가 까다로워지고 일부 프로젝트가 지연됐지만 장기적인 확장 추세는 변하지 않았다. 동시에 전력 수요가 증가함에 따라 \"Time to Power\"는 점차 데이터 센터 운영자에게 가장 중요한 문제가 되었으며, 이로 인해 TECO, Shidian, Yali, ZTE 및 Huacheng과 같은 주요 대만 기업을 포함하여 에너지 저장, 마이크로그리드 및 자체 발전 발전에 대한 수요도 증가했습니다."},{"s":"중국 ESS 배터리 계획 생산능력, 세계 출하량 두 배 육박","so":"전자신문","tm":"11/22 17:00","c":1,"r":"kr","u":"https://www.etnews.com/20261120000236","p":1795334400,"a":1795334544,"su":"중국의 에너지저장장치(ESS(전기를 저장해 두는 큰 배터리))용 배터리 계획 생산능력이 올해 세계 출하량의 두 배에 육박하는 것으로 나타났다. 대규모 설비 증설에 따른 공급과잉 우려 속에 중국 기업들이 해외시장 공략을 확대하면서 가격 경쟁도 심화되고 있다. 22일 중국 현지 매체와 배터리 업계에 따르면 중국 ESS 배터리 셀의 전체 계획 생산능력은 연간 2000GWh(기가와트시)에 근접할 것으로 추산된다. 시장조사업체 인포링크컨설팅이 전망한 올해 글로벌 ESS 배터리 셀 출하"},{"s":"[Zhengdian Finance] 독일: 높은 휘발유 가격, 유치원에서 태양광 에너지
