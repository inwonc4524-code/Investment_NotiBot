<style>
@font-face{font-family:'ChosunIlboMyungjo';src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_one@1.0/Chosunilbo_myungjo.woff') format('woff');font-weight:normal;font-display:swap}
:root{color-scheme:dark;--bg:#262624;--card:#30302e;--card2:#3a3a37;--text:#faf9f5;--sub:#a6a39a;--line:#3e3e3a;--acc:#d97757;--red:#ef4444}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.55 'ChosunIlboMyungjo',Georgia,"Noto Serif KR",serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:760px;margin:auto}
header{padding:20px 16px 8px}
h1{font:600 22px/1.3 'ChosunIlboMyungjo',Georgia,serif;margin:0 0 4px}
.upd{color:var(--sub);font-size:12.5px}
/* 테마 탭 */
.tabs{position:sticky;top:0;z-index:3;background:rgba(38,38,36,.96);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.tabrow{display:flex;gap:8px;overflow-x:auto;padding:12px 16px 10px;scrollbar-width:none}.tabrow::-webkit-scrollbar{display:none}
.tab{position:relative;flex:none;padding:9px 15px;border-radius:12px;border:1px solid var(--line);background:var(--card);
  color:var(--sub);font:inherit;font-size:14px;cursor:pointer}
.tab b{margin-left:5px;color:var(--sub);font-weight:400;font-size:12px}
.tab.on{background:var(--acc);border-color:var(--acc);color:#1f1e1d;font-weight:600}.tab.on b{color:#1f1e1d}
.dot{position:absolute;top:-3px;right:-3px;width:11px;height:11px;border-radius:50%;background:var(--red);border:2px solid var(--bg)}
/* 정렬·국가 */
.ctrl{display:flex;gap:6px;overflow-x:auto;padding:0 16px 10px;scrollbar-width:none}.ctrl::-webkit-scrollbar{display:none}
.ctrl button{flex:none;border:1px solid var(--line);background:transparent;color:var(--sub);border-radius:8px;padding:5px 11px;font:inherit;font-size:12.5px}
.ctrl button.on{background:var(--card2);border-color:var(--card2);color:var(--text)}
.ctrl .sep{flex:none;width:1px;background:var(--line);margin:2px 4px}
main{padding:6px 12px 48px}
h2{font:600 19px/1.3 'ChosunIlboMyungjo',Georgia,serif;margin:16px 4px 2px}
.note{margin:0 4px 10px;color:var(--sub);font-size:12px}
.none{color:var(--sub);margin:24px 4px;text-align:center}
.card{display:block;background:var(--card);border-radius:12px;padding:12px 14px;margin:8px 0;color:var(--text);text-decoration:none;transition:background .15s}
.card:hover{background:var(--card2)}.card:active{opacity:.75}
.meta{color:var(--sub);font-size:12px}
.title{font-weight:500;margin-top:3px}
.orig{color:var(--sub);font-size:12px;margin-top:3px}
.new{margin-left:4px;color:var(--red);font-size:11px;font-weight:700;letter-spacing:.3px}
.hot{display:inline-block;margin-right:6px;padding:0 6px;border-radius:4px;background:rgba(217,119,87,.16);color:var(--acc);font-weight:600}
.hot.big{background:var(--acc);color:#1f1e1d}
.more{display:block;width:100%;margin:4px 0 0;padding:10px;border:1px dashed var(--line);border-radius:12px;background:transparent;color:var(--sub);font:inherit;font-size:13px}
footer{margin:36px 4px 0;padding-top:14px;border-top:1px solid var(--line);color:var(--sub);font-size:12px;line-height:1.7}
footer b{color:var(--text);font-weight:600}
/* 요약 창 */
#dim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:5}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:6;max-width:760px;margin:auto;max-height:82vh;overflow-y:auto;
  background:var(--card);border-radius:16px 16px 0 0;padding:10px 18px calc(18px + env(safe-area-inset-bottom));box-shadow:0 -8px 30px rgba(0,0,0,.4)}
.grab{width:38px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 12px}
.s-title{font-size:17px;font-weight:600;margin:4px 0 2px;line-height:1.45}
.s-label{margin:16px 0 4px;color:var(--acc);font-size:12px;font-weight:700;letter-spacing:.5px}
.s-sum{font-size:15px;line-height:1.75}.s-sum.empty{color:var(--sub);font-size:13.5px}
.s-btns{display:flex;gap:8px;margin-top:20px}
.s-btns button,.s-btns a{flex:1;text-align:center;padding:12px;border-radius:10px;font:inherit;font-size:14.5px;text-decoration:none}
.s-btns button{background:transparent;border:1px solid var(--line);color:var(--sub)}
.s-btns a{background:var(--acc);color:#1f1e1d;font-weight:600}
</style></head><body>

스피는 약세를 보이며 출발했습니다. 오늘 지수는 지난 금요일보다 25.49포인트, 0.5% 내린 5,034.2로 개장해 장 초반 5천..."},{"s":"AI로 인해 아시아 주식은 안정세를 유지하고 중동의 불안감은 줄어들었습니다. Fed 베팅에 대한 달러 회사","so":"The Straits Times","tm":"11/09 12:25","c":2,"r":"sg","u":"https://www.straitstimes.com/business/asian-stocks-steady-as-ai-mideast-jitters-recede-dollar-firm-on-fed-bets","p":1794194700,"a":1794195216,"t":"Asian stocks steady as AI, Mideast jitters recede; dollar firm on Fed bets","su":"AI 불안이 완화되고 연준의 금리 인상 베팅이 달러를 높이면서 아시아 주식은 안정세를 보이고 있습니다. straitstimes.com에서 자세히 알아보세요."},{"s":"Huang Jen-Hsun 논란이 대만 주식 시장 지원에 추가되면서 미국 주식 선물 하락","so":"經濟日報","tm":"11/09 09:30","c":2,"r":"tw","u":"https://money.udn.com/money/story/123398/9865991","p":1794184219,"a":1794195209,"t":"美股期指走低 黃仁勳風波讓台股護盤添亂流","su":"Nasdaq 100과 S&P 500 선물은 NVIDIA 이사회가 Jensen Huang CEO가 외국 정보 기관의 표적이 되었는지 조사하기 시작했다는 소식이 전해지면서 하락했습니다. 월요일 초반 아시아 거래에서 대부분의 주식시장은 일본 주식은 상승하고 한국 주식은 약세를 보이는 등 지난 금요일 미국 주식의 상승세를 이어갔습니다. 지난주 기술적 하락장에 빠진 대만 증시는 만만찮은 적과 마주했다. 다음 단계는 조사가 후이다의 대만 투자 및 협력 계획에 영향을 미칠지 여부를 확인하는 것이다."},{"s":"미국 AI주가 6일 반등했다. 분석가: 매도 압력이 곧 끝날 것입니다.","so":"自由財經","tm":"11/09 06:30","c":2,"r":"tw","u":"https://ec.ltn.com.tw/article/paper/1777764","p":1794173400,"a":1794177855,"t":"美AI股6日反彈 分析師：賣壓即將結束","su":"大摩仍看好標普500年底前挑戰8千點 〔編譯盧永山／綜合報導〕在民主黨於三日舉行的美國期中選舉狂勝後，因市場擔憂民主黨掌控的國會將對人工智慧（AI）產業加強監管，五日在科技股帶領下，美股四大指數重挫"},{"s":"Anthropic은 발전 장비에 막대한 비용을 지출합니다.","so":"經濟日報","tm":"11/09 02:51","c":2,"r":"hk","u":"https://money.udn.com/money/story/123398/9865701","p":1794160267,"a":1794177855,"t":"Anthropic 重金買發電設備","su":"Anthropic傳出以34億美元，敲定一項接手燃氣發電機訂單的大型交易，顯示人工智慧（AI）公司為了爭奪稀缺的發電設備，以滿足資料中心的用電需求，正日益深入能源業，甚至跳過中間商，直接掌握設備供應。"},{"s":"Guoan Fund는 시장을 보호하고 미국 주식은 반등했으며 대만 주식은 오늘 첫 번째 풀기 물결을 위해 싸우고 있습니다.","so":"經濟日報","tm":"11/09 02:26","c":2,"r":"hk","u":"https://money.udn.com/money/story/5607/9865732","p":1794158789,"a":1794195195,"t":"國安基金護盤+美股反彈 台股今日拚首波解套行情","su":"국가안보기금(National Security Fund)이 대만 증시 10차 보호 조치를 개시한다고 발표한 데 이어 미국 4대 주가지수의 강한 반등에 힘입어 오늘(9일)이 첫 번째 보복 풀림 물결이 될 것이라는 시장은 대체적으로 낙관하고 있다. 지수는 4만포인트 선을 회복할 것으로 예상되며, 밴드는 분기선 상승에 도전할 예정이다. 그러나 7거래일 만에 10,000포인트 가까이 급락한 후 법인은 여전히 ​​'4대 핵심' 지표에서 반등 강도와 중장기 상승 여력을 관찰해야 한다는 점을 상기시켰다."},{"s":"민주당의 승리로 미국 주식이 급락했습니다! 분석가: 투자자는 저렴한 가격으로 시장에 진입할 수 있습니다.","so":"自由財經","tm":"11/08 22:56","c":2,"r":"tw","u":"https://ec.ltn.com.tw/article/breakingnews/5633939","p":1794146184,"a":1794148462,"t":"民主黨大勝引發美股重挫！分析師：投資人可逢低進場布局","su":"[루용산 취재/종합보고서] 지난 3일 미국 중간선거에서 민주당이 대승을 거둔 뒤, 민주당이 장악한 의회가 인공지능(AI) 산업에 대한 감독을 강화할 것이라는 시장 우려로 5일 기술주들이 거센 매도압력을 받았다. 많은 월스트리트 분석가들이"},{"s":"대선 이후 상승하는 미국 주식의 승률은 90%를 넘는다. 미국 주식펀드와 미국 기술펀드도 자산배분에 포함돼야","so":"經濟日報","tm":"11/08 18:02","c":2,"r":"hk","u":"https://money.udn.com/money/story/5613/9865225?from=edn_newestlist_rank","p":1794128568,"a":1794145920,"t":"美股選後上漲勝率逾九成 美國股票基金與美國科技基金宜納入資產配置","su":"미국 중간선거가 최악의 상황으로 치닫고 있다. 민주당은 단번에 하원과 하원을 모두 승리했습니다. 트럼프 미국 대통령은 향후 2년 동안 행정부에서 강력한 견제와 균형에 직면할 수도 있다. 미국 주식과 AI 산업 전망도 시장의 관심의 초점이 됐다. 그러나 정치적 패배가 주식시장이 뒤따를 것이라는 의미는 아닙니다! \"Juheng Buying Fund\"의 통계에 따르면, 1927년 이후 실시된 24번의 미국 중간선거 중 S&P 500 지수는 선거 다음 해에 22차례 상승해 승률 91.7%, 평균 수익률 17%를 기록했습니다. 《주행매수펀드》는 이번 선거가 단기적인 충격을 가져올 수는 있지만, 정치 지형의 변화가 미국 증시의 장기적인 추세를 뒤집을 수는 없을 수 있으므로, 투자자들은 선거 결과로 인해 성급하게 퇴출해서는 안 된다고 지적했다."},{"s":"아크는 AI 버블을 두려워하지 않고 '이 주식'에 돈을 더 추가해 추세를 거스른다! 무무 자매: 시장이 걱정될수록 저는 더 낙관적입니다. 강세장은 아직 끝나지 않았습니다.","so":"鉅亨網","tm":"11/09 12:23","c":1,"r":"tw","u":"https://m.cnyes.com/news/id/6652398","p":1794194616,"a":1794195210,"t":"方舟不怕AI泡沫逆勢加碼「這一股」！木頭姐：市場越擔憂我越樂觀、牛市未完","su":"우드는 AI에 대한 우려가 신뢰를 훼손하지 않았으며 현재의 변동을 기술 혁명의 \"두 단계 전진, 한 단계 후퇴\"로 간주했다고 말했습니다.\nARK는 가장 자신 있는 보유량으로 지난 주 보유량을 늘렸고 SpaceX 포지션도 높아졌습니다. 그녀는 주가가 반등할 때 이익을 취하고 하락할 때 더 많은 것을 추가할 것을 제안했습니다.\n그녀는 AI 혁명이 아직 끝나지 않았다고 예측했으며, 이를 2027년까지 연장할 것으로 예상됩니다. ARKK는 올해 35% 이상 상승했습니다."},{"s":"수익 보고서가 통과되었지만 놀라움이 부족합니다. 미국 기업 이익은 기대치를 초과하며 지난 4년 중 가장 적을 수 있습니다.","so":"鉅亨網","tm":"11/09 12:20","c":1,"r":"tw","u":"https://m.cnyes.com/news/id/6652533","p":1794194403,"a":1794195212,"t":"財報過關卻少了驚喜 美企獲利超預期幅度恐創近4年最小","su":"3분기 S&P 500 이익은 대부분 예상보다 좋았지만, 평균은 2.7% 더 높았는데, 이는 2022년 4분기 이후 가장 작은 초과 폭이었습니다.\n현재 S&P 500의 84%가 재무 보고서를 발표했으며, 주당 순이익의 84%가 기대치를 초과했습니다. 기대에 미치지 못한 기업의 주가는 평균 1.1% 하락하는데 그쳤는데, 이는 최근 5년간 3.1%보다 낮은 수준이다.\n지난 목요일 기술주는 2020년 이후 최악의 날을 보냈습니다. 시장은 민주당 집권 이후 규제 강화 전망과 AI 인프라 및 데이터 센터 확장 전망을 우려했습니다."},{"s":"나가사키 기타요다이와 나가사키 미나미야마가 결승 진출에 고교 럭비 나가사키현 예선","so":"毎日新聞","tm":"11/09 12:08","c":1,"r":"jp","u":"https://mainichi.jp/articles/20261109/k00/00m/310/041000c","p":1794193697,"a":1794195183,"t":"長崎北陽台と長崎南山が決勝進出へ 高校ラグビー長崎県予選","su":"제106회 전국 고교 럭비 대회(매일 신문사 등 주최) 나가사키현 예선은 8일, 오무라시 모리조노마치의 현영 방호원 럭비장에서 준결승 2 시합이 있어, 나가사키 기타요다이가 99-0으로 나가사키 북을, 나가사키 남산이 26-24로 나가사키공을 각각 내리고, 결승"},{"s":"독일인 82%, 메르츠 총리 정권에 불만족, 취임 이후 최고치","so":"鉅亨網","tm":"11/09 12:04","c":1,"r":"tw","u":"https://m.cnyes.com/news/id/6652468","p":1794193485,"a":1794195213,"t":"82%德國人對總理梅爾茨執政不滿 執政以來新高","su":"독일인의 82%는 메르츠 총리의 집권에 불만족스러워했는데, 이는 총리 취임 이후 최고치다. Juheng.com과 Zhong Yongxiang이 편집했습니다. 종합외국뉴스. 지난 7일 독일 언론이 발표한 여론조사에 따르면, 조사 대상 독일인의 82%가 메르츠 총리의 집권에 불만족스러워하는 것으로 나타났다. 이 비율은 그가 취임한 이후 새로운 최고치다. 독일 신사회문제연구소의 여론조사 결과에 따르면 메르츠의 집권 성과에 대해 질문했을 때 응답자의 82%가 불만족스러운 것으로 나타났습니다. 이는 10월 초 이전 여론조사보다 2%포인트 증가한 수치입니다. 응답자의 13%만이 만족했습니다. 연초와 비교해 독일인의 메르츠에 대한 불만은 크게 높아졌다. 올해 1월 응답자의 67%는 그의 직무 수행에 불만족했고, 24%는 찬성했다."},{"s":"버핏과 애크먼도 비슷한 경고를 내립니다! 이제 투자자들은 무엇을 해야 할까요?","so":"鉅亨網","tm":"11/09 12:00","c":1,"r":"tw","u":"https://news.cnyes.com/news/id/6652473","p":1794193206,"a":1794195214,"t":"巴菲特和阿克曼發出相似警告！投資者現在該做什麼？"},{"s":"대만 주식이 좋은데, 미국 주식도 놓치지 마세요! 펀드 대모 Xiao Biyan: \"풍수는 교대로 진행해야 한다\", \"시장, 폭, 성과\"라는 주식 선택 사고방식을 마스터해야 함","so":"TVBS新聞網","tm":"11/09 11:54","c":1,"r":"tw","u":"https://news.tvbs.com.tw/money/4047768","p":1794192840,"a":1794195216,"t":"台股好，美股也別錯過！基金教母蕭碧燕：「風水要輪流轉」掌握「市、寬、績」選股心法","su":"대만 주식은 최근 AI 공급망 강화로 수혜를 입어 많은 투자자들의 관심을 끌었다. 펀드 대모 Xiao Biyan은 TVBS '금융 권력' 프로그램에서 사람들이 대만 주식의 뛰어난 성과 때문에 미국 주식에 투자할 필요가 없다고 느낄 수 있다고 상기시켰습니다. 그러나 시장 회전은 예측하기 어렵고 \"풍수는 차례대로 진행되어야 합니다.\" 다른 시장의 기회를 살펴볼 수도 있습니다. 그녀는 대만 주식을 급하게 팔 필요가 없다고 제안했다. 개인 상황에 따라 매달 신규 투자 자금을 조정하고 점차적으로 해외 시장에 통합할 수 있습니다."},{"s":"보도자료 : 11월 8일 「좋은 치아의 날」, 개 고양이의 이빨을 “가르치는 사람”을 기르는 인정 강좌가 접수 개시(PR TIMES)","so":"毎日新聞","tm":"11/09 11:53","c":1,"r":"jp","u":"https://mainichi.jp/articles/20261109/pr2/00m/020/157000c","p":1794192783,"a":1794195186,"t":"プレスリリース：11月8日「いい歯の日」、犬猫の歯みがきを“教える人”を育てる認定講座が受付開始（PR TIMES）","su":"―수의사·독 트레이너·치과 위생사가 지도. 3세 이상의 개의 약 80%에 치주병 등의 구강 질환이 보인다는 과제에 도전한다"},{"s":"월스트리트와 경쟁하다 - Wen Jie | 정책 리스크 증가, AAOI의 장기 전망은 변함 없음(영화 포함) | 특별 주제 - 뉴스","so":"etnet 經濟通","tm":"11/09 11:44","c":1,"r":"hk","u":"https://www.etnet.com.hk/www/tc/news/news-article.php?section=features&category=interview&newsid=415928","p":1794192240,"a":1794195198,"t":"比拼華爾街－溫傑 | 政策風險上升，AAOI長期前景未變（有片） | 專題透視 - 新聞","su":"월스트리트와 경쟁하다 - Wen Jie | 정책 리스크 높아져, AAOI의 장기 전망은 변함없다(필름 포함) 최근 조정 끝에 지난 금요일(6일) 자금이 일시적으로 인공지능(AI)과 칩주에 복귀하면서 필라델피아 반도체 지수(페이반)가 4.2% 반등했다. 그러나 미국 3대 주가지수는 S&P 500과 나스닥이 각각 1.1%, 0.3% 하락한 반면 다우존스산업평균지수는 0.5% 하락하는 등 또다시 서로 다른 흐름을 보였다. 일주일 내내 반도체 부문은 여전히 ​​큰 폭으로 하락했으며, 비용은 12.2% 감소했다. Blue Wave가 AI 인프라 기대에 미치는 영향 지난주 AI 컨셉주가 급락한 이유는 미국 중간선거에서 비롯됐다. 민주당은 뜻밖의 '블루 웨이브'를 일으키며 상하원 장악력을 탈환했다. 특히 텍사스 주지사의 변화는 주목할 만하다."},{"s":"AI 버블 | 엔비디아의 미국 주식은 시간외 거래에서 급락했으며 하락 폭은 4% 이상으로 확대되었습니다.","so":"etnet 經濟通","tm":"11/09 11:34","c":1,"r":"hk","u":"https://www.etnet.com.hk/www/tc/us-stocks/news-article/415921/AI%E6%B3%A1%E6%B2%AB+%7C+%E8%8B%B1%E5%81%89%E9%81%94%E7%BE%8E%E8%82%A1%E7%9B%A4%E5%BE%8C%E4%BA%A4%E6%98%93%E6%99%82%E6%AE%B5%E5%A4%A7%E8%B7%8C%EF%BC%8C%E8%B7%8C%E5%B9%85%E6%93%B4%E8%87%B3%E9%80%BE4%25","p":1794191681,"a":1794195200,"t":"AI泡沫 | 英偉達美股盤後交易時段大跌，跌幅擴至逾4%","su":"최신 미국 주식 시장 뉴스 및 정보를 제공하여 주식 시장 동향을 파악할 수 있습니다. 당신이 투자자이거나 주식시장에 관심이 있는 사람이라면 주식시장 동향과 투자 동향을 이해하는 데 도움이 되는 실시간 주식시장 차트, 전문가 분석, 기업 뉴스 리포트 등 풍부한 콘텐츠가 여기에 있습니다. 지금 검색하여 최신 미국 주식 정보를 마스터하고 독점 보고서와 전문 분석을 즐겨보세요. | 미국 주식 뉴스 | 에트넷 이코노믹 익스프레스"},{"s":"이용철, '공소취소' 질문에 \"진상규명 집중...나머진 법과 원칙으로\"","so":"YTN","tm":"11/09 11:28","c":1,"r":"kr","u":"https://www.ytn.co.kr/_ln/0103_20261 rystal International 구매를 권장합니다. 초록 면책 조항 이 콘텐츠는 기존 시장 데이터 및 뉴스 소스를 기반으로 인공 지능에 의해 생성되었으며 참고용입니다. 해당 내용은 \"Economics\"의 견해나 입장을 대변하지 않으며, 어떠한 투자 조언도 구성하지 않습니다. AI가 생성한 정보에는 오류, 누락, 일탈 등이 있을 수 있으므로, 투자 결정을 내리기 전에 사용자가 직접 해당 내용을 확인하거나 전문가의 조언을 구해야 합니다. \"이코노믹스\"는 본 내용을 신뢰하여 발생하는 어떠한 손실이나 손해에 대해서도 책임을 지지 않습니다."},{"s":"19개 아랍 정당이 아이젠코트를 지지해 네타냐후를 곤경에 빠뜨렸다","so":"公視新聞","tm":"11/09 10:00","c":1,"r":"tw","u":"https://news.pts.org.tw/article/834590","p":1794186000,"a":1794195258,"t":"阿拉伯政黨19席挺艾森科特 納坦雅胡陷困境","su":"선거 후 이스라엘 내각 구성의 진전 측면에서 야당 지도자 아이젠코트는 의회 120석 중 절반 이상인 아랍 정당 합동목록(Joint List of Arab Party)을 포함해 총 67명의 의회 의원으로부터 추천을 받았다. 네타냐후 총리는 46석을 얻었다. 그러나 67석 추천이 연립정부 구성을 의미하는 것은 아니다. 공동명단에는 정부 외부 지원 의지는 있지만 내각 참여 의사는 없다고 명시돼 있기 때문이다. 병역, 종교, 안보 정책에 있어서도 정당 간에는 분명한 차이가 있습니다. 헤르조그 대통령은 추가 협의가 진행될 것이며 내각을 구성할 후보자가 8일 공식적으로 지정될 것으로 예상된다고 말했습니다."},{"s":"은시전기차신소재(06128)가 리튬전지 소재업체를 1억 달러 투자에 매각했고, 인수자는 현금과 주식배당으로 대금을 지불했다.","so":"etnet 經濟通","tm":"11/09 09:43","c":1,"r":"hk","u":"https://www.etnet.com.hk/www/tc/news/news-article.php?section=categorized&category=latest&newsid=20261109183","p":1794184980,"a":1794195246,"t":"烯石電車新材料(06128)售鋰電池材料公司涉資1億美元，買方以現金及配股支付","su":"2026-09-11 08:43 그래펙스 전기차신소재(06128)가 리튬전지 소재업체를 1억 달러 투자에 매각했고, 매수자는 현금과 주식배당금으로 지급했다. Graphex Electric Vehicle New Materials(06128)는 인수자인 M2i Global과 총 1억 달러 규모의 자회사 Graphex Technologies LLC 매각에 관한 최종 계약을 체결했다고 발표했습니다. 대가는 3단계에 걸쳐 지급됩니다. 계약 체결이 완료되면 구매자는 3000만 달러를 먼저 지불하고, 이 중 300만 달러는 현금으로 지불하게 된다. 구매자는 이를 위해 노트를 발행하고 나머지 2,700만 달러는 주당 3달러의 대가 주식 형태로 지급됩니다. Enshi Electric Vehicle New Materials는 구매자에게 비용을 지불하고 당사자가 공장의 기본 설계를 전달하고 구매자가 설계를 수락한 후 구매자는 주당 미화 3달러의 가격으로 3천만 달러를 유상 주식 형태로 지불하게 됩니다. 공장이 완공되고 생산 승인을 받은 후, 구매자는 주당 미화 4달러의 대가 지분 형태로 Enshi Tram New Materials에 미화 4천만 달러를 지불하게 됩니다."},{"s":"영국 정부는 2030년 EV 판매 목표를 60%로 줄일 것으로 예상된다고 Guardian은 보고했습니다.","so":"Reuters","tm":"11/09 08:25","c":1,"r":"us","u":"https://www.reuters.com/world/uk/uk-government-expected-cut-2030-ev-sales-target-60-guardian-reports-2026-11-08/","p":1794180343,"a":1794195233,"t":"UK government expected to cut 2030 EV sales target to 60%, Guardian reports"},{"s":"iM증권 \"美블루웨이브 이차전지엔 기회\"…'비중확대' 권고 |","so":"연합인포맥스","tm":"11/09 08:08","c":1,"r":"kr","u":"https://news.einfomax.co.kr/news/articleViewAmp.html?idxno=4443665","p":1794179333,"a":1794195231,"su":"iM증권 \"美블루웨이브 이차전지엔 기회\"…'비중확대' 권고 \"데이터센터 규제, 전력·ESS 수요 키운다\"…삼성SDI 최선호 (서울=연합인포맥스) 정원 기자 = iM증권이 미국 중간선거 이후 불거진 데이터센터 규제 우려가 이차전지 업종에는 오히려 기회가 될 수 있다며 투자의견을 '중립'에서 '비중확대'로 상향 조정했다. 최선호주는 삼성SDI를 차선호주에는 LG에너지솔루션을 제안했다. 정원석 iM증권 연구원은 9일 보고서에서 \"정책의 핵심은 전력과 용수, 환경 부담이 주민에게 전가되지 않도록 사업자의 책임을 강화하는데 있다\"며 \"특히 가스터빈의 공급 제약과 운영 비용 절감 등을 고려하면 가스발전과 '태양광+에너지저장장치(ESS)'를 병행하는 구조가 확대될 가능성이 높다\"고 강조했다."},{"s":"AI 개발과 대학 교육|AI가 고용에 영향을 미친다. 대학 과정에서 인턴십이 필수인가요? ｜새로운 경험을 배워보세요","so":"TVB","tm":"11/09 07:50","c":1,"r":"hk","u":"https://news.tvb.com/tc/1204900-AI%E7%99%BC%E5%B1%95%E8%88%87%E5%A4%A7%E5%AD%B8%E6%95%99%E8%82%B2AI%E8%A1%9D%E6%93%8A%E5%B0%B1%E6%A5%AD%E5%A4%A7%E5%AD%B8%E8%AA%B2%E7%A8%8B%E6%87%89%E5%90%A6%E5%BC%B7%E5%88%B6%E5%AF%A6%E7%BF%92%E5%AD%B8%E7%BF%92%E6%96%B0%E9%AB%94%E9%A9%97","p":1794178200,"a":1794195249,"t":"AI發展與大學教育｜AI衝擊就業 大學課程應否強制實習？｜學習新體驗","su":"인공지능(AI)의 급속한 발전으로 대졸자에게 적합한 신입사원 구인은 크게 줄어들고, 청년층의 취업난은 더욱 커지고 있다. 입법회의 일부 구성원은 AI 개발이 취업 시장에 미치는 영향에 대응하기 위해 대학 학부 과정에 최소 1년의 인턴십이 포함되어야 한다고 제안했습니다. 조세핀 최 교육부 장관은 단순히 인력 부족 때문에 커리큘럼을 개편한다면 인턴십 의무화는 학생들의 수업 시간과 연구 시간을 단축할 뿐만 아니라, 교과 특성과 학생 요구에 따라 교육 과정을 설계하는 기관의 능력도 약화시킬 것이라고 답했습니다."},{"s":"Hongchen, 산업연구소와 손잡고 NASA 항공우주 배터리 세미나 참석 - 비즈니스 정보","so":"工商時報","tm":"11/09 07:00","c":1,"r":"tw","u":"https://www.ctee.com.tw/news/20261109700014-431202","p":1794175200,"a":1794177868,"t":"泓辰攜手工研院登上NASA航太電池研討會- 商情","su":"美國國家航空暨太空總署(NASA)訂於11月17日至19日在美國阿拉巴馬州舉辦「2026 NASA Aerospace Battery Workshop」，將有來自全球7個國家，33場專題演講；NASA航太電池研討會是全球航太與頂級電池技術領域，最具權威與指標性的年度技術盛會，堪稱全球航太電池領域的..."},{"s":"올거야! 곤드와나 : 아프리카, 남미에서 강해지는 자원 내셔널리즘","so":"週刊エコノミスト Online","tm":"11/09 05:04","c":1,"r":"jp","u":"https://weekly-economist.mainichi.jp/a "tw","u":"https://news.pts.org.tw/article/834830","p":1794140670,"a":1794145920,"t":"詐騙集團假做電商送優惠 欲拐民眾LINE口座","su":"온라인으로 물건을 구매할 때 조심하세요. 사람들을 속이는 새로운 방법이 있습니다. 갱스터는 [가짜 전자 상거래, LINE을 추가하면 [할인 쿠폰 3개]를 받을 수 있다고 말합니다. 가입 후 티켓을 빼앗깁니다. 사람들을 속이는 [가짜 경매, 가짜 [서비스 직원]이 있습니다. [QR 코드 스캔, 사람들의 티켓/돈세탁 언급, 대중에게 호소/주의를 기울이는 것을 좋아합니다. 매년 열리는 더블11 쇼핑 페스티벌이 곧 다가오고, 전자상거래 업체들은 프로모션과 할인 행사를 잇달아 내놓고 있다. 사람들은 더 많은 상품을 구매할 기회를 갖게 될 것이며, 사기 집단도 기회를 이용하여 움직일 것입니다."},{"s":"20261108 공영 텔레비전 저녁 뉴스 전체 버전 (온라인 저작권 보호 콘텐츠 제외) ｜ 미국 싱크 탱크, 중국에 침묵 군사 훈련 시작 경고 IPAC는 대만 해협의 평화를 초국가적 우선 순위로 지정","so":"公視新聞","tm":"11/08 20:54","c":1,"r":"tw","u":"https://news.pts.org.tw/video/23020","p":1794138891,"a":1794145920,"t":"20261108 公視晚間新聞 完整版（無網路版權內容除外）｜美智庫示警中共發動無聲軍演 IPAC列台海和平為跨國優先行動","su":"자세한 뉴스 콘텐츠를 보려면 [공영 텔레비전 뉴스 네트워크] https://news.pts.org.tw를 방문하세요. - 대만 공영 텔레비전 뉴스부에서 제작 및 방송하며 매일 정확한 실시간 뉴스 콘텐츠와 다양한 관점을 제공합니다. 온라인 중계권 제한으로 인해 영화 풀버전의 내용은 TV버전과 다소 다를 수 있습니다. ■ [공영 텔레비전 뉴스 네트워크 FB] 좋아요 https://www.facebook.com/pnnpts ■ 구독 [공영 텔레비전 뉴스 네트워크 I..."},{"s":"일본 기상청은 일본 규슈·도카이 지역에서 잇따라 발생한 지진이 난카이 해구의 강한 지진과 관련이 있다는 사실을 부인했다.","so":"公視新聞","tm":"11/08 20:31","c":1,"r":"tw","u":"https://news.pts.org.tw/article/834836","p":1794137464,"a":1794145920,"t":"日本九州與東海地區連環地震 氣象廳否認與南海海槽強震相關","su":"지난 8일 일본에서 잇따른 지진이 발생했다. 이날 오전 1시쯤 시즈오카현 서부 도카이 지방에서 규모 5.7의 지진이 발생했다. 아이치현에서는 최대 강도가 ​​5에 도달했습니다. 아이치현과 시즈오카현에서는 최소 27명이 부상당했다. 낮 11시쯤 구마모토현에서도 규모 4.3의 지진이 발생했다. 다행히도 두 지진 모두 쓰나미 위기를 촉발하지 않았습니다."},{"s":"가오슝 대기오염 방지 시위, 시장 후보들에게 PM2.5 농도 낮추기 노력 촉구","so":"公視新聞","tm":"11/08 20:28","c":1,"r":"tw","u":"https://news.pts.org.tw/article/834835","p":1794137295,"a":1794145920,"t":"高雄反空污遊行 籲市長候選人承諾降PM2.5濃度","su":"남부대기오염방지연합은 오늘(8일) 센트럴파크에서 시청까지 걸어가며 대기오염 퇴치, 숲 보호, 가오슝 살리기의 염원을 담은 행진을 시작했습니다. 그들은 모든 시장 후보들에게 다음 임기 동안 가오슝의 PM2.5 농도를 대폭 낮추고 국가적으로 개정된 법적 기준인 입방미터당 12마이크로그램에 도달하도록 노력할 것을 촉구했습니다. 매년 가을에는 중국 이남에서도 여러 노동계와 사회운동 단체가 공동으로 주최하는 집회와 시위가 열려 대기오염 방지 운동을 지지하고 있다."},{"s":"주식시장 안정을 위해 11월 9일 5차례 항공금지 조치를 시행했고, 시장 보호를 위해 5000억 국가안보기금이 시장에 진입했다.","so":"公視新聞","tm":"11/08 20:22","c":1,"r":"tw","u":"https://news.pts.org.tw/article/834834","p":1794136952,"a":1794145920,"t":"11/9起祭5項禁空令穩定股市 5千億國安基金進場護盤","su":"AI 전망에 대한 우려로 대만 증시는 지난 6일 엄청난 붕괴를 겪었다. 한때 장중 3,700포인트 이상 급락해 역사상 최대 장중 하락 및 일일 충격 기록을 세웠습니다. 지난 달 지수는 약 10,000포인트 하락했습니다. 정부는 주식시장을 안정시키고 9일 5대 시장안정대책을 내놨다. 공매도 주문이 시작됐고, 시장을 보호하기 위해 5000억 국가 안보 기금이 출시됐다. 업계에서는 시장 패닉 영향을 완화할 수 있을 것으로 기대하고 있다. 게다가 지난 6일에는 대만 주식 조달이 급락하고 미국 증시는 반등했다. 9일 대만 증시 실적은 각계각층의 관심을 끌었다."},{"s":"가족들은 이 10대가 사기를 당한 혐의를 받고 결국 해외로 갔다고 말했다. 몸값 60만 달러를 요구했고, 관련 부대가 그를 구출하는 데 도움을 주기를 바랐다.","so":"公視新聞","tm":"11/08 20:18","c":1,"r":"tw","u":"https://news.pts.org.tw/article/834832","p":1794136692,"a":1794148491,"t":"家屬稱少年疑受騙淪落海外 遭索60萬贖金盼相關單位協助救人","su":"타이중의 한 어머니는 아들이 올해(2026년) 9월 초 친구들과 함께 북쪽으로 여행을 가겠다고 말했지만 그 이후로 연락이 끊길 줄은 몰랐다고 말했다. 어머니는 휴대전화로 위치를 추적한 결과 그가 태국 방콕에 있는 것으로 확인됐다. 그러다가 그는 밀수꾼 단체로부터 20만 위안에서 60만 위안 사이의 몸값을 요구하는 메시지를 받았다. 이제 가난에서 탈출한 또 다른 사람은 미얀마 공원에서 수상한 십대의 모습을 봤다며 어머니를 걱정하게 만들고 관련 부서에서 사람들을 구출할 수 있기를 바란다고 말했습니다."},{"s":"Li Sichuan은 Lao Fu의 법률에 반대 서명하지 않은 Zhuo Rongtai를 비난했습니다. Su Qiaohui는 이를 강제로 통과시키는 것은 위헌이라고 말했습니다.","so":"公視新聞","tm":"11/08 20:06","c":1,"r":"tw","u":"https://news.pts.org.tw/article/834807","p":1794136001,"a":1794148492,"t":"李四川批卓榮泰不副署老福法 蘇巧慧稱強行通過違憲","su":"9대 1 총선이 막바지에 접어들면서 곳곳에서 총리 선거에도 연기가 피어오르고 있다. 신베이시 국민당 리 쓰촨(Li Sichuan) 인민당 주석과 황궈창(Huang Guochang) 인민당 주석이 다시 한 번 연합하여 청백의 기세를 만들어냈습니다. DPP Su Qiaohui는 오늘 밤 Xiao Meiqin 부주석에게 투표 통합을 도와달라고 요청할 것입니다. 그러나 Zhuo Rongtai 행정주석은 노인복지법 개정안에 반대 서명하지 않았습니다. Li Sichuan은 Zhuo Rongtai에게 말을 할 수 없다고 Su Qiaohui를 비난했습니다. 두 사람 모두 신베이시 원로들에게 사과해야 합니다. 쑤차오후이는 이에 맞서 법안이 위헌적으로 통과되도록 강요하고 거버넌스를 몰아내며 예산 논의가 헌법 정신으로 돌아갈 것을 촉구했습니다."},{"s":"침대 센서 시스템의 개발 PM【후지사와】◆대형 종합 부품 메이커/연봉 1,000만엔～","so":"日経転職版","tm":"11/08 18:20","c":1,"r":"jp","u":"https://career.nikkei.com/agent/170/jobdetail5420406/","p":1794129621,"a":1794148486,"t":"ベッドセンサーシステムの開発PM【藤沢】◆大手総合部品メーカー／年収1,000万円～"},{"s":"칫솔은 상자에 넣어도 괜찮나요? 전문가들이 밝히는 \"3가지 규칙\": 최대 1개월 동안 휴대용 칫솔을 사용하세요 - 국제","so":"中時新聞網","tm":"11/08 18:01","c":1,"r":"tw","u":"https://www.chinatimes.com/realtimenews/20261108002190-260408","p":1794128467,"a":1794148494,"t":"牙刷放進盒子就沒事？專家揭「3大守則」 攜帶型牙刷最多用1個月- 國際","su":"휴대가 간편한 칫솔로 이동 중에 사용할 때나 직장에서 점심 식사 후 이를 닦을 때 매우 실용적입니다. 그런데 이런 종류의 칫솔을 제대로 세척하고 있나요? 어떤 사람들은 집에서 사용하는 칫솔을 정기적으로 바꾸지만, 휴대용 칫솔은 자주 사용하지 않고 더 오래 사용할 수 있다고 생각합니다. 일본 마이니치방송(MBS) 투데이"},{"s":"투자 넘어 수주·양산으로…LFP 양극재 사업화 속도","so":"이투데이","tm":"11/08 17:34","c":1,"r":"kr","u":"https://www.etoday.co.kr/news/view/2645037","p":1794126840,"a":1794128040,"su":"엘앤에프, 국내 셀 3사 고객사 확보…9월부터 양산포스코퓨처엠, 기존 설비 전환·전용공장 건설 병행북미 ESS 성장에 비중국산 소재 확보 수요 확대▲엘"},{"s":"금주의 사건/행정부는 '노인복지법'에 반대하지 않고 민주당이 미국 중간선거에서 승리(2026.11.2~11.8)","so":"公視新聞","tm":"11/08 17:13","c":1,"r":"tw","u":"https://news.pts.org.tw/article/834805","p":1794125585,"a":1794128040,"t":"一週大事／行政院不副署《老人福利法》 美期中選舉民主黨勝選（2026.11.2-11.8）","su":"\"PSTV 뉴스 네트워크\"는 이번 주 국내외 주요 행사를 선정해 드립니다. 초점은 다음과 같습니다: 정치 위안부가 \"노인복지법\" 개정안에 반대 서명하지 않음, 두 번째 F-16V 전투기가 대만에 도착함, Gao Jin Sumei가 공산당 간첩 사건에 연루되어 기소되어 14년 형을 선고받았음, 대만 주식 시장이 시장에서 최대 하락세를 기록함, Yongfeng 은행 계좌가 해킹됨, 대만 64호선 패킷 손실 사건의 운전사가 형을 선고받았음. 13년 만에 미국 중간선거에서 민주당이 승리했다."},{"s":"9년 전 산시성(陝西省)에서 호주로 가던 음식 배달 기사가 노숙자에게 칼에 찔려 사망했다. 중국 커뮤니티는 충격을 받았습니다 | 본토 팩스 | 양안","so":"UDN","tm":"11/08 16:57","c":1,"r":"tw","u":"https://udn.com/news/story/7332/9864712?from=udn-catelistnews_ch2","p":1794124641,"a":1794128040,"t":"9年前從陝西赴澳洲外賣騎手被流浪漢捅死華人圈震驚| 大陸傳真| 兩岸","su":"중국 음식 배달 기사 펑젠밍(47)씨가 호주 멜버른에서 음식을 배달하던 중 51세 노숙자에게 칼을 찔려 숨진 혐의를 받고 있다. 이번 사건은 국내외 중국인 커뮤니티를 충격에 빠뜨렸다. 많은 현지 중국인들이 고인을 추모하며 꽃을 바쳤습니다. 멜버른 주재 중국 총영사관은 호주가 이번 사건에 대해 철저한 조사를 실시하고 엄중히 처벌할 것을 요구했다. 사건이 발생한 빅토리아 주지사도 충격을 표하며 살인범을 엄중히 처벌할 것이라고 말했다. Feng Nan은 중국에 있는 가족의 생계를 유지하기 위해 호주에서 9년 동안 열심히 일했습니다. 그는 아침부터 밤까지 음식을 배달하는 일을 한다. 지역 상점에서는 모금 행사를 시작했습니다. 한 점원은 너무 겁에 질려 현지 치안 환경이 불안하다며 중국으로 돌아가기 위해 밤새 비행기표를 샀다."},{"s":"이스라엘 대통령, 야당 지도자 아이센코트에게 정부 구성 승인 발표","so":"公視新聞","tm":"11/08 14:23","c":1,"r":"tw","u":"https://news.pts.org.tw/article/834797","p":1794115412,"a":1794128040,"t":"以色列總統宣布 授權反對派領袖艾森科特組閣","su":"이스라엘 총선 이후 여당은 과반수 확보 없이 교착상태에 빠졌다. 헤르조그 현 이스라엘 대통령은 지난 7일 새 정부 구성을 위해 전 참모총장인 야당 지도자 아이젠코트에게 우선권을 주겠다고 공식 발표했다. 네타냐후 총리는 즉각 긴급성명을 발표해 연립정부 수립을 촉구하고, 야당이 정부를 구성하면 국가안보를 위협할 것이라고 경고했다."},{"s":"일본의 새로운 세금 환급 시스템 | 새로운 절차는 아직 조정이 필요합니다. 최종 세금 환급금이 현금으로 손실되어 승객이 불만을 나타냄","so":"Now 新聞","tm":"11/08 14:18","c":1,"r":"hk","u":"https://news.now.com/home/international/player?newsId=668776","p":1794115118,"a":1794128040,"t":"日本退稅新制｜新手續尚待適應 旅客不滿現金退稅蝕尾數","su":"[나우뉴스채널] 일본의 새로운 세금환급 제도가 시행된 지 일주일이 지났지만 여권, 신용카드 인증 실패 등 운영상의 문제가 여전히 많다. 많은 관광객들은 새로운 시스템 하에서 높은 처리 수수료와 나머지 금액에서 현금 환불이 차감된다는 사실에 불만을 갖고 있습니다."},{"s":"COP31明登場 環境部將舉辦系列論壇","so":"自由時報","tm":"11/08 14:11","c":1,"r":"tw","u":"https://news.ltn.com.tw/news/life/breakingnews/5633488","p":1794114706,"a":1794177868,"su":"COP31將於明天登場，環境部將同步啟動「氣候脈動．台灣同行」系列論壇，每場論壇將特別安排COP31現場快報，將自土耳其連線傳回最新動態，以讓國人掌握最新情報，將國際氣候議題實質轉化為國內政策與產業轉型契機。2026年第31屆聯合國氣候變化綱要公約締約方大會 （UNFCCC COP31） 將於9日至20日在土耳其安塔利亞舉行，環境部表示，今年COP31將以「從承諾走向落實」為核心，推動各國執行國家自定貢獻，並提出2035年量化目標，包括全球電氣化比例達35%；全球廢棄物產生量的成長幅度減半；建築部門能源消耗密集度至少降低25%。"},{"s":"타이중에서 SUV 차량 운전자가 정지하지 않아 사고를 냈습니다. 한 여성이 줄을 건너던 중 부상을 입어 심각한 부상을 입어 사망했습니다.","so":"公視新聞","tm":"11/08 14:09","c":1,"r":"tw","u":"https://news.pts.org.tw/article/834798","p":1794114594,"a":1794128040,"t":"台中休旅車駕駛未停讓肇事 婦人行穿線遭輾傷重不治","su":"어제(7일) 저녁 6시쯤, 타이중시 시툰구에서 치명적인 교통사고가 발생했습니다. 61세 여성이 횡단보도를 건너다가 신호등이 녹색으로 바뀌자 좌회전하는 SUV 차량에 치였습니다. 운전자도 눈치 채지 못한 것 같습니다. 그 결과 앞바퀴와 뒷바퀴가 차례로 여성을 덮쳐 심각한 부상을 입어 사망했다. 경찰 예비 조사 결과, 운전자의 음주 및 약물 검사에서는 이상이 없는 것으로 나타났으며, 자세한 사고 원인은 아직 밝혀지지 않았다."},{"s":"펑지아 야시장에서 한 관광객의 배낭에 불이 붙었고, 모바일 전원 공급 장치의 리튬 배터리가 사고 원인으로 의심됩니다.","so":"公視新聞","tm":"11/08 14:06","c":1,"r":"tw","u":"https://news.pts.org.tw/article/834799","p":1794114387,"a":1794128040,"t":"逢甲夜市遊客背包起火 疑行動電源鋰電池肇禍","su":"타이중 펑지아 야시장에서는 어젯밤(7일) 한 관광객의 배낭에 불이 붙었는데, 내부에 있던 리튬 배터리가 불탔던 것으로 의심됩니다. 다행히 인근 상인이 공용 건조분말소화기를 가져와 진화에 성공해 인명피해는 없었다. 그러나 일부 전문가들은 건조 분말 소화기가 리튬 배터리나 이동식 전원 공급 장치로 인한 화재를 진압하는 데 적합하지 Cell) 미드솔 기술을 적용해 쿠셔닝 성능과 에너지 피드백을 향상시켰으며, ENCAP의 안정성도 결합했다."},{"s":"의견 | 메탄 규제와 기후 논쟁","so":"WSJ","tm":"11/07 01:03","c":1,"r":"us","u":"https://www.wsj.com/opinion/methane-regulations-and-the-climate-debate-70e14c5a","p":1793980980,"a":1794007140,"t":"Opinion | Methane Regulations and the Climate Debate"},{"s":"Zhida Technology, 태국 최초의 해외 스마트 에너지 솔루션 출시: 현지 제조 및 시나리오 역량을 통해 태국의 국가 에너지 전환 지원","so":"經濟日報","tm":"11/07 01:01","c":1,"r":"tw","u":"https://money.udn.com/money/story/123828/9863045","p":1793980895,"a":1794007140,"t":"摯達科技泰國首發海外智慧能源解決方案：以本土製造與場景能力服務泰國國家能源轉型","su":"촌부리, 태국, 2026년 11월 6일 /PRNewswire/ -- 11월 6일, Zhida Technology(02650.HK)는 태국 촌부리에서 해외 AI 스마트 에너지 솔루션 및 충전 로봇 제품 출시 행사를 열었습니다. 이 회사는 태국에서 가정 및 공공 현장을 위한 스마트 에너지 솔루션을 공식 출시했으며 최초의 메가와트급 유연한 액체 냉각식 충전 파일을 출시했습니다. 같은 날, 태국에서 관련 제품과 서비스를 홍보하기 위해 여러 파트너와 전략적 협력을 체결했습니다. 태국 촌부리에서 열린 Zhida Technology 기자간담회. 이번 기자간담회에는 인도네시아, 말레이시아, 라오스, 스리랑카, 캄보디아 및 기타 동남아시아 및 중동 국가의 고객과 파트너가 참석했습니다. 회사는 시나리오 솔루션과 신제품 출시를 위해 태국을 선택한 것은 태국을 깊이 육성하고 현지 녹색 에너지 전환에 봉사하겠다는 의지를 반영한다고 밝혔습니다. Zhida는 보다 완벽한 제품 매트릭스와 \"가정 + 공공\" 전체 시나리오 적용 범위 기능을 통해 현지 가족, 운영자, 공원 및 상업 단체를 위한 통합 녹색 에너지 솔루션을 제공하고 더 많은 파트너와 협력하여 태국의 녹색 여행 생태계를 구축할 것입니다. 태국 최초의 전문 충전 파일 공장으로 이중 카테고리 시장 점유율 1위를 차지했습니다. Zhida의 태국 현지 레이아웃은 2022년부터 시작됩니다. 중국과 태국의 신에너지 산업 간의 시너지를 배경으로 Zhida는 태국을 최초의 종합 해외 목적지로 만들 것입니다."},{"s":"SNE리서치: 중국 OEM이 글로벌 EV 배터리 시장 장악","so":"electrive.com","tm":"11/06 22:30","c":1,"r":"us","u":"https://www.electrive.com/2026/11/06/sne-research-chinese-oems-increasingly-dominate-global-ev-battery-market/","p":1793971800,"a":1793974680,"t":"SNE Research: Chinese OEMs increasingly dominate global EV battery market","su":"올해 첫 9개월 동안 중국 제조업체는 중국 이외의 전기 및 하이브리드 차량용 배터리 시장의 절반 이상을 확보했습니다."},{"s":"닝더타임스 03750 샤오미 01810 ｜ 대가족들은 추세를 거스르고 2억 상당의 물품을 구입하여 베이수이와 철수 및 유통 경쟁을 벌였다 | 홍콩경제신문","so":"香港經濟日報HKET","tm":"11/06 20:17","c":1,"r":"hk","u":"https://invest.hket.com/article/4218872/01810-xiaomi-03750-catl-northbound-capital-flow","p":1793963820,"a":1793974680 :1794191915,"a":1794195277,"t":"【金價走勢】高盛調低2026年及2027年金價預測 今年底料見4150美元"},{"s":"이온어스, 美 THOR Energy와 북미 ESS 시장 공략","so":"전기신문","tm":"11/09 11:25","c":1,"r":"kr","u":"https://www.electimes.com/news/articleViewAmp.html?idxno=374518","p":1794191140,"a":1794195264,"su":"이온어스, 美 THOR Energy와 북미 ESS 시장 공략 빅스포서 이동형·컨테이너형 ESS 협력 MOU 텍사스서 실증 거쳐 중남미까지 사업 확대 추진 국내 레퍼런스 바탕으로 해외 사업 기회 모색 이동형 에너지저장장치(ESS) 전문기업 이온어스가 미국 텍사스의 에너지 프로젝트 개발 기업과 손잡고 북미 시장 문을 두드린다. 국내에서 다진 이동형 전력 공급 사업 경험을 미국 현지 실증으로 검증한 뒤 중남미까지 무대를 넓히겠다는 구상이다."},{"s":"보도자료 : RENON POWER, 저압 계통용 축전지 누계 수주 1,500사이트 돌파(PR TIMES)","so":"毎日新聞","tm":"11/09 11:22","c":1,"r":"jp","u":"https://mainichi.jp/articles/20261109/pr2/00m/020/112000c","p":1794190977,"a":1794195267,"t":"プレスリリース：RENON POWER、低圧系統用蓄電池の累計受注1,500サイト突破（PR TIMES）","su":"2026년 말 누계 수주 목표 1,000사이트를 앞당겨 달성, 약 75MW/300MWh의 수주 규모에 미국발의 축전지 메이커 RENON POWER 주식회사(이하 「RENON POWER」)는, 저압 계통용 축전지 패키지의 누계 수주수가 1,500사이트를 돌파한 것을 알렸습니다. 당사는 2026"},{"s":"에코 가죽, 계통용 축전지 사업이 본격 가동 페이즈에. 전국 11개소의 계통용 축전소가 계통 연계 완료, 3개소가 운전 개시.","so":"時事ドットコム","tm":"11/09 11:16","c":1,"r":"jp","u":"https://www.jiji.com/jc/article?k=000000003.000187675&g=prt","p":1794190560,"a":1794195269,"t":"エコ革、系統用蓄電池事業が本格稼働フェーズへ。全国11か所の系統用蓄電所が系統連系完了、3か所が運転開始。","su":"[주식회사 에코 가죽]전국 6현에서 11안건·축전지 용량 합계 약 82.7MWh. 7개소가 시운전 중, 1개소가 계통 연계를 완료 주식회사 에코 가죽(본사:도치기현 사노시, 대표 이사 사장:이토 시게조)은, 전국 각지에서 추진하는 계통용 축전지 사업에 있어서, 2026년 11월 4일 현재, 11개소의 축전소에서 계통 연계가 완료한 것을 알고 있습니다. 이 중 3개소가 운전을 개시하고, 7개소가 시운전중, 남은 1개소도 계통 연계를 완료하고 있습니다. 11건의 설비 규모는 최대 수전 전력 합계 약 21.9MW, 축전지 용량 합계 약 82.7MWh에 이르렀습니다. 2026…"},{"s":"CNPC와 파나소닉, 쿤산 과학기술대학교와 손잡고 수소 에너지, AI 및 지속 가능한 혁신에 초점을 맞춘 Net Zero 포럼 개최 | 업계 뉴스 | 사업정보","so":"經濟日報","tm":"11/09 11:02","c":1,"r":"tw","u":"https://money.udn.com/money/story/11799/9862088","p":1794189738,"a":1794195286,"t":"中油、Panasonic攜手崑山科大辦淨零論壇 聚焦氫能、AI與永續創新 | 產業動態 | 商情","su":"이 글은 총 1904개의 단어로 구성되어 있습니다. 글로벌 기후 변화, 에너지 전환 및 녹색 공급망 구조 조정 추세에 직면하여 업계, 정부, 학계 및 연구 간의 영역 간 협력이 대만의 순제로 전환을 촉진하는 데 중요한 힘이 되었습니다. 대만 중국석유공사와 대만 파나소닉 그룹이 공동 주최하고 쿤산과학기술대학교가 주최하는 '2026 넷제로 전환. 지속가능한 대만 포럼'이 오늘(6일) 타이베이 JR 도쿄 호텔에서 개최된다. 이 행사에는 위안 행정고문 Li Mengyan, 환경부 기후 변화 행정관 Tsai Ling-yi 및 에너지, 기술 및 학계 대표자들이 참여하도록 초대됩니다. 이번 포럼은 2050년 순제로배출을 핵심으로 수소기술, AI 에너지 활용, 스마트 드론, 플라스틱 재활용, 친환경 인재 양성 등 5가지 주요 주제에 초점을 맞췄다. 포럼에서는 정책 교환과 산업 관행 공유를 통해 대만의 에너지 전환과 지속 가능한 혁신을 위한 개발 기회를 모색했습니다."},{"s":"전기버스가 대형 보조배터리로 변신! ITRI와 국립중성대학교, 마이크로그리드 시연 완료 | 산학연 연구 및 교육 | 사업정보","so":"經濟日報","tm":"11/09 11:02","c":1,"r":"tw","u":"https://money.udn.com/money/story/5723/9862144?from=edn_subcatelist_cate","p":1794189732,"a":1794195287,"t":"電動巴士變身大型行動電源！工研院攜手中正大學完成微電網實證 | 產學研訓 | 商情","su":"전기버스는 승객을 태울 뿐만 아니라 주차 시 '대형 보조 배터리'로 변신합니다! 경제부 에너지청 지원으로 산업기술연구소와 국립중성대학교가 '전기차 양방향 충방전 및 마이크로그리드 통합 포럼 및 시연행사'를 지난 6일 개최했다. 전기 버스는 양방향 충전 및 방전 기술을 사용하여 온보드 전력을 마이크로그리드에 피드백하고, 주차된 버스를 \"이동 에너지 저장 리소스\"로 전환하여 미래 피크 전력 조절, 비상 백업 및 그리드 복원력 향상을 위한 새로운 애플리케이션을 창출한다는 점을 성공적으로 입증했습니다. 경제부 에너지 관리 국장 Wu Zhiwei는 정부가 국가 '에너지 전환 2.0' 정책에 따라 재생 에너지, 심층적인 에너지 절약 및 분산형 마이크로그리드의 적용을 적극적으로 장려하고 있다고 말했습니다. 전기 자동차의 인기로 인해 온보드 배터리는 구동력을 제공할 뿐만 아니라 전력망을 지원할 수 있는 잠재력도 가지고 있습니다. 양방향 충전 및 방전과 스마트 에너지 관리 시스템(EMS)을 통해 미래에는 가상 발전소(VPP) 급전을 결합하여 오프 피크 충전, 피크 방전 및 비상 전력 공급을 실현하고 전력 시스템의 급전 유연성과 재해 복원력을 향상시킬 수 있습니다. 이번에 시연에 참가한 전기버스에는 280kWh 용량의 배터리가 탑재됐다. 이는 평균 소규모 가족이 한 달 가까이 소비하는 전력량과 맞먹는다. 충청대학교는 캠퍼스 마이크로그리드가 올해 2월 출범해 9월 캠퍼스 정전 시 즉각적인 전력 공급 역할을 했다고 지적했다."},{"s":"홍콩 주식 동향 | 항셍 지수는 100포인트 이상 상승했고, 칩 주식은 개선되고 있습니다.","so":"信報網站","tm":"11/09 10:57","c":1,"r":"hk","u":"https://m.hkej.com/landing/mobarticle2/id/4560904/%E6%B8%AF%E8%82%A1%E8%B5%B0%E5%8B%A2%E4%B8%A8%E6%81%92%E6%8C%87%E9%AB%98%E9%96%8B%E9%80%BE%E7%99%BE%E9%BB%9E%20%E6%99%B6%E7%89%87%E8%82%A1%E5%90%91%E5%A5%BD","p":1794189455,"a":1794195278,"t":"港股走勢丨恒指高開逾百點 晶片股向好","su":"지난 목요일 미국 AI 관련 주식이 큰 폭락세를 보인 뒤 지난 금요일 하락세는 일시적으로 멈췄고, 중국 컨셉주 성과를 반영하는 골든드래곤지수는 1.67% 상승했다. 항셍지수는 지난주 1187포인트 상승한 데 이어 오늘 아침에도 100포인트 이상 상승했다. 항셍지수는 143포인트(0.59%) 오른 24,625포인트로 출발했다. 전국지수는 51포인트(0.62%) 오른 8325포인트로 출발했다. S&P 500 지수는 41포인트(1.02%) 상승한 4119포 :"https://www.stheadline.com/daily-finance/3634943/MoMA%E5%B9%B3%E5%8F%B0%E5%8C%AF%E8%81%9A%E5%A4%A7%E6%A8%A1%E5%9E%8B%E4%B8%AD%E7%A7%BB%E5%8B%95%E9%99%8D%E4%BC%81%E6%A5%ADAI%E9%96%8B%E6%94%AF","p":1794164400,"a":1794177875,"su":"中國移動（941）在近日舉行的2026移動網絡大會上，展示多項AI最新應用與算力成果。中移動指，該模型服務平台MoMA匯聚了超過350個多源大模型，並搭配自研的智能調度網關，按「成本優先」原則自動分配路由，整體有助企業降低三成模型使用成本。以熱門的DeepSeek模型為例，平台提供的套餐折扣低至原價四折，該集團指，價格較直接向官網採購更具優勢，同時完整保留原模型使用體驗，有效減輕企業的AI投入"},{"s":"12월 2일 에너지 포럼 개최/에너지 Wu Zhiwei 이사: AI 전력 소비를 충족하기 위해 추가 유닛 구축","so":"UDN","tm":"11/09 03:35","c":1,"r":"tw","u":"https://udn.com/news/story/7238/9865736","p":1794162938,"a":1794195290,"t":"能源論壇12月2日登場／能源署長吳志偉：增建機組 滿足 AI 用電","su":"AI 산업이 부흥하면서 전력이 핵심 이슈로 떠올랐다. 경제부 에너지부 국장 Wu Zhiwei는 경제부가 AI 데이터 센터(AIDC)와 반도체 산업을 위한 전력 애플리케이션을 조사했으며 향후 10년 동안 전력 수요의 연평균 증가율이 약 2.5%가 될 것으로 추정한다고 밝혔습니다. 정부는 Taipower 및 민간 가스 화력 발전소를 더 많이 건설할 계획이며, 가스 화력 발전소의 누적 신규 용량은 2035년까지 약 26GW(백만 킬로와트)가 될 것입니다. 향후 AI의 급속한 발전으로 인해 예상보다 전력 수요가 높아진다면 이를 충족할 수 있는 충분한 마진이 여전히 있을 것입니다."},{"s":"技術分析丨龍源電力營造雙底兼突破下跌軌 |香港經濟日報","so":"香港經濟日報HKET","tm":"11/09 02:00","c":1,"r":"hk","u":"https://invest.hket.com/article/4221736/%E6%8A%80%E8%A1%93%E5%88%86%E6%9E%90%E4%B8%A8%E9%BE%8D%E6%BA%90%E9%9B%BB%E5%8A%9B%E7%87%9F%E9%80%A0%E9%9B%99%E5%BA%95%E5%85%BC%E7%AA%81%E7%A0%B4%E4%B8%8B%E8%B7%8C%E8%BB%8C","p":1794157200,"a":1794177875},{"s":"리더스뷰/COP31은 파리협정 이행을 위한 주요 테스트입니다 | 여론포럼 | 댓글","so":"UDN","tm":"11/09 01:01","c":1,"r":"tw","u":"https://udn.com/news/story/7339/9865787?from=udn-catebreaknews_ch2","p":1794153668,"a":1794195292,"t":"讀家觀點／COP31是巴黎協定的執行大考| 民意論壇| 評論","su":"11월 9일부터 20일까지 터키 안탈리아에서 제31차 유엔기후변화협약(COP31)이 개최됩니다. 현 상황으로 볼 때, 이번 회의가 2015년 파리협정이나 2023년 두바이 COP28의 매우 상징적인 정치적 돌파구를 재현하기는 어려울 수 있습니다."},{"s":"SUNPIN、45MWの滋賀大津蓄電所を系統接続：時事ドットコム","so":"時事ドットコム","tm":"11/08 19:10","c":1,"r":"jp","u":"https://www.jiji.com/jc/article?k=000000002.000193954&g=prt","p":1794132600,"a":1794177875,"su":"［株式会社SUNPIN JAPAN］商業運転は2026年12月を予定株式会社 SUNPIN JAPAN（本社：東京都中央区、代表取締役：西村 軍）は、滋賀県大津市に建設を進めてきた特別高圧の系 국 민주당의 입장이 핵심이며 본토는 블록버스터 데이터를 다수 공개합니다.","so":"etnet 經濟通","tm":"11/08 11:30","c":1,"r":"hk","u":"https://www.etnet.com.hk/www/tc/news/news-article.php?section=features&category=financenews&newsid=415792","p":1794105000,"a":1794109980,"t":"一周部署 | 美民主黨對AI取態成關鍵，內地公布多項重磅數據","su":"주간 배포 | AI에 대한 미국 민주당의 입장이 핵심인데, 본토에서는 블록버스터급 데이터를 대거 공개했다. \"주간 배포\" 다음 주에 주목해야 할 금융 이벤트: 고용 데이터는 다음 달 미국 준비은행의 금리 인상을 지원하기 위해 상향 조정되었습니다. 미국은 10월 신규 비농업 고용이 예상 6만5000명을 크게 웃도는 16만5000명에 달했다고 발표했다. 더 중요한 것은 8월과 9월을 합친 데이터가 최대 84,000명으로 크게 수정되었다는 점입니다(이 중 9월은 원래 매우 낮은 수치인 29,000명에서 60,000명으로 수정되었습니다). 이는 기업의 최근 채용 노력이 이전에 평가했던 것보다 더 탄력적임을 나타냅니다. 최근 실업률도 4.1%로 예상이나 이전 수치보다 낮다. 일자리 증가는 주로 전문 및 비즈니스 서비스 산업과 의료 산업이 주도했으며 AI 인프라 및 데이터 센터 구축이 주도했습니다. 컴퓨터 및 전자제품 제조업이 4년 만에 월간 최대 성장률을 기록했다. 이 데이터는 연준이 12월에 금리를 인상할 것이라는 시장의 강력한 베팅을 다시 불러일으켰습니다. 미국 채권수익률이 전반적으로 상승했고, 달러지수 역시 강한 반등세를 기록했다. 금리선물시장에서는 다음 달 금리 인상 확률이 75%를 넘는 것으로 나타났다. 다음에 발표되는 소비자물가지수(CPI)에서 인플레이션이 다시 가속세를 보이고 있는 것으로 나타나면 시장은 추가 금리 인상을 예상할 수밖에 없을 것이며, 이는 조정권에 진입한 미국 증시에 하락 압력을 더 가중시킬 수 있다."},{"s":"AI넷제로/COP31, 환경부 출석해 정보 파악 포럼 동시 개최 | 삶","so":"中央社 CNA","tm":"11/08 11:16","c":1,"r":"tw","u":"https://www.cna.com.tw/news/ahel/202611080023.aspx","p":1794104160,"a":1794109980,"t":"AI淨零／COP31將登場環境部同步啟動論壇掌握資訊| 生活","su":"COP31이 내일 공식적으로 데뷔합니다. 환경부는 회의 기간 동안 일련의 포럼이 시작될 것이라고 밝혔습니다. 국제 기후 문제의 본질은 실시간 정보 파악은 물론, 국내 정책과 산업 변혁의 기회로도 전환될 것입니다."},{"s":"Yantian에서 Lantian까지 학교 교장은 토지에 있습니다 | 잡지","so":"UDN","tm":"11/08 11:14","c":1,"r":"tw","u":"https://udn.com/news/story/6966/9857372","p":1794104062,"a":1794109980,"t":"從鹽田到藍田一所學校長在土地上| 雜誌","su":"인터뷰 당일, 벽이 없는 캠퍼스를 한눈에 살펴보면 사파이어 블루색의 운동장이 눈에 띄었다. 학교에 도착을 알리기 전, 사진가는 학교 가장자리 분리섬에 서서 운동장에서 아이들의 활동을 촬영할 준비를 하고 있었다. 뜻밖에도 그가 가만히 서있자마자 바로 경보음이 울렸고, 보안요원들이 곧바로 도착했다. 겉보기에 개방적인 캠퍼스에는 실제로 언제든지 활성화될 수 있는 일련의 안전 보호 메커니즘이 숨겨져 있는 것으로 밝혀졌습니다."},{"s":"우리은행, 한국형 녹색채권 발행 우수기업 선정…시중은행 최대 규모","so":"뉴스핌","tm":"11/08 10:00","c":1,"r":"kr","u":"https://www.newspim.com/news/view/20261106001188","p":1794099600,"a":1794109980,"su":"[ 料中心供電案QTS擬以20年長約支應新電廠","su":"PPL과 Blackstone, 2GW 데이터 센터 전원 공급 프로젝트 추진 QTS는 20년 계약으로 새로운 발전소를 지원할 계획 Uanalyze 2026년 11월 7일(Uanalyze/Industrial Data Center Report) ⸺ 미국 전력 회사 PPL(PPL-US)과 Blackstone Infrastructure의 합작 투자사인 Invitium Energy는 데이터 센터 운영업체인 QTS의 Salem Township 캠퍼스에 약 2GW의 전력을 공급할 계획입니다. 펜실베니아. 두 당사자는 주요 상업 조건을 협상했으며 새로운 천연가스 발전, 연료 전지 및 배터리 에너지 저장을 지원하기 위해 장기적인 전원 공급 장치를 사용할 계획입니다. 총 투자액은 당초 50억~70억 달러로 추산된다. 골드만삭스의 최근 전망에 따르면 미국 데이터센터 용량은 2026년 말까지 64GW에 이를 것으로 예상된다. PPL의 2GW 전력공급 계획 규모는 미국 전체 용량의 약 3.1%에 해당한다."},{"s":"더럼 카운티 데이터 센터 계획, 지역사회에 '추가 타격' - 캠페인 활동가","so":"BBC","tm":"11/07 16:19","c":1,"r":"world","u":"https://www.bbc.com/news/articles/crgqwwn8vq58o","p":1794035994,"a":1794041640,"t":"County Durham data centre plan 'further blow' to communities - campaigners","su":"지역 주민들은 다른 에너지 개발이 제안되는 가운데 전력망 압력과 수질 오염에 대해 걱정하고 있습니다."},{"s":"타이난 뎅기열 17번째 사례, 관광을 마치고 베트남으로 이주하다 병에 걸렸다 | 난 윤자 ​​| 현지의","so":"UDN","tm":"11/07 12:17","c":1,"r":"tw","u":"https://udn.com/news/story/7326/9863335","p":1794021435,"a":1794041640,"t":"台南第17例登革熱境外移入越南旅遊返國發病| 雲嘉南| 地方","su":"타이난시 정부 위생국은 올해 타이난에서 17번째 뎅기열 해외유입 사례가 발생했다고 오늘 발표했습니다. 이번 사례는 용강구 출신 40대 여성으로 10월 28일부터 11월 1일까지 베트남을 여행했다가 귀국했다."},{"s":"영화/노소 모두가 후투피에서 Uni-President Enterprise Social Welfare Charitable Foundation이 주최한 \"녹색 및 은색 어린이 놀이 카니발\"을 축하합니다.","so":"UDN","tm":"11/07 11:43","c":1,"r":"tw","u":"https://udn.com/news/story/7326/9863402","p":1794019396,"a":1794093180,"t":"影／老少同歡 統一企業社福慈善基金會虎頭埤辦「青銀童樂嘉年華」","su":"統一企業社福慈善事業基金會與統一企業、統一超商、南科贊美酒店、安記輪胎、客美多咖啡及安南醫院，今天在台南新化虎頭埤舉辦「青銀童樂嘉年華」，邀請400名基金會長期關懷的偏鄉社區長輩、偏鄉課輔班及才藝學校學童與早療學童參加。"},{"s":"Yuanxin Energy Storage의 IPO가 1,300배 이상 초과 청약되었습니다.","so":"TVB","tm":"11/07 09:58","c":1,"r":"hk","u":"https://news.tvb.com/tc/1205058-%E9%81%A0%E4%BF%A1%E5%84%B2%E8%83%BD%E6%8B%9B%E8%82%A1%E9%8C%84%E5%BE%97%E9%80%BE1300%E5%80%8D%E8%B6%85%E9%A1%8D%E8%AA%8D%E8%B3%BC","p":1794013080,"a":1794023400,"t":"遠信儲能招股錄得逾1300倍超額認購","su":"다음 주 월요일에 상장될 Yuanxin Energy Storage는 1,300회 이상의 초과 청약을 받았습니다. s://m.hkej.com/landing/mobarticle2/id/4560622/%E6%97%85%E7%BE%8E%E5%A4%A7%E7%86%8A%E8%B2%93%E3%80%8C%E5%B9%B3%E5%B9%B3%E3%80%8D%E5%8F%8A%E3%80%8C%E7%A6%8F%E9%9B%99%E3%80%8D%E6%AD%A3%E5%BC%8F%E5%85%AC%E9%96%8B%E4%BA%AE%E7%9B%B8","p":1794008882,"a":1794093180,"t":"旅美大熊貓「平平」及「福雙」正式公開亮相","su":"在經過一個多月的適應期後，中國大熊貓「平平」及「福雙」周五在美國亞特蘭大動物園大熊貓館正式亮相，與媒體及公眾見面。 根據中美雙方安排，這對大熊貓將在亞特蘭大動物園開啟為期10年的旅居生活。 動物園副園長費列稱，雄性大熊貓「平平」很外向、喜歡冒險，很快就適應進食亞特蘭大的竹子，在當地生活得很舒服。雌性大熊貓「福雙」比較害羞文靜，花了較多時間熟悉環境，但亦適應得很好，很喜歡亞特蘭大的竹子及蘋果。 園方"},{"s":"[OpenAI] 3분기 사업은 전분기 대비 70% 증가했고, 기업 AI 수요는 2배 증가했다. 미국 여러 곳의 유권자들은 데이터 센터의 지속적인 건설에 반대했습니다.","so":"香港經濟日報HKET","tm":"11/07 07:01","c":1,"r":"hk","u":"https://inews.hket.com/article/4221478/%E3%80%90OpenAI%E3%80%91%E7%AC%AC%E4%B8%89%E5%AD%A3%E6%A5%AD%E5%8B%99%E6%8C%89%E5%AD%A3%E5%A2%9E70-%E3%80%80%E4%BC%81%E6%A5%ADAI%E9%9C%80%E6%B1%82%E5%80%8D%E5%A2%9E%E3%80%80%E7%BE%8E%E5%9C%8B%E5%A4%9A%E5%9C%B0%E9%81%B8%E6%B0%91%E5%8F%8D%E5%B0%8D%E4%BB%8D%E7%BA%8C%E5%BB%BA%E6%95%B8%E6%93%9A%E4%B8%AD%E5%BF%83","p":1794002499,"a":1794007140,"t":"【OpenAI】第三季業務按季增70% 企業AI需求倍增 美國多地選民反對仍續建數據中心"},{"s":"항셍지수 야간 세션丨은 165포인트 상승한 24647에 마감되었습니다.","so":"信報網站","tm":"11/07 04:42","c":1,"r":"hk","u":"https://www.hkej.com/instantnews/stock/article/4560615/%E6%81%92%E6%8C%87%E5%A4%9C%E6%9C%9F%E4%B8%A8%E6%94%B6%E5%A0%B124647+%E9%AB%98%E6%B0%B4165%E9%BB%9E","p":1793994132,"a":1794007140,"t":"恒指夜期丨收報24647 高水165點","su":"항셍 지수 선물은 야시장에서 24,647포인트로 마감했는데, 이는 어제 종가 24,481포인트보다 165포인트 높은 148포인트 상승한 수치이며, 21,168계약이 거래되었습니다. 전국지수선물은 야시장에서 어제 종가보다 57포인트 오른 8,331포인트에 마감했다. 현물 선물 지수에 대한 자세한 내용은 \"홍콩 주식 360\" 선물 지수 페이지를 참조하세요."},{"s":"UBS는 국내 은행에 대해 낙관적이며 주요 국영은행을 선호한다. 순이자마진은 안정적이며, 이익과 배당금도 증가할 것으로 예상됩니다.","so":"信報網站","tm":"11/07 04:38","c":1,"r":"hk","u":"https://www.hkej.com/dailynews/finnews/article/4560152/%E7%91%9E%E9%8A%80%E7%9C%8B%E5%A5%BD%E5%85%A7%E9%8A%80+%E9%A6%96%E9%81%B8%E5%9C%8B%E6%9C%89%E5%A4%A7%E8%A1%8C","p":1793993924,"a":1794007140,"t":"瑞銀看好內銀 首選國有大行淨息差穩定 利潤及派息料齊升","su":"많은 대형 본토 은행들이 앞서 3분기 실적을 발표했습니다. UBS의 아시아 금융산업 연구 책임자인 Yan Meizhi는 본토 은행주에 대해 계속해서 낙관적인 입장을 취하고 있습니다. 그는 순이자 마진이 안정적으로 유지되는 동시에 수익 증가로 이익과 배당금이 증가할 것으로 기대하고 있습니다. 주가순자산비율(P⁄B)은 현재 평균 0.6배에서 0.8배로 상승할 것으로 예상된다. 그 중에서도 대형 국책은행을 선호하는 이유는 기업 대출 사업이 빠르게 성장하고 있기 때문이다. 시가총액비율은 0.8배까지 상승할 것으로 예상된다. Yan Meizhi는 올해 은행의 순이자 마진이 안정되었다고 언급했는데, 이는 주로 3년 만기 예금이 많이 만기되어 주요 은행 예금 비용이 감소했기 때문이라고 말했습니다. 내년에는 만기규모가 줄어들겠지만 이자지급비용은 여전히 ​​감소할 것으로 보인다."},{"s":"대만시멘트, 재건축 사업 기회 모색 위해 COP31 참가 - Daily News","so":"工商時報","tm":"11/07 04:00","c":1,"r":"tw","u":"https://www.ctee.com.tw/news/20261107700120-439901","p":1793991600,"a":1794007140,"t":"台泥赴COP31 爭取重建商機- 日報","su":"제31차 유엔기후변화총회(COP31)가 9일 터키 안탈리아에서 개최된다. TCC는 유럽 자회사 CIMPOR 및 터키 자회사 OYAK Cement와 손잡고 실내외 이중 전시장을 마련하고, 유럽에서 대규모 3D 건축 프린팅 장비를 컨퍼런스 현장으로 운송해 현재 터키 지진 피해 주택 재건축에 활용되고 있는 혁신 기술을 선보이고 재건축 사업 기회를 위해 노력할 것이라고 6일 밝혔다. 대만 시멘트가 개발한 시멘트 에너지 저장 시스템..."},{"s":"AI위기는 금융에 새로운 변화를 가져온다》미국 기술주, 법인 직격탄: 중장기적으로 너무 비관하지 말라 - 일간투데이","so":"工商時報","tm":"11/07 04:00","c":1,"r":"tw","u":"https://www.ctee.com.tw/news/20261107700059-439901","p":1793991600,"a":1794007140,"t":"AI風雲起金融新變局》美科技股重災法人：中長線不必太悲觀- 日報","su":"시장은 미국 민주당의 '블루 웨이브'가 불러온 AI 규제 패닉에 계속 빠져들고 있다. 미국과 대만 증시가 '고통받는 형제'가 됐다. 미국 4대 증시가 5일 흑자세로 마감했고, 필라델피아 반도체지수는 하루 기준 역사상 두 번째로 큰 하락폭을 기록했다. 기술주가 가장 큰 타격을 입었고 후이다, 마이크론 등 거대 기업은 하루 만에 1000억 달러 이상의 시장 가치를 잃었다. 법무법인은 장기적으로 봤을 때 여전히 AI가 최고의 투자 대상이라고 지적했다. 적당히 다각화된 레이아웃 외에도 민주당의 정책이 주도하는 산업 기회에도 주목할 수 있습니다."}]},{"name":"🏭 AI 전력","note":"보유: ACE 코리아AI전력TOP10","breaking":false,"items":[{"s":"우태희 효성중공업 대표, '글로벌품질경영인대상' 수상","so":"아시아경제","tm":"11/06 14:45","c":10,"r":"kr","u":"https://www.asiae.co.kr/article/IT/2026110614453379341","p":1793943934,"a":1793944200,"su":"우태희 효성중공업 대표가 품질경영 성과를 인정받아 한국품질경영학회가 수여하는 &#039;글로벌품질경영인대상&#039;을 ."},{"s":"미국 AI 규제 우려로 투자 신뢰도 높아져: 아시아 기술주, 밸류에이션 압박에 직면 | 증권","so":"中央社 CNA","tm":"11/08 12:09","c":3,"r":"tw","u":"https://www.cna.com.tw/news/afe/202611080016.aspx","p":1794107340,"a":1794109980,"t":"美國AI監管疑慮升高投信：亞洲科技股面臨估值壓力| 證券","su":"미국 중간선거에서 민주당이 대승을 거두면서 시장에서는 AI 구축 규제가 강화될 수 있다는 우려가 커지며 글로벌 기술주 매도압력이 촉발됐다. 모건자산운용은 이번 조정 물결은 AI 시장 서사가 변화하고 있다는 점을 강조하며 그 영향이 미국에서 대만, 한국, 일본 등 아시아 AI 공급망으로 더욱 확산될 수 있으며 아시아 기술주가 새로운 가치평가 압력에 직면할 수 있음을 상기시켰다."},{"s":"Global Market Observatory/AI 인프라 공급망이 큰 타격을 입었습니다 | 자금 | 주식 시장","so":"UDN","tm":"11/09 04:31","c":2,"r":"tw","u":"https://udn.com/news/story/10103/9865541?from=udn-relatednews_ch2","p":1794166292,"a":1794177881,"t":"全球市場觀測站／AI基建供應鏈遭重擊| 基金 | 股市","su":"美國民主黨在期中選舉取得國會控制權後，市場開始重新評估AI及資料中心擴建面臨的監管風險。法人表示，若資料中心建置速度放緩，首當其衝的將是AI基礎建設供應鏈，其中AI半導體受到的衝擊可能最為明顯，相關基礎建設概念股也可能受到牽連，包括AI電力基礎建設族群。"},{"s":"Dashan의 첫 3분기 EPS는 3.78위안이었습니다.","so":"經濟日報","tm":"11/09 01:46","c":2,"r":"tw","u":"https://money.udn.com/money/story/5710/9865686?from=edn_next_story","p":1794156389,"a":1794177881,"t":"大山前三季 EPS 3.78元","su":"AI基建大力發展，台電電網訂單需求擴大，線纜業營運看俏，更大力搶攻用線需求，指標線纜廠大山（1615）公告營收及財報，單季、前三季均創歷史同期新高，前十月營收也創歷史同期新高。"},{"s":"보고서는 2026년 중국의 에너지 투자가 기술 기업을 중요한 힘으로 삼아 9000억 달러를 초과할 것이라고 밝혔습니다.","so":"經濟日報","tm":"11/08 13:33","c":2,"r":"tw","u":"https://money.udn.com/money/story/5603/9864920","p":1794112419,"a":1794128040,"t":"報告稱陸2026年能源投資逾9000億美元 科技企業為重要力量","su":"중국기업개혁발전연구협회가 최근 발표한 자료에 따르면 올해 상반기 중국 석탄화력 발전 비중은 처음으로 50% 아래로 떨어진 49.7%로 떨어졌다. 석탄화력발전은 주전원에서 백업전원, 계통제어전원으로 전환되고 있습니다. 2026년 중국 본토의 총 에너지 투자액은 9,400억 달러에 달해 세계 1위를 차지할 것으로 예상된다. 그 중 기술 기업은 에너지 투자에서 중요한 세력이 되고 있다."},{"s":"미국 중간 선거는 청정 에너지에 대한 전망을 바꾸었고, 대만의 태양광 발전소는 내년에 빛을 보게 될 것입니다.","so":"自由時報","tm":"11/08 11:50","c":2,"r":"tw","u":"https://stock.ltn.com.tw/article/nbk14b7nxbbk","p":1794106200,"a":1794128040,"t":"美期中選舉變天潔淨能源大漲 台太陽能廠明年迎曙光","su":"미국 중간선거 결과가 발표됐고, 민주당이 상하원을 모두 장악하게 됐다. 시장에서는 내년 민주당이 공식 집권한 이후 태양광, 풍력 등 신재생에너지 산업에 대한 투자 환경이 크게 개선될 것으로 기대하고 있다. 미국 청정에너지 주가 급등했다. 11월 6일 대만 주식은 급락했다. 하지만 Yuanjing(6443), United Renewables(3576), Motech(6244), Canghe(6538) 등 국내 태양광 주식은 흑자에서 적자로 전환하는 데 어려움을 겪었다. 위안징과 다논(36)"},{"s":"Fei Ban의 폭락으로 AI 가격 조정 시작 | 시장 포커스 | 증권","so":"經濟日報","tm":"11/08 11:33","c":2,"r":"tw","u":"https://money.udn.com/money/story/5607/9864674?from=edn_newestlist_rank","p":1794105225,"a":1794109980,"t":"費半重挫揭開 AI 重新定價序幕 | 市場焦點 | 證券","su":"미국의 정치적 동향이 기술주의 새로운 진원지가 되었습니다! 시장에서는 민주당이 의회를 장악한 후 AI 규제 강도가 높아져 데이터센터 건립과 기술산업 자본지출에 영향을 미칠 수 있다고 우려하고 있다. 11월 5일 미국 증시는 폭락했습니다. S&P 500 지수는 하루 만에 4.4% 하락했고, 500개 구성종목 중 무려 430개 종목이 흑자로 마감했다. 나스닥 지수는 5.5% 하락했고 필라델피아 반도체 지수는 12.3% 급락했다. 안전자산인 미국 국채가 몰리면서 미국 10년만기 국채수익률이 하루 만에 5bp 하락했다."},{"s":"미국 AI 정책 변수가 중전기산업에 영향을 미칠까? 전문가들은 공장의 두 가지 주요 장점을 지적합니다.","so":"自由財經","tm":"11/07 11:35","c":2,"r":"tw","u":"https://ec.ltn.com.tw/article/breakingnews/5632438","p":1794018906,"a":1794023400,"t":"美國AI政策變數衝擊重電業？專家點出台廠具2大優勢","su":"[린징화 기자/타이베이 취재] 미국 중간선거가 막을 내렸지만 이어진 AI 데이터센터 제한 우려로 글로벌 증시는 폭락할 뻔했다. 이 가운데 대만의 중전기 산업이 미국 수출을 지향하고 있어 주가도 급락했다. 하지만 전문가들은 단기적으로 미국의 정책에 큰 변화가 없을 것으로 보고 있다."},{"s":"Huaxin은 주당 1.78위안을 벌고 있으며 강력한 주문을 받고 있습니다.","so":"UDN","tm":"11/07 03:51","c":2,"r":"tw","u":"https://udn.com/news/story/7252/9862958","p":1793991068,"a":1794007140,"t":"華新每股賺1.78元 訂單強勁","su":"Taipower의 전력망 강화 계획, 반도체 공장 확장, AI 데이터센터 구축 수요가 전선 및 케이블 실적을 견인했습니다. 화신은 어제(6일) \"아직 정점에 도달하지 않았다\"고 낙관적으로 밝혔습니다. 전선 및 케이블 사업의 수주 모멘텀이 강하고, 현재 초고압 케이블 생산 능력이 가득 찼습니다. Taipower의 전력망 건설에 대한 최대 수요는 2029년에서 2030년 사이에 감소할 것으로 예상되며, 이때 수요는 현재 수준보다 훨씬 높아질 것입니다."},{"s":"[미국 증시 현황] 텍사스 민주당이 머스크와 협력할 의향이 있다. AMD는 14% 상승, SpaceX와 Nvidia는 7% 상승(지속 업데이트)","so":"香港經濟日報HKET","tm":"11/07 00:58","c":2,"r":"hk","u":"https://inews.hket.com/article/4218350/%E3%80%90%E7%BE%8E%E8%82%A1%E5%B8%82%E6%B3%81%E3%80%91%E5%BE%B7%E5%B7%9E%E6%B0%91%E4%B8%BB%E9%BB%A8%E9%A1%98%E8%88%87%E9%A6%AC%E6%96%AF%E5%85%8B%E5%90%88%E4%BD%9C%E3%80%80AMD%E6%9B%BE%E5%BD%8814-%E3%80%81SpaceX%E5%8F%8A%E8%8B%B1%E5%81%89%E9%81%94%E6%9B%BE%E5%8D%877-%EF%BC%88%E4%B8%8D%E6%96%B7%E6%9B%B4%E6%96%B0%EF%BC%89","p":1793980710,"a":1794007140,"t":"【美股市況】德州民主黨願與馬斯克合作 AMD曾彈14%、SpaceX及英偉達曾升7%（不斷更新）"},{"s":"당황하지 않도록 시장에 약속하세요! 경제부, 수출 판매 데이터 발표: 대만 산업에 대한 자신감을 가져야 합니다 - 기타","so":"旺得富理財網","tm":"11/06 19:04","c":2,"r":"tw","u":"https://wantrich.chinatimes.com/news/20261106900328-420501","p":1793959458,"a":1793974680,"t":"喊話市場免驚！經濟部提外銷數據：對臺灣產業要有信心- 其他","su":"경제부는 오늘(6일) 대만의 최근 경제성장을 보면 경제성장률, 산업생산지수, 수출입실적 등에서 성장모멘텀이 가득하다고 밝혔다. 최근 우리나라 주식시장이 하락했다가 조정을 받았지만 대만 산업 에너지는 양호하므로 각계각층에서 대만 산업에 대한 신뢰를 가져달라는 요청을 받고 있습니다. 경제부는 인공지능(AI), 고성능컴퓨팅, 클라우드 서비스 등 애플리케이션 수요가 지속적으로 확대되고, 관련 제품 가격이 상승하고, 가전제품 신제품 수요가 늘어나는 데 따른 수혜를 꼽았다."},{"s":"구리 가격이 비싸고 Taipower의 주문이 급증하고 있습니다! 케이블 공장 Dashan의 매출과 이익이 첫 3분기 동안 급증했습니다.","so":"經濟日報","tm":"11/06 18:41","c":2,"r":"tw","u":"https://money.udn.com/money/story/5710/9862443?from=edn_newest_index","p":1793958089,"a":1793974680,"t":"銅價高檔、台電訂單超旺！線纜廠大山營收、前三季獲利飆高","su":"Taipower는 배송을 주문하고 케이블 그룹은 매우 번영합니다. Dashan(1615)은 6일 수익 및 재무 보고서를 발표했습니다. 올해 1~3분기 세후 누적 순이익은 7억5000만 위안으로 연간 증가율 14.21%, 주당 세후 순이익(EPS)은 3.78위안을 기록했다. 3분기 세후 순이익은 2억 5400만 위안으로 연간 증가율 9.8%를 기록했다. 주당 세후 순이익은 1.25위안으로 단일 분기와 첫 3분기 모두 같은 기간 사상 최고치를 기록했습니다."},{"s":"화신법강연회/대만전력망의 수요피크는 아직 도달하지 않았습니다! 2030년 가장 번성 : 내년 345kV 케이블 인증 취득","so":"經濟日報","tm":"11/06 18:05","c":2,"r":"tw","u":"https://money.udn.com/money/story/5612/9862345?from=udnamp-referralnews_ch1001artbottom","p":1793955914,"a":1793974680,"t":"華新法說會／台電電網需求高峰未到！2030最旺 明年取得345kV電纜認證","su":"화신(1605)은 6일 재무보고서를 발표하고 기자회견을 열었다. Huaxin은 Taipower의 강력한 그리드 계획, 반도체 공장 확장 및 AI 데이터 센터 건설 수요 덕분에 전선 및 케이블 사업의 수주 모멘텀이 강력하다고 말했습니다. 현재 초고압 케이블 생산 능력은 가득 차 있으며, Taipower의 전력망 건설에 대한 최대 수요는 수요가 현재 수준보다 훨씬 높은 2029~2030년 사이에 떨어질 것으로 예상됩니다. 또한, 회사는 내년에 345kV 초고압 케이블에 대한 제품 인증을 획득할 것으로 예상하고 있으며, 가오슝 해저 케이블 공장은 내년 중순에 제품 인증을 획득하고 2028년 출하를 시작하여 미래 운영 성장의 원동력이 될 것으로 기대하고 있다."},{"s":"미국 정치 변화: Morgan: 수수료 충돌로 인해 AI 가격 조정이 시작됨 - 금융","so":"工商時報","tm":"11/06 17:25","c":2,"r":"tw","u":"https://www.ctee.com.tw/news/20261106701405-430301","p":1793953500,"a":1793955540,"t":"美國政治變天摩根：費半重挫揭開AI重新定價序幕- 金融","su":"미국의 정치적 동향이 기술주의 새로운 진원지가 되었습니다! 시장에서는 민주당이 의회를 장악한 후 AI 규제 강도가 높아져 데이터센터 구축과 기술산업 자본지출에 영향을 미칠 수 있다고 우려하고 있다. 11월 5일 미국 증시는 폭락했습니다. S&P 500 지수는 하루 만에 4.4% 하락했고, 500개 구성종목 중 무려 430개 종목이 흑자로 마감했다. 나스닥 지수는  부가가치 환경 제어 및 발효 기술을 통해 전통 기장주, 토종 동백 등 농업 부산물이 눈길을 끄는 그린 골드로 업그레이드됐다. AR 및 생성 AI는 몰입형 오리엔티어링 투어를 만드는 데에도 사용되었으며, 이를 통해 ITRI의 기술이 업계에 진출하고 대만 순환 경제에 새로운 이정표를 세울 수 있었습니다."},{"s":"Taipower 2027 직원 선발 583명의 새로운 인재 모집 브로셔 12/23 발표 예정","so":"中央社 CNA","tm":"11/09 12:04","c":1,"r":"tw","u":"https://www.cna.com.tw/postwrite/chi/449398","p":1794193440,"a":1794195309,"t":"台電2027僱員甄試招募583名新血 簡章預定12/23公告","su":"2027 타이파워 채용 채용이 다가왔습니다! 타이파워는 전기산업 인재 채용을 위해 내년에 16개 분야 약 583명을 신규 채용할 예정이다. 취업 훈련 기간 동안 합격한 지원자의 초봉은 약 NT$37,000입니다. Taipower의 관련 규정을 충족하고 실제로 현장 기술 작업에 종사하거나 전력 관련 전문 자격증을 보유한 전력 기술자는 NT$40,000를 초과할 수 있습니다. 타이파워는 선발 브로셔가 12월 23일 온라인에 게재될 예정이며, 예선심사는 내년 5월 9일 타이베이, 타이중, 가오슝, 화련 등 4개 시험지역에서 공동으로 진행될 예정이라고 밝혔다. 각 분야의 전력 전문가 여러분, 서둘러 신청 일정을 확인하시기 바랍니다!"},{"s":"故 조석래 효성 명예회장, 한미우호상 수상","so":"디일렉","tm":"11/09 10:40","c":1,"r":"kr","u":"https://www.thelec.kr/news/articleView.html?idxno=65081","p":1794188456,"a":1794195299,"su":"고(故) 조석래 효성그룹 명예회장이 한미 경제협력과 우호 증진에 기여한 공로로 제24회 한미우호상을 수상했다. 효성은 지난 6일 서울 워커힐호텔에서 열린 '한미우"},{"s":"AI 주가 폭락, 데이터센터 위기인가 아니면 전환점인가? |홍콩경제신문","so":"香港經濟日報HKET","tm":"11/09 10:11","c":1,"r":"hk","u":"https://invest.hket.com/article/4221604/ai-stocks-selloff-data-centre-outlook","p":1794186669,"a":1794195302,"t":"AI股急跌 數據中心危機還是轉機？|香港經濟日報"},{"s":"COP31, 터키에서 전쟁과 AI로 인한 압박 속에서 기후 목표를 열다","so":"The Straits Times","tm":"11/09 10:08","c":1,"r":"sg","u":"https://www.straitstimes.com/world/europe/cop31-to-open-in-turkey-with-climate-goals-under-pressure-from-war-and-ai?ref=latest","p":1794186480,"a":1794195312,"t":"COP31 to open in Turkey, with climate goals under pressure from war and AI","su":"안탈리아, 터키, 11월 9일 - 전쟁으로 인한 에너지 안보에 대한 우려, 급증하는 AI 전력 수요, 미국의 탈퇴로 인해 지구 온난화에 맞서 싸우는 데 새로운 압력이 가해짐에 따라 약 200개 국가의 대표들이 월요일 터키의 지중해 연안에 모여 2주간의 기후 회담을 가질 예정입니다. straitstimes.com에서 자세한 내용을 읽어보세요."},{"s":"라오스 풍력발전을 베트남으로 이전하지만 에너지 개발은 현지 주민에게 도움이 되기 어렵다","so":"公視新聞","tm":"11/09 10:00","c":1,"r":"tw","u":"https://news.pts.org.tw/article/834593","p":1794186000,"a":1794195310,"t":"寮國風電輸越南 能源發展難惠及在地人","su":"라오스는 풍력발전을 적극적으로 개발하고 있다. 남부 산악 지역에는 133개의 풍력 터빈이 있어 이웃 베트남에 전력을 전달합니다. 이 아시아 최초의 국경을 넘는 풍력 발전 프로젝트는 베트남의 전력 수요 충족에 도움이 될 뿐만 아니라 라오스를 동남아시아 재생 에너지 개발의 신흥 강자로 만들었습니다. 그러나 전력을 해외로 수출할 경우, 지역 주민들은 향상된 전력공급을 누리지 못할 수도 있습니다."},{"s":"데이터독은 '아웃퍼폼', 카맥스를 '중립'","so":"バロンズ・ダイジェスト","tm":"11/09 09:11","c":1,"r":"jp","u":"https://barrons.jiji.com/article/9073","p":1794183104,"a":1794195299,"t":"データドッグは「アウトパフォーム」、カーマックスを「中立」","su":"조사 리포트 데이터독은 ‘아웃퍼폼’, 카맥스를 ‘중립’ 내용은 애널리스트의 견해이며 본지의 분석이나 추천 종목이 아니다. 리포트 작성자의 일부는 대상기업에 투자은행 업무 등의 서비스를 제공하고 있거나 제공하고자 한다. 〔에버 코어 ISI〕 IT 인프라의 자동 감시·제어 소프트웨어 기업 데이터 독 <DDOG>(나스닥 증권 거래소)를 「아웃퍼폼」이라고 평가한다. 11월 4일 종가는 220.52달러."},{"s":"거품이 사라져야 진짜 이야기를 볼 수 있다: AI 사이클의 거시적 펑크와 산업 재탄생|Chen Xinshen","so":"星島頭條","tm":"11/09 09:00","c":1,"r":"hk","u":"https://www.stheadline.com/macroeconomics/3634821/%E6%B3%A1%E6%B2%AB%E8%A4%AA%E5%8E%BB%E6%96%B9%E8%A6%8B%E7%9C%9F%E7%AB%A0AI%E5%91%A8%E6%9C%9F%E7%9A%84%E5%AE%8F%E8%A7%80%E5%88%BA%E7%A0%B4%E8%88%87%E7%94%A2%E6%A5%AD%E9%87%8D%E7%94%9F%E9%99%B3%E6%96%B0%E7%87%8A","p":1794182447,"a":1794195304,"t":"泡沫褪去方見真章：AI周期的宏觀刺破與產業重生｜陳新燊","su":"[칼럼 소개] 밀물이 빠져야 알몸으로 헤엄치고 있는 사람이 누구인지 알 수 있다. 2026년 AI 시장은 쇠퇴와 제방 건설을 동시에 하고 있다. 기술의 상승 추세는 장기적인 일반 추세이고 금융 거품의 하락 추세는 실제주기입니다. 이 기사에서는 정치적 여론, 규제 전환, 지리적 이동성 및 신용 영향력이라는 4차원 프레임워크를 사용하여 이번 AI 버블을 제거하는 경로를 분석합니다. 인공지능 산업의 가치를 부정하는 것이 아니라, 고레버리지 확장의 단계적 리스크만을 분석한다. 연구와 판단은 정직하고 객관적이도록 노력하며 투자자와 산업 사이클에 대한 참고 자료 역할을 합니다. 1. 주기 분할: 기술은 실제로 상승하고 있으며 금융 거품은 하락하고 있습니다. 2026년 글로벌 AI 시장은 흥미로운 이분법적 분할을 선보일 것입니다."},{"s":"[리포트 브리핑]LS ELECTRIC, '한국 AI DC의 길은 LS일렉트릭으로 통한다' 목표가 220,000원 - 하나증권","so":"뉴스핌","tm":"11/09 08:35","c":1,"r":"kr","u":"https://www.newspim.com/news/view/20261109000116","p":1794180900,"a":1794195299,"su":"[서울=뉴스핌] 로보뉴스 = 하나증권에서 09일 LS ELECTRIC(010120)에 대해 '한국 AI DC의 길은 LS일렉트릭으로 통한다'라며 투자의견 'BUY'의 신규 리포트를 발행하였고, 목표가 220,000원을 내놓았다. 전일 종가 기준으로 볼 때, 이 종목의 주가는 목표가 대비 88.8%의 추가 상승여력이 있다는 해석이 가능하다. ◆ LS ELECTRIC 리포트 주요내용 하나증권에서 LS ELECTRIC(010120)에 대해 '▶ 아직 해 E9%87%8D%E8%A6%81","p":1794171600,"a":1794177881,"t":"美國中期選舉重塑政策格局 分散配置更顯重要","su":"美國中期選舉塵埃落定，民主黨取得國會兩院控制權，意味華盛頓再次進入「分裂政府」格局。未來兩年，總統推動主要立法的空間將明顯收窄。對投資者而言，這並不一定是壞事。政策受到更多制衡，意味大規模財政刺激的可能性下降，部分政策不確定性亦可能隨之減少。 歷史經驗顯示，中期選舉後的市場表現往往不俗。自1950年以來，標普500指數在每次中期選舉後12個月均錄得升幅，平均回報約15%。當然，歷史表現並不代表未來"},{"s":"75년간 레이오프 없음, 동족기업 3대째에 배우는 경영자들 | The Wall Street Journal 출발","so":"ダイヤモンド・オンライン","tm":"11/09 05:36","c":1,"r":"jp","u":"https://diamond.jp/articles/-/402920","p":1794170160,"a":1794195301,"t":"75年間レイオフなし、同族企業3代目に学ぶ経営者たち | The Wall Street Journal発","su":"많은 경영자들이 미 미주리 주 세인트 루이스에 발을 들여 스티브 건드 씨가 이루고 있는 어려운 위업에 따를 시도하고 있다. 동씨는 동족 경영의 제조회사 간드 컴퍼니의 3대째 최고경영 책임자(CEO)다. 이 회사는 10년간 연평균 18%의 성장을 이루고 있지만, 직원은 1명도 레이오프한 적이 없다. 스티브 씨에 따르면 이를 지지하고 있는 것은 종업원 1300명의 복리를 눈앞의 이익보다 우선하는 리더십 모델이다. 그는 이 방법을 전파하는 것을 사명이라고 느끼고 있으며, 특히 동족기업의 경영자에게 알리고 싶다고 생각하고 있다. 「달콤하게 들리지만, 이익은 나오고 있다」. 스티브 씨(55)는 이렇게 말한다. 할아버지 에드 간드는 원래 과자 판매원으로 1951년에 이 복합재료회사를 창업했다. 현재 매출액은 4억달러(약 630억엔)에 육박하고 고객에게는 미 복합기업 제너럴 일렉트릭(GE)과 미자동제어기기 대형 로크웰 오토메"},{"s":"도코모, 고객정보 29만 건 유출 부사장 「상정외의 공격, 시스템 연동을 악용」","so":"日経ビジネス電子版","tm":"11/09 05:00","c":1,"r":"jp","u":"https://business.nikkei.com/atcl/gen/19/00954/110600006/","p":1794168000,"a":1794177881,"t":"ドコモ、顧客情報29万件流出 副社長「想定外の攻撃、システム連動を悪用」","su":"NTTドコモは2026年11月6日、4日に発生した不正アクセスによる顧客情報流出について会見を開き、被害を受けた外部からの不正アクセスが、これまで想定しなかった攻撃であることを明らかにした。不正アクセス判明後、攻撃を受けた契約変更などができる「My docomo」などのサービスを停止。安全性を高めるためのシステム改修を実施し、確認が取れ次第再開する予定という。通信障害などが連続するドコモは、社内のガバナンス体制強化を図る考えだ。"},{"s":"모스는 경영회의에 「쟈켄 방식」 사장이 발안, 사양이나 불량은 법도","so":"日経ビジネス電子版","tm":"11/09 05:00","c":1,"r":"jp","u":"https://business.nikkei.com/atcl/gen/19/00953/110500003/?i_cid=nbpnb_top_editorpicks","p":1794168000,"a":1794177881,"t":"モスは経営会議に「じゃんけん方式」 社長が発案、遠慮や忖度は御法度","su":"会議で上司が「忌憚のない意見を」と呼びかけても、本音はなかなか出てこない。モスフードサービスが導入したのは、全員が同時に意見を示す「じゃんけん方式」だ。遠慮も忖度もなくす会議改革に迫る。"},{"s":"그 한마디로, 당신의 회사는 포장한다 기업의 정치 활동에 숨어 있는 불편한 진실","so":"日経ビジネス電子版","tm":"11/09 05:00","c":1,"r":"jp","u":"https://business.nikkei.com/atcl/gen/19/00351/102600247/", 되어 있습니다. 메모리 제조업체인 Winbond는 오늘 Jianhushan World에서 Family Day 행사를 개최했습니다. Jiao Youjun 회장은 올해 성과가 매우 좋았으며 직원 보너스도 매우 넉넉했다고 말했습니다. 평균 보너스는 약 30개월로 추정됩니다. 이날 윈본드의 패밀리데이 행사에는 약 2,600여명의 직원이 참가했는데, 가족까지 포함하면 5,000명이 넘는 인원이 참석했다. Jiao Youjun은 참가자 수가 새로운 최고치를 기록했다고 말했습니다. 직원들이 마음 편히 회사에 근무할 수 있도록 격려해 주시고, 성실히 일하셔서 좋은 성과를 낼 수 있도록 도와주신 가족 여러분께 감사드립니다. 중간선거가 끝나자 시장에서는 미국의 인공지능(AI) 정책 변화가 우려된다. Jiao Youjun은 이것이 데이터 센터 건설에 확실히 영향을 미칠 것이지만 영향의 정도는 더 지켜봐야 한다고 말했습니다."},{"s":"전국 20개 대학의 EMBA 엘리트들이 타오위안에서 기량을 뽐내고, 비즈니스 리더들은 공으로 농구를 펼칩니다.","so":"自由時報","tm":"11/07 15:47","c":1,"r":"tw","u":"https://news.ltn.com.tw/news/life/breakingnews/5632688","p":1794034048,"a":1794093180,"t":"全國20所大學EMBA菁英桃園尬球技 企業領袖換上球拚籃球","su":"平日在商場上運籌帷幄的企業領袖，今天換上球衣在籃球場上較勁，由國立中央大學主辦「115年全國EMBA運動籃球聯誼賽」今登場，吸引全國20所大學EMBA企業菁英、歷屆校友齊聚桃園，以球會友，不僅較量球技，也藉由運動促進企業界與學術界交流，展現不同於商場競爭的團隊精神。中央大學也將象徵該校的「松勁」精神融入賽事，以松樹堅毅挺拔、四季常青的特質，象徵企業領袖面對挑戰的韌性與堅持，球場上除了比拚體力、球技，更考驗團隊默契、戰術運用及臨場應變能力，與企業經營管理所需的領導、溝通及決策能力有不少共通之處。"},{"s":"최초의 핵융합 발전소 건설 경쟁이 진행되고 있으며 유럽은 일본에 도움을 요청하고 있습니다.","so":"CNBC","tm":"11/07 15:00","c":1,"r":"us","u":"https://www.cnbc.com/2026/11/07/proxima-fusion-power-japan-supply-chain.html","p":1794031201,"a":1794041640,"t":"The race is on to build the first fusion power plant — and Europe is looking to Japan for help","su":"핵융합 에너지는 풍부하고 깨끗한 전력을 제공할 수 있는 잠재력을 가지고 있습니다. 이제 세계 최초의 상업용 플랜트 개발 경쟁이 시작되었습니다."},{"s":"OpenAI, 첫 번째 110억 달러 자금 조달 완료 CFO: 중간 선거는 IPO 계획에 영향을 미치지 않습니다.","so":"星島頭條","tm":"11/07 13:00","c":1,"r":"hk","u":"https://www.stheadline.com/realtime-finance/3634501/OpenAI%E5%AE%8C%E6%88%90110%E5%84%84%E7%BE%8E%E5%85%83%E9%A6%96%E6%89%B9%E8%9E%8D%E8%B3%87-CFO%E4%B8%AD%E6%9C%9F%E9%81%B8%E8%88%89%E7%84%A1%E5%BD%B1%E9%9F%BFIPO%E8%A8%88%E5%8A%83","p":1794024029,"a":1794041640,"t":"OpenAI完成110億美元首批融資 CFO：中期選舉無影響IPO計劃","su":"Bloomberg는 이 문제에 정통한 소식통을 인용하여 OpenAI가 약 110억 달러에 달하는 새로운 1차 자금 조달을 완료했으며 회사의 최근 가치는 1조 2500억 달러에 달했다고 보도했습니다. 또한 OpenAI 재무 이사 Sarah Friar는 중간 선거가 OpenAI의 IPO 계획을 변경하지 않았다고 말했습니다. 앞으로 몇 주 안에 전체 자금 조달이 완료될 예정입니다. 자금 조달 라운드의 나머지 부분은 앞으로 몇 주 안에 완료될 것으로 예상되며, 총 자금 조달 규모는 결국 최대 200억 달러까지 늘어날 수 있다고 이 문제에 정통한 소식통이 말했습니다. 이전 보고서에서는 목요일 AI 주가가 폭락하기 전 OpenAI의 초기 목표는 1을 추구하는 것이라고 지적했습니다."},{"s":"COP31에서는 글로벌 전기화 목표를 35%로 설정했습니다! IEA는 2035년 기준 충족의 핵심 분석: 전력망 확장 속도를 40% 가속화해야 함","so":"ESG永續台灣","tm":"11/07 12:39","c":1,"r":"tw","u":"https://esg.businesstoday.com.tw/article/category/190807/post/202611050035/COP31%E8%A8%82%E5%85%A8%E7%90%83%E9%9B%BB%E6%B0%A3%E5%8C%9635%EF%BC%85%E7%9B%AE%E6%A8%99%EF%BC%81IEA%E8%A7%A3%E6%9E%902035%E5%B9%B4%E9%81%94%E6%A8%99%E9%97%9C%E9%8D%B5%EF%BC%8C%E9%9B%BB%E7%B6%B2%E6%93%B4%E5%BB%BA%E9%80%9F%E5%BA%A6%E9%A0%88%E5%8A%A0%E5%BF%AB40%EF%BC%85","p":1794022770,"a":1794041640,"t":"COP31訂全球電氣化35％目標！IEA解析2035年達標關鍵，電網擴建速度須加快40％","su":"글로벌 전기화는 COP31의 중요한 논의 주제 중 하나입니다. COP31 의장단은 2035년 전 세계 전화율을 35%로 높이겠다는 목표를 제시했다. 국제에너지기구(IEA)의 '전기화' 특별 보고서는 현행 정책을 따르면 2035년까지 전 세계 전화율이 30% 안팎에 달할 것으로 예상하고 있지만 이는 아직 목표와는 거리가 멀다. 보고서는 또한 에너지 안보, 탄소 감소 및 경제에 대한 전기화의 이점뿐만 아니라 촉진 과정에서 다양한 국가가 직면한 과제를 분석합니다. 본 보고서는 COP31 의장단과 IEA의 파트너십을 통해 터키와 호주의 요청으로 작성되었으며, 글로벌 전기화 개발의 현재 상태, 잠재력 및 정책 권장 사항을 제안합니다."},{"s":"녹색 에너지 발전과 체육 교육을 고려한 Miaoli Zhaonan 중학교 광전자 경기장 개장","so":"自由時報","tm":"11/07 11:52","c":1,"r":"tw","u":"https://news.ltn.com.tw/news/life/breakingnews/5632462","p":1794019927,"a":1794023400,"t":"苗栗照南國中光電球場啟用 兼顧綠能發電與體育教學","su":"Miaoli County Zhaonan 중학교 태양광 경기장이 공식적으로 개장되었습니다. 태양광 경기장은 건축면적은 약 1,203.4㎡, 태양광 설치용량은 261.36kW이다. 캠퍼스 공간이 다양한 기능을 수행할 수 있도록 스포츠 경기장과 재생 에너지 응용 프로그램을 결합합니다. Miaoli 현 치안 Zhong Dongjin은 완벽한 스포츠 시설이 체육 교육 증진을 위한 중요한 기반이라고 말했습니다. 그는 태양광 경기장이 설치된 후 학교의 스포츠 및 훈련 자원이 풍부해지고, 학생들이 운동 기회를 늘리고, 규칙적인 습관을 개발하고, 신체적, 정신적 건강을 증진할 수 있기를 바라고 있습니다. 교육 책임자인 Ye Xinhui는 태양광 발전 경기장은 발전 기능 외에도 녹색 에너지, 에너지 절약 및 탄소 감소 적용을 구현하고 환경 보호 개념을 학습에 통합하는 생활 중심 교육 자료라고 지적했습니다."},{"s":"Lumai는 광학 AI 서버를 테스트하여 데이터 센터 전력을 절감합니다.","so":"ET Datacenters","tm":"11/07 11:34","c":1,"r":"us","u":"https://datacenters.economictimes.indiatimes.com/news/ai-compute-infrastructure/lumai-tests-optical-ai-servers-to-cut-data-center-power/135624664","p":1794018862,"a":1794023400,"t":"Lumai tests optical AI servers to cut data center power","su":"Lumai는 영국 연구소에 Iris Nova 광학 AI 추론 서버를 배포하고 있습니다. 이는 GPU에서 사전 채우기 AI 워크로드를 오프로드하여 데이터 센터 전력 소비를 줄이는 것을 목표로 합니다."},{"s":"祥碩, 樺漢, 전 태담 전망","so":"經濟日報","tm":"11/07 10:00","c":1,"r":"tw","u":"https://money.udn.com/money/story/5612/9864236","p":1794013200,"a":1794093180,"t":"祥碩、樺漢、元太談展望","su":"科技指標廠法說會下周接力登場，祥碩、樺漢、元太將依序於10日、11日及12日舉行，市場聚焦高速傳輸晶片新品進度、工業電腦零組件供需，以及電子紙跨足AI材料的新布局，三家公司對第4季與明年營運看法，將成為掌握科技產業需求的重要風向球。"},{"s":"Vistra: 데이터 센터 전력 수요는 텍사스 그리드에서 벗어나지 않았으며 여전히 주요 병목 현상으로 남아 있습니다.","so":"鉅亨網","tm":"11/07 06:32","c":1,"r":"tw","u":"https://news.cnyes.com/news/id/6651766","p":1794000755,"a":1794007140,"t":"Vistra：資料中心用電需求未轉離德州併網仍是主要瓶頸","su":"Vistra: 데이터 센터 전력 수요는 텍사스에서 벗어나지 않았고 그리드 연결은 여전히 ​​주요 병목 현상입니다. Uanalyze 2026년 11월 7일(Uanalyze/Industrial Data Center Report) ⸺ 미국 발전 회사인 Vistra(VST-US)는 11월 6일 중간 선거 이후 대규모 전력 고객이 텍사스에서 미국 동부의 PJM 전력 시장으로 수요를 이동하는 것을 보지 못했다고 말했습니다. 클라우드 거대 기업과 데이터센터 운영자는 여전히 전력공급 협상을 활발히 진행하고 있다. 프로젝트 진행에 실제로 영향을 미치는 것은 전력망에 연결될 수 있을 때입니다. Vistra 경영진은 3분기 입법 회의에서 텍사스가 여전히 매력적인 시장이라고 언급했습니다. 데이터 센터는 물 사용, 토지 및 세금 부담에 대한 조사를 받고 있으며 이는 텍사스에만 국한되지 않습니다. 고객이 위치를 평가할 때 가장 중요하게 생각하는 것은 전력 확보 속도와 지역 사회 및 정부의 지원 여부입니다. 이 회사는 기존 및 신규 가스 화력 발전소를 포괄하는 텍사스의 대규모 전력 프로젝트를 위해 PJM과 계속해서 협상하고 있습니다. 또한 후속 원자력 구매 계약의 기회에 대해 낙관하고 있지만 서명 일정을 확정하지는 않았습니다."},{"s":"Anthropic의 가치는 7조 8천억으로 줄어들 수도 있고, IPO도 차갑고, 의구심으로 자금조달도 20% 줄여야 한다","so":"信報網站","tm":"11/07 04:38","c":1,"r":"hk","u":"https://www.hkej.com/dailynews/international/article/4560214/Anthropic%E4%BC%B0%E5%80%BC%E6%81%90%E5%89%8A%E8%87%B37.8%E8%90%AC%E5%84%84","p":1793993924,"a":1794007140,"t":"Anthropic估值恐削至7.8萬億 IPO遇冷 受質疑集資應縮兩成","su":"월스트리트저널은 인공지능(AI) 스타트업 앤트로픽(Anthropic)이 당초 기업가치 1조5000억 달러(약 11조7000억 홍콩달러)로 기업을 공개하고 최대 1000억 달러를 조달할 계획이었다고 보도했다. 그런데 최근 AI 관련 주식이 매도됐다. 매각 후 일부 주요 투자자들은 평가 목표에 대해 의문을 제기했습니다. 일부에서는 가치 평가액이 미화 1조 달러(약 HK$ 7조 8000억)에 가까워야 한다고 믿었고, 다른 투자자들은 조달 자금 규모가 약 800억 달러(약 HK$ 6240억)로 20% 감소해야 한다고 믿었습니다. 결정을 내리기 전에 10월에 결과를 기다려 보십시오. Anthropic은 미국 추수감사절 일주일 전에 상장할 계획입니다."},{"s":"'27조' 원전 수출 잭팟 뒤집은 '1조' 공사비…비상등 켜진 '팀코리아' - 머니투데이","so":"머니투데이","tm":"11/07 04:30","c":1,"r":"kr","u":"https://www.mt.co.kr/amp/estate/2026/11/07/2026110610091294957","p":1793993400,"a":1794059580,"su":"체코 두코바니 원전 수주로 유럽 원전 시장 진출의 교두보를 마련한 한국 원전업계가 뜻 밖의 암초를 만났다. 사업을 함께 준비해 온 한국수력원자원(한수원)과 대우건설·두산에너빌리티 컨소시엄이 공사비와 위험 분담 문제를 놓고 충돌하면서 '팀코리아'가 해체 위기에 내몰렸다."},{"s":"Wistron과 Wiwynn의 10월 매출은 같은 기간 동안 최고치를 기록했습니다.","so":"UDN","tm":"11/07 03:51","c":1,"r":"tw","u":"https://udn.com/news/story/7252/9862954","p":1793991078,"a":1794007140,"t":"緯創、緯穎10月營收創同期新高","su":"주요 파운드리 제조사인 위스트론(Wistron)과 위윙(Wiwing)은 6일 10월 연결 매출을 동시에 발표해, 두 회사 모두 같은 기간 최고치를 경신했고, 한 달 역사상 두 번째로 높은 실적을 기록했다. 법률 관계자는 Wistron과 Wiwynn의 4분기 합산 매출이 AI 서버 출하의 지속적인 지원으로 계속 이익을 얻었으며 새로운 단일 분기 최고치를 설정하여 연간 실적을 최고점에 도전할 수 있다고 낙관하고 있다고 지적했습니다."},{"s":"야마토, 선제공격하고 신화목표주가 하향","so":"UDN","tm":"11/07 03:32","c":1,"r":"tw","u":"https://udn.com/news/story/7252/9862918","p":1793989931,"a":1794007140,"t":"大和開第一槍 調降信驊目標價","su":"대만 주식은 어제(6일) 왕신화 주가가 한계점까지 떨어지는 등 큰 매도압력을 받았다. 신화통신이 3분기 재무보고서를 발표한 후 다이와캐피털은 첫 번째 시도에 나서 목표주가를 26,660위안에서 21,800위안으로 18.2% 하락한 수준으로 낮췄다. '매수' 등급을 유지했지만 AI 데이터센터 자본 지출의 미래에 대한 시장의 우려가 커지고 있음을 반영했습니다."},{"s":"에어비앤비, 세 번째로 매출 전망 상향 조정","so":"信報網站","tm":"11/07 03:26","c":1,"r":"hk","u":"https://www.hkej.com/dailynews/international/article/4560216/Airbnb%E7%AC%AC%E4%B8%89%E5%BA%A6%E4%B8%8A%E8%AA%BF%E6%94%B6%E5%85%A5%E9%A0%90%E6%B8%AC","p":1793989586,"a":1794007140,"t":"Airbnb第三度上調收入預測","su":"단기 숙소 임대 플랫폼 에어비앤비(Airbnb)의 3분기 매출은 전년 동기 대비 19% 증가해 3년 만에 최대 증가율인 48억7000만 달러를 기록해 시장 기대치인 47억5000만 달러를 넘어섰다. 회사는 세 번째로 연간 매출 전망을 상향 조정하고 최대 120억 달러에 달하는 새로운 자사주 매입 계획을 발표했습니다. 이에 따라 미국 금요일 오전에 주가는 8.6% 반등한 미화 184,825달러를 기록했습니다. 지난 분기에 38% 더 많은 수익을 올렸고 새로운 자사주 매입을 시작했습니다. 강력한 여행 수요와 결제 지연, 보다 유연한 취소 정책 등 지난 해 도입된 기타 상품 기능 덕분에 에어비앤비의 총 주문 금액은 지난 분기에 21% 증가한 27건이 되었습니다."}]},{"name":"🤖 로봇","note":"","breaking":false,"items":[{"s":"Innodisk 재무 보고서/AI 서버는 3분기 이익을 13배 이상 늘렸고 EPS는 93.09위안이라는 새로운 최고치를 기록했습니다.","so":"UDN","tm":"11/06 19:54","c":4,"r":"tw","u":"https://udn.com/news/story/7252/9862585","p":1793962476,"a":1793974680,"t":"宜鼎財報／AI 伺服器推升第3季獲利年增逾13倍、EPS 93.09元 再創新高","su":"메모리 모듈 제조사 이노디스크(5289)가 6일 3분기 재무보고서를 발표했다. AI 서버가 주도하는 고급 메모리 및 스토리지 수요에 힘입어 해당 분기 세후 순이익은 90억 6천만 위안으로 연간 1,310.7% 증가했습니다. 주당 순이익은 93.09위안으로 영업 최고치를 경신했습니다. 회사 측은 그룹 AI 관련 애플리케이션 매출이 40% 이상을 차지하며 글로벌 클라우드 서비스 제공업체(CSP), AI 서버 공급망, 휴머노이드 로봇 고객사를 성공적으로 확대했다고 밝혔다. 고급 컴퓨팅 비즈니스 기회를 포착하기 위해 AI 인프라와 엣지 AI 시스템의 이중 트랙 레이아웃을 이어갈 것입니다."},{"s":"신화통신, 세계 최초의 AI 생체공학 로봇 앵커 출시, 장이모우가 이미지 디자인","so":"星島頭條","tm":"11/06 16:39","c":4,"r":"hk","u":"https://www.stheadline.com/realtime-china/3634227/%E6%96%B0%E8%8F%AF%E7%A4%BE%E6%8E%A8%E5%85%A8%E7%90%83%E9%A6%96%E5%80%8BAI%E4%BB%BF%E7%94%9F%E6%A9%9F%E6%A2%B0%E4%BA%BA%E4%B8%BB%E6%92%AD-%E5%BC%B5%E8%97%9D%E8%AC%80%E6%93%8D%E5%88%80%E8%A8%AD%E8%A8%88%E5%BD%A2%E8%B1%A1","p":1793950797,"a":1793955540,"t":"新華社推全球首個AI仿生機械人主播 張藝謀操刀設計形象","su":"기술 및 미디어 애플리케이션은 최근 새로운 혁신을 가져왔습니다. 신화통신과 인공지능(AI) 기업 'Ubtech'가 공동 개발한 세계 최초의 생체 공학 휴머노이드 로봇 뉴스 앵커 'Xinyan'과 'Xinyu'가 11월 5일 제7회 세계 미디어 서밋에서 공식 공개되었습니다. 두 로봇은 실제 사람을 1:1 비율로 채택했으며 본토의 유명 감독인 Zhang Yimou가 이미지 크리에이티브 디자이너로 활동하며 현장 보도 능력도 갖추고 있습니다. AI 환상을 피하기 위해 실시간으로 정보를 추출합니다. 신화통신은 이번에 출연한 여성 앵커 '신옌'과 남성 앵커 '신위'의 이름이 '새로운 말이 새로운 지식을 열고, 신옌이 정직하게 말한다'는 의미를 갖고 있어 뉴스 전달에 대한 신뢰를 갖고 있다고 지적했다."},{"s":"지드래곤 마음도 훔친 차였는데…테슬라 '사이버트럭' 3년 만에 단종 수순","so":"전자신문","tm":"11/07 08:16","c":3,"r":"kr","u":"https://www.etnews.com/20261107000006","p":1794006979,"a":1794023400,"su":"테슬라가 야심 차게 내놓은 전기 픽업트럭 사이버트럭의 생산을 단계적으로 축소한다. 당초 연간 50만대 판매를 목표로 내세웠지만 실제 판매량이 기대에 크게 못 미친 데다, 회사가 자율주행 사업에 생산 역량을 집중하면서다. 일론 머스크 테슬라 최고경영자(CEO)는 6일(현지시간) 소셜미디어 엑스(X)를 통해 내년 중반부터 텍사스 기가팩토리에서 사이버트럭 생산을 단계적으로 줄일 계획이라고 밝혔다. 생산 공간은 차세대 자율주행 차량인 사이버캡 제조에"},{"s":"\"홍콩 주식\" 기술주가 항셍지수를 더 높이 끌어올렸습니다 - 국제","so":"旺得富理財網","tm":"11/09 12:15","c":2,"r":"tw","u":"https://wantrich.chinatimes.com/news/20261109900155-420201","p":1794194152,"a":1794195338,"t":"《港股》科技股帶動恆指走高- 國際","su":"[류지강 편, 타임즈 편, 외신 종합 보도] 홍콩 항셍지수는 9일 100포인트 이상 상승해 최고점 24,738.88을 기록했고, 현재는 0.47%(115.3포인트) 오른 24,597.16포인트를 기록하고 있다. 같은 기간 공기업 지수도 0.58%(48.16포인트) 오른 8,322.26포인트를 기록했다. 대형 기술주는 대부분 상승했다. 예를 들어 텐센트는 1%, 알리바바는 1.9%, 메이투안은 0.1%, 샤오미는..."},{"s":"\"산업 분석\" 메모리 모듈 제조사, 소비재 시장에서 벗어나 AI 고부가가치 사업 기회 포착 (2-2)","so":"旺得富理財網","tm":"11/09 11:26","c":2,"r":"tw","u":"https://wantrich.chinatimes.com/news/20261109900119-420101","p":1794191179,"a":1794195339,"t":"《產業分析》擺脫消費市場 記憶體模組廠搶攻AI高附加價值商機(2-2)","su":"[타임즈 예시안 기자가 타이페이에서 보도했습니다.] 메모리 시장의 공급은 계속 부족하고 가격도 여전히 높은 상태입니다. 또한 메모리 모듈 제조업체는 제품 믹스 조정을 가속화하여 기존 소비자 시장에 대한 의존도를 줄이고 AI, 엔터프라이즈급 스토리지 및 산업 제어와 같은 고부가가치 애플리케이션으로 적극적으로 전환했습니다. Phison(8299), ADATA(3260), TEAMGROUP(4967), Innodisk(5289)는 모두 AI 관련 레이아웃을 적극적으로 확장하고 있습니다. 이 중 파이슨의 3분기 AI 생태계 모듈 매출은…"},{"s":"[다시보기] 휴머노이드 빅뱅 1회","so":"programs.sbs.co.kr","tm":"11/09 00:43","c":2,"r":"kr","u":"https://programs.sbs.co.kr/programTemplate/amp/vod/humanoidbigbang/22000639386","p":1794152602,"a":1794177888,"su":"1회 휴머노이드 빅뱅 육체를 얻은 AI, 공존의 조건 방송일 2026.11.08 (월) 로봇의 관절인 액추에이터와 손가락에 숨겨진 비밀부터, 중국의 600만 원짜리 보급형 로봇 공세, 한국 기업들의 숨겨진 무기까지! “로봇이 내 노동을 대신해 줄 때, 인간은 무엇을 하며 살아야 하는가” 라는 질문에 유쾌하지만 묵직한 답을 찾아 나선다."},{"s":"Snow Man 무카이 야스지&M!","so":"朝日新聞","tm":"11/08 19:00","c":2,"r":"jp","u":"https://www.asahi.com/and/entertainment/17033534","p":1794132000,"a":1794148524,"t":"Snow Man向井康二＆M!LK山中柔太朗、岡田准一と“神対応”ファンサ連発 “踊るロボット”とのダンスコラボも実現","su":"Mr.마릭의 “핸즈 파워”초마술에는 일동 대흥분 9일 방송의 TBS계 버라이어티 “오카다 준이치와 로버트 아키야마의 지금조차 시로! 」(후 10:00)에 Snow Man의 무카이 야스지, M!LK의 야마나카 유타로, YOU가 게스트 출연한다. 【사진】귀중 쇼…"},{"s":"파키스탄에서 제작한 로봇이 카라치 식당에 미래의 맛을 선사합니다","so":"France 24","tm":"11/08 11:09","c":2,"r":"us","u":"https://www.france24.com/en/live-news/20261108-pakistan-built-robots-serve-taste-of-future-to-karachi-diners","p":1794103796,"a":1794109980,"t":"Pakistan-built robots serve taste of future to Karachi diners"},{"s":"경제사설/AI 시장 열기는 가라앉고, 가치 테스트는 이제 시작됐다","so":"UDN","tm":"11/07 04:05","c":2,"r":"tw","u":"https://udn.com/news/story/7338/9862908","p":1793991915,"a":1794007140,"t":"經濟日報社論／AI行情退燒 價值考驗才開始","su":"미국 기술주는 5일 나스닥 지수가 전 고점 대비 5% 이상 급락, 10% 이상 하락하며 공식적으로 중기 조정권에 진입하는 등 전반적으로 폭락했다. 필라델피아 반도체 지수는 하루 만에 10% 이상 급락했다. 판매 압력은 즉시 아시아로 퍼졌습니다. 대만 증시는 지난 6일 장중 한때 3,700포인트 이상 급락한 뒤 결국 1,873포인트 하락한 39,701포인트로 마감해 역대 4번째로 큰 종가인 4만선 아래로 떨어졌다. 한국증시에도 서킷브레이커가 발동됐다. AI 시장이 거품이 됐는지 여부는 글로벌 주식시장에 가혹한 시험대가 됐다."},{"s":"Guangyu의 10월 매출은 연간 성장을 위해 노력하면서 전월 대비 18.22% 감소했습니다.","so":"自由時報","tm":"11/06 20:06","c":2,"r":"tw","u":"https://stock.ltn.com.tw/article/hcvrbbuutkfq","p":1793963172,"a":1793974680,"t":"廣宇10月營收月減18.22％ 力拚全年成長","su":"Hon Hai Group의 자회사인 Guangyu(2328)는 10월 연결 수익이 19억 9,600만 위안으로 월간 18.22% 감소, 연간 27.82% 증가했습니다. 올해 10월 누적 수입은 182억8200만 위안으로 연간 0.66% 감소했다. 광위는 10월이 자동차 제품 모멘텀 둔화, 핵심 소재 납품 지연, 일부 부품 제품 성수기 등 요인의 영향을 받아 9월에 비해 매출이 감소했다고 지적했다. 그러나 지난해 같은 기간의 기준기간 감소로 인해 연간 성장률은 여전히 ​​둔화됐다."},{"s":"브이디에스, '딥테크 팁스' 선정…휴머노이드 핸즈용 액추에이터 기술 개발 본격화","so":"아시아경제","tm":"11/06 17:10","c":2,"r":"kr","u":"https://www.asiae.co.kr/article/2026110617013294029","p":1793952600,"a":1793955540,"su":"로봇용 정밀 감속기 전문기업 브이디에스(VDS, 대표 정창훈)가 중소벤처기업부의 &#039;딥테크 팁스(Deep Tech TIPS)&#039; 프로그."},{"s":"'전자부품그룹' 판웨이머티리얼즈, 미국 휴머노이드 로봇 공급망 진출, 내년 매출총이익 증가 예상 - 상장카운터","so":"旺得富理財網","tm":"11/06 14:48","c":2,"r":"tw","u":"https://wantrich.chinatimes.com/news/20261106900179-420101","p":1793944101,"a":1793944200,"t":"《電零組》汎瑋材料打入美系人形機器人供應鏈明年毛利獲利看升- 上市櫃","su":"[타임즈 장한기 기자가 타이페이에서 보도했다] 판웨이 재료(6967)가 휴머노이드 로봇을 추구하는 데 있어 좋은 소식을 전했고 미국의 주요 제조업체에 휴머노이드 로봇을 공급하는 데 성공했다. 휴머노이드 로봇 출하량이 점차 증가함에 따라 Fanwei의 총괄 관리자인 Li Huixiang은 내년에 휴머노이드 로봇이 매출의 3~5%를 차지할 것으로 예상하고, AI 서버와 휴머노이드 로봇이 매출의 20% 이상을 차지할 것으로 예상한다고 말했습니다. 2027년 매출총이익과 수익성은 올해보다 좋아질 것이다. Fanwei는 AI 서버와 고성능 운영을 적극적으로 배포합니다..."},{"s":"[역사상 최대 GPU 절도] 엔비디아의 AI 칩 9천만 위안에 가까운 미국에서 미스터리하게 도난당했다, '물류로 위장한' 범국가 범죄 집단에 의해 감청된 혐의","so":"香港經濟日報HKET","tm":"11/09 12:14","c":1,"r":"hk","u":"https://inews.hk   S.tab = i; S.shown = D.show; save('tab', i);
  if(!(t.name in S.prev)) S.prev[t.name] = S.seen[t.name] || 0;     // 이 탭에서 NEW 로 보여줄 기준
  S.seen[t.name] = Math.max(S.seen[t.name] || 0, newest(t)); save('seen', S.seen);  // 탭에 들어오면 레드닷 지움
  history.replaceState(null, '', '#t'+i);
  renderTabs(); renderCtrl(); renderMain(); window.scrollTo(0, 0);
}
function setSort(k){ S.sort = k; save('sort', k); S.shown = D.show; renderCtrl(); renderMain(); }
function setRegion(k){ S.region = k; save('region', k); S.shown = D.show; renderTabs(); renderCtrl(); renderMain(); }
function more(){ S.shown += 20; renderMain(); }
function less(){ S.shown = D.show; renderMain(); window.scrollTo(0, 0); }
$('upd').textContent = '업데이트 ' + D.updated + ' · 탭을 눌러 테마별 뉴스 보기';

// 🚨 미국 속보는 페이지를 새로 올리지 않아도 최신 내용을 바로 가져옴
var BI = D.themes.findIndex(function(t){ return t.breaking; });
function refreshBreaking(){
  if(BI < 0 || !window.fetch) return;
  fetch(D.breaking_url + '?t=' + Date.now(), {cache:'no-store'}).then(function(r){ return r.json(); }).then(function(b){
    var items = (b.items || []).map(function(n){
      var d = {s:n.show, so:n.source||'', tm:n.time||'', c:n.count||1, r:'us', u:n.url||n.link, p:Math.floor(n.pub), a:Math.floor(n.added||n.pub)};
      if(n.show !== n.title) d.t = n.title; if(n.sum) d.su = n.sum; return d;
    });
    if(!items.length && D.themes[BI].items.length) return;
    D.themes[BI].items = items;
    if(S.tab === BI){ S.seen[D.themes[BI].name] = Math.max(S.seen[D.themes[BI].name]||0, newest(D.themes[BI])); save('seen', S.seen); renderMain(); }
    renderTabs();
  }).catch(function(){});
}
openTab(S.tab);
refreshBreaking();
setInterval(refreshBreaking, 5 * 60 * 1000);
document.addEventListener('visibilitychange', function(){ if(!document.hidden) refreshBreaking(); });

// 기사를 누르면 먼저 한국어 요약 → 원문 볼지 선택
document.addEventListener('click', function(e){
  var c = e.target.closest('a.card'); if(!c) return;
  if(e.ctrlKey||e.metaKey||e.shiftKey) return;
  e.preventDefault();
  $('s-meta').innerHTML = c.querySelector('.meta').innerHTML;
  $('s-title').textContent = c.querySelector('.title').textContent;
  var o = c.querySelector('.orig'); $('s-orig').textContent = o ? o.textContent : '';
  var sm = c.dataset.s || '';
  $('s-sum').textContent = sm || '이 기사는 요약을 가져오지 못했어요. (사이트가 자동 접속을 막았거나 아직 준비 중)';
  $('s-sum').className = 's-sum' + (sm ? '' : ' empty');
  $('s-go').href = c.href;
  $('dim').hidden = false; $('sheet').hidden = false; $('sheet').scrollTop = 0;
  document.body.style.overflow = 'hidden';
});
function closeSheet(){ $('dim').hidden = true; $('sheet').hidden = true; document.body.style.overflow = ''; }
document.addEventListener('keydown', function(e){ if(e.key==='Escape') closeSheet(); });
</script></body></html>
