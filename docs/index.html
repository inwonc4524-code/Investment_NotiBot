화학, LG엔솔 지분 매각 수조원 조달에도 재무 개선 '지지부진' |","so":"연합인포맥스","tm":"11/25 08:57","c":1,"r":"kr","u":"https://news.einfomax.co.kr/news/articleViewAmp.html?idxno=4446375","p":1795564625,"a":1795608186,"su":"LG화학, LG엔솔 지분(회사를 나눠 가진 몫) 매각 수조원 조달에도 재무 개선 '지지부진' LG에너지솔루션 지분 76.6%까지 감소…70%까지 감축 예정 배터리·첨단소재·석유화학 업황 악화로 신용등급 강등 (서울=연합인포맥스) 한종화 기자 = LG화학[051910]이 LG에너지솔루션[373220]의 지분을 매각해 수년째 대규모 자본을 조달하고 있지만 재무 건전성은 크게 개선되지 않은 것으로 나타났다. 25일 업계와 공시에 따르면 LG화학은 지난달 LG에너지솔루션 주식 653만5천939주를 주가수익스왑(PRS) 방식으로 처분한다고 밝혔다."},{"s":"신영證 \"이차전지, 내년엔 '이익 확인'…ESS가 실적 견인\"","so":"연합인포맥스","tm":"11/25 08:48","c":1,"r":"kr","u":"https://news.einfomax.co.kr/news/articleView.html?idxno=4446373","p":1795564139,"a":1795565195,"su":"이차전지 업종이 내년에는 이익을 확인하는 국면에 들어설 것이라는 분석이 나왔다.미국 에너지저장장치(ESS)가 이익 개선세를 이끌고, 부진했던 유럽 전기차 배터리(전기차를 움직이는 큰 충전 배터리) 납품도 바닥을 통과하고 있다는 판단에서다.박진수 신영증권 연구원은 25일 보고서에서 \"2027년 이차전지 업종은 반등의 기대에서 이익 확인으로 넘어가는 시점\"이라며 \"LG에너지솔루션과 삼성SDI의 2027년 합산 영업이익(장사해서 남긴 돈)은 올해 대비 199% 증가할 전망\"이라고 설명했다.이 가운데 ESS 사업부가 약 70%를 차지할 것이라는 분석이다.박 연구원은 \"지난 3년간 실적 부진의"},{"s":"태성, 복합동박 공장 준공…이차전지 소재 경쟁력 강화","so":"한스경제","tm":"11/25 08:08","c":1,"r":"kr","u":"http://www.hansbiz.co.kr/news/articleView.html?idxno=886883","p":1795561709,"a":1795574635,"su":"| 서울=한스경제 김종효 기자 | 코스닥(한국 중소·기술 회사들이 모인 주식시장) 상장(주식시장에 처음 들어오는 것)사 태성이 24일 경기도 안산시 성곡동 복합동박 신소재공장에서 준공식을 열고 차세대 이차전지 소재사업을 넓히기 위한 생산 기반을 마련했다고 25일 밝혔다.준공된 안산 신소재공장은 종전 1512평 규모 건물을 증축하고 개조해 총 2818평 규모의 생산 시설로 탈바꿈했다. 회사는 이곳을 복합동박 소재 생산의 핵심 기지로 삼고, 앞으로 늘어날 고객사 수요에 맞춘 생산체계를 갖춰갈 예정이다.태성은 기존 인쇄회로기판(PCB) 습식공정 장비사업에서 축적한 정밀 표면처리 및 도금 기술을 토대로 복합동"},{"s":"축전지 산업, 성장의 기둥에… 도쿠시마 배터리 밸리 구상의 지금","so":"ニュースイッチ by 日刊工業新聞社","tm":"11/25 06:01","c":1,"r":"jp","u":"https://newswitch.jp/p/50905","p":1795554060,"a":1795560817,"t":"蓄電池産業、成長の柱に…徳島バッテリーバレイ構想の今","su":"도쿠시마현이 축전지 산업을 지역 경제의 기둥으로 키우려고 하고 있다. 2024년 7월에 책정한 「도쿠시마 배터리 밸리 구상」을 축으로, 현내에 집적하는 전지 재료나 부재, 제조 설비 등의 강점을 살리면서, 기업 유치와 현내 기업의 육..."},{"s":"배터리 재활용 사업 매각 계획, 바스프는 양극재로 초점 전환","so":"第一财经","tm":"11/25 04:32","c":1,"r":"cn","u":"https://www.yicai.com/news/103452333.html","p":1795548747,"a":1795560815,"t":"拟出售电池回收业务，巴斯夫将重心转向正极材料","su":"5년 전 독일 화학 대기업 바스프가 배터리 소재 사업에 최대 45억유로(약 4조원) 규모의 투자 계획을 제안했다. 이제 글로벌 전기 자동차 및 배터리 시장 환경이 변화함에 따라 바스프는 배터리 소재 사업 레이아웃을 더욱 조정하고 양극 활물질 분야에 자원을 집중했습니다. 제일재경 기자는 오늘 바스프 공식 웹사이트를 통해 바스프가 11월 20일 독일 배터리 재활용 회사인 Cylib와 유럽과 북미 지역의 배터리 재활용 사업을 Cylib에 매각하기로 계약을 체결했다는 사실을 알게 되었습니다. 이번 거래에는 독일 슈바르츠하이데에 위치한 흑색 화약 생산 공장과 배터리 재활용 프로토타입 공장뿐만 아니라 관련 지적 재산, 고객 계약 및 파트너십도 포함됩니다. 이번 거래는 관련 규제 당국의 승인과 기존 마감 조건 충족을 거쳐 2027년 2분기~3분기에 완료될 것으로 예상된다. 당사자들은 거래 금액을 공개하지 않았습니다."},{"s":"서머셋 전기 배터리 기가팩토리 건설사 탈락","so":"BBC","tm":"11/25 01:22","c":1,"r":"world","u":"https://www.bbc.com/news/articles/cx30g8005684o","p":1795537359,"a":1795560818,"t":"Somerset electric battery gigafactory builder drops out","su":"TSL은 2026년 브리지워터 인근에 기가팩토리(배터리 등을 아주 많이 만드는 거대한 공장) 외관을 건설하는 계약을 체결했다."}]},{"name":"⚡ 전고체배터리·ESS","note":"보유: KODEX 전고체배터리ESS TOP2플러스","breaking":false,"items":[{"s":"중국 최초의 600MW 압축 공기 에너지 저장 시스템 확장기가 생산 라인에서 성공적으로 출시되었습니다.","so":"央视网","tm":"11/25 13:31","c":4,"r":"cn","u":"https://news.cctv.com/2026/11/25/ARTIkgQ4mgsDIZQEdz8okktV261125.shtml","p":1795581079,"a":1795582121,"t":"我国首套600MW级压缩空气储能系统膨胀机顺利下线","su":"최근 중국은 압축 공기 에너지 저장 시스템의 연구 개발에 획기적인 발전을 이루었습니다. 중국과학원 열물리공학연구소와 China Reserve Guoneng (Beijing)가 개발한 세계 최초의 600MW 압축 공기 에너지 저장 시스템 확장기가 통합 테스트를 완료하고 성공적으로 생산 라인을 가동했습니다."},{"s":"포스텍, '무거운 가압 장치' 뺀 전고체 리튬금속전지 개발…상용화 앞당긴다","so":"전자신문","tm":"11/26 10:37","c":3,"r":"kr","u":"https://www.etnews.com/20261126000195","p":1795657054,"a":1795663014,"su":"포스텍(POSTECH)은 박수진 화학과 교수와 이형석 박사, 통합과정 성지훈 씨 연구팀이 문장혁 중앙대 교수, 한국기초과학지원연구원(KBSI) 이영주 박사, 미국 서던메소디스트대(SMU) 동하이 왕 교수팀과 함께 상온·저압에서도 안정적으로 작동하는"},{"s":"L&T, 구자라트에서 300MW급 배터리 에너지 저장 프로젝트 개발 수주","so":"The Economic Times","tm":"11/25 15:13","c":3,"r":"us","u":"https://m.economictimes.com/industry/renewables/lt-secures-major-300-mw-battery-energy-storage-project-in-gujarat-to-enhance-renewable-energy-integration/amp_articleshow/136150348.cms","p":1795587180,"a":1795589915,"t":"L&T wins order to develop 300 MW battery energy storage project in Gujarat","su":"Larsen & Toubro는 300MW/900MWh 배터리 에너지 저장 시스템을 개발하기 위한 중요한 주문을 확보했습니다. 이 프로젝트는 구자라트주 카브다(Kavda)에 위치하고 있으며 재생 가능 에너지 저장 능력을 향상시키는 데 중점을 두고 있습니다. 이 시설은 잉여 재생 에너지를 저장했다가 수요가 가장 많은 기간에 공급할 것입니다. 인도 내 전력망(발전소 전기를 집·공장까지 보내는 전깃줄 그물) 안정성과 신뢰성을 향상시키는 것을 목표로 합니다."},{"s":"삼기에너지솔루션즈, UGV 플랫폼용 배터리팩 발주 접수","so":"뉴시스","tm":"11/25 11:07","c":3,"r":"kr","u":"https://www.newsis.com/view/NISX20261125_0003882473","p":1795572443,"a":1795577496,"su":"[서울=뉴시스] 김경택 기자 = 이차전지 부품 전문기업 삼기에너지솔루션즈는 최근 로봇 전문기업 비욘드로봇으로부터 무인지상차량(UGV) 플랫폼용 배터리팩 발주를 접수했다고 25일 밝혔다. 회사 측에 따르면 이번 제품은 과학기술정보통신부 국책과제로 개발 중인 험지주행 UGV 플랫폼에 적용될 예정이다.회사는 배터리관리시스템(BMS(배터리를 안전하게 관리하는 장치))과 배터리팩을 자체 설계·제작하.."},{"s":"아이씨에이치, 美 친환경 정책 기대감…ESS 배터리 소재 공급 확대","so":"뉴시스","tm":"11/25 10:54","c":3,"r":"kr","u":"https://www.newsis.com/view/NISX20261125_0003882444","p":1795571652,"a":1795574646,"su":"[서울=뉴시스] 김경택 기자 = 첨단 전자소재 전문기업 아이씨에이치는 미국의 친환경 에너지 정책 강화 기대감이 커지고 있는 가운데 에너지저장장치(ESS(전기를 저장해 두는 큰 배터리)) 배터리용 소재 공급을 확대할 예정이라고 25일 밝혔다.회사 측에 따르면 미국 중간선거 이후 친환경 에너지 정책이 강화될 것이라는 기대감에 ESS 산업이 다시 주목받고 있다. 미국의 정책 변화로 ESS 투자.."},{"s":"맥셀의 전고체 전지를 요코가와 전기가 채용, PLC 신제품의 RTC 백업 전원으로서: 임베디드 채용 사례","so":"MONOist","tm":"11/26 13:30","c":2,"r":"jp","u":"https://monoist.itmedia.co.jp/mn/articles/2611/26/news061.html","p":1795667400,"a":1795676849,"t":"マクセルの全固体電池を横河電機が採用、PLC新製品のRTCバックアップ電源として：組み込み採用事例","su":"맥셀은 이 회사의 세라믹 패키지형 전고체(액체 대신 고체를 넣어 더 안전한 배터리) 전지 「PSB401010H」가 요코가와 전기의 PLC 「OpreX Universal Autonomous Control System」에 채용되었다고 발표했다."},{"s":"정석케미칼, 도로 위 하얀 선에서 전고체 배터리까지 확장","so":"매일경제","tm":"11/26 00:00","c":2,"r":"kr","u":"https://www.mk.co.kr/news/special-edition/12218194","p":1795618800,"a":1795647120,"su":"전북 완주에 본사를 둔 정석케미칼은 노면표지용 도료를 만들어 온 기업이다. 미끄럼방지포장재와 우레탄·에폭시 방수바닥재 등을 생산하고 있으며 최근 전고체 배터리(액체 대신 고체를 넣은 안전한 배터리)용 전해질(배터리 안에서 전기 알갱이가 지나다니는 길) 원료인 황화리튬으로 사업 영역을 넓히고 있다. 회사는 올해 품질경쟁력우수기업에 7회째 선정됐다. 국가품질혁신경진대회에서는 2025년 현장 개선 부문에 이어 올해에도 금상을 받았고, 전북특별자.."},{"s":"솔리스, 태평양 도서국 태양광·ESS 사업 본입찰 참여","so":"이데일리","tm":"11/25 11:54","c":2,"r":"kr","u":"https://www.edaily.co.kr/News/Read?newsId=02607606645649328&mediaCodeNo=257","p":1795575296,"a":1795577496,"su":"한화플러스제5호스팩(498390)과 합병 상장을 추진 중인 공정 유틸리티 설비 전문기업 솔리스가 태평양 도서국의 태양광·에너지저장장치(ESS(전기를 저장해 두는 큰 배터리)) 구축 사업 본입찰에 참여하며 신재생에너지(햇빛·바람처럼 다시 쓸 수 있는 에너지) 분야로 사업 영역 확대에 나선다. 솔리스는 국제개발기구 재원으로 추진되는 태평양 ..."},{"s":"3차 ESS 중앙계약시장 우선협상 대상자 선정…14곳 구축","so":"연합뉴스","tm":"11/26 19:57","c":1,"r":"kr","u":"https://www.yna.co.kr/view/AKR20261126190700530","p":1795690644,"a":1795694317,"su":"(서울=연합뉴스) 이재영 기자 = 제3차 에너지저장장치(ESS(전기를 저장해 두는 큰 배터리)) 중앙계약시장 우선협상 대상자를 선정했다고 기후에너지환경부와 전력거래소가 26일 ..."},{"s":"[모닝포스트] 신에너지저장 블록버스터 시행계획 발표… TCL Zhonghuan과 China Rare Earth는 다음 월요일에 거래를 재개합니다","so":"财联社","tm":"11/26 17:23","c":1,"r":"cn","u":"https://www.cls.cn/detail/2534356","p":1795681424,"a":1795694321,"t":"【早报】新型储能重磅实施方案印发；TCL中环、中国稀土下周一复牌","su":"①10월 재무 데이터 공개 ②중앙은행(나라의 돈과 이자를 관리하는 은행): 2000억 위안 규모의 매입 역환매 작업이 11월 16일 6개월 기간으로 진행된다. ③ 엔비디아 주가는 이번 주 13% 하락했다. ④ 2개 부문: 중국의 신규 에너지 저장 장치 설치 용량은 2030년까지 3억 킬로와트에 달할 것이다. ⑤TCL 센트럴과 중국 희토류는 다음 주 월요일 거래를 재개할 예정이다. 매크로뉴스 1. 중앙은행 자료에 따르면 예비통계에 따르면 2026년 1~10월 사회융자 누적 증가액은 28조6100억 위안으로 지난해 같은 기간보다 2조2900억 위안이 줄었다. 10월 말 광의통화잔고(M2)는 359조600억 위안으로 전년 동기 대비 7.1% 증가했다. 10월 말 기준 내외대출 잔액은 287조2500억 위안으로 전년 동기 대비 4.6% 증가했다. 월말 기준 위안화 대출 잔액은 283조3300억 위안으로 전년 동기 대비 4.7% 증가했다. 첫 10개월 동안 위안화 대출은 11조4200억 위안 증가했다."},{"s":"GFESS 배터리 ETF는 400만주의 순청약을 보유하고 있으며, 안전마진이 높은 저위험군에서는 현재 프리미엄 및 할인율이 -0.23%이다.","so":"经济观察网","tm":"11/26 15:41","c":1,"r":"cn","u":"http://www.eeo.com.cn/2026/1126/1103898.shtml","p":1795675260,"a":1795694322,"t":"储能电池ETF广发净申购400万份份额，当前溢折率-0.23%处低风险区安全边际较高","su":"경제 관찰자 네트워크 에너지 저장 배터리 ETF(여러 주식을 묶어 파는 상품) Guangfa (159305)는 11월 25일 400만개를 순매수(산 돈이 판 돈보다 많은 것)했으며 이는 ETF 펀드 점유율의 0.43%를 차지합니다. 펀드의 최근 주식수는 9억2800만주로 상장 이후 누적 증가액은 7억700만주다. 최근 규모는 5억2200만 위안으로 증가했다."},{"s":"[철도 에너지 전환, 현장에서 길을 찾다] ⑥ 같은 ESS, 다르게 쓴다…동해선 평해·후포역 전력비 절감법","so":"전기신문","tm":"11/26 10:09","c":1,"r":"kr","u":"https://www.electimes.com/news/articleViewAmp.html?idxno=375233","p":1795655380,"a":1795663014,"su":"[철도 에너지 전환, 현장에서 길을 찾다] ⑥ 같은 ESS(전기를 저장해 두는 큰 배터리), 다르게 쓴다…동해선 평해·후포역 전력비 절감법 태양광(햇빛으로 전기를 만드는 것)은 주간 자가소비, ESS는 심야 충전…두 무인역서 시범운영 태양광 규모·전력 수요 고려해 운전…계절별 요금 시간대도 반영 LTE 원격 감시·이상 알림 적용…모듈별 소화설비로 안전관리 강화 지난달 16일 찾은 동해선 평해역. 열차 이용객을 맞는 역사 한편에서 에너지저장장치(ESS)가 정해진 시간표에 따라 충전과 방전을 반복한다."},{"s":"전고체 배터리 상용화 걸림돌 ‘압력’ 낮췄다… 포스텍, 저압 구동 구현","so":"Chosunbiz","tm":"11/26 09:08","c":1,"r":"kr","u":"https://biz.chosun.com/science-chosun/science/2026/11/26/4FFJXM45R5G57PLURYD5RVT2UE/?outputType=amp","p":1795651680,"a":1795663014,"su":"국내 연구진이 상온에서 낮은 압력으로도 안정적으로 작동하는 전고체 리튬금속전지를 개발했다. 전고체 배터리(액체 대신 고체를 넣은 안전한 배터리)의 상용화(실제로 팔고 쓰이기 시작하는 것) 걸림돌 중 하나인 높은 가압 조건을 완화할 수 있는 기술로, 향후 배터리의 무게와 부피를 줄이는 데 활용될 가능성이 있다. 박수진 포스텍 화학과 교수 연구진은 중앙대, 한국기초과학지원연구원(KBSI), 미 서던메소디스트대(SMU) 연구진과 공동으로 상온에서 0.3㎫(메가파스칼) 이하의 압력으로 작동하는 전고체 리튬금속전지를 구현했다고 26일 밝혔다."},{"s":"축전지, 주력 전원에","so":"日経クロステック","tm":"11/26 06:33","c":1,"r":"jp","u":"https://xtech.nikkei.com/atcl/nxt/column/18/03385/index.html?%3Fi_cid=nbpnxt_bn_child&fieldSubSeg=fdxKEYWORDUSBKEYWORDSoC","p":1795642414,"a":1795676852,"t":"蓄電池、主力電源に","su":"리튬(배터리에 꼭 들어가는 아주 가벼운 금속) 이온 전지를 이용한 축전지는 재생 가능 에너지의 출력 변동을 평준화하는 툴로서 전세계의 전력 계통에 대량 도입되고 있다. 해외에서는 이미 주력전원 중 하나가 된 예도 나왔다."},{"s":"27년 중국 자동차 '10대 기술', 전고체 전지에 브레이크스루 E2E는 벗어난다","so":"日経クロステック","tm":"11/26 05:00","c":1,"r":"jp","u":"https://xtech.nikkei.com/atcl/nxt/column/18/03565/112200049/","p":1795636800,"a":1795647129,"t":"27年の中国自動車「10大技術」、全固体電池にブレークスルー E2Eは外れる","su":"중국의 자동차 기술자 단체인 중국 자동차 공정 학회(CSAE)가 2027년 주목되는 자동차 기술 트렌드 10선(이하 10대 기술)을 발표했다. CSAE는 자동차 메이커나 부품 메이커의 기술자도 많이 참가하고 있다. 10대 기술에는 단순한 예측이라기 보다 목표로 하는 방향을 명확하게 하는 목표 설정으로서의 의미도 크다. 과거의 10대 기술의 경향과 비교함으로써 중국세의 미래 전략의 일단이 보였다."},{"s":"에너지 저장 정책은 Xiter의 보충을 지원합니다 - 매일","so":"工商時報","tm":"11/26 04:00","c":1,"r":"tw","u":"https://www.ctee.com.tw/news/20261126700322-439901","p":1795633200,"a":1795647125,"t":"儲能政策助攻熙特爾進補- 日報","su":"지난 10월 국립대만경제연구소가 발행한 '에너지 저장 산업'에 대한 미래 전망 산업 분석 보고서에서는 경제부 에너지 관리국이 기술적 에너지 저장 촉진을 확대할 계획이며, 이는 2026년 새로운 에너지 저장 구축 증가를 지원하는 데 도움이 될 것이라고 지적했습니다. 데이터 센터와 같은 대규모 전력 소비자가 적극적으로 에너지 저장 및 기타 에너지 절약 조치를 모색하는 환경에서 Xitel-Chuang의 중장기 운영 성과에 도움이 될 것입니다. (7740). 대만 증권 거래소와 대만 경제 아카데미는 협력하여 정기적으로 업계 보고서를 발행합니다. 대만 경제원(Taiwan Academy of Economics)은 지난 10월 에너지 저장 산업에 관한 산업 발전 보고서를 발표했습니다."},{"s":"동화일렉트로라이트, 북미서 신규 배터리 고객사 확보","so":"디일렉","tm":"11/25 17:26","c":1,"r":"kr","u":"https://www.thelec.kr/news/articleView.html?idxno=65915","p":1795595193,"a":1795608210,"su":"동화일렉트로라이트가 북미 전해액 사업의 고객 기반을 확대했다. 신규 고객사는 글로벌 배터리 시장 점유율 상위 10대 기업 중 한 곳이다.동화일렉트로라이트는 글로벌"},{"s":"화웨이 Smart String Grid Forming ESS Platform, 업계 최초로 TÜV SÜD 최고 등급(L4) 그리드포밍 인증 획득","so":"뉴시스","tm":"11/25 16:41","c":1,"r":"kr","u":"https://www.newsis.com/view/ALSX20261125_0000008356","p":1795592468,"a":1795612541},{"s":"요코가와 전기, 중소 플랜트용 컨트롤러 전고체 전지를 채용","so":"日本経済新聞","tm":"11/25 16:17","c":1,"r":"jp","u":"https://www.nikkei.com/article/DGXZQOUC256CJ0V21C26A1000000/","p":1795591046,"a":1795608215,"t":"横河電機、中小プラント向けコントローラー 全固体電池を採用","su":"요코가와 전기는 25일 중소규모 플랜트 설비용 제어 장치 '오플렉스 유니버설 자율 제어 시스템 R1.01'을 발매한다고 발표했다. 전고체(액체 대신 고체를 넣어 더 안전한 배터리) 전지를 내장해 보수하기 쉽게 했다. 의약품이나 식품 산업에서의 활용을 전망한다. 플랜트 내의 밸브나 펌프, 가열 장치 등의 제어 컨트롤러가 된다"},{"s":"Yiwei Lithium은 생산량을 줄일 수 있습니다! CATL은 6% 이상 하락했고, 배터리 ETF China Universal(159796) 지수는 4% 이상 하락했으며, 이러한 추세에 반해 자금이 확고하게 쏟아졌습니다! 에너지 저장 시장 전망에 대해 어떻게 생각하시나요? | 인터페이스 뉴스","so":"Jiemian.com","tm":"11/25 16:09","c":1,"r":"cn","u":"https://www.jiemian.com/article/15372066.html","p":1795590547,"a":1795608212,"t":"亿纬锂能减产！宁德时代跌超6%，电池ETF汇添富(159796)指数跌超4%，资金逆势坚定涌入！储能后市怎么看？ | 界面新闻","su":"11월 25일 A주(중국 본토(상하이·선전) 주식시장의 주식) 시장은 등락세를 보이며 조정을 받았습니다. 상하이증권거래소 지수는 1% 이상 하락했다. 새로운 에너지 부문은 다시 압박을 받았습니다. 배터리 ETF(여러 주식을 묶어 파는 상품) 차이나 유니버셜(159796)의 기초지수는 4% 이상 하락했다. 이러한 흐름을 거스르며 배터리 부문에 자금이 쏟아졌다. 배터리 ETF China Universal(159796)은 세션 동안 소폭 자금을 유치했습니다."},{"s":"전기차 넘어 ESS까지…中 배터리 공습에 영국 '비상'" E5%8B%95%E8%BB%8A%E9%9B%BB%E6%B1%A0%E7%94%9F%E7%94%A2%E8%80%85%E8%B2%AC%E4%BB%BB%E8%A8%88%E5%8A%83","p":1795516200,"a":1795521547,"t":"時事通識｜電動車電池生產者責任計劃","su":"홍콩에서는 전기 자동차의 인기가 점점 높아지고 있으며 그 수가 180,000대가 넘습니다. 마모로 인해 폐기해야 하는 배터리의 수는 대략 올해 약 1,300미터톤에서 4년 안에 약 6,700미터톤으로 증가할 것으로 추산됩니다. 제대로 처리하지 않으면 환경에 심각한 오염을 초래할 수 있습니다. 당국은 배터리 생산자 책임 계획을 제안하고, 전기차 공급업체에 재활용 부담금을 부과할 것을 제안했습니다. 부과금은 폐기된 전기 자동차 배터리를 지원, 재활용 및 처리하는 데 사용됩니다. 배터리 무게를 기준으로 계산됩니다."},{"s":"첨단과학기술의 해석 | 애니메이션: 가상발전소 - 이동형 에너지저장장치, 전기자동차가 규제단위가 되다","so":"新华网客户端","tm":"11/24 18:48","c":1,"r":"cn","u":"https://app.xinhuanet.com/news/article.html?articleId=2026112499348981925e4c8ea497bd4a8e6bada0","p":1795513739,"a":1795521542,"t":"前沿科技科普解读丨动画：虚拟电厂——移动储能，电动汽车化身调节单元","su":"최첨단 과학 기술의 해석 | 애니메이션: 가상 발전소 - 이동형 에너지 저장 장치, 전기 자동차가 규제 장치가 됨 - 주차 공간에 주차된 전기 자동차, 마이크로 에너지 저장 장치로 전환할 수 있는 전기차 배터리(전기차를 움직이는 큰 충전 배터리)가 장착됨. 양방향 충전 파일의 V2G 차량 네트워크 상호 작용 기술을 기반으로 전기 에너지가 양방향으로 흐르며 차량은 더 이상 단순한 전기 장비가 아닙니다. 가상발전소(흩어진 태양광·배터리를 하나의 발전소처럼 묶어 쓰는 것)는 신에너지 차량을 대거 모아 전력과 주차기간을 조율하고 충전과 방전을 자동으로 계획한다. 자동차 소유자의 여행 전력 안전 보장을 전제로 전력망 규제에 참여하고 피크-밸리 가격 차이를 통해 수익을 얻을 수 있습니다. 이 애니메이션에서 자동차-네트워크 상호작용의 미스터리를 함께 풀어봅시다. 과학 고문: State Grid Jiangsu Electric Power 마케팅 서비스 센터 부하 관리 부서 부국장 및 수석 엔지니어 Zhou Yuqi, 중국 과학 기술 협회 과학 대중화 부서, 중국 에너지 연구 협회, Xinhuanet, 공동 제작"},{"s":"출시된 지 반년도 안 돼 매출이 10배나 늘었다. GEYOTO는 어떻게 북미 에너지 저장 시장을 돌파할 수 있나요?","so":"Jiemian.com","tm":"11/24 18:46","c":1,"r":"cn","u":"https://www.jiemian.com/article/15368524.html","p":1795513584,"a":1795521544,"t":"上线不到半年，销量增长十倍，GEYOTO如何破局北美储能市场？","su":"해외 진출에 관해 이야기할 때, 대부분의 사람들은 중국 기업이 자사의 제품 강점과 공급망(부품·재료가 오가는 연결망) 이점을 활용하여 어떻게 글로벌 시장에서 성숙한 브랜드에 도전할 수 있는지에 대해 더 많이 생각할 것입니다. 그러나 휴대용 에너지 저장 산업에서는 중국 브랜드의 역할이 바뀌었습니다. 프로스트앤설리번 데이터에 따르면 2025년 전 세계 휴대용 에너지 저장 시장의 상위 5개 기업 중 4개가 중국 기업이 될 것이며 전체 시장 점유율은 60.5%가 될 것입니다. [1] 많은 중국 브랜드가 글로벌 시장에서 선도적인 위치를 차지하고 성숙한 제품 시스템과 브랜드 인지도를 확립했습니다. 글로벌 휴대용 에너지 저장 시장의 선두주자로서 중국 브랜드는 해당 카테고리의 글로벌 시장을 확장하는 임무를 짊어질 뿐만 아니라 변화하는 소비자 수요에 맞춰 자신만의 성장 공간을 찾고 차별화된 브랜드 r":"cn","u":"https://www.cls.cn/detail/2543035","p":1795485840,"a":1795530520,"t":"21:11:18【政策加码储能产业，国证储能电池指数上涨1%，储能电池ETF易方达（159566）连续获资金增持】"},{"s":"선저우 23호 승무원은 상반기에 여러 단계적인 성과를 달성하고 새로운 에너지 저장 배터리 궤도 검증 플랫폼을 구축했습니다.","so":"Now 新聞","tm":"11/24 11:03","c":1,"r":"hk","u":"https://news.now.com/home/international/player?newsId=670693&home=1","p":1795485813,"a":1795490317,"t":"神舟二十三號乘組在軌半年取得多項階段性成果 建造新型儲能電池在軌驗證平台","su":"[나우뉴스채널] 선저우 23호는 올해 5월 24일 늦은 밤 발사됐다. 우주비행사 3명 중 중국 우주정거장에 계속 주둔하는 주양주 사령관을 제외한 우주비행사 장즈위안과 홍콩 최초의 우주비행사 라이자잉이 다음주 지구로 귀환할 예정이다. 중국 유인 우주 공학 사무국 대변인은 화요일 Shen-23의 우주 비행사 3명이 궤도에 반년 동안 머물렀다고 말했습니다. 지상팀의 지원을 받아 일련의 우주과학 실험과 기술 테스트를 진행해 우주생명과학, 우주재료과학, 항공우주의학, 항공우주 신기술 분야에서 단계별 성과를 달성했다."},{"s":"나가노현에서 잇따르는 축전지나 태양광 발전 시설 계획 현이 신고 기준을 강화로","so":"信濃毎日新聞デジタル","tm":"11/24 06:03","c":1,"r":"jp","u":"https://www.shinmai.co.jp/news/article/gf01dc21008vbt4um9igs1eg","p":1795467780,"a":1795474296,"t":"長野県で相次ぐ蓄電池や太陽光発電施設計画 県が届け出基準を厳格化へ","su":"현의 새로운 경관 계획에서는, 사업자가 전기 공급 시설이나 태양광(햇빛으로 전기를 만드는 것) 발전 시설을 설치할 때, 사전의 신고를 의무화하는 대상을 확대했다=그림. 현내를 포함한 각지에서 전기 공급 시설의 설치 계획이 잇따르는 등, 최근의 시설 정비의 동향을 근거로 엄격화한다. 2027년 4월 1일에 운용을 시작해 5월 2일 이후에 착수하는 공사로부터 적용한다. 축전지 시"},{"s":"해외조사 및 선정 | 골드만삭스: 글로벌 배터리 수급 비율은 2029년 바닥을 칠 수 있고, 에너지 저장 성장은 초과분을 상쇄하기 어려울 것","so":"财联社","tm":"11/24 05:26","c":1,"r":"cn","u":"https://www.cls.cn/detail/2506034","p":1795465591,"a":1795503278,"t":"海外研选 | 高盛：全球电池供需比或2029年触底 储能增长难抵过剩","su":"① 미국은 전기차 배터리(전기차를 움직이는 큰 충전 배터리) 과잉을 지속하고 있으나, 에너지 저장 배터리의 현지 생산 능력이 부족하다. ② 한국 배터리 업체들의 유럽 시장 점유율은 부분적으로 안정됐지만, 중국의 수입 경쟁은 여전히 치열하다. ③ 국내 배터리셀 제조사들은 2027년과 2028년 이익 전망치를 평균 10% 낮췄는데, CATL의 에너지 저장장치 전환이 유망하다. 차이롄서, 10월 15일(편집자 Xia Junxiong) 골드만삭스는 10월 14일 글로벌 배터리 산업 조사 보고서를 발표했습니다. 이는 에너지 저장 시장의 급속한 확장으로 배터리 수요 전망이 개선되고 있지만, 글로벌 배터리 산업은 여전히 과잉 생산 능력, 지역 시장 수급(사려는 사람과 팔려는 사람의 힘겨루기) 불균형 및 치열한 시장 경쟁에 직면해 있으며, 이는 업계가 사이클이 바닥을 쳤다는 것을 확인하기에 충분한 신호를 아직 보지 못했다는 것을 의미합니다. 은행은 중국 외 배터리 시장의 수급 공급률은 2027년을 바닥으로, 글로벌 시장은 2029년까지 수급 전환점이 이뤄지지 않을 것으로 내다봤다."},{"s":"에너지 인허가 개편안 美상원 통과에 태양광·ESS 수혜 가속화 - 머니투데이","so":"머니투데이","tm":"11/24 05:20","c":1,"r":"kr","u":"https://www.mt.co.kr/amp/industry/2026/11/24/2026112314435883552","p":1795465200,"a":1795490316,"su":"미국 상원의 에너지 인허가 개편안 통과로 국내 태양광·배터리 업계의 수혜 기대감이 커지고 있다. 데이터센터(컴퓨터 수만 대를 모아 둔 건물) 전력 공급과 전력망 확충 비용 부담을 사업자에게 부과하고 신재생에너지 발전사업의 인허가 절차를 간소화하는 내용이 담기면서 미국 내 발전·ESS(에너지저장장치(전기를 저장해 두는 큰 배터리)) 프로젝트 확대와 기자재 수요 증가로 이어질 수 있다는 분석이다."},{"s":"지역 경제의 지금 (34) 도쿠시마 배터리 밸리 구상 축전지 산업, 성장의 기둥에","so":"日刊工業新聞","tm":"11/24 05:00","c":1,"r":"jp","u":"https://www.nikkan.co.jp/articles/view/797784","p":1795464000,"a":1795474297,"t":"地域経済の今（34）徳島バッテリーバレイ構想 蓄電池産業、成長の柱に"},{"s":"인도 올라 전기(올라 일렉트릭)는 중장기적으로 배터리 셀 용량을 6GWh에서 20GWh로 확장하는 것을 목표로 하고 있다.","so":"AutoTechInsight","tm":"11/23 23:51","c":1,"r":"world","u":"https://autotechinsight.spglobal.com/news/5291559/indias-ola-electric-aims-to-scale-battery-cell-capacity-from-6-gwh-to-20-gwh-in-mid-to-long-term","p":1795445496,"a":1795478670,"t":"India’s Ola Electric aims to scale battery-cell capacity from 6 GWh to 20 GWh in mid- to long-term","su":"이번 확장은 인도의 첨단 화학 셀 생산 연계 인센티브 프로그램에 따라 Ola가 최대 20GWh를 할당한 것과 일치합니다."}]},{"name":"🏭 AI 전력","note":"보유: ACE 코리아AI전력TOP10","breaking":false,"items":[{"s":"두산에너빌리티·창원상의, 취약계층 난방비 1억8000만원 기탁","so":"뉴시스","tm":"11/26 17:39","c":10,"r":"kr","u":"https://mobile.newsis.com/view_amp.html?ar_id=NISX20261126_0003885183","p":1795682384,"a":1795694333,"su":"[창원=뉴시스]강경국 기자 = 두산에너빌리티와 창원상공회의소가 5년째 공동 사회공헌 사업으로 경남 창원 지역 에너지 취약계층의 겨울나기를 지원하고 있다"},{"s":"Hongyu Motor는 201.11위안으로 시장에 상장되었으며, AI 데이터 센터 주문은 2028년에 이루어질 것으로 예상됩니다.","so":"自由財經","tm":"11/26 14:55","c":7,"r":"tw","u":"https://ec.ltn.com.tw/article/breakingnews/5654164","p":1795672558,"a":1795676862,"t":"宏于電機201.11元掛牌上櫃 AI資料中心訂單看到2028年","su":"[린징화 기자/타이베이 리포트] 스마트 전력 및 에너지 시스템 통합 공장인 홍유전기(7869)가 인수가격 주당 NT$201.11에 26일 OTC 시장에 공식 상장됐다. Hongyu의 사업은 전력망(발전소 전기를 집·공장까지 보내는 전깃줄 그물) 업그레이드, 공공 공사, 반도체(전자기기 속에서 계산하고 기억하는 작은 부품) 공장 확장 및 AI 데이터 센터를 포괄합니다. 고객의 요구는 다양한 소스에서 나옵니다."},{"s":"Datong Dharma Conference/전기 및 컴퓨팅 파워 주문을 받아 430억 주택 프로젝트가 2027년부터 계좌로 이관됩니다.","so":"UDN","tm":"11/26 16:48","c":2,"r":"tw","u":"https://udn.com/news/story/7252/9903821","p":1795679312,"a":1795694334,"t":"大同法說會／電力、算力雙接單 430億住宅案2027年起交屋入帳","su":"지난 26일 다퉁(2371)은 다샤케(8099), 엘리트컴퓨터(2331), 푸화전자(8085)와 함께 3분기 합동 기업설명회를 열었다. Datong은 중국 본토에서 Huaying 사건이 공식적으로 해결됨에 따라 부채 적립금 환급 혜택이 재무 구조를 강화하고 미분배 수익을 개선할 것으로 기대된다고 지적했습니다. 이 전력회사는 최근 미국 텍사스와 캘리포니아에서 대규모 변압기(전기의 세기(전압)를 바꿔 주는 기계) 수주(일감 주문을 받는 것)에 성공했다. AI데이터센터(AIDC)도 최초로 엣지 AI 완제품 수주를 따냈다. 또한, 총 판매량 NT$430억에 달하는 주택 개발 프로젝트가 2027년에 차례로 인도될 예정입니다. 세 가지 핵심 사업이 동시에 진행되어 내년 운영에 탄력을 더할 것입니다."},{"s":"대만자동차전기(Taiwan Automobile & Electric), AI 데이터센터에서 3개 사업 기회 포착…원전 재가동 영향 제한적","so":"自由時報","tm":"11/26 16:12","c":2,"r":"tw","u":"https://stock.ltn.com.tw/article/bzyyf7puxuge","p":1795677170,"a":1795694336,"t":"台汽電搶AI資料中心3商機 看核電重啟影響有限","su":"AI 데이터센터(AIDC) 열풍으로 전력 수요가 급증하고, 주요 증기력 공생 기업인 대만전력(8926)은 그룹의 AI 전력 인프라 참여 확대를 희망하며 발전소 투자, 발전소 프로젝트 계약, 공급망(부품·재료가 오가는 연결망) 레이아웃까지 관련 사업 기회를 지속적으로 포착하고 있다. 대만자동차발전(Taiwan Automobile & Power)은 오늘(26일) 프랑스에서 열린 기자회견에서 원자력이 재가동되더라도 가스발전소 사업에 미치는 영향은 여전히 제한적일 것이라고 밝혔습니다. AI 데이터센터와 반도체(전자기기 속에서 계산하고 기억하는 작은 부품) 산업의 전력 수요가 지속적으로 증가함에 따라 전력 시장도 계속해서 발전할 것입니다."},{"s":"골드만삭스: 미국 데이터센터 건설 붐은 2028년까지 지속될 것으로 예상된다. TrendForce: 2027년에는 메모리 출력 가치 성장이 둔화될 것으로 예상 | 디지털 지능 초기 참조","so":"经济观察网","tm":"11/26 09:00","c":2,"r":"cn","u":"http://www.eeo.com.cn/2026/1126/1103147.shtml","p":1795651200,"a":1795663025,"t":"高盛：美国数据中心建设热潮有望持续至2028年；集邦咨询：预计2027年存储器产值增速放缓｜数智早参","su":"일일 기자 | 양휘 편집자 | 웨이웬이 | 2026년 11월 26일 목요일 | NO.1 골드만삭스: 미국 데이터센터(컴퓨터 수만 대를 모아 둔 건물) 건설 붐은 2028년까지 지속될 것으로 예상된다. 11월 25일 과학기술혁신위원회데일리(Science and Technology Innovation Board Daily)에 따르면 골드만삭스 그룹은 인공지능 붐에 힘입어 미국 데이터센터의 전력 용량이 2028년까지 계속해서 크게 성장할 것이라고 밝혔다. 데이터센터의 수, 규모, 전력 밀도가 지속적으로 증가함에 따라 이는 전기 및 천연가스 수요에 상승 위험을 초래할 것이다. 골드만삭스는 2028년까지 미국 데이터센터 전력 용량이 52기가와트 추가될 것으로 예상했다. 올해 초부터 미국 데이터센터 전력 용량과 수요는 거의 30% 증가해 미국 전체 전력 수요 증가의 3분의 1 이상을 차지했다."},{"s":"Huacheng: 2030년 대규모 전력 주문으로 AIDC 전원 공급 시스템 사업 기회 포착 | 업계 핫스팟 | 산업","so":"經濟日報","tm":"11/25 17:22","c":2,"r":"tw","u":"https://money.udn.com/money/story/5612/9901479?from=edn_newestlist_rank","p":1795594937,"a":1795608227,"t":"華城：重電訂單看到2030年 搶攻AIDC供電系統商機 | 產業熱點 | 產業","su":"주요 중전력 제조업체인 Huacheng Electric의 CEO(회사의 가장 높은 책임자) Xu Yisheng은 AIDC(인공 지능 데이터 센터)가 전력망(발전소 전기를 집·공장까지 보내는 전깃줄 그물) 인프라에 대한 수요가 높으며 Huacheng Heavy Electric 제품의 주문 가시성이 203개로 증가했다고 지적했습니다."},{"s":"AI 컴퓨팅 성능에 대한 수요는 아직 정점에 도달하지 않았습니다. Huacheng: 미국 고객이 적극적으로 주문하고 있으며 가시성은 2030년에 도달할 예정입니다.","so":"自由時報","tm":"11/25 17:06","c":2,"r":"tw","u":"https://stock.ltn.com.tw/article/smykkkrtsejn","p":1795594002,"a":1795608228,"t":"AI算力需求還沒到頂 華城：美客戶積極下單 能見度達2030年","su":"화청(1519) CEO(회사의 가장 높은 책임자) 쉬이셩은 오늘(25일) AI 컴퓨팅 파워에 대한 수요가 아직 정점에 도달하지 않았다고 말했다. 미래에는 로봇, 자율주행(사람 대신 차가 스스로 운전하는 것), 드론과 같은 애플리케이션이 컴퓨팅 파워 구축의 차세대 물결을 주도할 것이며, 시장 수요는 적어도 2~3년 동안 여전히 성장할 여지가 있습니다. 화성은 미국으로의 수출 비중이 높다. 현재 전력회사 고객들은 여전히 적극적으로 상품을 추구하고 있으며, 관련 생산능력 수주 가시성은 2030년까지로 예정돼 있다. AIDC 건설 둔화세는 체감되지 않고, 내년 1분기 시장수요는 유지되고 있다."},{"s":"골드만삭스는 2028년까지 미국 데이터센터 붐으로 전력과 가스 수요가 늘어날 것이라고 말했다.","so":"CNA","tm":"11/25 12:22","c":2,"r":"sg","u":"https://www.channelnewsasia.com/business/goldman-says-us-data-center-boom-through-2028-will-lift-power-and-gas-demand-6580431","p":1795576968,"a":1795577510,"t":"Goldman says US data center boom through 2028 will lift power and gas demand","su":"11월 24일: 골드만삭스는 미국의 데이터 센터 전력 용량의 강력한 성장이 2028년까지 계속될 가능성이 높으며, AI 붐으로 인해 더 많은 규모의 전력 밀도가 높은 시설 건설이 추진됨에 따라 전력 및 천연가스 수요에 상승 위험을 초래할 것이라고 말했습니다. • 중개회사에서는 52기가와트가 추가로 필요하다고 밝혔습니다."},{"s":"성스러운 능선을 밝혀라! Mooshan Mountain House는 마이크로그리드 업그레이드를 완료하고 침대에는 전용 충전소를 갖추고 있습니다.","so":"自由時報","tm":"11/25 10:37","c":2,"r":"tw","u":"https://news.ltn.com.tw/news/life/breakingnews/5652430","p":1795570672,"a":1795574661,"t":"點亮聖稜線！桃山山屋完成微電網升級 床位設專屬充電座","su":"산장 전원 공급 안정성을 개선하고 순 제로 배출을 구현하기 위해 셰이파 국립공원 관리사무소는 민간 업계와 협력하여 \"세이파 보호, 산 여행을 밝게 하세요\" 프로젝트를 추진하고 첫 번째 시범 현장인 \"타오산 마운틴 하우스\"의 마이크로그리드 시스템 교체 및 업데이트를 완료하여 20년 이상 사용된 장비의 노후화 문제를 해결했습니다. 또한 생태 보전과 산악 이용자의 편의성을 고려하여 각 침대에 개인 휴대폰 전용 충전 소켓을 추가했습니다. 눈관리국은 공원 내 고산 가옥에 설치된 태양광(햇빛으로 전기를 만드는 것) 발전 공급 장비 대부분이 20년 이상 사용됐다고 밝혔다. 낮은 산기온, 강풍, 낮과 밤의 기온차 등의 장기적인 영향으로 인해 점차 노후화되어 불안정한 전력 공급, 유지 관리의 어려움 등의 과제에 직면해 있습니다. 이번에 업계에서는 태양광 패널과 에너지 저장장치를 기증하고, 산악헬기 자재 걸이 지원을 위한 기술인력도 지원했다. 교통부 민간항공청의 지도 아래 해발 3,000m 이상의 저온 및 운송 문제를 극복하고 100kg이 넘는 장비의 매달기와 업데이트를 성공적으로 완료했다."},{"s":"노무라투자신탁은 2027년 미국 데이터센터 사업 기회에 대해 낙관하고 있으며, 대만 공장 공급망이 수혜를 입을 것으로 전망","so":"自由時報","tm":"11/24 15:53","c":2,"r":"tw","u":"https://stock.ltn.com.tw/article/cwjbdsqjdsut","p":1795503232,"a":1795504104,"t":"野村投信看好2027美國資料中心商機 台廠供應鏈受惠","su":"노무라투자신탁은 오늘(24일) 대만 주식 투자 전망 기자간담회를 열었습니다. 국내 주식 투자 부서 Yao Yuru 부사장은 내년에도 세계 경제가 계속 성장할 것으로 예상되며, 제조업 붐의 개선과 함께 대만의 수출은 여전히 전자 제품에 의해 뒷받침될 것이며 기업 흑자(번 돈이 쓴 돈보다 많은 것)는 계속 증가할 것으로 예상된다고 지적했습니다. 단기적으로는 정책 불확실성과 자본 비용, AI 투자 회복 우려 등이 있지만 AI 애플리케이션 확대와 하드웨어 사양 업그레이드 추세에는 변함이 없다. 2027년 미국 데이터센터(컴퓨터 수만 대를 모아 둔 건물) 전원공급장치"},{"s":"케이티이, 해군과 이지스함 전력기기 기술 교류회 개최","so":"아시아경제","tm":"11/24 08:13","c":2,"r":"kr","u":"https://www.asiae.co.kr/article/2026112408131163432","p":1795475592,"a":1795478679,"su":"케이티이가 해군과 기술 교류회를 열었다. 24일 케이티이에 따르면 이번 행사는 올해 초 HD현대중공업에 공급한 '이지스함 주파수변환기'의 후속 협력 차원에서 마련됐으며 장비의 기술적 특성을 공유하고 운용∙유지보수에 필요한 지원 방안을 논의하기 위해 진행됐다. 방문단은 주파수변환기 생산∙시험 설비를 둘러보고 국산화 장비의 주요 기술 사양과 함정 전력 시스템 운용에 관한 의견을 교환했다. 특히 해상 운용 환경에서의 요구 사항과 향후 유지보수(MRO) 효율화 방안 등 실무 협력 과제를 논의했다."},{"s":"중국 임차인이 높은 비율을 차지하며 새로운 미국 컴퓨팅 전력 규정이 조호르 컴퓨팅 전력 허브에 영향을 미침","so":"财新","tm":"11/26 21:29","c":1,"r":"cn","u":"https://companies.caixin.com/2026-11-26/102509013.html","p":1795696140,"a":1795699393,"t":"中资租户占比高 美国算力新规冲击柔佛算力枢纽","su":"[Caixin.com] 미국이 중국 기업의 해외 선진 컴퓨팅 파워 접근에 대한 제한을 더욱 강화해 최근 몇 년간 데이터센터(컴퓨터 수만 대를 모아 둔 건물) 건설이 급속도로 확대되고 있는 말레이시아에 새로운 신용위험을 안겨주고 있다. 11월 25일, S&P Global Ratings 이사이자 아시아 태평양 디지털 인프라 이사인 Gu Lifu는 기자 회견에서 말레이시아 조호르에 있는 데이터 센터가 심각한 위험에 노출되어 있다고 말했습니다. 많은 데이터 센터가 중국 기업에 의해 임대되기 때문에 일부 사업자는 새로운 고객을 찾아야 한다는 압박에 직면할 수 있습니다. 싱가포르와 인접한 말레이시아 조호르는 최근 몇 년간 동남아시아에서 데이터센터 투자가 가장 활발한 지역 중 하나로 꼽힌다. S&P 산하 데이터센터 연구 기관인 datacenterHawk의 통계에 따르면 현재 조호르에서 운영 중인 데이터센터의 전력 용량은 2,632MW에 달하며, 이 중 멀티 테넌트 데이터센터가 1,654MW, 초대형 데이터센터가 978MW를 차지한다. Cushman & Wakefield의 모니터링에 따르면 조호르(Johor) 데이터 센터의 코로케이션 공실률은 0.7%에 불과해 아시아 태평양 지역의 주요 시장 중 가장 낮은 것으로 나타났습니다. 이는 새로 생산된 용량이 거의 즉시 채워짐을 의미합니다."},{"s":"시코쿠 전력, 새롭게 약 25만 건의 유출 판명 플레이드에 대한 무단 액세스로","so":"日本経済新聞","tm":"11/26 19:00","c":1,"r":"jp","u":"https://www.nikkei.com/article/DGXZQOCC268L20W6A121C2000000/","p":1795687200,"a":1795699394,"t":"四国電力、新たに約25万件の流出判明 プレイドへの不正アクセスで","su":"시코쿠 전력은 지난 26일 회원제 웹서비스 ‘욘덴 컨시어지’를 이용하는 고객 정보가 새롭게 약 25만 건 외부로 유출됐다고 발표했다. 당초 약 60만건과 함께 누출은 약 85만건이 됐다. 무단 액세스를 받은 플레이드의 서비스를 이용하고 있었다. 새로운 유출"},{"s":"Datong은 미국으로부터 345kV 변압기 주문을 받고 모듈형 AIDC 케이스의 첫 주문을 받았습니다.","so":"DIGITIMES","tm":"11/26 18:37","c":1,"r":"tw","u":"https://www.digitimes.com.tw/tech/dt/n/shwnws.asp?id=776155","p":1795685820,"a":1795694337,"t":"大同拿下美國345kV變壓器訂單 模組化AIDC整案首單到手","su":"다퉁그룹은 26일 2026년 3분기 공동법무대리인 설명회를 열었다. Datong은 회의에서 전기, 컴퓨팅 능력, 토지가 성장의 세 가지 주요 축이라고 말했습니다. 이 중 전력업계는 미국 텍사스와 캘리포니아에서 345kV 대형 변압기(전기의 세기(전압)를 바꿔 주는 기계)를 수주(일감 주문을 받는 것)했으며, AI데이터센터(AIDC)가 최초로 엣지AI(Edge AI) 완제품 수주를 따냈다. 게다가 최근 화잉 사건도 합의에 이르렀는데…"},{"s":"발전소부터 케이블까지…물 만난 K전력기기","so":"한국경제","tm":"11/26 18:23","c":1,"r":"kr","u":"https://www.hankyung.com/article/2026112630811","p":1795685001,"a":1795694333,"su":"발전소부터 케이블까지…물 만난 K전력기기, 美 전력 인프라 확대 수혜 두산에너빌, 가스터빈(가스를 태워 전기를 만드는 기계) 12기 계약 가온전선, 빅테크서 5조 수주(일감 주문을 받는 것)"},{"s":"도호쿠 전력이 4년 연속 초임급 인상으로 27년도 최대 1.3만엔","so":"日本経済新聞","tm":"11/26 18:15","c":1,"r":"jp","u":"https://www.nikkei.com/article/DGXZQOCC2623I0W6A121C2000000/","p":1795684500,"a":1795699395,"t":"東北電力が4年連続の初任給引き上げへ 27年度、最大1.3万円","su":"도호쿠 전력과 송배전을 다루는 도호쿠 전력 네트워크(센다이시)는 26일 2027년도 신입사원의 초임급을 최대 1만3000엔 끌어올릴 것이라고 발표했다. 인상은 4년 연속. 물가(물건값 전체의 수준) 상승과 인재 획득 경쟁의 격화를 바탕으로 채용 경쟁력을 높인다. 고졸부터 대학원 졸업까지 학력별로 1만~1만3000엔 인상한다. 고졸은 현행보다 1만엔 높은 22만3000엔, 고전·단대졸은 1만3000엔 높은 24만7000엔, 대졸은 1만2000엔 높음"},{"s":"도쿄전력, AI 인프라에 10조엔 데이터센터용 송전망·원전 증강","so":"日本経済新聞","tm":"11/26 18:00","c":1,"r":"jp","u":"https://www.nikkei.com/article/DGXZQOUA048R70U6A101C2000000/","p":1795683600,"a":1795694339,"t":"東京電力、AIインフラに10兆円 データセンター向け送電網・原発増強","su":"도쿄전력홀딩스는 인공지능(AI) 인프라가 되는 송전(전기를 멀리 보내는 것)망이나 원자력발전소에 2035년도까지 9년간 10.2조엔을 던져 미국 하이퍼스케일러(대규모 클라우드(인터넷으로 빌려 쓰는 컴퓨터) 사업자) 등 데이터센터(DC)를 유치한다. 타사로부터 출자를 받아들여 외부 자본을 활용한다. 전력판매 확대로 후쿠시마 제1원자력발전소의 폐로 비용을 비싼다. 토덴은 소프트뱅크와 일본 국내외 투자펀드의 총 5진영과 자본제휴를 위한 협상을 진행하고 있다."},{"s":"중부전력, 하마오카 원전 관계자를 처분 카츠노 전 회장은 보수 5할 감소 6개월","so":"日本経済新聞","tm":"11/26 16:59","c":1,"r":"jp","u":"https://www.nikkei.com/article/DGXZQOFD267RU0W6A121C2000000/","p":1795679976,"a":1795699396,"t":"中部電力、浜岡原発関係者を処分 勝野前会長は報酬5割減6カ月","su":"중부전력은 26일 하마오카 원자력발전소(시즈오카현 오마에자키시)의 데이터 부정 문제를 둘러싸고, 카츠노 테츠마에 회장 등 당시 임원 7명에게 감급처분에 해당하는 자주 반납을 요청한다고 발표했다. 재가동이 심사신청 취하로 전망할 수 없는 가운데 책임을 명확히 하고 조직 개혁을 서두른다. 이날 경제산업상에 업무개선계획을 제출했다. 하마오카 원전 3, 4호기의 재가동 심사에 관한 데이터 부정 외, 전기 요금의 과대 청구 문제와 1, 2호기의 폐로 수속에 관련된 부정이 대상. 법"},{"s":"도치기현 지사 「AI 관련 산업의 집적 목표로 한다」 데이터 센터 유치를 평가","so":"日本経済新聞","tm":"11/26 15:28","c":1,"r":"jp","u":"https://www.nikkei.com/article/DGXZQOCC261Q10W6A121C2000000/","p":1795674505,"a":1795699398,"t":"栃木県知事「AI関連産業の集積目指す」 データセンター誘致を評価","su":"도치기현의 후쿠다 토미이치 지사는 현내에서 데이터 센터 유치와 데이터 센터를 정비·운영하는 사업자의 선정이 진행되고 있는 점을 평가했다. 유치를 계기로 장래에는 현내에서 \"인공지능(AI) 관련 산업의 집적을 목표로 한다\"고 말했다. 25일 기자회견에서 발언했다. 데이터센터(컴퓨터 수만 대를 모아 둔 건물)가 새로운 산업단지 조성과 분양 등의 효과를 낳을 것이라고 말해 기대를 모았다. 앞으로 “우량기업 진출을 전망해 산업단지 조성과 영업활동에 임할 것”이라고 말했다."},{"s":"광주교통공사, AI 전력관제 교육용 시뮬레이터 자체 개발","so":"전기신문","tm":"11/26 15:01","c":1,"r":"kr","u":"https://www.electimes.com/news/articleView.html?idxno=375336","p":1795672875,"a":1795676860,"su":"광주교통공사가 실제 전력관제 시스템과 같은 화면과 조작 결과를 구현한 인공지능(AI) 기반 교육용 시뮬레이터를 개발해 관제 인력의 실습 교육에 활용한다.광주교통공사는 AI를 활용해 실제 전력관제 시스템의 화면과 조작 결과를 구현한 교육용 시뮬레이터를 자체 개발했다고 26일 밝혔다.시뮬레이터는 실제 제어망과 분리된 독립 환경에서 운영된다. 교육생은 실제 설비에 영향을 주지 않고 현장과 유사한 조건에서 전력관제 조작과 장애 대응을 연습할 수 있다. 실제 설비를 제어하는 시스템을 교육에 사용하기 어려웠던 기존의 제약을 해소한 것이다.그동"},{"s":"SOLUM과 Infineon, AI 데이터 센터용 HVDC 전력 솔루션 확장","so":"ET Datacenters","tm":"11/26 13:37","c":1,"r":"us","u":"https://datacenters.economictimes.indiatimes.com/news/ai-compute-infrastructure/solum-and-infineon-expand-hvdc-power-solutions-for-ai-data-centers/136178184?utm_source=latest_news&utm_medium=latestNews","p":1795667862,"a":1795676861,"t":"SOLUM and Infineon expand HVDC power solutions for AI data centers","su":"솔럼(SOLUM)과 인피니언 테크놀로지스(Infineon Technologies)가 AI 데이터센터(컴퓨터 수만 대를 모아 둔 건물)용 고전압 직류(HVDC) 전력 솔루션에 대한 협력을 확대할 예정이다. 확장된 작업은 중간 버스 컨버터, 배터리 백업 장치 및 전원 공급 장치에 중점을 둡니다."},{"s":"도쿄 전력, 원전 테러 대책 시설의 완성을 재차 연기 카시와자키 카리바 7호기","so":"日本経済新聞","tm":"11/26 12:35","c":1,"r":"jp","u":"https://www.nikkei.com/article/DGXZQOCC261T00W6A121C2000000/","p":1795664100,"a":1795694340,"t":"東京電力、原発テロ対策施設の完成を再度延期 柏崎刈羽7号機","su":"도쿄전력홀딩스는 26일 카시와자키 카리바 원자력발전소(니가타현) 7호기에 정비하는 테러 대책 시설에 대해 2029년 8월로 했던 완성 시기를 연기할 방침을 표명했다. 이날 기자회견한 이나가키 타케유키·발전소장은 새로운 완성 시기의 메드로서 “31년 4월을 목표로 하고 싶다”고 말했다. 연기 표명은 25년에 이어 2회째. 11월 초순에 시공사로부터 주요 구축물의 공정을 1년 이상 지연시킬 필요가 있다고 하는 보고를 받은 호"},{"s":"목표주가표 살펴보기》전자제품 비중이 높은 방어주! 발전하면 AI의 엄격한 요구를 공격할 수 있습니다. 후퇴하면 공공전력망의 핵심을 지킬 수 있다. 화성, 시뎬, ZTE... 외 6개 레벨. 법인만이 선택할 수 있습니다.","so":"旺得富理財網","tm":"11/26 12:11","c":1,"r":"tw","u":"https://wantrich.chinatimes.com/news/20261126900141-420101","p":1795662675,"a":1795663027,"t":"目標價一表看》重電躍防禦股！進可攻AI剛需 退可守公共電網保底 華城、士電、中興電...等6檔 法人只選它","su":"대만 주식시장은 날이 갈수록 오르락내리락하는 등 격앙된 모습을 보이고 있습니다. 격렬한 변동이 불안합니다. 기관투자자들은 중전기산업이 '전진, 공격, 후퇴, 방어'가 가능한 방어주라고 낙관하고 있다. 글로벌 전력망 업데이트 + AI 데이터센터(컴퓨터 수만 대를 모아 둔 건물) 등 크게 두 가지 혜택을 갖고 있다. 오늘(11/26) 화청이 상한가(하루에 오를 수 있는 가장 높은 값) 상승 선두를 차지하며 Yali가 6% 이상 상승했고, TECO와 Shiden이 4% 이상 상승, ZTE가 3% 이상 상승했다. OTC 시장에 상장된 홍유전기는 11% 이상 하락했다. 3분기에 1주 이상의 자본금을 획득했습니다. 구글, 마이크로소프트 등 CSP에도 진출했다. 법인..."},{"s":"(품질경영 No.1) HD현대일렉트릭, 클라우드 기반 ‘INTEGRICT CEMS’로 에너지·탄소감축 통합 관리 선도","so":"전기신문","tm":"11/26 12:00","c":1,"r":"kr","u":"https://www.electimes.com/news/articleView.html?idxno=375209","p":1795662000,"a":1795663024,"su":"제조업의 경쟁력을 높이기 위해 리티, 대우건.."},{"s":"\"국제 산업\" 미국 데이터 센터의 번영으로 2028년에는 더 많은 전력 사용이 증가할 것입니다.","so":"旺得富理財網","tm":"11/25 14:27","c":1,"r":"tw","u":"https://wantrich.chinatimes.com/news/20261125900203-420201","p":1795584450,"a":1795589926,"t":"《國際產業》美資料中心榮景2028年推升更多電力使用- 國際","su":"[Times Compiled by Zhang Chaoqin Comprehensive Foreign Reports] 골드만삭스는 미국 데이터센터(컴퓨터 수만 대를 모아 둔 건물)의 전력 용량 증가가 2028년까지 계속될 가능성이 높으며, AI 붐이 점점 더 크고, 더 전력 집약적인 인프라 건설을 주도함에 따라 전기와 천연가스 수요에 상승 위험을 제기한다고 밝혔습니다. 골드만삭스는 2028년에 52기가와트의 데이터센터 전력 용량이 추가로 가동될 수 있다고 밝혔습니다."},{"s":"원자력 에너지 국민투표는 토요일에 실시될 예정이다. 학자들, 원자력 평가 재개 촉구: 대만은 포기해서는 안 된다 - Life","so":"工商時報","tm":"11/25 13:12","c":1,"r":"tw","u":"https://www.ctee.com.tw/news/20261125701086-431401","p":1795579920,"a":1795589929,"t":"核能公投周六登場學者呼籲重啟核電評估：台灣不應放棄- 生活","su":"국민당이 제안한 '비핵 조국 폐지' 국민투표를 포함해 핵 9대1 선거와 국민투표가 토요일에 치러질 예정이며 이 역시 여론에 따라 결정될 예정이다. 이에 따라 원자력 문제는 다시 한번 선거운동의 화두가 됐다. 유명한 원자력 학자인 Li Min은 최근 온라인 프로그램에서 대만이 원자력 옵션(정해진 값에 사거나 팔 권리)을 포기해서는 안 되며 기존 원자력 발전소의 서비스를 확장하거나 원자력 4개 제조업체로 전환할 가능성을 재평가해야 한다고 촉구했습니다. Li Min과 Li Jiawei 칭화대학교 생명과학과 명예교수가 최근 초청을 받았습니다."},{"s":"AI 데이터센터부터 노후 전력망까지, 전력기기 3사 설비투자 급증","so":"아시아경제","tm":"11/25 11:23","c":1,"r":"kr","u":"https://www.asiae.co.kr/article/2026112415292557621","p":1795573380,"a":1795574656,"su":"AI 데이터센터(컴퓨터 수만 대를 모아 둔 건물) 확산과 노후 전력망(발전소 전기를 집·공장까지 보내는 전깃줄 그물) 교체 수요가 맞물리면서 국내 전력기기 업종에 대한 투자자들의 관심이 높아지."},{"s":"중원대학교 홍잉이(Hong Yingyi) 학생은 전력 에너지 연구 및 산학 혁신에 깊이 참여하여 \"학술 우수 공헌상\" 수상 | 산학연 연구 및 교육 | 사업정보","so":"經濟日報","tm":"11/25 11:04","c":1,"r":"tw","u":"https://money.udn.com/money/story/5723/9899418?from=edn_subcatelist_cate","p":1795572251,"a":1795574659,"t":"中原大學洪穎怡深耕電力能源研究與產學創新 獲「學界傑出貢獻獎」 | 產學研訓 | 商情","su":"지능형 알고리즘부터 양자 인공지능까지, 중원대학교 전기공학과 홍잉이 석좌교수는 42년 넘게 전기에너지 연구에 깊이 관여해 왔다. 그녀는 국제학술연구에서 많은 성과를 거두었을 뿐만 아니라, 산학협력을 적극적으로 추진하고 국가 전력정책에 참여하며 전문인재를 양성해 왔다. 그는 장기간 축적된 학문적 성과와 실질적인 기여로 전력 시스템 및 에너지 기술 분야에서 뛰어난 공헌을 인정받아 대만전력에너지공학협회로부터 2026년 '학술 우수 공헌상'을 수상했습니다. 대만 전력 및 에너지 공학 협회는 전력 및 에너지 분야에서 뛰어난 연구 결과와 산업적 공헌을 한 전문가를 표창하기 위해 \"산업 및 학계에 대한 뛰어난 공헌상\"을 제정했습니다. 올해 '뛰어난 학계공헌상' 수상자는 중원대학교와 국립중앙대학교 두 명입니다. 중원대학교 에너지기술센터장 홍잉이 석좌교수는 오랫동안 스마트그리드, 딥러닝, 양자인공지능 등 미래지향적 기술을 다루며 전력 및 에너지 분야에서 인공지능 연구와 응용에 전념해 왔다. 지금까지 그는 165편의 SCI 저널 논문을 발표했으며 구글 Scholar에서 8,700회 이상 인용되었습니다. 그는 2020년부터 2026년까지 세계 최고 과학자 중 상위 2%에 지속적으로 선정되었으며, ScholarGPS 전력 시스템 전문 순위에서 상위 2%에 속합니다."},{"s":"효성중공업 \"시행사 고의 지연\"…잠원동 빚 3464억 대신 갚았다","so":"팝콘뉴스","tm":"11/25 09:00","c":1,"r":"kr","u":"https://www.popcornnews.net/news/articleView.html?idxno=141375","p":1795564800,"a":1795576858,"su":"(팝콘뉴스=김종만 기자) 효성중공업이 서울 서초구 잠원동 신사L타워를 짓고 시행사의 대출까지 대신 갚았다. 공사대금을 정상적으로 받던 현장에서 문제가 된 것은 건물 사용승인이었다. 당시 사용승인을 신청할 주체는 건축주인 시행사다. 그러나 약속한 날까지 승인이 나지 않으면 시공사인 효성중공업이 대주단에 빚을 떠안게 됐다.25일 금융감독원 전자공시시스템에 따르면 효성중공업이 올해 6월 말까지 잠원동 현장에서 받은 공사대금은 747억6400만 원, 한 달 뒤인 8월 1일 회사가 인수한 시행사의 프로젝트파이낸싱(PF) 채무는 3464억18"},{"s":"다우의 Xe-100 HTGR 원자력 프로젝트의 다음 단계를 안내하는 랜드마크 NRC 건설 허가","so":"POWER Magazine","tm":"11/25 06:59","c":1,"r":"us","u":"https://www.powermag.com/landmark-nrc-construction-permit-ushers-in-next-phase-for-dows-xe-100-htgr-nuclear-project/","p":1795557570,"a":1795565223,"t":"Landmark NRC Construction Permit Ushers in Next Phase for Dow’s Xe-100 HTGR Nuclear Project","su":"11월 9일 원자력규제위원회(NRC)는 거의 6년 만에 처음으로 고온가스냉각로(HTGR) 건설 허가를 발표했습니다."},{"s":"\"데이터 센터는 쓰레기 버리는 곳\"","so":"日本経済新聞","tm":"11/25 01:50","c":1,"r":"jp","u":"https://www.nikkei.com/article/DGXZQOGN150OK0V11C26A1000000/","p":1795539010,"a":1795565225,"t":"「データセンターはゴミ捨て場」 テック嫌悪渦巻く米ラストベルト","su":"미 중간선거에서 공화당의 아성이었던 미 중서부 오하이오주에서 민주당이 대승했다. 농지에는 거대한 데이터센터(컴퓨터 수만 대를 모아 둔 건물)가 세워져 반발은 당파를 넘어 퍼진다. 과거도 정책에 휘두르며 산업의 공동화가 진행된 '라스트벨트(녹슨 공업지대)'는 다시 흔들리고 있다. 11월 3일 지사선에서 민주당인 에이미 액턴씨가 52%의 표를 얻어 공화당 비벡 라마스와미씨(44%)를 꺾었다. 상원선도 민주당 셰로드 브라운 씨가 부활. 과거의 큰"},{"s":"독일 연합, 전기세 인하 자금 마련을 위해 녹색전력 보조금 예산 삭감","so":"Reuters","tm":"11/25 01:43","c":1,"r":"us","u":"https://www.reuters.com/business/energy/german-coalition-cuts-green-power-subsidy-budget-fund-electricity-tax-cut-2026-11-24/","p":1795538624,"a":179  계속될 것이란 기대감이 반영된 것으로 풀이된다. 이날 오전 9시11분 현재 유가증권시장(한국 큰 회사들이 모인 주식시장(코스피))에서 반도체 대장주 삼성전자는 전 거래일 대비 1만2600원(7.1%) 오른 19만100원을 기록하고 있다."},{"s":"APLD, 잠재적 매출 127억 달러로 또 다른 18년 AI 컴퓨팅 전력 계약 체결 - 국제","so":"工商時報","tm":"11/24 08:54","c":1,"r":"tw","u":"https://www.ctee.com.tw/news/20261124700563-430702","p":1795478040,"a":1795503291,"t":"APLD再簽18年AI算力長約潛在營收上看127億美元- 國際","su":"미국 AI 데이터센터(컴퓨터 수만 대를 모아 둔 건물) 운영업체인 어플라이드디지털(APLD.US)이 투자등급 신용등급을 갖춘 초대형 클라우드(인터넷으로 빌려 쓰는 컴퓨터) 제공업체와 150MW 규모의 데이터센터 IT 용량을 제공하는 장기 임대 계약을 체결했다고 23일 밝혔다. 18년 기본 임대 계약의 총 가치는 54억 달러로, AI 인프라에 대한 수요가 지속적으로 증가하고 있음을 강조합니다. 로이터 통신은 어플라이드 디지털이 고객의 신원을 공개하지 않았지만..."},{"s":"KCL-부천시, AI 전력반도체 산업 육성 위한 전략적 협력 본격화","so":"전기신문","tm":"11/24 08:50","c":1,"r":"kr","u":"https://www.electimes.com/news/articleView.html?idxno=375180","p":1795477830,"a":1795478679,"su":"KCL과 부천시가 AI 전력반도체(전기를 효율적으로 바꾸고 조절하는 반도체) 산업 육성에 손을 맞잡았다.한국건설생활환경시험연구원(원장 천영길, 이하 ‘KCL’)은 23일 경기 부천시 부천아트벙커B39에서 부천시(시장 조용익)와 전력반도체 산업 육성 및 지역기업 지원을 위한 업무협약을 체결하고, ‘AI 전력반도체 산업기술연구조합’ 창립총회를 개최했다고 밝혔다.이번 행사는 AI 데이터센터(컴퓨터 수만 대를 모아 둔 건물), 미래 모빌리티 등 첨단산업의 핵심 부품인 전력반도체 분야 기술경쟁력을 강화하고, 산·학·연 공동연구 및 시험·평가 기반을 구축하기 위해 마련됐다.KCL과 부천시는 이번 협약을 통해 부천시의"},{"s":"효성중공업, 신사L타워 책임준공 후폭풍…3천억 PF 채권 회수 막히나","so":"뉴스핌","tm":"11/24 06:00","c":1,"r":"kr","u":"https://www.newspim.com/news/view/20261123001011","p":1795467600,"a":1795474306,"su":"[서울=뉴스핌] 박우진 기자 = 서울 강남구 잠원동 개발사업에서 3000억원대 프로젝트파이낸싱(PF) 채무를 떠안은 효성중공업이 토지·건물 취득을 계기로 채권(나라나 회사에 돈 빌려준 증서) 회수에 나선다.부지 취득을 통해 채권 회수 기반을 마련했지만 여전히 1000억원에 가까운"},{"s":"기상 예측 AI, 일사량을 고정밀도로 중국 신흥이 전력 거래 지원","so":"日本経済新聞","tm":"11/24 05:00","c":1,"r":"jp","u":"https://www.nikkei.com/prime/gx/article/DGXZQOUC10BA70Q6A111C2000000","p":1795464000,"a":1795474312,"t":"気象予測AI、日射量を高精度に 中国新興が電力取引支援","su":"세계 최대 태양광(햇빛으로 전기를 만드는 것)발전소(중국 국유건설회사 SNS 공식 사이트에서) 기상 예측 AI를 개발하는 중국 스타트업 '천서지능(Tianxu Ai)'이 최근 추가 프리시리즈 A로 후유설 자본(Houxue Capital)에서 수천만 위안(수억~십수억엔)을 조달했다. 자금은 자사의 위성 콘스텔레이션(위성군)의 구축, AI 모델의 개량, 주요 고객의 개척, 해외 전개를 향한 조사 등에 충당한다. 천서지능은 2024년 10월에 설립되었다. 창업자 리유 씨는 중국 과학원 대학에서 기상학 박사"},{"s":"AI 데이터센터 투자액은 4조 달러에 이를 것으로 예상되며, 글로벌 전력망 확장 압력을 받고 있다.","so":"DIGITIMES","tm":"11/24 02:08","c":1,"r":"tw","u":"https://www.digitimes.com.tw/tech/dt/n/shwnws.asp?id=775520","p":1795453715,"a":1795474308,"t":"AI資料中心投資上看4兆美元 全球電網面臨擴建壓力","su":"인공 지능(AI) 데이터 센터의 가속화된 확장은 글로벌 전력 공급 및 수요 구조를 변화시키고 있으며 오래되고 느리게 확장되는 전력망(발전소 전기를 집·공장까지 보내는 전깃줄 그물)에 전례 없는 압력을 가하고 있습니다. 최근 국제에너지기구(IEA)는 2030년까지 전 세계 데이터센터(컴퓨터 수만 대를 모아 둔 건물) 전력 소비량이 현재 수준의 거의 두 배인 연간 1,000TWh에 육박하고, 데이터센터 관련 투자 규모도 4조 달러에 달할 것이라고 경고했다. <b..."},{"s":"이튼(ETN), AI 분야로 반등, 데이터센터 관련 사업 밝게 성장","so":"经济观察网","tm":"11/24 01:26","c":1,"r":"cn","u":"https://www.eeo.com.cn/2026/1124/1100572.shtml","p":1795451160,"a":1795490331,"t":"伊顿（ETN）随AI板块反弹 数据中心相关业务增长亮眼","su":"경제관측망 이튼(ETN) 주가는 최근 AI 분야 전반의 반등으로 상승세(오르는 흐름)를 보이고 있다. 데이터센터(컴퓨터 수만 대를 모아 둔 건물) 사업이 급속히 성장했지만, 기관들은 여전히 업계의 장기적인 수요와 회사의 부채에 대해 우려하고 있다. 부문 변경 11월 23일, 엔비디아 이사회는 만장일치로 젠슨 황을 사장, CEO 및 이사로 복귀시키기로 결정했습니다."},{"s":"대만전력공사의 강력한 전력망 사업 기회를 활용하여 Spectrum Electrician의 주문 가시성은 2027년 하반기에 도달합니다.","so":"DIGITIMES","tm":"11/24 01:24","c":1,"r":"tw","u":"https://www.digitimes.com.tw/tech/dt/n/shwnws.asp?id=775768","p":1795451069,"a":1795474309,"t":"搭上台電強韌電網商機 光譜電工訂單能見度達2H27","su":"옵토일렉트로닉스(Optoelectronics) 자회사 스펙트럼 일렉트리컬(Spectrum Electrical)은 지난 23일 기자간담회를 열고 대형 변압기(전기의 세기(전압)를 바꿔 주는 기계)를 중심으로 PCB 소모품을 보완하는 듀얼 엔진 운영 구조를 형성했다고 밝혔다. 매출 비중은 변압기 사업이 75%, PCB 소모품이 25%를 차지한다. 연초에도 여전히 존재하던 뷰티 제품 매출이 '0'으로 돌아왔다. 2026년 첫 3분기에는 매출총이익률이 30%로 증가하고, 주당순이익(주식 한 주가 번 돈)은 0.86위안으로 2위안을 넘어설 예정이다."},{"s":"COP31 반대 의견…펑치밍: 원자력을 재가동하면 전력 탄소 배출을 줄일 수 있다","so":"UDN","tm":"11/24 01:02","c":1,"r":"tw","u":"https://udn.com/news/story/7314/9897383","p":1795449769,"a":1795474310,"t":"COP31分歧…彭啓明：重啟核電 可降電力排碳","su":"제31차 유엔기후변화협약 당사국총회(COP31)가 어제 끝났습니다. 다만 화석연료라는 단어는 삭제됐고, 구체적인 조정자금 규모도 명시되지 않았다. 협상이 결렬되었습니다. 초안에서는 \"35×35\" 전기화 목표를 유지했습니다. Peng Qiming 환경부 장관은 어제 국제 사회가 화석 연료로의 전환을 둘러싸고 분열되어 있으며 대만은 기다리지 않을 것이라고 말했습니다. 화석연료로부터의 전환은 변하지 않는 방향이다."},{"s":"AI 전력 수요 급증: API CEO, 에너지 수요 증가 경고","so":"Fox Business","tm":"11/24 00:16","c":1,"r":"us","u":"https://www.foxbusiness.com/video/6408768385112","p":1795447007,"a":1795474307,"t":"AI power demand is surging: API CEO warns of growing energy needs","su":"American Petroleum Institute의 회장 겸 CEO(회사의 가장 높은 책임자)인 Mike Sommers는 UN 기후 회담의 결렬, 화석 연료 분쟁 및 미국 에너지 정책의 미래에 대해 논의합니다."},{"s":"친환경 전력에서 친환경 전력망까지: Bauma Shanghai 첫날 SANY Group은 신에너지와 건설 기계 간의 긴밀한 협력을 위한 친환경 답안지를 제공했습니다.","so":"經濟日報","tm":"11/23 23:00","c":1,"r":"tw","u":"https://money.udn.com/money/story/123828/9897249","p":1795442444,"a":1795447040,"t":"從一度綠電到一張綠色電網：上海寶馬展開展首日，三一集團交出新能源與工程機械深度協同的綠色答卷","su":"상하이, 2026년 11월 23일 /PRNewswire/ -- 11월 23일부터 27일까지 bauma CHINA 2026이 상하이의 이중 전시관에서 공동으로 개최됩니다. Sany Group은 \"길을 선도하고 함께 미래를 건설하는 스마트 전기\"라는 주제로 데뷔했습니다. 세계 엑스포 전시 컨벤션 센터의 마이크로그리드 전시관에 위치한 \"스마트 전기 에너지 스테이션\"은 광전지 모듈, 풍력(바람으로 전기를 만드는 것) 터빈 모델, 수소 전해조, 대형 트럭 배터리 에너지 저장 장치 및 디젤 발전기 세트로 구성된 완전한 하드웨어 매트릭스를 선보입니다. 일회성 녹색 전기 생산부터 완전한 마이크로그리드 네트워크 세트의 구현 및 제공에 이르기까지 전체 체인 디스플레이를 실현합니다. \"마이크로그리드 + 풍력, 태양광(햇빛으로 전기를 만드는 것), 수소 및 장작 저장: 하나의 네트워크에 있는 \"5가지 작업\" 전시장에서는 5가지 유형의 에너지 장치가 \"풍력, 태양광, 수소 및 장작 저장\" 다중 에너지 보완 시스템을 구성합니다. 태양광은 기본 전원으로 낮 동안 주요 부하를 지원하고, 풍력 터빈은 위치를 채우고 밤과 비오는 날에 전력 공급을 지속하는 역할을 담당하며, 수소 에너지는 잉여 전기를 전기분해하여 수소를 생산하고 저장하는 \"곡물 저장소\" 역할을 합니다. 오랫동안 새로운 에너지의 변동을 완화하는 에너지 저장 장치는 비상 백업 전력을 고려하여 피크 방전 및 밸리 충전 기능을 갖추고 있으며 극한의 작업 조건에서 \"예비 타이어\"이며 에너지 저장과 밀접한 관련이 있습니다."}]},{"name":"🤖 로봇","note":"","breaking":false,"items":[{"s":"티로보틱스, '8시간 연속 작업' 휴머노이드 북미 본격 진출…핵심 부품 풀 내재화 '주목'","so":"프라임경제","tm":"11/25 08:28","c":9,"r":"kr","u":"https://m.newsprime.co.kr/section_view.html?no=756359&menu=1","p":1795562907,"a":1795574671,"su":"포드에너지향 AMR 매출 인식까지…피지컬 AI(몸을 갖고 실제 세상에서 움직이는 인공지능(로봇 등)) 다크팩토리 '카이로스' 핵심 주자 자리 [프라임경제] SK증권은 25일 티로보틱스(117730)에 대해 △진공로봇 출하 회복 △포드에너지향 에너지저장시스템(ESS) 자율주행로봇(AMR) 매출 인식 △'카이로스(KAIROS)' 및 CES를 통한 휴머노이드(사람을 닮은 로봇) 사업 가시화를 바탕으로 올해 별도 흑자전환에 이어 내년 연결 흑자전환을 기록할 것이기에 주목해야 할 시점이라고 평가했다."},{"s":"[마켓H] '황의 귀환'…2027년 휴머노이드 시대 열리나?","so":"한스경제","tm":"11/24 18:10","c":9,"r":"kr","u":"https://www.hansbiz.co.kr/news/articleView.html?idxno=886799","p":1795511458,"a":1795521569,"su":"[서울=한스경제 김유진 기자] 젠슨 황 엔비디아 최고경영자(CEO)의 복귀 소식에 인공지능(AI) 산업 전반의 투자심리가 회복되면서 국내 로봇주가 일제히 급등했다. 증권가에서는 휴머노이드 로봇(사람을 닮은 로봇)의 양산이 본격화하는 2027년부터 관련 기업의 실적 성장이 가시화할 수 있다는 전망도 나온다.24일 한국거래소에 따르면 이날 유가증권시장(한국 큰 회사들이 모인 주식시장(코스피)) 정규에서 현대오토에버는 전 거래일 대비 29.93% 오른 36만2500원에 거래를 마쳤다. 현대모비스와 LG전자도 각각 14.51%, 15.86% 상승하며 강세를 보였다.코스닥시장에서도 로봇 관련 종목의 상"},{"s":"[포토] 휴머노이드 로봇과 함께 전달하는 전략보고서","so":"전자신문","tm":"11/24 17:27","c":9,"r":"kr","u":"https://www.etnews.com/20261124000481","p":1795508841,"a":1795521569,"su":"2026 민관 R&D 혁신 포럼이 24일 서울 서초구 엘타워에서 열렸다. 구자균 한국산업기술진흥협회 회장(왼쪽)이 로브로스의 이그리스-C 휴머노이드 로봇(사람을 닮은 로봇)과 함께 박인규 과학기술정보통신부 과학기술혁신본부장에게 전략보고서를 전달하고 있다."},{"s":"미래에셋, 'TIGER 코리아휴머노이드로봇산업' 연초 이후 개인 순매수 5551억","so":"뉴스핌","tm":"11/26 11:38","c":6,"r":"kr","u":"https://www.newspim.com/news/view/20261126000267","p":1795660680,"a":1795663042,"su":"- 미래에셋자산운용은 26일 TIGER 휴머노이드로봇 ETF 개인 순매수가 5000억원을 돌파했다고 밝혔다 - 해당 ETF는 올해 개인 순매수 5551억원과 일평균 거래대금(하루 동안 사고판 돈의 합) 742억원을 기록했다 - 삼성전자 등 국내 기업의 휴머노이드 사업화로 관련 밸류체인에 관심이 모이고 있다 !AI가 자동 생성한 요약으로 정확하지 않을 수 있어요. 국내 상장 휴머노이드 로봇(사람을 닮은 로봇) ETF 가운데 일 평균 거래대금 1위 \"CES 2027 앞두고 삼성전자 휴머노이드 공개 기대감\" [서울=뉴스핌] 김가희 기자 = 미래에셋자산운용은 26일 자사 'TIGER 코리아휴머노이드로봇산업' 상장지수펀드(ETF)가 올해 개인 순매수 5000억원을 돌파했다고 밝혔다."},{"s":"샤오펑의 휴머노이드 로봇 IRON, 내년 1월 하드웨어 양산 돌입","so":"第一财经","tm":"11/25 17:26","c":6,"r":"cn","u":"https://www.yicai.com/news/103453873.html","p":1795595197,"a":1795608239,"t":"小鹏人形机器人IRON将于明年1月进入硬件量产","su":"제일재경 2026-11-25 16:22:31 편집자: Gao Mingyan 샤오펑 Motors 뉴스에 따르면 샤오펑의 휴머노이드 로봇(사람을 닮은 로봇) IRON은 2027년 1월 하드웨어 대량 생산 단계에 진입할 예정이며 2분기에 공식 출시될 예정입니다. 다음주에 주목하세요 | 9월 경제 데이터가 발표될 예정이며, 이러한 투자 기회는 가장 신뢰할 수 있습니다. BMW는 2027년까지 중국 시장에 약 20종의 차세대 기술 플랫폼 모델을 출시하고, 2030년까지 국내 생산 모델의 비중을 95% 이상으로 늘릴 계획이다. 유리 기반 패키징(반도체 칩을 포장하고 연결하는 공정) 트랙의 미래 시장 규모는 엄청난 잠재력을 가지고 있지만, 중국 국내 기업은 여전히 수율 향상, 고객 인증, 대량 생산 속도 등 산업화 과제에 직면 95675560,"a":1795694357,"t":"机器人ETF鹏华(159278)盘中净申购6100万份，宇树王兴兴称5到10年内，中国机器人产量有望超过汽车","su":"뉴스에 따르면 지난 11월 26일 베이징에서 열린 WISE2026 컨퍼런스에서 유니트리의 창립자이자 회장인 Wang Xingxing은 5~10년 내에 중국의 로봇 생산량이 자동차 생산량을 넘어 연간 생산량이 2천만 대를 넘어설 것이라고 판단했습니다."},{"s":"샤오펑 로봇 IRON, 대본 없이 강의 \"조금 긴장되지만 얼굴 붉히지는 않을 것\"","so":"udn","tm":"11/26 15:27","c":1,"r":"tw","u":"https://udn.com/news/story/7333/9903514?from=udn-ch1_breaknews-1-0-news","p":1795674420,"a":1795676879,"t":"小鵬機器人IRON無腳本開講 「我有點緊張 但不會臉紅」","su":"샤오펑 Technology는 25일 광동에서 샤오펑의 고급형 범용 휴머노이드 로봇(사람을 닮은 로봇) IRON을 출시했습니다. 많은 사람들을 놀라게 한 것은 IRON이 샤오펑 Technology의 창립자인 He Xiaopeng과 직접 대면하여 소통하면서 대본도 없는 공개 대화를 현장에 가져왔다는 것입니다. 모든 응답은 실시간으로 로봇이 독립적으로 생성했으며 중국어와 영어로 자체 음성을 시작했으며 손바닥 온도는 25~40°C였습니다. IRON은 유머와도 상호작용할 수 있습니다. 언론이 \"나와 허샤오펑 중 누가 더 똑똑한가?\"라고 묻자 \"각자 고유의 장점이 있다\"고 답했다. 샤오펑 Group의 He Xiaopeng 회장은 IRON이 다양한 직위의 요구 사항에 적응하고 실제 작업 시나리오를 목표로 삼을 수 있다고 말했습니다."},{"s":"중롄중커, bauma CHINA 2026에서 임바디드 AI으로 구동되는 업계 최초의 AI 발굴 로봇 출시","so":"The Straits Times","tm":"11/26 14:46","c":1,"r":"sg","u":"https://www.straitstimes.com/paid-press-releases/zoomlion-launches-industrys-first-ai-excavation-robot-powered-by-embodied-intelligence-at-bauma-china-2026-20261126","p":1795671960,"a":1795676883,"t":"Zoomlion Launches Industry's First AI Excavation Robot Powered by Embodied Intelligence at bauma CHINA 2026","su":"상하이, 2026년 11월 26일 /PRNewswire/ -- 중롄중커(\"중롄중커\" 또는 \"회사\")가 업계를 시작했습니다."},{"s":"약국에 들어온 휴머노이드…재고관리부터 발주까지 자동화 추진","so":"약업신문","tm":"11/26 13:30","c":1,"r":"kr","u":"http://www.yakup.com/news/?mode=view&cat=17&cat2=&cat3=0&nid=335796","p":1795667459,"a":1795676872,"su":"조성훈 제이엔제이테크 대표(왼쪽)와 박찬후 루드다이나믹스 대표가 지난 20일 약국 휴머노이드 로봇(사람을 닮은 로봇) 도입 및 보급을 위한 업무협약을 체결하고 기념촬영을 하고 있다. © 루드다이나믹스약국 조제실에도 피지컬 A..."},{"s":"샤오펑은 휴머노이드 로봇의 가격이 EV와 동일할 것이라고 말합니다.","so":"Bloomberg.com","tm":"11/26 13:30","c":1,"r":"us","u":"https://www.bloomberg.com/news/articles/2026-11-26/xpeng-says-its-humanoid-robot-will-cost-the-same-as-an-ev","p":1795667400,"a":1795676872,"t":"Xpeng Says Its Humanoid Robot Will Cost the Same as an EV"},{"s":"로봇 부품, Dingzhi Technology 휴머노이드 로봇의 핵심 링크인 일괄 배송 시작","so":"Jiemian.com","tm":"11/26 13:22","c":1,"r":"cn","u":"https://www.jiemian.com/article/15376353.html","p":1795666934,"a":1795676876,"t":"机器人零部件进入批量交付 鼎智科技卡位人形机器人核心环节","su":"Dingzhi Technology(920593)의 2026년 3분기 보고서에 따르면 회사의 첫 3분기 매출은 3억 3,500만 위안으로 전년 대비(작년 같은 때와 비교해서) 74.67% 증가했습니다. 그 중 로봇 사업 수익은 약 5,500만 위안으로 전년 대비 573% 증가했으며 이는 산업 부문 성장의 중요한 원동력입니다. 회사는 지난 11월 10일 열린 3분기 실적보고회에서 로봇부품이 일괄납품 단계에 진입했다고 밝혔다. 제품 레이아웃 측면에서는 휴머노이드 로봇(사람을 닮은 로봇) 분야의 코어리스 모터, 프레임리스 토크 모터, 정밀 기어박스, 고정밀 나사 등 핵심 부품을 다루고 있으며 선형 모션 모듈과 회전 모듈을 출시했습니다. 2025년 12월에 통합된 Dongguan Serente는 정밀 소형 모듈 기어와 마이크로 유성 감속 기어박스를 추가하여 올해 첫 3분기 동안 7,700만 위안 이상의 매출을 기여했습니다. 이 회사는 또한 커넥팅 로드형, 로프 구동형, 직접 구동형의 세 가지 기술 경로를 갖춘 손재주를 출시한 Zhongke Lingxi의 지분 5%를 보유하고 있습니다. Dingzhi는 다양한 경로의 능숙한 손에 해당 모션 제어 구성요소를 제공할 수 있습니다."},{"s":"RoboSense, 2026년 3분기 미감사 재무 결과 보고, 로봇 공학 LiDAR 판매량 순위 전 세계 1위 달성","so":"The Straits Times","tm":"11/26 13:18","c":1,"r":"sg","u":"https://www.straitstimes.com/paid-press-releases/robosense-reports-third-quarter-2026-unaudited-financial-results-with-robotics-lidar-sales-volume-ranking-no-1-globally-20261126","p":1795666680,"a":1795676884,"t":"RoboSense Reports Third Quarter 2026 Unaudited Financial Results, with Robotics LiDAR Sales Volume Ranking No. 1 Globally","su":"주요 재무 및 운영 하이라이트 홍콩, 2026년 11월 26일 /PRNewswire/ -- RoboSense(\"RoboSense\" 또는 \"회사\")(HKEX: 02 straitstimes.com에서 자세한 내용을 확인하세요. straitstimes.com에서 자세한 내용을 확인하세요."},{"s":"휴머노이드 로봇이 도요타의 안방에서 공장 현실을 만나다","so":"Nikkei Asia","tm":"11/26 13:10","c":1,"r":"us","u":"https://asia.nikkei.com/business/automobiles/humanoid-robots-meet-factory-reality-on-toyota-s-home-turf","p":1795666200,"a":1795694351,"t":"Humanoid robots meet factory reality on Toyota's home turf","su":"자동차 제조업체는 과대광고보다 물리적 AI의 실제 적용을 우선시한다고 공급업체는 말합니다."},{"s":"총 이익 마진이 반등했고 리오토는 실적 후 11% 이상 상승했습니다! 샤오펑 휴머노이드 로봇이 하드웨어 대량 생산을 앞두고 있으며 홍콩 증권 연결 자동 ETF 차이나 유니버셜(159210) 지수가 3% 이상 상승했습니다! 2027년 전망: 수출과 AI라는 이중 주력 노선에 집중","so":"Jiemian.com","tm":"11/26 13:00","c":1,"r":"cn","u":"https://www.jiemian.com/article/15376196.html","p":1795665618,"a":1795676877,"t":"毛利率回升，理想汽车绩后涨超11%！小鹏人形机器人即将硬件量产，港股通汽车ETF汇添富(159210)指数涨超3%！27年展望：关注出口与AI双主线","su":"11월 26일 홍콩 증시는 등락을 거듭하며 상승했습니다. 항셍지수는 1% 이상 상승했다. 자동차 부문이 큰 폭으로 상승했다. Southbound Automobile ETF(여러 주식을 묶어 파는 상품) China Universal(159210)의 기본 지수는 3% 이상 상승했습니다."},{"s":"DJI 베테랑 두 명이 사람을 쫓는 사격 로봇을 만들었습니다.","so":"Jiemian.com","tm":"11/26 11:11","c":1,"r":"cn","u":"https://www.jiemian.com/article/15373536.html","p":1795659098,"a":1795663046,"t":"两位大疆老兵，造了一台追着人跑的拍摄机器人","su":"지몐 뉴스 기자 | Jiemian 뉴스 편집자 | Wen Shuqi 선전 탤런트 파크의 트랙에서는 무릎 높이보다 작은 흰색 로봇이 주자를 따라갔고, 로봇의 카메라는 항상 후자를 겨냥했습니다. 주자가 속도를 높이면 자동차도 속도를 높여 연석에 부딪힐 때 약간 점프하고 계속해서 앞 사람을 따라잡습니다. 이 로봇은 Beni라고 불리며 선전 회사인 Miaodong Technology가 제작했습니다. 2026년 7월 Beni는 Kickstarter에 출시되어 결국 7,926명의 후원자를 유치하고 500만 달러 이상을 모금하여 플랫폼에서 소비자 로봇에 대한 크라우드 펀딩 기록을 세웠습니다. 최근 Beni는 표준 세트 가격이 4,999위안, 탐사 세트 가격이 5,799위안으로 전 세계적으로 현물 판매를 시작했습니다."},{"s":"허샤오펑과의 대화: 로봇 회사가 자동차 회사를 전복시키는 것일 수도 있다","so":"Jiemian.com","tm":"11/26 10:29","c":1,"r":"cn","u":"https://www.jiemian.com/article/15374402.html","p":1795656570,"a":1795663048,"t":"对话何小鹏：颠覆汽车公司的可能是机器人公司","su":"지몐 뉴스 기자 | Jiemian 뉴스 편집자 | Wen Shuqi 런웨이 영상이 인터넷에서 로봇인지 실제 사람인지에 대한 논쟁을 불러일으킨 지 1년 후, Xiaopeng은 휴머노이드 로봇(사람을 닮은 로봇) IRON의 대량 생산 및 사업 계획을 테이블에 올렸습니다. 11월 25일, 광저우에서 열린 샤오펑 AI 기술의 날에서 샤오펑 Motors의 회장 겸 CEO인 He Xiaopeng은 차세대 IRON이 올해 9월 8일에 자동화된 조립 라인을 출시했으며 현재 공개 전 최종 준비 단계에 있다고 말했습니다. 하드웨어 대량 생산은 2027년 1월에 시작될 예정이며 2분기에 외부 상업 고객에게 공식적으로 출시될 예정입니다. '웨이샤오리'의 다른 두 회사가 AI 탐구에 조심스러워지고 있는 반면, 허샤오펑은 '물리적 AI' 개념에 점점 더 관심을 기울이고 있다. 그는 이 시스템을 세 가지 시스템으로 나누었습니다. 시스템 0은 근본적인 본능적 반응을 담당하고, 시스템 1은 움직임 제어를 위한 \"소뇌\"에 해당하며, 시스템 2는 계획, 추론 및 사고를 담당하는 \"뇌\"입니다. 허샤오펑은 과거에는 시스템 1을 전문으로 하는 자율주행(사람 대신 차가 스스로 운전하는 것) 기업과 시스템 2를 전문으로 하는 대형 모델 기업이 있었다고 말했다. 그러나 샤오펑 자동차와 로봇이 공유하는 Turing Embodied Intelligent Architecture(VLA 3.0)에서는 이 세 시스템이 함께 쌓여 있다."},{"s":"[장중수급포착] 레인보우로보틱스, 기관 10일 연속 순매수행진... 주가 +4.53%","so":"뉴스핌","tm":"11/26 10:18","c":1,"r":"kr","u":"https://www.newspim.com/news/view/20261126000423","p":1795655880,"a":1795663042,"su":"[서울=뉴스핌] 로보뉴스 = 26일 10시 15분 현재 레인보우로보틱스(277810)는 전일 대비 4.53% (현재가 484,500원) 상승했고, 기관이 최근 10일 연속 순매수(누적 34.12만 주, 잠정) 행진을 하고 있다.[표] 외국인ㆍ기관 순매매량 (단위 주)["},{"s":"미·중 휴머노이드 상용화 주춤…한국에 기회의 문 열리나?","so":"로봇신문","tm":"11/26 09:44","c":1,"r":"kr","u":"https://www.irobotnews.com/news/articleView.html?idxno=49810","p":1795653872,"a":1795663042,"su":"미국과 중국의 휴머노이드(사람을 닮은 로봇) 상용화(실제로 팔고 쓰이기 시작하는 것)가 속도를 내지 못하는 현 시점이 한국에 남은 마지막 기회라는 분석이 나왔다. 국내 대기업들이 본격적인 사업화에 들어가면서 2027"},{"s":"샤오펑은 IRON 휴머노이드 로봇의 2027년 출시를 설정했지만 가격은 밝히지 않았습니다.","so":"Startup Fortune","tm":"11/26 09:31","c":1,"r":"us","u":"https://startupfortune.com/xpeng-sets-a-2027-release-for-its-iron-humanoid-robot-but-names-no-price/","p":1795653090,"a":1795663043,"t":"XPeng Sets a 2027 Release for Its IRON Humanoid Robot but Names No Price","su":"샤오펑은 올해의 자동차 배송이 여전히 작년에 뒤처지는 동안 실제 AI 회사로 보이기를 원합니다. 자체 쇼룸에서 먼저 해당 피치를 판단할 수 있습니다. 샤오펑의 IRON 휴머노이드 로봇(사람을 닮은 로봇)은 2027년 1분기에 중국 자동차 제조업체의 국내 매장에서 판매 보조원으로 훈련하는 첫 번째 직업을 갖습니다."},{"s":"유일로보틱스, 166억 규모 로봇 국책과제 2건 동시 선정","so":"한국경제","tm":"11/26 09:23","c":1,"r":"kr","u":"https://www.hankyung.com/article/202611261316i","p":1795652597,"a":1795663042,"su":"AI 추천 뉴스 유일로보틱스, 166억 규모 로봇 국책과제 2건 동시 선정 산업용 로봇 전문기업 유일로보틱스가 총 166억원 규모의 정부 로봇 연구개발(R&D) 과제 2건에 동시 선정됐다. 고출력·고에너지밀도 하이브리드 배터리와 피지컬 인공지능(AI) 기반 범용 로봇제어기를 개발해 24시간 가동할 수 있는 산업용 휴머노이드(사람을 닮은 로봇)를 구현한다는 목표다. 유일로보틱스는 산업통상부가 추진하는 ‘2026년도 로봇산업핵심기술개발사업’에서 모바일 휴머노이드 개발 과제의 주관기관과 AI 기반 실시간 로봇제어기 개발 과제의 참여기관으로 각각 선정됐다고 26일 밝혔다."},{"s":"美 뉴저지공대, 3D 프린터로 제작하는 저비용 휴머노이드 로봇 손 개발","so":"로봇신문","tm":"11/26 09:18","c":1,"r":"kr","u":"https://www.irobotnews.com/news/articleView.html?idxno=49809","p":1795652329,"a":1795663042,"su":"미국 뉴저지공대(NJIT) 연구팀이 보급형 3D 프린터로 제작할 수 있는 휴머노이드(사람을 닮은 로봇)용 로봇 핸드를 개발했다. 손가락마다 3개의 구동 자유도를 구현해 다양한 물체를"},{"s":"신한투자증권 “유니트론텍, 내년 PER  Citi says it's a buy","su":"어질리티 로보틱스(Agility Robotics)는 기업공개(IPO(회사가 주식시장에 처음 들어오는 것)) 이후 가치가 절반 이상 하락했지만, 씨티에 따르면 휴머노이드 로봇(사람을 닮은 로봇) 시장이 확대되면 많은 상승 여력을 볼 수 있는 위치에 있다."},{"s":"18:29:05 [휴머노이드 로봇 부문은 조정을 이어가며 로봇 ETF 이팡다(E Fund)(159530)가 추세를 역행하며 5300만 순청약을 기록했다]","so":"财联社","tm":"11/25 21:54","c":1,"r":"cn","u":"https://www.cls.cn/detail/2545676","p":1795611240,"a":1795694361,"t":"18:29:05【人形机器人板块延续回调，机器人ETF易方达（159530）逆势获5300万份净申购】"},{"s":"110일! 순더(Shunde)에서 제작된 첫 번째 케플러 휴머노이드 로봇이 대량 생산되어 베이자오(Beijiao)에 납품되었습니다.","so":"21财经","tm":"11/25 21:32","c":1,"r":"cn","u":"https://www.21jingji.com/article/20261125/herald/da94ce6d995e739f1ac762723e3cc861.html","p":1795609920,"a":1795612561,"t":"110天！首批顺德造开普勒人形机器人，在北滘量产交付","su":"11월 25일, Kepler Robot의 Shunde 기지의 첫 번째 휴머노이드 로봇(사람을 닮은 로봇)이 공식적으로 Shunbei Group에 인도되어 현지 산업 시나리오에 사용되었습니다. 이때는 프로젝트가 체결된 지 불과 110일 만이다. \"순더에 상륙한 케플러 로봇\"은 순더구 임바디드 AI(로봇처럼 몸을 가진 인공지능) 개발국이 공개된 후 도입된 첫 번째 주요 투자 프로젝트입니다. 이 프로젝트는 올해 8월 7일 베이자오에서 서명 및 확정되었습니다. 11월 18일 현지 산업상업 등록이 완료되어 11월 25일 1차 대량생산이 이루어졌다. 계약 체결부터 대량생산 납품까지 단 110일밖에 걸리지 않아 '순덕 속도'를 넘어섰고, '응용 시장을 통한 산업 투자 활용'이라는 투자 촉진 모델의 타당성도 검증됐다. Kepler Robot의 Shunde 기지의 첫 번째 휴머노이드 로봇 배치가 Shunbei Group에 공식적으로 전달되었습니다."},{"s":"AI 컴퓨팅 파워가 엣지로 이동합니다! 기관투자자들은 2027년 산업용 컴퓨터와 로봇 사업 기회에 대해 낙관하고 있다","so":"經濟日報","tm":"11/25 21:00","c":1,"r":"tw","u":"https://money.udn.com/money/story/5612/9903343","p":1795608000,"a":1795676881,"t":"AI 算力走向邊緣端！法人看好2027工業電腦、機器人商機","su":"AI 컴퓨팅 성능에 대한 수요가 지속적으로 확대되고 애플리케이션이 점차 클라우드(인터넷으로 빌려 쓰는 컴퓨터) 데이터 센터에서 엣지 컴퓨팅 및 스마트 제조로 확장되면서 산업용 컴퓨터(IPC)와 로봇 산업이 새로운 성장의 물결을 이끌고 있습니다. 푸본투자컨설팅은 엣지 AI(에지 AI), 에이전트 AI, 스마트 제조 애플리케이션 구현이 가속화되면서 산업용 컴퓨터 산업이 2027년에도 강세(오르는 힘이 센 것) 확장 사이클을 이어갈 것으로 예상된다고 지적했다. 어드밴텍(2395), 화한(6414), 상하이 실버(2049) 등도 주목할 만하다."},{"s":"히타치, 파낙과 AI 로봇 암 개발 「자율형 공장」에 포석","so":"日本経済新聞","tm":"11/25 20:00","c":1,"r":"jp","u":"https://www.nikkei.com/article/DGXZQOUC101JP0Q6A111C2000000/","p":1795604400,"a":1795608241,"t":"日立、ファナックとAIロボットアーム開発 「自律型工場」へ布石","su":"히타치제작소는 화낙과 공동으로 피킹용 인공지능(AI) 로봇암을 개발한다. 자율적으로 부품을 운반하는 공장 시스템으로서 2027년도에 판매한다. 히타치는 인수를 통하지 않는 '자율형 공장'을 목표로 하고 있으며, 생산 현장의 생산성을 높인다. 히타치의 산업기기 부문 ‘커넥티브 인더스트리즈(CI) 섹터’를 이끄는 아미야 겐하루 집행역 전무가 일본 경제신문 취재에 대해 밝혔다. 히타치는 9월에 Fanak과의 협업 개시를 표"},{"s":"시가총액은 거의 2000억 달러 감소했습니다. 유니트리의 가치는 얼마입니까?","so":"第一财经","tm":"11/25 18:41","c":1,"r":"cn","u":"https://www.yicai.com/news/103336593.html","p":1795599705,"a":1795647157,"t":"市值跌去近2000亿，宇树科技到底值多少钱？","su":"8월 27일, 유니트리의 주가는 장 후반에 상승하여 주당 615.03위안으로 마감했는데, 이는 거의 4% 증가한 수치입니다. 지난 5거래일 동안 회사 주가는 계속 하락해 전날 종가가 주당 600위안 아래로 떨어졌다. 첫날 개장 시장 가치 4,449억 위안에 비해 유니트리의 시가총액(회사 전체 몸값)은 거의 2,000억 위안 감소하여 거의 절반으로 줄었습니다. 주가 되돌림 외에도 제2회 세계 휴머노이드 로봇(사람을 닮은 로봇) 게임에서 유니트리의 최근 성과는 작년만큼 눈에 띄지 않았습니다. 올해 유니트리 기술팀은 Wushu Tai Chi와 Kickboxing 경량 종목에서 은메달 2개를 획득했습니다. 지난해 유니트리는 육상 경기에서 4개의 금메달을 획득했다. 유니트리의 높은 가치평가와 R&D 투자가 다시 한번 논란을 불러일으켰다."},{"s":"허샤오펑: 휴머노이드 로봇은 내년 2분기에 출시될 예정이며 향후 토큰 구독을 통해 가치를 창출할 것입니다.","so":"ThePaper.cn","tm":"11/25 18:34","c":1,"r":"cn","u":"https://www.thepaper.cn/newsDetail_forward_34557016","p":1795599264,"a":1795608240,"t":"何小鹏：人形机器人明年二季度发布，未来将通过Token订阅等创造价值","su":"\"과학적 연구와 성능을 위해 제작된 로봇과 달리 Xiaopeng Robots는 자격을 갖춘 작업 파트너가 되는 것을 목표로 하는 고급 범용 휴머노이드 로봇(사람을 닮은 로봇)입니다.\" 11월 25일 Xiaopeng Group 회장 겸 CEO(회사의 가장 높은 책임자)인 He Xiaopeng은 2026 Xiaopeng Technology 박람회에서 다음과 같이 말했습니다."},{"s":"로봇 대장주 레인보우로보틱스 벌써 CES 약발, 삼성전자와 '휴머노이드 공동 개발' 앞세워 주가 더 오르나","so":"비즈니스포스트","tm":"11/25 17:25","c":1,"r":"kr","u":"https://www.businesspost.co.kr/BP?command=article_view&num=452944","p":1795595135,"a":1795647150},{"s":"세이코 엡손 협동로봇 'AX6-A901S'","so":"전자신문","tm":"11/25 16:59","c":1,"r":"kr","u":"https://www.etnews.com/tools/image_popup.html?v=bjQ5VkNYY2dLZTZMZFBUbmNzandvWmpGcjBTK1pHYm1CUVRXR0pTMldlYVZkdE5JeGJVUFVVNURJN04rbmhKTUl4UUNnaWpWa20wdk5BcVNtWjFEUXJ6R1ZpaWJwVHl0cXlFcVZVOW02dVFOMnNDS3UxeXBIVXIyU1VvUCtqS2RJM3pWcTFCRDZGYlRiWHJ4ZDRyNXhvdUR1ZlFNa2NRWVJOU0hrN01DVkxKajRaZWlBejVHQm5UYThGcUZMUG9ZcnhqR1hldVFQYTRBaHdNQ3NpNk5mZHNJUU5obzcvUDd1T2l4M3dlUU9tczRTOTQ5cllqUUkySTJCckpYU3h1MGllQUlDZ0g4OFVOK01COUJzbitkVlE9PQ","p":1795593549,"a":1795608239},{"s":"[포토] 디자인코리아 2026에 등장한 휴머노이드 ‘아틀라스’","so":"한국경제","tm":"11/25 16:23","c":1,"r":"kr","u":"https://www.hankyung.com/article/202611259855i","p":1795591424,"a":1795608239,"su":"AI 추천 뉴스 [포토] 디자인코리아 2026에 등장한 휴머노이드 ‘아틀라스’ 25일 서울 강남구 코엑스에서 열린 ‘디자인코리아 2026’에 현대차그룹의 휴머노이드 로봇(사람을 닮은 로봇) ‘아틀라스’가 전시돼 있다. 산업통상부가 주최하고 한국디자인진흥원이 주관하는 국내 최대 디자인산업 박람회 ‘디자인코리아 2026’은 이날부터 오는 29일까지 5일간 열린다. 이번 행사는 ‘디자인, 경계를 넘어서는 다양성’을 주제로 국내외 200여 개 기업이 참여하는 전시회를 비롯해 국제 콘퍼런스, 비즈니스 매칭, 채용박람회, 대한민국 디자인대상 시상식 등 다양한 프로그램으로 구성됐다."},{"s":"테슬라는 옵티머스 양산 준비를 계속해서 진전시키고 있다. 어떤 로봇 테마 ETF를 선택할 것인가? 로봇 ETF 인베스코(159559)의 기본 지수는 로봇 산업 체인의 관련 링크에 중점을 둡니다.","so":"Jiemian.com","tm":"11/25 16:02","c":1,"r":"cn","u":"https://www.jiemian.com/article/15372227.html","p":1795590128,"a":1795608241,"t":"特斯拉持续推进Optimus量产准备，机器人主题类ETF选哪个？机器人ETF景顺(159559)标的指数聚焦机器人产业链相关环节","su":"순 자본 유입의 관점에서 Wind 데이터에 따르면 2026년 11월 20일 현재 로봇 ETF(여러 주식을 묶어 파는 상품) 인베스코(159559)는 지난 5일 동안 연속 순 자본 유입을 받았으며 일일 순 유입액이 1743.96만 위안으로 가장 높았으며 총 \"자금 유치\"액은 4061.61만 위안에 달했습니다."},{"s":"엡손, 日서 첫 협동로봇 출시…韓 법인도 판매 준비 '잰걸음'","so":"전자신문","tm":"11/25 16:00","c":1,"r":"kr","u":"https://www.etnews.com/20261120000007","p":1795590000,"a":1795608239,"su":"일본 세이코 엡손이 로봇 라인업 다각화를 위해 첫 협동로봇(사람 옆에서 함께 일하는 로봇)을 출시했다. 국내 법인인 한국엡손도 내년 3월 한국에서 협동로봇 사업을 개시할 예정이다. 엡손은 일본에서 협동로봇"},{"s":"일본 국내 개발의 휴머노이드 「N2H」","so":"産経ニュース","tm":"11/25 15:01","c":1,"r":"jp","u":"https://www.sankei.com/article/20261125-4Y4H4XOR6VPS5LCO5RXPR4S754/photo/PXHPK3T3XBJRZHSRVM5QLKQFM4/","p":1795586474,"a":1795647164,"t":"国内開発のヒューマノイド「N2H」","su":"산케이 뉴스의 기사 「“피지컬 AI(몸을 갖고 실제 세상에서 움직이는 인공지능(로봇 등)) 원년”인형 로봇이나 최첨단 기술이 집결 오사카·간사이 박람회의 테마 사업 프로듀서를 맡은 이시구로 히로시씨도 출전”의 사진이나 화상의 확대 페이지입니다."},{"s":"머스크가 던진 ‘사과 테스트’…경쟁사 휴머노이드가 먼저 해냈다 [현장영상]","so":"KBS 뉴스","tm":"11/25 14:49","c":1,"r":"kr","u":"https://news.kbs.co.kr/news/pc/view/view.do?ncd=8722202","p":1795585740,"a":1795589938,"su":"테이블을 뒤로 옮기자, 휴머노이드 로봇(사람을 닮은 로봇)이 걸어가 사과를 다시 집어 들었습니다. 40초짜리 이 영상이 주목..."},{"s":"\"피지컬 AI 원년\"인형 로봇과 최첨단 기술이 집결 오사카 · 간사이 박람회의 테마 사업 프로듀서를 맡은 이시구로 히로시씨도 출전","so":"毎日新聞","tm":"11/25 14:16","c":1,"r":"jp","u":"https://mainichi.jp/articles/20261125/orc/00m/200/153000c","p":1795583784,"a":1795589941,"t":"“フィジカルAI元年”人型ロボットや最先端技術が集結 大阪・関西万博のテーマ事業プロデューサーを務めた石黒浩氏も出展","su":"기업의 신규 고객 개척이나 비즈니스 창출을 목적으로 한 종합 전시회 「비즈니스 찬스 EXPO in TOKYO」에서는, 「피지컬 AI(몸을 갖고 실제 세상에서 움직이는 인공지능(로봇 등)) 원년」을 테마로 내건 주최자 부스를 전개. 출전 부스 중에서 인형 로봇 (휴머노이드(사람을 닮은 로봇)), AI 아바타, 힘 촉각을 갖춘 로봇 등, 인력 부족과 기술 승계와 같은 사회 과제"},{"s":"다올자산운용, 현대차·삼성·LG 로봇 관련주 담는 채권혼합형 펀드 출시","so":"파이낸셜뉴스","tm":"11/25 13:45","c":1,"r":"kr","u":"https://www.fnnews.com/news/202611251310567753","p":1795581907,"a":1795589938,"su":"다올자산운용이 자산의 60% 이상을 채권(나라나 회사에 돈 빌려준 증서)에 투자하고 현대차·삼성·LG그룹의 로봇 사업과 관련된 국내 주식을 최대 30%까지 담는 공모펀드를 내놨다."},{"s":"한국SMC, 대전공장에 AMR·협동로봇 적용","so":"디일렉","tm":"11/25 13:35","c":1,"r":"kr","u":"https://www.thelec.kr/news/articleView.html?idxno=65879","p":1795581354,"a":1795582140,"su":"한국SMC가 대전 제1, 2공장에 자동물류 시스템과 자율이동로봇(AMR(스스로 길을 찾아 물건을 나르는 로봇)), 무인운반차(AGV), 협동로봇(사람 옆에서 함께 일하는 로봇) 등을 적용해 생산·물류 자동화를 운영하고 있다.한국SMC"},{"s":"인공지능과 로봇, 반도체, 저고도 경제에 초점을 맞춘 서던자산운용의 서던투자컨설팅은 기술산업의 성과변환 창구에 중점을 두고 | 인터페이스 뉴스","so":"Jiemian.com","tm":"11/25 13:14","c":1,"r":"cn","u":"https://www.jiemian.com/article/15371671.html","p":1795580070,"a":1795582142,"t":"聚焦人工智能与机器人、半导体、低空经济，南方基金司南投顾关注科技产业的成果转化窗口| 界面新闻","su":"서던자산운용의 자회사(다른 회사가 주인인 회사)인 신안투자컨설팅은 기술산업 성과의 전환창에 있는 구조적 기회에 중점을 두고, 펀드(여러 사람 돈을 모아 전문가가 굴리는 것) 선택 및 포트폴리오 다각화를 통해 투자자가 산업 동향과 단기 가치평가 간의 관계를 합리적으로 볼 수 있도록 돕습니다."},{"s":"서울과기대 첨단 연구 성과, 태국·베트남 특집 방송에 소개...홍수 대응·휴머노이드 기술 조명","so":"팝콘뉴스","tm":"11/25 12:50","c":1,"r":"kr","u":"https://www.popcornnews.net/news/articleView.html?idxno=141478","p":1795578641,"a":1795582140,"su":"(팝콘뉴스=김은교 기자) 동남아시아 현지의 재난 대응과 미래 로봇 산업을 다룬 해외 특집 방송에 국내 대학 연구실의 기술이 소개됐다. 서울과학기술대학교(총장 김동환)는 문화체육관광부가 주관한 ‘2026 해외미디어 협력 특집 기획 방송 제작’ 사업에 참여해 태국과 베트남 방송을 통해 각각 홍수 시뮬레이션 기술과 휴머노이드 로봇(사람을 닮은 로봇) 연구 현장을 공개했다고 25일 밝혔다. 이번 특집 방송은 이재명 대통령의 아세안 정상회의 참석 및 정상외교 일정에 맞춰 한국의 주요 기술과 산업 현황을 현지에 알리기 위해 마련됐다. 반도체, 피지컬 AI(몸을 갖고 실제 세상에서 움직이는 인공지능(로봇 등)), AI"},{"s":"10개국 개발자들이 자공하이테크존에 모였습니다! 유비테크 해외 휴머노이드 로봇 교육 수익 최종 후보","so":"人民网－四川频道","tm":"11/25 12:04","c":1,"r":"cn","u":"http://sc.people.com.cn/n2/2026/1125/c345458-41760559.html","p":1795575840,"a":1795576874,"t":"十国开发者齐聚自贡高新区！优必选海外人形机器人实训营收官","su":"초겨울에는 Zigong High-tech Zone의 휴머노이드 로봇(사람을 닮은 로봇) 데이터 수집 및 테스트 센터에서 실제 기계 디버깅, 코드 작성, 모델 교육 등이 동시에 수행됩니다. 지난 11월 16일부터 20일까지 BuildWithUBTECH・2026 유비테크 해외 생태형 인간형 개발 훈련 캠프가 성공적으로 개최되었습니다."},{"s":"605018, 순식간에 상한가! 휴머노이드 로봇, 여러 종목 연속 상한가","so":"21财经","tm":"11/25 11:17","c":1,"r":"cn","u":"https://www.21jingji.com/article/20261125/herald/bac7713cbb817e683e85f4ace7a6a922.html","p":1795573020,"a":1795574673,"t":"605018，秒涨停！人形机器人，多股连板","su":"11월 25일 오픈하여 휴머노이드 로봇(사람을 닮은 로봇)이라는 컨셉이 계속해서 활발히 활동하고 있습니다. 장화그룹(605018) 오픈 후 초 제한 상한액으로 4회 연속 보드 달성; 닝보둥리에는 3개의 연속 보드가 있습니다. 창립자 모터(방정전기), 고요(Koyo), 헝공정밀(헝궁정밀), 푸라이 신소재(푸라이신소재)가 그 뒤를 따랐습니다. 이 소식에 샤오펑 Motors는 휴머노이드 로봇 IRON의 최신 워밍업 영상을 공개했습니다. 짧은 영상은 로봇이 수동 원격 제어 없이 일상생활에 가까운 여러 가지 정교한 작업을 독립적으로 완료할 수 있다는 점을 보여주는 데 중점을 둡니다. 장화그룹은 11월 24일 주식거래 위험 경고를 발령했다. 이 회사는 상장 자동차 부품회사이다. 주로 자동차 금속 부품의 연구 개발, 생산 및 판매에 종사하고 있습니다. 핵심 제품은 패스너, 스탬핑 및 용접 부품입니다. 완전한 휴머노이드 로봇 사업에 종사하고 있지 않습니다. 액추에이터(로봇 관절을 움직이는 부품) 및 기타 관련 부품 제품에 대한 특수 구조 부품만 고객에게 제공합니다. 현재까지 약 88,000위안의 영업이익을 달성했습니다. 위에서 언급한 제품은 회사의 주요 비즈니스 제품의 응용 시나리오 확장을 기반으로 합니다. 이는 회사 전체 영업이익에서 아주 작은 부분을 차지하며 순이익에 큰 영향을 미치지 않습니다. 유성 롤러 스크류 제품에 관해서는 아직 연구 개발 단계에 있습니다. 아직 고객 승인을 받지 못했고, 영업이익도 달성하지 못한 상태여서 실적에 영향은 없을 것으로 보인다."},{"s":"인도는 세계 경제의 '마지막 프론티어', 일본 제조업 기업의 유망투자처로 4년 연속 1위… 야스카와 전기 등 생산 강화","so":"読売新聞","tm":"11/25 11:05","c":1,"r":"jp","u":"https://www.yomiuri.co.jp/local/kyushu/news/20261125-GYS1T00003/","p":1795572300,"a":1795582144,"t":"インドは世界経済の「最後のフロンティア」、日本の製造業企業の有望投資先で４年連続１位…安川電機など生産強化","su":"[요미우리 신문] 14억명이 넘는 인구를 안고 세계 경제의 '마지막 프론티어(미개척의 거대 시장)'라고 불리는 인도에는 투자가 모여 있다. 국제협력은행(JBIC)은 지난해 12월 일본 제조업 기업에 의한 해외 유망투자처에 대한 조사로 인도"},{"s":"'본토 주식시장' 3대 지수 모두 하락, 휴머노이드 로봇, 소매판매는 추세를 거스르고 상승 - 국제","so":"旺得富理財網","tm":"11/25 11:03","c":1,"r":"tw","u":"https://wantrich.chinatimes.com/news/20261125900101-420201","p":1795572225,"a":1795574674,"t":"《大陸股市》三大指數齊跌人形機器人、零售逆勢上漲- 國際","su":"[타임즈-타이페이] 중국 본토 증시가 25일 개장했다. 주요 3개 지수가 하락했다. 상하이증권거래소지수는 1.03% 하락한 3511.711포인트를 기록했다. 선전 구성요소 지수는 1.46% 하락한 10,271.862포인트를 기록했습니다. 창업판(차이넥스트) 지수는 1.95% 하락한 2234.593포인트를 기록했습니다. 시장에서는 장화그룹(창화그룹), 닝보 동리(닝보둥리) 제한, 파운더 모터(방정전기), 고요(Kyo), 헝공정밀(헝궁정밀), 푸라이 신소재(푸라이신소재) 등이 뒤를 잇는 등 휴머노이드 로봇(사람을 닮은 로봇) 테마가 반복적으로 활성화됐다. 소매 부문이 단기적으로 상승한 항저우..."},{"s":"산업 고도화를 지원하기 위한 로봇 일반화 지침. 공동 대응을 위해 24개 전략적 파트너를 모았습니다. 업계 플레이어가 국제 공급망에 진입할 수 있도록 지원하기 위해 핵심 구성 요소 기술의 개발 및 적용에 중점을 둡니다.","so":"經濟日報","tm":"11/25 11:03","c":1,"r":"tw","u":"https://money.udn.com/money/story/5639/9899934?from=edn_subcatelist_cate","p":1795572193,"a":1795574675,"t":"機器人通用化指引 助產業升級 集結 24 家策略夥伴共同響應 聚焦關鍵零組件技術發展與應用 協助業者切入國際供應鏈","su":"대만 산업이 시장 기회를 포착하고 로봇 생태계에 진입할 수 있도록 돕기 위해 지난 11월 12일 경제부 산업진흥청이 주최하고 정보정책심의회와 정밀기계센터가 시행하고 전자장비협회와 지능형 모빌리티 협회가 공동 주최한 'ROBOT READY 2026 로봇 일반화 지침 발표 및 기술 생태계 포럼'이 열렸다. 가이드라인 발표, 기술 포럼, 실제 전시회를 통해 핵심 부품의 기술 개발 및 적용에 중점을 두고 다음 단계의 대만 로봇 산업 발전 방향을 제시했습니다. 다양한 제조업체의 부품을 로봇 시스템에 성공적으로 적용하려면 기술 자체 외에도 공통 개발 기반과 산업 협력도 필요합니다. 지난 12일 공식 출시된 'ROS 2 기반 로봇 시스템 일반 소개 가이드'는 ROS 2 오픈소스 개발 프레임워크를 기반으로 로봇 개발 관행, 하드웨어 인터페이스, 통신 프로토콜, 일반적으로 사용되는 알고리즘을 통합하고 기본 로봇 모델, 국제 규정 준수 등의 주제를 담고 있다. 기술지식의 정리와 공유를 통해 국내 로봇공학 분야 업계 종사자들의 학습과 발전 과정을 단축할 것으로 기대된다. 글로벌 스마트 로봇 시장이 가속화되면서 대만의 정보통신 및 전자부품 제조사들도 적극적으로 새로운 시장 기회를 모색하고 있다. 이 연례 가이드는 INTEL Taiwan, Novatek Technology 및 Zhishen이 담당합니다."},{"s":"중국 본토에서 휴머노이드 로봇 판매가 두 자릿수 증가 돼지 가격이 안정되고 반등할 조짐을 보임 | 라이브 뉴스 - 뉴스","so":"etnet 經濟通","tm":"11/25 10:41","c":1,"r":"hk","u":"http://www.etnet.com.hk/www/tc/news/home_categorized_news_detail.php?newsid=ETR361125371","p":1795570860,"a":1795574677,"t":"內地人形機械人銷售雙位數增；豬價呈現企穩回升跡象 | 即時新聞 - 新聞","su":"2026/11/25 09:02 \"소문\" 중국 본토의 휴머노이드 로봇(사람을 닮은 로봇) 판매량이 두 자릿수 증가했습니다. 돼지고기 가격은 안정과 회복세를 <script>
var D = JSON.parse(document.getElementById('data').textContent);
var RL = {}; D.regions.forEach(function(r){ RL[r.k] = r.l; });
function $(id){ return document.getElementById(id); }
function esc(t){ return String(t==null?'':t).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
// 휴대폰에 기억해 두는 값 (마지막 탭, 탭별로 마지막에 본 시각, 정렬, 국가)
function load(k, d){ try { var v = localStorage.getItem('nb_'+k); return v===null ? d : JSON.parse(v); } catch(e){ return d; } }
function save(k, v){ try { localStorage.setItem('nb_'+k, JSON.stringify(v)); } catch(e){} }
var S = { tab: (D.themes[0] && D.themes[0].stats && D.themes.length > 1) ? 1 : 0, seen: load('seen', null), sort: load('sort', 'c'), region: load('region', 'all'), shown: D.show, prev: {} };
function newest(t){ var m = 0; t.items.forEach(function(n){ if(n.a > m) m = n.a; }); return m; }
if(S.seen === null){ S.seen = {}; D.themes.forEach(function(t){ S.seen[t.name] = newest(t); }); save('seen', S.seen); }  // 처음 방문: 레드닷 없이 시작
(function(){ var nm = load('tabname', ''); D.themes.forEach(function(t, i){ if(t.name === nm) S.tab = i; }); })();  // 마지막에 본 탭 (이름으로 기억)
if(location.hash && /^#t\d+$/.test(location.hash)) S.tab = +location.hash.slice(2);
if(location.hash === '#stats') D.themes.forEach(function(t, i){ if(t.stats) S.tab = i; });
if(S.tab >= D.themes.length) S.tab = D.themes.length > 1 ? 1 : 0;
// 통계 탭은 나라 선택을 따로 기억 (기본 = 미국 · 2026-11-24 사용자 요청: 미국 위주로) — 뉴스 탭의 나라 선택과 섞이지 않게
function regKey(){ return (D.themes[S.tab] && D.themes[S.tab].stats) ? 'sregion' : 'region'; }
function regLoad(){ S.region = load(regKey(), regKey()==='sregion' ? 'us' : 'all'); }
regLoad();

function visible(t){
  return t.items.filter(function(n){ return S.region==='all' || n.r===S.region; });
}
function sorted(list, breaking){
  var k = breaking ? 'p' : S.sort;
  return list.slice().sort(function(x,y){
    var c = y.c - x.c, p = y.p - x.p; return k==='c' ? (c||p) : (p||c);
  });
}
function renderTabs(){
  $('tabs').innerHTML = D.themes.map(function(t, i){
    var sn = S.seen[t.name] || 0;           // 지금 고른 나라에서 보이는 기사 중 새 기사가 있을 때만 (0개인데 레드닷 뜨던 문제)
    var dot = i !== S.tab && !t.stats && visible(t).some(function(n){ return n.a > sn; });
    return '<button class="tab'+(i===S.tab?' on':'')+'" onclick="openTab('+i+')">'+esc(t.name)+
           (t.stats ? '' : '<b>'+visible(t).length+'</b>')+(dot?'<span class="dot" title="새 뉴스"></span>':'')+'</button>';
  }).join('');
  var on = $('tabs').children[S.tab]; if(on && on.scrollIntoView) on.scrollIntoView({block:'nearest', inline:'center'});
}
function renderCtrl(){
  var br = D.themes[S.tab].breaking || D.themes[S.tab].stats;
  var h = '';
  if(!br){
    h += '<button class="'+(S.sort==='c'?'on':'')+'" onclick="setSort(\'c\')">🔥 화제순</button>';
    h += '<button class="'+(S.sort==='p'?'on':'')+'" onclick="setSort(\'p\')">🕒 최신순</button><span class="sep"></span>';
  }
  h += '<button class="'+(S.region==='all'?'on':'')+'" onclick="setRegion(\'all\')">전체</button>';
  D.regions.forEach(function(r){
    h += '<button class="'+(S.region===r.k?'on':'')+'" onclick="setRegion(\''+r.k+'\')">'+esc(r.l)+'</button>';
  });
  $('ctrl').innerHTML = h;
}
function card(n, prev){
  var hot = n.c > 1 ? '<span class="hot'+(n.c>=5?' big':'')+'">🔥 언론 '+n.c+'곳</span>' : '';

    '<div class="meta">'+hot+esc(RL[n.r]||'')+' · '+esc(n.so)+' · '+esc(n.tm)+isNew+'</div>'+
    '<div class="title">'+esc(n.s)+'</div>'+(n.t?'<div class="orig">'+esc(n.t)+'</div>':'')+'</a>';

    for(var t in HI.s){ for(var k in HI.s[t]){ if(HI.s[t][k][i] != null){ ok = true; break; } } if(ok) break; }
    HI.av.push(ok); }

  while(y < ey || (y === ey && m <= em)){
    var a = dIdx(y+'-'+('0'+m).slice(-2)+'-01'), ny = m===12 ? y+1 : y, nm = m===12 ? 1 : m+1;
    var b = Math.min(HI.n, dIdx(ny+'-'+('0'+nm).slice(-2)+'-01'));

// ✦ 버튼: Gemini 요청 문장을 복사하고 원문을 엶 → 원문 화면에서 Gemini 를 불러 붙여넣기
function askAI(a){
  var q = a.dataset.q || '';
  try { if(navigator.clipboard) navigator.clipboard.writeText(q); } catch(e){}
  toast('요청 문장을 복사했어요 · 원문에서 측면 버튼 길게 → 「이 페이지에 관해 질문하기」 → 붙여넣기');
  setTimeout(closeSheet, 50);
}
function toast(msg){ var t = $('toast'); t.textContent = msg; t.hidden = false; clearTimeout(toast._t); toast._t = setTimeout(function(){ t.hidden = true; }, 4000); }
function closeSheet(){ $('dim').hidden = true; $('sheet').hidden = true; document.body.style.overflow = ''; }
document.addEventListener('keydown', function(e){ if(e.key==='Escape') closeSheet(); });
