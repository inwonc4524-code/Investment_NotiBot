.meta{color:var(--sub);font-size:12px}

#sheet{position:fixed;left:0;right:0;bottom:0;z-index:6;max-width:760px;margin:auto;max-height:82vh;overflow-y:auto;
  background:var(--card);border-radius:16px 16px 0 0;padding:10px 18px calc(18px + env(safe-area-inset-bottom));box-shadow:0 -8px 30px rgba(0,0,0,.4)}
.grab{width:38px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 12px}

.s-btns{display:flex;gap:8px;margin-top:20px}

  background:var(--acc);color:#1f1e1d;font-weight:600}

.s-close button{width:100%;margin-top:8px;padding:11px;border-radius:10px;background:transparent;border:1px solid var(--line);color:var(--sub);font:inherit;font-size:14px}
.s-cnote{margin-top:8px;color:var(--sub);font-size:11.5px;text-align:center}

.seg{display:flex;gap:4px;margin:6px 4px 10px}.seg button{flex:1;min-width:0;border:1px solid var(--line);background:transparent;color:var(--sub);border-radius:8px;padding:7px 0;font:inherit;font-size:12.5px;white-space:nowrap}
.seg.ly{margin-top:-4px}.seg.ly button{padding:5px 0;font-size:12px}.seg.ly button.on{background:var(--card2);border-color:var(--acc);color:var(--text);font-weight:600}

러진다고 지적했습니다. 3대 메가프로젝트 등 정부 정책을 빌미로 추가 관세(수입품에 붙이는 세금) 인상이나 투자 압박 가능성이 있다는 분석도 나옵니다. 김대근 기자가 보도합니다. 미 무역대표부는 한국의 반도체와 자동차, 석유화학 산업에서 구조적인 과잉생산 징후가 두드러진다고 지적했습니다."},{"s":"홍콩 주식의 기술적 반등으로 즉시 213억 달러의 남쪽 자금이 인출되었고 항셍 지수의 하루 상승폭은 260포인트 하락한 22226을 기록했습니다.","so":"etnet 經濟通","tm":"11/26 17:47","c":3,"r":"hk","u":"https://www.etnet.com.hk/www/tc/news/news-article.php?section=features&category=financenews&newsid=418314","p":1795682820,"a":1795683288,"t":"港股技術反彈即引213億北水退出，恒指全日升幅收窄至260點報22226","su":"홍콩 주식의 기술적 반등은 즉시 213억 달러의 남향 펀드의 인출로 이어졌고, 항셍지수의 하루 상승 폭은 260포인트인 22226으로 좁혀졌습니다. 다음날 밤 미국 증시는 V자 반등을 보였습니다. 홍콩 증시는 7연속 하락세를 보이며 22,000선을 돌파했습니다. 전날 14일 RSI 지수는 27까지 하락해 시장이 심각한 과매도(너무 많이 팔려 값이 지나치게 내려간 상태) 상태임을 나타냈다. 항셍지수는 오늘 오전 최대 577포인트 상승하며 강력한 기술적 반등을 촉발했습니다. 그러나 남향 펀드는 상승세(오르는 흐름)를 보이다가 오후에는 압박을 받으며 매도했습니다. 더욱 심화되면서 하루 동안 213억 위안 이상의 순유출이 기록되었는데, 이는 올해 4월 8일 이후 가장 높은 일일 남향 자본 흐름으로 시장의 이익을 끌어내리고 점차 좁아졌습니다. 하루 종일 260포인트(1.2%) 늘어난 22,226건으로 마감했고, 메인보드 거래량은 거의 2,125억 위안에 달했습니다. 항셍중국기업지수는 108포인트(1.5%) 상승한 7,493으로 마감했다. 항셍테크지수는 39포인트(1.2%) 상승한 3417로 마감했다."},{"s":"한은, 금리 3.25%로 인상…내년 1~2차례 더 올릴 듯, ‘이중 긴축’ 우려","so":"중앙일보","tm":"11/26 16:37","c":3,"r":"kr","u":"https://www.joongang.co.kr/article/25482301","p":1795678651,"a":1795678912,"su":"올해 세 차례 금리를 올린 한국은행이 긴축의 출구를 더 멀리 잡았다. 반도체 호황을 등에 업고 내년 경제성장률 전망치를 4.1%로 높이면서, 내년 상반기에만 한두 차례 추가 금리 인상(이자 비율을 올리는 것) 가능성을 열어뒀다. 반도체 호황의 온기가 경제 전반에 퍼지기도 전에 증시 급락과 이자 부담 증가라는 ‘이중 긴축’의 냉기도 밀려오고 있다. 한은 금융통화위원회는 26일 기준금리(중앙은행이 정하는 기본 이자 비율)를 연 3.0%에서 3.25%로 0.25%포인트 올렸다. 지난 7월과 8월에 이어 올해 세 번째 인상이다."},{"s":"[기준금리 3.25%] 반도체 호황 내년 성장률 4.1%…한은 \"성장 한 단계 높일 기회\"","so":"글로벌이코노믹","tm":"11/26 16:30","c":3,"r":"kr","u":"https://www.g-enews.com/article/Finance/2026/11/20261126155929966cd0bfacc1c_1","p":1795678236,"a":1795678915,"su":"한국은행이 글로벌 반도체(전자기기 속에서 계산하고 기억하는 작은 부품) 경기 호조가 적어도 내년 상반기까지 이어질 것으로 전망했다. 반도체 등 정보기술(IT) 제조업이 경제 전체에서 차지하는 비중이 확대되면서 우리 경제의 성장률을 한 단계 끌어올릴 기회가 될 것으로 평가했다. 올해 수출 중심이었던 성장 흐름도 내년에는 반도체 경기"},{"s":"3개의 주요 기관 투자자가 대만 주식을 NT$132.65억 이상 50","p":1795651320,"a":1795651947,"su":"- 1600조원 규모의 3대 메가프로젝트가 발표된 지 150일. 글로벌 AI 패권 전쟁 속에서 기업들은 생존을 건 ‘속도전’으로 화답하고 있다. 비수도권 첨단산업 생태계 조성을 위한 기업들의 발걸음은 그 어느 때보다 절박하다. 그러나 정작 국가가 뒷받침해야 할 기반시설 구축은 42개월씩 걸리는 인허가와 예비타당성 문턱에 가로막혀 있다. 기업은 - 현 기준금리(중앙은행이 정하는 기본 이자 비율) 3.00%⋯추가 인상 단행 시 3.25%로 추가 긴축 뒷받침할 성장 및 물가 전망도 관전포인트 지난달 한 차례 숨고르기(쉬어 가며 잠시 멈춘 모습)에 이어 이달 다시 추가 인상이 이뤄질 것인가."},{"s":"반도체 근로시간 유연화 논의…노동장관 \"연구시간 확보와 노동자 보호 대립 아냐\"","so":"아시아경제","tm":"11/26 09:01","c":4,"r":"kr","u":"https://www.asiae.co.kr/article/2026112609011804168","p":1795651279,"a":1795652703,"su":"김영훈 고용노동부 장관이 반도체(전자기기 속에서 계산하고 기억하는 작은 부품) 연구개발 인력의 근로시간 유연화 논의와 관련해 \"연구개발에 필요한 시간을 ."},{"s":"성수현 아리바이오 공동대표 “코스피 직상장 추진…기업가치 제고”","so":"전자신문","tm":"11/26 08:50","c":3,"r":"kr","u":"https://www.etnews.com/20261126000061","p":1795650626,"a":1795651216,"su":"아리바이오가 경구용 알츠하이머병 치료제 'AR1001'의 글로벌 임상 3상(많은 사람에게 마지막으로 시험하는 단계) 성과를 발판으로 코스피 직상장을 추진한다. 독자적인 신약개발 성과를 글로벌 상업화와 기업공개(주식시장에 처음 들어오는 것)로 연결해 기업가치를 새로운 차원으로 끌어올린다는 전략이다. 성수현 공동대표는 25일 개최한 주주간담회에서 코스피 직상장 계획을 밝혔다. 현재 아리바이오는 비상장사로 한국금융투자협회가 운영하는 장외주식시장 K-OTC에서 거래되고 있다."},{"s":"수출입은행, 두산 AI 반도체 소재 중국 생산거점에 1800억 지원","so":"글로벌이코노믹","tm":"11/26 08:49","c":3,"r":"kr","u":"https://www.g-enews.com/article/Finance/2026/11/202611260831373345bb91c46fcd_1","p":1795650573,"a":1795651219,"su":"한국수출입은행이 ㈜두산 등 국내 인공지능(AI) 소재․부품 분야 기업의 수출, 해외투자 확대를 위한 지원에 나선다.26일 금융권에 따르면 한국수출입은행은 두산의 고성능 동박적층판(CCL) 중국 생산거점 구축을 위해 1800억 원을 지원한다.CCL은 반도체(전자기기 속에서 계산하고 기억하는 작은 부품) 칩이 서로 신호를 주고받도록 미"},{"s":"美, 호남 반도체 클러스터 정조준…관세 최대 25% 검토","so":"한스경제","tm":"11/26 08:47","c":3,"r":"kr","u":"https://www.hansbiz.co.kr/news/articleView.html?idxno=887426","p":1795650450,"a":1795651949,"su":"| 서울=한스경제 고예인 기자 | 미국 도널드 트럼프 행정부가 한국의 반도체(전자기기 속에서 계산하고 기억하는 작은 부품) 산업 육성 정책을 정조준했다. 이재명 정부가 추진 중인 호남 반도체 클러스터 조성 계획을 과잉생산의 근거로 지목한 데 이어 삼성전자와 SK하이닉스의 글로벌 메모리(정보를 기억하는 반도체) 시장 지배력까지 문제 삼았다. 한국산 제품에 대한 합산 관세율을 최대 25%까지 높이는 방안도 검토하면서 국내 반도체 업계의 통상 불확실성이 커지고 있다.25일(현지시간) 미국 무역대표부(USTR)가 공개한 무역법 제301조 조사보고서에 따르면 미국  워싱턴포스트(WP)에 따르면 황 CEO는 그동안 중국에 대한 미국의"},{"s":"[속보] 뉴욕증시 하락 출발...나스닥 3.5% 급락","so":"뉴스핌","tm":"11/25 23:33","c":1,"r":"kr","u":"https://www.newspim.com/news/view/20261125001339","p":1795617180,"a":1795617535,"su":"mj72284@newspim.com [뉴욕=뉴스핌] 김민정 특파원 = 자세한 뉴스는 곧 전해드리겠습니다. [관련키워드] [뉴스핌 베스트 기사] 로봇이 용돈 보내준다고? '핀테크위크 2026' [서울=뉴스핌] 전미옥 기자 =\"손주에게 용돈을 좀 보내주고 싶은데 비밀번호가 생각이 안 나네.\" 할머니의 말에 돌봄로봇 '케비'가 KB국민은행 화상상담을 연결한다. 이후 모니터에 등장한 은행 직원은 비밀번호 변경 절차를 안내하고 본인 확인을 거쳐 손주에게 용돈 10만원을 송금했다."},{"s":"임금 1.9억 체불하고 24년간 미국 도피…반도체 업체 대표 구속","so":"중앙일보","tm":"11/25 22:48","c":3,"r":"kr","u":"https://www.joongang.co.kr/article/25481968","p":1795614531,"a":1795615346,"su":"직원 임금 1억9000여만원을 체불하고 미국으로 도피했다가 24년 만에 국내에 입국한 반도체(전자기기 속에서 계산하고 기억하는 작은 부품) 설비업체 대표가 구속됐다. 고용노동부 경기지방고용노동청은 근로기준법 위반 등 혐의로 반도체 설비업체 대표 A씨를 구속했다고 25일 밝혔다. A씨는 2001년 경기 화성시에서 반도체 설비업체를 운영하면서 직원 18명의 임금 및 퇴직금 1억9000여만원을 지급하지 않은 혐의를 받는다. 2001년 당시 최저임금이 시간당 1865원이었던 점을 감안하면 작지 않은 규모다."},{"s":"증선위, 미공개중요정보 이용 코스닥 상장사 임직원 등 중수청 통보","so":"글로벌이코노믹","tm":"11/25 19:03","c":3,"r":"kr","u":"https://www.g-enews.com/article/Finance/2026/11/202611251902041746056c162803_1","p":1795601003,"a":1795602226,"su":"금융위원회 산하 증권선물위원회는 25일 21차 정례회의를 열고, 미공개중요정보를 이용해 부당이득을 챙긴 코스닥(한국 중소·기술 회사들이 모인 주식시장) 상장(주식시장에 처음 들어오는 것)사 임직원 등을 자본시장법 위반 혐의로 중대범죄수사청(중수청)에 통보했다고 밝혔다.코스닥 상장사 A사 임직원 3명은 직무상 알게 된 최대주주의 주식양수도계약 관련 미공개중요"},{"s":"'黃랠리' 하루천하…코스피 시총 257조 증발 [코스피 4700 붕괴]","so":"파이낸셜뉴스","tm":"11/25 18:24","c":4,"r":"kr","u":"https://www.fnnews.com/news/202611251824384069","p":1795598680,"a":1795599305,"su":"젠슨 황 엔비디아 최고경영자(CEO(회사의 가장 높은 책임자)) 복귀 효과가 하루 만에 사라지면서 아시아 증시가 일제히 급락했다. 다만 대만과 일본이 반등 전 수준을 지킨 것과 달리 코스피(한국 큰 회사들 주가를 합쳐 만든 점수)는 하루 만에 6% 넘게 추락하며 전날 급등분을 모두 반납했다."},{"s":"김정관 산업장관 \"주 52시간 연구개발 특례 내일부터라도‥반도체부터 적용해야\"","so":"MBC 뉴스","tm":"11/25 17:37","c":4,"r":"kr","u":"https://imnews.imbc.com/news/2026/econo/article/6868527_36932.html","p":1795595821,"a":1795596383,"su":"김정관 산업통상부 장관이 중국과의 기술 경쟁에서 살아남기 위해 연구개발, R&D 인력에 대한 주 52시간제 특례 도입이 시급하다고 강조했습니 다시 업그레이드 되었으며, 미국 주식선정이 새롭게 출시되었습니다.","so":"經濟日報","tm":"11/27 19:18","c":4,"r":"tw","u":"https://money.udn.com/money/story/5607/9906339?from=udnamp-referralnews_ch1001artbottom","p":1795774728,"a":1795780820,"t":"凱基證券「隨身 e 策略」APP 再升級 美股選股全新上線","su":"글로벌 기술 혁신과 AI의 물결이 계속해서 미국 주식에 대한 투자를 늘리면서 점점 더 많은 대만 투자자들이 해외 시장으로 관심을 돌리고 있습니다. 그러나 수천 개의 미국 주식 목표와 방대한 시장 정보 앞에서 어떻게 빠르게 추세를 파악하고 잠재적 주식을 선별하는가가 투자 의사 결정의 핵심이 되었습니다. KGI증권은 디지털 투자 서비스를 지속적으로 심화하고 있으며, 투자자들이 미국 주식 투자 기회를 보다 효율적으로 파악할 수 있도록 시장 상황, 인기 순위, 업계 동향 및 전문가 리서치 의견을 통합한 '휴대용 e-Strategy' 앱에 새로운 '미국 주식 선택' 기능 출시를 발표했습니다."},{"s":"월스트리트는 변동성이 큰 주에 타격을 입은 AI 주식이 상승함에 따라 상승 마감했습니다.","so":"Reuters","tm":"11/27 16:34","c":4,"r":"us","u":"https://www.reuters.com/business/wall-st-futures-surge-investors-return-holiday-2026-11-27/","p":1795764840,"a":1795819450,"t":"Wall Street ends higher as battered AI stocks gain in volatile week"},{"s":"S&P500 Equal Weight Index(EUR (^SPXEWCEP) 계절 수익률 차트","so":"Yahoo Finance Australia","tm":"11/28 00:29","c":3,"r":"us","u":"https://au.finance.yahoo.com/quote/%5ESPXEWCEP/seasonality/","p":1795793356,"a":1795823799,"t":"S&P 500 Equal Weight Index (EUR (^SPXEWCEP) Seasonal returns chart"},{"s":"트럼프는 젠슨 황을 구출해 AI에 대한 신뢰를 구할 수 있을까? 유권자들이 비용을 지불하지 않아 월스트리트의 우려는 아직 해결되지 않은 상태로 남아 있습니다 | 글로벌 금융 | 글로벌","so":"UDN","tm":"11/28 12:41","c":2,"r":"tw","u":"https://udn.com/news/story/6811/9907385","p":1795837290,"a":1795838583,"t":"川普救回黃仁勳救得了AI信心？選民不買單華爾街疑慮未解| 全球財經| 全球","su":"트럼프는 AI가 미국 경제를 견인할 것이라고 장담하고 젠슨 황에게 엔비디아 복귀를 촉구하고 있지만 유권자와 투자자를 설득하기는 여전히 어렵다. 월스트리트저널은 사람들이 자신의 일자리가 대체되는 것에 대해 걱정하고 있으며 의회의 양당이 국가 안보 문제와 정치 및 비즈니스 거래에 대한 조사를 준비하고 있다고 지적했습니다. 블룸버그는 정부 개입이 한때 주식시장을 부양했지만 AI에 대한 막대한 투자가 상환될 수 있을지에 대한 시장의 의구심은 여전히 해소되지 않고 있다고 지적했다."},{"s":"AI 우려 일시 중지, 반도체주 반등, 미국 증시는 고용에 직면할 것, 젠슨 황의 증언 및 다음 주 수익 테스트","so":"經濟日報","tm":"11/28 11:09","c":2,"r":"tw","u":"https://money.udn.com/money/story/123398/9907166","p":1795831778,"a":1795838581,"t":"AI 疑慮暫歇 晶片股強彈 美股下周迎就業、黃仁勳作證與財報考驗","su":"금요일 반도체(전자기기 속에서 계산 하락 직후 평균 이상의 수익률을 보이는 경우가 많습니다."},{"s":"골드만삭스는 미국 주식 위험이 제거되지 않았다고 경고합니다! AI 혼잡 거래가 진정되고 신용 위험이 시장 전망을 결정한 후 시장의 \"취약한 균형\"","so":"鉅亨網","tm":"11/28 16:10","c":1,"r":"tw","u":"https://news.cnyes.com/news/id/6674377","p":1795849807,"a":1795853230,"t":"高盛示警美股風險未除！AI擁擠交易退潮後市場「脆弱平衡」、信貸風險決定後市走向","su":"미국 주식 AI 투자가 펀드에서 크게 철수했고 S&P500(미국 큰 회사 500곳의 주가를 합쳐 만든 점수)은 한때 10.7% 하락했습니다. 그러나 증시 반등 이후에도 신용압력은 동시에 완화되지 않았다. 골드만삭스는 S&P500 비중의 7대 기술주가 32~36%, AI 관련주가 45~50% 정도를 차지한다고 밝혔다. 시장 집중도와 개별 주식 차별화가 사상 최고치를 기록했다. 초대형 클라우드 서비스 제공업체의 CDS 스프레드가 사상 최대폭으로 마감되고, 헤지펀드(큰손들 돈을 모아 굴리는 투자 회사) AI 순노출이 21%로 떨어지며 신용 리스크가 시장 전망의 초점이 됐다."},{"s":"중국 아줌마들과 월스트리트가 13년째 싸우고 있다. 누가 이겼나요?","so":"21财经","tm":"11/28 15:20","c":1,"r":"cn","u":"https://www.21jingji.com/article/20261128/herald/cd19bc4aca77362bb2625aab855050f8.html","p":1795846800,"a":1795853225,"t":"中国大妈和华尔街对决 13 年，到底谁赢了？","su":"작성자 | 금각금융(Golden Horn Finance) 올해 국제 금값(금 1온스의 가격)은 40% 가까이 폭락했고, 중국 국내 금값도 그램당 1,256위안에서 약 780위안으로 떨어졌다. 그러나 베이징 차이바이의 금괴 카운터는 여전히 사려고 서두르는 중국인 아줌마들로 붐볐다. 한 번에 85만 위안을 쓴 사람도 있다. 어제 800위안을 바닥으로 매수했다가 오늘 760위안까지 떨어진 후 포지션을 늘리러 온 삼촌들도 있었다. 결국 오르면 누나들에게 자랑할 수 있지만, 내리면 상자 밑바닥에 놓일 수 있고, 최악의 경우 아내를 찾는 것은 손자에게 맡겨지게 된다. 사실 그들은 13년 전에도 똑같은 일을 했습니다. 2013년에 나는 금괴를 그램당 290위안으로 샀다. 원금을 간신히 돌려받는데 6년이 걸렸습니다. 이후 원래 금액은 10만 위안에서 43만 위안 이상으로 늘어났다. 올해는 10개월 만에 27만 위안으로 다시 줄었다."},{"s":"미국 블랙프라이데이 온라인 쇼핑은 덥고, 매장은 춥고, 가격 인상으로 할인은 어렵다, 사고 싶다가 필요할 때만 구매한다 | 미국 증시 동향 | 국제","so":"經濟日報","tm":"11/28 13:51","c":1,"r":"tw","u":"https://money.udn.com/money/story/123398/9907502?from=edn_world_index","p":1795841466,"a":1795853232,"t":"美國黑五網購熱 門市冷 折扣難敵漲價 從想買變成需要才買 | 美股動態 | 國際","su":"미국에서는 블랙프라이데이를 맞아 온라인 쇼핑은 뜨거웠지만 매장 매출(물건을 판 돈 전체)은 차갑다. 식품과 휘발유 가격의 상승은 가계 예산을 압박하고 있습니다. 소비자들은 선물(미래 값을 미리 정해 사고파는 거래)을 주는 목록을 줄이고 대신 더 저렴한 제품을 구매하고 있으며, 소매업체는 할인을 제공하더라도 구매자에게 좋은 인상을 주지 못할 수 있습니다."},{"s":"연준은 S&P500 투자자들에게 우려스러운 신호를 보낸다.","so":"Yahoo Finance","tm":"11/28 11:37","c":1,"r":"us","u":"https://finance.yahoo.com/markets/stocks/articles/federal-sends-trou an’t Rescue the Stock Market. Here’s What Can."},{"s":"시장에서는 연준이 다음 달 금리를 최소 1/4% 인상할 것으로 예상하면서 달러 환율이 상승했습니다.","so":"TVB","tm":"11/28 08:32","c":1,"r":"hk","u":"https://news.tvb.com/sc/1208880-%E7%BE%8E%E5%85%83%E5%8C%AF%E5%83%B9%E4%B8%8A%E5%8D%87%E5%B8%82%E5%A0%B4%E6%96%99%E7%BE%8E%E8%81%AF%E5%84%B2%E4%B8%8B%E6%9C%88%E6%9C%80%E5%B0%91%E5%8A%A0%E6%81%AF%E5%9B%9B%E5%88%86%E4%B9%8B%E4%B8%80%E5%8E%98","p":1795822320,"a":1795823817,"t":"美元匯價上升 市場料美聯儲下月最少加息四分之一厘","su":"달러 환율은 오르며 이달 23일 이후 최고치를 기록했다. 주요 6개 통화 대비 미국 달러 가치를 반영하는 달러지수는 0.3% 오른 104.035를 기록했다. 일주일 내내 증가율은 0.2%였다. 시장에서는 미국 연방준비제도(연준(미국의 중앙은행))가 다음 달 금리(돈을 빌릴 때 내는 이자 비율)를 최소 1/4% 인상할 것으로 예상하고 있으며, 이는 미국 달러가 22개월 만에 최고치에 가까운 지속적인 안정세를 유지하는 것을 뒷받침합니다."},{"s":"美증시 에너지업종 올들어 37% 상승…AI에 가려진 주도주","so":"연합뉴스","tm":"11/28 08:20","c":1,"r":"kr","u":"https://www.yna.co.kr/amp/view/AKR20261128018000009","p":1795821608,"a":1795838575,"su":"(서울=연합뉴스) 정주호 기자 = 미국 증시에서 인공지능(AI) 관련 기술주가 투자자들의 관심을 독차지하는 사이 에너지와 필수소비재, 헬스케어(건강·의료 관련 산업) ..."},{"s":"[마켓엑세스] 시장지수 아래에 숨어있는 미국 증시의 새로운 기회","so":"이데일리","tm":"11/28 08:00","c":1,"r":"kr","u":"https://www.edaily.co.kr/News/Read?newsId=01420246645650312&mediaCodeNo=257","p":1795820404,"a":1795823797,"su":"올해 미국 주식시장은 강세(오르는 힘이 센 것)를 이어가며, 스탠더드앤드푸어스(S&P)500지수는 2분기(4~6월)에만 15.2% 상승했다. 그 중심에는 인공지능(AI) 투자 사이클을 이끄는 소수의 대형 기술주가 있었다. 최근 시장 흐름에만 주목하면 AI 주도주(시장 상승을 앞에서 이끄는 주식)에 투자하는 것이 가장 합리..."},{"s":"iQIYI, 미국 주식 보호 전쟁 시작","so":"21财经","tm":"11/28 08:00","c":1,"r":"cn","u":"https://www.21jingji.com/article/20261128/e0703066e53de24a865de1e489b43fa6.html","p":1795820400,"a":1795823802,"t":"爱奇艺，打响美股保壳战","su":"아이치이(iQiyi)가 미국 증시를 지키기 위한 전쟁을 시작하고 있다. 11월 25일, iQiyi는 회사가 11월 25일 나스닥(미국 기술 회사들이 많이 모인 주식시장) 상장(주식시장에 처음 들어오는 것) 자격 부서로부터 나스닥 상장 규칙에 규정된 최소 구매 가격 요구 사항인 1.00달러를 더 이상 충족하지 못한다는 서면 통지를 받았다고 발표했습니다. 공지에 따르면 2026년 10월 14일부터 11월 24일까지 회사 ADS(American Depositary Shares)의 최종 구매 가격이 계속 1달러 미만으로 유지되었습니다. 상장 규정에 따라 iQiyi는 180일(즉, 2027년 5월 24일까지)의 정정 기간을 부여받았습니다. 이 기간 동안 ADS의 최종 구매 가격은 규정을 준수하기 전에 최소 10일 연속 거래일 동안 주당 US$1.00 이상이어야 합니다."},{"s":"미국 주식 AI 투자가 상승했고 나스닥은 2% 이상 상승했으며 샌디스크는 16% 상승했습니다. 중앙은행이 큰 발표를 했어요! 고액예금증서, 예금 및 대출이자율에 관한 사항 중요한 A주 지수 조정; 에버그란데 자동차 상장 취소 현황 | 매일 아침","so":"每日经济新闻","tm":"11/28 08:00","c":1,"r":"cn","u":"https://www.nbd.com.cn/articles/2026-11-27/4661727.html","p":1795820400,"a":1795823805,"t":"美股AI交易回暖，纳指涨超2%，闪迪大涨16%；央行重磅发布！事关大额存单、存贷款利率；A股重要指数调整；恒大汽车被取消上市地位丨每经早参","su":"1 야간 시장의 AI 투자가 상승했고, 미국 3대 주가지수가 종합적으로 상승세로 마감했습니다. 다우지수는 1.18% 상승해 이번 주 누적 상승폭이 5.5%에 이르렀습니다. S&P500(미국 큰 회사 500곳의 주가를 합쳐 만든 점수) 지수는 1.60% 상승해 이번 주 누적 상승폭이 5.6%에 이르렀습니다. 나스닥 종합지수는 2.31% 상승해 이번 주 누적 상승폭이 6.7%에 달했다. 필라델피아 반도체(전자기기 속에서 계산하고 기억하는 작은 부품) 지수는 거의 5% 상승했습니다."},{"s":"미국 증시는 연휴 이후 거래를 재개했으며, 세 가지 주요 지수가 모두 반나절 거래에서 상승했습니다.","so":"TVB","tm":"11/28 07:31","c":1,"r":"hk","u":"https://news.tvb.com/en/1208878-%E7%BE%8E%E8%82%A1%E5%81%87%E6%9C%9F%E5%BE%8C%E5%BE%A9%E5%B8%82%E4%B8%89%E9%A0%85%E4%B8%BB%E8%A6%81%E6%8C%87%E6%95%B8%E5%8D%8A%E6%97%A5%E5%B8%82%E5%85%A8%E7%B7%9A%E4%B8%8A%E5%8D%87","p":1795818660,"a":1795823820,"t":"美股假期後復市 三項主要指數半日市全線上升","su":"미국 증시는 연휴 이후 거래를 재개했고, 반나절 동안 3대 주요 지수가 전반적으로 상승했습니다. 미국 증시는 추수감사절 다음날인 이른바 '블랙 프라이데이'에도 연휴 전 반등(내렸다가 다시 오르는 것)세를 이어가며 3개 주요 지수가 모두 상승세(오르는 흐름)로 출발하고 상승 마감했다. 다우지수는 275포인트 상승한 뒤 상승폭을 소폭 줄인 후 상승폭을 확대해 최대 600포인트를 넘었습니다. 1% 상승한 591포인트를 기록했습니다. 일주일 내내 2,627포인트 상승해 2022년 10월 이후 단일 주 최대 상승폭을 기록했습니다."},{"s":"미국 증시, 추수감사절 연휴, 블랙프라이데이 마감: S&P500, 나스닥, 다우존스 상승에 도움이 되는 월스트리트 주식","so":"The Economic Times","tm":"11/28 07:27","c":1,"r":"us","u":"https://economictimes.indiatimes.com/world/business/us-stock-market-closes-thanksgiving-holiday-black-friday-in-style-wall-street-stocks-that-help-sp-500-nasdaq-dow-jones-fly/articleshow/136235330.cms","p":1795818442,"a":1795853218,"t":"US Stock Market closes Thanksgiving holiday, Black Friday in style: Wall Street stocks that help S&P 500, Nasdaq, Dow Jones fly","su":"미국 증시 투자자들은 벤치마크 지수인 S&P500(미국 큰 회사 500곳의 주가를 합쳐 만든 점수), 나스닥의 변동성(값이 크게 출렁이는 정도)이 심한 이후 추수감사절 연휴 구제가 많이 요구되는 것을 목격했습니다."},{"s" 0958,"a":1795853221,"t":"Stock Futures Rip on Thanksgiving Night as S&P 500 Futures Top 7,300","su":"월스트리트가 추수감사절을 쉬고 있는 동안 선물(미래 값을 미리 정해 사고파는 거래)은 현물 시장에서는 볼 수 없었던 급등을 보였습니다. 적은 거래량(하루 동안 사고판 주식 수), 수수께끼의 촉매제, 완고한 지수 격차로 인해 금요일 여부에 대한 의문이 제기됩니다."},{"s":"반등은 미국 기술 부문에 불고 있다. 브라질 ETF 개장 전 14% 이상 상승 | 오늘 밤 무엇을 볼까","so":"财联社","tm":"11/27 21:01","c":1,"r":"cn","u":"https://www.cls.cn/detail/2547015","p":1795780860,"a":1795823807,"t":"反弹的风吹到美股科技板块 巴西ETF盘前涨超14% | 今夜看点","su":"① 미국 기술 부문은 시장 개장 전에 상승했으며, 마이크론, AMD, 샌디스크 및 루멘텀은 시장 개장 전에 최소 5% 이상 상승했습니다. ② 금, 은, 구리는 함께 반등했고, London Copper는 6주 연속 하락세를 마감할 것으로 예상되었습니다. ③ 머스크는 매년 모든 미국 인형에게 스페이스X 주식을 1주씩 나누어 주었습니다. ④ 브라질 ETF는 시장이 열리기 전에 14% 이상 상승했고, 고위 은행원이 재무장관으로 임명되었습니다. 차이롄서, 11월 27일(편집자 Shi Zhengcheng) 베이징 시간 금요일 저녁, CSI 반도체(전자기기 속에서 계산하고 기억하는 작은 부품) 지수가 아시아 세션 중 역사상 최대 일일 상승률을 기록하면서 오늘 밤 미국 증시는 반등하며 격동의 한 주를 마무리할 것으로 예상됩니다. 보도 시간 현재 나스닥 100 지수 선물(2,612계약)은 2.28% 상승했고, S&P500(미국 큰 회사 500곳의 주가를 합쳐 만든 점수) 지수 선물은 1.63%, 다우 선물은 1.39% 상승했습니다. 수요일 나스닥100 지수는 10월 고점 대비 20% 이상 하락한 뒤 급격한 반등세를 보였다."},{"s":"미국 증시 개장 전/나스닥 100 선물은 거의 3% 상승했으며 엔비디아와 AMD가 AI 주식 반등을 주도했습니다.","so":"鉅亨網","tm":"11/27 21:00","c":1,"r":"tw","u":"https://news.cnyes.com/news/id/6674065","p":1795780853,"a":1795785165,"t":"美股盤前／那斯達克100期貨漲近3%輝達、超微領軍AI股反彈","su":"유애널라이즈 2026년 11월 27일 (유애널라이즈/산업데이터센터(컴퓨터 수만 대를 모아 둔 건물) 리포트) ⸺ 미국 증시는 추수감사절로 인해 26일 휴장했고, 27일 거래가 재개됐다. 이전에 급락했던 AI주에 장전 매수세가 다시 돌아왔습니다. 나스닥 100 선물은 2.87%, S&P500(미국 큰 회사 500곳의 주가를 합쳐 만든 점수) 선물은 1.98%, 다우존스 선물은 1.33% 상승했습니다. 뉴욕증권거래소와 나스닥은 이날 조기 마감된다. 시장 개장 전 NVDA(엔비디아)가 4.7% 상승하고, AMD(AMD-US)가 7% 상승하고, 브로드컴(AVGO-US)이 4.7% 상승하는 등 반도체주가 상승세를 주도했습니다. 코어위브(CRWV-US)가 7.9%, 네비우스(NBIS-US)가 9.5% 상승하는 등 컴퓨팅 파워 임대 회사에도 매수가 확대되었습니다. 그러나 최근 거래일 종가를 기준으로 보면 엔비디아의 가격은 10월 최고치보다 여전히 37% 이상 낮다."},{"s":"<제1금융이론> 중앙은행은 연말에 금리를 인상할 것인가? 중국 은행은 대만이 금리를 계속 유지할 것으로 예상하지만 연준은 내년 1분기 이전에 금리를 두 번 인상할 것으로 예상됩니다.","so":"鉅亨網","tm":"11/27 20:44","c":1,"r":"tw","u":"https://news.cnyes.com/news/id/6674022","p":1795779893,"a":1795780821,"t ters.com/markets/europe/china-stocks-shoot-up-after-beijing-vows-support-2026-11-27/","p":1795760640,"a":1795785168,"t":"China stocks surge most in two years as Beijing vows stronger market support"},{"s":"[모닝포스트] 미국 반도체, 스토리지, 반도체주가 전반적으로 급락했다. 브렌트유는 4% 급등했고, 국제 금과 은은 큰 손실을 입었습니다. 5개 펀드가 자체 액티브 ETF를 구매했습니다.","so":"财联社","tm":"11/27 14:23","c":1,"r":"cn","u":"https://www.cls.cn/detail/2512907","p":1795757006,"a":1795780813,"t":"【早报】美股半导体、存储、芯片股，全线跳水；布油飙升4%、国际金银遭重挫；5家基金自购旗下主动ETF","su":"① E Fund, China Asset Management, Wells Fargo 및 Universal Fund는 각각 2억 위안을 사용하여 활성 ETF를 구입했습니다. ② 딥시크은 이번 자금 조달(사업에 쓸 돈을 모으는 것)에서 약 1,000억 위안을 조달할 계획입니다. ③ 미국 주식의 추세가 엇갈리고 있으며, 나스닥은 2% 이상 하락했습니다. ④ CATL은 어제 약 5억 위안을 자사주 매입(회사가 자기 주식을 다시 사는 것)에 지출했습니다. 전년 대비 3045%. 매크로 뉴스 1. 국가발전개혁위원회는 해외투자의 발전과 안전을 제도적으로 더욱 강화하기 위해 10월 22일 새로운 버전의 \"외국투자 관리조치\"를 발표했다. 총 76개의 관리조치가 있으며, 일반원칙, 외국인투자 지도 및 서비스, 외국인투자 감독, 외국인투자 보호, 법적책임, 보충규정 등 6개 장으로 구성되어 있습니다. 2. 국무원 신문판공실이 주최한 '15차 5개년 계획 시작' 주제의 기자회견에서 중국의 14차 5개년 계획 기간 동안 중국의 양방향 투자가 여전히 세계 선두에 머물렀으며 5년 동안 총 7,500억 달러 이상의 해외 직접 투자를 기록했다는 사실을 알게 되었습니다."},{"s":"소시오넥스는 속급신, 미 나스닥 선물 대폭고로 반도체 관련 주에의 선호 자세 강해진다","so":"株探","tm":"11/27 14:11","c":1,"r":"jp","u":"https://s.kabutan.jp/news/n202611270721/","p":1795756260,"a":1795780841,"t":"ソシオネクスは続急伸、米ナスダック先物大幅高で半導体関連株への選好姿勢強まる","su":"【당 사이트에서 제공하는 정보에 대해】 당 사이트 「주탐(카부탄)」에서 제공하는 정보는 투자 권유 또는 투자에 관한 조언을 하는 것을 목적으로 하고 있지 않습니다. 투자 결정은 자신의 판단으로 이루어지도록 부탁드립니다. 당 사이트에 있어서의 데이터는, 도쿄 증권 거래소, 오사카 거래소, 나고야 증권 거래소, JPX 총연, 재팬 넥스트 증권, 도지마 거래소, China Investment Information Services, CME Group Inc. 등으로부터의 정보의 제공을 받고 있습니다. 닛케이 평균 주가의 저작권은 일본 경제 신문사에 귀속됩니다."},{"s":"미국 주식 전망 : 성장 고민이나 계약 정책에 기대","so":"株探","tm":"11/27 13:33","c":1,"r":"jp","u":"https://s.kabutan.jp/news/n202611270638/","p":1795754035,"a":1795780843,"t":"米国株見通し：伸び悩みか、引き締め政策に思惑","su":"미국 주식 전망 : 성장 고민이나 긴축 정책에 의지 미국 주식 선물 시장에서 S&P500(미국 큰 회사 500곳의 주가를 합쳐 만든 점수) 선물, 나스닥(미국 기술 회사들이 많이 모인 주식시장) 100 선물은 강 포함, 뉴욕 다우 선물은 517달러 높다. 장기 금리는 떨어지고 오늘날 미국 증시는 구매 선행이 될 것 같다. 전 영  회사들이 많이 모인 주식시장) 선물은 0.76%, 다우 선물은 0.58% 상승했습니다. CCTV 뉴스에 따르면, 아라그치 이란 외무장관은 11월 26일 카타르와 파키스탄이 여전히 이란과 미국 간 메시지를 중재하고 전달하고 있으며 관련 통신 채널이 중단되지 않았다고 밝혔습니다. Araghchi는 모든 당사자가 해결책을 찾을 수 있으며 일부 계획은 현재 연구 중이라고 지적했습니다. 그러나 그는 또한 이란의 주요 관심사는 변하지 않았다고 강조했습니다. 이란은 호르무즈 해협을 열고 합의에 도달하기 전에 반드시 충족되어야 할 일련의 요구를 제시했습니다."},{"s":"\"美 증시, 30% 이상 하락 위험 있는 약세장 진입 중\"","so":"연합인포맥스","tm":"11/27 11:24","c":1,"r":"kr","u":"https://news.einfomax.co.kr/news/articleView.html?idxno=4446951","p":1795746240,"a":1795819450,"su":"미국 증시가 30% 이상의 하락 위험이 있는 심각한 약세장(주가가 오랫동안 내리는 시기)으로 진입하고 있다는 비관론이 등장했다.27일 포춘에 따르면 영국의 투자은행인 팬뮤어 리버럼의 요아힘 클레멘트 애널리스트는 개인 포트폴리오에 있는 주식을 전량 매도했다며 이유는 S&P 500지수의 최근 급락세 때문이라고 설명했다.클레멘트는 \"우리는 30% 이상의 고점(가장 높았던 값) 대비 낙폭 위험이 있는 심각한 약세장으로 가고 있다\"며 \"2027년에 S&P 500지수는 5천선까지 떨어질 것\"이라고 내다봤다.클레멘트의 우려는 이 지수가 현재 200일 이동평균선 아래서 거래되고 있으며 \"폴"},{"s":"[모닝포스트] 10월 연준이 금리를 인상할 확률이 급격히 떨어졌다. 원유와 금 모두 상승했습니다. 마이크론 테크놀로지(마이크론)의 4분기 매출과 이익이 기대치를 초과했습니다.","so":"财联社","tm":"11/27 10:57","c":1,"r":"cn","u":"https://www.cls.cn/detail/2496760","p":1795744645,"a":1795785161,"t":"【早报】美联储10月加息概率，大幅回落；原油、黄金双双上涨；美光科技，Q4营收利润双超预期","su":"① 시진핑: 포용적·기초적·기본적 민생 건설 강화 ② 중앙은행(나라의 돈과 이자를 관리하는 은행): 10월 8일 3개월간 1조2000억 위안 규모의 매입 역환매 작업을 실시할 예정이다. ③ 미국 최대 기술주가 3% 이상 상승했고, 인텔은 3% 이상 상승했다. ④ 애플이 스마트 홈 시장에 진출할 계획이다. ⑤ 하이얼 스마트홈과 몽타주 테크놀로지가 환매 진행을 발표했다. 매크로 뉴스 1. 10월 1일 발행되는 '치시' 잡지 19호에는 시진핑 중공중앙 총서기, 국가주석, 중앙군사위원회 위원장이 쓴 '보편적, 기본적, 기본적 민생 건설 강화'라는 중요한 글이 게재될 예정입니다. 2012년 11월부터 2026년 1월까지 시진핑 총서기가 한 중요한 발언에서 발췌한 내용이다. 기사에서는 중국식 현대화는 민생을 최우선으로 생각한다는 점을 강조하고 있다. 더 나은 삶을 향한 국민의 열망이 우리의 목표입니다. 우리의 목표는 야심적이고 단순합니다. 결국 사람들이 더 나은 삶을 살 수 있도록 돕는 것입니다. 우리는 발전 과정에서 인민의 생활을 보장하고 개선하는 것을 견지해야 하며 더 나은 삶을 창조하기 위한 공동 노력을 장려하고 더 나은 삶에 대한 인민의 열망을 끊임없이 실현해야 합니다."},{"s":"\"3주간 9% 오른 S&P500랠리 지속 힘들다\"…'조정 경고음' 고조","so":"매일경제 마켓","tm":"11/27 10:43","c":1,"r":"kr","u":"https://stock.mk.co.kr/news/view/288374","p":1795743838,"a":1795780802,"su":"\"3주간 9% 오른 S&P500(미국 큰 회사 500곳의 주가를 합쳐 만든 점수)랠리 지속 힘들다\"…'조정 경고음' 고조 블룸버그 \"지표 약세…美 대형·중소형주(몸집이 작거나 중간인 회사의 주식) 상승세 이어가기 어렵다\"\"대형주는 경기둔화가, 중소형주는 부채 부담이 발목 잡을 것\" 주종국 입력 : 2023.11.20 09:54:06 (서울=연합뉴스) 주종국 기자 = 3주 만에 9% 넘게 상승한 미국 스탠더드 앤드 푸어스(S&P) 500지수가 앞으로도 상승세를 이어가기는 힘들 것이라는 전망이 나왔다."},{"s":"Japan Tobacco, 임페리얼 지분 인수 논의로 주가 급등","so":"Reuters","tm":"11/27 09:40","c":1,"r":"world","u":"https://www.reuters.com/markets/europe/japan-tobacco-up-2-imperial-brands-takeover-talk-2026-11-27/","p":1795740000,"a":1795780844,"t":"Japan Tobacco shares surge on talk it may acquire part of Imperial"},{"s":"미국 증시 마감, 유럽 주식 상승, 터키 중앙은행은 외환 보유고 부족 발표 | 인스턴트 뉴스 - 뉴스","so":"etnet 經濟通","tm":"11/27 08:55","c":1,"r":"hk","u":"https://www.etnet.com.hk/www/tc/news/news-article.php?section=categorized&category=daily&newsid=2026112700","p":1795737300,"a":1795780840,"t":"美股休市歐股上揚，土耳其央行宣布外匯儲備不足 | 即時新聞 - 新聞","su":"\"외부 초점\" 주요 유럽 및 미국 증시 지수 마감: (포인트) (포인트) (%) 다우 존스 산업 평균 50182.95---표준..."},{"s":"유럽 증시는 전반적으로 상승세로 마감했고, 미국 증시 선물도 상승했습니다. 머스크는 매년 아이들에게 또 다른 스페이스X 지분을 주겠다고 말했습니다 | 글로벌 시장","so":"财联社","tm":"11/27 07:56","c":1,"r":"cn","u":"https://www.cls.cn/detail/2545971","p":1795733762,"a":1795780814,"t":"欧股全线收涨美股期货走高 马斯克称每年向儿童再赠一份SpaceX股 | 环球市场","su":"① 유럽의 주요 주가지수는 전반적으로 상승세로 마감했습니다. ② 트럼프는 정부가 의도적으로 GDP 성장을 과소보고했다고 비난했다. ③ SAP는 \"AI 우선\" 전략을 내걸고 최소 10,000명의 인력을 감축할 계획인 것으로 밝혀졌습니다. ④ Decos는 Lagarde로부터 유럽중앙은행(나라의 돈과 이자를 관리하는 은행)의 새로운 총재를 맡았습니다. 파이낸셜 뉴스, 11월 27일(리잉 편집장) 밤새 미국 증시가 추수감사절 연휴로 휴장했고, 유럽 주식시장이 전 세계의 이목을 집중시켰다. 기술주와 은행주 반등에 힘입어 유럽 주요 주가지수는 전반적으로 상승 마감하며 전날 하락세를 만회했습니다. 전 거래일 하락세를 주도했던 은행과 기술 업종이 반등의 주역이 됐다. 도이체방크는 2.56% 상승했고, 스탠다드 차타드 그룹은 1.32% 상승했습니다. 반도체(전자기기 속에서 계산하고 기억하는 작은 부품) 소재업체 소이텍은 6.94%, 독일 반도체 대기업 인피니언은 3.57% 상승했다."},{"s":"월스트리트 레버리지 ETF에는 새로운 트릭이 있습니다. 레버리지 재설정 주기는 몇 시간 단위로만 측정됩니다.","so":"财联社","tm":"11/27 06:55","c":1,"r":"cn","u":"https://www.cls.cn/detail/2478652","p":1795730153,"a":1795780816,"t":"华尔街杠杆ETF又有新花样：杠杆重置周期仅以小时计","su":"① 디파이언스 ETF(여러 주식을 묶어 파는 상품)는 16개의 \"시간별 재설정\" 2x 레버리지 ETF(지수 움직임의 2~3배로 움직이는 ETF) 출시에 적용됩니다. 이 ETF는 스왑, 옵션 및 기타 도구를 통해 매일 거래일에 6회 레버리지를 재설정합니다. ② 잦은 재설정으로 인해 제품 반품이 일중 경로에 크게 의존하게 되고 변동적인 시장 상황으로 인해 심각한 마모가 발생할 수 있습니다. 동시에 미국 SEC는 레버리지 ETF에 대한 규제 검토를 강화하고 있습니다. 차이롄서, 9월 9일(Shi Zhengcheng 편집자) 미국 규제 당국이 레버리지 ETF를 검토하고 있는 것처럼 월스트리트도 다시 한번 금융 상품에 참여할 수 있는 능력을 보여주었습니다. 보도에 따르면 미국 ETF 발행사인 Defiance ETFs는 최근 미국 SEC에 등록 서류를 제출하고 \"시간별 재설정\" 2배 레버리지 ETF 출시를 신청했습니다."},{"s":"월스트리트 베테랑은 AI 건설의 둔화는 실제로 좋은 것이며 전반적인 발전은 정치에 영향을 받지 않을 것이라고 강조합니다.","so":"财联社","tm":"11/27 06:10","c":1,"r":"cn","u":"https://www.cls.cn/detail/2526960","p":1795727404,"a":1795780818,"t":"华尔街老兵强调AI建设放缓实际上是利好 整体发展不会受政治影响","su":"① 목요일 미국 기술주는 민주당이 인공지능 구축을 제한할 것이라는 우려로 인해 급격한 매도세(팔려는 힘)를 보였습니다. ② Yardeni Research의 Ed Yardeni 사장은 인공 지능 구축의 둔화는 실제로 좋은 소식이라고 지적했습니다. 왜냐하면 데이터 센터 운영자가 확장을 늦추면 잉여 현금 흐름이 긍정적으로 바뀔 수 있기 때문입니다. 차이롄서, 11월 6일 (마란 편집자) 목요일, 민주당이 인공지능(AI) 구축을 제한할 것이라는 우려로 인해 미국 기술주들이 전체 시장의 신뢰를 흔들 정도로 급격한 매도세를 보였습니다. 그러나 Yardeni Research의 Ed Yardeni 사장은 인공 지능 구축의 둔화는 실제로 좋은 소식이라고 지적했습니다. 왜냐하면 하이퍼스케일 데이터 센터 운영자가 확장을 늦추면 잉여 현금 흐름이 더 이상 마이너스가 아니고 플러스로 바뀔 수도 있기 때문입니다."},{"s":"전 IMF 수석 이코노미스트: 워시가 9월 금리 인상의 문을 열면 연준은 엄청난 정치적 압력에 직면할 수 있습니다","so":"财联社","tm":"11/27 04:37","c":1,"r":"cn","u":"https://www.cls.cn/detail/2468655","p":1795721844,"a":1795785162,"t":"前IMF首席经济学家：沃什为9月加息打开大门 美联储或面临巨大政治压力","su":"① 워시의 잭슨 홀 연설은 매파적 신호를 강화했고, 9월 금리 인상에 대한 시장의 베팅은 35%에서 60%로 증가했습니다. ② Rogoff는 연준이 금리 인상을 선택하면 연준의 독립성을 더욱 시험하게 될 것이며 트럼프로부터 격렬한 비판을 받을 수 있다고 믿습니다. ③ 그는 또한 장기 미국 국채 금리에 여전히 상승 압력이 있을 것이라고 예상하고 자금 조달(사업에 쓸 돈을 모으는 것)을 단기로 전환하려는 Bessant의 부채 관리 전략에 의문을 제기했습니다. 차이롄서, 8월 30일(편집자 Xia Junxiong) 하버드 대학교 교수이자 전 국제통화기금(IMF) 수석 이코노미스트였던 켄 로고프는 금요일 잭슨 홀 회의에서 워시 연준 의장의 연설이 분명히 신호를 보냈다고 말했습니다. 인플레이션(물건값이 계속 오르는 것) 지표가 개선되지 않으면 그는 금리를 인상할 것입니다."},{"s":"미국 증시 마감: 3개 주요 지수가 소폭 상승 마감, 오라클의 현금 흐름 지침으로 AI 클라우드 컴퓨팅 주식 상승","so":"财联社","tm":"11/27 00:59","c":1,"r":"cn","u":"https://www.cls.cn/detail/2518554","p":1795708769,"a":1795785164,"t":"美股收盘：三大指数小幅收涨 甲骨文现金流指引提振AI云计算股","su":"① 연준은 예정대로 기준금리를 동결했다. ②워시는 내년부터 금리 회의 조정을 발표했다. ③오라클의 현금 흐름 지침은 AI 지출에 대한 우려를 완화합니다. ④마이크로소프트와 구글 Cloud의 비즈니스 성과는 기대치를 뛰어 넘었습니다. 차이롄서, 10월 29일자(Li Ying 편집자) 수요일 동부 시간에 연준은 예정대로 금리를 동결했지만 12월 금리 인상(이자 비율을 올리는 것) 여부에 대해서는 명확한 신호를 보내지 않았습니다. 미국 증시는 결의안 발표와 워시 기자회견 동안 등락을 거듭하다 결국 소폭 상승세로 마감했다. 마감 기준 S&P500(미국 큰 회사 500곳의 주가를 합쳐 만든 점수) 지수는 0.28% 상승한 7743.98포인트를 기록했습니다. 나스닥 종합지수는 0.27% 상승한 26549.85 포인트를 기록했습니다. 다우존스 산업평균지수는 0.19% 상승한 52475.1포인트를 기록했습니다."}]},{"name":"🧬 나스닥 바이오","note":"보유: TIGER 미국나스닥바이오","breaking":false,"items":[{"s":"머스크 뉴럴링크, 뇌-컴퓨터 연결장치 임상시험 FDA 승인","so":"YTN","tm":"11/26 11:44","c":3,"r":"kr","u":"https://www.ytn.co.kr/_ln/0104_202611261144005780","p":1795661040,"a":1795662989,"su":"일론 머스크가 설립한 스타트업 뉴럴링크가 사람 두뇌와 컴퓨터를 연결하는 뇌-컴퓨터 연결장치, BCI 임상시험(새 약을 사람에게 시험하는 것)에 대해 미국 당국의 승인을 받았습니다. 현지시간 25일 블룸버그 통신에 따르면, 뉴럴링크는 미국 식품의약국, FDA(미국에서 약을 허가해 주는 정부 기관)의 승인을 받아 근위축성 측삭경화증, 이른바 루게릭병 환자를 대상으로 BCI 이식의 안전성과 효과를 평가할 예정입니다."},{"s":"루핀, 미국 FDA 승인 및 시타글립틴 정제(USP) 미국 출시 발표","so":"Yahoo Finance Singapore","tm":"11/28 01:34","c":2,"r":"us","u":"https://sg.finance.yahoo.com/news/lupin-announces-u-fda-approval-163400261.html","p":1795797240,"a":1795819502,"t":"Lupin Announces U.S. FDA Approval and Launch of Sitagliptin Tablets, USP in the United States","su":"글로벌 제약 선두업체인 Lupine Limited(Lupin)(BSE: 500257)(NSE: LUPIN)(REUTERS: LUPIN.BO)(BLOOMBERG: LPCIN)은 미국 식품의약국(U.S. FDA(미국에서 약을 허가해 주는 정부 기관))의 단축 신약(새로 만든 약) 신청(ANDA) 승인에 따라 시타글립틴 정제 USP(25mg, 50mg, 100mg)를 출시했다고 오늘 발표했습니다. 미국."},{"s":"혁신적인 의약품 부문은 변동하고 조정되며, 상업화는 레이아웃 단서를 제공합니다.","so":"Jiemian.com","tm":"11/27 08:21","c":2,"r":"cn","u":"https://m.jiemian.com/article/15379391.html","p":1795735305,"a":1795737882,"t":"创新药板块震荡调整，商业化兑现提供布局线索","su":"11월 이후 A주와 홍콩주 혁신의약품 업종이 먼저 상승했다가 하락세를 보였다. 11월 26일 현재 두 곳 모두 혁신의약품 지수가 하락세를 보이고 있다. 동시에, 국내 혁신 의약품의 새로운 계열이 새로운 국가 의료 보험 의약품 목록에 진입했으며 일부 품종도 해외 임상 연구 및 판매 승인에서 진전을 이루었습니다. 분석가들은 혁신적인 의약품 부문의 후속 회복이 구조적 시장 상황에 의해 좌우될 수 있다고 믿습니다. 초기 해외 라이센싱 프로젝트가 계속 진행되면서 시장의 관심은 라이센싱 계약 체결에서 제품 자체의 효능과 판매 실적(회사가 번 돈 성적표) 쪽으로 옮겨가고 있다. 연구 중인 품종의 경우 주요 임상 시험에서 환자의 이점을 확인할 수 있는지 여부에 주의를 기울여야 합니다. 승인된 제품의 경우 중국 국내 의료보험 접근성과 해외 상장이 지속적인 매출(물건을 판 돈 전체) 성장을 가져올 수 있을지 여부가 관건이다. (중국 증권 뉴스) 제몐뉴스는 독립적으로 생각하는 사람들에게만 서비스를 제공합니다."},{"s":"의료기술 | Neuralink는 미국 최초의 이식형 뇌-컴퓨터 인터페이스에 대한 중요한 연구를 시작하기 위해 FDA 승인을 받았습니다.","so":"香港經濟日報HKET","tm":"11/26 18:10","c":2,"r":"hk","u":"https://inews.hket.com/article/4231557/%E9%86%AB%E7%99%82%E7%A7%91%E6%8A%80%EF%BD%9CNeuralink%E7%8D%B2FDA%E6%89%B9%E5%87%86%E3%80%80%E5%95%9F%E5%8B%95%E7%BE%8E%E9%A6%96%E5%80%8B%E6%A4%8D%E5%85%A5%E5%BC%8F%E8%85%A6%E6%A9%9F%E4%BB%8B%E9%9D%A2%E9%97%9C%E9%8D%B5%E7%A0%94%E7%A9%B6?mtc=20040","p":1795684230,"a":1795694289,"t":"醫療科技｜Neuralink獲FDA批准 啟動美首個植入式腦機介面關鍵研究"},{"s":"Neuralink, 뇌 임플란트에 대한 중요한 ALS 시험에 대해 FDA 승인 획득","so":"Startup Fortune","tm":"11/26 17:25","c":2,"r":"us","u":"https://startupfortune.com/neuralink-wins-fda-approval-for-a-pivotal-als-trial-of-its-brain-implant/","p":1795681521,"a":1795694278,"t":"Neuralink Wins FDA Approval for a Pivotal ALS Trial of Its Brain Implant","su":"가까운 사람이 ALS를 앓고 있는 경우, 이 임플란트가 판매하기에 충분한지 알아보기 위한 미국 연구가 현재 진행 중입니다. 여기에 참여하는 것은 완성된 제품을 얻는 것과 같지 않으며 답변을 받는 데 몇 년이 걸릴 것입니다."},{"s":"초기 거래에서 조정된 혁신적인 약물 개념","so":"第一财经","tm":"11/26 10:49","c":2,"r":"cn","u":"https://www.yicai.com/brief/103454869.html","p":1795657740,"a":1795662990,"t":"创新药概念早盘调整","su":"2026/11/26 09:49 [초기 거래 혁신신약(세상에 처음 나온 새로운 약) 개념 조정] 니어쇼어 단백질이 10% 이상 하락했고, 완방제약, 시야오징펑, 계림산진, 라이메이제약, 포인세티아도 5% 이상 하락했다."},{"s":"Balaji Amines, 제약 산업용 프로필렌 글리콜 제조에 대한 FDA 승인 획득","so":"CNBC TV18","tm":"11/27 21:58","c":1,"r":"sg","u":"https://www.cnbctv18.com/market/stocks/balaji-amines-share-price-gets-fda-approval-to-manufacture-propylene-glycol-for-pharma-industry-20043254.htm","p":1795784286,"a":1795785182,"t":"Balaji Amines gets FDA approval to manufacture Propylene Glycol for pharma industry","su":"이 허가는 2031년 11월 26일까지 유효하며 Schedule C, C(1) 및 X에 명시된 것 이외의 약물의 제조, 판매 또는 유통에 대한 양식 25를 다룹니다."},{"s":"노바티스: 류마티스성 다발근통 치료용으로 미국 FDA 승인을 받은 Cosentyx®","so":"Jiemian.com","tm":"11/27 19:17","c":1,"r":"cn","u":"htt iosciences 및 기타 캐나다 생명공학 주식 2개 보유","so":"Yahoo Finance","tm":"11/27 10:27","c":1,"r":"us","u":"https://finance.yahoo.com/healthcare/articles/bright-minds-biosciences-2-other-012754864.html","p":1795742820,"a":1795749555,"t":"Bright Minds Biosciences And 2 Other Canadian Biotech Stocks To Own","su":"이제 반도체(전자기기 속에서 계산하고 기억하는 작은 부품) 칩은 석유 및 가스보다 더 큰 글로벌 수출 무역을 대표하며, 고급 컴퓨팅에 대한 수요 급증은 조용히 캐나다 생명공학에 반영됩니다. 약물 발견, 진단, 유전자 편집은 모두 막대한 데이터 처리에 달려 있습니다. 첨단 기술에 자본이 유입되면 의료 혁신에 초점을 맞춘 연구도 지원할 수 있습니다. 이 기사에서는 캐나다 생명공학 매장 3곳을 소개합니다."},{"s":"갤럭시증권: 혁신신약 수확기에 돌입, 업계 압박에서 구조적 회복으로 전환할 것","so":"Jiemian.com","tm":"11/27 09:47","c":1,"r":"cn","u":"https://www.jiemian.com/article/15379753.html","p":1795740475,"a":1795749560,"t":"银河证券：创新药进入收获期，行业将从承压转向结构性复苏"},{"s":"Cogent Biosciences, 첫 번째 약물에 대한 FDA 승인 획득, 월 $49,000 출시 계획","so":"Yahoo Finance","tm":"11/27 08:12","c":1,"r":"us","u":"https://finance.yahoo.com/healthcare/articles/cogent-biosciences-wins-fda-approval-231205074.html","p":1795734725,"a":1795737881,"t":"Cogent Biosciences Wins FDA Approval for First Drug, Plans $49,000-a-Month Launch","su":"Cogent Biosciences(NASDAQ:COGT)는 미국 식품의약국(FDA(미국에서 약을 허가해 주는 정부 기관))이 이전에 이마티닙을 투여받은 진행성 위장기질종양(GIST) 환자를 위해 EKITNA를 승인했다고 밝혔습니다. 기존 표준치료제인 수니티닙과 병용해 출시할 예정이다."},{"s":"이익기반 생명공학 ETF 2가지가 주목받는다 - 데일리","so":"工商時報","tm":"11/27 04:00","c":1,"r":"tw","u":"https://www.ctee.com.tw/news/20261127700345-439901","p":1795719600,"a":1795733599,"t":"2大利多加持生技ETF吸睛- 日報","su":"글로벌 주식 시장은 극심한 혼란을 겪었고 거의 모든 주식 ETF(여러 주식을 묶어 파는 상품)가 그 뒤를 따랐습니다. 하지만 해외주식 ETF 145개 중 반대 방향으로 상승한 데 이어 바이오 ETF도 이러한 추세에 반하는 상승세(오르는 흐름)를 보였다. 법률대리인은 생명공학 및 의료지수의 성과가 상대적으로 내진성이 뛰어나며, 관련 생명공학 ETF의 성과가 뛰어났다고 말했다. 산업 발전은 꾸준하고 긍정적이며 투자 테마는 풍부합니다. 관련 바이오 ETF를 통한 투자 기회에 참여하는 것이 좋습니다. Qunyi 나스닥 Biotechnology(00678) ETF 매니저 Qiu Yuru는 의료..."},{"s":"화하이제약(Huahai Pharmaceutical): 시타글립틴정이 미국 FDA 승인번호를 획득했습니다.","so":"第一财经","tm":"11/27 02:54","c":1,"r":"cn","u":"https://www.yicai.com/news/103455479.html","p":1795715657,"a":1795733596,"t":"华海药业：西格列 ://www.mt.co.kr/amp/world/2026/11/26/2026112616150525617","p":1795680294,"a":1795694277,"su":"일론 머스크 스페이스X·테슬라 최고경영자(CEO(회사의 가장 높은 책임자))가 세운 스타트업 뉴럴링크가 뇌-컴퓨터 연결장치(BCI) 임상(새 약을 사람에게 시험하는 것) 시험 승인을 받았다. 뉴럴링크는 마비 환자들이 생각만으로 전자 기기를 쓸 수 있는 뇌 이식 장치를 개발해 왔다."},{"s":"3년간의 운영, 글로벌 데뷔: 인내심 있는 자본과 혁신적인 제약회사 간의 양방향 여정","so":"21财经","tm":"11/26 16:51","c":1,"r":"cn","u":"https://www.21jingji.com/article/20261126/herald/54ab6a3b75d7741200c382a02ec220d4.html","p":1795679460,"a":1795694283,"t":"三年陪跑、全球首发：耐心资本与创新药企的双向奔赴","su":"홍반성 루푸스, 류마티스 관절염...장기적인 약물 치료가 필요한 이러한 자가면역 질환은 수천만 가족을 괴롭혔습니다. '면역치료의 이정표'로 알려진 CAR-T 기술을 통해 일부 환자는 약물 중단 후 장기간 관해를 달성할 수 있었지만 대부분의 환자에게는 수십만에서 수백만의 가격이 감당하기 어려울 정도였습니다. 2021년 12월 설립된 선전 기업 홍신바이오테크놀로지(Hongxin Biotechnology)는 이 문턱을 '허물기' 위해 노력하고 있다. 그들은 인간 임상(새 약을 사람에게 시험하는 것) 시험에 들어간 세계 최초의 \"세포 표적 LNP 약물\"을 개발했습니다. 기존 CAR-T의 '고도화된 민간 맞춤화'를 언제든지 복용하고 사용할 수 있는 '표준화된 대량생산 의약품'으로 탈바꿈할 것으로 예상되며, 치료비도 1만원 수준으로 인하될 전망이다."},{"s":"다이이치산쿄(Daiichi Sankyo)의 혁신신약 Viftai®(퀴자티닙 염산염 정제)가 중국에서 공식 출시되었습니다.","so":"Jiemian.com","tm":"11/26 15:48","c":1,"r":"cn","u":"https://www.jiemian.com/article/15377277.html","p":1795675716,"a":1795676824,"t":"第一三共创新药物维复泰®（盐酸奎扎替尼片）正式在中国商业上市","su":"11월 26일, Daiichi Sankyo China의 소식에 따르면, Daiichi Sankyo의 혁신적인 약물 Vivotec®(퀴자티닙 염산염 정제)이 FLT3-ITD 돌연변이가 있는 새로 진단된 급성 골수성 백혈병(AML) 성인 환자의 치료를 위해 중국에서 공식 출시되었습니다. Weifutai®는 곧 전국의 병원과 약국에 공급되어 중국 의사와 AML 환자에게 새로운 치료 옵션(정해진 값에 사거나 팔 권리)을 제공할 예정입니다."},{"s":"의료보험의 이중 카탈로그가 공식적으로 출시되었으며 혁신 의약품의 지불 측면이 집중적으로 현금화되었습니다. 홍콩 스톡커넥트 혁신신약 ETF인 Harvest(520970)는 홍콩 혁신 의약품 산업의 발전 기회를 포착합니다.","so":"Jiemian.com","tm":"11/26 13:00","c":1,"r":"cn","u":"https://www.jiemian.com/article/15376335.html","p":1795665620,"a":1795694284,"t":"医保双目录正式落地，创新药支付端兑现密集，港股通创新药ETF嘉实(520970)把握港股创新药产业发展机会","su":"2026년 11월 26일 10시 45분 현재 CSI 홍콩 스톡커넥트(홍콩과 중국 본토 주식을 서로 사고팔 수 있게 한 길) Innovative Drug Index는 2.71% 크게 상승했으며, 구성주인 Zhaoyan New Drug은 5.27%, GenScript Biotech은 5.26%, China Biopharmaceutical은 5.14% 상승하고 우시앱텍 및 Insilicon Intelligent와 같은 주식이 뒤따랐습니다."},{"s":"Cipla, Teva, FDA 승인 천식 흡입기 Flovent 획득","so":"ETPharma","tm":"11/26 12:07","c":1,"r":"us","u":"https://pharma.economictimes.indiatimes.com/amp/news/drug-approvals-and-launches/cipla-teva-win-fda-nod-asthma-inhaler-flovent/136177077","p":1795662465,"a":1795694279,"t":"Cipla, Teva win FDA nod asthma inhaler Flovent","su":"- 약물 승인 및 출시 - 1분 읽기 Cipla, Teva, FDA(미국에서 약을 허가해 주는 정부 기관) 천식 흡입기 Flovent 승인 이스라엘의 Teva Pharmaceuticals와 협력하여 개발된 이 제품은 GSK의 Flovent와 동등한 최초의 제네릭(특허가 끝난 약을 똑같이 만든 복제약) 제품으로 명시되어 있습니다."},{"s":"NASDAQ Biotechnology Total Retu (^XNBIJPY) 계절별 수익률 차트 - 야후 파이낸스","so":"Yahoo! Finance Canada","tm":"11/26 01:54","c":1,"r":"us","u":"https://ca.finance.yahoo.com/quote/%5EXNBIJPY/seasonality/","p":1795625657,"a":1795694279,"t":"NASDAQ Biotechnology Total Retu (^XNBIJPY) Seasonal Returns Chart - Yahoo Finance","su":"NASDAQ Biotechnology Total Retu(^XNBIJPY) 계절 수익률(넣은 돈에 비해 얻는 이익 비율) 차트는 투자 전략을 알리기 위해 월별 평균 및 중간 수익률을 제공합니다."},{"s":"410억 달러 규모의 사노피/인스메드 거래가 M&A 희망을 되살리면서 주목해야 할 5개 생명공학 주식","so":"Yahoo Finance","tm":"11/26 00:31","c":1,"r":"us","u":"https://finance.yahoo.com/healthcare/articles/5-biotech-stocks-watch-41b-153100426.html","p":1795620660,"a":1795647062,"t":"5 Biotech Stocks to Watch as $41B Sanofi/Insmed Deal Revives M&A Hopes","su":"인스메드를 인수하기로 한 사노피의 합의는 생명공학에 대한 투자자의 관심을 다시 불러일으켰고 잠재적인 인수 목표에 대한 광범위한 부문 상승세(오르는 흐름)와 추측을 촉진하는 데 도움이 되었습니다. 이번 거래는 대형 제약사의 성장 전망을 강화할 수 있는 차별화된 의약품과 유망 파이프라인(개발하고 있는 신약 후보 목록)의 전략적 가치를 강조합니다."},{"s":"'중국 혁신' 해외 진출 | 생명을 지키는 의학의 '새로운 힘'","so":"新华网","tm":"11/25 22:58","c":1,"r":"cn","u":"https://www.news.cn/tech/20261125/a77a0741fd924d98b82a3b4452c699ec/c.html","p":1795615135,"a":1795647069,"t":"“中国创新”出海记丨守护生命的医药“新力量”","su":"혁신적인 의약품과 같은 신제품은 빠르게 해외 시장을 개척하고 있으며 중국의 대외 무역을 위한 새로운 명함이 되고 있습니다. 데이터에 따르면 올해 3분기까지 중국의 혁신 의약품에 대한 외부 라이센스 거래는 약 1,300억 달러로 지난해 전체 수준에 가깝습니다. 혁신신약(세상에 처음 나온 새로운 약)의 외부 라이센싱은 혁신제약사가 특허나 기술, 제품 등을 해외 기업에 라이센싱하는 거래 형태다. 이는 중국의 지적재산권과 독창적인 연구개발 역량의 특별한 수출이다. 실험실에서의 독립적 연구개발부터 글로벌 시장에 0만 위안이다. 위에서 언급한 거래 대상에는 Tianqi Group, Tianqi Minmetals 및 Ying'anjia가 포함됩니다. 처음 두 개는 톈치리튬의 실제 컨트롤러인 Jiang Weiping이 제어합니다. Ying'anjia는 톈치리튬의 회장인 Jiang Anqi가 통제합니다. 본 거래는 관련 거래를 구성합니다. 올해 상반기 기준으로 Tianqi Xingyu는 Tianqi Group에 9억 2100만 위안의 대출금 원금과 이자를 갚아야 합니다. 합의 후 톈치리튬은 대출금을 상환해야 하므로 이번 거래에 대한 실제 대가는 77억 9300만 위안으로 증가했습니다."},{"s":"'Broker Insights' CITIC Lyon은 CATL(03750)의 4분기 실적이 부진하다고 지적하며 내년 실적에 대한 회사의 견해에 주목","so":"etnet 經濟通","tm":"11/26 11:30","c":2,"r":"hk","u":"https://www.etnet.com.hk/www/tc/news/news-article.php?section=categorized&category=latest&newsid=20261121382","p":1795660200,"a":1795663002,"t":"《券商精點》中信里昂指寧德時代(03750)第四季績弱，關注公司對明年業績看法","su":"2026-11-26 10:30 \"Broker Focus\" CITIC Lyon은 CATL(03750)이 4분기 실적(회사가 번 돈 성적표)이 부진하다고 지적하며 내년 실적에 대한 회사의 견해에 주목했습니다. CITIC Lyon은 CATL(03750)의 \"우수\" 등급을 유지했으며 H주와 A주의 목표 주가는 각각 HK$585와 RMB 400입니다. CATL의 2026년 4분기 실적이 예상보다 나쁠 수 있다는 우려가 시장에서 다시 불붙자 최근 CATL의 주가가 다시 조정을 받았다. 은행은 비용 전달 지연과 연말 컴퓨팅 비용 집중으로 인해 회사의 4분기 실적이 하락할 수 있다는 연구 보고서를 발표했습니다. 하지만 은행은 현 단계에서 더 중요한 것은 CATL이 2027년 단위당 순이익(모든 비용을 빼고 남은 돈) 실적을 어떻게 보는가라고 지적했다. 불행하게도 시장은 회사로부터 보다 명확한 지침을 얻기 위해 2027년 1분기까지 기다려야 할 수도 있다. 그럼에도 불구하고 은행은 CATL에 대한 투자등급을 재차 밝혔습니다."},{"s":"[특징주] 美, 한국 관세 15% 유지 전망에…이차전지주 동반 강세","so":"Chosunbiz","tm":"11/26 09:48","c":2,"r":"kr","u":"https://biz.chosun.com/stock/stock_general/2026/11/26/IC5DVVTVNZGPZOKZ5CMYNY55AI/","p":1795654080,"a":1795663000,"su":"미국이 한국에 대한 관세(수입품에 붙이는 세금) 상한을 기존 15%로 유지할 것이란 소식에 국내 이차전지 관련주가 장 초반 강세를 보이고 있다. 추가 관세 부과에 대한 우려가 완화되면서 투자심리가 개선된 것으로 풀이된다. 26일 오전 9시 44분 삼성SDI(006400)는 유가증권시장(한국 큰 회사들이 모인 주식시장(코스피))에서 전 거래일 대비 1만4000원(3.35%) 오른 43만2000원에 거래되고 있다. 포스코퓨처엠도 5800원(3.54%) 오른 16만9500원을 기록 중이다."},{"s":"LG에너지솔루션, 북미 ESS 시장 공략…AI 에너지 플랫폼 기업 도약","so":"전자신문","tm":"11/26 09:27","c":2,"r":"kr","u":"https://www.etnews.com/20261126000087","p":1795652840,"a":1795676835,"su":"“이제는 사실상 모든 고객들이 저희 쪽으로 들어오고 있습니다.” LG에너지솔루션 에너지저장장치(ESS(전기를 저장해 두는 큰 배터리)) 사업 전문 법인 버텍의 트리스탄 도허티 최고제품책임자(CPO)는 최근 미국 라스베이거스에서 열린 신재생에너지(햇빛·바람처럼 다시 쓸 수 있는 에너지) 전시회"},{"s":"도쿠시마현 현내 6시읍면에서 리튬 이온 전지 회수의 실증 사업","so":"NHKニュース","tm":"11/26 06:00","c":2,"r":"jp","u":"https://news.web.nhk/newsweb/na/nd-20261126de81555","p":1795640418,"a":1795647101,"t":"徳島県 県内6市町村でリチウムイオン電池回収の実証事業","su":"【NHK】리튬(배터리에 꼭 들어가는 아주 가벼운 금속) 이온 전지가 관계하는 화재가 뒤를 끊지 않는 가운데, 도쿠시마현은, 11월부터 현내의 공공 시설 내에 전용의 박스를 설치해 전지의 회수를 실시하는 실증(실제 현장에서 써 보며 확인하는 것) 사업을 실시하고 있습니다. 리튬 이온 배터리 등으로부터의 출화에 의한 화재"},{"s":"본토와 대만 기업인들이 새로운 기회를 위해 싸우다 / 광시 기반, 동남아시아를 바라보며 화후이 신소재, 배터리 분리막 공격","so":"UDN","tm":"11/26 03:54","c":2,"r":"tw","u":"https://udn.com/news/story/7333/9902306","p":1795632847,"a":1795647097,"t":"大陸台商拚新局／立基廣西、放眼東南亞 華徽新材強攻電池隔膜","su":"대만의 젊은 사업가 천민푸(Chen Minfu)가 이끄는 화후이신소재(Huahui New Materials)는 배터리 분리막(배터리 양쪽이 서로 닿지 않게 막는 얇은 막)에 주력하고 있다. 그는 본토의 지역 산업 정책과 기술적 이점을 활용하여 광시에 기지를 설립했습니다. 현지 주요 제조업체에 공급하는 것 외에도 광시핑루 운하와 정책 파급효과도 활용해 동남아시아에서의 발전도 기대된다."},{"s":"CATL: 약 9999만 7천 위안을 지출하여 474,400A주(크립톤 36주)를 재매입했습니다.","so":"www.36kr.com","tm":"11/25 21:56","c":2,"r":"cn","u":"https://www.36kr.com/newsflashes/4085134970415749","p":1795611374,"a":1795612530,"t":"宁德时代：斥资约9999.7万元回购47.44万股A股-36氪","su":"36Kr은 CATL이 11월 25일 선전증권거래소에서 A주(중국 본토(상하이·선전) 주식시장의 주식) 474,400주를 환매하기 위해 약 9999만7000위안을 지출할 것이라고 발표했다는 사실을 알게 됐다. 환매된 주식의 가격 범위는 주당 210.13~212.22위안이었다."},{"s":"\"반도체서 거둔 성과… 이차전지·디스플레이로 이어갈 것\" [인터뷰]","so":"파이낸셜뉴스","tm":"11/25 18:13","c":2,"r":"kr","u":"https://www.fnnews.com/news/202611251813225164","p":1795598006,"a":1795608186,"su":"저스템 김용진 사장은 25일 \"올해는 반도체(전자기기 속에서 계산하고 기억하는 작은 부품) 슈퍼사이클을 맞아 습도제어 솔루션 판매가 활발히 이뤄지면서 급성장했다\"라며 \"내년에는 이차전지와 디스플레이 장비 매출(물건을 판 돈 전체)이 더해지면서 올해보다 최소 30% 이상 성장이 가능할 것\"이라며 이같이 밝혔다."},{"s":"주가는 하루 만에 8% 이상 하락했고, CATL의 시가총액은 1조 위안 아래로 떨어졌다.","so":"Jiemian.com","tm":"11/25 17:57","c":2,"r":"cn","u":"https://www.jiemian.com/article/15373101.html","p":1795597044,"a":1795608191,"t":"单日股价跌超8%，宁德时代市值跌破万亿元","su":"11월 25일 CATL(300750.SZ) 주가는 8.33% 하락한 208.42위안으로 마감하며 급락했다. A주(중국 본토(상하이·선전) 주식시장의 주식)의 총 시장가치는 약 9,644억 1,100만 위안입니다. 올해 5월 7일 CATL의 업입니다. 그러나 \"비즈니스\"와 \"산업\" 사이에는 여전히 일련의 제도적 인프라가 구축되어 있습니다. 2025년 춘절을 앞두고 상하이 신에너지차 4S 매장의 배터리 재활용 주문이 갑자기 300% 증가했다. 매장 관리자는 창고에 쌓여 있는 퇴역 배터리 팩을 바라보며 흥분과 불안을 동시에 느꼈습니다. 이 \"퇴역 군인\"은 어디로 가야 할까요? 이 문제는 신에너지 자동차 산업 전체를 괴롭히고 있다. 01 조수가 왔습니다. 먼저 일련의 숫자를 살펴보겠습니다. 2025년 6월말 기준 전국 신에너지자동차 보유대수는 3,689만대에 달해 전체 자동차 보유대수의 10%를 차지한다. 5~8년의 전기차 배터리(전기차를 움직이는 큰 충전 배터리) 추정 수명을 기준으로 2018년부터 2020년까지 약 400만 대의 전기차 배터리가 2025년부터 2027년까지 집중 폐기될 예정이다. 중국 국내 전기차 배터리 폐기 총액은 2024년 약 40만 톤에 달하고, 2030년에는 150만 톤을 넘어설 것으로 예상된다."},{"s":"[피지티 IPO] 리튬염 탈중국 수요 21만톤…피지티 '빈자리' 선점","so":"더벨","tm":"11/27 14:36","c":1,"r":"kr","u":"https://www.thebell.co.kr/front/newsview.asp?key=202611271012253160103779","p":1795757790,"a":1795838618,"su":"특수정밀 화학소재 기업 피지티(PGT)가 코스닥(한국 중소·기술 회사들이 모인 주식시장) 상장을 앞두고 리튬염 사업을 전면에 내세웠다. 2차전지(충전해서 다시 쓰는 배터리) 전해액 원료인 육불화인산리튬(LiPF6) 시장을 중국 기업들이 장악한 상황에서 중국산을 대체하고자 하는 북미·유럽 배터리업계를 겨냥했다. 27일 관..."},{"s":"양극재 다크호스 바스프, CATL과 유럽서 협력 확대","so":"디일렉","tm":"11/27 14:13","c":1,"r":"kr","u":"https://www.thelec.kr/news/articleView.html?idxno=66009","p":1795756386,"a":1795762633,"su":"독일 화학기업 바스프(BASF)가 배터리 소재 사업을 양극재(배터리에서 전기를 내보내는 쪽의 핵심 재료) 중심으로 재편한다. 폐배터리 리사이클링(재활용) 사업을 매각하고 프리커서(전구체) 사업도 외부 협력"},{"s":"배터리 ETF 웰스파고(561160) 추적지수 CSI 배터리테마지수는 3.31% 상승했고, 추적지수는 지난 1년간 최저치에 도달했다.","so":"Jiemian.com","tm":"11/27 14:01","c":1,"r":"cn","u":"https://www.jiemian.com/article/15382103.html","p":1795755660,"a":1795762635,"t":"电池ETF富国(561160)跟踪指数中证电池主题指数上涨3.31%，跟踪指数已处近1年估值低位","su":"2026년 11월 27일 13시 1분 기준 배터리 ETF(여러 주식을 묶어 파는 상품) Wells Fargo(561160) 트래킹지수 CSI Battery Theme Index는 3.31% 상승했으며, 트래킹지수는 지난 1년 동안 저평가(실제 값어치보다 싸게 매겨진 것) 상태를 유지해왔다."},{"s":"[특징주] 하나기술, 2차전지 전고체 테마 강세에 1만원 선 돌파","so":"와이드경제","tm":"11/27 13:49","c":1,"r":"kr","u":"https://www.widedaily.com/news/articleView.html?idxno=305027","p":1795754985,"a":1795785191,"su":"글로벌 배터리 시장의 투자 재개 기대와 차세대 배터리 및 에너지저장장치(ESS) 설비 수요 확대 전망 속에 2차전지(충전해서 다시 쓰는 배터리) 관련주가 강세를 보이면서 하나기술이 장중 급등해 1만원 선을 돌파했다. 27일 오후 1시 2분 기준 코스닥(한국 중소·기술 회사들이 모인 주식시장) 시장에 리얼즈, 2차전지 전고체 훈풍 타고 급등…거래대금 58억 유입","so":"와이드경제","tm":"11/27 09:44","c":1,"r":"kr","u":"https://www.widedaily.com/news/articleView.html?idxno=304918","p":1795740265,"a":1795785191,"su":"차세대 전고체 배터리(액체 대신 고체를 넣은 안전한 배터리) 관련 테마가 장 초반 강세를 보이는 가운데 황화물계 고체 전해질 원료 사업을 추진 중인 레이크머티리얼즈가 급등하고 있다. 27일 오전 9시 34분 기준 코스닥(한국 중소·기술 회사들이 모인 주식시장) 시장에서 레이크머티리얼즈는 전 거래일 대비 1790원(17.53%) 오른 1만2000원에 거래되고 있다."},{"s":"[특징주] 엔켐, 2차전지 소재주 매수세 유입에 장중 13% 넘게 올라","so":"와이드경제","tm":"11/27 09:41","c":1,"r":"kr","u":"https://www.widedaily.com/news/articleView.html?idxno=304915","p":1795740104,"a":1795785191,"su":"2차전지(충전해서 다시 쓰는 배터리) 소재·부품과 전력저장장치(ESS), 리튬 관련 테마가 장 초반 동반 강세를 보이는 가운데 전 거래일 급락했던 엔켐이 큰 폭의 반등세를 나타내고 있다. 27일 오전 9시 34분 기준 코스닥(한국 중소·기술 회사들이 모인 주식시장) 시장에서 엔켐은 전 거래일 대비 1150원(13.72%) 오른 9530원에 거래되고 있다"},{"s":"파워 배터리 지형 재편, 2차 진영 차별화 뚜렷해","so":"Jiemian.com","tm":"11/27 08:37","c":1,"r":"cn","u":"https://m.jiemian.com/article/15379406.html","p":1795736266,"a":1795737892,"t":"动力电池格局重塑，二线阵营分化明显","su":"전력배터리 산업의 구조조정이 지속되고 있다. 11월 26일 CATLA 주식은 주당 204.22위안으로 마감되었으며, 총 시가총액(회사 전체 몸값)은 거의 1조 위안에 달합니다. 기자들의 통계에 따르면 올해 3분기까지 중국 8개 상장 전력 배터리 및 리튬 배터리 기업 중 절반이 전년 동기 대비 순이익(모든 비용을 빼고 남은 돈) 성장을 달성했다. 이 중 CATL이 모회사 귀속 순이익 645억3000만 위안으로 1위를 차지했고, BYD가 223억4500만 위안, 이웨이리튬에너지가 52억4000만 위안으로 뒤를 이었다. 성장률 측면에서는 Penghui Energy가 928.81%로 선두를 차지했고, China New Aviation과 EVE에너지는 각각 99.50%와 86.11% 증가했습니다. 가장 큰 하락폭을 보인 곳은 궈쉬안로 전년 동기 대비 66.48% 하락했습니다. 중국자동차딜러협회 승용차시장정보합작지부 사무국장 Cui Dongshu는 2026년 파워 배터리 시장은 \"두 영웅의 주가는 하락세를 보이고, 2위권은 상승세를 가속화할 것\"이라는 추세를 보일 것이라고 말했다. 궈쉬안, EVE에너지, 지리자동차 Yaoning 등 2위 기업의 주가가 크게 상승했습니다. 후미 기업의 주식은 기본적으로 청산되었습니다. 산업 집중도는 낮아지고 경쟁은 더욱 다양해졌습니다. 그러나 주식이 재분배되는 동안 이익은 동시에 개선되지 않았습니다. 이 격차가 현재 리튬전지 산업의 주축을 이루고 있다. (중국 증권 뉴스) 제몐뉴스는 독립적으로 생각하는 사람들에게만 서비스를 제공합니다."},{"s":"[리포트 브리핑]포스코퓨처엠, 'LFP 전환, 성장영역의 확장' 목표가 260,000원 - 상상인증권","so":"뉴스핌","tm":"11/27 08:31","c":1,"r":"kr","u":"https://www.newspim.com/news/view/20261127000090","p":1795735860,"a":1795737892,"su":"포스코퓨처엠 주가, 앞으로 오를까? 포스코퓨처엠 지금 사도 될까? 포스코퓨처엠 1년 뒤 주가는 얼마일까? 포스코퓨처엠 주가에 영향을 줄 변수는? 본 콘텐츠는 투자 결과에 대한 법적 책임의 근거로 사용될 수 없습니다. [서울=뉴스핌] 로보뉴스 = 상상인증권에서 27일 포스코퓨처엠(003670)에 대해 'LFP 전환, 성장영역의 확장'라며 투자의견(전문가가 사라·팔라고 내는 의견) 'BUY'의 신규 리포트를 발행하였고, 목표가(전문가가 예상한 앞날의 주가) 260,000원을 내놓았다."},{"s":"항공 배터리는 엔지니어링 검증을 향해 나아가고 있으며, 기술과 시장은 여전히 양방향에서 획기적인 발전이 필요합니다.","so":"第一财经","tm":"11/27 08:13","c":1,"r":"cn","u":"https://www.yicai.com/news/103456220.html","p":1795734795,"a":1795737893,"t":"航空电池走向工程验证 技术与市场仍需双向突破","su":"상하이증권뉴스에 따르면 지상에서 하늘까지 전력전지 기업들이 새로운 성장 공간을 찾고 있다. CATL은 11월부터 전기 수직 이착륙기(eVTOL) 회사인 Blue Vector 및 Ivit Aviation과 연속적으로 독점 배터리 협력을 체결했으며, 중국 민간 항공 대학교와 공동 항공 배터리 감항성 기술 혁신 연구소를 구축하는 계약을 체결했습니다. 동시에 11월 14일 COMAC가 개발한 10톤 전기 상용 항공기 CE-25A가 최초의 유인 지능형 비행을 완료했습니다. 많은 인터뷰 대상자들은 1~2년 전과 비교하여 항공 배터리 산업이 단일 성능 지표의 혁신을 추구하는 것에서 항공 등급의 종합적인 성능 및 엔지니어링 역량을 향상시키는 방향으로 나아가고 있다고 믿습니다. 하지만 배터리가 대량생산되고 항공기가 상용화(실제로 팔고 쓰이기 시작하는 것)되기까지는 넘어야 할 난관이 여전히 많다."},{"s":"일본은 전고체 전지로 패권을 취할 수 있는지, LFP 전지의 역사가 나타내는 교훈","so":"日経クロステック","tm":"11/27 05:00","c":1,"r":"jp","u":"https://xtech.nikkei.com/atcl/nxt/column/18/02421/112400138/","p":1795723200,"a":1795733617,"t":"日本は全固体電池で覇権を取れるのか、LFP電池の歴史が示す教訓","su":"지금 세계의 정치용 축전지의 90% 초과, 전기 자동차(EV)용 축전지의 50% 초과를, LFP(인산철(값싸고 불에 강한 배터리 재료) 리튬(배터리에 꼭 들어가는 아주 가벼운 금속), LiFePO4)를 정극재에 이용한 리튬 이온 전지가 차지한다. 그리고 LFP 전지 시장은 중국 메이커가 석권하고 있다."},{"s":"베이징자동차는 CATL과의 관계가 심화됨에 따라 112개의 배터리 교체 스테이션 자산을 매각할 계획입니다.","so":"AutoTechInsight","tm":"11/27 00:03","c":1,"r":"world","u":"https://autotechinsight.spglobal.com/news/5291612/baic-plans-sale-of-112-battery-swap-station-assets-as-catl-ties-deepen","p":1795705388,"a":1795733620,"t":"BAIC plans sale of 112 battery-swap station assets as CATL ties deepen","su":"전체 지분(회사를 나눠 가진 몫)을 소유한 자회사(다른 회사가 주인인 회사)는 세금을 제외하고 최소한 자산 평가 가치인 약 2억 7,800만 위안을 추구할 것입니다."},{"s":"CATL 기술은 Ford 공장에 라이센스가 부여되었습니다. 이번 금지 조치로 중국 기업의 해외 진출을 막을 수는 없다. 중국 배터리, 무역 금지-36Kr의 높은 벽을 극복했습니다","so":"36kr","tm":"11/26 20:59","c":1,"r":"cn","u":"https://www.36kr.com/p/4087421880948352","p":1795694340,"a":1795762636,"t":"宁德时代技术授权福特工厂，禁令挡不住中国企业的出海，中国电池翻过贸易禁令的高墙-36氪","su":"CATL 기술은 포드 공장에 라이센스가 부여되었지만 금지 조치로 인해 중국 기업의 해외 진출을 막을 수는 없습니다. 중국 배터리는 무역 금지 조치를 극복했습니다. Ford는 CATL 인증 기술을 사용하여 LFP(값싸고 불에 강한 배터리 종류(인산철)) 배터리를 대량 생산합니다. 이는 관세 및 지분 검토를 피하기 위해 중국의 신에너지 해외 시장에서 제품 판매에서 기술 라이센스로의 전환을 반영합니다. Foresight Energy는 11월 24일 Ford의 Michigan BlueOval Battery Park 공장이 CATL 인증 기술을 사용하여 인산철(값싸고 불에 강한 배터리 재료)리튬 각형 배터리의 대량 생산을 시작했다는 사실을 알게 되었습니다. 생산 라인은 분당 40개의 배터리를 생산할 수 있습니다. 첫 번째 배터리 배치는 Fathom 프로토타입 자동차에 사용하기 위해 Louisville로 보내졌습니다. Ford는 주식을 보유하지 않으며 CATL은 라이센스 비용을 청구합니다. 생산 라인은 분당 40개를 생산하며, Ford는 이 라인이 중국 외 지역에서 가장 빠른 정사각형 LFP 라인 중 하나라고 말합니다. 공장의 재산권, 기계, 근로자 및 감가상각비는 모두 Ford에 속합니다. CATL은 소유권을 갖고 있지 않습니다. 엔지니어를 보내고, 장인의 기술을 넘겨주고, 단위당 돈을 모으는 것뿐입니다."},{"s":"AIDC 전력 수요 급증, 주요 배터리 제조업체가 새로운 컴퓨팅 전력 트랙을 놓고 경쟁","so":"第一财经","tm":"11/26 20:23","c":1,"r":"cn","u":"https://www.yicai.com/news/103454565.html","p":1795692187,"a":1795694299,"t":"AIDC用电需求激增 头部电池厂商角逐算力新赛道","su":"제일재경 2026-11-26 07:44:34 편집자: Zhou Ling 증권시보에 따르면 인공지능 데이터센터(AIDC)의 전력 수요 급증이 리튬(배터리에 꼭 들어가는 아주 가벼운 금속) 배터리 산업을 새로운 추세로 몰고 가고 있습니다. 올해 초부터 AIDC 분야의 리튬 배터리 주문이 집중적으로 체결되었으며 많은 주요 배터리 제조업체가 새로운 컴퓨팅 파워 트랙에서 경쟁하기 위해 특수 제품을 출시했습니다. 업계 관계자는 AIDC 분야에서 리튬 배터리의 역할이 과거 비상 백업부터 전력 안정화, 단기 전원 공급, 에너지 급전 등 전체 체인으로 확대돼 시장의 새로운 성장축으로 자리잡고 있다고 전했다. 그러나 앞으로 AIDC 경쟁의 초점은 제품 성능에만 국한되지 않을 것입니다. 시스템 구축, 현지화된 납품(만든 물건을 주문한 곳에 넘기는 것), 전체 수명 주기 운영 및 유지 관리 능력은 모두 차별화를 위한 핵심 변수가 될 것입니다."},{"s":"포지션 펀드는 고점 대비 331억 위안 감소했으며, 탄산리튬 선물과 현물은 올해 최저치를 경신했다.","so":"AAStock","tm":"11/26 20:16","c":1,"r":"hk","u":"https://www.aastocks.com/tc/stocks/news/glh-news/GLH2781403L/1","p":1795691760,"a":1795694305,"t":"持倉資金較峯值回落331億元 碳酸鋰期貨、現貨再創年內新低","su":"11월 26일 | 21파이낸스에 따르면 리튬염 제품 가격은 올해에도 계속해서 최저치를 경신했다. 11월 26일, 탄산리튬(배터리 재료로 쓰는 리튬 가루) 선물(미래 값을 미리 정해 사고파는 거래)의 주요 2701 계약은 다시 3.16% 하락했으며 최근 가격은..."},{"s":"스즈키는 중국 공급 위험 속에 희귀 금속 없는 배터리로 전환","so":"Nikkei Asia","tm":"11/26 18:23","c":1,"r":"us","u":"https://asia.nikkei.com/business/automobiles/electric-v
