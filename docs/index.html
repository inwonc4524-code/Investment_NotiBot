<style>
@font-face{font-family:'ChosunIlboMyungjo';src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_one@1.0/Chosunilbo_myungjo.woff') format('woff');font-weight:normal;font-display:swap}
:root{color-scheme:dark;--bg:#262624;--card:#30302e;--card2:#3a3a37;--text:#faf9f5;--sub:#a6a39a;--line:#3e3e3a;--acc:#d97757;--red:#ef4444}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.55 'ChosunIlboMyungjo',Georgia,"Noto Serif KR",serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:760px;margin:auto}
header{padding:20px 16px 8px}
h1{font:600 22px/1.3 'ChosunIlboMyungjo',Georgia,serif;margin:0 0 4px}
.upd{color:var(--sub);font-size:12.5px}
/* 테마 탭 */
.tabs{position:sticky;top:0;z-index:3;background:rgba(38,38,36,.96);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.tabrow{display:flex;gap:8px;overflow-x:auto;padding:12px 16px 10px;scrollbar-width:none}.tabrow::-webkit-scrollbar{display:none}
.tab{position:relative;flex:none;padding:9px 15px;border-radius:12px;border:1px solid var(--line);background:var(--card);
  color:var(--sub);font:inherit;font-size:14px;cursor:pointer}
.tab b{margin-left:5px;color:var(--sub);font-weight:400;font-size:12px}
.tab.on{background:var(--acc);border-color:var(--acc);color:#1f1e1d;font-weight:600}.tab.on b{color:#1f1e1d}
.dot{position:absolute;top:-3px;right:-3px;width:11px;height:11px;border-radius:50%;background:var(--red);border:2px solid var(--bg)}
/* 정렬·국가 */
.ctrl{display:flex;gap:6px;overflow-x:auto;padding:0 16px 10px;scrollbar-width:none}.ctrl::-webkit-scrollbar{display:none}
.ctrl button{flex:none;border:1px solid var(--line);background:transparent;color:var(--sub);border-radius:8px;padding:5px 11px;font:inherit;font-size:12.5px}
.ctrl button.on{background:var(--card2);border-color:var(--card2);color:var(--text)}
.ctrl .sep{flex:none;width:1px;background:var(--line);margin:2px 4px}
main{padding:6px 12px 48px}
h2{font:600 19px/1.3 'ChosunIlboMyungjo',Georgia,serif;margin:16px 4px 2px}
.note{margin:0 4px 10px;color:var(--sub);font-size:12px}
.none{color:var(--sub);margin:24px 4px;text-align:center}
.card{display:block;background:var(--card);border-radius:12px;padding:12px 14px;margin:8px 0;color:var(--text);text-decoration:none;transition:background .15s}
.card:hover{background:var(--card2)}.card:active{opacity:.75}
.meta{color:var(--sub);font-size:12px}
.title{font-weight:500;margin-top:3px}
.orig{color:var(--sub);font-size:12px;margin-top:3px}
.new{margin-left:4px;color:var(--red);font-size:11px;font-weight:700;letter-spacing:.3px}
.hot{display:inline-block;margin-right:6px;padding:0 6px;border-radius:4px;background:rgba(217,119,87,.16);color:var(--acc);font-weight:600}
.hot.big{background:var(--acc);color:#1f1e1d}
.newbar{display:block;width:100%;margin:2px 0 6px;padding:9px;border:0;border-radius:10px;background:rgba(239,68,68,.14);color:#fca5a5;font:inherit;font-size:13px;text-align:left}
.more{display:block;width:100%;margin:4px 0 0;padding:10px;border:1px dashed var(--line);border-radius:12px;background:transparent;color:var(--sub);font:inherit;font-size:13px}
footer{margin:36px 4px 0;padding-top:14px;border-top:1px solid var(--line);color:var(--sub);font-size:12px;line-height:1.7}
footer b{color:var(--text);font-weight:600}
/* 요약 창 */
#dim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:5}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:6;max-width:760px;margin:auto;max-height:82vh;overflow-y:auto;
  background:var(--card);border-radius:16px 16px 0 0;padding:10px 18px calc(18px + env(safe-area-inset-bottom));box-shadow:0 -8px 30px rgba(0,0,0,.4)}
.grab{width:38px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 12px}
.s-title{font-size:17px;font-weight:600;margin:4px 0 2px;line-height:1.45}
.s-label{margin:16px 0 4px;color:var(--acc);font-size:12px;font-weight:700;letter-spacing:.5px}
.s-sum{font-size:15px;line-height:1.75}.s-sum.empty{color:var(--sub);font-size:13.5px}
.s-btns{display:flex;gap:8px;margin-top:20px}
.s-btns a{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;padding:11px 6px;border-radius:10px;font:inherit;font-size:13.5px;line-height:1.3;text-decoration:none;
  background:var(--acc);color:#1f1e1d;font-weight:600}
.s-btns a.cl{background:transparent;border:1px solid var(--acc);color:var(--acc)}
.s-close button{width:100%;margin-top:8px;padding:11px;border-radius:10px;background:transparent;border:1px solid var(--line);color:var(--sub);font:inherit;font-size:14px}
.s-cnote{margin-top:8px;color:var(--sub);font-size:11.5px;text-align:center}
#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);z-index:9;max-width:90%;padding:10px 16px;border-radius:10px;background:#faf9f5;color:#1f1e1d;font-size:13.5px;box-shadow:0 6px 20px rgba(0,0,0,.4)}
</style></head><body>

승하는 등 미국 3대 주가지수가 상승세를 이어갔다.","so":"etnet 經濟通","tm":"11/12 05:02","c":11,"r":"hk","u":"https://www.etnet.com.hk/www/tc/us-stocks/news-article/416418/%E7%BE%8E%E8%82%A1%E5%B0%BE%E7%9B%A4+%7C+%E7%BE%8E%E8%82%A1%E4%B8%89%E5%A4%A7%E6%8C%87%E6%95%B8%E7%BA%8C%E5%90%91%E4%B8%8A%EF%BC%8C%E7%B4%8D%E6%8C%87%E5%8D%871.8%25","p":1794427320,"a":1794459116,"t":"美股尾盤 | 美股三大指數續向上，納指升1.8%"},{"s":"<미국 주식아침거래> 황런순 사퇴로 시장 충격! 주요지수 하락, 후이다 7% 이상 하락","so":"鉅亨網","tm":"11/12 23:44","c":6,"r":"tw","u":"https://news.cnyes.com/news/id/6660731","p":1794494698,"a":1794496105,"t":"〈美股早盤〉黃仁勳辭職震撼市場！主要指數走低、輝達跌逾7%","su":"Huida는 Huang Renxun이 CEO직을 사임하고 이사회에서 물러났다고 발표했습니다. 시장 개장 전 주가는 8% 이상 하락해 S&P500(미국 큰 회사 500곳 지수), 나스닥(미국 기술 회사들이 많은 주식시장), 페덱스 지수를 끌어내렸습니다.\n트럼프 대통령은 이란과 합의할 필요가 없다고 말했다. 브렌트유는 94달러까지 올랐고, 미국 채권수익률은 5.02%까지 올랐고, 금은 3,909달러까지 하락했다.\n시장에서는 AI 생태계에 미칠 영향을 우려하고 있다. AMD와 브로드컴은 추세를 거스르고 상승한 반면 CoreWeave와 Nebius는 자금 조달 및 전망으로 인해 압박을 받았습니다."},{"s":"미국 주식: 엔비디아의 주가 하락이 에너지 이익보다 더 크기 때문에 주식은 하락 마감","so":"The Business Times","tm":"11/13 06:56","c":4,"r":"us","u":"https://www.businesstimes.com.sg/companies-markets/capital-markets-currencies/us-stocks-equities-close-lower-nvidia-drop-outweighs-energy-gains","p":1794520560,"a":1794523767,"t":"US stocks: Equities close lower as Nvidia drop outweighs energy gains","su":"시장은 12월 연준(미국의 중앙은행)의 최소 0.25%포인트(퍼센트 숫자 자체의 차이) 인상을 완전히 반영합니다. The Business Times에서 자세한 내용을 읽어보세요."},{"s":"미국 증시는 마감했고 후이다지수는 4.3% 하락해 3대 지수를 하락시켰다. 에너지주는 4차례 연속 상승하며 AI주 매도압력을 이기지 못했다.","so":"鉅亨網","tm":"11/13 07:39","c":3,"r":"tw","u":"https://news.cnyes.com/news/id/6661169","p":1794523172,"a":1794523783,"t":"美股收盤／輝達跌4.3%拖累三大指數能源股連四漲難敵AI股賣壓","su":"Uanalyze 2026년 11월 13일 (Uanalyze/산업데이터센터(컴퓨터 수만 대를 모아 둔 건물) 보고서) ⸺ 목요일(11월 12일) 미국 3대 주가지수가 동시에 하락세로 마감했습니다. NVDA-US CEO 황젠순(Huang Jenxun)의 사임으로 인한 매도압력은 계속됐다. 주가는 장중 최저치에서 반등했지만 여전히 시장을 끌어내렸습니다. 유가가 강세를 보이면서 에너지주는 나흘 연속 상승했지만, 시장은 금요일 미국 생산자물가지수(PPI) 발표를 기다리는 가운데 AI 관련주의 손실을 상쇄하지 못했습니다. 다우존스산업평균지수는 189.40포인트 하락해 0.36% 하락한 52,297.09포인트로 마감했다. S&P500(미국 큰 회사 500곳 지수) 지수는 26.98포인트 하락해 0.35% 감소한 7,592.40포인트로 마감했습니다. 나스닥지수는 100.10포인트 하락한 25,366.09포인트로 마감했다. 미국 거래소 거래량은 191억8000만주로 지난 20거래일 평균 186억1000만주를 넘어섰다."},{"s":"Huida의 하락은 에너지주의 상승을 상쇄하고 미국 주식은 하락세로 마감 | 글로벌 금융 | 글로벌","so":"UDN","tm":"11/13 07:18","c":3,"r":"tw","u":"https://udn.com/news/story/6811/9875810","p":1794521881,"a":1794523780,"t":"輝達下挫抵銷能源股漲勢美股收低| 全球財經| 全球","su":"미국 주요 주식시장 지수는 오늘 하락세로 마감했습니다. 주로 칩 대기업 엔비디아(엔비디아)의 젠슨 황(Jensen Huang) CEO가 사임한 후 회사 주가가 하락하면서 시장이 하락세를 보인 반면, 에너지주는 충분히 오르지 않았기 때문입니다."},{"s":"월스트리트, 후이다 강등, 목표주가 절반으로 하향","so":"經濟日報","tm":"11/13 04:27","c":3,"r":"tw","u":"https://money.udn.com/money/story/123398/9875610","p":1794511672,"a":1794523781,"t":"華爾街降評輝達 目標價砍半","su":"Huida 창립자 Huang Renxun이 모든 직책에서 사임했습니다. 월스트리트는 '황런쉰 없는 휘다'가 여전히 높은 평가를 받을 이유가 있는지 추정하기 시작했다. 애널리스트들은 후이다의 주가에 대한 목표주가나 전망을 잇달아 낮췄다. 일부는 휘다 목표주가를 칼 휘두르며 반토막이 냈다."},{"s":"미국 3대 주가지수 상승세, 엔비디아 손실 축소","so":"第一财经","tm":"11/13 00:26","c":3,"r":"cn","u":"https://www.yicai.com/news/103438914.html","p":1794497160,"a":1794523771,"t":"美股三大指数转涨 英伟达跌幅收窄","su":"{{aisd}} AI가 면책조항 23:59 다우지수가 0.27%, 나스닥이 0.1%, S&P500(미국 큰 회사 500곳 지수)이 0.15% 상승하는 등 미국 3대 주가지수가 전반적으로 상승했습니다. 23:57 S&P500 지수는 상승세를 보였고 다우 지수는 0.15% 상승했으며 나스닥 지수는 0.03% 하락했습니다. 필라델피아 반도체(전자기기의 두뇌 부품) 지수는 브로드컴이 5% 이상, AMD가 4% 이상 상승하는 등 상승세를 보였다. 23:50 다우지수는 상승, S&P는 0.07% 하락, 나스닥은 0.22% 하락했습니다. 23:42 필라델피아 반도체 지수는 하락 폭을 좁혀 현재 1.35% 하락했습니다. 마이크론테크놀로지는 4% 이상 하락했고, AMD는 2% 이상 상승했다. 23:30 보도에 따르면 트럼프는 쿡이 황 젠슨의 뒤를 이어 엔비디아 CEO가 되어야 한다고 말했습니다."},{"s":"엔비디아 난기류로 인해 AI 주식이 불안해지면서 나스닥, S&P500 선물 하락","so":"Reuters","tm":"11/12 21:26","c":3,"r":"us","u":"https://www.reuters.com/business/nasdaq-futures-fall-nvidia-turmoil-rattles-ai-stocks-2026-11-12/","p":1794486396,"a":1794489600,"t":"Nasdaq, S&P 500 futures fall as Nvidia turbulence unsettles AI stocks"},{"s":"월스트리트는 황의 P(둠)를 재계산하고 있다","so":"信報網站","tm":"11/12 03:10","c":3,"r":"hk","u":"https://m.hkej.com/landing/mobarticle2?id=4563416","p":1794420652,"a":1794467081,"t":"華爾街正重算黃仁勳的P（doom）","su":"지난 토요일(7일) 뉴욕타임스의 조사 보고서는 이 컴퓨팅 파워 게임의 무화과 잎을 무화과로 찢었습니다. 이야기의 출발점은 베이징 북서쪽의 폐허가 된 산업단지이다. H200 칩 조립업체의 등록된 주소는 빈 건물이다. 올해 미국 상무부의 승인을 받은 베이징 소재 회사이자 엔비디아 H200 칩을 서버에 조립하는 전문 회사인 New Matrix는 설립된 지 17개월밖에 되지 않았습니다. 신고인은 등록된 주소를 찾아가다 천장에 사이딩 몇 개만 매달려 있는 텅 빈 사무실 건물을 발견했다."},{"s":"엔비디아의 채찍질에서 주식이 회복되고 달러는 미국 수익률과 함께 상승합니다.","so":"The Straits Times","tm":"11/13 11:35","c":2,"r":"sg","u":"https://www.straitstimes.com/business/stocks-recover-from-nvidia-whiplash-dollar-climbs-with-us-yields","p":1794537300,"a":1794539790,"t":"Stocks recover from Nvidia whiplash, dollar climbs with US yields","su":"엔비디아 CEO 젠슨 황(Jensen Huang)의 퇴임은 미국 칩 수출 정책과 AI 산업에 광범위한 영향을 미칠 수 있습니다. straitstimes.com에서 자세한 내용을 읽어보세요."},{"s":"황런쉰 사임 이후 시장이 흔들렸다. 미국 주요 3대 주가지수가 모두 하락했다. 엔비디아는 4% 이상 문을 닫았습니다. 원유 공급량 증가, 유가 상승 우려","so":"etnet 經濟通","tm":"11/13 10:06","c":2,"r":"hk","u":"https://www.etnet.com.hk/www/tc/news/news-article.php?section=features&category=focus&newsid=416631","p":1794531960,"a":1794539773,"t":"黃仁勳辭職市場震盪，美股三大指數全跌，英偉達收市挫逾4%，原油供應添擔憂油價升","su":"Jen-Hsun Huang이 사임한 후 시장이 흔들렸습니다. 미국 주요 3대 주가지수가 모두 하락했다. 엔비디아는 4% 넘게 문을 닫았고, 원유 공급이 늘면서 유가 상승 우려가 커지고 있다. 목요일(12일) 미국 증시는 기술주 변동성(값이 크게 출렁이는 정도)과 지정학적 리스크에 영향을 받았습니다. 미국 3대 주요 주가지수는 모두 전반적으로 하락세를 보였지만 장 마감 전에 하락폭이 축소됐다. 엔비디아(US.NVDA) 공동 창립자이자 CEO인 Jensen Huang이 사임을 발표했습니다. 이 소식은 한때 주가를 최대 14%까지 끌어내렸으며, 마감 하락폭은 4.3%로 좁혀졌습니다. 트럼프 미국 대통령이 이란과 합의할 필요가 없다고 말해 중동 정세와 에너지 수급에 대한 시장의 우려가 커지고 국제유가 반등이 촉진됐다. 미국 주식은 엔비디아에 대한 예상치 못한 소식으로 인해 이른 시간에 크게 하락했습니다. 이후 일부 기술주와 에너지주가 반등하면서 시장의 손실이 축소되었습니다. 미국 3대 증시가 모두 하락세로 마감했다. 다우지수는 189.4포인트(0.36%) 하락한 52297.09포인트를 기록했습니다. S&P500(미국 큰 회사 500곳 지수)은 26.98포인트(0.35%) 하락한 7592.4포인트를 기록했습니다. 나스닥지수는 100.1포인트(0.39%) 하락한 25366.09포인트를 기록했다."},{"s":"[우리를. 주식 마감] 젠슨 황의 세 번째 혼외정사가 사임 이후 드러났다. 엔비디아는 4% 이상 하락했고, 네비우스는 16.8% 하락했으며, AMD는 5.9% 상승했고, 다우지수는 189포인트 하락했다.","so":"香港經濟日報HKET","tm":"11/13 07:36","c":2,"r":"hk","u":"https://inews.hket.com/article/4222033/%E3%80%90%E7%BE%8E%E8%82%A1%E6%94%B6%E5%B8 장 큰 챔피언 없이 물러난다고 발표한 후 목요일 월스트리트의 주요 지수는 하락세로 출발했습니다. 다우존스 산업평균지수는 58.5포인트(0.11%) 하락한 52,427.94를 기록했습니다."},{"s":"미국 고용 및 인플레이션 데이터는 모두 예상을 뛰어넘었고, 연준의 금리 인상에 대한 기대가 높아져 귀금속의 단기 성과가 억제되었습니다(Wan Liang).","so":"第一财经","tm":"11/12 16:12","c":2,"r":"cn","u":"https://www.yicai.com/video/103438116.html","p":1794467563,"a":1794496104,"t":"美就业与通胀数据双超预期，美联储加息预期升温压制贵金属短期表现（万亮）","su":"차이나비즈니스뉴스 공식 홈페이지에서는 주식시장 상황, 경제동향, 금융정책, 산업동향, 전문가 분석 등 금융정보를 24시간 365일 제공하고 있다. 또한 주식 토크 및 금융, 오늘의 주식 시장, 기업 및 산업, 금융 해독, 브레인스토밍 등 중국 비즈니스 네트워크 TV 프로그램의 독점 생방송을 방송합니다."},{"s":"미국 인플레이션이 예상보다 높으며, 중국 은행은 연준이 연말까지 금리를 인상할 것으로 예상하고 있습니다.","so":"udn","tm":"11/12 13:41","c":2,"r":"tw","u":"https://udn.com/news/story/7239/9874011","p":1794458505,"a":1794459103,"t":"美國通膨高於預期 國銀估聯準會年底升息機率增","su":"10월 미국 소비자 물가는 시장 예상보다 높게 올랐고, 연준(미국의 중앙은행) 관계자들은 연달아 매파적 신호를 내놓으며 지속적인 금리(돈을 빌릴 때 내는 이자 비율) 인상에 대한 시장 기대를 더욱 강화했습니다. CDB 분석에 따르면 크리스토퍼 월러 연준(FRB) 총재는 12월 금리를 2% 인상할 가능성을 배제하지 않았고 로리 로건 댈러스 연은 총재는 금리를 추가로 1% 인상할 것을 지지했다. 그러나 현재 시장에서는 12월 금리가 2% 인상될 가능성은 약 10%에 불과하다고 추정하고 있다."},{"s":"미국 AI 메모리 주가 급등! Phonline은 자사주 5억 4천만주를 매입했습니다. 외국인투자 목표주가는 왜 반토막났나?","so":"udn","tm":"11/12 12:19","c":2,"r":"tw","u":"https://udn.com/news/story/7252/9873715","p":1794453586,"a":1794459101,"t":"美股 AI 記憶體股狂飆！群聯庫藏股買回5.4億 外資目標價為何腰斬？","su":"미국 AI와 메모리주는 페덱스지수가 5.66% 상승하는 등 강하게 반등했다. 마이크론, 샌디스크, SK하이닉스가 급등하며 대만 메모리그룹이 12일 동시 상승세(오르는 흐름)를 이어갔다. 이 가운데 파이슨(8299)의 자사주 매입 누계액은 5억4400만 위안에 달했지만, 외국인 투자자들은 목표주가를 48% 낮췄다. 회사가 AI 스토리지를 적극적으로 도입함에 따라 시장에서는 실적 전망(회사가 내놓은 앞으로의 실적 예상)에 대해 다른 해석을 하고 있습니다."},{"s":"월스트리트는 후이다의 최고재무책임자(CFO)가 임시 CEO를 맡을 것이라고 낙관하고 있지만 회사의 전망은 여전히 ​​불투명하다.","so":"鉅亨網","tm":"11/13 11:30","c":1,"r":"tw","u":"https://news.cnyes.com/news/id/6661139","p":1794537006,"a":1794539765,"t":"華爾街看好輝達財務長出任臨時CEO 但公司前景仍蒙上陰影","su":"월스트리트는 후이다의 최고재무책임자(CFO)가 임시 CEO가 될 것이라고 낙관하고 있지만 회사의 전망은 여전히 ​​불투명하다. Juheng.com과 Chen Youjia가 편집했습니다. 야후 파이낸스(Yahoo Finance)는 엔비디아(NVDA-US)가 목요일(12일) 콜레트 크레스 최고재무책임자(CFO)가 임시 CEO를 맡는다고 발표했다고 보도했습니다. 월스트리트 분석가들은 일시적으로 안도감을 느꼈다. 이전에는 황런순(Huang Renxun)이 중국 간첩으로 의심되는 인물 및 후이다(Huida) 고위 간부와 부적절한 관계를 맺었다는 사실이 밝혀진 후 CEO직을 사임했습니다. Kress는 Huida의 오랜 최고재무책임자(CFO)였으며 회사가 혼란에 빠진 시기에 회사를 안정시킬 수 있는 믿음직한 인물로 평가받고 있습니다. 월스트리트 관측자들은 Huida가 기존 제품 레이아웃 덕분에 AI 경쟁이 시작된 이후 단기적으로는 여전히 강력한 수익 실적(회사가 번 돈 성적표)을 유지할 것이라고 지적했습니다."},{"s":"Huida는 월스트리트에서 해고되었습니다! 많은 기관들이 목표 가격을 집단적으로 낮추었는데, 가장 심한 인하는 60%였습니다.","so":"工商時報","tm":"11/13 11:18","c":1,"r":"tw","u":"https://www.ctee.com.tw/news/20261113700649-430704","p":1794536280,"a":1794539767,"t":"輝達遭華爾街開鍘！多家機構集體下修目標價 最狠一刀砍60％","su":"엔비디아 창립자 Jensen Huang이 CEO직 사임을 발표하면서 시장에서는 AI 칩 리더의 미래 전망을 재평가하기 시작했습니다. 월스트리트 애널리스트들도 목표주가를 잇달아 낮췄다. Benzinga에 따르면 11월 12일 최소 9개 대형 금융 기관이 엔비디아의 목표 가격을 낮췄습니다. 평균 목표 가격은 약 US$343에서 US$217로 하락했는데, 이는 일일 하향 조정치로 37%입니다. 그 중 에버코어 ISI..."},{"s":"엔비디아 격변 이후 아시아 기술주 반등","so":"The Business Times","tm":"11/13 11:11","c":1,"r":"sg","u":"https://www.businesstimes.com.sg/companies-markets/capital-markets-currencies/asian-tech-stocks-rebound-after-nvidia-upheaval","p":1794535860,"a":1794539792,"t":"Asian tech stocks rebound after Nvidia upheaval","su":"엔비디아의 격변은 광범위한 투자 붐을 방해하지 않고 AI 거래를 테스트하고 있습니다. The Business Times에서 자세히 알아보세요."},{"s":"엔비디아, Oil의 조심스러운 개장을 앞두고 있는 아시아 주식: 시장이 마감되었습니다.","so":"Bloomberg.com","tm":"11/13 10:59","c":1,"r":"us","u":"https://www.bloomberg.com/news/articles/2026-11-12/stock-market-today-dow-s-p-live-updates","p":1794535140,"a":1794539753,"t":"Asian Stocks Set for Cautious Open on Nvidia, Oil: Markets Wrap"},{"s":"연준은 2027년 10월 회의에서 금리 결정을 포기할 예정","so":"WSJ","tm":"11/13 10:57","c":1,"r":"us","u":"https://www.wsj.com/economy/central-banking/federal-reserve-to-forgo-rate-decision-at-october-2027-meeting-99c5523f","p":1794535045,"a":1794539754,"t":"Federal Reserve to Forgo Rate Decision at October 2027 Meeting"},{"s":"Jen-Hsun Huang의 사임으로 미국 주식이 타격을 입었지만 대만 주식은 1,000포인트 이상 반등했습니다! MediaTek의 ASIC이 일일 한도에 도달하고 빨간색 표시등이 깜박입니다.","so":"UDN","tm":"11/13 10:16","c":1,"r":"tw","u":"https://udn.com/news/story/7251/9876008","p":1794532596,"a":1794539768,"t":"黃仁勳辭職衝擊美股、台股卻強彈逾千點！聯發科漲停 ASIC 刷一排紅燈","su":"미국 4대 주가지수는 어젯밤 모두 흑자로 마감했다. Huida CEO Huang Renxun의 사임은 시장에 충격을 주었습니다. 후이다의 주가는 4% 이상 하락하며 AI 관련주 실적(회사가 번 돈 성적표)을 끌어내렸다. 그러나 대만 지수 선물은 추세를 거스르고 야간 거래에서 548포인트 급등해 대만 증시는 13일 상승세(오르는 흐름)를 보이며 627.88포인트 상승한 43,719.75포인트에 개장했습니다."},{"s":"시판 전 전략 | Huang Renxun 사임, 미국 주식은 약하게 반등했으며 다음 주 큰 수익을 기다려보고 홍콩 주식은 통합 될 것으로 예상됩니다","so":"etnet 經濟通","tm":"11/13 10:15","c":1,"r":"hk","u":"https://www.etnet.com.hk/www/tc/news/news-article.php?newsid=416634","p":1794532500,"a":1794539775,"t":"盤前攻略 | 黃仁勳請辭美股反彈無力，觀望下周重磅業績港股料整固","su":"시판 전 전략 | Jen-Hsun Huang이 사임하고 미국 주식은 약하게 반등했으며 다음 주 블록버스터 실적(회사가 번 돈 성적표)을 지켜보고 홍콩 주식은 통합될 것으로 예상됩니다. 엔비디아(US.NVDA) 설립자 Jen-Hsun Huang은 고위 고객 및 회사 부하 직원과 관련된 여러 혼외정사에 노출되었습니다. 이번 사건은 기업지배구조와 국가안보에 대한 심각한 우려를 불러일으켰다. 이사회의 압력으로 Huang Jen-Hsun은 CEO 겸 이사직을 사임한다고 발표했습니다. 엔비디아의 주가는 목요일에 14% 이상 급락했고, 4% 하락하며 나스닥(미국 기술 회사들이 많은 주식시장)을 끌어내렸습니다. 트럼프 미국 대통령은 미국이 이란과 합의할 필요가 없다고 밝혔는데, 유가는 이란 남부 도시들에 대한 공격이 보고되면서 처음에는 하락했다가 상승했다. 또한, 최근 주에 미국에서 실업 수당을 신청하는 사람의 수가 증가했습니다. 10월 기존 주택 매매는 감소해 연간 375만 채로 2010년 이후 최저치를 기록했습니다. 목요일 미국 증시는 약하게 반등했으며 다우존스 산업평균지수는 189포인트(0.36%) 하락한 52,297포인트로 마감했습니다. 나스닥 종합지수는 0.39% 하락한 25,366포인트를 기록했습니다. S&P 지수는 0.35% 하락한 7,592포인트를 기록했습니다."},{"s":"홍콩 주식 모닝 포스트 | 당해 연도 자사주 매입 규모는 HK$1,300억을 초과했으며, 중국 컨셉 주식은 밤새 미국 주식에서 종합적으로 약세를 보였습니다.","so":"财联社","tm":"11/13 10:07","c":1,"r":"cn","u":"https://www.cls.cn/detail/2533352","p":1794532020,"a":1794539758,"t":"港股早报｜年内回购金额超1300亿港元 隔夜美股中概股集体走弱","su":"① 하룻밤 사이에 미국 주식과 중국 컨셉주가 종합적으로 약세 ② 그해 홍콩 주식 매입액이 HK$1300억 초과 ③ New World Development가 거래 일시 정지 발표 ④ 황런쉰 사임 엔비디아의 시가총액(회사 전체 몸값)이 수조 달러 증발 Hot focus 1. 허야동 상무부 대변인은 12일 상무부 정례 기자간담회에서 “300억~300억”이라고 밝혔다. 상호 세금 감면 프레임워크 협정은 중미 양국 무역을 안정시키고 확대하는 데 도움이 되며, 중미 경제계는 이에 대해 높은 기대를 갖고 있습니다. 현재 중국과 미국은 이 합의 이행에 관해 긴밀한 소통을 유지하고 있습니다. 경제무역협상과 관련해 중국과 미국은 무역, 투자 등 분야에서 각자의 관심 사항에 대해 긴밀한 소통을 유지하고 있으며 관련 진전은 조만간 발표될 예정이다. 2. 최근 업계 연구기관과 상장 스토리지업체 임원들은 메모리반도체(전자기기의 두뇌 부품) 가격 상승세는 지속될 것으로 예상되며 단기적으로 완화되기 어렵다는 의견을 피력했다. 그러나 이제 다양한 다운스트림 시장의 제품 수요가 차별화되어 가전제품 시장의 수요가 계속해서 억제될 것으로 예상됩니다. 트렌드포스가 최근 발표한 메모리 업계 조사에 따르면 10월 범용 D램 제품 평균 계약가격은 전월 26달러보다 5.77% 올랐다."},{"s":"Fed의 Daley는 금리를 다시 인상하는 것을 선호합니다. 시간을 벌기 위해 채권 금리가 오르고, 인플레이션 압력은 서비스업으로 확대될 전망이다.","so":"鉅亨網","tm":"11/13 10:00","c":1,"r":"tw","u":"https://news.cnyes.com/news/id/6661285","p":1794531614,"a":1794539770,"t":"聯準會戴莉傾向再升息債息走高爭取時間、通膨壓力擴及服務業","su":"Fed Daly는 채권 금리 인상과 인플레이션(물건값이 계속 오르는 것) 압력이 서비스 산업으로 확대될 시간을 벌기 위해 금리를 다시 인상하는 것을 선호합니다. Uanalyze 2026년 11월 13일(Uanalyze/산업데이터센터(컴퓨터 수만 대를 모아 둔 건물) 보고서) ⸺ Mary Daly 샌프란시스코 연준 총재는 최근 미국의 인플레이션 압력이 에너지 및 원자재에서 서비스 산업으로 확산되고 있으며 추가 금리 인상이 필요하다고 밝혔습니다. 그러나 채권수익률 상승으로 금융여건이 긴축됐고, 연준은 금리 인상 규모와 시기를 평가할 시간이 더 많아지니 성급하게 결정할 필요는 없다. 댈리는 스탠포드 경제정책연구소 행사에서 노동시장이 안정적이고 경제도 잘 성장하고 있지만 인플레이션은 여전히 ​​분명한 문제라고 지적했다. 최근 에너지 가격 하락으로 전반적인 인플레이션이 냉각되었음에도 불구하고 식품과 에너지를 제외한 핵심 가격은 많은 경제학자와 정책 입안자들의 예상만큼 둔화되지 않았습니다."},{"s":"미국 주식 시간외 표현: 3대 주요 주가 지수 선물이 상승했습니다. 7개 기술 대기업과 메모리 칩 주가 모두 상승세를 보였고 엔비디아는 1% 이상 상승했으며 SanDisk는 2% 이상 상승했습니다. 미국 원유 소폭 하락, 금과 은 차별화","so":"21财经","tm":"11/13 09:54","c":1,"r":"cn","u":"https://www.21jingji.com/article/20261113/herald/73183f5b6feb47b48fffc83d8683d1ec.html","p":1794531240,"a":1794539760,"t":"美股盘后速递：三大股指期货上涨；科技七巨头、存储芯片股全线转涨，英伟达涨超1%，闪迪涨超2%；美油微跌，金银分化","su":"베이징 시간으로 13일 미국 증시가 마감된 뒤 3대 주가지수 선물이 상승했다. 7대 기술 대기업과 메모리 칩 주가 상승했고, 엔비디아는 1% 이상 상승했으며, SanDisk는 2% 이상 상승했습니다. 미국 원유는 소폭 하락했고, 금과 은은 갈라졌습니다. 3대 주가지수 선물이 상승했습니다. 미국 주식시장이 마감된 후 3대 주가지수 선물이 상승했습니다. 보도 시간 현재 다우 선물은 0.18%, 나스닥 선물은 0.56%, S&P500(미국 큰 회사 500곳 지수) 선물은 0.31% 상승했습니다. 미국의 7개 거대 기술 기업이 시장 이후 상승했습니다. 엔비디아는 1% 이상, 구글A는 0.73%, 메타는 0.59%, 테슬라는 0.58%, 아마존은 0.48%, 애플은 0.12%, 마이크로소프트는 0.09% 상승했다. 메모리반도체(전자기기의 두뇌 부품) 주가는 개장 이후 전반적으로 상승했다. 샌디스크는 2% 이상 상승했고, SK하이닉스와 마이크론 테크놀로지, 웨스턴디지털은 1% 이상, 씨게이트 테크놀로지는 0.91% 상승했다."},{"s":"미국 증시 하락, 다우지수 189포인트 하락, 골든드래곤지수 5개월 만에 최대폭 하락, 4일 연속 하락(08:31) - 20261113 - 실시간 금융뉴스","so":"明報財經網","tm":"11/13 09:36","c":1,"r":"hk","u":"https://finance.mingpao.com/fin/in 에는 연준이 내년 3월까지 3차례 연속(매회 25bp씩) 금리를 인상할 것으로 예상된다는 사실이 반영되었습니다. 파이낸셜 뉴스 에이전시(Financial News Agency), 11월 13일(Editor Xiaoxiang) 연준의 보다 공격적인 금리 인상 전망이 실제 위험으로 변할 경우, 주식 투자자들은 현재 채권 시장이 미칠 영향을 과소평가할 수 있습니다. 미국 국채시장은 재향군인의 날을 맞아 수요일 휴장해 채권시장은 화요일 나온 시장 경고로부터 일시적인 휴식을 취했다. 그러나 목요일 거래가 재개된 이후 미국의 모든 만기 채권 수익률은 여전히 ​​더 급등했다. 2년물 수익률은 4.88%, 10년물 수익률은 5.13%까지 올랐다."},{"s":"연준, 내년 10월 정기 금리 결정 취소하고 통화정책 논의로 전환","so":"TVB","tm":"11/13 09:05","c":1,"r":"hk","u":"https://news.tvb.com/sc/1206079-%E7%BE%8E%E8%81%AF%E5%84%B2%E5%8F%96%E6%B6%88%E6%98%8E%E5%B9%B410%E6%9C%88%E5%B8%B8%E8%A6%8F%E5%88%A9%E7%8E%87%E6%B1%BA%E8%AD%B0%E6%94%B9%E7%82%BA%E8%B2%A8%E5%B9%A3%E6%94%BF%E7%AD%96%E8%A8%8E%E8%AB%96","p":1794528300,"a":1794539779,"t":"美聯儲取消明年10月常規利率決議 改為貨幣政策討論","su":"연준(미국의 중앙은행)은 내년 공개시장위원회 회의 일정을 업데이트해 10월 정기 금리(돈을 빌릴 때 내는 이자 비율) 결정을 취소하고 통화정책 논의로 대체했다. 연준은 2027년 공개시장위원회 회의의 수정된 임시 일정을 발표했습니다. 연중 8번의 회의가 예정되어 있으며, 그 중 10월 26일과 27일 회의에서는 광범위한 통화정책 전략 문제를 논의할 예정이며, 평소와 같이 둘째 날에는 금리 결정이 발표되지 않습니다. 워시 연준 의장은 10월 금리 회의 이후 이렇게 말했습니다."},{"s":"엔비디아 주식, 월스트리트는 저렴하지 않다.","so":"バロンズ・ダイジェスト","tm":"11/13 09:03","c":1,"r":"jp","u":"https://barrons.jiji.com/article/9085","p":1794528188,"a":1794539783,"t":"エヌビディア株、ウォール街は割安と見ない","su":"엔비디아 <NVDA>를 둘러싸고 월가의 애널리스트들은 주가 선행에 신중해지고 있다. 젠슨 후안 씨가 떠난 후 경영에는 불투명감이 남는다. 후안 씨는 엔비디아의 사장과 최고경영 책임자(CEO), 이사직을 사임했다. 이에 따라 일부 애널리스트들은 12일 동사주 평가를 격하하고 목표주가도 크게 인하했다. 후안씨의 사임 발표에 앞서, 미국 종이 뉴욕 타임즈는 후안씨에 관한 2건의 불륜 문제를 보도하고 있었다. 동지에 의하면, 1건은 미국이…"},{"s":"연준은 2027년 회의 일정을 발표했습니다. 10월 회의에서는 금리 결정을 내리지 않고 연간 6건의 결정을 내릴 예정입니다.","so":"工商時報","tm":"11/13 08:59","c":1,"r":"tw","u":"https://www.ctee.com.tw/news/20261113700496-430701","p":1794527940,"a":1794539772,"t":"Fed公布2027年會議安排10月會議不做利率決策、朝每年6次決策邁進- 國際","su":"미국 연방준비제도(Fed·연준(미국의 중앙은행))가 12일 2027년 예비회의 일정을 발표했다. 내년 10월 회의에서는 금리(돈을 빌릴 때 내는 이자 비율) 표결이 없을 예정이다. 앞으로는 더욱 완전한 경제지표를 확보하고 정책판단의 질을 높이기 위해 연간 금리결정회의 횟수도 더욱 줄일 계획이다. 케빈 워시 연준 의장은 10월 정책회의 후 2027년 연방공개시장위원회(FOMC) 회의 일정이 소폭 조정될 것이라고 밝혔다."},{"s":"[마켓무버]뉴욕증시, 젠슨 황 사임 충격에 3대 지수 하락…유가·금리 상승도 부담","so":"이데일리","tm":"11/13 08:46","c":1,"r":"kr","u":"https://www.edaily.co.kr/News/Read?newsId=02545286645645392&mediaCodeNo=257","p":1794527162,"a":1794539753,"su":"11월13일 이데일리TV 마켓시그널뉴욕증시 3대 지수가 엔비디아 최고경영자(CEO) 젠슨 황의 전격 사임과 유가·금리 상승 부담에 일제히 하락 마감했다. 12일(현지시간) 다우존스30산업평균지수는 0.36%, 나스닥(미국 기술 회사들이 많은 주식시장)지수는 0.39%, S&P500(미국 큰 회사 500곳 지수)지수는 0.35% 각각..."},{"s":"미국 메모리칩 주가는 밤 늦게 하락했다. 엔비디아와 샌디스크는 4% 이상 하락했다. 미국의 AI 클라우드 리더는 거의 17% 하락했습니다. 금과 은이 급락했습니다.","so":"21财经","tm":"11/13 08:40","c":1,"r":"cn","u":"https://www.21jingji.com/article/20261113/herald/a5592c8b6ccf06704756a76016205815.html","p":1794526800,"a":1794539763,"t":"美股存储芯片股深夜下挫，英伟达、闪迪跌超4%，美国AI云龙头跌近17% ，黄金白银跳水","su":"21파이낸셜레이더에 따르면 11월 13일 미국 3대 증시 지수는 나스닥이 0.39%, 다우존스산업평균지수가 0.36%, S&P500(미국 큰 회사 500곳 지수)지수가 0.35% 하락하는 등 종합 하락세를 보였다. 대형 기술주는 엔비디아가 4.34% 하락하고 시장 가치가 미화 1,820억 달러(약 1조 2,100억 위안) 증발하는 등 이익과 손실이 엇갈렸습니다. 애플과 메타는 소폭 하락했고, 테슬라와 구글은 1.6% 이상 상승했으며, 아마존과 마이크로소프트는 소폭 상승했다. 필라델피아 반도체(전자기기의 두뇌 부품) 지수가 0.54% 하락하는 등 대부분의 반도체주이 하락했습니다. 샌디스크는 4.1% 하락했고, 어플라이드머티리얼즈와 세레브라스는 3% 이상 하락했다. 브로드컴과 AMD는 5% 이상 상승했다. 광통신 부문은 어플라이드 옵토일렉트로닉스(Applied Optoelectronics)가 5% 이상 하락하고 루멘텀(Lumentum)이 3% 이상 하락하고 마블 테크놀로지(Marvel Technology)가 2% 이상 하락하는 등 약세를 보였다."},{"s":"미국 주식 하락, 엔비디아 주가 하락, 유가 상승(Zeng Huiqi 보고)","so":"Now 新聞","tm":"11/13 08:16","c":1,"r":"hk","u":"https://news.now.com/mobile/finance/player?newsId=669383","p":1794525370,"a":1794539781,"t":"美股下跌 英偉達股價下挫及油價上升(曾惠琪報道)","su":"죄송합니다. 사용 중인 브라우저는 지원되지 않습니다. 최상의 시청 환경을 위해 최신 브라우저 버전으로 업데이트하시기 바랍니다. 질문이 있으시면 pccwmediaiapps@pccw.com으로 이메일을 보내주세요. [나우뉴스채널] 월스트리트 주가는 하락했고, 엔비디아 주가는 10% 이상 급락해 4% 이상 하락 마감했다. 다우존스 지수는 189포인트 하락한 52,297포인트로 마감했습니다. S&P500(미국 큰 회사 500곳 지수)은 26포인트 하락한 7,592포인트로 마감했습니다. 엔비디아는 Jensen Huang이 엔비디아의 CEO직을 즉각 사임할 것이라고 발표했습니다. 엔비디아의 주가가 하락했습니다. 유가 반등과 함께 시장의 인플레이션(물건값이 계속 오르는 것) 우려가 재점화되면서 미국 3대 주가지수가 하락했다."},{"s":"NY주 반락, 189달러 안 엔비디아 대폭 하락이 중하에","so":"毎日新聞","tm":"11/13 08:12","c":1,"r":"jp","u":"https://mainichi.jp/articles/20261113/kyd  재무 관리","so":"經濟日報","tm":"11/12 22:23","c":1,"r":"tw","u":"https://money.udn.com/money/story/12040/9875378","p":1794489822,"a":1794496108,"t":"那斯達克改了，白天也能買美股！24小時股市正在改變投資人的風險 | 個人理財 | 理財","su":"첫째, 현재는 비전통기 거래량 비중이 적지만, 지정학적 혼란의 시대에 들어 거래량이 확실히 늘어나고 있다는 점이다. 2025년 4월 트럼프 미국 대통령이 세계 여러 나라에 관세(수입품에 붙이는 세금) 조치를 부과했는데, 이는 그해 시장에서 가장 크고 불안정한 위험 요인이 됐다. 투자자들은 위험을 피하기 위해 전통적인 거래 시간 외에 주식을 사고 팔기 시작해야 했습니다. 미국 증권사 로빈후드(Robinhood)의 통계에 따르면 트럼프 대통령의 관세 '해방일' 다음 달에는 회사 거래량의 4분의 1이 정규 거래 시간 외에 발생했다. 중개 사업 책임자인 Steve입니다. 스티브 쿼크는 언제든지 발생할 수 있는 이러한 위험에 대처하기 위해서는 즉시 거래하는 것이 가장 좋은 방법이라고 지적했습니다. \"반응을 다음날 아침까지 기다리면 너무 늦을 것입니다.\" 이 때문에 로빈후드는 주중에 일부 주식과 원자재(물건의 재료(석유·구리 등))에 대해 24시간 거래를 제공했을 뿐만 아니라, 거래 서비스 시간을 주중에서 주말까지 연장하는 방안도 검토 중이다."},{"s":"달러 완화, 단기 국채 수익률 상승","so":"WSJ","tm":"11/12 22:15","c":1,"r":"us","u":"https://www.wsj.com/finance/jgb-yields-fall-as-hopes-for-accelerated-boj-tightening-eases-3eeccda2","p":1794489300,"a":1794496095,"t":"Dollar Eases, Short-End Treasury Yields Rise"},{"s":"연방준비제도(Fed) 금리 인상 기대로 인해 달러 지원이 유지되어야 함","so":"WSJ","tm":"11/12 22:12","c":1,"r":"us","u":"https://www.wsj.com/finance/currencies/yen-hitting-160-to-dollar-again-wont-be-surprising-f82f47e6","p":1794489120,"a":1794496096,"t":"Fed Rate-Rise Expectations Should Keep Dollar Supported"},{"s":"두 자릿수 하락 시 매수를 고려해야 할 S&P500 상위 2개 주식","so":"Yahoo Finance UK","tm":"11/12 22:11","c":1,"r":"us","u":"https://uk.finance.yahoo.com/news/2-top-p-500-shares-131106066.html","p":1794489066,"a":1794496097,"t":"2 top S&P 500 shares to consider buying on double-digit dips","su":"S&P500(미국 큰 회사 500곳 지수)은 2026년 최고치에서 5% 미만일 수 있지만 많은 주식은 그보다 훨씬 더 하락했습니다. 실제로 일부는 몇 주 만에 25% 이상 급락했습니다. 여기서는 상당히 하락세를 보이고 장기 투자자들이 관심을 가질 수 있는 두 가지를 강조하겠습니다."},{"s":"앤트로픽의 상장은 AI 시장의 트렌드가 되었습니다. 월스트리트는 다음 이익의 물결을 지원할 것이라고 기대합니다 | 미국 주식 동향 | 국제적인","so":"經濟日報","tm":"11/12 22:02","c":1,"r":"tw","u":"https://money.udn.com/money/story/123398/9873646","p":1794488557,"a":1794489615,"t":"Anthropic 上市成 AI 行情風向球 華爾街盼其撐起下一波漲勢 | 美股動態 | 國際","su":"경제일보는 산업, 주식시장, 금융, 국제, 블룸버그, 칼럼 외에도 매일 실시간 금융 뉴스를 제공합니다. 또한 중요한 주제에 대해 조각화되고 상황에 맞는 심층 콘텐츠를 제작하여 해석, 분석, 구성, 선정된 주제, 전문가 의견 등을 제공하여 독자가 정보 조각화 문제를 해결할 수 있도록 돕습니다."},{"s":"엔비디아 리더십 위기로 인해 미국 주식 선물이 지연되고 AI 거래가 압박을 받습니다.","so":"WSJ","tm":"11/12 22:01","c":1,"r":"us","u":"https://www.wsj.com/finance/stocks/nvidia-leadership-scandal-drags-on-u-s-stock-futures-pressures-ai-trade-e7f6e5b8","p":1794488460,"a":1794496097,"t":"Nvidia Leadership Crisis Drags on U.S. Stock Futures, Pressures AI Trade"},{"s":"S&P500 ETF 투자자들이 주식을 '현금'하는 새로운 방법을 찾았습니다.","so":"Investor's Business Daily","tm":"11/12 22:00","c":1,"r":"us","u":"https://www.investors.com/etfs-and-funds/etfs/sp500-etf-investors-find-a-new-angle-to-cash-in-on-stocks/","p":1794488400,"a":1794489602,"t":"S&P 500 ETF Investors Find A New Way To 'Cash In' On Stocks","su":"투자자들은 시장에서 독특한 수익 창출 각도를 지닌 ETF(여러 주식을 묶어 파는 상품)를 지속적으로 검색합니다. 하지만 그들이 찾고 있는 새로운 특성이 있습니다."},{"s":"대부분의 미국 대형 기술주는 시장 개장 전에 하락했으며, 엔비디아는 7% 이상 하락했습니다.","so":"36Kr","tm":"11/12 21:56","c":1,"r":"cn","u":"https://36kr.com/newsflashes/4066771435345032","p":1794488186,"a":1794489609,"t":"美股大型科技股盘前多数下跌，英伟达跌超7%"},{"s":"S&P500 선물은 시장 전 거래에서 하락합니다. Brookfield 인프라, Corteva Lag","so":"Barron's","tm":"11/12 21:30","c":1,"r":"us","u":"https://www.barrons.com/articles/s-p-500-futures-fall-in-premarket-trading-brookfield-infrastructure-corteva-lag-8e3cc249","p":1794486600,"a":1794489602,"t":"S&P 500 Futures Fall in Premarket Trading; Brookfield Infrastructure, Corteva Lag"},{"s":"엔비디아는 6% 이상 하락했습니다! 미국 스토리지 및 광통신 주가 약세, SK하이닉스는 3% 이상 하락. 소매 투자자들은 앤트로픽의 상장 첫날 순매수했습니다.","so":"21财经","tm":"11/12 21:12","c":1,"r":"cn","u":"https://www.21jingji.com/article/20261112/herald/04df79314f1a01bcdc46d1029143583a.html","p":1794485573,"a":1794489610,"t":"英伟达跌超6%！美股存储、光通信股走弱，SK海力士跌超3%；Anthropic上市首日散户净买","su":"① [3대 선물지수 혼재 하락] 보도시간 현재 다우선물은 0.05% 상승, S&P500(미국 큰 회사 500곳 지수) 선물은 0.39% 하락, 나스닥(미국 기술 회사들이 많은 주식시장) 선물은 0.82% 하락했다. ②[스토리지·광통신주 하락, SK하이닉스 3% 이상 하락] 스토리지·광통신주 일괄 하락. 보도 시간 현재 스토리지 ://www.reuters.com/markets/us/global-markets-technicals-graphic-2026-11-12/","p":1794481639,"a":1794523806,"t":"Mapping the Market: Oracle shares may be in for a rally"},{"s":"State Street SPDR 포트폴리오 S&P500(SPYM), 화요일에 애플 주식 1,520만 달러 추가 매입","so":"Yahoo! Finance Canada","tm":"11/12 20:05","c":1,"r":"us","u":"https://ca.finance.yahoo.com/news/state-street-spdr-portfolio-p-110516169.html","p":1794481516,"a":1794489603,"t":"State Street SPDR Portfolio S&P 500 (SPYM) Buys $15.2 Million More Apple on Tuesday","su":"이 펀드는 화요일에 501개 포지션에 1억 9,600만 달러를 추가했으며 애플, 엔비디아 및 마이크로소프트가 매수를 주도했습니다."},{"s":"SPDR 포트폴리오 S&P500 성장(SPYG)이 판매한 것: 11월 10일 엔비디아가 주도","so":"Yahoo Finance","tm":"11/12 20:05","c":1,"r":"us","u":"https://finance.yahoo.com/markets/stocks/articles/spdr-portfolio-p-500-growth-110508974.html","p":1794481508,"a":1794489604,"t":"What SPDR Portfolio S&P 500 Growth (SPYG) Sold: NVIDIA Leads on Nov. 10","su":"이 펀드는 2억 5,220만 달러의 주식을 매도하고 아무것도 사지 않았으며, 152개의 포지션을 줄이면서 아무것도 올리지 않았습니다."},{"s":"iShares Core S&P500 ETF(IVV), 화요일에 2,660만 달러 규모의 애플 주식 매도","so":"Yahoo Finance","tm":"11/12 20:04","c":1,"r":"us","u":"https://finance.yahoo.com/markets/stocks/articles/ishares-core-p-500-etf-110450403.html","p":1794481490,"a":1794489605,"t":"iShares Core S&P 500 ETF (IVV) Sells $26.6 Million of Apple on Tuesday","su":"이 기사는 GuruFocus에 처음 게재되었습니다. iShares Core S&P500(미국 큰 회사 500곳 지수) ETF(IVV)는 보고된 일일 보유량 변동에 따라 화요일 세션에서 3억 3,750만 달러의 순유출을 기록했으며 총 거래액은 3억 3,750만 달러에 달했습니다."},{"s":"골드만삭스, 연준 금리 전망 상향 조정…내년 12월과 3월 금리 인상 예상","so":"鉅亨網","tm":"11/12 20:00","c":1,"r":"tw","u":"https://news.cnyes.com/news/id/6658686","p":1794481204,"a":1794489619,"t":"高盛上修Fed利率預測 估12月、明年3月各升息一碼","su":"골드만삭스는 연준 금리(돈을 빌릴 때 내는 이자 비율) 전망을 상향 조정해 12월 금리 1포인트 인상을 유지하고 2027년 3월 금리 1포인트 인상을 추가했다.\n골드만삭스는 미국의 10월 인플레이션(물건값이 계속 오르는 것)이 예상보다 높았으며 전망이 3개월 연속 악화됐다고 밝혔다. 내년 1월 가격 인상은 기업에 대한 압박을 가중시킬 수 있다.\n골드만삭스는 연준이 2027년 말부터 금리를 3.25~3.50%로 네 차례 인하할 것으로 추정했다. 인플레이션이 냉각되면서 미국 부채는 압박을 받아왔습니다."},{"s":"국회의사당 '블루 턴'이 미국 은행주에 영향을 미치는데, 이것이 핵심 변수다.","so":"第一财经","tm":"11/12 19:25","c":1,"r":"cn","u":"https://www.yicai.com/news/103438452.html","p":1794479132,"a":1794489612,"t":"国会山“翻蓝”冲击美股银行股，关键变量还有这些","su":"{{aisd}} AI가 면책 조항을 생성했습니다. 민주당은 의회 양원을 모두 \"휩쓸었습니다\". 인공지능(AI) 컨셉주처럼 미국 은행주도 영향을 받았다. 선거 결과가 최초 발표된 이후 KBW 나스닥(미국 기술 회사들이 많은 주식시장) 은행지수는 전체적으로 1.7% 하락했고, S&P500(미국 큰 회사 500곳 지수) 은행지수는 2.5% 하락했다. 애널리스트들은 당선 후 두 정당의 정치 이슈 선호 차이가 미국 은행주에 영향을 미칠 것으로 보고 있다. 아울러 AI 구축 열풍의 영향과 연준의 규제 태도도 미국 은행주 동향의 핵심 변수다. 정치적 의제 전망과 AI 구축 물결이 은행주에 영향을 미칠 것이다. 2008년 금융위기 이후 매사추세츠주 엘리자베스 워런 상원의원, 이번에 오하이오주 상원의원에 당선된 셰로드 브라운 등 민주당 의원들은 월스트리트 대형은행들을 가장 노골적으로 비판해 왔다."},{"s":"미국 주식 시장 전/후이다 7% 하락, AI 주식 나스닥 선물 0.79% 하락","so":"鉅亨網","tm":"11/12 19:00","c":1,"r":"tw","u":"https://news.cnyes.com/news/id/6660670","p":1794477614,"a":1794489621,"t":"美股盤前／輝達跌7%拖累AI股那指期貨下挫0.79%","su":"미국 주식 시판 전/Huida 7% 하락, AI주 하락 나스닥(미국 기술 회사들이 많은 주식시장) 선물 0.79% 하락 Uanalyze 2026년 11월 12일(Uanalyze/Industrial Data Center 보고서) ⸺ 목요일(12일) 미국 증시 개장 전, Huida 엔비디아(NVDA-US) 경영진 사임에 대한 불확실성이 다시 한번 AI 주식을 억제했습니다. 현재 나스닥 100 지수 선물은 0.79% 하락했고, S&P500(미국 큰 회사 500곳 지수) 지수 선물은 0.38% 하락했으며, 다우존스 선물은 20포인트(0.04%) 상승했습니다. 기술주는 매도 압력이 심합니다. Huida는 시장 개장 전 7% 하락했으며, 이사회가 Huang Renxun CEO의 잔류 여부를 평가하고 있다는 보도에 시장이 주목하고 있습니다. Huida는 AI 칩 공급망의 핵심이기 때문에 리더십의 변화 가능성은 관련 회사에 대한 투자자의 신뢰에도 영향을 미칠 것입니다. 회사는 아직 CEO 교체 결정을 발표하지 않았습니다."},{"s":"미국 주식기술 부문의 엄청난 혼란이 AI 업계의 기업공개(IPO) 속도에 영향을 미칠까? 씨티임원들 “아직 속도는 변하지 않았으며 내년 상장 주제는 더욱 다양해질 것”","so":"财联社电报","tm":"11/12 18:07","c":1,"r":"cn","u":"https://m.cls.cn/detail/2532669","p":1794474426,"a":1794496102,"t":"美股科技板块巨震会否影响AI产业IPO节奏？花旗高管：节奏暂未变，明年上市主题将更多元","su":"파이낸셜 뉴스 에이전시, 11월 12일 (궈즈숴 기자) 미국 중간선거가 끝난 뒤 나스닥과 필라델피아 반도체(전자기기의 두뇌 부품)지수로 대표되는 기술주 주가가 크게 요동쳤다. 반도체 기업공개(IPO)와 국경간 인수합병(M&A) 속도가 조심스러워졌는지가 시장의 촛점이 됐다. 지난 11월 11일 열린 Citi 2026 중국 서밋의 언론 교류 세션에서 Zhuo Jianxun 씨티 일본, 북아시아, 호주 기업 금융 사업 책임자와 Yuan Zhengyi 씨티 투자 은행 중국 시장 사업 책임자가 Financial Associated Press를 포함한 언론의 질문에 답변했습니다. AI 산업의 초점이 유동성(시장에 도는 돈의 양)으로 옮겨갔고, 기업공개(IPO) 속도에는 아직 영향이 미치지 않았다. “중간선거 이후 미국 증시, 특히 필라델피아 반도체지수를 비롯한 나스닥의 변동성이 매우 심했습니다.” Yuan Zhengyi는 이번 조정 뒤에는 여러 가지 잠재적인 이유가 있다고 말했습니다. 첫째, 시장에서는 민주당이 새로운 데이터 센터와 같은 AI 인프라에 대해 상대적으로 보수적일 것으로 예상하고 AI 자본 투자가 둔화되고 중요한 요소인 반도체가 영향을 받을 수 있다고 예상합니다. 둘째, 일부 사람들은 초기 가격이 너무 높다고 생각합니다."},{"s":"해외조사 및 선정일보 1112 | ANZ: 연준은 예상보다 금리를 더 많이 인상할 수 있으며 50bp의 단일 금리 인상도 배제하지 않습니다.","so":"财联社","tm":"11/12 17:50","c":1,"r":"cn","u":"https://www.cls.cn/detail/2532763","p":1794473456,"a":1794496103,"t":"海外研选日报1112 | 澳新银行：美联储加息力度或超预期 不排除单次加息50基点","su":"① Bank of America: TSMC의 자본 지출은 내년에 900억 달러에 달할 수 있으며 첨단 프로세스 확장이 가속화되고 있습니다. ② JP모건 Chase: AI채권(돈을 빌려주고 받는 차용증) 발행이 전년 대비 160% 급증, 자산운용사가 주요 매수자로 자리매김. ③ 골드만삭스: 미국 기업 자본지출은 AI 투자가 주요 원동력이 되면서 내년 8% 증가할 것으로 예상된다. ④모건스탠리 : AI 금융규모가 6,460억 달러에 달하고, 신용위험 차별화도 심화됐다. 편집자 주: Financial Associated Press는 글로벌 매크로, 기업 및 산업, 상품 및 기타 측면에 대한 주요 투자 은행의 최신 연구 의견을 매일 수집하여 투자자의 투자 결정에 대한 포괄적인 지원을 제공합니다. Macro 골드만삭스: AI 투자가 내년에도 미국 경제 성장을 계속 주도할 것이며 자본 지출 증가율은 8%에 이를 수 있습니다. 골드만삭스는 11월 11일 연구 보고서를 발표해 2027년에도 인공지능(AI) 투자가 미국 기업 자본 지출 성장의 주요 원동력이 되어 실제 상업용 고정 투자가 시장 컨센서스 4.2%보다 훨씬 높은 8% 증가하고 미국 실질 GDP 성장률 2.4%를 뒷받침할 것이라고 전망했다."},{"s":"주항투자레이더》미국 증시 급락은 경기침체 때문인가 아니면 주식시장의 실수 때문인가? 주식을 팔아야 하나?","so":"鉅亨網","tm":"11/12 17:45","c":1,"r":"tw","u":"https://news.cnyes.com/news/id/6660626","p":1794473106,"a":1794496109,"t":"鉅亨投資雷達》美股大跌是衰退使然還是股市錯殺？手中股票該賣嗎？","su":"나스닥(미국 기술 회사들이 많은 주식시장)은 10월 6일 최고치에서 약 8% 하락했고, 연준(미국의 중앙은행)은 거의 20% 하락했습니다. 대만 주식과 기타 기술주가 동시에 조정되었습니다.\n백테스팅 결과, 기술주는 급격한 하락 이후 3개월/6개월/1년 만에 평균 4.3%/6.6%/11.8% 반등한 것으로 나타났습니다.\n미국이 불황에 빠지지 않았다면 대만의 연평균 수익률은 18.3%였을 것입니다. 패닉 상태에서 빠져나오면 리바운드를 쉽게 놓칠 수 있습니다."},{"s":"Jen-Hsun Huang은 다시 음식을 훔친 후 사임하겠다고 위협합니다. 월스트리트가 패닉에 빠졌나요? 주요 기관의 최신 의견 요약","so":"鉅亨網","tm":"11/12 16:30","c":1,"r":"tw","u":"https://news.cnyes.com/news/id/6660374","p":1794468611,"a":1794489622,"t":"黃仁勳再爆偷吃恐下台 華爾街到底慌不慌？各大機構最新看法彙總","su":"Jen-Hsun Huang의 혼외정사 스캔들이 퍼지고 있습니다. 월스트리트저널은 후이다 이사회가 그를 해고할 계획이라고 전했다. 시장은 그를 위험과 거버넌스 위기의 핵심 인물로 여긴다.\nBernstein과 Baird는 각각 등급을 중립/보통으로 하향 조정하고 목표 가격을 200달러로 낮췄습니다. 모건스탠리는 불확실성으로 인해 위험수익률이 악화됐다며 상위 종목을 제외했다.\nMizuho, Citigroup 및 Wells Fargo는 여전히 AI 수요에 대해 낙관적입니다. 많은 투자자들은 황런쉰이 교체하기 어렵고 그가 떠날 경우 주가가 25~30% 하락할 수 있다고 말한다."},{"s":"엔비디아는 5.47% 하락했고, 엔비디아와 Huang Renxun은 주주 집단 소송으로 고소당했습니다. 丨 미국 주식 거래 재개","so":"21财经","tm":"11/12 15:38","c":1,"r":"cn","u":"https://m.21jingji.com/article/20261111/herald/b70e7d6c7765c8e9448b3e38ef44d5b5_zaker.html","p":1794465522,"a":1794467064,"t":"英伟达大跌5.47%，英伟达、黄仁勋遭股东集体诉讼丨美股复盘","su":"동부 표준시 기준 11월 10일, 엔비디아는 5.47% 하락한 US$168.89를 기록했습니다. 엔비디아 이사회는 황런순 CEO의 개인 문제에 대한 비난에 대해 독립적인 조사에 착수한다고 8일 발표했습니다. 관련 혼란의 영향을 받아 Huang Renxun의 이탈이 시장의 초점이 되었습니다. Securities Times에 따르면 엔비디아의 주가는 미국의 주요 주가 지수와 같이 뚜렷한 추세에서 거의 벗어난 적이 없습니다. S&P500(미국 큰 회사 500곳 지수) 지수에서 엔비디아의 비중은 6.7%에 이릅니다. 2001년 11월 9일을 포함해 S&P500 지수에 편입된 이후 엔비디아 주가가 4% 이상 하락한 반면 S&P500 지수가 2% 이상 상승한 경우는 단 세 번뿐이다. 현지 시간으로 9일 엔비디아 주가는 하락해 결국 주당 178.67달러로 4.27% 하락해 마감했고, 시장 가치는 약 1930억 달러(약 1조2882억 위안) 감소했다. 미국 증시가 마감된 지 5분 만에 엔비디아와 황젠슨이 주주사취 혐의로 주주집단소송을 당했다."},{"s":"유럽 ​​기업 심리가 회복되고 인플레이션 우려가 커지고 조사 결과","so":"Reuters","tm":"11/12 15:03","c":1,"r":"world","u":"https://www.reuters.com/business/european-business-sentiment-picks-up-inflation-worries-grow-survey-finds-2026-11-12/","p":1794463380,"a":1794489631,"t":"European business sentiment picks up, inflation worries grow, survey finds"},{"s":"엔비디아는 이사회가 Jensen Huang의 미래를 고려하면서 슬라이드를 공유합니다.","so":"Financial Times","tm":"11/12 14:07","c":1,"r":"world","u":"https://www.ft.com/content/a93307a7-e2cd-4abd-bd89-c38832d8c40e?syn-25a6b1a6=1","p":1794460051,"a":1794467084,"t":"Nvidia shares slide as board considers Jensen Huang’s future"},{"s":"엔비디아 주식, 시간외에서 급락 엔비디아 Stock Tumbles. Jensen Huang Could Be Out Soon.","so":"バロンズ・ダイジェスト","tm":"11/12 13:59","c":1,"r":"jp","u":"https://barrons.jiji.com/article/9084","p":1794459557,"a":1794467082,"t":"エヌビディア株、時間外で急落 Nvidia Stock Tumbles. Jensen Huang Could Be Out Soon.｜【日刊】2026年11月12日号","su":"미국 반도체(전자기기의 두뇌 부품) 대기업 엔비디아 <NVDA>의 젠슨 후안 최고경영 책임자(CEO)가 톱 자리를 쫓을 가능성이 나왔다. 미국 종이 월 스트리트 저널은 11일 밤, 엔비디아의 이사회가 후안 씨의 해임을 위한 준비를 진행하고 있다고 보도했다. 해임의 가능성은 미국 종이 뉴욕 타임즈가 후안 CEO에 대해 2건의 불륜 문제가 있었다고 잇따라 보도한 뒤 부상했다. 이 중 11일 밤 보도에서는 후안 CEO가 회사 직원 중 한 명과 친밀한 관계에 있었다고 한다."},{"s":"4가지 주요 신호로 인해 내년 미국 주식의 변동성이 커질 것으로 예상됩니다.","so":"信報網站","tm":"11/12 13:41","c":1,"r":"hk","u":"https://www.hkej.com/dailynews/investment/article/4563412/%25E5%259B%259B%25E5%25A4%25A7%25E8%25A8%258A%25E8%2599%259F%25E9%25A0%2590%25E7%25A4%25BA%25E6%2598%258E%25E5%25B9%25B4%25E7%25BE%258E%25E8%2582%25A1%25E9%259C%2587%25E7%259B%25AA","p":1794458475,"a":1794489626,"t":"四大訊號預示明年美股震盪","su":"지난주 미국 중간선거 결과가 '푸른 쓰나미'를 일으켰다. 이틀 뒤인 11월 5일 월스트리트 주식시장에는 또 다른 '붉은 쓰나미'가 터졌다. 이날 4000개 이상의 주식이 폭락해 전체 시장의 약 83%를 차지했다. 미국 주식의 전체 시장 가치는 하루 만에 2조8000억 달러 증발해 사상 최대치를 기록했다. 필라델피아 반도체(전자기기의 두뇌 부품) 지수와 나스닥 종합 지수는 각각 12.2%와 6.4% 급락해 둘 다 2020년 코로나19 발병 이후 최악의 일일 실적을 기록했습니다. 시장에서는 일반적으로 이러한 시장 하락을 민주당이 하원과 상원의 장악력을 되찾은 결과로 보고 있습니다. AI 데이터센터(컴퓨터 수만 대를 모아 둔 건물) 구축이 둔화되거나 심지어 중단될 수도 있다는 우려가 나온다. 또한, AI 규제가 강화되어 시장에 타격을 줄 수도 있습니다."},{"s":"미국 중간선거 변화에도 여전히 기술주, 미국주식, 신흥시장주, 비투자부채펀드로 자금이 유입되고 있다.","so":"經濟日報","tm":"11/12 13:37","c":1,"r":"tw","u":"https://money.udn.com/money/story/5607/9873994?from=udnamp-referralnews_ch1001artbottom","p":1794458246,"a":1794467067,"t":"美期中選舉變天 資金仍流向科技、美股、新興市場股票及非投等債基金","su":"자금 흐름을 보면 많은 미국 민주당 의원들이 AI, 미국 국내 석유 및 가스 생산, 금융 산업에 적대적임에도 불구하고 기술, 미국 주식, 신흥 시장 주식, 비투자 등급 채권(돈을 빌려주고 받는 차용증) 펀드로 자금이 계속 유입되고 있음을 알 수 있습니다. 공매도(주식을 빌려서 먼저 파는 것) 펀드는 7월 말 이후 최대 규모의 자금 유출을 경험했다."},{"s":"아시아 주식은 취약하고 엔비디아는 CEO의 운명을 결정하기 위해 이사회에서 급락했습니다.","so":"The Straits Times","tm":"11/12 13:06","c":1,"r":"sg","u":"https://www.straitstimes.com/business/asian-stocks-fragile-nvidia-plummets-as-board-to-decide-ceos-fate?ref=latest-headlines","p":1794456360,"a":1794459119,"t":"Asian stocks fragile, Nvidia plummets as board to decide CEO’s fate","su":"엔비디아가 Jensen Huang의 운명을 둘러싼 이사회에 급락하면서 아시아 주식은 취약해졌습니다. straitstimes.com에서 자세한 내용을 읽어보세요."},{"s":"연준은 계속해서 매파적인 입장을 보이고 있으며 금값은 4,000달러 선 아래로 떨어졌습니다! 투자은행, 추가 하락 위험 경고","so":"财联社电报","tm":"11/12 12:38","c":1,"r":"cn","u":"https://m.cls.cn/detail/2532321","p":1794454680,"a":1794459093,"t":"美联储鹰声不断，黄金失守4000美元大关！投行警告进一步下行风险","su":"Financial Associated Press, 11월 12일(편집자 Bian Chun) 국제 금 가격이 온스당 4,000달러라는 임계 수준 아래로 떨어졌습니다. 분석가들은 지속적인 인플레이션(물건값이 계속 오르는 것) 압력으로 인해 연준이 긴축 기조를 유지하게 되면서 귀금속이 추가적인 매도 압력에 직면할 수 있다고 경고했습니다. 최근 매도 압력이 금 시장의 최근 상승세를 위협하고 있습니다. 분석가들은 금 가격이 주요 지지선인 4,000달러 아래로 떨어지면 새로운 매도세(팔려는 힘)가 촉발될 수 있다고 경고합니다. 목요일 아시아 거래에서 국제 금 가격은 미화 4,000달러를 밑돌며 이틀 연속 하락세를 이어갔습니다. 전날 예상보다 높은 미국 인플레이션 데이터와 연준 정책 입안자들의 매파적 논평으로 달러 강세가 이어지고 다음 달 더 큰 금리 인상 가능성이 높아지면서 금값은 이틀 연속 하락했다. 현물 금은 온스당 3,987.29달러로 1% 넘게 하락했다. 12월 인도분 미국 금 선물은 온스당 4,000.50달러에 0.7% 하락했다."},{"s":"무료강의' 푸른 파도 쓰나미가 두 집을 삼켰다! 월스트리트의 승자와 패자가 하룻밤 사이에 개편됐다.","so":"自由評論網","tm":"11/12 12:30","c":1,"r":"tw","u":"https://talk.ltn.com.tw/article/breakingnews/5637338","p":1794454200,"a":1794459104,"t":"自由開講》藍潮海嘯吞兩院！華爾街贏家輸家一夜重洗","su":"◎ 조셉 차이 2026년 11월 3일 미국 중간선거에서 민주당은 하원과 상원을 모두 탈환해 2006년 이후 처음으로 중간선거에서 양원을 모두 석권한 야당이 됐다. 이번 선거 결과는 공화당이 최소 1석은 유지할 것이라는 시장의 기대를 깨뜨렸고, 월스트리트는 도널드 트럼프와 민주당이 집권한 의회의 새로운 지형을 재평가하게 만들었다. 의회에서는 민주당이 주도권을 잡았지만 트럼프 미국 대통령이 여전히 거부권을 쥐고 있어 주요 법안이 순조롭게 통과되지 못할 수도 있다. . (AFP 파일사진) 민주당이 의회 장악력을 얻었지만 트럼프는 여전히 거부권을 쥐고 있어 주요 법안이 순조롭게 통과되지 못할 수도 있다. 그러나 민주당이 장악하고 있는 수사·청문·소환 권한으로 인해 기업들은 더욱 엄격한 의회 감독을 받게 될 것이다."},{"s":"월스트리트 자금이 불고 있습니다! Citi, 기술 등급 인하 및 헬스케어 투자 확대: 이 생명공학 펀드는 한 달 만에 13% 급등 | 자금 | 주식 시장","so":"udn","tm":"11/12 12:22","c":1,"r":"tw","u":"http://udn.com/news/story/10103/9873712?from=udn-catebreaknews_ch2","p":1794453734,"a":1794459106,"t":"華爾街資金大風吹！花旗砍科技評等加碼醫療保健：這檔生技基金單月飆漲13% | 基金 | 股市","su":"최근 글로벌 주식시장에 자본순환 조짐이 나타나고 있습니다! AI 기술주가 과도한 자본지출과 가치평가 조정 우려에 직면하자 월스트리트가 헬스케어 산업으로 눈을 돌리기 시작했다. 씨티그룹은 11월 9일 미국 주식과 글로벌 기술주에 대한 투자 등급을 하향 조정하는 동시에 글로벌 헬스케어 주식을 '중립'에서 '비중 확대'로 상향 조정했습니다. 구글의 의료 전문 AI 플랫폼 공식 출시와 대형 제약사들의 생명공학 기업 인수가 활발해지면서 생명공학 산업은 다양한 혜택을 누리고 있다. 최근 펀드 성과를 보면 프랭클린 화메이 생명공학 펀드(NTD)가 10월 16일부터 11월 10일까지 13.28% 상승해 글로벌 생명공학 관련 4개 펀드 중 1위에 올랐다. 지난 몇 년간 AI 칩, 서버, 클라우드 컴퓨팅 등이 많은 자금을 유치했고, 기술주가 글로벌 시장의 중심이 됐다. 그러나 기업의 자본지출이 지속적으로 증가하면서 시장에서는 투자회복 속도와 이익 증가 속도에 대한 재평가가 시작됐다."},{"s":"달러 가치가 19개월 만에 최고치로 치솟았습니다! 글로벌 시장은 새로운 폭풍에 직면해 있습니다. 연준이 12월에 금리를 인상할 것이라는 점에는 의심의 여지가 거의 없습니다.","so":"鉅亨網","tm":"11/12 12:19","c":1,"r":"tw","u":"https://news.cnyes.com/news/id/6660175","p":1794453561,"a":1794459108,"t":"美元飆上19個月高點！全球市場迎新風暴 聯準會12月升息幾無懸念","su":"미국 인플레이션(물건값이 계속 오르는 것)이 과열되고 있고 연준 관계자들은 매파적이며 시장은 12월 금리(돈을 빌릴 때 내는 이자 비율)를 2포인트 인상할 것으로 예상하고 있습니다. ICE 미국 달러 지수는 한때 19개월 최고치인 102.96까지 올랐습니다.\nLSEG는 12월 한자리 금리 인상 확률이 88%, 두 자리 금리 인상 확률은 12%로 나타났다. 골드만삭스와 Deutsche Bank는 모두 연준의 후속 금리 인상에 대한 전망을 상향 조정했습니다.\n유로화는 1.11 아래로 떨어져 5월 이후 최저치를 기록했습니다. 프랑스 부채와 정치적 불확실성이 계속해서 유로화를 압박하고 있으며 Rabobank는 1.10을 기록하고 있습니다."},{"s":"엔비디아 CEO 위기에도 불구하고 기술 반등으로 다우, S&P500, 나스닥 선물 혼합: AMD, CSCO, AMAT 집중","so":"Yahoo Finance","tm":"11/12 12:15","c":1,"r":"us","u":"https://finance.yahoo.com/markets/stocks/articles/dow-p-500-nasdaq-futures-031512683.html","p":1794453300,"a":1794467062,"t":"Dow, S&P 500, Nasdaq Futures Mixed As Tech Rebounds Despite Nvidia CEO Crisis: AMD, CSCO, AMAT In Focus","su":"언론 보도에 따르면 엔비디아 이사회는 젠슨 황 CEO가 회사 임원과 불륜을 저질렀다는 추가 소식이 나온 후 CEO를 교체할 방안을 모색하고 있다고 합니다."},{"s":"Huang Renxun은 사임을 두려워합니다! 업계는 BBC에 \"그는 끝났다\"고 직설적으로 전했고 월스트리트 거물들도 경고했다.","so":"中時新聞網","tm":"11/12 12:14","c":1,"r":"tw","u":"https://www.chinatimes.com/realtimenews/20261112002215-260408","p":1794453291,"a":1794467068,"t":"黃仁勳恐下台！業界向BBC直言「他完了」 華爾街大咖也示警- 國際","su":"Huida CEO Huang Renxun은 혼외정사에 연루되어 그의 리더십 위치가 시험대에 직면했습니다. 영국방송공사(BBC)는 기술업계 관계자의 말을 인용해 \"그는 끝났다\"고 직설적으로 말했다. CNN은 월스트리트의 유명한 기술 분석가인 Dan Ives가 Huang Renxun이 주도권을 쥐고 있다고 믿고 있다고 보도했습니다."},{"s":"JP모건은 연말에도 S&P500을 8,000포인트로 유지했습니다! Bernstein: Rubin Ultra는 CPO 수요를 증대시킵니다! 앤트로픽은 장기 이익률 35%를 확보합니다丨20261112 Wall Street에서 Lujiazui까지","so":"第一财经","tm":"11/12 12:06","c":1,"r":"cn","u":"https://www.yicai.com/video/103437713.html","p":1794452768,"a":1794523778,"t":" ":"국가의료보험국의 상업 보험 혁신 의약품 목록 업데이트 전날, 중국 보험 협회(이하 '중국 보험 협회')가 편찬한 '상업 보험 의약품 권장 목록'의 산업판이 1년의 준비 끝에 마침내 발표되었습니다. 1차 배치에는 58개 의료기기가 포함됐는데, 이 중 의료보험 외 자기부담 의약품이 약 60%를 차지했고, 혁신 의약품이 전체의 거의 절반을 차지했다. 이 산업별 목록은 상업적으로 보장되는 혁신 의약품 목록과 다릅니다. 양 당사자 모두 기본 의료 보험 이외의 자체 자금 조달 혁신 제품에 초점을 맞추고 있지만 중국 보험 협회의 목록에는 혁신 및 임상 가치와 같은 차원 외에도 약물의 임상 적용, 보험 청구 경험 및 약물 수요 변화와 같은 시장 지향 변수가 추가로 포함됩니다. 이로 인해 선택된 품종의 첫 번째 배치는 \"종양학 약물 함량이 더 높다\"는 특징을 갖습니다. 더 많은 오리지널 약물과 CAR-T 제품이 포함되며, 신경퇴행성 질환 및 일부 희귀 질환 분야에서는 보다 신중한 선택 기준이 유지됩니다."},{"s":"신약 상업화, 국제 라이선스 매출, 제품 포트폴리오 확장, 상위 5개 제약사 첫 10개월간 좋은 소식 보고, 4분기 호황 - 파이낸셜뉴스 - Business Times","so":"中時新聞網","tm":"11/11 05:10","c":2,"r":"tw","u":"https://www.chinatimes.com/newspapers/20261111000240-260202","p":1794341400,"a":1794350725,"t":"新藥商業化、國際授權收益、產品組合擴張製藥五強前十月報喜Q4唱旺- 財經要聞- 工商時報","su":"生技股製藥五強10月營收報喜，藥華藥交出年增翻倍續創歷史新高佳績，台康生、逸達有授權收入挹注，美時前十月營收年增59％，保瑞則維持雙位數成長，分別受惠新藥商業化、國際授權收益、產品組合擴張，第四季營運動能"},{"s":"4개 부서에서 문서 발행: 혁신적 약물의 안전하고 합리적인 배포 및 사용 강화","so":"Jiemian.com","tm":"11/10 13:40","c":2,"r":"cn","u":"https://m.jiemian.com/article/15315560.html","p":1794285619,"a":1794298357,"t":"四部门发文：加强创新药安全合理配备使用","su":"첫째, 2급 이상 의료기관은 혁신의약품의 입회제도와 업무프로세스를 최적화·개선하고, 약학관리치료위원회 회의를 적시에 개최하며, 사업역량과 진단·치료 수요를 바탕으로 혁신의약품을 기관의 의약품 카탈로그에 적시에 포함시켜야 한다. 도립병원이 선도적인 역할을 할 수 있도록 단계적으로 추진한다. 두 번째는 의료지식과 의료보험지급정책에 대한 정기적인 조직과 훈련을 요구하는 것이다. 혁신적인 약물의 임상적 사용에 대한 전문가 합의를 적시에 수집 및 발표하고 충분한 증거 기반 의학을 갖춘 약물을 임상 진단 및 치료 지침에 적시에 포함시킵니다. 세 번째는 의약품 관련 의료서비스 가격 항목을 실시하고 지원 및 보장 조치를 더욱 강화하며 혁신 의약품 사용을 위한 정책 환경을 최적화하는 것입니다. 넷째, 의료기관 내 약품종수 및 규제에 대한 제한이 없음을 강조하고, 평균 외래약가 인상, 평균 입원약가 인상 등 공공의료기관 성과모니터링 지표에 해당 혁신신약이 포함되지 않음을 명확히 하겠다."},{"s":"혁신신약의 개념은 변동하고 하락한다","so":"第一财经","tm":"11/13 11:03","c":1,"r":"cn","u":"https://www.yicai.com/brief/103439356.html","p":1794535380,"a":1794539802,"t":"创新药概念震荡走低","su":"홈 > 뉴스 공유 대상: WeChat Weibo QQ WeChat에 공유 WeChat을 열고 하단의 \"검색\"을 클릭한 다음 \"스캔\"을 사용하여 웹페이지를 친구들과 공유하세요. 2026/11/13 10:03 [혁신신약 개념이 흔들리고 떨어졌다] 바이옵시스와 워너제약이 10% 이상 하락했고, 완방제약, 니어쇼어프로테인, 계림산진, 바이화제약 등도 6 批是贝捷迈继中国、加拿大和瑞士监管机构批准后的第四项上市批准。该药物的全球商业化权益已授予德国默克。和誉医药将在贝捷迈于美国实现首次商业化销售时获得2000万美元里程碑付款，并将基于全球净销售额获得两位数百分比的特许权使用费。"},{"s":"Breakingviews - 논평: 중국이 거대 제약회사의 비만치료제 연구실로 떠오름","so":"Reuters","tm":"11/12 07:00","c":1,"r":"us","u":"https://www.reuters.com/commentary/breakingviews/china-emerges-obesity-drug-lab-big-pharma-2026-11-11/","p":1794434440,"a":1794453340,"t":"Breakingviews - COMMENTARY: China emerges as obesity drug lab for Big Pharma"},{"s":"CIIE Story丨AstraZeneca Guan Dongmei: 혁신적인 약물부터 전체 과정 관리까지, 더 많은 암 환자에게 혜택을 제공","so":"新华网","tm":"11/11 20:05","c":1,"r":"cn","u":"http://www.news.cn/health/20261111/d56fca15de754ae4b0283693f6894bfb/c.html","p":1794395120,"a":1794403012,"t":"进博故事丨阿斯利康关冬梅：从创新药物到全病程管理，让更多肿瘤患者获益","su":"CIIE 스토리 | AstraZeneca Guan Dongmei: 혁신적인 약물부터 풀 코스 관리까지, 더 많은 암 환자에게 혜택을 제공하는 일련의 긍정적인 혁신 협력 진행은 중국의 현지 혁신을 글로벌 시장과 연결하고 혁신 결과를 촉진하여 더 많은 환자에게 혜택을 주는 AstraZeneca의 능력을 더욱 입증합니다."},{"s":"'입학 장벽' 완화 및 4개 학과로 혁신 신약 장애물 제거","so":"21财经","tm":"11/11 19:54","c":1,"r":"cn","u":"https://www.21jingji.com/article/20261111/herald/a36fa05400a321e8324c95b263f44bfa.html","p":1794394440,"a":1794403013,"t":"松绑“入院关”，四部门为创新药拆障","su":"21세기 비즈니스 헤럴드 기자 Yan Shuo 2026년 버전의 의료 보험 카탈로그와 상업 보험이 적용되는 혁신 의약품 카탈로그('2개 카탈로그'라고 함)가 곧 출시될 예정이므로 4개 부서가 입원 시 혁신 의약품의 막힘을 해결하기 위한 문서를 공동으로 발행했습니다. 11월 10일, 국가위생건강위원회, 국가의료보험국, 국가중의약국, 국가질병통제예방총국은 공동으로 \"혁신 약물의 안전하고 합리적인 유통 및 사용을 더욱 개선하기 위한 고시\"(\"고시\"로 통칭)를 발표했습니다. 혁신적인 의약품의 안전하고 합리적인 유통과 사용이라는 핵심 측면에 초점을 맞춰 합리적 배치 촉진, 교육 및 지도 강화, 사용 조건 최적화, 관리 조치 개선 등의 구체적인 정책과 조치를 제안했습니다. 상하이 시 위생 및 건강 개발 연구 센터 소장 Jin Chunlin은 21세기 비즈니스 헤럴드 기자에게 이 \"고시\"가 혁신적인 약물의 승인을 막는 행정 및 평가 장애물을 제거했다고 지적했습니다. 이 문서에는 제품 규정 제한, 단일 제품 및 2개 규정, 비용 평가, 로컬 디렉터리 보호 등의 문제가 언급되어 있습니다. 또한 결제 측면에서는 특별한 단일 협상 정책을 도입합니다. 그러나 이는 여전히 본질적으로 '카드 허용 불가' 문제를 해결하는 지침 문서일 뿐 긍정적인 홍보 메커니즘을 확립하지 못하고 있습니다."},{"s":"Abbott, 이식형 심장율동전환기 제세동기 리드에 대해 FDA 승인 및 CE 마크 획득","so":"Fierce Biotech","tm":"11/11 15:25","c":1,"r":"us","u":"https://www.fiercebiotech.com/medtech/abbott-nabs-fda-approval-c 将资源集中至具备比较优势的临床CRO主业，优化全球业务布局。 “壹评级”指出，海外实验室业务与临床CRO在运营模式、资产属性和资源投入上差异明显。在地缘环境复杂的背景下，单纯依靠项目交付难以快速提升海外市占率。公司选择保留境内业务及Acme Bioscience, Inc.，体现了对海外扩张路径的理性取舍。本次交易预计产生一次性收益，金额超过公司最近一个会计年度经审计净利润50%；其中，公司直接持股对应税费前现金对价约4.61亿元人民币。公司计划将约60%的交易所得用于海外业务拓展及潜在收购，以增强临床业务的获客能力。"},{"s":"FDA는 GLP-1 약물이 안과 질환의 위험을 증가시키고 시력을 영구적으로 손상시킬 수 있음을 의약품 제조업체에 표시하도록 요구합니다(Donnie Yen 보고).","so":"Now 新聞","tm":"11/11 08:38","c":1,"r":"hk","u":"https://news.now.com/home/international/player?newsId=669101","p":1794353905,"a":1794361870,"t":"FDA要求藥廠標明GLP-1藥物或增眼疾風險 可能令視力永久受損(甄子慧報道)","su":"【Now新聞台】美國食品及藥物管理局宣布，包括俗稱「瘦瘦針」的GLP-1藥物，必須標明可能引致罕見副作用，有機會令視力永久受損。"},{"s":"머크 KGaA, 희귀 종양 질환에 대해 FDA 승인을 받아 오노와 다이이치의 대결이 예고됨","so":"Fierce Pharma","tm":"11/11 07:45","c":1,"r":"us","u":"https://www.fiercepharma.com/pharma/merck-kgaa-lands-fda-nod-rare-tumor-disorder","p":1794350736,"a":1794362980,"t":"Merck KGaA lands FDA nod in rare tumor disorder, portending Ono, Daiichi showdown","su":"Merck KGaA just secured an FDA approval for its new once-daily oral colony stimulating factor-1 receptor (CSF-1R) inhibitor, adding to a growing list of regulatory checkmarks around the globe. | The FDA’s decision was based on Merck’s phase 3 Maneuver trial and follows similar approvals by other global regulators, including in China, Canada and Switzerland."},{"s":"혁신적인 약물의 \"컴퓨팅 파워\"가 위험에 처해 있습니까? '몽키 브라더'의 단가가 20만 원에 도달했습니다. 누가 이러한 추세를 추진하고 있습니까?","so":"财联社","tm":"11/11 07:32","c":1,"r":"cn","u":"https://www.cls.cn/detail/2427627","p":1794349927,"a":1794380460,"t":"创新药“算力”告急？“猴哥”单价冲至20万 谁在推高这股风","su":"① 현재 시장에서 실험용 원숭이의 전반적인 가격이 상승하고 있습니다. 3~5세의 적정 연령의 게잡이원숭이 한 마리의 가격은 일반적으로 15만 이상에서 20만 마리 정도인 반면, 붉은털원숭이 한 마리의 가격은 약 12만 위안이다. ② 실험용 원숭이의 이번 가격 인상은 단순한 순환적 변동이 아니라 공급 측면의 '기존 계정'과 수요 측면의 '새 불'이 충돌한 결과입니다. '커추앙반일보'는 7월 15일 보도했다(시시윤 기자) 지난 이틀 동안 의료계에서 여름 복날 가장 많이 거론된 것은 기온 상승이 아니라, 단일 가격이 중형차 수준인 실험용 원숭이의 치솟는 가치였다. 바이오의약 분야에 오랫동안 관심을 가져온 한 투자자는 과학기술혁신위원회일보 기자에게 \"지난해 말 산업계에서 다들 실험용 원숭이 가격 인상에 대해 논의를 했고, 최근 며칠 사이 자주 이야기가 오갔다\"며 \"원숭이 개체수, 예약 일정, 각 기업의 가격 인상률 등이 모두 우려스러운 부분이다. 업계도 걱정이 좀 있다. 실험용 원숭이 공급이 부족하면 전임상 R&D 비용이 늘어나는 걸까\"라고 말했다. 혁신적인 약물을 개발하고 신약 개발 주기를 연장합니다.\" 공급 측면에서는 '원숭이를 찾기 어렵다'고 한다."},{"s":"의료기기 매출 ‘0’…5년만에 신약사업 포기도","so":"서울경제","tm":"11/11 07:00","c":1,"r":"kr","u":"https://www.sedaily.com/article/20112519","p":1794348006,"a":1794377535,"su":"의료기기 매출(물건을 판 돈 전체) ‘0’…5년만에 신약사업 포기도 ■바이오 신사업 진출기업 ‘빨간불’ 일진, 신약개발 계열사 철수 수순 웰리시스는 3년 영업손실 124억 KT도 6년전 진입에도 성과 없어 “ODM 협업 등 전략 없인 어려워” 바이오·헬스케어를 미래 성장동력으로 내세웠던 기업들의 신사업에 경고등이 켜졌다. 신약 개발 계열사의 직원이 7명에 그쳐 사업 정리를 검토하거나 수백억 원의 투자금을 유치하고도 적자를 벗어나지 못하는 사례가 잇따르고 있기 때문이다."},{"s":"희귀 양성 연조직 종양에 대한 또 다른 옵션이 FDA 승인을 받았습니다.","so":"MedPage Today","tm":"11/11 05:22","c":1,"r":"sg","u":"https://www.medpagetoday.com/hematologyoncology/othercancers/123817","p":1794342175,"a":1794350725,"t":"Another Option for Rare Benign Soft-Tissue Tumor Wins FDA Approval","su":"Pimicotinib achieved 54% objective response rate in unresectable tenosynovial giant cell tumor"},{"s":"바이엘, 2차 뇌졸중 위험 감소제로 선하보(Sunharbo) FDA 승인 획득","so":"Yahoo Finance","tm":"11/11 03:39","c":1,"r":"us","u":"https://finance.yahoo.com/healthcare/articles/bayer-wins-fda-approval-sunharbo-183900909.html","p":1794335940,"a":1794350725,"t":"Bayer Wins FDA Approval for Sunharbo for Secondary Stroke Risk Reduction","su":"Bayer gains FDA approval for Sunharbo, the first Factor XIa inhibitor approved worldwide, opening new growth opportunities in stroke prevention."},{"s":"이러한 유형의 혁신적인 약물은 더 이상 병원 약물 평가 지표의 대상이 아닙니다.","so":"21财经","tm":"11/10 22:28","c":1,"r":"cn","u":"https://www.21jingji.com/article/20261110/herald/94f08eb3082d0ddc7b9f459735fdfa0e.html","p":1794317280,"a":1794350725,"t":"这类创新药，不再受医院药品考核指标约束","su":"11月10日，国家卫生健康委、国家医保局、国家中医药局和国家疾控局联合印发《关于进一步做好创新药安全合理配备使用工作的通知》，围绕创新药安全合理配备使用的重点环节，从促进合理配备、加强培训指导、优化使用条件、完善管理举措等方面提出了具体政策措施。 ●二级以上医疗机构要优化完善创新药进院制度和工作流程，及时召开药事管理与药物治疗学委员会会议，讨论本机构基本用药供应目录更新调整事项，根据本机构业务能力和诊疗工作需要，及时将相关创新药纳入本机构用药目录。"},{"s":"Shanghai RAAS Xu Jun: 중국의 혁신적인 의약품의 고품질 개발에는 R&D와 제조 간의 협력 노력이 필요합니다.","so":"新华网上海","tm":"11/10 22:13","c":1,"r":"cn","u":"http://sh.news.cn/20261110/fe45aa1826e2431d99d9e3fde244c5cf/c.html","p":1794316427,"a":1794350725,"t":"上海莱士徐俊：中国创新药高质量发展，需要研发与制造协同发力","su":"第九届进博会 | 上海莱士徐俊：中国创新药高质量发展，需要研发与制造协同发力-﻿视频链接：https:vodpub1.v.news.cnoriginal20261110567f98c952284e85ae05c3521a960afd.mp4新华网上海11月10日电（史依灵）第九届中国国际进口博览会期间，上海莱士副董事长、总经理徐俊在接受新华网专访时表示，公司正以“拓浆+脱浆”双轮驱动，在拓展血液制品品种及临床应用的同时，向创新药研发延伸，持续布局出凝血、炎症和免疫三大领域。"},{"s":"GenScript Biotech (01548) 기타-사업개발 최신","so":"信報網站","tm":"11/10 21:46","c":1,"r":"hk","u":"https://m.hkej.com/landing/mobarticle2/id/4562530/%25E9%2587%2591%25E6%2596%25AF%25E7%2591%259E%25E7%2594%259F%25E7%2589%25A9%25E7%25A7%2591%25E6%258A%2580%252801548%2529%2520%25E5%2585%25B6%25E4%25BB%2596-%25E6%25A5%25AD%25E5%258B%2599%25E7%2599%25BC%25E5%25B1%2595%25E6%259C%2580%25E6%2596%25B0%25E6%2583%2585%25E6%25B3%2581","p":1794314797,"a":1794316523,"t":"金斯瑞生物科技(01548) 其他-業務發展最新情況","su":"GenScript Biotech (01548) 자발적 발표: 상장(주식시장에 처음 들어오는 것) 계열사 Legend Biotech Co., Ltd.의 2026년 9월 30일 마감 3분기 재무 결과(238KB, pdf)"},{"s":"중국보험협회는 상업용 보험 약품 목록의 첫 번째 버전을 출시했으며, 의료보험국은 상업용 건강보험에 9가지 혁신적인 약품을 포함시켰습니다.","so":"财新","tm":"11/10 21:09","c":1,"r":"cn","u":"https://finance.caixin.com/2026-11-10/102503176.html","p":1794312540,"a":1794350725,"t":"中保协推出首版商业保险药品清单 医保局商业健康险创新药纳入9种","su":"【财新网】在医保的基础上，商业保险如何保障消费者在基本医保外的保障需求？11月10日，中国保险行业协会（下称“中保协”）针对商业医疗保险发布了三个示范条款和一份配套使用的药品清单，为短期、长期医疗险以及“惠民保”三类商业保险产品提供了条款和药品的基本“样板”。 中保协表示，近年来，商业医疗保险成为行业发展的主要增长点，也是服务民生保障的重要支撑，但与人民群众日益增长的健康保障需求相比仍有差距。一是各公司条款表述差异较大，免责条款、理赔材料等内容要求各异，免赔额等常用概念口径不一。二是行业已承担了相当数量的创新药保障，但离人民群众实际需求仍有差距，社会公众对相关保障的了解也比较有限，为将更多创新药纳入保障范围、更好管控风险、提升经营可持续性，亟需制定符合行业实际、契合商保经营规律的商保药品推荐清单。"},{"s":"Novocure는 효능 문제로 인해 Optune Mya 암 장치에 대한 FDA 승인을 거부했습니다.","so":"Fierce Biotech","tm":"11/10 19:52","c":1,"r":"us","u":"https://www.fiercebiotech.com/medtech/novocure-denied-fda-approval-optune-mya-cancer-device-after-efficacy-concerns","p":1794307924,"a":1794350725,"t":"Novocure denied FDA approval for Optune Mya cancer device after efficacy concerns","su":"Novocure has been hit with a relatively rare “not approvable” letter from the FDA for its tumor-treating electric fields device. | Novocure has been hit with a relatively rare “not approvable” letter from the FDA for its tumor-treating electric fields device."},{"s":"판밍: 시장은 점차 바닥을 치고 반등을 준비하고 있습니다. 소비 및 혁신 의약품 분야에 주목하십시오.","so":"第一财经","tm":"11/10 16:41","c":1,"r":"cn","u":"https://www.yicai.com/video/103434373.html","p":1794296514,"a":1794316522,"t":"凡明：大盘逐渐筑底 酝酿反弹 关注消费和创新药板块"},{"s":"혁신신약, 바이오의약품, 생명과학서비스산업(1편)","so":"21财经","tm":"11/10 16:29","c":1,"r":"cn","u":"https://www.21jingji.com/article/20261110/herald/4a19459e97353085071bfc4147a5773d.html","p":1794295740,"a":1794298355,"t":"创新药、生物制品与生命科学服务行业（上）","su":"혁신적인 의약품, 생물학 제품 및 생명과학 서비스 산업(1부) M&A 연구 보고서(2026) \"파이프라인 거래\"에서 \"플랫폼 수준 M&A\"로: 중국 혁신 자산 및 통제 거래 창구의 글로벌 가격 재편 저자: Qianji Investment Banking Research Institute 문서 번호: QJTZCXYSWZPSMKXSBG20260810002 버전: V2.0 데이터 컷오프: 2026-08-10 버전 기록 버전 번호 날짜 변경자 변경 내용에 대한 간략한 설명 V1.0 2026-08-14 Zhu Zibaijia 혁신적인 의약품, 생물 제품 및 생명 과학 서비스 산업의 인수 합병에 관한 연구 보고서 최종 초안 V2.0 2026-8-14 Chen Jiayi 검토 및 개정 이 보고서는 산업 연구, M&A 사업 개발 및 프로젝트 방법론 논의에만 사용되며 증권 투자 자문, 법률 자문, 세금 조언 또는 의료 조언. 거래, 평가 및 정책 규칙의 구체적인 적용은 거래 당시의 최신 공시 및 전문 자문가의 의견과 연계하여 검토되어야 합니다."},{"s":"4개 부서에서 다음과 같은 문서를 발행했습니다. 평균 외래환자 약품 비용 증가에 혁신적인 약품이 포함되지 않음을 명확히 함","so":"ThePaper.cn","tm":"11/10 14:07","c":1,"r":"cn","u":"https://www.thepaper.cn/newsDetail_forward_34444104","p":1794287266,"a":1794298356,"t":"四部门发文：明确有关创新药不纳入门诊次均药品费用增幅","su":"국가위생건강위원회, 국가의료보험국, 국가중의약국, 국가질병통제예방총국은 오늘(10일) 혁신적인 약물의 안전하고 합리적인 배포 및 사용의 핵심 측면에 초점을 맞춘 \"혁신 약물의 안전하고 합리적인 배포 및 사용 개선에 관한 고시\"를 발표했습니다."},{"s":"과연 제약, 자회사의 창약 벤처를 흡수 합병","so":"日本経済新聞","tm":"11/10 13:58","c":1,"r":"jp","u":"https://www.nikkei.com/article/DGXZQOMG00002_Q6A111C2000000/","p":1794286702,"a":1794298360,"t":"科研製薬、子会社の創薬ベンチャーを吸収合併","su":"과연제약은 자회사에서 창약벤처인 ARTham Therapeutics(도쿄·분쿄)를 흡수합병한다고 발표했다. 합병의 효력 발생일은 12월 31일을 예정한다. 그룹 내 경영자원의 집중과 조직운 트 입찰에서 낙찰","so":"Jiemian.com","tm":"11/12 17:20","c":2,"r":"cn","u":"https://www.jiemian.com/article/15326346.html","p":1794471629,"a":1794489660,"t":"永贵电器：控股子公司中标2145万元动力电池采购项目","su":"Yonggui Electric은 회사의 지배 자회사인 Jiangsu Yonggui가 최근 CRRC Logistics로부터 입찰 낙찰 통지를 받았으며 CRRC Datong Electric Locomotive Co., Ltd.의 전력 배터리 조달 프로젝트 입찰에서 총 낙찰 금액 2,145만 위안(세금 포함)에 낙찰되었다고 발표했습니다. 정식 계약이 원활하게 체결되고 이행될 수 있다면 2026년과 향후 회사의 운영 성과에 긍정적인 영향을 미치고 철도 운송 분야에서 회사의 경쟁 우위를 더욱 강화하는 데 도움이 될 것입니다."},{"s":"이차전지 스타트업 런치패드 결과보고회…\"투자상담\" 등[청주소식]","so":"뉴시스","tm":"11/12 15:26","c":2,"r":"kr","u":"https://www.newsis.com/view/NISX20261112_0003865773","p":1794464775,"a":1794467104,"su":"[청주=뉴시스] 임선우 기자 = 충북도와 충북창조경제혁신센터는 12일 청주시 오송 H 세종시티 호텔에서 '이차전지 스타트업 런치패드 결과보고회'를 열었다.스타트업 런치패드(Startup Launchpad)는 창업 아이디어 검증부터 제품·서비스 출시와 초기 사업화까지 지원하는 창업 지원 플랫폼이다.이날 결과보고회에서는 올해 이차전지 지원사업에 선정된 유명 스.."},{"s":"\"전자 부품 그룹\" Likai-KY는 북미 업계 플레이어를 불러 LFP 양극재를 배치합니다. 대만 합작 공장 설립으로 일일 한도가 자극된다.","so":"中時新聞網","tm":"11/12 13:39","c":2,"r":"tw","u":"https://www.chinatimes.com/realtimenews/20261112002817-260410","p":1794458384,"a":1794459136,"t":"《電零組》立凱-KY攜北美業者布局LFP正極材料 台灣合資設廠激勵漲停","su":"Likai-KY(5227)는 3분기 분기 보고서를 발표했으며 협력 레이아웃에도 새로운 진전이 있었습니다. Likai-KY의 첫 3분기 매출(물건을 판 돈 전체)은 6,600만 위안, 영업 순손실은 3억 1,800만 위안, 세후 순손실은 3억 2,200만 위안, 주당 손실은 4.27위안이었습니다. Likai-KY는 공장 건설 성수기에 접어든 타이난 공장의 영향으로 관련 비용이 증가했으며 이는 여전히 단기적으로 반영될 것이라고 지적했습니다."},{"s":"대만 과학 기술 대학교에서 Yushan의 젊은 학자가 된 Huang Zhenrui는 배터리 연구 인재를 양성하기 위해 모교로 돌아갑니다.","so":"中央社 CNA","tm":"11/12 11:01","c":2,"r":"tw","u":"https://www.cna.com.tw/postwrite/chi/449770","p":1794448919,"a":1794453348,"t":"從臺科大學生到玉山青年學者 黃貞睿返母校培育電池研究人才","su":"從臺科大學生、海外研究人員到重返母校任教，國立臺灣科技大學化工系助理教授黃貞睿獲選教育部玉山青年學者。多年來，他投入電池及同步輻射影像與光譜診斷技術研究，此次獲選不僅肯定其學術研究成果，也將為學生培育、國際交流及研究量能建置挹注更多資源。"},{"s":"중국민용항공대학, CATL과 항공 배터리 감항성 실험실 공동 구축 계약 체결","so":"Jiemian.com","tm":"11/11 22:54","c":2,"r":"cn","u":"https://www.jiemian.com/article/15322916.html","p":1794405250,"a":1794411543,"t":"中国民航大学与宁德时代签约，共建航空电池适航实验室","su":"원본 500만 위안, 139억 6,300만 위안, 139억 2,800만 위안을 달성하여 자동차 회사 수익 목록에서 상위 3위를 차지했습니다. 전원 배터리 부문에서는 CATL이 모회사 순이익(모든 비용을 빼고 남은 돈) 645억3000만 위안으로 1위를 차지했고, 이웨이리튬에너지와 중국혁신항공은 각각 모회사 순이익 52억4000만 위안, 13억6600만 위안을 기록했다. 키워드로 나누어 보면 매출액 기준으로 확고한 업계 선두를 달리고 있는 BYD는 여전히 이익 측면에서 업계 내 가격 경쟁의 압박을 받고 있다. BYD는 1~3분기에 전년도와 기본적으로 동일한 5,663억 4천만 위안의 영업 이익을 달성했습니다. 모회사에 귀속되는 순이익은 223억 4500만 위안으로 전년 동기 대비 4.2% 감소했습니다. 3분기 모기업 순이익은 100억2000만 위안으로 전년 동기 대비 28.08% 증가했다. 판매 측면에서는 해외 판매량이 133만7800개로 전년 동기 대비 91% 증가했다. 팡바오, 덴자, 양왕은 총 41만대가 판매돼 전년 동기 대비 75% 증가했다."},{"s":"Lunar의 새로운 가정용 DC 고속 충전기는 EV 배터리를 작동시킵니다.","so":"Electrek","tm":"11/13 06:41","c":1,"r":"us","u":"https://electrek.co/2026/11/12/lunars-new-home-dc-fast-charger-puts-your-ev-battery-to-work/","p":1794519660,"a":1794523826,"t":"Lunar’s new home DC fast charger puts your EV battery to work","su":"Lunar의 새로운 가정용 DC 고속 충전기는 한 시간 안에 100마일의 주행 거리를 제공하며 정전 시 집에 전력을 공급하여 자동차가 에너지를 회복할 수 있도록 해줍니다."},{"s":"중국 DeepSeek, 6월에 이어 150억 달러의 거액 조달 텐센트·CATL가 참가","so":"日経クロステック","tm":"11/13 05:00","c":1,"r":"jp","u":"https://xtech.nikkei.com/atcl/nxt/column/18/03065/111100023/?i_cid=nbpnxt_new_top_it_06","p":1794513600,"a":1794523827,"t":"中国DeepSeek、6月に続き150億ドルの巨額調達 テンセント・CATLが参加","su":"중국의 AI(인공지능) 연구기업인 DeepSeek(딥 시크)은 2026년 10월, 치아키 가랑이(텐센트 홀딩스)와 전지 메이커 대기업의 덕덕시대 신능원과기(CATL) 등이 참여하는 자금 조달이 약 150억 달러에 달했다고 보도됐다."},{"s":"'훨씬, 훨씬 더 빠르다': 중국의 배터리 교체 전기 트럭이 EV 주행 거리 불안에 대한 해답이 될 수 있을까요?","so":"The Guardian","tm":"11/12 23:48","c":1,"r":"world","u":"https://www.theguardian.com/environment/2026/nov/12/china-battery-swapping-e-trucks-catl-ev-range-anxiety","p":1794494880,"a":1794523828,"t":"‘It is much, much faster’: could China’s battery-swapping e-trucks be the answer to EV range anxiety?","su":"배터리 제조업체 CATL은 2027년 말까지 중국에 2,000개의 교환소를 확보하고 해당 기술을 유럽으로 가져오는 것을 목표로 하고 있습니다."},{"s":"리튬 이온 전지 원인의 화재 방지 오사카 시내의 25 소방서에서 회수 개시에, 12월부터","so":"産経ニュース","tm":"11/12 18:35","c":1,"r":"jp","u":"https://www.sankei.com/article/20261112-QEJUYWX4NRNYLDBRBDSMUJKAWM/","p"  유틸리티, 엔지니어링 임대 및 데이터 센터로 확대됨에 따라 회사는 Power Hub를 중심으로 하는 전력 사업이 2027년에는 트럭 및 전기 자동차 충전을 능가하여 최대 사업이 될 것으로 예상하고 있습니다. Power Hub는 발전기와 결합하여 전력 사용량이 가장 많을 때 전력을 공급할 수 있으므로 발전기는 더 짧은 시간에 배터리 충전에 집중할 수 있어 저부하에서 장기간 작동하는 동안 연료 및 유지 관리 비용이 절감됩니다. Xos는 고객 발전기를 자동으로 시작하고 중지하는 시스템 기능을 입증했으며 대규모 데이터 센터 엔지니어링 계약자와도 협력하고 있습니다. 현재 고객들은 해당 장비가 데이터센터의 정식 운영 중에 부하를 추가로 지원할 수 있는지, 더 이상 건설 현장 장비 충전에만 사용되지 않는지 평가하고 있습니다."},{"s":"Juheng-Chuang, Yaohua와 손잡고 내년 6월 완공 예정인 에너지 저장 시스템 구축 - 뉴스","so":"MoneyDJ","tm":"11/13 10:48","c":1,"r":"tw","u":"https://www.moneydj.com/kmdj/news/newsviewer.aspx?a=403efb6d-881d-472f-a450-d1f0d8071c14","p":1794534480,"a":1794539841,"t":"聚恆-創攜手燿華建置儲能系統明年6月完工- 新聞","su":"Juheng-Chuang(4582)은 산업용 및 상업용 오프미터 에너지 저장 시장을 계속 확장하고 있습니다. PCB 제조업체 Yaohua(2367)와 손을 잡고 이란 공장에 5.04MW/10.03MWh 규모의 대규모 비하인드 에너지 저장 시스템을 구축했다고 발표했습니다. 2027년 6월 완공 예정이다. 급전용 스마트 에너지 관리 시스템을 통해 연간 전기요금을 1,2..."},{"s":"해외일보｜JD.com, 독일 CECONOMY 지분 약 59.8% 13억 3500만 유로에 인수, Junda 주식, 오만 5GW 배터리 프로젝트 종료","so":"Jiemian.com","tm":"11/13 10:39","c":1,"r":"cn","u":"https://www.jiemian.com/article/15328727.html","p":1794533942,"a":1794539831,"t":"出海日报｜京东13.35亿欧元收购德国CECONOMY约59.8%股权，钧达股份终止阿曼5GW电池项目","su":"JD.com은 독일 CECONOMY AG 지분 약 59.8%를 13억 3,500만 유로에 인수했습니다. 11월 12일, JD.com은 독일 소비자 가전 소매 그룹인 CECONOMY AG에 대한 자발적인 공개 인수 제안을 완료했다고 발표했습니다. 이를 통해 총 13억 3,500만 유로에 해당하는 자본금의 59.8%와 의결권을 인수했습니다. 거래가 완료되면 CECONOMY는 JD.com의 자회사가 되며 11월 12일부터 JD.com의 연결 재무제표에 포함될 예정입니다. 파트너 Convergenta가 보유한 지분 25.3%를 포함하면 두 당사자는 CECONOMY 지분의 총 약 85.2%를 보유합니다. 이번 인수는 JD.com이 간접적으로 전체 지분을 소유한 자회사를 통해 이루어졌으며, 제안 가격은 주당 현금 4.60유로였습니다. CECONOMY는 MediaMarkt 및 Saturn과 같은 가전제품 소매 브랜드를 소유하고 있으며 유럽 11개 국가 및 지역에서 1,000개 이상의 실제 매장을 운영하고 있습니다. 기존 합의에 따라 CECONOMY는 현지 관리팀과 기술 구조를 유지하면서 유럽에서 계속 독립적으로 운영될 것입니다."},{"s":"글로벌 에너지저장 학술교류 플랫폼 구축을 위해 제1회 글로벌 에너지저장 학술포럼이 샤먼에서 개최됐다.","so":"人民网-福建频道","tm":"11/13 10:07","c":1,"r":"cn","u":"http://fj.people.com.cn/n2/2026/1113/c181466-41749893.html","p":1794532020,"a":1794539833,"t":"搭建全球储能学术界交流平台 首届环球储能学术论坛在厦门举行","su":"인민일보 온라인, 샤먼, 11월 13일(Yu Nailiu) 에너지 저장의 미래를 탐구하기 위한 세계적인 지혜를 모으십시오. 지난 12일, 제1회 글로벌 에너지 저장 학술 포럼 '프론티어 대화·미래를 위한 지능 저장'이 샤먼에서 열렸습니다. 이번 행사에는 국제 에너지저장 분야의 유명 학자, 전문가, 학자, 업계 대표들이 한자리에 모여 에너지저장 과학기술에 대해 논의했다."},{"s":"뉴욕주, 2030년까지 6GW 목표 달성을 위해 1GW 대규모 에너지 저장 입찰 시작","so":"鉅亨網","tm":"11/13 10:00","c":1,"r":"tw","u":"https://news.cnyes.com/news/id/6661288","p":1794531616,"a":1794539842,"t":"紐約州啟動1GW大型儲能招標朝2030年6GW目標推進","su":"뉴욕주, 2030년 6GW 목표 달성을 위해 1GW 대규모 에너지 저장 입찰 시작 Uanalyze 2026년 11월 13일(Uanalyze/Industry Data Center Report) ⸺ 뉴욕주는 2차 대규모 에너지 저장 입찰을 공식적으로 시작했으며, 약 1GW의 에너지 저장 용량을 구매할 것으로 예상되며, 2030년에 6GW 에너지 저장 장치를 배치한다는 정책 목표를 지속적으로 추진할 예정입니다. 뉴욕 주 에너지 입찰 처리를 담당하는 연구개발청(NYSERDA)은 개발자가 12월 15일 이전에 자격 신청서를 제출하고 프로젝트 선택의 2단계에 들어가기 전에 검토를 통과해야 한다고 밝혔습니다. 이번 입찰은 1차 조달 라운드를 따릅니다. 뉴욕주는 첫 번째 라운드에서 총 용량이 950MW에 달하는 8개의 대규모 에너지 저장 프로젝트와 계약을 체결했습니다. 두 번째 라운드의 규모는 약 1GW로, 전력망의 파견 가능한 에너지 저장 자원을 더욱 확장할 것입니다."},{"s":"CITIC증권: 배터리 산업 체인의 수익성이 점차 회복되고 있으며, 리튬 배터리 부문의 투자 가치가 부각되고 있습니다.","so":"第一财经","tm":"11/13 09:16","c":1,"r":"cn","u":"https://www.yicai.com/news/103439099.html","p":1794528970,"a":1794539835,"t":"中信证券：电池产业链盈利逐步修复，锂电板块投资价值凸显","su":"{{aisd}} AI 생성 고지 사항 CITIC 증권 연구 보고서에 따르면 2026년과 2026년 3분기의 첫 3분기 배터리 및 에너지 관리 산업 체인의 운영 결과에 따르면 전 세계 에너지 저장 수요는 여전히 높고 신에너지 차량에 대한 수요는 차별화되었으며 산업 체인의 대부분 링크가 수익 성장을 달성했으며 미드스트림 및 업스트림 이익이 전년 대비 크게 회복되었지만 3분기는 분기별로 압박을 받고 있습니다. 이익 측면에서는 배터리 부문 매출(물건을 판 돈 전체)이 빠른 성장을 유지했다. 탄산리튬, 양극, 분리막, 전해질, 헥사플루오로, 구리박, 알루미늄박 및 기타 부문의 이익은 전년 대비 크게 향상되었습니다. 다만, 일부 부문의 3분기 이익은 전년 동기 대비 감소했다. 공급 측면에서는 업계 '고정자산+건설진행 중' 성장률이 전년 동기 대비 계속 반등해 2026년 3분기에는 20%까지 상승했다. 동시에, 자본 지출은 뚜렷한 차별화를 보였습니다. 배터리, 양극, 음극, 구조부품 등 관련 부품은 전년 대비 빠른 성장세를 보였다. 산업은 점차 전반적인 위축에서 구조적 확장으로 전환했습니다. 중국 리튬 배터리 산업 체인의 상당한 글로벌 경쟁력, 해외 레이아웃의 점진적인 개선, 솔리드 스테이트 및 고속 충전과 같은 신기술의 지속적인 반복을 고려할 때 선도 기업은 기술, 비용 및 세계화 이점을 활용하여 점유율 및 수익성 이점을 더욱 확대하고 산업 체인의 모든 측면에서 고품질 선도 기업에 대해 계속 낙관할 것으로 예상됩니다."},{"s":"에너지저장장치 해외 진출 가속화","so":"央视网","tm":"11/13 08:43","c":1,"r":"cn","u":"https://news.cctv.cn/2026/11/13/ARTIHohjvz8obzgSqHC4GJMt261113.shtml","p":1794527032,"a":1794539837,"t":"储能装备加速出海","su":"새로운 전력 시스템 구축을 위한 핵심 지원으로서 에너지 저장은 국가가 에너지 기술의 최고 수준을 장악하는 핵심 경로가 되고 있습니다. 최근 몇 년 동안 우리나라의 에너지 저장 산업은 추종에서 나란히 달리고 선도로 나아가는 역사적인 도약을 이루었습니다. 그 중 에너지저장 수출이 강한 모멘텀을 보이고 있다. 2025년에는 우리나라의 에너지 저장 배터리 수출이 전년 대비 67.9% 증가하여 60개국 이상을 대상으로 사업을 펼치게 됩니다."},{"s":"에너지 저장 합병 및 인수로 인해 감가상각이 발생하고 Chailease-KY(5871) 태양광 자산이 911억 위안에 도달했으며 대만의 순이익은 분기별로 3% 감소했습니다.","so":"鉅亨網","tm":"11/13 01:34","c":1,"r":"tw","u":"https://news.cnyes.com/news/id/6661024","p":1794501245,"a":1794523841,"t":"儲能併購帶入折舊，中租-KY(5871) 太陽能資產達 911 億元、台灣淨利季減 3%","su":"에너지 저장 합병 및 인수로 인해 감가상각이 발생했으며, Chailease-KY(5871)의 태양광 자산은 911억 위안에 달했고 대만의 순이익(모든 비용을 빼고 남은 돈)은 분기별로 3% 감소했습니다. Uanalyze 2026년 11월 13일(Uanalyze/산업 데이터 센터 보고서) ⸺ 대만의 태양 에너지는 Chailease-KY(5871-TW)의 가장 빠르게 확장되는 자산입니다. 3분기 말 총 태양광 자산은 911억 위안으로 2분기보다 연간 18%, 15% 증가했다. 분기별 증가 데이터에는 이번 분기에 처음으로 포함된 에너지 저장 자산이 포함됩니다. 에너지저장장치는 처음으로 재무보고서에 포함되었습니다. 회사는 3분기에 에너지 저장 사업자를 인수하고 에너지 저장 자산을 전체 태양광 자산에 포함시켜 재무제표에 통합하기 시작했습니다. 따라서 발전소 자체 자산의 증가율은 15% 미만이었습니다."},{"s":"회사 상호 작용丨이 회사는 PCB 동박, 전고체 배터리 등의 최신 개발을 공개합니다.","so":"第一财经","tm":"11/12 23:17","c":1,"r":"cn","u":"https://www.yicai.com/brief/103438859.html","p":1794493020,"a":1794496146,"t":"公司互动丨这些公司披露在PCB铜箔、固态电池等方面最新情况","su":"11월 12일, 다수의 상장(주식시장에 처음 들어오는 것)기업이 대화형 플랫폼, IR 활동 기록 공개 및 기타 채널을 통해 PCB 동박, 전고체 배터리 등에 대한 회사의 최신 현황을 공개했습니다. [PCB 동박] Nord Shares:"},{"s":"Chinova Energy Storage는 2027년 매출의 5~10%를 목표로 하고 있습니다! Feihong(2457)의 150,000개 충전 지점 중 최소 30%가 에너지 문제에 직면해 있습니다.","so":"鉅亨網","tm":"11/12 22:00","c":1,"r":"tw","u":"https://news.cnyes.com/news/id/6660840","p":1794488410,"a":1794489675,"t":"馳諾瓦儲能瞄準 2027 年營收 5% 到 10%！飛宏(2457) 15 萬個充電點至少三成面臨能源問題","su":"Chinova Energy Storage는 2027년 매출(물건을 판 돈 전체)의 5~10%를 목표로 하고 있습니다! Phihong Technology(2457) 150,000개 충전소 중 최소 30%가 에너지 문제에 직면 Uanalyze 2026년 11월 12일(Uanalyze/산업 데이터 센터 보고서) ⸺ Phihong Technology(2457-TW) 그룹의 충전 파일 사업 ZEROVA의 2027년 목표는 에너지 저장 제품이 ZEROVA 매출의 5%를 차지하는 것입니다. 10%; 미국 충전 보조금 철회 이후 고객의 스테이션 확장 계획이 3분기 정도 연기되면서 점차 주문이 돌아왔습니다. 에너지 저장에 대한 수요는 고객의 전력 소비 문제에서 파생됩니다. 2025년부터 많은 충전소 고객이 전력 규제 및 전력 소비 부족 문제에 직면하고 있으며 충전 파일과 페어링할 수 있는 에너지 저장 장치가 있는지 문의했습니다. 따라서 회사는 에너지 저장 제품 라인에 진출하고 전체 패키지를 제공할 공급업체를 찾았습니다."},{"s":"Juheng은 Yaohua와 손을 잡고 포스트 미터 에너지 저장 장치를 구축하고 스마트 파견을 통해 연간 수천만 전기 요금을 절약할 수 있습니다.","so":"DIGITIMES","tm":"11/12 17:14","c":1,"r":"tw","u":"https://www.digitimes.com.tw/tech/dt/n/shwnws.asp?id=774591","p":1794471240,"a":1794489677,"t":"聚恆攜手燿華建表後儲能 智慧調度年省電費上看千萬","su":"AI, 고성능 컴퓨팅(HPC), 전자제품 제조 분야의 컴퓨팅 파워와 생산 능력이 확대되면서 전력 소모가 큰 산업에서는 전력 안정성과 에너지 비용 관리에 대한 요구가 급증하고 있습니다. 재생 에너지 및 에너지 저장 통합 기업인 Juheng Technology는 산업용 및 상업용 부외 에너지 저장 장치를 배포합니다."},{"s":"태양광 에너지 저장은 사람들의 생활에 도움이 되고 녹색 에너지는 활력 활성화에 도움이 됩니다.—민펑현 우싱촌의 태양광 에너지 저장 프로젝트가 가동됩니다.","so":"中新网·新疆","tm":"11/12 16:43","c":1,"r":"cn","u":"http://www.xj.chinanews.com.cn/dizhou/2026-11-12/detail-ihfmxyez7336954.shtml","p":1794469381,"a":1794523839,"t":"光伏储能惠民生 绿色动能助振兴——民丰县五星村光伏储能项目落地投用","su":"태양광 에너지 저장은 사람들의 생활에 도움이 되고 녹색 에너지는 진흥에 도움이 됩니다. 민펑현 우싱촌의 태양광 에너지 저장 프로젝트가 가동되었습니다. 농촌 에너지의 녹색 및 저탄소 전환을 더욱 촉진하기 위해 오지 마을의 송전 불안정과 전력 공급 부족 문제를 효과적으로 해결하고 농촌 주민의 생활 보장 기반을 지속적으로 강화합니다. 최근 민펑현 야바통구지향 우싱촌 주민들에게 혜택을 제공하는 태양광 지원 에너지 저장 프로젝트가 완전히 완료되어 정식으로 가동되었습니다. 이 프로젝트는 현 고유의 태양광 및 열 자원 장점을 바탕으로 '태양광 + 에너지 저장' 통합 에너지 공급 모델을 혁신적으로 구현하여 마을 정수장과 마을 주민 가족에게 안정적이고 깨끗하며 지속 가능한 녹색 전력을 보장하고, 농촌 생산 및 생활 전력 조건을 효과적으로 개선하며, 빈곤 완화 결과를 지속적으로 통합 및 확대하고, 녹색 생태학적 추진력으로 농촌 활성화에 완전한 힘을 실어줍니다."},{"s":"Pakistan Synthetics Limited, 생산 확대, 10MW 배터리 저장 시스템 설치 계약 체결","so":"Profit by Pakistan Today","tm":"11/12 14:26","c":1,"r":"sg","u":"https://profit.pakistantoday.com.pk/2026/11/12/pakistan-synthetics-limited-signs-deals-to-expand-production-install-10mw-battery-storage-system","p":1794461186,"a":1794467119,"t":"Pakistan Synthetics Limited signs deals to expand production, install 10MW battery storage system","su":"회사는 이탈리아 SACMI로부터 플라스틱 마개 제조 시스템 2개를 조달하고 10MW/20MWh 배터리 저장 시스템을 설치하여 전기 비용을 절감할 예정입니다."},{"s":"비디오/Taiwan Cement는 처음으로 COP31에 참가하여 강력한 지진 후 터키 재건을 돕기 위한 3D 프린팅 하우스 + 시멘트 에너지 저장 장치를 선보였습니다.","so":"TVBS新聞網","tm":"11/12 14:15","c":1,"r":"tw","u":"https://news.tvbs.com.tw/world/4049467","p":1794460500,"a":1794467116,"t":"影音／台泥首赴COP31 秀3D列印屋＋水泥儲能 助土國強震後重建","su":"대만 회사인 \"Taiwan Cement Corporation\"은 UN 기후 정상회담에 참가하여 터키가 강력한 지진 발생 시 신속하게 \"비상 주택\"을 건설할 수 있도록 최첨단 3D 프린팅 기술을 선보였습니다. 폭발과 화재에 강한 독립적인 \"시멘트 에너지 저장 캐비닛\"을 갖추고 있습니다. 그들은 태양 에너지로 완전히 전력을 공급받을 수 있습니다. 터키 TVBS 팀의 현장 보고서를 확인하세요."},{"s":"츠키시마 HD, 미립자 기술 활용 전고체 전지용 총력","so":"日刊工業新聞","tm":"11/12 12:00","c":1,"r":"jp","u":"https://www.nikkan.co.jp/articles/view/796959","p":1794452400,"a":1794459146,"t":"月島HD、微粒子技術を活用 全固体電池向け総力"},{"s":"Yaoheng Energy는 유상증자 청약을 성공적으로 완료했으며 Innolux는 오프미터 에너지 저장 시장의 레이아웃을 심화하기 위해 20년 장기 계약을 체결했습니다. 업계 뉴스 | 사업정보","so":"經濟日報","tm":"11/12 11:03","c":1,"r":"tw","u":"https://money.udn.com/money/story/11799/9872150","p":1794449013,"a":1794453356,"t":"曜衡能源成功完成增資認購 群創光電20年長約助攻 深化表後儲能市場布局 | 產業動態 | 商情","su":"台灣智慧能源市場持續發展，曜衡能源宣布成功完成現金增資認購，展現投資人對公司經營團隊、表後儲能業務及智慧能源發展策略的支持。公司將運用募集資金加速儲能案場開發、能源管理系統（EMS）升級及虛擬電廠（VPP）平台布局，持續擴大服務規模。 曜衡能源表示，此次募資順利完成，將有助於強化資本實力與專案執行能力，支持公司邁入下一階段成長。未來將以表後儲能為核心，結合能源管理技術與長期能源服務模式，協助企業提升用電效率、控制能源成本，並創造可持續的營運價值。 表後儲能是設置於企業用戶電表後端的儲能系統，可依據用電需求與電價時段進行充放電調度。隨著企業更加重視電費管理、用電穩定性及減碳目標，表後儲能可透過尖離峰電價差管理、契約容量與需量控制、尖峰負載調節等方式，提供更具彈性的能源管理工具；搭配適當的系統設計，也有助於提升企業能源韌性。實際效益仍取決於各案場的用電型態、電價條件及系統配置。 相較於單純設備"},{"s":"「나의 꿈은…","so":"毎日新聞","tm":"11/12 09:45","c":1,"r":"jp","u":"https://mainichi.jp/articles/20261111/k00/00m/310/335000c","p":1794444300,"a":1794453356,"t":"「私の夢は…」 ペロブスカイト太陽電池開発者ら、京都賞で講演","su":"稲盛財団が科学や芸術分野での優れた功績をたたえる「京都賞」の第41回（2026年）記念講演会が11日、京都市左京区の国立京都国際会館であった。次世代の再生可能エネルギーと期待される「ペロブスカイト太陽電池」を開発し、先端技術部門で選ばれた宮坂力（つとむ）・桐蔭横浜大特任教授（73）ら受賞者3人がそ"},{"s":"신한자산운용, 아일랜드 ESS 개발 참여…투자도 추진","so":"뉴스핌","tm":"11/12 09:33","c":1,"r":"kr","u":"https://www.newspim.com/news/view/20261112000216","p":1794443580,"a":1794489674,"su":"[서울=뉴스핌] 이정아 기자 = 신한자산운용이 아일랜드에서 추진하는 대규모 장주기 에너지저장장치(ESS) 개발 사업에 금융 파트너로 참여한다. 사업 초기부터 금융구조를 설계하고 펀드를 통한 지분 투자에 나서는 방식으로 해외 에너지 인프라 투자 확대를 추진한다.12일 신"},{"s":"JR 서쪽과 중국 전 축전지 사업 참가 공동 개발 임무 / 시마네","so":"毎日新聞","tm":"11/12 05:01","c":1,"r":"jp","u":"https://mainichi.jp/articles/20261112/ddl/k32/020/179000c","p":1794427308,"a":1794437335,"t":"JR西と中国電 蓄電池事業参入 共同開発取り組む ／島根","su":"JR 서일본과 중국전력은 축전지 사업에서 공동 개발에 임한다고 발표했다. 중국지방에서의 축전소 전개를 내다보고 전력공급의 안정화와 재생가능에너지 도입 확대를 목표로 한다. JR 서쪽이 축전지 사업에 임하는 것은 처음."},{"s":"영국·축전지 개발자가 일본 진출, 규슈에서 운전 개시","so":"日経クロステック","tm":"11/12 05:00","c":1,"r":"jp","u":"https://xtech.nikkei.com/atcl/nxt/column/18/02443/110600185/","p":1794427200,"a":1794437337,"t":"英・蓄電池デベロッパーが日本進出、九州で運転開始","su":"후쿠오카현의 북부 치쿠호 지역은 메이지 이후 탄광으로 번성했지만 에너지의 주체가 석유가 됨에 따라 쇠퇴해 1976년에 모든 탄광이 폐산했다. 그럼 50년. 이 지역은 신재생에너지를 주력으로 한 새로운 에너지혁명에 의해 메가 솔라(대규모 태양광발전소)와 축전소가 급증하고 지금 신에너지의 집적지가 되고 있다."},{"s":"Terra-Gen California의 9억 5천만 달러 규모의 태양광 에너지 저장 프로젝트는 배터리 에너지 저장 장치로 365MW의 태양 에너지를 전송합니다.","so":"鉅亨網","tm":"11/11 22:00","c":1,"r":"tw","u":"https://news.cnyes.com/news/id/6659556","p":1794402033,"a":1794403038,"t":"Terra-Gen加州9.5億美元光電儲能案商轉365MW太陽能搭配電池儲能","su":"9억 5천만 달러 규모의 캘리포니아 태양광 에너지 저장 프로젝트인 Terra-Gen은 365MW의 태양 에너지 및 배터리 에너지 저장 장치 이전을 협상합니다. 캘리포니아주 샌버나디노 카운티에 위치한 9억 5천만 달러 규모의 이 프로젝트는 365MW의 태양광 발전과 173.7MW의 배터리 에너지 저장 장치를 갖추고 있어 새로운 친환경 전력 공급 장치가 건설 단계부터 실제 가동에 들어갈 수 있습니다. Terra-Gen은 11월 10일 해당 부지의 연간 발전 용량이 약 350,000개의 주택과 기업에 공급할 수 있다고 밝혔습니다. Lockhart는 기업 구매자와 전력 공급 계약을 체결했으며 캘리포니아 전력 공급 회사와 장기 전력 구매 계약도 체결했습니다. 상업양도 이후 전력판매는 이미 계약을 통해 지원되고 있다."},{"s":"BESS용 반고체 배터리: 잠재력과 과제","so":"Energy-Storage.News","tm":"11/11 21:22","c":1,"r":"us","u":"https://www.energy-storage.news/semi-solid-state-batteries-for-bess-potential-and-challenges/","p":1794399779,"a":1794403037,"t":"Semi-solid state batteries for BESS: potential and challenges"},{"s":"SON은 배터리 저장에 적합한 Saugeen Shores 부지를 제안했다고 밝혔습니다.","so":"Windsor News Today","tm":"11/11 19:21","c":1,"r":"sg","u":"https://windsornewstoday.ca/midwestern/news/2026/11/11/son-says-proposed-saugeen-shores- r":"kr","u":"https://www.businesspost.co.kr/BP?command=article_view&num=451691","p":1794359330,"a":1794362997},{"s":"요건화까지 반년을 끊은 JC-STAR 제도── 태양광·축전지 사업자가 재확인하고 싶은 제도의 포인트","so":"ITmedia","tm":"11/11 07:00","c":1,"r":"jp","u":"https://www.itmedia.co.jp/smartjapan/articles/2611/11/news009.html","p":1794348000,"a":1794350741,"t":"要件化まで半年を切ったJC-STAR制度──太陽光・蓄電池事業者が再確認したい制度のポイント","su":"2027年4月以降、太陽光発電・蓄電池の系統連系にはJC-STAR制度への対応が必須となる。制度運用開始まで半年を切った。対応製品が増えていく一方で、海外メーカーをめぐる審査の在り方も論点に浮上している。制度の概要と現状を改めて整理し、とりわけ影響の大きい系統用蓄電所の事業者がいまとるべき対応を前後編にわたって紹介する。"},{"s":"계통용 축전지에 의한 수급 조정 시장 가격은 \"대폭 하락한다\"고 전력 소매 벤처 대표가 예상, 축전지 버블 종말에 의한 \"국익 손실 리스크\"에 경종도 | 에너지 동란","so":"ダイヤモンド・オンライン","tm":"11/11 04:35","c":1,"r":"jp","u":"https://diamond.jp/articles/-/402729","p":1794339300,"a":1794350741,"t":"系統用蓄電池による需給調整市場価格は「大幅下落する」と電力小売りベンチャー代表が予想、蓄電池バブル終焉による“国益損失リスク”に警鐘も | エネルギー動乱","su":"電力の送配電網に直接接続し、電力の需給バランスを調整する系統用蓄電池への投資が拡大している。ENEOSグループのほか、大阪ガスや伊藤忠商事、オリックスなどが大型蓄電所を手掛けるなど各地で開発が進む。「3年で元が取れる」ともいわれる高収益への期待から投資バブルの様相も呈してきたが、経済産業省による接続手続きの厳格化や、収益源となる市場の上限価格の引き下げで事業環境は一変しつつある。蓄電池市場はバブルからサバイバルへ向かうのか。蓄電池事業者協議会（BBA）代表も務める、電力小売りスタートアップ、しろくま電力の谷本貫造代表に、蓄電池市場で生き残る条件と蓄電池普及を巡る政策の課題を聞いた。"},{"s":"Calibrant Energy는 PJM의 하이퍼스케일 데이터 센터 고객을 위한 배터리 스토리지를 포함하여 프로젝트 파이낸싱에서 1억 4,500만 달러를 확보했습니다.","so":"POWER Magazine","tm":"11/11 03:19","c":1,"r":"us","u":"https://www.powermag.com/calibrant-energy-secures-145-million-in-project-financing-including-battery-storage-for-hyperscale-data-center-customer-in-pjm/","p":1794334750,"a":1794350741,"t":"Calibrant Energy Secures $145 Million in Project Financing, Including Battery Storage for Hyperscale Data Center Customer in PJM","su":"Calibrant Energy, a leading provider of on-site energy solutions, on November 10 announced the close of a $145-million debt facility led by Investec for"},{"s":"COP31에 참가하는 대만 기업은 어디인가요? 캐세이퍼시픽은 아시아에서 하이브리드 금융을 촉진하고, 델타는 스마트 마이크로그리드를 공유하며, TCC는 에너지 저장 레지던스를 선보입니다.","so":"ESG永續台灣","tm":"11/10 17:48","c":1,"r":"tw","u":"https://esg.businesstoday.c 7","c":2,"r":"tw","u":"https://money.udn.com/money/story/7307/9868615","p":1794281245,"a":1794298404,"t":"台電：爭取711億預算撥補以平穩電價 推動各項電力建設","su":"현재 투르키예에서는 유엔 기후변화 총회(COP31)가 개최되고 있으며, 국제사회는 에너지 전환과 대기오염 배출 저감에 지속적으로 관심을 기울이고 있습니다. Taipower는 전력 산업이 전력 공급 안정과 전기 가격 안정의 책임을 지고 있다고 밝혔습니다. Taipower는 발전소의 환경 보호 개선과 다양한 전력망 건설에 지속적으로 투자하고 있습니다. 국제정세에 대응해 정부의 물가(물건값 전체의 수준)안정 정책에 협력하며 치솟는 국제 연료비를 지속적으로 흡수하고 있다. 올해 중국은 인민 전력 소비 보조금으로 750억 위안 이상을 흡수했습니다. 전력산업의 재정적 안정은 국민의 전력권익과 사회산업의 발전과 직결됩니다. Taipower는 의회와 사회 모든 부문이 정부의 추가예산을 공동으로 지원할 것을 촉구합니다."},{"s":"남부발전, 두산에너빌리티와 발전기 디지털 정비 체계 구축","so":"한국경제","tm":"11/13 10:48","c":1,"r":"kr","u":"https://www.hankyung.com/article/202611134761h","p":1794534518,"a":1794539853,"su":"AI 추천 뉴스 남부발전, 두산에너빌리티와 발전기 디지털 정비 체계 구축 한국남부발전이 국산화에 성공한 발전기 핵심 기술의 상용화를 위한 현장 개방을 추진한다. 남부발전은 12일 경남 창원 두산에너빌리티 본사에서 두산에너빌리티와 ‘발전기 브러시 모니터링 시스템(B-EYES) 실증 및 디지털 정비 체계 구축을 위한 업무협약’을 체결했다고 밝혔다. 협약식에는 송상옥 남부발전 발전처장과 이광열 두산에너빌리티 파워서비스 설계·생산총괄 전무 등 양사 주요 관계자들이 참석했다."},{"s":"효성중공업 노조 2차 파업 돌입…사측 \"법·원칙 따라 충실히 교섭\"","so":"뉴시스","tm":"11/13 10:06","c":1,"r":"kr","u":"https://mobile.newsis.com/view_amp.html?ar_id=NISX20261113_0003866756","p":1794531993,"a":1794539853,"su":"[서울=뉴시스]유희석 기자 = 효성중공업 사무기술직 노동조합이 13일부터 30일까지 전면 파업에 돌입한 가운데, 사측은 교섭을 거부한 것이 아니라 실질적인 협의를 위한 일정 조정을 제안한 것이라고 반박했다"},{"s":"데이터 센터 백래시: 동향 뉴스, 최신 업데이트, 분석","so":"Bloomberg.com","tm":"11/13 09:22","c":1,"r":"us","u":"https://bloomberg.com/latest/data-center-backlash","p":1794529373,"a":1794539854,"t":"Data Center Backlash: Trending News, Latest Updates, Analysis"},{"s":"Watchdog, 데이터 센터 전력 비용에 대한 미국 최대 전력망 비난","so":"Bloomberg.com","tm":"11/13 08:55","c":1,"r":"us","u":"https://www.bloomberg.com/news/articles/2026-11-12/watchdog-rebukes-largest-us-grid-over-data-center-power-costs?srnd=homepage-americas","p":1794527749,"a":1794539856,"t":"Watchdog Rebukes Largest US Grid Over Data Center Power Costs"},{"s":"10월 수익 PK 대회》화청, 스뎬, ZTE, 야리, TECO...총뎐이 물러난다면 누구를 뽑을까? 법인 목표 가격은 여기입니다 - 상장 캐비닛","so":"旺得富理財網","tm" 직접적으로 규정하고, 해체된 석탄화력발전기를 비상 백업으로 전환하는 것을 제한하는 대기오염법 개정법 제28조와 제30조를 이달 10일 발의했다. Gong Mingxin 경제부 장관은 오늘 인터뷰에서 특정 장치를 조기에 폐기해야 한다면 필연적으로 전력 공급 부족 문제가 발생할 것이라고 말했습니다. 이는 경제부와 업계가 원하는 바가 아니며, 새로운 유닛 건설에는 시간이 걸릴 것입니다. \"오늘 그렇게 하면 내일 전기가 나올 것입니다.\""},{"s":"중국, AI 전력 수요 폭발로 글로벌 가스 터빈 시장 공략","so":"Crude Oil Prices Today | OilPrice.com","tm":"11/12 19:00","c":1,"r":"sg","u":"https://oilprice.com/Latest-Energy-News/World-News/China-Targets-Global-Gas-Turbine-Market-as-AI-Power-Demand-Explodes.amp.html","p":1794477600,"a":1794489692,"t":"China Targets Global Gas Turbine Market as AI Power Demand Explodes","su":"중국은 글로벌 AI 데이터센터(컴퓨터 수만 대를 모아 둔 건물) 붐으로 인한 기록적인 수요와 공급 부족을 활용하기 위해 가스터빈 개발과 해외 진출을 가속화하고 있습니다."},{"s":"변압기 회사는 선물 도구를 사용하여 정확한 정책을 구현하여 원자재 가격 변동에 효과적으로 대응할 수 있습니다.","so":"21财经","tm":"11/12 18:33","c":1,"r":"cn","u":"https://www.21jingji.com/article/20261112/herald/b3e514236fc708844bf7dfee890f3095.html","p":1794475980,"a":1794489689,"t":"运用期货工具精准施策 变压器企业有效应对原料价格波动","su":"지난 2년간 국내외 구리 가격의 등락이 계속돼 구리 산업 하류 기업의 생산원가와 영업이익(장사해서 남긴 돈)에 직접적인 영향을 미쳤다. 일부 기업은 성숙하고 효과적인 위험 관리 시스템이 부족하여 여러 가지 문제에 직면하고 있습니다. 방문 기간 동안 기자는 중국 동부 지역의 한 변압기 제조 회사가 파생상품 위험 관리 도구의 과학적이고 합리적인 사용을 통해 올해 약 300만 위안의 조달 비용을 절감하고 원자재(물건의 재료(석유·구리 등)) 가격 변동의 영향에 효과적으로 대응하며 안정적인 운영을 달성했다는 사실을 알게 되었습니다. 구리 가격이 오르고 기업에는 위험 관리 도구가 시급히 필요합니다. 인터뷰에서 기자는 변압기 제조를 핵심으로 하고 송전 및 변전 장비 분야에 깊이 있는 중국 동부의 국가 수준의 전문화되고 새로운 \"작은 거인\" 기업이 다량의 구리를 사용하고 원자재 비용의 높은 비율을 차지한다는 사실을 알게 되었습니다. 그러나 현물 조달 및 판매를 담당하는 전문 선물팀이 없습니다. 팀은 선물의 기본 이론, 헤징 운영 절차, 위험 예방 및 통제의 핵심 사항 등 전문적인 내용에 대한 지식이 제한되어 있습니다. 이들은 금융파생상품 상품을 “이해하지 못하고, 사용할 용기가 없고, 사용 방법을 모른다”는 공통된 업계 특성을 갖고 있어 매일 독립적이고 효과적인 헤징 사업을 수행하기가 어렵습니다."},{"s":"AI 전력소비 줄일 차세대 반도체… 제주대서 '멤리스터' 기술 주목","so":"파이낸셜뉴스","tm":"11/12 16:36","c":1,"r":"kr","u":"https://www.fnnews.com/news/202611121631184362","p":1794469002,"a":1794489688,"su":"인공지능 확산으로 데이터센터(컴퓨터 수만 대를 모아 둔 건물)의 전력 수요가 급증하는 가운데 전력 소모를 줄일 차세대 반도체(전자기기의 두뇌 부품) 기술이 제주대학교에서 소개됐다."},{"s":"586GW가 199GW로! 북미 데이터센터 계획 3분의 2가 할인돼 외신에 '잔혹한 현
