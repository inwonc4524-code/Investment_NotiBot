熱點 | 產業","su":"엔비디아 젠슨 황 전 CEO의 사임이 미국 정계와 재계의 갈등으로 확대됐다. 대만증시는 16일 2,635.04포인트 급락해 6.03% 하락한 41,040.08포인트로 저점을 마감했다. 그러나 생명공학 주식인 Haoding(4174)은 추세를 거스르고 한도를 뛰어올라 지난 2년 만에 최고치인 NT$71.3으로 마감했습니다."},{"s":"보령·셀트리온제약, 年 처방액 517억 당뇨병 치료제 공동판매 - 머니투데이","so":"머니투데이","tm":"11/16 15:48","c":2,"r":"kr","u":"https://www.mt.co.kr/thebio/2026/11/16/2026111615403821339","p":1794811712,"a":1794812192,"su":"보령과 셀트리온제약이 지난해 국내 처방액 517억원을 기록한 당뇨병 치료제 6종의 공동판매에 나선다. 내년 1월 출범하는 보령의 영업·마케팅 전문 자회사 보령파마솔루션은 기존 당뇨병 치료제에 오리지널 의약품을 추가하며 제품군을 확대하게 됐다."},{"s":"특이한 주식丨아케소가 20% 넘게 투자했는데, 미국과 제휴한 항암제가 FDA 승인을 받지 못했다.","so":"信報網站","tm":"11/16 10:52","c":2,"r":"hk","u":"https://m.hkej.com/landing/mobarticle2/id/4565963/%E7%95%B0%E5%8B%95%E8%82%A1%E4%B8%A8%E5%BA%B7%E6%96%B9%E7%94%9F%E7%89%A9%E6%8F%92%E9%80%BE%E5%85%A9%E6%88%90%20%E8%88%87%E7%BE%8E%E5%90%88%E4%BD%9C%E5%A4%A5%E4%BC%B4%E6%8A%97%E7%99%8C%E8%97%A5%E6%9C%AA%E7%8D%B2FDA%E6%89%B9%E5%87%86","p":1794793934,"a":1794794329,"t":"異動股丨康方生物插逾兩成 與美合作夥伴抗癌藥未獲FDA批准","su":"아케소(09926)와 미국 파트너의 항암제인 FDA가 승인을 거부했다. 주가는 일시적으로 31.8%나 하락해 최저치인 56.1위안까지 떨어졌다. 오전 9시 46분 현재 24.2% 하락한 62.35위안에 거래되고 있으며 거래액은 15억 2천만 위안 이상이다. 아케소의 전략적 파트너인 미국 제약회사 서밋 테라퓨틱스(Summit Therapeutics)는 미국 식품의약국(FDA)이 폐암치료제 출시 신청을 거부했다고 밝혔다. 아케소는 중국 내 ivonescimab 약물의 최초 개발 및 유통업체입니다."},{"s":"CITIC 증권: 국가 의료 보험 협상은 계속해서 혁신적인 의약품을 지원하고 2027년 상업화 성장에 초점을 맞추고 있습니다.","so":"第一财经","tm":"11/16 09:12","c":2,"r":"cn","u":"https://www.yicai.com/news/103441152.html","p":1794787939,"a":1794794328,"t":"中信证券：国家医保谈判持续支持创新药 关注2027年商业化增量","su":"제일재경 2026-11-16 08:08:38 편집자: Tang Yanbei CITIC 증권 연구 보고서에 따르면 국가 의료 보험 협상은 혁신의 정책 방향을 지속적으로 지원하고 새로운 품종, 확장된 적응증 및 병원 지불 패키지를 포함하여 2027년 상업적 성장을 공동으로 촉진할 것이라고 밝혔습니다. 2026년 11월 14일에 발표된 새 카탈로그 버전에는 카테고리 1 혁신 51개를 포함하여 107개의 신약이 추가되었습니다. 의약품의 수가 사상 최고치를 경신했고, 처음으로 기본의료보험에 CAR-T가 포함됐다. 이러한 조정은 사전 신고 및 상업 보험에서 기본 의료 보험으로의 전환을 개선하고, 장기 갱신 규칙을 더욱 명확하게 하며, 병원에 의약품 도입 및 \"이중 채널\" 공급을 촉진합니다."},{"s":"상위 8개 생명공학주, 첫 3분기에 엄청난 이익 기록 - 파이낸셜 뉴스 - 산업 및 상업 타임스","so":"中時新聞網","tm":"11/16 05:10","c":2,"r":"tw","u":"https://www.chinatimes.com/newspapers/20261116000239-260202","p":1794773400,"a":1794784830,"t":"生技股8強前三季獲利噴發- 財經要聞- 工商時報","su":"생명공학 주식은 첫 3분기 동안 엄청난 수익을 냈으며 총 8개 회사가 1주 이상의 자본을 보유했습니다. 그러나 주당순이익(주식 한 주가 번 돈) 순위는 대대적인 개편을 겪었다. 징숴(Jingshuo)가 20.09대만달러로 1위를 차지했고, 야오화제약(Yaohua Pharmaceutical)이 18.43대만달러, 타이보(Taibo)가 18.06대만달러로 뒤를 이었다. BenQ Medical은 16.65대만달러로 처음으로 1위 그룹에 진입했습니다. Bao Rui는 톱 10에 진입했고 Lamex는 예상치 못하게 하락했습니다."},{"s":"BenQ Medical, 생명공학 부문 1분기 이익 제왕을 차지, 3분기 세후 주당순이익이 15.05위안으로 급증","so":"中時新聞網","tm":"11/16 05:10","c":2,"r":"tw","u":"https://www.chinatimes.com/newspapers/20261116000242-260202","p":1794773400,"a":1794784834,"t":"明基醫 奪生技單季獲利王寶座 Q3每股稅後純益飆至15.05元","su":"3분기 생명공학주 이익순위가 개편됐다. BenQ Medical은 자산 매각 및 비산업 이익 인식으로 이익을 얻었으며, 단일 분기 세후 주당순이익(주식 한 주가 번 돈)이 15.05위안으로 치솟았습니다. 뜻밖의 징숴(Jingshuo)와 야오화제약(Yaohua Pharmaceutical)을 물리치고 다크호스로서 1분기 실적(회사가 번 돈 성적표) 왕좌를 차지했다. Baorui 및 Lai Fung-KY 운영은 사탕수수를 먹고 있으며 단일 분기의 주당 수익이 상위 10위 안에 들었습니다."},{"s":"4명의 생명공학 소유자와 주요 시험 실패 끝에 베렌의 희귀 소아 질환 약물이 마침내 승인을 얻었습니다.","so":"Endpoints News","tm":"11/18 05:25","c":1,"r":"us","u":"https://endpoints.news/beren-wins-fda-approval-for-long-studied-rare-disease-drug/","p":1794947100,"a":1794955451,"t":"After four biotech owners and a major trial failure, Beren's rare pediatric disease drug finally wins approval","su":"FDA는 4명의 약물 개발자를 통한 10년 이상의 여정 끝에 유아기 발병 Niemann-Pick C형에 대한 Beren의 Lembaz를 승인했습니다."},{"s":"Beren Therapeutics, C형 영아 발병 니만픽병의 생존율을 향상시키는 최초이자 유일한 의약품인 LEMBAZ™(adrabetadex)에 대한 미국 FDA 승인 발표","so":"Yahoo Finance","tm":"11/18 04:05","c":1,"r":"us","u":"https://finance.yahoo.com/healthcare/articles/beren-therapeutics-announces-u-fda-190500534.html","p":1794942300,"a":1794955453,"t":"Beren Therapeutics Announces U.S. FDA Approval of LEMBAZ™ (adrabetadex), First & Only Medicine to Improve Survival in Infantile-Onset Niemann-Pick Disease, Type C","su":"캘리포니아주 사우전드 오크스, 2026년 11월 17일 -- 콜레스테롤 밀매 생물학 및 새로운 시클로덱스트린 기반 치료제 분야의 선두주자인 Beren Therapeutics P.B.C.는 오늘 미국 식품의약국(FDA)이 니만픽병 C형(NPC)을 유발하는 근본적인 콜레스테롤 밀매 결함을 해결하는 최초의 약품인 LEMBAZ™(adrabetadex)를 승인했다고 발표했습니다. 첫 번째 메디치"},{"s":"FDA는 2027년 3월까지 낙태약에 대한 안전성 보고서를 완료할 계획입니다.","so":"Bloomberg.com","tm":"11/18 00:46","c":1,"r":"us","u":"https://www.bloomberg.com/news/articles/2026-11-17/fda-plans-to-finish-safety-report-on-abortion-pill-by-march-2027","p":1794930369,"a":1794955453,"t":"FDA Plans to Finish Safety Report on Abortion Pill by March 2027"},{"s":"로슈, 고급 유방암 치료에 윌서들리(Wiserrdly)에 대한 FDA 승인 획득","so":"Yahoo Finance","tm":"11/17 20:26","c":1,"r":"us","u":"https://finance.yahoo.com/healthcare/articles/roche-secures-fda-approval-wilserdly-112643786.html","p":1794914803,"a":1794921281,"t":"Roche Secures FDA Approval for Wilserdly in Advanced Breast Cancer Treatment","su":"Roche Holding(USOTC:RHHBY)은 특정 형태의 진행성 또는 전이성 유방암에 대한 경구 치료제인 Wilserdly(giredestrant)에 대해 미국 식품의약국(FDA)으로부터 승인을 받았습니다. 스위스 제약회사는 월요일 이 약이 노바티스(SIX:NOVN)가 판매하는 치료제인 Afinitor와 병용 사용하도록 승인되었다고 발표했습니다."},{"s":"여러 가지 이점이 반향을 일으켰고 의료 치료로 감소를 성공적으로 막았습니다! 의료ETF(512170) 적자 마감, 기관: 의약품이 탄력을 받는 단계에 진입할 수 있음","so":"Jiemian.com","tm":"11/17 18:48","c":1,"r":"cn","u":"https://www.jiemian.com/article/15342613.html","p":1794908915,"a":1794916953,"t":"多重利好共振，医疗成功止跌！医疗ETF(512170)翘尾收红，机构：医药或进入蓄势阶段","su":"11월 17일, 며칠 전부터 조정을 보이던 의료 업종이 시장 추세를 뒤집으며 강세(오르는 힘이 센 것)를 보였다. CSI 메디컬 지수는 거래 초반 수중에서 1% 이상 급등했다가 오후에는 시장 수준으로 하락했습니다. 결국 적자로 마감하며 4연패에 마감했다. 지수를 추적하는 의료 ETF(여러 주식을 묶어 파는 상품) 화바오(512170)가 연간 라인을 성공적으로 회복했다."},{"s":"51 카테고리 1 혁신신약, 혁신신약은 허가에서 상업화로 나아가고 있다","so":"第一财经","tm":"11/17 17:42","c":1,"r":"cn","u":"https://www.yicai.com/video/103443768.html","p":1794904928,"a":1794916955,"t":"51个1类创新药，创新药正从授权变现走向商业化兑现"},{"s":"혁신적인 약물인 루지노레소듐(Luzinoresodium)이 국가의료보험목록 새 버전에 성공적으로 포함되었습니다.","so":"新华网","tm":"11/17 17:14","c":1,"r":"cn","u":"https://www.news.cn/enterprise/20261117/48129fb6d854446492f9bb9430718455/c.html","p":1794903262,"a":1794916957,"t":"创新药鲁兹诺雷钠成功纳入新版国家医保目录","su":"11월 14일, '국민기본의료보험·모성보험·산재보험 약품목록'(2026년)이 출시됐다. 항서약품이 독자 개발한 혁신적인 1급 요산저하제 루지노레나트륨(루이밍®)이 처음으로 카탈로그에 공식적으로 포함됐다. 고요산혈증을 동반한 통풍에 대한 적응증은 의료보험급여 범위에 포함됐다. 새로운 버전의 의료 보험 카탈로그는 2027년 1월 1일부터 시행됩니다. 통풍은 요산염 결정이 관절에 침착되어 발생하는 급성 염증성 관절병증입니다. 통풍은 일반적으로 일반적인 관절의 갑작스러운 발적, 부기, 열 및 통증이 특징입니다. 요산 저하 치료는 통풍 질환 관리의 핵심 전략입니다. 전통적으로 일반적으로 사용되는 요산 저하제는 요산 생성 과정에 작용하여 요산 생성을 줄이는 것을 목표로 합니다. 그러나 인체에서 생성된 요산의 약 2/3는 신장을 통해 배설되어야 합니다. 생산이 감소하더라도 배설 경로가 불량하면 여전히 목표 달성을 방해할 수 있습니다."},{"s":"◎ 메이지 HD 자회사, 미 창약 벤처에 출자","so":"時事通信ニュース","tm":"11/17 16:42","c":1,"r":"jp","u":"https://sp.m.jiji.com/article/show/3913650","p":1794901320,"a":1794916958,"t":"◎明治ＨＤ子会社、米創薬ベンチャーに出資","su":"메이지 홀딩스 <2269>의 제약 자회사 Meiji Seika 팔마(도쿄)는 17일 미국 창약 벤처 아크툴루스 세라퓨틱스(미 캘리포니아주)사에 출자하기로 합의했다고 발표했다. 5000만 달러(약 80억엔)로 7.9%의 주식을 취득한다."},{"s":"The Biotech Growth Trust PLC - 반기 실적 보고서 - 회사 발표","so":"Financial Times","tm":"11/17 16:00","c":1,"r":"world","u":"https://markets.ft.com/data/announce/detail?dockey=600-202611170200PR_NEWS_PRUKDSCL_0013-1","p":1794898800,"a":1794916958,"t":"The Biotech Growth Trust PLC - Half-year Financial Report – Company Announcement"},{"s":"Science and Technology 200 ETF Penghua(588240)는 활발히 거래되고 있으며 제약과 반도체는 집중적인 촉매를 받고 있으며 기관에서는 기술과 가치 사이의 균형을 유지할 것을 권장합니다.","so":"Jiemian.com","tm":"11/17 14:58","c":1,"r":"cn","u":"https://www.jiemian.com/article/15341229.html","p":1794895080,"a":1794898794,"t":"科创200ETF鹏华(588240)交投活跃，医药、半导体迎密集催化，机构建议维持科技与价值均衡","su":"뉴스: 1. 의료 및 생물의학: 국가의료보험청은 2026년 기본의료보험 카탈로그와 상업 보험 혁신 의약품 카탈로그를 공식 발표하여 107개의 신약을 추가했으며 그 중 51개가 카테고리 1 혁신 의약품으로 기록적인 수치입니다. 상업적으로 보장되는 혁신적인 약물 카탈로그에는 12~28개의 신약이 추가되었으며 이는 2027년 1월 1일부터 유효할 것입니다. 또한 CXO 지역 억압이 단계적으로 해제되고 있습니다. 우시앱텍은 최근 미국 1260H 목록에서 공식적으로 제거되었습니다. 2. 반도체(전자기기의 두뇌 부품)/칩 산업 체인: SEMI 전망에 따르면, 2026년 전 세계 반도체 장비 매출(물건을 판 돈 전체)은 전년 대비 23.2% 증가한 1,659억 달러에 이를 것으로 예상됩니다. 2028년에는 2,295억 달러에 이를 것으로 예상됩니다. 또한 헬륨 현물 가격은 50% 이상 올랐습니다. 삼성전자와 SK하이닉스가 일일 고주파 모니터링을 시작했다. 전자특수가스의 빈틈없는 공급이 재료끝까지 직접 전달됩니다."},{"s":"51 카테고리 1 혁신신약이 의료보험에 포함되면서 혁신신약의 상용화에 대한 기대감이 높아지고 있다. Hong Kong Innovative Drug ETF Boshi(520690) 추적 지수의 하락세가 계속 좁혀지고 있습니다.","so":"Jiemian.com","tm":"11/17 13:08","c":1,"r":"cn","u":"https://www.jiemian.com/article/15340493.html","p":1794888523,"a":1794898796,"t":"51个1类创新药纳入医保，创新药商业化预期升温，港股创新药ETF博时(520690)跟踪指数跌幅持续收窄","su":"홍콩 혁신 약물 ETF(여러 주식을 묶어 파는 상품) Boshi(520690)는 Hang Seng Hong Kong Stock Connect Innovative Drug Select Index를 추적합니다. 2026년 의료보험 카탈로그에는 51개 카테고리 1 혁신신약(세상에 처음 나온 새로운 약)이 포함돼 상용화 기대감이 뜨거워지고 있다."},{"s":"33억 2,500만 달러! Johnson & Johnson의 블록버스터 인수, 핵심 파이프라인은 Cinda Biologics에서 나옵니다! 과학기술혁신신약 ETF 차이나유니버설(589120) 하루만에 3500만위안 자금 유치","so":"Jiemian.com","tm":"11/17 12:42","c":1,"r":"cn","u":"https://www.jiemian.com/article/15340408.html","p":1794886956,"a":1794898798,"t":"33.25亿美元！强生重磅收购，核心管线来自信达生物！科创创新药ETF汇添富(589120)单日吸金3500万元","su":"11월 17일 중국 3대 A주 지수는 하락세를 보인 후 등락과 강세(오르는 힘이 센 것)를 보였으며 혁신 의약품 부문은 한때 적자로 전환했습니다. 보도 시간 현재 20CM의 탄력성이 높은 '혁신 약물 및 신종'인 중국 과학 기술 혁신 약물 ETF(여러 주식을 묶어 파는 상품) China Universal(589120)의 기본 지수는 0.3% 하락했습니다."},{"s":"정책배당에 따라 혁신신약의 상용화도 가속화될 것으로 예상된다. 어떤 혁신신약 ETF가 더 나은가요? 저가형 홍콩 혁신 의약품 ETF Invesco(513780)는 시장 내 및 시장 외 할당의 가치를 강조합니다.","so":"Jiemian.com","tm":"11/17 11:16","c":1,"r":"cn","u":"https://www.jiemian.com/article/15339706.html","p":1794881808,"a":1794885759,"t":"政策红利下创新药商业化兑现有望加速，创新药ETF选哪个好？低费率港股创新药ETF景顺(513780)场内外配置价值凸显","su":"이 소식에 국가 4개 부처는 공동으로 2개 카탈로그의 1급 신약이 '1품 2개 규정'에 포함되지 않으며 5개 공립병원 성과 평가 지표에서 제외된다는 점을 명확히 하는 공지를 발표했습니다. 동시에 상업적으로 보장되는 혁신 의약품의 입원 사례는 DRG/DIP 지급 범위에 포함되지 않아 혁신 의약품이 병원에 진입하는 데 대한 장벽이 실질적으로 제거됩니다."},{"s":"해외일보 | Yingpai Pharmaceutical의 혁신적인 약물은 유럽 연합의 마케팅 승인을 받았습니다. Shenghong Technology는 말레이시아 자회사에 대한 투자를 1억 7천만 달러 늘릴 계획입니다.","so":"Jiemian.com","tm":"11/17 10:44","c":1,"r":"cn","u":"https://www.jiemian.com/article/15339366.html","p":1794879880,"a":1794885762,"t":"出海日报｜英派药业创新药获欧盟批准上市，胜宏科技拟向马来西亚子公司增资1.7亿美元","su":"2026년 11월 16일부터 17일 오전까지 중국 기업의 '해외 진출' 행사 요약본이 편집되었으며, 해당 내용은 상장(주식시장에 처음 들어오는 것) 기업 공지, 기업 공시, 정부 부처 정보 및 대중 매체 보도에서 나왔습니다."},{"s":"의료 보험 부서는 접근성 가속화부터 '이중 카탈로그' 전환까지 혁신적인 의약품의 접근성 향상을 촉구합니다.","so":"经济参考报","tm":"11/17 09:31","c":1,"r":"cn","u":"http://jjckb.xinhuanet.com/20261117/0bb481d7dd65492d88e0529cb482acec/c.html","p":1794875506,"a":1794885766,"t":"从准入提速到“双目录”衔接 医保部门力促创新药可及","su":"최근 쑤저우에서 2026년 국민의료보험 약품목록 조정 결과가 발표됐다. 국가의료보험 의약품 카탈로그 새 버전에는 107개의 신약이 추가되었으며 그 중 51개는 카테고리 I 혁신 의약품으로 최고 기록을 세웠습니다. 동시에 발표된 상업 건강 보험 혁신 약품 카탈로그 새 버전에는 12가지 신약이 추가되어 총 28종에 이르렀습니다. 우시준누오의 레지오렌세주가 CAR-T 치료제 최초로 국가의료보험에 포함됐다는 점은 주목할 만하다. 사전 의료보험 가격은 129만 위안이었고, 2026년 협정 지급 기준은 288,600위안으로 약 77.6% 감소했다. 환급 후 환자 본인부담금은 10만 위안 미만으로 줄어들 것으로 예상된다. 접근성 가속화부터 \"이중 카탈로그\" 전환까지 의료 보험 부서는 혁신적인 약물의 접근성을 촉진하기 위해 다양한 조치를 취하고 있습니다."},{"s":"혁신적인 약물은 사람들에게 \"다시 속도를 높이는\" 혜택을 제공합니다","so":"人民日报","tm":"11/17 08:54","c":1,"r":"cn","u":"http://paper.people.com.cn/rmrbhwb/pc/content/202611/16/content_30191377.html","p":1794873264,"a":1794921282,"t":"创新药惠民“再提速”","su":"11월 14일, 쑤저우에서 열린 2026년 혁신 의약품 고품질 개발 회의에서 2026년 국가 의료 보험 의약품 목록과 상업 보험 혁신 의약품 목록이 공식적으로 발표되었습니다. 의료보험 카탈로그에는 107개 약물이 포함되었고 상업 보험 혁신 약물 카탈로그에는 12개 약물이 포함되었습니다. 보험 약물 사용 보호로 인해 새로운 확장 및 업그레이드가 시작되었습니다. ——혁신적인 약물은 \"기어를 업그레이드하고 변경\"하여 사람들에게 이익을 줍니다. \"신규\"는 이번 조정의 뚜렷한 배경입니다. 1급 신약의 수가 51개에 달해 사상 최고치를 기록했습니다. CAR-T 및 이중 항체 ADC와 같은 혁신적인 약물이 처음으로 의료 보험 카탈로그에 포함되었습니다. 상업보험 혁신약품 카탈로그와 기본의료보험 카탈로그가 공개되었습니다. 이어 “이번 조정은 중대질병, 어린이약, 노인만성질환약 등 국민생활의 시급한 요구를 고려해 임상적 이점이 뚜렷한 혁신신약(세상에 처음 나온 새로운 약)을 포함하고 치료 공백을 보장범위에 채우는 데 초점을 맞춘 것”이라고 말했다. 국가의료보험청 제약서비스관리부 국장 황 Xinyu는 이렇게 말했습니다."},{"s":"유한양행 '렉라자', FDA 라벨링 보충 허가 획득…블록버스터 입지 공고화 | 더구루","so":"뷰타임즈","tm":"11/17 08:39","c":1,"r":"kr","u":"https://view.mk.co.kr/car-tech/article/296593/","p":1794872377,"a":1794885755},{"s":"로슈, 먹는 유방암 치료제 美 FDA 승인…블록버스터 신약 기대감↑｜Global Money Club","so":"중앙일보","tm":"11/17 07:54","c":1,"r":"kr","u":"https://www.joongang.co.kr/gmc/article/25479282","p":1794869677,"a":1794874067,"su":"스위스 제약사 로슈가 개발한 경구용 유방암 치료제가 미국 규제당국의 승인을 받았습니다. 미국 식품의약국(FDA)은 16일(현지시간) 로슈의 ..."},{"s":"Yuandong Biotechnology: 대상포진후 신경통 적응증에 대한 EP-0226 정제의 2상/3상 임상 시험에서 첫 번째 대상자가 투여되었습니다.","so":"Jiemian.com","tm":"11/16 22:15","c":1,"r":"cn","u":"https://www.jiemian.com/article/15338582.html","p":1794834922,"a":1794838048,"t":"苑东生物：EP-0226片带状疱疹后神经痛适应症II/III期临床试验完成首例受试者给药","su":"Yuandong Bio는 Shanghai Institute of Materia Medica, 중국과학원, Zhongshan Institute of Drug Innovation이 공동 개발한 1급 화학 혁신 약물인 EP-0226 정제가 현재 중국 대상포진 후 신경통 환자를 대상으로 다기관, 무작위 배정, 이중 맹검, 이중 더미, 위약 및 프레가발린 캡슐 대조 2/3상 임상 시험을 진행하고 있다고 밝혔습니다. 최근 첫 번째 주제가 관리되었습니다."},{"s":"영국 제약회사, 미국 내 에스트로겐 패치 공급 확대 논의 중","so":"Bloomberg.com","tm":"11/16 21:45","c":1,"r":"us","u":"https://www.bloomberg.com/news/articles/2026-11-16/uk-drugmaker-in-talks-to-boost-estrogen-patch-supply-in-us","p":1794833100,"a":1794834714,"t":"UK Drugmaker in Talks to Boost Estrogen Patch Supply in US"},{"s":"혁신적인 약물 연구 개발 회사 \"CataX AI\"는 4천만 위안의 종자 자금 조달을 완료했습니다.","so":"eu.36kr.com","tm":"11/16 21:02","c":1,"r":"cn","u":"https://eu.36kr.com/zh/newsflashes/4073327324402822","p":1794830520,"a":1794898799,"t":"创新药研发公司“CataX AI”完成4000万元种子轮融资","su":"36Kr은 기업 정보, 기술 뉴스, 투자 및 금융 도킹, 지분(회사를 나눠 가진 몫) 투자, 신속한 금융 및 기타 기업 서비스를 제공합니다. 기업가가 신뢰할 수 있는 기업 서비스 플랫폼이 되고 최고의 제품과 서비스를 제공하기 위해 최선을 다하고 있습니다."},{"s":"선두 혁신의약품은 22% 급락했다. 집중적으로 투자한 펀드의 '트라우마'는 얼마나 깊을까?","so":"21财经","tm":"11/16 20:44","c":1,"r":"cn","u":"https://www.21jingji.com/article/20261116/herald/c3d9441060a75d7b5315fbd9fe05c6a2.html","p":1794829440,"a":1794830397,"t":"创新药龙头大跌22%，重仓基金“创伤”多深？","su":"차이롄서, 11월 16일 (천용휘 기자) 지난 11월 16일, 미국 FDA의 회신서한으로 홍콩 제약업계가 소용돌이에 휘말렸다. 아케소(09926.HK)는 이날 약 32% 하락하여 개장하여 2025년 2월 이후 최저치인 HK$56.1에 도달했습니다. 22% 하락했으며 시가총액(회사 전체 몸값)은 HK$603억으로 줄었습니다. 같은 기간 항셍생명공학지수는 2.21% 하락했다. 방아쇠는 지난 주말에 왔습니다. Kangfang의 해외 파트너인 Summit은 백금 함유 화학요법과 결합된 evocilimab(AK112, PD-1/VEGF 이중 항체)의 시판 신청에 대한 미국 FDA로부터 완전한 응답 편지(CRL)를 받았다고 11월 15일 발표했습니다. 해당 신청은 승인되지 않았으며, 타깃 적응증은 EGFR-TKI 치료 이후 진행된 비편평 비소세포폐암이다."},{"s":"마지막으로, 암 백신","so":"The New York Times","tm":"11/16 20:00","c":1,"r":"us","u":"https://www.nytimes.com/2026/11/16/podcasts/the-daily/vaccine-cancer-melanoma.html","p":1794826808,"a":1794868968,"t":"Finally, a Vaccine for Cancer","su":"흑색종의 재발을 예방하는 실험적 백신이 발견되었습니다. 과학자들은 이것이 마지막이 아니기를 바라고 있습니다."},{"s":"혁신신약의 '중국 속도': 승인부터 의료보험 포함까지 1년 미만","so":"中国新闻网","tm":"11/16 18:41","c":1,"r":"cn","u":"https://www.chinanews.com.cn/cj/2026/11-16/10732912.shtml","p":1794822071,"a":1794830400,"t":"创新药的“中国速度”：从获批到纳入医保不到一年","su":"혁신신약(세상에 처음 나온 새로운 약) '차이나 스피드' 허가부터 의료보험 편입까지 1년 이내 혁신신약 '중국 스피드' 허가부터 의료보험 편입까지 1년 이내 환자들이 '건선' 퇴치를 돕는 국산의약품 기자 | 진제 \"제가 건선 환자인 걸 깜빡할 뻔했어요. 이제 몸에 피부병변도 없어요.\" 11월 13일, 왕루광은 '매일경제뉴스' 기자(이하 '미징기자')에게 담담하게 말했다. 마치 다른 사람의 이야기를 하는 것 같았습니다. 오직 그만이 이 문장의 무게를 알고 있었습니다. 왕루광 씨는 30년 넘게 건선을 앓고 있으며 현재 건선 환자 커뮤니티를 운영하고 있다. 건선은 치료할 수 없습니다. 중국에는 그와 같은 건선 환자가 845만명에 이른다. 11월 14일, 국내 최초로 생산된 IL-23p19 단클론 항체가 2026년 신규 의료보험 카탈로그에 포함되었습니다. 승인부터 의료보험 가입까지 1년도 채 걸리지 않았습니다."},{"s":"강팡의 스타 혁신신약 미국 출시를 거부한 두 가지 주요 논란","so":"Jiemian.com","tm":"11/16 16:48","c":1,"r":"cn","u":"https://www.jiemian.com/article/15337164.html","p":1794815294,"a":1794830401,"t":"康方明星创新药美国上市被拒背后的两大争议","su":"Kangfang Biotech는 Interface News에 응답했지만 Ivosi의 거부가 글로벌 개발 속도에 영향을 미치지 않을 것이라고 말했습니다. 그러나 그 이면에는 강팡바이오텍과 해외 파트너들의 연구 계획과 자본 운용 등 다양한 행태가 논란으로 가득 차 있다."},{"s":"국내 혁신신약이 학장실업에 타격을 줄 때(1)","so":"财新","tm":"11/16 15:56","c":1,"r":"cn","u":"https://opinion.caixin.com/2026-11-16/102505289.html","p":1794812160,"a":1794830402,"t":"当国产创新药撞上院长们的经营底线（一）","su":"올해 45번째 거래주(20261102~20261108), 침체된 시장은 마침내 좋은 소식을 기다렸다. 정책적 지지와 '포도'가 확산되면서 A주가 조심스럽게 반응했지만 홍콩 증시는 활발해지며 개화기에 들어섰다. 홍콩의 의료 주식은 마침내 의약품의 소폭 상승을 얻었습니다. Gushengtang을 제외하고 다른 주력 의료 주식은 물량과 가격이 상승하는 상태에서 나타났습니다. 이번주 헬스케어 종목 하이라이트는 하이게이아(Hygeia)이다. '환매 불가 전제' 하에 거의 잊혀진 이 의료 재고의 거래량은 월요일 1,165만 홍콩 달러에서 금요일 5,385만 홍콩 달러로 단숨에 증가할 수 있습니다. 거래량이 증가했으며 그래픽에도 위험 신호 모양이 표시됩니다. 이는 'AI 부문'에서 소수의 유연한 펀드가 상대적으로 안전마진이 높은 일부 품종으로 분할되고 있음을 보여준다. 그리고 매년 주주들에게 5억 위안을 돌려주고 저렴한 가격으로 통합하겠다고 약속하는 하이게이아(Hygeia)가 참으로 목표입니다. 이후 가장 먼저 부딪히는 난관은 3분기 실적(회사가 번 돈 성적표)이다."},{"s":"AI 후광이 사라집니다! 생명공학주가 대세를 거스르고 하오딩에서 이탈하고, 쌍요가 자금유치에 앞장섰다 - 산업","so":"工商時報","tm":"11/16 15:22","c":1,"r":"tw","u":"https://www.ctee.com.tw/news/20261116701269-430504","p":1794810120,"a":1794812194,"t":"AI光環褪色！生技股逆勢突圍浩鼎、順藥領軍吸金- 產業","su":"16일 대만 증시는 2,635포인트 급락했다. 전자주식 주식이 매도의 중심이 되었고, 시장 자금은 새로운 출구를 찾았습니다. 생명공학 그룹은 이러한 추세를 거스르고 돌파했습니다. Haoding(4174), Shunyao(6535), Zhongen(7729), Sugar(6586), Pel(6949) 등 테마의 주식이 바이어들의 선호를 받아 국제 라이선스, 임상 진행 및 신약 상용화를 통해 시장 초점이 AI에서 생명공학 기업으로 이동하고 있음을 부각시켰습니다.美 중간선거 민주당 압승, 트럼프…"},{"s":"미국 FDA가 항암제 바이오시밀러를 승인한 후 바이오콘 주가 상승","so":"CNBC TV18","tm":"11/16 14:23","c":1,"r":"sg","u":"https://www.cnbctv18.com/market/biocon-share-price-usfda-approval-pebrilzo-fifth-oncology-biosimilar-her2-positive-breast-cancer-drug-20034624.htm","p":1794806592,"a":1794807039,"t":"Biocon shares gain after US FDA approves cancer drug biosimilar","su":"Biocon 주가는 HER2 양성 유방암 치료를 확대하는 다섯 번째 종양학 바이오시밀러(특허 끝난 바이오 약의 복제약)인 Pebrilzo에 대한 미국 FDA 승인을 획득한 후 주목을 받았습니다."},{"s":"로슈의 가지바/가지바로(Gazyva/Gazyvaro)가 원발성 막성 신병증에 대한 최초의 FDA 승인 치료제가 되었습니다.","so":"Financial Times","tm":"11/16 14:00","c":1,"r":"world","u":"https://markets.ft.com/data/announce/detail?dockey=1330-1001303720en-7E5IHST4P922M2E2PSATRO9GMM","p":1794805200,"a":1794812195,"t":"Roche’s Gazyva/Gazyvaro becomes the first FDA-approved treatment for primary membranous nephropathy"},{"s":"혁신 의약품 분야의 변동 및 약화, Tonghua Jinma 하한가","so":"Jiemian.com","tm":"11/16 12:01","c":1,"r":"cn","u":"https://m.jiemian.com/article/15335955.html","p":1794798091,"a":1794806422,"t":"创新药板块震荡走弱，通化金马跌停","su":"등록/로그인 개인 센터 홈 세계 중국 매크로 엔터테인먼트 스포츠 패션 문화 여행 생활 게임 비뚤어진 건물 데이터 정오 예술 비즈니스 기술 자동차 부동산 증권 금융 소비 산업 운송 투자 마케팅 직장 관리 기업가 정신 해외 부동산 시장 부 건강 광역 지역 주류 산업 블록체인 ESG 싱크탱크 더 많은 뉴스 인기 기사 비디오 사진 주문 특별 주제 라이브 앱 다운로드 원본 뉴스 혁신적인 의약품 부문이 변동하고 약해지면서 Tonghua Jinma 한도가 감소했습니다. 혁신적인 의약품 분야가 변동하고 약해지면서 Tonghua Jinma의 한계가 낮아졌습니다. Northland는 10% 이상 하락했으며 Sansheng Guojian, Junshi Bio-U, Rongchang Biological, Laimei Pharmaceutical, Guilin Sanjin 등이 그 뒤를 이었습니다."},{"s":"Haisike: 1종 신약 크리가발린 베실레이트 캡슐과 콜라글립틴 정제가 국가 의료 보험 목록에 포함되었습니다.","so":"第一财经","tm":"11/16 11:10","c":1,"r":"cn","u":"https://www.yicai.com/news/103442074.html","p":1794795004,"a":1794830404,"t":"海思科：1类新药苯磺酸克利加巴林胶囊和考格列汀片被纳入国家医保目录","su":"제일재경 2026-11-16 16:07:52 편집자: Yin Qingyan HiSco는 회사의 1급 신약인 크리가발린 베실레이트 캡슐과 콜라글립틴 정제가 \"국가 의료 보험 목록(2026년 판)\"에 포함되었다고 발표했습니다. 크리가발린 베실레이트 캡슐은 성인의 당뇨병성 말초 신경병성 통증 및 대상포진 후 신경통의 치료에 적합합니다. 콜라글립틴 정제는 제2형 당뇨병이 있는 성인의 혈당 조절을 개선하는 데 적합합니다. 한 가지 평가: 의료 보험 카탈로그는 2026년에 조정 및 출시되어 혁신적인 약물 쪽으로 더욱 기울어질 것입니다. 2025년판 상업보험 혁신의약품 카탈로그의 18개 의약품 중 2개가 기본의료보험 카탈로그에 진입해 '상업보험을 통한 혁신의약품 최초 발굴 및 기본의료보험 연계'라는 변혁의 길을 실현하는 데 앞장섰다. 51종의 1급 신약이 국가의료보험 의약품 목록 새 버전에 등재되면서 새로운 최고 기록을 경신했습니다. 의료보험과 상업보험의 '이중 카탈로그' 업데이트 후 6개월 이내에 관련 카테고리 1 신약의 임상약물 가이드라인을 업데이트하도록 권장합니다. 희귀질환 신약의 시장공급이 중단될 경우 국가식품약품감독관리국은 해당 의약품의 시장독점기간을 종료할 수 있다."},{"s":"미 FDA, 중국산 유망 폐암 치료제 '이보네시맙' 승인 거부","so":"매일경제 마켓","tm":"11/16 10:28","c":1,"r":"kr","u":"https://stock.mk.co.kr/news/view/1199355","p":1794792529,"a":1794794327,"su":"미 FDA, 중국산 유망 폐암 치료제 '이보네시맙' 승인 거부 \"환자 수명 연장에 유의미한 효과 없어\" 주종국 입력 : 2026.11.16 10:28:49 I 수정 : 2026.11.16 10:40:38 (서울=연합뉴스) 주종국 기자 = 미국 식품의약국(FDA)이 중국산 유망 폐암 치료제 '이보네시맙(ivonescimab)'의 승인을 거부했다. 15일(현지시간) 뉴욕타임스(NYT)에 따르면 이 신약의 미국 내 판권을 보유한 미국 제약기업 서밋 테라퓨틱스는 FDA가 이보네시맙에 대해 보완요구서한(CRL)을 발행하며 승인을 거부했다고 발표했다."},{"s":"한 가지 평가: 의료 보험 카탈로그는 2026년에 조정 및 출시되어 혁신적인 약물 쪽으로 더욱 기울어질 것입니다.","so":"第一财经","tm":"11/16 10:28","c":1,"r":"cn","u":"https://www.yicai.com/news/103441253.html","p":1794792517,"a":1794792903,"t":"壹评级：2026年医保目录调整发布，进一步向创新药倾斜","su":"국민의료보험청이 2026년 의료보험목록 조정 결과를 발표했는데, 1급 혁신신약(세상에 처음 나온 새로운 약) 51개 품목이 사상 최대치를 기록했다. China Business Network의 \"One Rating\"은 정책 방향이 단순히 연구 개발 장려에서 상업화 지원으로 바뀌었고 임상 가치가 있는 혁신적인 약물이 결정론적인 성장 주기를 가져올 것이라고 믿습니다."},{"s":"그의 신장약은 주요 질병 지표를 43% 줄인 후 FDA 승인을 받았습니다. 한 번에 $74,730를 주입하면 원래 메디케어에 따라 약 $15,000의 빚을 지게 될 수 있습니다.","so":"Yahoo Finance","tm":"11/16 10:04","c":1,"r":"us","u":"https://finance.yahoo.com/healthcare/articles/kidney-drug-just-won-fda-010413089.html","p":1794791040,"a":1794868968,"t":"His Kidney Drug Just Won FDA Approval After Cutting a Key Disease Marker by 43%. One $74,730 Infusion Could Leave Him Owing Nearly $15,000 Under Original Medicare","su":"FDA가 승인한 새로운 신장 약물은 유망한 결과를 보여주지만, 예비 보장이 없는 Original Medicare의 퇴직자는 수개월 간의 사회 보장에 필적할 수 있는 청구서에 직면하게 됩니다. 하나의 등록 마감일과 하나의 인수 규칙이 그가 실제로 빚진 금액을 결정합니다."},{"s":"9년 동안 14개의 카테고리 1 혁신 약물이 등장했습니다. 광둥성 이 지역은 무엇을 제대로 했나요? | 광둥성의 경제 생태를 해독하다","so":"21财经","tm":"11/16 08:43","c":1,"r":"cn","u":"https://www.21jingji.com/article/20261116/herald/13d02f47a0f5495600207da8c686e65e.html","p":1794786187,"a":1794789721,"t":"九年跑出14个1类创新药，广东这个区做对了什么？| 解码广东经济生态","su":"최근 국가식품의약국은 광저우웨캉바이오제약유한회사에 '약품등록증'을 발급했고, 1급 혁신적 중의약인 자화문비지추과립이 공식적으로 판매 승인을 받았다. 이 신약은 광둥성 중의학병원 루추안젠 교수의 장기간 임상적으로 입증된 경험적 공식을 바탕으로 개발됐다. 6가지 약재로 구성되어 있으며 3~6주간 지속되는 감염후 기침, 풍한폐애증후군에 사용된다. 신약이 임상처방에서 현대중의학으로 발전하기 위해서는 약리연구, 임상시험, 등록심사, 생산검증 등의 과정을 거쳐야 한다. 광저우 황푸구의 경우, 이 등록증은 또 다른 무게감을 갖고 있습니다. 이는 올해 황푸가 승인한 두 번째 카테고리 1 혁신 약물이다. 2018년부터 황푸는 총 14개의 카테고리 1 혁신 의약품에 대해 승인을 받았으며 이는 광저우시 전체의 93.3%, 광둥성 전체의 43.8%를 차지한다. 6년 연속 카테고리 1 혁신 의약품을 시장에 출시했습니다."},{"s":"중국 혁신의약품의 구조적 장점이 드러난다. 2027년에는 '데이비스 더블클릭'이 일어날까?","so":"财联社","tm":"11/16 08:21","c":1,"r":"cn","u":"https://www.cls.cn/detail/2535143","p":1794784860,"a":1794806423,"t":"中国创新药结构性优势显现 2027年能否迎来“戴维斯双击”？","su":"① 2026년 상하이 증권거래소 국제 투자자 회의에서 Zhu Yi는 중국 혁신 의약품의 경쟁 우위가 단일 제품 및 플랫폼에서 R&D 시스템으로 확장되고 구조적 우위가 전 세계의 관심을 끌고 있다고 믿었습니다. ② 중국 국내 접근 정책이 개선되고 해외 가치가 실현됐다. 2027년에 \"Davis Double Click\"이 도입될지는 아직 테스트가 필요합니다. ③AI는 분자 생성을 가속화하며, 습식 실험 검증과 과학자 의사 결정은 여전히 R&D 성공률을 높이는 열쇠입니다. 차이롄서는 11월 16일(루아펑 기자) \"우리는 플랫폼 BD를 하는 것이 아니라 구조적 BD를 하면서 중국의 구조적 장점을 매수하고 있다\"고 보도했다. 2026년 상하이 증권거래소 국제 투자자 컨퍼런스에서 \"다음부터 정의까지: 중국 제약회사가 글로벌 혁신 리더가 되고 있습니까?\" 원탁 포럼에서 Bailey Tianheng(688506.SH)의 설립자이자 회장인 Zhu Yi는 지난 6개월 동안 중국 혁신 제약 산업의 변화를 요약했습니다."},{"s":"기술주 평가를 개정하고 자금을 생명공학 분야로 편입했다. 관련지수는 지난달 7.1% 가까이 상승했다.","so":"UDN","tm":"11/16 04:39","c":1,"r":"tw","u":"https://udn.com/news/story/123006/9880478","p":1794771560,"a":1794784837,"t":"科技股評價修正資金轉進生技 相關指數近一月上漲近7.1%","su":"최근 시중자금의 순환이 빠르게 진행되고 있습니다. 기존 강세를 보인 기술주에 대한 평가를 수정하고, 합리적인 평가와 탄탄한 펀더멘털을 갖춘 바이오·의료주에 일부 자금을 편입했다. 가장 대표적인 NBI 생명공학지수를 보면 지난 한 달간 7.1% 가까이 상승했다. 기술주를 대표하는 나스닥 지수와 비교하면 최근 몇 달간 6.7% 하락했다. 더욱 돋보입니다. 지난 한 달 동안 미국 S&P500(미국 큰 회사 500곳 지수)의 다양한 주식들의 성과를 살펴보면, 헬스케어 주식들도 가장 좋은 성과를 냈습니다. 투자자들은 생명공학 ETF(여러 주식을 묶어 파는 상품)를 통해 시장을 확인하고 싶을 수도 있습니다."},{"s":"Jingshuo 및 Yaohua Pharmaceutical과 같은 생명공학 주식은 첫 3분기 동안 폭발적인 이익을 경험했습니다. 주당순이익 순위가 대대적으로 개편되고 있습니다. 법인들은 2027년 성장 모멘텀이 새로운 최고치에 도달할 것으로 예상합니다.","so":"工商時報","tm":"11/16 04:00","c":1,"r":"tw","u":"https://www.ctee.com.tw/news/20261116700124-439901","p":1794769200,"a":1794806426,"t":"晶碩、藥華藥等生技股前三季獲利噴發EPS排行大洗牌法人看2027成長動能再創高- 日報","su":"첫 3분기 동안 생명공학 주식의 주당 수익입니다. 상위 10개 생명공학 주식은 첫 3분기 동안 엄청난 이익을 냈습니다. 총 8개 회사가 1주 이상의 자본금을 창출했습니다. 다만, 세후주당순이익(주식 한 주가 번 돈)주) 순위는 대대적인 개편을 겪었다. 징숴(Jingshuo)가 20.09위안으로 1위를 차지했고, 야오화제약(Yaohua Pharmaceutical)이 18.43위안, 타이보(Taibo)가 18.06위안으로 뒤를 이었다. BenQ Medical은 16.65위안으로 처음으로 상위권에 진입했습니다. Baorui는 상위 10위에 진입했고 Lamex는 예상치 못하게 30위로 떨어졌습니다. 전체적으로 의료소재, 의약품, 미용·건강제품 3대군으로 구성되어 있습니다."},{"s":"의료보험이 적용되는 혁신적인 의약품을 최대한 빨리 사용하는 방법은 무엇입니까? 다학과 협업으로 '입학의 어려움' 해결","so":"央视网","tm":"11/16 02:06","c":1,"r":"cn","u":"https://news.cctv.com/2026/11/16/ARTIgQCII4pqN5iNGHDqvJyN261115.shtml","p":1794762390,"a":1794784826,"t":"进了医保的创新药如何尽快用上？多部门联动破解“入院难”","su":"최근 국민의료보험청은 기본 보장과 수익성 보호를 바탕으로 혁신의약품에 대한 보호를 지속적으로 강화해 왔으며, 임상적 이점이 명확한 혁신의약품을 포함하고 치료 공백을 보험 범위에 채워 일반 국민이 새롭고 좋은 의약품을 사용할 수 있도록 하는 데 중점을 두고 있다. 현재 의료보험으로 인해 협상된 약품 판매액이 매년 170억 위안을 초과하고 있으며 이는 5년 전의 4배입니다. '14차 5개년 계획' 기간 의료보험 기금 누적 지출은 13조 위안에 달했다."},{"s":"\"지능형 혁신 약물이 건강에 힘을 실어줍니다\" 2026년 혁신 약물 고품질 개발 회의가 장쑤성 쑤저우에서 개최되었습니다.","so":"央视网","tm":"11/15 15:14","c":1,"r":"cn","u":"https://local.cctv.com/2026/11/15/ARTIJUUOS3gCb1NM4LmCttey261115.shtml","p":1794723251,"a":1794727069,"t":"“智创新药 赋能健康” 2026年创新药高质量发展大会在江苏苏州举行","su":"\"지능형 혁신 약물이 건강에 힘을 실어줍니다\" 2026년 혁신 약물 고품질 개발 컨퍼런스가 장쑤성 쑤저우에서 개최되었습니다."},{"s":"수백만 달러의 가격을 돌파한 후, 카탈로그로 이전된 첫 번째 혁신 의약품의 판매량이 폭발적으로 증가할 수 있을까요?","so":"第一财经","tm":"11/15 10:27","c":1,"r":"cn","u":"https://www.yicai.com/news/103440856.html","p":1794706024,"a":1794751323,"t":"击穿百万价格后，首批转目录的创新药销量能大爆发吗？","su":"\"혁신적인 약물이 곧 등장할 예정이며, 내년에는 이 CAR-T의 매출(물건을 판 돈 전체)이 급증할 것입니다!\" 한 선임 의료인은 오늘 CAR-T 세포치료제 레기올란자가 기본의료보험에 포함됐다는 소식을 듣고 흥분을 감추지 못했다. 우시준누오의 루이구이오렌제주가 녹시나신나트륨에 이어 의료보험 협상을 통해 '순환을 깨는' 또 하나의 스타 고부가가치 의약품으로 자리 잡았다. 이 사람은 100만 달러에 달하는 CAR-T 의약품의 '고가' 장벽이 허물어지면서, 혁신의약품이 지불한도를 깨기 위한 새로운 상상의 공간을 열고 있다고 직설적으로 말했다. 올해 의료보험 카탈로그 조정으로 처음으로 '이중 카탈로그' 연결 메커니즘이 구축되어 상업 보험 상품에 기본 의료 보험을 신청할 수 있게 되었습니다. 국민의료보험청은 고부가가치 혁신신약(세상에 처음 나온 새로운 약)이 출시 초기 단계에서 상용보험 목록에 진입하고 임상 활용을 통해 데이터를 축적해 비용을 절감한 뒤 기본의료보험으로 전환하도록 장려하고 있다."},{"s":"2026년 11월 주목해야 할 영국 생명공학 주식 상위 3개","so":"Yahoo Finance","tm":"11/15 08:09","c":1,"r":"us","u":"https://finance.yahoo.com/healthcare/articles/top-3-british-biotech-stocks-230940445.html","p":1794697780,"a":1794702385,"t":"Top 3 British Biotech Stocks To Watch In November 2026","su":"미국의 도매 인플레이션(물건값이 계속 오르는 것) 상승과 추가 금리(돈을 빌릴 때 내는 이자 비율) 인상 기대로 인해 글로벌 투자자들이 불안해하고 있습니다. 그러나 이런 종류의 압력은 종종 금리가 아닌 돌파구가 결과를 주도하는 부문으로 돈을 밀어 넣습니다. 영국의 생명공학 주식은 바로 그 진영에 속해 있습니다. 이 기사에서는 영국 생명공학 기업을 필터링하는 집중 선별기의 세 가지 후보자를 볼 수 있습니다."}]},{"name":"🔋 2차전지","note":"보유: TIGER 2차전지테마 · KODEX 2차전지산업 · TIGER 2차전지소재Fn","breaking":false,"items":[{"s":"김동명 LG엔솔 사장 “수능은 끝 아닌 새로운 시작”…임직원 자녀 210명 응원","so":"아시아투데이","tm":"11/16 14:11","c":9,"r":"kr","u":"https://www.asiatoday.co.kr/kn/view.php?key=20261116010005995","p":1794805889,"a":1794806434,"su":"김동명 LG에너지솔루션 사장이 2027학년도 대학수학능력시험을 앞둔 임직원 자녀들에게 격려 선물(미래 값을 미리 정해 사고파는 거래)과 응원의 메시지를 전했다. 구성원뿐 아니라 가족의 중요한 순간까지 함께하는 기업문화를 조성하기 위한 취지다.LG엔솔은 김 사장이 수능을 앞둔 임직원 자녀 약 210명에게.."},{"s":"가오슝의 한 전기차 판매점 배터리 창고에서 불이 이웃집으로 번져 딜러에게 배상금 887만 대만달러를 지불하라는 명령이 내려졌다.","so":"中央社 CNA","tm":"11/17 14:56","c":3,"r":"tw","u":"https://www.cna.com.tw/news/asoc/202611170138.aspx","p":1794894960,"a":1794898828,"t":"高雄電動車行電池倉庫火警延燒鄰戶 判經銷商賠887萬","su":"가오슝의 한 전기 오토바이 딜러가 양철집을 리튬 배터리 충전 행됩니다. CCTV 뉴스와 중국자동차제조협회에 따르면, 협회는 자동차 회사들이 공급업체 계정 지불을 표준화하도록 장려하기 위해 17개 주요 자동차 회사의 공급업체 계정 지불에 대한 조사 및 평가를 실시할 예정입니다. 이번 조사·평가 업무는 '자동차업체 정기 제출 + 샘플 공급업체 무작위 점검'을 조합해 1년에 1회씩 실시되는 것으로 전해졌다. 자동차회사는 매년 1월 31일 이전에 전년도 대금납부 보고서를 제출하고, 7월 31일 이전에는 상반기 대금대금 보고서를 제출해야 한다. 동시에, 각 업체의 공급업체 중에서 무작위로 15개 이상의 공급업체를 표본으로 선정하고, 자료검증, 현장조사 등을 통해 제출된 정보의 진위 여부를 확인한다. 평가 내용에는 법인계좌 대금관리시스템 및 디지털 시스템 구축 등이 포함된다. 중소기업의 계좌납부기간이 60일 이내인지, 모든 납부가 현금으로 이루어지는지 여부 비중소기업의 계좌지급기간이 60일 요건을 충족하는지 여부, 현금 및 은행 인수어음 지급 비율이 80% 이상인지 여부 등"},{"s":"“니켈 덜 쓰고도 성능은 그대로”…포스텍, 고전압 '미드니켈' 배터리 해법 찾았다","so":"전자신문","tm":"11/17 09:20","c":1,"r":"kr","u":"https://www.etnews.com/20261117000039","p":1794874817,"a":1794885797,"su":"포스텍(POSTECH)은 강병우 신소재공학과 교수 연구팀이 니켈을 적게 쓴 배터리 소재로도 니켈을 많이 쓴 고가 소재에 버금가는 에너지를 담으면서 오래 쓸 수 있는 원리를 확인했다고 17일 밝혔다. 전기차의 가격인하 및 주행거리 증대는 물론, 배터리 안전성과 수명 향상, 차세대 대용량 에너지저장장치(ESS(전기를 저장해 두는 큰 배터리)) 등 다양한 분야에 활용할 수 있을 것으로 기대된다. 강 교수와 신소재공학과 통합과정 김선기, 배터리공학과 임수진 석사 연구팀이 미국 스티븐"},{"s":"CATL은 시멘트 EV 산업 지배력을 높이기 위해 배터리 교체에 베팅합니다.","so":"Bloomberg.com","tm":"11/17 08:00","c":1,"r":"us","u":"https://www.bloomberg.com/news/articles/2026-11-16/catl-bets-on-battery-swapping-to-cement-ev-industry-dominance","p":1794870000,"a":1794874101,"t":"CATL Bets on Battery-Swapping to Cement EV Industry Dominance"},{"s":"[이 시각 시황] 코스피 5천선 위협 속 약세 지속…2차전지·의료AI주는 강세","so":"SBS Biz","tm":"11/17 07:55","c":1,"r":"kr","u":"https://biz.sbs.co.kr/article/20000346899","p":1794869700,"a":1794898824,"su":"머니쇼 '이 시각 시황' - 장연재이 시각 시황입니다.시장이 연일 내리막길을 걷고 있습니다.오늘은 코스피(한국 대표 주식시장 지수) 5천선마저 위협받고 있는 상황인데요.현재 1.4% 약세입니다.5030선 기록하고 있고요.코스닥(한국 중소·기술 회사 주식시장)도 0.2% 하락하면서 664포인트에서 움직임 전개됩니다.수급 상황 보시죠.유가증…"},{"s":"미국에서 압박을 받은 중국 CATL은 아르헨티나의 배터리 저장 붐에 베팅했습니다.","so":"South China Morning Post","tm":"11/17 06:38","c":1,"r":"sg","u":"https://news.google.com/rss/articles/CBMirAFBVV95cUxNa2t1TklRV1VqUmxucTVWQjBQVTM1MG9PbW5vNVRXNEtxdXd5VTV2TmVyYS1aVmQtSW9PSndRX3U1UmRHVFdmdEVFMmxXTVpzTXVudG5teUFCTy1lcVRRcTRXVURZVkcyT0VMOTZDTDhNTE9MTnpuS1BVeDNSZG "u":"https://www.ctee.com.tw/news/20261117700033-430805","p":1794852000,"a":1794869004,"t":"北京│北汽極狐夥寧德時代建3萬座換電站- 兩岸","su":"베이징자동차가 소유한 신에너지 자동차 브랜드 지후(Jihu)가 'Ji+ Era' 전국 배터리 교체 계획을 13일 발표했다. 본토 배터리 거대 기업인 CATL과 공동으로 배터리 교환소 3만개와 공공 충전소 130만개를 건설할 예정이다. 현재 베이징자동차 Jihu는 NIO Energy, GAC Energy 등 100개 이상의 충전 서비스 제공업체와 협력하고 있습니다. 베이징은 앞서 2030년까지 신에너지 차량 240만 대를 유지하고, 충전 파일 65만 개를 건설하며, 전원 공급 신뢰도를 99.998%로 향상시킬 계획이었습니다."},{"s":"CATL, 승용차 배터리 교체 시장 선두주자로 성장","so":"electrive.com","tm":"11/17 01:00","c":1,"r":"us","u":"https://www.electrive.com/2026/11/16/catl-to-become-market-leader-in-passenger-car-battery-swapping/","p":1794844800,"a":1794869002,"t":"CATL to become market leader in passenger car battery swapping","su":"CATL은 내년에 중국 최대 승용차 배터리 교체 스테이션 운영업체가 될 수 있습니다. 회사는 올해까지 6,000개 스테이션을 운영할 계획이다."},{"s":"CATL은 2027년에 승용차 배터리 교환 네트워크를 중국 전역의 6,000개 충전소로 확장할 계획입니다.","so":"AutoTechInsight","tm":"11/16 23:39","c":1,"r":"world","u":"https://autotechinsight.spglobal.com/news/5291481/catl-plans-to-expand-passenger-car-battery-swap-network-to-6000-stations-across-china-in-2027","p":1794839952,"a":1794869007,"t":"CATL plans to expand passenger car battery-swap network to 6,000 stations across China in 2027","su":"CATL은 2025년 말 초코 스테이션을 1,020개로 늘려 7월 2,000개, 9월 29일까지 2,520개로 늘었다."},{"s":"CATL, Baidu, Unitree, 선전에서 열리는 APEC CEO 서밋에 참석","so":"Bloomberg.com","tm":"11/16 22:40","c":1,"r":"us","u":"https://www.bloomberg.com/news/articles/2026-11-16/catl-baidu-unitree-to-attend-apec-ceo-summit-in-shenzhen","p":1794836412,"a":1794838060,"t":"CATL, Baidu, Unitree to Attend APEC CEO Summit in Shenzhen"},{"s":"쓰촨성 신에너지 자동차 및 전력 배터리 산업 체인의 첫 3분기 매출이 5000억 위안을 초과했습니다.","so":"中国新闻网","tm":"11/16 22:11","c":1,"r":"cn","u":"https://www.chinanews.com.cn/cj/2026/11-16/10733078.shtml","p":1794834684,"a":1794838061,"t":"四川新能源汽车及动力电池产业链前三季度营收超5000亿元","su":"쓰촨성 신에너지 차량 및 전력 배터리 산업 체인의 첫 3분기 매출(물건을 판 돈 전체)이 5000억 위안을 초과했습니다. China News Service, 청두, 11월 16일(Wang Liwen) 쓰촨성 신에너지 차량 및 전력 배터리 산업 체인의 수급 도킹 활동에 대한 언론 브리핑이 16일 쓰촨성 경제정보기술부에서 열렸습니다. 쓰촨성 경제정보기술부 자동차 및 철도 운송 장비 부서 부국장 Li Yan은 회의에서 올해 상반기 쓰촨성 '15+N' 핵심 산업 체인 평가에서 신에너지 차량 및 전력 배터리 산업 체인의 종합 발전 지수가 119.3으로 1위를 차지했다고 소개했습니다. 상위 3개 분기에 성의 신에너지 차량 생산량은 310,000대로 전년 동기 대비 45% 증가했고, 동력 배터리 생산량은 약 260GWh로 전년 동기 대비 53% 증가했으며, 업계 체인 매출은 전년 동기 대비 28% 증가한 5000억 위안을 초과했습니다. 연간 업계 체인 수익은 6000억 위안을 초과할 것으로 예상됩니다."},{"s":"르노는 프랑스에서 사무직 최대 1000명을 해고하고 EV 생산 역할을 추가할 것이라고 소식통은 전했습니다.","so":"Reuters","tm":"11/16 20:43","c":1,"r":"us","u":"https://www.reuters.com/business/world-at-work/renault-cut-up-1000-white-collar-jobs-france-add-roles-ev-production-say-sources-2026-11-16/","p":1794829423,"a":1794830417,"t":"Renault to cut up to 1,000 white-collar jobs in France, add roles for EV production, say sources"},{"s":"허난 상무부 답변 21: BYD에서 CATL까지, 투자 유치 및 효율성 향상을 위한 세 가지 주요 조치","so":"21财经","tm":"11/16 20:41","c":1,"r":"cn","u":"https://www.21jingji.com/article/20261116/herald/4f81f2c967b1df5f6d333ab91a9de546.html","p":1794829260,"a":1794830422,"t":"河南商务厅答21：从比亚迪到宁德时代，三大举措招商提效","su":"21세기 비즈니스 헤럴드 기자 Zhou Hui가 베이징에서 보도합니다. 제14회 중국 중부 투자 무역 박람회가 11월 21일부터 23일까지 허난성 정저우시에서 개최됩니다. 11월 16일 국무원 신문판공실에서 열린 기자회견에서 장다싱(張大興) 허난성 상무부장은 21세기 비즈니스 헤럴드 기자들의 질문에 답하면서 투자 촉진과 산업 발전 촉진을 위한 허난성의 조치를 소개했다. 사진: 기자회견 현장 사진: Zhou Hui 장다싱(Zhang Daxing)에 따르면, 최근 몇 년 동안 허난성은 전국 통일 시장 건설을 심화하고 지방 투자 촉진 행위를 규제하는 것에 대한 당 중앙위원회와 국무원의 결정과 배치를 철저히 시행했으며, 지역 여건에 따라 투자 촉진을 위한 새로운 길과 새로운 모델을 모색했습니다."},{"s":"이춘(Yichun)에 있는 두 개의 주요 리튬 광산이 환경 영향 평가 승인을 받았습니다. Ganxiawo 리튬 광산이 11월에 생산을 재개할 것으로 예상됩니까? CATL은 아직 응답하지 않았습니다","so":"每日经济新闻","tm":"11/16 19:45","c":1,"r":"cn","u":"https://news.google.com/rss/articles/CBMiZkFVX3lxTE1NRUp5UlFRSjRhNXNHOERxZEIyM1hJZkdEaGxERG1QeGZKVzNoQ1N0VGpIbXRNWXU5M2ozMDlLb3RmN04wcmRWRzV4dEY4ZTc1QXpwaEl0NzAza0QtVGM0X0ExQWZ5QQ?oc=5","p":1794825900,"a":1794874103,"t":"宜春两大锂矿迎来环评获批，枧下窝锂矿有望11月复产？宁德时代暂未回应"},{"s":"중국, 최초로 19인승 배터리 구동 항공기 비행: 얼마나 멀리 비행할 수 있나요?","so":"Livemint","tm":"11/16 19:43","c":1,"r":"us","u":"https://www.livemint.com/technology/china '4000위안 배상' 문제는 범죄자들이 자동차 회사의 이름으로 만들어 유포한 허위 공지입니다.","so":"Jiemian.com","tm":"11/16 16:38","c":1,"r":"cn","u":"https://m.jiemian.com/article/15337188.html","p":1794814690,"a":1794830423,"t":"理想汽车：“动力电池召回”事项、“4000元赔偿”为不法分子冒用车企名义制作、传播的虚假通知","su":"11월 16일, @IDEAL 자동차 법무팀은 최근 일부 자동차 소유자가 자동차 회사의 이름으로 범죄자들이 작성하고 유포한 허위 리콜 통지를 받았다는 기사를 발표했습니다. 그들은 '파워 배터리 리콜'을 근거로 자동차 소유자가 '보상금 4,000위안'을 받을 수 있다고 주장하고 자동차 소유자에게 첨부된 웹사이트를 방문하거나 QR 코드를 스캔하여 소위 '온라인 고객 서비스'에 연락하여 정보를 등록하도록 안내합니다. 앞서 회사는 '에어백 리콜' 사기 문자 메시지와 '이상적인 i6 공동구매 리베이트' 관련 채용 정보에 대해 별도의 알림을 발송한 바 있다. 사실을 명확히 하고 자동차 소유자의 정당한 권익을 보호하기 위해 회사는 Li Auto라는 이름을 사용한 허위 통지에 대해 다시 한 번 엄숙히 선언합니다. 관련 통지에 언급된 Li Auto의 '파워 배터리 리콜'과 '4,000위안 보상'은 모두 허구입니다. 위 공지는 Li Auto의 공식 공지가 아닙니다. 첨부된 URL은 사기성 웹사이트입니다. 관련 QR 코드 및 소위 \"온라인 고객 서비스\"는 Li Auto의 공식 서비스 채널이 아닙니다."},{"s":"[2026 강소특구] 충북청주 강소특구 “개방형 혁신으로 반도체·이차전지·양자 리더로”","so":"동아일보","tm":"11/16 16:16","c":1,"r":"kr","u":"https://www.donga.com/news/It/article/all/20261116/135033078/1","p":1794813360,"a":1794830415,"su":"※2019년부터 강소특구는 지역 주도의 혁신성장을 지원하기 위해 탄생했습니다. 현재 지역 혁신 거점으로서 강소특구 내 기술 창업과 연구소기업 등이 지역 경제성장을 견인하는 유니콘 기업으로 성장하도록 성장단계별 맞춤형 기술사업화를 지원해 나가고 있습니다. IT동아는 과…"},{"s":"리튬값 4분기 들어 35% 넘게 하락…K배터리 수익성 변수로","so":"이투데이","tm":"11/16 15:58","c":1,"r":"kr","u":"https://www.etoday.co.kr/news/view/2648729","p":1794812280,"a":1794830415,"su":"4분기 리튬 가격 35% 하락셀 판가·양극재 재고 부담 확대▲호주 미네랄 리소스가 보유·운영 중인 서호주 워지나(Wodgina) 리튬 광산 (사진제공=포스코"},{"s":"‘이차전지 전주기’ 한눈에… 포항서 48개사 참가한 에너지 축제 성황리 종료","so":"이투데이","tm":"11/16 15:53","c":1,"r":"kr","u":"https://www.etoday.co.kr/news/view/2648792?trc=right_categori_news","p":1794811980,"a":1794812202,"su":"13일부터 사흘간 포항종합운동장 만인당서 개최…에코프로·포스코퓨처엠 등 참여휴머노이드(사람을 닮은 로봇) 로봇부터 배터리팩 분해까지…기술 교류와 시민 체험 두 마"},{"s":"목표는 3억 킬로와트이며, 주요 에너지 저장 정책이 구현되었습니다! 배터리 부문은 배터리 ETF 차이나 유니버셜(159796) 지수가 1% 이상 하락하는 등 약세를 보이고 변동성이 크다. 전 세계적으로 전력 부족 현상이 발생하고 있습니다. 에너지 저장 기회에 대해 어떻게 생각하시나요?","so":"Jiemian.com","tm":"11/16 15:41","c":1,"r":"cn","u":"https://www.jiemian.com/article/15336863.html","p":1794811312,"a":1794812205,"t":"目标3亿千瓦，储能重磅政策落地！电池板块弱势震荡，电池ETF汇添富(159796)指数跌超1%，全球缺电，储能机遇怎么看？","su":"11월 16일 A주 시장은 등락세를 보이며 약세(내리는 흐름)를 보였습니다. 기술 부문이 다시 큰 폭으로 하락했습니다. 상하이증권거래소 지수는 1% 이상 하락했다. 배터리 부문은 수중에서 변동했습니다. 배터리 ETF(여러 주식을 묶어 파는 상품) 차이나유니버설(159796)의 기초지수는 1% 이상 하락했다. 3일 연속으로 계속해서 약해지고 떨어질 수도 있습니다."},{"s":"KTR, 광양에 189억 투입…‘이차전지 소재 실증센터’ 구축","so":"중앙일보","tm":"11/16 15:35","c":1,"r":"kr","u":"https://www.joongang.co.kr/article/25479020","p":1794810900,"a":1794812202,"su":"한국화학융합시험연구원(KTR·원장 이승렬)이 11월 12일 광양시청에서 광양시와 이차전지 소재 실증 인프라 구축을 위한 업무협약을 체결했다. 이번 협약은 산업통상부의 ‘미래 이차전지 원료소재 실증 플랫폼 기반 구축 사업’을 추진하기 위해 마련됐다. KTR은 지난 5월 해당 사업의 주관기관으로 선정됐다. KTR은 2029년 말까지 약 189억원을 투입해 광양청사에 ‘미래 이차전지 소재 실증센터’를 구축할 계획이다. 실증센터는 이차전지 소재의 개발부터 제작, 성능 검증까지 전 과정을 지원하는 시설이다."},{"s":"4천번 급속 충전에도 거뜬…국내 연구진, 차세대 배터리 개발","so":"연합뉴스","tm":"11/16 15:30","c":1,"r":"kr","u":"https://www.yna.co.kr/view/AKR20261116125400053","p":1794810609,"a":1794812202,"su":"포스텍-서강대, 차세대 듀얼이온전지 개발 흑연에 초박막 보호막, 저장량 3배로 향상 급속 충전 4천번 반복에도 성능 유지 전체 내용을 이해하기 위해서는 기사 본문과 함께 읽어야 합니다. 송고 2026년11월16일 15시30분 구글 검색에서 연합뉴스 기사를 우선적으로 보여줍니다. (포항=연합뉴스) 손대성 기자 = 국내 연구진이 잦은 충전에도 오래 사용할 수 있는 이차전지를 개발했다. 포스텍(POSTECH)은 화학과 박수진 교수, 강지은 박사, 지윤아 석사, 기계공학과 안지환 교수, 박사과정 조성은씨 연구팀이 서강대 화공생명공학과 류재건 교수 연구팀과 함께 충전 속도와 수명을 모두 높인 듀얼이온전지용 흑연 양극을 개발했다고 16일 밝혔다."},{"s":"보도자료: 미드리무시 유래 재료로 만드는 불소 프리의 리튬 이온 전지 정극용 바인더(공동 통신 PR 와이어)","so":"毎日新聞","tm":"11/16 14:00","c":1,"r":"jp","u":"https://mainichi.jp/articles/20261116/pls/00m/020/554000c","p":1794805200,"a":1794806610,"t":"プレスリリース：ミドリムシ由来材料で作るフッ素フリーのリチウムイオン電池正極用バインダー（共同通信PRワイヤー）","su":"기존의 전극 제조 공정에의 적용을 기대할 수 있어 기존의 불소계 고분자 재료와 동등한 충방전 성능을 확인 포인트"},{"s":"CATL 장쑤 자회사, 자본금 20억 위안으로 증자","so":"Jiemian.com","tm":"11/16 12:42","c":1,"r":"cn","u":"https://m.jiemian.com/article/15336117.html","p":1794800563,"a":1794806436,"t":"宁德时代江苏子公司增资至20亿元","su":"Tianyancha 앱에 따르면 CATL (Jiangsu) New Energy Technology Co., Ltd.는 최근 산업 및 상업 변화를 겪었으며 등록 자본금은 10억 위안에서 20억 위안으로 증가했습니다. 회사는 2016년 6월에 설립되었습니다. 회사의 법적 대표자는 发电","su":"China Energy Construction에 따르면, 세계 최초의 300MW 인공 챔버 압축 공기 에너지 저장 발전소인 \"Yuanshu No. 1\"이 감숙성 그리드에 성공적으로 연결되어 인공 챔버 압축 공기 에너지 저장 기술이 실험적 검증에서 대규모 엔지니어링 적용에 이르기까지 획기적인 발전을 이루었으며 중국 압축 공기 에너지 저장 기술 경로의 다각적 개발을 위한 새로운 엔지니어링 사례를 제공했습니다. 압축공기 에너지저장장치(전기를 저장해 두는 큰 배터리)는 전기에너지를 기압 위치에너지로 변환하고 필요할 때 다시 전기에너지로 변환하는 에너지 저장 기술이다. \"위안추 1호\" 발전소는 지하 110미터 암석층에 가스 저장실을 굴착하여 건설합니다. 챔버 그룹은 4개의 챔버로 구성됩니다. 발전소는 300MW의 전력과 1,800MWh의 에너지 저장 용량을 갖춘 발전 장치를 건설할 예정입니다. 전기-전기 변환 효율은 72%에 이릅니다. 한 번에 6시간 동안 장기간 발전할 수 있으며 연간 발전량은 6억kWh에 달할 수 있습니다."},{"s":"민테크-테라리더, 전고체 배터리 진단장비 공동 개발","so":"디일렉","tm":"11/17 13:39","c":3,"r":"kr","u":"https://www.thelec.kr/news/articleView.html?idxno=65530","p":1794890382,"a":1794898856,"su":"민테크가 테라리더와 전고체 배터리(액체 대신 고체를 넣은 안전한 배터리) 제조공정에 적용할 진단장비를 공동 개발한다.민테크는 17일 디지털 가압 제어 전문기업 테라리더와 전고체 배터리 제조공정 진단 솔"},{"s":"'네트워크 주식' 청화발전, 저궤도 위성과 에너지 저장장치 결합해 윈린 방재 통신망 구축","so":"中時新聞網","tm":"11/16 14:49","c":3,"r":"tw","u":"https://www.chinatimes.com/realtimenews/20261116002671-260410","p":1794808192,"a":1794809547,"t":"《通網股》中華電結合低軌衛星與儲能 打造雲林防災通訊網","su":"청화전력(2412)은 윈린현 소방서와 손잡고 '보호자 통신망'을 구축했다. 극한 기후 및 복잡한 재해 위험 증가에 대응하여 마이크로파 전송, 전문 디지털 라디오, 비디오 통신, 저궤도 위성 및 에너지 백업과 같은 기술을 통합하고 윈린현에 30개의 통신 스테이션을 구축하여 다단계 재해 예방 및 구호 통신 프레임워크를 구축합니다."},{"s":"CITIC Securities: 조립 기계부터 운영까지 에너지 저장 장치 개발 계획 발표","so":"第一财经","tm":"11/17 09:01","c":2,"r":"cn","u":"https://www.yicai.com/news/103442788.html","p":1794873704,"a":1794874154,"t":"中信证券：储能发展规划出台，从拼装机到拼运营","su":"제일재경 2026-11-17 07:59:37 편집자: Tang Yanbei CITIC Securities 연구 보고서에 따르면 신에너지 저장 산업을 위한 '15차 5개년 계획'이 시작되었으며, 신 에너지 저장 장치 설치 용량 목표는 2030년에 3억 킬로와트로 계획되어 있으며, 묵시 기간 동안 복합 성장률은 17%입니다. 이 정책은 전력 시장 참여, 용량 메커니즘 개선, 운영 비용 공유 연구 및 최적화 등을 통해 새로운 에너지 저장 장치 개발 시장 메커니즘을 개선할 것을 명확하게 제안합니다. 새로운 에너지 저장 장치는 시장 지향적인 개발 단계로 나아가고 있습니다. 전력 공급 측면과 그리드 측면의 에너지 저장 개발은 정책 지원을 받았으며, 전력 공급 측면의 분배 및 저장과 전력 시장 거래의 통합 참여는 정책 지원을 받아 에너지 저장 투자에 대한 전력 공급 측면의 열정을 높이는 데 도움이 될 것입니다. 신에너지 개발은 에너지 저장장치 개발 이후 시스템 소비능력 향상으로 이익을 얻으며, 화력 규제의 가치는 약화되기 어렵다."},{"s":"Jianhexing은 강력한 주문, 녹색 에너지 및 에너지 저장이 추진력을 더할 것으로 보고 있습니다.","so":"中時新聞網","tm":"11/17 05:10","c":2,"r":"tw","u":"https://news.google.com/rss/articles/CBMia0FVX3lxTE9vN0VKaFdVRnVJaWEwcDEwVHhIZm1uM2JEdTJkVWtadjBfdlRKWk1qSjNDZVo0ODN4QjRmZzByeGp0YzdzdnZmeHNnWGwwejRtZy01T3ZVQkRWUG5VcUZkTlFtVmJsZmd1WUpv?oc=5","p":1794859800,"a":1794869036,"t":"健和興訂單旺 綠能、儲能添動能"},{"s":"19:43:17 [새로운 에너지 저장 솔루션의 구현은 녹색 전력 부문의 성장 논리를 강화하고 녹색 전력 ETF E 펀드(562960)의 기본 지수가 거의 1% 상승했습니다.]","so":"财联社","tm":"11/16 20:43","c":2,"r":"cn","u":"https://www.cls.cn/detail/2535669","p":1794829397,"a":1794830439,"t":"19:43:17【新型储能方案落地强化绿电板块成长逻辑，绿色电力ETF易方达（562960）标的指数涨近1%】"},{"s":"DoGo의 그리드 형성 ESS는 인도네시아 외딴 섬의 2,000 가구에 24시간 전력을 공급합니다.","so":"Japan Wire by Kyodo News","tm":"11/16 16:12","c":2,"r":"us","u":"https://english.kyodonews.net/articles/-/91578","p":1794813120,"a":1794830436,"t":"DoGo's Grid-Forming ESS Delivers Round-the-Clock Power to 2,000 Households on Remote Indonesian Island","su":"자카르타, 인도네시아, 2026년 11월 16일 /PRNewswire/ -- DoGo Power의 스마트 그리드 형성 에너지 저장 시스템(ESS(전기를 저장해 두는 큰 배터리))과 에너지 관리 시스템(EMS)이 인도네시아 남부의 외딴 섬인 Pagerungan Kecil Island(P Island)에서 공식적으로 가동되었습니다."},{"s":"\"한정된 시간의 전력 소비\"에 작별 인사, Donggao 그리드형 에너지 저장 장치가 인도네시아 외딴 섬의 2,000 가구를 밝힙니다.","so":"經濟日報","tm":"11/16 14:00","c":2,"r":"tw","u":"https://money.udn.com/money/story/123828/9881536","p":1794805255,"a":1794806449,"t":"告別「限時用電」 東高構網型儲能點亮印尼孤島兩千戶家庭","su":"자카르타, 인도네시아 2026년 11월 16일 /PRNewswire/ -- 최근 Donggao Future Energy가 인도네시아 남부 Pagerungan Kecil Island(이하 \"P Island\") 프로젝트에 제공한 지능형 네트워크 에너지 저장 시스템 및 에너지 관리 시스템이 가동에 들어갔습니다. Donggao Future Energy는 그리드 레벨 네트워크 에너지 저장 및 새로운 전력 시스템의 핵심 기술에 중점을 두고 있습니다. 이번에 가동되는 프로젝트의 설치 용량은 태양광 1MW + 2MW/4MWh 에너지 저장장치로, 메인 그리드와 연결되지 않은 이 고립된 섬에 안정적인 전력 지원을 제공하고, 동남아시아 섬 마이크로그리드 구축을 위한 복제 가능한 실제 샘플도 제공한다. DoGo의 그리드 형성 ESS(전기를 저장해 두는 큰 배터리)는 인도네시아 외딴 섬의 2,000가구에 24시간 전력을 공급합니다. P섬은 고립된 섬에 갇혀 있습니다: 디젤 발전과 시간 제한 전력 공급. P섬은 외진 곳에 위치하고 있어 주 전력망에 연결할 수 있는 바다 횡단 케이블이 없습니다. 기본적인 전력 수요를 유지하기 위해 오랫동안 디젤 발전에 의존해 왔습니다. 섬에는 어업으로 생계를 유지하는 영주권자가 2,000명 이상 있습니다. 원래 전원 공급 장치는 가구의 약 4분의 1에만 적용되며"},{"s":"엠플러스, '전고체 배터리' 양산시장 뚫었다…글로벌 기업서 200억대 수주","so":"파이낸셜뉴스","tm":"11/16 08:46","c":2,"r":"kr","u":"https://www.fnnews.com/news/202611160844070909","p":1794786411,"a":1794789736,"su":"이차전지 조립장비 전문기업 엠플러스가 글로벌 기업으로부터 200억원대 전고체 배터리(액체 대신 고체를 넣은 안전한 배터리) 장비를 수주(일감 주문을 받는 것)하며 차세대 배터리 시장 공략에 속도를 내고 있다."},{"s":"Linxon과 Fluence, 통합 에너지 저장 제공을 발전시키기 위해 전략적 협력 체결","so":"Financial Times","tm":"11/18 03:06","c":1,"r":"world","u":"https://markets.ft.com/data/announce/detail?dockey=600-202611171306PR_NEWS_USPRX____HS00394-1","p":1794938760,"a":1794955480,"t":"Linxon and Fluence form Strategic Collaboration to advance integrated energy storage delivery"},{"s":"Avantus는 대규모 에너지 저장 장치와 결합된 800MW의 태양광 발전을 위해 PG&E와 20년 전력 구매 계약을 체결했습니다.","so":"鉅亨網","tm":"11/18 02:31","c":1,"r":"tw","u":"https://news.cnyes.com/news/id/6665618","p":1794936665,"a":1794955478,"t":"Avantus與PG&E簽20年購電協議800MW太陽能搭配大型儲能","su":"Avantus는 800MW의 태양광 발전 및 대규모 에너지 저장을 위해 PG&E와 20년 전력 구매 계약을 체결했습니다. Uanalyze 2026년 11월 18일(Uanalyze/산업 데이터 센터 보고서) ⸺ Avantus는 캘리포니아주 Kern 카운티의 Buttonbush 1A 및 1B 프로젝트에서 총 800MW의 태양광 발전과 3,200MWh의 배터리 에너지 저장 장치를 제공하는 Pacific Gas & Electric(PG&E)과 20년 전력 구매 계약을 체결했다고 발표했습니다. 이 계약은 여전히 캘리포니아 공공사업위원회(CPUC)의 승인을 받아야 합니다. 두 프로젝트는 2027년 착공, 2029년 상업 이전이 예정돼 있다. 아반투스는 인프라 투자 규모를 약 30억 달러로 추산하고, 프로젝트 부지를 보유·운영할 계획이다. 에너지 저장 장비는 낮 동안 태양 에너지를 이동하여 저녁에 전력을 공급하고 다른 시간에는 캘리포니아 전력망의 요구 사항을 지원할 수 있습니다."},{"s":"스웨덴 에너지 대기업 Vattenfall은 독일의 배터리 및 재생 가능 자산 관리를 위해 Kraken을 선택했습니다.","so":"Data Center Dynamics","tm":"11/18 02:29","c":1,"r":"us","u":"https://www.datacenterdynamics.com/en/news/swedish-energy-giant-vattenfall-selects-kraken-to-manage-battery-and-renewable-assets-in-germany/","p":1794936558,"a":1794955473,"t":"Swedish energy giant Vattenfall selects Kraken to manage battery and renewable assets in Germany","su":"Vattenfall의 BESS(전기를 저장해 두는 큰 배터리) 및 재생 가능 자산 전반에 걸쳐 클라우드 기반 제어 계층을 제공합니다."},{"s":"Lite-On, 2027년 유럽 주권 ","c":1,"r":"jp","u":"https://news.google.com/rss/articles/CBMia0FVX3lxTFAtWEtncENQNHJ0dXgwYWczSlpxWlRoVmpja3kya2MzWW1sZlVQNER5TFNNNW8xT0VkNWlLc3ROR0h6ZmFja2ItR3duY2VVZlBsX2FyZ0ZRS3NfSkhBeUxuaHAwTWw3UGtIbzhN?oc=5","p":1794883560,"a":1794885858,"t":"大規模停電下で「水」はどう確保すべきか - 産業用蓄電池と大気製水技術の融合がもたらす、真のインフラ自立型防災への提言"},{"s":"다중 에너지 보완 레이아웃이 가속화되고 새로운 에너지 저장 장치가 시장화를 향해 나아가고 있습니다. \"15차 5개년 계획\" 녹색 및 저탄소 산업이 새로운 길을 열었습니다.","so":"中证网","tm":"11/17 10:52","c":1,"r":"cn","u":"https://www.cs.com.cn/esg/2026/11/17/detail_2026111710052641.html","p":1794880320,"a":1794885838,"t":"多能互补布局提速 新型储能迈向市场化——“十五五”绿色低碳产业开辟新赛道","su":"CSI 뉴스 센터는 거시 경제, 금융 시장, 비즈니스 역학, 상장(주식시장에 처음 들어오는 것) 회사, 투자 및 재무 관리 및 기타 포괄적인 정보를 다루는 실시간 전문 금융 및 증권 정보, 이벤트 보고서, 국제 및 국내 뉴스 하이라이트를 사용자에게 제공하기 위해 최선을 다하고 있습니다."},{"s":"Fujian: 전기화학적 에너지 저장 기술과 제조 장점을 통합하고 다양한 에너지 저장 기술을 확장합니다.","so":"Jiemian.com","tm":"11/17 09:57","c":1,"r":"cn","u":"https://www.jiemian.com/article/15339154.html","p":1794877033,"a":1794898858,"t":"福建：巩固电化学储能技术与制造优势，拓展多元化储能技术","su":"푸젠성 인민정부는 최근 '푸젠성 '15차 5개년 계획' 에너지 개발 계획을 발표했습니다. 에너지 분야의 핵심 기술을 육성 및 개발하기 위해 제안되었습니다. 3세대 원자력 기술을 최적화하고 4세대 원자력을 개발 및 실증하며 원자력의 포괄적 이용을 확대합니다. 고효율 해상 풍력 발전 장치, 새로운 기반, 유연한 DC 송전과 같은 기술에 대한 연구를 진행합니다. 신에너지의 정확한 예측, 대규모 전력망의 안전하고 안정적인 운영을 위한 적극적 지원, 전기화학적 에너지 저장 기술 및 제조 장점을 통합하고 다양한 에너지 저장 기술을 확대합니다. 해양 에너지 및 지열 에너지 발전 기술을 탐구하고 석탄 발전+탄소 포집, 활용 및 저장(BECCS) 등 탄소 배출 저감 기술을 마련하고 생태학적 흡수원 강화 기술을 탐구합니다."},{"s":"테스HD---축전지 EPC의 매출계상이 2Q 이후 본격화","so":"株探","tm":"11/17 09:39","c":1,"r":"jp","u":"https://s.kabutan.jp/news/n202611170477/","p":1794875980,"a":1794885865,"t":"テスＨＤ---蓄電池EPCの売上計上が2Q以降本格化へ 通期業績予想は据え置き、豊富なパイプラインの受注転換を目指す","su":"테스HD---축전지 EPC의 매출(물건을 판 돈 전체)계상이 2Q 이후 본격화에 통기 실적(회사가 번 돈 성적표) 예상은 거두고, 풍부한 파이프라인의 수주 전환을 목표로 한다 테스 홀딩스 <5074>는 11월 13일, 2027년 6월기 1분기(2026년 7월-9월). 매출액이 전년 동기 대비 6.6% 감소한 118.76억엔, 영업손실이 0.98억엔(전년 동기는 9.95억엔의 이익), 경상손실이 5.52억엔(동 5.77억엔의 이익), 모회사 주주에 귀속하는 분기 순손실이 5.65억엔(동 0.25억엔)."},{"s":"Stem과 Copec, 라틴 아메리카 전역의 에너지 저장 및 지능형 에너지 관리 발전을 위해 파트너십 확대 - 회사 발표 - FT.com","so":"Financial Times","tm":"11/17 06:12","c":1,"r":"world","u":"https://markets.ft.com/data/announce/detail?dockey=600-202611161612BIZWIRE_USPRX____20261116_BW847996-1","p":1794863520,"a":1794869041,"t":"Stem and Copec Expand Partnership to Advance Energy Storage and Intelligent Energy Management Across Latin America – Company Announcement - FT.com"},{"s":"로손 점포에서 재에너지, 32점에서 융통 축전지 사용 수급 조정","so":"日本経済新聞","tm":"11/17 05:00","c":1,"r":"jp","u":"https://www.nikkei.com/prime/gx/article/DGXZQOUC305FT0Q6A930C2000000","p":1794859200,"a":1794869039,"t":"ローソン店舗で再エネ、32店で融通 蓄電池使い需給調整","su":"로손이 설치하는 수직 양면 태양광 로손은 점포에 설치한 태양광 패널에서 발전한 재생 가능 에너지 유래의 전력을 점포를 넘어 융통하는 대처를 연도 내에도 시작한다. KDDI의 기술을 활용하여 송전량 등을 원격제어하여 잉여전력을 다른 점포에 융통한다. 32 점포의 전력을 일체적으로 관리함으로써 효율적으로 재에너지를 활용하고 이산화탄소(CO2) 배출량의 삭감과 함께 전력계통의 조정력으로 활용한다. 26 점포에 태양광 패널과 축전지를 설치 군마현 내의 32 점포에서 전력"},{"s":"충칭│중국 본토 최초의 완전 자동화 배터리급 리튬금속 공장 준공 - 양안","so":"工商時報","tm":"11/17 03:00","c":1,"r":"tw","u":"https://www.ctee.com.tw/news/20261117700034-430805","p":1794852000,"a":1794874155,"t":"重慶│陸首個全自動電池級金屬鋰工廠完工- 兩岸","su":"중국 본토 최초의 완전 자동화된 배터리급 리튬 금속 공장이 12일 충칭시 퉁량구에 공식적으로 완공되었습니다. 리튬 배터리 거대 기업인 Tianqi Lithium이 소유한 이 공장은 60kA의 고효율 및 에너지 절약형 금속 리튬 전기분해 장비를 구축했으며, 총 생산 능력을 연간 1,600톤으로 늘릴 것으로 예상됩니다. Tianqi Lithium은 전기 자동차, 전자 제품, 신에너지 저장 장치 등을 다루는 세계 최대의 리튬 배터리 생산 대기업 중 하나입니다. 조사 회사인 Farmonaut는 Tianqi Lithium의 글로벌 시장 점유율이 2026년 약 15.3%가 될 것으로 추정합니다."},{"s":"청두│광전자 기술이 우주를 공격하다! 중국 본토 산업 회의는 페로브스카이트와 새로운 에너지 저장에 중점을 둡니다.","so":"工商時報","tm":"11/17 03:00","c":1,"r":"tw","u":"https://www.ctee.com.tw/news/20261117700030-430805","p":1794852000,"a":1794869037,"t":"成都│光電技術搶攻太空！陸產業大會聚焦鈣鈦礦、新型儲能- 兩岸","su":"제9회 국제 광전자공학 및 에너지 저장 산업 컨퍼런스가 17일부터 20일까지 청두에서 우주 태양광 발전, 페로브스카이트, 신에너지 저장 등 첨단 기술을 중심으로 개최됩니다. 주최측은 올해 행사에는 유럽, 미국, 동남아시아, 중동 등 전 세계 80개 이상의 국가 및 지역에서 600명 이상의 해외 바이어가 참여할 것으로 예상하고, 본토 광스토리지 기업을 홍보해 해외 사업 기회를 확대할 것이라고 밝혔다."},{"s":"DoGo의 그리드포밍형 축전시스템(ESS)이 인도네시아 낙도의 2,000가구에 24시간 전력을 공급","so":"時事ドットコム","tm":"11/17 00:40","c":1,"r":"jp","u":"https://www.jiji.com/jc/article?k=rmkKOUkZ&g=prn","p":1794843600,"a":1794869040,"t":"DoGoのグリッドフォーミング型蓄電システム（ESS）が、インドネシアの離島の2,000世帯に24時間電力を供給","su":"자카르타, 인도네시아, 2026년 11월 16일 /PRNewswire/--DoGoPower의 스마트 그리드 포밍형 축전 시스템(ESS(전기를 저장해 두는 큰 배터리))과 에너지 관리 시스템(EMS)이 인도네시아 남부 해안의 낙도, 파게른간 케틸섬(P섬)에서 정식으로 가동을 시작했습니다. 1MW의 태양광 발전과 2MW/4MWh의 ESS에 의한 본 프로젝트는 오프 그리드의 지역사회에 안정적이고 신뢰성 높은 전력을 공급하고 동남아시아 전역의 섬도부에서 마이크로 그리드를 전개하기 위한 재현 가능한 모델이 됩니다."},{"s":"왜 \"5kWh의 전력\"이 발코니 에너지 저장 장치 C 위치에 있습니까?","so":"36氪出海","tm":"11/16 23:36","c":1,"r":"cn","u":"https://letschuhai.com/4c218db6","p":1794839804,"a":1794840871,"t":"“5度电”缘何坐上阳台储能C位？","su":"2년 전만 해도 발코니 에너지 저장 장치의 라벨은 여전히 \"1.6kWh의 전기, 손잡이 포함\"이었습니다. 2026년에는 트랙의 주 용량이 3배로 증가합니다. 첨단산업에너지저장연구소(GGII) 자료에 따르면 발코니 광스토리지는 2026년 성장률 100%를 넘어 올해 유럽에서 가장 뜨거운 트랙이 될 것으로 예상된다. 독일에서는 2026년 3월 현재 발코니 태양광 발전 누적 설치 수가 200만 대를 초과했으며, 1분기에 새로 설치된 그리드 수가 전년 대비 140% 증가했습니다. 네덜란드에서는 2분기에 37,600개 이상의 발코니 에너지 저장 배터리가 판매되어 전 분기보다 거의 두 배, 전년 동기 대비 47배 증가했습니다. 한 분기의 판매량이 지난 3년의 총 재고를 초과했습니다. 모든 용량 부문에서 5kWh의 전력(5kWh)은 “아무도 돌아다닐 수 없는” 수치가 되어가고 있습니다."},{"s":"드론 분야의 선두 기업은 에너지 저장 장치로 전환한 후에도 배터리를 계속 만들까요? DJI가 '배터리 회사'를 등록했습니다.","so":"ThePaper.cn","tm":"11/16 22:30","c":1,"r":"cn","u":"https://www.thepaper.cn/newsDetail_forward_34490432","p":1794835848,"a":1794838071,"t":"无人机龙头切入储能后还要造电芯？大疆注册了一家“电池公司”","su":"시장의 주목을 받은 일부 제품의 가격 인상 발표에 이어, 최근 드론 분야 선두주자인 DJI의 또 다른 행보가 리튬 배터리 업계에서 논의를 촉발시켰다. 산업 및 상업 정보에 따르면 Shenzhen DJI Yaowo New Energy Technology Co., Ltd.(이하 \"Yaowo New Energy\")는 일본에서 운영됩니다."},{"s":"삼성SDI, 2029년부터 3년만에 16GWh 에너지저장전지 미국 수주","so":"鉅亨網","tm":"11/16 22:30","c":1,"r":"tw","u":"https://news.cnyes.com/news/id/6664290","p":1794835833,"a":1794838074,"t":"三星SDI拿下美國16GWh儲能電池訂單2029年起分三年交貨","su":"삼성SDI가 2029년부터 3년 만에 미국에서 16GWh 에너지저장전지를 수주했다. 유애널라이즈(Uanalyze) 2026년 11월 16일(Uanalyze/산업데이터센터(컴퓨터 수만 대를 모아 둔 건물) 리포트) ⸺ 삼성SDI는 미국 에너지저장장치(전기를 저장해 두는 큰 배터리) 개발업체 주피터파워(Jupiter Power)와 16GWh급 리튬인산철(LFP) 배터리 공급계약을 체결했는데, 이는 2029년부터 2031년까지 납품 예정이다. 미국에서 개발된 Jupiter Power의 대규모 에너지 저장 프로젝트에 사용됩니다. 양 당사자가 체결한 이전 계약을 포함하여 Jupiter Power는 삼성SDI로부터 약 27GWh의 배터리 용량을 구매했습니다. 이번 주문은 미국 인디애나주에 위치한 삼성SDI 스타플러스 에너지 공장에서 생산될 예정이다. 이 공장은 최근 LFP 배터리 대량 생산을 시작했으며, 이번 주문으로 향후 몇 년간 공장 출하가 뒷받침될 것입니다."},{"s":"세계 최대의 납탄소 에너지 저장 발전소가 배터리 품질 소송에 연루됐고, SPIC 회사들은 1억 위안 이상의 배상금을 청구했습니다.","so":"ThePaper.cn","tm":"11/16 22:27","c":1,"r":"cn","u":"https://www.thepaper.cn/newsDetail_forward_34490396","p":1794835656,"a":1794838072,"t":"全球最大铅碳储能电站陷电池质量诉讼，国家电投旗下企业索赔超1亿元","su":"불과 3년 전에 가동을 시작한 세계 최대의 납탄소 에너지 저장 발전소에서 소송으로 인해 배터리 품질 문제가 제기되었습니다. Jingwei Co., Ltd.(301390.SZ)는 11월 13일 저녁 자사의 전체 지분(회사를 나눠 가진 몫)을 소유한 자회사 Hangzhou Hongsheng Electric Power Design Consulting Co., Ltd.(이하"},{"s":"COP31은 자금 문제에 중점을 둡니다. 향후 5년간 새로운 에너지 저장 솔루션 출시 | 탄소 중립 주간 보고서","so":"21财经","tm":"11/16 21:30","c":1,"r":"cn","u":"https://www.21jingji.com/article/20261116/herald/e198303f2eb48ae188bd2b8ebe707a4c.html","p":1794832200,"a":1794834730,"t":"COP31聚焦资金问题；未来五年新型储能方案印发｜碳中和周报","su":"21세기 비즈니스 헤럴드 기자 레이예(Lei Ye)와 리더상위(Li Deshangyu)가 베이징에서 보도했습니다. Carbon Neutral Weekly는 탄소 중립 정책, 지역 역학, 기업 관행 등을 포함한 \"이중 탄소\" 분야의 최신 최첨단 개발에 중점을 둡니다. 매주 탄소 중립 분야의 주요 이벤트를 선택하고 논평하여 시의적절하고 포괄적인 탄소 중립 정보 플랫폼을 구축할 것입니다. 1. 탄소 중립 정책 1. COP31이 진행되는 동안 글로벌 기후 거버넌스는 이행을 향해 나아가고 있습니다. 지난 11월 11일 터키 안탈리아에서 열린 제31차 유엔기후변화협약 당사국총회(COP31)가 실질적인 협의 단계에 돌입했다. 올해는 파리협정 이행을 위한 새로운 10년이 시작되는 해이며, 글로벌 기후 거버넌스는 약속에서 이행까지 중요한 전환점에 있습니다. 회의 의장국인 터키는 '대화, 합의, 행동'이라는 회의 슬로건을 제시하고, 다자간 협상 과정의 보완책으로 '전력화', '폐기물 제로' 등 자발적 행동 계획을 내놨다."},{"s":"Xitel, GE 버노바 및 SK On과 손잡고 AI 에너지 저장 공급망 구축","so":"DIGITIMES","tm":"11/16 19:51","c":1,"r":"tw","u":"https://www.digitimes.com.tw/tech/dt/n/shwnws.asp?id=0000774973_XQOL74UD63QJ5K47MIWB7&cf=A21","p":1794826260,"a":1794830445,"t":"熙特爾攜手GE Vernova、SK On 布局AI儲能供應鏈","su":"글로벌 AI 데이터센터(컴퓨터 수만 대를 모아 둔 건물) 구축이 가속화되면서 안정성이 높은 전력공급과 대규모 에너지 저장 인프라에 대한 수요가 급증하고 있으며, 초국적 에너지 공급망(부품·재료가 오가는 연결망) 재편이 업계의 화두가 되고 있다. 대만의 에너지 저장 시스템 통합업체인 자이텔(Xitel)이 미국의 주요 에너지 장비 제조사와 협력했다고 16일 밝혔다."},{"s":"SPIC는 설계연구소에 1억 청구서를 발행했고, 이제 에너지 저장 EPC의 연대책임과 여러 책임을 다시 계산해야 할 때다.","so":"36氪","tm":"11/16 18:35","c":1,"r":"cn","u":"https://m.36kr.com/p/4072626513811329","p":1794821700,"a":1794898859,"t":"国家电投开出1亿索赔单砸向设计院，储能EPC的连带责任该重新算账了"},{"s":"Kaizhi Green Energy 11/20 Dengxing 캐비닛, 태양광 EPC/에너지 저장/마이크로그리드 사업 기회 확보 - 뉴스","so":"MoneyDJ","tm":"11/16 16:54","c":1,"r":"tw","u":"https://www.moneydj.com/z/DJA/News/DJANewsDetail_39D80C3D-4EDE-4421-A806-83787344509E.djhtm","p":1794815640,"a":1794830446,"t":"凱智綠能11/20登興櫃搶太陽能EPC/儲能/微電網商機- 新聞","su":"MoneyDJ News 2026-11-16 15:54:13 게시자: Wan Huiwen 녹색 에너지 시스템 통합업체 Kaizhi Green Energy(7961)가 11월 20일에 시장에 상장(주식시장에 처음 들어오는 것)됩니다. 주요 사업은 태양광 발전 엔지니어링 턴키(EPC), 스마트 에너지 저장 및 에너지 관리 시스템을 포함합니다. Li Juncheng 회장(사진)은 최근 몇 년 동안 태양광 EPC 사업을 지속적으로 확장하는 것 외에도 스마트 마이크로그리드, AI 유지 관리 및 분산 에너지 애플리케이션을 적극적으로 배포했다고 말했습니다. 앞으로는 국내외 기업과의 협력을 확대해 운영 규모의 성장을 촉진할 예정이다. 하반기는 태양광 프로젝트 건설이 가속화되고 인지도가 가속화되는 시기이기 때문에 상반기와 하반기 수익 배분은 4:6으로 추산되며, 4분기에 집중될 것으로 보인다. 법인은 Kaizhi의 연간 주당 수익이 NT$7~8 정도라고 추정합니다."},{"s":"CESC2026 제4차 에너지저장 컨퍼런스가 닝샤에서 개최되었습니다. 학계 및 전문가들이 '15차 5개년 계획' 동안 에너지저장장치의 고품질 개발에 대해 논의했습니다.","so":"Jiemian.com","tm":"11/16 16:38","c":1,"r":"cn","u":"https://www.jiemian.com/article/15337079.html","p":1794814695,"a":1794830441,"t":"CESC2026 第四届储能大会在宁举行 院士专家共议“十五五”储能高质量发展","su":"11월 4일, CESC2026의 네 번째 에너지 저장 컨퍼런스가 난징 국제 엑스포 센터에서 열렸습니다. 약 600명이 참석했으며 남동대학교의 젊은 주임교수이자 박사 지도교수인 Zhu Zhi가 주최했습니다. 이번 컨퍼런스의 주제는 '기술적 혁신·생태적 시너지'였습니다. 정부 부처, 대학 과학 연구 기관, 기업, 산업 협회 및 금융 기관의 대표자들은 \"15차 5개년 계획\" 동안 에너지 저장 개발 경로에 대해 논의했습니다. 규모 확장에서 가치 창출로의 전환이 컨퍼런스 전체의 주요 주제가 되었습니다."},{"s":"벌써 2031년 ESS 물량도 확보한 삼성SDI..내년엔 전고체 배터리 승부 - 머니투데이","so":"머니투데이","tm":"11/16 15:50","c":1,"r":"kr","u":"https://www.mt.co.kr/industry/2026/11/16/2026111613174278091","p":1794811800,"a":1794812212,"su":"삼성SDI가 미국 주피터파워와 3조~4조원 규모의 ESS(에너지저장장치(전기를 저장해 두는 큰 배터리))용 LFP(리튬인산철) 배터리 공급 물량을 추가로 확보하면서 중장기 수주(일감 주문을 받는 것) 확대의 신호탄을 쐈다. 삼성SDI는 늘어나는 ESS 수요에 대응하기 위해 미국 현지 생산능력 확대에도 속도를 내고 있다."},{"s":"에너지저장장치 세계 1위 기업 BYD, 유럽 최초 배터리셀 공장 건설로 포르투갈 선택","so":"21财经","tm":"11/16 14:20","c":1,"r":"cn","u":"https://www.21jingji.com/article/20261116/herald/cbeaa9178eb78165f3431db94c10dfe3.html","p":1794806400,"a":1794807054,"t":"全球储能第一的比亚迪，把欧洲第一家电芯工厂选在了葡萄牙","su":"Foresight Energy는 최근 포르투갈 언론인 \"Expresso\"에서 BYD가 포르투갈 정부 및 포르투갈 무역 투자청과 투자하여 포르투갈에 배터리 공장을 건설하기 위해 협상하고 있다고 보도했습니다. 후보 부지는 포르투 인근 마토지뉴스(Matosinhos)에 있는 옛 갈프(Galp) 정유공장 부지로 약 240헥타르 규모다. 2021년에 폐쇄될 예정이며, 철거 및 토양 복원 작업은 2026년 말까지 완료될 예정이다. BYD는 아직 해당 프로젝트에 대한 공식 확인서를 발행하지 않았다. 포르투갈 경제부 장관은 회사 이름을 직접 밝히지는 않았지만 정부가 중국 자동차 회사와 '생산적인 대화'를 진행하고 있음을 확인했습니다. 이 소식의 무게는 BYD Energy Storage의 글로벌 시장 좌표계에 다시 포함되어야만 명확하게 볼 수 있습니다. 2025년에 BYD의 전 세계 에너지 저장 시스템 출하량은 60GWh를 초과하고 시장 점유율 13%로 테슬라를 제치고 세계 1위가 되며, 2023년부터 2024년까지 2년 연속 1위 자리를 차지하게 됩니다. BYD의 에너지 저장 제품은 110개 이상의 국가 및 지역을 포괄하며 650개 이상의 대규모 에너지 저장 프로젝트에 시스템을 제공했습니다. 하지만 유럽에는 BYD가 아직 배터리 셀 공장을 갖고 있지 않다."},{"s":"보도자료 : [도시바] 태양광 발전소에 축전지 병설 프로젝트를 초완공 (Digital PR Platform)","so":"毎日新聞","tm":"11/16 14:00","c":1,"r":"jp","u":"https://mainichi.jp/articles/20261116/pls/00m/020/287000c","p":1794805200,"a":1794806618,"t":"プレスリリース：［東芝］太陽光発電所への蓄電池併設プロジェクトを初完工（Digital PR Platform）","su":"2026-11-16 주식회사 도시바 태양광발전소에 축전지 병설 프로젝트를 첫 완공"},{"s":"당신을 중심으로 구성된 Keeper Family: Sungrow의 종합 C&I 에너지 저장 솔루션 소개","so":"The Straits Times","tm":"11/16 13:23","c":1,"r":"sg","u":"https://www.straitstimes.com/paid-press-releases/keeper-family-shaped-around-you-introducing-sungrows-comprehensive-ci-energy-storage-solutions-20261116","p":1794802980,"a":1794806453,"t":"Keeper Family, Shaped Around You: Introducing Sungrow's Comprehensive C&I Energy Storage Solutions","su":"허페이, 중국, 2026년 11월 16일 /PRNewswire/ -- 전 세계적으로 선도적인 PV 인버터 및 에너지 저장 시스템 공급업체인 Sungrow가 전체 mo 제품군을 출시했습니다."},{"s":"[한정 직격] 포지티브 부스트, 전고체 배터리 컨셉 재고 '20CM' 한계 업","so":"中证网","tm":"11/16 12:37","c":1,"r":"cn","u":"https://jnzstatic.cs.com.cn/zzb/htmlInfo/138337.html","p":1794800220,"a":1794885842,"t":"【涨停直击】利好提振，固态电池概念股“20CM” 涨停","su":"[리미트 직격] 포지티브 부스트, 전고체 배터리(액체 대신 고체를 넣은 안전한 배터리) 컨셉주 '20CM' 리미트 업 Wang Yin CSI Taurus 11월 16일 링파이 테크놀로지의 '20CM' 리미트 업으로 전고체 배터리 부문이 다시 상승했다. 최근 주가는 주당 27.83위안, 시가총액(회사 전체 몸값)은 47억8500만위안이다. 소식에 따르면, 국가발전개혁위원회와 국가에너지국은 최근 '신에너지저장 이행계획을 위한 15차 5개년 계획'을 발표했습니다. 단기적인 고주파 전력 에너지 저장 기술을 개발할 것을 제안한다. 플라이휠 에너지 저장, 고성능 베어링, 진공 고속 모터 등을 위한 저비용 및 고강도 소재를 개발하고 로터 방열 기술을 최적화합니다. 슈퍼커패시터용 고성능 재료 및 장치를 연구하고, 대용량 고비 전력 배터리 에너지 저장을 연구하고, 고비 전력 배터리 에너지 저장을 촉진하고, 슈퍼커패시터의 시범 적용을 촉진합니다. 고온 초전도 물질을 개발합니다."},{"s":"이 정책은 \"최첨단 기술 보유\"에 대한 분위기를 설정합니다! 전고체 배터리 개념 급부상, 파이테크놀로지 한계점","so":"21财经","tm":"11/16 12:30","c":1,"r":"cn","u":"https://www.21jingji.com/article/20261116/herald/a1ccdc793cb6d3bcaeeb979c2e117e3d.html","p":1794799859,"a":1794885846,"t":"政策定调“前沿技术储备”！固态电池概念异动拉升，领湃科技涨停","su":"16일 21파이낸셜레이더에 따르면 이번 세션 동안 전고체 배터리(액체 대신 고체를 넣은 안전한 배터리) 개념이 요동쳤다가 상승세를 보였다. Lingpai Technology(300530.SZ) 20cmlimit-up, Zizhu Hi-Tech(002058.SZ) Limit-up, Liwang Co., Ltd., 무한 블루 파워, Mengguli, Shanghai Xiba, Yiwei Lithium Energy 및 기타 주식이 뒤따랐습니다. 뉴스에 따르면 13일 국가에너지청 홈페이지에 따르면 국가발전개혁위원회와 국가에너지청은 '15차 5개년 신에너지저장 시행계획'(이하 '계획')을 발표했다. '계획'에는 2030년까지 신에너지저장장치(전기를 저장해 두는 큰 배터리)가 대규모 개발 단계에서 시장지향적 개발 단계로 전환될 것이라고 언급됐다. 국가 신에너지 저장장치 설치 용량은 3억kW에 달하고, 평균 에너지 저장 시간은 약 3시간이 될 전망이다."},{"s":"조업은 설탕 생산기계의 제조…전고체 전지용 총력, 츠키시마 HD의 기술력","so":"ニュースイッチ by 日刊工業新聞社","tm":"11/16 12:01","c":1,"r":"jp","u":"https://newswitch.jp/p/50814","p":1794798060,"a":1794806451,"t":"祖業は砂糖生産機械の製造…全固体電池向け総力、月島HDの技術力","su":"츠키시마 홀딩스(HD)의 사업 자회사인 츠키시마 기계(도쿄도 주오구)는 전고체 전지의 정극재에서 중요한 미세한 전구체 제작에 빼놓을 수 없는 장치를 다루고 있다. 2010년경부터 개발에 착수하는 등 대처의 숨은 길다..."},{"s":"'15차 5개년 계획' 신에너지저장 실시계획 발표, 신전력시스템 구축 강화, 전력ETF 보시(561700) 추적지수 상승","so":"Jiemian.com","tm":"11/16 11:53","c":1,"r":"cn","u":"https://www.jiemian.com/article/15335787.html","p":1794797613,"a":1794806447,"t":"“十五五”新型储能实施方案印发，新型电力系统建设力度加大，电力ETF博时(561700)跟踪指数上涨","su":"전력 ETF(여러 주식을 묶어 파는 상품) Boshi(561700)는 CSI 전력 유틸리티 지수를 추적하며 \"15차 5개년 계획\" 신규 에너지 저장 정책의 혜택을 받았습니다. 11월 16일 지수는 0.31% 상승했고, 구성종목은 전반적으로 상승했다."},{"s":"삼성SDI,  개발할 것을 제안하고 있다. 대용량, 넓은 온도 범위, 높은 안전성 및 간섭 방지 리튬/나트륨 이온 배터리(리튬 대신 소금 성분을 쓰는 배터리) 에너지 저장 시스템을 개발합니다. 고체-액체 하이브리드 배터리의 핵심 부품을 최적화하고 본질안전형 전고체 배터리(액체 대신 고체를 넣은 안전한 배터리) 기술을 연구합니다. 11월 12일 20시 59분, \"그녀가 아는 차이 리안\"은 중국(닝보) 배터리 신에너지 산업 국제 정상 포럼을 추적하여 2026년부터 2027년까지 전고체 배터리가 파일럿 및 소규모 배치 생산 기간에 들어갈 것으로 예상된다고 지적했습니다. Shangshui Intelligent를 언급하면 11월 16일 가격이 14.21% 급등했습니다."},{"s":"탄소 제로 커피 하우스부터 글로벌 에너지 저장 솔루션까지, Fujian Ningde는 탄소 제로 미래 도시를 건설하기 위해 협력하고 있습니다.","so":"中国新闻网","tm":"11/15 21:06","c":1,"r":"cn","u":"https://www.chinanews.com.cn/cj/2026/11-15/10732461.shtml","p":1794744376,"a":1794806844,"t":"从零碳咖啡屋到全球储能解决方案 福建宁德聚力打造零碳未来城","su":"从零碳咖啡屋到全球储能解决方案 福建宁德聚力打造零碳未来城 中新网宁德11月15日电 (吴允杰)漫步福建省宁德市，“零碳”早已从纸面理念落地为可感可触的日常场景：在搭载光伏储能建筑一体化技术的“宁时光·零碳空间”咖啡屋，市民晒着阳光享用下午茶；东湖之上，游客乘“东湖之星”“东湖之光”纯电动游船饱览湖光山色；赤鉴湖畔，形似游艇的全球首个eVTOL零碳水上机场科技感十足……山海之间，一个零碳未来城正在持续生长。 能源结构绿色转型，是“零碳宁德”的根基。在宁德福鼎市台山岛上，全国首个离网型兆瓦级海岛微电网项目建设正酣。该项目创新氢氨转换技术，实现零碳转化发电，与锂电池形成“短时调峰+长时保供”双储能体系，总装机容量1.505兆瓦，可脱离大陆电网独立运行。"},{"s":"테슬라 실적 발표 대본: 로봇 공학, 자율 주행 및 에너지 저장에 크게 투자하고 자본 지출이 계속 확대되고 있습니다.","so":"财联社","tm":"11/15 10:43","c":1,"r":"cn","u":"https://www.cls.cn/detail/2434633","p":1794707026,"a":1794727091,"t":"特斯拉财报会实录：大举押注机器人、自动驾驶与储能 资本开支持续扩张","su":"① 머스크는 실적발표에서 테슬라가 \"제2차 세계대전 이후 미국에서 가장 빠른 산업 규모 확장\"을 겪고 있다고 말하고, 올해 자본 지출이 250억 달러를 초과할 것으로 예상되며 향후 2~3년간 계속 증가할 것이라고 거듭 강조했다. ②테슬라 경영진은 휴머노이드(사람을 닮은 로봇) 로봇, 자율주행 택시, 에너지 저장장치, 자체 개발 칩 등 4대 주요 사업을 중심으로 자본 지출을 계속 늘릴 것이라고 밝히며 시장의 핵심 질문에 답했다. 차이롄서, 7월 23일(편집자 Liu Rui) 테슬라는 수요일 동부 표준시 시장 마감 후 2분기 재무 결과를 발표했습니다. 차량 납품 및 에너지저장장치(전기를 저장해 두는 큰 배터리) 설치 데이터는 인상적이었지만 분기 매출총이익률 하락과 생산 확대에 대한 높은 투자로 시장 우려가 컸고, 장 마감 후 주가가 하락했다. 머스크 테슬라 최고경영자(CEO)는 실적 보고서 발표 후 컨퍼런스콜에서 “테슬라는 제2차 세계대전 이후 미국에서 가장 빠른 산업 규모 확장을 겪고 있다”며 “올해 자본 지출이 250억 달러를 넘어설 것으로 예상되며 향후 2~3년간 계속해서 성장할 것”이라고 거듭 강조했다."}]},{"name":"🏭 AI 전력","note":"보유: ACE 코리아AI전력TOP10","breaking":false,"items":[{"s":"효성중공업, SK텔레콤과 AI 데이터센터 전력 인프라 구축 맞손","so":"아시아경제","tm":"11/16 11:07","c":25,"r":"kr","u":"https://www.asiae.co.kr/article/20261116110720 t times for data center power"},{"s":"Lite-On은 AI 파워, Netcom, Edge AI 및 엔비디아 MGX 아키텍처에 초점을 맞춘 electronica 2026에 참여합니다.","so":"鉅亨網","tm":"11/16 12:11","c":2,"r":"tw","u":"https://news.cnyes.com/news/id/6663547","p":1794798692,"a":1794806462,"t":"光寶科參與electronica 2026電子展 聚焦AI電力、網通、Edge AI與輝達MGX架構","su":"Lite-On은 AIDC 파워와 Edge AI에 초점을 맞춰 electronica 2026에 등장할 예정입니다.\n110kW, 72kW Power Shelf, 800VDC 아키텍처 등 AI 전력 솔루션을 전시했습니다.\n또한 지상 스마트 애플리케이션을 강화하기 위해 엔터프라이즈 및 엣지 전력, 5G, O-RAN, FWA, AI 카메라 및 AI Box를 홍보합니다."},{"s":"LS일렉트릭, 美 빅테크에 AI 전력설비 공급…1300억 추가 수주 - 머니투데이","so":"머니투데이","tm":"11/16 09:38","c":2,"r":"kr","u":"https://www.mt.co.kr/industry/2026/11/16/2026111609124644288","p":1794789537,"a":1794792480,"su":"LS ELECTRIC(일렉트릭)이 미국 글로벌 빅테크 기업의 하이퍼스케일 AI(인공지능) 데이터센터(컴퓨터 수만 대를 모아 둔 건물) 전력 인프라 사업을 추가 수주(일감 주문을 받는 것)했다. 해당 빅테크 고객이 현지에서 추진 중인 대형 데이터센터 프로젝트 초기 단계부터 참여한 이후 확장 사업까지 고압 배전반 물량을 확보했다."},{"s":"미국 양당이 도입한 강세 법안에 편승해 전력 및 에너지 ETF는 자금 전망을 갖고 있습니다.","so":"UDN","tm":"11/16 04:51","c":2,"r":"tw","u":"https://udn.com/news/amp/story/123006/9880423","p":1794772294,"a":1794784880,"t":"搭上美國兩黨合推法案利多 電力能源ETF有錢景","su":"미국 상원이 중간선거 이후 미국 최초의 주요 합동 입법 조치인 초당적 미국 일자리 창출법(BAAJA) 발의안을 통과시켰습니다. 주요 목적은 발전소, 천연가스 파이프라인, 송전선 및 기타 에너지 건설의 검토 프로세스를 단순화하고 가속화하기 위한 준비를 하는 것입니다."},{"s":"Big US Grid는 데이터 센터 연결 속도를 높이기 위해 정밀 검사를 제안합니다.","so":"Bloomberg.com","tm":"11/18 04:11","c":1,"r":"us","u":"https://www.bloomberg.com/news/articles/2026-11-17/pjm-proposes-grid-overhaul-to-speed-up-data-center-connections","p":1794942716,"a":1794955487,"t":"Big US Grid Proposes Overhaul to Speed Data Center Hook Ups"},{"s":"Vertiv의 빅 AI 데이터 센터 성능 혁신으로 현재 재고를 절약할 수 없는 이유","so":"Barron's","tm":"11/18 03:08","c":1,"r":"us","u":"https://www.barrons.com/articles/vertiv-new-power-system-ai-data-center-stock-ca8a28c7","p":1794938880,"a":1794955488,"t":"Why Vertiv’s Big AI Data Center Power Breakthrough Couldn’t Save the Stock Today"},{"s":"미국 전력회사의 신속한 소형 원자로 승인은 개발자에게 교훈을 제공합니다","so":"Reuters","tm":"11/18 01:45","c":1,"r":"us","u":"https://www.reuters.com/business/energy/rapid-small-reactor-approval-by-us-utility-offers-lessons-developers--reeii-2026-11-17/","p":1794933936,"a":1794957026,"t":"Rapid small reactor approval by US utility offers lessons for developers"},{"s":"영국 서식스(Sussex)에 100MW 데이터 센터 계획","so":"Data Center Dynamics","tm":"11/18 01:25","c":1,"r":"us","u":"https://www.datacenterdynamics.com/en/news/100mw-data-center-planned-in-sussex-uk/","p":1794932741,"a":1794955488,"t":"100MW data center planned in Sussex, UK","su":"한 개발자가 영국 브라이튼 외곽에 100MW 규모의 데이터 센터를 계획하고 있습니다. 한편, 영국에 본사를 둔 재생 에너지 개발자는 Bedfordshire에 4개 건물 캠퍼스를 계획하고 있습니다. Sussex Meridian One에 예정된 100MW 프로젝트는 Hickstead의 Northlands Enterprise Park에 있는 단계별 데이터 센터 캠퍼스에 대한 제안입니다."},{"s":"Giga Energy는 클라우드 제공업체와 10억 달러 규모의 텍사스 AI 데이터 센터 임대 계약을 체결했습니다.","so":"Reuters","tm":"11/17 23:08","c":1,"r":"us","u":"https://www.reuters.com/business/energy/giga-energy-signs-1-billion-lease-texas-ai-data-center-with-cloud-provider-2026-11-17/","p":1794924489,"a":1794955488,"t":"Giga Energy signs $1 billion lease for Texas AI data center with cloud provider"},{"s":"전력망 건설에 대한 수요가 공개되고 해외 시장 확장이 가속화되며 상하이 전력 장비 회사의 운영 및 개발에 많은 하이라이트가 있습니다.","so":"第一财经","tm":"11/17 22:10","c":1,"r":"cn","u":"https://www.yicai.com/news/103444147.html","p":1794921054,"a":1794921321,"t":"电网建设需求释放 海外市场拓展提速 沪市电力设备企业经营发展亮点纷呈","su":"올해 초부터 새로운 전력 시스템 건설의 심층적인 발전, 중국 국내 전력망 투자의 지속적인 발전, 글로벌 에너지 인프라 업그레이드로 인해 상하이 증권거래소에 상장(주식시장에 처음 들어오는 것)된 전력 장비 회사는 적극적으로 산업 발전 기회를 포착하고 송전 및 변전 장비, 스마트 그리드, 저탄소 에너지 및 전력 전자 분야에서 지속적으로 노력을 심화해 왔습니다. 산업 체인의 여러 선두 기업의 영업 실적(회사가 번 돈 성적표)은 꾸준히 성장했으며 일부 기업의 이익 성장률은 더욱 향상되었습니다. 동시에 해외 주문이 지속적으로 확대되고 핵심 기술 혁신의 변화가 가속화되고 있습니다. 전력 장비 회사는 중국 국내외 시장의 조화로운 발전과 전통적 우세 기업과 신흥 기업의 공동 성장이라는 긍정적인 추세를 보여줍니다. 전력망 투자는 지속적으로 발전하고 있으며 산업 체인 기업의 운영 품질과 효율성은 꾸준히 향상되었습니다. 중국의 국내 UHV 프로젝트 건설, 주요 배전망 업그레이드 및 새로운 전력 시스템 투자가 계속해서 발전하여 송전 및 변전 장비, 스마트 그리드 및 지원 산업을 위한 시장 공간을 제공하고 있습니다. 상하이 증권 거래소에 상장된 전력 장비 회사는 기술 축적과 산업 체인의 이점을 활용하여 시장 기회를 적극적으로 포착했으며 운영 성과의 하이라이트가 계속해서 등장했습니다."},{"s":"최대 전력 소비를 피함으로써 데이터 센터가 1년에 얼마나 많은 전기를 절약할 수 있습니까? 미국 전력망 비용 공유 논란 촉발","so":"鉅亨網","tm":"11/17 22:00","c":1,"r":"tw","u":"https://news.cnyes.com/news/id/6665447","p":1794920418,"a":1794927746,"t":"資料中心避開尖峰用電，一年可省多少電費？美國電網成本分攤引發爭議","su":"최대 전력 소비를 피함으로써 데이터 센터가 1년에 얼마나 많은 전기를 절약할 수 있습니까? 미국 전력망 비용 공유로 논란 촉발 Uanalyze 2026년 11월 17일(Uanalyze/산업 데이터 센터 보고서) ⸺ 미국의 일부 데이터 센터와 대규모 전력 사용자는 전력 수요가 가장 높은 기간 동안 전기 요금의 용량 또는 전송 비용을 줄이기 위해 전력 소비를 줄일 것입니다. 이 관행을 '피크 클리핑'이라고 하며 현행 규칙과 일치하지만 논란을 촉발하기도 합니다. 대규모 사용자의 과소 지불을 다른 사용자가 부담하게 될까요? 텍사스를 예로 들면, 일부 대규모 사용자의 연중 전송 요금은 여름철 4개월 동안 매회 최대 전력 소비량 15분을 기준으로 계산됩니다. 기업이 이 4개 기간 동안 전력 소비를 줄일 수 있다면 일년 내내 전송 요금을 줄일 수 있습니다."},{"s":"멕시코, 에너지 위기로 인해 AI 데이터 센터 붐을 놓칠 위험","so":"Bloomberg.com","tm":"11/17 22:00","c":1,"r":"us","u":"https://www.bloomberg.com/news/features/2026-11-17/mexico-is-missing-out-on-ai-data-center-boom-as-energy-crunch-bites","p":1794920406,"a":1794955488,"t":"Mexico Risks Missing Out on AI Data Center Boom as Energy Crunch Bites"},{"s":"X-Energy CEO J. Clay 역사적인 원자력 승인, 아마존 및 AI 전력 수요에 대해 매도","so":"CNBC","tm":"11/17 21:30","c":1,"r":"us","u":"https://news.google.com/rss/articles/CBMiwAFBVV95cUxOS2k2S2FGWFBPcUU3NzVfSGpjNWlSUFZXejFjN1lIMGlZMDdYX2h4TkR0WG9PRmJrTGNUUkI5SjJJSVBRaGE5V0ZpaXN0ZV9EMHJlQWJnTEVFMTZhd2FlVzZaeXQ3Z18wQ1VPLWNJMmF3UU5fWDRDR0pWUzBxeXdacTJVb3NQWmN6VU9JOW9IdDZCenBCdEFzVmlqTVdsNnFocGxibmxqcDFTbUhvYWxwenVGMm9LT05KNlc2a1FoVUo?oc=5","p":1794918601,"a":1794921319,"t":"X-Energy CEO J. Clay Sell on historic nuclear approval, Amazon and AI power demand"},{"s":"FOCUS 글로벌 뉴스/우크라이나 전력망에 불이 붙었습니다! 아일랜드 공장이 미사일 원자재를 러시아로 수송하다 적발됐다.","so":"TVBS新聞網","tm":"11/17 21:00","c":1,"r":"tw","u":"https://news.tvbs.com.tw/world/4051910","p":1794916800,"a":1794916997,"t":"FOCUS全球新聞／烏克蘭電網狂挨轟！愛爾蘭廠卻遭揭運飛彈原料入俄","su":"겨울이 다가오자 러시아는 우크라이나 발전소를 향해 대규모 미사일을 발사해 나라 절반에 정전을 일으켰다. 수도 키예프의 많은 가족들은 러시아 미사일이 곧 고갈되기를 바라며 어둠과 추위 속에서 생존을 위해 고군분투하고 있습니다. 그러나 외신들은 EU 회원국인 아일랜드에 있는 러시아 소유의 정유공장이 여전히 제재를 회피하며 미사일 제조에 사용될 수 있는 핵심 원자재(물건의 재료(석유·구리 등))를 러시아에 계속 공급하고 있다고 보도했다."},{"s":"DCD 강연: UL Solutions의 Ken Boyce와 함께하는 AI 시대의 데이터 센터 안전","so":"Data Center Dynamics","tm":"11/17 19:44","c":1,"r":"world","u":"https://www.datacenterdynamics.com/en/video-interviews/talks/dcd-talks-data-center-safety-in-the-age-of-ai-with-ken-boyce-ul-solutions/","p":1794912248,"a":1794917004,"t":"DCD Talks: Data center safety in the age of AI with Ken Boyce, UL Solutions","su":"DatacenterDynamics는 세계 최대의 데이터 센터 간행물입니다. 우리는 하이퍼스케일 및 클라우드, 코로케이션 및 도매, 생성 인공 지능(AI), 반도체(전자기기의 두뇌 부품), 엣지 컴퓨팅, 투자 및 REIT, 데이터 센터 회사 등에 대한 뉴스, 잡지 특집, 팟캐스트를 게시합니다. 또한 방송, 컨퍼런스, 시상식 및 기타 라이브 이벤트도 제공됩니다. 엔비디아, 구글, AWS, 코어위브의 이야기를 들어보세요."},{"s":"알리바바, 글로벌 확장 가속화하고 내년에 9개의 새로운 데이터 센터 구축 예정","so":"工商時報","tm":"11/17 19:21","c":1,"r":"tw","u":"https://www.ctee.com.tw/news/20261117701864-430804","p":1794910860,"a":1794916999,"t":"阿里雲加速全球擴張未來一年新建9座資料中心- 兩岸","su":"알리바바 자회사 알리바바 클라우드가 지난 17일 홍콩에서 연례 서밋을 열고 앞으로 12개월 안에 홍콩, 말레이시아, 터키, 브라질, 유럽 등 9개 시장에 신규 데이터센터(컴퓨터 수만 대를 모아 둔 건물)를 구축하겠다고 밝혔다. 공사 기간을 100일로 단축하고, 각 캐비닛의 컴퓨팅 성능 밀도를 5~10배 높이는 것이 목표다. 알리바바 클라우드는 향후 5년간 관련 투자가 이전에 발표한 3,800억 위안을 훨씬 초과해 글로벌 인공지능(AI) 인프라 레이아웃을 지속적으로 확장할 것이라고 밝혔습니다."},{"s":"[빅뱅크 오피니언] 美 데이터센터, 건설산업 지원 위해 지출 90% 급증, 알리안츠 트레이드, 확장 방해할 3가지 주요 결점 밝혀","so":"香港經濟日報HKET","tm":"11/17 18:01","c":1,"r":"hk","u":"https://inews.hket.com/article/4226488/%E3%80%90%E5%A4%A7%E8%A1%8C%E7%9C%8B%E6%B3%95%E3%80%91%E7%BE%8E%E5%9C%8B%E6%95%B8%E6%93%9A%E4%B8%AD%E5%BF%83%E9%96%8B%E6%94%AF%E9%A3%8790-%E6%92%90%E8%B5%B7%E5%BB%BA%E9%80%A0%E6%A5%AD%E3%80%80%E5%AE%89%E8%81%AF%E8%B2%BF%E6%98%93%E6%8F%AD3%E5%A4%A7%E7%A1%AC%E5%82%B7%E6%81%90%E7%AA%92%E7%A4%99%E6%93%B4%E5%BC%B5","p":1794906078,"a":1794917002,"t":"【大行看法】美國數據中心開支飇90%撐起建造業 安聯貿易揭3大硬傷恐窒礙擴張"},{"s":"발전소 넘어 미사일까지...두산에너빌리티, 신성장 동력 방산 엔진 정조준","so":"아주경제","tm":"11/17 18:00","c":1,"r":"kr","u":"https://www.ajunews.com/amp/20261117135634072","p":1794906000,"a":1794916992,"su":"두산에너빌리티가 원전과 발전용 가스터빈에 이어 방산 엔진으로 사업 영역을 넓히고 있다. 발전설비 개발 과정에서 확보한 설계·소재·제조 기..."},{"s":"AI 전력 수요를 충족하는 데 중요한 그리드 활용","so":"ET Datacenters","tm":"11/17 16:37","c":1,"r":"us","u":"https://datacenters.economictimes.indiatimes.com/news/energy-cooling-sustainability/grid-utilisation-crucial-for-meeting-ai-electricity-demand/135909015","p":1794901060,"a":1794916993,"t":"Grid utilisation crucial for meeting AI electricity demand","su":"대부분의 에너지 산업 의사결정자들은 인공지능(AI)으로 인한 전력 수요가 현재 예측을 초과할 것으로 예상하고 있습니다. 향상된 활용도와 유연한 상호 연결을 통해 기존 그리드 인프라를 최적화하는 것은 새로운 라인을 구축하는 것보다 더 빠르게 이러한 수요를 충족하는 데 중요합니다. 이 접근 방식은 데이터 센터 전력 전략에 영향을 미칩니다."},{"s":"기업 공개(IPO) 계획에 데이터 센터 전력 장치를 추가하는 것을 고려 중이라고 구상","so":"Bloomberg.com","tm":"11/17 16:00","c":1,"r":"us","u":"https://www.bloomberg.com/news/articles/2026-11-17/envision-said-to-consider-adding-data-center-power-to-ipo-plan","p":1794898800,"a":1794916995,"t":"Envision Said to Weigh Adding Data Center Power Unit to IPO Plan"},{"s":"[리포트 브리핑]두산에너빌리티, '수주로 구체화되는 중장기 성장' 목표가 85,000원 - 상상인증권","so":"뉴스핌","tm":"11/17 15:03","c":1,"r":"kr","u":"https://www.newspim.com/news/view/20261117001012","p":1794895380,"a":1794898930,"su":"[서울=뉴스핌] 로보뉴스 = 상상인증권에서 17일 두산에너빌리티(034020)에 대해 '수주(일감 주문을 받는 것)로 구체화되는 중장기 성장'라며 투자의견 'BUY(신규)'의 신규 리포트를 발행하였고, 목표가 85,000원을 내놓았다. 전일 종가 기준으로 볼 때, 이 종목의 주가는 목표가 대비 89.3%의 추가 상승여력이 있다는 해석이 가능하다. ◆ 두산에너빌리티 리포트 주요내용 상상인증권에서 두산에너빌리티(034020)에 대해 '최근 체고 원전 시공계약 불확실성과 SMR 사업 지연 우려로 동사의 주가가 조정되었으나, 중장기 이익 성장성을 감안하면 매수 관접 접근은 유효할 전망이다."},{"s":"중국 최초의 해양 고전력 무접점 변압기, 성공적으로 생산 라인 출시","so":"上海新闻","tm":"11/17 13:41","c":1,"r":"cn","u":"https://www.sh.chinanews.com.cn/kjjy/2026-11-17/151279.shtml","p":1794890460,"a":1794927745,"t":"中国首台船用大功率固态变压器成功下线","su":"중국 뉴스 네트워크(China News Network)는 잘 알려진 중국 뉴스 포털이자 글로벌 인터넷에서 중국 뉴스 정보를 제공하는 가장 중요한 원본 콘텐츠 제공업체 중 하나입니다. 중국뉴스서비스의 글로벌 편집 네트워크를 바탕으로 네티즌과 온라인 매체에 문자, 사진, 동영상 등 다양한 정보 서비스를 24시간 빠르고 정확하게 제공하고 있습니다. 뉴스 보도 측면에서 중국 뉴스 서비스의 역동적인 뉴스는 시의적절하고 정확하며 설명 보도 각도는 독특합니다. 해당 기사는 중국 국내외 온라인 매체를 통해 널리 복제됐다."},{"s":"삼성전자, 유럽 전력기기 회사 임원 영입…HVAC으로 가전 부진 돌파 ‘승부수’","so":"헤럴드경제","tm":"11/17 성장 모멘텀(값이 움직이는 기세)은 줄어들지 않고 계속됩니다. 7월 말 현재 국가 지능형 컴퓨팅의 총 규모는 245만 PFLOPS에 도달했습니다. 컴퓨팅 파워의 급증으로 인한 피할 수 없는 결과는 컴퓨팅 파워 센터의 전력 소비가 급격히 증가한다는 것입니다. 국가에너지청(National Energy Administration)의 관련 데이터에 따르면 전국 컴퓨팅 파워 센터의 총 전력 소비량은 2025년에 1,700억 킬로와트시에 도달하여 사회 총 전력 소비량의 1.6%를 차지할 것으로 예상됩니다. 2030년까지 컴퓨팅 파워 센터의 전력 소비 규모는 8000억 킬로와트를 초과할 것으로 예상됩니다."},{"s":"효성중공업, 영등포 문래동3가 '해링턴 플레이스 문래' 20일 견본주택 개관","so":"뉴스핌","tm":"11/17 10:35","c":1,"r":"kr","u":"https://www.newspim.com/news/view/20261117000478","p":1794879300,"a":1794885899,"su":"[서울=뉴스핌] 오경진 기자 = 효성중공업이 서울특별시 영등포구 문래동3가 일원에 시공하는 공동주택 단지 &apos;해링턴 플레이스 문래&apos;가 오는 20일 견본주택을 개관하고 일반분양 공고에 따른 입주자 모집 절차를 진행한다.[사진=해링턴 플레이스 문래"},{"s":"글로벌 원전기업 경남 집결…SMR 국제 콘퍼런스 개막","so":"연합뉴스","tm":"11/17 10:15","c":1,"r":"kr","u":"https://www.yna.co.kr/view/AKR20261117029000052","p":1794878100,"a":1794885899,"su":"(창원=연합뉴스) 이정훈 기자 = 글로벌 소형모듈원자로(SMR) 기업들이 원자력산업 중심지 경남에 대거 모였다."},{"s":"월스트리트가 데이터 센터를 철수하고 전력 주식에 관한 약 6,400개의 문서에서 자본 개편이 드러났습니다 - 국제","so":"工商時報","tm":"11/17 10:01","c":1,"r":"tw","u":"https://www.ctee.com.tw/news/20261117700616-430702","p":1794877260,"a":1794885919,"t":"華爾街大舉撤出資料中心、電力股近6400份文件揭資金大洗牌- 國際","su":"인공지능(AI) 인프라에 대한 투자는 계속 확대되고 있지만 월스트리트 기관의 자본 배치는 조용히 바뀌었습니다. 미국 규제 문서에 따르면 3분기 들어 데이터센터(컴퓨터 수만 대를 모아 둔 건물) 관련 주식에 대한 기관투자자들의 열의가 식었다. 보유 종목을 완전히 매진한 펀드의 수가 신규 진입자 수를 넘어섰습니다. 특히, 공공 유틸리티 및 전력 관련 주식이 상당한 매각을 겪었습니다. 하지만 여전히 기관펀드가 반도체(전자기기의 두뇌 부품)와 AI 컨셉주를 선호하는 모습은 투자자들이 AI 산업에 전반적으로 약세를 보이지 않고 재투자에 나섰다는 점을 보여준다."},{"s":"가장 큰 데이터 센터가 미국 전력 사용량의 약 2%를 차지한다는 연구 결과가 나왔습니다.","so":"The Washington Post","tm":"11/17 09:00","c":1,"r":"us","u":"https://www.washingtonpost.com/technology/2026/11/16/data-centers-take-up-almost-2-percent-us-electricity-use-study-shows/","p":1794873600,"a":1794955489,"t":"Largest data centers take up about 2 percent of U.S. electricity use, study says"},{"s":"전력기기/풍력 (Positive)","so":"한국경제","tm":"11/17 08:52","c":1,"r":"kr","u":"https://www.hankyung.com/koreamarket/consensus/pdf/2026-11-744e70f05dd9b2874e2e9cafc3e33b5b","p":1794873130,"a":1794874181},{"s":"HSBC, 3억 달러 부실 데이터센터 대출 할인 판매","so":"Bloomberg.com","tm":"11/17 07:01","c":1,"r":"us","u":"https://www.bloomberg.com/news/articles/2026-11-16/hsbc-sold-300-million-troubled-data-center-loan-at-discount","p":1794866487,"a":1794869078,"t":"HSBC Sold $300 Million Troubled Data Center Loan at Discount"},{"s":"타이파워: AI 데이터센터 전용 구역 계획해야","so":"自由時報","tm":"11/17 06:30","c":1,"r":"tw","u":"https://news.ltn.com.tw/news/life/paper/1778766","p":1794864600,"a":1794869083,"t":"台電：AI資料中心應規劃專區","su":"AI 산업은 우리나라의 경제 발전을 주도하고 있으며 대만도 전력 문제에 직면해 있습니다. 특히, 다량의 전력을 소비하는 AI 데이터센터(컴퓨터 수만 대를 모아 둔 건물) 구축으로 인해 타이파워는 향후 전국 전력 소비량이 연간 2%씩 증가할 것으로 추정하고 있다. 5~4%에 달하는 Taipower 부사장 Zheng Qinghong은 AI 데이터 센터에 필요한 것은 마이크로그리드이며 자체 전원 공급 장치와 에너지 저장 장치도 제공해야 하며 컴퓨팅 성능도 보다 적절하게 관리해야 한다고 말했습니다. 최근 유럽과 미국에서도 AI 데이터센터 구축에 반발이 시작됐다. 이는 주로 지역 전기 가격 때문입니다. AI 데이터센터의 높은 전력 소비로 인해 지역 전력 가격이 상승했다. 국민들의 상대적 박탈감은 높아졌고, AI 데이터센터 구축에 대한 불만도 높아졌다."},{"s":"Macquarie, Capex Super Cycle 속에서 데이터 센터의 활기를 경고","so":"Bloomberg.com","tm":"11/17 04:00","c":1,"r":"us","u":"https://www.bloomberg.com/news/articles/2026-11-16/macquarie-warns-of-data-center-exuberance-amid-capex-super-cycle","p":1794855600,"a":1794874182,"t":"Macquarie Warns of Data Center Exuberance Amid Capex Super Cycle"},{"s":"가장 빠른 새로운 용량은 이미 보유하고 있는 그리드입니다","so":"POWER Magazine","tm":"11/17 03:20","c":1,"r":"us","u":"https://www.powermag.com/the-fastest-new-capacity-is-the-grid-you-already-have/","p":1794853216,"a":1794869079,"t":"The Fastest New Capacity Is the Grid You Already Have","su":"그리드 활용 규칙, 유연한 상호 연결 및 고급 전송 기술은 새로운 라인을 구축하는 것보다 더 빠르게 유휴 용량을 확보할 수 있습니다."},{"s":"일본 유틸리티, PJM을 지원하는 버지니아 BESS 프로젝트 지분 인수","so":"POWER Magazine","tm":"11/17 01:51","c":1,"r":"us","u":"https://www.powermag.com/japanese-utility-takes-stake-in-virginia-bess-project-serving-pjm/","p":1794847905,"a":1794869081,"t":"Japanese Utility Takes Stake in Virginia BESS Project Serving PJM","su":"일본 오사카에 본사를 둔 간사이 전력(Kansai Electric Power)은 150MW/600MWh 배터리 에너지 저장 장치인 Prospect Power Storage의 소수 지분(회사를 나눠 가진 몫)을 인수했습니다."},{"s":"기본 부하를 넘어서: 유연한 가스 생성이 재생 가능 전력망의 중추가 되는 이유","so":"POWER Magazine","tm":"11/17 00:24","c":1,"r":"us","u":"https://www.powermag.com/webinars/beyond-baseload-why-flexible-gas-generation-is-becoming-the-backbone-of-the-renewable-grid/","p":1794842687,"a":1794869082,"t":"Beyond Baseload: Why Flexible Gas Generation Is Becoming the Backbone of the Renewable Grid"},{"s":"독점: 올 겨울 우크라이나의 원자력 사고 위험이 증가한다고 원자력 안전 규제 기관이 밝혔습니다.","so":"Reuters","tm":"11/16 23:08","c":1,"r":"us","u":"https://www.reuters.com/business/energy/risk-nuclear-accident-ukraine-increasing-this-winter-atomic-safety-regulators-2026-11-16/","p":1794838085,"a":1794885902,"t":"EXCLUSIVE: Risk of nuclear accident in Ukraine increasing this winter, atomic safety regulators say"},{"s":"중동 AI 데이터센터, 전력 공급 병목 현상에 직면하다! 변압기 배송에 최대 4년이 소요되어 사우디아라비아가 2030년 재생 에너지 목표를 달성하기가 어렵습니다.","so":"鉅亨網","tm":"11/16 22:00","c":1,"r":"tw","u":"https://news.cnyes.com/news/id/6664275","p":1794834011,"a":1794834739,"t":"中東AI資料中心搶電遇瓶頸！變壓器交期長達4年沙國2030年再生能源目標恐難達成","su":"중동 AI 데이터센터(컴퓨터 수만 대를 모아 둔 건물), 전력 공급 병목 현상에 직면하다! 변압기 납품 기간은 최장 4년으로, 사우디아라비아의 2030년 재생에너지 목표는 달성하기 어려울 수 있다. 유애널라이즈 2026년 11월 16일 (유애널라이즈/산업데이터센터 보고서) ⸺ 중동 국가들이 AI 데이터센터와 신재생에너지에 대한 투자를 가속화하고 있지만, 전력기기 납품 시간이 건설 병목 현상이 되고 있다. 연구기관인 글로벌인피니티랩스는 사우디아라비아의 초고압 변압기 납품 기간이 최대 3~4년이라고 지적했다. 발전소 자금이 마련되더라도 장비가 예정대로 배송되지 않을 수 있으며, 이로 인해 새로운 전력이 그리드에 연결되는 시간이 느려질 수 있습니다. 사우디아라비아는 2030년 재생에너지 설비용량을 130GW로 늘릴 계획이지만, 2025년 말 기준 실제 가동용량은 12.3GW에 불과해 목표에 비해 117.7GW가 부족하다. 예정대로 목표를 달성하려면 향후 5년 동안 매년 평균 23.5GW를 추가해야 하는데, 이는 현재 건설 속도보다 훨씬 높은 수준이다."},{"s":"블랙스톤 REIT, 50억 달러 규모의 거래로 아마존 데이터 센터 구매","so":"Bloomberg.com","tm":"11/16 20:53","c":1,"r":"us","u":"https://www.bloomberg.com/news/articles/2026-11-16/blackstone-reit-to-buy-amazon-data-centers-in-5-billion-deal","p":1794830037,"a":1794834737,"t":"Blackstone REIT to Buy Amazon Data Centers in $5 Billion Deal"},{"s":"태국 푸켓의 유명 관광지에서 치명적인 화재가 발생해 수십명이 숨졌고, 오토바이 바닥에 있던 변압기가 폭발한 것으로 추정된다(키티양 제보)","so":"Now 新聞","tm":"11/16 20:20","c":1,"r":"hk","u":"https://news.now.com/home/international/player?newsId=669785&home=1","p":1794828039,"a":1794830464,"t":"泰國布吉知名遊客區致命火釀幾十人死傷 疑電單車地舖變壓器爆炸導致（楊潔儀報道）","su":"[나우뉴스채널] 이른 아침, 태국 푸켓의 유명 관광지 빠통에서 대여 오토바이 바닥에서 화재가 발생했습니다. 이는 위층 주거지로 퍼져 최소 11명이 사망하고 연기 흡입으로 사망한 것으로 추정되며 12명이 부상을 입었다. 당국은 처음에 화재가 변압기 폭발로 인해 발생한 것으로 의심했습니다."},{"s":"친핵은 재가동의 3대 원칙을 말한다. 원전을 반대한다고 해서 바로 가동할 수 있는 것은 아니다 | 정치","so":"中央社 CNA","tm":"11/16 20:20","c":1,"r":"tw","u":"https://www.cna.com.tw/news/aipl/202611160178.aspx","p":1794828000,"a":1794830458,"t":"擁核指重啟3原則已具備反核批核電廠不是說開就開| 政治","su":"중앙선거관리위원회가 비핵 조국폐지 국민투표 제3차 의견회의를 개최한다. 긍정적인 측면은 대만이 이미 원전 재가동을 위한 3대 원칙을 갖고 있고, 원전을 폐쇄하면 천연가스 사용량이 늘어날 것이라는 점이다. 부정적인 측면에서는 원전이 대규모 이동식 전력원이 아니고 마음대로 켜지지 않는다는 점을 비판한다."},{"s":"Box2Bit은 150MW 그리드 연결을 블랙스톤으로 이전하고 Épila를 종료합니다.","so":"Data Center Dynamics","tm":"11/16 19:48","c":1,"r":"world","u":"https://www.datacenterdynamics.com/en/news/box2bit-sells-150-mw-to-blackstone-and-lets-epila-take-the-lead-in-aragon/","p":1794826132,"a":1794869084,"t":"Box2Bit transfers 150MW grid connection to Blackstone and exits Épila","su":"Capital Energy의 자회사인 Box2Bit이 스페인 Epilon 데이터 센터 프로젝트에서 철수했습니다. 회사는 이 프로젝트를 위해 확보한 150MW의 그리드 연결 용량을 블랙스톤에 판매하고 있습니다. 아라곤 정부는 2026년 초에 이 프로젝트가 대중의 관심을 끌 것이라고 선언했으며, 1단계는 2029년에 가동될 예정입니다."},{"s":"프랑스 감사원, 낮은 전력 가격이 EDF 원자로 프로그램을 위협한다고 경고","so":"Reuters","tm":"11/16 19:30","c":1,"r":"us","u":"https://www.reuters.com/business/energy/french-court-auditors-warns-low-power-prices-threaten-edf-reactor-programme-2026-11-16/","p":1794825030,"a":1794898930,"t":"French court of auditors warns low power prices threaten EDF reactor programme"},{"s":"AI 데이터 센터 및 전력망에 대한 투자로 구리 수요 증가 골드만삭스는 2027년 말까지 구리 가격이 상승할 가능성을 13%로 보고 있습니다.","so":"鉅亨網","tm":"11/16 19:30","c":1,"r":"tw","u":"https://news.cnyes.com/news/id/6664079","p":1794825004,"a":1794830460,"t":"AI資料中心與電網投資推升銅需求高盛看2027年底銅價有13%上漲空間","su":"AI 데이터 센터 및 전력망에 대한 투자는 구리 수요를 증가시킵니다. 골드만삭스는 2027년 말까지 구리 가격이 13% 상승할 여지가 있다고 봅니다. Uanalyze 2026년 11월 16일(Uanalyze/산업 데이터 센터 보고) ⸺ AI 데이터 센터 및 전력 인프라에 대한 투자가 계속 증가하여 전 세계 구리 수요 증가를 주도하지만, 광산 생산량을 동시에 확장하기는 어렵습니다. 골드만삭스(GS-US)는 런던금속거래소(LME) 구리 가격이 2027년 12월까지 미터톤당 미화 15,600달러까지 오를 것이라고 예측했는데, 이는 주로 공급 제약과 수요 증가로 인한 가격 지지에 대해 낙관적이었습니다. LME 3개월 구리 선물(미래 값을 미리 정해 사고파는 거래)은 11월 13일 미터톤당 $13,399에 마감되었습니다. 골드만삭스의 예상 목표는 당시 현물 가격보다 약 13% 높습니다."},{"s":"닛신 전기가 마에바시에 신공장, 변전소용 부품 제조 전력 수요 전망 능력 증강","so":"日本経済新聞","tm":"11/16 18:30","c":1,"r":"jp","u":"https://www.nikkei.com/article/DGXZQOCC163BT0W6A111C2000000/","p":1794821446,"a":1794830465,"t":"日新電機が前橋に新工場、変電所向け部品製造 電力需要見据え能力増強","su":"닛신전기(교토시)는 16일, 마에바시 제작소(마에바시시) 내에 건설하는 공장의 안전 기원제를 열었다. 변전소 등에 대한 절연장치 부품의 생산성을 높이기 위해 45억엔을 들여 기존 공장의 개수와 용접공장의 건설을 추진한다. 인공지능(AI)의 보급에 따른 데이터센터(컴퓨터 수만 대를 모아 둔 건물)의 가동에 따른 전력수요의 고조를 내다보고 생산능력을 늘린다. 용접공장 완성은 2027년 12월을 전망한다. 신설하는 용접공장의 바닥면적은 약 4930제곱미터. 수변전 설비의"},{"s":"아시아 데이터 센터 대출 신디케이션이 희귀 거래 일시 중지로 지연됨","so":"Bloomberg.com","tm":"11/16 18:04","c":1,"r":"us","u":"https://www.bloomberg.com/news/articles/2026-11-16/asian-data-center-loan-syndication-is-delayed-in-rare-deal-pause","p":1794819862,"a":1794874183,"t":"Asian Data Center Loan Syndication Is Delayed in Rare Deal Pause"},{"s":"노르웨이의 데이터 센터 장비, 자동차 수입 기록 기록","so":"Bloomberg.com","tm":"11/16 17:55","c":1,"r":"us","u":"https://www.bloomberg.com/news/articles/2026-11-16/norway-s-imports-hit-record-on-data-center-equipment-cars","p":1794819327,"a":1794830455,"t":"Norway’s Imports Hit Record on Data Center Equipment, Cars"},{"s":"Kangshu Supercomputing은 고밀도 컴퓨팅 성능 레이아웃을 향상시키는 다양한 액체 냉각 솔루션을 선보입니다.","so":"經濟日報","tm":"11/16 17:01","c":1,"r":"tw","u":"https://money.udn.com/money/story/5612/9881959","p":1794816076,"a":1794830462,"t":"康舒 Supercomputing 展出多元液冷解決方案強化高密度運算電力布局","su":"전원공급장치 제조사 강슈(6282)가 11월 17일부터 19일까지 미국 시카고에서 열리는 슈퍼컴퓨팅 2026(Supercomputing 2026)에 참가한다. 지난 10월 OCP 글로벌 서밋에서 선보인 업계 최고의 고전력 밀도 전원 공급 장치 기술을 이어가는 것 외에도 이번에는 수냉식 플레이트와 유전체 액체 냉각 기술을 결합한 전원 공급
