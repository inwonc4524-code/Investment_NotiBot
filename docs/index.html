9%80%B2","p":1795220581,"a":1795226144,"t":"胰臟癌︱新藥丸能縮小或消除腫瘤 專家稱「數十年來最大躍進」","su":"췌장암은 홍콩에서 치명적인 암의 네 번째 주요 원인이며, 최근 주요 치료법이 개발되었습니다. 미국의 초기 임상 시험에서는 매일 약을 복용하면 이러한 유형의 암에 걸린 일부 환자의 종양이 줄어들거나 심지어 제거될 수 있다는 사실이 밝혀졌습니다. 영국 암연구소(Cancer Research UK)는 이를 췌장암 치료에 있어 \"수십년 만에 가장 큰 도약\"이라고 설명했습니다. 뉴욕 메모리얼 슬론 케터링 암센터(Memorial Sloan Kettering Cancer Center)가 주도한 이번 연구에서는 환자의 8.2%가 종양이 '완전 관해'된 것으로 나타났으며 지난 금요일 스페인 바르셀로나에서 열린 유럽 암 연구 컨퍼런스에서 발표됐다. 1상 및 2상 임상시험(새 약을 사람에게 시험하는 것)에는 전이성 췌장암 치료를 받지 않은 환자 61명이 참여했으며, 매일 새로운 신약을 200mg 복용했습니다."},{"s":"Capricor의 Duchenne 치료제가 FDA 승인을 얻지 못해 주가가 하락했습니다.","so":"Reuters","tm":"11/21 08:42","c":1,"r":"us","u":"https://www.reuters.com/legal/litigation/us-fda-declines-approve-capricors-cell-therapy-duchenne-muscular-dystrophy-2026-11-20/","p":1795218120,"a":1795230983,"t":"Capricor's Duchenne treatment fails to get FDA approval, shares sink"},{"s":"췌장암 치료에 생명공학 주식 거래 타격","so":"Investor's Business Daily","tm":"11/21 06:16","c":1,"r":"us","u":"https://www.investors.com/news/technology/revolution-medicines-erasca-biotech-stocks-pancreatic-cancer/","p":1795209360,"a":1795278542,"t":"Biotech Stocks Trade Blows In Pancreatic Cancer Treatment","su":"Erasca는 금요일에 췌장암 치료에 도전장을 던졌고 Revolution Medicines는 이를 바로 뒤로 던졌습니다."},{"s":"FDA는 코로나 백신 기록을 놓고 법정 싸움에서 승리한 단체에 법적 비용을 지불해야 합니다.","so":"Reuters","tm":"11/21 05:31","c":1,"r":"us","u":"https://www.reuters.com/legal/government/fda-must-pay-legal-fees-group-that-won-court-fight-over-covid-vaccine-records-2026-11-20/","p":1795206704,"a":1795230984,"t":"FDA must pay legal fees to group that won court fight over COVID vaccine records"},{"s":"Novo, 터너 증후군 아동을 위한 최초의 주간 성장 호르몬 치료에 대해 FDA 승인 획득","so":"Yahoo Finance","tm":"11/21 03:06","c":1,"r":"us","u":"https://finance.yahoo.com/healthcare/articles/novo-gets-fda-approval-first-180617592.html","p":1795197977,"a":1795215141,"t":"Novo Gets FDA Approval For First-Of-Its-Kind Weekly Growth Hormone Treatment For Children With Turner Syndrome","su":"이번 승인은 터너증후군 아동 105명을 公布季檢結果、科指成份股將增至50隻市場料寧德時代、中際旭創等入選"},{"s":"항셍테크지수에는 Luxshare Precision 및 CATL을 포함한 20개 주식이 포함되어 있습니다.","so":"Jiemian.com","tm":"11/20 20:20","c":4,"r":"cn","u":"https://www.jiemian.com/article/15356572.html","p":1795173633,"a":1795175804,"t":"恒生科技指数纳入立讯精密、宁德时代等20只个股","su":"11月20日，恒生指数公司宣布指数季检结果：恒生指数成份股没有变动，成份股数目维持95只。恒生科技指数纳入立讯精密、宁德时代、胜宏科技等20只个股，成份股数目将由30只增加至50只。恒生中国企业指数纳入MiniMax、智谱，成份股数目维持50只。上述变动将于2026年12月4日（星期五）收市后实施，并于2026年12月7日（星期一）起生效。"},{"s":"'전고체 리튬이온 배터리 및 배터리 팩의 안전 기술 규격'을 공식적으로 편찬하기 위해 '고체 리튬 배터리 표준 사업단'을 구성한다.","so":"Jiemian.com","tm":"11/23 12:17","c":2,"r":"cn","u":"https://www.jiemian.com/article/15360779.html","p":1795403845,"a":1795408853,"t":"“固态锂电池标准项目组”将成立，正式编制《固态锂离子电池和电池组安全技术规范》","su":"공업정보화부 리튬이온 배터리 및 유사제품 표준 실무그룹에 따르면, 국가표준위원회가 2026년 제8차 권장 국가 표준 계획 및 관련 표준 외국어 버전 계획을 발표함에 따라 권장 국가 표준인 '고체 리튬이온 배터리 및 배터리 팩 안전 기술 사양'이 정식으로 발표, 제정됐다. 이 표준은 339-1(산업정보기술부(전자))에 의해 제안되고 중앙집중화되었으며, 초안 작성을 중국 전자기술표준화연구소에 위임되었습니다. 중국전자기술표준화연구소(China Electronics Technology Standardization Institute)는 산업정보기술부 리튬이온 배터리 및 유사 제품 표준 실무그룹의 사무국으로서 리튬이온 배터리 분야 국내 업계, 학계, 연구 및 사용자와 협력하여 공동으로 표준을 개발할 예정이다. 현재 실무그룹 산하에 '고체리튬전지 표준사업단'을 구성해 학회에서 표준사업팀 구성원 단위를 모집할 계획이다."},{"s":"'자동차-전기 통합'이 점차 주류로 자리잡아 2위 신에너지 전력 배터리 기업이 떠오르고 있다 - 36Kr","so":"36kr.com","tm":"11/23 09:04","c":2,"r":"cn","u":"https://36kr.com/newsflashes/4081571998258309","p":1795392247,"a":1795392924,"t":"“车电融合”渐成主流，二线新能源动力电池企业崛起-36氪"},{"s":"LG에너지솔루션, 조준형 부사장 승진","so":"이투데이","tm":"11/22 00:23","c":2,"r":"kr","u":"https://m.etoday.co.kr/view_photo.php?idxno=2650548&seq=1","p":1795274628,"a":1795320061,"su":"LG에너지솔루션, 조준형 부사장 승진…품질·R&D 조직 강화 관련 이미지 원본을 이투데이에서 확인하세요"},{"s":"CATL은 Credit Agricole Bank와 5억 달러 규모의 판매 금융 전략 프레임워크 계약을 체결했습니다.","so":"Jiemian.com","tm":"11/20 21:41","c":2,"r":"cn","u":"https://www.jiemian.com/article/15356925.html","p":1795178476,"a":1795180879,"t":"宁德时代与东方汇理银行签署5亿美元销售融资战略框架协议","su":"11월 20일 CATL 뉴스에 따르면 Credit Agricole과 CATL은 최근 파리에서 5억 달러 규모의 판매 금융 전략 프레임워크 계약을 체결했습니다. 이번 협력은 Crédit Agricole 식적으로 전달되었습니다. 이는 태양전지를 사용하여 하루 60km를 제공하는 이 세발자전거가 곧 대량 생산되어 출시된다는 의미이기도 합니다."},{"s":"[리포트 브리핑]에코프로비엠, '삼원계가 돌아설 때 가장 탄력적' 목표가 100,000원 - 흥국증권","so":"뉴스핌","tm":"11/23 12:05","c":1,"r":"kr","u":"https://www.newspim.com/news/view/20261123000614","p":1795403100,"a":1795403788,"su":"[서울=뉴스핌] 로보뉴스 = 흥국증권에서 23일 에코프로비엠(247540)에 대해 '삼원계가 돌아설 때 가장 탄력적'라며 투자의견 'BUY(신규)'의 신규 리포트를 발행하였고, 목표가 100,000원을 내놓았다. 전일 종가 기준으로 볼 때, 이 종목의 주가는 목표가 대비 20.9%의 추가 상승여력이 있다는 해석이 가능하다. ◆ 에코프로비엠 리포트 주요내용 흥국증권에서 에코프로비엠(247540)에 대해 '2027년 실적(회사가 번 돈 성적표) 개선의 첫 동력은 인도네시아 BNSI 니켈 제련소."},{"s":"DK-1788W 무선 2D 바코드 스캐너, 작업 중단 없이 교체 가능한 배터리 설계로 시장 판도를 뒤집다 | 인기 하이라이트 | 사업정보","so":"經濟日報","tm":"11/23 11:02","c":1,"r":"tw","u":"https://money.udn.com/money/story/5635/9894613","p":1795399365,"a":1795403790,"t":"DK-1788W無線二維條碼掃描器 以可換電池設計顛覆市場讓作業不中斷 | 熱門亮點 | 商情","su":"요즘에는 많은 제품이 첨단 기술을 강조하지만 일부 업계 관계자는 \"첨단 기술이 없고 인간의 요구와 작동 관성에 부응하는\" 매우 간단한 제품인 DK-1788W 무선 2D 바코드 스캐너를 출시했습니다. 리모콘만큼 조작하기 쉽고, 심지어 아야(Aya)도 사용할 수 있을 만큼 간단하다고 합니다. 많은 기업과 가맹점이 기존의 무선 바코드 스캐너를 사용하다 보면 내장 배터리의 노후화, 수리의 어려움, 심지어 배터리 하나의 손상으로 기기 전체를 폐기해야 하는 딜레마에 직면하는 경우가 많습니다. 사용자의 문제점을 완전히 해결하기 위해 업계에서 \"스캐너 최고의 전문가\"로 알려진 Huangwei International Company는 \"교체 가능한 배터리\" 디자인으로 시장을 뒤집고 가정용 TV 리모컨처럼 사용하기 쉬운 새로운 \"DK-1788W 무선 2D 바코드 스캐너\"를 출시했습니다. \"교체 가능한 AAA 배터리\" 설계는 제조업체가 설정한 숨겨진 비용 함정을 깨고 비용 효율적이고 임계값이 없는 새로운 옵션을 시장에 출시하여 사용자가 배터리 노후화에 대한 불안과 높은 유지 관리 비용에 작별을 고할 수 있도록 약속합니다. 본 제품은 공식 채널을 통해 출시되었으며, 시장에 충격과 반향을 불러일으킬 것으로 예상됩니다. 회사는 DK-1788W의 핵심 하이라이트는 다음과 같다고 밝혔습니다. 1. 배터리 수명을 기다리는 시간이 전혀 없고 몇 초 만에 전체 체력이 부활한다는 점을 강조합니다. 18650 리튬 배터리가 내장된 기존 스캐너는 전원이 부족할 때 충전에 의존해야 합니다."},{"s":"Hongqi EHS4 홍콩 첫 시험! $300,000 예산의 순수 전기 SUV를 위한 새로운 선택: Hongqi EHS4 전기 자동차 공간/장비/운전 경험이 완전히 테스트되었습니다!","so":"星島頭條","tm":"11/23 10:00","c":1,"r":"hk","u":"https://www.stheadline.com/car/3639957/%E7%B4%85%E6%97%97-EHS4-%E9%A6%99%E6%B8%AF%E9%A6%96%E8%A9%A630%E8%90%AC%E9%A0%90%E7%AE%97%E7%B4%94%E9%9B%BB-SUV-%E6%96%B0%E9%81%B8%E6%93%87Hongqi-EHS4-%E9%9B%BB%E5%8B%95%E8%BB%8A-%E7%A9%BA% -배터리·전자 '신성장축'","so":"파이낸셜포스트","tm":"11/23 07:35","c":1,"r":"kr","u":"https://www.financialpost.co.kr/news/articleView.html?idxno=302375","p":1795386900,"a":1795389909,"su":"미국 전력망 확충 지연에 따른 설비 병목과 글로벌 AI 소프트웨어·서비스 투자 폭증이 맞물리면서 에너지저장장치(ESS(전기를 저장해 두는 큰 배터리)), AI 데이터센터(AIDC) 냉각솔루션,"},{"s":"주가 반토막에 풋옵션 폭탄… 에코프로비엠, 기존 FI들에 ‘CB 돌려막기’","so":"Chosunbiz","tm":"11/23 06:00","c":1,"r":"kr","u":"https://biz.chosun.com/stock/market_trend/2026/11/23/HCHCDI5F3VAFHGIX7N6GPUZGGE/","p":1795381200,"a":1795389909,"su":"주가 반토막에 풋옵션 부담 에코프로비엠, 기존 FI와 CB 재발행 추진 4200억 CB 조기상환 후 신규 발행 만기이자율 2% → 3% 상향 유력 상환금, 신규 CB 인수대금과 상계"},{"s":"CATL은 유럽 시장으로 확장할 계획이며 EU에 정유용 폐배터리 재활용을 개방할 것을 촉구합니다.","so":"DIGITIMES","tm":"11/23 03:22","c":1,"r":"tw","u":"https://www.digitimes.com.tw/tech/dt/n/shwnws.asp?id=0000775544_4V64DOMZ59G7MF3Y1EBUT","p":1795371720,"a":1795389911,"t":"寧德時代布局歐洲市場 籲歐盟開放廢棄電池回送中精煉","su":"CATL 창립자이자 회장인 Zeng Yuqun은 유럽이 현지 배터리 재활용을 장려한다면 높은 비용에 직면하게 될 것이라고 경고했습니다. 그는 사용한 배터리를 중국으로 보내고, 재활용된 금속을 정제한 뒤 다시 유럽으로 운송하자고 제안했습니다. 이 계획은 유럽 공무원과 일부 자동차 제조업체에 제안되었습니다."},{"s":"CATL을 곤경에 빠뜨린 미국산 포드의 LFP는 중대한 조치를 취한다","so":"DIGITIMES","tm":"11/23 03:21","c":1,"r":"tw","u":"https://www.digitimes.com.tw/tech/dt/n/shwnws.asp?id=0000775525_ZD24WADF3PB7LO4GXA71T","p":1795371660,"a":1795389912,"t":"攜寧德時代惹一身腥 福特LFP美國自製跨出關鍵一步","su":"최근 포드는 인산철리튬(LFP) 배터리가 공식적으로 생산에 들어가고 전기 픽업트럭에도 탑재될 것이라고 발표해 미국이 LFP 배터리를 제조하는 데 중요한 발걸음을 내디뎠다. 유럽, 미국, 일본, 한국의 주류 자동차 제조업체를 살펴보면 Ford는 자체 제작에 성공한 몇 안 되는 사례 중 하나입니다. 외신은 CATL 턴키 의존도에 대해 의구심을 갖고 있지만, 공급망(부품·재료가 오가는 연결망)에서는 여전히 긍정적인 기대를 갖고 있다. ..."},{"s":"CATL은 배터리에서 에너지 통합으로 전환하여 라틴 아메리카 에너지 저장 시장에서 입지를 확대하고 있습니다.","so":"DIGITIMES","tm":"11/23 03:04","c":1,"r":"tw","u":"https://www.digitimes.com.tw/tech/dt/n/shwnws.asp?id=775366","p":1795370640,"a":1795389914,"t":"寧德時代從電池走向能源整合 擴大布局拉美儲能市場","su":"전기 자동차의 글로벌 인기가 둔화되고 시장 경쟁이 심화됨에 따라 CATL 회장 겸 CEO인 Zeng Yuqun은 회사가 표준화된 통합 솔루션을 만들기 위해 미국에서 수요가 높은 독립형 전원 공급 장치 시스템을 확보했다고 밝혔습니다. 또한 라틴 아메리카에서 에너지 저장 사업 기회를 완전히 포착하기 위해 아르헨티나에 상업 사무소를 설립했습니다."},{"s":"전기차도 국내생산세액공제 대상 포함 유력…이르면 이번주 결론 - 머니투데이","so":"머니투데이","tm":"11/22 14:34","c":1,"r":"kr","u":"https://www.mt.co.kr/amp/industry/2026/11/22/2026112210573377519","p":1795325668,"a":1795403788,"su":"당초 지원 대상에서 제외됐던 전기차가 국회 논의단계에서 국내생산세액공제 대상에 추가될 가능성에 무게가 실리고 있다. 앞서 정부는 지난 8월 발표한 세제개편안에서 국내생산세액공제 지원 분야로 △태양광 발전 △풍력 발전 △이차전지 △반도체(전자기기의 두뇌 부품) △핵심소재 △AI(인공지능) 로봇부품 등 6개 분야를 선정했다."},{"s":"압력을 받고 있는 리튬 광부들은 중국의 재고량이 낮다고 믿습니다.","so":"AFR","tm":"11/22 14:00","c":1,"r":"us","u":"https://www.afr.com/companies/mining/under-pressure-lithium-miners-put-faith-in-low-chinese-stockpiles-20261122-p61frh","p":1795323600,"a":1795334537,"t":"Under pressure lithium miners put faith in low Chinese stockpiles","su":"PLS, MinRes 및 Liontown은 모두 가격이 5월 최고치보다 60% 하락하자 생산량을 늘렸습니다. 모두 반등(내렸다가 다시 오르는 것)이 곧 다가올 것이라고 확신하고 있습니다."},{"s":"서울 폐가전 수거 1만7천t…이차전지 전용수거함 4천100개 늘렸다","so":"SBS Biz","tm":"11/22 11:52","c":1,"r":"kr","u":"https://biz.sbs.co.kr/article/20000348017","p":1795315920,"a":1795334537,"su":"[2026년 폐가전제품 및 폐전지 공공 회수체계 우수 지자체 경진대회서 수상한 서울시 (서울시 제공=연합뉴스)]서울시의 폐가전제품 수거량이 1년 새 20% 넘게 늘고, 중소형 폐가전 수거량은 50% 이상 증가한 것으로 나타났습니다. 휴대용 보조배터리 등 리튬배터리 사용 증가에 대응해 이차전지 전용 수거함도 4천100여개 추가 설치했습니다.서울시는 …"},{"s":"반도체·이차전지·로봇 등 25개 ‘지역 성장엔진’…연내 지원 로드맵 만든다","so":"SBS Biz","tm":"11/22 11:34","c":1,"r":"kr","u":"https://biz.sbs.co.kr/article/20000348014","p":1795314840,"a":1795320061,"su":"정부가 반도체(전자기기의 두뇌 부품)와 이차전지, 로봇 등 권역별 25개 성장엔진 산업을 키우기 위한 실행계획을 연내 마련합니다.산업통상부는 오는 23∼24일 충북 청주 오송컨벤션센터에서 ‘성장엔진 육성계획 2차 실무협의회’를 연다고 오늘(22일) 밝혔습니다.이번 협의회에는 산업부와 7개 권역 지방정부, 권역별 성장엔진 공동사업단 등이 참여해 …"},{"s":"김동명·최주선 유임…K-배터리, 내년은 `성과 확장` 시험대 [위클리배터리]","so":"디지털데일리","tm":"11/22 08:52","c":1,"r":"kr","u":"https://www.ddaily.co.kr/page/view/2026112123484331286","p":1795305128,"a":1795307337,"su":"디지털데일리 배터리레이다 독자 여러분, 이번 주도 열심히 달린 레이다가 이차전지·에너지 이슈를 들려드립니다. &lt;배터리레이다&gt;에서는 금주에 놓쳐서는 안 되는 중요한 뉴스를..."},{"s":"[주末머니]2027년, EV 아닌 ESS에 주목하라","so":"아시아경제","tm":"11/22 07:58","c":1,"r":"kr","u":"https://core.asiae.co.kr/article/2026111916543407375","p":1795301880,"a":1795303157,"su":"내년 2차전지(충전해서 다시 쓰는 배터리) 투자자는 전기차(EV)와 에너지저장장치(ESS(전기를 저장해 두는 큰 배터리)) 두 축 중 어느 쪽을 택해야 할까. 증권가에서는 중국이 장악한 EV 부문보다 미국 에너지저장장치(ESS) 시장의 성장을 노려볼 만하다고 전망했다. 올해 2차전지 업종의 주가는 고공행진을 이어가다 조정을 받았다. 12개월간 142% 성장하다 5월 고점 이후 6개월간 45% 하락했다. 유럽 EV 시장에서 중국 배터리 업체들의 시장 점유율은 66%로 확대됐지만, 한국 3사(LG에너지솔루션, SK온, 삼성SDI)는 판매가 줄었다. 장정훈 삼성증권 수석연구위원은 내년 글로벌 전"},{"s":"에코프로비엠도 LFP 양극재 경쟁 참전, 송호준 탈중국 ESS 수요 증가에 삼원계 '올인' 철회","so":"비즈니스포스트","tm":"11/22 06:00","c":1,"r":"kr","u":"https://www.businesspost.co.kr/BP?command=article_view&num=452416","p":1795294800,"a":1795303157},{"s":"미드 리무시로부터 리튬 이온 전지의 양극 재료를 개발","so":"日本経済新聞","tm":"11/22 05:00","c":1,"r":"jp","u":"https://www.nikkei.com/article/DGXZQOSG097740Z01C26A1000000/","p":1795291200,"a":1795303158,"t":"ミドリムシからリチウムイオン電池の正極材料を開発 産総研","su":"산업기술종합연구소는 미드리무시 유래의 재료로부터 리튬 이온 전지용 재료를 개발했다. 전지의 정극에 사용하는 접착제로, 종래의 제조 공정에서 사용할 수 있다. 자연계에서 분해하기 어려운 불소계 재료를 포함하지 않고, 폐기시의 환경에의 부하를 저감할 가능성이 있다. 리튬 이온 전지의 정극에는 전기를 축적하는 재료 등을 금속박에 고정하는 접착제를 사용한다. 현재, 접착제에는 불소를 포함하는 고분자 재료가 널리 사용되고 있지만, 환경에서 분해되기 어려운 문제가 있다."},{"s":"전기 자전거 배터리 화재가 증가함에 따라 뉴욕은 더욱 엄격한 제한 조치를 취하고 있습니다.","so":"Reuters","tm":"11/21 20:18","c":1,"r":"us","u":"https://www.reuters.com/world/us/e-bike-battery-fires-mount-new-york-weighs-tougher-restrictions-2026-11-21/","p":1795259936,"a":1795270286,"t":"As e-bike battery fires mount, New York weighs tougher restrictions"},{"s":"정저우시 한 지역에서 화재가 발생해 5명이 사망하고 1명이 부상을 입었습니다. 조사 보고서: 전기 오토바이를 불법 개조하고, 충전을 위해 건물과 주택에 불법 진입했으며, 열 폭주 후 리튬 배터리가 폭발했습니다.","so":"ThePaper.cn","tm":"11/21 17:44","c":1,"r":"cn","u":"https://www.thepaper.cn/newsDetail_forward_34529076","p":1795250697,"a":1795278551,"t":"郑州市一小区发生火灾致5死1伤，调查报告：电动摩托车非法改装，违规进楼入户充电，锂电池热失控后爆燃","su":"2026년 7월 6일, 정저우시 후이지구와 창룽위에 커뮤니티에서 대규모 화재 사고가 발생했습니다. 화재 면적은 약 15㎡로 사망자 5명, 부상 1명이 발생했으며 직접적인 경제적 손실은 530억7500만 위안에 달했다. 11월 20일 정저우 소방방재공식계정에 따르면 화재사고 조사보고서가 공개됐다."},{"s":"테슬라, 중국 CATL과 충전용 배터리 논의 중","so":"ET Auto","tm":"11/21 16:47","c":1,"r":"us","u":"https://auto.economictimes.indiatimes.com/news/industry/tesla-in-talks-with-chinas-catl-for-rechargeable-batteries-report/68357867?next=1","p":1795247229,"a":1795270287,"t":"Tesla in talks with China's CATL for rechargeable batteries: Report"},{"s":"JA Solar가 자체 개발한 배터리 여권 플랫폼이 EU 강제 접근 요구 사항을 충족하기 위해 온라인에 출시되었습니다.","so":"經濟日報","tm":"11/21 16:00","c":1,"r":"tw","u":"https://money.udn.com/money/story/123828/9893297","p":1795244432,"a":1795248137,"t":"晶澳自研電池護照平台上線，滿足歐盟強制准入要求","su":"베이징, 2026년 11월 21일 /PRNewswire/ -- 글로벌 에너지 전환의 물결 속에서 수명 주기 전반에 걸친 배터리의 투명성과 추적성은 에너지 저장의 핵심 운반체로서 국제 시장의 관심의 초점이 되었습니다. EU 배터리 여권 요구 사항이 점진적으로 구현됨에 따라 유럽 시장에 진출하는 배터리 제품은 새로운 정보 관리 요구 사항에 직면하게 됩니다. JA Solar가 자체 개발한 배터리 패스포트 플랫폼 01 '배터리 패스포트'란 정확히 무엇인가요? 배터리 여권은 실제 배터리에 바인딩된 디지털 기록입니다. QR 코드와 고유 식별자(ISO/IEC 15459 표준 기반)를 통해 \"탄생부터 폐기까지\" 배터리의 주요 데이터가 직렬로 연결되어 신원 정보, 재료 구성, 탄소 발자국, 재활용 재료 함량, 성능 내구성, 건강 상태, 공급망(부품·재료가 오가는 연결망) 실사 및 폐기 처리 등 전체 수명 주기 정보를 포괄합니다. 02 주요 일정: 규정 준수 준비를 계속해야 합니다. EU의 배터리 및 폐배터리 규정(규정(EU) 2023/1542)에 따라 2027년 2월 18일부터 EU 시장에 출시되거나 사용되는 소형 자동차 배터리, 2kWh 이상의 산업용 배터리, 전기 자동차 배터리에는 배터리 여권을 장착해야 합니다. 이 요구 사항을 충족하기 위해 JA Solar는"},{"s":"중고차 배터리에서 '블랙 골드'를 찾는 노르웨이","so":"ET Auto","tm":"11/21 14:42","c":1,"r":"us","u":"https://auto.economictimes.indiatimes.com/news/auto-components/norways-quest-for-black-gold-from-used-car-batteries/101384719?next=1","p":1795239724,"a":1795282027,"t":"Norway's quest for 'black gold' from used car batteries"},{"s":"폐전기차 배터리를 금으로 바꿀 수 있을까? 중국 본토에서 '도시 광산' 사업 기회 폭발","so":"中時新聞網","tm":"11/21 14:30","c":1,"r":"tw","u":"https://www.chinatimes.com/realtimenews/20261121001926-260409","p":1795239013,"a":1795248139,"t":"電動車報廢電池變黃金？大陸「城市礦山」商機爆發","su":"폐기된 신에너지 자동차용 동력배터리는 제대로 처리하지 않으면 오염원이 될 수 있지만, 제대로 재활용하면 '도시 광산'이 될 수 있다. 중국 본토에서 신에너지 차량의 수가 급속히 증가하고 있으며, 전력 배터리의 폐기가 다가오고 있습니다. 관계자들은 밀집된 재활용 네트워크 구축을 가속화하고 배터리 흐름을 감시하며 수천억 위안 규모의 순환 경제 시장을 점유하고 있습니다. 중국-싱가포르"},{"s":"촘촘하게 짜여진 중국 배터리 재활용 네트워크, 1000억 규모 '도시 광산'으로 부상 - China News Service","so":"中国新闻网","tm":"11/21 13:50","c":1,"r":"cn","u":"https://www.chinanews.com.cn/cj/2026/11-21/10735679.shtml","p":1795236632,"a":1795278552,"t":"中国织密电池回收网络千亿级“城市矿山”崛起-中新网","su":"중국의 고밀도 배터리 재활용 네트워크 수천억 개의 '도시 광산' 증가 폐기된 신에너지 차량용 동력 배터리는 버리면 오염되지만 재활용하면 풍부한 광석이 될 것입니다. 올해 6월 말 현재 중국의 신에너지차 대수는 4,897만 대에 달했다. 이 숫자 뒤에는 전례 없는 전력 배터리 폐기의 물결이 다가오고 있습니다. 최근 상무부를 포함한 9개 부서가 공동으로 \"재생 가능한 자원 재활용 시스템 구축을 심층적으로 추진하고 재활용 산업의 고품질 발전을 촉진하기 위한 의견\"을 발표하여 특별 장 형태로 \"3가지 새로운 유형\"의 고형 폐기물 재활용 및 활용에 대한 전반적인 조치를 취했습니다. 표면적으로는 '폐기물 수집'에 관한 것처럼 보이지만, 자세히 보면 이는 산업체인의 안보와 관련된 장기화된 자원전쟁이다. 동시에 거대한 시장의 형성이 가속화되고 있다."},{"s":"Yiwei Lithium Energy Liu Jincheng: 2027~2028년 대형 원통형 배터리 납품 규모가 100GWh를 초과할 것","so":"Jiemian.com","tm":"11/21 11:58","c":1,"r":"cn","u":"https://www.jiemian.com/article/15357631.html","p":1795229938,"a":1795230995,"t":"亿纬锂能刘金成：2027‑2028年大圆柱电池交付规模将超100 GWh","su":"원본 뉴스 Gao JingGJ · 출처: Jiemian News 11월 21일, 제11회 파워 배터리 응용 국제 서밋(CBIS2026) 기업가 고위급 포럼이 상하이에서 열렸습니다. Yiwei Lithium Energy의 Liu Jincheng 회장은 회의에서 회사가 대형 원통형 및 대형 사각형 배터리 트랙 레이아웃에 중점을 두고 있다고 소개했습니다. 2027~2028년에는 대형 원통형 배터리 납품 규모가 100GWh를 넘어설 것으로 예상된다. 현재 702Ah 대형 각형 배터리 수요는 강하지만 공급 격차가 존재한다."},{"s":"Zhuhai Guanyu Xu Yanming: 리튬 배터리 산업은 대내외 특허 문제에 직면해 있으며, 내부 차단 소송을 중단하고 외부 세계에 대한 통합적인 접근을 요구하고 있습니다.","so":"Jiemian.com","tm":"11/21 11:36","c":1,"r":"cn","u":"https://www.jiemian.com/article/15357594.html","p":1795228616,"a":1795230995,"t":"珠海冠宇徐延铭：锂电行业面临专利内忧外患，呼吁停止内部阻击式诉讼、抱团一致对外","su":"11월 21일, Zhuhai Guanyu 회장 Xu Yanming은 제11회 국제 전력 배터리 응용 서밋(CBIS2026)의 기업가 고위급 포럼에서 중국 국내 리튬 배터리 산업의 특허 압력이 두드러지고 있으며 많은 해외 기업과 특허 풀이 계속해서 특허 문제를 제기하고 있다고 지적했습니다. 동시에, 중국 국내 동종 기업의 특허 소송이 빈번하고, 많은 소송이 기업공개(IPO) 및 입찰 노드를 대상으로 장벽을 형성하고 있습니다. 그는 업계가 내부소송을 줄이고, 협의와 조정을 정상화하며, 혁신을 중단하고, 해외 지적재산권 리스크에 공동으로 대응하기 위해 한 팀으로 글로벌화할 것을 제안했다. Xu Yanming은 또한 중국의 전체 리튬 배터리 시장 점유율은 세계 1위이지만 기초 기술 특허 축적은 여전히 일본과 한국만큼 좋지 않으며 해외 특허 풀의 압력에 직면해 있다고 지적했습니다. 그는 업계가 기술 리더십을 유지하고 글로벌 관점에서 특허를 배포해야 한다고 제안했습니다. 동시에, 최근 몇 년간 중국 리튬 배터리 산업이 신기술, 신재료, 신시스템 분야에서 형성한 고부가가치 특허를 활용해 전문 지적재산권팀을 구축해 해외 특허 봉쇄를 파악하고 대응하며 심지어 반격해야 한다."},{"s":"[AX 인재 키우는 대학]〈2〉동국대, 이차전지 전 과정에 AI 접목…산업 맞춤형 인재 양성","so":"전자신문","tm":"11/21 11:09","c":1,"r":"kr","u":"https://www.etnews.com/20261120000141","p":1795226940,"a":1795230994,"su":"인공지능(AI)이 이차전지 산업의 소재 개발부터 제조공정, 품질 관리까지 빠르게 확산하면서 배터리 전문지식과 AI 활용 역량을 동시에 갖춘 인재의 중요성이 커지고 있다. 동국대학교는 배터리 소재 설계부터 셀 제조, 성능 평가까지 전 과정에 AI를 접목한 실무교육으로 산업현장이 요구하는 융합인재 양성에 나섰다. 동국대는 교육부가 추진하는"},{"s":"\"엘앤에프, 설비투자 위해 추가 자금조달 불가피… 목표가↓\"-대신 - 머니투데이","so":"머니투데이","tm":"11/21 10:43","c":1,"r":"kr","u":"https://www.mt.co.kr/index.php/stock/2026/11/20/2026112008225688924","p":1795225402,"a":1795259708,"su":"대신증권이 20일 엘앤에프에 대한 목표주가(전문가가 예상한 앞날의 주가)를 기존 15만원에서 11만원으로 낮춰 잡았다. 자금조달에 따른 지분(회사를 나눠 가진 몫)희석(오버행) 물량과 리튬인산철(LFP) 양극재 시장의 경쟁이 심화할 가능성을 반영했다."},{"s":"반도체 흑자에 가려진 '대중국 수출 착시'…자동차·이차전지 적자 급증","so":"파이낸셜포스트","tm":"11/21 09:52","c":1,"r":"kr","u":"https://www.financialpost.co.kr/news/articleView.html?idxno=302335","p":1795222374,"a":1795226153,"su":"올해 한국의 대중 무역수지가 4년 만에 흑자(번 돈이 쓴 돈보다 많은 것)로 돌아섰으나 반도체(전자기기의 두뇌 부품)를 제외하면 오히려 적자 폭이 커진 것으로 나타났다.21일 한국무역협회 및 산업통상부에 따르면, 올"},{"s":"리튬 이온 전지를 둘러싼 화재 등의 사례가 소개되었다=13일, 치바현 이치카와시의 쇼와 학원 초등학교(외자 아키히코 촬영)","so":"産経ニュース","tm":"11/21 07:30","c":1,"r":"jp","u":"https://www.sankei.com/article/20261121-BKRVLT2ET5JT7NIHC4LVFLX55Y/photo/VJYWPZ3Z3RM3TP22TPJUZD6DXI/","p":1795213800,"a":1795226161,"t":"リチウムイオン電池を巡る火災などの事例が紹介された＝13日、千葉県市川市の昭和学院小学校（外崎晃彦撮影）","su":"산케이 뉴스의 기사 「리튬 이온 전지 「바르게 버리고」 산폐업자가 아이용 수업 30회 「화재 공포와 싸움」」의 사진이나 화상의 확대 페이지입니다."},{"s":"리튬이온 전지 「바르게 버려」 산폐업자가 아이용 수업 30회 「화재 공포와 싸움」","so":"産経ニュース","tm":"11/21 07:30","c":1,"r":"jp","u":"https://www.sankei.com/article/20261121-BKRVLT2ET5JT7NIHC4LVFLX55Y/","p":1795213800,"a":1795215161,"t":"リチウムイオン電池「正しく捨てて」 産廃業者が子供向け授業30回 「火災恐怖と戦い」","su":"분별되지 않고 버려진 리튬 이온 전지가 폐기물 처리 시설에서 발화해 화재를 일으킨다고 하는 사안이 전국에서 잇따르고 있는 것을 둘러싸고, 지바현내의 산업 폐기물 처리 사업자가,…"},{"s":"GS유아사 아베 사장 “우주용 전지, 양산에 검사 공정의 자동화 진행한다”","so":"日本経済新聞","tm":"11/21 05:00","c":1,"r":"jp","u":"https://www.nikkei.com/article/DGXZQOUF0613D0W6A101C2000000/","p":1795204800,"a":1795215164,"t":"GSユアサ阿部社長「宇宙用電池、量産へ検査工程の自動化進める」","su":"지에스 유아사 코퍼레이션(GS유아사)은 인공위성용 리튬 이온 전지의 사업 확대를 목표로 한다. 소형 위성용 수요 개척을 위해 양산 기술을 닦아 검사 공정의 자동화도 진행한다. 아베 타카시 사장에게 향후 성장 전략을 들었다. ――2026년도부터 3년간의 제7차 중기 경영 계획으로 「항공・우주・방위」를 독립한 사업에 자리매김했습니다. “방위 용도의 산업용 전지는 당사의 조업의 하나로, 오랜 역사가 있다.안보를 둘러싼 환경이 크"},{"s":"항셍지수 분기별 리뷰 발표 Ningde Changfei Naco Index | 홍콩경제신문","so":"香港經濟日報HKET","tm":"11/21 01:29","c":1,"r":"hk","u":"https://invest.hket.com/article/4228789/","p":1795192140,"a":1795215158,"t":"恒指季檢出爐 寧德長飛納科指|香港經濟日報"},{"s":"항셍테크지수는 큰 조정을 겪게 될 것이다. CATL, 중지쉬촹 등의 주식이 포함될 수 있습니다 | 본토 주식 통찰력 | 양안","so":"經濟日報","tm":"11/20 22:09","c":1,"r":"tw","u":"https://money.udn.com/money/story/5604/9890792?from=edn_subcatelist_cate","p":1795180163,"a":1795180888,"t":"恒生科技指數將迎重大調整 寧德時代和中際旭創等股票或被納入 | 陸股透視 | 兩岸","su":"[블룸버그] - CATL과 중국 InnoLight와 같은 주식이 홍콩 기술주 벤치마크 지수의 대대적인 개편에 포함될 것으로 예상됩니다. 이를 통해 지수가 인공지능 붐을 더 잘 반영하고 아시아의 다른 기술 중심 지수와 경쟁하는 데 도움이 될 것입니다."},{"s":"CATL은 일주일에 세 번씩 200억~400억 위안 규모의 자사주 매입 계획을 가속화합니다.","so":"21财经","tm":"11/20 21:57","c":1,"r":"cn","u":"https://www.21jingji.com/article/20261120/herald/ad352edf292e19be95951dc69c2d885d.html","p":1795179420,"a":1795180882,"t":"一周三度出手，宁德时代加速推进200亿~400亿元回购计划","su":"21세기 비즈니스 헤럴드 Liu Xiafei 기자 이번 주 CATL은 200억~400억 위안 규모의 상각 환매 계획을 가속화하기 위해 세 차례 조치를 취했습니다. CATL은 이날 중앙입찰을 통해 A주(중국 본토 주식시장 주식) 65만7600주를 매입했다고 20일 밝혔다. 최고거래가는 주당 229.58위안, 최저거래가는 주당 226.84위안이다. 지급총액은 1억4998만위안이며, 자사주 매입(회사가 자기 주식을 다시 사는 것)은 소각 예정이었다. 앞서 CATL은 지난 11월 17일과 19일 각각 약 1억5천만 위안과 2억 위안을 환매에 지출했다. 위에 언급된 거래는 모두 해당 연도에 시작된 상각 환매 계획의 일부입니다. 이 계획을 되돌아보면 CATL은 8월 12일 임시 주주총회에서 검토 및 승인을 받았다. CATL은 12개월 동안 중앙 집중식 입찰을 통해 A주를 환매하는 데 자체 자금 또는 자체 조달 자금 중 200억 위안 이상, 400억 위안 이하를 사용할 계획이다. 모든 주식이 소각되고 그에 따라 등록 자본금도 감소됩니다."},{"s":"Shanghai Electronics Co., Ltd., GigaDevice Innovation, Goke Microelectronics, CATL, Shengyi Technology, Hengtong Optoelectronics 및 Tongwei Co., Ltd.는 공동으로 지분 증가 및 환매를 발표했습니다.","so":"21财经","tm":"11/20 20:53","c":1,"r":"cn","u":"https://www.21jingji.com/article/20261120/herald/704a6c7c7cafa050288a7c996fda5a54.html","p":1795175580,"a":1795180884,"t":"沪电股份、兆易创新、国科微、宁德时代、生益科技、亨通光电、通威股份集体宣布增持、回购","su":"11월 20일 저녁, 21 Financial Radar에 따르면 Shanghai Electric Co., Ltd., GigaDevice, CATL, Cyrus, Hengtong Optoelectronics, Tongwei Co., Ltd., Rongsheng Petrochemical, Huaqin Technology 및 기타 회사가 A주 '증가 및 환매 물결'에 동참했습니다. Shanghai Electric Co., Ltd.는 2026년 11월 20일 회사가 주식 환매를 위한 특별 증권 계정을 통한 중앙 집중식 입찰 거래를 통해 처음으로 회사 주식 248,900주를 환매했다고 발표했습니다. 이는 회사 전체 주식 자본금의 0.01%에 해당합니다. 최고 거래가격은 80.85위안/주, 최저 거래가격은 79.92위안/주, 총 거래금액은 199993만원(거래수수료 제외)을 기록했다. 이번 환매 계획은 우리사주 제도나 지분(회사를 나눠 가진 몫) 인센티브를 시행하고 회사 가치와 주주 권리를 유지하기 위해 5억~10억 위안을 환매할 계획이다. 최근 마감 기준으로 Shanghai Electric Co., Ltd.의 시가총액(회사 전체 몸값)은 1,500억 위안을 넘어 전년 대비 10% 이상 증가했으며, 주가는 지난 60일 동안 거의 30% 하락했습니다."},{"s":"1시간만에 증명서 발급! Shaoguan 리튬 배터리의 해외 시장 수출이 가속화되어 수출이 68.6% 증가했습니다.","so":"21财经","tm":"11/20 20:18","c":1,"r":"cn","u":"https://www.21jingji.com/article/20261120/herald/894f2f351e29f047af3506f8f3da0684.html","p":1795173480,"a":1795180887,"t":"1小时内出证！韶关锂电池出海提速，出口比增68.6%","su":"최근 Shaoguan Customs의 감독하에 Guangdong Paidon New Energy Co., Ltd.의 리튬 배터리 수출 위험 패키지 배치는 \"수출 위험물 포장 스마트 감독 시스템\"을 통해 자동으로 온라인 비교 및 확인되어 패키지가 사용 자격이 있는지 확인하고 신속하게 출시되었습니다. 이는 Shaoguan에서 리튬 배터리 패키징을 위한 스마트 감독 모델이 성공적으로 구현되었음을 의미합니다. 최근에는 그린에너지 산업의 급속한 발전과 함께 대외무역의 '3대 신품목' 중 하나인 리튬전지 수출이 폭발적인 성장세를 보이고 있다. 통계에 따르면 2026년 1월부터 10월까지 소관시 리튬 배터리 제품 수출액은 9,395만 위안에 달해 전년 동기 대비 68.6% 증가했다. 제품은 유럽, 미국, 동남아시아 등 많은 국가와 지역으로 수출되어 소관 대외 무역 성장의 새로운 엔진이 되었습니다."},{"s":"규슈전력, 산업기계용 전지팩으로 신회사 정흥전기제작소와 협업","so":"日本経済新聞","tm":"11/20 20:12","c":1,"r":"jp","u":"https://www.nikkei.com/article/DGXZQOJC207IW0Q6A121C2000000/","p":1795173126,"a":1795175814,"t":"九州電力、産業機械向け電池パックで新会社 正興電機製作所と協業","su":"큐덴홀딩스 산하 규슈전력은 20일 산업기계용 전지팩을 개발·판매하는 신회사를 설립했다고 발표했다. 탈탄소를 배경으로 건설기계나 특수차량 등으로 전동화 요구가 확대되고 있어 상기가 있다고 판단했다. 신회사 「BIXSAS(빅사스)」를 1일자로 설립했다. 전지 팩은 리튬 이온 전지에 제어 기판 등을 조합한 것. 구전은 2022년부터 판매하고 있으며, 사업이 궤도를 타고 있기 때문에 신회사에서 본격전"},{"s":"BYD는 일본에서 무엇을 했나요? | 발전소","so":"Jiemian.com","tm":"11/20 19:51","c":1,"r":"cn","u":"https://www.jiemian.com/article/15356470.html","p":1795171892,"a":1795175805,"t":"比亚迪在日本都做了些什么？ | 电厂","su":"한때 일본에서 예약 붐을 일으켰던 BYD Sea Otter(RACCO)가 출시 이후 최대 경쟁자를 맞이하게 되었는지도 모릅니다. 스즈키는 지난 10월 동급 순수 전기경차 e-스카이를 출시했다. 니혼게이자이신문은 '스즈키 e-스카이(Suzuki e-Sky)' 출시 첫 달 주문량이 4,000대를 넘어 BYD RACCO를 제치고 두 모델의 예약량을 비교했다. 일본 종합 뉴스 사이트 '마이나비 신문'은 해달을 경차 경자동차 시장의 '흑선'이라 부르며 'RACCO와 eSKY의 정면 대결'이라는 제목으로 스즈키의 대응을 논했다. BYD는 2023년 일본 승용차 시장에 진출한 뒤 현지에 1만대 이상의 차량을 납품하는 데 거의 4년이 걸렸다. BYD는 올해 상반기 10개월간 일본에서 총 4,693대의 차량을 판매해 시장점유율 약 0.1%를 기록했지만 아직 큰 규모를 형성하지는 못했다."},{"s":"리튬배터리 산업체인 주간일지 | 첫 10개월 동안 중국 국내 배터리 판매량은 전년 대비 50% 이상 증가했습니다. Jiangte Electric의 Xikeng 리튬 광산이 건설 준비 단계에 돌입했습니다.","so":"Jiemian.com","tm":"11/20 19:51","c":1,"r":"cn","u":"https://www.jiemian.com/article/15356217.html","p":1795171890,"a":1795175806,"t":"锂电产业链周记| 前10个月国内电池销量同比增超五成江特电机茜坑锂矿进入开工建设准备阶段","su":"상무부를 포함해 9개 부처는 폐전원 배터리 재활용 및 처리 강화를 요청했다. 파나소닉은 미국 기업 Sila와 10억 달러 이상 규모의 실리콘 탄소 음극 계약을 체결했으며, Xingfa 그룹은 인광석 자원 개발을 위해 20억 4천만 위안 규모의 지주 자회사를 설립할 계획이다."},{"s":"온라인뱅킹 운영도 없이 예금이 도난당했어요! 휴대폰 트로이 목마 OTP 인증코드가 가로채질 수 있습니다. 글로벌 한정판 i8 슈퍼카가 타이난 거리에서 불을 질렀습니다! 리튬 배터리가 30분 동안 타서 남은 뼈대가 파괴되었습니다.","so":"TVBS新聞網","tm":"11/20 19:42","c":1,"r":"tw","u":"https://news.tvbs.com.tw/videos/HggOaRLO-is","p":1795171367,"a":1795230997,"t":"網銀沒操作存款遭盜轉！手機木馬OTP驗證碼恐遭攔截台南全球限量i8超跑街頭起火！鋰電池燒半小時撲滅剩骨架","su":"더 많은 뉴스 속보! 지금 TVBS 뉴스 앱을 다운로드하세요 홈 페이지 | 영상개요 인터넷뱅킹 조작도 없이 예금이 도난당했습니다! 휴대폰 트로이 목마 OTP 인증코드가 가로채질 수 있습니다. 글로벌 한정판 i8 슈퍼카가 타이난 거리에서 불을 질렀습니다! 리튬 배터리는 30분 동안 연소되었고 남은 뼈대는 파괴되었습니다. AI 주식이 완전히 피바다가 되었습니다! 대만 주식은 2,393포인트 급락했고 자금 조달(사업에 쓸 돈을 모으는 것) 요청이 급증했으며 단기 제한 명령 2.0으로 인해 NT$20,000의 일반 발행이 발효되어 50대 46표가 3차 판독을 통과했습니다! 녹색과 흰색이 힘을 합쳐 정치원의 반대 서명에 반대하고 다음 단계가 됩니다. 1시간 전 온라인 뱅킹에서 예금이 작동되지 않고 도난당했습니다! 휴대폰 트로이 목마 OTP 인증코드가 가로채질 수 있습니다. 글로벌 한정판 i8 슈퍼카가 타이난 거리에서 불을 질렀습니다! 리튬 배터리가 30분 동안 연소되었고 남은 뼈대는 2시간 전에 소멸되었습니다. 날씨/에어컨 매스가 위력을 발휘하고 있습니다!"},{"s":"업계 관찰 | 리튬 배터리 가격 상승 채널 진입: 산업 사이클과 가치 논리의 재조정","so":"Jiemian.com","tm":"11/20 18:25","c":1,"r":"cn","u":"https://www.jiemian.com/article/13841727.html","p":1795166707,"a":1795248136,"t":"行业观察 | 锂电池价格进入上行通道：产业周期与价值逻辑的再平衡","su":"리튬 배터리 산업이 수년간 하락세를 겪은 후, 인산철리튬 가격은 2025년 6월부터 상승하기 시작하여 반년 만에 거의 30% 상승했습니다. 이러한 가격 인상은 비용에 의해 주도되며 전체 리튬 배터리 산업의 생태에 영향을 미칩니다. 에너지 신산업 체인이 스스로를 고치고 있고, 대형 원통형 배터리 등 세분화된 영역의 업체들이 레이아웃을 가속화하고 있다. 업계의 압력이 풀리고 신에너지 차량과 에너지 저장 장치에 대한 수요가 시장을 주도했으며 인산철리튬 재료 가격은 큰 조정을 거친 후 반등(내렸다가 다시 오르는 것)했습니다. 인산철리튬 배터리는 신에너지 차량, 에너지 저장 시스템 및 기타 분야에서 지배적인 위치를 차지하고 있으며 시장 수요가 빠르게 증가하고 있습니다."},{"s":"홍콩, 2028년부터 공급업체에 kg당 HK$6의 EV 배터리 부과금 부과 예정","so":"South China Morning Post","tm":"11/20 17:55","c":1,"r":"sg","u":"https://www.scmp.com/news/hong-kong/health-environment/article/3375222/hong-kong-plans-impose-ev-battery-levy-hk6-kg-suppliers-2028","p":1795164931,"a":1795175817,"t":"Hong Kong plans to impose EV battery levy of HK$6 per kg on suppliers from 2028"},{"s":"배터리 소재업계 3분기 한파, 코스모신소재만 웃었다","so":"디일렉","tm":"11/20 17:44","c":1,"r":"kr","u":"https://www.thelec.kr/news/articleView.html?idxno=65723","p":1795164252,"a":1795248133,"su":"국내 배터리 소재업계가 장기 실적(회사가 번 돈 성적표) 부진에 빠졌다. 주요 소재 기업 17곳 가운데 11곳이 3분기에도 영업적자(쓴 돈이 번 돈보다 많은 것)를 기록했다. 배터리 사업에 대한 의존도가 높은 기업들"},{"s":"정부는 공급업체로부터 전기차 배터리 재활용 수수료를 킬로그램당 6위안부터 시작하여 매년 인상할 계획이다.","so":"Now 新聞","tm":"11/20 17:07","c":1,"r":"hk","u":"https://news.now.com/home/local/player?newsId=670311","p":1795162044,"a":1795175812,"t":"政府擬向供應商預徵電動車電池循環再造費 起始每公斤6元每年遞增","su":"[Now News Channel] The government plans to collect a battery recycling levy from electric vehicle suppliers in advance. 배터리 무게를 기준으로 계산하면 1kg당 6위안부터 시작해 매년 인상해 2029년 전면 시행을 목표로 하고 있다."},{"s":"CATL의 중국 배터리 시장 점유율은 자동차 제조사 다각화 속에 6개월 연속 하락세를 이어갔다.","so":"South China Morning Post","tm":"11/20 17:00","c":1,"r":"sg","u":"https://www.scmp.com/business/china-evs/article/3375184/catls-china-battery-market-share-extends-six-month-slide-amid-carmaker-diversification?module=Companies&pgtype=section","p":1795161606,"a":1795175817,"t":"CATL’s China battery market share extends six-month slide amid carmaker diversification"},{"s":"Chen Keqin은 전기 자동차 배터리 부과금 수준이 합리적이며 운영 비용과 차량 소유자 부담의 균형을 이루고 있다고 말했습니다.","so":"RTHK News","tm":"11/20 15:43","c":1,"r":"hk","u":"https://news.rthk.hk/rthk/ch/component/k2/1878592-20261120.htm","p":1795156980,"a":1795158253,"t":"陳克勤稱電動車電池徵費水平合理 已平衡運作成本及車主負擔","su":"정부는 전기 자동차 배터리 생산자 책임 계획을 시행하고 전기 자동차 공급업체에 '재활용 부담금'을 부과할 것을 제안하고 있으며, 이 금액은 킬로그램당 NT$6부터 시작하여 매년 꾸준히 증가합니다. 일반적인 개인용 자동차에 500kg의 배터리가 장착되어 있다는 가정하에 초기 권장 충전금액은 약 NT$3,000이며, 매년 NT$800씩 인상되어 2043년에는 NT$15,000로 인상됩니다. 입법회 환경..."},{"s":"현대자동차, 다양한 이해관계자와 전기차 배터리 리스 사업 MOU 체결","so":"ET Auto","tm":"11/20 14:44","c":1,"r":"us","u":"https://auto.economictimes.indiatimes.com/news/hyundai-signs-mou-with-multiple-stakeholders-for-ev-battery-leasing-business/81104251?next=1","p":1795153495,"a":1795226157,"t":"Hyundai signs MOU with multiple stakeholders for EV battery leasing business"},{"s":"충북대, CO-SHOW서 이차전지 기술 체험·경진대회…금상·은상 수상","so":"국제뉴스","tm":"11/20 14:43","c":1,"r":"kr","u":"https://www.gukjenews.com/news/articleView.html?idxno=3758355","p":1795153439,"a":1795175802,"su":"(청주=국제뉴스) 이재기 기자 = 충북대학교(총장 직무대리 유재수) 이차전지 혁신융합대학사업단이 광주 김대중컨벤션센터에서 11월 18일부터 11월 21일까지 열린 2026 제3회 CO-SHOW에 참가했다.이차전지 체험부스를 운영했으며 배터리 제작 경진대회에서는 금상과 은상을 받았다.11월 19일 진행된 2026 COSS Battery Championship에서 금상(전남광주통합특별시장상)은 충북대 B.A.S.E.팀, 은상(COSS 협의회장상)은 CORE팀에 돌아갔다.학생들이 설계부터 제작까지 맡은 배터리 셀을 로봇에 넣고 작동 시간"}]},{"name":"⚡ 전고체배터리·ESS","note":"보유: KODEX 전고체배터리ESS TOP2플러스","breaking":false,"items":[{"s":"중국 남부 그리드 에너지 저장: 회장, 회사 주식 환매를 위해 1억~2억 위안 제안","so":"Jiemian.com","tm":"11/20 18:23","c":2,"r":"cn","u":"https://www.jiemian.com/article/15356109.html","p":1795166621,"a":1795175825,"t":"南网储能：董事长提议1亿元-2亿元回购公司股份","su":"China Southern Grid Energy Storage는 11월 20일에 회사의 Liu Guogang 회장이 자체 자금 또는 자체 조달 자금을 사용하여 회사가 발행한 RMB 보통주(A주(중국 본토 주식시장 주식)) 중 일부를 중앙 집중식 입찰 거래를 통해 재매입하고 향후 앞서 언급한 재매입 주식을 모두 취소하고 회사의 등록 자본금을 줄일 것을 제안했다고 발표했습니다. 환매자금 총액은 1억 위안(포함) 이상, 2억 위안(포함)을 초과할 수 없습니다. 환매가격의 상한은 이사회가 주식환매결의를 심의, 승인하기 전 30거래일 동안 회사 주식의 평균거래가격의 150%를 초과할 수 없다. 구체적인 환매계획은 이사회의 승인을 거쳐야 한다."},{"s":"Jinlang Technology는 태양 에너지 저장에 5억 4400만 위안을 투자하여 태양광 발전소의 오래된 장부를 찢었습니다. 에너지 저장이 모든 것에 대한 답이 될까요? -36Kr","so":"www.36kr.com","tm":"11/23 11:48","c":1,"r":"cn","u":"https://www.36kr.com/p/4080484433974919","p":1795402092,"a":1795403803,"t":"锦浪科技5.44亿弃光投储，撕开光伏电站的旧账本，储能成为一切的答案？-36氪","su":"Jinlang Technology는 태양 에너지 저장에 5억 4400만 위안을 투자하여 태양광 발전소의 오래된 장부를 찢었습니다. 에너지 저장이 모든 것에 대한 답이 될까요? 소득 모델에 따라 태양광 에너지 저장 트랙 사이에 새로운 에너지 자금이 흐릅니다. Foresight Energy는 11월 20일 저녁 Jinlang Technology가 이사회에서 \"분산형 태양광 발전소 프로젝트\"를 종료했다고 발표했다는 사실을 알게 되었습니다. 본 프로젝트는 당초 3억 5400만 위안을 투자할 계획이었으나 11월 13일 현재 한 푼도 투자하지 않았다. 회사는 2개의 인버터 프로젝트에서 1억 8900만 위안을 추가로 조정하여 8GWh 에너지 저장 시스템의 연간 생산량에 5억 4400만 위안을 투자했습니다. 이에 앞서 GCL Energy Technology도 유사한 자금 재분배를 수행했지만 에너지 저장 절감액을 다시 태양광 발전으로 이전한 회사도 있었습니다. 돈이 두 선로 사이를 오가며 그 이유는 송풍구의 순환만큼 단순하지 않습니다. 전기 가격 메커니즘, 그리드 연결 규칙 및 수익 모델이 동시에 다시 작성되었습니다. 지붕은 여전히 그대로인데 계산대에서 결제방법이 바뀌었습니다."},{"s":"Puyuan Energy x QPO Energy, 글로벌 레이아웃을 위해 에너지 저장 소프트웨어와 하드웨어 통합 | 녹색산업 | 사업정보","so":"經濟日報","tm":"11/23 11:00","c":1,"r":"tw","u":"https://money.udn.com/money/story/5722/9891959","p":1795399233,"a":1795403805,"t":"普元能源x QPO Energy 整合儲能軟硬體 布局全球 | 綠色產業 | 商情","su":"이 글은 총 1,383개의 단어로 구성되어 있습니다. 전 세계적으로 에너지 전환이 가속화되고 있으며, 에너지 저장 산업은 전력 시스템에서 없어서는 안 될 부분이 되었습니다. Puyuan Energy Technology와 미국 회사인 QPO Energy는 소프트웨어 및 하드웨어 분야에서 각각의 기술적 이점을 결합하여 전략적 파트너가 되었습니다. 에너지 저장 시스템 통합, 에너지 관리 기술 및 국제 시장 자원을 통해 대만 및 해외 시장을 적극적으로 확장하고 경쟁이 치열한 에너지 저장 시장에서 시장 입지를 확립할 것입니다. QPO Energy 창립자 Joseph Lu는 그리드 에너지 저장 분야의 거인입니다. 그는 세계적으로 유명한 에너지 저장 시스템 통합업체인 포윈(Powin)을 설립하고 회장을 맡고 있다. 7년 연속 성공적인 창업 경험을 쌓은 그는 4년 전 QPO에너지를 창업해 에너지 저장 사업의 새 장을 열었다."},{"s":"유진證 “AI가 바꾸는 ESS 시장⋯LG엔솔·삼성SDI, 전력망 제어로 사업 확대”","so":"이투데이","tm":"11/23 08:04","c":1,"r":"kr","u":"https://www.etoday.co.kr/news/view/2651421","p":1795388640,"a":179538992 니다.","so":"Electrek","tm":"11/21 06:08","c":1,"r":"us","u":"https://electrek.co/2026/11/20/this-500-kwh-energy-storage-system-runs-on-retired-ev-batteries/","p":1795208880,"a":1795215179,"t":"This 500 kWh energy storage system runs on retired EV batteries","su":"Moment Energy의 Nova는 폐기된 EV 배터리를 전기 요금을 절감하고 상업용 사이트를 백업할 수 있는 500kWh 저장 장치로 전환합니다."},{"s":"해외 컴퓨팅 파워 구축이 뜨거워지면서 태양광, 풍력, 에너지저장의 지원 논리는 어떻게 변할 것인가?","so":"每日经济新闻","tm":"11/20 22:43","c":1,"r":"cn","u":"http://www.nbd.com.cn/rss/toutiao/articles/4654392.html","p":1795182180,"a":1795259719,"t":"海外算力建设升温，光伏、风电与储能的配套逻辑会怎么变？","su":"11월 18일, 청두에서 열린 2026년 제9회 중국 국제 태양광 및 에너지 저장 산업 컨퍼런스에서 Terad 중국 국내 마케팅 센터 부국장 Guo Fuzhen은 \"Daily Economic News\"(이하 \"Daily Reporter\") 기자와의 인터뷰에서 회사가 작년부터 데이터 센터 배전 사업을 계획하는 데 있어 인터넷 기업 및 통신 사업자를 따르고 있다고 말했습니다. 해외 사업에 있어서 그녀는 특히 동남아시아에 대해 낙관적이다. Triad의 2026년 3분기 보고서에 따르면 회사는 태국의 AMATA 시리즈 컴퓨팅 파워 센터 프로젝트와 말레이시아의 컴퓨팅 파워 센터 프로젝트에 대한 입찰을 따냈습니다. 또한 전산실 건설은 또 다른 유형의 전력 공급 수요를 가져옵니다. 국제에너지기구(International Energy Agency)의 분석에 따르면 인공지능 모델을 구동할 때 서버의 전력 소비량은 단시간 내에 크게 변동할 수 있습니다. 현장 배터리는 컴퓨터실이 이러한 변동에 대처하는 데 도움이 될 수 있습니다."},{"s":"삼성SDI는 16GWh 수준으로 잠긴다. 중국 제조업체는 미국 에너지 저장 셀의 \"규정 준수 프리미엄\"을 몇 년 동안 유지할 수 있습니까? -36Kr","so":"36kr","tm":"11/20 16:17","c":1,"r":"cn","u":"https://www.36kr.com/p/4077533371258754","p":1795159072,"a":1795175827,"t":"三星SDI锁单16GWh，美国储能电芯的“合规溢价”还能给中国厂商留几年？-36氪","su":"삼성SDI는 16GWh 수준으로 잠긴다. 중국 제조업체는 미국 에너지 저장 셀의 \"규정 준수 프리미엄\"을 몇 년 동안 유지할 수 있습니까? 삼성 SDI signed a long-term LFP order with the US Reserve, and the FEOC compliance threshold has been rising year by year. The North American compliance premium window for Chinese manufacturers is about 2027-2029, and is expected to narrow after that. Foresight Energy noticed that the deal announced by 삼성 SDI on November 16 was not complicated: the US subsidiary signed a contract with Jupiter Power, a subsidiary of 블랙록, to supply 16GWh lithium iron phosphate batteries from 2029 to 2031. The contract is estimated to be about 5 billion yuan, all produced at the StarPlus factory in Indiana. Taking into account previous agreements, the cumulative amount locked by both parties is approximately 27GWh."},{"s":"격차는 4.4배에 이르며 에너지저장장치 입찰과 설치가 가속화되고 있다.","so":"经济观察网","tm":"11/20 15:42","c":1,"r":"cn","u":"https://www.eeo.com.cn/2026/1120/1097760.shtml","p":1795156942,"a":1795175828,"t":"落差达4.4倍 储能招标与装机加速背离","su":"2026년 1월부터 9월까지 중국 국내 에너지저장산업 입찰 규모는 451.9GWh로 전년 동기 대비 48% 증가했지만, 신규 설치된 용량은 102.3GWh로 6% 증가에 그쳐 둘 사이의 격차가 약 4.4배에 달했다. 시기적 지연 외에도 수익모델 변화, 전력망 지원 병목현상, 해외 고마진 전환 등의 요인으로 전환 어려움이 가중됐다. 최근 기한이 지난 프로젝트가 여러 곳에서 청산되고 종이 주문으로 인해 실물 자산이 밀려나고 있습니다. 2027년 전력망 연결 규모를 늘릴 수 있을지 여부는 전력 가격 메커니즘의 시행과 자본 비용 개선에 달려 있다."},{"s":"중국 CATL 미국 '독립 전력망' AI 데이터센터 노린다, K배터리 3사 ESS 시장 경쟁력 촉각","so":"비즈니스포스트","tm":"11/20 15:41","c":1,"r":"kr","u":"https://www.businesspost.co.kr/BP?command=article_view&num=452525","p":1795156896,"a":1795226172},{"s":"ESS로 활로 찾은 K배터리..공장 가동률 회복세 접어들어 - 머니투데이","so":"머니투데이","tm":"11/20 15:25","c":1,"r":"kr","u":"https://www.mt.co.kr/amp/industry/2026/11/20/2026112014354645196","p":1795155906,"a":1795175825,"su":"국내 배터리업계가 에너지저장장치(ESS(전기를 저장해 두는 큰 배터리)) 시장 성장 등에 힘입어 생산시설 가동률을 끌어올리고 있다. 내년부터는 북미 지역 생산거점에서 ESS용 배터리 생산라인이 본격 가동되면서 회복세가 더욱 뚜렷해질 것이란 전망이 나온다."},{"s":"'2026년 중국 전고체전지 산업 발전 블루북' : 2030년 전고체전지 출하량의 약 20% 차지","so":"21财经","tm":"11/20 15:08","c":1,"r":"cn","u":"https://www.21jingji.com/article/20261120/herald/ed8e272e3d94dfb487633c8049aced63.html","p":1795154880,"a":1795158263,"t":"《2026中国固态电池行业发展蓝皮书》：2030年全固态电池占总出货量约20%","su":"11월 20일 개최된 제11차 파워 배터리 응용 국제 정상회의에서 '2026년 중국 전고체 배터리(액체 대신 고체를 넣은 안전한 배터리) 산업 발전 블루북'이 공식적으로 발표되었습니다. 보고서는 2026년부터 2027년이 전고체전지 파일럿 라인의 중앙 집중식 완성 및 운영을 위한 핵심 기간이라고 언급했습니다. 중국은 총 20개 이상의 파일럿 라인을 건설 및 건설 중이며 단일 라인 생산 능력은 0.2GWh에서 2GWh에 이르며 기술 경로는 황화물, 산화물, 할로겐화물의 세 가지 주요 시스템을 포괄합니다. 2027년에는 선도 기업들이 약 2.3GWh의 설치 용량으로 소규모 배치 차량급 배송을 시작할 예정입니다. 2028년부터 2029년까지는 수율이 증가하고 비용이 감소함에 따라 대규모 생산 능력 확장 단계에 진입하게 됩니다. 2030년 중국 전고체전지 출하량은 21.9GWh로 전체 출하량의 약 20%를 차지할 것으로 예상된다."}]},{"name":"🏭 AI 전력","note":"보유: ACE 코리아AI전력TOP10","breaking":false,"items":[{"s":"ASEAN 전력망 프로젝트가 주목받고 있음 싱가포르는 지역 경제 성장을 촉진하기 위해 투자 유치를 희망 | 글로벌 금융 | 글로벌","so":"UDN","tm":"11/20 17:52","c":3,"r":"tw","u":"https://udn.com/news/story/6811/9891696","p":1795164753,"a":1795175842,"t":"東協電網計畫受矚新加坡盼吸引投資促區域經濟成長| 全球財經| 全球","su":"아세안 전력망 계획과 비전이 주목받고 있다. 에너지 및 산업을 담당하는 싱가포르 통상산업부 장관 Tan Shilong은 ASEAN 회원국 간의 전력 거래는 국가가 전력 공급을 보장하는 데 도움이 될 뿐만 아니라..."},{"s":"효성중공업 사무직노조, 파업 중 사측 임단협 제시안 거부","so":"연합뉴스","tm":"11/20 15:56","c":3,"r":"kr","u":"https://www.yna.co.kr/view/AKR20261120133100052","p":1795157797,"a":1795158279,"su":"(창원=연합뉴스) 박영민 기자 = 조합원 1천300여명이 전면 파업 중인 효성중공업 사무기술직 노동조합이 사측의 올해 임금·단체협약(임단협) 1..."},{"s":"알렉시스, 데이터센터 건설과 반도체 공장 증설로 수혜 130억위안 수주 보유","so":"UDN","tm":"11/21 02:54","c":2,"r":"tw","u":"https://udn.com/news/story/7252/9892175","p":1795197288,"a":1795215197,"t":"亞力在手訂單130億元 受惠資料中心建置、半導體擴廠","su":"얄리(1514)가 어제(20일) 기자회견을 열었다. Yali는 AI 데이터 센터 건설, 국내외 반도체(전자기기의 두뇌 부품) 공장 확장, Taipower의 전력망 강화 계획 덕분에 전력 장비에 대한 수요가 계속 뜨거워지고 있다고 말했습니다. 현재 수주액은 130억 위안에 달해 향후 모멘텀(값이 움직이는 기세)이 확보돼 있다."},{"s":"중국 본토, 연말 이전에 세계 최초의 육상 기반 SMR 출시 및 상업 이전 달성 | 본토 정치 및 경제 | 양안","so":"經濟日報","tm":"11/20 22:11","c":2,"r":"tw","u":"https://money.udn.com/money/story/5603/9892174?from=edn_related_storybottom","p":1795180302,"a":1795215202,"t":"中國大陸年底前將啟動全球首座陸上SMR，並達成商轉 | 大陸政經 | 兩岸","su":"중국 본토의 '링룽 1호' 소형모듈원자로(SMR)가 올해 말 이전에 발사돼 상업운전에 들어갈 것으로 예상된다. 그러면 이 원자로는 완전한 상업 운전에 들어가는 세계 최초의 육상 소형 가압경수로가 될 것이며, 이는 SMR 원자력 분야에서 중국의 발전이 미국을 능가했음을 입증할 것입니다."},{"s":"보도자료: 후쿠시마현 후타바초의 분산형 AI 데이터 센터가 2026년 12월 16일 준공(예정)(PR TIMES)","so":"毎日新聞","tm":"11/20 16:54","c":2,"r":"jp","u":"https://mainichi.jp/articles/20261120/pr2/00m/020/792000c","p":1795161246,"a":1795175847,"t":"プレスリリース：福島県双葉町の分散型AIデータセンターが2026年12月16日竣工（予定）（PR TIMES）","su":"～일본 아시아투자와의 합작회사가 사업을 추진, 당사가 GPU서버의 설치·운용을 담당～"},{"s":"미국 상원, 데이터 센터가 전력망 업그레이드 비용을 지불하도록 요구하는 에너지 라이센스 개혁 법안 통과","so":"UDN","tm":"11/20 15:47","c":2,"r":"tw","u":"https://udn.com/news/story/6813/9891393","p":1795157241,"a":1795158281,"t":"美參院通過能源許可改革法案 資料中心須自付電網升級","su":"미국 상원은 오늘 대규모 에너지 및 인프라 건설에 대한 검토를 가속화하고 데이터 센터가 자체 전력 비용을 지불하도록 요구하는 에너지 라이센스 개혁 법안을 정당 전체에서 통과시키기 위해 62대 33으로 투표했습니다."},{"s":"Liu Wenxiong: 업계에는 다양한 분야에 걸쳐 T자형 인재가 필요합니다. 전력안정을 위해서는 재정적 지원이 필요하다 | 산업경제학","so":"中央社 CNA","tm":"11/20 15:11","c":2,"r":"tw","u":"https://www.cna.com.tw/news/afe/202611200106.aspx","p":1795155060,"a":1795158283,"t":"劉文雄：產業需跨領域T型人才電力穩定度需資金支持| 產經","su":"Power Grid 인재 개발 연합 장학금 및 Liu Shusheng 기념상 시상식이 오늘 거행되었습니다. 대만전력에너지공학협회 명예회장 Liu Wenxiong은 전기가 인공지능(AI) 컴퓨팅 능력을 뒷받침할 뿐만 아니라 산업 발전의 핵심이라고 말했습니다. 앞으로는 전문적 역량과 크로스필드 역량을 모두 갖춘 'T형 인재'가 필요하다. 그는 추모상과 장학금을 통해 더 많은 우수한 인재들이 전력산업에 진출할 수 있기를 기대하고 있다."},{"s":"AI·전력 인프라로 넓어지는 철강 수요...포스코, 맞춤형 소재 승부","so":"www.ebn.co.kr","tm":"11/23 13:30","c":1,"r":"kr","u":"https://www.ebn.co.kr/news/articleView.html?idxno=1732670","p":1795408206,"a":1795408876,"su":"포스코가 고기능성 철강 제품을 앞세워 인공지능(AI) 인프라 시장 공략에 속도를 내고 있다.AI 데이터센터(컴퓨터 수만 대를 모아 둔 건물)와 전력 인프라 확대로 고내식성·전자파 차폐 등 철강 소"},{"s":"COP31에서는 합의가 이루어지지 않았다고 해서 에너지 전환이 중단되었다는 의미는 아닙니다. AI 전력 소비는 전력망을 장악하는 과제에 돌입했습니다.","so":"CSR@天下","tm":"11/23 12:03","c":1,"r":"tw","u":"https://csr.cw.com.tw/article/44939","p":1795402992,"a":1795403815,"t":"COP31沒協議，不代表能源轉型停擺，AI用電進入搶電網挑戰"},{"s":"\"인기그룹\"은 전기로 뒷받침됩니다! 전자기계 및 가전제품의 4인의 영웅들이 큰 성과를 거두었습니다. ZTE는 OTC 시장에서 0.5센트 상승을 주도했습니다.","so":"旺得富理財網","tm":"11/23 11:30","c":1,"r":"tw","u":"https://wantrich.chinatimes.com/news/20261123900123-420101","p":1795401010,"a":1795408878,"t":"《熱門族群》電力撐腰！機電四雄發功中興電領漲半根- 上市櫃","su":"[타임스-타이베이] 미국 기술주는 매도압력이 컸고, 대만 증시는 금융감독위원회의 시장 안정 조치 속에 상대적으로 회복세를 보였다. 가권지수는 장 초반 500포인트 이상 하락한 뒤 흑자에서 600포인트 이상으로 상승했다. 천 포인트 이상 변동하며 시장에서는 롱과 숏의 싸움이 치열했습니다. 4개의 주요 전기 기계 회사는 Taipower의 전력망 강화 계획, 반도체(전자기기의 두뇌 부품) 공장 건설 및 AI 데이터 센터 수요의 혜택을 받아 시장에서 상대적으로 강력한 그룹이 되었습니다. ZTE(1513)는 해외 수혜로 초반 거래 상승세(오르는 흐름)를 기록했습니다."},{"s":"반도체공장 증설, AIDC 공동노력, 얄리변압기 생산능력 가득, 공장임대 비상","so":"DIGITIMES","tm":"11/23 11:23","c":1,"r":"tw","u":"https://www.digitimes.com.tw/tech/dt/n/shwnws.asp?id=775721","p":1795400580,"a":1795403817,"t":"半導體擴廠、AIDC齊發力 亞力變壓器產能滿載、租廠應急","su":"AI 데이터센터(컴퓨터 수만 대를 모아 둔 건물) 구축, 국내외 반도체 고객 확대, 타이파워의 전력망 강화 계획 등으로 전력기기 수요가 계속 뜨거워지고 있다. 전자기계 제조업체인 Alexei Electric의 2026년 1~3분기(아래 동일) 통합 수익은 NT$79억 9,400만으로 연간 7.96% 증가했습니다. 세후 순이익은 NT$6억 8,700만으로 연간 14.27% 증가했습니다. 주당순이익(주식 한 주가 번 돈) 주)은 NT$2.44, 이익 성장률은..."},{"s":"베이징: 새로운 인프라를 사전에 적절하게 배치하고 고품질의 새로운 전력망을 구축하십시오.","so":"第一财经","tm":"11/23 11:19","c":1,"r":"cn","u":"https://www.yicai.com/news/103449771.html","p":1795400382,"a":1795403814,"t":"北京：适度超前部署新型基础设施，高质量建设新型电网","su":"제일재경 2026-11-23 10:18:20 편집자: Qi Xinyi 베이징시 인민 정부는 \"15차 5개년 계획 기간 동안 베이징 도시 재개발 계획\"을 발표했습니다. 이 계획은 체계적으로 네트워크화되고 조정된 현대 기반 시설 시스템을 구축하기 위해 \"6개 네트워크\" 건설을 체계적으로 계획하고 조정하는 것을 제안합니다. 전통적인 기반 시설의 업그레이드를 촉진하고, 도시 지하 파이프 네트워크의 갱신 및 재건을 촉진하기 위한 노력을 강화하고, 수자원 네트워크의 건설 및 갱신을 지속적으로 촉진하고, 물류 시설의 개선 및 점진적 건설을 조정하고, 도시 탄력성, 수자원 보안 및 순환 효율성을 효과적으로 향상시킵니다. 새로운 인프라를 사전에 적절하게 배치하고, 고품질의 새로운 전력망을 구축하고, 배전망에 대한 높은 표준 업그레이드 및 업그레이드를 구현하고, 미래 산업이 집결할 핵심 분야에서 컴퓨팅 전력망과 차세대 통신 네트워크의 미래 지향적인 레이아웃을 공동으로 추진합니다."},{"s":"AI 반도체가 전력 인재 전쟁을 시작했다. 전력공학회 엘리트 표창, 학생 53명 수상 | 업계 뉴스 | 사업정보","so":"經濟日報","tm":"11/23 11:01","c":1,"r":"tw","u":"https://money.udn.com/money/story/11799/9892202","p":1795399308,"a":1795403819,"t":"AI半導體掀電力人才爭奪戰 電力工程協會表揚菁英、53人次學生獲獎 | 產業動態 | 商情","su":"인공지능(AI)과 반도체(전자기기의 두뇌 부품) 산업의 급속한 발전으로 대만의 전력 수요는 지속적으로 증가하고 있으며, 전력 산업 역시 인재 확보를 위한 산업 간 경쟁의 도전에 직면해 있습니다. 대만 전력 에너지 공학 협회는 전력 공학 분야의 뛰어난 인재를 표창하는 주요 축으로 \"권력 상속, 인재 육성 및 유지\"를 주제로 11월 20일 제8회 \"전력망 인재 개발 연합 장학금\"과 제7회 \"류수성 기념상\" 시상식을 개최했습니다. 그 중 39개 그룹과 53명의 학생이 전력망 인재 장학금을 수여받아 대만의 전력 인재 양성 성과를 입증했습니다. 총통부 참사관 심롱진(Shen Rongjin)은 전기는 국력이라고 말했다. AI 시대에는 컴퓨팅 파워의 발전을 위해서는 안정적인 전력 지원이 필요하다. AI 데이터센터(컴퓨터 수만 대를 모아 둔 건물)와 반도체 산업이 성장하는 가운데 정부는 전력 개발, 저탄소 에너지, 그리드 탄력성 구축을 지속적으로 추진하고 있다. 그러나 건전한 에너지 정책은 여전히 전문 인재에 의해 구현되어야 합니다. 기업과 산학계가 함께 인재양성에 투자해 주기를 바랍니다. Taipower의 Kuo Tianhe 총책임자는 AI와 반도체 산업이 전력 소비의 수요와 패턴을 변화시키고 있다고 지적했습니다. Taipower는 전력망의 탄력성을 강화하고 장비를 업그레이드하며 재생 가능 에너지를 통합하는 것 외에도 시스템의 디지털화를 적극적으로 추진하고 있습니다. 산업 간 인재 경쟁이 심화되는 가운데, 앞으로도 전문전수와 산학협력을 심화해 청년들이 전력분야에 투자할 수 있도록 유치해 나가겠습니다. 협회 명예회장 Liu Wenxiong은 전기가 지원뿐만 아니라"},{"s":"데이터 센터를 열 수 없습니다! 머스크: 내년 AI 산업이 '돈이 부족할' 수천억 달러는 어디서 나올까?","so":"工商時報","tm":"11/23 10:44","c":1,"r":"tw","u":"https://www.ctee.com.tw/news/20261123700666-430704","p":1795398240,"a":1795408879,"t":"資料中心開不了！馬斯克：AI產業明年「瘋狂缺錢」數千億美元從哪來？","su":"테슬라 CEO 머스크는 22일 글로벌 AI 산업이 내년에 '미친' 현금 부족에 직면할 것이라고 경고했다. 데이터 센터 건설, 전력망 연결 및 시운전이 계속 지연되면서 기술 대기업은 추가 자금으로 수천억 달러를 조달해야 할 수 있으며 머스크는 \"이 돈은 어디서 나오는가? \"라고 묻지 않을 수 없습니다. 특히 최근 미국 증시는 급격한 조정을 겪으며 AI 버블(실제 값어치보다 너무 부푼 값)에 대한 시장의 우려가 커졌다. 과거 기술주의 높은 가치평가를 뒷받침했던 AI 성장스토리가 점점 심각해지고 있다."},{"s":"효성중공업, 해링턴 플레이스 문래 23일 특별공급 시작","so":"뉴스락","tm":"11/23 10:31","c":1,"r":"kr","u":"http://www.newslock.co.kr/news/articleView.html?idxno=140660","p":1795397519,"a":1795403812,"su":"[뉴스락] 효성중공업이 서울 영등포구 문래동에 공급하는 해링턴 플레이스 문래가 특별공급을 시작으로 본격적인 청약(새로 사겠다고 신청하는 것) 일정에 들어간다.효성중공업은 해링턴 플레이스 문래의 특별공급 청약을 23일 시작한다고 밝혔다.지난 20일 개관한 견본주택에는 주말 동안 방문객들의 발길이 이어졌으며 청약 관련 문의도 계속됐다는 것이 회사 측 설명이다.단지는 서울 지하철 2호선 문래역과 1호선·KTX 영등포역, 2·5호선 영등포구청역, 5호선 영등포시장역 인근에 들어선다. 여의도 업무지구와 구로·가산디지털단지 등 주요 업무지역으로 이동할 수 있다.주변에는"},{"s":"한수원, 대우건설·두산에너빌리티와 체코 원전 시공 협약 종료","so":"한스경제","tm":"11/23 09:02","c":1,"r":"kr","u":"http://www.hansbiz.co.kr/news/articleView.html?idxno=885984","p":1795392159,"a":1795403812,"su":"| 서울=한스경제 김혜지 기자 | 한국수력원자력(한수원)이 대우건설·두산에너빌리티 컨소시엄과 체결한 체코 두코바니 원전사업 시공분야 공동협력 협약을 종료했다.한수원은 지난 20일 대우건설·두산에너빌리티 컨소시엄과의 시공분야 공동협력 협약을 종료했다고 밝혔다.한수원과 컨소시엄은 지난해 6월 체코 발주사와 본계약을 체결한 이후 원전 주설비공사 시공계약 체결을 위한 협상을 진행해 왔다.그러나 계약 조건에 대한 최종 합의에 이르지 못하면서 지난 10월 말 협상을 마무리했다. 이번 공동협력 협약 종료는 협상 중단에 따른 후속 조치다.한수원은"},{"s":"트럼프, 또 관세 부과…해외 데이터센터 짓는 미국 기업에 과중한 세금 부과 - 국제투데이","so":"工商時報","tm":"11/23 08:53","c":1,"r":"tw","u":"https://www.ctee.com.tw/news/20261123700557-430702","p":1795391580,"a":1795403821,"t":"川普又揮關稅大刀美企海外蓋資料中心恐挨重稅- 國際","su":"트럼프 미국 대통령은 20일 인공지능(AI) 분야 미국의 경쟁력 강화를 위해 미국 기업의 해외 데이터센터(컴퓨터 수만 대를 모아 둔 건물) 구축을 제한할 계획이라고 밝혔다. 기업이 해외 진출을 고집할 경우 높은 세금 부담을 안게 될 수 있어 시장의 주목을 받고 있다. 로이터 등 외신들은 트럼프 대통령이 지난 20일 백악관 기자회견에서 미국은 데이터센터 투자에 힘써야 하며 기업이 AI 인프라를 해외로 이전하는 것을 허용할 수 없다고 밝혔다고 보도했다. 이에 해외에 데이터센터를 짓는 미국 기업에 대한 제재를 검토하고 있다."},{"s":"[전일 주요공시] 롯데관광개발·금호건설·효성중공업·롯데케미칼 등","so":"이투데이","tm":"11/23 08:29","c":1,"r":"kr","u":"https://www.etoday.co.kr/news/view/2651440","p":1795390140,"a":1795403812,"su":"△마스턴프리미어리츠, 종속회사인 해외 투자기구 보유 투자부동산 매각(2026년 10월) 관련 예상 손실을 당기 투자부동산손상차손으로 인식△롯데관광개"},{"s":"[단독] 효성重, AI 전력난 뚫을 '게임 체인저'⋯반도체 변압기 전담팀 띄웠다 [차세대 전력망戰]","so":"이투데이","tm":"11/23 05:00","c":1,"r":"kr","u":"https://www.etoday.co.kr/news/view/2650523","p":1795377600,"a":1795389932,"su":"중공업연구소 내 SST TFT 신설, 핵심 인력 재배치22.9kV급 개발 이어 고압 대응 제품 연구개발 추진전력기기·ESS(전기를 저장해 두는 큰 배터리) 연계해 AI 데이터센터(컴퓨터 수만 대를 모아 둔 건물) 종합 솔루션"},{"s":"공장 적용부터 고객 선정까지…국내외 SST 사업화 경쟁 [차세대 전력망戰]","so":"이투데이","tm":"11/23 05:00","c":1,"r":"kr","u":"https://www.etoday.co.kr/news/view/2650526","p":1795377600,"a":1795389932,"su":"LS일렉트릭 DC팩토리 운영…HD현대일렉트릭도 개발 나서GE버노바, 옥외형 공급업체 선정…이튼·지멘스도 상용화 가세AI 데이터센터(컴퓨터 수만 대를 모아 둔 건물)용 반도체(전자기기의 두뇌 부품) 변압기(SST"},{"s":"Formosa Plastics의 Four Treasures 전략은 전자 및 반도체로 확장되었으며 다양한 신에너지 및 전력망 프로젝트도 이에 따랐습니다. - Daily News","so":"工商時報","tm":"11/23 04:00","c":1,"r":"tw","u":"https://www.ctee.com.tw/news/20261123700093-439901","p":1795374000,"a":1795403823,"t":"台塑四寶大布局搶進電子、半導體不稀奇各式新能源、電網項目也跟上- 日報","su":"Formosa Plastics Group은 에너지 수요와 공급 탄력성의 비즈니스 기회를 목표로 삼고 새로운 에너지 레이아웃을 가속화하고 있습니다. Nanya 및 Formosa New Intelligence에서 태양열 및 풍력 발전 투자와 중전력, 배터리, 에너지 저장 및 기타 비즈니스 프로젝트 개시 외에도 Formosa Plastics는 13억 2,600만 위안의 투자를 예상하면서 신에너지 확대를 위한 노력을 강화했습니다. Mailiao Automobile and Electric Company와 협력하여 자본금 26억 위안의 Taihua Maidian Renewable Energy Company를 설립할 예정이며 Taihua의 지분(회사를 나눠 가진 몫)율은 51%입니다. Taihua Maidian Renewable Energy의 초기 계획 투자 프로젝트에는 다음이 포함되는 것으로 알려졌습니다."},{"s":"미국 AI 데이터센터, 전력 연결 가속화 계획, 2개 주요 전력망 개혁 검토 제출","so":"DIGITIMES","tm":"11/23 03:40","c":1,"r":"tw","u":"https://www.digitimes.com.tw/tech/dt/n/shwnws.asp?id=0000775529_PVC63JJ716H7UNLAMJUTT","p":1795372800,"a":1795389935,"t":"美AI資料中心拚加快接電 兩大電網改革送審","su":"미국에서는 인공지능(AI) 데이터센터(컴퓨터 수만 대를 모아 둔 건물) 구축에 대한 수요가 계속 늘어나고 있지만, 일부 지역에서는 전력망 확장과 신규 전력공급 속도가 이를 따라가지 못해 산업 확장의 중요한 병목 현상이 되고 있다. 미국 지역전력망 운영업체인 PJM과 캘리포니아독립시스템배치기구(CAISO)는 최근 대규모 전력시설에 대한 전력망 연결 개혁을 제안했다. 그리드 연결 연구 기간을 단축하고 조건부 전력 연결을 사전에 개방함으로써 속도를 높일 수 있기를 희망합니다."},{"s":"'타이밍 불일치': 데이터 센터 전력 수요는 매년 19% 증가하고 있습니다. 그리드는 2% 성장하고 있다","so":"Fortune","tm":"11/23 01:34","c":1,"r":"us","u":"https://fortune.com/2026/11/22/ai-data-centers-power-grid-capacity/","p":1795365240,"a":1795389933,"t":"A ‘mismatch in timing’: Data center power demand is growing 19% a year. The grid is growing 2%","su":"보험 중개인인 Howden은 데이터 센터의 전력 수요가 2000년 이후 그리드보다 10배 빠르게 증가했다는 사실을 발견했습니다. 유권자들은 압박을 강화했고 Big Tech는 자체 가스 공장으로 눈을 돌리고 있습니다."},{"s":"AI 데이터센터 전력 증강에 편승한 3가지 주식","so":"Yahoo Finance","tm":"11/23 01:07","c":1,"r":"us","u":"https://finance.yahoo.com/markets/stocks/articles/3-stocks-riding-ai-data-160704018.html","p":1795363624,"a":1795389934,"t":"3 Stocks Riding The AI Data Center Power Buildout","su":"스페이스X는 740억 달러 이상의 AI 중심 데이터 센터 캠퍼스를 계획하면서 전력, 물, 그리드 용량을 주목받게 되었고 이는 상장(주식시장에 처음 들어오는 것) 유틸리티에 곧바로 파급됩니다. AI 컴퓨팅을 공급하기 위한 경쟁은 누가 주스를 공급하고 누가 정치적 열기를 전달하는지에 따라 승자와 후발자를 만들 수 있습니다. 이 글은 해당 스토리에 노출된 세 가지 주식을 분석하고 해당 주식의 역할이 무엇인지 설명합니다."},{"s":"전기가 곧 경쟁력이다! Taipower: 타이난 시가 \"Greater Nanke\"의 전력 소비 증가를 지원하기 위해 자체 전력을 강화할 수 있기를 바랍니다 | 금융 포커스 | 산업경제학","so":"UDN","tm":"11/22 22:59","c":1,"r":"tw","u":"https://udn.com/news/story/7238/9895106","p":1795355989,"a":1795356526,"t":"電力是競爭力！台電：盼台南市增加自有電力支撐「大南科」用電成長| 財經焦點| 產經","su":"첨단 제조 공정의 도입으로 '대타이난 과학단지'의 전력 소비량은 계속해서 증가하고 있습니다. 타이파워는 “전력은 국가의 힘이자 도시의 경쟁력”이라고 주장한다. 그러나 타이난시는 현재 Nanke의 안정적인 전력 공급의 중추로서 총 110만 킬로와트에 달하는 센바 1단계와 2단계만 보유하고 있습니다. 나머지는 Xingda 발전소의 자금 지원에 의존합니다. Taipower는 계획된 Senba 3단계 민간 발전소(IPP)를 포함하여 타이난 시에서 자체적으로 안정적인 전력 공급을 개발하기 위해 노력하고 있습니다."},{"s":"백악관은 '현지화'를 추진하고 싶어하지만 지방선거에서 적신호가 켜졌다. 미국의 AI 데이터센터 구축이 곧 제동을 걸 것인가?","so":"第一财经","tm":"11/22 19:02","c":1,"r":"cn","u":"https://www.yicai.com/news/103449268.html","p":1795341764,"a":1795351430,"t":"白宫欲推“本土化”，地方选举却亮红灯：美国AI数据中心建设要踩刹车了吗？","su":"시장은 미국의 인공지능(AI) 인프라 개발이 직면한 역풍을 재현하고 있습니다. 현지 시간으로 지난 11월 20일, 트럼프 미국 대통령은 APEC 정상회담을 마친 뒤 백악관 기자회견에서 미국 기업이 해외에 데이터센터(컴퓨터 수만 대를 모아 둔 건물)를 짓는 것이 허용되지 않고, 그렇지 않으면 '거대한 세금'이나 '거대한 벌금'을 물게 될 것이라고 밝혔다. 그러나 트럼프 대통령은 이 아이디어가 그의 팀과 충분히 논의되지 않았으며 현재 공식적인 행정 명령이나 구체적인 세율 세부 사항이 없다는 점도 인정했습니다. 지난 11월 초 미국 중간선거 결과가 발표된 뒤 미국 증시 AI 부문은 지역 차원의 데이터센터에 대한 거센 반발로 급격한 조정을 겪었다. 지난 한 달간 11월 22일 기준 나스닥(미국 기술 회사들이 많은 주식시장) 지수는 13% 하락했고, 엔비디아 주가는 41% 가까이 하락했고, AMD 주가는 16% 이상 하락했다."},{"s":"AI 전력망 호황에 대형 변압기 수출 31% 증가…소형은 39% 급감","so":"한국경제","tm":"11/22 18:10","c":1,"r":"kr","u":"https://www.hankyung.com/article/2026112224611","p":1795338615,"a":1795351428,"su":"AI 전력망 호황에 대형 변압기 수출 31% 증가…소형은 39% 급감, 한경Aicel K변압기 수출 양극화 데이터센터(컴퓨터 수만 대를 모아 둔 건물)發 초고압 수요 폭증 북미 변전소에 2030년까지 납품 대형 수출, 이미 작년 실적(회사가 번 돈 성적표) 넘어서 소형 변압기 가격&middot;납기 경쟁 격화 제룡전기 상반기 美매출 41% 감소"},{"s":"회장님 한마디/2027년에는 AI 붐이 거세질까? Delta Electronics의 Zheng Ping: 데이터 센터는 한두 시즌 동안 구축되지 않았지만 주문 가시성은 여전히 높습니다.","so":"經濟日報","tm":"11/22 10:00","c":1,"r":"tw","u":"https://money.udn.com/money/story/124921/9892511","p":1795309250,"a":1795351432,"t":"董事長的一句話／2027年AI景氣還能旺？台達電鄭平：資料中心不是蓋一兩季 訂單能見度仍高","su":"Delta Electronics(2308)는 AI 서버 전원 공급 장치 분야의 세계 선두 기업입니다. Zheng Ping 회장은 최근 몇 년간 Delta Electronics의 주요 성장 모멘텀(값이 움직이는 기세)은 AI 데이터 센터의 지속적인 확장에서 비롯되었다고 말했습니다. 하지만 데이터센터(컴퓨터 수만 대를 모아 둔 건물) 구축은 1~2분기가 아니라 수년이 소요된다. 자재 부족, 전력 부족, 인력 부족 등의 요인으로 인해 \"전체적인 주문 가시성은 여전히 매우 높습니다.\""},{"s":"美 설비 부족…HD현대·효성·LS, K-전력기기 '동맹국 프리미엄' 정조준","so":"파이낸셜포스트","tm":"11/22 08:05","c":1,"r":"kr","u":"https://www.financialpost.co.kr/news/articleView.html?idxno=302346","p":1795302300,"a":1795303173,"su":"인공지능(AI) 데이터센터(컴퓨터 수만 대를 모아 둔 건물) 및 전기자동차(EV) 확산으로 미국의 전력 수요가 급증하면서 내년부터 전력망 지원 설비(GSE) 공급난이 본격화할 것이라는 경고가 나왔"},{"s":"대동(Tatung)의 9월 매출은 전년 동기 대비 13% 감소했으며 전력 인프라 건설에서 AI 컴퓨팅 성능을 지속적으로 심화하고 있습니다.","so":" 迎接挑戰","su":"대만전력에너지공학협회는 지난 20일 제8회 '전력망 인재개발 연합 장학금'과 제7회 '유수성 기념상' 시상식을 진행했다. Liu Wenxiong, honorary chairman of the association, said in his speech that electricity is no longer just \"lighting up a lamp.\" It not only supports competition in computing power, but also affects industrial layout. 그는 장학금과 기념상을 통해 전문 인재의 투자와 계승을 장려하고 전력 및 에너지 산업을 홍보하여 AI 개발 열차를 따라잡고 대만에서 새로운 성장 모멘텀(값이 움직이는 기세)을 창출하기를 희망합니다."},{"s":"AI 시대에는 에너지 전환이 필요하다. Liu Wenxiong은 신세대가 전력 산업에 투자하도록 격려합니다.","so":"經濟日報","tm":"11/20 17:36","c":1,"r":"tw","u":"https://money.udn.com/money/story/5612/9891709","p":1795163807,"a":1795175845,"t":"AI 時代需要能源轉型 劉文雄鼓勵新生代投入電力產業","su":"AI와 반도체(전자기기의 두뇌 부품) 산업이 호황을 누리면서 전력 인재는 산업간 경쟁을 위한 중요한 자원이 됐다. 류웬시옹(Liu Wenxiong) 대만전력에너지공학협회 명예회장은 지난 20일 '전력망 인재개발연맹 장학금 및 류수성 기념상 시상식' 행사에 참석해 AI 산업이 전기에 대한 세계의 기대에 변화를 가져왔고, 대만이 미래 AI 산업의 열차를 탈 수 있으려면 더 많은 첨단기술 인재의 유입이 필요하다고 지적했다."},{"s":"도쿄전력, 원전의 테러 대책 시설의 완성 연기에 가시와자키 카리바 7호기","so":"日本経済新聞","tm":"11/20 17:18","c":1,"r":"jp","u":"https://www.nikkei.com/article/DGXZQOUC205P80Q6A121C2000000/","p":1795162738,"a":1795175845,"t":"東京電力、原発のテロ対策施設の完成延期へ 柏崎刈羽7号機","su":"도쿄전력홀딩스가 카시와자키 카리바 원자력발전소 7호기(니가타현)에 정비하는 테러 대책 시설에 대해 2029년 8월로 하고 있던 완성 시기의 연기를 검토하고 있는 것이 20일, 알았다. 테러대책시설은 '특정 중대사고 등 대처시설'로 불리며 국가 기준으로 설치가 의무화되고 있다. 공사가 길어지면 7호기 재가"},{"s":"ESCO, 메거 인수로 전력망 검사 영역 확대 전력회사가 주요 고객","so":"鉅亨網","tm":"11/20 16:00","c":1,"r":"tw","u":"https://news.cnyes.com/news/id/6669012","p":1795158024,"a":1795158285,"t":"ESCO併購Megger擴大電網檢測版圖電力公司是主力客戶","su":"ESCO, 전력망 감지 영역 확장 위해 Megger 인수 전력회사가 주요 고객이다. 유애널라이즈 2026년 11월 20일 (유애널라이즈/산업데이터센터(컴퓨터 수만 대를 모아 둔 건물) 리포트) ⸺ 미국 산업용 시험장비 제조사인 에스코테크놀로지스(ESE-US)가 전력망 탐지업체 메거(Megger) 인수를 완료했다. 2027회계연도 매출은 연간 55~58% 증가한 20억 5천만~20억 9천만 달러에 이를 것으로 예상된다. 인수합병(회사를 사거나 합치는 것)을 통해 전력망 탐지 시장에서 ESCO의 규모가 확대되고 있으며 주요 고객은 전력회사입니다. ESCO 경영진은 데이터센터 구축과 직접 관련된 매출이 도블과 메거 합산 매출의 1~2%에 불과한 것으로 추정하고 있다."},{"s":"LS ELECTRIC 9%대 급락…전력기기주 동반 약세 [종목NOW]","so":"파이낸셜뉴스","tm":"11/20 15:10","c":1,"r":"kr","u":"https://www.fnnews.com/n 95389945,"t":"華碩首款人形機器人曝光- 財經要聞- 工商時報","su":"ASUS의 첫 번째 휴머노이드(사람을 닮은 로봇) 로봇이 공개되었습니다. 최근 외국 언론과의 인터뷰에서 ASUS 공동 CEO Xu Xianyue는 ASUS의 첫 번째 인간형 로봇 Gallop을 공개하고 첫 번째 작업인 ASUS 자체 스마트 공장에서 마더보드 액세서리를 포장하는 작업을 소개했습니다. 쉬셴웨(Xu Xianyue) 역시 갤럽이 이르면 내년 하반기 오픈할 것으로 예상했다."},{"s":"휴머노이드 로봇 수입으로 넘쳐나는 일본의 비전은 스타트업에 영감을 줍니다","so":"The Japan Times","tm":"11/23 14:18","c":1,"r":"us","u":"https://www.japantimes.co.jp/business/2026/11/23/tech/humanoid-japan-startups/","p":1795411080,"a":1795411410,"t":"Visions of Japan overrun by humanoid robot imports inspire startups","su":"유용한 작업을 수행할 수 있는 이족 보행 기계의 개발이 국가에서 뒤떨어져 있습니다."},{"s":"사진 속의 주간: 세계 지도자들이 APEC에서 만나다, 프랑스와 콜롬비아에서 시위, 로봇 집단 댄스","so":"The Straits Times","tm":"11/23 13:34","c":1,"r":"sg","u":"https://www.straitstimes.com/multimedia/the-week-in-pictures-world-leaders-meet-at-apec-demonstrations-in-france-and-colombia-robot-mass?ref=latest-headlines","p":1795408440,"a":1795408896,"t":"The Week in Pictures: World leaders meet at APEC, demonstrations in France and Colombia, robot mass dance","su":"APEC 정상회담을 위해 세계 지도자들과 휴머노이드(사람을 닮은 로봇) 로봇이 중국 선전에 모이고, 프랑스에서는 생활비 상승과 불평등에 항의하는 시위가 6주째 계속되고 있다."},{"s":"핀란드 기업가 정신 이벤트 Slush \"Bet on Europe\"은 AI 및 로봇 공학 혁신에 중점을 둡니다.","so":"中央社 CNA","tm":"11/23 13:25","c":1,"r":"tw","u":"https://www.cna.com.tw/video/foreign/4357543","p":1795407906,"a":1795408894,"t":"芬蘭創業盛會Slush「押注歐洲」 聚焦AI與機器人創新","su":"글로벌 기업가 정신 이벤트인 Slush가 핀란드 헬싱키에서 첫선을 보였습니다. 올해의 주제는 '유럽에 베팅'입니다. 단 한 번의 시연으로 작업을 수행할 수 있는 로봇부터 조종석이 없는 전기 자율 주행 트랙터까지 유럽 스타트업이 인공 지능과 하드웨어 혁신을 결합하여 차세대 성장 기회를 찾는 방법을 보여드리겠습니다."},{"s":"아이엘, 中 로봇핸드 유니콘과 독점 공급계약…휴머노이드 부품사업 진출","so":"한국경제","tm":"11/23 13:19","c":1,"r":"kr","u":"https://www.hankyung.com/article/202611234083i","p":1795407581,"a":1795408891,"su":"AI 추천 뉴스 아이엘, 中 로봇핸드 유니콘과 독점 공급계약…휴머노이드(사람을 닮은 로봇) 부품사업 진출 코스닥(한국 중소·기술 회사 주식시장) 상장사 아이엘이 중국 로봇핸드 전문기업 자이노바(XYNOVA)와 국내 독점 공급계약을 체결하고 휴머노이드 핵심부품 사업에 진출한다. 아이엘은 자이노바의 로봇핸드 전 제품군과 휴머노이드 관절 구동장치(액추에이터)에 대한 국내 독점 공급권을 확보했다고 23일 밝혔다. 지난 20일 열린 계약식에는 송성근 아이엘 의장과 샤위쉬안 자이노바 창업자 겸 최고경영자(CEO)가 참석했다."},{"s":"[특징주] 에이엘로봇, 피지컬 AI·휴머노이드 모멘텀 속 전일 급락 딛고 반등","so":"와이드경제","tm":"11/23 13:06","c":1,"r":"kr","u":"https://www.widedaily.com/news/articleView.html?idxno=304447","p":1795406814,"a":1795408891,"su":"내년 초 열리는 세계 최대 가전·정보기술(IT) 전시회 'CES 2027'을 앞두고 로봇 관련주에 매수세(사려는 힘)가 유입되면서 신규 상장사 에이엘로봇이 장중 급등세를 보이고 있다. 23일 오후 1시 기준 코스닥(한국 중소·기술 회사 주식시장) 시장에서 에이엘로봇은 전 거래일 대비 1440원(13.47%) 오른 1만2130원에"},{"s":"휴머노이드 로봇산업의 추세는 여전히 뚜렷하며, 로봇ETF Harvest(159526)는 로봇산업의 발전기회를 종합적으로 계획하고 있다.","so":"Jiemian.com","tm":"11/23 12:21","c":1,"r":"cn","u":"https://www.jiemian.com/article/15360639.html","p":1795404087,"a":1795408893,"t":"人形机器人产业趋势依然明确，机器人ETF嘉实(159526)全面布局机器人产业发展机会","su":"11월 23일 초반 거래에서는 로봇산업 체인이 이러한 추세에 맞서 활발하게 움직였다. 10시 28분 기준 CSI 로봇지수(H30590)는 0.24% 상승했고, 구성종목인 Clai Electromechanical 10cmlimit-up, Yijiahe 6.55% 상승, Jingye Intelligent 3.71% 상승, OPT 3.69% 상승, Top Group 3.43% 상승했다."},{"s":"Science and Technology 100 ETF Penghua(588220)는 국내외에서 거래가 활발하고 지속적인 촉매 작용을 하고 있으며 로봇 부문은 추세를 거스르고 상승했습니다.","so":"Jiemian.com","tm":"11/23 11:43","c":1,"r":"cn","u":"https://m.jiemian.com/article/15360451.html","p":1795401791,"a":1795403834,"t":"科创100ETF鹏华(588220)交投活跃，海内外催化不断，机器人板块逆市走高","su":"로봇 부문은 시장에 적극적으로 대응해 왔습니다. 뉴스 측면에서, 4개 부서는 \"\"노인 1인 및 소규모\" 서비스 시스템 구축을 위한 구현 계획을 발표했습니다. 관리 수준을 향상시키기 위해 지능형 관리 서비스, 스마트 화재 보안 및 기타 시스템을 적용하여 노인 요양 기관 및 보육 기관을 지원합니다. 노인 요양 기관에 지능형 건강 모니터링, 보조 장치 및 기타 장비를 갖추도록 장려합니다. 노인 요양 시나리오에 적합한 인공 신체, 서비스 로봇, 스마트 웨어러블 장치 및 외골격과 같은 신제품 개발을 장려합니다. 또한 테슬라는 자주 움직이고 있습니다. 머스크는 편집된 하이라이트 컬렉션이 아닌 일상적인 상호작용에서의 실제 능력을 보여주기 위해 향후 2개월 안에 옵티머스 휴머노이드(사람을 닮은 로봇) 로봇의 실제 시연을 시작할 계획이라고 밝혔습니다.웨스턴 증권은 테슬라의 움직임이 물리적 AI 및 휴머노이드 로봇의 적용에 대한 시장 신뢰를 크게 높일 것이라고 믿고 있으며, 업계 동향에 따른 투자 기회를 포착할 것을 권장합니다."},{"s":"[물리AI] 체화된 지능, 국가표준 출시! 로봇ETF 투자(560770) 호응 급등! Tuopu Group은 5.18% 상승하여 추세를 주도했습니다.","so":"Jiemian.com","tm":"11/23 11:39","c":1,"r":"cn","u":"https://www.jiemian.com/article/15360372.html","p":1795401556,"a":1795403835,"t":"【物理AI】具身智能，国标启动！机器人ETF招商(560770)应声大涨！拓普集团涨5.18%领攻","su":"11월 23일 로봇 부문은 장중 상승했다. 10시 6분 현재 로봇은 1.47% 상승했다. 이전에는 2.15% 상승했습니다. 장중 로봇ETF(560770) 투자량이 증가했다. 부품주 기준으로 투오푸그룹은 5.18%, 오비중광W는 4.32% 상승했다."},{"s":"휴머노이드 로봇 컨셉이 계속해서 상승하고 있으며, 서던펀드의 로봇 ETF 서던(159258)의 기초지수가 2% 이상 상승했습니다.","so":"Jiemian.com","tm":"11/23 11:39","c":1,"r":"cn","u":"https://www.jiemian.com/article/15360344.html","p":1795401555,"a":1795403836,"t":"人形机器人概念持续拉升，南方基金旗下机器人ETF南方(159258)标的指数涨超2%","su":"10시 6분 현재, Robot ETF(여러 주식을 묶어 파는 상품) Southern(159258)은 장중 거래량이 1,892.57만 위안으로 1.58% 변동되었습니다. 추적지수인 CSI 로봇지수(H30590)는 한때 2.15% 넘게 올랐고, 현재는 1.45% 상승 중이다."},{"s":"한성대 학생팀, 휴머노이드 로봇 특허 920여 건 분석해 수상","so":"중앙일보","tm":"11/23 11:17","c":1,"r":"kr","u":"https://www.joongang.co.kr/article/25481014","p":1795400251,"a":1795403830,"su":"한성대 산업시스템공학부 학생팀 ‘교집합’이 11월 19일 오후 4시 30분 서울 서초구 엘타워에서 열린 ‘2026 캠퍼스 특허 유니버시아드’ 시상식에서 특허전략수립 부문 삼성전자 대표이사상을 받았다. 지식재산처가 주최하고 한국발명진흥회 등이 주관하는 이 대회에서 대학생들은 기업과 연구기관이 출제한 기술 과제를 받아 특허 데이터를 분석하고 그 결과를 토대로 특허전략을 제안한다. 김가영·김기범·문비아 학생은 삼성전자가 출제한 ‘휴머노이드(사람을 닮은 로봇) 로봇 상용화’ 과제를 맡았다."},{"s":"\"전 세계 휴머노이드 로봇 시장, 2040년 787만대 규모로 성장 전망\"","so":"로봇신문","tm":"11/23 11:17","c":1,"r":"kr","u":"https://www.irobotnews.com/news/articleView.html?idxno=49735","p":1795400242,"a":1795403830,"su":"전 세계 휴머노이드(사람을 닮은 로봇) 로봇 시장이 2030년대 본격적인 성장 국면에 진입해 2040년에는 글로벌 누적 설치 대수가 약 787만대에 이를 것이라는 전망이 나왔다. 초"},{"s":"[특징주] 코스모로보틱스, CES 2027 휴머노이드 기대감 속 로봇주 강세에 14%대 급등","so":"와이드경제","tm":"11/23 10:52","c":1,"r":"kr","u":"https://www.widedaily.com/news/articleView.html?idxno=304405","p":1795398775,"a":1795403830,"su":"내년 1월 열리는 세계 최대 가전·정보기술(IT) 전시회 'CES 2027'을 앞두고 로봇 관련주 전반에 매수세(사려는 힘)가 몰리면서 코스모로보틱스가 장중 급등세를 보이고 있다. 23일 오전 10시 40분 기준 코스닥(한국 중소·기술 회사 주식시장) 시장에서 코스모로보틱스는 전 거래일 대비 530원(14.85%) 오른 4100"},{"s":"중국 자동차 제조업체, 휴머노이드 로봇 야망 축소","so":"Nikkei Asia","tm":"11/23 10:45","c":1,"r":"us","u":"https://asia.nikkei.com/spotlight/caixin/china-carmakers-scale-back-humanoid-robot-ambitions","p":1795398300,"a":1795403830,"t":"China carmakers scale back humanoid r":"kr","u":"https://www.newsis.com/view/NISX20261119_0003874253","p":1795273200,"a":1795278575,"su":"[서울=뉴시스]이준형 인턴 기자 = 최근 증시 급락으로 가계의 주식 자산이 큰 타격을 입었으나, 현 밸류에이션(주가가 비싼지 싼지 따진 값) 상 펀더멘털 관점에서의 저평가 매력이 극에 달해 있어 투매보다는 인내가 필요한 시점이라는 진단이 나왔다.유튜브 채널 '증시각도기TV'에 출연한 곽상준 매트릭스투자자문 대표는 최근 국내 증시의 등락 배경과 주요 경제 지표, 그리고 반도체(전자기기의 두뇌 부품) 및 로봇 섹.."},{"s":"5G-A는 조정 검사를 수행하는 여러 휴머노이드 로봇을 통해 선전-홍콩 Hui 스마트 데모 파크에 힘을 실어줍니다.","so":"广东新闻","tm":"11/21 23:04","c":1,"r":"cn","u":"http://www.gd.chinanews.com.cn/2026/2026-11-21/450699.shtml","p":1795269840,"a":1795278576,"t":"5G-A赋能深港汇智慧示范园区 多台人形机器人协同巡检","su":"중국 뉴스 서비스, 광동 뉴스, 11월 20일(Sun Qiuxia, Li Yingxin) 선전-강휘 스마트 시범단지에서는 다수의 휴머노이드(사람을 닮은 로봇) 검사 로봇이 건물, 옥외 도로 및 기타 지역을 함께 순찰합니다. 고화질 영상은 실시간으로 스마트 관리 플랫폼으로 다시 전송되며, AI 지능형 분석을 통해 적시에 안전 위험을 식별하고 경보를 울립니다. 수동 검사부터 로봇 클러스터 협업 운영까지 이 스마트 보안 시나리오는 심천-홍콩 Hui 스마트 데모 파크에 힘을 실어주는 5G-A의 생생한 사례입니다. 심천-홍콩 후이 스마트 시범단지는 심천 첸하이 첸완 핵심 지역에 위치해 있습니다. 첸하이(Qianhai)에 있는 핵심 심천-홍콩 양방향 본부 기지입니다. Guangdong Mobile은 China Mobile Internet of Things, 화웨이, Leju Robots 등과 협력하여 5G-A 네트워크를 핵심 지원으로 사용하고 IoT, 디지털 트윈 및 기타 기술을 통합하여 지능형 보안, 스마트 운영 및 다국어 서비스를 통합하는 스마트 캠퍼스 시스템을 만들었습니다."},{"s":"테슬라 옵티머스가 '렌탈'로 바뀔 수도 있다! 애플, HALO 휴머노이드 로봇 제어 솔루션 공개! 노보노디스크, 체중 감량 이외의 시장으로 확장 기대 丨20261110월스트리트에서 루자쭈이까지","so":"第一财经","tm":"11/21 20:57","c":1,"r":"cn","u":"https://www.yicai.com/video/103433753.html","p":1795262279,"a":1795270321,"t":"特斯拉Optimus或转向“出租”！苹果披露HALO人形机器人控制方案！诺和诺德有望拓展减重之外的市场丨20261110从华尔街到陆家嘴","su":"저자: 월스트리트에서 루자쭈이까지 편집자: Han Luyang ①테슬라는 \"Optimus 임대\"로 전환할 수 있습니다. 초기 비용은 약 US$30,000이며 2027년 말까지 배송될 예정입니다. 머스크는 최근 테슬라가 인간형 로봇 Optimus를 판매하는 대신 고객에게 임대할 가능성이 있다고 말했습니다. 단일 장치의 초기 비용은 약 US$30,000이며, 향후 약 US$20,000까지 하락할 것으로 예상됩니다. 납품 전 테슬라 자체 공장에서 사용할 예정이며, 작업 효율은 일반인의 5배 정도다. 테슬라가 프리몬트 공장에서 옵티머스 조기 양산을 시작했다. 생산라인은 연간 100만개 생산능력을 갖출 계획이다. 테슬라는 12월 3일 주주총회에서 자세한 내용을 발표할 예정이다. 업계에 따르면 테슬라는 12월 초 신형 휴머노이드(사람을 닮은 로봇) 로봇 옵티머스에 대한 고객 예약을 개시할 예정이지만, 로봇 배송은 여전히 1년을 기다려야 한다. 임대 모델은 테슬라가 일회성 하드웨어 수익에서 반복 수익으로 전환하는 과정의 일부로 간주됩니다. FSD 가입자는 3분기에 새로운 최고치를 기록했습니다. 북미 신규 주문의 75%가 FSD를 선택하고 연간 반복 수익이 미화 10억 달러에 육박했습니다. Optimus는 다음 구독 제품이 될 것으로 예상되며 구체적인 임대 가격 및 조건은 아직 발표되지 않았습니다."},{"s":"품질이 낮은 로봇 데이터의 확산: 나쁜 데이터는 어떻게 생성되는가","so":"第一财经","tm":"11/21 20:43","c":1,"r":"cn","u":"https://www.yicai.com/news/103449077.html","p":1795261428,"a":1795265125,"t":"机器人低质数据泛滥：糟糕的数据是如何产生的","su":"“물리적 AI가 대중화되면서 실제 기계가 수집하는 데이터의 비중은 점점 줄어들 것입니다.” 최근 Motphys의 설립자이자 CTO인 Zhang Heng은 제일재경와의 인터뷰에서 위와 같은 판단을 내렸습니다. 로봇 훈련에는 엄청난 양의 데이터가 필요하며, 실제 기계에서 데이터를 수집하는 것은 비용이 너무 많이 들고 비효율적입니다. 물리 시뮬레이션 엔진은 점점 더 강력해지고 있으며 가상 세계에서 물리적 피드백을 통해 무제한의 데이터를 생성할 수 있습니다. 안경, 촉각 장갑 및 기타 장치를 착용한 인간이 수집한 자아 데이터도 폭발적으로 증가하고 있습니다. 이는 훈련 데이터 부족 문제를 상당 부분 해결하지만, 동시에 품질이 낮은 데이터도 범람 조짐을 보이고 있습니다."},{"s":"'53개 손가락' 연주는…로봇 151대가 \"뱅뱅뱅\"","so":"연합뉴스 한민족센터","tm":"11/21 15:42","c":1,"r":"kr","u":"https://www.koreancenter.or.kr/news/articleView.html?idxno=1443086","p":1795243332,"a":1795248163,"su":"[앵커] 인간 피아니스트와 로봇 피아니스트의 연주는 어떤 차이가 있을까요? 지난 APEC 정상회의 기간 150대가 넘는 휴머노이드(사람을 닮은 로봇) 로봇들이 군무를 펼쳐 세계 기록을 세웠다는데요. 어떤 내용인지 화면으로 만나보시죠. [기자] 53개의 손가락을 자유자재로 움직이며 쇼팽의 '녹턴'을 연주하는 로봇 <연주 현장음> \"이번엔 인간 피아니스트 차례입니다.\" <연주 현장음> \"인간과 로봇의 피아노 연주 대결이 펼쳐졌습니다.\" <테오트로니코 / 로봇 피아니스트> \"객관적으로 제가 더 뛰어납니다."},{"s":"3대3 완전 자율 휴머노이드 로봇 축구 초청 토너먼트가 마카오에서 개최됩니다.","so":"21财经","tm":"11/21 15:26","c":1,"r":"cn","u":"https://www.21jingji.com/article/20261121/herald/c264fa0d8544851fb70c9051b7e1155f.html","p":1795242411,"a":1795248164,"t":"3对3全自主人形机器人足球邀请赛即将登陆澳门","su":"휴머노이드(사람을 닮은 로봇) 로봇이 그린 필드로 이동할 때 원격 제어 제어에 의존할 필요가 없습니다. 자체 AI 알고리즘에만 의존하여 인식, 이동, 대결 및 촬영을 완료합니다. 특별한 기술 축구 경기가 준비되었습니다. 12월 3일부터 5일까지 베네시안 마카오 코타이 전시컨벤션센터에서 3대3 완전 자율 휴머노이드 로봇 축구 초청 토너먼트가 개최됩니다. AIE 전자 전시회의 주요 지원 행사로 광둥-홍콩-마카오 대만 지역과 베이징의 8개 중학교 팀이 완전 자율 모드에서 로봇 축구 대회에 참가할 예정입니다. 8개의 참가팀이 경쟁을 펼쳤습니다. 이번 대회의 가장 큰 하이라이트는 완전 자율주행 경쟁이다. 경쟁 규칙에서는 수동 원격 제어, 의사 결정을 위한 외부 컴퓨터 및 외부 전원 공급 장치를 명확하게 금지합니다. 로봇은 공중 쌍안경 깊이 카메라를 사용하여 경쟁 환경을 감지하고 공중 컴퓨팅 능력은 컴퓨팅 결정을 완료하여 \"인식-결정-실행\" 폐쇄 루프를 완전히 실현하고 각 팀의 알고리즘 개발 및 전략 조정 수준을 위해 경쟁합니다."},{"s":"휴머노이드 로봇 대량생산 가속화, 감속기 수요 급증","so":"信報網站","tm":"11/21 03:33","c":1,"r":"hk","u":"https://www.hkej.com/dailynews/investment/article/4570872/%E4%BA%BA%E5%BD%A2%E6%A9%9F%E6%A2%B0%E4%BA%BA%E5%8A%A0%E5%BF%AB%E9%87%8F%E7%94%A2+%E6%B8%9B%E9%80%9F%E5%99%A8%E9%9C%80%E6%B1%82%E9%A3%86","p":1795199626,"a":1795215226,"t":"人形機械人加快量產 減速器需求飆","su":"인공지능(AI) 대형모형과 구현지능 기술이 점점 성숙해지면서 글로벌 휴머노이드(사람을 닮은 로봇) 로봇 산업은 실험실 연구개발에서 상업적 대량생산 단계로 옮겨가고 있다. 로봇 산업 체인에서 변속기 부품은 항상 시장에서 무시되어 왔지만 이제는 조용히 시장의 가장 큰 관심을 끄는 핵심 부품 중 하나가 되었습니다. 감속기는 동력(모터)과 액츄에이터(Actuator)를 연결하는 중간 전달 장치입니다. 기어, 웜 등의 구조를 통해 고속, 저토크 입력을 저속, 고토크 출력으로 변환하는 동시에 전달 정밀도와 부하 용량을 향상시킵니다. 정밀감속기의 핵심가치는 동력 전달 과정을 개선하는 것입니다."},{"s":"Yada와 Robot Godfather가 AI 스마트 의료 애플리케이션 개발 | 핫 하이라이트 | 사업정보","so":"經濟日報","tm":"11/21 00:53","c":1,"r":"tw","u":"https://money.udn.com/money/story/5635/9892203","p":1795190037,"a":1795215223,"t":"亞大攜機器人教父 攻AI智慧醫療應用 | 熱門亮點 | 商情","su":"글로벌 노령화와 의료 인력 부족으로 인해 AI 스마트 로봇 애플리케이션에 대한 수요가 증가하고 있습니다! 아시아대학교는 스마트 의료 산업을 적극적으로 전개하고 있습니다. 차이진파 총장은 대표단을 이끌고 일본 오사카대학을 방문했다. 지난 11월 16일에는 '일본 로봇공학의 대부'로 불리는 이시구로 히로시 교수가 이끄는 스마트로봇연구소와 협력각서(MOU)를 체결했다. 미국 스탠퍼드대 로봇센터와 일본의 휴머노이드(사람을 닮은 로봇) 로봇 기술, 대만의 의료 임상(새 약을 사람에게 시험하는 것) 분야를 결합해 AI 로봇을 연구실부터 의료현장까지 확산할 예정이다. Ishiguro는 휴머노이드 로봇 연구의 세계적인 선구자입니다. 그는 미국 CNN이 선정한 '세상을 바꾸는 8명의 천재' 중 한 명으로 선정됐다. 그는 제미노이드(Geminoid), 에리카(Erica) 등 국제적으로 유명한 로봇을 개발했습니다. 그는 오랫동안 인간과 컴퓨터의 상호작용, 원격제어, 아바타 로봇 기술에 투자해 왔으며, 인간의 삶과 사회 서비스에 AI 로봇을 적용하는 방안을 탐구했다. 아시아대학과 오사카대학의 협력에는 몰입형 로봇, 원격 제어 복제 기술, 소셜 로봇 및 AI 대화 시스템이 포함됩니다. 양 당사자는 공동 연구, 대학원생 교류, 단기 연수 및 국제 연구 프로젝트를 추진하고 스마트 의료와 노인 간호를 중요한 발전 방향으로 삼을 것입니다. 차이진파 아시아대학교 총장은 초기 단계에서는 외래진료 지도, 의료정보 설명, 원격 방문, 노인과의 상호작용 등을 평가할 것이라고 지적했다."},{"s":"한국 베이스그룹, 트럼프 일가 ‘군용 로봇 업체’에 2천억원 투자 준비","so":"한겨레","tm":"11/21 00:17","c":1,"r":"kr","u":"https://www.hani.co.kr/arti/international/international_general/1288324.html","p":1795187820,"a":1795248163,"su":"한국 기업 베이스그룹이 도널드 트럼프 미국 대통령의 차남이 고문으로 있는 군용 로봇 개발 업체에 1억5천만달러(2천억원)를 투자할 준비를 하고 있다고 로이터 통신이 19일(현지시각) 보도했다. 직원 급여조차 제때 주지 못할 만큼 자금난에 빠진 이 업체에 베이스그룹이 ‘"},{"s":"Hot Finance | 수십 대의 휴머노이드 로봇이 휴대폰 테스트 생산 라인에 진입했으며 Zhiyuan Innovation과 Lens Technology가 협력을 맺었습니다.","so":"21财经","tm":"11/20 20:55","c":1,"r":"cn","u":"https://www.21jingji.com/article/20261120/herald/3b873cf32c1b8f6fa5c933c92e90e740.html","p":1795175700,"a":1795180935,"t":"热财经｜数十台人形机器人进驻手机测试产线 智元创新与蓝思科技达成合作","su":"최근 AGIBOT은 스마트 단말기 정밀 제조 기업인 Lens Technology와 전략적 협력을 맺고 Lens Technology의 휴대폰 테스트 생산 라인에 수십 대의 AGIBOT 로봇을 대규모로 배치했습니다. 이 로봇 배치는 3C 소비자 전자 제품 테스트를 위한 표준화된 응용 모델을 만드는 것을 목표로 테스트 스테이션의 자동 로딩 및 언로딩 및 장비 상호 작용과 같은 작업을 담당합니다. 이 생산 라인의 구현은 주로 MMI, ANT, CAM 및 CAMCV와 같은 고주파수 반복 테스트 프로세스를 다루고 있습니다. 신속한 모델 반복과 잦은 생산 라인 조정이라는 3C 업계의 특성에 부응하여 Genie G2는 Zhiyuan의 \"3가지 지능이 하나로 통합된\" 기술 아키텍처를 사용합니다. 범용 차체 설계와 전천후 작동 기능을 통해 신속한 교차 생산 라인 적응과 완전 자동 자재 이동을 달성하여 생산 라인 수정 비용을 효과적으로 줄이고 노동 압력을 완화할 수 있습니다."},{"s":"가케시 / 규슈 · 야마구치, 야스카와 전기의 로봇 제 5 공장 견학","so":"日刊工業新聞","tm":"11/20 17:53","c":1,"r":"jp","u":"https://www.nikkan.co.jp/articles/view/797744","p":1795164799,"a":1795248165,"t":"かけはし／九州・山口、安川電機のロボット第5工場見学"},{"s":"로봇이 연주하고 순찰... APEC서 과시한 중국","so":"조선일보","tm":"11/20 17:20","c":1,"r":"kr","u":"https://www.chosun.com/international/international_general/2026/11/20/YQ62E4R3J5GR3KUGKKDGV7XTZM/","p":1795162838,"a":1795248163,"su":"APEC 정상회의가 열린 중국 선전에서 휴머노이드(사람을 닮은 로봇) 로봇과 하모니OS 기반 AI 기술이 공개됨. 중국은 선전을 무대로 자국 첨단 제조업의 경쟁력을 세계에 과시하며, 제조업 기반을 결합한 피지컬 AI 분야에서 미국을 추월하겠다는 기술적 의지를 드러냈음."},{"s":"안드로이드 창시자 '앤디 루빈', 휴머노이드 로봇 공개…겐키 로보틱스 첫 공식 행보","so":"로봇신문","tm":"11/20 16:31","c":1,"r":"kr","u":"https://www.irobotnews.com/news/articleView.html?idxno=49710","p":1795159887,"a":1795175855,"su":"안드로이드 창시자 앤디 루빈(Andy Rubin)이 설립한 일본 휴머노이드(사람을 닮은 로봇) 로봇 스타트업 겐키 로보틱스(Genki Robotics)가 창업 이후 처음으로 공개 석"},{"s":"삼성전자는 2027년 1월 자체 개발한 로봇을 선보일 예정이다. 로봇 산업은 대규모 구현기에 돌입했다.","so":"财联社","tm":"11/20 16:22","c":1,"r":"cn","u":"https://www.cls.cn/detail/2476465","p":1795159334,"a":1795231024,"t":"三星将于2027年1月首秀自研机器人 机器人产业已迈入规模化落地期","su":"① 삼성전자는 2027년 1월 미국 라스베이거스에서 개최되는 세계 최대 가전전시회 CES 2027에서 자체 개발한 휴머노이드(사람을 닮은 로봇) 로봇 최초 공개를 목표로 휴머노이드 로봇 시제품 개발에 박차를 가하고 있다. ② 갤럭시오토 석진만 팀은 중국 내 휴머노이드 로봇 일괄 배치가 가속화돼 상반기 글로벌 출하량이 97%를 차지하며 업계는 1단계 진입에 진입했다고 지적했다. 대규모 시행 기간. 7일(현지시간) 언론보도에 따르면 삼성전자는 2027년 1월 미국 라스베이거스에서 열리는 세계 최대 가전전시회 CES 2027에서 자체 개발한 휴머노이드 로봇을 최초로 공개하는 것을 목표로 휴머노이드 로봇 시제품 개발에 박차를 가하고 있다. 업계 관계자는 “인공지능(AI) 기술의 발전으로 휴머노이드 로봇의 상용화 시기가 앞당겨질 것으로 예상돼 삼성전자가 속도를 높이고 있다”고 말했다. 발전의."},{"s":"유비 미녀미남들 집에 들어가고 싶다면 기다려주세요 - 36Kr","so":"36kr","tm":"11/20 16:12","c":1,"r":"cn","u":"http://www.36kr.com/p/4076727621457793","p":1795158768,"a":1795175857,"t":"优必选的美女帅哥们，想进家门再等等-36氪","su":"The beauties and handsome guys of 유비테크, if you want to enter your home, please wait. 2026 APEC에서 특별세미나에 참여한 구현지능 분야 대표자는 YuShu의 창립자이자 CEO인 Wang Xingxing이었고, 두 번째는 유비테크의 창립자이자 이사회 의장이자 CEO인 Zhou Jian이었습니다. 유비테크의 본사는 심천에 위치하고 있습니다. As a listed company focusing on full-size humanoid robots, 유비테크 is an important platform to showcase the level of China's robot industry. Zhou Jian은 휴머노이드(사람을 닮은 로봇) 로봇의 산업 규모가 \"여전히 연구 개발, 대량 생산 및 실제 적용 간의 연결을 열어야 한다\"고 말했습니다. 이 문장이 머리에 박혔습니다. 현재 중국의 임바디드 AI(로봇처럼 몸을 가진 인공지능) 분야에서는 단일 지점 역량이 빠르게 향상되고 있지만 R&D, 대량 생산, 응용 간에 서로를 구동하는 긍정적인 순환이 아직 형성되지 않았다는 구조적 모순이 있습니다."},{"s":"이족보행, 바퀴형 및 바퀴형 : 휴머노이드 로봇 형태의 경로 분류 및 대표기업 지도","so":"Jiemian.com","tm":"11/20 16:09","c":1,"r":"cn","u":"https://www.jiemian.com/article/15354215.html","p":1795158558,"a":1795175859,"t":"双足、轮式与轮足：人形机器人形态路线分类及代表公司图谱","su":"Abstract When talking about humanoid robots, most attention is focused on the mechanical arms and dexterous hands. 기계가 어디에 들어갈 수 있는지, 생산 라인으로 전환될 수 있는지, 1교대 동안 지속될 수 있는지를 실제로 결정하는 것은 기계의 하체인 경우가 많습니다. The industry has divided into three clear lines along the way of mobility: bipedal, wheeled and wheeled. Topstar has mature products in two main lines: bipedal and wheeled. 6개의 휴머노이드(사람을 닮은 로봇) 로봇 팔, 휴머노이드 팔, 바퀴 달린 휴머노이드, 이족 보행 휴머노이드, 4족 로봇 및 AI 워크스테이션은 통합 제어 기반을 공유합니다. The humanoid robot \"Xiaotuo\" has been stably operating in the injection molding and 3C workshops. 이족 보행 휴머노이드 스타는 2026년 11월 7일 TOPS DAY에 출시되었습니다. 이 기사에서는 먼저 세 가지 형태의 구조와 이동 원리를 분해한 다음 적용 가능한 시나리오와 생산 라인 변환 비용을 자세히 설명합니다. 그러다가 국내외 대표 모델들이 하나둘씩 제자리로 돌아가고, 바퀴발 루트의 성숙도는 공백으로 남는다. There is no abstract superiority in the battle of forms, only whether the scene and the choice match."},{"s":"모델 능력이 향상되고 로봇이 자율적으로 학습하기 시작합니다.","so":"Jiemian.com","tm":"11/20 15:04","c":1,"r":"cn","u":"https://www.jiemian.com/article/15354028.html","p":1795154688,"a":1795158299,"t":"模型能力提升，机器人开始自主学习了","su":"로봇은 스스로 새로운 기술을 배울 수 있게 되었지만 이러한 능력을 실제 시나리오에서 안정적으로 작동시키고 상업적인 수익을 창출하는 방법은 여전히 업계가 직면한 문제입니다."}]}],"auto":{"🇰🇷 한국":["CNB뉴스","https://www.theconnectmoney.com/","www.ebn.co.kr","국제뉴스","글로벌경제신문","뉴스락","뉴스퀘스트","데일리안","디지털데일리","매일신문","매일일보","메트로신문","블루밍비트","비즈니스플러스","산경투데이","서울경제TV","스페셜경제","시장경제신문","신아일보","아시아투데이","아주경제","와이드경제","인공지능신문","파이낸셜포스트","팝콘뉴스","한스경제"]},"breaking_url":"https://raw.githubusercontent.com/inwonc4524-code/Investment_NotiBot/main/breaking.json","show":8,"stats_url":"https://raw.githubusercontent.com/inwonc4524-code/Investment_NotiBot/main/stats.json","history_url":"https://raw.githubusercontent.com/inwonc4524-code/Investment_NotiBot/main/history.json"}</script>

    for(var t in HI.s){ for(var k in HI.s[t]){ if(HI.s[t][k][i] != null){ ok = true; break; } } if(ok) break; }
    HI.av.push(ok); }
  var y = +HI.since.slice(0,4), m = +HI.since.slice(5,7), ey = +HI.end.slice(0,4), em = +HI.end.slice(5,7);
  while(y < ey || (y === ey && m <= em)){
    var a = dIdx(y+'-'+('0'+m).slice(-2)+'-01'), ny = m===12 ? y+1 : y, nm = m===12 ? 1 : m+1;
    var b = Math.min(HI.n, dIdx(ny+'-'+('0'+nm).slice(-2)+'-01'));

// ✦ 버튼: Gemini 요청 문장을 복사하고 원문을 엶 → 원문 화면에서 Gemini 를 불러 붙여넣기
function askAI(a){
  var q = a.dataset.q || '';
  try { if(navigator.clipboard) navigator.clipboard.writeText(q); } catch(e){}
  toast('요청 문장을 복사했어요 · 원문에서 측면 버튼 길게 → 「이 페이지에 관해 질문하기」 → 붙여넣기');
  setTimeout(closeSheet, 50);
}
function toast(msg){ var t = $('toast'); t.textContent = msg; t.hidden = false; clearTimeout(toast._t); toast._t = setTimeout(function(){ t.hidden = true; }, 4000); }
function closeSheet(){ $('dim').hidden = true; $('sheet').hidden = true; document.body.style.overflow = ''; }
document.addEventListener('keydown', function(e){ if(e.key==='Escape') closeSheet(); });
