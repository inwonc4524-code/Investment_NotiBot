<style>
@font-face{font-family:'ChosunIlboMyungjo';src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_one@1.0/Chosunilbo_myungjo.woff') format('woff');font-weight:normal;font-display:swap}
:root{color-scheme:dark;--bg:#262624;--card:#30302e;--card2:#3a3a37;--text:#faf9f5;--sub:#a6a39a;--line:#3e3e3a;--acc:#d97757;--red:#ef4444}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.55 'ChosunIlboMyungjo',Georgia,"Noto Serif KR",serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:760px;margin:auto}
header{padding:20px 16px 8px}
h1{font:600 22px/1.3 'ChosunIlboMyungjo',Georgia,serif;margin:0 0 4px}
.upd{color:var(--sub);font-size:12.5px}
/* 테마 탭 */
.tabs{position:sticky;top:0;z-index:3;background:rgba(38,38,36,.96);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.tabrow{display:flex;gap:8px;overflow-x:auto;padding:12px 16px 10px;scrollbar-width:none}.tabrow::-webkit-scrollbar{display:none}
.tab{position:relative;flex:none;padding:9px 15px;border-radius:12px;border:1px solid var(--line);background:var(--card);
  color:var(--sub);font:inherit;font-size:14px;cursor:pointer}
.tab b{margin-left:5px;color:var(--sub);font-weight:400;font-size:12px}
.tab.on{background:var(--acc);border-color:var(--acc);color:#1f1e1d;font-weight:600}.tab.on b{color:#1f1e1d}
.dot{position:absolute;top:-3px;right:-3px;width:11px;height:11px;border-radius:50%;background:var(--red);border:2px solid var(--bg)}
/* 정렬·국가 */
.ctrl{display:flex;gap:6px;overflow-x:auto;padding:0 16px 10px;scrollbar-width:none}.ctrl::-webkit-scrollbar{display:none}
.ctrl button{flex:none;border:1px solid var(--line);background:transparent;color:var(--sub);border-radius:8px;padding:5px 11px;font:inherit;font-size:12.5px}
.ctrl button.on{background:var(--card2);border-color:var(--card2);color:var(--text)}
.ctrl .sep{flex:none;width:1px;background:var(--line);margin:2px 4px}
main{padding:6px 12px 48px}
h2{font:600 19px/1.3 'ChosunIlboMyungjo',Georgia,serif;margin:16px 4px 2px}
.note{margin:0 4px 10px;color:var(--sub);font-size:12px}
.none{color:var(--sub);margin:24px 4px;text-align:center}
.card{display:block;background:var(--card);border-radius:12px;padding:12px 14px;margin:8px 0;color:var(--text);text-decoration:none;transition:background .15s}
.card:hover{background:var(--card2)}.card:active{opacity:.75}
.meta{color:var(--sub);font-size:12px}
.title{font-weight:500;margin-top:3px}
.orig{color:var(--sub);font-size:12px;margin-top:3px}
.new{margin-left:4px;color:var(--red);font-size:11px;font-weight:700;letter-spacing:.3px}
.hot{display:inline-block;margin-right:6px;padding:0 6px;border-radius:4px;background:rgba(217,119,87,.16);color:var(--acc);font-weight:600}
.hot.big{background:var(--acc);color:#1f1e1d}
.newbar{display:block;width:100%;margin:2px 0 6px;padding:9px;border:0;border-radius:10px;background:rgba(239,68,68,.14);color:#fca5a5;font:inherit;font-size:13px;text-align:left}
.more{display:block;width:100%;margin:4px 0 0;padding:10px;border:1px dashed var(--line);border-radius:12px;background:transparent;color:var(--sub);font:inherit;font-size:13px}
footer{margin:36px 4px 0;padding-top:14px;border-top:1px solid var(--line);color:var(--sub);font-size:12px;line-height:1.7}
footer b{color:var(--text);font-weight:600}
/* 요약 창 */
#dim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:5}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:6;max-width:760px;margin:auto;max-height:82vh;overflow-y:auto;
  background:var(--card);border-radius:16px 16px 0 0;padding:10px 18px calc(18px + env(safe-area-inset-bottom));box-shadow:0 -8px 30px rgba(0,0,0,.4)}
.grab{width:38px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 12px}
.s-title{font-size:17px;font-weight:600;margin:4px 0 2px;line-height:1.45}
.s-label{margin:16px 0 4px;color:var(--acc);font-size:12px;font-weight:700;letter-spacing:.5px}
.s-sum{font-size:15px;line-height:1.75}.s-sum.empty{color:var(--sub);font-size:13.5px}
.s-btns{display:flex;gap:8px;margin-top:20px}
.s-btns a{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;padding:11px 6px;border-radius:10px;font:inherit;font-size:13.5px;line-height:1.3;text-decoration:none;
  background:var(--acc);color:#1f1e1d;font-weight:600}
.s-btns a.cl{background:transparent;border:1px solid var(--acc);color:var(--acc)}
.s-close button{width:100%;margin-top:8px;padding:11px;border-radius:10px;background:transparent;border:1px solid var(--line);color:var(--sub);font:inherit;font-size:14px}
.s-cnote{margin-top:8px;color:var(--sub);font-size:11.5px;text-align:center}
#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);z-index:9;max-width:90%;padding:10px 16px;border-radius:10px;background:#faf9f5;color:#1f1e1d;font-size:13.5px;box-shadow:0 6px 20px rgba(0,0,0,.4)}
.seg{display:flex;gap:4px;margin:6px 4px 10px}.seg button{flex:1;min-width:0;border:1px solid var(--line);background:transparent;color:var(--sub);border-radius:8px;padding:7px 0;font:inherit;font-size:12.5px;white-space:nowrap}
.seg.ly{margin-top:-4px}.seg.ly button{padding:5px 0;font-size:12px}.seg.ly button.on{background:var(--card2);border-color:var(--acc);color:var(--text);font-weight:600}
.seg.sm{margin-bottom:8px}.seg.sm button{padding:9px 0;font-size:13px}.seg.sm button.on{background:var(--card2);border-color:var(--acc);color:var(--text)}
.warn{margin:0 4px 10px;padding:8px 10px;border-radius:8px;background:rgba(250,204,21,.08);color:var(--sub);font-size:12.5px;line-height:1.5}.warn b{color:var(--text)}
.seg button.on{background:var(--acc);border-color:var(--acc);color:#1f1e1d;font-weight:600}
.tot{margin:2px 4px 10px;color:var(--sub);font-size:13px}.tot b{color:var(--text)}.chgnote{font-size:11px}
.srow{background:var(--card);border-radius:12px;margin:6px 0;padding:10px 12px;cursor:pointer}.srow.open{background:var(--card2)}
.sline{display:flex;align-items:center;gap:8px}
.rk{width:18px;color:var(--sub);font-size:12px;text-align:right;flex:none}
.mv .gap{display:inline-block;width:3px}.mv{width:30px;flex:none;font-size:11px;font-weight:600;text-align:left;font-variant-numeric:tabular-nums;margin-right:-4px}.mv.up{color:#f87171}.mv.dn{color:#60a5fa}.mv.same{color:#a8a29e;font-size:15px;font-weight:700;line-height:1;padding-left:3px}
.sn{width:86px;flex:none;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb{flex:1;height:10px;background:rgba(255,255,255,.05);border-radius:5px;overflow:hidden;min-width:30px}.sb i{display:block;height:100%;background:var(--acc);border-radius:0 4px 4px 0}
.sc{width:54px;flex:none;text-align:right;font-size:14px;font-variant-numeric:tabular-nums}
.sent{flex:none;display:flex;gap:4px;font-size:10.5px;font-variant-numeric:tabular-nums;width:104px;justify-content:flex-start}.sent i{font-style:normal;white-space:nowrap}
.sent i::before{content:'●';font-size:8px;margin-right:1px;vertical-align:1px}.s-p::before{color:#4ade80}.s-n::before{color:#f87171}.s-u::before{color:#a8a29e}

@media(max-width:520px){.srow .spark{display:none}.srow .sent{flex-direction:column;gap:0;font-size:9.5px;line-height:1.15;width:36px}}
.chg{width:48px;flex:none;text-align:right;font-size:11.5px;color:var(--sub)}.chg.up{color:#f87171}.chg.dn{color:#60a5fa}
.spark{flex:none}
.det{margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.dt{color:var(--sub);font-size:12px;margin:6px 0 4px}
.bars{width:100%;height:auto;display:block}.bars .ax{fill:var(--sub);font-size:10px}.bars .bar:hover rect+rect{opacity:.8}
.crow{display:flex;align-items:center;gap:8px;margin:3px 0;font-size:12.5px}.cl{width:86px;flex:none}.cb{flex:1;height:8px;background:rgba(255,255,255,.05);border-radius:4px;overflow:hidden}
.cb i{display:block;height:100%;background:var(--acc);opacity:.8;border-radius:0 3px 3px 0}.cn{width:50px;text-align:right;flex:none;font-variant-numeric:tabular-nums}
@media(max-width:400px){.spark{display:none}.sn{width:74px}}

ADR은 14% 이상 상승했습니다.","so":"鉅亨網","tm":"11/23 23:51","c":12,"r":"tw","u":"https://news.cnyes.com/news/id/6670197","p":1795445471,"a":1795446979,"t":"〈美股早盤〉黃仁勳回歸點燃美股！那指開盤飆約7% 台積電ADR漲逾14%","su":"엔비디아는 젠슨 황이 즉시 CEO로 복귀하고 이사회에 복귀할 것이라고 발표하여 시장이 열리기 전에 주가가 31% 이상 급등하면서 AI 투자에 대한 열의가 다시 살아났습니다.\n미국 증시는 월요일 다우존스 지수가 1,200포인트 가까이 상승하고, 나스닥 지수가 5.9% 이상 상승하고, 필라델피아 반도체(전자기기의 두뇌 부품) 지수가 12% 가까이 상승하고, TSMC ADR이 14% 이상 상승하는 등 강력한 반격을 펼쳤습니다.\n시장은 여전히 수요일 PCE 물가지수와 연준의 금리 인상 전망에 초점을 맞추고 있습니다. 인플레이션(물건값이 계속 오르는 것)과 정책 불확실성은 반등의 지속성을 시험할 것입니다."},{"s":"엔비디아 주가는 33% 급등했고, 젠슨 황의 복귀 소식에 미국 증시는 급등세를 기록했습니다.","so":"The Business Times","tm":"11/23 23:23","c":11,"r":"sg","u":"https://www.businesstimes.com.sg/international/global/nvidia-shares-jump-33-us-stocks-open-sharply-higher-news-jensen-huangs-return?ref=home-grouped-story-2","p":1795443780,"a":1795447000,"t":"Nvidia shares jump 33%, US stocks open sharply higher on news of Jensen Huang’s return","su":"다우, S&P500(미국 큰 회사 500곳 지수) 및 나스닥(미국 기술 회사들이 많은 주식시장) 지수는 모두 상승했습니다."},{"s":"황 복귀로 AI 상승세 촉발로 미국 증시 급등","so":"WSJ","tm":"11/24 07:01","c":9,"r":"us","u":"https://www.wsj.com/finance/stocks/u-s-stocks-jump-as-huang-return-triggers-ai-rally-7c008308","p":1795471260,"a":1795474219,"t":"U.S. Stocks Jump as Huang Return Triggers AI Rally"},{"s":"미국 주식이 강하게 반등했습니다! 젠슨 황의 복귀로 AI 시장 점화, 월스트리트의 뜨거운 논의 바닥이 나타났습니까?","so":"鉅亨網","tm":"11/24 12:00","c":7,"r":"tw","u":"https://news.cnyes.com/news/id/6670636","p":1795489227,"a":1795490266,"t":"美股強彈！黃仁勳回歸點燃AI行情 華爾街熱議底部已浮現？","su":"엔비디아는 젠슨 황을 CEO로 복귀시켰다고 발표했으며, 이로 인해 월요일 미국 주식이 급등했습니다. S&P500(미국 큰 회사 500곳 지수)은 4.73%, 나스닥은 6.51%, 다우존스는 3.01% 상승했습니다.\n이번 '패닉 안도 반등' 물결 이전에는 3개 주요 지수가 이미 지난 금요일 조정 범위에 진입했고, S&P500 지수는 11월 12일 이후 9% 이상 하락했습니다.\n전략가들은 서로 다른 견해를 가지고 있습니다. 일부는 AI 투자와 시장 바닥이 형성되었다고 믿습니다. 다른 사람들은 자본 지출(공장·장비 등에 쓰는 큰돈) 및 데이터 센터 승인과 같은 해결되지 않은 문제에 대해 우려하고 있습니다."},{"s":"월드 모닝 뉴스: 젠슨 황이 복귀하고 엔비디아가 31% 급등했습니다. 이번에 미국 증시는 정말 안정적인가요?","so":"天下雜誌","tm":"11/24 07:10","c":7,"r":"tw","u":"https://www.cw.com.tw/  힘입어 대만 증시는 24일 개장 이후 기술주 매수에 힘을 모았습니다. Active Allianz Semiconductor(00412A)와 CITIC Japan 및 South Korea PCB 모두 20% 이상 상승했습니다. 그중 활성 Allianz Semiconductor는 한때 장중 거의 30% 증가한 NT$8.37에 도달했습니다. 오전 9시 17분경 현재 26.66% 상승한 NT$8.22에 거래되고 있으며, 거래량이 11,000계약을 넘어섰습니다."},{"s":"엔비디아의 미국 증시는 개장과 동시에 급등했으며 시가총액은 1조 달러 이상 증가했습니다.","so":"Jiemian.com","tm":"11/23 23:58","c":4,"r":"cn","u":"https://m.jiemian.com/article/15364351.html","p":1795445936,"a":1795446972,"t":"英伟达美股开盘大涨，市值增加超1万亿美元","su":"11월 23일 엔비디아의 미국 증시는 개장 당시 32% 급등해 시가총액(회사 전체 몸값)이 1조 달러 이상 증가했고, 총 시가총액은 4조 달러를 회복했습니다. 엔비디아는 같은 날 젠슨 황이 사장 겸 CEO 및 이사회 구성원으로서의 직무를 즉각 재개할 것이라고 발표했습니다."},{"s":"젠슨 황의 복귀 이후 중국 칩 주가 상승","so":"WSJ","tm":"11/24 13:32","c":3,"r":"us","u":"https://www.wsj.com/finance/stocks/nikkei-rises-2-7-led-by-chip-metals-stocks-82c1bb9d","p":1795494720,"a":1795498995,"t":"China Chip Stocks Rise After Jensen Huang’s Return"},{"s":"SharkNinja, S&P500 지수에 합류","so":"Investor's Business Daily","tm":"11/24 08:49","c":3,"r":"us","u":"https://www.investors.com/news/sharkninja-stock-to-join-sp-500-index/","p":1795477740,"a":1795478605,"t":"SharkNinja To Join S&P 500 Index","su":"SharkNinja는 12월 2일에 합류합니다. Paycom은 MidCap 400에서 SharkNinja를 대체합니다."},{"s":"AI 대부 젠슨 황이 강타로 복귀 엔비디아가 하루 만에 시장을 2조 달러 끌어올렸습니다 | 미국 증시 동향 | 국제","so":"經濟日報","tm":"11/24 07:45","c":3,"r":"tw","u":"https://money.udn.com/money/story/123398/9897642?from=edn_related_storybottom","p":1795473928,"a":1795474230,"t":"AI教父黃仁勳重磅回歸 輝達創紀錄單日拉抬市場2兆美元 | 美股動態 | 國際","su":"엔비디아 이사회는 오늘 미국 증시가 개장하기 전에 퇴임하는 CEO 젠슨 황의 복귀를 발표했습니다. 하루종일 주가가 30% 넘게 올랐다. 젠슨 황은 단일 회사의 미국 주식 일일 거래에 대해 글을 씁니다."},{"s":"미국 주식 나스닥은 거의 7% 상승했고 엔비디아는 33% 급등했으며 반도체주는 전체적으로 상승세로 출발했습니다.","so":"Jiemian.com","tm":"11/23 23:59","c":3,"r":"cn","u":"https://m.jiemian.com/article/15364340.html","p":1795445942,"a":1795446974,"t":"美股纳指高开近7%，英伟达大涨33%，芯片股集体高开","su":"23일 뉴스에 따르면 미국 3대 증시는 다우존스지수가 2.78%, S&P500(미국 큰 회사 500곳 지수)지수가 4.93%, 나스닥종합지수가 6.95% 상승하는 등 큰 폭의 상승세를 보였다. 젠슨 황 CEO가 직무를 재개했다는 소식에 자극을 받아 반도체(전자기기 ? 대만주식, 미국주식, 비상장OTC주식의 주식규정을 한번에 살펴보세요","so":"UDN","tm":"11/23 16:05","c":2,"r":"tw","u":"https://udn.com/news/story/7243/9896482","p":1795417524,"a":1795423977,"t":"賣股賠錢能抵稅嗎？台股、美股、未上市櫃股票規則一次看","su":"개인이 주식을 팔아 손실을 본 경우, 세금 신고 시 공제받을 수 있나요? 대답은 당신이 어떤 주식을 사느냐에 따라 달라집니다. 일반적으로 투자자가 국내 상장(주식시장에 처음 들어오는 것)주식과 장외주식을 매매할 때 매각 손실은 급여나 배당(회사가 주주에게 나눠주는 돈)금 수입을 상쇄하는 데 사용될 수 없습니다. 미국 주식에 투자하는 경우 해당 연도 해외 부동산 거래에서 판매 손실을 공제할 수 있습니다. 국내 비상장 OTC 주식은 규정이 다릅니다. 조건을 충족하여 당해 연도에 전액 공제할 수 없는 경우에는 다음 연도부터 3년 이내에 공제할 수도 있습니다."},{"s":"미국 기술주가 전반적으로 급등했습니다!","so":"每日经济新闻","tm":"11/23 15:08","c":2,"r":"cn","u":"https://www.nbd.com.cn/articles/2026-11-23/4655728.html","p":1795414080,"a":1795423974,"t":"美股科技股，全线大涨！","su":"기자 | 편집자 루샹용 | He Xiaotao와 Xiang Jianglin 교정자 | Cheng Peng 베이징 시간으로 11월 23일, 미국 기술주 암시장은 전반적으로 급등했습니다. 보도 시점 기준 엔비디아는 7% 이상, SK하이닉스는 9% 이상, 마이크론 테크놀로지는 6% 이상, 인텔은 6% 이상, TSMC는 6% 이상 상승했다. (면책조항: 텍스트"},{"s":"[미국 주식 전망] 주요 은행들의 견해는 엇갈린다. 웰스파고는 신용등급을 '가장 낙관적'으로 상향했다. 캐슬증권은 8년 전 자산 매각이 반복돼 우려된다.","so":"香港經濟日報HKET","tm":"11/24 15:39","c":1,"r":"hk","u":"https://inews.hket.com/article/4230067/%E3%80%90%E7%BE%8E%E8%82%A1%E5%89%8D%E7%9E%BB%E3%80%91%E5%A4%A7%E8%A1%8C%E7%9C%8B%E6%B3%95%E5%88%86%E6%AD%A7%E3%80%80%E5%AF%8C%E5%9C%8B%E4%B8%8A%E8%AA%BF%E8%87%B3%E3%80%8C%E6%9C%80%E7%9C%8B%E5%A5%BD%E3%80%8D%E8%A9%95%E7%B4%9A%E3%80%80%E5%9F%8E%E5%A0%A1%E8%AD%89%E5%88%B8%E6%86%82%E9%87%8D%E6%BC%948%E5%B9%B4%E5%89%8D%E8%B3%87%E7%94%A2%E6%8B%8B%E5%94%AE%E5%B8%82%E6%B3%81","p":1795502379,"a":1795503018,"t":"【美股前瞻】大行看法分歧 富國上調至「最看好」評級 城堡證券憂重演8年前資產拋售市況"},{"s":"트럼프가 임명한 연준 이사 보우먼은 뱅크 오브 아메리카(뱅크오브아메리카) 개인 만찬에서 조사 중인 조사 중에 침묵을 지켰다.","so":"鉅亨網","tm":"11/24 14:40","c":1,"r":"tw","u":"https://news.cnyes.com/news/id/6670400","p":1795498844,"a":1795503010,"t":"川普欽點Fed理事鮑曼遭調查 緘默期出席美銀私人晚宴","su":"연준(미국의 중앙은행) 내부 감시단은 보먼 국장이 지난 6월 회의 후 뱅크오브아메리카 비공개 만찬에 참석해 묵념 기간을 위반했는지 조사하고 있다.\nBowman은 위반 사항을 부인합니다. 워렌 의원과 다른 민주당 상원의원 3명은 연준 감찰관에게 외부 활동 시스템을 조사하고 검토해 줄 것을 요청했습니다.\n위반 사항이 발견되면 감찰관은 드물게 공개적으로 질책할 수 있습니다. 저녁 이 CNBC가 연동하여 유명 해설자를 맞아 투자 정보 분석을 전개합니다."},{"s":"황의 복귀로 AI 주식 상승세가 촉발되면서 아시아 주식 반등","so":"WSJ","tm":"11/24 13:42","c":1,"r":"us","u":"https://www.wsj.com/finance/stocks/asian-equities-rebound-as-huang-reinstatement-sparks-ai-stock-rally-515acdd2","p":1795495320,"a":1795503002,"t":"Asian Equities Rebound as Huang Reinstatement Sparks AI-Stock Rally"},{"s":"시장이 너무 감정적으로 주도되는 걸까요? 젠슨 황의 복귀는 미국 주식의 엄청난 반등을 촉발했으며 엔비디아는 하루 만에 31% 급등했습니다.","so":"鉅亨網","tm":"11/24 13:20","c":1,"r":"tw","u":"https://news.cnyes.com/news/id/6670427","p":1795494009,"a":1795499011,"t":"市場過度受情緒主導？黃仁勳復職引爆美股史詩級反彈、輝達單日暴漲31%","su":"젠슨 황은 엔비디아의 CEO로 복귀하여 NVDA를 하루 만에 31% 급등시켰고, 시가총액(회사 전체 몸값)을 약 1조 달러 증가시켰습니다. 이는 단일 회사의 일일 시장 가치 증가 중 최대 규모입니다.\n나스닥은 6.5%, S&P500(미국 큰 회사 500곳 지수)은 4.7%, 필라델피아 반도체 지수는 14% 상승하는 등 기술주가 전반적으로 반등했습니다. AI 컨셉주도 비트코인, 금 등 자산과 함께 상승했다.\nAI 투자 수익과 연준의 금리 인상에 대한 시장의 의구심은 사라지지 않았다. 분석가들은 시장이 심리에 편향되어 있으며 변동성 위험이 여전히 높다고 경고했습니다."},{"s":"NY주 1400달러 높음","so":"毎日新聞","tm":"11/24 13:08","c":1,"r":"jp","u":"https://mainichi.jp/articles/20261124/dde/001/020/022000c","p":1795493301,"a":1795499029,"t":"NY株1400ドル高","su":"23일 뉴욕 주식시장은 급반발해 다우공업주 30종 평균은 전주말 대비 1447·98달러 높은 4만9595·31달러로 거래를 마쳤다. 엔비디아가 젠슨 황 씨의 CEO 복귀를 발표한 것으로 시장에서 인공지능(AI)을 둘러싼 선행 불투명감이 희미해져 안도감이 퍼졌다. 【워싱턴 아사카와 다이키"},{"s":"AI 가짜 사진은 한때 미국 주식의 변동을 일으켰습니다. 교육부, 이미지 인식 수업 계획 출시","so":"自由時報","tm":"11/24 12:52","c":1,"r":"tw","u":"https://news.ltn.com.tw/news/life/breakingnews/5651447","p":1795492326,"a":1795499011,"t":"AI假照片曾引發美股波動 教育部推影像辨識教案","su":"'미 국방부 폭발' 사진이 소셜 플랫폼에 유포돼 증시에도 일시적인 변동이 빚어졌다. 나중에 알고 보니 AI가 생성한 가짜 사진이었습니다! AI가 생성한 이미지의 진위 여부를 구별하기 어려운 상황에 대해 교육부는 대만 사실 확인 교육 재단(Taiwan Fact Checking Education Foundation)의 교육 전문가인 Zhang Yuteng을 초청하여 대학 교사들이 허위 정보에 현혹되지 않도록 학생들이 \"먼저 의심하고 관찰한 다음 확인하는\" 습관을 기르도록 지도하는 데 사용할 \"AI 시대의 이미지 생성 및 인식\"에 대한 강의 계획을 작성했습니다. 정수진 교육부 기술부장은 오늘(24일) 디지털 기술의 대중화로 각종 정보와 뉴스의 전파 속도가 빨라져 진위 여부를 구별하기 어렵다고 설명했다. 새로운 수업 계획은 AI 이미지 생성의 원리, 식별 방법 및 검증 프로세스를 사례 분석, 도구 작동 및 상황별 연습과 결합하여 학생들이 AI 기술의 가능성과 한계를 이해하고 AI를 책임감 있게 사용하는 방법에 대해 생각할 수 있도록 합니다."},{"s":"'미국 주식' 집중주: 젠슨 황의 복직을 위해 AI 경고가 해제됐나? 엔비디아의 시가총액은 하루 만에 거의 1조 달러로 증가했습니다.","so":"旺得富理財網","tm":"11/24 12:11","c":1,"r":"tw","u":"https://wantrich.chinatimes.com/news/20261124900169-420201","p":1795489888,"a":1795499014,"t":"《美股》焦點股：黃仁勳復職AI警報已解除？NVIDIA市值1天增近1兆美元- 國際","su":"[타임즈 편집: Liu Jigang 및 종합 외신 보도] 포커스 주식: ●23일 미국 주식에서 엔비디아의 주가는 급등하며 마침내 31.5%를 기록하며 23년 만에 최대 일일 상승률을 기록했습니다. 이는 주로 젠슨 황이 엔비디아의 수장으로 복귀했기 때문입니다. 외신들은 이 소식을 계기로 반등(내렸다가 다시 오르는 것)파가 계속될 수도 있지만 엔비디아를 비롯한 AI 컨셉주에 대해서는 여전히 조심스러운 태도를 유지할 필요가 있다고 지적했습니다. 왜냐하면 엔비디아가 다음과 같은 일에 관여하고 있기 때문입니다."},{"s":"젠슨 황의 복직 이후 미국 증시는 E펀드 AI ETF(03489)의 주요 보유업체인 엔비디아가 하루 만에 31.48% 급등하는 등 들끓고 있다.","so":"Jiemian.com","tm":"11/24 12:04","c":1,"r":"cn","u":"https://m.jiemian.com/article/15366346.html","p":1795489453,"a":1795490250,"t":"黄仁勋复职美股沸腾，易方达AI ETF(03489)重仓股英伟达单日飙涨31.48%","su":"동부 표준시 기준 11월 23일, 엔비디아는 젠슨 황이 CEO 자리를 재개할 것이라고 공식 발표했으며, 미국 기술 및 반도체(전자기기의 두뇌 부품) 부문의 위험 선호도는 빠르게 회복되었습니다. 필라델피아 반도체 지수(SOXX)는 밤새 13.67% 상승했고, 엔비디아(NVDA)는 하루 만에 31.48% 상승했습니다."},{"s":"월 100억엔 이상의 자금유입투신 S&P500 연동형이 75개월 연속","so":"日本経済新聞","tm":"11/24 12:00","c":1,"r":"jp","u":"https://www.nikkei.com/article/DGXZQOUB192UP0Z11C26A1000000/","p":1795489200,"a":1795499029,"t":"月100億円以上の資金流入投信 S&P500連動型が75カ月連続","su":"개인 투자자의 인기를 모으고 있는 펀드는 어느 것인가. 2026년 10월까지 월 100억엔 이상의 자금유입이 연속한 월수로 랭킹했다. 선두는 'eMAXIS Slim 미국 주식(S&P500(미국 큰 회사 500곳 지수))'의 75개월이었다. 2위는 동 시리즈의 「전세계 주식(올 컨트리)」의 71개월. 상위에는 저비용으로 미국주나 전 세계주에 투자할 수 있는 인덱스(지수연동)형이 두드러진다."},{"s":"실시간 업데이트: 황의 엔비디아 복귀로 인한 주가 상승 및 국회의원 회의론","so":"The New York Times","tm":"11/24 11:58","c":1,"r":"us","u":"https://www.nytimes.com/live/2026/11/23/technology/nvidia-jensen-huang-reinstated","p":1795489098,"a":1795490245,"t":"Live Updates: Huang’s Return to Nvidia Sparks Stock Rally and Lawmaker Skepticism"},{"s":"트럼프 2.0이 젠슨 황 2.0과 힘을 합친다. 월스트리트의 드라마는 어떻게 끝날 것인가?","so":"工商時報","tm":"11/24 11:49","c":1,"r":"tw","u":"https://www.ctee.com.tw/news/20261124700979-430801","p"  증시에서는 하이테크 주비율이 높은 나스닥(미국 기술 회사들이 많은 주식시장) 종합주가지수가 전주말 대비 7% 높다고 급반발해 일본주에도 매입이 파급됐다. 미국 엔비디아주는 23일 최고경영책임자(CEO)를 사임한 젠슨 황씨의 CEO 복귀를 발표해 30% 초 급신했다. 도쿄 시장에서도 단기적으로 투자자 심리"},{"s":"뉴욕 연준 윌리엄스: 인플레이션을 막기 위해 아직 해야 할 일이 남아 있어 추가 긴축 가능성이 있음을 암시","so":"鉅亨網","tm":"11/24 10:30","c":1,"r":"tw","u":"https://news.cnyes.com/news/id/6670394","p":1795483820,"a":1795490269,"t":"紐約Fed威廉斯：抗通膨仍有工作要做 暗示可能進一步緊縮","su":"윌리엄스 뉴욕 연준 총재는 인플레이션(물건값이 계속 오르는 것)이 여전히 너무 높기 때문에 연준은 계속해서 긴축 통화 정책을 추진해야 한다고 말했습니다.\n그는 물가상승률이 연말 3.5%, 내년에는 2%를 소폭 웃돌 것으로 내다봤다. 12/8~9 회의 자료를 토대로 조치를 취할 예정입니다.\n시장에서는 연준이 다음 달 금리를 0.25%포인트(퍼센트끼리 뺀 차이) 인상할 것으로 예상하고 있습니다. 윌리엄스는 에너지, 관세, 지정학이 가격을 상승시켰지만 아직 확산되지는 않았다고 말했습니다."},{"s":"[숏폼] 뉴욕증시, 젠슨 황 복귀에 '환호' 월가 매도세 '당장은' 멈춰","so":"SBS Biz","tm":"11/24 10:19","c":1,"r":"kr","u":"https://biz.sbs.co.kr/amp/article/20000348420","p":1795483140,"a":1795490245,"su":"[숏폼] 뉴욕증시, 젠슨 황 복귀에 '환호' 월가 \"매도세(팔려는 힘) '당장은' 멈춰\" SBS Biz 입력2026.11.24 10:19 수정2026.11.24 10:19 ⓒ SBS Medianet & SBSi 무단복제-재배포 금지"},{"s":"해외시장뷰&미국주 픽업(11월 24일)","so":"日本経済新聞","tm":"11/24 10:17","c":1,"r":"jp","u":"https://www.nikkei.com/prime/veritas/article/DGXZQOKC2418I0U6A121C2000000","p":1795483026,"a":1795499030,"t":"海外市場ビュー&米国株ピックアップ（11月24日）","su":"팬 CEO 복귀로 지난 주말의 급락으로부터의 환매 가속 도카이 도쿄 증권 미국 나카가와 지요씨 미국을 비롯한 해외 시장의 동향을 점검합니다. 화요일부터 금요일은 뉴욕 시장 관계자와 중계를 맺었다."},{"s":"시판 전 전략 | 젠슨 황은 미국 주식에서 격렬한 반등을 재개하고 홍콩 주식은 반등을 따라갈 것으로 예상되며 먼저 22800의 저항을 살펴 봅니다.","so":"etnet 經濟通","tm":"11/24 10:15","c":1,"r":"hk","u":"https://www.etnet.com.hk/www/tc/news/news-article.php?section=features&category=focus&newsid=417908","p":1795482900,"a":1795490270,"t":"盤前攻略 | 黃仁勳復辟美股暴力反彈，港股料跟彈先望阻力22800","su":"시판 전 전략 | 젠슨 황은 미국 주식에서 격렬한 반등을 재개하고, 홍콩 주식은 22800에서 반등을 따라가며 저항을 찾을 것으로 예상됩니다. 엔비디아는 젠슨 황이 즉시 CEO 자리를 재개할 것이라고 발표했습니다. 그는 미국 정부의 의견을 들었다고 인정했다. 트럼프 미국 대통령도 젠슨 황을 복직시키기 위해 이사회를 설득했다고 인정했다. 엔비디아의 주가는 밤새 31.5% 급등했고, 젠슨 황의 복귀로 미국 증시 전체가 이익을 얻었습니다. 특히 마이크론(US.MU)이 19%, 샌디스크(US.SNDK)가 10%, SK하이닉스ADR(US.SKHY)이 20% 급등하는 등 반도체(전자기기의 두뇌 부품)주가 전반적으로 급등하며 필라델피아반도체지수는 1,179포인트(14.03%) 급등했다. (자료사진) 3대 지수가 모두 폭발했다. 다우지수는 1,447포인트(3.01%) 오른 49,595에, 나스닥(미국 기술 회사들이 많은 주식시장)은 1,471포인트(6.51%) 오른 24,089에, S&P는 326포인트(4.73%) 오른 7,237에 장을 마감했습니다."},{"s":"동증, 일시 5만 8000엔 회복","so":"産経ニュース","tm":"11/24 10:13","c":1,"r":"jp","u":"https://www.sankei.com/article/20261124-OGJYXKGYLRNWLFJIV7IEZ6JXPM/","p":1795482807,"a":1795490279,"t":"東証、一時5万8000円回復 米国株高が追い風、AIや半導体関連銘柄に買い注文優勢","su":"연휴 24일 오전 도쿄 주식시장은 닛케이 평균 주가(225종)가 반발했다. 인상폭은 한때 2200엔을 넘어 5만8000엔을 회복했다. 전날 미국 주식 고가 몰래 바뀌고 ..."},{"s":"\"너무 충격을 받아서 의자에서 떨어졌어요!\" 젠슨 황이 돌아오는 날 월스트리트는 미쳐간다","so":"财联社","tm":"11/24 10:09","c":1,"r":"cn","u":"https://www.cls.cn/detail/2542543","p":1795482540,"a":1795490255,"t":"“惊得我从椅子上摔下来”！黄仁勋回归日 华尔街也癫狂了","su":"① 월요일 뉴욕 시간 오전 9시 직전에 엔비디아는 젠슨 황이 회사의 수장으로 복귀한다고 발표했는데, 이는 AI 건설 관련 주식에 대한 월스트리트의 열광에 거의 즉시 불을 붙였습니다. ② 이번 '젠슨 황 복귀일' 시장의 미친 성과는 많은 월스트리트 사람들에게 오랫동안 기억될 운명이다. 차이롄서, 11월 24일(Editor Xiaoxiang) 일요일 저녁 Credent Wealth Management의 최고 투자 책임자인 Edison Byzyka는 지난주 급격한 시장 매도 이후 가능한 시장 동향에 대해 동료들과 논의하기 위해 Zoom 회의에 참여하여 1시간 30분을 보냈습니다. 그와 그의 팀은 인공 지능 개념 주식의 지속적인 하락에 따른 영향에 대처하기 위해 오랫동안 \"종말 시장\"에 정신적으로 준비되어 왔습니다. 그러나 그들이 예상하지 못한 것은 거래의 \"핵심 인물\"인 젠슨 황이 엔비디아의 CEO로 곧 복귀할 것이라는 것과 그의 복귀가 미국 주식의 엄청난 반등(내렸다가 다시 오르는 것)을 촉발할 것이라는 점이었습니다."},{"s":"미국 주식이 급등했습니다! 젠슨 황이 돌아오고 엔비디아 주가가 급등합니다! 국제 유가는 폭락했고 미국 원유는 80달러에 육박했으며 금과 은은 모두 상승했습니다.","so":"21财经","tm":"11/24 10:03","c":1,"r":"cn","u":"https://www.21jingji.com/article/20261124/herald/e80c0b83cb50be210995f039c4894379.html","p":1795482180,"a":1795499004,"t":"美股大涨！黄仁勋回归，英伟达股价暴涨！国际油价大跌，美油逼近80美元，黄金白银齐涨","su":"11월 23일 동부 표준시, 나스닥, S&P500(미국 큰 회사 500곳 지수) 지수, 필라델피아 반도체(전자기기의 두뇌 부품) 지수는 모두 2025년 4월 이후 최대 일일 상승폭을 기록했습니다. 마감 기준 S&P500 지수는 4.73% 상승한 7237.17포인트를 기록했습니다. 나스닥 종합지수는 6.51% 상승한 24089.56포인트를 기록했습니다. 다우존스산업평균지수는 3.01% 오른 49595.31포인트를 기록했다. 테슬라는 11.46%, 메타는 6.55%, 구글은 6.34%, 아마존은 3.47%, 애플은 1.9%, 마이크로소프트는 1.65% 상승하는 등 미국 7대 기술 대기업이 전반적으로 급등했다. 앤트로픽 주가는 이날 1.43% 하락하며 약세를 보였다. 지난 주, 앤트로픽이 역사상 최대 규모의 기업공개(IPO)를 마무리했음에도 불구하고 AI 지출 속도에 대한 우려로 인해 혼란이 촉발되었습니다."},{"s":"머스크 AI(머스크 AI) 뒤의 생명보험 금융업자는 월스트리트를 복잡한 금융망으로 불안하게 만든다 | 뉴욕타임스 정치","so":"聯合報數位版","tm":"11/24 10:00","c":1,"r":"tw","u":"https://vip.udn.com/vip/story/124852/9896498?from=vipudn_newest_index","p":1795482000,"a":1795503012,"t":"馬斯克AI背後的壽險金主讓華爾街緊張的複雜融資鏈| 紐時政經","su":"테슬라 CEO 머스크는 올해 AI 칩을 구입하기 위해 수십억 달러가 필요하며, 월스트리트는 그를 위해 예상치 못한 자금 조달(사업에 쓸 돈을 모으는 것)자를 찾았습니다. 바로 생명 보험 정책과 퇴직 연금을 관리하는 보험 회사입니다. 이것은 고립된 사례가 아닙니다. 늘 보수적인 투자자로 여겨져 왔던 미국 생명보험업계는 AI 열풍에 점점 더 많은 자금을 투자하고 있으며, 거대 기술기업의 데이터센터(컴퓨터 수만 대를 모아 둔 건물) 확장에 막대한 자금을 지원하기까지 한다. 이러한 투자는 안전해 보이지만 월스트리트의 일부 대형 금융 기관으로부터 경고를 받았습니다. AI 거대 기업이 확장을 서두르고 보험 업계가 자금을 제공하기 위해 안간힘을 쓰는 가운데 이러한 거래를 의심스럽게 만드는 것은 정확히 무엇입니까?"},{"s":"미국 증시 급락이 개입을 촉발했다? 트럼프: 젠슨 황은 뇌에 다른 누구도 모르는 칩을 갖고 있다","so":"鉅亨網","tm":"11/24 09:58","c":1,"r":"tw","u":"https://news.cnyes.com/news/id/6670389","p":1795481886,"a":1795504048,"t":"美股暴跌促成介入？川普：黃仁勳腦中還有別人不知道的晶片","su":"트럼프 대통령은 자신이 엔비디아 이사회를 설득해 젠슨 황을 CEO로 복귀시키는 것이 국가 안보에 위협이 될 것이라고 말했다.\n엔비디아는 젠슨 황이 사임한 지 불과 11일 만에 사장, CEO 및 이사로 복귀했다고 발표했습니다. 이사회는 정부로부터 국가 안보 보장을 받았다고 밝혔다.\n복직 후에도 수사가 계속되면서 의회 내에서는 양당의 비난이 거세졌다. 젠슨 황은 비공개 인터뷰를 수락하고 12월 1일 이후 의회에서 증언할 예정입니다."},{"s":"이익 전망은 탄탄한데…미국 증시 발목잡는 유동성","so":"아시아경제","tm":"11/24 09:53","c":1,"r":"kr","u":"https://www.asiae.co.kr/article/2026112314483465278","p":1795481580,"a":1795490245,"su":"미국 증시 조정의 배경으로 기업 실적 우려와 함께 긴축 정책에 따른 유동성(시장에 도는 돈의 양) 부담이 지목되고 있다. 일부 투자자들이 신규 매수보다 보유 비중 축소를 우선하면서 매도 물량을 받아낼 수요가 충분하지 않다는 분석이다. 기업 이익과 회사채 시장이 버팀목으로 거론되는 가운데, 향후 물가(물건값 전체의 수준) 흐름과 통화정책 방향이 투자심리 회복의 주요 변수가 될 전망이다. 신용·미수 이용자는 이러한 시장 변화와 별개로 계좌의 담보비율과 상환 일정, 누적 금융 비용을 확인할 필요가 있다."},{"s":"\"선물\" 젠슨 황이 사무실로 복귀하여 미국 주식을 폭발시켰습니다! 대만지수선물 3400포인트 이상 급등, 전자선물 상한가 - 증권","so":"工商時報","tm":"11/24 09:52","c":1,"r":"tw","u":"https://www.ctee.com.tw/news/20261124700735-430201","p":1795481520,"a":1795503014,"t":"《期貨》黃仁勳回任炸裂美股！ 台指期飆逾3400點、電子期觸漲停- 證券","su":"[타임스 궈홍휘 기자] 엔비디아는 젠슨 황이 CEO로 복귀했다고 발표하며 AI 투자 열풍을 다시 불러일으켰다. 미국 증시는 월요일 강한 반등세를 보이며 4개 주요 지수가 모두 녹색으 jp/articles/20261124/k00/00m/020/004000c","p":1795480175,"a":1795490281,"t":"NYダウ急反発 エヌビディアの時価総額、1日で151兆円増","su":"23일 뉴욕 주식시장은 급반발해 다우공업주 30종 평균은 전주말 대비 1447·98달러 높은 4만9595·31달러로 거래를 마쳤다. 미국 반도체(전자기기의 두뇌 부품) 대기업 엔비디아가 젠슨 황 씨의 최고경영책임자(CEO) 복귀를 발표한 것으로, 시장에서 인공지능(AI)을 둘러싼 선행 불투명감이 희미해져 안도감이"},{"s":"미국 증시 AI 스토리지 부문 급등, SK하이닉스 20% 상승丨미국 증시 마감 검토","so":"21财经","tm":"11/24 09:27","c":1,"r":"cn","u":"https://www.21jingji.com/article/20261124/herald/5dba91bedab38c44d13a3da8dd3789e8.html","p":1795480020,"a":1795490256,"t":"美股AI存储板块大幅上涨，SK海力士大涨20%丨美股复盘","su":"동부 표준시 기준 11월 23일에는 AI 스토리지 부문이 급등했다. 젠슨 황의 복귀는 AI 관련 주식의 전반적인 상승으로 이어졌고, 스토리지 개념이 전반적으로 상승했습니다. 마감 현재 SK하이닉스는 20.00% 상승한 $124.28로 마감했습니다. 마이크론는 19.04% 상승한 $707.70에 마감했습니다. 스토리지 개념이 전반적으로 상승했습니다. 젠슨 황의 복직은 AI 관련 주식의 광범위한 상승으로 이어졌습니다. 필라델피아 반도체(전자기기의 두뇌 부품) 지수는 14% 상승해 2025년 이후 최대 일일 상승폭을 기록했습니다. 엔비디아는 주당 미화 165.05달러로 31% 이상 급등했으며, 시가총액(회사 전체 몸값)은 하루 만에 9,520억 달러 증가했습니다. 마이크론 테크놀로지는 19%, 인텔은 16% 이상, TSMC는 14% 상승했다. 스토리지 개념이 전반적으로 떠오르고 있습니다. SK하이닉스는 20%, 희롱기술은 18.01%, 램버스는 14.06% 상승했다."},{"s":"미국 주식이 급격하게 반등했습니다! 월스트리트에서는 '젠슨 황의 복귀'에 대해 뜨거운 논의를 하고 있다. 단기 바닥이 확립됐는가?","so":"财联社","tm":"11/24 09:25","c":1,"r":"cn","u":"https://www.cls.cn/detail/2542457","p":1795479900,"a":1795490257,"t":"美股暴力反弹！华尔街热议“黄仁勋回归” ：短期底部已确立？","su":"① 월요일, 엔비디아가 젠슨 황의 CEO 복귀를 발표하자 미국 주요 주가 지수가 격렬하게 반등했습니다. ② 젠슨 황이 왕으로 돌아오면서 월스트리트 분석가들은 이러한 매도 물결이 적어도 일시적으로 끝날 수 있다고 믿습니다. ③ 그러나 엔비디아와 이러한 강세장(주가가 오랫동안 오르는 시기)을 뒷받침하는 '인공지능 거래'를 둘러싼 몇 가지 핵심적인 해결되지 않은 문제가 여전히 남아 있습니다. 차이롄서, 11월 24일(편집장 전천) 월요일 미국 주요 증시가 급등했다. 젠슨 황을 CEO로 복귀시키겠다는 엔비디아의 발표는 투자자들에게 지난 주의 끊임없는 매도 압력이 적어도 일시적으로 가라앉을 수 있다는 희망을 줍니다. 그러나 전략가들은 상승세(오르는 흐름)가 얼마나 오래 지속될 수 있는지에 대해 의견이 분분합니다. 일부에서는 주식시장 조정이 끝났다고 믿는 반면, 다른 일부에서는 황 총리가 퇴임하기 전에 남아 있는 문제들이 하락세에 영향을 미쳤다고 우려합니다."},{"s":"월스트리트 상승세로 S&P500과 다우 지수는 조정 국면에서 빠져나옴","so":"Fox Business","tm":"11/24 09:24","c":1,"r":"us","u":"https://www.foxbusiness.com/video/6408788167112","p":1795479894,"a":1795490247,"t":"S&P 500 and Dow exit correction territory as Wall Street rallies","su":"US Bank Asset Management Group의 수석 투자 전략가인 Robert Haworth는 'The Claman Countdown'에서 하이퍼스케일러, 반도체(전자기기의 두뇌 부품) 회사, 생명공학 및 의료 기술주 중 최고 상승주를 분석했습니다."},{"s":"CITIC Securities: 미국 주식의 23×5 거래가 개시되어 증권사에 글로벌 서비스를 위한 새로운 기회가 열림","so":"第一财经","tm":"11/24 09:14","c":1,"r":"cn","u":"https://m.yicai.com/news/103451269.html","p":1795479267,"a":1795499006,"t":"中信证券：美股23×5交易开启，开拓券商全球服务新机遇","su":"CITIC 증권 조사 보고서에 따르면 미국 증시는 새로운 7시간 야간 거래를 추가할 계획이며 일광 절약 시간은 A주 및 H주와 각각 4시간 및 5.5시간 겹칠 것이라고 밝혔습니다. 야간거래의 유동성(시장에 도는 돈의 양)과 거래비용도 개선될 것으로 예상된다. 미국 주식의 거래 연장 이후 익일 거래량은 미국 주식의 일부 고시장 스타 타겟에 집중될 것입니다. 홍콩 주식의 기술 및 임의 소비재 산업은 강력한 자본 전환 압력에 직면해 있습니다. 금융 및 유틸리티 산업은 매우 방어적이며 A주의 직접적인 전환은 제한되어 있습니다. 홍콩의 주요 중국 증권사는 \"연구 서비스 - 거래 실행 - 기관 서비스\"의 풀체인 서비스를 형성할 것으로 예상됩니다. 온라인 브로커는 거래량 증가와 ETF(여러 주식을 묶어 파는 상품) 배정 수요 증가로 수혜를 입을 것으로 예상되며, 수수료 수익도 증가할 것으로 예상된다. ROE가 높고 다양한 해외 자회사를 활용하는 브로커와 강력한 자산 관리 기능을 갖춘 온라인 브로커를 권장합니다."},{"s":"\"미국 주식\" 마감 보고서: 트럼프가 추수감사절 전에 큰 선물을 줍니다! Lao 황의 AI 주식 및 반도체주로의 복귀 - 국제","so":"旺得富理財網","tm":"11/24 09:11","c":1,"r":"tw","u":"https://wantrich.chinatimes.com/news/20261124900068-420201","p":1795479084,"a":1795503017,"t":"《美股》收盤速報：感恩節前川普送大禮！老黃回鍋AI股晶片股狂噴- 國際","su":"[타임즈-타이페이] 젠슨 황이 엔비디아의 CEO로 복귀했습니다. 월요일(23일) 4대 지수가 급등했다. S&P500(미국 큰 회사 500곳 지수)과 나스닥은 트럼프 대통령이 2025년 4월 '해방절' 관세를 중단한 이후 하루 최대 상승폭을 기록했다. 필라델피아 반도체(전자기기의 두뇌 부품) 지수는 14% 급등했다. 엔비디아는 31.5% 상승해 2003년 5월 9일 이후 최대 일일 상승률을 기록했습니다. 엔비디아 컨셉 주식, AI 관련 주식 및 반도체주가 축하 행사를 열었습니다. 마이크론 19% 상승, SK하이닉스 20% 상승, 인텔 상승…"},{"s":"중국은 가족들이 집이 아닌 주식에 저축하기를 원했지만 시장은 하락했습니다.","so":"Financial Times","tm":"11/24 09:11","c":1,"r":"world","u":"https://www.ft.com/content/45c49a84-53cc-44ed-9aab-0dc79f564278?syn-25a6b1a6=1","p":1795479074,"a":1795490282,"t":"China wanted families to put savings in shares not homes — then markets fell"},{"s":"T모닝포스트 | 젠슨 황이 엔비디아로 복귀합니다. 미국 주식 AI 부문 급증; 미국, 해외 데이터센터 건설 제한할 계획","so":"财新网","tm":"11/24 09:10","c":1,"r":"cn","u":"https://m.caixin.com/m/2026-11-24/102508156.html","p":1795479000  Russell 1000 성장 지수 상승의 40% 이상, 나스닥 100 지수 상승의 약 4분의 1에 기여했습니다. 그러나 불과 며칠 전만 해도 엔비디아는 나스닥 100이 약세장(주가가 오랫동안 내리는 시기)에 가까워지는 6주간의 매도세(팔려는 힘)의 중심에 있었습니다."},{"s":"미국 주식 기업공개(IPO) | Nscale은 상장 전 브레이크를 밟고, 불필요한 채용을 중단하고 비용을 절감했습니다.","so":"etnet 經濟通","tm":"11/24 04:20","c":1,"r":"hk","u":"https://www.etnet.com.hk/www/tc/news/news-article.php?category=usstocksfeature&newsid=417868","p":1795461600,"a":1795499019,"t":"美股IPO | Nscale上市前急踩煞車，暫停非必要招聘、削開支","su":"2026/11/24 03:20 미국 주식 기업공개(IPO) | Nscale은 상장(주식시장에 처음 들어오는 것)하기 전에 브레이크를 밟아 불필요한 채용을 중단하고 비용을 절감했습니다. 영국의 인공지능 데이터센터(컴퓨터 수만 대를 모아 둔 건물) 운영업체 엔스케일(Nscale)이 기업가치 350억 달러를 목표로 기업공개(IPO)를 준비하며 비용 통제를 강화하고, 비필수 채용을 중단하고 재량비용을 삭감하고 있다. Financial Times에 따르면 이 문제에 정통한 두 사람에 따르면 Nscale 최고 운영 책임자(COO)인 Justin Osofsky는 이번 달 내부 이메일을 통해 직원들에게 회사가 주요 직위를 제외하고 채용을 중단하고 불필요한 비용을 줄일 것이라고 통보했다고 밝혔습니다. 이번 조치는 주로 물류 및 사무 기능을 대상으로 하며, 데이터센터 건설과 관련된 직위는 영향을 받지 않는다. 회사의 직원 수는 2026년 초 약 300명에서 약 1,100명으로 급격히 늘어났다."},{"s":"S&P500 배당금 및 잉여현금(^SPDV5UT) 계절별 수익률 차트","so":"Yahoo Finance UK","tm":"11/24 04:19","c":1,"r":"us","u":"https://uk.finance.yahoo.com/quote/%5ESPDV5UT/seasonality/","p":1795461579,"a":1795499000,"t":"S&P 500 Dividend and Free Cash (^SPDV5UT) Seasonal returns chart"},{"s":"미국 증시 동향 | 젠슨 황은 12월 3일 미국 상원 공청회에 참석하기로 동의했습니다.","so":"etnet 經濟通","tm":"11/24 04:19","c":1,"r":"hk","u":"https://www.etnet.com.hk/www/tc/us-stocks/news-article/417865/%E7%BE%8E%E8%82%A1%E5%8B%95%E5%90%91+%7C+%E9%BB%83%E4%BB%81%E5%8B%B3%E5%90%8C%E6%84%8F12%E6%9C%883%E6%97%A5%E5%87%BA%E5%B8%AD%E7%BE%8E%E5%8F%83%E8%AD%B0%E9%99%A2%E5%85%AC%E9%96%8B%E8%81%BD%E8%AD%89%E6%9C%83?topic=%E9%87%8D%E9%BB%9E%E6%96%B0%E8%81%9E","p":1795461540,"a":1795499021,"t":"美股動向 | 黃仁勳同意12月3日出席美參議院公開聽證會"},{"s":"미국 증시 동향 | AI 우려로 인해 S&P500이 조정 구간에 진입했고 나스닥은 연중 하락세를 보였습니다.","so":"etnet 經濟通","tm":"11/24 04:10","c":1,"r":"hk","u":"https://www.etnet.com.hk/www/tc/us-stocks/news-article/417864/%E7%BE%8E%E8%82%A1%E5%8B%95%E5%90%91%7CAI%E6%86%82%E6%85%AE%E6%8B%96%E7%B4%AF%E6%A8%99%E6%99%AE500%E /tc/us-stocks/news-article/417863/%E7%BE%8E%E8%82%A1%E5%8B%95%E5%90%91%7C%E8%B2%9D%E6%A3%AE%E7%89%B9%E7%A8%B1%E7%B6%AD%E6%8C%81%E5%87%86%E8%A8%B1%E8%8B%B1%E5%81%89%E9%81%94H200%E5%B0%8D%E8%8F%AF%E9%8A%B7%E5%94%AE%E6%94%BF%E7%AD%96%EF%BC%8C%E4%B8%80%E5%91%A8%E5%89%8D%E6%9B%BE%E6%94%AF%E6%8C%81%E6%94%B6%E7%B7%8A%E6%99%B6%E7%89%87%E9%99%90%E5%88%B6","p":1795460400,"a":1795499025,"t":"美股動向｜貝森特稱維持准許英偉達H200對華銷售政策，一周前曾支持收緊晶片限制"},{"s":"미국 증시 MPF 급락, 모든 움직임은 침묵보다 더 나쁩니다","so":"信報網站","tm":"11/24 03:44","c":1,"r":"hk","u":"https://www.hkej.com/dailynews/investment/article/4572403/%25E7%25BE%258E%25E8%2582%25A1MPF%25E5%25A4%25A7%25E8%25B7%258C-%25E4%25B8%2580%25E5%258B%2595%25E4%25B8%258D%25E5%25A6%2582%25E4%25B8%2580%25E9%259D%259C","p":1795459499,"a":1795503020,"t":"美股MPF大跌 一動不如一靜","su":"S&P500(미국 큰 회사 500곳 지수) 지수는 지난 금요일 7,000포인트 아래로 하락해 10월 초 고점 대비 11.6% 하락했다. 10월 초에도 여전히 전년 동기 대비 약 14% 상승세(오르는 흐름)를 보이고 있던 미국 주식 MPF는 불과 한 달 만에 올해 장부 수익을 거의 증발시켰습니다. 변동성이 큰 시장 상황에서 미국 주식 MPF를 많이 보유하고 있는 근로자들이 묻는 가장 일반적인 질문은 이를 피하기 위해 먼저 보수적인 펀드로 전환하고 다시 구매하기 전에 \"낮은\" 상태를 기다려야 하는가, 아니면 그대로 유지해야 하는가입니다. 이론적으로는 높은 수준에서 물건을 취하고 낮은 수준에서 덮는 것이 가장 이상적인 접근 방식입니다. 현실은 매도 후 대부분의 사람들은 마음의 최저점까지 기다릴 수 없다는 것입니다. 어떤 사람들은 시장 상황이 \"판매 가격\"까지 상승할 때까지 기다렸다가 커버링하거나 심지어 재진입하기 전에 시장이 새로운 최고점에 도달할 때까지 기다려야 합니다."},{"s":"젠슨 황이 돌아오고 엔비디아는 급등합니다. 왜 월스트리트가 이에 대한 비용을 지불합니까?","so":"第一财经","tm":"11/24 03:41","c":1,"r":"cn","u":"https://www.yicai.com/news/103451106.html","p":1795459276,"a":1795474223,"t":"黄仁勋回归，英伟达暴涨：华尔街究竟在为什么买单？","su":"젠슨 황이 돌아왔고, 월스트리트는 젠슨 황의 대체 불가능성에 30% 이상 가격표를 붙였습니다. 11월 23일, 엔비디아는 젠슨 황을 사장, CEO 및 이사로 즉각 복직한다고 발표했습니다. 해당 소식이 알려진 후 엔비디아 주가는 개장 전 30% 이상 올랐고, 엔비디아 주가는 미국 증시 개장 후 35% 상승했다. 불과 6일 전, 엔비디아 이사회는 젠슨 황을 CEO로 복귀시킬 의사가 없음을 분명히 했습니다. 불과 일주일 만에 이사회의 태도가 뒤집혔고, 자본시장은 발 빠르게 반응했다. 한때 세계 시가총액(회사 전체 몸값) 1위이자 인공지능 산업 체인의 핵심이었던 기술 기업에게 30% 이상의 증가는 분명 단순히 인사만 환영하는 것은 아니다. 더 생각해 볼 가치가 있는 것은 투자자들이 정확히 무엇에 대해 비용을 지불하고 있는가 하는 것입니다. 젠슨 황의 복귀가 새로운 비즈니스 가치를 창출할 수 있을까요? 아니면 시장이 마침내 창업자를 잃을 것이라는 우려를 떨쳐버릴 수 있을까요?"},{  달러에 달해 2019년 Saudi Aramco가 세운 글로벌 기업공개(IPO) 자금 조달(사업에 쓸 돈을 모으는 것) 기록인 294억 달러를 넘어섰습니다."},{"s":"미국 증시 동향 | 엔비디아·인텔 등 급등, AI 물결 거침없다는 분석가들","so":"etnet 經濟通","tm":"11/24 01:45","c":1,"r":"hk","u":"https://www.etnet.com.hk/www/tc/news/news-article.php?section=categorized&category=us&newsid=417838","p":1795452300,"a":1795503250,"t":"美股動向｜英偉達、英特爾等飆升，分析師指AI浪潮勢不可擋","su":"2026년 11월 24일 00:45 미국 증시 동향 | 엔비디아, 인텔 등이 급등하면서 AI 물결은 막을 수 없다는 분석이 나온다. 엔비디아가 급등하면서 기술주는 격동의 한 주 이후 강하게 반등(내렸다가 다시 오르는 것)했습니다. 애널리스트 댄 아이브스(댄 아이브스)는 AI의 과대평가에 대한 시장의 우려에도 불구하고 인공지능 혁명의 물결은 막을 수 없다고 강조했다. 엔비디아는 지난 주 23% 하락해 2008년 9월 이후 최대 주간 하락폭을 기록했다. 요크빌 아이브스(Yorkville Ives) 분석가 댄 아이브스(댄 아이브스)는 소셜 미디어에 \"단유가 단기적으로 시장 서사를 지배할 것이지만 AI 기술 혁명은 계속해서 빠른 속도로 발전할 것\"이라고 게시했다. 그는 2029년까지 전 세계 AI 수요가 기존 생산능력 계획을 훨씬 뛰어넘는 160GW에 달할 것으로 전망하며 “4차 산업혁명은 규제나 지정학에 의해 막히지 않을 것”이라고 강조했다."},{"s":"나스닥이 장중 6.84% 급등하는 등 미국 3대 증시가 급등세를 보였다.","so":"第一财经","tm":"11/24 01:33","c":1,"r":"cn","u":"https://www.yicai.com/news/103451113.html","p":1795451597,"a":1795474225,"t":"美股三大股指大幅走高，纳指盘中飙高6.84%","su":"제일재경 2026-11-24 00:32:19 편집자: Chen Xiyu 보도 시간 현재 다우지수는 1,543.38포인트, 즉 3.21% 상승한 49,690.71포인트를 기록했습니다. 나스닥지수는 1,547.64포인트(6.84%) 상승한 24,165.37포인트를 기록했습니다. S&P500(미국 큰 회사 500곳 지수)은 345.65포인트, 즉 5.00% 상승한 7,256.04포인트를 기록했습니다. 연준의 금리 인상 딜레마를 해결하는 방법. AI 투자 열풍이 최고조에 이르자 투자자들은 차익 실현(오른 주식을 팔아 이익을 챙기는 것)을 선택한 것으로 보인다. 나스닥지수는 약 7개월 만에 최저치를 기록했다."},{"s":"\"해고하기엔 너무 컸다\"…젠슨 황 복귀, 월가는 환호 속 의문","so":"뉴스핌","tm":"11/24 01:20","c":1,"r":"kr","u":"https://www.newspim.com/news/view/20261124000003","p":1795450800,"a":1795498995,"su":"[뉴욕=뉴스핌] 김민정 특파원 = 23일(현지시간) 엔비디아가 젠슨 황 최고경영자(CEO)를 복귀시키자 금융시장은 환호했다. 엔비디아 주가는 30% 넘게 급등했고 나스닥(미국 기술 회사들이 많은 주식시장)지수도 장중 7%대 폭등세를 연출했다.그러나 월가에는 이사회가 사임을 수리한 지 11일 만에 결정을"},{"s":"미국 증시 동향 | 골드만삭스 패닉지수는 9월 10일 급등해 경고했고, 비트코인은 55,000 아래로 떨어졌다.","so":"etnet 經濟通","tm":"11/24 01:15","c":1,"r":"hk","u":"https://www.etnet.com.hk/www/tc/news/news-article.php?section=categorized&category=us&newsid=417831","p":1795450500,"a":1795503 디아는 7주 연속 하락세를 보이고 있습니다. 미국 관련주에서 큰 비중을 차지하고 있는 댄빈 대표는 회사의 리스크 관리 미흡과 과도한 포지션 집중에 대해 시장에서 의문을 제기했다."},{"s":"다우존스, S&P500, 나스닥은 모두 조정권에 있으며 이 3개 지표는 '매수 기회'를 외치고 있습니다.","so":"Yahoo Finance UK","tm":"11/23 23:23","c":1,"r":"us","u":"https://uk.finance.yahoo.com/news/dow-jones-p-500-nasdaq-142332357.html","p":1795443812,"a":1795503003,"t":"The Dow Jones, S&P 500, and Nasdaq are all in correction territory and these 3 indicators scream ‘buying opportunity’","su":"나스닥(미국 기술 회사들이 많은 주식시장)을 비롯한 미국 주요 증시 지수가 급락했다. 장기 투자자들에게 여기에 기회가 있을 수 있을까요? 포스트 다우존스, S&P500(미국 큰 회사 500곳 지수), 나스닥은 모두 조정권에 있으며 이 3개 지표는 '매수 기회'를 비명을 지르며 The Twelfth Magpie에 처음 등장했습니다."},{"s":"미국 증시에 대한 매도 압력은 아직 끝나지 않았는가? JP모건, 투자자들에게 기술주 그만둘 것을 촉구: 아직도 팔지 않은 사람 많다","so":"鉅亨網","tm":"11/23 23:10","c":1,"r":"tw","u":"https://news.cnyes.com/news/id/6670029","p":1795443035,"a":1795446981,"t":"美股賣壓還沒結束？摩根大通勸退科技股：還有很多人沒賣","su":"미국 증시에 대한 매도 압력은 아직 끝나지 않았는가? JP모건은 투자자들에게 기술주를 그만 두라고 조언한다. 아직 팔지 않은 사람이 많다. 거형망(Anue)에서 편집한 Zhuang Minfen. 미국 기술주는 큰 손실을 입었지만 시장 매도 압력은 아직 끝나지 않았을 수도 있습니다. JP모건와 골드만삭스의 최신 포지션 데이터에 따르면 헤지펀드가 노출을 크게 줄이고 순 레버리지(빌린 돈까지 써서 크게 투자하는 것)를 다년간 최저 수준으로 줄였음에도 불구하고 장기 자산 관리자와 소매 투자자는 여전히 큰 포지션을 보유하고 있으며 아직 완전한 철수 조짐은 보이지 않습니다. 따라서 월스트리트는 헤지펀드가 보유 자산을 줄였다고 해서 시장이 바닥을 쳤다고 결론을 내리는 것만으로는 충분하지 않다고 경고했다. 지난주 미국 기술주는 2020년 3월 이후 최대 주간 하락세를 보였습니다. JP모건 포지션 인텔리전스 팀의 John Schlegel은 단테의 \"신성 코미디\"의 유명한 대사를 빌려 최근 주간 보고서를 열었습니다. \"기술주 거래자 여러분, 모든 희망을 포기하십시오.\" 지난주 S&P500(미국 큰 회사 500곳 지수) 지수는 7거래일 연속 하락세를 보이며 금요일(20일) 6,910포인트로 마감하며 7,000선 아래로 떨어졌다. 나스닥 100 지수는 일주일 만에 10.4% 하락했고, 필라델피아 반도체 지수(SOX)는 17% 하락했습니다. 매도 압력은 상품과 암호화폐에도 확산되어 금은 일주일 만에 9.5% 하락했고, 비트코인은 14.2% 하락했으며, 구리 가격은 9% 이상 하락했습니다."},{"s":"논평: AI 버블 붕괴로 인해 연준의 금리 인하가 논의될 수 있음","so":"Reuters","tm":"11/23 23:08","c":1,"r":"us","u":"https://www.reuters.com/commentary/reuters-open-interest/ai-bubble-burst-could-put-fed-rate-cuts-table-2026-11-23/","p":1795442907,"a":1795503004,"t":"COMMENTARY: AI bubble burst could put Fed rate cuts on the table"},{"s":"다우 선물이 대폭 반발 가격경 환매 신중한 목소리도 많다 = 미국 주식","so":"株探","tm":"11/23 22:58","c":1,"r":"jp","u":"https://kabutan.jp/news/marketnews/?b=n202611230080","p":1795442280,"a":1795474255,"t":"ダウ先物が大幅反発 値ごろ感の買戻し 慎重な声も多い＝米国株"},{"s":"VIX 신호는 S&P500이 거의 최저 수준일 수 있음을 암시합니다","so":"Investor's Business Daily","tm":"11/23 22:58","c":1,"r":"us","u":"https://www.investors.com/news/sp-500-nasdaq-dow-jones-vix-ai-trade-stock-market/","p":1795442280,"a":1795503005,"t":"VIX Signal Hints The S&P 500 May Be Near Lows","su":"공포 게이지는 S&P500(미국 큰 회사 500곳 지수) 상승과 관련된 수준에 도달했습니다. 너무 흥분하지 마세요."},{"s":"Big Morgan은 매수를 요구하고 Little Motorcycle는 보수적으로 변합니다! 미국 증시는 큰 하락세에서 반등했습니다. 두 주요 투자은행은 왜 다른가요?","so":"鉅亨網","tm":"11/23 22:51","c":1,"r":"tw","u":"https://news.cnyes.com/news/id/6670206","p":1795441866,"a":1795446982,"t":"大摩喊買、小摩轉保守！美股跌深反彈 兩大投行為何不同調？","su":"미국 주식 선물(미래 값을 미리 정해 사고파는 거래)은 월스트리트가 시기를 놓고 엇갈린 가운데 지난주 큰 손실 이후 반등했습니다.\n모건스탠리는 매수 포인트를 형성하기에는 시장이 너무 많이 하락했으며 단기 강세(오르는 힘이 센 것)도 4월 초 이후 최고 수준으로 상승했다고 밝혔습니다.\n샤오모는 반등이 예상되지만 여전히 바닥을 확인하기 어렵고 주식시장은 향후 몇 주 동안 계속 변동할 수 있다고 믿고 있습니다."},{"s":"이 고수익 S&P500 주식은 올해 블랙 프라이데이의 도둑질입니다","so":"Yahoo Finance","tm":"11/23 22:47","c":1,"r":"us","u":"https://finance.yahoo.com/markets/stocks/articles/high-yielding-p-500-stocks-134711503.html","p":1795441631,"a":1795446970,"t":"These High-Yielding S&P 500 Stocks Are Black Friday Steals This Year","su":"특허 절벽에 직면한 제약회사, 기록적인 코코아 가격과 싸우는 초콜렛 대기업, 규제 대상에 처해 있는 뉴잉글랜드 유틸리티 기업 모두 최고치 이하로 거래되고 있습니다. 어떤 할인 배당(회사가 주주에게 나눠주는 돈)금 지급자가 귀하의 수입을 받을 자격이 있고, 어떤 사람이 경고 표시를 숨기고 있습니까?"},{"s":"미국 증시는 학살을 겪었고 골드만삭스는 시장 진출의 좋은 기회를 보았습니다.","so":"工商時報","tm":"11/23 22:47","c":1,"r":"tw","u":"https://www.ctee.com.tw/news/20261123701848-430702","p":1795441620,"a":1795446984,"t":"美股慘遭血洗高盛看見進場良機- 國際","su":"미국 증시는 최근 며칠간 피바다를 겪었다. 골드만삭스는 이러한 매도 물결이 미국 주식을 매수할 수 있는 좋은 기회를 만들었지만 시장은 여전히 여러 가지 어려움에 직면해 있다고 말했습니다. 최근 미국 증시가 요동치고 있다. 골드만삭스 트레이딩 부서는 보고서에서 헤지펀드(큰손들 돈을 모아 굴리는 투자 회사)가 주식 비중을 크게 줄였으며 시장이 '전술적 진입' 기회에 가까워지고 있다고 지적했다. \"전반적으로 이러한 유형의 최근 공황적 매도 압력은 항상 報示警資料中心、晶片股投機泡沫已破","su":"AI 컨셉주는 최근 몇 주 동안 매도압력을 받고 있는데 이는 2000년 닷컴버블과 유사하다. 그러나 현재의 영향은 여전히 AI 관련 산업에 집중되어 있으며 아직 경제로 완전히 확산되지는 못하고 있다.\n마이크론, 코어위브 등 주가가 급등했다가 급락하는 등 데이터센터(컴퓨터 수만 대를 모아 둔 건물), 반도체, 공급망 등에서 부분적인 투기 거품이 터졌다.\n하락으로 인해 기업이 자본 지출을 줄이게 되면 공급망과 자금 조달(사업에 쓸 돈을 모으는 것)을 따라 확산되고 부 효과를 통해 소비가 억제되고 시장 영향이 증폭될 수 있습니다."},{"s":"월스트리트 헤지펀드 후퇴! 모건스탠리: 강세 주식은 더 이상 인기가 없으며 펀드 레버리지도 1년 최저 수준으로 하락","so":"鉅亨網","tm":"11/23 22:07","c":1,"r":"tw","u":"https://news.cnyes.com/news/id/6670239","p":1795439223,"a":1795440060,"t":"華爾街避險基金大撤退！摩根士丹利：強勢股不再受追捧 基金槓桿降至一年低點","su":"월스트리트 헤지펀드(큰손들 돈을 모아 굴리는 투자 회사)는 순 레버리지(빌린 돈까지 써서 크게 투자하는 것) 비율이 41%, 총 레버리지 비율이 195%로 떨어지는 등 위험포지션 축소에 속도를 냈다. 두 가지 모두 지난 12개월 만에 최저치를 기록했다.\n모멘텀 거래가 롱에서 숏으로 전환, 기술주의 순익스포저 비율이 22.5%로 하락\n골드만삭스는 시장 패닉 지수가 9.8까지 상승했으며, 시장 반등 여부는 여전히 연준의 정책과 기업 이익 실적에 달려 있다고 지적했다."},{"s":"시장 살펴보기: Ed Yardeni가 연말 S&P500 목표를 낮춘 이유","so":"Bloomberg.com","tm":"11/23 21:55","c":1,"r":"sg","u":"https://www.bloomberg.com/news/videos/2026-11-23/why-ed-yardeni-lowered-his-year-end-s-p-500-target-video","p":1795438517,"a":1795478641,"t":"Watch Markets: Why Ed Yardeni Lowered His Year-End S&P 500 Target"},{"s":"S&P500 선물, 개장 전 거래 상승; Kymera Therapeutics, Zscaler 리드","so":"Barron's","tm":"11/23 21:30","c":1,"r":"us","u":"https://www.barrons.com/articles/s-p-500-futures-climb-in-premarket-trading-kymera-therapeutics-zscaler-lead-199b54a0","p":1795437000,"a":1795440048,"t":"S&P 500 Futures Climb in Premarket Trading; Kymera Therapeutics, Zscaler Lead"},{"s":"메가딜이 매각을 거부하면서 월스트리트가 M&A 기록을 향해 급등","so":"Bloomberg.com","tm":"11/23 21:12","c":1,"r":"world","u":"https://www.bloomberg.com/news/articles/2026-11-23/wall-street-surges-toward-m-a-record-as-megadeals-defy-selloff","p":1795435976,"a":1795503029,"t":"Wall Street Surges Toward M&A Record as Megadeals Defy Selloff"},{"s":"11개의 S&P500 주식은 기술과 AI가 대규모 매도세를 보이면서 번창했습니다.","so":"Investor's Business Daily","tm":"11/23 21:08","c":1,"r":"us","u":"https://www.investors.com/etfs-and-funds/sectors/sp-  대한 내부 차이, 시장의 3대 요인에 의해 크게 하락했다고 말했다. 금리 방향 재평가. 증시가 하락하면서 이번 금리 인상에 대한 기대감도 식었고, 자금은 점차 채권 등 우량 안전자산으로 전환됐다. 또한 그는 일부 신흥 컴퓨팅 파워 공장이 높은 자본 지출과 감가상각 압력에 전적으로 책임이 있으며, 자금 조달 비용 상승으로 인해 비즈니스 모델이 매우 수동적이 되어 주가가 고점에서 크게 하락했다고 지적했습니다."},{"s":"모건스탠리는 현재 미국 주식 매수 기회를 놓칠 수 없다며 4월 이후 가장 낙관적인 단기 판단을 내렸다.","so":"财联社","tm":"11/23 18:31","c":1,"r":"cn","u":"https://www.cls.cn/detail/2542126","p":1795426260,"a":1795440054,"t":"大摩给出4月以来最乐观短线判断 称当下美股买入良机不容错过","su":"① 모건스탠리 전략가들은 S&P와 다우가 모두 조정 범위에 들어간 후 시장은 투자자들에게 놓칠 수 없는 매수 기회를 제공했다고 말했습니다. ② S&P500(미국 큰 회사 500곳 지수) 지수의 예상 주가수익률은 10월 말 23배 가까이 정점을 찍은 뒤 현재 16.5배로 급락했는데, 이는 장기 평균인 17.4배보다 낮다. 차이롄서, 11월 23일(자오 하오 편집자) 모건스탠리 전략가들은 S&P500 지수와 다우존스 산업평균지수가 모두 조정 범위에 들어간 후 시장이 투자자들에게 놓쳐서는 안 될 매수 기회를 제공했다고 말했습니다. 마이클 윌슨이 이끄는 모건스탠리 전략가 팀은 기업 실적과 주가 평가가 시장 반등을 뒷받침하고 있으며 최근 공황 매도세(팔려는 힘)도 반등 여건을 조성했다고 지적했다. 전술적 수준에서 팀의 현재 낙관적 입장은 4월 초 이후 가장 강력합니다."},{"s":"모건스탠리는 헤지 펀드가 모멘텀 주식에 약세를 보였다고 말합니다.","so":"Bloomberg.com","tm":"11/23 18:19","c":1,"r":"world","u":"https://www.bloomberg.com/news/articles/2026-11-23/hedge-funds-turn-bearish-on-momentum-stocks-morgan-stanley-says","p":1795425542,"a":1795447001,"t":"Hedge Funds Turn Bearish on Momentum Stocks, Morgan Stanley Says"},{"s":"헤징의 거물인 아이크만은 연준에 인플레이션에 대해 \"2를 포기하고 3을 보호\"할 것을 촉구하면서 다음 달 금리 인상은 큰 실수가 될 수 있다고 경고했습니다.","so":"經濟日報","tm":"11/23 18:08","c":1,"r":"tw","u":"https://money.udn.com/money/story/5599/9896752","p":1795424912,"a":1795434964,"t":"避險大亨艾克曼籲 Fed 通膨「棄2保3」 警告下月升息恐鑄下大錯","su":"헤지펀드(큰손들 돈을 모아 굴리는 투자 회사)의 거물이자 퍼싱스퀘어의 창립자인 빌 애크먼은 미국 연방준비제도(연준)에 인플레이션(물건값이 계속 오르는 것) 목표 2%를 포기하고 대신 3%를 추구할 것을 촉구했습니다. 그는 또한 연준이 12월 9일 회의에서 여전히 금리를 인상한다면 미국과 세계 경제를 불황의 나락으로 몰아넣을 수 있다고 경고했습니다."},{"s":"해외조사 및 선정일보 1123 | JP모건: 연준이 세 번 연속 금리를 인상할 수 있으며 시장은 긴축 위험을 과소평가하고 있습니다.","so":"财联社","tm":"11/23 18:07","c":1,"r":"cn","u":"https://www.cls.cn/detail/2541806","p":1795424871,"a":1795446976,"t":"海外研选日报1123 | 摩根大通：美联储或连续三次加息 市场低估紧缩风险","su":"① 골드만삭스: HBM(인공지능용 빠른 메모리) 시장 규모는 2027년 2000억 달러에 달하고 2028년에는 성장률이 둔화될 것으로 예상된다. ② UBS는 구체화된 인텔리전스 포트폴리오를 조정합니다. 알리바바를 제외하고 Pinduoduo를 포함합니다. ③ING: 구리 가격은 현물 공급 부족과 시장 매도가 엇갈리면서 일주일 만에 8% 이상 하락했습니다. ④ 골드만삭스: 글로벌 채권시장은 금리 상승 우려에서 위험 회피로 전환했고, 5년 만기 미국 채권에 수혜가 예상된다. 편집자 주: 차이롄서는 글로벌 매크로, 기업 및 산업, 상품 및 기타 측면에 대한 주요 투자 은행의 최신 연구 의견을 매일 수집하여 투자자의 투자 결정에 대한 포괄적인 지원을 제공합니다. 시장 JP모건: 연준이 세 번 연속으로 금리를 인상할 수도 있고, 시장은 긴축 위험을 과소평가하고 있습니다. JP모건은 11월 21일에 교차 자산 전략 연구 보고서를 발행하여 미국 소비자 실적이 회복력이 있고 수입 가격이 상승하고 있으며 연준의 10월 회의 의사록에서 발표된 매파적 신호와 결합하여 시장이 새로운 금리 인상의 속도와 규모를 과소평가할 수 있다고 지적했습니다. 이제 은행은 연준이 올해 12월, 2027년 1월, 3월 세 차례 연속 회의에서 금리를 0.25%포인트(퍼센트끼리 뺀 차이) 인상해 연방기금 금리 목표 범위를 4.50~4.75%로 높일 것으로 예상하고 있습니다."},{"s":"미국 증시는 곧 바닥을 칠 것인가? 전문가: 5% 더 하락할 수도","so":"天下雜誌","tm":"11/23 17:43","c":1,"r":"tw","u":"https://www.cw.com.tw/article/5143848","p":1795423380,"a":1795423978,"t":"美股要觸底反彈了嗎？專家：還可能再跌5%"},{"s":"뉴욕증시 입성 성공한 앤트로픽, 채권은 '정크' 등급 우려","so":"뉴스1","tm":"11/23 17:40","c":1,"r":"kr","u":"https://www.news1.kr/world/usa-canada/6363297","p":1795423246,"a":1795423962},{"s":"매뉴라이프는 자금이 미국 주식에서 빠져나와 건강보험과 아시아 펀드로 방향을 바꾸고 있다며 회원들에게 손실 실현을 피하기 위해 \"시장이 움직이자마자 공황\"을 피하라고 촉구했다.","so":"星島頭條","tm":"11/23 17:18","c":1,"r":"hk","u":"https://www.stheadline.com/realtime-finance/3640271/%E5%AE%8F%E5%88%A9%E7%A8%B1%E8%B3%87%E9%87%91%E7%94%B1%E7%BE%8E%E8%82%A1%E6%B5%81%E5%87%BA%E8%BD%89%E6%8A%95%E9%86%AB%E4%BF%9D%E5%8F%8A%E4%BA%9E%E6%B4%B2%E5%9F%BA%E9%87%91-%E7%B1%B2%E6%88%90%E5%93%A1%E5%BF%8C%E5%B8%82%E4%B8%80%E5%8B%95%E5%B0%B1%E9%83%81%E5%85%8D%E8%AE%8A%E7%8F%BE%E8%99%A7%E6%90%8D","p":1795421918,"a":1795423983,"t":"宏利稱資金由美股流出轉投醫保及亞洲基金 籲成員忌「市一動就郁」免變現虧損","su":"今年环球股시波动，宏利향港及澳门退休业务怡주주管何精怡表示，每逢市况波动，一恐慌性调动强积金投资组合. 올해 3분기 미국 증시 변동성(값이 크게 출렁이는 정도)이 커지는 가운데 기업들은 헤지 옵션으로 헬스케어 펀드로의 자금 유입을 주목했다. 아시아 태평양, 일본 및 헬스케어 관련 펀드는 최근 더 나은 성과를 보였으며 자본도 증가했습니다. 유입됩니다.建议善供旧와 new 供款, 例如将 new 供款投资其他基金, 旧的供款则待city况转好,再作调动."},{"s":"\"채권왕\" Gundlach: 채권 시장은 워시 씨를 망치고 있으며 연준은 금리를 인상할 때 \"말만 할\" 수는 없습니다.","so":"财联社","tm":"11/23 17:14","c":1,"r":"cn","u":"https://www.cls.cn/detail/2440957","p":1795421667 95434956,"t":"大跌之后，16倍市盈率的美股便宜吗","su":"텍스트 | Jia Kang 및 Sun Shanqun 개요: 미국 증시가 급락한 후 S&P500(미국 큰 회사 500곳 지수)의 향후 12개월 예상 주가수익비율은 약 16.5배로 떨어졌으며 이는 합리적인 가격에 가깝습니다. 현재 금리 하에서 안전마진은 여전히 제한적입니다. 샘플에 포함된 칩 및 스토리지 회사는 일반적으로 기대치를 초과했으며 컴퓨팅 성능 운영에 대한 수익은 여전히 장비 활용도와 고객 지불에 따라 달라집니다. 인플레이션(물건값이 계속 오르는 것)이 완화되고 고용이 안정되고 금리 인상 기대감이 냉각된 후 S&P는 완만하게 회복될 것으로 예상됩니다. 나스닥에는 무료 현금 흐름을 개선하기 위해 클라우드 서비스 제공업체도 필요합니다. 반도체 밸류에이션은 실적 하락에 민감해 중기적으로는 주의가 필요하다. 본 글은 역사적 가치평가, 기업이익, 투자수익률 계산, 자금조달 환경 등의 관점에서 미국 증시 붕괴 이후의 가격 및 수리 상황을 분석한다. 거시경제, 주식 및 채권, 회사 수치를 언제든지 확인하고 모든 재무 데이터를 손끝에서 확인할 수 있는 Caixin 데이터베이스에 들어가는 것이 좋습니다."},{"s":"골드만삭스 \"내년 세계 GDP 2.8% 성장할 것, 연준은 내년 말까지 금리 인하할 것\"","so":"财联社","tm":"11/23 09:49","c":1,"r":"cn","u":"https://www.cls.cn/detail/2541146","p":1795394987,"a":1795440056,"t":"高盛：明年全球GDP料增2.8% 美联储有望明年底降息","su":"① 골드만삭스는 2027년 세계 실질 GDP 성장률이 2.8%로 2026년 예측치 2.7%보다 약간 높을 것이라고 예측하지만 전반적인 위험은 아래쪽으로 기울어져 있습니다. ② 골드만삭스는 연준이 올해 12월과 2027년 3월 금리를 각각 0.25%포인트(퍼센트끼리 뺀 차이)씩 인상한 뒤 내년 11월부터 점진적인 금리 인하를 시작할 것으로 예상했다. 차이롄서 에이전시, 11월 23일(편집자 Liu Rui) 골드만삭스는 2027년 중국의 글로벌 실질 국내총생산(GDP) 성장률이 2026년 2.7%보다 소폭 높은 2.8%로 전망하지만 전체적인 리스크는 하향으로 기울어져 있다. 골드만삭스는 내년에 세계 주요 경제의 금융여건이 긴축되고 재정정책이 중립으로 돌아올 것으로 내다봤다. 그러나 이러한 변화가 세계 경제에 미치는 영향은 낮은 에너지 가격과 여전히 강력한 인공지능 자본 지출(공장·장비 등에 쓰는 큰돈)로 인해 상쇄될 것입니다."},{"s":"[미장 브리핑] 뉴욕증시, 나스닥 폭락·반도체주 급락... S&P 500도 동반 약세","so":"센머니","tm":"11/23 09:10","c":1,"r":"kr","u":"https://www.senmoney.co.kr/news/articleView.html?idxno=38789","p":1795392643,"a":1795440048,"su":"[센머니=김병진 기자] 기술주와 반도체(전자기기의 두뇌 부품)주 투매, 중동 긴장 재부각이 겹치면서 11월 22일(현지시간) 뉴욕증시에서 주요 지수가 일제히 하락 마감했다.장 마감 기준 다우존스30산업평균지수는 1.93% 하락했고, S&P 500 지수는 3.70% 내렸으며, 나스닥종합지수는 5.28% 떨어졌다. 특히 나스닥은 5% 이상 하락하며 폭락 흐름을 나타냈다. 이날 증시는 인공지능 관련 대표주인 엔비디아 급락을 중심으로 기술주 전반의 매도세(팔려는 힘)가 확대된 데다, 미국과 이란을 둘러싼 긴장 고조, 호르무즈 해협 인근 불안, 국제유가의 지정학적 프리미엄 재"},{"s":"美 증시 급락에 변동성 경고 확산…월가 \"추가 매도 충격 가능성\"","so":"블루밍비트","tm":"11/23 08:15","c":1,"r":"kr","u":"https://bloomingbit.io/feed/news/124984","p":1795389335,"a":1795434945,"su":"미국 증시가 급락하면 다. ETF에는 지난 5일 중 3일 동안 자금이 순유입되었으며, 누적 순유입액은 거의 4천만 위안에 달합니다. Hong Kong Stock Connect Innovative Drug ETF China Universal(159570) 지수는 2% 이상 상승했습니다."},{"s":"혁신신약 개념 일부 변화","so":"第一财经","tm":"11/23 11:16","c":2,"r":"cn","u":"https://www.yicai.com/brief/103449765.html","p":1795400160,"a":1795403778,"t":"创新药概念局部异动","su":"2026/11/23 10:16 [혁신신약(세상에 처음 나온 새로운 약) 개념 일부 변경] 라이메이제약과 Nearshore Protein이 10% 이상 상승했으며, Bepsis, Yaokang Biotech, Wanbang Pharmaceuticals, Medicilon이 상승세(오르는 흐름)를 주도했습니다."},{"s":"혁신적인 약물 구현을 촉진하기 위해 첫 번째 '의학 및 교육 대면' 스테이션이 광저우에서 개최되었습니다.","so":"中国新闻网","tm":"11/21 21:19","c":2,"r":"cn","u":"https://www.chinanews.com.cn/sh/2026/11-21/10735862.shtml","p":1795263543,"a":1795265090,"t":"“医药保学面对面”首站在穗举办 推动创新药落地","su":"혁신적인 약물의 구현을 촉진하기 위해 첫 번째 '학교 보호를 위한 대면 의학' 행사가 광저우에서 개최되었습니다. 중국신보사, 광저우, 11월 21일(채민제 기자) 21일 광저우에서 2026년 의료보험약품 카탈로그 신품종 대상 '학교보호를 위한 대면의학' 행사(제1차)가 열렸다. 이번 행사에서 발표된 신호는 더욱 명확합니다. 국민의료보험청은 혁신적인 의약품 접근의 초점을 \"카탈로그 입력\"에서 \"병원 입력, 처방전 입력, 강의실 입력\"으로 확대하여 신약이 환자의 실제 요구에 더 빨리 혜택을 줄 수 있도록 하고 있습니다. 혁신적인 의약품의 경우 카탈로그에 포함되는 것은 단지 \"임신 증명서\"일 뿐입니다. 실제 접근성은 해당 약물이 임상(새 약을 사람에게 시험하는 것)적으로 알려져 있는지, 사용할 수 있는지, 환자가 찾을 수 있는지에 따라 달라집니다. 국민의료보험국 약품서비스관리부 황신위 국장은 2026년 의료보험 약품 목록에 신품종과 관련 정책이 추가될 것이라고 소개했다. 2026년판 의료보험 약품 목록에는 총 3,331종의 약품이 있는데, 그중 신규 약품이 107개이고 이전된 약품이 34개이다. 신약 중 103개는 5년 이내에 새로 출시된 신약이고, 51개는 카테고리 1 신약으로 모두 새로운 최고치입니다. 60개 신약에는 화학약품, 36개 생물의약품, 11개 중국전통특허의약품이 포함된다. 신약 중 종양분야는 29개, 만성질환은 21개, 희귀질환은 18개다."},{"s":"헤이룽장성: 혁신적인 의약품에 대한 지불 보장 범위를 확대하기 위해 상업 보험을 장려합니다.","so":"Jiemian.com","tm":"11/24 15:57","c":1,"r":"cn","u":"https://www.jiemian.com/article/15367835.html","p":1795503451,"a":1795504070,"t":"黑龙江：鼓励商业保险扩大创新药支付范围","su":"흑룡강성 인민정부는 '흑룡강성 보건 발전 15차 5개년 계획'을 발표하고 혁신적인 의약품과 의료기기 개발을 지원하겠다고 제안했습니다. 의료기관, 과학연구기관, 기업이 혁신신약(세상에 처음 나온 새로운 약) 임상시험(새 약을 사람에게 시험하는 것)과 의료기기 연구개발을 공동으로 수행할 수 있도록 지원하고, 기초연구 결과를 임상진단 및 치료계획으로 전환하는 것을 촉진한다. 세포치료제, 유전자치료제, 신규항체, 신규백신, 핵산의약품, 방사성의약품 등의 적용을 가속화하고, 응급백신과 의약품의 활용능력을 제고하며, 어린이용 의약품의 다양성을 풍부화한다. 인공지능 기반 의료 1795440077,"t":"【長和系】長江生命科技Halneuron®第2b期臨床試驗結果正面或成首款化療引致神經疼痛的治療藥物"},{"s":"FDA가 Duchenne 치료를 다시 거부한 후 Capricor는 분화구를 공유합니다.","so":"Reuters","tm":"11/23 20:24","c":1,"r":"world","u":"https://www.reuters.com/legal/litigation/capricor-shares-crater-after-fda-rebuffs-duchenne-therapy-again-2026-11-23/","p":1795433049,"a":1795434990,"t":"Capricor shares crater after FDA rebuffs Duchenne therapy again"},{"s":"또 다른 혁신적인 약물이 상하이에서 승인되어 중국 내 Syk 표적치료제의 임상적 공백을 메웠습니다.","so":"第一财经","tm":"11/23 19:11","c":1,"r":"cn","u":"https://www.yicai.com/news/103450614.html","p":1795428702,"a":1795434981,"t":"上海又一创新药获批，填补国内Syk靶向治疗临床空白","su":"상하이 지역 혁신신약(세상에 처음 나온 새로운 약)이 또 다른 회원을 추가했다. 11월 23일, 국가의약품안전청(National Medical Products Administration)은 Hutchison Whampoa Pharmaceuticals (Shanghai) Co., Ltd.가 적용한 1등급 혁신 약물 솔로피닙 아세테이트 정제(상표명: Savco)의 목록을 승인했다고 발표했습니다. 이는 중국에서 승인된 최초의 SYK 억제제이기도 합니다. Chi-Med는 또한 상하이에서 5개 이상의 오리지널 신약에 대한 승인을 받은 최초의 회사가 되었습니다. Chi-Med는 제일재경와의 인터뷰에서 신약으로서 solopinib의 승인은 Chi-Med의 연구 개발 파이프라인에서의 도약을 반영한다고 말했습니다. 이전에 Chi-Med는 단일 핵심으로 고형 종양의 표적 치료에 중점을 두었습니다. 솔로피닙 출시 이후 치메드는 고형종양+혈액면역 듀얼 트랙의 새로운 파이프라인 구조를 공식 구축해 단일 트랙에 대한 의존도를 벗어나 새로운 장기 성장곡선을 열었다."},{"s":"과거에는 바이오주가 큰 손실을 입어 신용거래가 정지되기도 했다. 증권거래소는 11개 종목의 운명이 매우 다르다고 발표했다.","so":"UDN","tm":"11/23 18:46","c":1,"r":"tw","u":"https://udn.com/news/story/7251/9896835","p":1795427211,"a":1795434989,"t":"昔日生技股后累虧遭暫停信用交易 證交所公布11檔股票命運大不同","su":"대만증권거래소는 상장(주식시장에 처음 들어오는 것)회사(금융지주 제외)가 공시하는 3분기 실적(회사가 번 돈 성적표) 보고서에 대한 주당순가치 및 누적손실정보에 대한 검토를 완료했다고 23일 밝혔다. Peer Biomedical*-Chuangchuang(6949)은 막대한 금전적 손실로 인해 신용거래가 정지되었습니다. 이밖에도 정지된 타이벤(1310) 등 4개 트랜치, 이항(2601) 등 5개 트랜치가 마진거래와 증권 대차거래를 재개했고, 2개 트랜치는 계속 정지를 유지하고 있다. 조정된 목록은 24일부터 정식 시행된다."},{"s":"프랑스 생명공학회사, 주가 17% 급락 후 공매도자의 암 위험 주장 거부","so":"CNBC","tm":"11/23 18:45","c":1,"r":"us","u":"https://www.cnbc.com/2026/11/23/abivax-scorpion-capital-obefazimod.html","p":1795427142,"a":1795434979,"t":"French biotech rejects short seller’s cancer-risk claims after shares plunge 17%","su":"공매도(주식을 빌려서 먼저 파는 것)업체 Scorpion Capital은 Abivax가 실험용 염증성 장질환 치료제에 심각한 과학적, 안전성 결점을 갖고 있다고 비난했습니다."},{"s":"51개의 새로운 클래스 1 혁신 의약품이 의료 보험 카탈로그에 추가되어 사상 최고치를 기록했으며 항셍 Shanghai-Shenzhen-Hong Kong Innovative Drug Select 50 Index가 3% 이상 상승했습니다.","so":"Jiemian.com","tm":"11/23 18:09","c":1,"r":"cn","u":"https://www.jiemian.com/article/15362954.html","p":1795424986,"a":1795434983,"t":"医保目录新增51个1类创新药，数量创历年新高，恒生沪深港创新药精选50指数收涨超3%","su":"항셍 상하이-심천-홍콩 혁신 약물 선택 50 지수(HSSSHID)는 3.18% 상승했으며 51개의 새로운 1급 혁신 약물이 2026년 의료 보험 목록에 추가되었습니다. Celestica 항셍 Shanghai-Shenzhen-Hong Kong Innovative Drug Select 50 ETF(여러 주식을 묶어 파는 상품) Link(A:014564, C:014565)가 지수를 추적합니다."},{"s":"[트렌드의 비결: 혁신의약품 부문이 강하게 반등했다! 지속적으로 상용화 검증을 진행 중이며 4개 주요 라인을 활용해 투자 기회 포착","so":"第一财经","tm":"11/23 18:02","c":1,"r":"cn","u":"https://www.yicai.com/vip/news/103450510.html","p":1795424555,"a":1795434984,"t":"[ 风口秘钥 创新药板块强势反弹！商业化持续验证 四大主线把握投资机遇","su":"11월 23일 혁신의약품 부문이 요동치며 인기를 끌었다. Laimi Pharmaceutical의 20CM 제한은 Merck의 TROP2 ADC 3상이 OS 엔드포인트에 도달하도록 촉진했으며 오픈AI는 MedChemBench를 출시하여 AI의 의약 화학 침투를 가속화했습니다. 증권사들은 해외BD가 2027년 상용화기에 돌입할 것으로 낙관하고 있으며, 의료보험 확대, 이익전환점 바이오텍, CXO 회복, AI제약 등 4대 요인에 집중할 것을 제안하고 있다."},{"s":"Haixi 신약: 당뇨병성 황반부종 치료용 HX9428이 국가식품의약국의 승인을 받아 2상 임상시험을 진행하고 있습니다.","so":"Jiemian.com","tm":"11/23 17:54","c":1,"r":"cn","u":"https://m.jiemian.com/article/15362854.html","p":1795424096,"a":1795434986,"t":"海西新药：HX9428治疗糖尿病性黄斑水肿获国家药监局批准开展II期临床试验","su":"11월 23일, Haixi New Drug은 당뇨병성 황반부종(\"DME\") 치료를 위해 자체 개발한 혁신적인 약물 프로젝트 HXP056의 후보 약물 분자 HX9428이 최근 중국 국가 의약품 관리국(NMPA) 약물 평가 센터(CDE)의 승인을 받고 2상 임상(새 약을 사람에게 시험하는 것) 시험을 실시하기로 동의했다고 홍콩 증권 거래소에서 발표했습니다. DME는 HX9428이 발전하는 두 번째 적응증이다."},{"s":"엔웨이제약(Enwei Pharmaceutical): 자체 자금 1억 위안으로 전액 출자 자회사 설립 계획","so":"Jiemian.com","tm":"11/23 17:54","c":1,"r":"cn","u":"https://m.jiemian.com/article/15362889.html","p":1795424086,"a":1795434987,"t":"恩威医药：拟以1亿元自有资金设立全资子公司","su":"엔웨이제약(Enwei Pharmaceutical)은 11월 23일 자사 자금 1억 위안을 투자해 전액 출자 자회사를 설립할 계획이라고 발표했다. 신설법인은 여성건강 분야의 미충족 임상(새 약을 사람에게 시험하는 것)수요 해결과 여성건강 분야의 첨단 방향에 집중할 예정이다. 산부인과 분야에서 회사의 기존 브랜드, 제품 및 산업 기반을 결합하여 신기술 연구 개발 플랫폼(혁신적인 약물 연구 개발 플랫폼, 협력 연구 개발 플랫폼 등 포함) 구축, 산업 투자 및 인수 합병 통합을 통해 전 세계적으로 기술 혁신 역량과 산업 시너지 가치를 갖춘 고품질 프로젝트를 모색할 것입니다. 회사의 여성 건강 산업 배치를 지속적으로 개선 및 통합하고 장기적인 혁신 역량과 지속 가능한 개발 역량을 강화할 것입니다. 발표에 따르면 설립될 전액 출자 자회사의 중국 이름은 Chengdu Enwei Jieryinta Health Technology Co., Ltd.이고 등록 주소는 쓰촨성 청두시 하이테크 존 Tianfu Avenue, Middle Section, Building 2, No. 666, 3406, 34th Floor입니다. 기업형은 총투자액과 등록자본금이 1억위안인 유한책임회사입니다. 엔웨이메디슨은 회사 지분(회사를 나눠 가진 몫) 100%를 보유하고 있으며 자금의 출처는 자체 자금으로 금전적 자금 형태로 투자되고 있습니다."},{"s":"Science and Technology Innovation 200 ETF Penghua(588240)의 기초지수는 5.2% 상승했습니다. 로봇공학, 의료, 반도체 등이 종합적으로 상승했고, 업종이 강한 반등을 이끌었습니다.","so":"Jiemian.com","tm":"11/23 16:40","c":1,"r":"cn","u":"https://www.jiemian.com/article/15362284.html","p":1795419636,"a":1795423999,"t":"科创200ETF鹏华(588240)标的指数上涨5.2%，机器人、医药、半导体集体拉升，板块迎来强势反弹","su":"뉴스: 1. 물리적 AI/휴머노이드(사람을 닮은 로봇) 로봇: 가사 현장 검증, 대량 생산 첫 해의 분위기 설정: (1) 11월 22일 체화된 지능형 데이터에 대한 국가 표준 개발이 공식적으로 시작되었으며, '15차 5개년 계획' 기간 동안 20개 이상의 특별 국가 표준이 형성될 예정입니다."},{"s":"13:33:38 [해외시장에 진출하는 혁신의약품이 검증기간에 진입하였습니다. 홍콩증권연계 혁신의약품 ETF E펀드(159316)의 배분가액에 주목하세요]","so":"财联社","tm":"11/23 14:33","c":1,"r":"cn","u":"https://www.cls.cn/detail/2541425","p":1795412018,"a":1795414337,"t":"13:33:38【创新药出海进入验证期，关注港股通创新药ETF易方达（159316）配置价值】","su":"해외시장에 진출하는 혁신신약(세상에 처음 나온 새로운 약)이 검증기간에 돌입했습니다. Hong Kong Stock Connect Innovative Drug ETF E Fund(159316)의 할당 가치에 주목하세요. 정오 마감 기준으로 항셍 홍콩 주식연계 혁신의약품지수는 0.2% 상승, CSI 홍콩증권연계 헬스케어 종합지수는 1.0% 상승, CSI 혁신의약산업지수는 0.6% 상승, CSI 생명공학 테마지수는 0.4% 상승, CSI 300 헬스케어 지수는 0.1% 하락했다. CITIC 증권은 2027년을 바라보며 해외 임상시험(새 약을 사람에게 시험하는 것)과 혁신 신약 등록이 검증 기간에 돌입하고 각 기술 경로가 차별화되고 촉매 집약적일 것이라고 지적했습니다. 해외 수출의 증가와 전략적 제휴의 증가로 인해 우리는 기회와 위험이 공존하는 더 큰 시장과 더 복잡해진 경쟁 환경에 직면하게 될 것입니다. 혁신과 국제화를 중심으로 기회를 포착하는 동시에 한계 개선의 주요 라인에 더 많은 관심을 기울이는 것이 좋습니다. 전반적인 성장 유연성과 현금 지급 능력을 고려하고 차별화된 파이프라인, 세계화 역량 및 운영 개선의 확실성을 갖춘 부문 리더를 선택합니다."},{"s":"[모닝포스트] 우칭이 발언합니다! 비정상적인 시장 변동을 효과적으로 방지하기 위해 시장 안정성을 위한 장기 메커니즘에 대한 심층 연구를 수행합니다. 51종의 1급 혁신 의약품이 국가의료보험 목록 새 버전에 포함되었습니다.","so":"财联社","tm":"11/23 14:02","c":1,"r":"cn","u":"https://www.cls.cn/detail/2534592","p":1795410163,"a":1795474272,"t":"【早报】吴清发声！深化市场稳定长效机制研究，有效防范市场异常波动；51个一类创新药进入新版国家医保目录","su":"① 우칭: 시장 안정을 위한 장기적인 메커니즘에 대한 연구를 심화하고 비정상적인 시장 변동을 효과적으로 방지합니다. ② 중국과 미국은 중미 무역 협의회 첫 회의를 개최했습니다. 경제 및 무역 협의 메커니즘 ③ 젤렌스키: 미국은 우크라이나가 NATO에 가입하는 대가로 돈바스 지역을 포기할 것을 제안했습니다. ④ 51개의 클래스 I 혁신 약물이 새 버전의 국가 의료 보험 카탈로그에 포함되었습니다. ⑤ BYD 네트워크 보고 센터는 \"특정 디지털 에너지가 BYD에 팔렸다\"는 온라인 소문이 사실이 아니라는 문서를 발행했습니다. 매크로 뉴스 1. 중국 증권감독관리위원회 위원장 Wu Qing은 제1회 중국 자본시장 학술 연차 회의에서 시장 안정을 위한 장기적인 메커니즘에 대한 연구를 더욱 심화하고 비정상적인 시장 변동을 효과적으로 방지할 것이라고 말했습니다. Wu Qing은 또한 투자자의 정당한 권익을 효과적으로 보호하기 위해서는 양적 거래, 지분(회사를 나눠 가진 몫) 축소 등 제도적 규칙의 최적화와 공정하고 합리적인 규제 조치에 대한 심층적인 연구와 평가가 필요하다고 말했습니다."},{"s":"홍콩 혁신 의약품 ETF Invesco(513780) 추적 지수 CSI Hong Kong Stock Connect Innovative Drug Index는 1.29% 상승했으며 추적 지수는 지난 1년 동안 최저 평가에 도달했습니다.","so":"Jiemian.com","tm":"11/23 12:37","c":1,"r":"cn","u":"https://www.jiemian.com/article/15360892.html","p":1795405055,"a":1795408841,"t":"港股创新药ETF景顺(513780)跟踪指数中证港股通创新药指数上涨1.29%，跟踪指数已处近1年估值低位","su":"2026년 11월 23일 11시 22분 기준, 홍콩 혁신의약품 ETF(여러 주식을 묶어 파는 상품) Invesco(513780) 추적지수 CSI Hong Kong Stock Connect Innovative Drug Index는 1.29% 상승했으며, 지난 1년간 추적지수는 낮은 평가를 받았습니다."},{"s":"Hong Kong Stock Connect Pharmaceutical ETF Penghua(513700)와 항셍 Biotech ETF Penghua(159130)가 활발하게 거래되고 있으며, 정책 및 산업 공조가 부문 시장을 촉진합니다.","so":"Jiemian.com","tm":"11/23 12:01","c":1,"r":"cn","u":"https://www.jiemian.com/article/15360535.html","p":1795402887,"a":1795408844,"t":"港股通医药ETF鹏华(513700)、恒生生物科技ETF鹏华(159130)交投活跃，政策产业共振催化板块行情","su":"뉴스에 따르면 11월 23일 2026년 의료보험과 상업보험의 '이중 카탈로그'가 공식 발표되어 결제 시스템이 '다층 결제, 가치 중심'으로 실질적 전환을 나타냈다. 또한, 글로벌 뇌-컴퓨터 인터페이스 기업 수는 2026년 800개 이상에서 1,175개로 증가해 2025년 대비 빠른 성장을 이룰 전망이다. 중국의 뇌-컴퓨터 인터페이스 산업은 베이징-천진-허베이, 장강 삼각주, 광둥, 홍콩, 마카오 등 3대 도시 집합체에 집중되어 있으며, 총 190개 이상의 기업이 전체 시장의 77.4%를 차지한다. 나라 전체. 종타이증권은 연준의 금리 인상에 대한 기대가 높아지고 임상 데이터 검증의 차이로 인해 장기 혁신의약품 자산의 가치 평가가 압박을 받았지만 업계의 번영은 근본적으로 변하지 않았다고 밝혔다. 현재 수익 예측 데이터를 활용해 계산하면 우시앱텍 등 일부 선두 CDMO의 벤치마크 시장가치 PER(주가가 이익의 몇 배인지)은 약 14.1배에 불과해 조정 밸류에이션(주가가 비싼지 싼지 따진 값) 수준이 매력적이다. 해외 금리 변동의 주기적 교란을 무시하고, 세계 최고의 역량을 갖춘 선도적인 CDMO와 거래량 및 가격 회복 리듬이 뚜렷한 선도적인 임상 CRO에 집중하고, 과매도 이후 가치 회복의 기회를 포착하는 것이 좋습니다."},{"s":"평가 1점: TROP2 ADC가 다시 임상 3상 성공을 달성하며, Kelun의 글로벌 약물 로직이 확고해졌습니다.","so":"第一财经","tm":"11/23 10:36","c":1,"r":"cn","u":"https://www.yicai.com/news/103449638.html","p":1795397812,"a":1795403779,"t":"壹评级：TROP2 ADC再获临床三期成功，科伦全球大药逻辑夯实","su":"11월 20일, 머크는 콜롬보트의 허가를 받은 TROP2 ADC 약물 sac-TMT가 위식도 선암종에 대한 3상 연구에서 전체 생존율(OS)의 1차 평가변수를 달성했다고 발표했습니다. 중국 비즈니스 네트워크(China Business Network)의 'One Rating'은 자궁내막암에 이어 난치성 위장관 종양에 대한 하드 엔드포인트를 통해 약효가 다시 한 번 검증되었으며, 이는 '글로벌 의약품'으로서의 잠재력이 확률적 판단에서 사실 확인으로 더욱 전환되었으며, 가치 평가의 확실성이 크게 향상되었음을 의미한다고 믿습니다. 원레이팅(One Rating)은 3차 위식도 선암종 환자들이 다제제 내성을 경험한 사례가 있으며, 중앙생존기간은 일반적으로 1년 미만이라고 지적했다. 이처럼 매우 이질적인 집단에서 임상(새 약을 사람에게 시험하는 것)적으로 의미 있는 전체 생존(OS) 이점을 달성하는 것은 sac-TMT가 강력하고 광범위한 항종양 활성을 가지고 있음을 입증합니다. 특정 바이오마커에 의존하지 않고 종양 유형 전반에 걸쳐 전체 생존(OS)을 개선하는 이러한 능력은 적응증 경계를 확장하는 혁신적인 약물에 대한 핵심 지원입니다. 본 연구의 2차 평가변수인 무진행 생존율(PFS)은 통계적으로 유의미한 수준에 도달하지 못했지만, 후기 치료와 의사의 화학요법 대조군 선택 측면에서 OS는 규제 기관에서 가장 중요하게 여기는 최적 기준이며, 긍정적인 결과는 핵심 적용 논리를 확립하기에 충분합니다."},{"s":"큐리언트 아드릭세티닙, 급성 골수성 백혈병 1차 치료로 임상 확대… FDA 승인 - 머니투데이","so":"머니투데이","tm":"11/23 08:50","c":1,"r":"kr","u":"https://www.mt.co.kr/index.php/stock/2026/11/23/2026112308460781755","p":1795391403,"a":1795392914,"su":"혁신신약(세상에 처음 나온 새로운 약) 개발기업 큐리언트는 미국 MD앤더슨 암센터가 주관하는 급성 골수성 백혈병(AML) 임상의 임상시험(새 약을 사람에게 시험하는 것)계획 변경이 미국 식품의약국(FDA)으로부터 승인됐다고 23일 밝혔다. 앞선 용량증가 단계에서는 베네토클락스를 포함한 표준 치료에 실패한 R/R AML 환자를 대상으로 Ven/Aza에 아드릭세티닙을 더한 3중 병용요법을 평가했으며, 연구진은 Ven/Aza와 병용할 때 아드릭세티닙의 임상 2상 권장용량을 120mg(1주 투여·1주 휴약)으로 결정했다."},{"s":"주가 방어 위해 생명공학업계, 자사주 희생 - Daily News","so":"工商時報","tm":"11/23 04:00","c":1,"r":"tw","u":"https://www.ctee.com.tw/news/20261123700180-439901","p":1795374000,"a":1795389899,"t":"捍衛股價生技業祭出庫藏股- 日報","su":"3분기부터 자사주(회사가 가진 자기 회사 주식)를 305,"t":"能源早报｜赣锋锂业取得不超3.6亿元股票回购专项贷款承诺函；盐湖股份拟不超过20亿元回购公司股份","su":"Ganfeng Lithium Industry는 3억 6천만 위안 이하의 주식 환매에 대한 특별 대출 확약서를 받았습니다. 11월 23일, Ganfeng Lithium Industry는 최근 회사가 중국공상은행 Xinyu 첨단기술 지점에서 발행한 대출 금액이 3억 6천만 위안 이하(대출 금액은 이번 환매 총액의 90%를 초과하지 않음)인 '대출 약정서'를 받았다고 발표했습니다. 대출기간은 36개월을 초과하지 않으며, 대출목적은 구체적으로 회사 주식을 환매하는 데 사용됩니다. 구체적인 대출사항은 회사와 은행이 정식으로 체결한 주식환매대출계약에 따릅니다. 앞서 회사는 2026년 11월 19일 제24차 제6기 이사회를 열고 '회사 A주(중국 본토 주식시장 주식) 매입 방안에 관한 제안'을 심의, 승인했으며, 회사가 자체 자금 및/또는 자체 조달 자금 중 일부를 총액 2억 위안(포함) 이상 4억 위안(포함) 이하로 사용하기로 합의했습니다. 회사는 회사의 가치와 주주 권리를 보호하기 위해 중앙 집중식 입찰 방식으로 RMB 보통주(A주)를 발행했습니다."},{"s":"키움증권 \"이차전지, 내년부터 실적회복…업종 투자의견 상향\"","so":"연합뉴스","tm":"11/24 08:37","c":1,"r":"kr","u":"https://www.yna.co.kr/view/AKR20261124029600008","p":1795477035,"a":1795478659,"su":"(서울=연합뉴스) 김유향 기자 = 키움증권은 \"내년에는 이차전지 산업의 실적(회사가 번 돈 성적표) 회복이 가능할 것이라고 판단한다\"면서 24일 업종에 대한 투자의견을..."},{"s":"올해 중국서 전기트럭 60만대 팔려…리튬 수요 견인","so":"www.dt.co.kr","tm":"11/24 06:00","c":1,"r":"kr","u":"https://www.dt.co.kr/article/12096797","p":1795467600,"a":1795499049,"su":"고유가 여파로 최근 중국에서 전기트럭 판매가 급증하면서 리튬 수요가 늘고 있다. 공급 과잉 우려로 침체기를 겪어온 리튬 시장에 예상치 못한 호재가 나타났다는 평가다. 23일(현지시간) 뱅크오브아메리카(BofA) 글로벌 리서치에 따르면, 세계 최대 전기차 시장이자 배터"},{"s":"CNA938 Rewind - #TalkBack: 작업장에서 EV 화재를 처리하기 위해 정비사가 얼마나 잘 훈련되고 준비되어 있습니까?","so":"CNA","tm":"11/23 22:43","c":1,"r":"sg","u":"https://www.channelnewsasia.com/listen/cna938-rewind/talkback-how-well-trainedprepared-are-mechanics-dealing-ev-fires-in-their-workshops-6575101","p":1795441406,"a":1795447022,"t":"CNA938 Rewind - #TalkBack: How well trained/prepared are mechanics for dealing with EV fires in their workshops?","su":"목요일(11월 19일) 신밍에 있는 작업장에서 포르쉐 타이칸의 EV 배터리에 불이 붙은 것으로 알려졌습니다. 직원들이 차량에서 배터리를 제거하던 중이었습니다. 연기를 흡입한 2명이 병원으로 이송됐다. 더 많은 EV가 싱가포르 도로를 주행함에 따라 기계공은 고전압 배터리를 사용하여 작업하게 될 것입니다."},{"s":"이상의 '탈영덕화'는 치열하다","so":"36Kr","tm":"11/23 21:44","c":1,"r":"cn","u":"http://www.36kr.com/p/4082286201181830","p":1795437851,"a":1795490305,"t":"理想“去宁德化”凶猛","su":"이상에 대한 '탈닝덕화'가 격렬하다 지난 9월 리샹과 마둥휘는 젱위췬과 한웨이를 만나기 위해 푸젠성 닝더로 갔다. 양측은 5년간의 포괄적 전략 협력 협정을 체결했습니다. 당시 CATL 배터리를 탑재한 릴리스 자동차의 누적 납품량은 100만 대가 조금 넘었다. 계약 체결 직후 배터리 공급 부족으로 릴리 i6 배송이 지연됐다. 올해 11월에는 채권(나라나 회사에 돈 빌려준 증서)추심과 MEGA 리콜 논란이 확산됐다. 이상형은 두 회사가 여전히 전략적 파트너로 남아 있다고 답했습니다. CATL은 로펌에 편지를 보내도록 의뢰했는데, 그 이메일은 정상적인 화해 및 지불 알림 이메일이었고 MEGA 리콜 개입도 거부했습니다. 두 배터리 공장의 고객 목록을 보면 이상적인 레이아웃과 위치가 변경되었습니다. 중국승용차협회가 수집한 고객 설치 데이터에 따르면, Ideal은 올해 6월에도 여전히 CATL의 4번째로 큰 고객으로 CATL 설치 용량의 6.8%를 차지했다. 같은 기간 순완다 고객사 중 6.4%로 5위를 차지했다. 8월까지 Ideal은 CATL의 상위 5개 고객사에서 사라졌으며 Sunwanda 설치 용량의 39%를 차지하고 Sunwanda 고객 목록에서 1위를 차지했습니다."},{"s":"승용차협회지부 최동수 : 2026년 파워배터리 시장은 \"두 영웅의 점유율이 완화되고, 2세대는 상승세를 가속화한다\"는 추세를 보일 것이다.","so":"Jiemian.com","tm":"11/23 18:04","c":1,"r":"cn","u":"https://www.jiemian.com/article/15362947.html","p":1795424688,"a":1795434999,"t":"乘联分会崔东树：2026年动力电池市场呈现“双雄份额松动，二线梯队加速崛起”态势","su":"11월 23일, Cui Dongshu 승용차협회 사무총장은 \"신에너지 자동차 리튬 배터리 시장 분석 - 2026년 10월\"을 발표했습니다. 최동수 분석에 따르면 2026년 파워 배터리 시장은 '두 영웅의 주가는 하락세를 보이고, 2위권은 상승세(오르는 흐름)를 가속화'하는 추세를 보일 것으로 보인다. CATL은 여전히 44.0%의 점유율로 시장을 선도하고 있지만, 분기 대비 감소했습니다(4분기에는 40.5%로). BYD는 19.1%로 소폭 상승했다. 동시에 궈쉬안(6.1%), Yiwei Lithium Energy(5.5%), Geely Yaoning(2.5%) 등 2위 기업의 주가가 크게 상승했습니다. 후발 기업(Doufuoduo, Funeng Technology 등)의 주식은 기본적으로 청산되었습니다. 전체적인 산업집중도는 낮아지고 경쟁은 더욱 다양해졌습니다."},{"s":"중국의 전기 트럭 붐으로 리튬 수요 증가","so":"Reuters","tm":"11/23 16:31","c":1,"r":"world","u":"https://www.reuters.com/business/autos-transportation/chinas-electric-truck-boom-lifts-demand-lithium-2026-11-23/","p":1795419060,"a":1795424011,"t":"China's electric truck boom lifts demand for lithium"},{"s":"단말측 AI 폭발이 배터리 수요 확대와 기술 발전을 견인하고 있다! Sanhua Intelligent Control과 Kedali는 7% 이상 상승했고, 배터리 ETF China Universal(159796) 지수는 2.5% 이상 상승했으며, CATL은 거의 60억 위안을 환매했습니다!","so":"Jiemian.com","tm":"11/23 16:19","c":1,"r":"cn","u":"https://m.jiemian.com/article/15362201.html","p":1795418376,"a":1795424010,"t":"端侧AI爆发，推动电池需求扩容与技术进步！三花智控、科达利涨超7%，电池ETF汇添富(159796)指数涨超2.5%，宁德时代回购近60亿元！","su":"11월 23일 오후 A주(중국 본토 주식시장 주식) 시장은 급등했고 상하이 주가지수는 하락폭을 줄였습니다! 보도시간 현재 배터리 ETF(여러 주식을 묶어 파는 상품) 차이나유니버셜(159796)의 기초지수가 반격하며 2.5% 이상 상승하며 7년 연속 마이너스 행진을 마감할 것으로 예상된다."},{"s":"[단독] 한진, 에코프로와 합작사 설립…배터리 물류 사업 본격화","so":"서울경제","tm":"11/23 16:10","c":1,"r":"kr","u":"https://www.sedaily.com/article/20117841","p":1795417845,"a":1795424008,"su":"단독한진, 배터리 물류 드라이브...에코프로와 합작법인 설립 에코한진물류 지분(회사를 나눠 가진 몫) 49% 확보 7월부터 가동…사업영역 확대 한진이 에코프로그룹과 손잡고 배터리 물류 합작법인을 설립했다. 이차전지 제조설비 운송과 항공운송 인증 취득 등으로 배터리 관련 역량을 쌓은 데 이어 이차전지 소재 기업과 공동 사업에 나서며 배터리 물류사업을 확대하는 모습이다. 23일 물류업계에 따르면 한진은 에코프로 자회사 에코로지스틱스와 공동 출자해 에코한진물류센터를 설립하고 지분 49%를 확보했다."},{"s":"포스코퓨처엠 \"차세대 음극재, 매달 수백건 테스트\"","so":"한국경제","tm":"11/23 16:08","c":1,"r":"kr","u":"https://www.hankyung.com/article/202611234670i","p":1795417694,"a":1795424008,"su":"포스코퓨처엠 \"차세대 음극재, 매달 수백건 테스트\", 세종기술연구소 현장 가보니 저팽창 천연흑연 2세대 연내 출시 실리콘 음극재 양산도 초읽기 \"탈중국 공급망(부품·재료가 오가는 연결망) 수요 적극 대응\""},{"s":"'산업자료' 승용차협회 : 10월 파워배터리 생산량은 245.1GWh로 전년 동기 대비 44% 증가","so":"etnet 經濟通","tm":"11/23 15:44","c":1,"r":"hk","u":"http://www.etnet.com.hk/www/tc/news/news-article.php?section=categorized&category=china&newsid=20261123755","p":1795416240,"a":1795417554,"t":"《行業數據》乘聯分會：10月動力電池產量245.1GWh，同比增44%","su":"2026-11-23 14:44 \"업계 자료\" 승용차협회지부: 10월 파워 배터리 생산량은 245.1GWh로 전년 동기 대비 44% 증가했습니다. 승용차협회 지부 Cui Dongshu는 10월 전력 배터리 생산량이 245.1GWh로 전년 대비 44% 증가했다고 밝혔습니다. 이 중 인산철리튬은 213.1GWh로 전년 동기 대비 56% 증가했고, 삼원리튬은 31.7GWh로 전년 동기 대비 6% 감소했다. 1~10월 누적 생산량은 2078.1GWh로 전년 동기 대비 61% 증가했으며, 인산철리튬 누적 생산량은 1736.4GWh로 전년 대비 70% 증가했다. 2026년 10월에는 전년 대비 18% 증가한 99GWh의 전원 배터리가 차량에 장착될 예정입니다. 구조는 극도로 차별화됐다. 인산철리튬은 86GWh(87%)로 전년 대비 28% 증가했다. 삼원리튬은 13GWh에 불과해 전년 대비 22% 감소했다. 1월부터 10월까지 총 676GWh가 설치돼 전년 동기 대비 17% 증가했는데, 이 중 인산철리튬이 564GWh(83% 차지)에 달했고 삼원계는 111GWh에 불과했다."},{"s":"LG엔솔, 배터리사 최초 UN 주도 ‘지속가능발전 선도기업’ 선정","so":"Chosunbiz","tm":"11/23 15:40","c":1,"r":"kr","u":"https://biz.chosun.com/industry/company/2026/11/23/QG25EIWP6FEP7C77OZVI5CBMEI/","p":1795416000,"a":1795417549,"su":"LG에너지솔루션이 국내 배터리 기업 가운데 최초로 유엔글로벌콤팩트(UNGC) 한국협회 리드(LEAD) 기업에 선정됐다고 23일 밝혔다. UNGC는 국제연합(UN)이 주도하는 지속가능경영 협의체로, 지속가능발전목표(SDGs) 달성에 기여한 회원사를 대상으로 선도기업을 선정해왔다. LG에너지솔루션은 2022년 4월 UNGC에 가입한 이후 기후변화 대응, 환경·사회·지배구조(ESG) 경영, 지속가능성 의제와 관련한 협회 주요 활동과 프로그램에 적극 참여해왔다."},{"s":"중국 흑연 수출 통제에 실리콘 전지소재 부각, 김종우 SK넥실리스 실리콘 음극재용 동박 선점 나서","so":"비즈니스포스트","tm":"11/23 15:26","c":1,"r":"kr","u":"https://www.businesspost.co.kr/BP?command=article_view&num=452663","p":1795415205,"a":1795424008,"su":"실리콘 음극재는 기존 흑연 음극재보다 에너지밀도가 약 10배 높아, 배터리 성능을 높일 수 있는 차세대 소재로 불린다. 다만 현재 충·방전 과정에서 음극재가 부풀어오르는 기술적 걸림돌로 상용화가 늦어지고 있다. SK넥실리스는 이같은 기술적 허들을 넘을 수 있는 실리콘 음극재용 전용 동박을 최근 개발하는 데 성공했다. 김종우 SK넥실리스 대표이사 사장은 실리콘 음극재용 동박 시장을 선점해 오랜 실적(회사가 번 돈 성적표) 부진에서 벗어난다는 계획이다."},{"s":"배터리ETF 인베스코(159757) 추적지수 중국증권 신에너지차 배터리지수는 2.22% 상승해 지난 1년간 최저 평가에 도달했다.","so":"Jiemian.com","tm":"11/23 15:02","c":1,"r":"cn","u":"https://m.jiemian.com/article/15361911.html","p":1795413720,"a":1795417551,"t":"电池ETF景顺(159757)跟踪指数国证新能源车电池指数上涨2.22%，跟踪指数已处近1年估值低位","su":"2026년 11월 23일 14시 2분 기준, 배터리 ETF(여러 주식을 묶어 파는 상품) 인베스코(159757) 추적지수 국가증권 신에너지차 배터리 지수는 2.22% 상승했으며, 추적지수는 지난 1년 동안 낮은 평가를 유지해왔다."},{"s":"직접회사: 탄산리튬 가격 하락 사이클에서 Ganfeng Lithium이 최대 4억 위안을 환매하는 것은 어떤 의미가 있습니까? (Zuo Jianming)","so":"第一财经","tm":"11/23 14:48","c":1,"r":"cn","u":"https://www.yicai.com/video/103450115.html","p":1795412904,"a":1795414348,"t":"直通公司：碳酸锂价格下行周期中，赣锋锂业最高4亿元的回购有怎样的意义？（左剑明）","su":"제일재경 2026-11-23 13:46:59 저자: Fang Ruoyuan 편집자: Gu Jie Direct 회사: 탄산리튬 가격 하락 사이클에서 Ganfeng 리튬 산업이 최대 4억 위안을 환매하는 것은 어떤 의미가 있습니까? (Zuo Jianming) Fang Ruoyuan 1118 직접 회사: Shenghong Technology, 손님: 시장 담당자 Zuo Jianming 1117 직접 회사: Liyang Chip, 손님: 시장 담당자 Zuo Jianming 직접 회사: Satellite Chemical은 신소재 프로젝트에 207억 위안을 투자했습니다. 순환 레이아웃의 의도는 무엇입니까? (Zuo Jianming) 1104 직접 회사: Dahua Co., Ltd., 손님: 시장 참가자 Zuo Jianming 1021 직접 회사: Hengli Petrochemical, 손님: 시장 참가자 Zuo Jianming"},{"s":"SQM은 리튬 수요가 지속적으로 증가하고 장기적으로 수급이 타이트하게 유지될 것이라고 낙관하고 있습니다.","so":"MoneyDJ","tm":"11/23 14:40","c":1,"r":"tw","u":"https://www.moneydj.com/kmdj/news/newsviewer.aspx?a=15e60860-d5fe-4133-b10d-6ddd46d1f7dd","p":1795412400,"a":1795417552,"t":"SQM看好鋰需求持續成長長期供需仍將緊俏- 新聞","su":"Mining Weekly는 칠레화학광업회사(SQM)가 최근 발표한 시장 전망에 따르면 최근 리튬 가격 약세(내리는 흐름) 추세와 4분기 평균 실제 리튬 판매 가격이 3분기보다 크게 낮을 수 있다는 회사의 예상에도 불구하고 글로벌 리튬 시장의 중장기 수요에 대해 여전히 낙관적인 전망을 유지하고 있는 것으로 나타났다고 보도했다. SQM 추정치, 20..."},{"s":"[모닝포스트] 국제유가가 밤새 '롤러코스터'를 겪었다. 스페이스X 3분기 실적은 기대치를 초과했습니다. CATL 및 기타 3분기 보고서가 발표되었습니다.","so":"财联社","tm":"11/23 13:53","c":1,"r":"cn","u":"https://www.cls.cn/detail/2510447","p":1795409581,"a":1795490307,"t":"【早报】国际油价，一夜“过山车”；SpaceX Q3 业绩超预期；宁德时代等三季报出炉","su":"① 미국 정부가 각 기관에 딥시크 사용 중단을 지시했고, 외교부가 대응 ② 국가 데이터 그룹 설립 ③ 미국 다우존스 산업평균지수가 1% 이상 상승 ④ 공업정보화부: R&D 테스트를 통해 충분히 검증되지 않은 불합리한 혁신 디자인과 자동차 제품의 시장 진입을 단호히 방지 ⑤ CATL, Tianyue Advanced, Yunnan Germanium Industry, CSSC Special Gas의 3분기 보고서가 공개된다. 매크로뉴스 1. 국무원의 승인을 받아 국립데이터그룹주식회사가 설립되었습니다. 국무원 국유자산감독관리위원회는 국무원을 대신하여 투자자의 직무를 수행한다. 국무원 국유자산감독관리위원회가 투자자의 임무를 수행하는 기업 목록에 포함될 것이다. 2. 미국 국토안보부는 10월 19일 미국 연방정부의 민간행정기관이 중국 인공지능 기업 딥서치(Deep Search) 및 그 계열사가 개발한 제품 및 서비스를 구매하는 것을 금지하고 관련 제품 및 서비스를 관련 기관의 정보시스템에서 제거하도록 요구한다고 발표했다. 상무부는 이에 대해 중국측은 강한 불만을 표하며 단호히 반대한다고 밝혔습니다. 미국은 양국 정상이 달성한 중요한 공감대를 진지하게 이행하고, 중국과 중간 협력하고, 중미 인공지능 대화 메커니즘을 잘 활용하고, 상호 신뢰를 강화하고, 차이를 관리하며, 인공지능을 공동으로 추진하기를 희망합니다."},{"s":"태양광전기자동차 양산버전이 납품되었습니다! 충전 없이 하루 60km 출퇴근 가능","so":"自由電子報汽車頻道","tm":"11/23 13:46","c":1,"r":"tw","u":"https://auto.ltn.com.tw/news/33527/3","p":1795409160,"a":1795411384,"t":"太陽能電動車量產版完成交車！日常通勤 60 公里不需充電","su":"작년에 새로운 브랜드인 Aptera는 태양광 세발자전거 출시 버전을 출시했습니다. 당시 양산 준비가 완료됐다고 발표됐다. 올해 미국 환경보호청(EPA)으로부터 적합 인증서를 획득했다. 첫 번째 출시 에디션은 브랜드의 초기 투자자인 마틴 하토노(Martin Hartono)에게 공식적으로 전달되었습니다. 이는 태양전지를 사용하여 하루 60km를 제공하는 이 세발자전거가 곧 대량 생산되어 출시된다는 의미이기도 합니다."},{"s":"DK-1788W 무선 2D 바코드 스캐너, 작업 중단 없이 교체 가능한 배터리 설계로 시장 판도를 뒤집다 | 인기 하이라이트 | 사업정보","so":"經濟日報","tm":"11/23 11:02","c":1,"r":"tw","u":"https://money.udn.com/money/story/5635/9894613","p":1795399365,"a":1795403790,"t":"DK-1788W無線二維條碼掃描器 以可換電池設計顛覆市場讓作業不中斷 | 熱門亮點 | 商情","su":"요즘에는 많은 제품이 첨단 기술을 강조하지만 일부 업계 관계자는 \"첨단 기술이 없고 인간의 요구와 작동 관성에 부응하는\" 매우 간단한 제품인 DK-1788W 무선 2D 바코드 스캐너를 출시했습니다. 리모콘만큼 조작하기 쉽고, 심지어 아야(Aya)도 사용할 수 있을 만큼 간단하다고 합니다. 많은 기업과 가맹점이 기존의 무선 바코드 스캐너를 사용하다 보면 내장 배터리의 노후화, 수리의 어려움, 심지어 배터리 하나의 손상으로 기기 전체를 폐기해야 하는 딜레마에 직면하는 경우가 많습니다. 사용자의 문제점을 완전히 해결하기 위해 업계에서 \"스캐너 최고의 전문가\"로 알려진 Huangwei International Company는 \"교체 가능한 배터리\" 디자인으로 시장을 뒤집고 가정용 TV 리모컨처럼 사용하기 쉬운 새로운 \"DK-1788W 무선 2D 바코드 스캐너\"를 출시했습니다. \"교체 가능한 AAA 배터리\" 설계는 제조업체가 설정한 숨겨진 비용 함정을 깨고 비용 효율적이고 임계값이 없는 새로운 옵션을 시장에 출시하여 사용자가 배터리 노후화에 대한 불안과 높은 유지 관리 비용에 작별을 고할 수 있도록 약속합니다. 본 제품은 공식 채널을 통해 출시되었으며, 시장에 충격과 반향을 불러일으킬 것으로 예상됩니다. 회사는 DK-1788W의 핵심 하이라이트는 다음과 같다고 밝혔습니다. 1. 배터리 수명을 기다리는 시간이 전혀 없고 몇 초 만에 전체 체력이 부활한다는 점을 강조합니다. 18650 리튬 배터리가 내장된 기존 스캐너는 전원이 부족할 때 충전에 의존해야 합니다."},{"s":"Hongqi EHS4 홍콩 첫 시험! $300,000 예산의 순수 전기 SUV를 위한 새로운 선택: Hongqi EHS4 전기 자동차 공간/장비/운전 경험이 완전히 테스트되었습니다!","so":"星島頭條","tm":"11/23 10:00","c":1,"r":"hk","u":"https://www.stheadline.com/car/3639957/%E7%B4%85%E6%97%97-EHS4-%E9%A6%99%E6%B8%AF%E9%A6%96%E8%A9%A630%E8%90%AC%E9%A0%90%E7%AE%97%E7%B4%94%E9%9B%BB-SUV-%E6%96%B0%E9%81%B8%E6%93%87Hongqi-EHS4-%E9%9B%BB%E5%8B%95%E8%BB%8A-%E7%A9%BA%E9%96%93%E9%85%8D%E5%82%99%E9%A7%95%E9%A7%9B%E6%84%9F-%E5%85%A8%E9%9D%A2%E5%AF%A6%E6%B8%AC","p":1795395630,"a":1795403793,"t":"紅旗 EHS4 香港首試！$30萬預算純電SUV 新選擇：Hongqi EHS4 電動車空間/配備/駕駛感全面實測！","su":"국내 고급 자동차 브랜드 홍치(Hongqi)는 지난 화요일(11월 17일) 이탈리아 베니스에서 새로운 보급형 5인승 순수 전기 SUV 홍치(Hongqi EHS4)를 세계 최초로 공개했습니다. 예상외로 홍콩 오른쪽 핸들 버전도 동시에 출시됐다. Jinlong Motor Group의 에이전트는 즉시 Taikoo Shing 플래그십 스토어에서 새 모델을 미리 선보였습니다. EHS4는 또한 30만 달러부터 시작하는 신차의 예정 가격을 발표했습니다. 신차는 12월 3일(목) 대규모 출시 행사를 공식적으로 개최할 예정인 것으로 전해졌다. 자세한 실시간 테스트 운전을 보려면 \"Cockpit\" YouTube 채널에서 무료로 동영상을 시청할 수 있습니다. 여기를 클릭하세요. 글과 그림: D"},{"s":"유진투자 \"포스코홀딩스 내년 수익성 개선, 리튬 사업 흑자전환은 지연 전망\"","so":"비즈니스포스트","tm":"11/23 09:53","c":1,"r":"kr","u":"https://www.businesspost.co.kr/BP?command=article_view&num=452605","p":1795395219,"a":1795403788},{"s":"에코프로·메디아나, 글로벌스탠더드경영대상서 장관표창 수상","so":"에너지경제신문","tm":"11/23 09:00 롄서, 11월 23일(류멍그란 기자) 소비세 재개, 수출세 환급 인하, 해외 관세(수입품에 붙이는 세금) 및 규정 준수 장벽의 지속적인 증가 등으로 인해 이번 리튬배터리 산업 사이클이 정점에 이르렀는지 여부를 둘러싼 목소리가 나오고 있다. 올해 10월 CATL(300750.SZ)의 3분기 실적(회사가 번 돈 성적표) 보고에서 회사 경영진은 중국의 국내 자전거 충전 용량이 증가하고 상업용 차량의 전기화가 가속화되었으며 유럽과 신흥 시장은 여전히 잠재력이 있고 에너지 저장에 대한 내부 및 외부 수요가 계속 증가하고 있으며 전 세계 전력 및 에너지 저장 수요가 예상보다 낫다고 밝혔습니다. 그러나 이러한 반응은 시장의 의구심을 해소하지 못했습니다. 최근 개최된 제11회 국제전력배터리응용서밋(CBIS2026)에서 많은 업계 관계자들이 연설에서 “기존 시장은 30% 이상의 복합성장에 시장이 익숙해져 있었지만, 기관에서는 2027년 배터리 출하량 증가율이 20%로 다시 하락할 것으로 전망하고 있다”고 밝혔다. 이는 업계가 ‘눈 감고 성장’ 단계에서 성장률 전환, 차별화, 전환이라는 새로운 단계로 전환했음을 의미하기도 한다."},{"s":"CATL은 유럽 시장으로 확장할 계획이며 EU에 정유용 폐배터리 재활용을 개방할 것을 촉구합니다.","so":"DIGITIMES","tm":"11/23 03:22","c":1,"r":"tw","u":"https://www.digitimes.com.tw/tech/dt/n/shwnws.asp?id=0000775544_4V64DOMZ59G7MF3Y1EBUT","p":1795371720,"a":1795389911,"t":"寧德時代布局歐洲市場 籲歐盟開放廢棄電池回送中精煉","su":"CATL 창립자이자 회장인 Zeng Yuqun은 유럽이 현지 배터리 재활용을 장려한다면 높은 비용에 직면하게 될 것이라고 경고했습니다. 그는 사용한 배터리를 중국으로 보내고, 재활용된 금속을 정제한 뒤 다시 유럽으로 운송하자고 제안했습니다. 이 계획은 유럽 공무원과 일부 자동차 제조업체에 제안되었습니다."},{"s":"CATL을 곤경에 빠뜨린 미국산 포드의 LFP는 중대한 조치를 취한다","so":"DIGITIMES","tm":"11/23 03:21","c":1,"r":"tw","u":"https://www.digitimes.com.tw/tech/dt/n/shwnws.asp?id=0000775525_ZD24WADF3PB7LO4GXA71T","p":1795371660,"a":1795389912,"t":"攜寧德時代惹一身腥 福特LFP美國自製跨出關鍵一步","su":"최근 포드는 인산철리튬(LFP) 배터리가 공식적으로 생산에 들어가고 전기 픽업트럭에도 탑재될 것이라고 발표해 미국이 LFP 배터리를 제조하는 데 중요한 발걸음을 내디뎠다. 유럽, 미국, 일본, 한국의 주류 자동차 제조업체를 살펴보면 Ford는 자체 제작에 성공한 몇 안 되는 사례 중 하나입니다. 외신은 CATL 턴키 의존도에 대해 의구심을 갖고 있지만, 공급망(부품·재료가 오가는 연결망)에서는 여전히 긍정적인 기대를 갖고 있다. ..."},{"s":"CATL은 배터리에서 에너지 통합으로 전환하여 라틴 아메리카 에너지 저장 시장에서 입지를 확대하고 있습니다.","so":"DIGITIMES","tm":"11/23 03:04","c":1,"r":"tw","u":"https://www.digitimes.com.tw/tech/dt/n/shwnws.asp?id=775366","p":1795370640,"a":1795389914,"t":"寧德時代從電池走向能源整合 擴大布局拉美儲能市場","su":"전기 자동차의 글로벌 인기가 둔화되고 시장 경쟁이 심화됨에 따라 CATL 회장 겸 CEO인 Zeng Yuqun은 회사가 표준화된 통합 솔루션을 만들기 위해 미국에서 수요가 높은 독립형 전원 공급 장치 시스템을 확보했다고 밝혔습니다. 또한 라틴 아메리카에서 에너지 저장 사업 기회를 완전히 포착하기 위해 아르헨티나에 상업 사무소를 설립했습니다."},{"s":"전기차도 국내생산세액공제 대상 포함 유
