H3ADEP2734AI/?outputType=amp","p":1794690000,"a":1794698095,"su":"0.0005N 힘 감지하는 로봇 피부, 20개 넘는 자유도 갖춘 로봇손 스위스 로보틱스 데이에 등장한 피지컬 AI 기술 로봇, 데이터·강화학습으로 조작 능력 익혀 촉각센서·액추에이터 등 부품 경쟁도 치열 韓 제조기업도 협력 기회 모색"},{"s":"항저우가 키운 춤추는 로봇… 유니트리, 中 증시서 62조원 가치 ‘우뚝’","so":"조선일보","tm":"11/15 03:00","c":1,"r":"kr","u":"https://www.chosun.com/economy/weeklybiz/2026/11/15/N656DOYEHVAY5GYJQJ7U6JJ5D4/","p":1794679200,"a":1794698095,"su":"항저우 기반 로봇 기업 유니트리가 저비용 모델을 앞세워 시가총액(회사 전체 몸값) 62조 원을 달성했습니다. 민간 주도 기술 발전과 교육·연구용 로봇 수요가 성장을 견인했으나, 휴머노이드(사람을 닮은 로봇)의 상업적 활용 및 기술적 완성도 측면에서는 향후 시장의 검증이 필요한 상황입니다."},{"s":"[모닝포스트] 유니트리, 오늘부터 신규주 청약을 시작했습니다. 이란은 호르무즈 해협 안전 개요를 승인했습니다. 캄브리콘, 롱시스 및 우시앱텍이 중요한 발표를 했습니다.","so":"财联社","tm":"11/15 00:28","c":1,"r":"cn","u":"https://www.cls.cn/detail/2449482","p":1794670123,"a":1794698096,"t":"【早报】宇树科技，今日申购；伊方批准霍尔木兹海峡安全纲要；寒武纪、江波龙、药明康德发布重要公告","su":"① 국가통계국: 7월 CPI 전년 동기 대비 0.5% 상승 ② S&P500(미국 큰 회사 500곳 지수) 지수가 지난 금요일 최고치를 경신했고, 광통신 부문이 급등했다. ③ 베이징: 집을 구입하는 비베이징 가구의 사회보장 및 개인 납세 기간이 1년으로 단축되었다. ④ 애플 China 공식 웹사이트에서 애플 Smart Access 알리바바 큐원(Qwen) 매뉴얼을 삭제했다. ⑤ 캄브리콘, 롱시스, Wuxi AppTec이 중요한 발표를 했다. 매크로 뉴스 1. 국가통계국이 발표한 자료에 따르면 7월 소비자물가지수(CPI)는 국제 수입 요인의 영향으로 전월 대비 0.1% 하락하고 전년 대비 0.5% 상승한 것으로 나타났습니다. 식품과 에너지를 제외한 근원 CPI는 전월 대비 0.3%, 전년 동기 대비 0.9% 상승했다. CPI는 전반적으로 완만한 상승을 유지했습니다. 1~7월 평균 전국 소비자물가는 전년 동기 대비 0.9% 상승했다. 국내 일부 산업의 수요가 늘었지만, 수입·계절적 요인 등으로 산업생산자물가(공장에서 파는 물건값 수준)지수(PPI)는 전월 ​​대비 0.7% 하락, 전년 동기 대비 3.5% 상승, 전월 대비 0.6%포인트 하락했다."},{"s":"로봇 더블 일레븐 '시험장': 대규모 판매 이후 배송과 생산 라인이 실제 테스트 문제","so":"财联社","tm":"11/15 00:11","c":1,"r":"cn","u":"https://www.cls.cn/detail/2533342","p":1794669109,"a":1794730754,"t":"机器人双十一\"考场\"：大卖之后，交付和产线才是真考题","su":"① 더블 일레븐(Double Eleven) 기간 동안, 임바디드 AI(로봇처럼 몸을 가진 인공지능)형 로봇 배치가 처음으로 물류 최전선에서 \"작업\"했습니다. ② 더블일레븐 이후에는 주문한 상품이 제때에 배송될 수 있는지, 이용자가 이를 수령한 후 반품할 것인지, 사용할 것인지 여부 등 배송을 소비자측에서 부담하게 됩니다. 창고가 대답해야 할 것은 로봇이 일년 내내 가장 극심한 주문 피크 기간 동안 안정적으로 작동하고 계산 가능한 경제적 가치를 계산할 수 있는지 여부입니다. '극장반일보'가 11월 13일 보도했다(리밍밍 기자) 더블일레븐은 막을 내렸지만 올해 로봇 분야에는 새로운 변화가 있다. 먼저, 소비자 측면에서는 더블 일레븐 기간 동안 플랫폼 내 지능형 휴머노이드(사람을 닮은 로봇) 로봇 매출이 전년 대비 700% 증가했고, 로봇 팔, 손재주 등 트렌드 카테고리 매출도 전년 대비 10배 이상 증가했다. 반면, 소비자가 주문한 후 분류, 포장 및 배송 링크에서는 임바디드 AI형 로봇 그룹이 처음으로 물류 최전선에서 '작업'했습니다."},{"s":"최신 Caixin Weekly │ 휴머노이드 로봇이 임계점을 기다리고 있습니다","so":"财新周刊","tm":"11/14 23:16","c":1,"r":"cn","u":"https://weekly.caixin.com/2026-11-14/102504772.html","p":1794665765,"a":1794698097,"t":"最新财新周刊｜人形机器人等待临界点","su":"텍스트 | A주 '최초의 인간형 로봇 주식'인 Caixin Weekly Du Zhihang 유니트리(688836.SH)는 8월 19일 상장(주식시장에 처음 들어오는 것) 당일 발행 가격이 주당 150.80위안에서 1,100위안으로 급등했습니다. 이후 오르락내리락하며 등락을 거듭하며 시가총액(회사 전체 몸값)은 최고에서 최고로 상승했습니다. 4,449억 위안으로 최저치인 1,634억 위안을 기록했으나 10월 중순 이후 등락을 거듭하며 2,815억 1,000만 위안 안팎까지 올랐다. 이 시가총액을 기준으로 3개 분기별 보고서의 수익을 합산하면 PS(가격 대비 판매 비율)는 여전히 120배입니다. \"2027년은 로봇 산업이나 로봇 모델 발전에 있어서 중요한 시점이 될 가능성이 높다.\" 2026년 11월 4일 Wuzhen 인터넷 컨퍼런스에서 유니트리의 왕싱싱(Wang Xingxing) CEO는 2027년에는 어떤 현장에서도 작동할 수 있는 로봇을 배치할 가능성이 높다며 두 달 전 기업공개(IPO) 때보다 조금 더 낙관적인 목소리를 냈습니다."},{"s":"2026~2030 휴머노이드 로봇 브레인용 D램 수요 전망(사진=카운터포인트리서치)","so":"전자신문","tm":"11/14 22:30","c":1,"r":"kr","u":"https://www.etnews.com/tools/image_popup.html?v=bjQ5VkNYY2dLZTZMZFBUbmNzandvWmpGcjBTK1pHYm1CUVRXR0pTMldlYVZkdE5JeGJVUFVVNURJN04rbmhKTXpEZ0VrRFJ1Z0UzZXBlTmtIMExTejVCeTJrc0pTeDdtRld1cnQ3Yi9BbWhSaTVjb0VObnNFZndkeDNYcGw4UEY1K0xQNVQvQlNwaUVLSko4a0E3aXFPSk9xemFzdGpKV0ltS1NSaGczSm85VzlHaEo2blpZRjJuQW0yZmlRSmdjZWo3R0o5NHoyUzlxMk5wOFhhaWJkL09zblpXVXkwVG5YVG01Z3hpTU9XMXN2b0Nzc1BPU1d1RlBqUmQ5azRmZzJISzRWNWpEWDFqVmRsNk1iTEw0eW4vUEdNTVNtZnBrdVhTdGtqTWlSVFFnSEVnNFZVTHRsL0tGZDJEb1l5aExVNE1iVmpWNlMrTzA3UXFKTmw2dFBlTXFIMzJCSjFZVDNYa3k5YXZ2OWtRREpoRjZ4TWlJeEFYdFFlcFljeXdrNm1OaGhKd1BhbENmdUdON3BQZTZ0Vkx1bTVZYXZVUGlHT1lQVjJWNEk0ST0","p":1794663016,"a":1794698095},{"s":"에릭 트럼프가 지원하는 로봇 군인 스타트업은 창업자가 집을 구입하기 위해 회사로부터 460만 달러를 빌린 후 직원에게 급여를 지급할 수 없습니다","so":"CNBC","tm":"11/14 21:00","c":1,"r":"us","u":"https://www.cnbc.com/2026/11/14/foundation-payroll-ceo-loan.html","p":1794657601,"a":1794659895,"t":"Eric Trump-backed robot soldier startup can't pay staff after 1/13 17:00","c":1,"r":"kr","u":"https://biz.sbs.co.kr/amp/article/20000346329","p":1794556800,"a":1794576174,"su":"[숏폼] 레인보우 로보틱스 두 자릿수 껑충 \"이벤트성 급등 이용해야\" SBS Biz 입력2026.11.13 17:00 수정2026.11.13 17:00 ⓒ SBS Medianet & SBSi 무단복제-재배포 금지"},{"s":"中 광군제, '200만원 휴머노이드' 판매 두 배 이상 급증 - 머니투데이","so":"머니투데이","tm":"11/13 15:32","c":1,"r":"kr","u":"https://www.mt.co.kr/world/2026/11/13/2026111315093515227","p":1794551554,"a":1794553638,"su":"올해 중국 최대 쇼핑 축제 광군제(11월 11일·쌍십일) 기간 온라인 쇼핑 플랫폼 징둥에서 지능형 휴머노이드(사람을 닮은 로봇) 로봇 판매량이 전년 동기 대비 700% 급증한 것으로 조사됐다. 지난 달 9일부터 11월 11일까지 징둥의 휴머노이드 부문에서는 휴머노이드 로봇 기업 쑹옌둥리 제품 판매량과 판매액이 모두 1위를 차지했다."},{"s":"Matrix의 초지능형 MATRIX-3가 중국 국제 수입 박람회에서 데뷔하여 휴머노이드 로봇 내비게이션 장면의 실제 구현을 시연했습니다.","so":"经济参考报","tm":"11/13 15:18","c":1,"r":"cn","u":"http://jjckb.xinhuanet.com/20261113/7b95c4f4da734577bf81494ee794e248/c.html","p":1794550726,"a":1794553640,"t":"矩阵超智MATRIX-3亮相进博会 展示人形机器人导览场景实景落地","su":"최근 제9회 중국국제수입박람회에 매트릭스 초지능 3세대 범용 휴머노이드(사람을 닮은 로봇) 로봇 MATRIX-3이 등장했다. 지능형 관광가이드 최초로 실제 현장 시연을 완료했다. 군중이 밀집되고 시끄러운 환경이 있는 공공적이고 복잡한 환경에서 독립적인 과학 혁신 촉진 상호 작용을 완료하여 공공 지식 서비스 시나리오에서 국내 물리적 AI 휴머노이드 로봇의 상업적 잠재력을 입증했습니다. 전시장에는 유동인구가 많고 배경 소음이 복잡합니다. MATRIX-3은 사전 설정된 스크립트의 제약이 전혀 없으며 수동으로 라인별로 제어할 필요가 없습니다. 방문자 인식, 다중 모드 대화형 전환, 기업 정보 설명 및 방문자 응답 상호 작용의 완전한 비즈니스 링크를 독립적으로 완료할 수 있습니다. 로봇은 현장 방문객의 상태에 따라 설명 콘텐츠를 독립적으로 검색할 수 있어 \"환경을 이해하고 방문객을 이해하는\" 진정한 투어 서비스 경험을 실현할 수 있습니다."},{"s":"아틀라스 휴머노이드 로봇은 발을 버리고 바퀴를 장착해 격렬하게 날고, 달보행을 복원하고, 점프하고 360도 표류한다.","so":"香港01","tm":"11/13 15:00","c":1,"r":"hk","u":"https://www.hk01.com/%E6%95%B8%E7%A2%BC%E7%94%9F%E6%B4%BB/60410075/atlas%E4%BA%BA%E5%BD%A2%E6%A9%9F%E6%A2%B0%E4%BA%BA%E6%A3%84%E9%9B%99%E8%85%B3%E8%A3%9D%E8%BC%AA%E7%8B%82%E9%A3%86-%E7%A5%9E%E9%82%84%E5%8E%9F%E6%9C%88%E7%90%83%E6%BC%AB%E6%AD%A5-360%E5%BA%A6%E8%B7%B3%E8%BA%8D%E9%A3%84%E7%A7%BB","p":1794549654,"a":1794628735,"t":"Atlas人形機械人棄雙腳裝輪狂飆 神還原月球漫步 360度跳躍飄移","su":"현대자동차그룹이 미국 로봇기업 보스턴다이내믹스의 지배지분(회사를 나눠 가진 몫)을 인수하고, 양사가 로봇 기술의 또 다른 돌파구를 마련하기 위해 협력하고 있다. 보스턴 이동"},{"s":"엑스와이지-KAIST,휴머노이드 기반 인간–로봇 상호작용 공동 연구 협약 체결","so":"로봇신문","tm":"11/13 14:32","c":1,"r":"kr","u":"https://www.irobotnews.com/news/articleView.html?idxno=49571","p":1794547942,"a":1794553638,"su":"피지컬 AI 전문기업 엑스와이지(대표 황성재)는 12일 KAIST와 인간–로봇 상호작용(HRI) 기술 공동 연구 및 인프라 구축을 위한 업무협약(MOU)을 체결하"},{"s":"중국 더블11 로봇 붐: 휴머노이드 로봇 판매량 7배 급증","so":"工商時報","tm":"11/13 13:18","c":1,"r":"tw","u":"https://www.ctee.com.tw/news/20261113700935-430804","p":1794543480,"a":1794576181,"t":"陸雙11機器人大爆單 人形機器人銷量狂飆7倍","su":"중국 본토 더블 11 쇼핑 페스티벌이 막을 내렸습니다. 올해는 로봇산업이 시장의 화두가 됐다. 소비자용 휴머노이드(사람을 닮은 로봇) 로봇의 판매가 크게 증가했을 뿐만 아니라, 임바디드 AI(로봇처럼 몸을 가진 인공지능)형 로봇도 처음으로 대규모 물류 분류 작업에 투입되었습니다. 징둥닷컴 데이터에 따르면 Double 11 기간 동안 스마트 휴머노이드 로봇의 판매가 전년 대비 700% 증가했으며 로봇 팔, 손재주 같은 제품의 매출이 10배 이상 증가한 것으로 나타났습니다. 또한 차이나포스트, SF익스프레스 등 물류센터에도 로봇이 진출하기 시작했는데, 1시간에 최대 1.5개까지 분류할 수 있는 처리량을 기록했다."},{"s":"로봇 교통경찰, AI 항저우 경찰이 즉시 영어를 바꿔 행인의 의심 해결에 도움 - Cross-Strait","so":"工商時報","tm":"11/13 13:00","c":1,"r":"tw","u":"https://www.ctee.com.tw/news/20261113701019-430801","p":1794542400,"a":1794553642,"t":"機器人交警上崗AI杭警可秒換英文幫路人解惑- 兩岸","su":"인공 지능과 임바디드 AI(Embodied AI)의 기술 혁신으로 중국 본토의 많은 도시에서는 도로 교통 관리에 참여하기 위해 \"로봇 교통 경찰\"을 연속적으로 도입했습니다. 로봇 교통경찰은 근무 중에도 거리에서 '흥미로운 에피소드'를 많이 펼쳤다. Xinhuanet의 보고서에 따르면 저장성 항저우는 중국 본토에서 최초로 완전히 조직화된 교통 관리 로봇 팀인 \"항저우 경찰 정보\" 로봇 교통 경찰 대대를 설립했습니다. 이 비행대는 15개의 지능형 교통 통제 로봇으로 구성됩니다."},{"s":"ASUS, 최초의 휴머노이드 로봇 Gallop 발표","so":"CNBC","tm":"11/13 12:33","c":1,"r":"us","u":"https://www.cnbc.com/video/2026/11/13/asus-announces-first-humanoid-robot-gallop.html","p":1794540819,"a":1794553639,"t":"ASUS announces first humanoid robot: Gallop","su":"ASUS의 공동 CEO인 S.Y.Hsu는 현재 ASUS 생산 라인에서 테스트 중인 최초의 휴머노이드(사람을 닮은 로봇) 로봇을 사용하여 회사의 물리적 AI 장치 개발에 대해 논의합니다. 그는 Gallop이 2027년 하반기에 파트너에게 출시되고 2028년에 시장에 출시될 예정이라고 밝혔습니다."},{"s":"유비테크, 메타엑스와 협력해 2028년 로봇 칩 대량 생산","so":"21财经","tm":"11/13 12:23","c":1,"r":"cn","u":"https://www.21jingji.com/article/20261113/herald/52fdd685f52c0ae8b6e9eb9b149a1425.html","p":1794540180,"a":1794576176,"t":"优必选联手沐曦，机器人芯片2028年量产","su":"최근 메타엑스와 유비테크가 공동으로 설립한 임바디드 AI(로봇처럼 몸을 가진 인공지능) 칩 회사인 Xixuan Chuangzhi는 5억 위안, 사후 평가액 40억 위안의 엔젤 라운드 자금 조달(사업에 쓸 돈을 모으는 것)을 완료했습니다. 이번 자금 조달 라운드는 GGV Capital과 Matrix Ventures가 공동으로 주도했으며 Heli Capital, CDH Loongson Ventures, SAIC Hengxu Capital, Yaotu Capital, Zhengxuan Capital, Heart Capital, Advantage Capital, Boyaa Ventures 등이 뒤를 이었습니다. 이번 자금 조달은 주요 SoC 연구 및 개발, 소프트웨어 도구 체인, 팀 구축, 샘플 테스트부터 대량 생산 납품까지의 엔지니어링 링크에 투자됩니다. 두 회사는 각각 칩 설계 및 로봇 공학 시나리오에서 각자의 노동 분업에 따라 35%의 지분 구조를 보유하고 있습니다. 첫 번째 로봇 메인 제어 SoC는 2027년 하반기 테이프아웃, 2028년 양산을 목표로 하는 명확한 리듬을 갖고 있다."},{"s":"로봇부품 구매액은 전년 대비 300% 가까이 증가했고, 장중 로봇ETF 보시(158037) 추적지수도 1% 이상 상승했다.","so":"Jiemian.com","tm":"11/13 11:54","c":1,"r":"cn","u":"https://m.jiemian.com/article/15329587.html","p":1794538440,"a":1794553641,"t":"机器人零部件采购额同比增长近300%，机器人ETF博时(158037)跟踪指数盘中涨超1%","su":"로봇 ETF(여러 주식을 묶어 파는 상품) Boshi(158037)는 장중 1% 이상 상승해 지난 21일 동안 6억 8500만 위안의 자금을 유치했습니다. 징둥닷컴의 산업용 로봇 구매가 거의 300% 증가했으며, 화웨이 Cloud는 11월 16일 CloudRobo 임바디드 월드 모델을 출시할 예정입니다."},{"s":"티로보틱스, KAIST와 ‘피지컬 AI’ 사업화 협력…휴머노이드·AMR 실증 가속","so":"이투데이","tm":"11/13 11:22","c":1,"r":"kr","u":"https://www.etoday.co.kr/news/view/2647851?trc=sub_list_news","p":1794536520,"a":1794539865,"su":"제조피지컬AI연구소와 MOU…표준화 얼라이언스·글로벌 시장 공략카이로스 프로젝트 이어 협력 확대…자체 휴머노이드(사람을 닮은 로봇) ‘티알웍스’ 현장 검증▲티로보틱스"},{"s":"테슬라│테슬라, 사이버트럭 원격조종자동차와 옵티머스 Gen 2.5 인형 출시","so":"香港經濟日報HKET","tm":"11/13 11:00","c":1,"r":"hk","u":"https://inews.hket.com/article/4224397/Tesla%EF%BD%9C%E7%89%B9%E6%96%AF%E6%8B%89%E6%8E%A8Cyber%E2%80%8B%E2%80%8Btruck%E9%81%99%E6%8E%A7%E8%BB%8A%E5%92%8COptimus%20Gen%202.5%E7%8E%A9%E5%81%B6?mtc=20023","p":1794535200,"a":1794539870,"t":"Tesla｜特斯拉推Cyber​​truck遙控車和Optimus Gen 2.5玩偶"},{"s":"베이징은 임바디드 AI 로봇 산업을 위한 3개년 행동 계획을 발표했습니다. 로봇ETF 톈훙(159770)는 어제 3천만주가 넘는 순청약을 기록하며 같은 입찰로 선전증권거래소에서 1위를 차지했다.","so":"Jiemian.com","tm":"11/13 10:22","c":1,"r":"cn","u":"https://www.jiemian.com/article/15328455.html","p":1794532970,"a":1794539869,"t":"北京发布具身智能机器人产业三年行动方案，机器人ETF天弘(159770)昨日净申购超3000万份为深市同标的第一","su":"2026년 11월 12일 거래 종료 기준으로 로봇 ETF(여러 주식을 묶어 파는 상품) 톈훙(159770)는 하루 동안 3,150만 건의 순 청약을 기록하여 심천 증권 거래소의 기본 ETF 중 1위를 차지했습니다. CSI 로봇지수(H30590)는 4.39% 하락했다. 부품주별로는 OPT가 12.71% 하락을 주도했고, OBI Zhongguang이 12.70% 하락했고, SUPCON Technology가 12.09% 하락했으며, Keyuan Wisdom이 8.07%, Evert가 7.99% 하락했다. 11월 12일 현재 로봇ETF '천홍(159770)'에 최근 순유입된 자금은 2,830만 위안이다. 지난 10거래일 동안 총 3453만 위안이 '유치'됐다. [상품 하이라이트] Robot ETF 톈훙 (159770) 로봇 산업 체인의 관점에서 볼 때 기본 지수는 하드웨어 및 소프트웨어의 핵심 영역인 핵심 구성 요소, 알고리즘 제어 모듈 및 모터 배터리 모듈을 다룹니다."},{"s":"천진 경공업 직업 기술 대학, 유니트리와 손잡고 임바디드 AI 산업 대학 설립","so":"新华网","tm":"11/13 10:11","c":1,"r":"cn","u":"http://tj.news.cn/20261113/7b8d3735b49e4aaeb58ce79311be2291/c.html","p":1794532275,"a":1794576176,"t":"天津轻工职业技术学院携手宇树科技共建具身智能产业学院","su":"11월 7일, 천진 경공업 직업 기술 대학과 유니트리는 천진 빈해 신구에서 임바디드 AI(로봇처럼 몸을 가진 인공지능) 산업 대학을 공동으로 설립하기로 합의했습니다. 양 당사자는 임바디드 AI 산업의 발전을 위한 고품질 기술 인재를 제공하는 것을 목표로 전문 구축, 커리큘럼 개발 및 교육 기반 구축에 관한 심층적인 협력을 수행할 예정입니다. 이번 협력은 학교가 산업과 교육의 통합을 심화하고 인공지능과 스마트 제조 산업의 요구를 연결하기 위한 핵심 조치입니다. 임바디드 AI형 로봇 공학에 대한 학교의 전문 지식과 휴머노이드(사람을 닮은 로봇) 로봇, 4족 로봇 및 모션 제어 분야에서 유니트리의 기술 및 자원 이점을 활용하여 양 당사자는 기업 기술 표준과 실제 엔지니어링 프로젝트를 교육 과정에 도입할 것입니다. 현장과 과정을 연계한 종합 교육 모델을 추진하여 로봇 본체 디버깅, 현장 통합, 현장 운영 및 유지보수, 솔루션 전달 역량 등을 갖춘 실무형 인재 양성에 중점을 두고, \"강의실 교육-실제 기계 교육-산업 취업\"의 풀체인 교육 경로를 구축합니다."}]}],"auto":{"🇰🇷 한국":["www.ebn.co.kr","데일리안","블루밍비트","서울경제TV","아시아투데이","아주경제","파이낸셜포스트"]},"breaking_url":"https://raw.githubusercontent.com/inwonc4524-code/Investment_NotiBot/main/breaking.json","show":8}</script>

function $(id){ return document.getElementById(id); }
function esc(t){ return String(t==null?'':t).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
// 휴대폰에 기억해 두는 값 (마지막 탭, 탭별로 마지막에 본 시각, 정렬, 국가)
function load(k, d){ try { var v = localStorage.getItem('nb_'+k); return v===null ? d : JSON.parse(v); } catch(e){ return d; } }
function save(k, v){ try { localStorage.setItem('nb_'+k, JSON.stringify(v)); } catch(e){} }
var S = { tab: 0, seen: load('seen', null), sort: load('sort', 'c'), region: load('region', 'all'), shown: D.show, prev: {} };
function newest(t){ var m = 0; t.items.forEach(function(n){ if(n.a > m) m = n.a; }); return m; }
if(S.seen === null){ S.seen = {}; D.themes.forEach(function(t){ S.seen[t.name] = newest(t); }); save('seen', S.seen); }  // 처음 방문: 레드닷 없이 시작
(function(){ var nm = load('tabname', ''); D.themes.forEach(function(t, i){ if(t.name === nm) S.tab = i; }); })();  // 마지막에 본 탭 (이름으로 기억)
if(location.hash && /^#t\d+$/.test(location.hash)) S.tab = +location.hash.slice(2);
if(S.tab >= D.themes.length) S.tab = 0;

function visible(t){
  return t.items.filter(function(n){ return S.region==='all' || n.r===S.region; });
}
function sorted(list, breaking){
  var k = breaking ? 'p' : S.sort;
  return list.slice().sort(function(x,y){
    var c = y.c - x.c, p = y.p - x.p; return k==='c' ? (c||p) : (p||c);
  });
}
function renderTabs(){
  $('tabs').innerHTML = D.themes.map(function(t, i){
    var dot = newest(t) > (S.seen[t.name] || 0) && i !== S.tab;
    return '<button class="tab'+(i===S.tab?' on':'')+'" onclick="openTab('+i+')">'+esc(t.name)+
           '<b>'+visible(t).length+'</b>'+(dot?'<span class="dot" title="새 뉴스"></span>':'')+'</button>';
  }).join('');
  var on = $('tabs').children[S.tab]; if(on && on.scrollIntoView) on.scrollIntoView({block:'nearest', inline:'center'});
}
function renderCtrl(){
  var br = D.themes[S.tab].breaking;
  var h = '';
  if(!br){
    h += '<button class="'+(S.sort==='c'?'on':'')+'" onclick="setSort(\'c\')">🔥 화제순</button>';
    h += '<button class="'+(S.sort==='p'?'on':'')+'" onclick="setSort(\'p\')">🕒 최신순</button><span class="sep"></span>';
  }
  h += '<button class="'+(S.region==='all'?'on':'')+'" onclick="setRegion(\'all\')">전체</button>';
  D.regions.forEach(function(r){
    h += '<button class="'+(S.region===r.k?'on':'')+'" onclick="setRegion(\''+r.k+'\')">'+esc(r.l)+'</button>';
  });
  $('ctrl').innerHTML = h;
}
function card(n, prev){
  var hot = n.c > 1 ? '<span class="hot'+(n.c>=5?' big':'')+'">🔥 언론 '+n.c+'곳</span>' : '';
  var isNew = prev && n.a > prev ? ' <span class="new">NEW</span>' : '';
  return '<a class="card" href="'+esc(n.u)+'" target="_blank" rel="noopener" data-s="'+esc(n.su||'')+'" data-so="'+esc(n.so)+'">'+
    '<div class="meta">'+hot+esc(RL[n.r]||'')+' · '+esc(n.so)+' · '+esc(n.tm)+isNew+'</div>'+
    '<div class="title">'+esc(n.s)+'</div>'+(n.t?'<div class="orig">'+esc(n.t)+'</div>':'')+'</a>';
}
function renderMain(){
  var t = D.themes[S.tab], list = sorted(visible(t), t.breaking), prev = S.prev[t.name] || 0;
  var h = '<h2>'+esc(t.name)+'</h2>' + (t.note ? '<p class="note">'+esc(t.note)+'</p>' : '');
  var fresh = prev ? list.filter(function(n){ return n.a > prev; }).length : 0;
  if(S.onlyNew){                                // '새 기사만 보기' 중
    list = list.filter(function(n){ return n.a > prev; });
    h += '<button class="newbar" onclick="onlyNew(false)">🆕 새 기사 '+list.length+'개만 보는 중 · 전체 보기</button>';
  } else if(fresh && !t.breaking){              // 새 기사가 정렬 때문에 아래로 밀려도 바로 찾을 수 있게
    h += '<button class="newbar" onclick="onlyNew(true)">🆕 새 기사 '+fresh+'개 · 새 기사만 보기</button>';
  }
  if(!list.length) h += '<p class="none">'+(S.region==='all' ? '최근 ' + (t.breaking?'속보':'기사') + ' 없음' : esc(RL[S.region])+' 기사 없음')+'</p>';
  h += list.slice(0, S.shown).map(function(n){ return card(n, prev); }).join('');
  var extra = list.length - S.shown;
  if(extra > 0) h += '<button class="more" onclick="more()">더보기 ▾  ('+extra+'개 더)</button>';
  else if(S.shown > D.show) h += '<button class="more" onclick="less()">접기 ▴</button>';
  var auto = Object.keys(D.auto);
  h += '<footer>업데이트 '+esc(D.updated)+' · 최근 3일 · 믿을 만한 언론사 기사만 · 기사를 누르면 한국어 요약 → 원문 보기<br>'+
       '🔥 언론 N곳 = 같은 소식을 보도한 언론사 수 (많을수록 화제) · <span style="color:var(--red)">●</span> = 새 뉴스'+
       '<br><br><b>자동으로 추가된 언론사</b> (주요 언론보다 먼저 보도하고, 주요 언론도 함께 다룬 소식이 많은 곳 · 최근 14일)'+
       (auto.length ? auto.map(function(k){ return '<div>'+esc(k)+': '+esc(D.auto[k].join(', '))+'</div>'; }).join('') : '<div>아직 없음</div>')+
       '</footer>';
  $('main').innerHTML = h;
}
function openTab(i){
  var t = D.themes[i];
  S.tab = i; S.shown = D.show; S.onlyNew = false; save('tabname', t.name);
  if(!(t.name in S.prev)) S.prev[t.name] = S.seen[t.name] || 0;     // 이 탭에서 NEW 로 보여줄 기준
  S.seen[t.name] = Math.max(S.seen[t.name] || 0, newest(t)); save('seen', S.seen);  // 탭에 들어오면 레드닷 지움
  history.replaceState(null, '', '#t'+i);
  renderTabs(); renderCtrl(); renderMain(); window.scrollTo(0, 0);
}
function setSort(k){ S.sort = k; save('sort', k); S.shown = D.show; renderCtrl(); renderMain(); }
function setRegion(k){ S.region = k; save('region', k); S.shown = D.show; renderTabs(); renderCtrl(); renderMain(); }
function more(){ S.shown += 20; renderMain(); }
function onlyNew(on){ S.onlyNew = on; S.shown = D.show; renderMain(); }
function less(){ S.shown = D.show; renderMain(); window.scrollTo(0, 0); }
$('upd').textContent = '업데이트 ' + D.updated + ' · 탭을 눌러 테마별 뉴스 보기';

// 🚨 미국 속보 · 🌏 해외 속보는 페이지를 새로 올리지 않아도 최신 내용을 바로 가져옴
function refreshBreaking(){
  if(!window.fetch) return;
  fetch(D.breaking_url + '?t=' + Date.now(), {cache:'no-store'}).then(function(r){ return r.json(); }).then(function(b){
    var all = b.items || [];
    D.themes.forEach(function(t, i){
      if(!t.breaking) return;
      var items = all.filter(function(n){ return n.theme === t.name; }).map(function(n){
        var d = {s:n.show, so:n.source||'', tm:n.time||'', c:n.count||1, r:n.rk||'us', u:n.url||n.link, p:Math.floor(n.pub), a:Math.floor(n.added||n.pub)};
        if(n.show !== n.title) d.t = n.title; if(n.sum) d.su = n.sum; return d;
      });
      if(!items.length && t.items.length) return;
      t.items = items;
      if(S.tab === i){ S.seen[t.name] = Math.max(S.seen[t.name]||0, newest(t)); save('seen', S.seen); renderMain(); }
    });
    renderTabs();
  }).catch(function(){});
}
openTab(S.tab);
refreshBreaking();
setInterval(refreshBreaking, 5 * 60 * 1000);
document.addEventListener('visibilitychange', function(){ if(!document.hidden) refreshBreaking(); });

// 기사를 누르면 먼저 한국어 요약 → 원문 볼지 선택
document.addEventListener('click', function(e){
  var c = e.target.closest('a.card'); if(!c) return;
  if(e.ctrlKey||e.metaKey||e.shiftKey) return;
  e.preventDefault();
  $('s-meta').innerHTML = c.querySelector('.meta').innerHTML;
  $('s-title').textContent = c.querySelector('.title').textContent;
  var o = c.querySelector('.orig'); $('s-orig').textContent = o ? o.textContent : '';
  var sm = c.dataset.s || '';
  $('s-sum').textContent = sm || '이 기사는 요약을 가져오지 못했어요. (사이트가 자동 접속을 막았거나 아직 준비 중)';
  $('s-sum').className = 's-sum' + (sm ? '' : ' empty');
  $('s-go').href = c.href;
  // 외국어 기사면 ✦ Gemini 버튼 보이기 (한국어 기사는 숨김)
  var foreign = !!o || !/[가-힣]/.test(c.querySelector('.title').textContent);   // 번역이 안 됐어도 외국 기사면 버튼 표시
  $('s-cs').hidden = $('s-ct').hidden = $('s-cnote').hidden = !foreign;
  if(foreign){
    // 원문을 열고, Gemini 가 '지금 화면'의 기사를 읽고 답하도록 요청 문장만 복사
    $('s-cs').href = $('s-ct').href = c.href;
    $('s-cs').dataset.q = '이 페이지의 기사 전체를 처음부터 끝까지 읽고 한국어로 요약해 줘. 핵심 내용 3~5줄, 그리고 투자자 입장에서 중요한 숫자와 의미를 짧게 정리해 줘.';
    $('s-ct').dataset.q = "너는 어려운 경제 뉴스를 초등학생도 이해할 수 있게 풀어 주는 친절한 번역가야.\n이 페이지의 뉴스 기사 전체를 쉬운 한국어로 번역해 줘.\n\n[가장 중요한 규칙]\n- 쉽게 쓰더라도 기사 내용은 정확해야 해. 사실을 빼거나, 바꾸거나, 지어내지 마.\n- 기사 순서대로, 빠지는 내용 없이 번역해 줘.\n\n[쉽게 쓰는 방법]\n1. 한 문장에는 한 가지 내용만 써 줘. 문장은 짧게.\n2. \"~습니다/~해요\"체로 친절하게 써 줘.\n3. 어려운 말은 쉬운 말로 바꾸고, 꼭 필요한 전문 용어는 처음 나올 때 괄호로 뜻을 풀어 줘.\n   (예: 금리(돈을 빌릴 때 내는 이자의 비율), 실적(회사가 번 돈과 성과), 주가(회사 주식 한 주의 가격))\n4. 한자어·외래어보다 쉬운 우리말을 먼저 써 줘. (예: 하락 → 떨어졌어요, 상승 → 올랐어요)\n5. 큰 숫자는 읽기 쉽게 바꾸되 정확한 값은 지켜 줘. (예: $2.5 billion → 25억 달러(약 3조 5천억 원쯤))\n   환율로 바꾼 값은 \"약\"을 붙여서 대략이라는 걸 알려 줘.\n6. 회사·사람 이름은 한국에서 부르는 이름으로 쓰고, 처음 나올 때만 괄호에 영어 이름을 적어 줘. (예: 엔비디아(Nvidia))\n7. 누가 한 말인지 분명하게 써 줘. (예: 젠슨 황 대표는 \"…\"라고 말했어요.)\n\n[출력 형식]\n① 한 줄 요약: 이 기사가 무슨 이야기인지 한 문장으로\n② 쉬운 번역: 기사 순서대로\n③ 어려운 말 풀이: 기사에 나온 경제 용어 3~5개를 한 줄씩 쉽게 설명\n④ 그래서 무슨 뜻이야?: 이 소식이 주식 투자하는 사람에게 왜 중요한지 2~3줄\n   (기사에 나온 사실만 근거로, 내 생각이나 예측은 넣지 마)\n\n기사가 길어서 한 번에 다 못 하면, 어디까지 했는지 알려 주고 내가 \"계속\"이라고 하면 이어서 해 줘.";
  }
  $('dim').hidden = false; $('sheet').hidden = false; $('sheet').scrollTop = 0;
  document.body.style.overflow = 'hidden';
});
// ✦ 버튼: Gemini 요청 문장을 복사하고 원문을 엶 → 원문 화면에서 Gemini 를 불러 붙여넣기
function askAI(a){
  var q = a.dataset.q || '';
  try { if(navigator.clipboard) navigator.clipboard.writeText(q); } catch(e){}
  toast('요청 문장을 복사했어요 · 원문에서 측면 버튼 길게 → 「이 페이지에 관해 질문하기」 → 붙여넣기');
  setTimeout(closeSheet, 50);
}
function toast(msg){ var t = $('toast'); t.textContent = msg; t.hidden = false; clearTimeout(toast._t); toast._t = setTimeout(function(){ t.hidden = true; }, 4000); }
function closeSheet(){ $('dim').hidden = true; $('sheet').hidden = true; document.body.style.overflow = ''; }
document.addEventListener('keydown', function(e){ if(e.key==='Escape') closeSheet(); });
</script></body></html>
