<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#262624">
<title>투자 테마 뉴스</title>
<style>
@font-face{font-family:'ChosunIlboMyungjo';src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_one@1.0/Chosunilbo_myungjo.woff') format('woff');font-weight:normal;font-display:swap}
:root{color-scheme:dark;--bg:#262624;--card:#30302e;--card2:#3a3a37;--text:#faf9f5;--sub:#a6a39a;--line:#3e3e3a;--acc:#d97757;--red:#ef4444}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.55 'ChosunIlboMyungjo',Georgia,"Noto Serif KR",serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:760px;margin:auto}
header{padding:20px 16px 8px}
h1{font:600 22px/1.3 'ChosunIlboMyungjo',Georgia,serif;margin:0 0 4px}
.upd{color:var(--sub);font-size:12.5px}
/* 테마 탭 */
.tabs{position:sticky;top:0;z-index:3;background:rgba(38,38,36,.96);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.tabrow{display:flex;gap:8px;overflow-x:auto;padding:12px 16px 10px;scrollbar-width:none}.tabrow::-webkit-scrollbar{display:none}
.tab{position:relative;flex:none;padding:9px 15px;border-radius:12px;border:1px solid var(--line);background:var(--card);
  color:var(--sub);font:inherit;font-size:14px;cursor:pointer}
.tab b{margin-left:5px;color:var(--sub);font-weight:400;font-size:12px}
.tab.on{background:var(--acc);border-color:var(--acc);color:#1f1e1d;font-weight:600}.tab.on b{color:#1f1e1d}
.dot{position:absolute;top:-3px;right:-3px;width:11px;height:11px;border-radius:50%;background:var(--red);border:2px solid var(--bg)}
/* 정렬·국가 */
.ctrl{display:flex;gap:6px;overflow-x:auto;padding:0 16px 10px;scrollbar-width:none}.ctrl::-webkit-scrollbar{display:none}
.ctrl button{flex:none;border:1px solid var(--line);background:transparent;color:var(--sub);border-radius:8px;padding:5px 11px;font:inherit;font-size:12.5px}
.ctrl button.on{background:var(--card2);border-color:var(--card2);color:var(--text)}
.ctrl .sep{flex:none;width:1px;background:var(--line);margin:2px 4px}
main{padding:6px 12px 48px}
h2{font:600 19px/1.3 'ChosunIlboMyungjo',Georgia,serif;margin:16px 4px 2px}
.note{margin:0 4px 10px;color:var(--sub);font-size:12px}
.none{color:var(--sub);margin:24px 4px;text-align:center}
.card{display:block;background:var(--card);border-radius:12px;padding:12px 14px;margin:8px 0;color:var(--text);text-decoration:none;transition:background .15s}
.card:hover{background:var(--card2)}.card:active{opacity:.75}
.meta{color:var(--sub);font-size:12px}
.title{font-weight:500;margin-top:3px}
.orig{color:var(--sub);font-size:12px;margin-top:3px}
.new{margin-left:4px;color:var(--red);font-size:11px;font-weight:700;letter-spacing:.3px}
.hot{display:inline-block;margin-right:6px;padding:0 6px;border-radius:4px;background:rgba(217,119,87,.16);color:var(--acc);font-weight:600}
.hot.big{background:var(--acc);color:#1f1e1d}
.newbar{display:block;width:100%;margin:2px 0 6px;padding:9px;border:0;border-radius:10px;background:rgba(239,68,68,.14);color:#fca5a5;font:inherit;font-size:13px;text-align:left}
.more{display:block;width:100%;margin:4px 0 0;padding:10px;border:1px dashed var(--line);border-radius:12px;background:transparent;color:var(--sub);font:inherit;font-size:13px}
footer{margin:36px 4px 0;padding-top:14px;border-top:1px solid var(--line);color:var(--sub);font-size:12px;line-height:1.7}
footer b{color:var(--text);font-weight:600}
/* 요약 창 */
#dim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:5}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:6;max-width:760px;margin:auto;max-height:82vh;overflow-y:auto;
  background:var(--card);border-radius:16px 16px 0 0;padding:10px 18px calc(18px + env(safe-area-inset-bottom));box-shadow:0 -8px 30px rgba(0,0,0,.4)}
.grab{width:38px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 12px}
.s-title{font-size:17px;font-weight:600;margin:4px 0 2px;line-height:1.45}
.s-label{margin:16px 0 4px;color:var(--acc);font-size:12px;font-weight:700;letter-spacing:.5px}
.s-sum{font-size:15px;line-height:1.75}.s-sum.empty{color:var(--sub);font-size:13.5px}
.s-btns{display:flex;gap:8px;margin-top:20px}
.s-btns a{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;padding:11px 6px;border-radius:10px;font:inherit;font-size:13.5px;line-height:1.3;text-decoration:none;
  background:var(--acc);color:#1f1e1d;font-weight:600}
.s-btns a.cl{background:transparent;border:1px solid var(--acc);color:var(--acc)}
.s-close button{width:100%;margin-top:8px;padding:11px;border-radius:10px;background:transparent;border:1px solid var(--line);color:var(--sub);font:inherit;font-size:14px}
.s-cnote{margin-top:8px;color:var(--sub);font-size:11.5px;text-align:center}
#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);z-index:9;max-width:90%;padding:10px 16px;border-radius:10px;background:#faf9f5;color:#1f1e1d;font-size:13.5px;box-shadow:0 6px 20px rgba(0,0,0,.4)}
.seg{display:flex;gap:4px;margin:6px 4px 10px}.seg button{flex:1;min-width:0;border:1px solid var(--line);background:transparent;color:var(--sub);border-radius:8px;padding:7px 0;font:inherit;font-size:12.5px;white-space:nowrap}
.seg.ly{margin-top:-4px}.seg.ly button{padding:5px 0;font-size:12px}.seg.ly button.on{background:var(--card2);border-color:var(--acc);color:var(--text);font-weight:600}
.seg.sm{margin-bottom:8px}.seg.sm button{padding:9px 0;font-size:13px}.seg.sm button.on{background:var(--card2);border-color:var(--acc);color:var(--text)}
.warn{margin:0 4px 10px;padding:8px 10px;border-radius:8px;background:rgba(250,204,21,.08);color:var(--sub);font-size:12.5px;line-height:1.5}.warn b{color:var(--text)}
.seg button.on{background:var(--acc);border-color:var(--acc);color:#1f1e1d;font-weight:600}
.tot{margin:2px 4px 10px;color:var(--sub);font-size:13px}.tot b{color:var(--text)}.chgnote{font-size:11px}
.srow{background:var(--card);border-radius:12px;margin:6px 0;padding:10px 12px;cursor:pointer}.srow.open{background:var(--card2)}
.sline{display:flex;align-items:center;gap:8px}
.rk{width:18px;color:var(--sub);font-size:12px;text-align:right;flex:none}
.mv .gap{display:inline-block;width:3px}.mv{width:30px;flex:none;font-size:11px;font-weight:600;text-align:left;font-variant-numeric:tabular-nums;margin-right:-4px}.mv.up{color:#f87171}.mv.dn{color:#60a5fa}.mv.same{color:#a8a29e;font-size:15px;font-weight:700;line-height:1;padding-left:3px}
.sn{width:86px;flex:none;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb{flex:1;height:10px;background:rgba(255,255,255,.05);border-radius:5px;overflow:hidden;min-width:30px}.sb i{display:block;height:100%;background:var(--acc);border-radius:0 4px 4px 0}
.sc{width:54px;flex:none;text-align:right;font-size:14px;font-variant-numeric:tabular-nums}
.chg{width:48px;flex:none;text-align:right;font-size:11.5px;color:var(--sub)}.chg.up{color:#f87171}.chg.dn{color:#60a5fa}
.spark{flex:none}
.det{margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.dt{color:var(--sub);font-size:12px;margin:6px 0 4px}
.bars{width:100%;height:auto;display:block}.bars .ax{fill:var(--sub);font-size:10px}.bars .bar:hover rect+rect{opacity:.8}
.crow{display:flex;align-items:center;gap:8px;margin:3px 0;font-size:12.5px}.cl{width:86px;flex:none}.cb{flex:1;height:8px;background:rgba(255,255,255,.05);border-radius:4px;overflow:hidden}
.cb i{display:block;height:100%;background:var(--acc);opacity:.8;border-radius:0 3px 3px 0}.cn{width:50px;text-align:right;flex:none;font-variant-numeric:tabular-nums}
@media(max-width:400px){.spark{display:none}.sn{width:74px}}
</style></head><body>

7 22:07","c":2,"r":"cn","u":"https://www.cls.cn/detail/2537057","p":1794920847,"a":1794921242,"t":"财联社11月17日电，美股盘前交易的光通信股Coherent上涨10%，Lumentum和迈威尔科技上涨5.2%。"},{"s":"미국 대형 기술주는 시장 개장 전에 혼조세를 보였으며 엔비디아는 1% 이상 상승했습니다. - 36 Krypton","so":"36kr.com","tm":"11/17 22:00","c":2,"r":"cn","u":"https://news.google.com/rss/articles/CBMiWEFVX3lxTE81RmtHdVNnZ0xNRmhlMGVjNklDcXFGU1ZpMlN2VDl5Sk9FQ1JCZVp1MnNvNDRQR0tPODBRN1VBR0xmN3NQQjZ4V2NiRm5SYzdlWU54c1NHQTU?oc=5","p":1794920409,"a":1794921244,"t":"美股大型科技股盘前涨跌不一，英伟达涨超1%-36氪"},{"s":"인플레이션에 대한 지속적인 우려와 함께 반도체주 매도세로 인해 미국 3대 주가지수는 지난 금요일 엇갈린 이익과 손실을 보였습니다丨미국 주식 마감 검토","so":"21财经","tm":"11/17 15:07","c":2,"r":"cn","u":"https://m.21jingji.com/article/20261116/herald/0c3e48c57390de8a2e27768fbdbc38fa_zaker.html","p":1794895639,"a":1794898740,"t":"芯片股抛售叠加通胀担忧持续，美股三大指数上周五涨跌不一丨美股复盘","su":"동부 표준시인 11월 13일, 투자자들이 여전히 인플레이션(물건값이 계속 오르는 것)과 엔비디아의 불확실성에 대해 우려하고 있는 가운데 뉴욕 주식 시장의 3대 주가 지수는 상승세를 보였다가 하락세를 보였습니다. 초반 거래에서 큰 폭으로 하락한 뒤 점차 하락폭이 좁아졌습니다. 장 마감에는 3대 주가지수가 엇갈렸다. 반도체주가 다시 매도되면서 나스닥 지수가 하락했고 다우지수는 소폭 상승 마감했습니다. 다우존스 산업평균지수는 전 거래일보다 50.46포인트 상승해 0.10% 오른 52347.55포인트로 마감했다. S&P500(미국 큰 회사 500곳 지수) 지수는 30.73포인트 하락해 0.40% 감소한 7561.67포인트로 마감했습니다. 나스닥종합지수는 229.82포인트 하락해 0.91% 하락한 25136.27포인트로 마감했다. 업종별로는 S&P500 지수의 11개 주요 업종 중 6개가 상승하고 5개가 하락했습니다. 필수소비재 부문과 에너지 부문이 각각 1.39%, 0.96% 증가하며 상승세를 주도했습니다. 기술 업종과 임의 소비재 업종이 각각 1.70%, 0.45% 손실을 기록하며 하락세를 주도했습니다."},{"s":"워시(Wash) 연준 의장: 연준은 AI가 경제에 미치는 영향에 대한 세 가지 시나리오를 연구하고 있습니다.","so":"經濟日報","tm":"11/17 13:40","c":2,"r":"tw","u":"https://money.udn.com/money/story/5599/9883749","p":1794890428,"a":1794916909,"t":"Fed 主席華許：Fed 正在研究 AI 對經濟影響的3種情境","su":"워셔 미국 연방준비제도(연준(미국의 중앙은행)) 의장이 16일 단기 금리(돈을 빌릴 때 내는 이자 비율)나 경제 전망에 대해서는 의견을 제시하지 않겠다고 밝혔다. 그는 또한 연준 직원들이 인공지능(AI)이 경제를 어떻게 변화시킬 수 있는지 시뮬레이션하기 시작했다고 강조했습니다. 시나리오에는 노동력을 대체하는 방법이나 AI 주가가 후퇴하여 시장을 끌어내릴 수 있는 방법이 포함됩니다."},{"s":"미국 주식 | AI 킬링 확산, 4개 그룹 총격, 자금이 방어주로 이체, 젠슨 황이 없는 엔비디아의 실적 보고서에 대해 어떻게 생각하시나요?","so":"旺得富理財網","tm":"11/17 12:30","c":2,"r":"tw","u":"https://wantrich.chinatimes.com/news/20261117900150-420201","p":1794886230,"a":1794898742,"t":"美股｜AI殺盤擴散 4族群中槍 資金轉進防禦股 沒有黃仁勳的輝達財報怎麼看？","su":"미국 증시는 16일부터 다시 기술주 매도에 돌입해 주요 4개 지수가 모두 적자로 마감했다. 이 가운데 필라델피아반도체(전자기기의 두뇌 부품)지수는 535.67포인트(5.28%) 급락해 가장 큰 타격을 입었다. 엔비디아는 4.12% 하락했고, TSMC ADR(미국 주식시장에서 사고파는 외국 회사 주식)은 6.34%, UMC ADR과 ASE Investment Holdings ADR은 각각 6.88%, 7.74% 급락했습니다. 기술주에 대한 이러한 매도 압력의 물결은 엔비디아에서 메모리, 칩 설계, 반도체 장비 및 AI로 확산되었습니다."},{"s":"\"미국 주식\" 분석: 시장은 여전히 공황 상태에서 매도하지 않고 있으며 개인 투자자들은 헐값에 거래하고 있습니다.","so":"旺得富理財網","tm":"11/17 11:39","c":2,"r":"tw","u":"https://news.google.com/rss/articles/CBMiakFVX3lxTE9ubmRxekRzQzVXXy1lN0lfdTBTRl9yN09IYTNvaE1BaFhQVnA2YU5vLXV4UVRLQWlHQnd4VlFIZjFZeWlfQVJHajJ3TVNqOVZBT0hEU2p4ZG04VlNabWRfT1dWSkJLNEpQa0E?oc=5","p":1794883198,"a":1794885689,"t":"《美股》分析：市場仍未恐慌拋售散戶抄底輝達- 國際"},{"s":"엔비디아 주식을 팔고 손실을 입으면 내년 5월 세금 신고서를 사용하여 다른 미국 주식의 이익을 상쇄할 수 있나요?","so":"經濟日報","tm":"11/17 10:52","c":2,"r":"tw","u":"https://money.udn.com/money/story/6710/9883192","p":1794880364,"a":1794885679,"t":"賣出輝達股票認賠 明年5月報稅能抵其他美股獲利嗎？","su":"중개 재위탁을 통해 미국 주식을 매매할 때 매도 시 발생하는 차익은 해외 부동산 거래에 귀속된다. 가오슝 국세국은 해외 주식 거래로 인한 손익은 '같은 연도 내'에만 상쇄될 수 있음을 상기시킨다. 상계 후에도 여전히 이익이 있는 경우, 기본세 계산 규정에 따라 순액을 기본 개인 소득에 포함시켜야 합니다. 상계 후에도 여전히 손실이 있는 경우 남은 손실은 다음 연도에 공제할 수 없습니다."},{"s":"00662 미국 주식 기술 성장열차 타고 11월 17일 거래 재개","so":"經濟日報","tm":"11/17 10:03","c":2,"r":"tw","u":"https://money.udn.com/money/story/5618/9883102","p":1794877427,"a":1794885684,"t":"00662 11月17日恢復交易 搶搭美股科技成長列車","su":"규모가 1,000억 위안을 넘는 중국 최초의 해외 주식 ETF(여러 주식을 묶어 파는 상품)인 Fubon NASDAQ ETF(00662)가 11월 17일 거래를 재개했습니다. Fubon Investment Trust는 00662 분할 후 수익 단위당 기준 가격이 23.56위안이며, 12월 2일 분할 결과 통지가 발송될 것이라고 발표했습니다. 00662가 분할 작업을 완료한 후 각 ETF의 투자 한도가 대폭 감소되었습니다. 투자자는 미국 대형 기술 기업의 장기적인 성장 기회에 참여할 수 있는 기회를 얻기 위해 30,000위안 미만이면 됩니다."},{"s":"워시 연준 의장은 다음과 같은 연설을 했습니다: AI는 경제에 중요하지만 이러한 주요 위험은 경계해야 합니다.","so":"第一财经","tm":"11/17 09:24","c":2,"r":"cn","u":"https://news.google.com/rss/articles/CBMiU0FVX3lxTE1iUlVPUUFZNTdDQnA5NUZhaGRIVENaZ21XbEo0c1poM01IX3ptZmR5TlFUZWQtNkJVUDRjX3pqWTVjTldOZmp4N0ZTcEVZMVpnUjhZ?oc=5","p":1794875082,"a":1794885664,"t":"美联储主席沃什重磅讲话：AI对经济很重要，但需要防范这些重大风险"},{"s":"연준은 AI가 경제에 미치는 영향에 대한 세 가지 시나리오를 평가합니다. AI가 시장 기대를 충족시키지 못하면 경기 둔화와 실업률 증가로 이어질 수 있습니다.","so":"ThePaper.cn","tm":"11/17 09:19","c":2,"r":"cn","u":"https://www.thepaper.cn/newsDetail_forward_34491127","p":1794874758,"a":1794885667,"t":"美联储评估AI对经济三种影响情景：若未能达市场预期或导致经济放缓和失业率上升","su":"현지 시간으로 11월 16일, 케빈 워시 연준 의장은 인공지능(AI)이 미국 경제 성장 방식을 바꿀 수 있다고 말했다. 연방준비제도(미국의 중앙은행) 이사회 직원들은 평가를 위해 모델 프레임워크를 사용하기 시작했습니다."},{"s":"2026년 11월 17일 미국 주요 주식 뉴스 요약","so":"鉅亨網","tm":"11/17 09:00","c":2,"r":"tw","u":"https://news.google.com/rss/articles/CBMiT0FVX3lxTE4yOTZjam9fTXlHQmVKQ2E2YU84YnhRZzRzWWVvbmZFNk5QMlZ0dEVReW1IN184a3RVZkliZ1Z5MzVsdUMtelVyczJua2YwNnM?oc=5","p":1794873603,"a":1794874005,"t":"美股重點新聞摘要2026年11月17日"},{"s":"[모닝포스트] 심야 대폭락, 미국 반도체주 전반적으로 급락; 국제 원유가 크게 하락했습니다. Shengtun Mining, Shenghong Technology, Megmeet이 주식을 환매할 계획입니다.","so":"财联社","tm":"11/17 08:16","c":2,"r":"cn","u":"https://www.cls.cn/detail/2536060","p":1794870960,"a":1794874003,"t":"【早报】深夜重挫，美股芯片股全线大跌；国际原油，显著下跌；盛屯矿业、胜宏科技、麦格米特拟回购股份","su":"① 외교부, 중국과 러시아 정상 간 회담 획기적 논의 ② 재무부: 2026년 11월 국채 시장조성 지원 업무를 실시하기로 결정 ③ 미국 증시는 하락세를 보이며 필라델피아 반도체(전자기기의 두뇌 부품) 지수는 5% 이상 하락했다. ④ 134개 과학기술혁신위원회 ETF(여러 주식을 묶어 파는 상품) 총 규모가 지난 주 처음으로 4,000억 위안을 돌파했다. ⑤ Shengtun Mining, Shenghong Technology, and Megmeet은 주식을 환매할 계획입니다. 매크로뉴스 1. 시진핑(習近平) 중공중앙 총서기, 국가주석, 중앙군사위원회 주석은 16일 광둥성 중산시에서 시찰하면서 중공중앙 20기 5차 전원회의 정신을 철저히 연구 관철하고, 전체회의 결정과 배치를 문자 그대로 관철하며, 전면적이고 엄격한 당에서 새로운 성과를 끊임없이 추동해야 한다고 강조했다. 거버넌스, 주강 하구 동부와 서부의 통합 개발을 더 잘 촉진하고 광동-홍콩-마카오 대만 지역의 고품질 개발의 새로운 상황을 조성하기 위해 노력합니다."},{"s":"기술주가 다시 급락해 미국 3대 주가지수 모두 하락했으며, 나스닥이 가장 많이 하락했습니다.","so":"TVB","tm":"11/17 07:17","c":2,"r":"hk","u":"https://news.tvb.com/sc/1206750-%E7%A7%91%E6%8A%80%E8%82%A1%E5%86%8D%E5%BA%A6%E6%80%A5%E6%8C%AB%E6%8B%96%E7%B4%AF%E7%BE%8E%E8%82%A1%E4%B8%89%E9%A0%85%E4%B8%BB%E8%A6%81%E6%8C%87%E6%95%B8%E5%85%A8%E7%B7%9A%E4%B8%8B%E8%B 4%BE%E6%A6%9C%E8%82%A1%E5%83%B9%E5%8D%87","p":1794951872,"a":1794955430,"t":"美股日誌｜道指兩日瀉千六點 藍籌股捱沽 Nvidia盤後放榜股價升","su":"오늘 미국 증시는 3대 주요 지수가 모두 2거래일 연속 하락하는 등 다시 하락세를 보였습니다. 다우존스 산업평균지수는 848포인트(1.64%) 급락해 51,000포인트 아래로 떨어졌습니다. S&P500(미국 큰 회사 500곳 지수) 지수는 1.03% 하락했고, 나스닥 종합 지수는 0.74% 하락했습니다. 어제의 손실과 함께 다우존스 산업평균지수는 단 이틀 만에 1,588포인트 하락했습니다. 오늘 다우지수는 나스닥보다 훨씬 더 많이 하락했는데, 이는 최근 기술주가 주도한 하락세와는 다릅니다. 시장의 우려는 AI 평가와 기술 기업의 막대한 자본 지출(공장·장비 등에 쓰는 큰돈)에서 미국 경제 전망과 전통적인 기업 이익으로 점차 확산되었습니다. 고금리 기조가 지속되면서 기업의 자금조달 비용은 여전히 높은 수준이다. 소비자들도 투자에 신중해졌습니다."},{"s":"AI 의심으로 미국 주식 하락","so":"WSJ","tm":"11/18 06:21","c":1,"r":"us","u":"https://www.wsj.com/finance/stocks/u-s-stocks-fall-as-ai-doubts-fester-a0979bdb","p":1794950460,"a":1794955408,"t":"U.S. Stocks Fall as AI Doubts Fester"},{"s":"기술 불안 속에서 Salesforce의 주식이 S&P500의 하락세를 주도한 이유","so":"MarketWatch","tm":"11/18 06:12","c":1,"r":"us","u":"https://www.marketwatch.com/story/why-salesforces-stock-is-leading-s-p-500-decliners-amid-tech-jitters-17510caf","p":1794949920,"a":1794955408,"t":"Why Salesforce’s stock led the S&P 500’s decliners amid tech jitters"},{"s":"기술주에 대한 매도 압력은 여전히 큼, 대부분의 미국 증시는 하락","so":"經濟日報","tm":"11/18 06:09","c":1,"r":"hk","u":"https://money.udn.com/money/story/123398/9878074","p":1794949766,"a":1794955433,"t":"科技股賣壓仍重 美股多數跌","su":"뉴욕 센트럴뉴스에이전시(Central News Agency)가 13일 종합 외신 보도했다. 기술주는 여전히 매도압력이 크며, 주요 인공지능(AI) 컨셉주 되돌림으로 시장이 하락세를 보이고 있다. 오늘 미국 증시는 대부분 하락세로 마감했습니다. 다우존스산업평균지수는 50.46포인트(0.10%) 상승한 52,347.55포인트로 마감했다. S&P500(미국 큰 회사 500곳 지수) 지수는 30.73포인트, 0.40% 하락한 7561.67로 마감했습니다. 기술주 비중이 높은 나스닥 지수는 229.82포인트(0.91%) 하락한 25136.27포인트로 마감했다. 필라델피아 반도체(전자기기의 두뇌 부품) 지수는 360.350포인트(3.43%) 하락한 10146.324포인트로 마감했다. ※ '재게시' 또는 '공유'를 통해 기사 링크를 다시 게시할 수 있습니다. 허가 없이 기사 내용을 복사하거나 다시 게시하지 마십시오."},{"s":"미국 주식의 차별화 해체와 '중간 조정'","so":"信報網站","tm":"11/18 06:00","c":1,"r":"hk","u":"https://www.hkej.com/wm/article/id/4567539/%E6%8B%86%E8%A7%A3%E7%BE%8E%E8%82%A1%E5%88%86%E5%8C%96%E8%88%87%E3%80%8C%E4%B8%AD%E5%91%A8%E6%9C%9F%E8%AA%BF%E6%95%B4%E3%80%8D+","p":1794949200,"a":1794955435,"t":"拆解美股分化與「中周期調整」","su":"10월에 발표된 경제 데이터는 인플레이션(물건값이 계속 오르는 것) 압력에 대한 시장의 우려를 다시 한번 촉발시켰습니다. 미국 채권수익률 상승, 미국 상장 인공지능(AI) 관련 소프트웨어 기업의 신용위험 사건 등으로 인해 투자자들은 AI 투자가 과대평가된 것은 아닌지 의문을 제기하기 시작했다. 이로 인해 미국 증시과 기술 부문의 조정이 이루어졌고 시장의 위험 회피가 증가했습니다. 이 소프트웨어 회사의 레버리지(빌린 돈까지 써서 크게 투자하는 것)가 높은 파이낸싱 모델은 채권 가격의 급격한 하락과 신용디폴트스왑(CDS) 스프레드의 급격한 상승을 촉발했습니다. 하지만 글로벌 AI 투자 비중이 제한돼 있어 전반적인 AI 수요가 역전됐는지 판단하기는 여전히 어렵다. 대신 방이 많아요"},{"s":"미국 증시 동향 | 분석: Arm CEO가 젠슨 황의 뒤를 잇는다면 Arm의 데이터 센터 계획이 위태로워질 것입니다.","so":"etnet 經濟通","tm":"11/18 05:57","c":1,"r":"hk","u":"https://www.etnet.com.hk/www/tc/us-stocks/news-article/417149/%E5%88%86%E6%9E%90%E6%8C%87%E8%8B%A5Arm%E8%A1%8C%E6%94%BF%E7%B8%BD%E8%A3%81%E6%8E%A5%E6%9B%BF%E9%BB%83%E4%BB%81%E5%8B%B3%EF%BC%8C%E5%B0%87%E5%8D%B1%E5%8F%8AArm%E6%95%B8%E6%93%9A%E4%B8%AD%E5%BF%83%E5%A4%A7%E8%A8%88?topic=%E7%BE%8E%E8%82%A1%E7%84%A6%E9%BB%9E","p":1794949020,"a":1794955437,"t":"美股動向｜分析指若Arm行政總裁接替黃仁勳，將危及Arm數據中心大計"},{"s":"월스트리트가 엔비디아를 기다리면서 국채 금리 하락","so":"WSJ","tm":"11/18 05:54","c":1,"r":"us","u":"https://www.wsj.com/finance/jgbs-rise-tracking-gains-in-u-s-treasurys-79322f27","p":1794948840,"a":1794955409,"t":"Treasury Yields Fall as Wall Street Waits for Nvidia"},{"s":"미국 증시 동향 | Druckenmiller는 AI 소프트웨어 및 광고 주식으로 전환하고 AMD를 삭제하는 등의 작업을 수행했습니다.","so":"etnet 經濟通","tm":"11/18 05:30","c":1,"r":"hk","u":"https://www.etnet.com.hk/www/tc/us-stocks/news-article/417142/%E7%BE%8E%E8%82%A1%E5%8B%95%E5%90%91%7C%E5%BE%B7%E9%AD%AF%E8%82%AF%E7%B1%B3%E5%8B%92%E8%BD%89%E6%8A%95AI%E8%BB%9F%E4%BB%B6%E5%8F%8A%E5%BB%A3%E5%91%8A%E8%82%A1%EF%BC%8C%E6%B8%85%E5%80%89AMD%E7%AD%89","p":1794947400,"a":1794956984,"t":"美股動向｜德魯肯米勒轉投AI軟件及廣告股，清倉AMD等"},{"s":"2025년 초 이후 S&P500을 앞지른 '매그니피센트 7' 주식은 단 두 개뿐이었습니다.","so":"MarketWatch","tm":"11/18 05:16","c":1,"r":"us","u":"https://www.marketwatch.com/story/only-two-magnificent-seven-stocks-have-managed-to-beat-the-s-p-500-since-the-start-of-2025-a3daa0f8","p":1794946560,"a":1794955409,"t":"Only two ‘Magnificen 보여주는 지난 금요일 공식 미국 CPI(가게에서 사는 물건값 수준) 데이터의 영향을 받은 최근 업계 조사에 따르면, 이번 달 금리를 동결하지 않겠다는 이전의 상대적 주류 연준의 약한 합의는 \"붕괴를 선언\"했습니다. ② 현재 조사에 참여한 대부분의 경제학자들은 연준이 수요일에 금리 인상을 발표하고 내년 3월 말 이전에 적어도 한 번 금리를 인상할 것이라고 믿고 있습니다. 차이롄서, 9월 15일(편집자 Xiaoxiang) 인플레이션이 여전히 완고하다는 것을 보여주는 지난 금요일 공식 미국 CPI 데이터의 영향을 받은 최근 업계 조사에 따르면, 이전에는 상대적으로 주류였던 연준이 이번 달 금리를 동결하지 않겠다는 강력한 합의가 \"붕괴를 선언\"했습니다. 조사에 참여한 대부분의 경제학자들은 현재 연준이 수요일에 금리 인상을 발표하고 내년 3월 말 이전에 적어도 한 번 더 금리 인상을 발표할 것으로 믿고 있습니다."},{"s":"Scott Chronert는 반도체 신뢰 문제로 인해 S&P500이 하락했다고 밝혔습니다.","so":"Fox Business","tm":"11/18 04:47","c":1,"r":"us","u":"https://www.foxbusiness.com/video/6408511712112","p":1794944851,"a":1794956968,"t":"S&P 500 decline driven by semiconductor confidence issues, says Scott Chronert","su":"Scott Chronert는 S&P500(미국 큰 회사 500곳 지수) 하락세에 대해 논의하고 반도체(전자기기의 두뇌 부품) 신뢰도 문제가 어떻게 시장 변화를 주도하는지 설명합니다. 그는 AI 구축 및 순환을 필수 소비재와 같은 방어적 안전 피난처로 분석합니다."},{"s":"미국 증시 동향 | 머스크는 중국 방문을 확정했으며, 시장은 중국에서 테슬라 FSD의 포괄적인 홍보를 기대하고 있습니다.","so":"etnet 經濟通","tm":"11/18 04:20","c":1,"r":"hk","u":"https://www.etnet.com.hk/www/tc/us-stocks/news-article/417137/%E7%BE%8E%E8%82%A1%E5%8B%95%E5%90%91+%7C+%E9%A6%AC%E6%96%AF%E5%85%8B%E7%A2%BA%E8%AA%8D%E8%A8%AA%E8%8F%AF%EF%BC%8C%E5%B8%82%E5%A0%B4%E6%86%A7%E6%86%AC%E7%89%B9%E6%96%AF%E6%8B%89FSD%E5%9C%A8%E8%8F%AF%E5%85%A8%E9%9D%A2%E6%8E%A8%E5%BB%A3?topic=%E9%87%8D%E9%BB%9E%E6%96%B0%E8%81%9E","p":1794943200,"a":1794956988,"t":"美股動向 | 馬斯克確認訪華，市場憧憬特斯拉FSD在華全面推廣"},{"s":"연준은 아직 금리 인상을 완료하지 않았습니다! 당국자들은 내년 봄까지 금리를 여러 차례 인상해야 할 수도 있다고 경고했습니다.","so":"鉅亨網","tm":"11/18 04:01","c":1,"r":"tw","u":"https://news.cnyes.com/news/id/6665516","p":1794942101,"a":1794955425,"t":"Fed升息還沒完！官員示警：明年春季前恐需升息數次","su":"무살렘은 물가 안정을 회복하기 위해서는 미국 경제가 2027년 봄 이전에 금리를 여러 차례 인상해야 할 수도 있고, 내년 봄 이전에 실질 정책 금리도 약 1%포인트 인상해야 할 수도 있다고 말했다.\n하맥은 인플레이션(물건값이 계속 오르는 것)에 맞서기 위해 작고 꾸준한 금리 인상을 주장했으며, 올해 미국 국채 금리(나라가 돈 빌릴 때 내는 이자 비율) 상승은 추가 금리 인상에 대한 시장 기대를 반영한 것이라고 말했습니다.\nWaller는 결제 시스템에 대해 이야기하고 토큰화, 블록체인 및 AI의 책임 있는 혁신을 지지했지만 새로운 이자율에 대해서는 언급하지 않았습니다."},{ 1794927662,"t":"美股動向｜家得寶任命Richard McPhail為新任行政總裁"},{"s":"미국 증시 동향 │ 트럼프는 도이치 뱅크의 세금 정보 유출에 대응 : 그런 일이 있어서는 안되며 불법입니다.","so":"etnet 經濟通","tm":"11/17 23:43","c":1,"r":"hk","u":"https://www.etnet.com.hk/www/tc/news/news-article.php?section=categorized&category=us&newsid=417087","p":1794926611,"a":1794927664,"t":"美股動向｜特朗普回應德意志銀行洩露其稅務資料：不應發生且屬非法","su":"2026/11/17 22:41 미국 증시 동향 | 트럼프는 도이체방크의 세금 정보 유출에 대해 이렇게 답했다. 그런 일은 일어나서는 안 되었으며 불법이다. 트럼프 미국 대통령이 아시아 순방을 시작해 화요일(17일) 첫 번째 목적지인 필리핀 마닐라에 도착했다. 그는 도이체방크(US.DB)의 세금 정보 유출에 대해 “세금을 많이 냈다”고 강조했다. 그는 또한 도이체방크(Deutsche Bank)가 일어나서는 안되는 일이며 불법이라고 비난했습니다. 파이낸셜타임스에 따르면 도이체방크는 2017년 트럼프 첫 대선 기간 중 실수로 트럼프 세금 정보를 유출했다. '17일 경제뉴스서비스' 1980억5200만 1856억9000만(93759%) 36억9400만(1.865%) 86억6700만(4.376%) 실시간 업데이트 : 1816억5600만 397.54억 (21.884%) 최신 인기 etnet TV 파이낸셜 뉴스 댓글 주제 Perspective Life DIVA Healthy and Good Life Good Places in Hong Kong"},{"s":"<미국 주식모닝트레이딩> AI주도 반등할 수 있을까? 시장이 엔비디아의 실적 발표를 숨죽여 기다리면서 주요 지수는 혼재되었습니다.","so":"鉅亨網","tm":"11/17 23:41","c":1,"r":"tw","u":"https://news.cnyes.com/news/id/6665322","p":1794926502,"a":1794927653,"t":"〈美股早盤〉AI股能否翻身？主要指數漲跌互現 市場屏息等輝達財報","su":"엔비디아는 시장 마감 후 3분기 실적 보고서를 발표했습니다. 시장은 수익, 재무 예측 및 중국 노출에 중점을 두었습니다. 주가변동폭은 8.5%에 달할 수도 있다.\n10월 미국 소매판매가 예상보다 좋아 연준(미국의 중앙은행)이 다음 달 금리(돈을 빌릴 때 내는 이자 비율)를 인상할 것이라는 기대감이 높아졌습니다. 미국 채권은 이익을 포기했고 달러와 금에는 거의 변화가 없었습니다.\n뱅크오브아메리카 조사에 따르면 기술주에 대한 펀드매니저의 순 비중이 12%로 떨어졌고 AI의 인기가 식어 아시아와 대만 주식이 압박을 받고 있는 것으로 나타났습니다."},{"s":"[징둥닷컴 9618] JD 미국 증시는 초기 거래에서 5% 하락했습니다. CFO Shan Su: 징둥닷컴 소매 매출총이익률은 3분기에 20.1%라는 새로운 최고치를 기록했습니다.","so":"香港經濟日報HKET","tm":"11/17 23:37","c":1,"r":"hk","u":"https://inews.hket.com/article/4226665/%E3%80%90%E4%BA%AC%E6%9D%B19618%E3%80%91JD%E7%BE%8E%E8%82%A1%E6%97%A9%E6%AE%B5%E8%B7%8C5-%E3%80%80CFO%E5%96%AE%E7%94%A6%EF%BC%9A%E4%BA%AC%E6%9D%B1%E9%9B%B6%E5%94%AE%E7%AC%AC%E4%B8%89%E5%AD%A3%E6%AF%9B%E5%88%A9%E7%8E%8720.1-%E5%89%B5%E6%96%B0%E9%AB%98","p":1794926267,"a":1794927665,"t":"【京東9618】JD美股早段跌5% CFO單甦：京東零售第三季毛利率20.1%創新高"},{"s":"미국 증시 동향 | 엔비디아 위기로 미국 연금에 대한 숨겨진 우려가 드러나고, 인덱스 펀드의 간접 포지션 보유 위험이 드러난다","so":"etnet 經濟通","tm":"11/17 23:28","c":1,"r":"hk","u":"https://www.etnet.com.hk/www/tc/us-stocks/news-article/417083/%E7%BE%8E%E8%82%A1%E5%8B%95%E5%90%91%7C%E8%8B%B1%E5%81%89%E9%81%94%E5%8D%B1%E6%A9%9F%E6%8F%AD%E7%BE%8E%E5%9C%8B%E9%80%80%E4%BC%91%E9%87%91%E9%9A%B1%E6%86%82%EF%BC%8C%E6%8C%87%E6%95%B8%E5%9F%BA%E9%87%91%E9%96%93%E6%8E%A5%E6%8C%81%E5%80%89%E9%A2%A8%E9%9A%AA%E6%B5%AE%E7%8F%BE","p":1794925680,"a":1794927667,"t":"美股動向｜英偉達危機揭美國退休金隱憂，指數基金間接持倉風險浮現"},{"s":"미국 증시 동향 | 시스코 CEO는 승계 계획의 중요성에 대해 다음과 같이 말합니다. 무슨 일이 일어날지 결코 알 수 없습니다.","so":"etnet 經濟通","tm":"11/17 23:18","c":1,"r":"hk","u":"https://www.etnet.com.hk/www/tc/us-stocks/news-article/417081/%E7%BE%8E%E8%82%A1%E5%8B%95%E5%90%91%7C%E6%80%9D%E7%A7%91CEO%E8%AB%87%E7%B9%BC%E4%BB%BB%E8%A6%8F%E5%8A%83%E9%87%8D%E8%A6%81%E6%80%A7%3A%E4%BD%A0%E6%B0%B8%E9%81%A0%E4%B8%8D%E7%9F%A5%E9%81%93%E6%9C%83%E7%99%BC%E7%94%9F%E4%BB%80%E9%BA%BC%E4%BA%8B","p":1794925080,"a":1794927668,"t":"美股動向｜思科CEO談繼任規劃重要性：你永遠不知道會發生什麼事"},{"s":"4회 연속 금리인상? 이 연준 관계자는 지금까지 가장 매파적인 신호를 발령했습니다.","so":"财联社","tm":"11/17 23:16","c":1,"r":"cn","u":"https://www.cls.cn/detail/2537218","p":1794924960,"a":1794955417,"t":"连续加息四次？这一美联储官员释放了迄今最鹰派信号","su":"① Mussallem은 내년 봄까지 실제 정책 금리가 2%~2.5% 범위에 도달해야 한다고 믿고 있습니다. 실제 정책금리는 연준의 목표금리에서 물가상승률을 뺀 수준이다. ② 이번 판결은 연준이 올해 12월과 내년 1월, 3월, 4월 등 4차례 통화정책 회의에서 금리를 지속적으로 인상해야 할 수도 있다는 뜻이다. 차이롄서, 11월 18일자(자오 하오 편집자) 세인트루이스 연준 총재인 알베르토 무살렘은 화요일에 연준이 앞으로 몇 달 안에 금리를 4배나 인상해야 할 수도 있다고 말했습니다. 이는 인플레이션(물건값이 계속 오르는 것)을 억제하기 위해 연준 관리들이 제시한 가장 매파적(금리를 올리자는 쪽)인 정책 견해 중 하나입니다."},{"s":"AI 주식의 매도가 과도합니까? 아니면 월스트리트가 예정보다 빨리 수익 예측을 수정한 걸까요? 골드만삭스는 시장에 대한 두 가지 주요 우려 사항을 밝혔습니다.","so":"鉅亨網","tm":"11/17 23:10","c":1,"r":"tw","u":"https://news.cnyes.com/news/id/6664567","p":1794924603,"a":1794927654,"t":"AI股票遭拋售是否過頭？還是華爾街已提前下修獲利預期？高盛揭市場兩大隱憂","su":"골드만삭스는 AI 투자 붐이 급격하게 식고, 지난달 고객 심리가 비관적으로 변했고, 기술주 순매도, 일부 펀드가 공매도로 전환했다고 지적했다.\nCTA는 나스닥 100 지수에서 약 39억 달러의 매도 포지션을 보유한 것으로 추정됩니다. 반도체는 6월 이후 S&P500(미국 큰 회사 500곳 지수)에 비해 30% 이상 하락했으며, 가치 평가에는 이익 감소가 반영되었습니다.\n이번 주의 초점은 엔비디아의 실적 보고서와 앤트로픽의 상장입니다. 시장에서는 AI 지출에 대한 자금 조달 압박과 데이터센터(컴퓨터 수만 대를 모아 둔 건물) 구축 가능 여부도 우려하고 있다."},{"s":"다우 선물은 하락도 나스닥 100은 상승 엔비디아의 결산 대기","so":"株探","tm":"11/17 22:58","c":1,"r":"jp","u":"https://kabutan.jp/news/marketnews/?b=n202611171399","p":1794923880,"a":1794955440,"t":"ダウ先物は下落もナスダック１００は上昇 エヌビディアの決算待ち＝米国株","su":"오늘의 미국 주가지수 선물(미래 값을 미리 정해 사고파는 거래) 시장, 다우 선물은 하락하고 있지만, 나스닥(미국 기술 회사들이 많은 주식시장) 100은 상승. 투자자는 최신 기업 결산을 소화하는 한편, 당기 후 예정되는 엔비디아 <NVDA>의 결산을 기다리고 있다. 이번 결산은 몇 개월에 걸쳐 주식시장 상승을 견인해 온 AI 관련 투자 테마를 둘러싼 환경이 크게 변화하는 가운데 발표된다."},{"s":"뉴욕증시 개장 전 특징주...루멘텀·셀라스라이프사이언스·엔비디아↑ VS 인텔·홈디포·디즈니↓","so":"뉴스핌","tm":"11/17 22:55","c":1,"r":"kr","u":"https://www.newspim.com/news/view/20261117001380","p":1794923700,"a":1794927640,"su":"[서울=뉴스핌] 고인원 기자= 17일(현지시간) 뉴욕 증시 개장 전 거래에서 주요 기업들의 주가가 엇갈리고 있다.엔비디아는 젠슨 황 전 최고경영자(CEO)의 사임 이후 급락한 데 따른 반발 매수세(사려는 힘)가 유입되면서 상승하고 있다. 미국 정부가 중국산 데이터센터(컴퓨터 수만 대를 모아 둔 건물) 장비"},{"s":"국제 유가는 폭등했고, 금과 은은 상승했으며, 시장이 열리기 전에 미국 AI와 하드 기술주가 종합적으로 강세를 보였습니다.","so":"21财经","tm":"11/17 22:29","c":1,"r":"cn","u":"https://www.21jingji.com/article/20261117/herald/61717ab9ec802be57bf533ec28e971be.html","p":1794922140,"a":1794927644,"t":"国际油价直线拉升，黄金白银上涨，美股AI硬科技股盘前集体走强","su":"21파이낸셜레이더에 따르면 11월 17일 국제유가가 갑자기 급등했다. 20:21 현재 WTI 원유와 브렌트 원유는 각각 0.56%, 0.48% 상승했습니다. 금과 은은 상승했으며 현물 금은 온스당 약 3,864달러에 거래되었고 현물 은은 거의 1.5% 상승했습니다. 유가가 상승한 가운데 미국 주식 선물도 상승했습니다. 20:29 현재 나스닥(미국 기술 회사들이 많은 주식시장) 선물은 0.55% 상승했습니다. 미국 증시 개장 전 AI 하드기술주들은 집합적으로 강세를 보였다. 엔비디아 주가는 개장 전 2% 이상 하락했다가 1% 이상 반등했다. 엔비디아는 화요일 동부 표준시로 시장이 마감된 후 실적 보고서를 발표할 예정이며, CFO이자 임시 CEO인 콜레트 크레스가 투자자 컨퍼런스 콜을 주최할 예정입니다. 차이롄서에 따르면 거의 확실한 한 가지는 엔비디아의 주가가 높은 변동성(값이 크게 출렁이는 정도)을 유지할 것이라는 점입니다."},{"s":"40년 경력의 한 시장 베테랑은 미국 주식이 40% 붕괴하고 유가가 500달러까지 급등할 것이라는 데 베팅하며 미국 주식이 여름 한국 주식 급락을 반복할 수 있다고 경고했습니다.","so":"鉅亨網","tm":"11/17 22:10","c":1,"r":"tw","u":"https://m.cnyes.com/news/id/6664520","p":1794921003,"a":1794921252,"t":"40年市場老將押注美股崩跌40%、油價飆至500美元 警告美股恐重演韓股夏季暴跌行情","su":"린달은 미국 주식의 높은 밸류에이션과 모멘텀(값이 움직이는 기세) 약화로 인해 올여름 한국 주식이 약 40% 폭락하는 상황이 반복될 수 있다고 경고하며 개인투자자들이 직접 주식시장에서 철수할 것을 제안했다.\n그는 주식과 채권(나라나 회사에 돈 빌려준 증서) 간 자산 비율을 40대 60으로 전환하고 단기 채권, 에너지주, 금은 채굴 주식, 미국 이외의 시장 보유를 늘릴 것을 권고했습니다.\n그는 또한 WTI 유가가 2030년에는 500달러, 내년 2월에는 147달러까지 오를 것이라고 예측했는데, 이는 주로 수요와 공급의 격차가 커지기 때문이다."},{"s":"씨티 \"S&P500 선물 롱 95% 손실권…459억달러 청산 위험\"","so":"블루밍비트","tm":"11/17 22:07","c":1,"r":"kr","u":"https://bloomingbit.io/feed/news/124633","p":1794920858,"a":1794921237,"su":"미국 스탠더드앤드푸어스(S&P)500 지수 선물(미래 값을 미리 정해 사고파는 거래)의 매수 포지션 대부분이 손실 구간에 진입하면서 추가 하락 시 강제 매도가 확대될 수 있다는 경고가 나왔다. 17일 해외경제 속보채널 월터 블룸버그에 따르면 씨티는 S&P500(미국 큰 회사 500곳 지수) 선물 매수 포지션의 약 95%가 손실 상태에"},{"s":"연준이 금리를 인상하면 은행업계의 금리 스프레드도 확대될 것으로 예상된다. 어느 은행이 수혜를 입을 것으로 예상됩니까? | 금융 펄스 | 재원","so":"經濟日報","tm":"11/17 22:04","c":1,"r":"tw","u":"https://money.udn.com/money/story/5613/9884964?form=udn_ch2_common3_cate","p":1794920650,"a":1794921255,"t":"聯準會若升息銀行業利差看增 哪些銀行有望受惠？ | 金融脈動 | 金融","su":"미국 연방준비제도(연준) 관계자들은 최근 매파적(금리를 올리자는 쪽)인 발언을 내놓으며 12월부터 다시 금리(돈을 빌릴 때 내는 이자 비율) 인상을 시작할 수도 있다는 점을 시사했다. 미국 금리 인상 화두가 본격화되면서 국내 은행권에서는 미국 금리가 인상되면 외화예금 스프레드가 확대될 것으로 예상된다고 지적했다. 이 중 시틱은행, 메가뱅크 등 미국 달러·외화 대출 비중이 크고 비중이 높은 대형 은행을 우선적으로 선정할 예정이다."},{"s":"시장 부양에서 '난파공'까지: 달러 강세가 월스트리트를 불안하게 만드는 이유는 무엇입니까?","so":"鉅亨網","tm":"11/17 22:00","c":1,"r":"tw","u":"https://m.cnyes.com/news/id/6665182","p":1794920412,"a":1794921257,"t":"從市場助力到「破壞球」：美元走強為何讓華爾街感到不安？","su":"미국 달러지수는 월요일 103.7로 19개월 만에 최고치를 기록했다. 시장에서는 너무 급격한 상승이 미국 증시를 뒤흔들 수 있는 '파괴적인 힘'이 될 수 있다고 우려했다.\n미국 경제는 다른 나라보다 강하고, AI 인프라에 대한 투자가 돈을 끌어들이고 있으며, 연준이 금리(돈을 빌릴 때 내는 이자 비율)를 계속 인상해 달러 강세를 이끌 수도 있다.\n미국 달러의 가치 상승은 금융 비용을 증가시키고 위험 자산을 억제할 것입니다. 105 이상으로 상승하면 S&P500(미국 큰 회사 500곳 지수)에 영향을 미칠 수 있습니다."},{"s":"Wells Fargo는 2027년 S&P500 목표를 8,200으로 설정하고 AI 투자 붐에서 하이퍼스케일러를 선호합니다.","so":"The Globe and Mail","tm":"11/17 21:58","c":1,"r":"us","u":"https://www.theglobeandmail.com/investing/article-wells-fargo-sets-sp-500-target-at-8200-for-2027-favours-hyperscalers/","p":1794920322,"a":1794921238,"t":"Wells Fargo sets S&P 500 target at 8,200 for 2027, favours hyperscalers in AI trade","su":"S&P500(미국 큰 회사 500곳 지수) 주당순이익(주식 한 주가 번 돈)은 미화 425달러에 달할 것으로 예상되며, 2028년 둔화되기 전까지 이익 성장률은 여전히 강세를 유지할 것으로 예상됩니다."},{"s":"연준의 Mussallem : 봄이 오기 전에 \"몇 차례\" 금리 인상이 필요할 수 있습니다","so":"第一财经","tm":"11/17 21:34","c":1,"r":"cn","u":"https://www.yicai.com/news/103444116.html","p":1794918889,"a":1794927644,"t":"美联储穆萨莱姆：春季前可能需要“数次”加息","su":"제일재경 2026-11-17 20:33:40 편집자: Gao Mingyan 보고서에 따르면 연준 Musallem은 지속적인 높은 인플레이션(물건값이 계속 오르는 것) 위험이 상당하며 봄 전에 \"수차례\" 금리 인상이 필요할 수 있다고 말했습니다. 조기 조치를 취하는 것이 노동 시장이나 경제 성장에 해를 끼치지 않고 가격 압력을 완화하는 가장 좋은 방법입니다. 인플레이션이 지금의 속도로 이어진다면 12월 0.25%포인트(퍼센트끼리 뺀 차이) 금리 인상 이후 내년 1분기에 한두 차례 더 인상이 이뤄질 수 있고, 당분간 금리는 높은 수준을 유지할 것으로 보인다. 근원 인플레이션이 계속해서 월별 0.3%를 상회하고 인플레이션 기대치가 계속 높아지면 연준은 12월이나 내년 1월에 금리를 0.5%포인트 인상할 수도 있고 이에 따라 고금리도 상승할 것입니다. 반면, 유가 하락세가 지속되고, 인공지능(AI) 투자가 식고, 주식시장이 조정을 받으면 이번 금리 인상은 내년 초 마무리될 수도 있다."},{"s":"S&P500 선물은 개장 전 거래에서 안정적입니다. 코히런트, 루멘텀 Holdings 리드","so":"Barron's","tm":"11/17 21:30","c":1,"r":"us","u":"https://www.barrons.com/articles/s-p-500-futures-steady-in-premarket-trading-coherent-lumentum-holdings-lead-d1d04634","p":1794918600,"a":1794921239,"t":"S&P 500 Futures Steady in Premarket Trading; Coherent, Lumentum Holdings Lead"},{"s":"미국 주식 선물은 엔비디아 결과보다 하락했습니다. 초점을 맞추고 있는 연방준비제도(연준) 연사","so":"Reuters","tm":"11/17 21:24","c":1,"r":"us","u":"https://www.reuters.com/business/us-stock-futures-slip-ahead-nvidia-results-fed-speakers-focus-2026-11-17/","p":1794918256,"a":1794921239,"t":"US stock futures slip ahead of Nvidia results; Fed speakers in focus"},{"s":"월스트리트, 금 가격 예측 하향 조정: 3,850달러가 바닥인가?","so":"第一财经","tm":"11/17 21:16","c":1,"r":"cn","u":"https://www.yicai.com/news/103444083.html","p":1794917762,"a":1794921244,"t":"华尔街下调金价预期： 3850美元是底吗？","su":"11월 17일 금 현물은 압력을 받아 온스당 미화 3,850달러 정도 변동했습니다. 지난 16일에는 온스당 3,832달러를 기록한 적도 있는데, 이는 2025년 10월 이후 최저치다. 이번 하락세의 원동력은 단일 변수가 아니다. 달러 강세와 금리인상 기대감 고조, 채권수익률 상승 등이 '삼중억제'를 형성했다. 베이징금경제개발연구센터 연구원 리웨펑(Li Yuefeng)은 계속되는 뜨거운 인플레이션(물건값이 계속 오르는 것) 데이터, 미국 달러 강세, 높은 미국 국채 금리(나라가 돈 빌릴 때 내는 이자 비율) 등을 배경으로 금은 여전히 상당한 단기 압박에 직면해 있다고 분석했다. 후속 경제 데이터가 계속해서 \"장기간 높은 금리\"에 대한 기대를 강화한다면 금 가격은 계속해서 낮은 지원을 테스트할 수 있습니다. 반대로 연준 관계자들이 더 많은 비둘기파적인 신호를 발표하거나 인플레이션 기대가 냉각된다면 금은 하락을 재개할 기회를 갖게 될 것입니다."},{"s":"엔비디아의 재무 책임자 크레스(Kress)가 황의 축출 이후 첫 수익 보고를 주도할 예정","so":"WSJ","tm":"11/17 21:15","c":1,"r":"us","u":"https://www.wsj.com/cfo-journal/nvidias-finance-chief-kress-to-lead-first-earnings-call-following-huangs-ouster-1d801102","p":1794917700,"a":1794927642,"t":"Nvidia’s Finance Chief Kress to Lead First Earnings Call Following Huang’s Ouster"},{"s":"월스트리트의 채용 전쟁에서 \"밀렵 방지\"가 증가하고 은행은 최고의 인재를 유지하기 위해 헤지 펀드를 모색 | 국제 포커스 | 국제","so":"經濟日報","tm":"11/17 21:12","c":1,"r":"tw","u":"https://money.udn.com/money/story/5599/9884285","p":1794917534,"a":1794921259,"t":"華爾街搶人大戰興起「反挖角」 銀行借鏡避險基金留住頂尖人才 | 國際焦點 | 國際","su":"[Bloomberg] -- 최근 몇 달 동안 그의 트레이더 중 몇몇이 경쟁 은행과 헤지 펀드로 떠나는 것을 지켜본 후 씨티그룹의 글로벌 주식 트레이딩 책임자인 Fater Belbachir는 다른 팀원의 곧 떠날 상황에 직면해 있습니다."},{"s":"엔비디아는 2조 달러의 가치를 잃었습니다. 트레이더가 수익에서 기대하는 옵션은 다음과 같습니다.","so":"CNBC","tm":"11/17 20:42","c":1,"r":"us","u":"https://www.cnbc.com/2026/11/17/nvidia-has-lost-2-trillion-in-value-heres-what-options-traders-expect-from-earnings.html","p":1794915748,"a":1794921239,"t":"Nvidia has lost $2 trillion in value. Here's what options traders expect from earnings","su":"젠슨 황의 엔비디아 강제 퇴출은 월스트리트와 워싱턴에 충격을 주었고 시장 가치 2조 달러를 탕진했으며 국가 안보와 AI 단지 규제에 대한 심각한 의문을 불러일으켰습니다. 현재 트레이더들은 비교적 평범한 화요일 수익에 만족해야 하며 옵션 트레이더들은 큰 움직임을 기대하고 있습니다."},{"s":"주식시장은 거의 30년 만에 세 번째로 뭔가를 하고 있으며, S&P500이 어디로 향하는지 역사는 분명합니다.","so":"Yahoo Finance","tm":"11/17 20:35","c":1,"r":"us","u":"https://finance.yahoo.com/markets/stocks/articles/stock-market-doing-something-just-113502702.html","p":1794915302,"a":1794921240,"t":"The Stock Market Is Doing Something for Just the 3rd Time in Nearly 30 Years, and History Is Clear Where the S&P 500 Is Headed","su":"S&P500(미국 큰 회사 500곳 지수) Shiller CAPE 비율은 역사상 세 번째로 40을 넘었습니다."},{"s":"S&P500 15% 버퍼 이중 방향 지수 10월 시리즈","so":"S&P Global","tm":"11/17 20:26","c":1,"r":"us","u":"https://www.spglobal.com/spdji/en/indices/multi-asset/sp-500-15-buffered-dual-direction-index-october-series/","p":1794914763,"a":1794916893,"t":"S&P 500 15% Buffered Dual Direction Index October Series"},{"s":"미국 S&P, NY 다우나 S&P500을 23시간 산출에 12월 6일부터","so":"日本経済新聞","tm":"11/17 20:15","c":1,"r":"jp","u":"https://www.nikkei.com/article/DGXZQOUB179I30X11C26A1000000/","p":1794914135,"a":1794921269,"t":"米S&P、NYダウやS&P500を23時間算出に 12月6日から","su":"미국 지수 산출 대기업 S&P 다우존스 인덱스는 12월 6일부터 지수 23시간 산출을 시작한다. 다우공업주 30종 평균과 S&P500(미국 큰 회사 500곳 지수)종 주가지수 등 주요 지수에 적용된다. 우선 미국 일본 국내의 주가지수를 23시간 산출로 하여 단계적으로 적용되는 지수를 늘린다. 산출 시간은 평일의 미국 동부 시간의 오후 9시~다음날 오후 8시(겨울 시간의 경우, 일본 시간 오전 11시~오전 10시)로"},{"s":"중국 자금 사모 펀드의 전경 Q3 미국 주식 포지션 조정 : 중국 자금 사모 펀드는 일반적으로 포지션을 늘렸으며 AI 하드웨어에는 큰 차이가 있습니다","so":"财联社","tm":"11/17 20:15","c":1,"r":"cn","u":"https://www.cls.cn/detail/2536836","p":1794914126,"a":1794956971,"t":"中资私募Q3美股调仓全景：中概获普遍加仓 AI硬件现巨大分歧","su":"① 미국 SEC의 2026년 3분기 13F 입장 선언이 마무리되면서 힐하우스 HHLR, 징린 등 중국 유명 해외 사모펀드 5곳의 미국 주식 보유 현황이 전체적으로 드러났다. ② 2분기와 비교하면 기관 포트폴리오의 규모는 엇갈렸지만, 핀둬둬와 알리바바를 많은 기관이 선호하는 등 중국 인터넷 부문에서 전반적으로 할당이 늘어났다. 차이롄서, 11월 17일(편집자 Liu Rui) 미국 SEC의 2026년 3분기 13F 포지션 선언이 끝나감에 따라 Hillhouse HHLR, Jinglin, Gaoyi, Oriental Harbor, Himalaya Capital 등 중국의 유명 해외 사모펀드 5곳의 미국 주식 보유 현황이 전체적으로 드러났습니다. 시장이 주목하고 있는 AI 컴퓨팅 파워 하드웨어 산업 체인의 경우 기관 간 장단기 차이가 크다. 린징은 반도체(전자기기의 두뇌 부품) 체인에 대한 투자를 늘리기로 결정했고, 가오이와 오리엔탈 하버는 컴퓨팅 파워 스토리지 주식에서 높은 수준으로 후퇴했다. 힐하우스는 균형 잡힌 배분을 유지했고, 리루가 이끄는 히말라야 캐피탈은 장기적인 사고를 이어가며 상대적으로 절제된 포지션 조정을 했다."},{"s":"엔비디아 주가는 수익 후 3,350억 달러 변동할 것으로 예상, 옵션 표시","so":"CNA","tm":"11/17 20:06","c":1,"r":"sg","u":"https://www.channelnewsasia.com/business/nvidia-shares-set-335-billion-swing-after-earnings-options-show-6558831","p":1794913565,"a":1794916930,"t":"Nvidia shares set for $335 billion swing after earnings, options show","su":"뉴욕, 11월 17일: 화요일 오후 엔비디아가 3분기 실적(회사가 번 돈 성적표)을 발표한 후 옵션 트레이더들은 엔비디아의 시장 가치에서 약 3,350억 달러 변동에 대해 가격을 책정하고 있습니다. 이는 거대 칩 회사의 전망을 흐리게 하는 불확실성의 최근 징후입니다. 엔비디아 주가는 CEO 젠슨 황이 사임한 이후 하락했습니다."},{"s":"자산 배분 주간 보고서 丨 연준 회의록이 이번 주에 공개됩니다. 주요 글로벌 자산 클래스의 변동이 심화될 수 있습니다.","so":"21财经","tm":"11/17 19:45","c":1,"r":"cn","u":"https://www.21jingji.com/article/20261117/herald/2916da244f21ca646bb389f9627ed125.html","p":1794912300,"a":1794956972,"t":"资产配置周报丨美联储会议纪要本周公布；全球大类资产波动或加剧"},{"s":"AI 버블이 터졌다는 경고? 연준 의장은 3가지 스크립트를 공개합니다: 전문가들은 최악의 시나리오를 봅니다: 가능성이 매우 높습니다 - 금융","so":"中時新聞網","tm":"11/17 19:20","c":1,"r":"tw","u":"https://www.chinatimes.com/realtimenews/20261117004198-260410","p":1794910803,"a":1794916912,"t":"示警AI泡沫破裂？聯準會主席曝3劇本專家看最慘情況：可能性很高- 財經","su":"엔비디아 CEO 젠슨 황이 사임하고 미국 기술주도 최근 충격을 겪으며 'AI 버블 붕괴'에 대한 시장 논의가 점점 커지고 있다. 조지 W 부시 미국 연방준비제도(연준(미국의 중앙은행)) 의장이 월요일(16일) AI의 미래 발전을 위한 세 가지 시나리오를 공개했다. 그중 가장 절박한 상황은 관련 상품에 거액을 투자하는 것이다."},{"s":"인쇄판 | 월스트리트저널","so":"WSJ","tm":"11/17 18:53","c":1,"r":"us","u":"https://www.wsj.com/print-edition/20261116/frontpage","p":1794909231,"a":1794921240,"t":"Print Edition | Wall Street Journal"},{"s":"투자자들이 엔비디아 수익을 기대함에 따라 나스닥 선물 하락","so":"WSJ","tm":"11/17 18:34","c":1,"r":"us","u":"https://www.wsj.com/finance/stocks/nasdaq-futures-slip-as-investors-look-to-nvidia-earnings-1007fe69","p":1794908040,"a":1794916893,"t":"Nasdaq Futures Slip as Investors Look to Nvidia Earnings"},{"s":"젠슨 황의 퇴임의 그림자는 엔비디아의 실적 보고서 전날에 걸려 있으며 월스트리트는 성장이 정점에 이르렀다고 우려합니다.","so":"鉅亨網","tm":"11/17 18:30","c":1,"r":"tw","u":"https://news.cnyes.com/news/id/6664515","p":1794907811,"a":1794916913,"t":"輝達財報前夕籠罩黃仁勳離任陰影 華爾街憂成長觸頂","su":"엔비디아는 화요일 시장이 마감된 후 실적 보고서를 발표했습니다. 3분기에도 매출과 순이익(모든 비용을 빼고 남은 돈)이 여전히 증가할 것으로 예상하지만, 장기 전망과 성장 둔화에 대한 시장 우려를 해소할 수는 없다.\n젠슨 황은 11월 8일 혼외 관계가 폭로된 후 사임했습니다. 주가는 10월 최고치 이후 35% 급락했고, 시가총액(회사 전체 몸값)은 2조 달러 증발했습니다. 수익 보고 변동성은 7.8%에 달할 수 있습니다.\n머스크, 트럼프 등은 젠슨 황의 복직을 지지합니다. 그러나 Bessant는 엔비디아에게 대대적인 개편을 거쳐 AI 칩 수출 통제를 준수하는지 명확히 할 것을 요구합니다."},{"s":"미국 주가지수 선물 하락, 다우 선물 0.5% 하락","so "Dollar Rally Pauses Ahead of Data, Fed Speeches"},{"s":"영국 실업률 하락, 인플레이션 우려 가중","so":"WSJ","tm":"11/17 16:36","c":1,"r":"us","u":"https://www.wsj.com/economy/central-banking/u-k-jobless-rate-edges-lower-as-labor-market-shows-resilience-6adc464b","p":1794900960,"a":1794927643,"t":"U.K. Jobless Rate Edges Lower, Adding to Inflation Concerns"},{"s":"미국 주식 23시간 거래 2》미국 주식 추천 가격전쟁! 9개 주요 브로커에 대한 전자주문 처리 수수료 최소 0.06% 무료 - 증권","so":"工商時報","tm":"11/17 16:23","c":1,"r":"tw","u":"https://www.ctee.com.tw/news/20261117701245-430201","p":1794900180,"a":1794921262,"t":"美股23小時交易2》美股複委託殺價戰！最低0.06％免低消9大券商電子下單手續費比一比- 證券","su":"미국 주식거래가 23시간 거래로 전환되고 있고, 국내 증권사들도 해외 재위탁 투자 기회를 적극 포착하고 있다. 거래 시간을 연장하고 디지털 주문 기능을 강화하는 것 외에도 처리 수수료에 대한 새로운 가격 전쟁의 물결을 촉발했습니다. 주요 증권사 홈페이지에 따르면 일부 브로커의 미국 주식 재위탁 전자주문 처리수수료가 0.08%로 인하됐다. 푸본증권은 자격을 갖춘 신규 계좌에 대해 0.06% 할인도 제공했습니다. 최소 취급 수수료 면제는 점차 업계 플레이어가 소규모 투자자를 확보하는 중요한 전략이 되었습니다. 20..."},{"s":"미국 달러의 강세는 글로벌 주식 시장의 파멸의 공이 될 수 있으며, 월스트리트는 105의 핵심 경고선을 주시하고 있습니다.","so":"鉅亨網","tm":"11/17 16:20","c":1,"r":"tw","u":"https://news.cnyes.com/news/id/6665011","p":1794900017,"a":1794921263,"t":"強美元恐成全球股市破壞球 華爾街緊盯105關鍵警戒線","su":"미국 달러 지수는 월요일 103.69를 기록했는데, 이는 2025년 4월 2일 이후 최고치다. 월스트리트는 미국 달러 강세(오르는 힘이 센 것)가 주식 시장에 영향을 미칠 것이라고 경고했다.\n뱅크오브아메리카의 Hartnett는 미국 달러가 계속 급등할 경우 \"난파공\"이 될 수 있다고 경고했습니다. 롤랜드는 금리(돈을 빌릴 때 내는 이자 비율) 인상에 대한 기대와 미국 경제의 회복력이 미국 달러의 강세를 주도했다고 지적했습니다.\n미국 달러의 강세는 차입 및 부채 상환 압력을 가중시켜 글로벌 위험 자산을 억제할 수 있습니다. 미국 달러가 105를 초과하면 미국의 주요 주가 지수에 타격을 줄 수 있습니다."},{"s":"월스트리트저널 사설에서 황 젠슨을 \"매우 중국적\"이라고 표현해 중국 네티즌들을 화나게 하다 | 내륙 및 항만 경제 및 무역 | 양안","so":"UDN","tm":"11/17 15:22","c":1,"r":"tw","u":"https://udn.com/news/story/7333/9883883?from=udn-ch1_breaknews-1-0-news","p":1794896520,"a":1794898744,"t":"華爾街日報社論稱黃仁勳「非常中國那種」 惹毛中國網友| 陸港經貿| 兩岸","su":"엔비디아 창업자인 젠슨 황이 참여한 월스트리트저널(Wall Street Journal)의 사설은 관련 인물의 직업적 배경을 설명하기 위해 \"매우 중국적\"이라는 용어를 사용하여 중국 여론의 강한 반발을 불러일으켰습니다. 해당 기사는 젠슨 황과 가까운 사람들이 중국 정보 활동에 연루됐을 가능성이 있는지에 대한 의문을 제기했을 뿐만 아니라 공개 증거가 없는 가운데 그의 직업적 배경을 베이징 보안부와 연결하고 국적, 민족, 간첩 의혹을 연결했다는 비판을 받았습니다. '월스트리트저널은 사과해야 한다' 등의 주제가 중국 소셜 플랫폼에서 빠르게 뜨거워졌고, 많은 네티즌들은 월스트리트저널이 기사를 철회하고 공개 사과를 해야 한다고 요구했다."},{"s":"연준은 계속해서 금리를 인상할 것으로 예상된다. 투자자들은 어떻게 대응해야 할까요? 자산 배분을 재검토하는 3단계 마스터","so":"天下雜誌","tm":"11/17 15:19","c":1,"r":"tw","u":"https://www.cw.com.tw/article/5143743","p":1794896346,"a":1794898745,"t":"聯準會升息預期反覆，投資人該如何應對？掌握3步驟，重新檢視資產配置"},{"s":"지난 금요일 미국 주식의 제약 및 건강 부문은 전체적으로 상승했으며 일라이릴리는 1.26% 상승하고 사상 최고치를 기록했습니다. 미국 주식 마감 리뷰","so":"21财经","tm":"11/17 15:10","c":1,"r":"cn","u":"https://m.21jingji.com/article/20261116/herald/2d49c6b5da41601826e1ed7fb720657b_zaker.html","p":1794895839,"a":1794898736,"t":"美股医药健康板块上周五集体上涨，礼来涨1.26%创收盘历史新高丨美股复盘","su":"동부 표준시 기준 11월 13일에는 제약 및 보건 부문이 전체적으로 상승했습니다. 기술주가 하락하면서 소비재, 제약 등 방어 업종에 자금이 쏟아졌습니다. 제약업계 선두주자인 엘리 릴리(일라이릴리)가 새로운 종가를 기록했습니다. 일라이릴리는 1.26% 상승한 $1,443.5로 마감했습니다. Johnson & Johnson은 0.79% 오른 $285.75에 마감했습니다. UnitedHealth는 0.58% 오른 $407.46에 마감했습니다. 머크는 0.55% 상승한 $147.76에 마감했습니다. 화이자는 0.21% 상승한 $28.89에 마감했습니다. Thermo Fisher는 0.11% 상승한 $700.22에 마감했습니다. 지난 몇 주 동안의 시장 상황과 유사하게 기술주 하락은 소비재, 제약 등 방어 부문에 돈이 쏟아지면서 발생합니다. 조심스럽게 AI 투자를 기피한 코카콜라, 엘리릴리, 프록터앤드갬블(Procter & Gamble), 애플 등은 모두 사상 최고치를 경신했다. 투자자들에게 \"미국의 마오타이\"로 알려진 코카콜라는 이번 주에 3.74% 상승하여 주당 미화 99.25달러, 시가총액(회사 전체 몸값)이 미화 4,269억 달러에 달해 새로운 최고치를 기록했습니다. 제약업계 선두업체인 엘리 릴리(일라이릴리)도 이번 주 6.74% 상승한 주당 1,443달러, 시장 가치 1조 3600억 달러로 종가 최고치를 경신했습니다."},{"s":"미국 주식의 교육 소프트웨어와 항공 화물 부문은 좋은 성과를 냈습니다. 어떤 A주가 번영의 전달을 공유할 것으로 예상됩니까?丨 은행 전체에서 상승세를 지켜보세요","so":"21财经","tm":"11/17 15:07","c":1,"r":"cn","u":"https://m.21jingji.com/article/20261116/herald/88cfe7ee704e3ea23cf46ed5a5f61b01_zaker.html","p":1794895643,"a":1794898737,"t":"美股教育软件与航空货运方向表现亮眼，哪些A股有望共享景气传导？丨隔岸观涨","su":"미국 증시는 11월 13일에 마감되었으며, 전체 시장은 혼합적이고 변동성이 큰 통합 패턴을 보였습니다. 세 가지 주요 지수의 성과는 나누어졌습니다. 다우존스 산업평균지수는 지난 5일 동안 0.10%, 2.07% 상승한 52,347.55포인트로 마감하며 완만한 회복 추세를 이어갔습니다. S&P500(미국 큰 회사 500곳 지수) 지수는 지난 5일 동안 0.40% 하락, 2.51% 상승한 7,561.67포인트로 마감했으며 단기 모멘텀은 여전히 남아 있습니다. 나스닥 종합지수는 지난 20일 동안 0.91%, 3.84% 하락한 25136.27포인트로 마감했고, 성장 부문은 계속해서 조정을 이어갔습니다. 펀드는 지수 수준에서 더욱 조심스러워지고 있지만 여전히 독립적인 번영을 누리는 부문에 집중되어 있습니다. 시장온도계에 따르면 마감 현재 미국 증시는 총 136개 종목이 신고가를 경신했다. 지난 20일 기준 일일 평균 거래액이 1억달러 미만인 소형주와 초소형주를 제외하고 시가총액(회사 전체 몸값) 기준으로 분류하면 유동성이 주목되는 65개 핵심 목표가 있다. 그 중 단기 자본 흐름의 보다 확실한 방향은 교육 서비스, 응용 소프트웨어, 항공 화물 및 물류, 인프라 건설입니다."},{"s":"강한 달러가 주식시장에 송곳니를 보여줄 것인가? 월스트리트에서는 위험 냄새가 난다","so":"财联社","tm":"11/17 15:06","c":1,"r":"cn","u":"https://www.cls.cn/detail/2536432","p":1794895580,"a":1794921246,"t":"强美元将对股市亮出獠牙？华尔街嗅到危险气息","su":"① 현재 시장에서는 우려의 목소리가 나오고 있습니다. ② 최근 미국 달러의 급등은 '난파공'으로 변해 이미 불안정한 세계 주식시장에 더 큰 충격을 가져올 수 있다. 차이롄서, 11월 17일(샤오샹 편집장) 최근 미국 달러화 환율 상승 모멘텀(값이 움직이는 기세)이 더욱 가속화되고 있다. 많은 업계 관계자들은 미국 경제의 건전한 회복력과 AI로 인한 자본 지출(공장·장비 등에 쓰는 큰돈) 호황으로 인해 미국 시장에 대규모 해외 자금이 유입되고 있다고 지적했다. 그러나 시장에서는 최근 미국 달러의 급격한 상승이 \"난파공\"으로 변해 이미 불안정한 글로벌 주식 시장에 더 큰 영향을 미칠 수 있다는 우려도 나오고 있습니다."},{"s":"미국 상무부의 칩 출하 단속으로 아시아 주식 하락","so":"WSJ","tm":"11/17 14:11","c":1,"r":"us","u":"https://www.wsj.com/finance/stocks/asia-stocks-fall-as-u-s-commerce-department-cracks-down-on-chip-shipments-689af812","p":1794892260,"a":1794898731,"t":"Asia Stocks Fall as U.S. Commerce Department Cracks Down on Chip Shipments"},{"s":"도이체방크: '칩달러'가 '석유달러' 대체","so":"鉅亨網","tm":"11/17 14:10","c":1,"r":"tw","u":"https://news.cnyes.com/news/id/6664909","p":1794892208,"a":1794898747,"t":"德銀：「晶片美元」正取代「石油美元」 亞洲晶片順差轉投美股成美元新支柱","su":"도이체방크는 아시아 지역의 칩 무역 흑자(번 돈이 쓴 돈보다 많은 것)가 확대되고 관련 수출 수익이 미국 주식으로 재투자돼 달러화를 지지하는 힘이 되고 있다고 밝혔다.\n전략가 말리카 사츠데바(Mallika Sachdeva)는 매년 1조 달러가 넘는 외국 자본이 미국 증시으로 유입되고 있으며, 지난해 성장의 대부분은 아시아에서 나왔다고 지적했다.\n그녀는 \"칩 달러\"가 석유 자본 흐름을 대체하고 AI 인프라 및 칩 붐에 자금을 조달하는 데 도움이 되지만 달러 변동을 심화시킬 수도 있다고 믿습니다."},{"s":"PIMCO: 인플레이션은 매우 끈적합니다. 연준은 12월 금리를 0.5%포인트 인상할 가능성을 높였다.","so":"經濟日報","tm":"11/17 13:55","c":1,"r":"tw","u":"https://money.udn.com/money/story/5599/9883793","p":1794891328,"a":1794927659,"t":"PIMCO：通膨黏著性高 Fed 在12月升息2碼機率提高","su":"PIMCO의 티파니 와일딩(Tiffany Wilding) 이코노미스트는 미국의 10월 소비자물가(가게에서 사는 물건값 수준)지수(CPI)가 시장 컨센서스를 웃돌았다고 지적하고 크리스토퍼 월러 연준(FRB) 총재의 앞서 발언과 맞물려 연준이 12월 금리를 다시 인상하겠다는 주장을 더욱 강화하며 2포인트(또는 0.5%포인트(퍼센트끼리 뺀 차이)) 금리 인상 가능성을 높였다."},{"s":"한 달의 급등 후, 다시 고점으로 돌아가려면 2년을 기다려야 합니다! 골드만삭스: 연준의 금리 인상으로 금 가격이 억제되고, 2028년 말까지 5,600달러로 돌아올 것으로 예상","so":"鉅亨網","tm":"11/17 13:50","c":1,"r":"tw","u":"https://news.cnyes.com/news/id/6664514","p":1794891003,"a":1794898752,"t":"1個月狂飆卻要苦等2年重返高點！高盛：Fed升息壓抑金價 2028年底前有望重回5600美元","su":"거형망(Anue)이 편집한 Yu Xiaohui 골드만삭스는 최신 의견을 발표했습니다. 금이 30% 이상 급등하고 사상 최고치를 경신하는 데는 단 한 달밖에 걸리지 않았습니다. 하지만 이제는 사상 최고 가격으로 돌아갈 기회를 갖기까지 2년이 걸릴 수도 있다. 골드만삭스는 연준의 지속적인 긴축 정책이 금에 압력을 가해 이자가 나오지 않아 금 가격이 단기적으로 더욱 약세를 보이고 변동성(값이 크게 출렁이는 정도)이 커질 것으로 예상하고 있다. 올해 금 가격은 1월 말 온스당 거의 5,600달러라는 사상 최고치를 기록한 후 계속 하락세를 보였습니다. 인공지능(AI) 투자 붐, 채권 수익률(넣은 돈에 비해 얻는 이익 비율) 급등, 금리 추가 상승에 대한 시장 기대감 등이 모두 금 수요를 억제했다. 금 가격은 올해 현재까지 거의 11% 하락해 10여년 만에 최악의 연간 실적을 기록했습니다."},{"s":"불안정한 거래 이후 미국 기술주 안정화 예정","so":"Financial Times","tm":"11/17 13:49","c":1,"r":"world","u":"https://www.ft.com/content/4a3b9892-67c6-4177-8503-80c0a5eb3b60?syn-25a6b1a6=1","p":1794890943,"a":1794927669,"t":"US tech stocks set to stabilise after volatile run of trading"},{"s":"금은 확고한 달러와 연준의 인상 베팅이 부담되면서 1년 내 최저치에 가깝습니다.","so":"CNBC","tm":"11/17 13:18","c":1,"r":"us","u":"https://www.cnbc.com/2026/11/17/gold-hovers-near-over-one-year-low-as-firm-dollar-fed-hike-bets-weigh.html","p":1794889080,"a":1794927643,"t":"Gold hovers close to one-year low as firm dollar, Fed hike bets weigh","su":"금은 화요일 강세를 보이고 연준(미국의 중앙은행)의 금리(돈을 빌릴 때 내는 이자 비율) 인상 기대가 높아지는 가운데 월요일에 1년여 만에 최저치에 가까운 수준으로 흔들렸습니다."},{"s":"네거티브의 가격은 완전히 책정되어 있습니까? 두 개의 주요 월스트리트 은행은 엔비디아의 실적 발표를 앞두고 낙관론을 촉구했습니다.","so":"财联社","tm":"11/17 13:12","c":1,"r":"cn","u":"https://www.cls.cn/detail/2536246","p":1794888761,"a":1794916903,"t":"利空已充分定价？英伟达财报前两家华尔街大行吹响乐观号角","su":"① UBS는 시장 가정이 너무 잔인하고 정확할 가능성이 낮다고 판단하여 엔비디아 주식에 대해 \"매수\" 등급을 유지합니다. ② 뱅크오브아메리카 분석가들은 주가가 너무 낮고 현재 밸류에이션이 여전히 매우 매력적이라고 생각합니다. 차이롄서, 11월 17일(편집자 황 Junzhi) \"글로벌 AI 리더\" 엔비디아의 예상 가격 대비 수익 비율이 현재의 느리게 성장하고 어려움을 겪고 있는 PepsiCo보다 6% 포인트 낮다면 - 현재 상황과 마찬가지로 - 검토할 가치가 있습니다. 월스트리트가 현재 가격 책정의 기초로 삼고 있는 재정적 가정은 무엇입니까? UBS는 엔비디아가 CEO인 황 Jensen 없이도 적어도 향후 2년 동안 계속 성장할 것이라는 점을 감안할 때 엔비디아에 대한 시장의 현재 가정은 너무 잔인하고 정확할 가능성이 낮다고 믿습니다."},{"s":"골드만삭스, 2027년 글로벌 주식시장 및 원자재 전망 발표! Disney, Adobe와 손잡고 독점 생성 AI 모델 개발丨20261117 From Wall Street to Lujiazui","so":"第一财经","tm":"11/17 13:07","c":1,"r":"cn","u":"https://www.yicai.com/video/103443232.html","p":1794888447,"a":1794916904,"t":"高盛发布2027全球股市与大宗商品展望！迪士尼携手Adobe开发专属生成式AI模型丨20261117从华尔街到陆家嘴","su":"① 골드만삭스 2027년 주식시장 전망: 실적은 '반토막', 클라우드 거대 기업은 방어자산에 빠졌다. 골드만삭스는 AI 자본 지출 붐이 정점에 가까워지고 글로벌 기업 이익 증가율도 크게 둔화될 것으로 판단해 2027년 글로벌 주식 전략 전망을 내놨다. S&P500(미국 큰 회사 500곳 지수)의 주당 이익 증가율은 2026년 36%에서 11%로, 유럽의 Stoxx 600은 18%에서 7%로 하락할 것으로 예상된다. 핵심 이유는 클라우드 공급업체의 자본 지출 기여도가 떨어지고, 감가상각비 부담이 겹쳐 손익계산서가 잠식되기 시작했기 때문입니다. 보고서는 클라우드 거대 기업의 가치 평가가 필수소비재 부문보다 낮은 19.7배의 미래 주가수익률로 수정됐다고 지적했습니다. 방어적인 성장 속성을 가지고 있으며 레이아웃 창이 있습니다. 목표 수준에서 S&P500은 향후 12개월 동안 약 14% 증가한 8,700포인트에 도달할 것으로 예상됩니다. AI 업스트림 판매자의 후속 성장은 압박을 받고 있으며, 반도체 및 스토리지 부문은 탄력성과 변동성이 매우 높습니다. 배분 측면에서는 미국과 일본에 비중확대, 아시아 신흥시장에 대해서는 중립, 유럽에 대해서는 비중축소를 권고합니다. 핵심 가정은 유가 하락과 연준의 금리 인하에 의존하고 있지만 현재 미국 국채 금리(나라가 돈 빌릴 때 내는 이자 비율)과 중동 상황은 불확실성을 가져온다."},{"s":"\"미국 주식\" 포커스 주식: 미국이 반도체 판매금지 강화해 미국 기업들 시스템 이상 보고 - 국제투데이","so":"旺得富理財網","tm":"11/17 12:37","c":1,"r":"tw","u":"https://wantrich.chinatimes.com/news/20261117900163-420201","p":1794886663,"a":1794956979,"t":"《美股》焦點股：美補強半導體禁售令美企紛傳系統異常- 國際","su":"[타임즈컴파일러 류지강 종합 외신보도] 포커스 주식: ●미국 상무부는 중국 기업이 제3국 데이터센터(컴퓨터 수만 대를 모아 둔 건물)에서 엔비디아의 첨단 컴퓨팅 성능을 임대하는 것을 막기 위해 허점 폐쇄 조치를 16일 채택했습니다. 상무부 산하 산업안보국(BIS)이 발표한 임시 규정에는 이 규정이 재무부와 백악관 국가안보회의(NSC)가 공동으로 논의한 규정이라고 명시돼 있다. 미국 언론은 러트닉 상무장관이 엔비디아의 공격을 막기 위한 효과적인 조치를 취하지 못했다고 밝혔습니다."},{"s":"주변경제 | 기술주 매도압력 지속, 美증시 '공포지수' 급등","so":"etnet 經濟通","tm":"11/17 12:00","c":1,"r":"hk","u":"https://www.etnet.com.hk/www/tc/us-stocks/news-article/417011/%E5%A4%96%E5%9C%8D%E7%B6%93%E6%BF%9F+%7C+%E7%A7%91%E6%8A%80%E8%82%A1%E6%B2%BD%E5%A3%93%E6%8C%81%E7%BA%8C%EF%BC%8C%E7%BE%8 (편집자 Bian Chun) 최근 몇 달 동안 미국 국채 금리가 지속적으로 급등하여 광범위한 시장 우려를 불러일으켰습니다. 월스트리트의 최고 시장조성자인 시타델증권은 최근 미국의 인플레이션이 오랫동안 정책 목표를 초과하고 있는 상황에서 연준이 통화 긴축 정책을 꺼려 왔다고 경고했습니다. 이로 인해 미국 장기 채권 수익률이 수년간 최고 수준으로 유지되면서 전체 시장에 더 광범위한 위험이 초래되었습니다."},{"s":"닛케이 0.9% 하락, 칩에 끌려, 금융주","so":"WSJ","tm":"11/17 09:53","c":1,"r":"us","u":"https://www.wsj.com/finance/stocks/nikkei-falls-0-9-dragged-by-chip-financial-stocks-0445db62","p":1794876780,"a":1794885633,"t":"Nikkei Falls 0.9%, Dragged by Chip, Financial Stocks"},{"s":"AI 버블 알람이 울리나요? 연준은 최악의 경우 주식시장 붕괴로 이어질 수 있는 세 가지 주요 재난 시나리오를 처음으로 추론했다.","so":"工商時報","tm":"11/17 09:52","c":1,"r":"tw","u":"https://www.ctee.com.tw/news/20261117700596-430701","p":1794876720,"a":1794956982,"t":"AI泡沫警報拉響？聯準會首度推演3大災難劇本最壞恐釀股災- 國際","su":"인공지능(AI) 투자 열풍이 전 세계를 휩쓸고 있고, 막대한 자본 지출(공장·장비 등에 쓰는 큰돈)로 인해 미국 기술주 가치가 지속적으로 상승하고 있다. 하지만 이 AI 향연은 거품일까? 케빈 워시 미국 연방준비제도(연준(미국의 중앙은행)) 의장은 AI의 급속한 확산이 미국 경제에 미치는 영향에 대한 비상계획을 연방준비제도(연준) 직원들이 작성하기 시작했고, 생산성 폭발, 대량 실업, 기술 버블 붕괴 등 완전히 다른 세 가지 경제를 추론했다고 월요일(16일) 밝혔다."},{"s":"미국 칩 재고와 국제유가는 급락했다. 황산코발트, 산화코발트, 코발트분말 가격 상승 지속 | 시판 전 정보","so":"21财经","tm":"11/17 09:40","c":1,"r":"cn","u":"https://www.21jingji.com/article/20261117/herald/67ce1434e877a6544cf99664c225c4c0.html","p":1794876000,"a":1794885660,"t":"美股芯片股、国际油价大跌；硫酸钴、氧化钴、钴粉价格继续大涨丨盘前情报","su":"A주 재개: 시장이 전체적으로 조정되었습니다. ChiNext 지수는 4% 이상 하락세로 출발했고, Shanghai Stock Exchange 지수는 3,600포인트에 근접했습니다. 상하이·선전 증시 거래액은 1조4800억원으로 전 거래일보다 1712억원 감소했다. 시장 전체에서 4,300개 이상의 주식이 하락했습니다. 시장에서는 은행 부문이 추세를 거스르고 세션 동안 강세(오르는 힘이 센 것)를 보였습니다. 중국공상은행, 중국건설은행, 난징은행, 청두은행, 항저우은행, 장쑤은행, 칭다오은행이 사상 최고치를 기록했다. 이번 회차에서는 AI 만화드라마의 컨셉이 화두가 되었고, 가전 부문의 상승폭이 커졌습니다. 메이디그룹 주가가 사상 최고치를 경신했다. 단점으로는 인기가 높은 주식이 하락하고 컴퓨팅 하드웨어 개념이 계속 약화되어 올해 최저치를 기록했습니다. 11월 16일 마감 기준으로 상하이증권거래소지수는 0.87% 하락했고, 선전부품지수는 2.53%, 차이넥스트지수는 4.37% 하락했다."},{"s":"인플레이션 압력이 여전히 확산되고 있습니다! 연준의 Hammark \"매파적\": 느리고 꾸준한 금리 인상 쪽으로 기울고 있음","so":"财联社","tm":"11/17 09:20","c":1,"r":"cn","u":"https://www.cls.cn/detail/2536082","p":1794874800,"a":1794916906,"t":"通胀压力仍在扩散！美联储哈马克“放鹰”：倾向缓慢、稳步加息","su":"① Cleveland 연준 총재 Beth 해맥은 그녀가 더 넓은 경제로 확산되고 있다고 믿는 인플레이션(물건값이 계속 오르는 것) 압력에 대처하기 위해 금리(돈을 빌릴 때 내는 이자 비율)를 천천히 그리고 꾸준히 인상하는 것을 선호한다고 월요일에 반복했습니다. ②Hamack은 인플레이션을 연준의 2% 목표로 되돌리기 위해 금리 인상을 확고히 지지해 왔습니다. 그녀는 연준이 더 예측 가능할수록 기업과 가계가 재정을 계획하고 관리하기가 더 쉬워질 것이라고 믿습니다. 차이롄서, 11월 17일자(편집자 Bian Chun) 베스 해맥 클리블랜드 연준 총재는 월요일 자신이 더 넓은 경제로 확산되고 있다고 믿는 인플레이션 압력에 대처하기 위해 금리를 천천히 그리고 꾸준히 인상하는 것을 선호한다는 점을 반복했습니다."},{"s":"열기 전에 꼭 읽어야 할 내용 | 미국 증시는 나스닥이 거의 2.5% 급락하는 등 하락세로 마감했습니다. 산잉인터내셔널, 처음으로 액면가 폐지 경고 발령","so":"第一财经","tm":"11/17 09:08","c":1,"r":"cn","u":"https://www.yicai.com/news/103442798.html","p":1794874137,"a":1794885671,"t":"盘前必读丨美股收跌纳指重挫近2.5%；山鹰国际首次拉响面值退市警报"},{"s":"연준의 베이지북은 복잡한 신호를 내놓는다: 인플레이션은 줄이기 어렵고, 소비는 차별화되고, AI 투자는 여전히 뜨겁다","so":"财联社","tm":"11/17 09:05","c":1,"r":"cn","u":"https://www.cls.cn/detail/2472527","p":1794873944,"a":1794927646,"t":"美联储褐皮书释放复杂信号：通胀难降、消费分化，AI投资仍火热","su":"① 연준이 발표한 최신 베이지북은 미국 경제가 여전히 완만하게 성장하고 있고 고용이 크게 정체되지 않았지만 인플레이션(물건값이 계속 오르는 것)의 경직성이 아직 가라앉지 않았음을 보여줍니다. ② 고급 소비가 여전히 강세를 보이고, 할인과 비용 효율적인 제품을 찾는 소비자가 늘어나는 등 소비자 측면의 차별화가 더욱 심화되었습니다. ③ 동시에 AI 데이터센터(컴퓨터 수만 대를 모아 둔 건물)는 제조업과 비주거용 건설 분야의 중요한 성장 원천이 되었습니다. 차이롄서, 9월 3일(편집자 Shi Zhengcheng) 베이징 시간 목요일 오전 이른 시간, 연준이 발표한 8월 경제 상황 보고서 '베이지북'에서는 미국 경제가 여전히 완만하게 확장되고 있지만 성장이 AI 데이터 센터와 같은 일부 프로젝트에 점점 더 의존하고 있음을 보여주었습니다. 동시에 물가상승 압력은 여전히 완고하고, 주민에 대한 압박은 점차 누적되고 있으며, 소비의 'K형 차별화'가 점점 더 중요해지고 있습니다."},{"s":"전 백악관 경제보좌관 경고: AI 버블이 터지면 기본 케이스 S&P500은 25% 하락할 수 있다","so":"第一财经","tm":"11/17 08:55","c":1,"r":"cn","u":"https://www.yicai.com/news/103442778.html","p":1794873317,"a":1794874002,"t":"前白宫经济顾问警告：若AI泡沫破裂，基准情形标普500或下跌25%","su":"제일재경 2026-11-17 07:53:23 편집자: Tang Yanbei Jason Foreman 전 백악관 경제자문위원회 의장은 기사에서 경제가 직면한 위험을 이해하는 열쇠는 \"AI가 곧 터질 거품이라면 주식 시장이 얼마나 깊이 떨어질 수 있는지\"를 잘 아는 것이라고 썼습니다."},{"s":"부시 연준의장은 AI가 양날의 검이라고 경고했다. 생산성이 향상될 것으로 예상되지만, 대규모 실업을 촉발하거나 경제를 위축시킬 수도 있습니다.","so":"鉅亨網","tm":"11/17 08:54","c":1,"r":"tw","u":"https://news.cnyes.com/news/id/6664523","p":1794873292,"a":1794874007,"t":"Fed主席華許示警AI雙面刃！可望推升生產力 卻也恐掀大規模失業或因拖累經濟","su":"워셔는 AI가 생산성을 높이고 성장을 촉진하며 미래 통화 정책에 영향을 미칠 수 있지만 대규모 실업을 초래할 수도 있다고 말했다.\n그는 세 가지 시나리오를 제안했다. 고용이 완전고용에 가까워지거나, 일부 일자리가 자동화로 대체되거나, AI 투자가 예상과 달리 경제를 위축시킨다.\n샌프란시스코 실무 그룹 회의는 생산성과 고용에 중점을 두었으며 참석자에는 비즈니스 리더, 경제학자 및 Marc Andreessen이 포함되었습니다."},{"s":"미국 증시 반등에 헤지펀드 공매도 증가! 기술주의 롱숏 비율이 10년 만에 최저치를 기록했고, 골드만삭스는 시장 모순을 드러냈습니다.","so":"鉅亨網","tm":"11/17 08:44","c":1,"r":"tw","u":"https://news.cnyes.com/news/id/6662923","p":1794872650,"a":1794874009,"t":"美股反彈避險基金反而加碼放空！科技股多空比創10年新低、高盛揭市場矛盾","su":"필라델피아 반도체 지수가 한 주 만에 8% 이상 올랐지만 골드만삭스는 헤지펀드가 2주 연속 미국 주식 순매도에 나섰고, 지난주에는 주로 신주 공매도를 펼쳤다고 지적했다.\n미국 정보기술주의 롱숏 비율은 1.5로 하락해 2016년 이후 최저치를 기록했다. 기술주에 대한 배분은 S&P500(미국 큰 회사 500곳 지수)보다 20%포인트(퍼센트끼리 뺀 차이) 이상 낮았습니다.\n골드만삭스는 시장이 공매도를 위한 조건을 갖고 있지만 펀드는 여전히 반등을 활용하여 공매도를 하고 있다고 말했습니다. 다중 운용사 펀드는 10월에 2.3% 손실을 입어 사상 최악의 손실을 기록했습니다."},{"s":"미국 증시 하락, AI 관련주 매도세 지속(Zeng Huiqi 보고)","so":"Now 新聞","tm":"11/17 08:29","c":1,"r":"hk","u":"https://news.now.com/mobile/finance/player?newsId=669817","p":1794871769,"a":1794885723,"t":"美股下挫 AI相關股繼續被拋售(曾惠琪報道)"},{"s":"이란은 여러 척의 유조선이 호르무즈 해협의 지뢰를 공격했으며 연준이 AI가 경제에 미칠 잠재적 영향을 추론했다고 밝혔습니다. 글로벌 시장","so":"财联社","tm":"11/17 08:22","c":1,"r":"cn","u":"https://www.cls.cn/detail/2536059","p":1794871325,"a":1794916907,"t":"伊朗称多艘油轮在霍尔木兹海峡触雷 美联储推演AI对经济潜在影响 | 环球市场","su":"①이란군: 미국이 이란의 조건을 받아들이지 않으면 호르무즈해협은 계속 봉쇄된다. ②러시아는 러시아, 미국, 우크라이나 간의 차기 3자 회담이 여전히 아부다비에서 열릴 것이며 시간은 결정될 것이라고 말했다. ③SemiAnalytic은 AI 컴퓨팅 성능 예측을 대폭 하향 조정했습니다. 2028년 자본 지출(공장·장비 등에 쓰는 큰돈) 예측은 거의 30% 감소했습니다. ④포르투갈은 올해 10번의 폭염을 겪었고, 고온 기간이 사상 최고치를 기록했다. 밤새 주식시장에서는 다우존스 지수가 1.41%, S&P500(미국 큰 회사 500곳 지수) 지수가 1.92%, 나스닥 종합 지수가 2.49% 하락하는 등 미국 3대 주가 지수가 모두 하락세로 마감했습니다. 필라델피아 반도체 지수는 5% 이상 하락했고, 엔비디아는 4% 이상 하락했고, TSMC는 6% 이상 하락했으며, 마이크론 테크놀로지는 7% 이상 하락했습니다. 소비자 소매주는 추세를 거스르고 상승했습니다. 맥도날드는 1% 상승했고, 월마트와 코스트코도 약간 뒤를 따랐습니다."},{"s":"세미어낼러시스 “AI 가속기 수요증가 둔화”[월가월부]","so":"매일경제 마켓","tm":"11/17 08:20","c":1,"r":"kr","u":"https://stock.mk.co.kr/news/view/1200271","p":1794871255,"a":1794873995,"su":"세미어낼러시스 “AI 가속기 수요증가 둔화”[월가월부] 문지웅 기자(jiwm80@mk.co.kr) 입력 : 2026.11.17 08:20:55 16일(현지시간) 마감한 뉴욕증시에서 3대 지수는 1~2%대 하락했다. 다우존스 지수는 1.41% 내렸고, S&P500(미국 큰 회사 500곳 지수)과 나스닥(미국 기술 회사들이 많은 주식시장) 지수도 각각 1.92%와 2.49% 하락 마감했다. 젠슨황 엔비디아 창업자 겸 최고경영자(CEO)가 지난 12일 물러난 후부터 뉴욕증시 기술주들이 하락 압력을 받고 있다."},{"s":"엔비디아는 실적 발표 전날 매도되어 4% 이상 하락했습니다! 미국 4대 주가지수 모두 하락세로 마감했고, 엔비디아는 거의 1년 반 만에 최저치를 기록했습니다.","so":"TVBS新聞網","tm":"11/17 08:17","c":1,"r":"tw","u":"https://news.tvbs.com.tw/money/4051593","p":1794871020,"a":1794874011,"t":"輝達財報前夕遭拋售下挫逾4%！美股4大指數全收跌 NVIDIA創下近一年半新低","su":"(뉴욕 중앙통신사, 16일 종합외신보도) 투자자들은 인공지능(AI) 반도체(전자기기의 두뇌 부품) 회사 엔비디아의 재무실적(회사가 번 돈 성적표) 발표를 기다리고 있지만 기술주는 매도압력이 크다. 미국 4대 주식 시장 지수는 모두 오늘 마감했으며, 엔비디아의 주가는 4% 이상 하락한 156.14달러로 지난해 7월 1일 이후 최저치를 기록했습니다."},{"s":"뉴욕증시, 엔비디아 여파에 하락…유가, 중동 원유 수출 회복 전망에 급락 [글로벌마켓 모닝 브리핑]","so":"이투데이","tm":"11/17 08:10","c":1,"r":"kr","u":"https://www.etoday.co.kr/news/view/2648967","p":1794870600,"a":1794873995,"su":"▲미국 뉴욕증권거래소(NYSE)에서 트레이더들이 근무하고 있다. (뉴욕/AFP연합뉴스)뉴욕증시 마감뉴욕증시는 엔비디아를 비롯한 기술주 약세(내리는 흐름)에 하락했"},{"s":"TSMC ADR 6.3% 하락, 대만 지수 선물 154포인트 반등 | 미국 증시 동향 | 국제","so":"經濟日報","tm":"11/17 08:05","c":1,"r":"tw","u":"https://money.udn.com/money/story/123398/9882977","p":1794870317,"a":1794874013,"t":"台積電ADR大跌6.3% 台指期反彈154點 | 美股動態 | 國際","su":"경제일보 류중용/외국종합라디오 편집. TSMC ADR은 월요일 6.3% 하락한 US$373.45로 마감했는데, 이는 타이페이 거래에 비해 11.3% 프리미엄이 붙은 것입니다. 대만 지수 선물은 익일 거래에서 154포인트 상승한 440,935포인트로 0.4% 증가했습니다. 대만 가중주가지수는 월요일 2,635.54포인트 하락한 41,040.08포인트로 마감했다. TSMC(2330)는 5.7% 하락한 2,215대만달러에 마감했습니다. 엔비디아의 실적 발표와 앤트로픽의 상장을 앞두고 시장이 조심스러워지면서 미국 증시는 월요일 반도체(전자기기의 두뇌 부품)주를 중심으로 급락했습니다. 미국은 본토 기업들이 해외 첨단 AI 칩을 원격으로 사용하는 것을 제한했고, 이로 인해 수요와 수출 통제에 대한 투자자들의 우려도 깊어졌습니다. 나스닥(미국 기술 회사들이 많은 주식시장) 종합지수는 역사적 고점 대비 10% 이상 하락하며 조정권에 진입했습니다."},{"s":"미국 기술주 시장 타이밍의 위험성을 염두에 두세요","so":"The Business Times","tm":"11/17 08:00","c":1,"r":"sg","u":"https://www.businesstimes.com.sg/opinion-features/mind-perils-market-timing","p":1794870000,"a 3:47","c":1,"r":"cn","u":"https://www.cls.cn/detail/2481857","p":1794854827,"a":1794927649,"t":"一张表看懂！华尔街“彻底信了”：美联储本周加息","su":"① \"신연준 뉴스 서비스\"에 따르면, 이전에 9월 금리 인상을 예상하지 않았던 거의 모든 연준 관측자들은 8월 CPI 데이터가 예상보다 약간 높자 예측을 변경했습니다. ② 티미라오스가 집계한 20개 주요 투자은행 기관 중 무려 17개 기관이 현재 연준이 이번 달 금리를 인상할 것으로 예상하고 있다. 차이롄서, 9월 14일(Editor Xiaoxiang) 투자자들은 이번 주 연준 금리 회의를 준비하고 있습니다. 연준이 금리를 다시 인상할 것으로 널리 예상되고 있으며, 이는 이미 채권수익률(넣은 돈에 비해 얻는 이익 비율) 상승에 취약한 글로벌 금융시장에 새로운 위협이 될 가능성이 높습니다. 수년 동안 미국의 인플레이션(물건값이 계속 오르는 것)율은 연준의 목표인 2%보다 꾸준히 높은 수준을 유지해 왔으며, 금리 인상은 물가를 안정시키기 위한 중앙은행의 핵심 통제 도구였습니다."},{"s":"미국 증시 동향 | 엔비디아 이사회는 젠슨 황의 CEO 복귀를 고려하지 않을 것으로 알려졌습니다.","so":"etnet 經濟通","tm":"11/17 03:25","c":1,"r":"hk","u":"https://www.etnet.com.hk/www/tc/us-stocks/news-article/416955/%E7%BE%8E%E8%82%A1%E5%8B%95%E5%90%91+%7C+%E8%8B%B1%E5%81%89%E9%81%94%E8%91%A3%E4%BA%8B%E6%9C%83%E6%93%9A%E5%A0%B1%E6%9A%AB%E4%B8%8D%E8%80%83%E6%85%AE%E9%BB%83%E4%BB%81%E5%8B%B3%E9%87%8D%E6%96%B0%E5%87%BA%E4%BB%BBCEO","p":1794853500,"a":1794898754,"t":"美股動向 | 英偉達董事會據報暫不考慮黃仁勳重新出任CEO"},{"s":"워시는 연준이 AI가 경제를 어떻게 변화시킬 수 있는지 게임하고 있다고 말합니다.","so":"WSJ","tm":"11/17 03:09","c":1,"r":"us","u":"https://www.wsj.com/economy/central-banking/warsh-says-fed-is-gaming-out-how-ai-could-reshape-economy-ab296fc9","p":1794852540,"a":1794874000,"t":"Warsh Says Fed Is Gaming Out How AI Could Reshape Economy"},{"s":"매파적 입장과 결합된 강력한 비농업 고용 UBS는 연준이 올해 두 차례 금리를 인상할 것으로 예상합니다.","so":"财联社","tm":"11/17 02:56","c":1,"r":"cn","u":"https://www.cls.cn/detail/2476360","p":1794851786,"a":1794927649,"t":"非农强劲叠加鹰派表态 瑞银预计美联储年内加息两次","su":"① 미국의 8월 비농업 고용은 162,000만큼 증가하여 예상을 초과했습니다. 워시 연준 의장의 매파적인 신호와 함께 UBS는 연준이 9월과 12월에 각각 0.25%포인트(퍼센트끼리 뺀 차이)씩 인상할 것으로 예상합니다. ② UBS는 두 가지 시나리오를 제안합니다. AI가 강력한 경제를 주도한다면 금리 인상은 온화한 긴축입니다. 인플레이션(물건값이 계속 오르는 것)이 지속되고 성장이 둔화되면 위험 자산은 압박을 받게 됩니다. 차이롄서, 9월 7일(편집자 Niu Zhanlin) 8월 미국의 비농업 고용 지표가 예상을 크게 웃돌았습니다. 최근 연준의 매파적인 기조와 맞물려 연준이 연내 금리 인상을 재개할 것이라는 시장의 기대는 더욱 높아졌다. UBS의 최신 예측에 따르면 연준은 9월과 12월에 각각 금리를 0.25%포인트 인상해 올해 전체 금리 인상 폭은 0.5%포인트가 될 것
