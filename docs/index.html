com/view/NISX20261115_0003868432","p":1794706047,"a":1794713947,"su":"[안동=뉴시스] 류상현 기자 = 2차전지(충전해서 다시 쓰는 배터리) 산업에서 나오는 고염폐수 오염원 가운데 리튬이 황산염보다 농도를 낮추기 어렵고 폐수로 인한 영향은 담수생물이 해양생물보다 더 많이 받는 것으로 나타났다.경북도보건환경연구원과 포항산업과학연구원(RIST)은 2차전지 산업에서 나오는 고염폐수의 이같은 생태독성을 분석하고 지역에 맞는 처리와 자원회수를 위한 전략을 제시했다.."},{"s":"2차전지 제조장비 기술 자료 빼돌려 새 회사 차린 2명 벌금형","so":"연합뉴스","tm":"11/15 10:00","c":1,"r":"kr","u":"https://www.yna.co.kr/amp/view/AKR20261113054800064","p":1794704403,"a":1794713947,"su":"(청주=연합뉴스) 이성민 기자 = 전 직장의 2차전지(충전해서 다시 쓰는 배터리) 기술 설계 도면 등을 빼돌려 새 회사를 차린 남성 2명이 벌금형을 선고받았다."},{"s":"[모닝포스트] 국제유가가 밤새 '롤러코스터'를 겪었다. 스페이스X 3분기 실적은 기대치를 초과했습니다. CATL 및 기타 3분기 보고서가 발표되었습니다.","so":"财联社","tm":"11/15 07:41","c":1,"r":"cn","u":"https://www.cls.cn/detail/2510447","p":1794696099,"a":1794727082,"t":"【早报】国际油价，一夜“过山车”；SpaceX Q3 业绩超预期；宁德时代等三季报出炉","su":"① 미국 ​​정부가 각 기관에 딥시크 사용 중단을 지시했고, 외교부가 대응 ② 국가 데이터 그룹 설립 ③ 미국 다우존스 산업평균지수가 1% 이상 상승 ④ 공업정보화부: R&D와 테스트를 통해 충분히 검증되지 않은 불합리한 혁신 디자인과 자동차 제품의 시장 진입을 단호히 방지 ⑤ CATL, Tianyue Advanced, Yunnan Germanium Industry, CSSC Special Gas의 3분기 보고서가 공개된다. 매크로뉴스 1. 국무원의 승인을 받아 국립데이터그룹주식회사가 설립되었습니다. 국무원 국유자산감독관리위원회는 국무원을 대신하여 투자자의 직무를 수행한다. 국무원 국유자산감독관리위원회가 투자자의 임무를 수행하는 기업 목록에 포함될 것이다. 2. 미국 국토안보부는 10월 19일 미국 연방정부의 민간행정기관이 중국 인공지능 기업 딥서치(Deep Search) 및 그 계열사가 개발한 제품 및 서비스를 구매하는 것을 금지하고 관련 제품 및 서비스를 관련 기관의 정보시스템에서 제거하도록 요구한다고 발표했다. 상무부는 이에 대해 중국측은 강한 불만을 표하며 단호히 반대한다고 밝혔습니다. 미국은 양국 정상이 달성한 중요한 공감대를 진지하게 이행하고, 중국과 중간 협력하고, 중미 인공지능 대화 메커니즘을 잘 활용하고, 상호 신뢰를 강화하고, 차이를 관리하며, 인공지능을 공동으로 추진하기를 희망합니다."},{"s":"CATL과 BAIC, 포괄적인 전력 교환 협력 실시","so":"21财经","tm":"11/14 20:22","c":1,"r":"cn","u":"https://www.21jingji.com/article/20261114/herald/3850b3ac4602ab05934e7eda1b975b39.html","p":1794655376,"a":1794659867,"t":"宁德时代与北汽全面换电合作落地","su":"CATL과 BAIC는 포괄적인 배터리 교환 협력을 시작했습니다. 본 신문 보도(리팅 기자) 11월 13일 베이징에서 Jihu 국가 전력 스왑 생태계 및 베타 시리즈 신제품 출시 컨퍼런스가 개최되어 Jihu T1 배터리 스왑 버전이 출시되었습니다. 이는 베이징자동차그룹(이하 'BAIC 그룹')과 CATL 신에너지기술유한회사(이하 'CATL')가 지난 10월 22일 협약 체결 이후 한 달도 채 되지 않아 100만대 차량용 배터리 교환 전략적 협력 협약을 체결한 이후 또 하나의 중요한 성과다. 이전 협약에 따르면 양 당사자는 차량 개발, 배터리 교체 공급, 배터리 교체 네트워크 및 비즈니스 모델 혁신에 초점을 맞춘 풀체인 협력을 진행하게 된다. BAIC는 자사의 멀티 브랜드 적용 모델을 초콜릿 배터리 교환 생태계에 통합하는 것을 촉진하고 배터리 교환 모델 100만 개라는 목표를 달성할 것입니다."},{"s":"CATL의 1,300억 달러 하락: 중국 최대 배터리 제조업체의 가치가 급락한 이유는 무엇입니까?","so":"South China Morning Post","tm":"11/14 16:00","c":1,"r":"sg","u":"https://www.scmp.com/business/climate-and-energy/article/3374346/chinas-battery-giant-catl-faces-tough-choices-after-epic-us130b-sell","p":1794639607,"a":1794642677,"t":"CATL’s US$130b drop: why has China’s biggest battery maker plunged in value?"},{"s":"[포토] 이차전지 소재·부품 및 장비전(K-BATTERY SHOW 2026)","so":"전자신문","tm":"11/14 11:57","c":1,"r":"kr","u":"https://www.etnews.com/tools/image_popup.html?v=bjQ5VkNYY2dLZTZMZFBUbmNzandvWmpGcjBTK1pHYm1CUVRXR0pTMldlYVZkdE5JeGJVUFVVNURJN04rbmhKTUxzY1VjKzlkWnR1T0RNY3NNT29yUjFDQ2JhMTlQMG04cmkxbm9CQkJtdENXMGpteXcxTWNOZXV5Rk81bmVFcmRqdGRpUWJuNUE1QjY4TG5DY09QZEtMcDZkK0lLZG9OaXlodTI2UVBmcmY5aDNuMlJtMHlpdWFwSWl5L3d1eTA3S2xTejI2VTNnVktpdi9Kc3dnNFMrcjdtWFU3YkJDQlVwTitmRzFNOXBQdWV2QklNcEVSQkFzNEMyL29uUkVxZ0NhVWRXOU9pOG9CS3U3TXgrOGpNaGtSc0dwQlJFOVR3SEhnNlRyMVNQb1dhTDJGYk9lV01lQ3F2NjdPcEt2OVNUZVYwUmNjMk03c3N1OHVEL0JJN3NnPT0","p":1794625072,"a":1794664805},{"s":"배터리 증권화 추세가 높아지고 있다","so":"Jiemian.com","tm":"11/14 11:21","c":1,"r":"cn","u":"https://www.jiemian.com/article/15323161.html","p":1794622871,"a":1794698071,"t":"电池证券化趋势渐起","su":"지몐 뉴스 기자 | 우한시 옵틱스 밸리(Optics Valley)에 위치한 배터리 교환 스테이션에서는 배터리가 부족한 전기 자동차가 주차 프레임으로 진입한 후 자동으로 배터리 교환 스테이션 칸에 쏟아졌습니다. Jiemian News 기자들은 현장에서 배터리가 차량 섀시 아래에 있는 것을 목격했습니다. 해치가 열린 후 시스템은 스캔된 주문 정보를 기반으로 창고에서 충전된 배터리를 매칭했습니다. 장비는 자동으로 위치를 조정하고, 방전된 배터리를 제거하고, 새 배터리를 장착하고 잠겼습니다. 전체 과정은 약 3분 정도 소요되었습니다. \"2026년 9월 말 기준으로 Weineng의 관리 중인 배터리 규모는 60GWh를 초과하고 운영 자산은 600억 위안을 초과할 것입니다.\" 11월 초 언론 인터뷰에서 우한 Weineng 배터리 기술 그룹 유한회사(이하 Weineng)의 총책임자인 라이 샤오밍(Lai Xiaoming)은 Jiemian News 및 기타 언론에 말했습니다."},{"s":"일주일 동안의 자금 유출은 24억 위안을 초과했으며 CATL은 주요 플레이어에 의해 크게 감소되었습니다! 캠브리안은 이러한 추세를 거스르고 자금 유치 목록 1위를 차지했습니다.","so":"21财经","tm":"11/14 11:00","c":1,"r":"cn","u":"https://www.21jingji.com/article/20261114/herald/b542a1d4ed1c9c9d383f011d64d8bfb0.html","p":1794621600,"a":1794628702,"t":"单周失血超24亿元，宁德时代遭主力大减持！寒武纪逆势吸金居首","su":"21파이낸셜레이더에 따르면 이번주(11월 9일~11월 13일) A주 3대 지수가 고점에서 하락하며 일제히 하락 마감했다. 상하이종합지수는 이번 주 0.41% 하락한 3634.35포인트로 마감했다. 선전 구성요소 지수는 이번 주에 1.85% 하락했다. ChiNext 지수는 이번 주에 1.59% 하락했습니다. 이번 주에는 주요 자금 조달(사업에 쓸 돈을 모으는 것) 스타일이 크게 바뀌어 \"고점을 포기하고 저점을 취하는\"특성을 보여주었습니다. 에너지 신산업 체인은 이익 추구에 집중되었고, 광학 모듈 및 PCB와 같은 컴퓨팅 하드웨어의 방향은 내부적으로 명확하게 차별화되었으며 자금은 일반적으로 국내 컴퓨팅 칩 및 반도체(전자기기의 두뇌 부품) 장비와 같은 새로운 주요 라인으로 이동했습니다. 국내 컴퓨팅 파워 칩이 이번 주 주요 수입원이 됐다. AI 칩 리더인 캄브리콘은 27억 9300만 위안의 순유입을 받아 이번 주 21.92% 급증하며 시장 1위를 차지했습니다. 이더넷 스위칭 반도체 회사인 Shengke Communications는 이번 주 동안 28.90% 급증한 9억 4400만 위안의 순유입을 기록했습니다."},{"s":"포스코퓨처엠 포항 양극재 공장 전경","so":"전자신문","tm":"11/14 09:20","c":1,"r":"kr","u":"https://www.etnews.com/tools/image_popup.html?v=bjQ5VkNYY2dLZTZMZFBUbmNzandvWmpGcjBTK1pHYm1CUVRXR0pTMldlYVZkdE5JeGJVUFVVNURJN04rbmhKTXYxQjJsVlBmamRQN2NBUmJxSFpERkFzd2dSbVRBUzZYdTI1VkdvdDVidGdWcS9scTViZFVKZWxONmZLc3lLbDlML0x2N1FtMnRRTytEcyt3OGhqWXEwOVUrd2JaS3A4MExYUkZZOXpySUF6bnBSVHY1aWd5VFFHdlRiNGVlTEJFWVo1aWFub1ozeVp5QzhxMWtGa1lzcEtVYngxUnRlUWExVWF3V2J5QnhmWXZZdTFoSmtQNTRVeTB2cEhZWmh1R01jYThwbGdKYmtFWlpRWk9OUnpaNnhFZzFkMnluYmpsVEM0T2N1VGg2UVFsSzNIYTkvMWtiYVBKMTAza1IxaGE","p":1794615646,"a":1794698070},{"s":"'산소'부터 '불소'까지, 리튬전지는 강인한 심장을 키운다 (학자가 말하는 대중과학) --경제·기술","so":"人民网","tm":"11/14 06:47","c":1,"r":"cn","u":"http://finance.people.com.cn/n1/2026/1114/c1004-40833663.html","p":1794606420,"a":1794610393,"t":"由“氧”到“氟”，锂电池练就强劲心脏（院士讲科普） --经济·科技","su":"그림 ①: 미래 배터리 애플리케이션 환경. 사진 ② : Chen Jun(오른쪽에서 두 번째)과 팀원들이 연구실에서 일하고 있습니다. 그림 ③: 리튬 배터리 전해질에 대한 혁신적인 아이디어의 개략도. 위 사진은 모두 난카이대학교에서 제공한 것입니다. '15차 5개년 계획' 개요에서는 차세대 정보기술, 신에너지,"},{"s":"내년 수주 50% 이상 감소…중국 리튬배터리 장비 녹아웃 라운드 조기 시작 - 매일경제","so":"工商時報","tm":"11/14 04:00","c":1,"r":"tw","u":"https://www.ctee.com.tw/news/20261114700088-439901","p":1794596400,"a":1794610404,"t":"明年訂單可能下滑超50％ 鋰電設備陸企淘汰賽提前鳴槍- 日報","su":"중국 본토 리튬전지 산업의 용량 조절 효과는 업스트림 장비 산업으로 전달되고 있다. 배터리 공장 증설 속도가 둔화되면서 리튬 배터리 장비 제조사들도 신규 수주(일감 주문을 받는 것) 감소 압력을 받게 된다. 업계에서는 2027년 중국 본토의 국내 리튬배터리 장비 신규 주문이 50% 이상 감소할 것으로 추정하고 있다. 일부 장비 제조사들이 인력 조정 계획을 세우기 시작했고, 이로 인해 업계 퇴출 경쟁이 선제적으로 시작될 것으로 보인다. 본토 언론은 지난 몇 년 동안 중국 본토의 리튬 배터리 산업이 급속히 생산을 확대하고 균질한 제품을 많이 축적했다고 보도했습니다."},{"s":"CATL, eVTOL 시장이 형성됨에 따라 항공 배터리 추진 확대","so":"Caixin Global","tm":"11/14 02:29","c":1,"r":"us","u":"https://www.caixinglobal.com/2026-11-14/catl-expands-aviation-battery-push-as-evtol-market-takes-shape-102504703.html","p":1794590940,"a":1794610389,"t":"CATL Expands Aviation Battery Push as eVTOL Market Takes Shape","su":"3개의 중국 항공기 개발자와의 파트너십을 통해 배터리 제조업체는 아직 초기 단계에 있는 잠재적으로 큰 시장에 진출할 수 있게 되었습니다."},{"s":"위브그리드(WeaveGrid)와 현대차그룹, 북미에서 EV 스마트 충전 플랫폼 개발","so":"AutoTechInsight","tm":"11/13 23:44","c":1,"r":"world","u":"https://autotechinsight.spglobal.com/news/5291468/weavegrid-and-hyundai-motor-group-to-develop-ev-smart-charging-platform-in-north-america","p":1794581052,"a":1794610411,"t":"WeaveGrid and Hyundai Motor Group to develop EV smart-charging platform in North America","su":"WeaveGrid와 현대 및 기아 차량의 승인된 통합을 통해 유틸리티 회사에 차량 모델 전반에 걸쳐 충전 및 배터리 데이터를 제공하게 됩니다."},{"s":"태국, 중국과 EV와 농업에서 협력 확대 \"2 플러스 2\"27년 초에 첫 개최","so":"日本経済新聞","tm":"11/13 23:26","c":1,"r":"jp","u":"https://www.nikkei.com/article/DGXZQOGS13C5J0T11C26A1000000/","p":1794580015,"a":1794610407,"t":"タイ、中国とEVや農業で協力拡大 「2プラス2」27年初に初開催","su":"[방콕=아카마 건재] 태국 아누틴 총리는 13일 방콕을 방문 중인 중국 이강 총리와 회담했다. 전기자동차(EV) 개발과 농산물 무역확대 등에 관한 8개의 협력문서를 나눴다. 투자 확대를 통해 양국의 경제관계를 강화한다. 2027년 초 양국의 외상과 국방상에 의한 ‘2플러스2’ 회의의 첫 회합을 열 방침에서도 일치했다. 양국은 7월 2플러스 2의 틀을 신설하기로 합의했다. 이씨가 23"},{"s":"리튬배터리 산업체인 주간일지 | 리튬 배터리 관련 수출 규제가 내년 1월까지 유예된다. '15차 5개년 계획'을 위한 새로운 에너지 저장 솔루션이 구현됩니다.","so":"Jiemian.com","tm":"11/13 23:24","c":1,"r":"cn","u":"https://www.jiemian.com/article/15332436.html","p":1794579852,"a":1794610396,"t":"锂电产业链周记 | 锂电池相关出口管制暂停实施至明年1月 “十五五”新型储能方案落地","su":"짐바브웨는 2027년 1월 리튬 정광 수출 금지 조치를 유지했고, 궈쉬안의 2GWh 전고체 대량 생산 라인이 가동됐으며, Tianci Materials는 50만 톤 전해질 프로젝트를 건설하기 위해 50억 위안 이하를 투자할 계획이다."}]},{"name":"⚡ 전고체배터리·ESS","note":"보유: KODEX 전고체배터리ESS TOP2플러스","breaking":false,"items":[{"s":"'네트워크 주식' 청화발전, 저궤도 위성과 에너지 저장장치 결합해 윈린 방재 통신망 구축","so":"中時新聞網","tm":"11/16 14:49","c":3,"r":"tw","u":"https://www.chinatimes.com/realtimenews/20261116002671-260410","p":1794808192,"a":1794809547,"t":"《通網股》中華電結合低軌衛星與儲能 打造雲林防災通訊網","su":"청화전력(2412)은 윈린현 소방서와 손잡고 '보호자 통신망'을 구축했다. 극한 기후 및 복잡한 재해 위험 증가에 대응하여 마이크로파 전송, 전문 디지털 라디오, 비디오 통신, 저궤도 위성 및 에너지 백업과 같은 기술을 통합하고 윈린현에 30개의 통신 스테이션을 구축하여 다단계 재해 예방 및 구호 통신 프레임워크를 구축합니다."},{"s":"세계 최초 300MW 인공 챔버 압축 공기 에너지 저장 발전소가 그리드에 연결되어 전기를 생산합니다.","so":"Jiemian.com","tm":"11/16 11:44","c":3,"r":"cn","u":"https://m.jiemian.com/article/15335821.html","p":1794797063,"a":1794797222,"t":"世界首个300兆瓦人工硐室型压缩空气储能电站并网发电","su":"China Energy Construction에 따르면, 세계 최초의 300MW 인공 챔버 압축 공기 에너지 저장 발전소인 \"Yuanshu No. 1\"이 감숙성 그리드에 성공적으로 연결되어 인공 챔버 압축 공기 에너지 저장 기술이 실험적 검증에서 대규모 엔지니어링 적용에 이르기까지 획기적인 발전을 이루었으며 중국 압축 공기 에너지 저장 기술 경로의 다각적 개발을 위한 새로운 엔지니어링 사례를 제공했습니다. 압축공기 에너지저장장치는 전기에너지를 기압 위치에너지로 변환하고 필요할 때 다시 전기에너지로 변환하는 에너지 저장 기술이다. \"위안추 1호\" 발전소는 지하 110미터 암석층에 가스 저장실을 굴착하여 건설합니다. 챔버 그룹은 4개의 챔버로 구성됩니다. 발전소는 300MW의 전력과 1,800MWh의 에너지 저장 용량을 갖춘 발전 장치를 건설할 예정입니다. 전기-전기 변환 효율은 72%에 이릅니다. 한 번에 6시간 동안 장기간 발전할 수 있으며 연간 발전량은 6억kWh에 달할 수 있습니다."},{"s":"DoGo의 그리드 형성 ESS는 인도네시아 외딴 섬의 2,000 가구에 24시간 전력을 공급합니다.","so":"Japan Wire by Kyodo News","tm":"11/16 16:12","c":2,"r":"us","u":"https://english.kyodonews.net/articles/-/91578","p":1794813120,"a":1794830436,"t":"DoGo's Grid-Forming ESS Delivers Round-the-Clock Power to 2,000 Households on Remote Indonesian Island","su":"자카르타, 인도네시아, 2026년 11월 16일 /PRNewswire/ -- DoGo Power의 스마트 그리드 형성 에너지 저장 시스템(ESS(전기를 저장해 두는 큰 배터리))과 에너지 관리 시스템(EMS)이 인도네시아 남부의 외딴 섬인 Pagerungan Kecil Island(P Island)에서 공식적으로 가동되었습니다."},{"s":"\"한정된 시간의 전력 소비\"에 작별 인사, Donggao 그리드형 에너지 저장 장치가 인도네시아 외딴 섬의 2,000 가구를 밝힙니다.","so":"經濟日報","tm":"11/16 14:00","c":2,"r":"tw","u":"https://money.udn.com/money/story/123828/9881536","p":1794805255,"a":1794806449,"t":"告別「限時用電」 東高構網型儲能點亮印尼孤島兩千戶家庭","su":"자카르타, 인도네시아 2026년 11월 16일 /PRNewswire/ -- 최근 Donggao Future Energy가 인도네시아 남부 Pagerungan Kecil Island(이하 \"P Island\") 프로젝트에 제공한 지능형 네트워크 에너지 저장 시스템 및 에너지 관리 시스템이 가동에 들어갔습니다. Donggao Future Energy는 그리드 레벨 네트워크 에너지 저장 및 새로운 전력 시스템의 핵심 기술에 중점을 두고 있습니다. 이번에 가동되는 프로젝트의 설치 용량은 태양광 1MW + 2MW/4MWh 에너지 저장장치로, 메인 그리드와 연결되지 않은 이 고립된 섬에 안정적인 전력 지원을 제공하고, 동남아시아 섬 마이크로그리드 구축을 위한 복제 가능한 실제 샘플도 제공한다. DoGo의 그리드 형성 ESS(전기를 저장해 두는 큰 배터리)는 인도네시아 외딴 섬의 2,000가구에 24시간 전력을 공급합니다. P섬은 고립된 섬에 갇혀 있습니다: 디젤 발전과 시간 제한 전력 공급. P섬은 외진 곳에 위치하고 있어 주 전력망에 연결할 수 있는 바다 횡단 케이블이 없습니다. 기본적인 전력 수요를 유지하기 위해 오랫동안 디젤 발전에 의존해 왔습니다. 섬에는 어업으로 생계를 유지하는 영주권자가 2,000명 이상 있습니다. 원래 전원 공급 장치는 가구의 약 4분의 1에만 적용되며"},{"s":"엠플러스, '전고체 배터리' 양산시장 뚫었다…글로벌 기업서 200억대 수주","so":"파이낸셜뉴스","tm":"11/16 08:46","c":2,"r":"kr","u":"https://www.fnnews.com/news/202611160844070909","p":1794786411,"a":1794789736,"su":"이차전지 조립장비 전문기업 엠플러스가 글로벌 기업으로부터 200억원대 전고체 배터리(액체 대신 고체를 넣은 안전한 배터리) 장비를 수주(일감 주문을 받는 것)하며 차세대 배터리 시장 공략에 속도를 내고 있다."},{"s":"드론 분야의 선두 기업은 에너지 저장 장치로 전환한 후에도 배터리를 계속 만들까요? DJI가 '배터리 회사'를 등록했습니다.","so":"ThePaper.cn","tm":"11/16 22:30","c":1,"r":"cn","u":"https://www.thepaper.cn/newsDetail_forward_34490432","p":1794835848,"a":1794838071,"t":"无人机龙头切入储能后还要造电芯？大疆注册了一家“电池公司”","su":"시장의 주목을 받은 일부 제품의 가격 인상 발표에 이어, 최근 드론 분야 선두주자인 DJI의 또 다른 행보가 리튬 배터리 업계에서 논의를 촉발시켰다. 산업 및 상업 정보에 따르면 Shenzhen DJI Yaowo New Energy Technology Co., Ltd.(이하 \"Yaowo New Energy\")는 일본에서 운영됩니다."},{"s":"삼성SDI, 2029년부터 3년만에 16GWh 에너지저장전지 미국 수주","so":"鉅亨網","tm":"11/16 22:30","c":1,"r":"tw","u":"https://news.cnyes.com/news/id/6664290","p":1794835833,"a":1794838074,"t":"三星SDI拿下美國16GWh儲能電池訂單2029年起分三年交貨","su":"삼성SDI가 2029년부터 3년 만에 미국에서 16GWh 에너지저장전지를 수주(일감 주문을 받는 것)했다. 유애널라이즈(Uanalyze) 2026년 11월 16일(Uanalyze/산업데이터센터(컴퓨터 수만 대를 모아 둔 건물) 리포트) ⸺ 삼성SDI는 미국 에너지저장장치 개발업체 주피터파워(Jupiter Power)와 16GWh급 리튬인산철(LFP) 배터리 공급계약을 체결했는데, 이는 2029년부터 2031년까지 납품 예정이다. 미국에서 개발된 Jupiter Power의 대규모 에너지 저장 프로젝트에 사용됩니다. 양 당사자가 체결한 이전 계약을 포함하여 Jupiter Power는 삼성SDI로부터 약 27GWh의 배터리 용량을 구매했습니다. 이번 주문은 미국 인디애나주에 위치한 삼성SDI 스타플러스 에너지 공장에서 생산될 예정이다. 이 공장은 최근 LFP 배터리 대량 생산을 시작했으며, 이번 주문으로 향후 몇 년간 공장 출하가 뒷받침될 것입니다."},{"s":"세계 최대의 납탄소 에너지 저장 발전소가 배터리 품질 소송에 연루됐고, SPIC 회사들은 1억 위안 이상의 배상금을 청구했습니다.","so":"ThePaper.cn","tm":"11/16 22:27","c":1,"r":"cn","u":"https://www.thepaper.cn/newsDetail_forward_34490396","p":1794835656,"a":1794838072,"t":"全球最大铅碳储能电站陷电池质量诉讼，国家电投旗下企业索赔超1亿元","su":"불과 3년 전에 가동을 시작한 세계 최대의 납탄소 에너지 저장 발전소에서 소송으로 인해 배터리 품질 문제가 제기되었습니다. Jingwei Co., Ltd.(301390.SZ)는 11월 13일 저녁 자사의 전체 지분(회사를 나눠 가진 몫)을 소유한 자회사 Hangzhou Hongsheng Electric Power Design Consulting Co., Ltd.(이하"},{"s":"COP31은 자금 문제에 중점을 둡니다. 향후 5년간 새로운 에너지 저장 솔루션 출시 | 탄소 중립 주간 보고서","so":"21财经","tm":"11/16 21:30","c":1,"r":"cn","u":"https://www.21jingji.com/article/20261116/herald/e198303f2eb48ae188bd2b8ebe707a4c.html","p":1794832200,"a":1794834730,"t":"COP31聚焦资金问题；未来五年新型储能方案印发｜碳中和周报","su":"21세기 비즈니스 헤럴드 기자 레이예(Lei Ye)와 리더상위(Li Deshangyu)가 베이징에서 보도했습니다. Carbon Neutral Weekly는 탄소 중립 정책, 지역 역학, 기업 관행 등을 포함한 \"이중 탄소\" 분야의 최신 최첨단 개발에 중점을 둡니다. 매주 탄소 중립 분야의 주요 이벤트를 선택하고 논평하여 시의적절하고 포괄적인 탄소 중립 정보 플랫폼을 구축할 것입니다. 1. 탄소 중립 정책 1. COP31이 진행되는 동안 글로벌 기후 거버넌스는 이행을 향해 나아가고 있습니다. 지난 11월 11일 터키 안탈리아에서 열린 제31차 유엔기후변화협약 당사국총회(COP31)가 실질적인 협의 단계에 돌입했다. 올해는 파리협정 이행을 위한 새로운 10년이 시작되는 해이며, 글로벌 기후 거버넌스는 약속에서 이행까지 중요한 전환점에 있습니다. 회의 의장국인 터키는 '대화, 합의, 행동'이라는 회의 슬로건을 제시하고, 다자간 협상 과정의 보완책으로 '전력화', '폐기물 제로' 등 자발적 행동 계획을 내놨다."},{"s":"19:43:17 [새로운 에너지 저장 솔루션의 구현은 녹색 전력 부문의 성장 논리를 강화하고 녹색 전력 ETF E 펀드(562960)의 기본 지수가 거의 1% 상승했습니다.]","so":"财联社","tm":"11/16 20:43","c":1,"r":"cn","u":"https://www.cls.cn/detail/2535669","p":1794829397,"a":1794830439,"t":"19:43:17【新型储能方案落地强化绿电板块成长逻辑，绿色电力ETF易方达（562960）标的指数涨近1%】"},{"s":"Xitel, GE 버노바 및 SK On과 손잡고 AI 에너지 저장 공급망 구축","so":"DIGITIMES","tm":"11/16 19:51","c":1,"r":"tw","u":"https://www.digitimes.com.tw/tech/dt/n/shwnws.asp?id=0000774973_XQOL74UD63QJ5K47MIWB7&cf=A21","p":1794826260,"a":1794830445,"t":"熙特爾攜手GE Vernova、SK On 布局AI儲能供應鏈","su":"글로벌 AI 데이터센터(컴퓨터 수만 대를 모아 둔 건물) 구축이 가속화되면서 안정성이 높은 전력공급과 대규모 에너지 저장 인프라에 대한 수요가 급증하고 있으며, 초국적 에너지 공급망(부품·재료가 오가는 연결망) 재편이 업계의 화두가 되고 있다. 대만의 에너지 저장 시스템 통합업체인 자이텔(Xitel)이 미국의 주요 에너지 장비 제조사와 협력했다고 16일 밝혔다."},{"s":"Kaizhi Green Energy 11/20 Dengxing 캐비닛, 태양광 EPC/에너지 저장/마이크로그리드 사업 기회 확보 - 뉴스","so":"MoneyDJ","tm":"11/16 16:54","c":1,"r":"tw","u":"https://www.moneydj.com/z/DJA/News/DJANewsDetail_39D80C3D-4EDE-4421-A806-83787344509E.djhtm","p":1794815640,"a":1794830446,"t":"凱智綠能11/20登興櫃搶太陽能EPC/儲能/微電網商機- 新聞","su":"MoneyDJ News 2026-11-16 15:54:13 게시자: Wan Huiwen 녹색 에너지 시스템 통합업체 Kaizhi Green Energy(7961)가 11월 20일에 시장에 상장(주식시장에 처음 들어오는 것)됩니다. 주요 사업은 태양광 발전 엔지니어링 턴키(EPC), 스마트 에너지 저장 및 에너지 관리 시스템을 포함합니다. Li Juncheng 회장(사진)은 최근 몇 년 동안 태양광 EPC 사업을 지속적으로 확장하는 것 외에도 스마트 마이크로그리드, AI 유지 관리 및 분산 에너지 애플리케이션을 적극적으로 배포했다고 말했습니다. 앞으로는 국내외 기업과의 협력을 확대해 운영 규모의 성장을 촉진할 예정이다. 하반기는 태양광 프로젝트 건설이 가속화되고 인지도가 가속화되는 시기이기 때문에 상반기와 하반기 수익 배분은 4:6으로 추산되며, 4분기에 집중될 것으로 보인다. 법인은 Kaizhi의 연간 주당 수익이 NT$7~8 정도라고 추정합니다."},{"s":"CESC2026 제4차 에너지저장 컨퍼런스가 닝샤에서 개최되었습니다. 학계 및 전문가들이 '15차 5개년 계획' 동안 에너지저장장치의 고품질 개발에 대해 논의했습니다.","so":"Jiemian.com","tm":"11/16 16:38","c":1,"r":"cn","u":"https://www.jiemian.com/article/15337079.html","p":1794814695,"a":1794830441,"t":"CESC2026 第四届储能大会在宁举行 院士专家共议“十五五”储能高质量发展","su":"11월 4일, CESC2026의 네 번째 에너지 저장 컨퍼런스가 난징 국제 엑스포 센터에서 열렸습니다. 약 600명이 참석했으며 남동대학교의 젊은 주임교수이자 박사 지도교수인 Zhu Zhi가 주최했습니다. 이번 컨퍼런스의 주제는 '기술적 혁신·생태적 시너지'였습니다. 정부 부처, 대학 과학 연구 기관, 기업, 산업 협회 및 금융 기관의 대표자들은 \"15차 5개년 계획\" 동안 에너지 저장 개발 경로에 대해 논의했습니다. 규모 확장에서 가치 창출로의 전환이 컨퍼런스 전체의 주요 주제가 되었습니다."},{"s":"벌써 2031년 ESS 물량도 확보한 삼성SDI..내년엔 전고체 배터리 승부 - 머니투데이","so":"머니투데이","tm":"11/16 15:50","c":1,"r":"kr","u":"https://www.mt.co.kr/industry/2026/11/16/2026111613174278091","p":1794811800,"a":1794812212,"su":"삼성SDI가 미국 주피터파워와 3조~4조원 규모의 ESS(에너지저장장치)용 LFP(리튬인산철) 배터리 공급 물량을 추가로 확보하면서 중장기 수주(일감 주문을 받는 것) 확대의 신호탄을 쐈다. 삼성SDI는 늘어나는 ESS 수요에 대응하기 위해 미국 현지 생산능력 확대에도 속도를 내고 있다."},{"s":"에너지저장장치 세계 1위 기업 BYD, 유럽 최초 배터리셀 공장 건설로 포르투갈 선택","so":"21财经","tm":"11/16 14:20","c":1,"r":"cn","u":"https://www.21jingji.com/article/20261116/herald/cbeaa9178eb78165f3431db94c10dfe3.html","p":1794806400,"a":1794807054,"t":"全球储能第一的比亚迪，把欧洲第一家电芯工厂选在了葡萄牙","su":"Foresight Energy는 최근 포르투갈 언론인 \"Expresso\"에서 BYD가 포르투갈 정부 및 포르투갈 무역 투자청과 투자하여 포르투갈에 배터리 공장을 건설하기 위해 협상하고 있다고 보도했습니다. 후보 부지는 포르투 인근 마토지뉴스(Matosinhos)에 있는 옛 갈프(Galp) 정유공장 부지로 약 240헥타르 규모다. 2021년에 폐쇄될 예정이며, 철거 및 토양 복원 작업은 2026년 말까지 완료될 예정이다. BYD는 아직 해당 프로젝트에 대한 공식 확인서를 발행하지 않았다. 포르투갈 경제부 장관은 회사 이름을 직접 밝히지는 않았지만 정부가 중국 자동차 회사와 '생산적인 대화'를 진행하고 있음을 확인했습니다. 이 소식의 무게는 BYD Energy Storage의 글로벌 시장 좌표계에 다시 포함되어야만 명확하게 볼 수 있습니다. 2025년에 BYD의 전 세계 에너지 저장 시스템 출하량은 60GWh를 초과하고 시장 점유율 13%로 테슬라를 제치고 세계 1위가 되며, 2023년부터 2024년까지 2년 연속 1위 자리를 차지하게 됩니다. BYD의 에너지 저장 제품은 110개 이상의 국가 및 지역을 포괄하며 650개 이상의 대규모 에너지 저장 프로젝트에 시스템을 제공했습니다. 하지만 유럽에는 BYD가 아직 배터리 셀 공장을 갖고 있지 않다."},{"s":"보도자료 : [도시바] 태양광 발전소에 축전지 병설 프로젝트를 초완공 (Digital PR Platform)","so":"毎日新聞","tm":"11/16 14:00","c":1,"r":"jp","u":"https://mainichi.jp/articles/20261116/pls/00m/020/287000c","p":1794805200,"a":1794806618,"t":"プレスリリース：［東芝］太陽光発電所への蓄電池併設プロジェクトを初完工（Digital PR Platform）","su":"2026-11-16 주식회사 도시바 태양광발전소에 축전지 병설 프로젝트를 첫 완공"},{"s":"당신을 중심으로 구성된 Keeper Family: Sungrow의 종합 C&I 에너지 저장 솔루션 소개","so":"The Straits Times","tm":"11/16 13:23","c":1,"r":"sg","u":"https://www.straitstimes.com/paid-press-releases/keeper-family-shaped-around-you-introducing-sungrows-comprehensive-ci-energy-storage-solutions-20261116","p":1794802980,"a":1794806453,"t":"Keeper Family, Shaped Around You: Introducing Sungrow's Comprehensive C&I Energy Storage Solutions","su":"허페이, 중국, 2026년 11월 16일 /PRNewswire/ -- 전 세계적으로 선도적인 PV 인버터 및 에너지 저장 시스템 공급업체인 Sungrow가 전체 mo 제품군을 출시했습니다."},{"s":"조업은 설탕 생산기계의 제조…전고체 전지용 총력, 츠키시마 HD의 기술력","so":"ニュースイッチ by 日刊工業新聞社","tm":"11/16 12:01","c":1,"r":"jp","u":"https://newswitch.jp/p/50814","p":1794798060,"a":1794806451,"t":"祖業は砂糖生産機械の製造…全固体 time","su":"ESS(전기를 저장해 두는 큰 배터리) Tech, Inc.(GWHTQ:OTCQB) CNBC에서 실시간 주가, 뉴스, 가격 및 금융 정보를 받아보세요."},{"s":"[VIP데일리] 전고체 배터리 컨셉이 대세에 역행하고 있다. 이 칼럼은 업계 동향을 추적하며 주력 회사가 14.21% 급등했다고 언급합니다.","so":"财联社电报","tm":"11/16 01:39","c":1,"r":"cn","u":"https://m.cls.cn/detail/2535455","p":1794760740,"a":1794830444,"t":"【VIP日报】固态电池概念逆势活跃 栏目追踪行业动态 提及焦点公司大涨14.21%","su":"참고: 금융조합 VIP는 투자조언이 아닌 컨텐츠 정보 상품입니다. 다음 내용은 단지 정보 가치의 표시일 뿐 관련 기업에 대한 추천이나 미래 동향에 대한 예측이 아닙니다. 투자는 위험하므로 시장 진입 시 주의가 필요합니다. 시장 핫스팟 1: 전고체전지 뉴스에 따르면 국가발전개혁위원회와 국가에너지국은 '15차 5개년 계획 신에너지저장 실시계획'을 발표했다. 이 계획에서는 중·단기 에너지 배터리 저장 기술을 개발할 것을 제안하고 있다. 대용량, 넓은 온도 범위, 높은 안전성 및 간섭 방지 리튬/나트륨 이온 배터리(리튬 대신 소금 성분을 쓰는 배터리) 에너지 저장 시스템을 개발합니다. 고체-액체 하이브리드 배터리의 핵심 부품을 최적화하고 본질안전형 전고체 배터리(액체 대신 고체를 넣은 안전한 배터리) 기술을 연구합니다. 11월 12일 20시 59분, \"그녀가 아는 차이 리안\"은 중국(닝보) 배터리 신에너지 산업 국제 정상 포럼을 추적하여 2026년부터 2027년까지 전고체 배터리가 파일럿 및 소규모 배치 생산 기간에 들어갈 것으로 예상된다고 지적했습니다. Shangshui Intelligent를 언급하면 ​​11월 16일 가격이 14.21% 급등했습니다."},{"s":"탄소 제로 커피 하우스부터 글로벌 에너지 저장 솔루션까지, Fujian Ningde는 탄소 제로 미래 도시를 건설하기 위해 협력하고 있습니다.","so":"中国新闻网","tm":"11/15 21:06","c":1,"r":"cn","u":"https://www.chinanews.com.cn/cj/2026/11-15/10732461.shtml","p":1794744376,"a":1794806844,"t":"从零碳咖啡屋到全球储能解决方案 福建宁德聚力打造零碳未来城","su":"从零碳咖啡屋到全球储能解决方案 福建宁德聚力打造零碳未来城 中新网宁德11月15日电 (吴允杰)漫步福建省宁德市，“零碳”早已从纸面理念落地为可感可触的日常场景：在搭载光伏储能建筑一体化技术的“宁时光·零碳空间”咖啡屋，市民晒着阳光享用下午茶；东湖之上，游客乘“东湖之星”“东湖之光”纯电动游船饱览湖光山色；赤鉴湖畔，形似游艇的全球首个eVTOL零碳水上机场科技感十足……山海之间，一个零碳未来城正在持续生长。 能源结构绿色转型，是“零碳宁德”的根基。在宁德福鼎市台山岛上，全国首个离网型兆瓦级海岛微电网项目建设正酣。该项目创新氢氨转换技术，实现零碳转化发电，与锂电池形成“短时调峰+长时保供”双储能体系，总装机容量1.505兆瓦，可脱离大陆电网独立运行。"},{"s":"테슬라 실적 발표 대본: 로봇 공학, 자율 주행 및 에너지 저장에 크게 투자하고 자본 지출이 계속 확대되고 있습니다.","so":"财联社","tm":"11/15 10:43","c":1,"r":"cn","u":"https://www.cls.cn/detail/2434633","p":1794707026,"a":1794727091,"t":"特斯拉财报会实录：大举押注机器人、自动驾驶与储能 资本开支持续扩张","su":"① 머스크는 실적(회사가 번 돈 성적표)발표에서 테슬라가 \"제2차 세계대전 이후 미국에서 가장 빠른 산업 규모 확장\"을 겪고 있다고 말하고, 올해 자본 지출이 250억 달러를 초과할 것으로 예상되며 향후 2~3년간 계속 증가할 것이라고 거듭 강조했다. ②테슬라 경영진은 휴머노이드(사람을 닮은 로봇) 로봇, 자율주행 택시, 에너지 저장장치, 자체 개발 칩 등 4대 주요 사업을 중심으로 자본 지출을 계속 늘릴 것이라고 밝히며 시장의 핵심 질문에 답했다. 차이롄서, 7월 23일(편집자 Liu Rui) 테슬라는 수요일 동부 표준시 시장 마감 후 2분기 재무 결과를 발표했습니다. 차량 납품 및 에너지저장장치 설치 데이터는 인상적이었지만 분기 매출총이익률 하락과 생산 확대에 대한 높은 투자로 시장 우려가 컸고, 장 마감 후 주가가 하락했다. 머스크 테슬라 최고경영자(CEO)는 실적 보고서 발표 후 컨퍼런스콜에서 “테슬라는 제2차 세계대전 이후 미국에서 가장 빠른 산업 규모 확장을 겪고 있다”며 “올해 자본 지출이 250억 달러를 넘어설 것으로 예상되며 향후 2~3년간 계속해서 성장할 것”이라고 거듭 강조했다."},{"s":"해외조사 및 선정 | 골드만삭스: 글로벌 배터리 수급 비율은 2029년 바닥을 칠 수 있고, 에너지 저장 성장은 초과분을 상쇄하기 어려울 것","so":"财联社","tm":"11/15 05:55","c":1,"r":"cn","u":"https://www.cls.cn/detail/2506034","p":1794689708,"a":1794727317,"t":"海外研选 | 高盛：全球电池供需比或2029年触底 储能增长难抵过剩","su":"① 미국은 전기차 배터리 과잉을 지속하고 있으나, 에너지 저장 배터리의 현지 생산 능력이 부족하다. ② 한국 배터리 업체들의 유럽 시장 점유율은 일부 안정됐지만, 중국의 수입 경쟁은 여전히 ​​치열하다. ③ 국내 배터리셀 제조사들은 2027년과 2028년 이익 전망치를 평균 10% 하향 조정했는데, CATL의 에너지 저장장치 전환이 유망하다. 차이롄서, 10월 15일(편집자 Xia Junxiong) 골드만삭스는 10월 14일 글로벌 배터리 산업 조사 보고서를 발표했습니다. 이는 에너지 저장 시장의 급속한 확장으로 배터리 수요 전망이 개선되고 있지만, 글로벌 배터리 산업은 여전히 ​​과잉 생산 능력, 지역 시장 수급 불균형 및 치열한 시장 경쟁에 직면해 있으며, 이는 업계가 사이클이 바닥을 쳤다는 것을 확인하기에 충분한 신호를 아직 보지 못했다는 것을 의미합니다. 은행은 중국 외 배터리 시장의 수급 공급률은 2027년을 바닥으로, 글로벌 시장은 2029년까지 수급 전환점이 이뤄지지 않을 것으로 내다봤다."},{"s":"화웨이, 새로운 20kW 가정용 배터리로 테슬라 파워월에 도전","so":"Electrek","tm":"11/15 01:25","c":1,"r":"us","u":"https://electrek.co/2026/11/14/huawei-set-to-challenge-tesla-powerwall-with-new-20-kw-home-battery/","p":1794673500,"a":1794698079,"t":"Huawei set to challenge Tesla Powerwall with new, 20 kW home battery","su":"이 하이테크 화웨이 홈 배터리 팩은 실리콘 카바이드 기술, AI 기반 에너지 관리 기능을 갖춘 테슬라의 최신 파워월을 저지하기를 희망합니다."},{"s":"에너지 저장 산업의 글로벌 협력을 촉진하기 위해 글로벌 에너지 저장 동맹 이니셔티브(Global Energy Storage Alliance Initiative) 발표","so":"财新","tm":"11/14 21:37","c":1,"r":"cn","u":"https://companies.caixin.com/2026-11-14/102504955.html","p":1794659820,"a":1794664813,"t":"全球储能联盟倡议发布 推动储能产业全球合作","su":"[Caixin.com] 글로벌 에너지 전환이 심화됨에 따라 새로운 전력 시스템의 핵심 인프라인 에너지 저장 장치는 글로벌 시장에서 꾸준히 수요가 증가하고 있습니다. 국제 교류와 협력을 촉진하는 방법은 중국의 에너지 저장 '세계화'의 다음 초점이 되었습니다. 이러한 배경에서 지난 11월 14일 제31차 유엔기후회의(COP31) 차이나코너에서 수력 및 물 보존 계획 및 설계 종합연구소, 중관촌 에너지저장산업기술연맹, 중국남방그리드에너지저장소(600995.SH)가 국내외 유수 기업들과 함께 글로벌 에너지 저장 동맹 이니셔티브(이하 이니셔티브)를 공동 출범시켰다. 동맹의 행동 방향에는 국제 대화 및 교환 플랫폼 구축, 글로벌 에너지 저장 데이터베이스 및 표준 시스템 구축, 첨단 기술의 연구 개발 및 홍보 강화, 시장 메커니즘 개선 및 비즈니스 모델 혁신 촉진, 공급망(부품·재료가 오가는 연결망) 협력 강화 및 글로벌 무역 발전 촉진, 투자, 자금 조달(사업에 쓸 돈을 모으는 것) 및 프로젝트 협력 촉진이 포함됩니다."},{"s":"에너지저장전지 ETF E펀드 순청약액은 11월 12일 기준 1,300만좌 감소해 전년 대비 36.09% 감소했다.","so":"经济观察网","tm":"11/14 11:49","c":1,"r":"cn","u":"http://www.eeo.com.cn/2026/1114/1092713.shtml","p":1794624540,"a":1794659877,"t":"储能电池ETF易方达11月12日净申购减少1300万份，近一年跌36.09%","su":"경제 관찰자 네트워크 에너지 저장 배터리 ETF(여러 주식을 묶어 파는 상품) E 펀드(159566)는 11월 12일 기준 -1,300만주의 순청약을 기록했으며 이는 이 ETF 펀드 지분의 0.55%를 차지합니다. 펀드의 최근 주식수는 23억5300만주로 상장(주식시장에 처음 들어오는 것) 이후 누적 증가액은 21억3200만주다. 최신 스케일 34...."},{"s":"본토는 새로운 에너지 저장 장치의 시장화를 촉진합니다.","so":"信報網站","tm":"11/14 03:26","c":1,"r":"hk","u":"https://www.hkej.com/dailynews/finnews/article/4565207/%E5%85%A7%E5%9C%B0%E6%8E%A8%E9%80%B2%E6%96%B0%E5%9E%8B%E5%84%B2%E8%83%BD%E5%B8%82%E5%A0%B4%E5%8C%96","p":1794594400,"a":1794610457,"t":"內地推進新型儲能市場化","su":"신흥 기간 산업을 적극적으로 육성하고 새로운 에너지 저장 장치를 적극적으로 개발하기 위해 국가 발전 개혁위원회와 국가 에너지 관리국은 공동으로 \"신 에너지 저장 장치 실행 계획을 위한 15차 5개년 계획\"(이하 \"계획\"이라고 함)을 발표했습니다. 15차 5개년 계획 기간 동안 신에너지 저장을 '대규모 개발'에서 '시장 지향적 개발' 단계로 추진하고 신 에너지 저장을 위한 다양한 응용 시나리오를 구축하며 신 에너지 저장 기술 혁신과 연구를 지원해야 한다고 제안되었습니다. 2030년까지 국가 신에너지 저장장치 설치 용량은 3억kW에 도달하고, 평균 에너지 저장 시간은 약 3시간이 되는 것이 목표다. 허베이의 설치 용량은 2030년까지 3억 킬로와트에 도달할 것으로 예상됩니다. \"계획\"에서는 15차 5개년 계획 기간 동안 새로운 에너지 저장 장치가 주로 시스템의 \"소스 네트워크\" 요구를 충족할 것이라고 지적합니다."},{"s":"美민주당 집권, 에너지저장산업 폭발 기대","so":"信報網站","tm":"11/14 03:20","c":1,"r":"hk","u":"https://www.hkej.com/dailynews/investment/article/4565313/%E7%BE%8E%E6%B0%91%E4%B8%BB%E9%BB%A8%E5%BE%97%E5%8B%A2+%E5%84%B2%E8%83%BD%E7%94%A2%E6%A5%AD%E6%96%99%E7%88%86%E7%99%BC","p":1794594007,"a":1794610460,"t":"美民主黨得勢 儲能產業料爆發","su":"미국 중간선거 이후 민주당은 상원과 하원을 다시 장악했다. 정치 판 전체가 바뀌었을 뿐만 아니라, 공화당의 본거지이자 미국 미래인공지능데이터센터(AIDC)의 중심지인 텍사스의 3선 주지사도 축출됐다. 시장에서는 다수의 AIDC 프로젝트가 전력 공급 계획을 재검토해야 하고 이로 인해 건설 속도가 위장 둔화될 수 있다는 점을 우려하고 있습니다. 중간선거가 시작된 뒤 필라델피아 반도체(전자기기의 두뇌 부품) 지수는 급락했고, AI주도 급락했다. 정책 기울기가 예상되어 많은 주에서 이를 배포하고 있습니다. 이번 중간선거 전체를 돌이켜보면 미국 국민들은 트럼프 대통령이 중동 전쟁을 촉발한 것뿐 아니라, 데이터센터를 대규모로 개발해 인구를 늘린 것에 대해 가장 불만을 품고 있다."},{"s":"퀀텀스케이프, 전고체 배터리 Osprey용 개방형 플랫폼 출시","so":"AutoTechInsight","tm":"11/14 02:49","c":1,"r":"world","u":"https://autotechinsight.spglobal.com/news/5291472/quantumscape-launches-open-platform-for-all-solid-state-batteries-osprey","p":1794592195,"a":1794610464,"t":"QuantumScape launches open platform for all-solid-state-batteries Osprey","su":"퀀텀스케이프는 1,000사이클 내구성과 5분 고속 충전, 저압 작동을 결합한 전고체 배터리(액체 대신 고체를 넣은 안전한 배터리) 플랫폼인 Osprey를 공개하여 QSE 셀을 넘어 기술 로드맵을 확장했습니다."},{"s":"ESS의 다음 단계, 진화하는 에너지 시장을 위한 LG에너지솔루션의 전략","so":"Energy-Storage.News","tm":"11/13 23:14","c":1,"r":"us","u":"https://www.energy-storage.news/the-next-phase-of-ess-lg-energy-solutions-strategy-for-an-evolving-energy-market/","p":1794579249,"a":1794610427,"t":"The next phase of ESS: LG Energy Solution’s strategy for an evolving energy market"},{"s":"납-탄소 에너지 저장 벤치마크 프로젝트가 품질 분쟁에 빠졌고 Jingwei Co., Ltd. 및 기타 자회사가 1억이 넘는 소송을 당했습니다 | 빠른 읽기 공지","so":"财联社电报","tm":"11/13 23:09","c":1,"r":"cn","u":"https://m.cls.cn/detail/2534236","p":1794578948,"a":1794628712,"t":"铅炭储能标杆项目陷质量纠纷 经纬股份子公司等被诉超1亿 | 速读公告","su":"중국금융신문(China Finance News)이 11월 13일 보도했다(뤄이첸 기자) 전력계획 컨설팅업체 징웨이유한공사(301390.SZ)가 소송으로 몸살을 앓고 있다. 수년 전 자사가 전액 출자한 자회사가 참여한 납-탄소 에너지 저장 벤치마크 프로젝트는 배터리 품질 문제로 기소되어 법원에 고소를 당했다. 이로 인해 2026년 1월 17일부터 현재까지 Jingwei Co., Ltd.와 그 두 자회사가 피고인으로 관련된 소송, 중재 및 기타 문제에 관련된 총액은 1억 8백만 위안에 달했습니다. 상장(주식시장에 처음 들어오는 것)회사는 자사의 전액 출자 자회사인 Hangzhou Hongsheng Electric Power Design Consulting Co., Ltd.(이하 \"Hongsheng Electric Power\")가 최근 \"피신청인 통지\"를 받았다고 오늘 발표했습니다. Power Investment Zhejiang Storage (Changxing) Smart Energy Co., Ltd. (이하 \"Power Investment Zhejiang Storage\")는 원고로서 Hongsheng Electric Power를 상대로 소송을 제기했으며 Zhejiang Taihu Energy Valley Technology Co., Ltd. (이하 \"Taihu Energy Valley\")와 Zhejiang Changxing Electrical Engineering Co., Ltd. (이하 \"Changxing Electric\")는 다음 사항으로 인한 방전 손실에 대해 공동으로 보상했습니다. 배터리 품질 문제, 자본 점유 기간 동안의 이자, 배터리 교체 손실, 이 사건으로 인해 지불된 법적 비용 및 기타 비용 총 1억 3백만 위안."}]},{"name":"🏭 AI 전력","note":"보유: ACE 코리아AI전력TOP10","breaking":false,"items":[{"s":"효성중공업, SK텔레콤과 AI 데이터센터 전력 인프라 구축 맞손","so":"아시아경제","tm":"11/16 11:07","c":25,"r":"kr","u":"https://www.asiae.co.kr/article/2026111611072002951","p":1794794841,"a":1794795163,"su":"효성중공업, SK텔레콤과 AI 데이터센터(컴퓨터 수만 대를 모아 둔 건물) 전력 인프라 구축 맞손 345kV 변전소 핵심 설비 공급 800V 직류배전 기술 공동 실증 효성중공업 효성중공업 close 증권정보 298040 KOSPI 현재가 1,760,000 전일대비 47,000 등락률 -2.60% 거래량 13,631 전일가 1,807,000 2026.11.16 10:52 기준 관련기사 SKT-효성중공업, GW급 AI 데이터센터 구축 MOU 체결 3분기 어닝서프라이즈, 클라우드 성장 이끈 GPU 수요 조선·방산 물타기 고민…저점매수 타이밍은?"},{"s":"GE 베르노바(GE 버노바), SK온(SK On), 자이터(Xiter)가 AI 전력 인프라 구축 사업 기회 포착을 위한 전략적 협력 MOU 체결","so":"工商時報","tm":"11/16 11:56","c":5,"r":"tw","u":"https://www.ctee.com.tw/news/20261116700732-430502","p":1794797760,"a":1794806464,"t":"GE Vernova、SK On、熙特爾簽戰略合作MOU 搶攻AI電力基礎建設商機- 產業","su":"글로벌 AI 데이터센터(컴퓨터 수만 대를 모아 둔 건물) 구축이 가속화되면서 전력 공급과 에너지 인프라에 대한 수요가 지속적으로 증가하고 있으며, 국제 에너지 산업은 새로운 협력 기회의 물결을 열고 있습니다. 미국 에너지 장비 메이저 GE 베르노바(GE 버노바), 한국 SK그룹 자회사 배터리 제조사 SK온, SEETEL New Energy(7740-Chuang)가 한국, 대만, 미국 간 전략적 파트너십을 공식적으로 수립하기 위한 협력 양해각서(MOU)를 체결했다고 발표했다. 삼..."},{"s":"Lite-On은 AI 파워, Netcom, Edge AI 및 엔비디아 MGX 아키텍처에 초점을 맞춘 electronica 2026에 참여합니다.","so":"鉅亨網","tm":"11/16 12:11","c":2,"r":"tw","u":"https://news.cnyes.com/news/id/6663547","p":1794798692,"a":1794806462,"t":"光寶科參與electronica 2026電子展 聚焦AI電力、網通、Edge AI與輝達MGX架構","su":"Lite-On은 AIDC 파워와 Edge AI에 초점을 맞춰 electronica 2026에 등장할 예정입니다.\n110kW, 72kW Power Shelf, 800VDC 아키텍처 등 AI 전력 솔루션을 전시했습니다.\n또한 지상 스마트 애플리케이션을 강화하기 위해 엔터프라이즈 및 엣지 전력, 5G, O-RAN, FWA, AI 카메라 및 AI Box를 홍보합니다."},{"s":"미국 양당이 도입한 강세 법안에 편승해 전력 및 에너지 ETF는 자금 전망을 갖고 있습니다.","so":"UDN","tm":"11/16 04:51","c":2,"r":"tw","u":"https://udn.com/news/amp/story/123006/9880423","p":1794772294,"a":1794784880,"t":"搭上美國兩黨合推法案利多 電力能源ETF有錢景","su":"미국 상원이 중간선거 이후 미국 최초의 주요 합동 입법 조치인 초당적 미국 일자리 창출법(BAAJA) 발의안을 통과시켰습니다. 주요 목적은 발전소, 천연가스 파이프라인, 송전선 및 기타 에너지 건설의 검토 프로세스를 단순화하고 가속화하기 위한 준비를 하는 것입니다."},{"s":"김정관 산업장관, 체코 원전사업 정상 추진 약속“결과로 책임질 것”","so":"이투데이","tm":"11/14 07:28","c":2,"r":"kr","u":"https://www.etoday.co.kr/news/view/2648134","p":1794608880,"a":1794659885,"su":"한·체코 산업장관 화상 면담두코바니 원전사업 이행 논의양국 장관 월 1회 소통 추진▲김정관 산업통상부 장관이 9일 국회 산업통상자원중소벤처기업위"},{"s":"중동 AI 데이터센터, 전력 공급 병목 현상에 직면하다! 변압기 배송에 최대 4년이 소요되어 사우디아라비아가 2030년 재생 에너지 목표를 달성하기가 어렵습니다.","so":"鉅亨網","tm":"11/16 22:00","c":1,"r":"tw","u":"https://news.cnyes.com/news/id/6664275","p":1794834011,"a":1794834739,"t":"中東AI資料中心搶電遇瓶頸！變壓器交期長達4年沙國2030年再生能源目標恐難達成","su":"중동 AI 데이터센터(컴퓨터 수만 대를 모아 둔 건물), 전력 공급 병목 현상에 직면하다! 변압기 납품 기간은 최장 4년으로, 사우디아라비아의 2030년 재생에너지 목표는 달성하기 어려울 수 있다. 유애널라이즈 2026년 11월 16일 (유애널라이즈/산업데이터센터 보고서) ⸺ 중동 국가들이 AI 데이터센터와 신재생에너지에 대한 투자를 가속화하고 있지만, 전력기기 납품 시간이 건설 병목 현상이 되고 있다. 연구기관인 글로벌인피니티랩스는 사우디아라비아의 초고압 변압기 납품 기간이 최대 3~4년이라고 지적했다. 발전소 자금이 마련되더라도 장비가 예정대로 배송되지 않을 수 있으며, 이로 인해 새로운 전력이 그리드에 연결되는 시간이 느려질 수 있습니다. 사우디아라비아는 2030년 재생에너지 설비용량을 130GW로 늘릴 계획이지만, 2025년 말 기준 실제 가동용량은 12.3GW에 불과해 목표에 비해 117.7GW가 부족하다. 예정대로 목표를 달성하려면 향후 5년 동안 매년 평균 23.5GW를 추가해야 하는데, 이는 현재 건설 속도보다 훨씬 높은 수준이다."},{"s":"블랙스톤 REIT, 50억 달러 규모의 거래로 아마존 데이터 센터 구매","so":"Bloomberg.com","tm":"11/16 20:53","c":1,"r":"us","u":"https://www.bloomberg.com/news/articles/2026-11-16/blackstone-reit-to-buy-amazon-data-centers-in-5-billion-deal","p":1794830037,"a":1794834737,"t":"Blackstone REIT to Buy Amazon Data Centers in $5 Billion Deal"},{"s":"태국 푸켓의 유명 관광지에서 치명적인 화재가 발생해 수십명이 숨졌고, 오토바이 바닥에 있던 변압기가 폭발한 것으로 추정된다(키티양 제보)","so":"Now 新聞","tm":"11/16 20:20","c":1,"r":"hk","u":"https://news.now.com/home/international/player?newsId=669785&home=1","p":1794828039,"a":1794830464,"t":"泰國布吉知名遊客區致命火釀幾十人死傷 疑電單車地舖變壓器爆炸導致（楊潔儀報道）","su":"[나우뉴스채널] 이른 아침, 태국 푸켓의 유명 관광지 빠통에서 대여 오토바이 바닥에서 화재가 발생했습니다. 이는 위층 주거지로 퍼져 최소 11명이 사망하고 연기 흡입으로 사망한 것으로 추정되며 12명이 부상을 입었다. 당국은 처음에 화재가 변압기 폭발로 인해 발생한 것으로 의심했습니다."},{"s":"친핵은 재가동의 3대 원칙을 말한다. 원전을 반대한다고 해서 바로 가동할 수 있는 것은 아니다 | 정치","so":"中央社 CNA","tm":"11/16 20:20","c":1,"r":"tw","u":"https://www.cna.com.tw/news/aipl/202611160178.aspx","p":1794828000,"a":1794830458,"t":"擁核指重啟3原則已具備反核批核電廠不是說開就開| 政治","su":"중앙선거관리위원회가 비핵 조국폐지 국민투표 제3차 의견회의를 개최한다. 긍정적인 측면은 대만이 이미 원전 재가동을 위한 3대 원칙을 갖고 있고, 원전을 폐쇄하면 천연가스 사용량이 늘어날 것이라는 점이다. 부정적인 측면에서는 원전이 대규모 이동식 전력원이 아니고 마음대로 켜지지 않는다는 점을 비판한다."},{"s":"AI 데이터 센터 및 전력망에 대한 투자로 구리 수요 증가 골드만삭스는 2027년 말까지 구리 가격이 상승할 가능성을 13%로 보고 있습니다.","so":"鉅亨網","tm":"11/16 19:30","c":1,"r":"tw","u":"https://news.cnyes.com/news/id/6664079","p":1794825004,"a":1794830460,"t":"AI資料中心與電網投資推升銅需求高盛看2027年底銅價有13%上漲空間","su":"AI 데이터 센터 및 전력망에 대한 투자는 구리 수요를 증가시킵니다. 골드만삭스는 2027년 말까지 구리 가격이 13% 상승할 여지가 있다고 봅니다. Uanalyze 2026년 11월 16일(Uanalyze/산업 데이터 센터 보고) ⸺ AI 데이터 센터 및 전력 인프라에 대한 투자가 계속 증가하여 전 세계 구리 수요 증가를 주도하지만, 광산 생산량을 동시에 확장하기는 어렵습니다. 골드만삭스(GS-US)는 런던금속거래소(LME) 구리 가격이 2027년 12월까지 미터톤당 미화 15,600달러까지 오를 것이라고 예측했는데, 이는 주로 공급 제약과 수요 증가로 인한 가격 지지에 대해 낙관적이었습니다. LME 3개월 구리 선물(미래 값을 미리 정해 사고파는 거래)은 11월 13일 미터톤당 $13,399에 마감되었습니다. 골드만삭스의 예상 목표는 당시 현물 가격보다 약 13% 높습니다."},{"s":"닛신 전기가 마에바시에 신공장, 변전소용 부품 제조 전력 수요 전망 능력 증강","so":"日本経済新聞","tm":"11/16 18:30","c":1,"r":"jp","u":"https://www.nikkei.com/article/DGXZQOCC163BT0W6A111C2000000/","p":1794821446,"a":1794830465,"t":"日新電機が前橋に新工場、変電所向け部品製造 電力需要見据え能力増強","su":"닛신전기(교토시)는 16일, 마에바시 제작소(마에바시시) 내에 건설하는 공장의 안전 기원제를 열었다. 변전소 등에 대한 절연장치 부품의 생산성을 높이기 위해 45억엔을 들여 기존 공장의 개수와 용접공장의 건설을 추진한다. 인공지능(AI)의 보급에 따른 데이터센터(컴퓨터 수만 대를 모아 둔 건물)의 가동에 따른 전력수요의 고조를 내다보고 생산능력을 늘린다. 용접공장 완성은 2027년 12월을 전망한다. 신설하는 용접공장의 바닥면적은 약 4930제곱미터. 수변전 설비의"},{"s":"노르웨이의 데이터 센터 장비, 자동차 수입 기록 기록","so":"Bloomberg.com","tm":"11/16 17:55","c":1,"r":"us","u":"https://www.bloomberg.com/news/articles/2026-11-16/norway-s-imports-hit-record-on-data-center-equipment-cars","p":1794819327,"a":1794830455,"t":"Norway’s Imports Hit Record on Data Center Equipment, Cars"},{"s":"Kangshu Supercomputing은 고밀도 컴퓨팅 성능 레이아웃을 향상시키는 다양한 액체 냉각 솔루션을 선보입니다.","so":"經濟日報","tm":"11/16 17:01","c":1,"r":"tw","u":"https://money.udn.com/money/story/5612/9881959","p":1794816076,"a":1794830462,"t":"康舒 Supercomputing 展出多元液冷解決方案強化高密度運算電力布局","su":"전원공급장치 제조사 강슈(6282)가 11월 17일부터 19일까지 미국 시카고에서 열리는 슈퍼컴퓨팅 2026(Supercomputing 2026)에 참가한다. 지난 10월 OCP 글로벌 서밋에서 선보인 업계 최고의 고전력 밀도 전원 공급 장치 기술을 이어가는 것 외에도 이번에는 수냉식 플레이트와 유전체 액체 냉각 기술을 결합한 전원 공급 장치 제품을 추가로 선보일 예정이며, AI 및 고성능 컴퓨팅(HPC) 시스템의 증가하는 전원 공급 장치 및 냉각 요구 사항에 대처하기 위해 전력 변환, 배전, 열 관리 분야에서 회사의 통합 설계 역량을 입증할 예정입니다."},{"s":"AI 전력 수요에 날개 단 LS…3Q 영업익 4882억 90% 증가","so":"뉴스1","tm":"11/16 16:22","c":1,"r":"kr","u":"https://www.news1.kr/industry/general-industry/6355657","p":1794813752,"a":1794830454},{"s":"중부 전력 PG, 철탑 작업자의 구조 훈련 현지 소방과 조립 시간 단축 목표","so":"日本経済新聞","tm":"11/16 15:22","c":1,"r":"jp","u":"https://www.nikkei.com/article/DGXZQOFD163U30W6A111C2000000/","p":1794810152,"a":1794812220,"t":"中部電力PG、鉄塔作業者の救助訓練 地元消防と組み時間短縮目指す","su":"중부전력 송배전자회사인 중부전력 파워그리드(PG)는 16일 아이치현 히진시에서 철탑 공사 고소 작업자를 구조하는 훈련을 현지 소방으로 열었다. 감전 위험을 피하면서 신속하게 구조할 수 있도록 과제를 정리. 직장의 안전성을 높여 인재 확보로 연결한다. 중부 전력 PG의 연수 시설 내에 있는 철탑을 본뜬 구조물로, 높이 약 15미터의 장소에서 작업자가 감전이나 급병으로 움직일 수 없게 되었다고 상정. 닛신시나 토요아키시 등을 관할하는 오미소방 조합의 오미소"},{"s":"한전 'AI 전력설비 고장분석' 교육, 공공 HRD 콘테스트 대통령상","so":"파이낸셜뉴스","tm":"11/16 14:35","c":1,"r":"kr","u":"https://www.fnnews.com/news/202611161434110593","p":1794807316,"a":1794809555,"su":"한국전력은 지난 11~12일 국가공무원인재개발원 주최로 열린 '2026 공공 HRD 콘테스트' 교육과정 분야에서 대통령상을 받았다고 16일 밝혔다. 올해 44회째인 이 대회는 교수학습, 교육과정, 연구개발 3개 분야로 나뉜다."},{"s":"HD현대, '발전부터 전력망까지' 북미 에너지시장 공략","so":"연합뉴스","tm":"11/16 11:53","c":1,"r":"kr","u":"https://www.yna.co.kr/view/AKR20261116082400003","p":1794797606,"a":1794806461,"su":"(서울=연합뉴스) 김윤구 기자 = HD현대[267250]가 태양광 발전과 배터리에너지저장장치(BESS(전기를 저장해 두는 큰 배터리)), 전력기기 기술을 앞세워 북미 에너지 시..."},{"s":"LS일렉트릭, 9380만 달러 규모 미국 AI 계약 성사","so":"Korea JoongAng Daily","tm":"11/16 11:24","c":1,"r":"us","u":"https://www.koreajoongangdaily.com/business/ls-electric-lands-938-million-us-ai-deal/12974394","p":1794795858,"a":1794830456,"t":"LS Electric lands $93.8 million U.S. AI deal","su":"한국 회사는 미국의 주요 AI 데이터 센터 확장을 위한 고전압 및 저전압 배전 시스템을 공급할 예정입니다."},{"s":"블록체인 개발 및 충전, 마이크로그리드 레이아웃 | 핫 하이라이트 | 사업정보","so":"經濟日報","tm":"11/16 11:04","c":1,"r":"tw","u":"https://money.udn.com/money/story/5635/9880824?from=edn_subcatelist_cate","p":1794794665,"a":1794795164,"t":"區塊證發展充電 布局微電網 | 熱門亮點 | 商情","su":"블록체인 기술은 충전 및 마이크로그리드를 배치하고, 프랜차이즈 관리를 개선하기 위해 \"Ajin AI\" 시스템을 출시하며, California Energy 및 Weiqian Technology와 협력하여 EMS 표준의 상호 운용성을 촉진하기 위한 재해 예방 및 커뮤니티 마이크로그리드를 개발합니다."},{"s":"LS일렉트릭, 美 AI 데이터센터 전력장비 1300억원 수주 - 36Kr","so":"www.36kr.com","tm":"11/16 10:53","c":1,"r":"cn","u":"https://www.36kr.com/newsflashes/4071729157641095","p":1794794007,"a":1794797360,"t":"韩国LS电气斩获1300亿韩元美国AI数据中心电力设备订单-36氪","su":"회사 성명에 따르면 LS일렉트릭은 미국 내 하이퍼스케일 AI 데이터센터(컴퓨터 수만 대를 모아 둔 건물)용 배전 시스템 공급을 위해 글로벌 대형 기술기업으로부터 약 1300억원 규모의 수주(일감 주문을 받는 것)를 받았다. 이 회사는 데이터센터에 38킬로볼트(kV) 고전압 및 저전압 스위치기어를 공급할 예정이다. LS일렉트릭은 이 사업 초기부터 참여해 이번 증설사업에도 재수주했다. 회사는 최근 또 다른 대형 기술업체와 장기공급계약을 체결했으며, 사업 규모를 지속적으로 확대해 나갈 계획이라고 밝혔다. (시나파이낸스)"},{"s":"LS일렉트릭, 미국서 AI 데이터센터 전력시스템 9383만달러 수주","so":"Yonhap News Agency","tm":"11/16 09:50","c":1,"r":"us","u":"https://en.yna.co.kr/view/AEN20261116002700320","p":1794790209,"a":1794792480,"t":"LS Electric wins US$93.83 mln order for AI data center power systems in U.S.","su":"서울, 11월 16일(연합) -- LS일렉트릭(LS Electric Co.)은 9,383만 달러 규모의 계약을 체결했다고 16일 밝혔다...."},{"s":"LS일렉트릭, 美 빅테크에 AI 전력설비 공급…1300억 추가 수주 - 머니투데이","so":"머니투데이","tm":"11/16 09:38","c":1,"r":"kr","u":"https://www.mt.co.kr/industry/2026/11/16/2026111609124644288","p":1794789537,"a":1794792480,"su":"LS ELECTRIC(일렉트릭)이 미국 글로벌 빅테크 기업의 하이퍼스케일 AI(인공지능) 데이터센터(컴퓨터 수만 대를 모아 둔 건물) 전력 인프라 사업을 추가 수주(일감 주문을 받는 것)했다. 해당 빅테크 고객이 현지에서 추진 중인 대형 데이터센터 프로젝트 초기 단계부터 참여한 이후 확장 사업까지 고압 배전반 물량을 확보했다."},{"s":"중국과 티베트가 내려다보이는 곳 | 나그취(Nagqu)의 고지대 3개 현에서 태양광발전소 가동, 전력 불안정에 작별 인사","so":"TVB","tm":"11/16 09:00","c":1,"r":"hk","u":"https://news.tvb.com/tc/1206208-%E4%BF%AF%E7%9E%B0%E7%A5%9E%E5%B7%9E%E8%A5%BF%E8%97%8F%E9%82% 의 두뇌 부품)와 전력기기 업계에 어떤 파장이 있을지 주목됩니다. 정다예 기자입니다. [기자] 미국 중간선거 직후 국내 증시는 크게 출렁였습니다. 삼"},{"s":"포스코·효성중공업·한화오션 하청까지…중공업계 '동투' 장기화 조짐","so":"이투데이","tm":"11/15 10:44","c":1,"r":"kr","u":"https://www.etoday.co.kr/news/view/2648009","p":1794707040,"a":1794713963,"su":"협상 난항에 노사 갈등 연말까지 이어져임금·성과급 갈등에 동투 장기화 조짐파업·집회 잇따라…생산 차질 우려▲효성중공업 창원공장 전경. (사진제공="},{"s":"AI 데이터센터가 벽에 부딪혔다! 미국 내 38개 지역이 금지령을 통과시키고 확장을 요구했습니다. 마이크로소프트와 구글은 강제로 다른 탈출구를 찾아야 하는가?","so":"工商時報","tm":"11/15 08:37","c":1,"r":"tw","u":"https://www.ctee.com.tw/news/20261115700014-430701","p":1794699420,"a":1794702410,"t":"AI資料中心踢到鐵板！美國38地通過禁令喊卡擴建 微軟、Google被迫另尋出路？","su":"미국 민주당이 2026년 중간선거에서 큰 승리를 거두며 상하원 장악력을 탈환했다. 유권자들은 높은 인플레이션(물건값이 계속 오르는 것)과 생활비에 대한 불관용, 해외 전쟁 개입에 대한 강한 반대, 의료 안보와 풀뿌리 사회복지 수호, 젊은 세대와 소수민족의 변화 요구 등 현 정부의 정책에 대해 강력한 항의와 불만을 투표를 통해 표현했다. AI 데이터센터(컴퓨터 수만 대를 모아 둔 건물)로 인해 전력 수요가 급증하고, 주민들은 시설 확충에 따른 전이효과를 우려하고 있다. 경제와 민생은 유권자들이 가장 우려하는 페인포인트다. 건담..."},{"s":"팬과 함께 떠나지 않는 현실 AI 데이터센터 과열투자에 한 홀","so":"日本経済新聞","tm":"11/15 05:00","c":1,"r":"jp","u":"https://www.nikkei.com/article/DGXZQOUC132SG0T11C26A1000000/","p":1794686400,"a":1794698087,"t":"「ファンと共に去りぬ」の現実味 AIデータセンター過熱投資に一穴","su":"인공지능(AI) 붐을 선도해온 미국 엔비디아 젠슨 황씨가 최고경영책임자(CEO)를 전격 사임했습니다. 영향은 엔비디아의 경영에 그치지 않고, 과열하는 AI 데이터 센터의 투자 붐의 조정을 초래하는 「황 퇴진이라는 작은 균열」에 퍼질 수 있습니다. 「수평형 조직」. 엔비디아의 경영 체제는 다음과 같습니다. 엔비디아 간부는 “한 사람의 시끄럽고 무서운 아버지가 있고, 그 아래에 만명의 아이들이 줄지어 있다. 아버지가 결"},{"s":"하루 만에 40% 이상 급락했습니다! 호주 데이터센터 운영업체 NextDC, 내년 실적 전망 하향","so":"财联社","tm":"11/14 22:02","c":1,"r":"cn","u":"https://www.cls.cn/detail/2511045","p":1794661373,"a":1794713965,"t":"一天暴跌逾四成！澳数据中心运营商NextDC下调明年业绩指引","su":"① 호주 데이터센터(컴퓨터 수만 대를 모아 둔 건물) 운영업체인 NextDC는 멜버른 M3 데이터센터 전력 공급 지연으로 인해 2027회계연도 매출과 기본 EBITDA 실적 전망을 하향 조정했고 주가는 장중 44% 하락했다. ② M3의 그리드 전력 공급 증가의 다음 단계는 2028 회계연도로 연기될 것으로 예상됩니다. ③ 회사는 신규 프로젝트와 토지 취득을 중단했으며, 씨티그룹은 관련 문제가 수익에 미치는 영향이 2027 회계연도 이후까지 이어질 수 있다고 밝혔습니다. 차이롄서, 10월 21일(인턴 편집자 Xu Yuanjia/편집자 Qi Ling) 호주 데이터 센터 운영업체인 NextDC가 멜버른 M3 데이터 센터의 전력 공급이 지연되었습니다. 회사의 주가는 수요일 세션 동안 44% 하락하여 5.35 호주 달러로 마감했으며, 시가총액(회사 전체 몸값)은 40억 호주 달러(약 28억 달러)를 약간 넘는 수준으로 떨어졌습니다."},{"s":"기술 거대 기업은 민주당 산사태로 더 많은 전력망 비용 압박에 직면","so":"Bloomberg.com","tm":"11/14 22:00","c":1,"r":"us","u":"https://www.bloomberg.com/news/articles/2026-11-14/tech-giants-face-more-grid-cost-pressure-on-democratic-sweep","p":1794661200,"a":1794727100,"t":"Tech Giants Face More Grid Cost Pressure on Democratic Sweep"},{"s":"HD현대일렉트릭과 LG CNS가 15일 경기도 성남시에 위치한 HD현대 글로벌 R&D센터에서 '데이터센터 전력인프라 및 스마트팩토리 구축을 위한 상호협력 업무협약'을 체결했다. (사진 오른쪽부터) 김영기 HD현대일렉트릭 대표, 현신균 LG CNS 대표. HD현대일렉트","so":"전자신문","tm":"11/14 19:13","c":1,"r":"kr","u":"https://www.etnews.com/tools/image_popup.html?v=bjQ5VkNYY2dLZTZMZFBUbmNzandvWmpGcjBTK1pHYm1CUVRXR0pTMldlYVZkdE5JeGJVUFVVNURJN04rbmhKTXpEZ0VrRFJ1Z0UzZXBlTmtIMExTenhzMGtybmIxSXNKclBEVmFmUU1GWlBJWXluVHRIcVlJaTgzMzF4ckJXU21tNkZuQUpGOEMvRGtQRXBaemVXR1NjKzN1TXl0VGdSYlJleHNweGdVVXBXaWgvUWwyVXBWSkJoYXkwcDZkWDc2M3pQME9mQ1FRc1FIV0d3cEJrbm1GOFJPd21rODA0REErOEZCOHhaZXJ6VnAybW1KVm4wQ0RkRmtKc2tXMW5WTHNjMzUvZ0NXVjRGQXBHNFpIT295Q0NTbVA4T3BlWTRNdk0yU3BCaGJCQy9FNFBCUXNuR2xiSUttWGZOMzRhcHhyN0krY3IybVdaVzBWUURnUTZSemF0SFpZbVVMUFVEUWgwRnl0YmFDM1VsREVBOHN2cWtVS2IvTGoxVEtuenhtOWsyblIwVW13cHpwdGtuejQ5enFDZnJmZnFlb1ZrTFV4SndoOEpuM0l2MHh5ZVFYeEZIQVVDcGliU3pLOXZ4VEV5TkZNZ0hpb3NIT3UzNi8vZzBVZ1NuVEdvRW5LYWJ2UFJzdUlTSzZrblQxSjAvbE1OYmxObHlNVGx4dzNtdzg4ZjZkamFsTlNEM2FHWGphSWlyUnNJQ3RZRVBpU002WDdFajNsOGFTM0ZocXFPeXR5Qzhoczh2ZVhYNk01NTQ1Y1FZbFVuVkpiSHBueGI0T1V4TGRLN0ZEL1FhNWwxa0VoNWlBckhSUURkVC9xSHJhUXE0SldJaFJNenhiYkNCVCtZaHYrclR6UWI4UWJhK1lCdERPNnlHVHZFSmZmeWFwOU1QaUZjeWYwdG1NaGllNTFXRGQ4c1V2bHZoTHJEU3hCekFJTkI2bDI4TTMzWENaaTVnbjNta0N3UXpXRnczOTY0eDQ5K0ZIOEppNTBZSWlGRUhuZHl2eVVHTWorTmJaY2d2d1NMT3FxaTlVYk8xUVZpVCtpUkJlVFN1ejZ2cHdWU2tvaUlseHhvdEgxaEYwYVorSXd4a1c2dGFXT0RheDY2d3dsRm02UUt1M0NzQjRHNWljN3pOZ0k1MjVsY01KUmFucDQ0NmhjVEFQd051Vit0T21sTXVvZjErai9RZUl6NVJQbWppMFN5WUJUaDMwNU02OEk4UksrM0tDTEhlVncvQW9Hc2VBMUtQdHRXRjVKVFhmZlJ0dXhOakF1bXJSL2xNcVloR0NRMkZpdUZ5cWRiRzJqeWwzWE1ieEpoMHA3NjVPNzJZRjQ2Zm9H "tm":"11/14 11:52","c":3,"r":"jp","u":"https://mainichi.jp/articles/20261114/pr2/00m/020/025000c","p":1794624755,"a":1794628736,"t":"プレスリリース：XNOVA、「NexTech Week 2026［秋］第1回ヒューマノイドロボットEXPO」に出展 3日間で1,500人以上が来場し、ブースは大盛況に（PR TIMES）","su":"4족 보행 로봇용 내비게이션 「현장견」과 전동 공구를 취급하는 쌍팔 로봇을 실기로 전시. 건설 현장용의 제공 체제와, 2027년 4월의 본격 제공을 향한 파트너 모집을 발표 피지컬 AI·로보틱스의 스타트업인 주식회사 XNOVA"},{"s":"Youzhishi︱디지털 휴머노이드 로봇 'Youzhobao'가 춤을 추며 쿵푸를 선보이고, 친구들은 기쁨과 칭찬으로 춤을 춥니다.","so":"星島頭條","tm":"11/16 20:04","c":2,"r":"hk","u":"https://www.stheadline.com/society/3637773/%E5%8F%8B%E6%99%BA%E8%AD%98%E6%95%B8%E5%AD%97%E8%BE%A6%E4%BA%BA%E5%BD%A2%E6%A9%9F%E6%A2%B0%E4%BA%BA%E5%8F%8B%E6%99%BA%E5%AF%B6%E8%B7%B3%E8%88%9E%E6%89%93%E5%8A%9F%E5%A4%AB-%E8%80%81%E5%8F%8B%E8%A8%98%E7%9C%89%E9%A3%9B%E8%89%B2%E8%88%9E%E8%AE%9A%E5%8F%BB","p":1794827048,"a":1794830486,"t":"友智識︱數字辦人形機械人「友智寶」跳舞打功夫 老友記眉飛色舞讚叻","su":"디지털오피스는 오늘(16일) '친절한 지식' 커뮤니티 디지털 포용 프로그램 2차와 '로봇을 커뮤니티 속으로' 시범 프로그램 론칭식을 가졌다. Sun Dong 혁신기술산업국 국장은 더 많은 사람들에게 혜택을 제공하기 위해 서비스 규모가 확대될 것이라고 말했습니다. 디지털 오피스와 사회혁신기금은 2024년에 2년간의 '친절한 지식' 디지털 포용 프로그램을 시작하여 노인과 기타 도움이 필요한 사람들이 디지털 기술을 습득할 수 있도록 지원합니다. 여기에는 스마트폰 및 디지털 서비스 사용을 돕기 위한 지원 지점 설정, 디지털 서비스 및 기술 과정 설정, 온라인 기술 학습 플랫폼 설정 등이 포함됩니다. 우정 지식 프로젝트 기술 및 산업 혁신을 통해 커뮤니티 디지털 지원 포인트가 두 배로 증가했습니다."},{"s":"153세 건축가 타이세이, AI와 로봇공학에 투자하기 위해 펀드 조성","so":"Bloomberg.com","tm":"11/16 08:01","c":2,"r":"us","u":"https://www.bloomberg.com/news/articles/2026-11-15/taisei-launches-150-million-ai-robotics-fund-with-pegasus-tech-ventures","p":1794783715,"a":1794789755,"t":"153-Year-Old Builder Taisei Sets Up Fund to Invest in AI and Robotics"},{"s":"10월에는 산업용 로봇과 집적회로 생산 증가율이 20%를 넘어섰고, 신운동에너지의 지원 역할도 계속해서 높아졌다.","so":"21财经","tm":"11/16 20:52","c":1,"r":"cn","u":"https://www.21jingji.com/article/20261116/herald/35a348029c0464373fc004d7f9ceb32c.html","p":1794829920,"a":1794834748,"t":"10月工业机器人、集成电路产量增速均超20% 新动能支撑作用继续提升","su":"1월부터 10월까지 첨단제조와 스마트제조로 대표되는 새로운 원동력은 산업부가가치가 일정 규모 이상으로 성장하는 데 50% 이상 기여했다. 10월에는 첨단기술제품과 '3대 신제품' 수출액이 전년 동기 대비 50% 이상 증가했다. 3D 프린팅 장비, 리튬이온 배터리, 산업용 로봇의 생산량은 전년 동기 대비 각각 85.9%, 30.0%, 26.0% 증가했다. 국가통계국이 16일 발표한 국가경제실적(회사가 번 돈 성적표)에 따르면, 다양한 분야에서 새로운 생산력 배양이 가속화되고, 새로운 운동에너지의 추진력이 지속적으로 강화되며, 국가경제 운영이 전반적으로 안정되고 새롭고 더 나은 성과를 향해 발전하고 있다. 새로운 운동에너지의 축적은 컴퓨팅 파워에 대한 수요에 새로운 기회를 가져왔습니다. \"기술 혁신과 산업 혁신이 깊이 통합되고, 새로운 과학 기술 성과가 지속적으로 나타나고 있으며, 새로운 산업, 새로운 비즈니스 형식 및 신제품이 더 나은 방향으로 개발되고 있으며, 전통 산업의 변화와 업그레이드 속도가 가속화되고, 디지털화와 지능이 통합 및 발전하고 있습니다. 이는 고품질 경제 발전을 강력하게 지원했습니다.\" 중국 국가통계국 국민경제종합통계국 대변인이자 수석경제학자인 푸 링후이(Fu Linghui)는 10월 경제 성과를 분석하면서 이렇게 말했습니다."},{"s":"탄민: 본토 휴머노이드 로봇 '백연대 전투' 적자생존","so":"信報網站","tm":"11/16 20:33","c":1,"r":"hk","u":"https://www.hkej.com/multimedia/view/id/4566083","p":1794828813,"a":1794830484,"t":"譚旻: 內地人形機械人「百團大戰」 優勝劣汰","su":"최근에는 임바디드 AI(Embodied AI)과 휴머노이드(사람을 닮은 로봇) 로봇의 물결이 전 세계를 휩쓸며 공상과학의 장면을 현실로 가져오고 있습니다. 구현지능의 상용화 과정은 '기술 실증'에서 대규모 구현으로 진화하고 있다. 유비테크놀로지(09880)는 휴머노이드 로봇 최초의 주식으로 하드 기술을 자본 시장에 도입하는 데 성공적으로 앞장섰습니다. 회사의 최고 브랜드 책임자인 Tan Min(Michael)은 \"경제 저널\"을 수락했으며 현재 TV \"A Word for Money\" 시리즈 2에서 공동 제작한 \"홍콩 혁신 및 기술\"과의 독점 인터뷰를 통해 임바디드 AI 뒤에 있는 과제를 공유하고 로봇이 진정으로 자율적인 의사 결정을 달성할 수 있는 시기와 본토 산업의 발전을 분석합니다."},{"s":"월급도 못 갚고 1억 5천만 달러 빌려 바다 전망 맨션 구입! 신생 군용로봇 스타트업 CEO, 전과자 있다","so":"TVBS新聞網","tm":"11/16 19:02","c":1,"r":"tw","u":"https://news.tvbs.com.tw/world/4051451","p":1794823320,"a":1794834751,"t":"發不出薪水卻借1.5億買海景豪宅！軍用機器人新創CEO再爆前科累累","su":"군용 휴머노이드(사람을 닮은 로봇) 로봇 스타트업 기업 미래산업재단(이하 파운데이션)이 금융위기를 맞았다. 직원들에게 임금을 지급하지 않았을 뿐만 아니라 CEO도 질문을 받았습니다. 회사 자금이 부족하던 시절 460만달러(약 1억5000만달러)를 빌려 캘리포니아 맨션을 구입해 내부 직원들의 불만이 컸다. 이제 회사가 새로운 자본 투입을 모색하면서 운영 및 재무 거버넌스 문제도 주목을 받고 있습니다."},{"s":"레인보우로보틱스, 3분기 매출 139억원…적자 폭 커져","so":"이데일리","tm":"11/16 18:49","c":1,"r":"kr","u":"https://www.edaily.co.kr/News/Read?newsId=03552246645646376&mediaCodeNo=257","p":1794822548,"a":1794830473,"su":"레인보우로보틱스(277810)가 올해 3분기 매출(물건을 판 돈 전체) 성장에도 불구하고 적자 폭을 키웠다. 최대주주인 삼성전자향 매출은 늘었지만 모바일 휴머노이드(사람을 닮은 로봇) 매출 비중은 다소 낮아진 것으로 나타났다. 레인보우로보틱스는 올해 3분기 연결 기준 영업손실이 17억7000만원으로 전년 ..."},{"s":"화웨이 Cloud가 구현된 전기, 경영 인력 육성","so":"日経ビジネス電子版","tm":"11/16 17:00","c":1,"r":"jp","u":"https://business.nikkei.com/atcl/gen/19/00961/","p":1794816000,"a":1794830489,"t":"安川電機、経営人材の育成","su":"오가와 마사히로 전 사장의 급속한 일을 받아 경영 톱에 재등판한 오가사와라 히로시 회장 겸 사장. 함께 그린 노선을 완수하고 그 뜻을 연결하기 위한 가장 큰 초점이 경영인력 육성이다. 컨설턴트와 AI가 “그러한 정답”을 내는 시대에 스스로의 머리로 회사의 미래를 그려내는 차대의 톱을 어떻게 판별하고 키워나갈 것인가. 수많은 위기를 극복해 온 톱의 각오를 듣는다."},{"s":"아이엘, '로봇손' 사업 진출…'아이엘핸드' 상표출원","so":"데일리안","tm":"11/16 15:19","c":1,"r":"kr","u":"https://www.dailian.co.kr/news/view/1715624/%EC%95%84%EC%9D%B4%EC%97%98-%EB%A1%9C%EB%B4%87%EC%86%90-%EC%82%AC%EC%97%85-%EC%A7%84%EC%B6%9C%EC%95%84%EC%9D%B4%EC%97%98%ED%95%B8%EB%93%9C-%EC%83%81-2026","p":1794809940,"a":1794812228,"su":"피지컬 인공지능(AI) 데이터 플랫폼 기업 아이엘은 아이엘이 휴머노이드(사람을 닮은 로봇) 로봇핸드 사업 강화를 위해 신규 브랜드 '아이엘핸드(ILHAND)'의 상표출원을 마쳤다고 16일 밝혔다. 이번 브랜드는 휴머노이드 로봇의 핵심 부품인 로봇핸드 분야에 특화돼 있다. 아이엘은 지난해 11월 휴머노이드 로봇 브랜드 '아이엘봇(ILBOT)' 상표출원을 통해 로봇 사업의 방향성"},{"s":"아이엘, 피지컬AI 핵심 부품 ‘로봇핸드’로 사업 확장","so":"서울경제","tm":"11/16 14:55","c":1,"r":"kr","u":"https://www.sedaily.com/article/20114902","p":1794808542,"a":1794812228,"su":"아이엘, 피지컬AI 핵심 부품 ‘로봇핸드’로 사업 확장 ‘아이엘핸드’ 브랜드 상표권 출원 휴머노이드(사람을 닮은 로봇) 사업 전략 핵심 축 완성 입력2026-11-16 14:55 피지컬AI 데이터 플랫폼 기업 아이엘(307180)이 로봇핸드 분야로 사업 영역을 확장한다. 이를 통해 휴머노이드 기반 피지컬AI 사업 역량 강화를 추진한다. 아이엘은 휴머노이드 로봇핸드 사업 확대를 위한 신규 브랜드 ‘아이엘핸드(ILHAND)’의 상표 출원을 완료했다고 16일 밝혔다."},{"s":"심천 APEC │ 뉴스 센터, AI 안경 매칭 전시 및 커피 머신 작동을 위한 휴머노이드 로봇 설치","so":"RTHK News","tm":"11/16 14:06","c":1,"r":"hk","u":"https://news.rthk.hk/rthk/ch/component/k2/1877974-20261116.htm","p":1794805560,"a":1794806476,"t":"深圳APEC｜新聞中心展示AI配眼鏡 設人形機械人操作咖啡機","su":"아시아태평양경제협력체 APEC 회의가 선전에서 열렸습니다. 선전은 26,000개의 첨단 기술 기업이 위치한 혁신의 도시입니다. 선전-홍콩-광저우 혁신 클러스터가 2년 연속 세계 1위를 차지했습니다. 하이테크는 일상생활과 통합됩니다. 프레스센터도 전시장으로 변신했다. 행사장에는 일반 차량을 직접 조작할 수 있는 휴머노이드(사람을 닮은 로봇) 로봇이 탑재됐다."},{"s":"삼기, 3분기 영업익 114억 전분기比 883%↑…“휴머노이드 로봇 부품 개발 확대 계획”","so":"이투데이","tm":"11/16 13:56","c":1,"r":"kr","u":"https://www.etoday.co.kr/news/view/2648685","p":1794804960,"a":1794806474,"su":"상반기 81 r","u":"https://www.hankyung.com/article/202611135386i","p":1794780961,"a":1794784892,"su":"\"공장에 투입했더니 이럴 수가\"…中 로봇 줄줄이 '굴욕' [차이나 워치], 세계 놀라게 한 휴머노이드(사람을 닮은 로봇)의 민낯 공장 투입하자 드러난 실력 中 휴머노이드 로봇의 상용화 벽"},{"s":"오므론, 창약 실험을 자동화로 쌍팔 3 손가락 로봇 + α","so":"日本経済新聞","tm":"11/16 05:00","c":1,"r":"jp","u":"https://www.nikkei.com/prime/tech-foresight/article/DGXZQOUC1217S0S6A111C2000000","p":1794772800,"a":1794784909,"t":"オムロン、創薬実験を自動化へ 双腕3指ロボット＋αで","su":"오므론이 개발하는 쌍팔 3손가락의 상반신 로봇은 투명하고 얇은 마이크로플레이트도 잡는 오므론이 창약 분야의 실험 자동화를 위해 쌍팔 3손가락 손의 상반신 로봇(세미휴마노이드) 등을 개발하고 있다. 주로 표적 분자를 탐색하는 실험 현장을 상정하고 전용 지그를 필요로 하지 않는 것이 특징이다. 인간과의 공존을 전제로 환경 변화가 많이 좁은 실험실이라도 쉽게 도입할 수 있는 AI(인공지능) 로봇의 실현을 노린다. 이 기사의 3개의 포인트 ・쌍팔 3손가락의 상반신 로봇 등장, 위치 결정 지그 불필요로 투명 물체를 파지 ・작업마다 역할 분담, 구상 바퀴의 이동형 핸드 로봇은 미닫이 문도 자랑"},{"s":"CEO, 고급 주택 구입 위해 460만 달러 대출, 휴머노이드 로봇 스타트업 임금 위기 직면","so":"36Kr","tm":"11/16 04:39","c":1,"r":"cn","u":"https://www.36kr.com/p/4072064387143305","p":1794771540,"a":1794834749,"t":"CEO借460万美元购豪宅，人形机器人初创企业遭欠薪危机","su":"CEO, 맨션 구입 위해 460만달러 대출, 휴머노이드(사람을 닮은 로봇) 로봇 스타트업이 급여 위기에 직면했다. 미국의 휴머노이드 로봇 기업인 파운데이션 퓨처 인더스트리즈(Foundation Future Industries)가 지난 10월 30일 급여일을 놓쳤다. CNBC는 11월 14일 이 문제에 정통한 관계자를 인용해 보도 당시 기준으로 관련 급여가 아직 지급되지 않았다고 보도했다. 일부 직원들을 더욱 불만족스럽게 만든 것은 공동 창업자이자 CEO인 Sankaet Pathak이 집을 구입하기 위해 회사로부터 460만 달러를 빌렸다는 사실이었습니다. 공개 기록에 따르면 그의 이름을 딴 회사는 2025년 10월 캘리포니아 주 소살리토에 있는 저택을 같은 가격에 구입했습니다. CNBC에 따르면 Pathak은 재단의 단독 이사이며 회사의 대다수 지분(회사를 나눠 가진 몫)을 보유하고 있습니다. 대변인은 인터뷰 질문에 응답하지 않았습니다."},{"s":"AAEON 총괄 관리자 Lin Jianhong: 로봇 애플리케이션이 뜨거워지고 있습니다 - Daily","so":"工商時報","tm":"11/16 04:00","c":1,"r":"tw","u":"https://www.ctee.com.tw/news/20261116700062-439901","p":1794769200,"a":1794784896,"t":"研揚總經理林建宏：機器人應用升溫- 日報","su":"AAEON Small File 총괄 관리자 Lin Jianhong AI가 점차 물리적 장비로 확장됨에 따라 로봇과 물리적 AI는 산업용 컴퓨터 산업의 다음 중요한 발전 방향이 되었습니다. AAEON은 휴머노이드(사람을 닮은 로봇) 로봇, 4족 로봇, 자율 이동 로봇과 같은 애플리케이션에 대한 수요가 계속 증가할 것이라고 낙관하고 있습니다. AAEON은 로봇 컨트롤러를 미래의 중요한 레이아웃 축으로 꼽았으며, 고성능, 소형화된 컴퓨팅 플랫폼과 맞춤형 역량을 바탕으로 글로벌 로봇 산업에서 비즈니스 기회를 적극적으로 모색하고 있습니다. AAEON 총괄 매니저..."},{"s":"루로봇 식히고 자금 반도체로 돌아온다 - 데일리","so":"工商時報","tm":"11/16 04:00","c":1,"r":"tw","u":"https://www.ctee.com.tw/news/20261116700107-439901","p":1794769200,"a":1794784899,"t":"陸機器人退燒資金回流半導體- 日報","su":"중국 본토의 임바디드 AI(로봇처럼 몸을 가진 인공지능)에 대한 투자 붐이 식었고, 벤처 캐피탈 자금이 반도체 산업으로 돌아섰습니다. 최신 데이터에 따르면 10월 중국 본토의 임바디드 AI 분야 자금 조달(사업에 쓸 돈을 모으는 것)이 45% 감소한 것으로 나타났습니다. 이에 비해 3분기 반도체 자금조달 규모는 전년 동기 대비 90% 이상 증가했다. AI 칩, 첨단 패키징 등 분야는 계속해서 대규모 투자를 유치하고 있다. 시장 참가자들은 벤처캐피탈 기관이 더 이상 단순히 기술적인 개념만 추구하는 것이 아니라 기업의 실제 수주와 사업화 능력이 중요한 투자 기준이 되었다고 지적했습니다. 과학기술혁신위원회 일보..."},{"s":"Tan Min을 선택해야 합니다. 로봇은 10년 안에 \"집에 들어갈\" 것입니다. 뇌는 성숙해졌고 몸은 따라잡을 수 없게 됐다. 공장 데이터를 활용하여 문제를 해결하세요.","so":"信報網站","tm":"11/16 03:36","c":1,"r":"hk","u":"https://www.hkej.com/dailynews/finnews/article/4565796/%E5%84%AA%E5%BF%85%E9%81%B8%E8%AD%9A%E6%97%BB%EF%BC%9A%E6%A9%9F%E6%A2%B0%E4%BA%BA%E5%8D%81%E5%B9%B4%E5%85%A7%E3%80%8C%E5%85%A5%E5%B1%8B%E3%80%8D","p":1794767790,"a":1794784904,"t":"優必選譚旻：機械人十年內「入屋」 大腦成熟身體跟不上 靠工廠數據打通","su":"최근에는 임바디드 AI(Embodied AI)과 휴머노이드(사람을 닮은 로봇) 로봇의 물결이 전 세계를 휩쓸며 공상과학의 장면을 현실로 가져오고 있습니다. 구현지능 상용화 과정은 '기술 실증'에서 대규모 구현으로 진화하고 있다. 유비테크놀로지(09880)는 휴머노이드 로봇 최초의 주식으로 하드 기술을 자본 시장에 도입하는 데 성공적으로 앞장섰습니다. 회사의 최고 브랜드 책임자인 Tan Min(Michael)은 중국 경제 저널과 현재 TV \"A Word for Money\" 시리즈 2에서 공동 제작한 \"홍콩 혁신 및 기술\"과의 독점 인터뷰를 통해 임바디드 AI 뒤에 있는 과제를 공유하고 로봇이 진정으로 자율적인 의사 결정을 달성할 수 있는 시기를 분석하며 본토 산업의 발전을 분석했습니다."},{"s":"GITEX, 로봇 전시장 확대, 휴머노이드 로봇이 주인공","so":"香港經濟日報HKET","tm":"11/16 01:19","c":1,"r":"hk","u":"https://paper.hket.com/article/4225338/","p":1794759595,"a":1794784907,"t":"GITEX增機械人展區 人形機械人成主角"},{"s":"미국 JP모건, \"2030년 미국 휴머노이드 연간 생산량 40만대 가능\"","so":"로봇신문","tm":"11/15 21:31","c":1,"r":"kr","u":"https://www.irobotnews.com/news/articleView.html?idxno=49597","p":1794745889,"a":1794746323,"su":"미국 투자은행 JP모건이 미국의 휴머노이드(사람을 닮은 로봇) 로봇 생산량이 2030년 연간 40만대에 이를 수 있다는 전망을 제시한 것으로 보도됐다.13일 로이터통신 관련 보도에"},{"s":"테슬라, 휴머노이드 '옵티머스' 2027년 산업현장 투입 추진","so":"로봇신문","tm":"11/15 21:25","c":1,"r":"kr","u":"https://www.iro 794730754,"t":"机器人双十一\"考场\"：大卖之后，交付和产线才是真考题","su":"① 더블 일레븐(Double Eleven) 기간 동안, 임바디드 AI(로봇처럼 몸을 가진 인공지능)형 로봇 배치가 처음으로 물류 최전선에서 \"작업\"했습니다. ② 더블일레븐 이후에는 주문한 상품이 제때에 배송될 수 있는지, 이용자가 이를 수령한 후 반품할 것인지, 사용할 것인지 여부 등 배송을 소비자측에서 부담하게 됩니다. 창고가 대답해야 할 것은 로봇이 일년 내내 가장 극심한 주문 피크 기간 동안 안정적으로 작동하고 계산 가능한 경제적 가치를 계산할 수 있는지 여부입니다. '극장반일보'가 11월 13일 보도했다(리밍밍 기자) 더블일레븐은 막을 내렸지만 올해 로봇 분야에는 새로운 변화가 있다. 먼저, 소비자 측면에서는 더블 일레븐 기간 동안 플랫폼 내 지능형 휴머노이드(사람을 닮은 로봇) 로봇 매출이 전년 대비 700% 증가했고, 로봇 팔, 손재주 등 트렌드 카테고리 매출도 전년 대비 10배 이상 증가했다. 반면, 소비자가 주문한 후 분류, 포장 및 배송 링크에서는 임바디드 AI형 로봇 그룹이 처음으로 물류 최전선에서 '작업'했습니다."},{"s":"최신 Caixin Weekly │ 휴머노이드 로봇이 임계점을 기다리고 있습니다","so":"财新周刊","tm":"11/14 23:16","c":1,"r":"cn","u":"https://weekly.caixin.com/2026-11-14/102504772.html","p":1794665765,"a":1794698097,"t":"最新财新周刊｜人形机器人等待临界点","su":"텍스트 | A주 '최초의 인간형 로봇 주식'인 Caixin Weekly Du Zhihang 유니트리(688836.SH)는 8월 19일 상장(주식시장에 처음 들어오는 것) 당일 발행 가격이 주당 150.80위안에서 1,100위안으로 급등했습니다. 이후 오르락내리락하며 등락을 거듭하며 시가총액(회사 전체 몸값)은 최고에서 최고로 상승했습니다. 4,449억 위안으로 최저치인 1,634억 위안을 기록했으나 10월 중순 이후 등락을 거듭하며 2,815억 1,000만 위안 안팎까지 올랐다. 이 시가총액을 기준으로 3개 분기별 보고서의 수익을 합산하면 PS(가격 대비 판매 비율)는 여전히 120배입니다. \"2027년은 로봇 산업이나 로봇 모델 발전에 있어서 중요한 시점이 될 가능성이 높다.\" 2026년 11월 4일 Wuzhen 인터넷 컨퍼런스에서 유니트리의 왕싱싱(Wang Xingxing) CEO는 2027년에는 어떤 현장에서도 작동할 수 있는 로봇을 배치할 가능성이 높다며 두 달 전 기업공개(IPO) 때보다 조금 더 낙관적인 목소리를 냈습니다."},{"s":"2026~2030 휴머노이드 로봇 브레인용 D램 수요 전망(사진=카운터포인트리서치)","so":"전자신문","tm":"11/14 22:30","c":1,"r":"kr","u":"https://www.etnews.com/tools/image_popup.html?v=bjQ5VkNYY2dLZTZMZFBUbmNzandvWmpGcjBTK1pHYm1CUVRXR0pTMldlYVZkdE5JeGJVUFVVNURJN04rbmhKTXpEZ0VrRFJ1Z0UzZXBlTmtIMExTejVCeTJrc0pTeDdtRld1cnQ3Yi9BbWhSaTVjb0VObnNFZndkeDNYcGw4UEY1K0xQNVQvQlNwaUVLSko4a0E3aXFPSk9xemFzdGpKV0ltS1NSaGczSm85VzlHaEo2blpZRjJuQW0yZmlRSmdjZWo3R0o5NHoyUzlxMk5wOFhhaWJkL09zblpXVXkwVG5YVG01Z3hpTU9XMXN2b0Nzc1BPU1d1RlBqUmQ5azRmZzJISzRWNWpEWDFqVmRsNk1iTEw0eW4vUEdNTVNtZnBrdVhTdGtqTWlSVFFnSEVnNFZVTHRsL0tGZDJEb1l5aExVNE1iVmpWNlMrTzA3UXFKTmw2dFBlTXFIMzJCSjFZVDNYa3k5YXZ2OWtRREpoRjZ4TWlJeEFYdFFlcFljeXdrN function prepHist(){                       // 달 경계(배열 위치) 미리 계산
  if(!HI || !HI.s || !HI.end) return;
  HI.n = dIdx(HI.end) + 1; HI.months = []; HI.av = [];
  for(var i=0;i<HI.n;i++){ var ok = false;      // GDELT 자료가 있는 날 (서버가 멈춰 통째로 빠진 날은 false)
    for(var t in HI.s){ for(var k in HI.s[t]){ if(HI.s[t][k][i] != null){ ok = true; break; } } if(ok) break; }
    HI.av.push(ok); }
  var y = +HI.since.slice(0,4), m = +HI.since.slice(5,7), ey = +HI.end.slice(0,4), em = +HI.end.slice(5,7);
  while(y < ey || (y === ey && m <= em)){
    var a = dIdx(y+'-'+('0'+m).slice(-2)+'-01'), ny = m===12 ? y+1 : y, nm = m===12 ? 1 : m+1;
    var b = Math.min(HI.n, dIdx(ny+'-'+('0'+nm).slice(-2)+'-01'));
    HI.months.push({y:y, m:m, a:a, b:b, full: b - a === dIdx(ny+'-'+('0'+nm).slice(-2)+'-01') - a});
    y = ny; m = nm;
  }
}
function hsum(th, a, b, rk){               // [a, b) 날짜 칸의 합 (국가 필터 반영) · 자료 없는 날(null)은 건너뜀
  var s = (HI.s||{})[th] || {}, n = 0;
  for(var k in s){ if(rk ? k !== rk : !(S.region==='all' || k===S.region)) continue;
    var arr = s[k]; for(var i=Math.max(0,a); i<Math.min(b, arr.length); i++) if(arr[i] != null) n += arr[i]; }
  return n;
}
function avn(a, b){ var n=0; for(var i=Math.max(0,a); i<Math.min(b, HI.n); i++) if(HI.av[i]) n++; return n; }   // 자료 있는 날 수
function years(){ var a = [], y0 = +HI.since.slice(0,4), ty = +HI.end.slice(0,4); for(var y=ty-1; y>=y0; y--) a.push(y); return a; }   // 다 지난 해 (최근 먼저)
function pickYear(){ var ys = years(); return ys.indexOf(S.ly) >= 0 ? S.ly : (ys[0] || +HI.end.slice(0,4)); }
function lperiod(){                        // [이번 a,b] [비교 a,b 또는 null] 이름
  var M = HI.months, last = M[M.length-1], lf = last.full ? M.length-1 : M.length-2, ty = +HI.end.slice(0,4);
  if(S.lp === 'lm' && lf >= 0){ var x = M[lf], p = M[lf-1];
    return [[x.a, x.b], p ? [p.a, p.b] : null, x.y+'년 '+x.m+'월', '전달 대비']; }
  if(S.lp === 'ty'){ var a = dIdx(ty+'-01-01'), pa = dIdx((ty-1)+'-01-01'), len = HI.n - a;
    return [[a, HI.n], pa >= 0 ? [pa, pa+len] : null, ty+'년 (1월 1일~'+HI.end.slice(5).replace('-','/')+')', '작년 같은 기간 대비']; }
  if(S.lp === 'yr'){ var yy = pickYear(), ya = Math.max(0, dIdx(yy+'-01-01')), yb = Math.min(HI.n, dIdx((yy+1)+'-01-01')), pa = dIdx((yy-1)+'-01-01');
    return [[ya, yb], pa >= 0 ? [pa, ya] : null, yy+'년 전체', yy-1+'년 대비']; }
  return [[0, HI.n], null, HI.since.slice(0,7).replace('-','.')+' ~ '+HI.end.replace(/-/g,'.')+' 전체', ''];
}
function mspark(th){                       // 달별 흐름 (작은 선, 진행 중인 달은 빼고)
  var M = HI.months.filter(function(x){ return x.full; }), vals = M.map(function(x){ var d = avn(x.a, x.b); return d ? hsum(th, x.a, x.b)/d : 0; });
  if(vals.length < 2) return '';
  var mx = Math.max.apply(null, vals.concat([1])), w = 64, h = 20;
  var pts = vals.map(function(v,i){ return (i*(w/(vals.length-1))).toFixed(1)+','+(h-2-(v/mx)*(h-4)).toFixed(1); }).join(' ');
  return '<svg class="spark" viewBox="0 0 '+w+' '+h+'" width="'+w+'" height="'+h+'" aria-hidden="true"><polyline points="'+pts+'" fill="none" stroke="var(--acc)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></svg>';
}
function ldetail(th){                      // 달별 막대 + 나라별 구성
  var M = HI.months, dn = M.map(function(x){ return avn(x.a, x.b); });
  var vals = M.map(function(x, i){ return dn[i] ? hsum(th, x.a, x.b)/dn[i] : 0; });   // 하루 평균 (자료 빠진 날 영향 없게)
  var mx = Math.max.apply(null, vals.concat([1])), W = chartW(), H = 120, bw = W/M.length;
  var bars = vals.map(function(v,i){
    var x = M[i], bh = Math.max(v ? 2 : 0, (v/mx)*(H-32)), bx = i*bw + 1, y = H-14-bh;
    return '<g class="bar"><rect x="'+bx.toFixed(1)+'" y="0" width="'+(bw-2).toFixed(1)+'" height="'+(H-14)+'" fill="transparent"/>'+
      '<rect x="'+bx.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+(bw-2).toFixed(1)+'" height="'+bh.toFixed(1)+'" rx="2" fill="var(--acc)"'+(x.full?'':' opacity=".55"')+'/>'+
      '<title>'+x.y+'년 '+x.m+'월'+(x.full?'':' (진행 중)')+' · 하루 평균 '+Math.round(v).toLocaleString()+'건 · 한 달 '+hsum(th, x.a, x.b).toLocaleString()+'건'+
      (dn[i] < x.b - x.a ? ' (자료 '+dn[i]+'일치)' : '')+'</title></g>';
  }).join('');
  var ticks = M.map(function(x,i){ return x.m===1 ? '<line x1="'+(i*bw).toFixed(1)+'" y1="'+(H-14)+'" x2="'+(i*bw).toFixed(1)+'" y2="'+(H-9)+'" stroke="var(--sub)"/>'+
      '<text x="'+(i*bw+2).toFixed(1)+'" y="'+(H-1)+'" class="ax">'+x.y+'</text>' : ''; }).join('');
  var axis = ticks + '<line x1="0" y1="'+(H-14)+'" x2="'+W+'" y2="'+(H-14)+'" stroke="var(--line)"/>'+
             '<text x="0" y="9" class="ax">최대 하루 평균 '+Math.round(mx).toLocaleString()+'건</text>';
  var P = lperiod(), parts = D.regions.filter(function(r){ return (HI.regions||[]).indexOf(r.k) >= 0; }).map(function(r){
    return [r, hsum(th, P[0][0], P[0][1], r.k)]; }).filter(function(x){ return x[1] > 0; }).sort(function(a,b){ return b[1]-a[1]; });
  var pm = parts.length ? parts[0][1] : 1;
  var rows = parts.map(function(x){
    return '<div class="crow"><span class="cl">'+esc(x[0].l)+'</span><span class="cb"><i style="width:'+Math.max(2, x[1]/pm*100)+'%"></i></span><span class="cn">'+x[1].toLocaleString()+'</span></div>';
  }).join('') || '<div class="note">이 기간 기사 없음</div>';
  return '<div class="det"><div class="dt">달별 하루 평균 뉴스 수 ('+HI.since.slice(0,4)+'년 1월~)'+(S.region==='all'?'':' · '+esc(RL[S.region]))+'</div>'+
    '<svg class="bars" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(th)+' 달별 뉴스 수">'+bars+axis+'</svg>'+
    '<div class="dt">'+esc(P[2])+' 나라별</div>'+rows+'</div>';
}
function renderLong(h){
  if(!HI){ loadHist(); $('main').innerHTML = h + '<p class="none">장기 추이를 불러오는 중…</p>'; return; }
  if(HI.err || !HI.s || !HI.months || !HI.months.length){ $('main').innerHTML = h + '<p class="none">장기 추이를 아직 받는 중이에요. 처음 한 번은 몇 시간 걸려요. 조금 뒤에 다시 열어 주세요.</p>'; return; }
  if(S.region === 'world'){ $('main').innerHTML = h + '<p class="none">장기 추이는 나라별(한국·미국·중국·대만·홍콩·일본·싱가포르)로만 셀 수 있어요. 위에서 \'전체\'나 다른 나라를 골라 주세요.</p>'; return; }
  var P = lperiod();
  h += '<p class="note">GDELT(전 세계 뉴스 기록) 자료 · 본문에 테마 단어가 나온 기사 수 · 일주일에 한 번 갱신 · '+esc(HI.end.slice(5).replace('-','/'))+'까지 · 업데이트 '+esc(HI.updated||'')+'</p>';
  if(!HI.complete) h += '<div class="warn">⏳ '+HI.since.slice(0,4)+'년 1월부터 자료를 아직 받는 중이에요. 다 받기 전엔 일부 테마·나라·연도가 0이나 빈칸으로 보여요. 자료 서버가 느려서 하루쯤 걸려요 (봇이 알아서 이어 받음).</div>';
  h += '<div class="seg lp">' + [['all','전체'],['lm','지난달'],['ty','올해'],['yr','연도별']].map(function(x){
    return '<button data-lp="'+x[0]+'" class="'+(S.lp===x[0]?'on':'')+'">'+x[1]+'</button>'; }).join('') + '</div>';
  if(S.lp === 'yr') h += '<div class="seg ly">' + years().map(function(y){
    return '<button data-ly="'+y+'" class="'+(pickYear()===y?'on':'')+'">'+y+'</button>'; }).join('') + '</div>';
  var dc = avn(P[0][0], P[0][1]), dp = P[1] ? avn(P[1][0], P[1][1]) : 0, span = P[0][1] - P[0][0];
  if(span - dc > 0) h += '<div class="warn">ℹ️ 이 기간 중 '+(span-dc)+'일은 GDELT 서버 사정으로 자료가 비어 있어요 ('+span+'일 중 '+dc+'일치). 합계는 그만큼 적게 잡히고, ▲▼ 비교는 하루 평균끼리 해요.</div>';
  var rows = (HI.themes||[]).map(function(th){ return {th:th, n:hsum(th, P[0][0], P[0][1]), p: P[1] ? hsum(th, P[1][0], P[1][1]) : null}; })
                            .sort(byN);
  ranks(rows, !!P[1] && dp > 0);
  var mx = rows.length ? Math.max(1, rows[0].n) : 1, total = 0; rows.forEach(function(r){ total += r.n; });
  h += '<div class="tot">'+esc(P[2])+(S.region==='all'?' · 7개 나라':' · '+esc(RL[S.region]))+' · 총 <b>'+total.toLocaleString()+'</b>건 <span class="chgnote">'+(P[1]?'('+P[3]+')':'')+'</span></div>';
  h += rows.map(function(r, i){
    var open = S.open['L'+r.th];
    return '<div class="srow'+(open?' open':'')+'" data-th="'+esc(r.th)+'" data-l="1">'+
      '<div class="sline">'+mv(r, i)+'<span class="rk">'+(i+1)+'</span><span class="sn">'+esc(r.th)+'</span>'+
      '<span class="sb"><i style="width:'+Math.max(r.n?2:0, r.n/mx*100)+'%"></i></span>'+
      '<span class="sc">'+r.n.toLocaleString()+'</span>'+(r.p===null ? '<span class="chg"></span>' : chg(r.n, r.p, dc, dp))+mspark(r.th)+'</div>'+
      (open ? ldetail(r.th) : '') + '</div>';
  }).join('');
  h += '<footer>· 순위 왼쪽 <span style="color:#f87171">▲</span>/<span style="color:#60a5fa">▼</span> = 비교 기간(전달·작년 같은 기간·전년)보다 몇 계단 오르고 내렸는지<br>· 오른쪽 작은 선 = '+HI.since.slice(0,4)+'년 1월부터 달별 흐름(하루 평균), 줄을 누르면 달별 그래프와 나라별 구성<br>'+
       '· 일별 집계(기사 제목 기준, 구글 뉴스)와 세는 방법이 달라 숫자 크기는 서로 비교하지 말고 흐름만 보세요<br>'+
       '· 한국·중국·일본 기사도 GDELT 가 영어로 번역해 둔 것을 영어 검색어로 셉니다 · 자료가 빠진 날은 0이 아니라 빈칸으로 둠</footer>';
  $('main').innerHTML = h;
}
document.addEventListener('click', function(e){
  var b = e.target.closest('.seg.lp button');
  if(b){ S.lp = b.dataset.lp; save('lp', S.lp); renderMain(); return; }
  var yb = e.target.closest('.seg.ly button');
  if(yb){ S.ly = +yb.dataset.ly; save('ly', S.ly); renderMain(); return; }
  var m = e.target.closest('.seg.sm button');
  if(m){ S.sm = m.dataset.sm; save('sm', S.sm); renderMain(); return; }
}, true);

openTab(S.tab);
refreshBreaking();
setInterval(refreshBreaking, 5 * 60 * 1000);
document.addEventListener('visibilitychange', function(){ if(!document.hidden) refreshBreaking(); });

// 기사를 누르면 먼저 한국어 요약 → 원문 볼지 선택
document.addEventListener('click', function(e){
  var c = e.target.closest('a.card'); if(!c) return;
  if(e.ctrlKey||e.metaKey||e.shiftKey) return;
  e.preventDefault();
  $('s-meta').innerHTML = c.querySelector('.meta').innerHTML;
  $('s-title').textContent = c.querySelector('.title').textContent;
  var o = c.querySelector('.orig'); $('s-orig').textContent = o ? o.textContent : '';
  var sm = c.dataset.s || '';
  $('s-sum').textContent = sm || '이 기사는 요약을 가져오지 못했어요. (사이트가 자동 접속을 막았거나 아직 준비 중)';
  $('s-sum').className = 's-sum' + (sm ? '' : ' empty');
  $('s-go').href = c.href;
  // 외국어 기사면 ✦ Gemini 버튼 보이기 (한국어 기사는 숨김)
  var foreign = !!o || !/[가-힣]/.test(c.querySelector('.title').textContent);   // 번역이 안 됐어도 외국 기사면 버튼 표시
  $('s-cs').hidden = $('s-ct').hidden = $('s-cnote').hidden = !foreign;
  if(foreign){
    // 원문을 열고, Gemini 가 '지금 화면'의 기사를 읽고 답하도록 요청 문장만 복사
    $('s-cs').href = $('s-ct').href = c.href;
    $('s-cs').dataset.q = '이 페이지의 기사 전체를 처음부터 끝까지 읽고 한국어로 요약해 줘. 핵심 내용 3~5줄, 그리고 투자자 입장에서 중요한 숫자와 의미를 짧게 정리해 줘.';
    $('s-ct').dataset.q = "너는 어려운 경제 뉴스를 초등학생도 이해할 수 있게 풀어 주는 친절한 번역가야.\n이 페이지의 뉴스 기사 전체를 쉬운 한국어로 번역해 줘.\n\n[가장 중요한 규칙]\n- 쉽게 쓰더라도 기사 내용은 정확해야 해. 사실을 빼거나, 바꾸거나, 지어내지 마.\n- 기사 순서대로, 빠지는 내용 없이 번역해 줘.\n\n[쉽게 쓰는 방법]\n1. 한 문장에는 한 가지 내용만 써 줘. 문장은 짧게.\n2. \"~습니다/~해요\"체로 친절하게 써 줘.\n3. 어려운 말은 쉬운 말로 바꾸고, 꼭 필요한 전문 용어는 처음 나올 때 괄호로 뜻을 풀어 줘.\n   (예: 금리(돈을 빌릴 때 내는 이자의 비율), 실적(회사가 번 돈과 성과), 주가(회사 주식 한 주의 가격))\n4. 한자어·외래어보다 쉬운 우리말을 먼저 써 줘. (예: 하락 → 떨어졌어요, 상승 → 올랐어요)\n5. 큰 숫자는 읽기 쉽게 바꾸되 정확한 값은 지켜 줘. (예: $2.5 billion → 25억 달러(약 3조 5천억 원쯤))\n   환율로 바꾼 값은 \"약\"을 붙여서 대략이라는 걸 알려 줘.\n6. 회사·사람 이름은 한국에서 부르는 이름으로 쓰고, 처음 나올 때만 괄호에 영어 이름을 적어 줘. (예: 엔비디아(Nvidia))\n7. 누가 한 말인지 분명하게 써 줘. (예: 젠슨 황 대표는 \"…\"라고 말했어요.)\n\n[출력 형식]\n① 한 줄 요약: 이 기사가 무슨 이야기인지 한 문장으로\n② 쉬운 번역: 기사 순서대로\n③ 어려운 말 풀이: 기사에 나온 경제 용어 3~5개를 한 줄씩 쉽게 설명\n④ 그래서 무슨 뜻이야?: 이 소식이 주식 투자하는 사람에게 왜 중요한지 2~3줄\n   (기사에 나온 사실만 근거로, 내 생각이나 예측은 넣지 마)\n\n기사가 길어서 한 번에 다 못 하면, 어디까지 했는지 알려 주고 내가 \"계속\"이라고 하면 이어서 해 줘.";
  }
  $('dim').hidden = false; $('sheet').hidden = false; $('sheet').scrollTop = 0;
  document.body.style.overflow = 'hidden';
});
// ✦ 버튼: Gemini 요청 문장을 복사하고 원문을 엶 → 원문 화면에서 Gemini 를 불러 붙여넣기
function askAI(a){
  var q = a.dataset.q || '';
  try { if(navigator.clipboard) navigator.clipboard.writeText(q); } catch(e){}
  toast('요청 문장을 복사했어요 · 원문에서 측면 버튼 길게 → 「이 페이지에 관해 질문하기」 → 붙여넣기');
  setTimeout(closeSheet, 50);
}
function toast(msg){ var t = $('toast'); t.textContent = msg; t.hidden = false; clearTimeout(toast._t); toast._t = setTimeout(function(){ t.hidden = true; }, 4000); }
function closeSheet(){ $('dim').hidden = true; $('sheet').hidden = true; document.body.style.overflow = ''; }
document.addEventListener('keydown', function(e){ if(e.key==='Escape') closeSheet(); });
