= 권소윤 기자 | 삼성SDI가 최주선 사장 체제를 이어가며 수익성 중심의 경영 기조를 유지한다. 실적(회사가 번 돈 성적표) 반등을 이끈 최 사장은 내년 전고체 배터리(액체 대신 고체를 넣은 안전한 배터리) 양산과"},{"s":"Chuangkei Xinxing 2 Meige Energy Storage(7409)는 5가지 주요 장점을 갖춘 최초의 파워 캡슐입니다.","so":"中時新聞網","tm":"11/20 05:10","c":2,"r":"tw","u":"https://www.chinatimes.com/newspapers/20261120000348-260210","p":1795119000,"a":1795128488,"t":"創櫃新星2美格儲能（7409） 首創電力膠囊具五大優勢- 產業特刊- 工商時報","su":"Meige는 세계적인 탄소 감소 추세를 고려하여 \"에너지 생성\"과 \"저장\"을 동시에 수행할 수 있는 세계 유일의 시스템 개발에 전념하고 있습니다. 탄력적인 새로운 전력망을 구축하고 2050년 순 제로를 향한 전환을 가속화하기 위한 최초의 \"파워 캡슐\" 기술입니다. 회사 설립자 Ding Lianjun이 개발한 \"파워 캡슐\"은 미국, 대만 및 중국에서 20년 동안 특허를 취득했습니다."},{"s":"Daya는 계속해서 태양광 발전 및 에너지 저장을 홍보합니다.","so":"中時新聞網","tm":"11/20 05:10","c":2,"r":"tw","u":"https://www.chinatimes.com/newspapers/20261120000432-260206","p":1795119000,"a":1795128490,"t":"大亞續推太陽能光電、儲能","su":"다야(1609)는 19일 연설회를 열고 태양광발전, 에너지저장장치(전기를 저장해 두는 큰 배터리) 등 녹색에너지 산업 배치를 지속적으로 추진하겠다고 밝혔다. Zhiguang Energy에 대한 Daya의 투자는 에너지부로부터 건설 허가를 받은 타이난의 35MW 어업 및 전기 공생 태양광 발전 프로젝트 부지의 Qigu Phase II에 위치하고 있습니다. 올해 말 착공, 내년 3분기 완공, 4분기 상장(주식시장에 처음 들어오는 것)을 목표로 하고 있다. 마음"},{"s":"Guangding의 운영은 올해 압박을 받고 있지만 내년에는 광통신 및 에너지 저장 분야의 성장 모멘텀에 대해 낙관하고 있습니다 | 주식정보 | 주식 시장","so":"UDN","tm":"11/19 17:58","c":2,"r":"tw","u":"https://udn.com/news/story/7252/9889437","p":1795078718,"a":1795089987,"t":"廣錠今年營運承壓看好明年光通訊、儲能成長動能| 個股情報| 股市","su":"산업용 컴퓨터 제조업체 Guangding(6441)은 올해 단기 운영이 어려움에 직면할 것이라고 인정했지만 회사는 다음 단계의 성장을 위한 기반을 구축하고 있습니다. 광딩은 2027년을 기대하며 실제 주문이 있는 AI 광통신과 대규모 프로젝트 납품을 촉진하는 에너지 저장 사업이 먼저 수익에 기여할 가능성이 가장 높은 두 가지 주요 원동력이 될 것으로 기대하고 있다. 회사는 점차 손실을 흑자(번 돈이 쓴 돈보다 많은 것)로 바꾸는 목표를 향해 나아갈 것입니다."},{"s":"중국 ESS 배터리 계획 생산능력, 세계 출하량 두 배 육박","so":"전자신문","tm":"11/22 17:00","c":1,"r":"kr","u":"https://www.etnews.com/20261120000236","p":1795334400,"a":1795334544,"su":"중국의 에너지저장장치(ESS(전기를 저장해 두는 큰 배터리))용 배터리 계획 생산능력이 올해 세계 출하량의 두 배에 육박하는 것으로 나타났다. 대규모 설비 증설에 따른 공급과잉 우려 속에 중국 기업들이 해외시장 공략을 확대하면서 가격 경쟁도 심화되고 있다. 22일 중국 현지 매체와 배터리 업계에 따르면 중국 ESS 배터리 셀의 전체 계획 생산능력은 연간 2000GWh(기가와트시)에 근접할 것으로 추산된다. 시장조사업체 인포링크컨설팅이 전망한 올해 글로벌 ESS 배터리 셀 출하"},{"s":"세계 최대의 액체 공기 에너지 저장 프로젝트를 방문해 보세요","so":"中国新闻网","tm":"11/22 15:17","c":1,"r":"cn","u":"https://www.chinanews.com.cn/cj/shipin/cns-d/2026/11-22/news1075696.shtml","p":1795328220,"a":1795334544,"t":"探访全球最大液态空气储能项目","su":"세계 최대 액체 공기 에너지 저장 프로젝트 방문 출시 시간: 2026년 11월 22일 14:17 출처: 중국 뉴스 네트워크 11월 22일 기자들은 칭하이 성 하이시 몽골 및 티베트 자치주 거얼무시에 위치한 세계 최대 60메가와트 액체 공기 에너지 저장 국가 시범 프로젝트를 방문했습니다. 이 프로젝트는 중국의 액체 공기 에너지 저장 기술에 대한 포괄적인 숙달을 의미하며 장비 국산화율은 100%에 달하고 에너지 저장 전력 및 용량은 세계 1위를 차지합니다. 올해 10월 30일 전력망에 성공적으로 연결됐다. 공기에너지저장장치(전기를 저장해 두는 큰 배터리)는 공기를 영하 194도까지 냉각해 액체 상태로 만든 뒤 저장했다가 전력이 필요할 때 방출해 전기를 생산하는 방식이다. 풍력과 태양광발전은 급속도로 발전하고 있지만 날씨에 따라 변동폭이 크고 변동폭이 크다. 그것들은 저장될 수도 없고 양도될 수도 없습니다. 이 프로젝트는 신에너지 전력의 \"낮은 계곡 저장 및 피크 사용\"을 실현하여 풍력 및 태양열 소비 문제를 효과적으로 해결합니다."},{"s":"[기획]전력망 깔고 ESS 늘리고…배터리·전선업계 '기회'","so":"매일일보","tm":"11/22 13:00","c":1,"r":"kr","u":"https://www.m-i.kr/news/articleView.html?idxno=2021408","p":1795320000,"a":1795334544,"su":"매일일보 = 김채은 기자 | 재생에너지 확대와 첨단산업의 전력 수요 증가로 배터리·전선업계의 수주(일감 주문을 받는 것) 기회가 늘고 있다. 발전량 변동에 대응하는 에너지저장장치(ESS(전기를 저장해 두는 큰 배터리)"},{"s":"K배터리 미국 시장에 의존 한계 부각, 유럽·인도까지 '동맹 확장' 필요성 제기","so":"비즈니스포스트","tm":"11/22 06:00","c":1,"r":"kr","u":"https://www.businesspost.co.kr/BP?command=article_view&num=452289","p":1795294800,"a":1795303165},{"s":"전력망 막혀 늦어졌던 '농촌 태양광'…ESS로 활로 뚫는다","so":"뉴시스","tm":"11/22 06:00","c":1,"r":"kr","u":"https://www.newsis.com/view/NISX20261120_0003876545","p":1795294800,"a":1795320069,"su":"[세종=뉴시스]임소현 기자 = 전력망 부족으로 사업이 지연됐던 농촌 마을 태양광발전소가 에너지저장장치(ESS(전기를 저장해 두는 큰 배터리))를 활용해 전력망 연결 문제를 해결하는 방안을 추진한다.충북 괴산과 경북 봉화, 경남 산청 등 3개 지역에 총 950㎾ 규모의 마을 태양광발전소를 조성하는 방안이 검토되고 있다. 한국농어촌공사는 이들 사업지에 ESS를 연계하는 방안을 검토하고, 부지.."},{"s":"황 Chencong: 에너지 저장 성장이 속도를 바꾸고 있으며, 글로벌 산업 체인을 재구성하기 위해 대형 배터리 셀의 양이 증가하고 있습니다.","so":"21财经","tm":"11/21 17:28","c":1,"r":"cn","u":"https://www.21jingji.com/article/20261121/herald/3183f39572544828f50ba024cc5c82e6.html","p":1795249680,"a":1795259718,"t":"黄辰聪：储能增速换挡，大电芯放量重构全球产业链","su":"21세기 비즈니스 헤럴드(21st Century Business Herald) 기자 Fei Xinyi는 청두에서 \"내년 에너지 저장 출하량의 성장률은 22%가 될 수 있지만 프로젝트의 약 70%가 대형 셀을 사용할 것\"이라고 보도했습니다. SMM Energy Storage의 수석 분석가인 황 Chencong은 \"21세기·신에너지 및 새로운 품질\" 녹색 에너지 개발 포럼에서 이렇게 말했습니다. 2026년 11월 19일, 쓰촨성 청두에서 2026년 '21세기·신에너지 및 신품질' 녹색에너지 발전포럼이 개최됐다. 이번 포럼은 21세기 비즈니스 헤럴드와 중국 국제 태양광 및 에너지 저장 산업 회의 조직위원회가 주최하고 21세기 비즈니스 헤럴드 에너지 정책 스튜디오가 시행했습니다. 많은 업계 전문가들이 에너지 전환 전망과 태양광발전소 산업 동향에 대해 심도 있는 논의를 진행했습니다."},{"s":"Scana는 내년에 인도될 240MW 전력 장비에 대한 노르웨이 AI 데이터 센터 에너지 저장 주문을 받았습니다.","so":"鉅亨網","tm":"11/21 10:49","c":1,"r":"tw","u":"https://news.cnyes.com/news/print/6669419","p":1795225778,"a":1795248149,"t":"Scana拿下挪威AI資料中心儲能訂單240MW電力設備明年起交付","su":"Uanalyze 2026-11-20 20:30 November 20, 2026 (Uanalyze/Industrial Data Center Report) ⸺ 노르웨이 산업 그룹 Scana는 전력 장비 제조업체인 PSW Power & Automation이 Tydal Data를 인수했다고 발표했습니다. 이 AI 데이터센터(컴퓨터 수만 대를 모아 둔 건물)의 배터리 에너지 저장 시스템은 2027년 1분기부터 납품될 예정이다. 회사가 발표한 계약 분류에 따르면 주문 금액은 NOK 7500만~1억 5000만 NOK이다."},{"s":"[국방군아침뉴스] 군과 민간이 힘을 합쳐 에너지저장장치 및 에너지 신소재 기술 발굴","so":"央视网","tm":"11/21 09:16","c":1,"r":"cn","u":"https://tv.cctv.com/2026/11/21/VIDExHil3CSLtFPBIHV3gxii261121.shtml","p":1795220160,"a":1795248148,"t":"[国防军事早报]军地携手探索储能与新能源材料技术","su":"프로그램 공식 홈페이지 컬렉션 재생목록 인기목록 현재재생 중 [국방군아침뉴스] 군과 민간이 함께 에너지저장장치(전기를 저장해 두는 큰 배터리)와 에너지 신소재 기술을 탐구 출처 : CCTV.com 2026-11-21 08:16 내용소개 영상소개 팔로우 군과 민간이 함께 에너지저장장치와 에너지신소재기술을 탐구한다. 칼럼정보 칼럼명 : 칼럼소개 : [국방군아닝뉴스] 군민이 힘을 합쳐 에너지저장장치와 에너지 신소재기술을 탐구한다. 소개 출처 : CCTV.com 업데이트 시간 : 2026년 11월 21일 08:16 영상소개 군과 민간이 힘을 합쳐 에너지저장장치와 에너지 신소재기술을 탐구한다. 칼럼 정보 재생목록 더보기 > 지난 쿼리 > 하이라이트 더보기 > 지난 프로그램 더보기 > 재생목록 닫기 5월 4월 3월 2월 더보기 Loading..."},{"s":"현대 환경 연금술 - '화학 폐기물'을 '검은 금'으로 바꾸는 환경보호청, 전기차 배터리 순환경제 해체","so":"香港經濟日報HKET","tm":"11/21 09:00","c":1,"r":"hk","u":"https://paper.hket.com/article/4228734/","p":1795219200,"a":1795226177,"t":"現代環保煉金術―將「化學廢物」變成「黑金」 環保署拆解電動車電池的循環經濟學"},{"s":"배터리 제조사 GS 유아사, 성장 분야로 국방·우주 목표 : CEO","so":"Nikkei Asia","tm":"11/21 06:25","c":1,"r":"us","u":"https://asia.nikkei.com/editor-s-picks/interview/battery-maker-gs-yuasa-targets-defense-space-as-growth-fields-ceo","p":1795209900,"a":1795215176,"t":"Battery maker GS Yuasa targets defense, space as growth fields: CEO","su":"교토에 본사를 둔 회사는 비용을 절감하고 배송 시간을 단축하기 위해 더 많은 자동화를 모색하고 있습니다."},{"s":"이 500kWh 에너지 저장 시스템은 폐기된 EV 배터리로 작동합니다.","so":"Electrek","tm":"11/21 06:08","c":1,"r":"us","u":"https://electrek.co/2026/11/20/this-500-kwh-energy-storage-system-runs-on-retired-ev-batteries/","p":1795208880,"a":1795215179,"t":"This 500 kWh energy storage system runs on retired EV batteries","su":"Moment Energy의 Nova는 폐기된 EV 배터리를 전기 요금을 절감하고 상업용 사이트를 백업할 수 있는 500kWh 저장 장치로 전환합니다."},{"s":"해외 컴퓨팅 파워 구축이 뜨거워지면서 태양광, 풍력, 에너지저장의 지원 논리는 어떻게 변할 것인가?","so":"每日经济新闻","tm":"11/20 22:43","c":1,"r":"cn","u":"http://www.nbd.com.cn/rss/toutiao/articles/4654392.html","p":1795182180,"a":1795259719,"t":"海外算力建设升温，光伏、风电与储能的配套逻辑会怎么变？","su":"11월 18일, 청두에서 열린 2026년 제9회 중국 국제 태양광 및 에너지 저장 산업 컨퍼런스에서 Terad 중국 국내 마케팅 센터 부국장 Guo Fuzhen은 \"Daily Economic News\"(이하 \"Daily Reporter\") 기자와의 인터뷰에서 회사가 작년부터 데이터 센터 배전 사업을 계획하는 데 있어 인터넷 기업 및 통신 사업자를 따르고 있다고 말했습니다. 해외 사업에 있어서 그녀는 특히 동남아시아에 대해 낙관적이다. Triad의 2026년 3분기 보고서에 따르면 회사는 태국의 AMATA 시리즈 컴퓨팅 파워 센터 프로젝트와 말레이시아의 컴퓨팅 파워 센터 프로젝트에 대한 입찰을 따냈습니다. 또한 전산실 건설은 또 다른 유형의 전력 공급 수요를 가져옵니다. 국제에너지기구(International Energy Agency)의 분석에 따르면 인공지능 모델을 구동할 때 서버의 전력 소비량은 단시간 내에 크게 변동할 수 있습니다. 현장 배터리는 컴퓨터실이 이러한 변동에 대처하는 데 도움이 될 수 있습니다."},{"s":"삼성SDI는 16GWh 수준으로 잠긴다. 중국 제조업체는 미국 에너지 저장 셀의 \"규정 준수 프리미엄\"을 몇 년 동안 유지할 수 있습니까? -36Kr","so":"36kr","tm":"11/20 16:17","c":1,"r":"cn","u":"https://www.36kr.com/p/4077533371258754","p":1795159072,"a":1795175827,"t":"三星SDI锁单16GWh，美国储能电芯的“合规溢价”还能给中国厂商留几年？-36氪","su":"삼성SDI는 16GWh 수준으로 잠긴다. 중국 제조업체는 미국 에너지 저장 셀의 \"규정 준수 프리미엄\"을 몇 년 동안 유지할 수 있습니까? 삼성 SDI signed a long-term LFP order with the US Reserve, and the FEOC compliance threshold has been rising year by year. The North American compliance premium window for Chinese manufacturers is about 2027-2029, and is expected to narrow after that. Foresight Energy noticed that the deal announced by 삼성 SDI on November 16 was not complicated: the US subsidiary signed a contract with Jupiter Power, a subsidiary of 블랙록, to supply 16GWh lithium iron phosphate batteries from 2029 to 2031. The contract is estimated to be about 5 billion yuan, all produced at the StarPlus factory in Indiana. Taking into account previous agreements, the cumulative amount locked by both parties is approximately 27GWh."},{"s":"격차는 4.4배에 이르며 에너지저장장치 입찰과 설치가 가속화되고 있다.","so":"经济观察网","tm":"11/20 15:42","c":1,"r":"cn","u":"https://www.eeo.com.cn/2026/1120/1097760.shtml","p":1795156942,"a":1795175828,"t":"落差达4.4倍 储能招标与装机加速背离","su":"2026년 1월부터 9월까지 중국 국내 에너지저장산업 입찰 규모는 451.9GWh로 전년 동기 대비 48% 증가했지만, 신규 설치된 용량은 102.3GWh로 6% 증가에 그쳐 둘 사이의 격차가 약 4.4배에 달했다. 시기적 지연 외에도 수익모델 변화, 전력망 지원 병목현상, 해외 고마진 전환 등의 요인으로 전환 어려움이 가중됐다. 최근 기한이 지난 프로젝트가 여러 곳에서 청산되고 종이 주문으로 인해 실물 자산이 밀려나고 있습니다. 2027년 전력망 연결 규모를 늘릴 수 있을지 여부는 전력 가격 메커니즘의 시행과 자본 비용 개선에 달려 있다."},{"s":"중국 CATL 미국 '독립 전력망' AI 데이터센터 노린다, K배터리 3사 ESS 시장 경쟁력 촉각","so":"비즈니스포스트","tm":"11/20 15:41","c":1,"r":"kr","u":"https://www.businesspost.co.kr/BP?command=article_view&num=452525","p":1795156896,"a":1795226172},{"s":"ESS로 활로 찾은 K배터리..공장 가동률 회복세 접어들어 - 머니투데이","so":"머니투데이","tm":"11/20 15:25","c":1,"r":"kr","u":"https://www.mt.co.kr/amp/industry/2026/11/20/2026112014354645196","p":1795155906,"a":1795175825,"su":"국내 배터리업계가 에너지저장장치(ESS(전기를 저장해 두는 큰 배터리)) 시장 성장 등에 힘입어 생산시설 가동률을 끌어올리고 있다. 내년부터는 북미 지역 생산거점에서 ESS용 배터리 생산라인이 본격 가동되면서 회복세가 더욱 뚜렷해질 것이란 전망이 나온다."},{"s":"'2026년 중국 전고체전지 산업 발전 블루북' : 2030년 전고체전지 출하량의 약 20% 차지","so":"21财经","tm":"11/20 15:08","c":1,"r":"cn","u":"https://www.21jingji.com/article/20261120/herald/ed8e272e3d94dfb487633c8049aced63.html","p":1795154880,"a":1795158263,"t":"《2026中国固态电池行业发展蓝皮书》：2030年全固态电池占总出货量约20%","su":"11월 20일 개최된 제11차 파워 배터리 응용 국제 정상회의에서 '2026년 중국 전고체 배터리(액체 대신 고체를 넣은 안전한 배터리) 산업 발전 블루북'이 공식적으로 발표되었습니다. 보고서는 2026년부터 2027년이 전고체전지 파일럿 라인의 중앙 집중식 완성 및 운영을 위한 핵심 기간이라고 언급했습니다. 중국은 총 20개 이상의 파일럿 라인을 건설 및 건설 중이며 단일 라인 생산 능력은 0.2GWh에서 2GWh에 이르며 기술 경로는 황화물, 산화물, 할로겐화물의 세 가지 주요 시스템을 포괄합니다. 2027년에는 선도 기업들이 약 2.3GWh의 설치 용량으로 소규모 배치 차량급 배송을 시작할 예정입니다. 2028년부터 2029년까지는 수율이 증가하고 비용이 감소함에 따라 대규모 생산 능력 확장 단계에 진입하게 됩니다. 2030년 중국 전고체전지 출하량은 21.9GWh로 전체 출하량의 약 20%를 차지할 것으로 예상된다."},{"s":"에너지 저장 정책은 장기적으로 좋습니다. Southern Fund의 신에너지 ETF Southern(516160)이 추적하는 기본 지수는 어제 1.29% 하락으로 마감했습니다.","so":"Jiemian.com","tm":"11/20 12:14","c":1,"r":"cn","u":"https://www.jiemian.com/article/15353677.html","p":1795144475,"a":1795158264,"t":"储能政策长期利好，南方基金旗下新能源ETF南方(516160)跟踪标的指数昨日收跌1.29%","su":"2026년 11월 19일 거래 마감 현재, 신에너지 ETF(여러 주식을 묶어 파는 상품) Southern(516160)은 거래량 7724.44만 건으로 2.69% 손이 바뀌었고, 추적 기초 지수인 CSI New Energy Index(399808.SZ)는 1.29% 하락했습니다."},{"s":"SK온, 25년 장주기 제주 ESS 사업 도전","so":"디일렉","tm":"11/20 11:39","c":1,"r":"kr","u":"https://www.thelec.kr/news/articleView.html?idxno=65705","p":1795142345,"a":1795226172,"su":"SK온이 리튬인산철(LFP) 배터리를 앞세워 제주 에너지저장장치(ESS(전기를 저장해 두는 큰 배터리)) 장기계약 시장에 도전한다. 통상 15년 안팎인 리튬이온 배터리의 운용기간을 25년까지 늘"},{"s":"중개 아침회의 하이라이트: 새로운 에너지 저장 장치 \"15차 5개년 계획\" 시행, 3억 킬로와트, 새로운 시장화 단계 정립","so":"财联社","tm":"11/20 11:28","c":1,"r":"cn","u":"https://www.cls.cn/detail/2537312","p":1795141697,"a":1795158268,"t":"券商晨会精华：新型储能“十五五”方案落地，3亿千瓦锚定市场化新阶段","su":"화타이증권은 새로운 에너지 저장을 위한 '15차 5개년 계획'이 구현되었으며 3억 킬로와트가 새로운 시장화 단계를 정립했다고 믿습니다. Zhongtai Securities는 Ciyuan이 새로운 기회를 찾기 위해 해외로 나갈 것이라고 믿습니다. CITIC건설투자는 해외 컴퓨팅파워 투자가 지속적으로 확대될 것으로 보고 27년간 수요 연속성과 공급 납품에 중점을 둘 것이라고 밝혔다. Cailian News Agency는 11월 18일에 시장이 상승한 후 장 후반에 소폭 반등(내렸다가 다시 오르는 것)했다고 보도했습니다. GEM지수는 1% 넘게 하락했다. 이전에는 거의 1% 상승했습니다. 과학기술혁신50지수는 장 초반 3% 이상 상승했다. 상하이·선전 증시 거래액은 1조4600억원으로 전 거래일보다 268억원 감소했다. 전체 시장에서 4,100개 이상의 주식이 하락했고, 거의 80개 주식이 제한 아래에 있었습니다. 시장에서는 테마 회전이 약하고 칩 산업 체인이 활발하며 가전 부문이 반복적으로 활성화되고 화웨이의 컴퓨팅 파워 개념이 부분적으로 강력합니다. 단점으로는 물리 AI 개념이 계속 하락하고 AI 만화 개념이 더 낮아지며 많은 주식이 제한적이라는 것입니다. 장을 마감한 시점에서 상하이 증권거래소 지수는 0.5% 하락했고, 선전 구성요소 지수는 0.49% 하락했으며, 차이넥스트 지수는 1.2% 하락했다."},{"s":"“영화 9년도를 향한 발전·축전 설비에 대한 세제 우대·보조금”이라고 제목을 붙여, 주식회사 KKR 컨설팅","so":"毎日新聞","tm":"11/20 10:53","c":1,"r":"jp","u":"https://mainichi.jp/articles/20261120/pr2/00m/020/121000c","p":1795139586,"a":1795215182,"t":"「令和9年度に向けた発電・蓄電設備に対する税制優遇・補助金」と題し、株式会社KKRコンサルティング 山田純也税理士事務所 山田 純也氏/池田 美香氏によるセミナーを2026年12月22日(火)開催!!（PR TIMES）"},{"s":"베트남의 새로운 녹색 에너지 스타트업은 자금 부족에 직면해 있습니다. 대만 사업가: 대만의 스마트 에너지 저장 기술이 변화를 도울 것입니다","so":"中央社 CNA","tm":"11/20 10:39","c":1,"r":"tw","u":"https://netzero.cna.com.tw/news/202611200040/","p":1795138743,"a":1795144495,"t":"越南綠能新創陷融資荒 台商：台灣智慧儲能技術有助轉型","su":"베트남은 에너지 전환을 적극적으로 추진하고 있지만 최신 보고서에 따르면 지역 기후 기술 혁신이 심각한 자금 조달(사업에 쓸 돈을 모으는 것) 격차에 빠진 것으로 나타났습니다. 지난해 전체 자금조달 규모는 절반으로 줄었고, 사업확장을 위한 핵심 자금조달도 그대로 사라졌다. 녹색 에너지 야망은 재정적 병목 현상에 직면해 있습니다. 대만 사업가 Chien Chi-ming은 대만이 기후 기술 분야에서 우위를 점하고 있으며 스마트 에너지 저장 기술이 베트남이 새로운 에너지를 촉진하는 데 도움이 될 것이라고 말했습니다."},{"s":"파워엑스---반락, 중동만안지역에서 축전시스템의 공동판매를 위한 제휴도","so":"株探","tm":"11/20 10:16","c":1,"r":"jp","u":"https://kabutan.jp/news/marketnews/?b=n202611200494","p":1795137360,"a":1795219464,"t":"パワーエックス---反落、中東湾岸地域で蓄電システムの共同販売に向け提携も"},{"s":"화타이증권: 허난성의 새로운 사용 시간 전기 가격 정책에 대한 의견을 구하면 에너지 저장 프로젝트에 이익이 될 수 있음","so":"第一财经","tm":"11/20 10:14","c":1,"r":"cn","u":"https://www.yicai.com/news/103447386.html","p":1795137282,"a":1795144493,"t":"华泰证券：河南分时电价新政征求意见 储能项目或受益","su":"제일재경 2026-11-20 09:12:34 편집자: Tang Yanbei 화타이증권 연구 보고서에 따르면 허난성 개발 개혁 위원회는 11월 16일 \"우리 성의 산업 및 상업을 위한 사용 시간 전기 가격 정책 최적화 및 개선에 관한 고시\"에 대한 의견을 공개적으로 모집하고 사용 시간 변동 가격에 시스템 운영 비용을 포함하고 송배전 가격을 이전하고 확립할 계획이라고 밝혔습니다. 피크 및 밸리 기간 동안의 연간 동적 조정 메커니즘. 저장(Zhejiang), 산둥(Shandong), 산시(Shaanxi)에 이어 허난(Henan)은 시스템 운영 비용에 대한 사용 시간 가격 책정을 추가로 조사하며, 이는 현지 가격 메커니즘이 에너지 저장 및 충전 비용 상승에 점차적으로 대응하고 있음을 반영합니다. 최저점 기간 동안의 비용 하락은 에너지 저장 운영의 경제성을 향상시킬 것으로 예상됩니다. 최근 국가의 에너지저장장치(전기를 저장해 두는 큰 배터리) 건설 지원 정책과 탄산리튬 가격 하락으로 인해 에너지저장 수요는 더욱 늘어날 것으로 예상된다."},{"s":"Xijiao International(01765)은 5,390만 위안을 지출하여 태국 태양광 발전 설치 및 에너지 저장 솔루션 제공업체의 지분 51%를 인수했습니다.","so":"etnet 經濟通","tm":"11/20 09:19","c":1,"r":"hk","u":"https://www.etnet.com.hk/www/tc/news/news-article.php?section=categorized&category=company&newsid=20261120978","p":1795133940,"a":1795144497,"t":"希教國際(01765)斥5390萬元，收購泰國光伏安裝及儲能解決方案商51%股權","su":"2026/11/20 08:19 Xijiao International Holdings(01765)는 RMB 5,390만 달러를 지출하여 태국의 태양광 발전 설치 및 에너지 저장 솔루션 제공업체의 지분(회사를 나눠 가진 몫) 51%를 인수했습니다. Xijiao International Holdings(01765)는 DINGLI & SF SOLAR ENERGY COMPANY LIMITED의 지분 51%를 RMB 4,614만 달러에 인수했다고 발표했습니다. (약 5,390만 홍콩달러). 그룹은 DINGLI가 태국에 등록된 회사로 태양광 발전 및 기타 신에너지 프로젝트의 설계, 설치, 유지 관리 및 관리뿐만 아니라 에너지 저장 솔루션을 제공하는 회사라고 지적했습니다. 올해 8월말 현재 연간 164만바트의 적자(쓴 돈이 번 돈보다 많은 것)를 냈다. 그룹 측은 이번 인수가 동남아 신재생에너지 분야 진출과 사업영역 확장을 위한 전략적 기회를 제공한다고 밝혔다. 매도인은 Gaoli가 통제하는 법인이고 Gaoli는 그룹의 지배주주이자 전무이사인 Wang Huiwu가 설립한 취소 불가능한 가족 신탁인 Maysunshine Trust의 수혜자 중 한 명이므로 이번 인수는 연결된 거래로 간주되며 독립적인 주주 승인 요건이 면제됩니다."},{"s":"CITIC 증권: 비용 절감 및 이익 증대, 중국 국내 독립 에너지 저장 장치 경제 전환점이 다가오고 있습니다.","so":"Jiemian.com","tm":"11/20 09:16","c":1,"r":"cn","u":"https://m.jiemian.com/article/15352807.html","p":1795133762,"a":1795144494,"t":"中信证券：降本增利，国内独立储能经济性拐点将至","su":"CITIC Securities 연구 보고서에 따르면 2026년부터 새로운 에너지 저장 장치의 비용 측면과 수익 측면이 동시에 압박을 받고 있습니다. 탄산리튬 가격 인상으로 배터리 셀 비용이 증가했고, 시스템 운영비 증가로 매출(물건을 판 돈 전체) 손실이 발생했다. 중국 국내 프로젝트의 전반적인 경제 상황은 압박을 받아왔습니다. 이는 2026년 중국 국내 대용량 스토리지 설치 용량에 어느 정도 영향을 미쳤습니다. CESA에 따르면 2026년 첫 9개월 동안 중국 국내 신규 설치 용량은 111GWh로 전년 대비 87% 증가했다. 현 단계에서는 탄산리튬 가격이 2026년 5월 고점 대비 톤당 10만위안 이상 하락해 배터리 셀 원가도 하락할 여지가 있다. 시스템 운영 비용 공유 메커니즘의 최적화는 새로운 에너지 저장을 위한 \"15차 5개년 계획\"에 기록되었습니다. 중국의 많은 지방에서는 계곡 구간에서 충전할 때 새로운 에너지 저장 장치의 충전 비용을 줄이기 위해 시스템 운영 비용을 시분할 변동에 통합하는 정책을 연속적으로 발표했습니다. 중국의 새로운 국내 에너지 저장 프로젝트의 경제성이 미래에 뚜렷한 한계 개선을 볼 것이라고 판단하고, 새로운 에너지 저장 산업 체인에 대해 낙관적이며, 먼저 혜택을 받을 대규모 에너지 저장 통합업체를 추천하는 데 중점을 두고, 설치 용량 증가로 인한 리튬 배터리 및 재료에 대한 수요 증가에 주의를 기울입니다."},{"s":"라틴 아메리카에서 디젤을 태양광 및 배터리로 교체","so":"POWER Magazine","tm":"11/20 08:50","c":1,"r":"us","u":"https://www.powermag.com/partner-content/replacing-diesel-with-solar-and-batteries-in-latin-america/","p":1795132218,"a":1795132840,"t":"Replacing Diesel With Solar and Batteries in Latin America","su":"화웨이와 태양광 파트너는 원격 라틴 아메리카 지역사회에 전력을 공급하기 위해 디젤을 태양광 및 배터리 저장 장치로 대체하고 있습니다."},{"s":"리튬 기업들은 금속 리튬의 물성을 테스트하고 전고체 배터리 소재를 늘린다.","so":"第一财经","tm":"11/20 08:42","c":1,"r":"cn","u":"https://www.yicai.com/news/103447295.html","p":1795131724,"a":1795132841,"t":"锂企“试水”金属锂 加码固态电池材料","su":"상하이 증권 뉴스에 따르면 전고체 배터리(액체 대신 고체를 넣은 안전한 배터리)는 아직 진행 중이며 리튬 회사는 이미 재료 측면에서 조치를 취했습니다. 최근에는 연간 1,000톤의 고에너지 리튬 배터리 소재를 생산하는 톈치리튬의 배터리급 금속 리튬 프로젝트가 충칭 퉁량구에서 완료되었습니다. 프로젝트가 가동되면 톈치리튬의 총 리튬 금속 생산 능력은 연간 1,600톤으로 증가될 것입니다. 기자는 톈치리튬에서 현재 제품이 샘플 검증을 위해 다운스트림 헤드 배터리 및 고급 합금 고객에게 전송되었다는 사실을 알게 되었습니다. 톈치리튬뿐만이 아닙니다. Ganfeng Lithium Industry의 Qinghai 장치는 시험 운전 중입니다. Shengxin Lithium Energy의 초박형 리튬 스트립은 일괄 공급되었습니다. Beterui와 Zhongyi Technology도 음극과 호일의 양쪽 끝에서 금속 리튬까지 확장하고 있습니다. 전고체 배터리 양극의 잠재적으로 중요한 재료로서 금속 리튬은 점차 \"앞줄\"로 밀려나고 있습니다. \"가장 큰 수요는 전고체전지용 리튬금속 음극에서 나올 것으로 예상된다.\" 리튬 배터리 업계에 정통한 사람들은 리튬 금속 양극이 높은 비용량 및 높은 작동 전압과 같은 장점을 갖고 있지만 수지상 결정 성장 및 계면층의 불안정성과 같은 문제는 여전히 해결되어야 한다고 생각합니다."},{"s":"[더벨]한중엔시에스, ESS 수냉식 열관리로 경영혁신 대상 - 머니투데이","so":"머니투데이","tm":"11/20 08:22","c":1,"r":"kr","u":"https://www.mt.co.kr/amp/stock/2026/11/20/2026112008089680830","p":1795130551,"a":1795144493,"su":"에너지저장장치(ESS(전기를 저장해 두는 큰 배터리)) 통합 열관리 솔루션 전문기업 한중엔시에스는 '2026 중소기업 경영혁신 대상'에서 중소벤처기업부 장관상을 수상했다고 20일 밝혔다. 한중엔시에스는 19일 충북 청주 오스코(OSCO)에서 개최된 '2026 중소기업 혁신주간'(K-INNO WEEK) 행사에서 경영혁신 대상 수상기업으로 선정됐다."},{"s":"우에다시의 대규모 축전지 시설 계획, 퍼지는 반대 지역을 포함한 지구 전체에서 결의","so":"信濃毎日新聞デジタル","tm":"11/20 06:01","c":1,"r":"jp","u":"https://www.shinmai.co.jp/news/article/gf01dbvdp5v6q3v49iv1kh4g","p":1795122060,"a":1795128491,"t":"上田市の大規模蓄電池施設計画、広がる反対 地元を含む地区全体で決議","su":"우에다시 오카에서 부상하고 있는 대규모 계통용 축전지 시설의 정비 계획을 둘러싸고, 현지의 오카를 포함한 10자치회에서 만드는 가와니시 지구 자치회 연합회는 19일, 「가와니시 지구 전체에서 계획에 반대한다」라고 결의했다. 대책위원회를 마련해 시나 현에 조례 정비를 요구해 가는 것 외, 전문가를 초대한 공부회 등을 연다. 이날 임시총회에서 결정했다. 사업 계획 \""},{"s":"1차는 삼성SDI, 2차는 SK온…2조원 ESS 수주전, 이번 승부처는?","so":"데일리안","tm":"11/20 06:00","c":1,"r":"kr","u":"https://www.dailian.co.kr/news/view/1717295/1%EC%B0%A8-%EC%82%BC%EC%84%B1SDI-2%EC%B0%A8-SK%EC%98%A82%EC%A1%B0%EC%9B%90-E-2026","p":1795122000,"a":1795175825,"su":"삼성SDI와 SK온이 2조원대로 추산되는 에너지저장장치(ESS(전기를 저장해 두는 큰 배터리)) 수주(일감 주문을 받는 것)전에서 다시 맞붙었다. 이번에 나온 물량은 앞선 두 차례 낙찰분을 합친 것보다 많은데 배터리 공급사는 LG에너지솔루션의 불참으로 두 곳으로 줄었다. 양사가 수익성을 지킬 여지는 커졌지만 배터리를 사들이는 발전사업자들은 여전히 낮은 입찰가를 써내야 유리하다. 삼성SDI와 SK온이 어느 선에서"},{"s":"'노바': 모멘트 에너지, 2차 배터리 저장 시스템 출시","so":"electrive.com","tm":"11/20 03:30","c":1,"r":"us","u":"https://www.electrive.com/2026/11/19/nova-moment-energy-launches-second-life-battery-storage-system/","p":1795113000,"a":1795180898,"t":"‘Nova’: Moment Energy launches second-life battery storage system","su":"캐나다 배터리 기술 회사인 Moment Energy는 재활용된 EV 배터리를 사용하여 구축된 새로운 배터리 에너지 저장 시스템(BESS(전기를 저장해 두는 큰 배터리))인 Nova를 공개했습니다. 시스템"},{"s":"배터리 구동 공장의 LEGO 스위치","so":"Design and Development Today","tm":"11/20 03:00","c":1,"r":"sg","u":"https://www.designdevelopmenttoday.com/industries/manufacturing/news/22978702/lego-switches-on-batterypowered-factory","p":1795111212,"a":1795128493,"t":"LEGO Switches on Battery-Powered Factory"},{"s":"Yunbao Energy는 친환경 전력, 에너지 저장, AIDC를 통해 AI 인프라 비즈니스 기회를 포착합니다.","so":"UDN","tm":"11/19 18:36","c":1,"r":"tw","u":"https://udn.com/news/story/7252/9889534","p":1795081007,"a":1795089990,"t":"雲豹能源搶攻AI基建商機 綠電、儲能、AIDC三箭齊發","su":"아시아 통합 저탄소 신에너지 그룹 Cloud Leopard Energy(6869)가 자회사 Tianneng Green Power(7842), Taipuwei Energy(7921)와 손잡고 핵심 사업 성장과 AI 인프라 사업 기회에 집중하는 3분기 기업 설명회를 오늘 열었습니다. AI 컴퓨팅 파워에 대한 수요 증가와 에너지 전환 과제에 직면한 Yunbao Energy는 AI 데이터 센터, 저탄소 에너지, 지속 가능한 재활용이라는 세 가지 핵심 비즈니스를 통합하여 그린 컴퓨팅 파워 시장을 적극적으로 공격합니다."},{"s":"'기술적이며 논란의 여지 없음': 뉴질랜드 규제 당국이 배터리 저장 가격 범위 규칙 날짜를 수정함","so":"Energy-Storage.News","tm":"11/19 18:21","c":1,"r":"us","u":"https://www.energy-storage.news/nz-regulator-corrects-bess-price-band-rule-date/","p":1795080062,"a":1795158261,"t":"'Technical and non-controversial': New Zealand regulator corrects battery storage price band rule date"},{"s":"APEC 심천 정상회담 참관: 에너지 저장 회사가 140개국에 현지화된 답변을 제공합니다.","so":"经济观察网","tm":"11/19 17:25","c":1,"r":"cn","u":"http://www.eeo.com.cn/2026/1119/1097234.shtml","p":1795076751,"a":1795089980,"t":"APEC深圳峰会观察：一家储能公司的140国本地化答卷","su":"2026년 APEC 비즈니스 리더스 서밋은 '아시아태평양 에너지 공동체' 공동 건설이 처음 제안된 선전에서 개최될 예정이다. 선전에서 출발한 에너지 저장 기업인 Zhenghao EcoFlow는 140개국을 포괄하는 '1지역, 1정책' 현지화 실천으로 이에 대응했습니다."},{"s":"시플리(Shipley) 전 뉴질랜드 총리: 중국의 광전지 에너지는 글로벌 에너지 전환에 핵심적인 지원을 제공합니다","so":"中国新闻网","tm":"11/19 17:22","c":1,"r":"cn","u":"https://www.chinanews.com.cn/cj/2026/11-19/10734697.shtml","p":1795076529,"a":1795089982,"t":"新西兰前总理希普利：中国光伏储能为全球能源转型提供关键支撑","su":"시플리(Shipley) 전 뉴질랜드 총리: 중국의 태양광 에너지 저장 장치는 글로벌 에너지 변혁을 위한 핵심 지원을 제공합니다 중국 뉴스 서비스, 청두, 11월 19일(Wang Liwen) \"중국은 다양한 국가에 제품을 제공할 뿐만 아니라 에너지 인프라가 부족한 개발도상국이 태양광 발전 및 에너지 저장 장치를 신속하게 배치할 수 있도록 지원하는 등 글로벌 태양광 산업에서 큰 역할을 하고 있습니다.\" 뉴질랜드 전 총리이자 아시아 보아오 포럼 자문위원회 위원인 제니 시플리(Jenny Shipley)는 청두에서 열린 인터뷰에서 이렇게 말했습니다. 2026년 11월 17일부터 20일까지 제9회 국제 태양광 및 에너지 저장 산업 컨퍼런스가 청두에서 개최되었습니다. 세계에서 가장 완벽한 태양광 및 에너지 저장 산업 체인을 보유한 국가인 중국 기업이 어떻게 개발 배당(회사가 주주에게 나눠주는 돈)금을 세계와 공유하고 업계 과제에 대응하는지가 이번 컨퍼런스의 초점이 되었습니다."},{"s":"제9회 국제 태양광 및 에너지 저장 산업 회의에서 총 금액 535억 위안의 태양광 및 저장 프로젝트가 체결되었습니다.","so":"Jiemian.com","tm":"11/19 17:01","c":1,"r":"cn","u":"https://www.jiemian.com/article/15351035.html","p":1795075285,"a":1795089984,"t":"总金额535亿元，第九届国际光伏与储能产业大会上光储项目集中签约","su":"원본 뉴스 Xi Jinghua · 출처: Jiemian News 11월 19일 Jiemian News는 2026년 제9차 중국 국제 태양광 및 에너지 저장 산업 컨퍼런스에서 회의 기간 동안 정부와 기업이 여러 차례 도킹을 진행했으며 총 535억 위안에 달하는 협력 프로젝트가 집중적으로 체결되었다는 사실을 알게 되었습니다. 투자 레이아웃은 태양광 발전, 다양한 에너지 저장 장치, 새로운 배터리, 핵심 장비 및 스마트 에너지를 포함한 전체 광 저장 산업 체인을 포괄합니다."}]},{"name":"🏭 AI 전력","note":"보유: ACE 코리아AI전력TOP10","breaking":false,"items":[{"s":"경남도, 두산에너빌리티와 SMR 글로벌 생산거점 육성 협력","so":"아시아투데이","tm":"11/19 17:41","c":15,"r":"kr","u":"https://www.asiatoday.co.kr/kn/view.php?key=20261119010007776","p":1795077714,"a":1795090005,"su":"경남도가 두산에너빌리티의 소형모듈원자로(SMR) 사업 확대를 지역 투자와 일자리 창출로 연결하기 위한 협력에 나섰다. 박완수 지사는 19일 도청에서 송용진 두산에너빌리티 /9891393","p":1795157241,"a":1795158281,"t":"美參院通過能源許可改革法案 資料中心須自付電網升級","su":"미국 상원은 오늘 대규모 에너지 및 인프라 건설에 대한 검토를 가속화하고 데이터 센터가 자체 전력 비용을 지불하도록 요구하는 에너지 라이센스 개혁 법안을 정당 전체에서 통과시키기 위해 62대 33으로 투표했습니다."},{"s":"Liu Wenxiong: 업계에는 다양한 분야에 걸쳐 T자형 인재가 필요합니다. 전력안정을 위해서는 재정적 지원이 필요하다 | 산업경제학","so":"中央社 CNA","tm":"11/20 15:11","c":2,"r":"tw","u":"https://www.cna.com.tw/news/afe/202611200106.aspx","p":1795155060,"a":1795158283,"t":"劉文雄：產業需跨領域T型人才電力穩定度需資金支持| 產經","su":"Power Grid 인재 개발 연합 장학금 및 Liu Shusheng 기념상 시상식이 오늘 거행되었습니다. 대만전력에너지공학협회 명예회장 Liu Wenxiong은 전기가 인공지능(AI) 컴퓨팅 능력을 뒷받침할 뿐만 아니라 산업 발전의 핵심이라고 말했습니다. 앞으로는 전문적 역량과 크로스필드 역량을 모두 갖춘 'T형 인재'가 필요하다. 그는 추모상과 장학금을 통해 더 많은 우수한 인재들이 전력산업에 진출할 수 있기를 기대하고 있다."},{"s":"글로벌 데이터 센터의 전력 소비는 2030년까지 두 배로 늘어날 수 있습니다.","so":"工商時報","tm":"11/20 04:00","c":2,"r":"tw","u":"https://www.ctee.com.tw/news/20261120700130-439901","p":1795114800,"a":1795128514,"t":"2030全球資料中心用電恐翻倍- 日報","su":"국제 에너지 기구(IEA)는 전 세계 데이터 센터의 전력 소비가 2030년까지 두 배로 증가해 연간 약 1,000테라와트시(TWh)에 도달해 다양한 국가의 전원 공급 장치와 그리드에 큰 부담을 줄 것이라고 경고했습니다. 부족한 전력 인프라와 공급망(부품·재료가 오가는 연결망) 긴장, 지역사회의 반대로 인해 새로운 데이터 센터 건설이 지연될 수 있습니다. IEA는 세계 에너지 전망 2026의 \"명시된 정책 시나리오\"(STEPS)에서 이 보고서를 제안했습니다."},{"s":"AI 인프라 급증, 전력망 부족, IEA는 4년 안에 탄소 배출량이 70% 증가할 것으로 예상 | 글로벌 금융 | 글로벌","so":"UDN","tm":"11/20 03:44","c":2,"r":"tw","u":"https://udn.com/news/story/6811/9890045","p":1795113854,"a":1795128507,"t":"AI基建激增電網吃緊IEA預期四年後碳排增七成| 全球財經| 全球","su":"국제에너지기구(IEA)는 인공지능(AI) 데이터센터(컴퓨터 수만 대를 모아 둔 건물)에 대한 투자 급증이 전 세계 전력망을 압도할 수 있다고 경고했다. IEA는 또 일부 국가들이 액화천연가스(LNG) 생산 확대를 위해 투자했지만 중동 전쟁으로 인해 아시아가 외부 에너지 의존에 점점 더 조심스러워지고 있어 변수가 커질 수 있다고 밝혔다."},{"s":"美 설비 부족…HD현대·효성·LS, K-전력기기 '동맹국 프리미엄' 정조준","so":"파이낸셜포스트","tm":"11/22 08:05","c":1,"r":"kr","u":"https://www.financialpost.co.kr/news/articleView.html?idxno=302346","p":1795302300,"a":1795303173,"su":"인공지능(AI) 데이터센터(컴퓨터 수만 대를 모아 둔 건물) 및 전기자동차(EV) 확산으로 미국의 전력 수요가 급증하면서 내년부터 전력망 지원 설비(GSE) 공급난이 본격화할 것이라는 경고가 나왔"},{"s":"대동(Tatung)의 9월 매출은 전년 동기 대비 13% 감소했으며 전력 인프라 건설에서 AI 컴퓨팅 성능  이상 하락하여 지금 구매하고 2030년까지 보유","so":"Yahoo Finance","tm":"11/21 18:03","c":1,"r":"us","u":"https://finance.yahoo.com/markets/stocks/articles/3-data-center-power-stocks-090302581.html","p":1795251782,"a":1795259729,"t":"3 Data Center Power Stocks Down More Than a Third From Their Records to Buy Now and Hold Through 2030","su":"그 중 한 회사의 수익은 지난 분기에 두 배 이상 증가했습니다. 그렇다면 왜 세 주식 모두 지금까지 최고점보다 훨씬 낮은 걸까요?"},{"s":"李대통령, AI 전력·인력 확보 강조…\"AIDC·메모리 수요 더 늘 것\" (종합)","so":"아시아경제","tm":"11/21 16:19","c":1,"r":"kr","u":"https://www.asiae.co.kr/article/2026112116192801624","p":1795245569,"a":1795248156,"su":"이재명 대통령은 21일 인공지능(AI) 기술이 발전할수록 AI데이터센터(컴퓨터 수만 대를 모아 둔 건물)와 메모리 반도체(전자기기의 두뇌 부품)에 대한 수요가 더욱 늘어날 ."},{"s":"Taiping Island 마이크로그리드가 온라인화되면 Liqi의 수익에 어떤 기여를 하게 될까요?","so":"UDN","tm":"11/21 10:57","c":1,"r":"tw","u":"https://udn.com/news/ai/answer/%E5%A4%AA%E5%B9%B3%E5%B3%B6%E5%BE%AE%E9%9B%BB%E7%B6%B2-60330799","p":1795226239,"a":1795270310,"t":"太平島微電網上線後，對立碁的營收有何貢獻？","su":"Formosa New Intelligence와 Liqi는 함께 협력하여 난사(Nansha)의 타이핑 섬(Taiping Island)에 마이크로그리드를 구축했으며, 이는 공식적으로 가동에 들어가 Liqi에 수익을 가져오기 시작했습니다. 이 협력 모델은 향후 낙도 및 지역 방재를 위한 마이크로그리드 입찰의 기반이 될 것입니다. 양 당사자는 Liqi의 사업에 더 많은 성장 모멘텀(값이 움직이는 기세)을 가져오기 위해 후속 프로젝트를 위해 공동으로 노력할 것으로 예상됩니다. 이번 협력은 에너지 저장 장비와 에너지 관리 시스템 통합의 중요성을 강조하고 분산 에너지 개발에서 대만의 점진적인 발전을 반영합니다."},{"s":"[산업X파일] ‘작은 원전’ SMR, 곳곳서 차질… 한국 계획은 괜찮나","so":"조선일보","tm":"11/21 06:04","c":1,"r":"kr","u":"https://www.chosun.com/economy/economy_general/2026/11/21/HMRSXGFH6FAHVEUCJTGGIZTKXU/","p":1795208664,"a":1795265115,"su":"소형모듈원전(SMR)이 차세대 전력원으로 주목받고 있으나, 세계 곳곳에서 공사 지연과 비용 급증으로 어려움을 겪고 있음. 한국 또한 2035년 도입을 목표로 하지만, 전문가들은 해외 사례를 반면교사 삼아 기술적 난관과 막대한 예산 문제를 사전에 면밀히 검토해야 한다고 강조하고 있음."},{"s":"SKT, 효성중공업과 GW급 AIDC 구축","so":"이투데이","tm":"11/21 05:03","c":1,"r":"kr","u":"https://m.etoday.co.kr/view_photo.php?idxno=2648527&seq=1","p":1795204996,"a":1795265115,"su":"SKT, 효성중공업과 GW급 AIDC 구축 협력…안정적 전력 인프라 확보 관련 이미지 원본을 이투데이에서 확인하세요"},{"s":"[미국 증시시장] AI 주식 분할 심화, 나스닥 4.3% 하락, 트럼프 미국 기업 해외 데이터센터 구축  半導體搶才 電力工程學會聯手產學研設獎學金培育人才迎接挑戰","su":"대만전력에너지공학협회는 지난 20일 제8회 '전력망 인재개발 연합 장학금'과 제7회 '유수성 기념상' 시상식을 진행했다. Liu Wenxiong, honorary chairman of the association, said in his speech that electricity is no longer just \"lighting up a lamp.\" It not only supports competition in computing power, but also affects industrial layout. 그는 장학금과 기념상을 통해 전문 인재의 투자와 계승을 장려하고 전력 및 에너지 산업을 홍보하여 AI 개발 열차를 따라잡고 대만에서 새로운 성장 모멘텀(값이 움직이는 기세)을 창출하기를 희망합니다."},{"s":"AI 시대에는 에너지 전환이 필요하다. Liu Wenxiong은 신세대가 전력 산업에 투자하도록 격려합니다.","so":"經濟日報","tm":"11/20 17:36","c":1,"r":"tw","u":"https://money.udn.com/money/story/5612/9891709","p":1795163807,"a":1795175845,"t":"AI 時代需要能源轉型 劉文雄鼓勵新生代投入電力產業","su":"AI와 반도체(전자기기의 두뇌 부품) 산업이 호황을 누리면서 전력 인재는 산업간 경쟁을 위한 중요한 자원이 됐다. 류웬시옹(Liu Wenxiong) 대만전력에너지공학협회 명예회장은 지난 20일 '전력망 인재개발연맹 장학금 및 류수성 기념상 시상식' 행사에 참석해 AI 산업이 전기에 대한 세계의 기대에 변화를 가져왔고, 대만이 미래 AI 산업의 열차를 탈 수 있으려면 더 많은 첨단기술 인재의 유입이 필요하다고 지적했다."},{"s":"도쿄전력, 원전의 테러 대책 시설의 완성 연기에 가시와자키 카리바 7호기","so":"日本経済新聞","tm":"11/20 17:18","c":1,"r":"jp","u":"https://www.nikkei.com/article/DGXZQOUC205P80Q6A121C2000000/","p":1795162738,"a":1795175845,"t":"東京電力、原発のテロ対策施設の完成延期へ 柏崎刈羽7号機","su":"도쿄전력홀딩스가 카시와자키 카리바 원자력발전소 7호기(니가타현)에 정비하는 테러 대책 시설에 대해 2029년 8월로 하고 있던 완성 시기의 연기를 검토하고 있는 것이 20일, 알았다. 테러대책시설은 '특정 중대사고 등 대처시설'로 불리며 국가 기준으로 설치가 의무화되고 있다. 공사가 길어지면 7호기 재가"},{"s":"ESCO, 메거 인수로 전력망 검사 영역 확대 전력회사가 주요 고객","so":"鉅亨網","tm":"11/20 16:00","c":1,"r":"tw","u":"https://news.cnyes.com/news/id/6669012","p":1795158024,"a":1795158285,"t":"ESCO併購Megger擴大電網檢測版圖電力公司是主力客戶","su":"ESCO, 전력망 감지 영역 확장 위해 Megger 인수 전력회사가 주요 고객이다. 유애널라이즈 2026년 11월 20일 (유애널라이즈/산업데이터센터(컴퓨터 수만 대를 모아 둔 건물) 리포트) ⸺ 미국 산업용 시험장비 제조사인 에스코테크놀로지스(ESE-US)가 전력망 탐지업체 메거(Megger) 인수를 완료했다. 2027회계연도 매출은 연간 55~58% 증가한 20억 5천만~20억 9천만 달러에 이를 것으로 예상된다. 인수합병(회사를 사거나 합치는 것)을 통해 전력망 탐지 시장에서 ESCO의 규모가 확대되고 있으며 주요 고객은 전력회사입니다. ESCO 경영진은 데이터센터 구축과 직접 관련된 매출이 도블과 메거 합산 매출의 1~2%에 불과한 것으로 추정하고 있다."},{"s":"LS ELECTRIC 9%대 급락…전력기기주 동반 약세 [종목NOW]","so":"파이낸셜뉴스","tm":"11/20 15:10","c":1,"r":"kr","u" 노이드(사람을 닮은 로봇) 로봇들이 군무를 펼쳐 세계 기록을 세웠다는데요. 어떤 내용인지 화면으로 만나보시죠. [기자] 53개의 손가락을 자유자재로 움직이며 쇼팽의 '녹턴'을 연주하는 로봇 <연주 현장음> \"이번엔 인간 피아니스트 차례입니다.\" <연주 현장음> \"인간과 로봇의 피아노 연주 대결이 펼쳐졌습니다.\" <테오트로니코 / 로봇 피아니스트> \"객관적으로 제가 더 뛰어납니다."},{"s":"3대3 완전 자율 휴머노이드 로봇 축구 초청 토너먼트가 마카오에서 개최됩니다.","so":"21财经","tm":"11/21 15:26","c":1,"r":"cn","u":"https://www.21jingji.com/article/20261121/herald/c264fa0d8544851fb70c9051b7e1155f.html","p":1795242411,"a":1795248164,"t":"3对3全自主人形机器人足球邀请赛即将登陆澳门","su":"휴머노이드(사람을 닮은 로봇) 로봇이 그린 필드로 이동할 때 원격 제어 제어에 의존할 필요가 없습니다. 자체 AI 알고리즘에만 의존하여 인식, 이동, 대결 및 촬영을 완료합니다. 특별한 기술 축구 경기가 준비되었습니다. 12월 3일부터 5일까지 베네시안 마카오 코타이 전시컨벤션센터에서 3대3 완전 자율 휴머노이드 로봇 축구 초청 토너먼트가 개최됩니다. AIE 전자 전시회의 주요 지원 행사로 광둥-홍콩-마카오 대만 지역과 베이징의 8개 중학교 팀이 완전 자율 모드에서 로봇 축구 대회에 참가할 예정입니다. 8개의 참가팀이 경쟁을 펼쳤습니다. 이번 대회의 가장 큰 하이라이트는 완전 자율주행 경쟁이다. 경쟁 규칙에서는 수동 원격 제어, 의사 결정을 위한 외부 컴퓨터 및 외부 전원 공급 장치를 명확하게 금지합니다. 로봇은 공중 쌍안경 깊이 카메라를 사용하여 경쟁 환경을 감지하고 공중 컴퓨팅 능력은 컴퓨팅 결정을 완료하여 \"인식-결정-실행\" 폐쇄 루프를 완전히 실현하고 각 팀의 알고리즘 개발 및 전략 조정 수준을 위해 경쟁합니다."},{"s":"휴머노이드 로봇 대량생산 가속화, 감속기 수요 급증","so":"信報網站","tm":"11/21 03:33","c":1,"r":"hk","u":"https://www.hkej.com/dailynews/investment/article/4570872/%E4%BA%BA%E5%BD%A2%E6%A9%9F%E6%A2%B0%E4%BA%BA%E5%8A%A0%E5%BF%AB%E9%87%8F%E7%94%A2+%E6%B8%9B%E9%80%9F%E5%99%A8%E9%9C%80%E6%B1%82%E9%A3%86","p":1795199626,"a":1795215226,"t":"人形機械人加快量產 減速器需求飆","su":"인공지능(AI) 대형모형과 구현지능 기술이 점점 성숙해지면서 글로벌 휴머노이드(사람을 닮은 로봇) 로봇 산업은 실험실 연구개발에서 상업적 대량생산 단계로 옮겨가고 있다. 로봇 산업 체인에서 변속기 부품은 항상 시장에서 무시되어 왔지만 이제는 조용히 시장의 가장 큰 관심을 끄는 핵심 부품 중 하나가 되었습니다. 감속기는 동력(모터)과 액츄에이터(Actuator)를 연결하는 중간 전달 장치입니다. 기어, 웜 등의 구조를 통해 고속, 저토크 입력을 저속, 고토크 출력으로 변환하는 동시에 전달 정밀도와 부하 용량을 향상시킵니다. 정밀감속기의 핵심가치는 동력 전달 과정을 개선하는 것입니다."},{"s":"Yada와 Robot Godfather가 AI 스마트 의료 애플리케이션 개발 | 핫 하이라이트 | 사업정보","so":"經濟日報","tm":"11/21 00:53","c":1,"r":"tw","u":"https://money.udn.com/money/story/5635/9892203","p":1795190037,"a":1795215223,"t":"亞大攜機器人教父 攻AI智慧醫療應用 | 熱門亮點 | 商情","su":"글로벌 노령화와 의료 인력 부족으로 인해 AI 스마트 로봇 애플리케이션에 대한 수요가 증가하고 있습니다! 아시아대학교는 스마트 의료 산업을 적극적으로 전개하고 있습니다. 차이진파 총장은 대표단을 이끌고 일본 오사카대학을 방문했다. 지난 11월 16일에는 '일본 로봇공학의 대부'로 불리는 이시구로 히로시 교수가 이끄는 스마트로봇연구소와 협력각서(MOU)를 체결했다. 미국 스탠퍼드대 로봇센터와 일본의 휴머노이드(사람을 닮은 로봇) 로봇 기술, 대만의 의료 임상(새 약을 사람에게 시험하는 것) 분야를 결합해 AI 로봇을 연구실부터 의료현장까지 확산할 예정이다. Ishiguro는 휴머노이드 로봇 연구의 세계적인 선구자입니다. 그는 미국 CNN이 선정한 '세상을 바꾸는 8명의 천재' 중 한 명으로 선정됐다. 그는 제미노이드(Geminoid), 에리카(Erica) 등 국제적으로 유명한 로봇을 개발했습니다. 그는 오랫동안 인간과 컴퓨터의 상호작용, 원격제어, 아바타 로봇 기술에 투자해 왔으며, 인간의 삶과 사회 서비스에 AI 로봇을 적용하는 방안을 탐구했다. 아시아대학과 오사카대학의 협력에는 몰입형 로봇, 원격 제어 복제 기술, 소셜 로봇 및 AI 대화 시스템이 포함됩니다. 양 당사자는 공동 연구, 대학원생 교류, 단기 연수 및 국제 연구 프로젝트를 추진하고 스마트 의료와 노인 간호를 중요한 발전 방향으로 삼을 것입니다. 차이진파 아시아대학교 총장은 초기 단계에서는 외래진료 지도, 의료정보 설명, 원격 방문, 노인과의 상호작용 등을 평가할 것이라고 지적했다."},{"s":"한국 베이스그룹, 트럼프 일가 ‘군용 로봇 업체’에 2천억원 투자 준비","so":"한겨레","tm":"11/21 00:17","c":1,"r":"kr","u":"https://www.hani.co.kr/arti/international/international_general/1288324.html","p":1795187820,"a":1795248163,"su":"한국 기업 베이스그룹이 도널드 트럼프 미국 대통령의 차남이 고문으로 있는 군용 로봇 개발 업체에 1억5천만달러(2천억원)를 투자할 준비를 하고 있다고 로이터 통신이 19일(현지시각) 보도했다. 직원 급여조차 제때 주지 못할 만큼 자금난에 빠진 이 업체에 베이스그룹이 ‘"},{"s":"Hot Finance | 수십 대의 휴머노이드 로봇이 휴대폰 테스트 생산 라인에 진입했으며 Zhiyuan Innovation과 Lens Technology가 협력을 맺었습니다.","so":"21财经","tm":"11/20 20:55","c":1,"r":"cn","u":"https://www.21jingji.com/article/20261120/herald/3b873cf32c1b8f6fa5c933c92e90e740.html","p":1795175700,"a":1795180935,"t":"热财经｜数十台人形机器人进驻手机测试产线 智元创新与蓝思科技达成合作","su":"최근 AGIBOT은 스마트 단말기 정밀 제조 기업인 Lens Technology와 전략적 협력을 맺고 Lens Technology의 휴대폰 테스트 생산 라인에 수십 대의 AGIBOT 로봇을 대규모로 배치했습니다. 이 로봇 배치는 3C 소비자 전자 제품 테스트를 위한 표준화된 응용 모델을 만드는 것을 목표로 테스트 스테이션의 자동 로딩 및 언로딩 및 장비 상호 작용과 같은 작업을 담당합니다. 이 생산 라인의 구현은 주로 MMI, ANT, CAM 및 CAMCV와 같은 고주파수 반복 테스트 프로세스를 다루고 있습니다. 신속한 모델 반복과 잦은 생산 라인 조정이라는 3C 업계의 특성에 부응하여 Genie G2는 Zhiyuan의 \"3가지 지능이 하나로 통합된\" 기술 아키텍처를 사용합니다. 범용 차체 설계와 전천후 작동 기능을 통해 신속한 교차 생산 라인 적응과 완전 자동 자재 이동을 달성하여 생산 라인 수정 비용을 효과적으로 줄이고 노동 압력을 완화할 수 있습니다."},{"s":"가케시 / 규슈 · 야마구치, 야스카와 전기의 로봇 제 5 공장 견학","so":"日刊工業新聞","tm":"11/20 17:53","c":1,"r":"jp","u":"https://www.nikkan.co.jp/articles/view/797744","p":1795164799,"a":1795248165,"t":"かけはし／九州・山口、安川電機のロボット第5工場見学"},{"s":"로봇이 연주하고 순찰... APEC서 과시한 중국","so":"조선일보","tm":"11/20 17:20","c":1,"r":"kr","u":"https://www.chosun.com/international/international_general/2026/11/20/YQ62E4R3J5GR3KUGKKDGV7XTZM/","p":1795162838,"a":1795248163,"su":"APEC 정상회의가 열린 중국 선전에서 휴머노이드(사람을 닮은 로봇) 로봇과 하모니OS 기반 AI 기술이 공개됨. 중국은 선전을 무대로 자국 첨단 제조업의 경쟁력을 세계에 과시하며, 제조업 기반을 결합한 피지컬 AI 분야에서 미국을 추월하겠다는 기술적 의지를 드러냈음."},{"s":"안드로이드 창시자 '앤디 루빈', 휴머노이드 로봇 공개…겐키 로보틱스 첫 공식 행보","so":"로봇신문","tm":"11/20 16:31","c":1,"r":"kr","u":"https://www.irobotnews.com/news/articleView.html?idxno=49710","p":1795159887,"a":1795175855,"su":"안드로이드 창시자 앤디 루빈(Andy Rubin)이 설립한 일본 휴머노이드(사람을 닮은 로봇) 로봇 스타트업 겐키 로보틱스(Genki Robotics)가 창업 이후 처음으로 공개 석"},{"s":"삼성전자는 2027년 1월 자체 개발한 로봇을 선보일 예정이다. 로봇 산업은 대규모 구현기에 돌입했다.","so":"财联社","tm":"11/20 16:22","c":1,"r":"cn","u":"https://www.cls.cn/detail/2476465","p":1795159334,"a":1795231024,"t":"三星将于2027年1月首秀自研机器人 机器人产业已迈入规模化落地期","su":"① 삼성전자는 2027년 1월 미국 라스베이거스에서 개최되는 세계 최대 가전전시회 CES 2027에서 자체 개발한 휴머노이드(사람을 닮은 로봇) 로봇 최초 공개를 목표로 휴머노이드 로봇 시제품 개발에 박차를 가하고 있다. ② 갤럭시오토 석진만 팀은 중국 내 휴머노이드 로봇 일괄 배치가 가속화돼 상반기 글로벌 출하량이 97%를 차지하며 업계는 1단계 진입에 진입했다고 지적했다. 대규모 시행 기간. 7일(현지시간) 언론보도에 따르면 삼성전자는 2027년 1월 미국 라스베이거스에서 열리는 세계 최대 가전전시회 CES 2027에서 자체 개발한 휴머노이드 로봇을 최초로 공개하는 것을 목표로 휴머노이드 로봇 시제품 개발에 박차를 가하고 있다. 업계 관계자는 “인공지능(AI) 기술의 발전으로 휴머노이드 로봇의 상용화 시기가 앞당겨질 것으로 예상돼 삼성전자가 속도를 높이고 있다”고 말했다. 발전의."},{"s":"유비 미녀미남들 집에 들어가고 싶다면 기다려주세요 - 36Kr","so":"36kr","tm":"11/20 16:12","c":1,"r":"cn","u":"http://www.36kr.com/p/4076727621457793","p":1795158768,"a":1795175857,"t":"优必选的美女帅哥们，想进家门再等等-36氪","su":"The beauties and handsome guys of 유비테크, if you want to enter your home, please wait. 2026 APEC에서 특별세미나에 참여한 구현지능 분야 대표자는 YuShu의 창립자이자 CEO인 Wang Xingxing이었고, 두 번째는 유비테크의 창립자이자 이사회 의장이자 CEO인 Zhou Jian이었습니다. 유비테크의 본사는 심천에 위치하고 있습니다. As a listed company focusing on full-size humanoid robots, 유비테크 is an important platform to showcase the level of China's robot industry. Zhou Jian은 휴머노이드(사람을 닮은 로봇) 로봇의 산업 규모가 \"여전히 연구 개발, 대량 생산 및 실제 적용 간의 연결을 열어야 한다\"고 말했습니다. 이 문장이 머리에 박혔습니다. 현재 중국의 임바디드 AI(로봇처럼 몸을 가진 인공지능) 분야에서는 단일 지점 역량이 빠르게 향상되고 있지만 R&D, 대량 생산, 응용 간에 서로를 구동하는 긍정적인 순환이 아직 형성되지 않았다는 구조적 모순이 있습니다."},{"s":"이족보행, 바퀴형 및 바퀴형 : 휴머노이드 로봇 형태의 경로 분류 및 대표기업 지도","so":"Jiemian.com","tm":"11/20 16:09","c":1,"r":"cn","u":"https://www.jiemian.com/article/15354215.html","p":1795158558,"a":1795175859,"t":"双足、轮式与轮足：人形机器人形态路线分类及代表公司图谱","su":"Abstract When talking about humanoid robots, most attention is focused on the mechanical arms and dexterous hands. 기계가 어디에 들어갈 수 있는지, 생산 라인으로 전환될 수 있는지, 1교대 동안 지속될 수 있는지를 실제로 결정하는 것은 기계의 하체인 경우가 많습니다. The industry has divided into three clear lines along the way of mobility: bipedal, wheeled and wheeled. Topstar has mature products in two main lines: bipedal and wheeled. 6개의 휴머노이드(사람을 닮은 로봇) 로봇 팔, 휴머노이드 팔, 바퀴 달린 휴머노이드, 이족 보행 휴머노이드, 4족 로봇 및 AI 워크스테이션은 통합 제어 기반을 공유합니다. The humanoid robot \"Xiaotuo\" has been stably operating in the injection molding and 3C workshops. 이족 보행 휴머노이드 스타는 2026년 11월 7일 TOPS DAY에 출시되었습니다. 이 기사에서는 먼저 세 가지 형태의 구조와 이동 원리를 분해한 다음 적용 가능한 시나리오와 생산 라인 변환 비용을 자세히 설명합니다. 그러다가 국내외 대표 모델들이 하나둘씩 제자리로 돌아가고, 바퀴발 루트의 성숙도는 공백으로 남는다. There is no abstract superiority in the battle of forms, only whether the scene and the choice match."},{"s":"모델 능력이 향상되고 로봇이 자율적으로 학습하기 시작합니다.","so":"Jiemian.com","tm":"11/20 15:04","c":1,"r":"cn","u":"https://www.jiemian.com/article/15354028.html","p":1795154688,"a":1795158299,"t":"模型能力提升，机器人开始自主学习了","su":"로봇은 스스로 새로운 기술을 배울 수 있게 되었지만 이러한 능력을 실제 시나리오에서 안정적으로 작동시키고 상업적인 수익을 창출하는 방법은 여전히 업계가 직면한 문제입니다."},{"s":"제이에스링크, 로보티즈와 휴머노이드 영구자석 관련 MOU 체결","so":"서울경제TV","tm":"11/20 14:00","c":1,"r":"kr","u":"https://www.sentv.co.kr/article/view/sentv202611200037","p":1795150805,"a":1795158298,"su":"제이에스링크, 로보티즈와 휴머노이드(사람을 닮은 로봇) 영구자석 관련 MOU 체결 금융·증권 입력 2026-11-20 14:00:05 수정 2026-11-20 14:00:05 권용희 기자 0개 [서울경제TV=권용희기자] 제이에스링크는 로보티즈와 '로봇용 영구자석 기술개발 및 공급망(부품·재료가 오가는 연결망) 구축을 위한 업무협약(MOU)'을 체결했다고 20일 밝혔다. 피지컬 AI 시장에 대응해 양사의 기술 역량을 결합하고, 차세대 로봇용 영구자석의 공동개발부터 양산 적용까지 협력하기 위해 추진됐다는 설명이다."},{"s":"사진첩｜APEC 정상회의에서 '일하고 봉사할 수 있는' 로봇 등장","so":"财新","tm":"11/20 13:25","c":1,"r":"cn","u":"https://photos.caixin.com/2026-11-20/102506923.html","p":1795148700,"a":1795219482,"t":"图集｜“会干活、能服务” APEC峰会机器人上岗","su":"[차이신] 2026년 11월 18일부터 19일까지 아시아태평양경제협력체(APEC) 정상회의가 선전에서 개최됩니다. 정상회담 기간 동안 심천에서는 '지능형 로봇' 콘텐츠가 증가했으며 Qianhai Mountain Dew는 'Bay Area Living Room' 기술 전시회를 시작했습니다. 이번 전시회에는 \"부드러운 여행을 위한 지능적 창조, 생활을 위한 지능적 창조, 번영을 위한 지능적 창조\"라는 세 가지 주요 주제를 중심으로 87개 베이지역 기업이 154개 제품을 가져와 전시회에 참가했습니다. 전시실은 거실, 주방, 작업실, 전력망에 따라 공간으로 구분됩니다. 로봇은 실제 장면에서 직접 작업에 투입됩니다. 거실, 주방, 공장, 작업장에 이르기까지 '일하고 봉사할 수 있는' 로봇 그룹이 함께 등장합니다. 휴머노이드(사람을 닮은 로봇) 로봇은 춤을 추며 손님을 맞이하고, 아침 식사를 준비하고, 꽃꽂이를 독립적으로 수행합니다. 일반 로봇은 현장에서 음료를 만듭니다. 산업용 로봇이 생산 라인에 들어가 분류를 완료합니다. Longgang Robot Street에서는 500대 이상의 로봇이 생활 서비스 및 지능형 제조라는 4가지 주요 주제를 중심으로 22가지 응용 시나리오를 제시합니다."},{"s":"'전자 주변기기' 아이온, 물리적 AI 사업 기회 포착하고 휴머노이드 로봇과 경쟁할 신제품 박서 출시 - 증권","so":"工商時報","tm":"11/20 13:21","c":1,"r":"tw","u":"https://www.ctee.com.tw/news/20261120700995-430201","p":1795148460,"a":1795158302,"t":"《電週邊》研揚搶攻實體AI商機推新BOXER衝人形機器人- 證券","su":"[타이페이에서 보도된 Times 기자 Ye Shian] AAEON(6579)은 엔비디아 Jetson Thor 플랫폼을 탑재한 최초의 BOXER-8741AI를 출시했습니다. As the latest member of AAEON's AI@Edge embedded Box PC product series, BOXER-8741AI has excellent environmental tolerance and is equipped with rich I/O interfaces specially designed for robot development needs, helping developers create industrial-grade human..."},{"s":"광우 MMC 27년 1분기 출하 예정, 휴머노이드 로봇 모터 3분기 출시","so":"DIGITIMES","tm":"11/20 12:34","c":1,"r":"tw","u":"https://www.digitimes.com.tw/tech/dt/n/shwnws.asp?id=775478","p":1795145640,"a":1795158303,"t":"廣宇MMC拚1Q27出貨 人形機器人電機3Q推出","su":"광위기술은 19일 기자간담회를 가졌다. 리광야오(Li Guangyao) 회장은 성수기 수요와 AI 서버 등 신규 사업의 지속적인 출하가 매출 성장을 견인했다고 지적했다. 동시에 수익성이 낮은 기존 자동차 와이어링 하니스 사업의 적극적인 축소와 공장 생산 능력 조정으로 인해 매출총이익률은 분기별로 개선되었습니다. 그러나 원자재(물건의 재료(석유·구리 등)) 가격이 상승하고, 자동차 제조업체의 차량 주문 가격이 억제되고, 인수합병(회사를 사거나 합치는 것)과 새로운 생산 라인 건설로 인해 관리 및 R&D 비용이 증가하고 있습니다."},{"s":"리멤버 자회사 이안손앤컴퍼니, 휴머노이드 웨비나 개최","so":"한스경제","tm":"11/20 11:17","c":1,"r":"kr","u":"http://www.hansbiz.co.kr/news/articleView.html?idxno=885515","p":1795141049,"a":1795215220,"su":"| 서울=한스경제 김종효 기자 | 리멤버 자회사 이안손앤컴퍼니가 블룸버그 인텔리전스와 손잡고 휴머노이드(사람을 닮은 로봇) 로봇 상용화와 피지컬 인공지능(AI) 산업화를 논의하는 웨비나를 열었다.이안손앤컴퍼니는 지난 18일 ‘휴머노이드 경쟁, 이제는 비즈니스다: 피지컬 AI를 산업으로 만드는 길’을 주제로 웨비나를 공동 개최했다고 20일 밝혔다.이번 행사에서는 이안 마 블룸버그 인텔리전스 산업재 담당 애널리스트와 이강욱 리얼월드 사업대표가 휴머노이드 상용화와 동북아시아의 역할을 다뤘다. 이안손앤컴퍼니는 주제 기획과 진행을 맡아 글로벌 리서치 기관의 분"},{"s":"보도자료: commissure, AIRoA(일반사단법인 AI 로봇협회)에 육성회원으로 입회(PR TIMES)","so":"毎日新聞","tm":"11/20 10:53","c":1,"r":"jp","u":"https://mainichi.jp/articles/20261120/pr2/00m/020/127000c","p":1795139586,"a":1795144522,"t":"プレスリリース：commissure、AIRoA（一般社団法人AIロボット協会）に育成会員として入会（PR TIMES）","su":"―현장의 작업 데이터 취득과 Physical AI 인재 육성의 지견을, 로봇 기반 모델의 개발 기반 만들기에―"},{"s":"'주식 이동' 유비쉬안 등 2개 회사가 오후 1시 9분에 이사했다.","so":"etnet 經濟通","tm":"11/20 10:52","c":1,"r":"hk","u":"https://www.etnet.com.hk/mobile/tc/news/categorized_news_detail.php?newsid=20261120131","p":1795139520,"a":1795158304,"t":"《異動股》優必選等2家公司下午1:09異動","su":"2026년 11월 20일 13시 10분 \"무브먼트주\" 오후 1시 9분에 유비셀렉션 외 2개사가 변경되었습니다. 상장(주식시장에 처음 들어오는 것)사 2곳은 오후 1시 9분경 이례적인 움직임 기록을 기록했다. '경제신문 20기 특집' 2,142억5,800만 1,945억7,700만(90.815%) 35억7,300만(1.667%) 161억8,000만(7.518%) 실시간 업데이트 : 1,140억5,200만 277억8,800만 (24.364%) 최신 인기 etnet TV 금융 뉴스 댓글 주제 Perspective Life DIVA Healthy Life Good Places in Hong Kong 주의사항: 이 콘텐츠는 기존 시장 데이터 및 뉴스 소스를 기반으로 인공 지능에 의해 생성되었으며 참고용입니다. 본 내용은 \"이코노믹스\"의 견해나 입장을 대변하지 않으며, 어떠한 투자조언도 구성하지 않습니다. AI가 생성한 정보에는 오류, 누락, 일탈 등이 있을 수 있으므로, 투자 결정을 내리기 전에 사용자가 직접 해당 내용을 확인하거나 전문가의 조언을 구해야 합니다. \"이코노믹스\"는 본 내용을 신뢰하여 발생하는 어떠한 손실이나 손해에 대해서도 책임을 지지 않습니다."},{"s":"'특징주' Wan Robot(06600)은 거의 7% 하락해 신저가를 기록했으며 현재 37.56위안에 거래되고 있습니다.","so":"etnet 經濟通","tm":"11/20 10:41","c":1,"r":"hk","u":"https://www.etnet.com.hk/mobile/tc/news/categorized_news_detail.php?newsid=20261120386","p":1795138860,"a":1795158306,"t":"《異動股》臥安機器人(06600)跌近7%創新低，現報37.56元","su":"2026/11/20 09:41 \"특징주\" Wan Robot (06600)은 거의 7% 하락해 신저가를 기록했으며, 현재 37.56위안으로 거래되고 있습니다. Wan Robot (06600)은 한때 거의 7% 하락해 최저 가격이 37.54위안으로 신저가를 기록했습니다. 현재 6.5% 하락한 37.56위안, 최고가는 40.26위안입니다. 44,500주가 거래되었고, 거래금액은 170.83백만 위안입니다. 활성 매수-매도 비율은 19:81, 순 활성 펀드 매도액은 10031만 위안입니다. 현재 최대 순수동매수 증권회사는 CMB International Securities로 금액은 592,100위안, 가중평균거래가격은 38,573위안이다. 현재 가장 큰 순소극매도 증권회사는 제프리스 Financial Group으로 금액은 138,400위안, 가중평균거래가격은 38.18위안이다. 현재 주가 기준으로 주가는 7일 연속 하락세를 보이며 누적 하락폭은 29.1%다."},{"s":"중국이 휴머노이드를 양산하는 이유 / 파나소닉 HD가 PQC 라이브러리를 선보인다","so":"MONOist","tm":"11/20 10:30","c":1,"r":"jp","u":"https://monoist.itmedia.co.jp/mn/articles/2611/20/news046.html","p":1795138200,"a":1795144523,"t":"中国がヒューマノイドを量産する理由／パナソニックHDがPQCライブラリを披露","su":"2026년 11월 20일에 공개된 MONOist의 신착 기사를 픽업해 전달합니다. FA이벤트 리포트 : 왜 중국은 휴머노이드(사람을 닮은 로봇)를 양산하는가? 출하의 확대가 그대로 실용화를 의미하는 것은 아니지만, 일본에 아직 승리는 있는 것인가. SUGENA가 개최한 세미나에서 중국이 로봇에 주력하는 배경과 양산 실태, 실용화를 위한 과제를 찾아 일본 기업이 취해야 할 전략을 생각한다."},{"s":"휴머노이드에서 AI 비전까지 미쓰비시전기 'Serendie Automation'의 구체상","so":"MONOist","tm":"11/20 09:00","c":1,"r":"jp","u":"https://monoist.itmedia.co.jp/mn/articles/2611/20/news045.html","p":1795132800,"a":1795144524,"t":"ヒューマノイドからAIビジョンまで、三菱電機「Serendie Automation」の具体像","su":"미쓰비시전기는 FA를 위한 새로운 통합 솔루션 브랜드로 'Serendie Automation'을 전개할 것을 발표했다. 후편에서는 'Serendie Automation'을 구현하는 기술 전시 내용을 소개한다."},{"s":"구미시, 삼성 19조 투자에 로봇 특화단지까지…휴머노이드 산업 중심지로 뜬다","so":"에너지경제신문","tm":"11/20 08:38","c":1,"r":"kr","u":"https://m.ekn.kr/view.php?key=20261120027462238","p":1795131535,"a":1795132871,"su":"<b>제조업 도시서 첨단 로봇산업 거점으로 전환 가속<\/b> <b>AI·휴머노이드(사람을 닮은 로봇) 핵심부품 국산화 추진…산학연 100여 명 발전전략 논의<\/b> <b>구미 1~5산단 제조기반 활용.."},{"s":"왜 중국은 휴머노이드를 양산하는가?","so":"MONOist","tm":"11/20 07:00","c":1,"r":"jp","u":"https://monoist.itmedia.co.jp/mn/articles/2611/20/news014.html","p":1795125600,"a":1795128535,"t":"なぜ中国はヒューマノイドを量産するのか 突き動かす「焦り」と足踏みの正体：FAイベントレポート（1/3 ページ）","su":"중국에서는 휴머노이드(인간형 로봇)의 양산이 진행되고 있다. 출하의 확대가 그대로 실용화를 의미하는 것은 아니지만, 일본에 아직 승리 근육은 있는 것인가. SUGENA가 개최한 세미나에서 중국이 로봇에 주력하는 배경과 양산 실태, 실용화를 위한 과제를 찾아 일본 기업이 취해야 할 전략을 생각한다."},{"s":"닭장에 나타난 '휴머노이드'…임무는 달걀 수거","so":"전자신문","tm":"11/20 06:00","c":1,"r":"kr","u":"https://www.etnews.com/20261119000421","p":1795122000,"a":1795128525,"su":"미국에서 닭장 바닥에 떨어진 달걀을 수거하는 휴머노이드(사람을 닮은 로봇) 로봇이 개발되고 있습니다. 미국 노스캐롤라이나주립대 연구진이 개발 중인"},{"s":"소개 : 『테슬라 혁신의 정체 자동운전・AI・로봇, 그리고 우주로』","so":"日経BOOKプラス","tm":"11/20 05:00","c":1,"r":"jp","u":"https://bookplus.nikkei.com/atcl/column/032900009/102901452/","p":1795118400,"a":1795158307,"t":"はじめに：『テスラ 革新の正体 自動運転・AI・ロボット、そして宇宙へ』","su":"그 책의 「소개」에는, 저자의 「전하고 싶은 것」이 꽉 담겨 있습니다. 이 연재에서는 매일 추천 책의 「소개」와 「목차」를 소개합니다. 오늘은 마에다 켄이치로씨의 『테슬라 혁신의 정체 자율주행・AI・로봇, 그리고 우주에』입니다."},{"s":"NTT의 피지컬 AI 기술, 로봇이 움직이기 전에 실패 회피 선반 적재 성공률 90% 초과","so":"日経クロステック","tm":"11/20 05:00","c":1,"r":"jp","u":"https://xtech.nikkei.com/atcl/nxt/news/24/03478/","p":1795118400,"a":1795128535,"t":"NTTのフィジカルAI技術、ロボットが動く前に失敗回避 棚積み成功率9割超","su":"NTT는 로봇이 움직이기 전에 미래를 예측하고 실패를 회피하는 피지컬 AI(인공지능) 기술을 개발했다. 로봇의 행동 후보와 카메라·센서 정보로부터, 행동 후의 주변 환경의 변화를 영상으로서 생성하고, 실행전에 행동 계획의 성부를 스코어로 평가한다."},{"s":"2026년 11월에 보유할 3가지 훌륭한 로봇공학 주식","so":"Yahoo Finance Singapore","tm":"11/20 04:12","c":1,"r":"us","u":"https://sg.finance.yahoo.com/news/3-great-robotics-stocks-own-191229164.html","p":1795115549,"a":1795128525,"t":"3 Great Robotics Stocks To Own In November 2026","su":"2026년 앤트로픽의 기록적인 기업공개(IPO)로 인공지능이 다시 주목을 받게 되었지만, 알고리즘을 실제 기계로 바꾸는 회사에 대해서는 더 조용한 이야기가 있습니다. AI에 자본이 유입되면서 공장, 창고, 인프라 자동화의 필요성이 더욱 날카로워지고 있습니다. 이 기사에서는 소프트웨어 두뇌를 물리학에 연결하는 스크리너의 세 가지 자동화 리더를 살펴봅니다."},{"s":"로봇 회사들이 베이징에서 열리는 제2회 세계 휴머노이드 로봇 게임에 참가할 준비를 하고 있습니다.","so":"The Straits Times","tm":"11/20 02:10","c":1,"r":"us","u":"https://www.straitstimes.com/videos/6403678638112","p":1795108231,"a":1795128526,"t":"Robotics firms prepare to compete in second World Humanoid Robot Games in Beijing"},{"s":"4족 보행 로봇이 매달아 비계 내를 자율 순회","so":"日経クロステック","tm":"11/20 02:01","c":1,"r":"jp","u":"https://xtech.nikkei.com ongru Xu Jin Shenzhen 보도 선전의 임바디드 AI(로봇처럼 몸을 가진 인공지능) 기업을 대표하는 유비테크 CEO Zhou Jian은 지난 17일 아시아태평양경제협력체(APEC) 비즈니스 리더 정상회담에서 로봇이 아시아태평양 지역에 진출하는 길은 '하나의 영역, 하나의 정책'이 될 것이라고 언급했습니다. 11월 18일, 21세기 비즈니스 헤럴드 기자가 유비테크의 최고 브랜드 책임자이자 로봇 소비자 혁신 부문 사장인 탄 민(Tan Min)과 단독 인터뷰를 가졌습니다. 그는 일부 아시아 태평양 경제에서 이러한 \"하나의 영역, 하나의 정책\" 경로가 어떻게 구현되었는지 자세히 설명했습니다. 현재 유비테크의 생태학적 파트너는 태국, 베트남, 싱가포르 등 경제 전반에 퍼져 있습니다. Tan Min은 국가마다 시장과 산업의 요구 사항과 적용 시나리오가 다르며 중국 시장의 경험을 현지 특성에 맞게 조정하는 것이 \"하나의 영역, 하나의 정책\"의 핵심이라고 말했습니다."},{"s":"로보테라, 2년 연속 APEC CEO 서밋에 초청받아 실제 휴머노이드 로봇 애플리케이션 선보여","so":"The Straits Times","tm":"11/19 19:41","c":1,"r":"sg","u":"https://www.straitstimes.com/paid-press-releases/robotera-invited-to-apec-ceo-summit-for-second-consecutive-year-showcases-real-world-humanoid-robot-applications-20261119","p":1795084860,"a":1795090023,"t":"ROBOTERA Invited to APEC CEO Summit for Second Consecutive Year, Showcases Real-World Humanoid Robot Applications","su":"베이징, 2026년 11월 19일 /PRNewswire/ -- AI 기반 임바디드 AI(로봇처럼 몸을 가진 인공지능) 기업 ROBOTERA가 두 번째 공동으로 2026 APEC CEO 서밋에 초대되었습니다. 자세한 내용은 straitstimes.com에서 확인하세요."},{"s":"옵티머스로봇 빅뉴스, 성장성이 높은 종목을 소개합니다","so":"21财经","tm":"11/19 19:26","c":1,"r":"cn","u":"https://www.21jingji.com/article/20261119/herald/7f268a856c81d21e6adc930c171a649b.html","p":1795083960,"a":1795158300,"t":"Optimus机器人大消息，高成长潜力股有这些","su":"(원제 : 603931, 직선상한가! 옵티머스 로봇 빅뉴스, 성장가능성 높은 종목들이다) A주 시장 휴머노이드(사람을 닮은 로봇) 로봇 컨셉주 중 35개 종목이 기관으로부터 만장일치로 올해와 내년에 순이익(모든 비용을 빼고 남은 돈)이 증가할 것이라는 예측을 받았다. 이 중 에스톤, 탑스타 등의 주식은 올해와 내년 순이익 증가율이 더 높다. 로봇의 상업적 이용이 점차 다가오고 있습니다. 603931, Linear Limit-up 오늘(11월 19일) 오전, 포토레지스트의 개념이 바뀌었습니다. 오전 마감 현재 Glinda(603931), Shengjian Technology 등의 주식은 제한 상한가를 기록하고 있습니다. 그 중 글린다는 집단입찰 직후 상한가를 철회했다. 또한 Baolidi, Guolin Technology 및 Jiezhong Technology는 모두 7% 이상 상승했습니다."},{"s":"삼성 ‘현장 실증’ vs LG ‘AI 동맹’…휴머노이드 격돌","so":"서울경제TV","tm":"11/19 18:11","c":1,"r":"kr","u":"https://www.sentv.co.kr/article/view/sentv202611190096","p":1795079500,"a":1795094315,"su":"인간을 닮은 로봇, 휴머노이드(사람을 // ───────── 📈 장기 추이 (2021.1~, GDELT) ─────────
var HI = null, HILOAD = false;
S.sm = load('sm', 'd'); S.lp = load('lp', 'all'); S.ly = load('ly', 0);
if(S.lp === 'ly') S.lp = 'yr';          // 예전 '작년' 버튼 → 연도별
function loadHist(){
  if(HILOAD) return; HILOAD = true;
  fetch(D.history_url + '?t=' + Date.now(), {cache:'no-store'}).then(function(r){ return r.json(); })
    .then(function(j){ HI = j; prepHist(); if(D.themes[S.tab].stats) renderMain(); })
    .catch(function(){ HI = {err:1}; if(D.themes[S.tab].stats) renderMain(); });
}
function dIdx(s){ return Math.round((Date.parse(s+'T00:00:00Z') - Date.parse(HI.since+'T00:00:00Z'))/86400e3); }
function iDate(i){ return new Date(Date.parse(HI.since+'T00:00:00Z') + i*86400e3).toISOString().slice(0,10); }
function prepHist(){                       // 달 경계(배열 위치) 미리 계산
  if(!HI || !HI.s || !HI.end) return;
  HI.n = dIdx(HI.end) + 1; HI.months = []; HI.av = [];
  for(var i=0;i<HI.n;i++){ var ok = false;      // GDELT 자료가 있는 날 (서버가 멈춰 통째로 빠진 날은 false)
    for(var t in HI.s){ for(var k in HI.s[t]){ if(HI.s[t][k][i] != null){ ok = true; break; } } if(ok) break; }
    HI.av.push(ok); }
  var y = +HI.since.slice(0,4), m = +HI.since.slice(5,7), ey = +HI.end.slice(0,4), em = +HI.end.slice(5,7);
  while(y < ey || (y === ey && m <= em)){
    var a = dIdx(y+'-'+('0'+m).slice(-2)+'-01'), ny = m===12 ? y+1 : y, nm = m===12 ? 1 : m+1;
    var b = Math.min(HI.n, dIdx(ny+'-'+('0'+nm).slice(-2)+'-01'));
    HI.months.push({y:y, m:m, a:a, b:b, full: b - a === dIdx(ny+'-'+('0'+nm).slice(-2)+'-01') - a});
    y = ny; m = nm;
  }
}
function hsum(th, a, b, rk){               // [a, b) 날짜 칸의 합 (국가 필터 반영) · 자료 없는 날(null)은 건너뜀
  var s = (HI.s||{})[th] || {}, n = 0;
  for(var k in s){ if(rk ? k !== rk : !(S.region==='all' || k===S.region)) continue;
    var arr = s[k]; for(var i=Math.max(0,a); i<Math.min(b, arr.length); i++) if(arr[i] != null) n += arr[i]; }
  return n;
}
function avn(a, b){ var n=0; for(var i=Math.max(0,a); i<Math.min(b, HI.n); i++) if(HI.av[i]) n++; return n; }   // 자료 있는 날 수
function years(){ var a = [], y0 = +HI.since.slice(0,4), ty = +HI.end.slice(0,4); for(var y=ty-1; y>=y0; y--) a.push(y); return a; }   // 다 지난 해 (최근 먼저)
function pickYear(){ var ys = years(); return ys.indexOf(S.ly) >= 0 ? S.ly : (ys[0] || +HI.end.slice(0,4)); }
function lperiod(){                        // [이번 a,b] [비교 a,b 또는 null] 이름
  var M = HI.months, last = M[M.length-1], lf = last.full ? M.length-1 : M.length-2, ty = +HI.end.slice(0,4);
  if(S.lp === 'lm' && lf >= 0){ var x = M[lf], p = M[lf-1];
    return [[x.a, x.b], p ? [p.a, p.b] : null, x.y+'년 '+x.m+'월', '전달 대비']; }
  if(S.lp === 'ty'){ var a = dIdx(ty+'-01-01'), pa = dIdx((ty-1)+'-01-01'), len = HI.n - a;
    return [[a, HI.n], pa >= 0 ? [pa, pa+len] : null, ty+'년 (1월 1일~'+HI.end.slice(5).replace('-','/')+')', '작년 같은 기간 대비']; }
  if(S.lp === 'yr'){ var yy = pickYear(), ya = Math.max(0, dIdx(yy+'-01-01')), yb = Math.min(HI.n, dIdx((yy+1)+'-01-01')), pa = dIdx((yy-1)+'-01-01');
    return [[ya, yb], pa >= 0 ? [pa, ya] : null, yy+'년 전체', yy-1+'년 대비']; }
  return [[0, HI.n], null, HI.since.slice(0,7).replace('-','.')+' ~ '+HI.end.replace(/-/g,'.')+' 전체', ''];
}
function mspark(th){                       // 달별 흐름 (작은 선, 진행 중인 달은 빼고)
  var M = HI.months.filter(function(x){ return x.full; }), vals = M.map(function(x){ var d = avn(x.a, x.b); return d ? hsum(th, x.a, x.b)/d : 0; });
  if(vals.length < 2) return '';
  var mx = Math.max.apply(null, vals.concat([1])), w = 64, h = 20;
  var pts = vals.map(function(v,i){ return (i*(w/(vals.length-1))).toFixed(1)+','+(h-2-(v/mx)*(h-4)).toFixed(1); }).join(' ');
  return '<svg class="spark" viewBox="0 0 '+w+' '+h+'" width="'+w+'" height="'+h+'" aria-hidden="true"><polyline points="'+pts+'" fill="none" stroke="var(--acc)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></svg>';
}
function ldetail(th){                      // 달별 막대 + 나라별 구성
  var M = HI.months, dn = M.map(function(x){ return avn(x.a, x.b); });
  var vals = M.map(function(x, i){ return dn[i] ? hsum(th, x.a, x.b)/dn[i] : 0; });   // 하루 평균 (자료 빠진 날 영향 없게)
  var mx = Math.max.apply(null, vals.concat([1])), W = chartW(), H = 120, bw = W/M.length;
  var bars = vals.map(function(v,i){
    var x = M[i], bh = Math.max(v ? 2 : 0, (v/mx)*(H-32)), bx = i*bw + 1, y = H-14-bh;
    return '<g class="bar"><rect x="'+bx.toFixed(1)+'" y="0" width="'+(bw-2).toFixed(1)+'" height="'+(H-14)+'" fill="transparent"/>'+
      '<rect x="'+bx.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+(bw-2).toFixed(1)+'" height="'+bh.toFixed(1)+'" rx="2" fill="var(--acc)"'+(x.full?'':' opacity=".55"')+'/>'+
      '<title>'+x.y+'년 '+x.m+'월'+(x.full?'':' (진행 중)')+' · 하루 평균 '+Math.round(v).toLocaleString()+'건 · 한 달 '+hsum(th, x.a, x.b).toLocaleString()+'건'+
      (dn[i] < x.b - x.a ? ' (자료 '+dn[i]+'일치)' : '')+'</title></g>';
  }).join('');
  var ticks = M.map(function(x,i){ return x.m===1 ? '<line x1="'+(i*bw).toFixed(1)+'" y1="'+(H-14)+'" x2="'+(i*bw).toFixed(1)+'" y2="'+(H-9)+'" stroke="var(--sub)"/>'+
      '<text x="'+(i*bw+2).toFixed(1)+'" y="'+(H-1)+'" class="ax">'+x.y+'</text>' : ''; }).join('');
  var axis = ticks + '<line x1="0" y1="'+(H-14)+'" x2="'+W+'" y2="'+(H-14)+'" stroke="var(--line)"/>'+
             '<text x="0" y="9" class="ax">최대 하루 평균 '+Math.round(mx).toLocaleString()+'건</text>';
  var P = lperiod(), parts = D.regions.filter(function(r){ return (HI.regions||[]).indexOf(r.k) >= 0; }).map(function(r){
    return [r, hsum(th, P[0][0], P[0][1], r.k)]; }).filter(function(x){ return x[1] > 0; }).sort(function(a,b){ return b[1]-a[1]; });
  var pm = parts.length ? parts[0][1] : 1;
  var rows = parts.map(function(x){
    return '<div class="crow"><span class="cl">'+esc(x[0].l)+'</span><span class="cb"><i style="width:'+Math.max(2, x[1]/pm*100)+'%"></i></span><span class="cn">'+x[1].toLocaleString()+'</span></div>';
  }).join('') || '<div class="note">이 기간 기사 없음</div>';
  return '<div class="det"><div class="dt">달별 하루 평균 뉴스 수 ('+HI.since.slice(0,4)+'년 1월~)'+(S.region==='all'?'':' · '+esc(RL[S.region]))+'</div>'+
    '<svg class="bars" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(th)+' 달별 뉴스 수">'+bars+axis+'</svg>'+
    '<div class="dt">'+esc(P[2])+' 나라별</div>'+rows+'</div>';
}

  setTimeout(closeSheet, 50);
}
function toast(msg){ var t = $('toast'); t.textContent = msg; t.hidden = false; clearTimeout(toast._t); toast._t = setTimeout(function(){ t.hidden = true; }, 4000); }
function closeSheet(){ $('dim').hidden = true; $('sheet').hidden = true; document.body.style.overflow = ''; }
document.addEventListener('keydown', function(e){ if(e.key==='Escape') closeSheet(); });
</script></body></html>
