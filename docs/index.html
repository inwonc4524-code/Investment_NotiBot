<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#262624">
<title>투자 테마 뉴스</title>
<style>
@font-face{font-family:'ChosunIlboMyungjo';src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_one@1.0/Chosunilbo_myungjo.woff') format('woff');font-weight:normal;font-display:swap}
:root{color-scheme:dark;--bg:#262624;--card:#30302e;--card2:#3a3a37;--text:#faf9f5;--sub:#a6a39a;--line:#3e3e3a;--acc:#d97757;--red:#ef4444}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.55 'ChosunIlboMyungjo',Georgia,"Noto Serif KR",serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:760px;margin:auto}
header{padding:20px 16px 8px}
h1{font:600 22px/1.3 'ChosunIlboMyungjo',Georgia,serif;margin:0 0 4px}
.upd{color:var(--sub);font-size:12.5px}
/* 테마 탭 */
.tabs{position:sticky;top:0;z-index:3;background:rgba(38,38,36,.96);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.tabrow{display:flex;gap:8px;overflow-x:auto;padding:12px 16px 10px;scrollbar-width:none}.tabrow::-webkit-scrollbar{display:none}
.tab{position:relative;flex:none;padding:9px 15px;border-radius:12px;border:1px solid var(--line);background:var(--card);
  color:var(--sub);font:inherit;font-size:14px;cursor:pointer}
.tab b{margin-left:5px;color:var(--sub);font-weight:400;font-size:12px}
.tab.on{background:var(--acc);border-color:var(--acc);color:#1f1e1d;font-weight:600}.tab.on b{color:#1f1e1d}
.dot{position:absolute;top:-3px;right:-3px;width:11px;height:11px;border-radius:50%;background:var(--red);border:2px solid var(--bg)}
/* 정렬·국가 */
.ctrl{display:flex;gap:6px;overflow-x:auto;padding:0 16px 10px;scrollbar-width:none}.ctrl::-webkit-scrollbar{display:none}
.ctrl button{flex:none;border:1px solid var(--line);background:transparent;color:var(--sub);border-radius:8px;padding:5px 11px;font:inherit;font-size:12.5px}
.ctrl button.on{background:var(--card2);border-color:var(--card2);color:var(--text)}
.ctrl .sep{flex:none;width:1px;background:var(--line);margin:2px 4px}
main{padding:6px 12px 48px}
h2{font:600 19px/1.3 'ChosunIlboMyungjo',Georgia,serif;margin:16px 4px 2px}
.note{margin:0 4px 10px;color:var(--sub);font-size:12px}
.none{color:var(--sub);margin:24px 4px;text-align:center}
.card{display:block;background:var(--card);border-radius:12px;padding:12px 14px;margin:8px 0;color:var(--text);text-decoration:none;transition:background .15s}
.card:hover{background:var(--card2)}.card:active{opacity:.75}
.meta{color:var(--sub);font-size:12px}
.title{font-weight:500;margin-top:3px}
.orig{color:var(--sub);font-size:12px;margin-top:3px}
.new{margin-left:4px;color:var(--red);font-size:11px;font-weight:700;letter-spacing:.3px}
.hot{display:inline-block;margin-right:6px;padding:0 6px;border-radius:4px;background:rgba(217,119,87,.16);color:var(--acc);font-weight:600}
.hot.big{background:var(--acc);color:#1f1e1d}
.newbar{display:block;width:100%;margin:2px 0 6px;padding:9px;border:0;border-radius:10px;background:rgba(239,68,68,.14);color:#fca5a5;font:inherit;font-size:13px;text-align:left}
.more{display:block;width:100%;margin:4px 0 0;padding:10px;border:1px dashed var(--line);border-radius:12px;background:transparent;color:var(--sub);font:inherit;font-size:13px}
footer{margin:36px 4px 0;padding-top:14px;border-top:1px solid var(--line);color:var(--sub);font-size:12px;line-height:1.7}
footer b{color:var(--text);font-weight:600}
/* 요약 창 */
#dim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:5}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:6;max-width:760px;margin:auto;max-height:82vh;overflow-y:auto;
  background:var(--card);border-radius:16px 16px 0 0;padding:10px 18px calc(18px + env(safe-area-inset-bottom));box-shadow:0 -8px 30px rgba(0,0,0,.4)}
.grab{width:38px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 12px}
.s-title{font-size:17px;font-weight:600;margin:4px 0 2px;line-height:1.45}
.s-label{margin:16px 0 4px;color:var(--acc);font-size:12px;font-weight:700;letter-spacing:.5px}
.s-sum{font-size:15px;line-height:1.75}.s-sum.empty{color:var(--sub);font-size:13.5px}
.s-btns{display:flex;gap:8px;margin-top:20px}
.s-btns a{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;padding:11px 6px;border-radius:10px;font:inherit;font-size:13.5px;line-height:1.3;text-decoration:none;
  background:var(--acc);color:#1f1e1d;font-weight:600}
.s-btns a.cl{background:transparent;border:1px solid var(--acc);color:var(--acc)}
.s-close button{width:100%;margin-top:8px;padding:11px;border-radius:10px;background:transparent;border:1px solid var(--line);color:var(--sub);font:inherit;font-size:14px}
.s-cnote{margin-top:8px;color:var(--sub);font-size:11.5px;text-align:center}
#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);z-index:9;max-width:90%;padding:10px 16px;border-radius:10px;background:#faf9f5;color:#1f1e1d;font-size:13.5px;box-shadow:0 6px 20px rgba(0,0,0,.4)}
.seg{display:flex;gap:4px;margin:6px 4px 10px}.seg button{flex:1;min-width:0;border:1px solid var(--line);background:transparent;color:var(--sub);border-radius:8px;padding:7px 0;font:inherit;font-size:12.5px;white-space:nowrap}
.seg.ly{margin-top:-4px}.seg.ly button{padding:5px 0;font-size:12px}.seg.ly button.on{background:var(--card2);border-color:var(--acc);color:var(--text);font-weight:600}
.seg.sm{margin-bottom:8px}.seg.sm button{padding:9px 0;font-size:13px}.seg.sm button.on{background:var(--card2);border-color:var(--acc);color:var(--text)}
.warn{margin:0 4px 10px;padding:8px 10px;border-radius:8px;background:rgba(250,204,21,.08);color:var(--sub);font-size:12.5px;line-height:1.5}.warn b{color:var(--text)}
.seg button.on{background:var(--acc);border-color:var(--acc);color:#1f1e1d;font-weight:600}
.tot{margin:2px 4px 10px;color:var(--sub);font-size:13px}.tot b{color:var(--text)}.chgnote{font-size:11px}
.srow{background:var(--card);border-radius:12px;margin:6px 0;padding:10px 12px;cursor:pointer}.srow.open{background:var(--card2)}
.sline{display:flex;align-items:center;gap:8px}
.rk{width:18px;color:var(--sub);font-size:12px;text-align:right;flex:none}
.mv .gap{display:inline-block;width:3px}.mv{width:30px;flex:none;font-size:11px;font-weight:600;text-align:left;font-variant-numeric:tabular-nums;margin-right:-4px}.mv.up{color:#f87171}.mv.dn{color:#60a5fa}.mv.same{color:#a8a29e;font-size:15px;font-weight:700;line-height:1;padding-left:3px}
.sn{width:86px;flex:none;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb{flex:1;height:10px;background:rgba(255,255,255,.05);border-radius:5px;overflow:hidden;min-width:30px}.sb i{display:block;height:100%;background:var(--acc);border-radius:0 4px 4px 0}
.sc{width:54px;flex:none;text-align:right;font-size:14px;font-variant-numeric:tabular-nums}
.chg{width:48px;flex:none;text-align:right;font-size:11.5px;color:var(--sub)}.chg.up{color:#f87171}.chg.dn{color:#60a5fa}
.spark{flex:none}
.det{margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.dt{color:var(--sub);font-size:12px;margin:6px 0 4px}
.bars{width:100%;height:auto;display:block}.bars .ax{fill:var(--sub);font-size:10px}.bars .bar:hover rect+rect{opacity:.8}
.crow{display:flex;align-items:center;gap:8px;margin:3px 0;font-size:12.5px}.cl{width:86px;flex:none}.cb{flex:1;height:8px;background:rgba(255,255,255,.05);border-radius:4px;overflow:hidden}
.cb i{display:block;height:100%;background:var(--acc);opacity:.8;border-radius:0 3px 3px 0}.cn{width:50px;text-align:right;flex:none;font-variant-numeric:tabular-nums}
@media(max-width:400px){.spark{display:none}.sn{width:74px}}
</style></head><body>

규모로 자금을 이동할 수 있다고 지적했습니다. 그는 또한 3조 달러 이상의 부외 부채와 기술 대기업 간의 \"회전 자금 조달(사업에 쓸 돈을 모으는 것)\" 거래와 관련된 AI 인프라 투자 붐에 위험이 있다고 경고했습니다. (인터페이스)"},{"s":"\"국제 금융\" 인플레이션이 과열되고 있으며 연준 슈미드는 금리 인상이 \"필수적\"이라고 암시합니다.","so":"旺得富理財網","tm":"11/16 16:04","c":2,"r":"tw","u":"https://wantrich.chinatimes.com/news/20261116900246-420201","p":1794812651,"a":1794830371,"t":"《國際金融》通膨過熱 Fed施密德暗示升息「勢在必行」","su":"[Ke Wanxiu 및 The Times의 종합 외국 보고서 편집] 제프 슈미드 캔자스시티 연준 총재는 일요일 연준이 \"과열된\" 물가 압력에 대처할 수단과 책임이 있으며 연준은 인플레이션(물건값이 계속 오르는 것)에 대해 \"아직 해야 할 일이 있다\"고 말했습니다. 슈미드는 하와이에서 열린 신용조합 회의에서 추가 금리(돈을 빌릴 때 내는 이자 비율) 인상을 명시적으로 요구하지는 않았지만 \"인플레이션이 물가 안정 목표인 2%를 넘어서고 잘못된 방향으로 가고 있다\"고 강조했습니다."},{"s":"미국 증시의 급격한 하락 영향으로 대만 증시는 오늘 2,635포인트 급락해 역사상 두 번째로 큰 하락폭을 기록했다.","so":"經濟日報","tm":"11/16 15:01","c":2,"r":"tw","u":"https://money.udn.com/money/story/5607/9881677","p":1794808893,"a":1794809524,"t":"受美股重挫波及 台股今暴跌2635點 創史上第二大跌點紀錄","su":"오늘 대만 증시는 또 급락했습니다. 미국 반도체(전자기기의 두뇌 부품)주 폭락 영향으로 젠슨 엔비디아 CEO 황 회장 사임 논란 확산과 미국 물가·금리(돈을 빌릴 때 내는 이자 비율) 인상 우려가 닥치자 대만 증시는 하락세로 출발하고 매도압력이 계속 높아지며 4만3000포인트, 4만2000포인트를 연달아 돌파했다. 최종 가권지수는 2,635.04포인트(6.03%) 하락한 41,040포인트로 마감했다. 거래량은 NT$8,450억 6천만으로 증가했습니다. 이는 대만 주식 역사상 두 번째로 큰 마감점 하락폭으로, 올해 7월 17일의 2,953.71포인트 하락에 이어 두 번째입니다."},{"s":"'홍콩주식' 미국증시 약세에도 항셍지수 일시적으로 0.9% 상승","so":"工商時報","tm":"11/16 13:16","c":2,"r":"tw","u":"https://www.ctee.com.tw/news/20261116701136-430801","p":1794802560,"a":1794807031,"t":"《港股》不畏美股走弱 恆指暫漲0.9%","su":"[The Times의 Ke Wanxiu 및 종합 외국 뉴스 보도 편집] 미국은 지난 금요일에 문을 닫았지만 기술주와 반도체(전자기기의 두뇌 부품)주는 특히 약세를 보였습니다. 홍콩 항셍지수는 월요일 일시적으로 0.9% 상승한 23,854.51포인트를 기록했다. 국영기업주(H주)는 일시적으로 0.87% 상승한 8007.04포인트를 기록했다. Hang Seng Technology 주가 지수는 일시적으로 0.56% 상승했으며 Li Auto는 3.6% 상승해 최고 실적(회사가 번 돈 성적표)을 기록했습니다. 이어 바이두그룹과 메이투안이 3.2% 상승했고, 호라이즌 로보틱스가 3.1% 상승했다."},{"s":"충격 걱정은 NO! 모건스탠리, 글로벌 주식시장에 '최대 비중 확대' 외침, AI 지출 낙관, 안정적, S&P 15% 추가 상승","so":"經濟日報","tm":"11/16 12:22","c":2,"r":"tw","u":"https://money.udn.com/money/story/123398/9881266","p":1794799368,"a":1794806410,"t":"無懼震盪！大摩高喊「最  미국 대통령은 젠슨 황의 복귀에 반대하지 않겠다고 밝혔지만, 엔비디아 이사회는 그럴 의사가 없으며 외부에서 새 CEO를 찾기로 한 결정을 유지하고 있습니다. 엔비디아는 오늘 밤 미국 증시가 마감된 후 분기별 실적을 발표할 예정입니다. 이전에도 주가는 4% 이상 하락세를 이어갔다. 필라델피아 반도체(전자기기의 두뇌 부품) 지수가 5.3% 하락하는 등 시장과 AI주도 손실을 입었다. 다우지수는 739포인트(1.41%) 하락한 51608에, 나스닥(미국 기술 회사들이 많은 주식시장)은 626포인트(2.49%) 하락한 24509에, S&P는 145포인트(1.92%) 하락한 7416에 마감했습니다."},{"s":"사진과 잠재력이 있습니다 | 미국 주식 나스닥은 2.3% 하락했고, 반도체주는 또 큰 폭의 하락세를 보였으며, HSI는 하락세로 밤을 마감했습니다(계속 업데이트) | 홍콩경제신문","so":"香港經濟日報HKET","tm":"11/17 10:11","c":1,"r":"hk","u":"https://invest.hket.com/article/4226046/%E6%9C%89%E5%9C%96%E6%9C%89%E5%8B%A2%EF%BD%9C%E7%BE%8E%E8%82%A1%E7%B4%8D%E6%8C%87%E8%B7%8C2.3-%20%E5%8D%8A%E5%B0%8E%E9%AB%94%E8%82%A1%E5%86%8D%E9%81%87%E9%87%8D%E6%8C%AB%20HSI%E5%A4%9C%E6%9C%9F%E5%80%92%E8%B7%8C%E6%94%B6%E5%A0%B4%EF%BC%88%E6%8C%81%E7%BA%8C%E6%9B%B4%E6%96%B0%EF%BC%89","p":1794877866,"a":1794885718,"t":"有圖有勢｜美股納指跌2.3% 半導體股再遇重挫 HSI夜期倒跌收場（持續更新）|香港經濟日報"},{"s":"닛케이 0.9% 하락, 칩에 끌려, 금융주","so":"WSJ","tm":"11/17 09:53","c":1,"r":"us","u":"https://news.google.com/rss/articles/CBMimAFBVV95cUxQd0I1THJCeVRKSHNyU1hqcHVubzh4dHpZbHo2QlpPNXdEVDFqMWZzdkl0X3BmNGJXU1lpUWFrRi1odGh5bjFMb051NXRoT0FFemRranJNYWgwMERTVGd6eDJlTUJMMjRralkzMlFFNnhuLU93TFhaTkZqcS1HaEdSX0FnSDNtUDBhcm80MHVWMy1XOURDM0lROA?oc=5","p":1794876780,"a":1794885633,"t":"Nikkei Falls 0.9%, Dragged by Chip, Financial Stocks"},{"s":"미국 칩 재고와 국제유가는 급락했다. 황산코발트, 산화코발트, 코발트분말 가격 상승 지속 | 시판 전 정보","so":"21财经","tm":"11/17 09:40","c":1,"r":"cn","u":"https://www.21jingji.com/article/20261117/herald/67ce1434e877a6544cf99664c225c4c0.html","p":1794876000,"a":1794885660,"t":"美股芯片股、国际油价大跌；硫酸钴、氧化钴、钴粉价格继续大涨丨盘前情报","su":"A주 재개: 시장이 전체적으로 조정되었습니다. ChiNext 지수는 4% 이상 하락세로 출발했고, Shanghai Stock Exchange 지수는 3,600포인트에 근접했습니다. 상하이·선전 증시 거래액은 1조4800억원으로 전 거래일보다 1712억원 감소했다. 시장 전체에서 4,300개 이상의 주식이 하락했습니다. 시장에서는 은행 부문이 추세를 거스르고 세션 동안 강세(오르는 힘이 센 것)를 보였습니다. 중국공상은행, 중국건설은행, 난징은행, 청두은행, 항저우은행, 장쑤은행, 칭다오은행이 사상 최고치를 기록했다. 이번 회차에서는 AI 만화드라마의 컨셉이 화두가 되었고, 가전 부문의 상승폭이 커졌습니다. 메이디그룹 주가가 사상 최고치를 경신했다. 단점으로는 인기가 높은 주식이 하락하고 컴퓨팅 하드웨어 개념이 계속 약화되어 올해 최저치를 기록했습니다. 11월 16일 마감 기준으로 상하이증권거래소지수는 0.87% 하락했고, 선전부품지수는 2.53%, 차이넥스트지수는 4.37% 하락했다."},{"s":"워시 연준 의장은 다음과 같은 연설을 했습니다: AI는 경제에 중요하지만 이러한 주요 위험은 경계해야 합니다.","so":"第一财经","tm":"11/17 09:24","c":1,"r":"cn","u":"https://news.google.com/rss/articles/CBMiU0FVX3lxTE1iUlVPUUFZNTdDQnA5NUZhaGRIVENaZ21XbEo0c1poM01IX3ptZmR5TlFUZWQtNkJVUDRjX3pqWTVjTldOZmp4N0ZTcEVZMVpnUjhZ?oc=5","p":1794875082,"a":1794885664,"t":"美联储主席沃什重磅讲话：AI对经济很重要，但需要防范这些重大风险"},{"s":"연준은 AI가 경제에 미치는 영향에 대한 세 가지 시나리오를 평가합니다. AI가 시장 기대를 충족시키지 못하면 경기 둔화와 실업률 증가로 이어질 수 있습니다.","so":"ThePaper.cn","tm":"11/17 09:19","c":1,"r":"cn","u":"https://www.thepaper.cn/newsDetail_forward_34491127","p":1794874758,"a":1794885667,"t":"美联储评估AI对经济三种影响情景：若未能达市场预期或导致经济放缓和失业率上升","su":"현지 시간으로 11월 16일, 케빈 워시 연준 의장은 인공지능(AI)이 미국 경제 성장 방식을 바꿀 수 있다고 말했다. 연방준비제도(미국의 중앙은행) 이사회 직원들은 평가를 위해 모델 프레임워크를 사용하기 시작했습니다."},{"s":"열기 전에 꼭 읽어야 할 내용 | 미국 증시는 나스닥이 거의 2.5% 급락하는 등 하락세로 마감했습니다. 산잉인터내셔널, 처음으로 액면가 폐지 경고 발령","so":"第一财经","tm":"11/17 09:08","c":1,"r":"cn","u":"https://www.yicai.com/news/103442798.html","p":1794874137,"a":1794885671,"t":"盘前必读丨美股收跌纳指重挫近2.5%；山鹰国际首次拉响面值退市警报"},{"s":"전 백악관 경제보좌관 경고: AI 버블이 터지면 기본 케이스 S&P500은 25% 하락할 수 있다","so":"第一财经","tm":"11/17 08:55","c":1,"r":"cn","u":"https://www.yicai.com/news/103442778.html","p":1794873317,"a":1794874002,"t":"前白宫经济顾问警告：若AI泡沫破裂，基准情形标普500或下跌25%","su":"제일재경 2026-11-17 07:53:23 편집자: Tang Yanbei Jason Foreman 전 백악관 경제자문위원회 의장은 기사에서 경제가 직면한 위험을 이해하는 열쇠는 \"AI가 곧 터질 거품이라면 주식 시장이 얼마나 깊이 떨어질 수 있는지\"를 잘 아는 것이라고 썼습니다."},{"s":"부시 연준의장은 AI가 양날의 검이라고 경고했다. 생산성이 향상될 것으로 예상되지만, 대규모 실업을 촉발하거나 경제를 위축시킬 수도 있습니다.","so":"鉅亨網","tm":"11/17 08:54","c":1,"r":"tw","u":"https://news.cnyes.com/news/id/6664523","p":1794873292,"a":1794874007,"t":"Fed主席華許示警AI雙面刃！可望推升生產力 卻也恐掀大規模失業或因拖累經濟","su":"워셔는 AI가 생산성을 높이고 성장을 촉진하며 미래 통화 정책에 영향을 미칠 수 있지만 대규모 실업을 초래할 수도 있다고 말했다.\n그는 세 가지 시나리오를 제안했다. 고용이 완전고용에 가까워지거나, 일부 일자리가 자동화로 대체되거나, AI 투자가 예상과 달리 경제를 위축시킨다.\n샌프란시스코 실무 그룹 회의는 생산성과 고용에 중점을 두었으며 참석자에는 비즈니스 리더, 경제학자 및 Marc Andreessen이 포함되었습니다."},{"s":"미국 증시 반등에 헤지펀드 공매도 증가! 기술주의 롱숏 비율이 10년 만에 최저치를 기록했고, 골드만삭스는 시장 모순을 드러냈습니다.","so":"鉅亨網","tm":"11/17 08:44","c":1,"r":"tw","u":"https://news.cnyes.com/news/id/6662923","p":1794872650,"a":1794874009,"t":"美股反彈避險基金反而加碼放空！科技股多空比創10年新低、高盛揭市場矛盾","su":"필라델피아 반도체 지수가 한 주 만에 8% 이상 올랐지만 골드만삭스는 헤지펀드가 2주 연속 미국 주식 순매도에 나섰고, 지난주에는 주로 신주 공매도를 펼쳤다고 지적했다.\n미국 정보기술주의 롱숏 비율은 1.5로 하락해 2016년 이후 최저치를 기록했다. 기술주에 대한 배분은 S&P500(미국 큰 회사 500곳 지수)보다 20%포인트(퍼센트끼리 뺀 차이) 이상 낮았습니다.\n골드만삭스는 시장이 공매도를 위한 조건을 갖고 있지만 펀드는 여전히 반등을 활용하여 공매도를 하고 있다고 말했습니다. 다중 운용사 펀드는 10월에 2.3% 손실을 입어 사상 최악의 손실을 기록했습니다."},{"s":"미국 증시 하락, AI 관련주 매도세 지속(Zeng Huiqi 보고)","so":"Now 新聞","tm":"11/17 08:29","c":1,"r":"hk","u":"https://news.now.com/mobile/finance/player?newsId=669817","p":1794871769,"a":1794885723,"t":"美股下挫 AI相關股繼續被拋售(曾惠琪報道)"},{"s":"세미어낼러시스 “AI 가속기 수요증가 둔화”[월가월부]","so":"매일경제 마켓","tm":"11/17 08:20","c":1,"r":"kr","u":"https://stock.mk.co.kr/news/view/1200271","p":1794871255,"a":1794873995,"su":"세미어낼러시스 “AI 가속기 수요증가 둔화”[월가월부] 문지웅 기자(jiwm80@mk.co.kr) 입력 : 2026.11.17 08:20:55 16일(현지시간) 마감한 뉴욕증시에서 3대 지수는 1~2%대 하락했다. 다우존스 지수는 1.41% 내렸고, S&P500(미국 큰 회사 500곳 지수)과 나스닥(미국 기술 회사들이 많은 주식시장) 지수도 각각 1.92%와 2.49% 하락 마감했다. 젠슨황 엔비디아 창업자 겸 최고경영자(CEO)가 지난 12일 물러난 후부터 뉴욕증시 기술주들이 하락 압력을 받고 있다."},{"s":"엔비디아는 실적 발표 전날 매도되어 4% 이상 하락했습니다! 미국 4대 주가지수 모두 하락세로 마감했고, 엔비디아는 거의 1년 반 만에 최저치를 기록했습니다.","so":"TVBS新聞網","tm":"11/17 08:17","c":1,"r":"tw","u":"https://news.tvbs.com.tw/money/4051593","p":1794871020,"a":1794874011,"t":"輝達財報前夕遭拋售下挫逾4%！美股4大指數全收跌 NVIDIA創下近一年半新低","su":"(뉴욕 중앙통신사, 16일 종합외신보도) 투자자들은 인공지능(AI) 반도체(전자기기의 두뇌 부품) 회사 엔비디아의 재무실적(회사가 번 돈 성적표) 발표를 기다리고 있지만 기술주는 매도압력이 크다. 미국 4대 주식 시장 지수는 모두 오늘 마감했으며, 엔비디아의 주가는 4% 이상 하락한 156.14달러로 지난해 7월 1일 이후 최저치를 기록했습니다."},{"s":"[모닝포스트] 심야 대폭락, 미국 반도체주 전반적으로 급락; 국제 원유가 크게 하락했습니다. Shengtun Mining, Shenghong Technology, Megmeet이 주식을 환매할 계획입니다.","so":"财联社","tm":"11/17 08:16","c":1,"r":"cn","u":"https://www.cls.cn/detail/2536060","p":1794870960,"a":1794874003,"t":"【早 ,{"s":"테이크 투, 시간외로 상승 = 미국 주식 개별","so":"株探","tm":"11/16 22:37","c":1,"r":"jp","u":"https://s.kabutan.jp/news/n202611161395/","p":1794836220,"a":1794838036,"t":"テイクツー、時間外で上昇＝米国株個別","su":"【당 사이트에서 제공하는 정보에 대해】 당 사이트 「주탐(카부탄)」에서 제공하는 정보는 투자 권유 또는 투자에 관한 조언을 하는 것을 목적으로 하고 있지 않습니다. 투자 결정은 자신의 판단으로 이루어지도록 부탁드립니다. 당 사이트에 있어서의 데이터는, 도쿄 증권 거래소, 오사카 거래소, 나고야 증권 거래소, JPX 총연, 재팬 넥스트 증권, 도지마 거래소, China Investment Information Services, CME Group Inc. 등으로부터의 정보의 제공을 받고 있습니다. 닛케이평균주가의 저작권은 일본경제신문사에 귀속됩니다."},{"s":"연준 마이클 바는 AI 에이전트가 고속으로 돈을 이동시키면 은행 운영이 가속화될 수 있다고 경고합니다.","so":"鉅亨網","tm":"11/16 22:30","c":1,"r":"tw","u":"https://news.cnyes.com/news/id/6664291","p":1794835834,"a":1794838029,"t":"聯準會巴爾示警：AI代理高速搬錢恐讓銀行擠兌加速","su":"마이클 바 연준 총재는 AI 에이전트가 고속으로 자금을 이동하여 은행 운영을 가속화할 수 있다고 경고했습니다. Uanalyze 2026년 11월 16일(Uanalyze/Industry Data Center 보고서) ⸺ 마이클 바 연준 총재는 AI 에이전트가 스트레스를 받는 동안 은행이 예금을 더 빨리 잃게 만들 수 있다고 말했습니다. 시스템이 금리(돈을 빌릴 때 내는 이자 비율)차이나 금융안정 신호를 자동으로 감지해 신속하게 고객에게 자금을 이체할 경우 은행의 기존 유동성(시장에 도는 돈의 양) 관리 및 규제 당국이 제때 대응하지 못할 수도 있다. 마이클 바는 밀라노에서 열린 금융 AI 컨퍼런스에서 대형 은행들이 AI 에이전트가 개별 고객 계좌를 운영하려고 시도하지만 실제 신원, 고객의 동의 여부, 운영이 고객의 지시를 준수하는지 여부를 확인할 수 없다는 사실을 발견했다고 지적했습니다. 그는 AI 에이전트를 금융 서비스에 도입하려면 신원 확인을 강화하고 개인 운영 권한을 확인하며 에이전트의 권한을 제한하는 기술을 사용해야 한다고 주장했습니다."},{"s":"연준 관계자는 인플레이션이 \"잘못된 방향으로 가고 있다\"고 경고했습니다! 시장은 12월 금리를 0.25%포인트 인상할 것이라는 점에 전적으로 베팅하고 있으며, 내년 1월에도 금리를 인상할 가능성이 있다.","so":"鉅亨網","tm":"11/16 22:10","c":1,"r":"tw","u":"https://news.cnyes.com/news/id/6663647","p":1794834605,"a":1794838031,"t":"Fed官員示警通膨「走錯方向」！市場完全押注12月升息1碼、明年1月也可能升息","su":"슈미드는 9월 연간 인플레이션(물건값이 계속 오르는 것)율 3.6%가 여전히 목표인 2%보다 높고 추세가 연준의 방향에서 벗어났으며 가격 통제를 위해 해야 할 일이 아직 남아 있다고 말했다.\n시장은 연준이 12월에 0.25% 포인트 금리(돈을 빌릴 때 내는 이자 비율)를 인상할 것이라는 기대를 충분히 반영했으며, 0.5% 포인트 금리 인상 가능성도 약간 있습니다. 콜린스는 내년에는 정책금리가 더 높아질 수도 있다고 말했다.\n슈미드는 인플레이션 압력은 에너지, 관세, AI 건설 및 의료 비용에서 비롯되며 연준은 여전히 수요를 억제하고 가격 안정성을 유지할 수 있는 도구를 보유하고 있다고 지적했습니다."},{"s":"S&P500의 거의 5분의 1이 뚜렷한 후임자가 없는 3명의 남성에게 묶여 있습니다.","so":"The Washington Post","tm":"11/16 22:02","c":1 "},{"s":"'주변 초점' 워시 연준(FRB) 의장이 연설을 하고, 미국은 뉴욕 연준 제조업 지수를 발표했다.","so":"etnet 經濟通","tm":"11/16 18:34","c":1,"r":"hk","u":"https://www.etnet.com.hk/www/tc/news/news-article.php?section=categorized&category=latest&newsid=20261116070","p":1794821640,"a":1794830383,"t":"《外圍焦點》美聯儲主席沃什發表演講，美國公布紐約聯儲製造業指數","su":"2026년 11월 16일 17:34 \"외부 초점\" 워시 연준 의장이 연설을 했고, 미국은 뉴욕 연준 제조업 지수를 발표했습니다. 미국 증시는 지난 금요일(13일) 엇갈린 흐름을 보였습니다. 시장은 엔비디아 CEO 젠슨 황의 퇴임 소식을 계속해서 소화하고 있다. 게다가 미국의 인플레이션(물건값이 계속 오르는 것) 압력도 완전히 가라앉지 않았다. 투자자들은 연준의 추가 금리 인상에 대해 점점 더 우려하고 있습니다. 기술주와 반도체주는 매도 압력이 크다. 다우지수는 50.46포인트(0.1%) 소폭 상승한 52,347.55포인트로 마감했습니다. S&P500(미국 큰 회사 500곳 지수)은 30.73포인트(0.4%) 하락한 7,561.67포인트를 기록했습니다. 나스닥지수는 229.82포인트(0.91%) 하락한 25,136.27포인트에 거래됐다. 홍콩주 항셍지수는 116포인트(0.5%) 상승한 23,753으로 마감했고 거래액은 1,741억 위안을 기록했다."},{"s":"다우존스 선물은 0.06% 상승한 52,451을 기록했습니다.","so":"etnet 經濟通","tm":"11/16 18:26","c":1,"r":"hk","u":"https://www.etnet.com.hk/www/tc/us-stocks/news-article/416885/%E9%81%93%E7%93%8A%E6%96%AF%E6%8C%87%E6%95%B8%E6%9C%9F%E8%B2%A8%E5%8D%870.06%25%EF%BC%8C%E5%A0%B152451","p":1794821186,"a":1794830385,"t":"道瓊斯指數期貨升0.06%，報52451","su":"최신 미국 증시 뉴스 및 정보를 제공하여 주식 시장 동향을 파악할 수 있습니다. 당신이 투자자이거나 주식시장에 관심이 있는 사람이라면, 주식시장 동향과 투자 동향을 이해하는 데 도움이 되는 실시간 주식시장 차트, 전문가 분석, 기업 뉴스 보고서 등 풍부한 콘텐츠가 여기에 있습니다. 지금 검색하여 최신 미국 주식 정보를 마스터하고 독점 보고서와 전문 분석을 즐겨보세요. | 미국 주식 뉴스 | 에트넷 이코노믹 익스프레스"},{"s":"금값이 갑자기 폭락! 연준이 금리를 인상하면 기대감도 높아집니다!","so":"21财经","tm":"11/16 18:15","c":1,"r":"cn","u":"https://www.21jingji.com/article/20261116/herald/9e5b878a75e1a0cc35666954aac2a1f1.html","p":1794820542,"a":1794838028,"t":"金价，突发跳水！美联储加息，预期增强！","su":"11월 16일 국제 귀금속 시장은 다시 하락세를 보였습니다. 보도 시간 현재 런던 현물 금 가격은 온스당 3,832.23달러로 2025년 9월 이후 최저치를 기록했다. 중국 국내 선물 시장에서도 16일 귀금속 가격도 하락세를 보이며 상위권에 들었다. 오후 마감 현재 주요 계약인 상하이 은은 6.42% 하락했고, 백금과 팔라듐은 각각 3.1%, 1.78% 하락했고, 상하이 금은 1.18% 하락해 장중 최저치인 824.2위안/그램을 기록했다. 최근 귀금속 가격이 지속적으로 하락하는 이유에 대해 Everbright Futures의 분석가 Zhan Dapeng은 시장이 연준이 12월에도 계속해서 금리(돈을 빌릴 때 내는 이자 비율)를 인상할 것이라는 점을 확신하고 있다고 믿고 있습니다. 이날 미국 10년 만기 국채수익 94834698,"t":"Asian Equities Drop as U.S. Chip Selloff Spills Over"},{"s":"연준의 금융 안정성 보고서는 AI 관련 위험에 대해 경고합니다. 데이터 센터 건설에 사용되는 전방 임대 및 백업 보증 규모는 약 3조 달러에 달합니다.","so":"ThePaper.cn","tm":"11/16 14:21","c":1,"r":"cn","u":"https://www.thepaper.cn/newsDetail_forward_34488735","p":1794806464,"a":1794806806,"t":"美联储金融稳定报告预警AI相关风险：用于数据中心建设的远期租赁与兜底担保规模已达约3万亿美元","su":"近日，美联储发布新一期金融稳定报告显示，通过调查发现，AI相关风险成为受访者提及最多的未来12至18个月美国金融稳定潜在风险，87%的受访者将其列为重要风险，较"},{"s":"민주당이 의회에서 승리하면 AI 규제에 대한 불확실성이 높아지고 미국의 두 가지 주요 주식 ETF에 도입 기회가 생길 것입니다.","so":"UDN","tm":"11/16 13:55","c":1,"r":"tw","u":"https://udn.com/news/story/123006/9881527","p":1794804955,"a":1794806405,"t":"民主黨若奪國會AI監管變數升高 兩大美股ETF迎布局契機","su":"미국 중간선거가 2027년 정책 동향에 영향을 미치게 된다. 민주당이 의회를 장악하게 되면 AI 규제, 관세, 그린에너지 정책 등이 새로운 변수를 낳을 수 있고, 시장 변동성(값이 크게 출렁이는 정도)은 커질 수밖에 없다. 그러나 역사적 경험으로 볼 때 미국 증시는 중간 선거 이후 더 나은 성과를 보이는 경향이 있으며 다우존스와 S&P500(미국 큰 회사 500곳 지수) 지수 ETF는 자본 헤징 옵션이 되었습니다."},{"s":"연준의 금리 논의에서 롱-숏 차이가 심화되고 있습니까? 휴머노이드 로봇: 출하량 증가 + 거대 기업의 투자 증가! 기관 매도 vs. 개인 투자자, 반도체주 매수 | 20261020월스트리트에서 루자쭈이까지","so":"第一财经","tm":"11/16 13:52","c":1,"r":"cn","u":"https://www.yicai.com/video/103400301.html","p":1794804755,"a":1794839852,"t":"美联储议息多空分歧加剧？人形机器人：出货高增+巨头加码！机构狂卖vs散户抄底芯片股丨20261020从华尔街到陆家嘴","su":"① 시장은 아무 조치도 취하지 않을 것에 베팅하고 있습니다. 경제학자들은 연준의 10월 금리 인상에 대한 우려가 과소평가됐다고 경고합니다. 선물 시장은 연준의 10월 금리 인상을 거의 무시하고 있습니다. 이는 연준에게 10월 금리 인상 가능성이 약 17%에 불과하며 아무 조치도 취하지 않을 것이라고 예상하고 있습니다. 그러나 많은 경제학자들은 이번 달 연준 금리 회의가 확실하지 않다고 믿고 있습니다. 뱅크오브아메리카 전 수석 이코노미스트 에단 해리스(Ethan Harris)는 이를 '50-50'이라고 불렀고, 옥스포드 경제학자 매튜 마틴(Matthew Martin)은 10월과 12월에 금리가 연속 인상될 것이라고 예측하기도 했다. 이러한 차이는 예상보다 높은 인플레이션(물건값이 계속 오르는 것)에서 비롯됩니다. 미국의 9월 CPI는 전년 동기 대비 3.7%, PPI는 전년 동기 대비 6.3%였습니다. 에너지와 해외 원자재 가격은 상승세(오르는 흐름)를 가속화하며 경직성을 부각시켰다. 워시 연준 의장은 의도적으로 중립을 유지했으며 선제적 성명을 거부했습니다. 금리가 예상치 못하게 인상되면 미국 채권수익률이 상승하고, 달러화 가치가 상승하며, 성장주와 고수익채권 등 위험자산이 위축되고, 만기금리에 대한 시장의 기대가 높아진다. 현재 시장은 이번 라운드의 정책 게임의 강도를 과소평가할 수 있습니다."},{"s":"모건스탠리 “S&P500 15% 상승 여력…대만보다 한국 주식 선호”｜Global Money Club","so":"중앙일보","tm "su":"젠슨 황이 돌연 사임하며 혼외 불륜 논란에 휩싸였다. 월스트리트 애널리스트 10명 이상이 엔비디아의 신용등급을 하향 조정했고, 시장은 불분명한 승계를 우려하고 있다.\n번스타인은 엔비디아를 목표주가(전문가가 예상한 앞날의 주가) $200와 \"동일\" 수준으로 낮췄습니다. 오펜하이머도 이를 '보류'로 낮췄다.\n화요일 엔비디아의 실적(회사가 번 돈 성적표) 보고서 이전에는 CFO Kress가 CEO로 활동했습니다. 애널리스트들은 주가가 압박을 받을 것을 우려해 기술 소프트웨어/정보보안주로 눈을 돌릴 것을 제안했다."},{"s":"월스트리트와 경쟁하다 - Wen Jie | AI 주가 급락해 시장 하락, 마이크로소프트는 그 수정을 활용해 단계별 배포(동영상 포함)","so":"etnet 經濟通","tm":"11/16 12:33","c":1,"r":"hk","u":"https://www.etnet.com.hk/www/tc/news/news-article.php?section=features&category=interview&newsid=416833","p":1794799980,"a":1794806412,"t":"比拼華爾街－溫傑 | AI股重挫拖累大市，微軟趁回調分段部署（有片）","su":"월스트리트와 경쟁하다 - Wen Jie | AI주 폭락하며 시장 하락세, 마이크로소프트는 조정을 틈타 단계적 전개(일부)로 지난주 금요일(13일) 시장이 인공지능(AI) 부문 조정과 미 연방준비제도(연준)의 정책 전망에 촛점을 맞추는 가운데 미국 증시 실적이 양분됐다. AI주 매도 압력으로 필라델피아 반도체지수와 나스닥 종합지수는 각각 3.4%, 0.9% 하락했고, S&P500(미국 큰 회사 500곳 지수) 지수도 0.4% 하락했다. 그러나 10월 미국 생산자물가(공장에서 파는 물건값 수준)지수(PPI) 증가율이 시장 전망보다 낮아 연준의 추가 긴축 통화정책에 대한 일부 투자자들의 우려가 완화되었습니다. 다우존스 산업평균지수는 추세를 거스르고 0.1% 상승했습니다. 또한 고평가 성장주에서 금융, 유틸리티 등 방어 부문에 이르기까지 자본 흐름에 상당한 변화가 있었습니다."},{"s":"AI 열풍이 흔들리고 있다. 6월에 데이터 센터 컨셉 주식이 4조 2천억 달러 증발했습니다 | 미국 증시 동향 | 국제","so":"經濟日報","tm":"11/16 12:32","c":1,"r":"tw","u":"https://money.udn.com/money/story/123398/9881307?from=edn_newestlist_rank","p":1794799962,"a":1794830380,"t":"AI熱潮動搖 資料中心概念股6月來蒸發4.2兆美元 | 美股動態 | 國際","su":"인공지능(AI) 열풍에 대한 현재 시장의 신뢰가 흔들리고, 데이터센터(컴퓨터 수만 대를 모아 둔 건물) 구축과 자주 연관되는 기업들이 최근 매도세(팔려는 힘)에 타격을 입었다. 글로벌 제조, 유틸리티 및 광업..."},{"s":"[월스트리트 오리지널 보이스] 연방준비제도(연준)가 AI 자금조달 리스크를 우려하면서 시장의 우려도 크게 높아졌다.","so":"财新数据","tm":"11/16 12:17","c":1,"r":"cn","u":"https://database.caixin.com/2026-11-16/102505178.html","p":1794799020,"a":1794806401,"t":"【华尔街原声】美联储关注AI融资风险，市场担忧显著升温","su":"설문 조사에 따르면 응답자의 87%가 AI를 잠재적 위험으로 꼽았으며 민간 신용의 투명성 부족이 우려의 원인인 것으로 나타났습니다."},{"s":"미국-이란 협상 불확실성으로 인해 루피와 채권에 부담; 연준, RBI 금리경로 주목","so":"Reuters","tm":"11/16 10:32","c":1,"r":"us","u":"https://www.reuters.com/world/india/us-iran-deal-uncertainty-weigh-rupee-bonds-fed-rbi-rate-paths-eyed-2026-11-16/","p":1794792720,"a":1794834699,"t":"US-Iran deal uncertainty to weigh on rupee and bonds; Fed, RBI rate paths eyed"},{"s":"또 다른 연준 관계자는 \"매파적\"이다.","so":"21财经","tm":"11/16 10:24","c":1,"r":"cn","u":"https://www.21jingji.com/article/20261116/herald/5448135692bec7d5fb6aa6c8c1a1a5b1.html","p":1794792240,"a":1794806402,"t":"又一美联储官员“放鹰”","su":"제프 슈미드 캔자스시티 연은총재는 \"연준은 과열된 가격 압력에 대처할 수 있는 도구와 책임을 갖고 있으며 중앙은행은 여전히 인플레이션(물건값이 계속 오르는 것)에 대해 할 일이 남아 있다\"고 말했다. 슈미드는 하와이에서 열린 신용조합 회의에서 인플레이션이 \"물가안정 목표인 2%를 충격적으로 초과했으며 잘못된 방향으로 움직이고 있다\"고 말했다. 그는 추가 금리(돈을 빌릴 때 내는 이자 비율) 인상을 명시적으로 요구하지 않았습니다. 슈미드는 최근 인플레이션의 현재 성격과 연준의 이를 억제할 수 있는 능력에 대해 형성된 지배적인 견해가 현실과는 거리가 멀다고 말했습니다. 그는 높은 인플레이션이 반복되는 공급 충격으로 인해 발생한다는 생각은 요점을 놓치고 있다고 말했습니다. 인플레이션은 항상 공급과 수요의 불균형의 결과입니다. 수요가 강하기 때문에 공급 측면의 충격으로 인해 가격이 상승할 수 있습니다. 수요는 항상 인플레이션에서 핵심적인 역할을 해왔으며, 연준은 수요에 미치는 영향을 통해 인플레이션을 처리할 수 있는 도구와 책임을 항상 갖고 있었습니다."},{"s":"FT: 젠슨 황은 엔비디아의 CEO로 복귀하는 것을 고려하고 있습니다. 실리콘 밸리의 유명 인사들이 로비 활동을 돕기 위해 \"전쟁실\"을 구성했습니다. 미국 증시 동향 | 국제","so":"經濟日報","tm":"11/16 04:24","c":1,"r":"tw","u":"https://money.udn.com/money/story/123398/9880721","p":1794770668,"a":1794839854,"t":"FT：黃仁勳考慮回歸輝達執行長 矽谷大咖組「戰情室」幫忙遊說 | 美股動態 | 國際","su":"영국 파이낸셜 타임즈(FT)는 이 문제에 정통한 사람들의 말을 인용해 엔비디아 공동 창립자인 젠슨 황이 혼외 관계로 엔비디아를 떠난 후 Silicon Valley가 엔비디아 이사회에 젠슨 황이 CEO로 복귀할 수 있도록 계속해서 압력을 가했다고 보도했습니다. 이제 '인공지능(AI)의 대부'로 알려진 젠슨 황이 엔비디아의 조타수 역할을 맡기 위해 '컴백'을 고려하고 있습니다."},{"s":"연준 보고서는 AI 컴퓨팅 능력 부채를 분석합니다. 발행 규모는 6,800억 달러, 부외 약정 금액은 3조 달러, 순환 자금 조달을 해결하는 방법은 무엇입니까?","so":"36Kr","tm":"11/16 03:07","c":1,"r":"cn","u":"https://m.36kr.com/p/4071919873922948","p":1794766020,"a":1794830369,"t":"美联储报告拆解AI算力债务：6800亿美元发行、3万亿美元表外承诺，循环融资何解？"},{"s":"코헨 전 연준 부의장과의 독점 인터뷰: 연준의 금리 인상 실패는 더 많은 비용을 초래할 것입니다","so":"36Kr","tm":"11/16 01:58","c":1,"r":"cn","u":"https://m.36kr.com/p/4072170578236547","p":1794761880,"a":1794834703,"t":"专访美联储前副主席科恩：美联储不加息代价更高"},{"s":"골드만삭스, 2027년 S&P500 목표가 재설정","so":"Yahoo Finance","tm":"11/16 00:37","c":1,"r":"us","u":"https://finance.yahoo.com/market 되는 혁신의약품 목록에 포함됐다고 발표했다. 2026년 9월 경제옵저버는 상업보험 혁신의약품 카탈로그 현장에서 이번에 가격협상에 총 11개사, 12개 의약품이 참여했다는 사실을 알게 됐다. 이는 상업적으로 보장되는 혁신적인 의약품 카탈로그의 가격 협상에 참여하는 모든 의약품이 카탈로그에 성공적으로 포함되었음을 나타냅니다. 2025년에 국민의료보험청은 처음으로 상업적으로 보장되는 혁신의약품 목록에 대한 가격 협상을 시작했습니다. 정식심사를 통과한 의약품은 총 121개이며, 특별협상에는 24개 의약품이 참여했다. 결국 19개 의약품이 성공적으로 협상돼 약 80%의 성공률을 보였다(1개 의약품은 이후 시장에서 퇴출됐다). 2026년에는 신청 건수가 감소할 예정이다. 총 62개 의약품이 상업 보험 혁신 의약품 목록에 제출되었으며, 그 중 58개가 정식 검토를 통과했다. 하지만 결국 협상 성공률은 100%로 높아졌다."},{"s":"Biocon, Perjeta®의 바이오시밀러인 Pebrilzo™(pertuzumab-qcay) 주사제에 대해 미국 FDA 승인을 획득하여 종양학 포트폴리오 확장 – 회사 발표 - FT.com","so":"Financial Times","tm":"11/16 22:10","c":2,"r":"world","u":"https://markets.ft.com/data/announce/detail?dockey=600-202611160810BIZWIRE_USPRX____20261116_BW435734-1","p":1794834600,"a":1794838049,"t":"Biocon Gets U.S. FDA Approval for Pebrilzo™ (pertuzumab-qcay) Injection, a Biosimilar to Perjeta®, Expanding Its Oncology Portfolio – Company Announcement - FT.com"},{"s":"시장은 2,600포인트 넘게 폭락했지만 이 생명공학 주식은 추세를 거스르고 상한가를 뛰어올랐습니다 | 업계 핫스팟 | 산업","so":"經濟日報","tm":"11/16 17:05","c":2,"r":"tw","u":"https://money.udn.com/money/story/5612/9881979?from=edn_newest_index","p":1794816321,"a":1794830407,"t":"大盤崩超過2,600點 這檔生技股卻逆勢跳空漲停 | 產業熱點 | 產業","su":"엔비디아 젠슨 황 전 CEO의 사임이 미국 정계와 재계의 갈등으로 확대됐다. 대만증시는 16일 2,635.04포인트 급락해 6.03% 하락한 41,040.08포인트로 저점을 마감했다. 그러나 생명공학 주식인 Haoding(4174)은 추세를 거스르고 한도를 뛰어올라 지난 2년 만에 최고치인 NT$71.3으로 마감했습니다."},{"s":"보령·셀트리온제약, 年 처방액 517억 당뇨병 치료제 공동판매 - 머니투데이","so":"머니투데이","tm":"11/16 15:48","c":2,"r":"kr","u":"https://www.mt.co.kr/thebio/2026/11/16/2026111615403821339","p":1794811712,"a":1794812192,"su":"보령과 셀트리온제약이 지난해 국내 처방액 517억원을 기록한 당뇨병 치료제 6종의 공동판매에 나선다. 내년 1월 출범하는 보령의 영업·마케팅 전문 자회사 보령파마솔루션은 기존 당뇨병 치료제에 오리지널 의약품을 추가하며 제품군을 확대하게 됐다."},{"s":"특이한 주식丨아케소가 20% 넘게 투자했는데, 미국과 제휴한 항암제가 FDA 승인을 받지 못했다.","so":"信報網站","tm":"11/16 10:52","c":2,"r":"hk","u":"https://m.hkej.com/landing/mobarticle2/id/4565963/%E7%95%B0%E5%8B%95%E8%82%A1%E4%B8%A8%E5%BA%B7%E6%96%B9%E7%94%9F%E7%89%A9%E6%8F%92%E9%80%BE%E5%85%A9%E6%88%90%20%E8%88%87%E7%BE%8E%E5%90%88%E4%BD%9C%E5%A4%A5%E4%BC%B4%E6%8A%97%E7%99%8C%E8%97%A5%E6%9C%AA%E7%8D%B2FDA%E6%89%B9%E5%87%86","p":1794793934,"a":1794794329,"t":"異動股丨康方生物插逾兩成 與美合作夥伴抗癌藥未獲FDA批准","su":"아케소(09926)와 미국 파트너의 항암제인 FDA가 승인을 거부했다. 주가는 일시적으로 31.8%나 하락해 최저치인 56.1위안까지 떨어졌다. 오전 9시 46분 현재 24.2% 하락한 62.35위안에 거래되고 있으며 거래액은 15억 2천만 위안 이상이다. 아케소의 전략적 파트너인 미국 제약회사 서밋 테라퓨틱스(Summit Therapeutics)는 미국 식품의약국(FDA)이 폐암치료제 출시 신청을 거부했다고 밝혔다. 아케소는 중국 내 ivonescimab 약물의 최초 개발 및 유통업체입니다."},{"s":"혁신의약품에 대한 지불 병목 현상이 완화되었습니다. Southern Fund의 자회사인 Southbound Innovative Drug ETF Southern(159297)은 하루 거래액이 약 1억 2400만 위안에 달하는 활발히 거래되고 있습니다.","so":"Jiemian.com","tm":"11/16 10:50","c":2,"r":"cn","u":"https://www.jiemian.com/article/15335093.html","p":1794793849,"a":1794795137,"t":"创新药支付瓶颈松动，南方基金旗下港股通创新药ETF南方(159297)交投活跃，单日成交额约1.24亿元","su":"11월 13일 홍콩 주식은 전반적인 조정을 겪었고 이후 혁신 의약품 부문은 약세(내리는 흐름)를 보였습니다. National Securities Hong Kong Stock Connect Innovative Drug Index(987018)는 2.60% 하락한 1717.41포인트로 마감했습니다. Southbound Innovative Drug ETF(여러 주식을 묶어 파는 상품) South(159297)가 그 뒤를 따르고 있으며 거래량은 약 1억 2400만 위안, 회전율은 5.74%입니다."},{"s":"CITIC 증권: 국가 의료 보험 협상은 계속해서 혁신적인 의약품을 지원하고 2027년 상업화 성장에 초점을 맞추고 있습니다.","so":"第一财经","tm":"11/16 09:12","c":2,"r":"cn","u":"https://www.yicai.com/news/103441152.html","p":1794787939,"a":1794794328,"t":"中信证券：国家医保谈判持续支持创新药 关注2027年商业化增量","su":"제일재경 2026-11-16 08:08:38 편집자: Tang Yanbei CITIC 증권 연구 보고서에 따르면 국가 의료 보험 협상은 혁신의 정책 방향을 지속적으로 지원하고 새로운 품종, 확장된 적응증 및 병원 지불 패키지를 포함하여 2027년 상업적 성장을 공동으로 촉진할 것이라고 밝혔습니다. 2026년 11월 14일에 발표된 새 카탈로그 버전에는 카테고리 1 혁신 51개를 포함하여 107개의 신약이 추가되었습니다. 의약품의 수가 사상 최고치를 경신했고, 처음으로 기본의료보험에 CAR-T가 포함됐다. 이러한 조정은 사전 신고 및 상업 보험에서 기본 의료 보험으로의 전환을 개선하고, 장기 갱신 규칙을 더욱 명확하게 하며, 병원에 의약품 도입 및 \"이중 채널\" 공급을 촉진합니다."},{"s":"상위 8개 생명공학주, 첫 3분기에 엄청난 이익 기록 - 파이낸셜 뉴스 - 산업 및 상업 타임스","so":"中時新聞網","tm":"11/16 05:10","c":2,"r":"tw","u":"https://www.chinatimes.com/newspapers/20261116000239-260202","p":1794773400,"a":1794784830,"t":"生技股8強前三季獲利噴發- 財經要聞- 工商時報","su":"생명공학 주식은 첫 3분기 동안 엄청난 수익을 냈으며 총 8개 회사가 1주 이상의 자본을 보유했습니다. 그러나 주당순이익(주식 한 주가 번 돈) 순위는 대대적인 개편을 겪었다. 징숴(Jingshuo)가 20.09대만달러로 1위를 차지했고, 야오화제약(Yaohua Pharmaceutical)이 18.43대만달러, 타이보(Taibo)가 18.06대만달러로 뒤를 이었다. BenQ Medical은 16.65대만달러로 처음으로 1위 그룹에 진입했습니다. Bao Rui는 톱 10에 진입했고 Lamex는 예상치 못하게 하락했습니다."},{"s":"BenQ Medical, 생명공학 부문 1분기 이익 제왕을 차지, 3분기 세후 주당순이익이 15.05위안으로 급증","so":"中時新聞網","tm":"11/16 05:10","c":2,"r":"tw","u":"https://www.chinatimes.com/newspapers/20261116000242-260202","p":1794773400,"a":1794784834,"t":"明基醫 奪生技單季獲利王寶座 Q3每股稅後純益飆至15.05元","su":"3분기 생명공학주 이익순위가 개편됐다. BenQ Medical은 자산 매각 및 비산업 이익 인식으로 이익을 얻었으며, 단일 분기 세후 주당순이익(주식 한 주가 번 돈)이 15.05위안으로 치솟았습니다. 뜻밖의 징숴(Jingshuo)와 야오화제약(Yaohua Pharmaceutical)을 물리치고 다크호스로서 1분기 실적(회사가 번 돈 성적표) 왕좌를 차지했다. Baorui 및 Lai Fung-KY 운영은 사탕수수를 먹고 있으며 단일 분기의 주당 수익이 상위 10위 안에 들었습니다."},{"s":"상용보험 혁신신약부터 국가협상의약품까지, 밀리언급 CAR-T가 최초로 기본의료보험에 진입","so":"第一财经","tm":"11/14 15:06","c":2,"r":"cn","u":"https://www.yicai.com/news/103440735.html","p":1794636362,"a":1794642666,"t":"从商保创新药变为国谈药，百万级CAR-T首次进入基本医保","su":"\"National Talk\" 듀얼 카탈로그의 새 버전이 오늘 공식적으로 출시되었습니다. 국내 혁신신약(세상에 처음 나온 새로운 약) 2종은 상용보험 혁신의약품 목록에 선정된 지 1년 만에 국가기본의료보험 목록에 성공적으로 편입됐다. '초고가 항암제'로 알려진 CAR-T 제품이 기본의료보험에 들어간 것도 이번이 처음이다. 14일, 쑤저우에서는 2026년 국민의료보험 약품 목록과 상업건강보험 혁신 약품 목록이 발표됐다. 국민의료보험 의약품목록 새 버전에는 1급 신약 51종을 포함해 107종의 신약이 추가돼 최고 기록을 경신했다. 상업 건강 보험 혁신 의약품 카탈로그에는 12개의 신약이 있습니다. 조정 후 2026년 상업 건강보험 혁신의약품 카탈로그에는 총 28종의 품목이 포함될 예정이다."},{"s":"엘리 릴리(일라이릴리): 종양학 분야의 혁신적 약물 3개에 대한 새로운 적응증이 국가 의료보험 카탈로그에 포함되었습니다.","so":"Jiemian.com","tm":"11/14 12:56","c":2,"r":"cn","u":"https://www.jiemian.com/article/15333120.html","p":1794628575,"a":1794628688,"t":"礼来：三款肿瘤领域创新药物新增适应症纳入国家医保目录","su":"11월 14일, 일라이릴리는 Jepali®(피투브루티닙 정제), Tyvyt®(신틸리맙 주사제) 및 Aiute®(프루퀸티닙 캡슐)를 포함하여 종양학 분야의 세 가지 혁신 약물의 새로운 적응증이 국민 기본 의료 보험, 산재 보험 및 산모 보험 의약품 카탈로그(2026) 새 버전에 성공적으로 포함되었다고 발표했습니다. 국민의료보험목록 새 버전이 2027년 1월 1일 정식 시행됩니다."},{"s":"정책배당에 따라 혁신신약의 상용화도 가속화될 것으로 예상된다. 어떤 혁신신약 ETF가 더 나은가요? 저가형 홍콩 혁신 의약품 ETF Invesco(513780)는 시장 내 금은 10만 위안 미만으로 줄어들 것으로 예상된다. 접근성 가속화부터 \"이중 카탈로그\" 전환까지 의료 보험 부서는 혁신적인 약물의 접근성을 촉진하기 위해 다양한 조치를 취하고 있습니다."},{"s":"유한양행 '렉라자', FDA 라벨링 보충 허가 획득…블록버스터 입지 공고화 | 더구루","so":"뷰타임즈","tm":"11/17 08:39","c":1,"r":"kr","u":"https://view.mk.co.kr/car-tech/article/296593/","p":1794872377,"a":1794885755},{"s":"로슈, 먹는 유방암 치료제 美 FDA 승인…블록버스터 신약 기대감↑｜Global Money Club","so":"중앙일보","tm":"11/17 07:54","c":1,"r":"kr","u":"https://www.joongang.co.kr/gmc/article/25479282","p":1794869677,"a":1794874067,"su":"스위스 제약사 로슈가 개발한 경구용 유방암 치료제가 미국 규제당국의 승인을 받았습니다. 미국 식품의약국(FDA)은 16일(현지시간) 로슈의 ..."},{"s":"Yuandong Biotechnology: 대상포진후 신경통 적응증에 대한 EP-0226 정제의 2상/3상 임상 시험에서 첫 번째 대상자가 투여되었습니다.","so":"Jiemian.com","tm":"11/16 22:15","c":1,"r":"cn","u":"https://www.jiemian.com/article/15338582.html","p":1794834922,"a":1794838048,"t":"苑东生物：EP-0226片带状疱疹后神经痛适应症II/III期临床试验完成首例受试者给药","su":"Yuandong Bio는 Shanghai Institute of Materia Medica, 중국과학원, Zhongshan Institute of Drug Innovation이 공동 개발한 1급 화학 혁신 약물인 EP-0226 정제가 현재 중국 대상포진 후 신경통 환자를 대상으로 다기관, 무작위 배정, 이중 맹검, 이중 더미, 위약 및 프레가발린 캡슐 대조 2/3상 임상 시험을 진행하고 있다고 밝혔습니다. 최근 첫 번째 주제가 관리되었습니다."},{"s":"영국 제약회사, 미국 내 에스트로겐 패치 공급 확대 논의 중","so":"Bloomberg.com","tm":"11/16 21:45","c":1,"r":"us","u":"https://www.bloomberg.com/news/articles/2026-11-16/uk-drugmaker-in-talks-to-boost-estrogen-patch-supply-in-us","p":1794833100,"a":1794834714,"t":"UK Drugmaker in Talks to Boost Estrogen Patch Supply in US"},{"s":"선두 혁신의약품은 22% 급락했다. 집중적으로 투자한 펀드의 '트라우마'는 얼마나 깊을까?","so":"21财经","tm":"11/16 20:44","c":1,"r":"cn","u":"https://www.21jingji.com/article/20261116/herald/c3d9441060a75d7b5315fbd9fe05c6a2.html","p":1794829440,"a":1794830397,"t":"创新药龙头大跌22%，重仓基金“创伤”多深？","su":"차이롄서, 11월 16일 (천용휘 기자) 지난 11월 16일, 미국 FDA의 회신서한으로 홍콩 제약업계가 소용돌이에 휘말렸다. 아케소(09926.HK)는 이날 약 32% 하락하여 개장하여 2025년 2월 이후 최저치인 HK$56.1에 도달했습니다. 22% 하락했으며 시가총액(회사 전체 몸값)은 HK$603억으로 줄었습니다. 같은 기간 항셍생명공학지수는 2.21% 하락했다. 방아쇠는 지난 주말에 왔습니다. Kangfang의 해외 파트너인 Summit은 백금 함유 화학요법과 결합된 evocilimab(AK112, PD-1/VEGF 이중 항체)의 시판 신청에 대한 미국 FDA로부터 완전한 응답 편지(CRL)를 받았다고 11월 15일 발표했습니다. 해당 신청은 승인되지 않았으며, 타깃 적응증은 EGFR-TKI 치료 이후 진행된 비편평 비소세포폐암이다."},{"s":"마지막으로, 암 백신","so":"The New York Times","tm":"11/16 20:00","c":1,"r":"us","u":"https://www.nytimes.com/2026/11/16/podcasts/the-daily/vaccine-cancer-melanoma.html","p":1794826808,"a":1794868968,"t":"Finally, a Vaccine for Cancer","su":"흑색종의 재발을 예방하는 실험적 백신이 발견되었습니다. 과학자들은 이것이 마지막이 아니기를 바라고 있습니다."},{"s":"혁신신약의 '중국 속도': 승인부터 의료보험 포함까지 1년 미만","so":"中国新闻网","tm":"11/16 18:41","c":1,"r":"cn","u":"https://www.chinanews.com.cn/cj/2026/11-16/10732912.shtml","p":1794822071,"a":1794830400,"t":"创新药的“中国速度”：从获批到纳入医保不到一年","su":"혁신신약(세상에 처음 나온 새로운 약) '차이나 스피드' 허가부터 의료보험 편입까지 1년 이내 혁신신약 '중국 스피드' 허가부터 의료보험 편입까지 1년 이내 환자들이 '건선' 퇴치를 돕는 국산의약품 기자 | 진제 \"제가 건선 환자인 걸 깜빡할 뻔했어요. 이제 몸에 피부병변도 없어요.\" 11월 13일, 왕루광은 '매일경제뉴스' 기자(이하 '미징기자')에게 담담하게 말했다. 마치 다른 사람의 이야기를 하는 것 같았습니다. 오직 그만이 이 문장의 무게를 알고 있었습니다. 왕루광 씨는 30년 넘게 건선을 앓고 있으며 현재 건선 환자 커뮤니티를 운영하고 있다. 건선은 치료할 수 없습니다. 중국에는 그와 같은 건선 환자가 845만명에 이른다. 11월 14일, 국내 최초로 생산된 IL-23p19 단클론 항체가 2026년 신규 의료보험 카탈로그에 포함되었습니다. 승인부터 의료보험 가입까지 1년도 채 걸리지 않았습니다."},{"s":"강팡의 스타 혁신신약 미국 출시를 거부한 두 가지 주요 논란","so":"Jiemian.com","tm":"11/16 16:48","c":1,"r":"cn","u":"https://www.jiemian.com/article/15337164.html","p":1794815294,"a":1794830401,"t":"康方明星创新药美国上市被拒背后的两大争议","su":"Kangfang Biotech는 Interface News에 응답했지만 Ivosi의 거부가 글로벌 개발 속도에 영향을 미치지 않을 것이라고 말했습니다. 그러나 그 이면에는 강팡바이오텍과 해외 파트너들의 연구 계획과 자본 운용 등 다양한 행태가 논란으로 가득 차 있다."},{"s":"국내 혁신신약이 학장실업에 타격을 줄 때(1)","so":"财新","tm":"11/16 15:56","c":1,"r":"cn","u":"https://opinion.caixin.com/2026-11-16/102505289.html","p":1794812160,"a":1794830402,"t":"当国产创新药撞上院长们的经营底线（一）","su":"올해 45번째 거래주(20261102~20261108), 침체된 시장은 마침내 좋은 소식을 기다렸다. 정책적 지지와 '포도'가 확산되면서 A주가 조심스럽게 반응했지만 홍콩 증시는 활발해지며 개화기에 들어섰다. 홍콩의 의료 주식은 마침내 의약품의 소폭 상승을 얻었습니다. Gushengtang을 제외하고 다른 주력 의료 주식은 물량과 가격이 상승하는 상태에서 나타났습니다. 이번주 헬스케어 종목 하이라이트는 하이게이아(Hygeia)이다. '환매 불가 전제' 하에 거의 잊혀진 이 의료 재고의 거래량은 월요일 1,165만 홍콩 달러에서 금요일 5,385만 홍콩 달러로 단숨에 증가할 수 있습니다. 거래량이 증가했으며 그래픽에도 위 ua Jinma 한도가 감소했습니다. 혁신적인 의약품 분야가 변동하고 약해지면서 Tonghua Jinma의 한계가 낮아졌습니다. Northland는 10% 이상 하락했으며 Sansheng Guojian, Junshi Bio-U, Rongchang Biological, Laimei Pharmaceutical, Guilin Sanjin 등이 그 뒤를 이었습니다."},{"s":"Haisike: 1종 신약 크리가발린 베실레이트 캡슐과 콜라글립틴 정제가 국가 의료 보험 목록에 포함되었습니다.","so":"第一财经","tm":"11/16 11:10","c":1,"r":"cn","u":"https://www.yicai.com/news/103442074.html","p":1794795004,"a":1794830404,"t":"海思科：1类新药苯磺酸克利加巴林胶囊和考格列汀片被纳入国家医保目录","su":"제일재경 2026-11-16 16:07:52 편집자: Yin Qingyan HiSco는 회사의 1급 신약인 크리가발린 베실레이트 캡슐과 콜라글립틴 정제가 \"국가 의료 보험 목록(2026년 판)\"에 포함되었다고 발표했습니다. 크리가발린 베실레이트 캡슐은 성인의 당뇨병성 말초 신경병성 통증 및 대상포진 후 신경통의 치료에 적합합니다. 콜라글립틴 정제는 제2형 당뇨병이 있는 성인의 혈당 조절을 개선하는 데 적합합니다. 한 가지 평가: 의료 보험 카탈로그는 2026년에 조정 및 출시되어 혁신적인 약물 쪽으로 더욱 기울어질 것입니다. 2025년판 상업보험 혁신의약품 카탈로그의 18개 의약품 중 2개가 기본의료보험 카탈로그에 진입해 '상업보험을 통한 혁신의약품 최초 발굴 및 기본의료보험 연계'라는 변혁의 길을 실현하는 데 앞장섰다. 51종의 1급 신약이 국가의료보험 의약품 목록 새 버전에 등재되면서 새로운 최고 기록을 경신했습니다. 의료보험과 상업보험의 '이중 카탈로그' 업데이트 후 6개월 이내에 관련 카테고리 1 신약의 임상약물 가이드라인을 업데이트하도록 권장합니다. 희귀질환 신약의 시장공급이 중단될 경우 국가식품약품감독관리국은 해당 의약품의 시장독점기간을 종료할 수 있다."},{"s":"미 FDA, 중국산 유망 폐암 치료제 '이보네시맙' 승인 거부","so":"매일경제 마켓","tm":"11/16 10:28","c":1,"r":"kr","u":"https://stock.mk.co.kr/news/view/1199355","p":1794792529,"a":1794794327,"su":"미 FDA, 중국산 유망 폐암 치료제 '이보네시맙' 승인 거부 \"환자 수명 연장에 유의미한 효과 없어\" 주종국 입력 : 2026.11.16 10:28:49 I 수정 : 2026.11.16 10:40:38 (서울=연합뉴스) 주종국 기자 = 미국 식품의약국(FDA)이 중국산 유망 폐암 치료제 '이보네시맙(ivonescimab)'의 승인을 거부했다. 15일(현지시간) 뉴욕타임스(NYT)에 따르면 이 신약의 미국 내 판권을 보유한 미국 제약기업 서밋 테라퓨틱스는 FDA가 이보네시맙에 대해 보완요구서한(CRL)을 발행하며 승인을 거부했다고 발표했다."},{"s":"한 가지 평가: 의료 보험 카탈로그는 2026년에 조정 및 출시되어 혁신적인 약물 쪽으로 더욱 기울어질 것입니다.","so":"第一财经","tm":"11/16 10:28","c":1,"r":"cn","u":"https://www.yicai.com/news/103441253.html","p":1794792517,"a":1794792903,"t":"壹评级：2026年医保目录调整发布，进一步向创新药倾斜","su":"국민의료보험청이 2026년 의료보험목록 조정 결과를 발표했는데, 1급 혁신신약(세상에 처음 나온 새로운 약) 51개 품목이 사상 최대치를 기록했다. China Business Network의 \"One Rating\"은 정책 방향이 단순히 연구 개발 장려에서 상업화 지원으로 바뀌었고 임상 가치가 있는 혁신적인 약물이 결정론적인 성장 주기를 가져올 것이라고 믿습니다."},{"s":"그의 신장약은 주요 질병 지표를 43% 줄인 후 FDA 승인을 받았습니다. 한 번에 $74,730를 주입하면 원래 메디케어에 따라 약 $15,000의 빚을 지게 될 수 있습니다.","so":"Yahoo Finance","tm":"11/16 10:04","c":1,"r":"us","u":"https://finance.yahoo.com/healthcare/articles/kidney-drug-just-won-fda-010413089.html","p":1794791040,"a":1794868968,"t":"His Kidney Drug Just Won FDA Approval After Cutting a Key Disease Marker by 43%. One $74,730 Infusion Could Leave Him Owing Nearly $15,000 Under Original Medicare","su":"FDA가 승인한 새로운 신장 약물은 유망한 결과를 보여주지만, 예비 보장이 없는 Original Medicare의 퇴직자는 수개월 간의 사회 보장에 필적할 수 있는 청구서에 직면하게 됩니다. 하나의 등록 마감일과 하나의 인수 규칙이 그가 실제로 빚진 금액을 결정합니다."},{"s":"9년 동안 14개의 카테고리 1 혁신 약물이 등장했습니다. 광둥성 이 지역은 무엇을 제대로 했나요? | 광둥성의 경제 생태를 해독하다","so":"21财经","tm":"11/16 08:43","c":1,"r":"cn","u":"https://www.21jingji.com/article/20261116/herald/13d02f47a0f5495600207da8c686e65e.html","p":1794786187,"a":1794789721,"t":"九年跑出14个1类创新药，广东这个区做对了什么？| 解码广东经济生态","su":"최근 국가식품의약국은 광저우웨캉바이오제약유한회사에 '약품등록증'을 발급했고, 1급 혁신적 중의약인 자화문비지추과립이 공식적으로 판매 승인을 받았다. 이 신약은 광둥성 중의학병원 루추안젠 교수의 장기간 임상적으로 입증된 경험적 공식을 바탕으로 개발됐다. 6가지 약재로 구성되어 있으며 3~6주간 지속되는 감염후 기침, 풍한폐애증후군에 사용된다. 신약이 임상처방에서 현대중의학으로 발전하기 위해서는 약리연구, 임상시험, 등록심사, 생산검증 등의 과정을 거쳐야 한다. 광저우 황푸구의 경우, 이 등록증은 또 다른 무게감을 갖고 있습니다. 이는 올해 황푸가 승인한 두 번째 카테고리 1 혁신 약물이다. 2018년부터 황푸는 총 14개의 카테고리 1 혁신 의약품에 대해 승인을 받았으며 이는 광저우시 전체의 93.3%, 광둥성 전체의 43.8%를 차지한다. 6년 연속 카테고리 1 혁신 의약품을 시장에 출시했습니다."},{"s":"중국 혁신의약품의 구조적 장점이 드러난다. 2027년에는 '데이비스 더블클릭'이 일어날까?","so":"财联社","tm":"11/16 08:21","c":1,"r":"cn","u":"https://www.cls.cn/detail/2535143","p":1794784860,"a":1794806423,"t":"中国创新药结构性优势显现 2027年能否迎来“戴维斯双击”？","su":"① 2026년 상하이 증권거래소 국제 투자자 회의에서 Zhu Yi는 중국 혁신 의약품의 경쟁 우위가 단일 제품 및 플랫폼에서 R&D 시스템으로 확장되고 구조적 우위가 전 세계의 관심을 끌고 있다고 믿었습니다. ② 중국 국내 접근 정책이 개선되고 해외 가치가 실현됐다. 2027년에 \"Davis Double Click\"이 도입될지는 아직 테스트가 필요합니다. ③AI는 분자 생성을 가속화하며, 습식 실험 검증과 과학자 의사 결정은 여전히 R&D 성공률을 높이는 열쇠입니다. 차이롄서는 11월 16일(루아펑 기자) \"우리는 플랫폼 BD를 하는 것이 아니라 구조적 BD를 하면서 중국의 구조적 장점을 매수하고 있다\"고 보도했다. 2026년 상하이 증권거래소 국제 투자자 컨퍼런스에서 \"다음부터 정의까지: 중국 제약회사가 글로벌 혁신 리더가 되고 있습니까?\" 원탁 포럼에서 Bailey Tianheng(688506.SH)의 설립자이자 회장인 Zhu Yi는 지난 6개월 동안 중국 혁신 제약 산업의 변화를 요약했습니다."},{"s":"기술주 평가를 개정하고 자금을 생명공학 분야로 편입했다. 관련지수는 지난달 7.1% 가까이 상승했다.","so":"UDN","tm":"11/16 04:39","c":1,"r":"tw","u":"https://udn.com/news/story/123006/9880478","p":1794771560,"a":1794784837,"t":"科技股評價修正資金轉進生技 相關指數近一月上漲近7.1%","su":"최근 시중자금의 순환이 빠르게 진행되고 있습니다. 기존 강세를 보인 기술주에 대한 평가를 수정하고, 합리적인 평가와 탄탄한 펀더멘털을 갖춘 바이오·의료주에 일부 자금을 편입했다. 가장 대표적인 NBI 생명공학지수를 보면 지난 한 달간 7.1% 가까이 상승했다. 기술주를 대표하는 나스닥 지수와 비교하면 최근 몇 달간 6.7% 하락했다. 더욱 돋보입니다. 지난 한 달 동안 미국 S&P500(미국 큰 회사 500곳 지수)의 다양한 주식들의 성과를 살펴보면, 헬스케어 주식들도 가장 좋은 성과를 냈습니다. 투자자들은 생명공학 ETF(여러 주식을 묶어 파는 상품)를 통해 시장을 확인하고 싶을 수도 있습니다."},{"s":"Jingshuo 및 Yaohua Pharmaceutical과 같은 생명공학 주식은 첫 3분기 동안 폭발적인 이익을 경험했습니다. 주당순이익 순위가 대대적으로 개편되고 있습니다. 법인들은 2027년 성장 모멘텀이 새로운 최고치에 도달할 것으로 예상합니다.","so":"工商時報","tm":"11/16 04:00","c":1,"r":"tw","u":"https://www.ctee.com.tw/news/20261116700124-439901","p":1794769200,"a":1794806426,"t":"晶碩、藥華藥等生技股前三季獲利噴發EPS排行大洗牌法人看2027成長動能再創高- 日報","su":"첫 3분기 동안 생명공학 주식의 주당 수익입니다. 상위 10개 생명공학 주식은 첫 3분기 동안 엄청난 이익을 냈습니다. 총 8개 회사가 1주 이상의 자본금을 창출했습니다. 다만, 세후주당순이익(주식 한 주가 번 돈)주) 순위는 대대적인 개편을 겪었다. 징숴(Jingshuo)가 20.09위안으로 1위를 차지했고, 야오화제약(Yaohua Pharmaceutical)이 18.43위안, 타이보(Taibo)가 18.06위안으로 뒤를 이었다. BenQ Medical은 16.65위안으로 처음으로 상위권에 진입했습니다. Baorui는 상위 10위에 진입했고 Lamex는 예상치 못하게 30위로 떨어졌습니다. 전체적으로 의료소재, 의약품, 미용·건강제품 3대군으로 구성되어 있습니다."},{"s":"의료보험이 적용되는 혁신적인 의약품을 최대한 빨리 사용하는 방법은 무엇입니까? 다학과 협업으로 '입학의 어려움' 해결","so":"央视网","tm":"11/16 02:06","c":1,"r":"cn","u":"https://news.cctv.com/2026/11/16/ARTIgQCII4pqN5iNGHDqvJyN261115.shtml","p":1794762390,"a":1794784826,"t":"进了医保的创新药如何尽快用上？多部门联动破解“入院难”","su":"최근 국민의료보험청은 기본 보장과 수익성 보호를 바탕으로 혁신의약품에 대한 보호를 지속적으로 강화해 왔으며, 임상적 이점이 명확한 혁신의약품을 포함하고 치료 공백을 보험 범위에 채워 일반 국민이 새롭고 좋은 의약품을 사용할 수 있도록 하는 데 중점을 두고 있다. 현재 의료보험으로 인해 협상된 약품 판매액이 매년 170억 위안을 초과하고 있으며 이는 5년 전의 4배입니다. '14차 5개년 계획' 기간 의료보험 기금 누적 지출은 13조 위안에 달했다."},{"s":"\"지능형 혁신 약물이 건강에 힘을 실어줍니다\" 2026년 혁신 약물 고품질 개발 회의가 장쑤성 쑤저우에서 개최되었습니다.","so":"央视网","tm":"11/15 15:14","c":1,"r":"cn","u":"https://local.cctv.com/2026/11/15/ARTIJUUOS3gCb1NM4LmCttey261115.shtml","p":1794723251,"a":1794727069,"t":"“智创新药 赋能健康” 2026年创新药高质量发展大会在江苏苏州举行","su":"\"지능형 혁신 약물이 건강에 힘을 실어줍니다\" 2026년 혁신 약물 고품질 개발 컨퍼런스가 장쑤성 쑤저우에서 개최되었습니다."},{"s":"수백만 달러의 가격을 돌파한 후, 카탈로그로 이전된 첫 번째 혁신 의약품의 판매량이 폭발적으로 증가할 수 있을까요?","so":"第一财经","tm":"11/15 10:27","c":1,"r":"cn","u":"https://www.yicai.com/news/103440856.html","p":1794706024,"a":1794751323,"t":"击穿百万价格后，首批转目录的创新药销量能大爆发吗？","su":"\"혁신적인 약물이 곧 등장할 예정이며, 내년에는 이 CAR-T의 매출(물건을 판 돈 전체)이 급증할 것입니다!\" 한 선임 의료인은 오늘 CAR-T 세포치료제 레기올란자가 기본의료보험에 포함됐다는 소식을 듣고 흥분을 감추지 못했다. 우시준누오의 루이구이오렌제주가 녹시나신나트륨에 이어 의료보험 협상을 통해 '순환을 깨는' 또 하나의 스타 고부가가치 의약품으로 자리 잡았다. 이 사람은 100만 달러에 달하는 CAR-T 의약품의 '고가' 장벽이 허물어지면서, 혁신의약품이 지불한도를 깨기 위한 새로운 상상의 공간을 열고 있다고 직설적으로 말했다. 올해 의료보험 카탈로그 조정으로 처음으로 '이중 카탈로그' 연결 메커니즘이 구축되어 상업 보험 상품에 기본 의료 보험을 신청할 수 있게 되었습니다. 국민의료보험청은 고부가가치 혁신신약(세상에 처음 나온 새로운 약)이 출시 초기 단계에서 상용보험 목록에 진입하고 임상 활용을 통해 데이터를 축적해 비용을 절감한 뒤 기본의료보험으로 전환하도록 장려하고 있다."},{"s":"2026년 11월 주목해야 할 영국 생명공학 주식 상위 3개","so":"Yahoo Finance","tm":"11/15 08:09","c":1,"r":"us","u":"https://finance.yahoo.com/healthcare/articles/top-3-british-biotech-stocks-230940445.html","p":1794697780,"a":1794702385,"t":"Top 3 British Biotech Stocks To Watch In November 2026","su":"미국의 도매 인플레이션(물건값이 계속 오르는 것) 상승과 추가 금리(돈을 빌릴 때 내는 이자 비율) 인상 기대로 인해 글로벌 투자자들이 불안해하고 있습니다. 그러나 이런 종류의 압력은 종종 금리가 아닌 돌파구가 결과를 주도하는 부문으로 돈을 밀어 넣습니다. 영국의 생명공학 주식은 바로 그 진영에 속해 있습니다. 이 기사에서는 영국 생명공학 기업을 필터링하는 집중 선별기의 세 가지 후보자를 볼 수 있습니다."},{"s":"신약 출시 경쟁 속에서 강소성의 '좋은 처방'은 무엇일까?","so":"人民网－江苏频道","tm":"11/15 07:57","c":1,"r":"cn","u":"http://js.people.com.cn/n2/2026/1115/c360301-41751166.html","p":1794697020,"a":1794713936,"t":"新药竞发，江苏有何“良方”？","su":"11월 14일, 장쑤성 쑤저우에서 2026년 혁신의약품 고품질 개발 컨퍼런스가 개최되었습니다. 이날 회의에서는 2026년판 국민의료보험 의약품 카탈로그가 공개됐다. 107개 신약 중 51개가 카테고리 1 혁신의약품으로 혁신의약품에 대한 명확한 지원 신호를 보냈다. 이번 컨퍼런스는 장쑤성에서 개최되었으며 장쑤성의 바이오제약 산업과 밀접한 관련이 있습니다."},{"s":"Vita Life Sciences 및 기타 2개의 호주 생명공학 주식 소유","so":"Yahoo Finance","tm":"11/15 01:08","c":1,"r":"us","u":"https://finance.yahoo.com/healthcare/articles/vita-life-sciences-2-other-160842530.html","p":1794672522,"a":1794698059,"t":"Vita Life Sciences And 2 Other Australian Biotech Stocks To Own","su":"미국에서는 10월 소비자물가지수와 생산자물가(공장에서 파는 물건값 수준)가 모두 중앙은행 목표치를 상회하는 등 인플레이션(물건값이 계속 오르는 것)이 과열되고 있으며, 주요 중앙은행들은 금리를 더 오랫동안 유지할 준비가 되어 있다는 신호를 보내고 있습니다. 그런 배경에서는 무거운 자산보다는 연구, 지적재산권, 과학에서 가치가 나오는 기업이 상대적으로 더 나은 입장일 수 있습니다."},{"s":"세계 주요 라이센스 프로젝트의 절반이 중국에서 나옵니다. 혁신신약 황금시대의 혁신과 투자 논리는 무엇일까?","so":"财联社电报","tm":"11/15 00:54","c":1,"r":"cn","u":"https://m.cls.cn/detail/2534664","p":1794671640,"a":1794746294,"t":"全球半数重磅license-in项目来自中国 创新药“黄金时代”的创新与投资逻辑是什么？","su":"AP통신은 11월 15일(유미아오 기자) \"우리는 바이오의약품 산업의 황금시대에 있다\"며 \"혁신적 신약에 대한 투자 기회가 많다\"고 보도했다. 2026 진지호 생명건강 투자 컨퍼런스에서 컨퍼런스에 참석한 많은 귀빈들은 중국의 바이오의약품 산업이 큰 진전을 이루었지만 여전히 중국 제약회사와 세계 선두 기업 사이에는 격차가 있다고 말했다. 산업 발전이 본격화되고, 중국 파이프라인이 글로벌 바이어들의 '보통 옵션'이 된다면 2.0 시대의 혁신은 무엇일까? 선도적인 글로벌 기업의 발전을 따라잡는 방법은 무엇입니까? 자본은 어떻게 선택되고 가격이 책정될 것인가? 혁신 격차를 해소하는 방법 글로벌 구매자가 중요하게 생각하는 것은 무엇입니까? 바이오의약 황금시대에 중국 제약회사의 발전은 누구에게나 명백하지만, 세계 선두 기업과의 격차는 여전히 존재한다. Innovent Biologics(01801.HK)의 창립자이자 회장 겸 CEO인 Yu Dechao는 이러한 격차를 좁히려면 FIC(First in class)와 BIC(Best in class)가 혁신에 필요한 옵션이지만 기업이 FIC만 하는 것만으로는 충분하지 않으며 FIC를 기반으로 BIC를 추구해야 한다고 믿습니다."},{"s":"중국 혁신 의약품의 '쑤저우 모멘트' 개막: JHC 진지호 생명건강 투자 컨퍼런스가 성공적으로 개최되었습니다.","so":"央视网","tm":"11/14 23:09","c":1,"r":"cn","u":"https://local.cctv.com/2026/11/14/ARTIF0JYprRz9gfgmZyNiJZk261114.shtml","p":1794665394,"a":1794698061,"t":"开启中国创新药的“苏州时刻”：JHC金鸡湖生命健康投资大会顺利举行","su":"이 회의에서는 최첨단 과학 세력, 선도적인 투자 자본 및 주요 산업 신호를 모아 자본의 물로 혁신의 원천에 물을 공급하고 생명 및 건강 산업을 위한 매우 중요한 \"연간 자본 좌표\"를 설정합니다."},{"s":"의료보험목록에 의약품 107종 신규 포함, 혁신의약품 지급한도 개방","so":"第一财经","tm":"11/14 17:38","c":1,"r":"cn","u":"https://www.yicai.com/news/103440767.html","p":1794645535,"a":1794659855,"t":"107种药品新纳入医保目录，创新药支付天花板打开","su":"2025년판 상업보험 혁신의약품 카탈로그의 18개 의약품 중 2개가 기본의료보험 카탈로그에 편입돼 '상업보험을 통한 혁신의약품 최초 발굴 및 기본의료보험 연계'라는 변혁의 길을 실현하는 데 앞장서고 있다."},{"s":"pMN 적응증에 대한 최초의 혁신 약물이 의료 보험에 포함됩니다. 전문가들이 베이젝신 이중 적응증 약물의 임상적 의의를 설명하다","so":"新华网上海","tm":"11/14 16:14","c":1,"r":"cn","u":"http://sh.news.cn/20261114/354598b1859f4f2982434c33fd1e51db/c.html","p":1794640448,"a":1794659857,"t":"首个pMN适应症创新药纳入医保 专家解读倍捷欣双适应症药物临床意义","su":"최초의 pMN 적응증 혁신신약(세상에 처음 나온 새로운 약)이 의료보험에 포함되었습니다. 전문가들은 이중 적응증 약물인 Betexin®의 임상적 중요성을 설명합니다. Tianguangshi Biological의 오리지널 CD20 단일클론 항체인 Betexin® 이중 적응증은 2026년 의료 보험 카탈로그에 포함되어 원발성 막성 신병증 및 시신경척수염 스펙트럼 질환을 포함하여 환자의 약물 접근성을 향상시킬 것입니다."},{"s":"수익 최대 11%의 생명공학 주식 3개","so":"Yahoo Finance","tm":"11/14 15:15","c":1,"r":"us","u":"https://finance.yahoo.com/healthcare/articles/3-biotech-stocks-revenue-11-061542278.html","p":1794636900,"a":1794642663,"t":"3 Biotech Stocks With Revenue Up To 11%","su":"AI 인프라와 관련된 복잡한 부채가 급증하면서 AI 관련 위험이 연준(FRB)의 금융 안정성 우려 중 최고 수준으로 올라섰습니다. 이러한 종류의 호황과 정밀한 조사는 투자자들이 다른 최첨단 분야를 보도록 유도할 수 있습니다. 탄탄한 대차대조표를 갖춘 신중하게 선택된 생명공학 주식은 잠재적인 높은 상승 여력의 다른 원천을 제공할 수 있습니다. 이 기사에서는 이러한 세 가지 생명공학 oppo에 대해 설명합니다."},{"s":"전문가들, 혁신적인 ALS 약물이 상업 보험의 새 창을 열다: 유전자 검사는 가족력에만 초점을 맞춰서는 안 됩니다","so":"ThePaper.cn","tm":"11/14 15:12","c":1,"r":"cn","u":"https://www.thepaper.cn/newsDetail_forward_34475772","p":1794636762,"a":1794642664,"t":"渐冻症创新药迎来商保新窗口，专家：基因检测不应只盯家族史","su":"11월 14일, 2026년 전국 상업 보험 혁신 의약품 카탈로그가 공식적으로 발표되었습니다. 이번 국가 \"이중 카탈로그\" 조정은 혁신 수준이 높고, 임상 가치가 높으며, 환자 혜택이 상당한 품종에 초점을 맞추고 있으며, 보다 다양한 보호 방법을 통해 혜택을 받을 수 있는 혁신적인 약물을 홍보하는 것을 목표로 하고 있습니다."},{"s":"Jikeshu는 의료 보험에 들어갑니다 : 인플루엔자 A와 B에 맞서 싸우기 위해 한 번의 복용량으로 일반 가족에게 혜택을주는 혁신적인 약물","so":"中国新闻网","tm":"11/14 14:44","c":1,"r":"cn","u":"https://www.chinanews.com.cn/jk/2026/11-14/10731967.shtml","p":1794635077,"a":1794642667,"t":"济可舒进医保：一剂对抗甲流乙流，创新药惠及普通家庭","su":"Jikeshu는 의료 보험에 가입합니다. 인플루엔자 A와 B에 대해 한 번의 접종으로 혁신적인 약물이 일반 가족에게 도움이 됩니다. 국민의료보험청은 11월 14일 2026년 '국민기본의료보험, 출산보험, 산재보험 약품 목록'(이하 국민의료보험 목록)을 발표했다. Jichuan Pharmaceutical과 Zhengxiang Pharmaceutical의 전략적 협력인 국내 1급 항인플루엔자 혁신 약물인 Maseloseloxavir 정제(Jikeshu®)가 공식적으로 의료 보험에 포함되었습니다. 이 혁신적인 약물은 인플루엔자 치료에 새로운 선택을 제시하고, 일반 1794869004,"t":"北京│北汽極狐夥寧德時代建3萬座換電站- 兩岸","su":"베이징자동차가 소유한 신에너지 자동차 브랜드 지후(Jihu)가 'Ji+ Era' 전국 배터리 교체 계획을 13일 발표했다. 본토 배터리 거대 기업인 CATL과 공동으로 배터리 교환소 3만개와 공공 충전소 130만개를 건설할 예정이다. 현재 베이징자동차 Jihu는 NIO Energy, GAC Energy 등 100개 이상의 충전 서비스 제공업체와 협력하고 있습니다. 베이징은 앞서 2030년까지 신에너지 차량 240만 대를 유지하고, 충전 파일 65만 개를 건설하며, 전원 공급 신뢰도를 99.998%로 향상시킬 계획이었습니다."},{"s":"CATL, 승용차 배터리 교체 시장 선두주자로 성장","so":"electrive.com","tm":"11/17 01:00","c":1,"r":"us","u":"https://www.electrive.com/2026/11/16/catl-to-become-market-leader-in-passenger-car-battery-swapping/","p":1794844800,"a":1794869002,"t":"CATL to become market leader in passenger car battery swapping","su":"CATL은 내년에 중국 최대 승용차 배터리 교체 스테이션 운영업체가 될 수 있습니다. 회사는 올해까지 6,000개 스테이션을 운영할 계획이다."},{"s":"CATL은 2027년에 승용차 배터리 교환 네트워크를 중국 전역의 6,000개 충전소로 확장할 계획입니다.","so":"AutoTechInsight","tm":"11/16 23:39","c":1,"r":"world","u":"https://autotechinsight.spglobal.com/news/5291481/catl-plans-to-expand-passenger-car-battery-swap-network-to-6000-stations-across-china-in-2027","p":1794839952,"a":1794869007,"t":"CATL plans to expand passenger car battery-swap network to 6,000 stations across China in 2027","su":"CATL은 2025년 말 초코 스테이션을 1,020개로 늘려 7월 2,000개, 9월 29일까지 2,520개로 늘었다."},{"s":"CATL, Baidu, Unitree, 선전에서 열리는 APEC CEO 서밋에 참석","so":"Bloomberg.com","tm":"11/16 22:40","c":1,"r":"us","u":"https://www.bloomberg.com/news/articles/2026-11-16/catl-baidu-unitree-to-attend-apec-ceo-summit-in-shenzhen","p":1794836412,"a":1794838060,"t":"CATL, Baidu, Unitree to Attend APEC CEO Summit in Shenzhen"},{"s":"쓰촨성 신에너지 자동차 및 전력 배터리 산업 체인의 첫 3분기 매출이 5000억 위안을 초과했습니다.","so":"中国新闻网","tm":"11/16 22:11","c":1,"r":"cn","u":"https://www.chinanews.com.cn/cj/2026/11-16/10733078.shtml","p":1794834684,"a":1794838061,"t":"四川新能源汽车及动力电池产业链前三季度营收超5000亿元","su":"쓰촨성 신에너지 차량 및 전력 배터리 산업 체인의 첫 3분기 매출(물건을 판 돈 전체)이 5000억 위안을 초과했습니다. China News Service, 청두, 11월 16일(Wang Liwen) 쓰촨성 신에너지 차량 및 전력 배터리 산업 체인의 수급 도킹 활동에 대한 언론 브리핑이 16일 쓰촨성 경제정보기술부에서 열렸습니다. 쓰촨성 경제정보기술부 자동차 및 철도 운송 장비 부서 부국장 Li Yan은 회의에서 올해 상반기 쓰촨성 '15+N' 핵심 산업 체인 평가에서 신에너지 차량 및 전력 배터리 산업 체인의 종합 발전 지수가 119.3으로 1위를 차지했다고 소개했습니다. 상위 3개 분기에 성의 신에너지 차량 생산량은 310,000대로 전년 동기 대비 45% 증가했고, 동력 배터리 생산량은 약 260GWh로 전년 동기 대비 53% 증가했으며, 업계 체인 매출은 전년 동기 대비 28% 증가한 5000억 위안을 초과했습니다. 연간 업계 체인 수익은 6000억 위안을 초과할 것으로 예상됩니다."},{"s":"르노는 프랑스에서 사무직 최대 1000명을 해고하고 EV 생산 역할을 추가할 것이라고 소식통은 전했습니다.","so":"Reuters","tm":"11/16 20:43","c":1,"r":"us","u":"https://www.reuters.com/business/world-at-work/renault-cut-up-1000-white-collar-jobs-france-add-roles-ev-production-say-sources-2026-11-16/","p":1794829423,"a":1794830417,"t":"Renault to cut up to 1,000 white-collar jobs in France, add roles for EV production, say sources"},{"s":"허난 상무부 답변 21: BYD에서 CATL까지, 투자 유치 및 효율성 향상을 위한 세 가지 주요 조치","so":"21财经","tm":"11/16 20:41","c":1,"r":"cn","u":"https://www.21jingji.com/article/20261116/herald/4f81f2c967b1df5f6d333ab91a9de546.html","p":1794829260,"a":1794830422,"t":"河南商务厅答21：从比亚迪到宁德时代，三大举措招商提效","su":"21세기 비즈니스 헤럴드 기자 Zhou Hui가 베이징에서 보도합니다. 제14회 중국 중부 투자 무역 박람회가 11월 21일부터 23일까지 허난성 정저우시에서 개최됩니다. 11월 16일 국무원 신문판공실에서 열린 기자회견에서 장다싱(張大興) 허난성 상무부장은 21세기 비즈니스 헤럴드 기자들의 질문에 답하면서 투자 촉진과 산업 발전 촉진을 위한 허난성의 조치를 소개했다. 사진: 기자회견 현장 사진: Zhou Hui 장다싱(Zhang Daxing)에 따르면, 최근 몇 년 동안 허난성은 전국 통일 시장 건설을 심화하고 지방 투자 촉진 행위를 규제하는 것에 대한 당 중앙위원회와 국무원의 결정과 배치를 철저히 시행했으며, 지역 여건에 따라 투자 촉진을 위한 새로운 길과 새로운 모델을 모색했습니다."},{"s":"이춘(Yichun)에 있는 두 개의 주요 리튬 광산이 환경 영향 평가 승인을 받았습니다. Ganxiawo 리튬 광산이 11월에 생산을 재개할 것으로 예상됩니까? CATL은 아직 응답하지 않았습니다","so":"每日经济新闻","tm":"11/16 19:45","c":1,"r":"cn","u":"https://news.google.com/rss/articles/CBMiZkFVX3lxTE1NRUp5UlFRSjRhNXNHOERxZEIyM1hJZkdEaGxERG1QeGZKVzNoQ1N0VGpIbXRNWXU5M2ozMDlLb3RmN04wcmRWRzV4dEY4ZTc1QXpwaEl0NzAza0QtVGM0X0ExQWZ5QQ?oc=5","p":1794825900,"a":1794874103,"t":"宜春两大锂矿迎来环评获批，枧下窝锂矿有望11月复产？宁德时代暂未回应"},{"s":"중국, 최초로 19인승 배터리 구동 항공기 비행: 얼마나 멀리 비행할 수 있나요?","so":"Livemint","tm":"11/16 19:43","c":1,"r":"us","u":"https://www.livemint.com/technology/china-flies-19-seater-battery-powered-aircraft-for-first-time-how-far-can-it-trav ":"11/16 16:38","c":1,"r":"cn","u":"https://m.jiemian.com/article/15337188.html","p":1794814690,"a":1794830423,"t":"理想汽车：“动力电池召回”事项、“4000元赔偿”为不法分子冒用车企名义制作、传播的虚假通知","su":"11월 16일, @IDEAL 자동차 법무팀은 최근 일부 자동차 소유자가 자동차 회사의 이름으로 범죄자들이 작성하고 유포한 허위 리콜 통지를 받았다는 기사를 발표했습니다. 그들은 '파워 배터리 리콜'을 근거로 자동차 소유자가 '보상금 4,000위안'을 받을 수 있다고 주장하고 자동차 소유자에게 첨부된 웹사이트를 방문하거나 QR 코드를 스캔하여 소위 '온라인 고객 서비스'에 연락하여 정보를 등록하도록 안내합니다. 앞서 회사는 '에어백 리콜' 사기 문자 메시지와 '이상적인 i6 공동구매 리베이트' 관련 채용 정보에 대해 별도의 알림을 발송한 바 있다. 사실을 명확히 하고 자동차 소유자의 정당한 권익을 보호하기 위해 회사는 Li Auto라는 이름을 사용한 허위 통지에 대해 다시 한 번 엄숙히 선언합니다. 관련 통지에 언급된 Li Auto의 '파워 배터리 리콜'과 '4,000위안 보상'은 모두 허구입니다. 위 공지는 Li Auto의 공식 공지가 아닙니다. 첨부된 URL은 사기성 웹사이트입니다. 관련 QR 코드 및 소위 \"온라인 고객 서비스\"는 Li Auto의 공식 서비스 채널이 아닙니다."},{"s":"[2026 강소특구] 충북청주 강소특구 “개방형 혁신으로 반도체·이차전지·양자 리더로”","so":"동아일보","tm":"11/16 16:16","c":1,"r":"kr","u":"https://www.donga.com/news/It/article/all/20261116/135033078/1","p":1794813360,"a":1794830415,"su":"※2019년부터 강소특구는 지역 주도의 혁신성장을 지원하기 위해 탄생했습니다. 현재 지역 혁신 거점으로서 강소특구 내 기술 창업과 연구소기업 등이 지역 경제성장을 견인하는 유니콘 기업으로 성장하도록 성장단계별 맞춤형 기술사업화를 지원해 나가고 있습니다. IT동아는 과…"},{"s":"리튬값 4분기 들어 35% 넘게 하락…K배터리 수익성 변수로","so":"이투데이","tm":"11/16 15:58","c":1,"r":"kr","u":"https://www.etoday.co.kr/news/view/2648729","p":1794812280,"a":1794830415,"su":"4분기 리튬 가격 35% 하락셀 판가·양극재 재고 부담 확대▲호주 미네랄 리소스가 보유·운영 중인 서호주 워지나(Wodgina) 리튬 광산 (사진제공=포스코"},{"s":"‘이차전지 전주기’ 한눈에… 포항서 48개사 참가한 에너지 축제 성황리 종료","so":"이투데이","tm":"11/16 15:53","c":1,"r":"kr","u":"https://www.etoday.co.kr/news/view/2648792?trc=right_categori_news","p":1794811980,"a":1794812202,"su":"13일부터 사흘간 포항종합운동장 만인당서 개최…에코프로·포스코퓨처엠 등 참여휴머노이드(사람을 닮은 로봇) 로봇부터 배터리팩 분해까지…기술 교류와 시민 체험 두 마"},{"s":"목표는 3억 킬로와트이며, 주요 에너지 저장 정책이 구현되었습니다! 배터리 부문은 배터리 ETF 차이나 유니버셜(159796) 지수가 1% 이상 하락하는 등 약세를 보이고 변동성이 크다. 전 세계적으로 전력 부족 현상이 발생하고 있습니다. 에너지 저장 기회에 대해 어떻게 생각하시나요?","so":"Jiemian.com","tm":"11/16 15:41","c":1,"r":"cn","u":"https://www.jiemian.com/article/15336863.html","p":1794811312,"a":1794812205,"t":"目标3亿千瓦，储能重磅政策落地！电池板块弱势震荡，电池ETF汇添富(159796)指数跌超1%，全球缺电，储能机遇怎么看？","su":"11월 16일 A주 시장은 등락세를 보이며 약세(내리는 흐름)를 보였습니다. 기술 부문이 다시 큰 폭으로 하락했습니다. 상하이증권거래소 지수는 1% 이상 하락했다. 배터리 부문은 수중에서 변동했습니다. 배터리 ETF(여러 주식을 묶어 파는 상품) 차이나유니버설(159796)의 기초지수는 1% 이상 하락했다. 3일 연속으로 계속해서 약해지고 떨어질 수도 있습니다."},{"s":"KTR, 광양에 189억 투입…‘이차전지 소재 실증센터’ 구축","so":"중앙일보","tm":"11/16 15:35","c":1,"r":"kr","u":"https://www.joongang.co.kr/article/25479020","p":1794810900,"a":1794812202,"su":"한국화학융합시험연구원(KTR·원장 이승렬)이 11월 12일 광양시청에서 광양시와 이차전지 소재 실증 인프라 구축을 위한 업무협약을 체결했다. 이번 협약은 산업통상부의 ‘미래 이차전지 원료소재 실증 플랫폼 기반 구축 사업’을 추진하기 위해 마련됐다. KTR은 지난 5월 해당 사업의 주관기관으로 선정됐다. KTR은 2029년 말까지 약 189억원을 투입해 광양청사에 ‘미래 이차전지 소재 실증센터’를 구축할 계획이다. 실증센터는 이차전지 소재의 개발부터 제작, 성능 검증까지 전 과정을 지원하는 시설이다."},{"s":"4천번 급속 충전에도 거뜬…국내 연구진, 차세대 배터리 개발","so":"연합뉴스","tm":"11/16 15:30","c":1,"r":"kr","u":"https://www.yna.co.kr/view/AKR20261116125400053","p":1794810609,"a":1794812202,"su":"포스텍-서강대, 차세대 듀얼이온전지 개발 흑연에 초박막 보호막, 저장량 3배로 향상 급속 충전 4천번 반복에도 성능 유지 전체 내용을 이해하기 위해서는 기사 본문과 함께 읽어야 합니다. 송고 2026년11월16일 15시30분 구글 검색에서 연합뉴스 기사를 우선적으로 보여줍니다. (포항=연합뉴스) 손대성 기자 = 국내 연구진이 잦은 충전에도 오래 사용할 수 있는 이차전지를 개발했다. 포스텍(POSTECH)은 화학과 박수진 교수, 강지은 박사, 지윤아 석사, 기계공학과 안지환 교수, 박사과정 조성은씨 연구팀이 서강대 화공생명공학과 류재건 교수 연구팀과 함께 충전 속도와 수명을 모두 높인 듀얼이온전지용 흑연 양극을 개발했다고 16일 밝혔다."},{"s":"보도자료: 미드리무시 유래 재료로 만드는 불소 프리의 리튬 이온 전지 정극용 바인더(공동 통신 PR 와이어)","so":"毎日新聞","tm":"11/16 14:00","c":1,"r":"jp","u":"https://mainichi.jp/articles/20261116/pls/00m/020/554000c","p":1794805200,"a":1794806610,"t":"プレスリリース：ミドリムシ由来材料で作るフッ素フリーのリチウムイオン電池正極用バインダー（共同通信PRワイヤー）","su":"기존의 전극 제조 공정에의 적용을 기대할 수 있어 기존의 불소계 고분자 재료와 동등한 충방전 성능을 확인 포인트"},{"s":"CATL 장쑤 자회사, 자본금 20억 위안으로 증자","so":"Jiemian.com","tm":"11/16 12:42","c":1,"r":"cn","u":"https://m.jiemian.com/article/15336117.html","p":1794800563,"a":1794806436,"t":"宁德时代江苏子公司增资至20亿元","su":"Tianyancha 앱에 따르면 CATL (Jiangsu) New Energy Technology Co., Ltd.는 최근 산업 및 상업 변화를 겪었으며 등록 자본금은 10억 위안에서 20억 위안으로 증가했습니다. 회사는 2016년 6월에 설립되었습니다. 회사의 법적 대표자는 Chen Ling입니다. 사업 범위에는 리튬 이온 배터리, 전원 배터리, 에너지 저장 배터리, 배터리 관리 시스템, 풍력 및 태양광 에너 一夜“过山车”；SpaceX Q3 业绩超预期；宁德时代等三季报出炉","su":"① 미국 정부가 각 기관에 딥시크 사용 중단을 지시했고, 외교부가 대응 ② 국가 데이터 그룹 설립 ③ 미국 다우존스 산업평균지수가 1% 이상 상승 ④ 공업정보화부: R&D와 테스트를 통해 충분히 검증되지 않은 불합리한 혁신 디자인과 자동차 제품의 시장 진입을 단호히 방지 ⑤ CATL, Tianyue Advanced, Yunnan Germanium Industry, CSSC Special Gas의 3분기 보고서가 공개된다. 매크로뉴스 1. 국무원의 승인을 받아 국립데이터그룹주식회사가 설립되었습니다. 국무원 국유자산감독관리위원회는 국무원을 대신하여 투자자의 직무를 수행한다. 국무원 국유자산감독관리위원회가 투자자의 임무를 수행하는 기업 목록에 포함될 것이다. 2. 미국 국토안보부는 10월 19일 미국 연방정부의 민간행정기관이 중국 인공지능 기업 딥서치(Deep Search) 및 그 계열사가 개발한 제품 및 서비스를 구매하는 것을 금지하고 관련 제품 및 서비스를 관련 기관의 정보시스템에서 제거하도록 요구한다고 발표했다. 상무부는 이에 대해 중국측은 강한 불만을 표하며 단호히 반대한다고 밝혔습니다. 미국은 양국 정상이 달성한 중요한 공감대를 진지하게 이행하고, 중국과 중간 협력하고, 중미 인공지능 대화 메커니즘을 잘 활용하고, 상호 신뢰를 강화하고, 차이를 관리하며, 인공지능을 공동으로 추진하기를 희망합니다."},{"s":"CATL과 베이징자동차, 포괄적인 전력 교환 협력 실시","so":"21财经","tm":"11/14 20:22","c":1,"r":"cn","u":"https://www.21jingji.com/article/20261114/herald/3850b3ac4602ab05934e7eda1b975b39.html","p":1794655376,"a":1794659867,"t":"宁德时代与北汽全面换电合作落地","su":"CATL과 베이징자동차는 포괄적인 배터리 교환 협력을 시작했습니다. 본 신문 보도(리팅 기자) 11월 13일 베이징에서 Jihu 국가 전력 스왑 생태계 및 베타 시리즈 신제품 출시 컨퍼런스가 개최되어 Jihu T1 배터리 스왑 버전이 출시되었습니다. 이는 베이징자동차그룹(이하 '베이징자동차 그룹')과 CATL 신에너지기술유한회사(이하 'CATL')가 지난 10월 22일 협약 체결 이후 한 달도 채 되지 않아 100만대 차량용 배터리 교환 전략적 협력 협약을 체결한 이후 또 하나의 중요한 성과다. 이전 협약에 따르면 양 당사자는 차량 개발, 배터리 교체 공급, 배터리 교체 네트워크 및 비즈니스 모델 혁신에 초점을 맞춘 풀체인 협력을 진행하게 된다. 베이징자동차는 자사의 멀티 브랜드 적용 모델을 초콜릿 배터리 교환 생태계에 통합하는 것을 촉진하고 배터리 교환 모델 100만 개라는 목표를 달성할 것입니다."},{"s":"CATL의 1,300억 달러 하락: 중국 최대 배터리 제조업체의 가치가 급락한 이유는 무엇입니까?","so":"South China Morning Post","tm":"11/14 16:00","c":1,"r":"sg","u":"https://www.scmp.com/business/climate-and-energy/article/3374346/chinas-battery-giant-catl-faces-tough-choices-after-epic-us130b-sell","p":1794639607,"a":1794642677,"t":"CATL’s US$130b drop: why has China’s biggest battery maker plunged in value?"}]},{"name":"⚡ 전고체배터리·ESS","note":"보유: KODEX 전고체배터리ESS TOP2플러스","breaking":false,"items":[{"s":"'네트워크 주식' 청화발전, 저궤도 위성과 에너지 저장장치 결합해 윈린 방재 통신망 구축","so":"中時新聞網","tm":"11/16 14:49","c":3,"r":"tw","u":"https://www.chinatimes.com/realtimenews/20261116002671-260410","p":1794808192,"a":1794809547,"t":"《通網股》中華電結合低軌衛星與儲能 打造雲林防災通訊網","su":"청화전력(2412)은 윈린현 소방서와 손잡고 '보호자 통신망'을 구축했다. 극한 기후 및 복잡한 재해 위험 증가에 대응하여 마이크로파 전송, 전문 디지털 라디오, 비디오 통신, 저궤도 위성 및 에너지 백업과 같은 기술을 통합하고 윈린현에 30개의 통신 스테이션을 구축하여 다단계 재해 예방 및 구호 통신 프레임워크를 구축합니다."},{"s":"세계 최초 300MW 인공 챔버 압축 공기 에너지 저장 발전소가 그리드에 연결되어 전기를 생산합니다.","so":"Jiemian.com","tm":"11/16 11:44","c":3,"r":"cn","u":"https://m.jiemian.com/article/15335821.html","p":1794797063,"a":1794797222,"t":"世界首个300兆瓦人工硐室型压缩空气储能电站并网发电","su":"China Energy Construction에 따르면, 세계 최초의 300MW 인공 챔버 압축 공기 에너지 저장 발전소인 \"Yuanshu No. 1\"이 감숙성 그리드에 성공적으로 연결되어 인공 챔버 압축 공기 에너지 저장 기술이 실험적 검증에서 대규모 엔지니어링 적용에 이르기까지 획기적인 발전을 이루었으며 중국 압축 공기 에너지 저장 기술 경로의 다각적 개발을 위한 새로운 엔지니어링 사례를 제공했습니다. 압축공기 에너지저장장치(전기를 저장해 두는 큰 배터리)는 전기에너지를 기압 위치에너지로 변환하고 필요할 때 다시 전기에너지로 변환하는 에너지 저장 기술이다. \"위안추 1호\" 발전소는 지하 110미터 암석층에 가스 저장실을 굴착하여 건설합니다. 챔버 그룹은 4개의 챔버로 구성됩니다. 발전소는 300MW의 전력과 1,800MWh의 에너지 저장 용량을 갖춘 발전 장치를 건설할 예정입니다. 전기-전기 변환 효율은 72%에 이릅니다. 한 번에 6시간 동안 장기간 발전할 수 있으며 연간 발전량은 6억kWh에 달할 수 있습니다."},{"s":"Jianhexing은 강력한 주문, 녹색 에너지 및 에너지 저장이 추진력을 더할 것으로 보고 있습니다.","so":"中時新聞網","tm":"11/17 05:10","c":2,"r":"tw","u":"https://news.google.com/rss/articles/CBMia0FVX3lxTE9vN0VKaFdVRnVJaWEwcDEwVHhIZm1uM2JEdTJkVWtadjBfdlRKWk1qSjNDZVo0ODN4QjRmZzByeGp0YzdzdnZmeHNnWGwwejRtZy01T3ZVQkRWUG5VcUZkTlFtVmJsZmd1WUpv?oc=5","p":1794859800,"a":1794869036,"t":"健和興訂單旺 綠能、儲能添動能"},{"s":"DoGo의 그리드 형성 ESS는 인도네시아 외딴 섬의 2,000 가구에 24시간 전력을 공급합니다.","so":"Japan Wire by Kyodo News","tm":"11/16 16:12","c":2,"r":"us","u":"https://english.kyodonews.net/articles/-/91578","p":1794813120,"a":1794830436,"t":"DoGo's Grid-Forming ESS Delivers Round-the-Clock Power to 2,000 Households on Remote Indonesian Island","su":"자카르타, 인도네시아, 2026년 11월 16일 /PRNewswire/ -- DoGo Power의 스마트 그리드 형성 에너지 저장 시스템(ESS(전기를 저장해 두는 큰 배터리))과 에너지 관리 시스템(EMS)이 인도네시아 남부의 외딴 섬인 Pagerungan Kecil Island(P Island)에서 공식적으로 가동되었습니다."},{"s":"\"한정된 시간의 전력 소비\"에 작별 인사, Donggao 그리드형 에너지 저장 장치가 인도네시아 외딴 섬의 2,000 가구를 밝힙니다.","so":"經濟日報","tm":"11/16 14:00","c":2,"r":"tw","u":"https://money.udn.com/money/story/123828/9881536","p":1794805255,"a":1794806449,"t":"告別「限時用電」 東高構網型儲能點亮印尼孤島兩千戶家庭","su":"자카르타, 인도네시아 2026년 11월 16일 /PRNewswire/ -- 최근 Donggao Future Energy가 인도네시아 남부 Pagerungan Kecil Island(이하 \"P Island\") 프로젝트에 제공한 지능형 네트워크 에너지 저장 시스템 및 에너지 관리 시스템이 가동에 들어갔습니다. Donggao Future Energy는 그리드 레벨 네트워크 에너지 저장 및 새로운 전력 시스템의 핵심 기술에 중점을 두고 있습니다. 이번에 가동되는 프로젝트의 설치 용량은 태양광 1MW + 2MW/4MWh 에너지 저장장치로, 메인 그리드와 연결되지 않은 이 고립된 섬에 안정적인 전력 지원을 제공하고, 동남아시아 섬 마이크로그리드 구축을 위한 복제 가능한 실제 샘플도 제공한다. DoGo의 그리드 형성 ESS(전기를 저장해 두는 큰 배터리)는 인도네시아 외딴 섬의 2,000가구에 24시간 전력을 공급합니다. P섬은 고립된 섬에 갇혀 있습니다: 디젤 발전과 시간 제한 전력 공급. P섬은 외진 곳에 위치하고 있어 주 전력망에 연결할 수 있는 바다 횡단 케이블이 없습니다. 기본적인 전력 수요를 유지하기 위해 오랫동안 디젤 발전에 의존해 왔습니다. 섬에는 어업으로 생계를 유지하는 영주권자가 2,000명 이상 있습니다. 원래 전원 공급 장치는 가구의 약 4분의 1에만 적용되며"},{"s":"엠플러스, '전고체 배터리' 양산시장 뚫었다…글로벌 기업서 200억대 수주","so":"파이낸셜뉴스","tm":"11/16 08:46","c":2,"r":"kr","u":"https://www.fnnews.com/news/202611160844070909","p":1794786411,"a":1794789736,"su":"이차전지 조립장비 전문기업 엠플러스가 글로벌 기업으로부터 200억원대 전고체 배터리(액체 대신 고체를 넣은 안전한 배터리) 장비를 수주(일감 주문을 받는 것)하며 차세대 배터리 시장 공략에 속도를 내고 있다."},{"s":"무음극 전고체전지 수명 늘리는 이중층 구조 개발…250회 충·방전 후 용량 92% 유지","so":"전자신문","tm":"11/17 12:00","c":1,"r":"kr","u":"https://news.google.com/rss/articles/CBMiTkFVX3lxTE9jQXVsNVJNUmRIRXFvdHVOTEQzSXNNU1hURkdqUllKNUR1SUp3X0l5a3I1cDNEZ0czRU1uQ1RKNW9sUXFqT1I2LWRWcGhFUQ?oc=5","p":1794884400,"a":1794885833},{"s":"\"충전하면 팽창, 방전하면 수축\"…전고체전지 수명 난제 해결 실마리[과학을읽다]","so":"아시아경제","tm":"11/17 12:00","c":1,"r":"kr","u":"https://www.asiae.co.kr/article/2026111710530433527","p":1794884400,"a":1794885833,"su":"충전할 때 부풀어 오르고 방전할 때 수축하는 현상은 차세대 배터리인 전고체전지의 수명을 단축시키는 주요 원."},{"s":"리튬시장, 내년도 공급과잉 예상…에너지저장·데이터센터 중심 성장 - 뉴스콘텐츠 - 펀드","so":"MoneyDJ","tm":"11/17 11:51","c":1,"r":"tw","u":"https://www.moneydj.com/funddj/ya/yp050000.djhtm?a=6676d741-3926-432d-82c2-d65af0fa186e","p":1794883860,"a":1794885850,"t":"明年鋰市估供應過剩 儲能與資料中心帶動成長-新聞內容-基金","s 5.52억엔(동 5.77억엔의 이익), 모회사 주주에 귀속하는 분기 순손실이 5.65억엔(동 0.25억엔)."},{"s":"CITIC Securities: 조립 기계부터 운영까지 에너지 저장 장치 개발 계획 발표","so":"第一财经","tm":"11/17 09:01","c":1,"r":"cn","u":"https://www.yicai.com/news/103442788.html","p":1794873704,"a":1794874154,"t":"中信证券：储能发展规划出台，从拼装机到拼运营","su":"제일재경 2026-11-17 07:59:37 편집자: Tang Yanbei CITIC Securities 연구 보고서에 따르면 신에너지 저장 산업을 위한 '15차 5개년 계획'이 시작되었으며, 신 에너지 저장 장치 설치 용량 목표는 2030년에 3억 킬로와트로 계획되어 있으며, 묵시 기간 동안 복합 성장률은 17%입니다. 이 정책은 전력 시장 참여, 용량 메커니즘 개선, 운영 비용 공유 연구 및 최적화 등을 통해 새로운 에너지 저장 장치 개발 시장 메커니즘을 개선할 것을 명확하게 제안합니다. 새로운 에너지 저장 장치는 시장 지향적인 개발 단계로 나아가고 있습니다. 전력 공급 측면과 그리드 측면의 에너지 저장 개발은 정책 지원을 받았으며, 전력 공급 측면의 분배 및 저장과 전력 시장 거래의 통합 참여는 정책 지원을 받아 에너지 저장 투자에 대한 전력 공급 측면의 열정을 높이는 데 도움이 될 것입니다. 신에너지 개발은 에너지 저장장치 개발 이후 시스템 소비능력 향상으로 이익을 얻으며, 화력 규제의 가치는 약화되기 어렵다."},{"s":"Stem과 Copec, 라틴 아메리카 전역의 에너지 저장 및 지능형 에너지 관리 발전을 위해 파트너십 확대 - 회사 발표 - FT.com","so":"Financial Times","tm":"11/17 06:12","c":1,"r":"world","u":"https://markets.ft.com/data/announce/detail?dockey=600-202611161612BIZWIRE_USPRX____20261116_BW847996-1","p":1794863520,"a":1794869041,"t":"Stem and Copec Expand Partnership to Advance Energy Storage and Intelligent Energy Management Across Latin America – Company Announcement - FT.com"},{"s":"로손 점포에서 재에너지, 32점에서 융통 축전지 사용 수급 조정","so":"日本経済新聞","tm":"11/17 05:00","c":1,"r":"jp","u":"https://www.nikkei.com/prime/gx/article/DGXZQOUC305FT0Q6A930C2000000","p":1794859200,"a":1794869039,"t":"ローソン店舗で再エネ、32店で融通 蓄電池使い需給調整","su":"로손이 설치하는 수직 양면 태양광 로손은 점포에 설치한 태양광 패널에서 발전한 재생 가능 에너지 유래의 전력을 점포를 넘어 융통하는 대처를 연도 내에도 시작한다. KDDI의 기술을 활용하여 송전량 등을 원격제어하여 잉여전력을 다른 점포에 융통한다. 32 점포의 전력을 일체적으로 관리함으로써 효율적으로 재에너지를 활용하고 이산화탄소(CO2) 배출량의 삭감과 함께 전력계통의 조정력으로 활용한다. 26 점포에 태양광 패널과 축전지를 설치 군마현 내의 32 점포에서 전력"},{"s":"청두│광전자 기술이 우주를 공격하다! 중국 본토 산업 회의는 페로브스카이트와 새로운 에너지 저장에 중점을 둡니다.","so":"工商時報","tm":"11/17 03:00","c":1,"r":"tw","u":"https://www.ctee.com.tw/news/20261117700030-430805","p":1794852000,"a":1794869037,"t":"成都│光電技術搶攻太空！陸產業大會聚焦鈣鈦礦、新型儲能- 兩岸","su":"제9회 국제 광전자공학 및 에너지 저장 산업 컨퍼런스가 17일부터 20일까지 청두에서 우주 태양광 발전, 페로브스카이트, 신에너지 저장 등 첨단 기술을 중심으로 개최됩니다. 주최측은 올해 행사에는 유럽, 미국, 동남아시아, 중동 등 전 세계 80개 이상의 국가 및 지역에서 600명 이상의 해외 바이어가 참여할 것으로 예상하고, 본토 광스토리지 기업을 홍보해 해외 사업 기회를 확대할 것이라고 밝혔다."},{"s":"충칭│중국 본토 최초의 완전 자동화 배터리급 리튬금속 공장 준공 - 양안","so":"工商時報","tm":"11/17 03:00","c":1,"r":"tw","u":"https://www.ctee.com.tw/news/20261117700034-430805","p":1794852000,"a":1794874155,"t":"重慶│陸首個全自動電池級金屬鋰工廠完工- 兩岸","su":"중국 본토 최초의 완전 자동화된 배터리급 리튬 금속 공장이 12일 충칭시 퉁량구에 공식적으로 완공되었습니다. 리튬 배터리 거대 기업인 Tianqi Lithium이 소유한 이 공장은 60kA의 고효율 및 에너지 절약형 금속 리튬 전기분해 장비를 구축했으며, 총 생산 능력을 연간 1,600톤으로 늘릴 것으로 예상됩니다. Tianqi Lithium은 전기 자동차, 전자 제품, 신에너지 저장 장치 등을 다루는 세계 최대의 리튬 배터리 생산 대기업 중 하나입니다. 조사 회사인 Farmonaut는 Tianqi Lithium의 글로벌 시장 점유율이 2026년 약 15.3%가 될 것으로 추정합니다."},{"s":"DoGo의 그리드포밍형 축전시스템(ESS)이 인도네시아 낙도의 2,000가구에 24시간 전력을 공급","so":"時事ドットコム","tm":"11/17 00:40","c":1,"r":"jp","u":"https://www.jiji.com/jc/article?k=rmkKOUkZ&g=prn","p":1794843600,"a":1794869040,"t":"DoGoのグリッドフォーミング型蓄電システム（ESS）が、インドネシアの離島の2,000世帯に24時間電力を供給","su":"자카르타, 인도네시아, 2026년 11월 16일 /PRNewswire/--DoGoPower의 스마트 그리드 포밍형 축전 시스템(ESS(전기를 저장해 두는 큰 배터리))과 에너지 관리 시스템(EMS)이 인도네시아 남부 해안의 낙도, 파게른간 케틸섬(P섬)에서 정식으로 가동을 시작했습니다. 1MW의 태양광 발전과 2MW/4MWh의 ESS에 의한 본 프로젝트는 오프 그리드의 지역사회에 안정적이고 신뢰성 높은 전력을 공급하고 동남아시아 전역의 섬도부에서 마이크로 그리드를 전개하기 위한 재현 가능한 모델이 됩니다."},{"s":"왜 \"5kWh의 전력\"이 발코니 에너지 저장 장치 C 위치에 있습니까?","so":"36氪出海","tm":"11/16 23:36","c":1,"r":"cn","u":"https://letschuhai.com/4c218db6","p":1794839804,"a":1794840871,"t":"“5度电”缘何坐上阳台储能C位？","su":"2년 전만 해도 발코니 에너지 저장 장치의 라벨은 여전히 \"1.6kWh의 전기, 손잡이 포함\"이었습니다. 2026년에는 트랙의 주 용량이 3배로 증가합니다. 첨단산업에너지저장연구소(GGII) 자료에 따르면 발코니 광스토리지는 2026년 성장률 100%를 넘어 올해 유럽에서 가장 뜨거운 트랙이 될 것으로 예상된다. 독일에서는 2026년 3월 현재 발코니 태양광 발전 누적 설치 수가 200만 대를 초과했으며, 1분기에 새로 설치된 그리드 수가 전년 대비 140% 증가했습니다. 네덜란드에서는 2분기에 37,600개 이상의 발코니 에너지 저장 배터리가 판매되어 전 분기보다 거의 두 배, 전년 동기 대비 47배 증가했습니다. 한 분기의 판매량이 지난 3년의 총 재고를 초과했습니다. 모든 용량 부문에서 5kWh의 전력(5kWh)은 “아무도 돌아다닐 수 없는” 수치가 되어가고 있습니다."},{"s":"드론 분야의 선두 기업은 에너지 저장 장치로 전환한 후에도 배터리를 계속 만들까요? DJI가 '배터리 회사'를 등록했습니다.","so":"ThePaper.cn","tm":"11/16 22:30","c":1,"r":"cn","u":"https://www.thepaper.cn/newsDetail_forward_34490432","p":1794835848,"a":1794838071,"t":"无人机龙头切入储能后还要造电芯？大疆注册了一家“电池公司”","su":"시장의 주목을 받은 일부 제품의 가격 인상 발표에 이어, 최근 드론 분야 선두주자인 DJI의 또 다른 행보가 리튬 배터리 업계에서 논의를 촉발시켰다. 산업 및 상업 정보에 따르면 Shenzhen DJI Yaowo New Energy Technology Co., Ltd.(이하 \"Yaowo New Energy\")는 일본에서 운영됩니다."},{"s":"삼성SDI, 2029년부터 3년만에 16GWh 에너지저장전지 미국 수주","so":"鉅亨網","tm":"11/16 22:30","c":1,"r":"tw","u":"https://news.cnyes.com/news/id/6664290","p":1794835833,"a":1794838074,"t":"三星SDI拿下美國16GWh儲能電池訂單2029年起分三年交貨","su":"삼성SDI가 2029년부터 3년 만에 미국에서 16GWh 에너지저장전지를 수주했다. 유애널라이즈(Uanalyze) 2026년 11월 16일(Uanalyze/산업데이터센터(컴퓨터 수만 대를 모아 둔 건물) 리포트) ⸺ 삼성SDI는 미국 에너지저장장치(전기를 저장해 두는 큰 배터리) 개발업체 주피터파워(Jupiter Power)와 16GWh급 리튬인산철(LFP) 배터리 공급계약을 체결했는데, 이는 2029년부터 2031년까지 납품 예정이다. 미국에서 개발된 Jupiter Power의 대규모 에너지 저장 프로젝트에 사용됩니다. 양 당사자가 체결한 이전 계약을 포함하여 Jupiter Power는 삼성SDI로부터 약 27GWh의 배터리 용량을 구매했습니다. 이번 주문은 미국 인디애나주에 위치한 삼성SDI 스타플러스 에너지 공장에서 생산될 예정이다. 이 공장은 최근 LFP 배터리 대량 생산을 시작했으며, 이번 주문으로 향후 몇 년간 공장 출하가 뒷받침될 것입니다."},{"s":"세계 최대의 납탄소 에너지 저장 발전소가 배터리 품질 소송에 연루됐고, SPIC 회사들은 1억 위안 이상의 배상금을 청구했습니다.","so":"ThePaper.cn","tm":"11/16 22:27","c":1,"r":"cn","u":"https://www.thepaper.cn/newsDetail_forward_34490396","p":1794835656,"a":1794838072,"t":"全球最大铅碳储能电站陷电池质量诉讼，国家电投旗下企业索赔超1亿元","su":"불과 3년 전에 가동을 시작한 세계 최대의 납탄소 에너지 저장 발전소에서 소송으로 인해 배터리 품질 문제가 제기되었습니다. Jingwei Co., Ltd.(301390.SZ)는 11월 13일 저녁 자사의 전체 지분(회사를 나눠 가진 몫)을 소유한 자회사 Hangzhou Hongsheng Electric Power Design Consulting Co., Ltd.(이하"},{"s":"COP31은 자금 문제에 중점을 둡니다. 향후 5년간 새로운 에너지 저장 솔루션 출시 | 탄소 중립 주간 보고서","so":"21财经","tm":"11/16 21:30","c":1,"r":"cn","u":"https://www.21jingji.com/article/20261116/herald/e198303f2eb48ae188bd2b8ebe707a4c.html","p":1794832200,"a":1794834730,"t":"COP31聚焦资金问题；未来五年新型储能方案印发｜碳中和周报","su":"21세기 비즈니스 헤럴드 기자 레이예(Lei Ye)와 리더상위(Li Deshangyu)가 베이징에서 보도했습니다. Carbon Neutral Weekly는 탄소 중립 정책, 지역 역학, 기업 관행 등을 포함한 \"이중 탄소\" 분야의 최신 최첨단 개발에 중점을 둡니다. 매주 탄소 중립 분야의 주요 이벤트를 선택하고 논평하여 시의적절하고 포괄적인 탄소 중립 정보 플랫폼을 구축할 것입니다. 1. 탄소 중립 정책 1. COP31이 진행되는 동안 글로벌 기후 거버넌스는 이행을 향해 나아가고 있습니다. 지난 11월 11일 터키 안탈리아에서 열린 제31차 유엔기후변화협약 당사국총회(COP31)가 실질적인 협의 단계에 돌입했다. 올해는 파리협정 이행을 위한 새로운 10년이 시작되는 해이며, 글로벌 기후 거버넌스는 약속에서 이행까지 중요한 전환점에 있습니다. 회의 의장국인 터키는 '대화, 합의, 행동'이라는 회의 슬로건을 제시하고, 다자간 협상 과정의 보완책으로 '전력화', '폐기물 제로' 등 자발적 행동 계획을 내놨다."},{"s":"19:43:17 [새로운 에너지 저장 솔루션의 구현은 녹색 전력 부문의 성장 논리를 강화하고 녹색 전력 ETF E 펀드(562960)의 기본 지수가 거의 1% 상승했습니다.]","so":"财联社","tm":"11/16 20:43","c":1,"r":"cn","u":"https://www.cls.cn/detail/2535669","p":1794829397,"a":1794830439,"t":"19:43:17【新型储能方案落地强化绿电板块成长逻辑，绿色电力ETF易方达（562960）标的指数涨近1%】"},{"s":"Xitel, GE 버노바 및 SK On과 손잡고 AI 에너지 저장 공급망 구축","so":"DIGITIMES","tm":"11/16 19:51","c":1,"r":"tw","u":"https://www.digitimes.com.tw/tech/dt/n/shwnws.asp?id=0000774973_XQOL74UD63QJ5K47MIWB7&cf=A21","p":1794826260,"a":1794830445,"t":"熙特爾攜手GE Vernova、SK On 布局AI儲能供應鏈","su":"글로벌 AI 데이터센터(컴퓨터 수만 대를 모아 둔 건물) 구축이 가속화되면서 안정성이 높은 전력공급과 대규모 에너지 저장 인프라에 대한 수요가 급증하고 있으며, 초국적 에너지 공급망(부품·재료가 오가는 연결망) 재편이 업계의 화두가 되고 있다. 대만의 에너지 저장 시스템 통합업체인 자이텔(Xitel)이 미국의 주요 에너지 장비 제조사와 협력했다고 16일 밝혔다."},{"s":"Kaizhi Green Energy 11/20 Dengxing 캐비닛, 태양광 EPC/에너지 저장/마이크로그리드 사업 기회 확보 - 뉴스","so":"MoneyDJ","tm":"11/16 16:54","c":1,"r":"tw","u":"https://www.moneydj.com/z/DJA/News/DJANewsDetail_39D80C3D-4EDE-4421-A806-83787344509E.djhtm","p":1794815640,"a":1794830446,"t":"凱智綠能11/20登興櫃搶太陽能EPC/儲能/微電網商機- 新聞","su":"MoneyDJ News 2026-11-16 15:54:13 게시자: Wan Huiwen 녹색 에너지 시스템 통합업체 Kaizhi Green Energy(7961)가 11월 20일에 시장에 상장(주식시장에 처음 들어오는 것)됩니다. 주요 사업은 태양광 발전 엔지니어링 턴키(EPC), 스마트 에너지 저장 및 에너지 관리 시스템을 포함합니다. Li Juncheng 회장(사진)은 최근 몇 년 동안 태양광 EPC 사업을 지속적으로 확장하는 것 외에도 스마트 마이크로그리드, AI 유지 관리 및 분산 에너지 애플리케이션을 적극적으로 배포했다고 말했습니다. 앞으로는 국내외 기업과의 협력을 확대해 운영 규모의 성장을 촉진할 예정이다. 하반기는 태양광 프로젝트 건설이 가속화되고 인지도가 가속화되는 시기이기 때문에 상반기와 하반기 수익 배분은 4:6으로 추산되며, 4분기에 집중될 것으로 보인다. 법인은 Kaizhi의 연간 주당 수익이 NT$7~8 정도라고 추정합니다."},{"s":"CESC2026 제4차 에너지저장 컨퍼런스가 닝샤에서 개최되었습니다. 학계 및 전문가들이 '15차 5개년 계획' 동안 에너지저장장치의 고품질 개발에 대해 논의했습니다.","so":"Jiemian.com","tm":"11/16 16:38","c":1,"r":"cn","u":"https://www.jiemian.com/article/15337079.html","p":1794814695,"a":1794830441,"t":"CESC2026 第四届储能大会在宁举行 院士专家共议“十五五”储能高质量发展","su":"11월 4일, CESC2026의 네 번째 에너지 저장 컨퍼런스가 난징 국제 엑스포 센터에서 열렸습니다. 약 600명이 참석했으며 남동대학교의 젊은 주임교수이자 박사 지도교수인 Zhu Zhi가 주최했습니다. 이번 컨퍼런스의 주제는 '기술적 혁신·생태적 시너지'였습니다. 정부 부처, 대학 과학 연구 기관, 기업, 산업 협회 및 금융 기관의 대표자들은 \"15차 5개년 계획\" 동안 에너지 저장 개발 경로에 대해 논의했습니다. 규모 확장에서 가치 창출로의 전환이 컨퍼런스 전체의 주요 주제가 되었습니다."},{"s":"벌써 2031년 ESS 물량도 확보한 삼성SDI..내년엔 전고체 배터리 승부 - 머니투데이","so":"머니투데이","tm":"11/16 15:50","c":1,"r":"kr","u":"https://www.mt.co.kr/industry/2026/11/16/2026111613174278091","p":1794811800,"a":1794812212,"su":"삼성SDI가 미국 주피터파워와 3조~4조원 규모의 ESS(에너지저장장치(전기를 저장해 두는 큰 배터리))용 LFP(리튬인산철) 배터리 공급 물량을 추가로 확보하면서 중장기 수주(일감 주문을 받는 것) 확대의 신호탄을 쐈다. 삼성SDI는 늘어나는 ESS 수요에 대응하기 위해 미국 현지 생산능력 확대에도 속도를 내고 있다."},{"s":"에너지저장장치 세계 1위 기업 BYD, 유럽 최초 배터리셀 공장 건설로 포르투갈 선택","so":"21财经","tm":"11/16 14:20","c":1,"r":"cn","u":"https://www.21jingji.com/article/20261116/herald/cbeaa9178eb78165f3431db94c10dfe3.html","p":1794806400,"a":1794807054,"t":"全球储能第一的比亚迪，把欧洲第一家电芯工厂选在了葡萄牙","su":"Foresight Energy는 최근 포르투갈 언론인 \"Expresso\"에서 BYD가 포르투갈 정부 및 포르투갈 무역 투자청과 투자하여 포르투갈에 배터리 공장을 건설하기 위해 협상하고 있다고 보도했습니다. 후보 부지는 포르투 인근 마토지뉴스(Matosinhos)에 있는 옛 갈프(Galp) 정유공장 부지로 약 240헥타르 규모다. 2021년에 폐쇄될 예정이며, 철거 및 토양 복원 작업은 2026년 말까지 완료될 예정이다. BYD는 아직 해당 프로젝트에 대한 공식 확인서를 발행하지 않았다. 포르투갈 경제부 장관은 회사 이름을 직접 밝히지는 않았지만 정부가 중국 자동차 회사와 '생산적인 대화'를 진행하고 있음을 확인했습니다. 이 소식의 무게는 BYD Energy Storage의 글로벌 시장 좌표계에 다시 포함되어야만 명확하게 볼 수 있습니다. 2025년에 BYD의 전 세계 에너지 저장 시스템 출하량은 60GWh를 초과하고 시장 점유율 13%로 테슬라를 제치고 세계 1위가 되며, 2023년부터 2024년까지 2년 연속 1위 자리를 차지하게 됩니다. BYD의 에너지 저장 제품은 110개 이상의 국가 및 지역을 포괄하며 650개 이상의 대규모 에너지 저장 프로젝트에 시스템을 제공했습니다. 하지만 유럽에는 BYD가 아직 배터리 셀 공장을 갖고 있지 않다."},{"s":"보도자료 : [도시바] 태양광 발전소에 축전지 병설 프로젝트를 초완공 (Digital PR Platform)","so":"毎日新聞","tm":"11/16 14:00","c":1,"r":"jp","u":"https://mainichi.jp/articles/20261116/pls/00m/020/287000c","p":1794805200,"a":1794806618,"t":"プレスリリース：［東芝］太陽光発電所への蓄電池併設プロジェクトを初完工（Digital PR Platform）","su":"2026-11-16 주식회사 도시바 태양광발전소에 축전지 병설 프로젝트를 첫 완공"},{"s":"당신을 중심으로 구성된 Keeper Family: Sungrow의 종합 C&I 에너지 저장 솔루션 소개","so":"The Straits Times","tm":"11/16 13:23","c":1,"r":"sg","u":"https://www.straitstimes.com/paid-press-releases/keeper-family-shaped-around-you-introducing-sungrows-comprehensive-ci-energy-storage-solutions-20261116","p":1794802980,"a":1794806453,"t":"Keeper Family, Shaped Around You: Introducing Sungrow's Comprehensive C&I Energy Storage Solutions","su":"허페이, 중국, 2026년 11월 16일 /PRNewswire/ -- 전 세계적으로 선도적인 PV 인버터 및 에너지 저장 시스템 공급업체인 Sungrow가 전체 mo 제품군을 출시했습니다."},{"s":"[한정 직격] 포지티브 부스트, 전고체 배터리 컨셉 재고 '20CM' 한계 업","so":"中证网","tm":"11/16 12:37","c":1,"r":"cn","u":"https://jnzstatic.cs.com.cn/zzb/htmlInfo/138337.html","p":1794800220,"a":1794885842,"t":"【涨停直击】利好提振，固态电池概念股“20CM” 涨停","su":"[리미트 직격] 포지티브 부스트, 전고체 배터리(액체 대신 고체를 넣은 안전한 배터리) 컨셉주 '20CM' 리미트 업 Wang Yin CSI Taurus 11월 16일 링파이 테크놀로지의 '20CM' 리미트 업으로 전고체 배터리 부문이 다시 상승했다. 최근 주가는 주당 27.83위안, 시가총액(회사 전체 몸값)은 47억8500만위안이다. 소식에 따르면, 국가발전개혁위원회와 국가에너지국은 최근 '신에너지저장 이행계획을 위한 15차 5개년 계획'을 발표했습니다. 단기적인 고주파 전력 에너지 저장 기술을 개발할 것을 제안한다. 플라이휠 에너지 저장, 고성능 베어링, 진공 고속 모터 등을 위한 저비용 및 고강도 소재를 개발하고 로터 방열 기술을 최적화합니다. 슈퍼커패시터용 고성능 재료 및 장치를 연구하고, 대용량 고비 전력 배터리 에너지 저장을 연구하고, 고비 전력 배터리 에너지 저장을 촉진하고, 슈퍼커패시터의 시범 적용을 촉진합니다. 고온 초전도 물질을 개발합니다."},{"s":"이 정책은 \"최첨단 기술 보유\"에 대한 분위기를 설정합니다! 전고체 배터리 개념 급부상, 파이테크놀로지 한계점","so":"21财经","tm":"11/16 12:30","c":1,"r":"cn","u":"https://www.21jingji.com/article/20261116/herald/a1ccdc793cb6d3bcaeeb979c2e117e3d.html","p":1794799859,"a":1794885846,"t":"政策定调“前沿技术储备”！固态电池概念异动拉升，领湃科技涨停","su":"16일 21파이낸셜레이더에 따르면 이번 세션 동안 전고체 배터리(액체 대신 고체를 넣은 안전한 배터리) 개념이 요동쳤다가 상승세를 보였다. Lingpai Technology(300530.SZ) 20cmlimit-up, Zizhu Hi-Tech(002058.SZ) Limit-up, Liwang Co., Ltd., 무한 블루 파워, Mengguli, Shanghai Xiba, Yiwei Lithium Energy 및 기타 주식이 뒤따랐습니다. 뉴스에 따르면 13일 국가에너지청 홈페이지에 따르면 국가발전개혁위원회와 국가에너지청은 '15차 5개년 신에너지저장 시행계획'(이하 '계획')을 발표했다. '계획'에는 2030년까지 신에너지저장장치(전기를 저장해 두는 큰 배터리)가 대규모 개발 단계에서 시장지향적 개발 단계로 전환될 것이라고 언급됐다. 국가 신에너지 저장장치 설치 용량은 3억kW에 달하고, 평균 에너지 저장 시간은 약 3시간이 될 전망이다."},{"s":"조업은 설탕 생산기계의 제조…전고체 전지용 총력, 츠키시마 HD의 기술력","so":"ニュースイッチ by 日刊工業新聞社","tm":"11/16 12:01","c":1,"r":"jp","u":"https://newswitch.jp/p/50814","p":1794798060,"a":1794806451,"t":"祖業は砂糖生産機械の製造…全固体電池向け総力、月島HDの技術力","su":"츠키시마 홀딩스(HD)의 사업 자회사인 츠키시마 기계(도쿄도 주오구)는 전고체 전지의 정극재에서 중요한 미세한 전구체 제작에 빼놓을 수 없는 장치를 다루고 있다. 2010년경부터 개발에 착수하는 등 대처의 숨은 길다..."},{"s":"'15차 5개년 계획' 신에너지저장 실시계획 발표, 신전력시스템 구축 강화, 전력ETF 보시(561700) 추적지수 상승","so":"Jiemian.com","tm":"11/16 11:53","c":1,"r":"cn","u":"https://www.jiemian.com/article/15335787.html","p":1794797613,"a":1794806447,"t":"“十五五”新型储能实施方案印发，新型电力系统建设力度加大，电力ETF博时(561700)跟踪指数上涨","su":"전력 ETF(여러 주식을 묶어 파는 상품) Boshi(561700)는 CSI 전력 유틸리티 지수를 추적하며 \"15차 5개년 계획\" 신규 에너지 저장 정책의 혜택을 받았습니다. 11월 16일 지수는 0.31% 상승했고, 구성종목은 전반적으로 상승했다."},{"s":"삼성SDI, 주피터파워에 LFP 배터리 공급","so":"Yonhap News Agency","tm":"11/16 09:33","c":1,"r":"us","u":"https://en.yna.co.kr/view/AEN20261116002300320","p":1794789187,"a":1794789737,"t":"Samsung SDI to supply LFP batteries to Jupiter Power","su":"서울, 11월 16일(연합) -- 국내 2위 배터리 제조사인 삼성SDI가..."},{"s":"중국 메이커가 JC-STAR 대응에 고전하는 이유── 태양광·축전지 사업자가 취해야 할 대응은","so":"ITmedia","tm":"11/16 07:00","c":1,"r":"jp","u":"https://www.itmedia.co.jp/smartjapan/articles/2611/16/news007.html","p":1794780000,"a":1794784865,"t":"中国メーカーがJC-STAR対応に苦戦する理由──太陽光・蓄電池事業者がとるべき対応は","su":"2027년 4월 이후, 태양광 발전·축전지의 계통 연계의 필수 요건이 되는 JC-STAR 제도에 대해 해설하는 본 연재. 후편이 되는 이번은, 공개되고 있는 ★1 적합 라벨 취득 제품 리스트를 분석해, 중국 메이커의 ★1 취득 상황과 그 배경, 그리고 태양광·축전지 사업자가 지금 해야 할 대응의 포인트에 대해서 해설한다."},{"s":"이시카리에 「국산」특고 축전소, 재에너지산지소에 공헌도(4페이지째)","so":"日経クロステック","tm":"11/16 05:00","c":1,"r":"jp","u":"https://xtech.nikkei.com/atcl/nxt/column/18/02443/110600187/?P=4","p":1794772800,"a":1794784868,"t":"石狩に「国産」特高蓄電所、再エネ地産地消に貢献も（4ページ目）","su":"JR 삿포로역에서 자동차로 북쪽으로 30분이 걸리지 않고, 이시카리시와 오타루시에 걸친 ‘이시카리만 신항’은 인구 230만명을 보유한 삿포로 경제권의 바다 현관구가 된다. 항구에 면한 약 3000ha의 광대한 지역은 홋카이도를 대표하는 공업단지와 유통거점으로 되어 있으며, 공장 외에 상업시설이나 호텔, 데이터센터(컴퓨터 수만 대를 모아 둔 건물), 물류센터 등 약 760개사가 진출해 2만명 이상이 일하고 있다."},{"s":"ESS Tech, Inc.의 주가(GWHTQ)를 실시간으로 확인해보세요","so":"CNBC","tm":"11/16 04:10","c":1,"r":"us","u":"https://www.cnbc.com/quotes/GWHTQ","p":1794769806,"a":1794784861,"t":"Check out ESS Tech, Inc.'s stock price (GWHTQ) in real time","su":"ESS(전기를 저장해 두는 큰 배터리) Tech, Inc.(GWHTQ:OTCQB) CNBC에서 실시간 주가, 뉴스, 가격 및 금융 정보를 받아보세요."},{"s":"[VIP데일리] 전고체 배터리 컨셉이 대세에 역행하고 있다. 이 칼럼은 업계 동향을 추적하며 주력 회사가 14.21% 급등했다고 언급합니다.","so":"财联社电报","tm":"11/16 01:39","c":1,"r":"cn","u":"https://m.cls.cn/detail/2535455","p":1794760740,"a":1794830444,"t":"【VIP日报】固态电池概念逆势活跃 栏目追踪行业动态 提及焦点公司大涨14.21%","su":"참고: 금융조합 VIP는 투자조언이 아닌 컨텐츠 정보 상품입니다. 다음 내용은 단지 정보 가치의 표시일 뿐 관련 기업에 대한 추천이나 미래 동향에 대한 예측이 아닙니다. 투자는 위험하므로 시장 진입 시 주의가 필요합니다. 시장 핫스팟 1: 전고체전지 뉴스에 따르면 국가발전개혁위원회와 국가에너지국은 '15차 5개년 계획 신에너지저장 실시계획'을 발표했다. 이 계획에서는 중·단기 에너지 배터리 저장 기술을 개발할 것을 제안하고 있다. 대용량, 넓은 온도 범위, 높은 안전성 및 간섭 방지 리튬/나트륨 이온 배터리(리튬 대신 소금 성분을 쓰는 배터리) 에너지 저장 시스템을 개발합니다. 고체-액체 하이브리드 배터리의 핵심 부품을 최적화하고 본질안전형 전고체 배터리(액체 대신 고체를 넣은 안전한 배터리) 기술을 연구합니다. 11월 12일 20시 59분, \"그녀가 아는 차이 리안\"은 중국(닝보) 배터리 신에너지 산업 국제 정상 포럼을 추적하여 2026년부터 2027년까지 전고체 배터리가 파일럿 및 소규모 배치 생산 기간에 들어갈 것으로 예상된다고 지적했습니다. Shangshui Intelligent를 언급하면 11월 16일 가격이 14.21% 급등했습니다."},{"s":"탄소 제로 커피 하우스부터 글로벌 에너지 저장 솔루션까지, Fujian Ningde는 탄소 제로 미래 도시를 건설하기 위해 협력하고 있습니다.","so":"中国新闻网","tm":"11/15 21:06","c":1,"r":"cn","u":"https://www.chinanews.com.cn/cj/2026/11-15/10732461.shtml","p":1794744376,"a":1794806844,"t":"从零碳咖啡屋到全球储能解决方案 福建宁德聚力打造零碳未来城","su":"从零碳咖啡屋到全球储能解决方案 福建宁德聚力打造零碳未来城 中新网宁德11月15日电 (吴允杰)漫步福建省宁德市，“零碳”早已从纸面理念落地为可感可触的日常场景：在搭载光伏储能建筑一体化技术的“宁时光·零碳空间”咖啡屋，市民晒着阳光享用下午茶；东湖之上，游客乘“东湖之星”“东湖之光”纯电动游船饱览湖光山色；赤鉴湖畔，形似游艇的全球首个eVTOL零碳水上机场科技感十足……山海之间，一个零碳未来城正在持续生长。 能源结构绿色转型，是“零碳宁德”的根基。在宁德福鼎市台山岛上，全国首个离网型兆瓦级海岛微电网项目建设正酣。该项目创新氢氨转换技术，实现零碳转化发电，与锂电池形成“短时调峰+长时保供”双储能体系，总装机容量1.505兆瓦，可脱离大陆电网独立运行。"},{"s":"테슬라 실적 발표 대본: 로봇 공학, 자율 주행 및 에너지 저장에 크게 투자하고 자본 지출이 계속 확대되고 있습니다.","so":"财联社","tm":"11/15 10:43","c":1,"r":"cn","u":"https://www.cls.cn/detail/2434633","p":1794707026,"a":1794727091,"t":"特斯拉财报会实录：大举押注机器人、自动驾驶与储能 资本开支持续扩张","su":"① 머스크는 실적발표에서 테슬라가 \"제2차 세계대전 이후 미국에서 가장 빠른 산업 규모 확장\"을 겪고 있다고 말하고, 올해 자본 지출이 250억 달러를 초과할 것으로 예상되며 향후 2~3년간 계속 증가할 것이라고 거듭 강조했다. ②테슬라 경영진은 휴머노이드(사람을 닮은 로봇) 로봇, 자율주행 택시, 에너지 저장장치, 자체 개발 칩 등 4대 주요 사업을 중심으로 자본 지출을 계속 늘릴 것이라고 밝히며 시장의 핵심 질문에 답했다. 차이롄서, 7월 23일(편집자 Liu Rui) 테슬라는 수요일 동부 표준시 시장 마감 후 2분기 재무 결과를 발표했습니다. 차량 납품 및 에너지저장장치(전기를 저장해 두는 큰 배터리) 설치 데이터는 인상적이었지만 분기 매출총이익률 하락과 생산 확대에 대한 높은 투자로 시장 우려가 컸고, 장 마감 후 주가가 하락했다. 머스크 테슬라 최고경영자(CEO)는 실적 보고서 발표 후 컨퍼런스콜에서 “테슬라는 제2차 세계대전 이후 미국에서 가장 빠른 산업 규모 확장을 겪고 있다”며 “올해 자본 지출이 250억 달러를 넘어설 것으로 예상되며 향후 2~3년간 계속해서 성장할 것”이라고 거듭 강조했다."},{"s":"해외조사 및 선정 | 골드만삭스: 글로벌 배터리 수급 비율은 2029년 바닥을 칠 수 있고, 에너지 저장 성장은 초과분을 상쇄하기 어려울 것","so":"财联社","tm":"11/15 05:55","c":1,"r":"cn","u":"https://www.cls.cn/detail/2506034","p":1794689708,"a":1794727317,"t":"海外研选 | 高盛：全球电池供需比或2029年触底 储能增长难抵过剩","su":"① 미국은 전기차 배터리 과잉을 지속하고 있으나, 에너지 저장 배터리의 현지 생산 능력이 부족하다. ② 한국 배터리 업체들의 유럽 시장 점유율은 일부 안정됐지만, 중국의 수입 경쟁은 여전히 치열하다. ③ 국내 배터리셀 제조사들은 2027년과 2028년 이익 전망치를 평균 10% 하향 조정했는데, CATL의 에너지 저장장치 전환이 유망하다. 차이롄서, 10월 15일(편집자 Xia Junxiong) 골드만삭스는 10월 14일 글로벌 배터리 산업 조사 보고서를 발표했습니다. 이는 에너지 저장 시장의 급속한 확장으로 배터리 수요 전망이 개선되고 있지만, 글로벌 배터리 산업은 여전히 과잉 생산 능력, 지역 시장 수급 불균형 및 치열한 시장 경쟁에 직면해 있으며, 이는 업계가 사이클이 바닥을 쳤다는 것을 확인하기에 충분한 신호를 아직 보지 못했다는 것을 의미합니다. 은행은 중국 외 배터리 시장의 수급 공급률은 2027년을 바닥으로, 글로벌 시장은 2029년까지 수급 전환점이 이뤄지지 않을 것으로 내다봤다."},{"s":"화웨이, 새로운 20kW 가정용 배터리로 테슬라 파워월에 도전","so":"Electrek","tm":"11/15 01:25","c":1,"r":"us","u":"https://electrek.co/2026/11/14/huawei-set-to-challenge-tesla-powerwall-with-new-20-kw-home-battery/","p":1794673500,"a":1794698079,"t":"Huawei set to challenge Tesla Powerwall with new, 20 kW home battery","su":"이 하이테크 화웨이 홈 배터리 팩은 실리콘 카바이드 기술, AI 기반 에너지 관리 기능을 갖춘 테슬라의 최신 파워월을 저지하기를 희망합니다."},{"s":"에너지 저장 산업의 글로벌 협력을 촉진하기 위해 글로벌 에너지 저장 동맹 이니셔티브(Global Energy Storage Alliance Initiative) 발표","so":"财新","tm":"11/14 21:37","c":1,"r":"cn","u":"https:
