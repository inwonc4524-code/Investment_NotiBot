:root{color-scheme:dark;--bg:#262624;--card:#30302e;--card2:#3a3a37;--text:#faf9f5;--sub:#a6a39a;--line:#3e3e3a;--acc:#d97757;--red:#ef4444}

body{margin:0;background:var(--bg);color:var(--text);font:15px/1.55 'ChosunIlboMyungjo',Georgia,"Noto Serif KR",serif;-webkit-font-smoothing:antialiased}

.tabs{position:sticky;top:0;z-index:3;background:rgba(38,38,36,.96);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.tabrow{display:flex;gap:8px;overflow-x:auto;padding:12px 16px 10px;scrollbar-width:none}.tabrow::-webkit-scrollbar{display:none}
.tab{position:relative;flex:none;padding:9px 15px;border-radius:12px;border:1px solid var(--line);background:var(--card);

.ctrl button.on{background:var(--card2);border-color:var(--card2);color:var(--text)}
.ctrl .sep{flex:none;width:1px;background:var(--line);margin:2px 4px}

.note{margin:0 4px 10px;color:var(--sub);font-size:12px}
.none{color:var(--sub);margin:24px 4px;text-align:center}
.card{display:block;background:var(--card);border-radius:12px;padding:12px 14px;margin:8px 0;color:var(--text);text-decoration:none;transition:background .15s}
.card:hover{background:var(--card2)}.card:active{opacity:.75}
.meta{color:var(--sub);font-size:12px}
.title{font-weight:500;margin-top:3px}
.orig{color:var(--sub);font-size:12px;margin-top:3px}
.new{margin-left:4px;color:var(--red);font-size:11px;font-weight:700;letter-spacing:.3px}
.hot{display:inline-block;margin-right:6px;padding:0 6px;border-radius:4px;background:rgba(217,119,87,.16);color:var(--acc);font-weight:600}
.hot.big{background:var(--acc);color:#1f1e1d}
.newbar{display:block;width:100%;margin:2px 0 6px;padding:9px;border:0;border-radius:10px;background:rgba(239,68,68,.14);color:#fca5a5;font:inherit;font-size:13px;text-align:left}
.more{display:block;width:100%;margin:4px 0 0;padding:10px;border:1px dashed var(--line);border-radius:12px;background:transparent;color:var(--sub);font:inherit;font-size:13px}
footer{margin:36px 4px 0;padding-top:14px;border-top:1px solid var(--line);color:var(--sub);font-size:12px;line-height:1.7}
footer b{color:var(--text);font-weight:600}

#dim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:5}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:6;max-width:760px;margin:auto;max-height:82vh;overflow-y:auto;

.grab{width:38px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 12px}
.s-title{font-size:17px;font-weight:600;margin:4px 0 2px;line-height:1.45}
.s-label{margin:16px 0 4px;color:var(--acc);font-size:12px;font-weight:700;letter-spacing:.5px}
.s-sum{font-size:15px;line-height:1.75}.s-sum.empty{color:var(--sub);font-size:13.5px}
.s-btns{display:flex;gap:8px;margin-top:20px}
.s-btns a{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;padding:11px 6px;border-radius:10px;font:inherit;font-size:13.5px;line-height:1.3;text-decoration:none;
  background:var(--acc);color:#1f1e1d;font-weight:600}
.s-btns a.cl{background:transparent;border:1px solid var(--acc);color:var(--acc)}
.s-close button{width:100%;margin-top:8px;padding:11px;border-radius:10px;background:transparent;border:1px solid var(--line);color:var(--sub);font:inherit;font-size:14px}
.s-cnote{margin-top:8px;color:var(--sub);font-size:11.5px;text-align:center}
#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);z-index:9;max-width:90%;padding:10px 16px;border-radius:10px;background:#faf9f5;color:#1f1e1d;font-size:13.5px;box-shadow:0 6px 20px rgba(0,0,0,.4)}

ank of Canada), JPMorgan Chase, Morgan Stanley의 전략가들은 최근 미국 주식의 매도세가 끝날 가능성이 높다고 말했습니다. ② 모건스탠리는 조정이 마무리되고 S&P 500이 주가 폭 추세에 가까워져 하향 목표 범위인 7100~7300포인트에 접근하고 있다고 보고 있다. ③ JPMorgan Chase는 지난 목요일 미국 기술주의 매도가 투자자들에게 매수 기회를 창출했다고 말했습니다. Financial News Agency, 11월 10일(Liu Rui 편집자) 최근 Royal Bank of Canada Capital Markets, JPMorgan Chase 및 Morgan Stanley의 전략가들은 연구 보고서를 통해 고객에게 최근 미국 주식 매도세가 끝날 가능성이 높다고 말했지만 2027년에도 여전히 펀더멘털이 핵심 변수가 될 것임을 상기시켰습니다."},{"s":"미국 기술 급등, 석유 침체로 아시아 주식 반등: 시장 마무리","so":"Bloomberg.com","tm":"11/10 10:59","c":1,"r":"world","u":"https://www.bloomberg.com/news/articles/2026-11-09/stock-market-today-dow-s-p-live-updates","p":1794275940,"a":1794280986,"t":"Asian Stocks to Rally on US Tech Surge, Oil Slump: Markets Wrap"},{"s":"밤새 미국 증시 필라델피아 반도체 지수는 6.85% 상승 마감했다. 국내 AI 컴퓨팅 파워 산업 체인 구축이 가속화됐다. GEM 컴퓨팅 파워 ETF Guangfa(158049)의 기본 지수는 세션 동안 거의 4% 상승했습니다.","so":"Jiemian.com","tm":"11/10 10:53","c":1,"r":"cn","u":"https://m.jiemian.com/article/15315040.html","p":1794275580,"a":1794280986,"t":"隔夜美股费城半导体指数收涨6.85%，国产AI算力产业链建设加速，创业板算力ETF广发(158049)标的指数盘中最高涨近4%","su":"截至11月10日 09:53，创业板算力基础设施指数(970083)强势上涨2.65%，盘中最高涨近4%，成份股长芯博创上涨6.88%，新易盛上涨5.98%，中际旭创上涨5.75%，同飞股份，光库科技等个股跟涨。"},{"s":"미국 CPI는 10월 발표되며 연준의 금리 결정에 결정적인 변수가 될 예정이다.","so":"21财经","tm":"11/10 10:52","c":1,"r":"cn","u":"https://www.21jingji.com/article/20261110/herald/18341fdf7efaef7fe35cfd9b026c5980.html","p":1794275520,"a":1794298320,"t":"10月美国CPI将公布，将是美联储利率决议的最终决定性变量","su":"많은 기대를 모았던 미국 10월 CPI가 11월 10일 베이징 시간 21시 30분에 공식 발표됩니다. 이는 연준의 12월 금리 결정에 영향을 미치는 핵심 지표입니다. 연방기금 금리선물의 가격을 보면, 현재 시장에서는 연준이 12월에 금리를 25bp 인상할 확률이 최대 80%에 달해 완전 가격 수준에 근접할 것으로 예상하고 있습니다. 10월 비농업 지표는 기대치를 뛰어넘었습니다(165,000개의 신규 일자리 창출, 실업률은 4.1%로 하락, 시급은 전월 대비 0.4% 증가). 고용 측면은 더 이상 금리 인상에 대한 제약이 되지 않습니다. 12월 금리 인상 여부를 결정하는 최종 결정변수는 CPI다. 최근 많은 고위 연준 관리들이 매파적인 신호를 발표했습니다. 데일리 샌프란시스코 연은 총재, 무살렘 세인트루이스 연은 총재, 윌리엄스 뉴욕 연은 총재는 모두 인플레이션이 여전히 높으며 인플레이션을 더 줄여야 한다고 강조했습니다."},{"s":"사진과 잠재력이 있습니다 | 미국 증시는 2% 상승하며 본격적인 반격에 나섰고, 유가는 4% 하락하며 중동은 희망을 보였  2.35% 상승한 7,550포인트로 마감했습니다. 나스닥은 674포인트(2.74%) 오른 25,253포인트로 마감했다. S&P 500은 4월 8일 이후 최대 일일 상승률을 기록했고, 나스닥은 7월 30일 이후 최대 일일 상승률을 기록했습니다."},{"s":"기술주는 계속해서 반등하고 있으며, 미국 주식은 전반적으로 상승하고 있습니다.","so":"TVB","tm":"11/10 07:16","c":1,"r":"hk","u":"https://news.tvb.com/tc/1205466-%E7%A7%91%E6%8A%80%E8%82%A1%E6%8C%81%E7%BA%8C%E5%8F%8D%E5%BD%88%E7%BE%8E%E8%82%A1%E5%85%A8%E7%B7%9A%E5%90%91%E4%B8%8A","p":1794262560,"a":1794264193,"t":"科技股持續反彈 美股全線向上","su":"미국 3대 주가지수가 모두 2% 넘게 상승했다. 다우존스산업평균지수는 1,104포인트 오른 52,389포인트로 마감했다. S&P 500 지수는 173포인트 상승한 7,549포인트로 마감했습니다. 유가 하락과 기술주의 지속적인 반등으로 미국 증시는 상승세를 보였습니다. 다우지수는 357포인트 상승하며 초반에는 약간의 변동성을 보였지만 곧 상승 폭을 확대했습니다. 오후에는 1,300포인트 가까이까지 상승한 뒤 1,104포인트를 마감하며 중위권으로 복귀했습니다."},{"s":"S&P 500이 중기 손실을 없애고 비트코인이 반등하는 모습을 지켜보세요","so":"Bloomberg.com","tm":"11/10 07:00","c":1,"r":"us","u":"https://www.bloomberg.com/news/videos/2026-11-09/etf-iq-11-9-2026-video","p":1794261636,"a":1794264173,"t":"Watch S&P 500 Erases Midterm Losses, Bitcoin Bounce"},{"s":"반도체주 폭락에 급등했던 원·달러…다음은 美연준 금리 향방 촉각","so":"뉴시스","tm":"11/10 07:00","c":1,"r":"kr","u":"https://www.newsis.com/view/NISX20261109_0003860939","p":1794261600,"a":1794264171,"su":"[서울=뉴시스]김래현 기자 = 원·달러 환율이 반도체와 관련한 변수들에 반응하고 있다. 향후 AI와 관련된 이슈가 불거질 때마다 환율이 출렁일 수 있다는 전망이다.10일 서울 외환시장에 따르면 전날 원·달러 환율은 9.5원 내린 1347.1원으로 주간 거래를 마무리했다.환율은 미국 민주당이 상원과 하원을 모두 장악하는 중간 선거 결과가 나온 이후인 지난 6.."},{"s":"9년 만에 처음! 미국 기술주, \"시장보다 싼\" 시대 진입","so":"财联社","tm":"11/10 06:49","c":1,"r":"cn","u":"https://www.cls.cn/detail/2528180","p":1794260967,"a":1794264176,"t":"九年来首次！美股科技股迈入“比大盘便宜”时代","su":"① Truist Wealth의 최고 투자 책임자인 Keith Lerner는 이번 주 보고서에서 S&P 500 기술 부문의 선도 주가 수익 비율이 현재 약 17배이며, 이는 2017년 이후 처음으로 더 넓은 시장의 선도 주가 수익 비율(18배)보다 낮다고 썼습니다. ②2025년 10월 고점에 해당 업종의 선도 주가수익률은 32배나 높았습니다. 파이낸셜뉴스통신, 11월 8일(샤오샹 편집장) 월스트리트는 중간선거가 끝난 다음 날에도 여전히 카니발 열기에 휩싸였다. 목요일에는 허를 찔려 2020년 뉴크라운 전염병 붕괴 이후 기술주에 대한 일일 최대 급락을 겪었다. 그러나 AI 컨셉주를 제외한다면 대부분의 주식에 미치는 영향은 크지 않을 것이다."},{"s":"미국 주식일기│3대 지수 복수 반등, 다우지수 1100포인트 급등, 엔비디아 단독 '행복' 하락","so":"星島頭條","tm":"1 cent-as-softer-oil-prices-ease-inflation-worries.html","p":1794193560,"a":1794243554,"t":"Gold gains as lower oil prices temper inflation fears; U.S. inflation in focus","su":"금은 유가 하락으로 인플레이션 우려가 완화되면서 상승했고, 투자자들은 이번 주 연준의 금리 전망을 결정할 수 있는 인플레이션 데이터를 기다리고 있었습니다."},{"s":"엔비디아는 급락했지만 기술주는 반등하고 유가는 폭락했습니다.","so":"France 24","tm":"11/09 11:55","c":1,"r":"us","u":"https://www.france24.com/en/live-news/20261109-tech-firms-claw-back-some-losses-after-midterms-rout-eyes-on-nvidia","p":1794192954,"a":1794243556,"t":"Nvidia plunges but tech shares rebound, oil prices slump"},{"s":"나스닥은 12월 6일부터 대대적인 개혁을 거칩니다. 시장은 매일 한 시간만 문을 닫고, 새로운 야간 거래는 낮에는 아시아에 집중됩니다.","so":"21财经","tm":"11/09 11:09","c":1,"r":"cn","u":"https://www.21jingji.com/article/20261109/herald/c8ef02faf0188ad53135b6492d58c2a3.html","p":1794190173,"a":1794216448,"t":"纳斯达克12月6日起重大改革：每天仅休市1小时，新增夜盘对准亚洲白天","su":"Xinhua Finance에 따르면 Nasdaq은 2026년 12월 6일에 \"23/5\" 거래 시스템을 공식적으로 시행할 예정입니다. 연속 거래는 하루 23시간, 주 5일 열려 있으며 매일 20:00~21:00(동부 표준시) 사이에 1시간만 마감됩니다. 이 계획은 미국 증권거래위원회(SEC)의 승인을 받았으며, 나스닥이 1971년 창설된 이후 40여년 만에 최대 규모로 조정된 거래 체계다. 거래시간도 대폭 확대됐다. 주간과 야간이 명확하게 구분됐다. 새로운 시스템은 거래 주간을 일요일 21:00에서 금요일 20:00까지 연장했습니다. 현재 4시~9시 30분 프리마켓, 9시 30분~16시 정규, 16시~20시 애프터마켓의 3개 섹션이 '낮 시간대'로 통합되고, 새로 생성된 '야간 시간대'인 21시부터 다음날 4시까지가 함께 글로벌 거래 기간을 구성합니다."},{"s":"Nvidia가 하락하고 유가가 하락하더라도 주식은 반등합니다.","so":"Reuters","tm":"11/09 10:46","c":1,"r":"world","u":"https://www.reuters.com/world/asia-pacific/global-markets-global-markets-2026-11-09/","p":1794188760,"a":1794264206,"t":"Stocks rally even as Nvidia falls, oil drops"},{"s":"미국 주식의 AI 급락으로 인해 QDII 실적에 큰 차이가 발생했습니다. 자산 재조정으로 인해 자금이 홍콩 주식으로 다시 유입될 수 있습니다.","so":"第一财经","tm":"11/09 08:57","c":1,"r":"cn","u":"https://www.yicai.com/brief/103431550.html","p":1794182220,"a":1794214242,"t":"美股AI重挫致QDII业绩大分化 资产再平衡或驱动资金回流港股","su":"Securities Times에 따르면 최근 미국 기술주가 급격한 조정을 겪었고, AI 부문이 집단적 급락을 겪었으며, 많은 미국 주식의 활성 주식을 공모하는 QDII의 순 가치가 집단적으로 압박을 받아 11월 5일 많은 제품의 순 가치가 7% 이상 하락했습니다."},{"s":"지난 금요일 밤 미국 주요 주식의 성과 개요 | 인스턴트 뉴스 - 뉴스","so":"etnet 經濟通","tm":"11/09 08:56","c":1,"r":"hk","u":"https://www.etnet.com.hk/www/tc/news/news-article.php?section=categorized&category=latest&newsid=2026110931","p":1794182160,"a":1794230059,"t":"主要美股上周五晚表現一覽 | 即時新聞 - 新聞","su":"2026-09-11 07:56 지난 금요일 밤 미국 주요 주식의 성과 개요 요약 면책 조항 이 내용은 기존 시장 데이터 및 뉴스 소스를 기반으로 인공 지능에 의해 생성되었으며 참고용입니다. 해당 내용은 \"Economics\"의 견해나 입장을 대변하지 않으며, 어떠한 투자 조언도 구성하지 않습니다. AI가 생성한 정보에는 오류, 누락, 일탈 등이 있을 수 있으므로, 투자 결정을 내리기 전에 사용자가 직접 해당 내용을 확인하거나 전문가의 조언을 구해야 합니다. \"이코노믹스\"는 본 내용을 신뢰하여 발생하는 어떠한 손실이나 손해에 대해서도 책임을 지지 않습니다. ▷ 구글은 0.78% 상승한 283.93달러에 마감 ▷ 아마존은 0.35% 하락한 259.30달러에 마감 ▷ 애플은 0.52% 하락한 342.37달러에 마감"},{"s":"AI에 올인할까 맘 편한 지수에 맡길까…S&P500 ETF 선택 가이드","so":"한경매거진","tm":"11/09 08:51","c":1,"r":"kr","u":"https://magazine.hankyung.com/money/article/202610154508c","p":1794181860,"a":1794230029,"su":"시장을 이기는 종목을 찾기보다 시장의 성장에 오래 동참하는 것, 대표 지수 투자가 장기 투자의 기본으로 꼽히는 이유다. S&P500을 활용한 ETF도 종목 구성과 투자 비중에 따라 전략이 달라지는 만큼, 자신의 투자 목적에 맞는 선택이 필요하다. [ETF 심층해부] 미국 대표 주가 지수인 스탠더드앤드푸어스(S&P)500과 나스닥100에 상장지수펀드(ETF)를 통해 꾸러미로 투자하는 대표 지수 추종 투자는 전 세계 기관투자자와 개인투자자 모두에게 가장 기본적이고 핵심적인 투자 방법이다."},{"s":"WSJ 일본판 : 미주 펀드는 9.9% 높은 테크 주식 급락 후에도","so":"毎日新聞","tm":"11/09 08:14","c":1,"r":"jp","u":"https://mainichi.jp/articles/20261109/wsj/00m/020/003000c","p":1794179640,"a":1794242663,"t":"WSJ日本版：米株ファンドは9.9％高 テック株急落後も","su":"펀드 투자자는 10월 AI 관련 주식 매출을 견뎌야 했다. 이 하락은 인공적으로는 느껴지지 않고, 판매가 지적인 것이었는지는 아직 모른다."},{"s":"설문 조사: 경제학자의 80% 이상이 연준이 이번 주와 내년 3월 말 전에 다시 금리를 인상할 것으로 예상합니다!","so":"财联社","tm":"11/09 07:39","c":1,"r":"cn","u":"https://www.cls.cn/detail/2483155","p":1794177594,"a":1794214243,"t":"调查：逾八成经济学家预计美联储本周加息 明年3月底前有望再出手！","su":"① 인플레이션이 여전히 완고하다는 것을 보여주는 지난 금요일 공식 미국 CPI 데이터의 영향을 받은 최근 업계 조사에 따르면, 이번 달 금리를 동결하지 않겠다는 이전의 상대적 주류 연준의 약한 합의는 \"붕괴를 선언\"했습니다. ② 현재 조사에 참여한 대부분의 경제학자들은 연준이 수요일에 금리 인상을 발표하고 내년 3월 말 이전에 적어도 한 번 금리를 인상할 것이라고 믿고 있습니다. 파이낸셜 뉴스 에이전시, 9월 15일(편집자 Xiaoxiang) 인플레이션이 여전히 완고하다는 것을 보여주는 지난 금요일 공식 미국 CPI 데이터의 영향을 받은 최근 업계 조사에 따르면, 이전에는 상대적으로 주류였던 연준이 이번 달 금리를 동결하지 않겠다는 강력한 합의가 \"붕괴를 선언\"했습니다. 조사에 참여한 대부분의 경제학자들은 현재 연준이 수요일에 금리 인상을 발표하고 내년 3월 말 이전에 적어도 한 번 더 금리 인상을 발표할 것으로 믿고 있습니다."},{"s":"\"미국 주식\" 텍사스 주지사, 데이터 센터 AI/페이 반탄을 싫어하지 않는다고 밝혔습니다.","so":"MoneyDJ","tm":"11/09 07:34","c":1,"r":"tw","u":"https://www.moneydj.com/kmdj/news/newsviewer.aspx?a=4936a376-8a3c-41c8-a21d-d48010d0245a","p":1794177240,"a":1794214250,"t":"《美股》德州州長澄清不討厭資料中心AI/費半彈- 新聞","su":"금요일(6일) AI 칩과 데이터센터 인프라 컨셉주가 헐값 사냥이 돌입하면서 전반적으로 반등했다. 그러나 나스닥 지수는 여전히 4주 연속 하락세를 이어갔다. 투자자들은 AI 거래가 다음에 어떻게 발전할지 결정하기 위한 단서를 찾고 있습니다. 다우존스산업평균지수는 0.46%(237.33포인트) 하락 마감했다."},{"s":"주식시장 '내부고발자' 모건스탠리: 미국 주식 매도세는 이제 끝나가고 있으며 앞으로 2~3주는 포지션을 추가하기에 좋은 시기다.","so":"21财经","tm":"11/09 07:29","c":1,"r":"cn","u":"https://www.21jingji.com/article/20261109/herald/77023f1d35e94757fb6a41141ae84922.html","p":1794176964,"a":1794214244,"t":"股市“吹哨人”大摩：美股抛售接近尾声 未来两到三周是加仓好时机","su":"월스트리트는 비관적이지 않다! 며칠 전 주식시장의 '내부고발자'로 알려진 모건스탠리는 미국 증시 매도세가 이제 끝나가고 있으며 앞으로 2~3주가 포지션을 추가하기에 좋은 시기라고 밝혔다. 모건스탠리: 포지션을 추가하기 좋은 시기 인공지능(AI) 열풍에 대한 몇 달 간의 불안이 11월 2일부터 6일까지 주에 글로벌 시장 쇼크로 바뀌었습니다. 지난 목요일(11월 5일) 대규모 매도가 미국 주식 급락을 촉발해 많은 투자자들을 허둥지둥하게 만들었습니다. 지난 금요일(11월 6일) 일부 자금이 시장에 돌아오자 미국 증시는 하락을 멈추고 반등했습니다. S&P 500 지수는 0.31%, 나스닥은 1% 이상, 필라델피아 반도체 지수는 4% 이상 상승했습니다. 위에서 언급한 변동성을 경험한 후 월스트리트 전략가 그룹은 고객에게 상황을 활용할 것을 촉구하고 있습니다. 모건스탠리의 미국 주식 전략가 마이크 윌슨은 \"향후 2~3주 동안 이 부분에 대한 노출을 늘려야 한다\"고 말했다."},{"s":"AI를 사용하여 Wash의 입을 벌리시겠습니까? 월스트리트 기관, \"WarshGPT\" 출시","so":"财联社","tm":"11/09 06:33","c":1,"r":"cn","u":"https://www.cls.cn/detail/2430794","p":1794173628,"a":1794214246,"t":"用AI撬开沃什的嘴？华尔街机构推出“WarshGPT”","su":"①F/m Investments는 지난 주에 \"WarshGPT\"를 공식 출시했습니다. ②이것은 Warsh가 공개한 거의 1,800개의 문서와 음성 녹음을 분석하여 사용자가 경제 또는 통화 정책과 관련된 문제를 분석할 수 있는 방법을 이해하는 데 도움을 주는 인공 지능 기반 도구입니다. Financial Associated Press, 7월 20일자(Editor Xiaoxiang) F/m Investments 사무실은 워싱턴 D.C.에 위치해 있으며 연방준비은행 본부에서 차로 단 몇 분 거리에 있습니다. 그러나 연준이 새 지도자를 맞이한 후, F/m Investments의 CEO인 Alexander Morris는 물리적 거리가 심리적으로 매우 멀다고 느꼈습니다... 케빈 워시 연준 의장은 지난 5월 취임 이후 연준의 미래지향적 커뮤니케이션 메커니즘에 대한 포괄적인 개혁에 착수했습니다. 이러한 움직임은 연준이 금리를 어떻게 조정할지 예측하는 데 부분적으로 의존하는 투자 전략을 갖고 있는 Morris와 같은 시장 참여자들에게 경종을 울렸습니다."},{"s":"연준은 예상대로 확고한 입장을 유지했으며 위원 4분의 1이 반대표를 던졌습니다.","so":"财联社","tm":"11/09 05:01","c":1,"r":"cn","u":"https://www.cls.cn/detail/2440646","p":1794168107,"a":1794214247,"t":"美联储如预期按兵不动 1/4成员投下反对票","su":"① 연준은 전반적인 시장 기대에 맞춰 연방기금 금리 목표 범위를 3.5~3.75% 사이에서 유지하겠다고 밝혔다. 마지막 금리 인하는 2025년 12월로 거슬러 올라갑니다. ② 이 결의안에는 3명의 반대표가 있었고, 3명은 긴축 정책에 대한 내부 지지가 높아지는 것을 반영하여 금리를 25bp 인상하는 것을 선호했습니다. Financial Associated Press, 7월 30일(자오하오 편집자) 베이징 시간으로 목요일(7월 30일) 이른 아침, 연준은 전반적인 시장 기대에 맞춰 연방기금 금리 목표 범위를 3.5~3.75%로 유지할 것이라고 발표했습니다. 이번 결정은 연준이 아무런 조치도 취하지 않은 5번째 연속이다. 마지막 금리 인하는 2025년 12월로 거슬러 올라간다. 결의안 발표 전 시장에서는 금리를 25bp 인상할 확률을 30%로 예상했다."},{"s":"미국 주식 마감: 기술 하락, 나스닥 지수 2% 이상 하락, 배당금, 에너지 거대 기업이 신기록 달성","so":"财联社","tm":"11/09 04:58","c":1,"r":"cn","u":"https://www.cls.cn/detail/2507375","p":1794167916,"a":1794214932,"t":"美股收盘：科技重挫纳指跌超2% 红利、能源巨头再创新高","su":"① Jen-Hsun Huang은 시장을 위로했습니다. 모든 것이 지나갈 것입니다. ② 필라델피아 반도체 지수는 2008년 이후 가장 긴 연속 하락세를 기록했습니다. ③ '미국산 마오타이' 코카콜라가 최고치를 경신했다. ④ 애플의 폴더블 스크린은 첫날 사전예약을 받고 내년까지 출하가 예정돼 있다. Financial News Agency, 10월 17일(편집자 Shi Zhengcheng) 어젯밤과 오늘 아침, 미국 증시를 다시 기술주 매도세가 휩쓸었고, 나스닥 지수는 2% 이상 하락했습니다. 동시에, 유가 상승은 에너지 부문을 뒷받침했고, 안전자산 자금은 제약, 소매업과 같은 방어 대상에 계속해서 쏟아졌습니다. 마감 기준 S&P 500 지수는 1.09% 하락한 7659.44포인트를 기록했습니다. 나스닥 종합지수는 2.14% 하락한 26140.03포인트를 기록했습니다. 다우존스 산업평균지수는 0.34% 하락한 52002.41포인트를 기록했습니다. S&P와 나스닥도 금요일에 다시 50일 이동평균선 아래로 떨어졌습니다."},{"s":"미국 주식은 단기 매도 압력을 받고 있으며, 할인된 가격으로 시장에 진입할 때입니다.","so":"經濟日報","tm":"11/09 02:19","c":1,"r":"tw","u":"https://money.udn.com/money/story/123398/9865697?from=edn_hotestlist_storybottom","p":1794158346,"a":1794214252,"t":"美股短期賣壓 折價進場時機到","su":"월스트리트의 많은 주식시장 전략가들은 중간선거 이후 미국 주식에 대한 단기 매도 압력이 투자자들에게 할인된 매수 기회를 제공했다고 믿고 있으며, 고객들에게 시장 진입 기회를 활용할 것을 촉구하고 있다."},{"s":"[모닝포스트] 연준이 \"비둘기 방출\", 미국 증시 강세; 국제 금값이 급등했다. 오늘 GEM 칩 지수가 발표되었습니다. 룰루레몬, 장중 급락","so":"财联社","tm":"11/09 02:09","c":1,"r":"cn","u":"https://www.cls.cn/detail/2473774","p":1794157752,"a":1794214934,"t":"【早报】美联储“放鸽”，美股走强；国际金价，大幅上涨；创业板芯片指数，今日发布；Lululemon，盘后暴跌","su":"① 10개 부서: 사회적 자본이 초기, 소규모, 장기 및 하드 기술에 투자하도록 유도하기 위해 국가 중소기업 개발 기금의 2단계 설립 ② GEM 칩 지수가 오늘 발표되었습니다. ③ 미국 주식이 상승세를 마감했고, 금광 주식이 강세를 보였습니다. ④ 상하이의 많은 은행들이 1991년 이전에 태어난 사람들은 새로운 40년 모기지를 신청할 수 없다는 점을 분명히 했습니다. ⑤ Zhongji InnoLight는 자사주 매입과 함께 3일 연속 자사주 매입을 실시했습니다. amount exceeding 800 million yuan. 매크로뉴스 1. 황링(Huang Ling) 상무부 대변인은 지난 3일 열린 정례 기자회견에서 미국은 중국의 거듭된 주장에도 불구하고 이란 관련 제재를 이유로 중국 기업과 국민을 반복적으로 제재해왔다고 밝혔다. 중국은 이에 대해 강한 불만을 품고 단호히 반대한다. 중국은 미국이 즉각 잘못을 시정하고 관련 중국 기업과 국민에 대한 제재를 해제할 것을 촉구한다. 중국은 우리 기업과 공민의 정당한 권익을 확고히 수호할 것입니다."},{"s":"워시는 오늘 밤 국회의사당을 방문합니다! 월스트리트는 우리가 계속해서 시장을 '부인'하면 뭔가 잘못될 수 있다고 우려하고 있습니다.","so":"财联社","tm":"11/09 00:47","c":1,"r":"cn","u":"https://www.cls.cn/detail/2425499","p":1794152846,"a":1794214936,"t":"沃什今晚造访国会山！华尔街担心：要再和市场“卖关子”可能会出事","su":"① 취임 이후, 케빈 워시(Kevin Warsh) 연준 의장은 금리 방향을 밝히는 것을 피하려고 노력해 왔으며, 투자자, 분석가 및 기타 정책 입안자에게 중요한 또 다른 사항, 즉 경제가 어려움에 직면할 때 그는 어떻게 대응할 것인가?를 무심코 모호하게 만들었습니다. ② Warsh가 오늘 밤 국회의사당으로의 이틀간의 여행을 공식적으로 시작하면서 연준 감시자들은 인플레이션, 노동 시장 및 경제 성장에 대한 그의 견해에 세심한 주의를 기울일 것입니다. Financial News Agency, 7월 14일(Editor Xiaoxiang) 케빈 워시 연준 의장은 취임 이후 금리 방향을 밝히지 않으려고 최선을 다했습니다. 의도치 않게 그는 투자자, 분석가 및 기타 정책 입안자에게 중요한 또 다른 사항, 즉 경제가 어려움에 직면할 때 어떻게 대응할 것인지를 모호하게 만들었습니다."},{"s":"기술주의 \"고통스러운\" 조정은 금리 인상 기대를 방해하지 않을 것입니다. Fed Daley는 여전히 추가 긴축 정책을 선호합니다.","so":"财联社","tm":"11/09 00:04","c":1,"r":"cn","u":"https://www.cls.cn/detail/2527938","p":1794150250,"a":1794214938,"t":"科技股“痛苦”调整难阻加息预期 美联储戴利仍倾向进一步收紧政策","su":"① Mary Daly 샌프란시스코 연준 총재는 연준이 지속적으로 높은 인플레이션을 억제하기 위해 금리를 더 인상해야 할 것으로 예상한다고 금요일에 말했습니다. ② 향후 금리 인상 시기와 범위는 아직 알 수 없으며, 연준은 신흥 경제 변수를 종합적으로 고려할 필요가 있다. ③ 그녀는 최근 기술주의 하락이 투자자들을 고통스럽게 만들었다고 인정했지만, 이번 조정은 일반적으로 여전히 질서정연합니다. Financial Associated Press, 11월 7일(편집자 Niu Zhanlin) 메리 데일리(Mary Daly) 샌프란시스코 연준 총재는 금요일에 연준이 지속적인 높은 인플레이션을 억제하기 위해 금리를 더 인상해야 할 것으로 예상한다고 말했습니다. 다만, 경기 전망이 불투명한 상황에서 향후 금리 인상 시기와 규모는 아직 미지수다. 데일리는 이날 인터뷰에서 \"통화정책을 더욱 긴축해야 할 것으로 기대한다\"고 말했다. 금리를 언제 올릴지, 얼마나 인상할지 아직 불투명하다고 강조했다. 연준은 끊임없이 등장하는 다양한 경제변수를 종합적으로 고려해야 한다."},{"s":"[월스트리트부터 루자쭈이까지 투자팁 스페이스X의 연간 매출은 1000억 달러를 넘을 것으로 예상된다. 국내 상업용 항공우주는 여러 가지 혁신을 이루었고 개발이 가속화되었습니다. 기회를 잡는 방법은 무엇입니까?","so":"第一财经","tm":"11/08 23:05","c":1,"r":"cn","u":"https://www.yicai.com/vip/news/103431444.html","p":1794146737,"a":1794214940,"t":"[ 从华尔街到陆家嘴 投资秘籍 SpaceX年化收入有望破千亿美元 国内商业航天多点突破加速发力 机遇如何把握？","su":"현지 시간으로 지난 금요일, 제33차 Barron's 투자 컨퍼런스에서 가상 노변 인터뷰가 진행되었습니다. 머스크는 원격으로 참여해 다수의 블록버스터 예측을 내놨다. 올해 12월 스페이스X의 연간 매출은 1000억 달러를 넘을 것으로 예상되고, 내년 12월 연간 반복 매출은 5000억 달러를 넘을 수도 있다. SpaceX가 최근 발표한 2026년 3분기 재무 보고서에 따르면 보고 기간 동안 회사의 수익은 145억 8천만 달러로 전년 대비 161억 달러 증가했습니다."},{"s":"[모닝포스트] 10월 연준이 금리를 인상할 확률이 급락했다. 원유와 금 모두 상승했습니다. 마이크론 테크놀로지(Micron Technology)의 4분기 매출과 이익이 기대치를 초과했습니다.","so":"财联社","tm":"11/08 21:16","c":1,"r":"cn","u":"https://www.cls.cn/detail/2496760","p":1794140186,"a":1794214941,"t":"【早报】美联储10月加息概率，大幅回落；原油、黄金双双上涨；美光科技，Q4营收利润双超预期","su":"① 시진핑: 포용적·기초적·기본적 민생 건설 강화 ② 중앙은행: 10월 8일 3개월간 1조2000억 위안 규모의 매입 역환매 작업을 실시할 예정이다. ③ 미국 최대 기술주가 3% 이상 상승했고, 인텔은 3% 이상 상승했다. ④ 애플이 스마트 홈 시장에 진출할 계획이다. ⑤ 하이얼 스마트홈과 몽타주 테크놀로지가 환매 진행을 발표했다. 매크로 뉴스 1. 10월 1일 발행되는 '치시' 잡지 19호에는 시진핑 중공중앙 총서기, 국가주석, 중앙군사위원회 위원장이 쓴 '보편적, 기본적, 기본적 민생 건설 강화'라는 중요한 글이 게재될 예정입니다. 2012년 11월부터 2026년 1월까지 시진핑 총서기가 한 중요한 발언에서 발췌한 내용이다. 기사에서는 중국식 현대화는 민생을 최우선으로 생각한다는 점을 강조하고 있다. 더 나은 삶을 향한 국민의 열망이 우리의 목표입니다. 우리의 목표는 야심적이고 단순합니다. 결국, 국민들이 더 나은 삶을 살 수 있도록 하는 것입니다. 우리는 발전 과정에서 인민의 생활을 보장하고 개선하는 것을 견지해야 하며 더 나은 삶을 창조하기 위한 공동 노력을 장려하고 더 나은 삶에 대한 인민의 열망을 끊임없이 실현해야 합니다."},{"s":"[모닝포스트] 연준이 다음 주 금리를 인상할 확률이 90%까지 치솟았다. 미국 주식과 금 모두 상승했습니다. 전국위원회의 최신 배치! 컴퓨팅 인프라를 더욱 개선하세요.","so":"财联社","tm":"11/08 20:46","c":1,"r":"cn","u":"https://www.cls.cn/detail/2481328","p":1794138382,"a":1794216073,"t":"【早报】美联储下周加息概率，飙至90%；美股、黄金齐涨；国常会最新部署！进一步完善算力基础设施","su":"①최근 전국상임위원회 배치! 컴퓨팅 파워 인프라 더욱 개선 ② 8월 미국 CPI는 시장 기대치에 맞춰 전년 대비 3.4% 상승 ③ 미국 3대 주가지수 종합 마감 ④ 허위 정보 유포 혐의로 4명이 증권감독관리위원회에 의해 처벌됨 ⑤ CATL: 어제 처음으로 98356,"t":"四部门发文：明确有关创新药不纳入门诊次均药品费用增幅","su":"국가위생건강위원회, 국가의료보험국, 국가중의약국, 국가질병통제예방총국은 오늘(10일) 혁신적인 약물의 안전하고 합리적인 배포 및 사용의 핵심 측면에 초점을 맞춘 \"혁신 약물의 안전하고 합리적인 배포 및 사용 개선에 관한 고시\"를 발표했습니다."},{"s":"과연 제약, 자회사의 창약 벤처를 흡수 합병","so":"日本経済新聞","tm":"11/10 13:58","c":1,"r":"jp","u":"https://www.nikkei.com/article/DGXZQOMG00002_Q6A111C2000000/","p":1794286702,"a":1794298360,"t":"科研製薬、子会社の創薬ベンチャーを吸収合併","su":"과연제약은 자회사에서 창약벤처인 ARTham Therapeutics(도쿄·분쿄)를 흡수합병한다고 발표했다. 합병의 효력 발생일은 12월 31일을 예정한다. 그룹 내 경영자원의 집중과 조직운영의 효율화를 목표로 한다. 과연제약을 존속회사, ARTham을 소멸회사"},{"s":"4개 부서에서 문서 발행: 혁신적 약물의 안전하고 합리적인 배포 및 사용 강화","so":"Jiemian.com","tm":"11/10 13:40","c":1,"r":"cn","u":"https://m.jiemian.com/article/15315560.html","p":1794285619,"a":1794298357,"t":"四部门发文：加强创新药安全合理配备使用","su":"첫째, 2급 이상 의료기관은 혁신의약품의 입회제도와 업무프로세스를 최적화·개선하고, 약학관리치료위원회 회의를 적시에 개최하며, 사업역량과 진단·치료 수요를 바탕으로 혁신의약품을 기관의 의약품 카탈로그에 적시에 포함시켜야 한다. 도립병원이 선도적인 역할을 할 수 있도록 단계적으로 추진한다. 두 번째는 의료지식과 의료보험지급정책에 대한 정기적인 조직과 훈련을 요구하는 것이다. 혁신적인 약물의 임상적 사용에 대한 전문가 합의를 적시에 수집 및 발표하고 충분한 증거 기반 의학을 갖춘 약물을 임상 진단 및 치료 지침에 적시에 포함시킵니다. 세 번째는 의약품 관련 의료서비스 가격 항목을 실시하고 지원 및 보장 조치를 더욱 강화하며 혁신 의약품 사용을 위한 정책 환경을 최적화하는 것입니다. 넷째, 의료기관 내 약품종수 및 규제에 대한 제한이 없음을 강조하고, 평균 외래약가 인상, 평균 입원약가 인상 등 공공의료기관 성과모니터링 지표에 해당 혁신신약이 포함되지 않음을 명확히 하겠다."},{"s":"홍콩 증권 연계 혁신 의약품 및 의료 ETF Fuguo(159506)가 시장의 주목을 받았습니다.","so":"Jiemian.com","tm":"11/10 10:48","c":1,"r":"cn","u":"https://m.jiemian.com/article/15314123.html","p":1794275282,"a":1794280995,"t":"港股通创新药医疗ETF富国(159506)备受市场关注","su":"截至2026年11月10日 09:32，恒生港股通创新药及医疗保健指数(HSSCHI)强势上涨2.57%，成分股金斯瑞生物科技上涨9.58%，精锋医疗-B上涨5.22%，英矽智能上涨4.89%，云顶新耀，映恩生物-B等个股跟涨。（以上所列股票仅为指数成份股，无特定推荐之意） 值得注意的是，该基金跟踪的恒生港股通创新药及医疗保健指数估值处于历史低位，最新市净率PB为3.07倍，低于指数近1年98.88%以上的时间，估值性价比突出。 港股通创新药医疗ETF富国(159506)紧密跟踪恒生港股通创新药及医疗保健指数，恒生港股通创新药及医疗保健指数反映可经港股通买卖，从事创新药、生物技术、医疗保健设备及医疗及医学美容服务的香港上市公司之表现。"},{"s":"바이엘, 블록버스터 잠재력을 지닌 뇌졸중 예방약에 대한 FDA 승인 획득","so":"Endpoints News","tm":"11/10 09:12","c":1,"r":"us","u":"https://endpoints.news/bayer-wins-fda-approval-for-stroke-prevention-drug-sun  승인된 세계 최초의 CAR-T 세포치료제입니다. CLDN18.2 양성, HER2 음성, 최소한 2차 치료에 실패한 환자에게 적합합니다."},{"s":"경산성 개산 요구, 바이오 의약의 제조 기술 개발과 거점 정비의 강화 목표","so":"日経バイオテクONLINE","tm":"11/08 20:30","c":1,"r":"jp","u":"https://bio.nikkeibp.co.jp/atcl/news/p1/26/09/18/15034/","p":1794137437,"a":1794148478,"t":"経産省概算要求、バイオ医薬の製造技術開発と拠点整備の強化目指す","su":"경제산업성은 2027년도 바이오 관련 예산으로 전년도 당초 예산비 513.2% 증가한 2129억엔을 요구했다. 2027년도부터 AMED 대상 경비인 '의료·건강추진사업'에서 '차세대치료·진단실현을 위한 창약기반기술개발사업'에서 새로운 테마를 설정함으로써 2026년도 예산비 151.7% 증가한 146억엔을 요구했으며, '재생의료·유전치료 산업화를 위한 2기 5개 기술 사업 또 2021년도, 2022년도의 보정예산으로 총 3500억엔을 기금으로 시작한 '창약벤처 에코시스템 강화사업'에 대해 2027년도에는 320억엔을 추가할 요구가 되었다. 본지에서는 경산성 예산 중 의약품·재생의료·의료기기·헬스케어 관련, 그린바이오 관련, 기타 바이오 관련, 독립행정법인의 운영비 교부금, 특허청의 바이오 관련 사업 등을 바이오 관련 예산으로 집계하고 있다."},{"s":"의약품 보험 게임은 '하나의 보험, 하나의 정책' 단계에 진입했으며 혁신적인 제약회사는 상업 보험과의 대화 방법을 모색하고 있습니다.","so":"第一财经","tm":"11/08 20:14","c":1,"r":"cn","u":"https://www.yicai.com/news/103431200.html","p":1794136470,"a":1794207264,"t":"药险博弈进入“一保一策”阶段，创新药企探寻商保对话路径","su":"{{aisd}} AI 생성 면책조항 제약회사 액세스 팀은 새로운 딜레마에 빠질 수 있습니다. 통합된 카탈로그가 없고 \"하나의 보증, 하나의 정책\"만 있을 뿐입니다. 상업 보험 시장은 정보가 분산되어 있고, 규칙이 혼란스럽고, 여러 질병 분야에서 보험 부채와 지급 조건이 중복되어 접근 기회를 선별하고 우선순위를 정하기가 어렵습니다. 한 제약회사의 인터뷰 대상자는 신약이 출시된 후 \"희민바오를 도시마다 운영하면서 지역 희민바오 특수 의약품 카탈로그와 전국 상업 보험 혁신 의약품 카탈로그의 변화를 동시에 모니터링\"해야 한다고 언급한 적이 있습니다. 상업용 보험이 혁신적인 의약품의 상용화를 위한 중요한 지불 수단으로 자리잡고 있습니다. 그러나 기본 의료보험의 '국가 1게임'에 비해 상업 보험 시장은 더욱 세분화되어 있습니다. 국민을 위한 200개 이상의 '1시 1정책' 혜택이 있고, 백만 달러 의료 보험, 전문 의약품 보험과 같은 상품은 피보험자 그룹, 약물 접근 및 보상 한도 측면에서 다양합니다. 초과 손실 위험 노출에 대한 보험 회사의 강화와 함께, 혁신적인 약물의 \"출시 시 보험\"은 점차 과거의 일이 되었습니다."},{"s":"State Street SPDR S&P 생명공학 ETF(XBI) | 주가 및 최신 뉴스","so":"Reuters","tm":"11/08 19:15","c":1,"r":"us","u":"https://www.reuters.com/markets/companies/XBI/financials/","p":1794132920,"a":1794145920,"t":"State Street SPDR S&P Biotech ETF (XBI) | Stock Price & Latest News"},{"s":"주목해야 할 27세 미만 P E의 영국 생명공학 주식 3개","so":"Yahoo Finance","tm":"11/08 07:13","c":1,"r":"us","u":"https://finance.yahoo.com/healthcare/articles/3-british-biotech-stocks-p-221324852.html","p":1794089604,"a":1794093180,"t":"3 British Biotech Stocks With P E Under 27 To Watch","su":"The Bank of England has lifted interest rates for the first time in years, pushing up borrowing costs just as living expenses bite harder. Higher rates often squeeze highly indebted firms, which puts financially healthier British biotech stocks in sharper focus. This article highlights three UK biotechnology companies from our quality-focused screen that combine reasonable balance sheets and valua"}]},{"name":"🔋 2차전지","note":"보유: TIGER 2차전지테마 · KODEX 2차전지산업 · TIGER 2차전지소재Fn","breaking":false,"items":[{"s":"BMW그룹, 삼성SDI·LG엔솔과 맞손…\"유럽·미국 공급망 강화\"","so":"연합뉴스 한민족센터","tm":"11/10 11:58","c":7,"r":"kr","u":"https://www.koreancenter.or.kr/news/articleView.html?idxno=1437244","p":1794279504,"a":1794281005,"su":"삼성SDI는 유럽, LG엔솔은 미국서 생산한 고전압 배터리 셀 공급 BMW '현지 생산·현지 공급' 원칙…\"K-배터리와 파트너십 공고히\" (서울=연합뉴스) 장하나 기자 = 삼성SDI와 LG에너지솔루션이 나란히 독일 BMW그룹의 차세대 전기차용 배터리 셀 공급사로 선정됐다. BMW그룹 공급망 다변화 전략의 일환이다. BMW그룹은 9일(현지시간) 삼성SDI와 LG에너지솔루션을 차세대 젠6(Gen6) 고전압 배터리용 셀 공급업체로 추가 선정하고 공급 계약을 체결했다고 밝혔다."},{"s":"[리포트 브리핑]에코프로비엠, '양극재 출하 부진 지속' 목표가 90,000원 - iM증권","so":"뉴스핌","tm":"11/09 10:53","c":6,"r":"kr","u":"https://www.newspim.com/news/view/20261109000504","p":1794189180,"a":1794195231,"su":"[서울=뉴스핌] 로보뉴스 = iM증권에서 09일 에코프로비엠(247540)에 대해 '양극재 출하 부진 지속'라며 투자의견 'Hold'의 신규 리포트를 발행하였고, 목표가 90,000원을 내놓았다. 전일 종가 기준으로 볼 때, 이 종목의 주가는 목표가 대비 8.3%의 추가 상승여력이 있다는 해석이 가능하다. ◆ 에코프로비엠 리포트 주요내용 iM증권에서 에코프로비엠(247540)에 대해 '3분기 실적은 미국 전기차 세액공제 종료에 따른 수요 둔화와 셀 고객사의 점유율 하락으로 시장기대치를 크게 하회했다."},{"s":"LG에너지솔루션, 사용후 배터리 진단 ‘리.펄스’로 CES 혁신상 수상","so":"경향신문","tm":"11/10 10:36","c":3,"r":"kr","u":"https://www.khan.co.kr/article/202611101036001","p":1794274560,"a":1794281005,"su":"LG에너지솔루션이 전기차에서 다 쓴 배터리 상태를 10분 안에 진단하는 소프트웨어 기술로 ‘CES 2027 혁신상’을 수상했다. LG에너지솔루션은 소프트웨어 기반 사용 후 배터리 진단 솔루션 ‘리.펄스(Re.Pulse)’가 CES 2027 혁신상을 받았다고 9일(현지시간) 밝혔다. 미국소비자기술협회(CTA)가 선정하는 상으로, 첨단 모빌리티 부문에서 받았다. 리.펄스는 배터리에 특정 전류 펄스를 흘려 전압 변화를 측정한다."},{"s":"본토 에너지 기업들은 상업적 대량 생산을 위한 핵심 제품인 나트륨 나트륨 이온 배터리 개발을 위해 안간힘을 쓰고 있습니다.","so":"工商時報","tm":"11/10 04:00","c":2,"r":"tw","u":"https://www.ctee.com.tw/news/20261110700149-439901","p":1794250800,"a":1794264230,"t":"大陸能源企業爭相研發重點產品陸鈉離子電池衝商業化量產- 日報","su":"중국 본토 나트륨이온전지 업계는 샘플 검증을 넘어 GWh 수준의 대규모 납품 단계로의 전환을 희망하며 상업 양산을 향해 질주하고 있다. 루(Lu) 언론 보도에 따르면, 최근 대기업들이 에너지 저장, 생산 라인 조정 가속화 등의 분야에서 차세대 배터리 제품을 적극적으로 출시하고 있다고 지적했습니다. 아직 통과해야 할 장애물이 많지만, 시노링크 증권은 올해가 나트륨 발전 산업의 대규모 상용화에 있어 중요한 시기가 될 수 있다고 예측합니다. 현지 언론 보도에 따르면 나트륨 배터리는 안전성, 넓은 온도 범위 적응성, 충전 속도 등에서 장점을 갖고 있다."},{"s":"정웨이 투청(Zhengwei Tucheng) 공장 리튬 배터리 완제품 구역 화재 위기가 여전히 해결되지 않아 소방대원들의 경계가 계속되고 있다","so":"UDN","tm":"11/09 17:56","c":2,"r":"tw","u":"https://udn.com/news/story/7320/9867211","p":1794214586,"a":1794214964,"t":"正崴土城廠鋰電池成品區起火危機未解 消防持續灌水戒備","su":"오늘 아침 신베이시 투청구 중산로에 위치한 상장기업 정웨이정밀(Zhengwei Precision) 공장에서 화재가 발생했습니다. 5층에서 다량의 짙은 연기가 피어올랐습니다. 소방당국은 화재를 구조하기 위해 수백 명의 인력을 파견했습니다. 불은 오전 10시 33분께 진화됐다. 불이 난 곳은 리튬배터리 완제품 보관 장소인 것으로 파악됐다. 직원들은 배터리 구역에서 불이 난 것을 발견하고 구조에 나선 뒤 창문을 열어두는 대신 다량의 산소가 유입돼 불이 더욱 확대된 것으로 의심했다. 소방대원들은 불길을 식히기 위해 계속해서 다량의 물을 쏟아부었다. 현재 화재는 진압 중이다. 위험이 완전히 제거되려면 리튬 배터리 반응이 완료될 때까지 기다려야 합니다."},{"s":"Chinalco와 CATL이 전략적 협력 계약을 체결했습니다.","so":"Jiemian.com","tm":"11/09 10:11","c":2,"r":"cn","u":"https://www.jiemian.com/article/15308758.html","p":1794186706,"a":1794206050,"t":"中铝集团与宁德时代签署战略合作协议","su":"최근 Chinalco와 CATL은 Fujian성 Ningde에서 전략적 협력 계약을 체결했습니다. 이번 합의에 따르면 양측은 과학기술 혁신 협력, 녹색 및 저탄소 전환, '일대일로' 공동 건설 분야에서 다각적이고 심도 있는 협력을 수행하기로 했다."},{"s":"리튬 이온 전지의 부극재, 알루미늄박으로 저비용화 도호쿠 대학","so":"日本経済新聞","tm":"11/09 05:00","c":2,"r":"jp","u":"https://www.nikkei.com/article/DGXZQOSG296RJ0Z21C26A0000000/","p":1794168000,"a":1794177868,"t":"リチウムイオン電池の負極材、アルミ箔で低コスト化 東北大学","su":"東北大学の中田優樹助教らはリチウムイオン電池の負極に適用できるアルミ箔を開発した。マンガンを添加したのが特徴で、蓄電容量を維持しながら充放電による劣化を抑えた。実用化すれば電池の製造工程を減らすことができる。現在普及するリチウムイオン電池の負極には粉末状の黒鉛が使われる。負極として使うには銅箔や接着剤などと組み合わせる工程が必要になる。製造時のコストがかさむため、代替材料が研究されている。"},{"s":"모바일 전지의 회수 체제 정비 발화 사고 대책으로 고시야시가 실증 실험","so":"日経ビジネス電子版","tm":"11/10 17:00","c":1,"r":"jp","u":"https://business.nikkei.com/atcl/gen/19/00297/101900331/?i_cid=nbpnb_top_latest","p":1794297600,"a":1794298372,"t":"モバイル電池の回収体制整備 発火事故対策で越谷市が実証実験","su":"모바일 배터리를 쉽게 폐기할 수 있는 환경의 정비에는 무엇이 필요한가. 사이타마현 고시야시가 앵커·재팬 등과 진행하고 있는 실증 사업으로부터, 그 힌트를 생각해 보았다."},{"s":"고려대 \"유승호 교수팀, 리튬인산철 양극재 문제 해법 제시\"","so":"이데일리","tm":"11/10 16:28","c":1,"r":"kr","u":"https://www.edaily.co.kr/News/Read?newsId=05218486645644408&mediaCodeNo=257","p":1794295724,"a":1794298368,"su":"고려대 연구팀이 리튬인산철(LFP) 양극 소재의 쉽게 갈라지는 문제점의 해법을 찾았다. (왼쪽부터) 고려대 화공생명공학과 이영훈 박사후연구원(공동 제1저자), 유승호 교수(공동 교신저자), 서울대 화학생물공학부 김현우 석사과정(공동 제1저자), 박은빈 석박사통합과..."},{"s":"SP삼화, 이차전지 전해액용 '염소화 공정없는 제조법' 특허 취득","so":"연합뉴스 한민족센터","tm":"11/10 16:18","c":1,"r":"kr","u":"https://www.koreancenter.or.kr/news/articleView.html?idxno=1437379","p":1794295097,"a":1794298368,"su":"(서울=연합뉴스) 강태우 기자 = SP삼화는 리튬이온 배터리 전해액 소재로 활용되는 '설포닐 플루오라이드 화합물'의 제조 방법에 관한 특허를 취득했다고 10일 공시했다. 이번 특허는 촉매를 활용해 기존 제조 과정에 필요했던 염소화 공정을 생략하면서도 높은 수율로 설포닐 플루오라이드 화합물을 생산할 수 있는 기술이다. 설포닐 플루오라이드 화합물은 배터리의 화학적 안정성과 내구성을 높이는 데 활용되는 소재다."},{"s":"BMW, 전기차 신차에 고부가 K배터리 낙점","so":"서울경제","tm":"11/10 15:21","c":1,"r":"kr","u":"https://www.sedaily.com/article/20112484","p":1794291704,"a":1794298368,"su":"BMW, 전기차 신차에 고부가 K배터리 낙점 LG엔솔·삼성SDI와 고전압 배터리 계약 미국·유럽서 BMW에 원통형 제품 공급 입력2026-11-10 15:21 LG에너지솔루션(373220)과 삼성SDI(006400)가 BMW에 고전압 배터리 셀을 공급한다. BMW는 6세대 전기차용 배터리 공급사로 LG에너지솔루션과 삼성SDI를 낙점하며 전동화 전환 전략을 가속화할 수 있게 됐다. BMW그룹은 9일(현지 시간) 6세대 고전압 배터리 셀 공급사로 LG에너지솔루션과 삼성SDI를 추가 선정하고 공급 계약을 체결했다고 밝혔다."},{"s":"양극재 강자 포스코퓨처엠, LFP로 승부수…中 독주에 도전[포스코 자원보국⑤]","so":"헤럴드경제","tm":"11/10 14:49","c":1,"r":"kr","u":"https://biz.heraldcorp.com/article/10932324","p":1794289748,"a":1794298368,"su":"삼원계 양극재를 주력으로 생산해온 포스코퓨처엠이 중국 업체들이 장악한 리튬인산철(LFP) 양극재 시장에 도전장을 내밀어 국내 배터리 기업들과 대규모 공급물량을 확보"},{"s":"CATL은 나트륨 배터리 추진을 돕기 위해 더 많은 교환 스테이션을 말한다","so":"Bloomberg.com","tm":"11/10 14:35","c":1,"r":"us","u":"https://www.bloomberg.com/news/articles/2026-1 1794216095,"t":"【11.9 ETF综述】卫星爆发，闪耀两市！碳酸锂，暴跌近5%！中证2000，再度领涨！","su":"11월 9일, 3대 A주 지수는 상승세를 보였다가 하락세를 보이며 엇갈린 이익과 손실로 마감했습니다. 상하이종합지수는 0.32% 상승한 3660.79포인트로 마감했고, 선전 구성지수는 0.27% 하락한 11145.49포인트에 마감했고, GEM 지수는 0.27% 하락한 2458.56포인트에 마감했다. 과학기술혁신50 지수는 0.30% 상승한 1256.96포인트에 마감했다."},{"s":"허난성: 연료전지 차량의 시범 적용을 지속적으로 장려하고 수소화 장비 및 센서 부문의 선두 기업 개발을 지원합니다.","so":"界面新闻","tm":"11/09 17:57","c":1,"r":"cn","u":"https://www.jiemian.com/article/15311932.html","p":1794214679,"a":1794214962,"t":"河南：持续推进燃料电池汽车示范应用，支持加氢装备和传感器领军企业发展","su":"허난성 상무부를 포함한 19개 부서는 공동으로 \"풀체인 자동차 소비 촉진을 위한 자동차 애프터마켓 육성 및 강화를 위한 허난성 실행 계획\"을 발표했습니다. 그 중에는 자동차 부품 기술 연구개발의 창의성을 높이는 것도 언급된다. 체인 강화, 지능형 네트워크 연결, 연료전지 차량 실증 및 리더십, 기술 혁신 플랫폼 구축을 위한 핵심 자동차 부품 및 부품을 공동으로 추진합니다. 조향 기어, 충격 흡수 장치, 구동축, 워터 펌프, 실린더 라이너 및 동력 배터리와 같은 부품의 장점을 통합하고 개선합니다. 지능형 연결 버스의 선점자 이점을 최대한 활용하고 온보드 감지, 제어 의사 결정 및 정보 보안과 같은 핵심 기술의 적용을 가속화하십시오. 계속해서 연료전지 차량의 시범 적용을 촉진하고, 수소화 장비 및 센서 분야 선도 기업의 발전을 지원하며, 구현을 통해 기업의 생산 능력 출시를 가속화합니다. \"상용차용 지능형 전기 섀시 핵심 기술 연구 개발 및 적용\"과 같은 주요 과학 기술 프로젝트의 구현을 가속화하고 결과의 산업적 적용을 촉진합니다. 새로운 전력 및 에너지 저장 배터리 소재, 차량 충격 흡수 장치 등에 중점을 둔 다수의 파일럿 기지를 구축하여 산업 독립성 및 제어 가능성 수준을 향상시킵니다. 해외 시장 개척 노력을 강화하고 제품 수출을 촉진해 브랜드, 기술 수출 등 가치사슬 내 고급 연계까지 점진적으로 확대한다."},{"s":"BMW, 삼성·LG에너지와 배터리 부품 공급업체 확대","so":"Bloomberg.com","tm":"11/09 17:44","c":1,"r":"us","u":"https://www.bloomberg.com/news/articles/2026-11-09/bmw-widens-battery-component-suppliers-with-samsung-lg-energy","p":1794213891,"a":1794214961,"t":"BMW Widens Battery Component Suppliers With Samsung, LG Energy"},{"s":"10월 승용차 판매는 27% 감소했고, 배터리는 조정으로 반응했다. CATL은 2% 이상 하락했고, 배터리 ETF China Universal(159796) 지수는 2% 이상 하락했으며, 5일 연속 6억 6천만 위안 이상의 자금이 쏟아졌습니다!","so":"Jiemian.com","tm":"11/09 17:35","c":1,"r":"cn","u":"https://m.jiemian.com/article/15311611.html","p":1794213303,"a":1794216096,"t":"10月乘用车销量下降27%，电池应声回调，宁德时代跌超2%，电池ETF汇添富(159796)指数跌超2%，资金连续5日坚定涌入超6.6亿元！","su":"11월 9일 A주 시장은 상하이 증권 거래소 지수가 0.32% 소폭 상승하는 등 상승세를 보였습니다. 배터리 ETF 차이나 유니버셜(159796)의 기초지수는 추세를 거스르며 2% 이상 하락했다. 하  368.6위안, 최고 가격은 385.6위안입니다. 204.26만주가 거래되었고, 거래금액은 7억6400만위안입니다. 활성 매수 및 매도 비율은 58:42, 순 활성 펀드 구매액은 1억 1,600만 위안입니다. 현재 최대 순 수동 매수 중개업은 Futu Securities International로 금액은 1,826만 위안이고 가중 평균 거래 가격은 372,876위안입니다. 현재 최대 순패시브판매중개업은 CITIC CLSA로 금액은 4,818만 위안, 가중평균거래가격은 372,752위안이다. 현재 주가 기준으로 주가는 이틀 연속 하락해 누적 하락폭은 6.6%에 달했다."},{"s":"1∼9월 배터리 음극재 적재량 21%↑…중국외 시장은 29%↑","so":"연합뉴스","tm":"11/09 10:07","c":1,"r":"kr","u":"https://www.yna.co.kr/amp/view/AKR20261109035700003","p":1794186436,"a":1794195231,"su":"(서울=연합뉴스) 김민지 기자 = 올해 1∼9월 글로벌 전기차용 배터리 음극재 시장이 중국을 제외한 글로벌 시장을 중심으로 견고한 성장세를 이어..."},{"s":"\"에코프로비엠, 내년 상반기까지 버텨야\"⋯반등 시점은 '이때' [찐코노미]","so":"이투데이","tm":"11/09 10:05","c":1,"r":"kr","u":"https://www.etoday.co.kr/news/view/2645658?trc=right_newsplant","p":1794186300,"a":1794195231,"su":"에코프로비엠이 실적 부진과 추가 자금 조달 우려 등으로 내년 상반기까지 어려운 흐름을 이어갈 수 있다는 전망이 나왔다. 헝가리와 인도네시아 등"},{"s":"iM증권 \"엘앤에프 수익성 부진에 목표주가 하향, LFP양극재 출하 증가로 중장기 성장성 높아\"","so":"비즈니스포스트","tm":"11/09 09:50","c":1,"r":"kr","u":"https://www.businesspost.co.kr/BP?command=article_view&num=451478","p":1794185440,"a":1794206048},{"s":"자동차모닝포스트｜BYD, UAE서 신차 딩야오 출시 기대 볼보, 에어백 리콜 문자 메시지 반박","so":"Jiemian.com","tm":"11/09 09:44","c":1,"r":"cn","u":"https://www.jiemian.com/article/15308596.html","p":1794185077,"a":1794207274,"t":"汽车早报｜比亚迪仰望在阿联酋发布新车鼎耀 沃尔沃辟谣气囊召回短信","su":"BYD는 UAE에서 신차 Dingyao를 출시했으며 앞으로 더 많은 초호화 모델을 출시할 예정입니다. 양왕 브랜드는 지난 11월 7일 UAE에서 플래그십 세단 딩야오(Dingyao)를 출시했다. 이 차량에는 BYD Yi Sifang 4륜 구동 기술, 자체 개발한 Xuanji A3 칩, 운전 보조 기능 등이 탑재되어 있습니다. 배터리 수명 측면에서 신차는 BYD의 2세대 블레이드 배터리와 플래시 충전 기술을 사용하며 CLTC 배터리 수명은 1,000km를 초과합니다. 양왕 브랜드의 후샤오칭 총책임자는 지몐뉴스와의 인터뷰에서 양왕딩야오가 글로벌 자동차로 자리매김하고 있으며 UAE에는 현지 양왕 자동차 소유자가 많다고 말했다. \"고객 기반과 시장의 신에너지 차량 수용이라는 맥락에서 우리는 이 자동차를 여기서 출시하기로 결정했습니다.\" 자동차 가격은 아직 발표되지 않았습니다. Hu Xiaoqing은 브랜드가 앞으로 더 많은 초호화 모델을 출시할 것이라고 밝혔습니다."},{"s":"은시전기차신소재(06128)가 리튬전지 소재업체를 1억 달러 투자에 매각했고, 인수자는 현금과 주식배당으로 대금을 지불했다.","so":"etnet 經濟通","tm":"11/09 09:43","c":1,"r":"hk","u":"https://www.etnet.com.hk/www/tc/news/news-article.php?section=categorized&category=latest&newsid=20261109183","p":1794184980,"a":1794195246,"t":"烯石電車新材料(06128)售鋰電池材料公司涉資1億美元，買方以現金及配股支付","su":"2026-09-11 08:43 그래펙스 전기차신소재(06128)가 리튬전지 소재업체를 1억 달러 투자에 매각했고, 매수자는 현금과 주식배당금으로 지급했다. Graphex Electric Vehicle New Materials(06128)는 인수자인 M2i Global과 총 1억 달러 규모의 자회사 Graphex Technologies LLC 매각에 관한 최종 계약을 체결했다고 발표했습니다. 대가는 3단계에 걸쳐 지급됩니다. 계약 체결이 완료되면 구매자는 3000만 달러를 먼저 지불하고, 이 중 300만 달러는 현금으로 지불하게 된다. 구매자는 이를 위해 노트를 발행하고 나머지 2,700만 달러는 주당 3달러의 대가 주식 형태로 지급됩니다. Enshi Electric Vehicle New Materials는 구매자에게 비용을 지불하고 당사자가 공장의 기본 설계를 전달하고 구매자가 설계를 수락한 후 구매자는 주당 미화 3달러의 가격으로 3천만 달러를 유상 주식 형태로 지불하게 됩니다. 공장이 완공되고 생산 승인을 받은 후, 구매자는 주당 미화 4달러의 대가 지분 형태로 Enshi Tram New Materials에 미화 4천만 달러를 지불하게 됩니다."},{"s":"가디언은 영국이 2030년 전기차 판매 목표를 60%로 낮출 것으로 예상한다고 밝혔다.","so":"Reuters","tm":"11/09 08:24","c":1,"r":"world","u":"https://www.reuters.com/world/uk/uk-government-expected-cut-2030-ev-sales-target-60-guardian-reports-2026-11-08/","p":1794180240,"a":1794206082,"t":"Britain expected to cut 2030 EV sales target to 60%, Guardian says"},{"s":"iM증권 \"美블루웨이브 이차전지엔 기회\"…'비중확대' 권고 |","so":"연합인포맥스","tm":"11/09 08:08","c":1,"r":"kr","u":"https://news.einfomax.co.kr/news/articleViewAmp.html?idxno=4443665","p":1794179333,"a":1794195231,"su":"iM증권 \"美블루웨이브 이차전지엔 기회\"…'비중확대' 권고 \"데이터센터 규제, 전력·ESS 수요 키운다\"…삼성SDI 최선호 (서울=연합인포맥스) 정원 기자 = iM증권이 미국 중간선거 이후 불거진 데이터센터 규제 우려가 이차전지 업종에는 오히려 기회가 될 수 있다며 투자의견을 '중립'에서 '비중확대'로 상향 조정했다. 최선호주는 삼성SDI를 차선호주에는 LG에너지솔루션을 제안했다. 정원석 iM증권 연구원은 9일 보고서에서 \"정책의 핵심은 전력과 용수, 환경 부담이 주민에게 전가되지 않도록 사업자의 책임을 강화하는데 있다\"며 \"특히 가스터빈의 공급 제약과 운영 비용 절감 등을 고려하면 가스발전과 '태양광+에너지저장장치(ESS)'를 병행하는 구조가 확대될 가능성이 높다\"고 강조했다."},{"s":"Hongchen, 산업연구소와 손잡고 NASA 항공우주 배터리 세미나 참석 - 비즈니스 정보","so":"工商時報","tm":"11/09 07:00","c":1,"r":"tw","u":"https://www.ctee.com.tw/news/20261109700014-431202","p":1794175200,"a":1794177868,"t":"泓辰攜手工研院登上NASA航太電池研討會- 商情","su":"美國國家航空暨太空總署(NASA)訂於11月17日至19日在美國阿拉巴馬州舉辦「2026 NASA Aerospace Battery Workshop」，將有來自全球7個國家，33場專題演講；NAS y Storage Systems","su":"사람들이 에너지 저장 분야의 혁신에 관해 이야기할 때 대화는 일반적으로 배터리, 즉 화학적 성질, 용량, 지속 시간으로 시작됩니다. 그 지역은"},{"s":"배터리 저장소의 다음 실패 지점이 배터리가 아닌 이유","so":"POWER Magazine","tm":"11/10 04:01","c":1,"r":"us","u":"https://www.powermag.com/why-battery-storages-next-failure-point-isnt-the-battery/","p":1794250870,"a":1794264240,"t":"Why Battery Storage’s Next Failure Point Isn’t the Battery","su":"배터리 에너지 저장 시스템은 가변적인 재생 가능 발전에 점점 더 의존하는 그리드의 필수 인프라가 되고 있습니다. 그들의 능력"},{"s":"Yuanxin Energy Storage는 홍콩 증권거래소 상장 첫날 59% 상승했으며, 상위 5대 고객 집중도는 94.3%로 상승했습니다.","so":"ThePaper.cn","tm":"11/09 23:21","c":1,"r":"cn","u":"https://m.thepaper.cn/newsDetail_forward_34440461","p":1794234094,"a":1794242694,"t":"远信储能港交所上市首日涨59%，前五大客户集中度升至94.3%","su":"11월 9일, Yuanxin Energy Storage(09621.HK)가 주당 HK$9.78의 발행 가격으로 홍콩 증권 거래소 메인보드에 공식 상장되었습니다. 이날 마감 현재 회사의 주가는 주당 HK$15.55로 59% 증가했으며 총 시장 가치는 HK$64억입니다."},{"s":"홍콩 주식은 하락하고 거래량은 줄어들었으며 Yuanxin Energy Storage는 상장 첫날 급등했다가 급락했으며 석탄 부문은 추세를 거스르고 강세를 보였습니다.","so":"每日经济新闻","tm":"11/09 19:42","c":1,"r":"cn","u":"https://www.nbd.com.cn/articles/2026-11-09/4642456.html","p":1794220920,"a":1794230101,"t":"港股回落成交缩量，远信储能上市首日大涨后跳水，煤炭板块逆势走强","su":"오늘(11월 9일) 홍콩 증시는 상승세를 보였다가 하락세를 보였습니다. 결국 모든 지수가 전반적으로 하락했습니다. 하루 동안 시장 매출액은 HK$1,737억에 불과해 지난 금요일에 비해 크게 감소했습니다. 종가 기준 항셍지수는 32.91포인트, 즉 0.13% 하락한 24484.95포인트로 마감했다. 항셍기술지수는 32.91포인트(0.13%) 하락한 24,484.95포인트로 마감했다."},{"s":"산터우 사장 선전의 에너지 저장 사업은 상장 첫날 급등했지만 다시 하락해 59%를 마감했다.","so":"21财经","tm":"11/09 19:23","c":1,"r":"cn","u":"http://www.21jingji.com/article/20261109/herald/b70ba5c5696db39606ebc5348efe3f94.html","p":1794219828,"a":1794230102,"t":"汕头老板深圳做储能，上市首日冲高回落收涨59%","su":"21세기 비즈니스 헤럴드 Lin Dianchi 기자 11월 9일 Farsonic Energy Storage(09621.HK)가 홍콩 증권거래소 메인보드에 상장되었습니다. 7년 전, 광둥성 산터우 출신의 Wang Yu와 Zhang Jiajing이 심천에서 에너지 저장 시스템 통합업체를 설립했습니다. 이번 IPO에서 Yuanxin Energy Storage는 H주 약 5,754만 주를 주당 HK$9.78에 매각하여 총 약 HK$5억6,300만 달러와 약 HK$5억200만 순수익을 조달했습니다. 상장 첫날 Yuanxin Energy Storage는 발행가보다 114.72% 오른 HK$21에 개장했으며, 초 거래에서 최고가인 HK$22.40을 기록했습니다. 정오에 HK$21.60에 마감되었고 오후에는 크게 하락했습니다. 최종적으로 정오 종가보다 약 28% 하락한 HK$15.55에 마감되었으며 여전히 발행가보다 59% 상승했습니다. 총 마감 시장 가치는 약 63억 6,800만 홍콩 달러였습니다."},{"s":"가정용 ESS 152% 급성장에도…K배터리 3사는 '전력망' 집중","so":"이데일리","tm":"11/09 18:30","c":1,"r":"kr","u":"https://www.edaily.co.kr/News/Read?newsId=04250886645644080&mediaCodeNo=257","p":1794216617,"a":1794230099,"su":"글로벌 가정용 리튬이온 에너지저장장치(ESS) 배터리 시장이 지난해보다 2.5배 이상 빠르게 성장한 것으로 나타났다. 유럽 중심으로 시장이 커지면서 전력망과 산업·상업용 성장세를 뛰어넘었다. 가정용 ESS 시장은 사실상 중국이 장악한 가운데 국내 배터리사는 대형 ES..."},{"s":"ETF 시장일보 | 상업용 항공우주가 집중적으로 촉매됩니다! 위성 테마 ETF 급증, 과학 기술 혁신 광범위한 기반 및 배터리 에너지 저장 방향 조정","so":"Jiemian.com","tm":"11/09 17:52","c":1,"r":"cn","u":"https://m.jiemian.com/article/15311832.html","p":1794214323,"a":1794216107,"t":"ETF市场日报｜商业航天密集催化！卫星主题ETF大涨，科创宽基与电池储能方向调整","su":"3대 A주 지수는 위축되고 등락을 거듭했고, 시장 규모도 크게 줄었습니다. 구조적인 시장 상황은 사건에 의해 촉진되었습니다. 상업용 항공우주 부문은 여러 긍정적 요인의 영향으로 크게 강화되었습니다. 석탄 등 고배당 방향이 활발해 전체 시장 매출액이 1조4000억위안대로 떨어졌다."},{"s":"Li Yuanheng: 전고체 배터리 라인 프로젝트가 주요 고객사에 납품되었습니다.","so":"界面新闻","tm":"11/09 17:27","c":1,"r":"cn","u":"https://m.jiemian.com/article/15311582.html","p":1794212823,"a":1794214286,"t":"利元亨：全固态电池整线项目已完成向头部客户交付","su":"11월 9일, Li Yuanheng은 투자자 커뮤니케이션 기록 시트에 대한 발표를 발표했습니다. 회사의 전고체전지 장비 사업은 기술 연구개발 단계에서 고객 검증 및 소규모 납품 단계로 전환되고 있다. 전체 라인 및 주요 모델이 꾸준히 진행되고 있습니다. 전고체전지 전체 라인 프로젝트가 주요 고객사에 납품을 완료했으며, 기타 주요 고객사의 일부 주요 모델도 납품 단계에 진입했습니다. 전반적인 진행 상황은 기대에 부합합니다. 전고체 배터리 장비는 회사의 주요 레이아웃 방향 중 하나입니다. 2026년 예정된 이번 증설사업에도 전고체전지 장비 관련 레이아웃이 포함돼 건식전극, 라미네이션, 등방압성프레스 등 핵심 공정 장비 역량 강화에 중점을 두고 있다."},{"s":"최대 규모 ESS 수주전 맞붙은 삼성SDI·SK온…저가 경쟁 완화될까 - 머니투데이","so":"머니투데이","tm":"11/09 17:10","c":1,"r":"kr","u":"https://www.mt.co.kr/index.php/amp/industry/2026/11/09/2026110913383630024","p":1794211800,"a":1794214284,"su":"앞선 두 차례 입찰에서 과도한 저가 경쟁이 벌어진 것과 달리 이번에는 공급사가 줄어들면서 배터리 가격이 상승할 것이라는 전망이 나온다. 9일 배터리업계에 따르면 정부는 오는 11일 제3차 ESS 중앙계약시장 입찰과 관련해 사업계획서와 증빙서류 제출을 마감한다."},{"s":"Yuanxin Energy Storage는 연구 개발, 해외 레이아웃 및 Wuzhen의 새 공장에 투자하기 위해 5억 6,300만 홍콩달러를 모금했습니다.","so":"鉅亨網","tm":"11/09 17:00","c":1,"r":"tw","u":"https://news.cnyes.com/news/id/6653286","p":1794211219,"a":1794214291,"t":"遠信儲能募資5.63億港元投入研發、海外布局與烏鎮新廠","su":"YuanSin Energy Storage는 Wuzhen Uanalyze의 R&D, 해외 레이아웃 및 신규 공장에 투자하기 위해 HK$5억6천3백만을 모금했습니다. 2026년 11월 9일(Uanalyze/산업 데이터 센터 보고서) ⸺ 중국 에너지 저장 시스템 회사 YuanSin Energy Storage RelyEZ(9621-HK)가 홍콩에 상장되어 약 HK$5억6천3백만을 모금했습니다. 이 자금은 소프트웨어 및 하드웨어 연구개발, 해외 시장 확장, 우전 신공장 등에 사용될 예정이다. 지난해 회사 매출이 63% 증가한 후 제품 및 생산 레이아웃을 확장하기 위해 자금을 추가로 조달했습니다. 왕위 회장은 상장이 글로벌 확장을 가속화하는 새로운 출발점이 될 것이라고 말했다. 이전 자금 조달 계획에 따르면 Yuanxin Energy Storage는 순수익의 약 45%를 연구 개발에 투자하고, 25%는 현지 팀, 주요 해외 시장에서의 협력 및 생산 기회에, 20%는 Wuzhen의 새로운 공장, 장비 및 실험실 건설에, 나머지 10%는 운전 자본으로 투자할 것으로 예상됩니다. 위 비율은 순모금액을 기준으로 계산한 것으로, 상장을 통해 모금된 총액과는 다릅니다."},{"s":"심지구에너지저장 핵심기술을 중심으로 산둥성 태안에서 국가수준의 고급훈련강좌가 개최되었습니다.","so":"中国新闻网","tm":"11/09 16:20","c":1,"r":"cn","u":"https://www.chinanews.com.cn/gn/2026/11-09/10728801.shtml","p":1794208829,"a":1794214288,"t":"聚焦深地储能关键技术 国家级高级研修班在山东泰安开班","su":"심지구 에너지 저장 핵심 기술을 중심으로 산둥성 타이안에서 국가 수준의 고급 교육 강좌가 개최되었습니다. 중국 통신사, 타이안, 11월 9일(Zhou Yiwei) 11월 9일 산둥성 타이안에서 \"지하 공간 탐지 및 심지구 에너지 저장 활용을 위한 핵심 기술\"에 관한 국가 수준 고급 교육 강좌(이하 '교육 강좌')가 개최되었습니다. 심지구 인재 팀 구성을 더욱 강화하고 심지구 에너지 저장 프로젝트의 실제 문제 해결 능력을 향상시키는 것을 목표로 합니다. 이번 교육에는 에너지저장공학, 심토지구공학, 지질학 및 광물자원, 지구물리탐사, 지하공간 활용 등 관련 분야에 종사하는 국내 인력이 참여했다. 개회식에서 산둥성 천연자원부 2급 검사관 Duan Xiuming은 지하 공간이 국가 우주 시스템의 중요한 부분이자 발전 잠재력이 큰 전략적 국가 우주 자원이라고 소개했습니다. 산둥성의 뛰어난 소금 자원 보유량과 안정된 지질 구조는 소금 동굴 에너지 저장 산업 발전에 독특한 자원 조건을 제공합니다. 부서는 소금 광산 및 기타 광물 자원의 탐사, 평가 및 모니터링을 지속적으로 장려하고, 채굴권의 전체 과정을 엄격하게 관리하며, 광물 자원 개발과 지하 공동 에너지 저장 재사용 간의 연결을 조정하고, 소금 동굴 에너지 저장 프로젝트를 지원하고 산둥성 지하 심층 에너지 저장 산업의 표준화되고 질서 있는 발전을 돕기 위해 노력하고 있습니다."},{"s":"정부 '저가 입찰'에 ESS 도입 차질 우려, 배터리 업계 ESS 배터리 공급 부족한데 낮은 수익성에 갈수록 기피 가능성","so":"비즈니스포스트","tm":"11/09 15:55","c":1,"r":"kr","u":"https://www.businesspost.co.kr/BP?command=article_view&num=451529","p":1794207303,"a":1794242692},{"s":"김성환 \"반도체 산단 전력·용수 적기 공급\"…변전소 선제 확충·ESS 송전망 구축","so":"뉴시스","tm":"11/09 15:36","c":1,"r":"kr","u":"https://www.newsis.com/view/NISX20261109_0003860712","p":1794206180,"a":1794207281,"su":"[세종=뉴시스]손차민 기자 = 김성환 기후에너지환경부 장관이 \"3대 메가프로젝트를 뒷받침하도록 전력·용수 인프라를 적기에 구축하겠다\"고 9일 밝혔다.김 장관은 이날 오후 국회 기후에너지환경노동위원회 전체회의에서 \"호남권 반도체 산단과 충청권 첨단 산업에 필요한 용수 공급 시설도 차질 없이 구축하겠다\"며 기후부 예산안 운용 방향을 설명했다. 김 장관은 \"첨단.."},{"s":"업튼 마그나(Upton Magna) 학부모, 학교 근처 배터리 부지 계획에 반대","so":"BBC","tm":"11/09 15:12","c":1,"r":"world","u":"https://www.bbc.com/news/articles/c63ellz584wqo","p":1794204720,"a":1794206122,"t":"Upton Magna parents oppose plans for battery site near school","su":"부지 계획에 따르면 세인트 루시아의 CofE 초등학교 및 보육원에서 1km 미만 거리에 있습니다."},{"s":"델: 전고체전지 생산라인은 시험생산 및 증설 단계에 있다.","so":"第一财经","tm":"11/09 12:09","c":1,"r":"cn","u":"https://www.yicai.com/news/103431950.html","p":1794193793,"a":1794206097,"t":"德尔股份：固态电池产线处于试生产及产能爬坡阶段","su":"WeChat을 열고 하단의 \"검색\"을 클릭한 다음 \"스캔\"을 사용하여 웹페이지를 친구들과 공유하세요. 중국 비즈니스 뉴스 2026-11-09 11:07:05 편집자: Qi Xinyi Dell 주식이 공개한 투자자 관계 활동 기록에 따르면 회사는 최근 Guolian Minsheng Securities와 같은 기관으로부터 설문조사를 받은 것으로 나타났습니다. 델(Del Co., Ltd.)은 다양한 적용 시나리오에 따라 에너지 밀도, 속도 성능, 사이클 수명 등 다양한 지표의 종합적인 균형을 맞출 수 있는 독립적인 전해질 소재 공식 시스템을 구축했다고 밝혔다. 생산능력 측면에서는 외부 협력업체와 위탁가공 계약을 체결했다. 파트너의 원래 리튬 배터리 생산 라인을 기반으로 회사의 전고체 배터리 생산 프로세스 요구 사항에 따라 특수 수정 및 장비 디버깅을 구현하여 회사의 전고체 배터리 제품 생산을 담당했습니다. 생산라인은 현재 시험생산 및 생산능력 확대 단계에 있다."},{"s":"거의 1,389회 과매수를 기록하며 역사적인 '과매수 왕'이 되었습니다. YuanSin Energy Storage는 상장 첫날 거의 130% 급등했습니다.","so":"财联社","tm":"11/09 11:51","c":1,"r":"cn","u":"https://www.cls.cn/detail/2528615","p":1794192660,"a":1794214973,"t":"超购近1389倍跻身历史级“超购王” 远信储能上市首日盘中一度狂飙近130%","su":"① Yuanxin Energy Storage의 상장 첫날, 2차 시장에서 집중적인 자금 조달을 촉발한 이유는 무엇입니까? ② 출하량 상위 10위권에 진입했고, 해외 점유율도 급등했다. Farsonic Energy Storage가 AIDC 컴퓨팅 전력 분배 및 스토리지에 투자하여 성장을 위한 새로운 공간을 열 수 있습니까? 파이낸셜뉴스(Financial News Agency)가 11월 9일 보도했다(편집자 후자롱). 홍콩 증시의 신에너지 부문이 또 하나의 큰 이슈를 맞이했다. Yuanxin Energy Storage(09621.HK)가 오늘 공식적으로 상장되었습니다. 초기 거래에서 급격히 상승했고 빠르게 상승했습니다. 장중 증가율은 130%에 가까웠다. 보도 시점 기준으로 119.84% 상승한 HK$21.50을 기록했습니다. Yuanxin Energy Storage는 1000배가 넘는 초과 청약 배수와 콤팩트한 순환 칩 구조로 유통 시장에서 집중적인 자금 추적을 촉발시켰습니다. 공모가는 1,389배 가까이 과매수돼 홍콩 주식 역사상 '과매수 왕'이 됐다. Yuanxin Energy Storage는 IPO 단계에서 선도적인 청약 열정을 보여주었습니다. 홍콩 공모는 1,388.75배 초과 청약을 기록해 같은 기간 다른 공모 주식보다 훨씬 많았을 뿐만 아니라 홍콩 주식 시장 역사상 '과매수 왕'에 직접 이름을 올렸다."},{"s":"이온어스, 美 THOR Energy와 북미 ESS 시장 공략","so":"전기신문","tm":"11/09 11:25","c":1,"r":"kr","u":"https://www.electimes.com/news/articleViewAmp.html?idxno=374518","p":1794191140,"a":1794195264,"su":"이온어스, 美 THOR Energy와 북미 ESS 시장 공략 빅스포서 이동형·컨테이너형 ESS 협력 MOU 텍사스서 실증 거쳐 중남미까지 사업 확대 추진 국내 레퍼런스 바탕으로 해외 사업 기회 모색 이동형 에너지저장장치(ESS) 전문기업 이온어스가 미국 텍사스의 에너지 프로젝트 개발 기업과 손잡고 북미 시장 문을 두드린다. 국내에서 다진 이동형 전력 공급 사업 경험을 미국 현지 실증으로 검증한 뒤 중남미까지 무대를 넓히겠다는 구상이다."},{"s":"보도자료 : RENON POWER, 저압 계통용 축전지 누계 수주 1,500사이트 돌파(PR TIMES)","so":"毎日新聞","tm":"11/09 11:22","c":1,"r":"jp","u":"https://mainichi.jp/articles/20261109/pr2/00m/020/112000c","p":1794190977,"a":1794195267,"t":"プレスリリース：RENON POWER、低圧系統用蓄電池の累計受注1,500サイト突破（PR TIMES）","su":"2026년 말 누계 수주 목표 1,000사이트를 앞당겨 달성, 약 75MW/300MWh의 수주 규모에 미국발의 축전지 메이커 RENON POWER 주식회사(이하 「RENON POWER」)는, 저압 계통용 축전지 패키지의 누계 수주수가 1,500사이트를 돌파한 것을 알렸습니다. 당사는 2026"},{"s":"홍콩 주식 플래시 보고서 | 홍콩 증시는 상승세로 출발했고 Hengke는 1% 이상 상승했습니다. 신규 주식의 어는점은 지났나요? Yuanxin Energy Storage 상장 가격 120% 이상 상승","so":"每日经济新闻","tm":"11/09 11:12","c":1,"r":"cn","u":"https://www.nbd.com.cn/articles/2026-11-09/4642014.html","p":1794190320,"a":1794207283,"t":"港股速报 | 港股高开恒科涨超1% 新股冰点已过？远信储能上市涨超120%","su":"오늘(11월 9일) 홍콩 증시는 장 초반 상승세로 출발했습니다. 보도 시간 현재 항셍지수는 143.85포인트(0.59%) 상승한 24,625.71포인트로 출발했다. 항셍기술지수는 41.75포인트(1.02%) 오른 4119.98포인트로 출발했다. 뉴스, 오늘"},{"s":"이번주 홍콩 증시 뉴스 미리보기 │ Yuanxin Energy Storage 등 다수의 신규 주식이 함께 상장되고 AI 산업 체인이 여러 촉매 이벤트를 맞이하고 있습니다","so":"财联社电报","tm":"11/09 11:00","c":1,"r":"cn","u":"https://m.cls.cn/detail/2528350","p":1794189616,"a":1794214290,"t":"港股本周要闻前瞻｜远信储能等一批新股集中挂牌 AI产业链迎来多重催化事件","su":"Financial Associated Press, 11월 9일(편집자: Feng Yi) Financial Associated Press는 이번 주 홍콩 주식 뉴스를 전합니다: 해외 매크로 월요일(11월 9일): Goolsby 시카고 연준 의장과 Barkin 리치몬드 연준 의장이 연설을 했습니다. 일본은행은 10월 통화정책회의 검토위원회 의견을 요약해 공개했다. 화요일(11월 10일): 10월 미국 CPI, 10월 24일까지 한 주 동안 미국 ADP 고용. G7 외무장관 회의가 열리고, 미국, 러시아, 우크라이나가 11월 10일부터 11일까지 아부다비에서 만날 예정입니다. 목요일(11월 12일): 11월 7일로 끝나는 주 동안 미국의 최초 실업수당 청구 건수. 하맥 클리블랜드 연은 총재, 데일리 샌프란시스코 연은 총재, 윌리엄스 뉴욕 연은 총재가 연설을 했습니다."},{"s":"[신주 IPO] Yuanxin Energy Storage 9621이 장초기 1.24배 상승하여 랏당 6,060위안을 벌었습니다.","so":"香港經濟日報HKET","tm":"11/09 10:51","c":1,"r":"hk","u":"https://inews.hket.com/article/4221827/%E3%80%90%E6%96%B0%E8%82%A1IPO%E3%80%91%E9%81%A0%E4%BF%A1%E5%84%B2%E8%83%BD9621%E9%A6%96%E6%8E%9B%E6%97%A9%E6%AE%B5%E5%8D%871.24%E5%80%8D%E3%80%80%E6%AF%8F%E6%89%8B%E5%B8%B3%E9%9D%A2%E8%B3%BA6,060%E5%85%83","p":1794189109,"a":1794195280,"t":"【新股IPO】遠信儲能9621首掛早段升1.24倍 每手帳面賺6,060元"},{"s":"배터리 시장 판도 바뀐다… 韓은 美 ESS 성장에 ‘미소’, 中은 공급 과잉에 ‘울상’","so":"Chosunbiz","tm":"11/09 10:42","c":1,"r":"kr","u":"https://biz.chosun.com/industry/company/2026/11/09/5GVNFBVHXBAODESK3ZTXMDKTDI/","p":1794188520,"a":1794195264,"su":"배터리 시장 판도 바뀐다 韓은 美 ESS 성장에 미소, 中은 공급 과잉에 울상 CATL, 기대 이하 실적 외형 성장 속 수익성 고민 LG엔솔·삼성SDI는 美 ESS 수혜로 어닝 서프라이즈"},{"s":"중국 최대의 단일 동력 플라이휠 에너지 저장 프로젝트 가동","so":"人民日报","tm":"11/09 09:10","c":1,"r":"cn","u":"http://paper.people.com.cn/rmrbhwb/pc/content/202611/09/content_30190098.html","p":1794183047,"a":1794207285,"t":"中国单体最大功率飞轮储能项目投运","su":"란저우, 11월 8일(Zeng Yichen 기자) 중국 최대의 단일 전력 플라이휠 에너지 저장 프로젝트가 최근 간쑤성 란저우 시의 그리드에 연결되어 화력 기지의 플라이휠 에너지 저장을 위한 중국의 빠른 주파수 변조 기술에 중요한 돌파구를 마련했습니다. 플라이휠 에너지 저장 장치는 고속 회전 로터를 사용하여 전기 에너지를 저장합니다. 전력이 충분할 때 전기 에너지는 로터를 고속으로 회전시켜 전기 에너지를 회전 운동 에너지로 변환하여 저장합니다. 전력망에 전원 공급이 필요할 때 고속 회전 로터는 운동 에너지를 전기 에너지로 변환하여 외부로 전달합니다. 충전 및 방전을 신속하게 완료하여 전력망의 원활한 작동을 보장합니다. 높은 변환 효율, 강력한 적응성 및 긴 장비 수명이라는 장점이 있습니다. 이 그리드 연결 플라이휠 에너지 저장 프로젝트는 \"5MW 고출력 플라이휠 + 0.5MW 관성 플라이휠\"의 협업 모델을 혁신적으로 채택합니다. 기존의 단일 플라이휠 모드와 달리 듀얼 플라이휠의 조화로운 작동은 보완적인 이점과 계층적 응답을 얻을 수 있습니다. 5MW 대형 플라이휠은 전력망의 큰 주파수 변동에 효과적으로 대처할 수 있으며, 0.5MW 소형 플라이휠은 작은 일일 전력망 주파수 변동을 안정화하는 역할을 합니다. 듀얼 플라이휠 에너지 저장 장치가 장착된 화력 발전 장치는 100밀리초 이내에 그리드 주파수 조정에 응답할 수 있으며 조정 정확도는 99.5%를 초과합니다. 보다 복잡한 상황에서 장치의 주파수 조절 성능을 효과적으로 향상시키고 그리드 주파수 안정성을 신속하게 지원할 수 있습니다."},{"s":"현재와 ​​미래의 경제 동향에 관한 메모: Yuanxin Energy Storage가 상장되었습니다. 신세계 파트너십 투자 촉진국 서커우 베이두의 첫 번째 프로젝트 기자회견 | 인스턴트 뉴스 - 뉴스","so":"etnet 經濟通","tm":"11/09 08:46","c":1,"r":"hk","u":"https://www.etnet.com.hk/www/tc/news/news-article.php?section=categorized&category=latest&newsid=2026110901","p":1794181560,"a":1794206114,"t":"今明經濟動向備忘：遠信儲能掛牌；新世界夥招商局蛇口北都首個項目記者會 | 即時新聞 - 新聞","su":"오늘의 경제동향, 2026년 11월 9일(월): 09:00 Yuanxin Energy Storage(09621) 상장식 - 홍콩 금융..."},{"s":"4조 들여 ‘초대형 배터리 단지’ 짓는다면서… 화재 대책은 방치","so":"조선일보","tm":"11/09 06:04","c":1,"r":"kr","u":"https://www.chosun.com/economy/industry-company/2026/11/09/LROTY4ON5ZDAVCR7H7KO2OKA64/","p":1794171877,"a":1794177875,"su":"정부가 송전망 한계 극복을 위해 4조 원을 들여 대규모 ESS를 설치할 계획이나, 기존 방식 외 별도의 화재 안전 대책이 없어 반복되는 배터리 열 폭주 사고에 대한 국민적 우려와 안전성 강화 요구가 커지고 있습니다."},{"s":"나카니시 유스케 관방 부장관, 도쿠시마의 축전지 관련 기업을 시찰… 「원료의 희토류 조달이 열쇠」라고 지원 명언","so":"読売新聞","tm":"11/08 18:34","c":1,"r":"jp","u":"https://www.yomiuri.co.jp/politics/20261108-GYT1T00117/","p":1794130440,"a":1794148508,"t":"中西祐介官房副長官、徳島の蓄電池関連企業を視察…「原料のレアアース調達が鍵」と支援明言","su":"[요미우리 신문] 나카니시 유스케 관방 부장관은 8일, 도쿠시마현내의 축전지 관련 기업을 시찰했다. 간사이와 중국·시코쿠의 결절점에 위치한 도쿠시마현의 축전지 산업은 지역 미래 전략에 근거한 선행 사례로 정부가 뒷받침하고 있다. 나카니시 씨는 시찰 후 기자단에 \"원료가되는 레어"},{"s":"홍콩 주식 IPO 주간 보고서: Harmonicare Pharmaceuticals는 상장 연기를 발표했으며 Yuanxin Energy Storage의 홍콩 주식은 거의 1,400배 초과 청약되었습니다.","so":"财联社","tm":"11/08 16:45","c":1,"r":"cn","u":"https://www.cls.cn/detail/2528250","p":1794123900,"a":1794207287,"t":"港股IPO周报：和美药业宣布延迟上市 远信储能香港发售获近1400倍超额认购","su":"①허메이제약의 출시 연기 발표에 영향을 미치는 요인은 무엇인가? ② Yuanxin Energy Storage의 홍콩 상품은 거의 1,400배 초과 구독을 받았습니다. 흥미로운 점은 무엇입니까? Financial Associated Press, 11월 8일(편집자: Feng Yi) Financial Associated Press는 매주 홍콩 주식의 새로운 주식 정보를 제공합니다. 리버모어증권에 따르면 이번주(11월 2일~11월 8일) 보도시간 현재 총 8개 기업이 기업공개(IPO)를 했고, 그 중 1개 기업이 상장 연기를 발표했다. 또한 양식을 제출하고 청문회를 통과하여 상장된 회사는 없습니다. 1) Harmonicare Pharmaceuticals-B(00054.HK nternational/article/4561780/%E6%8C%AA%E5%A8%81%E6%9A%AB%E5%81%9C%E7%82%BA%E6%95%B8%E6%93%9A%E4%B8%AD%E5%BF%83%E9%A0%90%E7%95%99%E9%9B%BB%E5%8A%9B%E6%8E%A5%E5%85%A5%E5%AE%B9%E9%87%8F","p":1794238075,"a":1794242707,"t":"挪威暫停為數據中心預留電力接入容量","su":"노르웨이는 이러한 시설이 그리드에 가하는 부담을 처리하는 방법을 연구하는 동안 데이터 센터에 대한 추가 전력 접근 용량 예약을 중단할 예정입니다. 전송 시스템 운영업체인 Statnett AS는 발표를 통해 관련 조치에는 새로운 그리드 연결 용량 예약을 일시적으로 중단하는 것이 포함된다고 밝혔습니다. 늦어도 내년 8월 1일까지는 정지가 해제될 것으로 예상된다. 기술 기업들이 인공지능을 실행하고 훈련시키기 위한 인프라 구축에 수천억 달러를 투자하면서 글로벌 데이터센터 건설이 가속화되고 있다. 급속한 확장 속도는 미국과 유럽의 많은 지역에서 반발을 불러일으켰고, 지역 사회는 토지와 전력 수요를 걱정하고 있습니다."},{"s":"전 세계적인 '변압기 부족 현상'이 나아지고 있나요? CIIE에 참가한 에너지 거대 기업: 생산 확대 외에도 장애물이 있습니다","so":"第一财经","tm":"11/09 18:31","c":1,"r":"cn","u":"https://www.yicai.com/news/103432270.html","p":1794216693,"a":1794230116,"t":"全球“变压器荒”好转了吗？进博会上的能源巨头：扩产之外还有这道坎","su":"{{aisd}} AI 생성 면책 조항 작년에 시작된 전 세계적인 변압기 부족 현상이 개선되었습니까? 제9회 중국 국제 수입 박람회에서 세계 최대 변압기 장비 제조업체인 Hitachi Energy의 글로벌 수석 부사장 겸 북아시아 책임자인 Zhao Yongzhan은 최근 China Business News에 변압기에 대한 \"공급이 수요를 초과하는\" 추세가 계속되고 있다고 말했습니다. \"글로벌 컴퓨팅 전력 센터 건설과 결합된 글로벌 에너지 전환, 특히 인공지능(AI) 컴퓨팅 전력 센터의 에너지 수요가 전례 없는 속도로 증가하고 있습니다. 이는 글로벌 공급 및 제조 역량에 대한 테스트입니다. 전력을 공급할 수 있는지 여부는 그 자체로 큰 테스트입니다.\" 국제에너지기구(IEA)는 지난 10월 발표한 최신 \"AI 개발 추진: 데이터센터를 전력 시스템에 통합하기 위한 전략\"에서 2030년까지 글로벌 데이터센터 전력 수요가 두 배 이상 증가해 약 945테라와트시가 될 것이라고 언급했다."},{"s":"jpp-KY는 1분기에 자기자본의 절반 이상을 벌면서 전력망 병목 현상을 살펴 새로운 비즈니스 기회를 창출했습니다.","so":"鉅亨網","tm":"11/09 17:25","c":1,"r":"tw","u":"https://news.cnyes.com/news/id/6653316","p":1794212759,"a":1794214300,"t":"jpp-KY首見一季賺超過半個股本 看電網瓶頸將帶動新商機","su":"Jingbao Precision의 3분기 세후 순이익은 2억 9,200만 위안으로 연간 28% 증가했습니다. EPS는 5.51위안으로 단일 분기 최고치를 기록해 분기에 자기자본의 절반 이상을 벌어들인 것은 처음이다.\n시장 전망을 내다보면 AI 서버와 전력 시스템 구성 요소에 대한 수요가 강하고, 전원 공급 장치와 무정전 전원 관리 아키텍처가 이번 분기에 대규모 대량 생산에 돌입했습니다.\nJingbao는 또한 Airbus A350에 대한 여러 프로세스 인증을 통과하여 Aerospace를 두 번째 성장 엔진으로 만들었습니다."},{"s":"신입사원이 왔습니다! 홍유자동차, 내년 북미 AI 전력시장 진출 위해 인수가격 208위안 잠정 확정","so":"UDN","tm":"11/09 16:52","c":1,"r":"tw","u":"https://udn.com/news/story/7240/9867045?from=udn-relatednews_ch2","p":1794210769,"a":1794214302,"t":"重電新兵來了！宏于電機暫定承銷價208元 明年搶進北美AI電力市場","su":"스마트 전력 및 에너지 시스템 통합 공장인 홍유 자동차(7869)는 상장 전 공공 인수와 협력해 외부 입찰을 위해 1,844개를 경매했으며, 최저 입찰 가격은 180.87위안, 최고 입찰 수는 253개, 잠정 인수 가격은 208위안이었다. 입찰기간은 11월 11일부터 13일까지이며 입찰은 11월 17일에 시작된다. 공개 청약은 11월 16일부터 18일까지 진행되며, 추첨은 11월 20일에 진행됩니다. 11월 26일 상장 예정입니다."},{"s":"AI 컴퓨팅 성능 '샷볼 수준' 전력망이 Taipower에 도전하여 수요와 공급의 효과적인 할당 촉진 | 지역 하이라이트","so":"中央社好生活","tm":"11/09 16:41","c":1,"r":"tw","u":"https://howlife.cna.com.tw/local/20261109s004.aspx","p":1794210060,"a":1794214304,"t":"AI 算力「鉛球級」電網挑戰台電推動供需有效配置| 地方亮點"},{"s":"한화오션, ABB 플로팅 데이터센터 전력시스템 파트너","so":"ET Datacenters","tm":"11/09 15:58","c":1,"r":"us","u":"https://datacenters.economictimes.indiatimes.com/news/energy-cooling-sustainability/hanwha-ocean-abb-partner-on-floating-data-center-power-systems/135673860","p":1794207483,"a":1794230114,"t":"Hanwha Ocean, ABB partner on floating data center power systems","su":"한화오션과 ABB가 부유형 데이터센터용 전력 및 제어 기술 개발을 위한 MOU를 체결했다. 이 파트너십은 AI 컴퓨팅 수요 증가로 인해 육상 기반 인프라에 대한 증가하는 압력을 해결합니다."},{"s":"블루진영은 'AI 컴퓨팅 파워 안정화'를 위한 핵 국민투표를 지지한다. 그린에너지보다 배치 비용이 높아 산업이 위축되고 있다.","so":"公視新聞","tm":"11/09 15:45","c":1,"r":"tw","u":"https://news.pts.org.tw/article/834885","p":1794206721,"a":1794207297,"t":"藍營挺核公投「穩定AI算力」 民團批成本比綠能高、拖累產業","su":"국민당은 11월 28일 원자력 국민투표 카운트다운을 앞두고 원자력을 활용해 AI 컴퓨팅 역량과 산업 경쟁력을 안정화하는 데 초점을 맞춘 공식 홈페이지와 홍보 영상을 공개했다. 그러나 시민사회 단체와 학자들은 새로운 원자력 에너지 SMR은 비용이 많이 들고 즉각적인 구제책을 제공하기에는 느리며, 경직된 원자력 발전은 녹색 에너지 개발을 밀어낼 것이라는 국제 보고서를 작성했습니다."},{"s":"하얼빈용접화통(Harbin Welding Huatong)은 핵용접재료 시장점유율에 대한 입장을 분명히 밝혔고, 주제에 따라 자금조달 측면도 냉각됐다.","so":"经济观察网","tm":"11/09 15:21","c":1,"r":"cn","u":"http://www.eeo.com.cn/2026/1109/1088444.shtml","p":1794205260,"a":1794206133,"t":"哈焊华通澄清核电焊材市占率说法 题材驱动下融资端降温","su":"경제 관찰자 네트워크 하얼빈용접화통(301137) 이사회 비서가 11월 6일 원자력 용접재료 시장점유율에 대한 제3자 성명을 명확히 밝혔다. 관련 주제가 주가 변동을 주도하고 자금 조달 측면에서 냉각 조짐이 나타나고 있다. 최근 눈길을 끄는 사건은 지난 11월 6일 이사장과 사무총장의 대화에서 \"원자력용접재료 시장점유율이 40%를 초과한다\"는 발언이 1차에서 나온 것이라고 밝힌 것이다."},{"s":"엄격한 감독은 장기적인 개발을 방해하지 않습니다. 법인: 컴퓨팅 파워 혁명으로 새로운 비즈니스 기회 창출","so":"經濟日報","tm":"11/09 12:17","c":1,"r":"tw","u":"https://money.udn.com/money/story/5607/9866363?from=edn_newest_index","p":1794194238,"a":1794195306,"t":"監管趨嚴不阻長線發展 法人：算力革命帶動新商機","su":"프랭클린증권투자컨설팅은 민주당의 승리로 AI 규제가 더욱 엄격해졌으나 AI 발전은 미국의 국가경쟁력과 직결돼 여전히 양당의 공감대라고 지적했다. 민주당의 정책 입장은 AI 개발을 중단하는 것이 아니라, 주민의 공과금에 영향을 미치지 않도록 업계 운영자가 전력망 업그레이드 비용을 더 많이 공유하도록 요구하는 것입니다. 따라서 AI 데이터센터 구축 진행이 취소되기보다는 늦어질 수도 있을 것으로 예상된다. 정책 방향이 명확해지면서 관련 주가는 점차 부정적인 소식을 흡수할 것으로 예상된다."},{"s":"AI 주가 폭락, 데이터센터 위기인가 아니면 전환점인가? |홍콩경제신문","so":"香港經濟日報HKET","tm":"11/09 10:11","c":1,"r":"hk","u":"https://invest.hket.com/article/4221604/ai-stocks-selloff-data-centre-outlook","p":1794186669,"a":1794195302,"t":"AI股急跌 數據中心危機還是轉機？|香港經濟日報"},{"s":"[리포트 브리핑]LS ELECTRIC, '한국 AI DC의 길은 LS일렉트릭으로 통한다' 목표가 220,000원 - 하나증권","so":"뉴스핌","tm":"11/09 08:35","c":1,"r":"kr","u":"https://www.newspim.com/news/view/20261109000116","p":1794180900,"a":1794195299,"su":"[서울=뉴스핌] 로보뉴스 = 하나증권에서 09일 LS ELECTRIC(010120)에 대해 '한국 AI DC의 길은 LS일렉트릭으로 통한다'라며 투자의견 'BUY'의 신규 리포트를 발행하였고, 목표가 220,000원을 내놓았다. 전일 종가 기준으로 볼 때, 이 종목의 주가는 목표가 대비 88.8%의 추가 상승여력이 있다는 해석이 가능하다. ◆ LS ELECTRIC 리포트 주요내용 하나증권에서 LS ELECTRIC(010120)에 대해 '▶ 아직 해외 데이터센터향 수요 감소의 징후는 없는 상황 ▶ 해외 진출을 뒷받침할 내수 수요 증가."},{"s":"Caterpillar의 \"컴퓨팅 파워 라벨\"이 CIIE에 도입되었습니다: 건설 기계 대기업에서 AI 전력 공급업체까지","so":"财联社","tm":"11/09 08:33","c":1,"r":"cn","u":"https://www.cls.cn/detail/2528031","p":1794180821,"a":1794242705,"t":"卡特彼勒“算力标签”带到进博：从工程机械巨头到AI电力供应商","su":"①제9회 중국국제수입박람회에서 캐터필러 부스 중 가장 눈에 띄는 자리는 디젤 발전기 세트였다. ② 캐터필라는 '굴삭기 판매업체'로서 '전력에너지 장비 및 솔루션 판매업체'라는 라벨을 추가하였습니다. 파이낸셜뉴스, 11월 7일(리용준 기자) 제9회 중국국제수입박람회에서 캐터필러(NYSE:CAT) 부스 중 가장 눈에 띄는 자리는 디젤 발전기 세트였다. FG Wilson 5000 시리즈 PE2500-2는 중국 국제 수입 박람회에서 세계 최초로 선보였으며 공식적인 포지셔닝은 매우 명확합니다. 이는 빠르게 증가하는 데이터 센터의 전력 수요를 위해 특별히 제작되었다는 것입니다. 이런 세부 사항은 불과 몇 년 전만 해도 상상하기 어려웠을 것입니다. Caterpillar의 가장 널리 알려진 이미지는 노란색 굴삭기와 불도저로, 인프라와 광산 분야의 \"철갑 거인\"입니다. 하지만 2026 CIIE에서는 A "u":"https://www.cls.cn/detail/2529887","p":1794281503,"a":1794298421,"t":"11:31:43【午评：创业板指半日涨1.49% 人形机器人、AI漫剧概念集体走强】","su":"오후 코멘트 : GEM 지수가 반나절 만에 1.49% 상승하며 휴머노이드 로봇과 AI 만화 드라마의 콘셉트가 종합적으로 강세를 보였다. 11월 10일 중국 금융통신에 따르면 시장은 장 초반 상승세로 출발했다가 충격에 휩싸이며 3대 지수 상승폭이 축소됐다. 상하이와 선전 증시의 반나절 거래량은 9603억 달러로 전 거래일보다 491억 달러 감소했다. 시장 전체에서 3,800개 이상의 주식이 상승했습니다. 시장에서는 핫스팟이 빠르게 회전하고 인간형 로봇 개념이 강화되고 10개 이상의 구성 재고가 일일 한도에 도달했으며 Fulai New Materials는 5일 만에 3개의 보드를 보유하고 Koyo Co., Ltd., Fenglong Co., Ltd. 및 Huapei Power는 2개의 연속 보드에서 나갔습니다. 단편 드라마 컨셉이 활발히 활성화되어 Wen Investment Holdings가 2회 연속 보드를 기록했고 Shanghai Film이 3일 만에 2회 보드를 기록했으며 Ciwen Media, Zhangyue Technology, Jinyi Film and Television이 일일 한도를 달성했습니다. 터미널 AI Sunsea Intelligence는 4일 만에 2개의 보드를 보유했으며 Fullhan은 14% 이상 소폭 상승했습니다. 빙설 경제 Iceberg Hot and Cold에는 9일 동안 5개의 보드가 있었습니다. 단점으로는 CNOOC, 중국유전서비스 등이 잇따라 하락하는 등 석유·가스 개념이 약화됐다. 마감 기준 상하이증권거래소지수는 0.06%, 선전부품지수는 0.76%, 차이넥스트지수는 1.49% 상승했다."},{"s":"A-share '청공', 휴머노이드 로봇, 비행자동차 모두 사용","so":"21财经","tm":"11/10 12:09","c":1,"r":"cn","u":"https://www.21jingji.com/article/20261110/herald/2e2c83f191cb471bf6d09e687a08e55c.html","p":1794280186,"a":1794281033,"t":"A股“轻功”，人形机器人，飞行汽车，都要用到它","su":"当一辆车试图离开地面，当风机叶片越做越长，当人形机器人要走进家庭……工程师先要算的，往往不是动力，而是重量。一克一克地减，减出来的是续航、载荷，以及一门生意能否算得过来。 镁合金、碳纤维，这些过去多见于航空航天与超级跑车上的材料，正批量进入新能源汽车、eVTOL、风机叶片和人形机器人的用料清单。从“选配”到“刚需”，不过短短几年。材料工艺的突破、下游场景的铺开、成本曲线的下移，共同把这条赛道推向一个仍在打开的增量空间。 轻量化材料何以刚需？"},{"s":"물리 AI는 다시 촉매 작용을 환영합니다! 앤트로픽의 신모델 페이블 5.2 양팔 로봇은 64.9%의 테스트 성공률을 기록하며 그에 맞춰 로봇 트랙도 상승하고 있다.","so":"Jiemian.com","tm":"11/10 11:46","c":1,"r":"cn","u":"https://m.jiemian.com/article/15314680.html","p":1794278816,"a":1794281033,"t":"物理AI再迎催化！Anthropic全新模型Fable 5.2双臂机器人测试成功率64.9%，机器人赛道应声上涨","su":"11月10日，人形机器人概念大面积走强，宇树科技涨超10%，总市值逼近3200亿！机器人ETF招商（560770）直线冲高，标的指数上涨2.95%。权重股中控技术涨超6%。"},{"s":"국내 첫 휴머노이드 로봇 ‘휴보’ 등 23건 ‘국가중요과학기술자료’ 선정","so":"www.dt.co.kr","tm":"11/10 11:28","c":1,"r":"kr","u":"https://www.dt.co.kr/article/12094217","p":1794277680,"a":1794298417,"su":"국내 최초 두 발 보행 휴머노이드( 대 이상으로 공동 추진하고, 슈퍼바이오닉 휴머노이드 로봇, 바퀴 달린 휴머노이드 로봇 등 단말기 규모를 10만대 이상으로 추진하기로 했다. UBTECH에 대한 이번 협력의 직접적인 의미는 판매 채널 확대에 있습니다. UBTECH의 이전 휴머노이드 로봇 수익은 거의 모두 산업 제조업과 정부 및 기업 고객에게서 나온 반면, Tianyi Telecom Terminal은 China Telecom 단말 운영 및 생태 협력 기능을 담당하며 전국적인 비즈니스 홀 채널 네트워크와 대규모 가정 고객 자원을 보유하고 있습니다. 양사는 임대 서비스, 'AI권리+단말기', 비즈니스홀 혁신 체험 시나리오 등 시범 사업을 추진할 계획이다. 유비테크의 수익구조는 B측 중앙조달에서 C측 소비자 시장으로 확장될 것으로 예상된다."},{"s":"UBTECH, 187일 만에 다시 Southbound Connect(심천) 거래 상위 10위권 진입 | 포커스 뉴스 - 뉴스","so":"etnet 經濟通","tm":"11/09 18:39","c":1,"r":"hk","u":"https://www.etnet.com.hk/www/tc/news/special_news_detail.php?newsid=ETN361109511&page=1&category=%E5%8C%97%E6%B0%B4%E7%82%92%EF%BC%A4%E4%B9%9C","p":1794217140,"a":1794230134,"t":"優必選相隔187日再打入港股通（深）十大成交榜 | 焦點新聞 - 新聞","su":"2026/11/09 17:39 '베이수이 신인' Youbixuan이 187일 만에 다시 홍콩 증권 거래소(심천) 거래 상위 10위 안에 진입했습니다. 홍콩 증권 거래소(00388)가 발표한 자료에 따르면 차이나 모바일(00941)과 UBTECH(09880)가 며칠 만에 처음으로 '남향 무역(심천)' 거래 상위 10위 안에 진입했습니다. (심천)\" Beishui는 하루 동안 각각 3억 5800만 위안과 2억 7000만 위안을 매입하고 각각 1억 1600만 위안과 1억 9400만 위안을 매도했으며 각각 2억 4200만 위안과 7558만 위안을 순매수했습니다. Beishui Focus Stocks 주식이 다시 상장되려면 얼마나 걸릴까요? 주식명 번호 매매 총액(위안) Southbound Stock Connect(상하이) Southbound Stock Connect (심천) 차이나모바일(00941) 4억7천5백만(심천) 해당없음 12차 유비셀렉션(09880) 4억6천4백만(심천) 해당없음 187차 '경제뉴스 서비스 9차 특집'"},{"s":"리얼월드, 휴머노이드 정밀 손 조작 평가 벤치마크 ‘덱스벤치(DexBench)’ 공개","so":"로봇신문","tm":"11/09 18:30","c":1,"r":"kr","u":"https://www.irobotnews.com/news/articleView.html?idxno=49477","p":1794216603,"a":1794230125,"su":"실제 산업 현장 데이터로 학습한 로보틱스 파운데이션 모델을 개발하는 피지컬 AI 기업 리얼월드(RLWRLD, 대표 류중희)는 휴머노이드 정밀 손 조작(Dexter"},{"s":"조규진 소장 “휴머노이드 기술 하나보다 세계 최고 로봇 생태계 조성이 먼저”[논설실의 人]","so":"서울경제","tm":"11/09 18:21","c":1,"r":"kr","u":"https://m.sedaily.com/amparticle/20112140","p":1794216072,"a":1794242717,"su":"글로벌 첨단산업 패권 경쟁이 생성형 인공지능(AI)에 이어 피지컬 AI 등을 중심으로 하는 로보틱스로 옮겨붙고 있다. 전 세계 휴머노이드 시장이 2050년 5조~7조 달러 규모로 커지는 가운데 앞으로 로보틱스 분야가 전 세계 기술 패권 중심에 설 것이라는 전망이 나온다. 이 때문에 미국·중국 등 주요국은 휴머노이드 로봇 개발에 막대한 국가적 역량을 투입하고"},{"s":"中 소비자용 휴머노이드 로봇 '프라임봇' 1만 대 <script>
var D = JSON.parse(document.getElementById('data').textContent);
var RL = {}; D.regions.forEach(function(r){ RL[r.k] = r.l; });
function $(id){ return document.getElementById(id); }
function esc(t){ return String(t==null?'':t).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
// 휴대폰에 기억해 두는 값 (마지막 탭, 탭별로 마지막에 본 시각, 정렬, 국가)
function load(k, d){ try { var v = localStorage.getItem('nb_'+k); return v===null ? d : JSON.parse(v); } catch(e){ return d; } }
function save(k, v){ try { localStorage.setItem('nb_'+k, JSON.stringify(v)); } catch(e){} }
var S = { tab: 0, seen: load('seen', null), sort: load('sort', 'c'), region: load('region', 'all'), shown: D.show, prev: {} };
function newest(t){ var m = 0; t.items.forEach(function(n){ if(n.a > m) m = n.a; }); return m; }
if(S.seen === null){ S.seen = {}; D.themes.forEach(function(t){ S.seen[t.name] = newest(t); }); save('seen', S.seen); }  // 처음 방문: 레드닷 없이 시작
(function(){ var nm = load('tabname', ''); D.themes.forEach(function(t, i){ if(t.name === nm) S.tab = i; }); })();  // 마지막에 본 탭 (이름으로 기억)
if(location.hash && /^#t\d+$/.test(location.hash)) S.tab = +location.hash.slice(2);
if(S.tab >= D.themes.length) S.tab = 0;

function visible(t){
  return t.items.filter(function(n){ return S.region==='all' || n.r===S.region; });
}
function sorted(list, breaking){
  var k = breaking ? 'p' : S.sort;
  return list.slice().sort(function(x,y){
    var c = y.c - x.c, p = y.p - x.p; return k==='c' ? (c||p) : (p||c);
  });
}
function renderTabs(){
  $('tabs').innerHTML = D.themes.map(function(t, i){
    var dot = newest(t) > (S.seen[t.name] || 0) && i !== S.tab;
    return '<button class="tab'+(i===S.tab?' on':'')+'" onclick="openTab('+i+')">'+esc(t.name)+
           '<b>'+visible(t).length+'</b>'+(dot?'<span class="dot" title="새 뉴스"></span>':'')+'</button>';
  }).join('');
  var on = $('tabs').children[S.tab]; if(on && on.scrollIntoView) on.scrollIntoView({block:'nearest', inline:'center'});
}
function renderCtrl(){
  var br = D.themes[S.tab].breaking;
  var h = '';
  if(!br){
    h += '<button class="'+(S.sort==='c'?'on':'')+'" onclick="setSort(\'c\')">🔥 화제순</button>';
    h += '<button class="'+(S.sort==='p'?'on':'')+'" onclick="setSort(\'p\')">🕒 최신순</button><span class="sep"></span>';
  }
  h += '<button class="'+(S.region==='all'?'on':'')+'" onclick="setRegion(\'all\')">전체</button>';
  D.regions.forEach(function(r){
    h += '<button class="'+(S.region===r.k?'on':'')+'" onclick="setRegion(\''+r.k+'\')">'+esc(r.l)+'</button>';
  });
  $('ctrl').innerHTML = h;
}
function card(n, prev){
  var hot = n.c > 1 ? '<span class="hot'+(n.c>=5?' big':'')+'">🔥 언론 '+n.c+'곳</span>' : '';
  var isNew = prev && n.a > prev ? ' <span class="new">NEW</span>' : '';
  return '<a class="card" href="'+esc(n.u)+'" target="_blank" rel="noopener" data-s="'+esc(n.su||'')+'" data-so="'+esc(n.so)+'">'+
    '<div class="meta">'+hot+esc(RL[n.r]||'')+' · '+esc(n.so)+' · '+esc(n.tm)+isNew+'</div>'+
    '<div class="title">'+esc(n.s)+'</div>'+(n.t?'<div class="orig">'+esc(n.t)+'</div>':'')+'</a>';
}
function renderMain(){
  var t = D.themes[S.tab], list = sorted(visible(t), t.breaking), prev = S.prev[t.name] || 0;
  var h = '<h2>'+esc(t.name)+'</h2>' + (t.note ? '<p class="note">'+esc(t.note)+'</p>' : '');
  var fresh = prev ? list.filter(function(n){ return n.a > prev; }).length : 0;
  if(S.onlyNew){                                // '새 기사만 보기' 중
    list = list.filter(function(n){ return n.a > prev; });
    h += '<button class="newbar" onclick="onlyNew(false)">🆕 새 기사 '+list.length+'개만 보는 중 · 전체 보기</button>';
  } else if(fresh && !t.breaking){              // 새 기사가 정렬 때문에 아래로 밀려도 바로 찾을 수 있게
    h += '<button class="newbar" onclick="onlyNew(true)">🆕 새 기사 '+fresh+'개 · 새 기사만 보기</button>';
  }
  if(!list.length) h += '<p class="none">'+(S.region==='all' ? '최근 ' + (t.breaking?'속보':'기사') + ' 없음' : esc(RL[S.region])+' 기사 없음')+'</p>';
  h += list.slice(0, S.shown).map(function(n){ return card(n, prev); }).join('');
  var extra = list.length - S.shown;
  if(extra > 0) h += '<button class="more" onclick="more()">더보기 ▾  ('+extra+'개 더)</button>';
  else if(S.shown > D.show) h += '<button class="more" onclick="less()">접기 ▴</button>';
  var auto = Object.keys(D.auto);
  h += '<footer>업데이트 '+esc(D.updated)+' · 최근 3일 · 믿을 만한 언론사 기사만 · 기사를 누르면 한국어 요약 → 원문 보기<br>'+
       '🔥 언론 N곳 = 같은 소식을 보도한 언론사 수 (많을수록 화제) · <span style="color:var(--red)">●</span> = 새 뉴스'+
       '<br><br><b>자동으로 추가된 언론사</b> (주요 언론보다 먼저 보도하고, 주요 언론도 함께 다룬 소식이 많은 곳 · 최근 14일)'+
       (auto.length ? auto.map(function(k){ return '<div>'+esc(k)+': '+esc(D.auto[k].join(', '))+'</div>'; }).join('') : '<div>아직 없음</div>')+
       '</footer>';
  $('main').innerHTML = h;
}
function openTab(i){
  var t = D.themes[i];
  S.tab = i; S.shown = D.show; S.onlyNew = false; save('tabname', t.name);
  if(!(t.name in S.prev)) S.prev[t.name] = S.seen[t.name] || 0;     // 이 탭에서 NEW 로 보여줄 기준
  S.seen[t.name] = Math.max(S.seen[t.name] || 0, newest(t)); save('seen', S.seen);  // 탭에 들어오면 레드닷 지움
  history.replaceState(null, '', '#t'+i);
  renderTabs(); renderCtrl(); renderMain(); window.scrollTo(0, 0);
}
function setSort(k){ S.sort = k; save('sort', k); S.shown = D.show; renderCtrl(); renderMain(); }
function setRegion(k){ S.region = k; save('region', k); S.shown = D.show; renderTabs(); renderCtrl(); renderMain(); }
function more(){ S.shown += 20; renderMain(); }
function onlyNew(on){ S.onlyNew = on; S.shown = D.show; renderMain(); }
function less(){ S.shown = D.show; renderMain(); window.scrollTo(0, 0); }
$('upd').textContent = '업데이트 ' + D.updated + ' · 탭을 눌러 테마별 뉴스 보기';

// 🚨 미국 속보 · 🌏 해외 속보는 페이지를 새로 올리지 않아도 최신 내용을 바로 가져옴
function refreshBreaking(){
  if(!window.fetch) return;
  fetch(D.breaking_url + '?t=' + Date.now(), {cache:'no-store'}).then(function(r){ return r.json(); }).then(function(b){
    var all = b.items || [];
    D.themes.forEach(function(t, i){
      if(!t.breaking) return;
      var items = all.filter(function(n){ return n.theme === t.name; }).map(function(n){
        var d = {s:n.show, so:n.source||'', tm:n.time||'', c:n.count||1, r:n.rk||'us', u:n.url||n.link, p:Math.floor(n.pub), a:Math.floor(n.added||n.pub)};
        if(n.show !== n.title) d.t = n.title; if(n.sum) d.su = n.sum; return d;
      });
      if(!items.length && t.items.length) return;
      t.items = items;
      if(S.tab === i){ S.seen[t.name] = Math.max(S.seen[t.name]||0, newest(t)); save('seen', S.seen); renderMain(); }
    });
    renderTabs();
  }).catch(function(){});
}
openTab(S.tab);
refreshBreaking();
setInterval(refreshBreaking, 5 * 60 * 1000);
document.addEventListener('visibilitychange', function(){ if(!document.hidden) refreshBreaking(); });

// 기사를 누르면 먼저 한국어 요약 → 원문 볼지 선택
document.addEventListener('click', function(e){
  var c = e.target.closest('a.card'); if(!c) return;
  if(e.ctrlKey||e.metaKey||e.shiftKey) return;
  e.preventDefault();
  $('s-meta').innerHTML = c.querySelector('.meta').innerHTML;
  $('s-title').textContent = c.querySelector('.title').textContent;
  var o = c.querySelector('.orig'); $('s-orig').textContent = o ? o.textContent : '';
  var sm = c.dataset.s || '';
  $('s-sum').textContent = sm || '이 기사는 요약을 가져오지 못했어요. (사이트가 자동 접속을 막았거나 아직 준비 중)';
  $('s-sum').className = 's-sum' + (sm ? '' : ' empty');
  $('s-go').href = c.href;
  // 외국어 기사면 ✦ Gemini 버튼 보이기 (한국어 기사는 숨김)
  var foreign = !!o;
  $('s-cs').hidden = $('s-ct').hidden = $('s-cnote').hidden = !foreign;
  if(foreign){
    // 원문을 열고, Gemini 가 '지금 화면'의 기사를 읽고 답하도록 요청 문장만 복사
    $('s-cs').href = $('s-ct').href = c.href;
    $('s-cs').dataset.q = '이 페이지의 기사 전체를 처음부터 끝까지 읽고 한국어로 요약해 줘. 핵심 내용 3~5줄, 그리고 투자자 입장에서 중요한 숫자와 의미를 짧게 정리해 줘.';
    $('s-ct').dataset.q = '이 페이지의 기사 전체를 처음부터 끝까지 빠짐없이 자연스러운 한국어로 번역해 줘. 전문 용어는 한국에서 쓰는 표현으로 바꾸고 필요하면 괄호로 원어를 적어 줘.';
  }
  $('dim').hidden = false; $('sheet').hidden = false; $('sheet').scrollTop = 0;
  document.body.style.overflow = 'hidden';
});
// ✦ 버튼: Gemini 요청 문장을 복사하고 원문을 엶 → 원문 화면에서 Gemini 를 불러 붙여넣기
function askAI(a){
  var q = a.dataset.q || '';
  try { if(navigator.clipboard) navigator.clipboard.writeText(q); } catch(e){}
  toast('요청 문장을 복사했어요 · 원문에서 측면 버튼 길게 → 「이 페이지에 관해 질문하기」 → 붙여넣기');
  setTimeout(closeSheet, 50);
}
function toast(msg){ var t = $('toast'); t.textContent = msg; t.hidden = false; clearTimeout(toast._t); toast._t = setTimeout(function(){ t.hidden = true; }, 4000); }
function closeSheet(){ $('dim').hidden = true; $('sheet').hidden = true; document.body.style.overflow = ''; }
document.addEventListener('keydown', function(e){ if(e.key==='Escape') closeSheet(); });
</script></body></html>
