fore Blockbuster IPO","su":"앤트로픽은 공개 데뷔가 가까워지면서 1.7GW의 발전량에 34억 달러를 지출했습니다."},{"s":"인도 데이터 센터 전력 안정성에는 냉각 연속성 계획이 필요합니다.","so":"ET Datacenters","tm":"11/12 08:39","c":1,"r":"us","u":"https://datacenters.economictimes.indiatimes.com/news/energy-cooling-sustainability/india-data-center-power-reliability-needs-cooling-continuity-plans/135724636","p":1794440384,"a":1794523851,"t":"India data center power reliability needs cooling continuity plans","su":"인도의 데이터 센터 전력 신뢰성은 냉각 연속성과 전기 가동 시간의 조정에 달려 있습니다. 이는 교란 중에도 전원이 계속 공급될 수 있는 고밀도 코로케이션 랙 및 GPU 서버에 중요합니다."},{"s":"AI 전력 확보에 과잉 베팅한 소프트뱅크, 주가 55% 급락","so":"한국경제","tm":"11/12 08:27","c":1,"r":"kr","u":"https://www.hankyung.com/article/202611121662i","p":1794439639,"a":1794453363,"su":"- 기사 스크랩 - 댓글 - 공유 - 글자크기 - 프린트 Google 검색에서 한국경제 기사를 더 자주 볼 수 있습니다. 소프트뱅크그룹이 AI 데이터센터(컴퓨터 수만 대를 모아 둔 건물) 전력 확보를 위해 과도하게 선점했던 가스터빈 계약을 취소·조정하며 37억 달러의 손실을 입은 가운데, 공격적인 AI 인프라 투자에 따른 재무 부담과 수익성 우려가 커지고 있습니다. 한경 프리미엄9의 모든 콘텐츠는 한국경제신문의 저작물로 저작권법의 보호를 받습니다."},{"s":"마이크로소프트는 데이터 센터에 전력을 공급하기 위해 자체 비용을 지불하겠다고 맹세합니다.","so":"Bloomberg.com","tm":"11/12 05:33","c":1,"r":"us","u":"https://www.bloomberg.com/news/articles/2026-11-11/microsoft-vows-to-pay-its-own-way-to-power-data-centers","p":1794429196,"a":1794437345,"t":"Microsoft Vows to Pay Its Own Way to Power Data Centers"},{"s":"인피니언, 데이터 센터에 SiC 및 GaN 전원 신수요","so":"日本経済新聞","tm":"11/12 05:00","c":1,"r":"jp","u":"https://www.nikkei.com/prime/tech-foresight/article/DGXZQOUC114CG0R11C26A1000000","p":1794427200,"a":1794437355,"t":"インフィニオン、データセンターにSiCとGaN 電源新需要","su":"인피니언은 AI 데이터 센터의 배전 시스템을 향해 SiC나 GaN의 파워 반도체(전자기기의 두뇌 부품) 제품을 확충한다. 사진은 SiC 파워 모듈의 목업 독일 Infineon Technologies(인피니언 테크놀로지스)는 AI(인공지능) 데이터 센터의 배전 시스템을 향해 탄화규소(SiC)나 질화갈륨(GaN)의 파워 반도체 제품을 확충한다. 향후 수요가 높아지는 반도체 변압기(SST)를 향해 SiC 파워 모듈을 2026년 내에 양산한다. 양방향형이라고 불리는 새로운 GaN 파워 반도체도 개발하고 있어 급성장을 전망하는 SST 시장을"},{"s":"중부 전력, 영국에서 해상 풍력의 해저 송전선 우선 협상권","so":"日本経済新聞","tm":"11/12 05:00","c":1,"r":"jp","u":"https://www.nikkei.com/prime/gx/article/DGXZQOUC1188C0R11C26A1000000","p":1794427200,"a":1794437356,"t":"中部電力、英で洋上風力の海底送電線 優先交渉権","su":"중부전력은 영국 동부에 있는 해저송전선 등 운영사업에서 우선협상권을 취득했다고 발표했다. 해상풍력발전소용 송전선으로 우선협상권은 현지기업과 공동으로 취득했다. 영국에서의 해저 송전 사업은 3번째가 된다. 대상이 되는 송전선은 영국의 동부 앞바다 약 130킬로미터로 운전중의 약 120만킬로와트의 해상 풍력 발전소 「도거・뱅크 B」에 접속한다. 연간 실적(회사가 번 돈 성적표) 전망(회사가 내놓은 앞으로의 실적 예상)은 공개되지 않았다. 사업권을 얻으면 운영을 위한 특별목적회사(SP"},{"s":"미국은 정책을 환영하고 비즈니스 기회를 가져오기 위해 Hon Hai 및 Huacheng과 같은 AI 전력 인프라 건설을 가속화합니다 | 기술산업 | 산업경제","so":"UDN","tm":"11/12 03:48","c":1,"r":"tw","u":"https://udn.com/news/story/7240/9873035","p":1794422883,"a":1794437351,"t":"美加速AI電力基建鴻海、華城等迎政策利多商機| 科技產業| 產經","su":"미국 상원은 초당적인 에너지 라이센스 개혁 법안의 토론 과정을 통과시켜 건설 속도를 높이고 AI 데이터 센터가 더 많은 에너지 비용을 부담하도록 요구하기 위해 에너지 계획 검토 과정을 대폭 완화할 준비를 하고 있습니다."},{"s":"컨스텔레이션에너지의 배당금은 적습니다. AI 전력 수요가 이를 변화시킬 수 있다","so":"Yahoo Finance","tm":"11/12 03:17","c":1,"r":"us","u":"https://finance.yahoo.com/energy/articles/constellation-energy-dividend-small-ai-181715518.html","p":1794421035,"a":1794437346,"t":"Constellation Energy’s Dividend Is Small. AI Power Demand Could Change That","su":"컨스텔레이션 Energy는 올해 두 번째로 전망을 높였지만 지불금은 거의 기록되지 않았습니다. 기술 대기업들은 수십 년에 걸친 전력 계약을 체결하고 있지만 경영진은 배당(회사가 주주에게 나눠주는 돈)금이 아닌 다른 곳에 현금을 지출하고 있습니다. 소득 투자자들이 주목해야 할 사항은 다음과 같습니다."},{"s":"1분 안에 세계를 보세요/말레이시아는 에너지 소비량이 많은 사용자에게 서비스를 제공하기 위해 독립적인 도매 전력 시장을 설립할 계획입니다.","so":"經濟日報","tm":"11/12 02:47","c":1,"r":"tw","u":"https://money.udn.com/money/story/5599/9872929","p":1794419260,"a":1794437353,"t":"1分鐘看世界／馬來西亞擬設獨立批發電力市場 服務高耗能用戶","su":"말레이시아는 데이터 센터와 같이 전력 소비가 높은 사용자에게 서비스를 제공하기 위해 독립적인 도매 전력 시장을 설립할 계획입니다. 가정, 공장, 상점에 전력을 공급하는 기존 시장은 변함이 없을 것이다. 이러한 움직임은 데이터 센터에서 사용되는 대량의 전력으로 인한 영향을 줄이기 위한 것입니다. 관계자들은 정부는 데이터 센터 개발을 허용해야 하지만 다른 산업의 에너지 비용에 직접적인 영향을 주어서는 안 된다고 생각한다고 설명했습니다."},{"s":"Delta, SC26에서 AI 인프라와 새로운 800 VDC, ±400 VDC 아키텍처를 위한 '그리드에서 칩까지' 냉각 혁신 공개 - 회사 발표 - FT.com","so":"Financial Times","tm":"11/11 23:00","c":1,"r":"world","u":"https://markets.ft.com/data/announce/detail?dockey=600-202611110900PR_NEWS_USPRX____SF94807-1","p":1794405600,"a":1794411561,"t":"Delta Unveils 'From-Grid-to-Chip' Cooling Innovations for AI Infrastructure and for New 800 VDC, ±400 VDC Architectures at SC26 – Company Announcement - FT.com"},{"s":"오하이오주 클리블랜드의 Union Trust Building 내에 데이터 센터 제안","so":"Data Center Dynamics","tm":"11/11 20:47","c":1,"r":"us","u":"https://www.datacenterdynamics.com/en/news/data-center-proposed-within-clevelands-union-trust-building-ohio/","p":1794397659,"a":1794403050,"t":"Data center proposed within Cleveland's Union Trust Building, Ohio","su":"차압 매각 및 현지 유예 조치에도 불구하고 소유자는 Hyperscape Digital과의 파트너십을 모색합니다."},{"s":"간사이 전력과 간사이 전력 송배전, 37년 만에 작업복 쇄신 BEAMS가 감수","so":"日本経済新聞","tm":"11/11 20:42","c":1,"r":"jp","u":"https://www.nikkei.com/article/DGXZQOUF116DW0R11C26A1000000/","p":1794397334,"a":1794403055,"t":"関西電力と関西電力送配電、37年ぶりに作業服刷新 BEAMSが監修","su":"간사이 전력과 간사이 전력 송배전은 빔스의 유니폼 브랜드 'Uniform Circus BEAMS'가 감수한 새로운 작업복을 발표했다. 37년만이 되는 기본 디자인의 쇄신으로, 12월 1일부터 착용한다. 안전성과 품질을 유지하면서 통기성이나 움직이기 쉬움 등의 기능성을 개선했다. 실제 시험을 통해"},{"s":"키옥시아 「10세대」, 전력 효율 2배 추론이 촉구하는 혁신","so":"日本経済新聞","tm":"11/11 19:33","c":1,"r":"jp","u":"https://www.nikkei.com/prime/gx/article/DGXZQOUC076H70X01C26A0000000","p":1794393204,"a":1794403056,"t":"キオクシア「第10世代」、電力効率2倍 推論が促す革新","su":"반도체(전자기기의 두뇌 부품) 메이저 기업인 키옥시아는 이르면 2027년 양산할 예정이다. 낸드플래시 메모리는 데이터를 읽을 때 이전 세대 제품보다 전력 효율이 2배 이상 높다. 인공지능(AI)이 확산되면서 데이터센터(컴퓨터 수만 대를 모아 둔 건물)의 환경부담이 사회적 문제로 대두됐고, 미국 중간선거에서도 이슈가 됐다. 엔비디아, 데이터센터 사업자 등 대형 고객들은 전력 소모 자체를 줄일 수 있는 신제품에 대한 기대가 크다. AI가 빠르게 확산되면서 전력 수요도 늘어나고 있다. 전력계통의 왜곡과 탈탄소화에 어떻게 대처할 것인가? 기업의 최첨단 활동에 대한 비정기 연재 기사를 게재합니다."},{"s":"LITEON, electronica 2026에서 고속 광 인터커넥트 및 핵심 광전자 기술 선보여 지능형 포토닉스로 AI 데이터센터 인프라 발전 – 회사 발표 - FT.com","so":"Financial Times","tm":"11/11 19:13","c":1,"r":"world","u":"https://markets.ft.com/data/announce/detail?dockey=600-202611110513PR_NEWS_EURO_ND__EN95071-1","p":1794391980,"a":1794403059,"t":"LITEON Showcases High-Speed Optical Interconnect and Key Optoelectronic Technologies at electronica 2026, Advancing AI Data Center Infrastructure with Intelligent Photonics – Company Announcement - FT.com"},{"s":"해외 컴퓨팅 파워 체인이 \"결산\"을 시작하면 A-share AI에 어떤 기회가 있을까요?","so":"21财经","tm":"11/11 18:19","c":1,"r":"cn","u":"https://www.21jingji.com/article/20261111/herald/443b250d9e22d16bddd37ead3ac05e9a.html","p":1794388740,"a":1794459155,"t":"当海外算力链开始“算账”，A股AI机会何在？","su":"지난 몇 년간 AI 분야의 투자 논리는 단일 체인과 매우 유사했다. 해외 주요 제조업체의 자본 지출 증가 → 컴퓨팅 칩 부족 → 광 모듈, PCB, 서버 주문 폭발 → A 주 하드웨어 체인이 전반적으로 상승했습니다. 하지만 2026년 4분기에 접어들면서 이 사슬은 복잡해지기 시작합니다. 글로벌 시장은 더 이상 \"AI의 무한한 증가\"에 대한 일방적인 기대에 직면하지 않고 또 다른 모순에 직면해 있습니다. 최근 미국 채권(돈을 빌려주고 받는 차용증) 금리(돈을 빌릴 때 내는 이자 비율)의 하락은 기술주의 가치 평가에 좋을 수 있지만 북미 AI 건설은 재무 견제와 균형 및 규제 조사를 받고 하드웨어 체인의 수익성 확실성이 재조정되었습니다. 동시에 광학 모듈, 구리 연결, 액체 냉각 및 기타 방향은 초기 기관 위치의 집중으로 인해 매우 혼잡하며 반등 시 판매 압력을 과소평가할 수 없습니다. 즉, AI 산업체인은 끝나지 않았지만 '눈을 감고 북미 지도를 구매하는 단계'는 지나갔을 수도 있고, 기회는 '자본 지출 기대 거래'에서 '산업 실현 속도 검증'으로 전환될 수도 있다."},{"s":"순환 자산 변환으로 그리드 안정성 향상","so":"POWER Magazine","tm":"11/11 18:01","c":1,"r":"us","u":"https://www.powermag.com/partner-content/enhance-grid-stability-with-rotating-asset-conversions/","p":1794387698,"a":1794403051,"t":"Enhance Grid Stability with Rotating Asset Conversions","su":"폐기되거나 활용도가 낮은 터빈 발전기를 개조하여 지역 전력망 안정성을 제공함으로써 수익을 창출할 수 있습니다. 이것은 POWER 매거진 시리즈의 다섯 번째 기사입니다. 첫 번째 기사인 미래 보장형 가스 발전소 투자에서는 기존 시설의 수명을 연장하기 위한 다양한 기술에 대해 논의했습니다. 두 번째 기사, 자율 발전 – 미래는 […]"},{"s":"[트렌드의 비밀 열쇠: 글로벌 전기화가 가속화되고 있으며, 국내 투자가 RMB 5조에 달해 전력망 장비 부문이 호황을 누리고 있습니다.","so":"第一财经","tm":"11/11 17:31","c":1,"r":"cn","u":"https://www.yicai.com/vip/news/103436343.html","p":1794385881,"a":1794403053,"t":"[ 风口秘钥 全球电气化提速叠加国内迎五万亿投资 电网设备板块景气上行","su":"11월 11일에도 전력망 장비 부문의 활발한 활동이 이어졌습니다. 마감 현재 Huashengchang은 일일 한도에 도달했으며 Jiangsu Huachen은 8.24% 상승했으며 Sanhui Electric, Hangzhou Kelin, Tianzheng Electric 및 Zhongchen 주가는 5% 이상 상승했습니다. 뉴스에 따르면, 제31차 유엔기후변화회의에서는 2035년까지 전 세계 최종 에너지 소비에서 전력이 차지하는 비중을 35%로 높이는 것을 제안했습니다. 동시에 글로벌 가스터빈 거대 기업인 GE 버노바1"},{"s":"다이킨 공업, 미국 자회사가 엔비디아의 설계 기반에 대응한 대규모 데이터 센터용 냉각 레퍼런스 아키텍처를 발표","so":"日本経済新聞","tm":"11/11 15:51","c":1,"r":"jp","u":"https://www.nikkei.com/article/DGXZRSP715129_R11C26A1000000/","p":1794379868,"a":1794403058,"t":"ダイキン工業、米子会社がNVIDIAの設計基盤に対応した大規模データセンター向け冷却リファレンス・アーキテクチャを発表","su":"【프레스 릴리스】발표일:2026년 11월 11일 엔비디아의 설계 기반에 대응한 대규모 데이터 센터용 냉각 레퍼런스·아키텍쳐를 발표 미국 캘리포니아주 산타클라라)의 AI 팩토리(※1)(대규모 데이터 센터"},{"s":"\"현장기회 넓히다\" … 창원특례시, 특성화고 대상 두산에너빌리티 등 견학 실시","so":"아시아경제","tm":"11/11 15:09","c":1,"r":"kr","u":"https://www.asiae.co.kr/article/2026111115094707096","p":1794377388,"a":1794377567,"su":"경남 창원특례시가 11일 특성화고 학생들을 대상으로 두산에너빌리티와 대호아이앤티를 찾아 &#039;직무특강 및 기업."},{"s":"풍력 및 태양광 이용률은 3년 연속 하락했습니다. 전력 시장은 어떻게 높은 비율의 새로운 에너지 소비를 지원할 수 있습니까?","so":"第一财经","tm":"11/11 15:00","c":1,"r":"cn","u":"https://www.yicai.com/news/103435911.html","p":1794376820,"a":1794377570,"t":"风光利用率连续三年回落，电力市场何以支撑高比例新能源消纳","su":"{{aisd}} AI 생성 면책조항 \"국가 통합 전력 시장 구축으로 '이용 가능 여부' 단계의 작업이 완료되었으며 다음 단계의 핵심 문제는 사용 가능 여부와 관리 가능 여부입니다.\" 11월 10일에 열린 중국 전력 위원회의 제4차(2026년) 전력 시장 개발 포럼에서 Datang Group의 운영 및 관리 부서 이사인 Pang Xiaojin은 이러한 견해를 제시했습니다. 현재 전국 통합 전력 시장의 규모는 지속적으로 확대되고 있으며, 전력 자원 배분은 지방 차원의 자체 균형에서 전국적인 최적화 주기로 전환되고 있습니다. 그린파워 가치 실현도 점차 정책 중심에서 시장 중심으로 전환되고 있다. 2025년 말 기준 전국 시장 기반 거래 전력량은 6조6400억kWh로 사회 전체 전력 소비량의 64%를 차지한다. 그 중 성, 지역 간 거래되는 전력량은 1조 6천억kWh에 육박하며, 녹색 전력 거래량은 전년 대비 38% 이상 증가한 3,285억kWh에 달했다."},{"s":"이기학 두산에너빌리티 팀장 \"해상풍력, 국산 터빈·인프라 함께 키워야\"","so":"뉴스1","tm":"11/11 14:26","c":1,"r":"kr","u":"https://www.news1.kr/economy/trend/6350548","p":1794374765,"a":1794403049},{"s":"글로벌 정책은 데이터 센터 그리드 지연, 탄소 배출 감소를 목표로 합니다.","so":"Bloomberg.com","tm":"11/11 13:08","c":1,"r":"us","u":"https://www.bloomberg.com/news/articles/2026-11-11/global-policies-target-data-center-grid-delays-lower-emissions?srnd=homepage-asia","p":1794370129,"a":1794377567,"t":"Global Policies Target Data-Center Grid Delays, Lower Emissions"},{"s":"\"AI 전력 수요 잡는다\"…두산퓨얼셀, 9분기 연속 적자 딛고 북미 공략 지속","so":"뉴시스","tm":"11/11 11:40","c":1,"r":"kr","u":"https://mobile.newsis.com/view_amp.html?ar_id=NISX20261111_0003863299","p":1794364819,"a":1794377567,"su":"[서울=뉴시스]박현준 기자 = 수소연료전지 전문기업 두산퓨얼셀의 적자가 계속되는 가운데 북미 전력 수요 확대에 대응한 공급계약 확보와 생산체계 정비가 실적(회사가 번 돈 성적표) 반등의 과제로 떠올랐다"},{"s":"기후부, AI 전력 병목 대응…\"수요 분산·송전망 선제 구축\"","so":"뉴스1","tm":"11/11 11:30","c":1,"r":"kr","u":"https://www.news1.kr/economy/env-policy/6350321","p":1794364233,"a":1794367486},{"s":"‘K-전력기기’ 수출 날개단다…전기硏, 글로벌 시험인증 표준 선도","so":"헤럴드경제","tm":"11/11 11:22","c":1,"r":"kr","u":"https://biz.heraldcorp.com/article/10933534","p":1794363747,"a":1794367486,"su":"[헤럴드경제=구본혁 기자] 전 세계 단 11개 시험기관만 정회원 자격을 보유한 전력기기 시험인증 분야 최고 권위의 국제회의가 한국에서 열린다. 한국전기연구원(KERI)은 1"},{"s":"데이터센터 못 지으면 한국으로 오세요…랠리 펼친 네이버, 시총 20위 ‘각축’","so":"매일경제 마켓","tm":"11/11 11:06","c":1,"r":"kr","u":"https://stock.mk.co.kr/news/view/1195994","p":1794362762,"a":1794363244,"su":"데이터센터(컴퓨터 수만 대를 모아 둔 건물) 못 지으면 한국으로 오세요…랠리 펼친 네이버, 시총 20위 ‘각축’ 김송현 기자(kim.songhyun@mk.co.kr) 입력 : 2026.11.11 11:06:02 네이버 등 시총 20위 경쟁 美 데이터센터 규제에 희비 금리 부담에 산업주 약세 미국의 데이터센터 건설 규제 우려가 커지면서 국내 증시의 시가총액(회사 전체 몸값) 순위에도 변화가 나타나고 있다. 해외 인공지능(AI) 연산 수요를 겨냥한 네이버가 강세를 보인 반면 두산에너빌리티와 HD현대중공업 등 기존 산업주는 약세를 보이며 시총 20위 자리를 놓고 치열한 순위 경쟁이 벌어지고 있다."},{"s":"KERI, 고전압 전력기기 시험인증 최고권위 'STL 기술위원회' 김해서 개최","so":"전자신문","tm":"11/11 11:05","c":1,"r":"kr","u":"https://www.etnews.com/20261111000020","p":1794362700,"a":1794363006,"su":"한국전기연구원(KERI·원장 강상희)이 11일부터 사흘간 일정으로 경남 김해 롯데호텔앤리조트에서 '제73차 세계단락시험협의체(STL) 기술위원회 회의'를 개최한다. STL은 글로벌 고전압 전력기기 시험기관이 참여하는 최고 권위의 국제 협력체다. 발전소에서 만들어진 전기가 가정과 산업 현장으로 안전하게 공급되려면 수많은 전력기기를 거치는데 이 기기들이 낙뢰 등 극한의 환경을 고장 없이 견뎌내는지 평가하는 엄격한 국제 기준을 STL에서 다룬다."},{"s":"KERI, 세계 전력기기 시험기관 11곳과 국제표준 논의","so":"데일리안","tm":"11/11 11:00","c":1,"r":"kr","u":"https://www.dailian.co.kr/news/view/1713407/KERI-%EC%84%B8%EA%B3%84-%EC%A0%84%EB%A0%A5%EA%B8%B0%EA%B8%B0-%EC%8B%9C%ED%97%98%EA%B8%B0%EA%B4%80-11-2026","p":1794362400,"a":1794377798,"su":"세계 주요 전력기기 시험기관 전문가들이 경남 김해에 모여 고전압 전력기기 시험기술과 국제표준 발전 방향을 논의한다.한국전기연구원(KERI)은 오는 13일까지 경남 김해 롯데호텔앤리조트에서 ‘제73차 세계단락시험협의체 기술위원회(STL TC) 회의’를 개최한다고 11일 밝혔다.세계단락 优必选与永达首批400台超仿生人形机器人U1 Pro采购合同落地","su":"유비텍은 지난 11월 11일 국내 고급차 유통·서비스 상장(주식시장에 처음 들어오는 것)기업 용다(Yongda)와 전략적 협력 협약을 체결했다. 이번 협약에 따라 용다는 유비텍이 올해 안에 납품할 예정인 유비텍 슈퍼바이오닉 휴머노이드 로봇 U1 Pro 400대를 구매하게 된다. Jiemian News는 독립적으로 생각하는 사람들에게만 서비스를 제공합니다. 광고 등 상업적 협력을 원하시면 여기를 클릭하세요"},{"s":"마에야스카와 전기 사장의 고오가와 마사히로씨의 이별회, 12월 23일에 리가 로얄 호텔 고쿠라에서… 헌화를 접수","so":"読売新聞","tm":"11/11 10:34","c":3,"r":"jp","u":"https://www.yomiuri.co.jp/local/kyushu/news/20261111-GYS1T00076/","p":1794360840,"a":1794361903,"t":"前安川電機社長の故小川昌寛氏のお別れの会、１２月２３日にリーガロイヤルホテル小倉で…献花を受け付け","su":"【読売新聞】 前安川電機社長の故小川昌寛氏のお別れの会は、１２月２３日午前１１時３０分、北九州市小倉北区浅野２の１４の２リーガロイヤルホテル小倉４階「ロイヤルホール」で行われる。午後０時３０分まで献花を受け付ける。主催は安川電機。香"},{"s":"휴머노이드 로봇 대량 생산 통과, 베이징에서 새로운 신호 전송","so":"21财经","tm":"11/12 20:09","c":2,"r":"cn","u":"https://www.21jingji.com/article/20261112/herald/2e0220ce5528e7791312914b5761ce5d.html","p":1794481740,"a":1794489706,"t":"人形机器人量产关口，北京放出新信号","su":"21세기 비즈니스 헤럴드 기자 Zhou Hui가 베이징에서 보도한 내용 휴머노이드 로봇이 디스플레이 프로토타입에서 상용 검증으로 전환하는 중요한 시점에 베이징은 3개년 로드맵을 작성했습니다. 11월 11일, 베이징시 경제정보기술국은 '베이징 구현 지능형 로봇 산업 고품질 발전 실행 계획(2026~2028)'(이하 '계획')을 발표하고 구현 지능형 로봇 산업을 '고정밀 산업의 중요한 영역이자 미래 산업의 핵심 돌파구'로 자리매김하고 '세계 최고 수준 5개 이상, 국내 10개 이상 육성'이라는 목표를 명확히 했습니다. 2028년까지 휴머노이드 로봇 완성기계 기업을 선도하겠습니다.\" 목표를 달성하는 방법은 무엇입니까? 산업 중심의 관점에서 볼 때 전체 산업 체인에 대한 지원과 베이징-천진-허베이 협력은 계획의 두 가지 핵심 하이라이트입니다."},{"s":"휴머노이드 로봇 산업화 가속화, 관련 테마 ETF 규모 확대","so":"21财经","tm":"11/12 11:45","c":2,"r":"cn","u":"https://www.21jingji.com/article/20261112/herald/cef2537f56968a25e72b3222440367b7.html","p":1794451541,"a":1794453371,"t":"人形机器人产业化进程加速 相关主题ETF规模攀升","su":"人形机器人产业化进程加速 相关主题ETF(여러 주식을 묶어 파는 상품)规模攀升 部分头部机器人主题ETF规模已突破百亿元。其中，易方达国证机器人产业ETF最新规模达到212.55亿元，华夏中证机器人ETF最新规模为167.16亿元，均处于百亿元以上。 近日，特斯拉人形机器人 Optimus启动早期量产的消息引发市场关注。人形机器人 正在加快从技术演示走向实际生产。产业端的积极进展，也带动人形机器人 板块近期回暖。数据显示，截至11月10日，产业代表性指数国证机器人 产业指数近一个月涨超10%，机器人 主题投资热度有所回升。"},{"s":"중국의 로봇 급증 뒤에는 숨겨진 우려가 있을까? Xie Jinhe가 Yushu와 FANUC를 비교하며 놀라운 격차를 드러냅니다.","so":"自由時報","tm":"11/12 09:45","c":2,"r":"tw","u":"https://stock.ltn.com.tw/article/zn5hnexge3vm","p":1794444306,"a":1794453371,"t":"中國機器人狂飆背後藏隱憂？謝金河比較宇樹、發那科揭驚人落差","su":"全球機器人產業快速發展，日本工業機器人與中國人形機器人走出不同發展路線。財信傳媒集團董事長謝金河近日參訪日本發那科（FANUC）名古屋技術中心後，在臉書發文比較發那科與中國宇樹科技的營運表現，指出兩家公司雖然同屬機器人產業，但技術發展方向與獲利能力存在明顯差異，也讓他質疑中國依靠國家補貼推動的人形機"},{"s":"Yuan Tai는 좋은 소식을 발표하고 구글의 가장 강력한 VLA 로봇 사업 기회를 포착합니다.","so":"經濟日報","tm":"11/12 01:20","c":2,"r":"tw","u":"https://money.udn.com/money/story/5612/9873068?form=udn_ch2_common3_cate","p":1794414045,"a":1794437368,"t":"元太報喜 大咬 Google 最強 VLA 機器人商機","su":"클라우드 거대 기업 구글 산하 가장 강력한 시각언어모델(VLA) 로봇 모델 제미니 로보틱스 2.5가 출시되면서 로봇의 전투 능력이 한 단계 도약했다. 대만 제조업체 중 Yuantai(8069)는 전자 종이 제품을 공급하고 직렬 인간-기계 인터페이스 통신에서 중요한 역할을 하며 막대한 비즈니스 기회를 포착하고 있습니다."},{"s":"휴머노이드부터 제조 AI까지‘로봇의 미래’총집결… 5만여 명 열광한‘2026 로보월드’폐막","so":"로봇신문","tm":"11/11 18:09","c":2,"r":"kr","u":"https://www.irobotnews.com/news/articleView.html?idxno=49538","p":1794388173,"a":1794437366,"su":"국내 대표 로봇산업 전문 전시회인 ‘2026 로보월드(ROBOTWORLD 2026)’가 지난 11월 4일부터 7일까지 나흘간 경기도 고양시 킨텍스에서 개최돼 역대"},{"s":"로봇이 마트 일도 척척?…국제로봇콘테스트 13일 개막","so":"이데일리","tm":"11/11 14:34","c":2,"r":"kr","u":"https://www.edaily.co.kr/News/Read?newsId=04575606645644736&mediaCodeNo=257","p":1794375243,"a":1794377578,"su":"상품을 진열하고 계산하는 휴머노이드부터 발전소 위험 작업을 대신할 로봇까지 산업 현장의 과제를 해결하는 로봇 경연이 대구에서 열린다. 한국로봇산업진흥원은 오는 13~14일 대구 엑스코에서 ‘제21회 국제로봇콘테스트’를 개최한다고 11일 밝혔다. 제21회 국제로봇콘..."},{"s":"베이징: 2028년까지 세계 최고 수준의 5개 이상, 국내 최고의 휴머노이드 로봇 완성 기계 기업 10개 이상 육성 노력","so":"第一财经","tm":"11/11 13:43","c":2,"r":"cn","u":"https://www.yicai.com/news/103435910.html","p":1794372239,"a":1794377583,"t":"北京：力争到2028年培育不少于5家国际一流、10家国内领先的人形机器人整机企业","su":"{{aisd}} AI 생성 면책조항 베이징 경제 정보(Beijing Economic Information)에 따르면 \"실체형 지능형 로봇 산업의 고품질 발전을 위한 베이징 실행 계획(2026-2028)\"이 발표되었습니다. 이 계획은 베이징이 구현된 지능형 로봇 산업을 고정밀 산업의 중요한 영역이자 미래 산업의 핵심 돌파구로 간주하고 산업의 고품질 발전 촉진을 가속화하며 2028년까지 5개 이상의 세계 일류 기업과 10개의 국내 선도 기업을 육성하기 위해 노력할 것이라고 제안합니다. 완전한 로봇 기업으로서 구현된 지능형 모델, 로봇 본체 및 핵심 기술은 모두 세계 일류 수준에 도달했습니다. 베이징-천진-허베이 지역은 전국 전체 기계 생산 능력의 25%를 차지하고 핵심 부품 일치율은 60%를 초과합니다. 전체 수명주기, 다부처 협력 참여를 포괄하는 과학적이고 효과적인 안전 거버넌스 시스템을 구축하고, 이 도시를 세계적 수준의 지능형 로봇 기술 구현 및 산업 혁신의 고지로 건설하는 것은 이번이 처음입니다."},{"s":"구글, ‘제미나이 로보틱스 2.5’ 공개…휴머노이드 로봇 손재주·작업 신뢰성 대폭 향상","so":"로봇신문","tm":"11/11 13:09","c":2,"r":"kr","u":"https://www.irobotnews.com/news/articleView.html?idxno=49525","p":1794370156,"a":1794377578,"su":"구글 딥마인드가 로봇의 작업 수행 능력과 정밀도를 크게 향상시킨 로봇 인공지능(AI) 모델 ‘제미나이 로보틱스 2.5(Gemini Robotics 2.5)’를 1"},{"s":"세계 최초의 생체공학 휴머노이드 로봇 뉴스 앵커 공개","so":"Japan Wire by Kyodo News","tm":"11/11 11:43","c":2,"r":"us","u":"https://english.kyodonews.net/articles/-/91038","p":1794364980,"a":1794377580,"t":"World's first bionic humanoid robot news anchors unveiled","su":"AsiaNet 202017 베이징, 2026년 11월 11일 /Xinhua-AsiaNet/ -- 제7차 세계 미디어 서밋의 일환으로 베이징에서 열린 인공 지능 및 중국 현대화에 관한 포럼에서 11월 5일 세계 최초의 생체 공학 휴머노이드 로봇 뉴스 앵커가 공개되었습니다."},{"s":"피지컬 AI 핵심부품 키운다…센서·로봇관절·배터리 ‘초혁신’ 추가","so":"이데일리","tm":"11/11 09:00","c":2,"r":"kr","u":"https://www.edaily.co.kr/News/Read?newsId=03398086645644736&mediaCodeNo=257","p":1794355204,"a":1794361903,"su":"정부가 피지컬 AI(인공지능)의 핵심부품인 차세대 센서와 액추에이터, 휴머노이드용 이차전지 육성 계획을 내놨다. 로봇 부품 국산화율을 2030년까지 80%로 끌어올리고, 중국에 밀린 배터리 시장에선 휴머노이드용 제품으로 반격에 나선다는 구상이다. (사진=현대자동차·..."},{"s":"〈상하이은행 파숴〉 미국 휴머노이드 로봇 수주, AI 물류로봇 연내 출하 예정","so":"鉅亨網","tm":"11/10 19:54","c":2,"r":"tw","u":"https://news.cnyes.com/news/id/6656020","p":1794308055,"a":1794316569,"t":"〈上銀法說〉美系人形機器人接單報捷 AI物流機器人最快年底出貨","su":"<상하이은행 화슈> 미국의 휴머노이드 로봇이 수주(일감 주문을 받는 것)에 성공해 AI 물류 로봇이 이르면 연말 출하될 예정이다. Juheng.com 기자 Chen Yuqing Taipa Shanghai Bank(2049-TW)가 오늘(10일) Zhuo Wenheng 회장이 직접 주최하는 2026년 3분기 컨퍼런스를 개최했습니다. 그는 완벽한 수직 통합 능력을 바탕으로 미국의 주요 휴머노이드 로봇 제조업체의 공급망에 진입했으며 수만 개의 소형 선형 슬라이드 레일 주문을 성공적으로 획득했다고 밝혔습니다. 내년 초 일괄 출하를 시작할 것으로 예상된다. 이와 함께 미국 실리콘밸리 스타트업과 협력해 개발한 AI 특화 물류로봇도 최신 사양 검증을 완료해 연말까지 소량 출하할 준비를 마쳤다. Zhuo Wenheng은 로봇 분야에서 SIBO의 가장 큰 장점은 “완벽한 수직 통합 역량”에 있다고 분석했습니다. 관계사 Dayin Microsystems(4576-TW)에서 생산하는 서보 모터 및 드라이브와 Dayin 자체 개발한 감속기, 크로스 롤러 베어링 및 볼 스크류를 결합하여 고객에게 핵심 부품부터 전체 시스템까지 원스톱 솔루션을 제공할 수 있습니다."},{"s":"중국은행은 내년 영업에 대해 낙관하고 있으며 상품 인도 시기를 연장했다. 휴머노이드 로봇에 대한 소량 주문을 받았습니다 | 산업경제학","so":"中央社 CNA","tm":"11/10 16:42","c":2,"r":"tw","u":"https://www.cna.com.tw/news/afe/202611100191.aspx","p":1794296520,"a":1794298423,"t":"上銀明年營運看佳產品交期拉長獲人形機器人小批訂單| 產經","su":"변속기 부품 공장 Shangyin의 Zhuo Wenheng 회장은 오늘 볼 스크류 및 선형 슬라이드 제품의 현재 납품 날짜가 2027년 중반까지라고 말했습니다. 4분기 영업이익(장사해서 남긴 돈)은 3분기에 비해 증가할 것으로 예상된다. 2027년 운영은 두 자릿수 비율로 증가할 것으로 예상됩니다. 주문은 계속 강세(오르는 힘이 센 것)를 보이고 있으며 로봇 성능은 내년에도 계속해서 성장할 수 있습니다. 그는 Shanghai Banking Group이 미국의 주요 휴머노이드 로봇 제조업체로부터 소량 주문을 받았다고 밝혔습니다."},{"s":"클로봇, 55억 규모 휴머노이드 협업 과제 주관…KG모빌리티 공장 실증","so":"이데일리","tm":"11/10 13:59","c":2,"r":"kr","u":"https://www.edaily.co.kr/News/Read?newsId=04480486645644408&mediaCodeNo=257","p":1794286760,"a":1794298417,"su":"로봇 운영 플랫폼 전문기업 클로봇(466100)이 다중 로봇 통합관제 기술을 휴머노이드 협업으로 확장해 자동차 생산현장 적용을 추진한다고 10일 밝혔다. 클로봇 CI.(사진=클로봇)클로봇은 산업통상부와 한국산업기술기획평가원(KEIT)이 추진하는 ‘2026년도 로봇산..."},{"s":"티로보틱스, KAIST와 ‘피지컬 AI’ 사업화 협력…휴머노이드·AMR 실증 가속","so":"이투데이","tm":"11/13 11:22","c":1,"r":"kr","u":"https://www.etoday.co.kr/news/view/2647851?trc=sub_list_news","p":1794536520,"a":1794539865,"su":"제조피지컬AI연구소와 MOU…표준화 얼라이언스·글로벌 시장 공략카이로스 프로젝트 이어 협력 확대…자체 휴머노이드 ‘티알웍스’ 현장 검증▲티로보틱스"},{"s":"테슬라│테슬라, 사이버트럭 원격조종자동차와 옵티머스 Gen 2.5 인형 출시","so":"香港經濟日報HKET","tm":"11/13 11:00","c":1,"r":"hk","u":"https://inews.hket.com/article/4224397/Tesla%EF%BD%9C%E7%89%B9%E6%96%AF%E6%8B%89%E6%8E%A8Cyber%E2%80%8B%E2%80%8Btruck%E9%81%99%E6%8E%A7%E8%BB%8A%E5%92%8COptimus%20Gen%202.5%E7%8E%A9%E5%81%B6?mtc=20023","p":1794535200,"a":1794539870,"t":"Tesla｜特斯拉推Cyber​​truck遙控車和Optimus Gen 2.5玩偶"},{"s":"베이징은 구현형 지능형 로봇 산업을 위한 3개년 행동 계획을 발표했습니다. 로봇ETF 셀레스티카(159770)는 어제 3천만주가 넘는 순청약을 기록하며 같은 입찰로 선전증권거래소에서 1위를 차지했다.","so":"Jiemian.com","tm":"11/13 10:22","c":1,"r":"cn","u":"https://www.jiemian.com/article/15328455.html","p":1794532970,"a":1794539869,"t":"北京发布具身智能机器人产业三年行动方案，机器人ETF天弘(159770)昨日净申购超3000万份为深市同标的第一","su":"2026년 11월 12일 거래 종료 기준으로 로봇 ETF(여러 주식을 묶어 파는 상품) Celestica(159770)는 하루 동안 3,150만 건의 순 청약을 기록하여 심 팅 인프"},{"s":"휴머노이드, 「채팅 GPT형」의 보급되지 않고 용도・지역 등 물리적인 벽","so":"日経ビジネス電子版","tm":"11/13 00:00","c":1,"r":"jp","u":"https://business.nikkei.com/atcl/NBD/19/00150/110900162/","p":1794495600,"a":1794496168,"t":"ヒューマノイド、「チャットGPT型」の普及せず 用途・地域など物理的な壁","su":"생성 AI는 순식간에 세계로 퍼졌지만, 몸을 가진 휴머노이드에는 제조와 물류, 운용 등의 '물리적인 벽'이 있다. 소프트웨어의 성공 체험을 적용하는 것이 아니라 현실의 제약을 근거로 한 전략이 기업의 리더에게 묻고 있다."},{"s":"트럼프 씨 차남 출자의 미 신흥, 인간형 로봇 공급으로 이스라엘 군과 협의","so":"日本経済新聞","tm":"11/13 00:00","c":1,"r":"jp","u":"https://www.nikkei.com/prime/ft/article/DGXZQOCB123D60S6A111C2000000","p":1794495600,"a":1794523866,"t":"トランプ氏次男出資の米新興、ヒト型ロボット供給でイスラエル軍と協議","su":"파운데이션 퓨처 인더스트리즈의 루블랑은 최대 1000대의 인간형 로봇 공급에 대해 이스라엘 국방군과 협의하고 있다고 말한다. 로이터 트럼프 미국 대통령의 차남 에릭 트럼프 씨가 출자하는 미국 기업이 팔레스타인 자치구 가자 지하에 있는 이슬람 조직 하마스의 터널을 순회하는 휴머노이드(인간형 로봇)의 공급을 향해 이스라엘 국방군(IDF)과 협의하고 있다. 장래적으로는 전투에 관련될 가능성도 있다. 미 신흥 파운데이션 퓨처 인더스트리즈의 마이크 르블랑 공동 창업자 겸 사장은 이스라엘 군 당국의 고위관과 9월에 예비적으로 협의해"},{"s":"JP모건 Chase: 미국의 휴머노이드 로봇 연간 생산량은 2035년까지 150만 대에 이를 것으로 예상됩니다.","so":"工商時報","tm":"11/12 23:06","c":1,"r":"tw","u":"https://www.ctee.com.tw/news/20261112702461-430701","p":1794492360,"a":1794496168,"t":"摩根大通：2035年前美國人形機器人年產量上看150萬台- 國際","su":"JP모건 체이스는 휴머노이드 로봇이 점차 실증에서 상용화로 나아가면서 미국 내 휴머노이드 로봇의 연간 생산량이 2030년에는 30만~40만대, 2035년에는 150만대에 이를 것으로 예상한다고 지적했다. 기업들이 반복적인 작업을 자동화하려고 함에 따라 인력 부족, 비용 효율성 개선, 생산 능력 확대로 제조, 물류, 산업 분야에서 휴머노이드 로봇의 활용이 확대되고 있다. 창고. JP모건 체이스는 트럼프 행정부가 수입 로봇과 산업용 기계를 다음과 같이 결정했다고 밝혔다."},{"s":"휴머노이드의 수, 세계 인구 초과는 몇 년 후? 서양 팀이 시산","so":"毎日新聞","tm":"11/12 21:00","c":1,"r":"jp","u":"https://mainichi.jp/articles/20261112/k00/00m/040/035000c","p":1794484800,"a":1794489719,"t":"ヒューマノイドの数、世界人口超えは何年後？ 欧米チームが試算","su":"인공지능(AI)을 탑재해 주변 환경에 대응하면서 복잡한 태스크를 자율적으로 해내는 인형 로봇 '휴머노이드'가 약 60년 후에는 100억체 이상으로 늘어 세계 인구를 넘을 가능성이 있다는 연구 성과를 구미 팀이 정리했다. 현재, 재고 관리나 공장 등에서 약 1만체가 도입되어 향후는 가사나 개호를 지원하는 역할도 기대되고 있다"},{"s":"휴머노이드 로봇 3D 비전 시장 규모는 15억 달러! Cognex는 공급망에 참여하기 위해 AVerMedia(2471) 및 Advantech(2395)을 인수하는 데 5억 달러를 지출합니다.","so":"鉅亨網","tm":"11/12 20:00","c":1,"r":"tw","u":"https://news.cnyes.com/news/id/6660725","p":1794481206,"a":1794489716,"t":"人形機器人3D視覺市場上看15億美元！康耐視砸5億美元併購圓剛(2471)、研華(2395)參與供應鏈","su":"휴머노이드 로봇 3D 비전 시장 규모는 15억 달러! Cognex는 공급망 Uanalyze에 참여하기 위해 AVerMedia(2471) 및 Advantech(2395)을 인수하는 데 5억 달러를 지출합니다. 2026년 11월 12일(Uanalyze/산업 데이터 센터 보고) ⸺ 휴머노이드 로봇은 기술 시연에서 상용 애플리케이션으로 점차 이동하고 있으며 3D 시각적 인식이 공급망 레이아웃의 초점이 되었습니다. 미국의 주요 머신비전 기업인 코그넥스(CGNX-US)는 글로벌 로봇 시각 인식 시장이 현재 약 5억 달러에서 2030년쯤에는 10억~15억 달러로 규모가 2~3배 정도 커질 것으로 추정하고 있다. 회사는 인텔(INTC-US)의 분사인 리얼센스(RealSense)를 5억 달러에 인수할 계획이다. 대만 제조업체인 AVerMedia(2417-TW)와 Advantech(2395-TW)는 로봇 시각 인식과 관련된 애플리케이션에 참여하기 위해 RealSense와 기술 협력을 시작했습니다."},{"s":"로봇 신전국3기/로봇은 가정 서비스 분야에서 수조 달러 규모의 비즈니스 기회를 열어줍니다. 세 가지 주요 혁명이 인생을 바꿉니다.","so":"經濟日報","tm":"11/12 19:09","c":1,"r":"tw","u":"https://money.udn.com/money/story/124921/9874102","p":1794478159,"a":1794489718,"t":"機器人新戰國3／機器人打開家庭服務兆元商機 三大革命翻轉生活","su":"아침에 일어나면 로봇이 거실을 정리하고 식탁을 치워줍니다. 낮에는 노인들이 식료품을 가져오고 식사를 배달하는 것을 돕고, 밤에는 설거지를 하고 옷을 개는 것도 가능합니다. 이것은 더 이상 공상과학 영화의 단순한 줄거리가 아닙니다. 물리적 AI의 발전이 가속화되면서 휴머노이드 로봇이 공장에서 가정으로 이동하고 있다. 앞으로 그들은 가사, 노인 돌봄, 가족 경제의 3대 혁명을 일으킬 것입니다."},{"s":"JP모건체이스는 2030년 미국의 휴머노이드 로봇 생산량이 40만대에 달하고, 2035년에는 시장 규모가 300억 달러에 이를 것으로 내다봤다.","so":"财联社","tm":"11/12 17:50","c":1,"r":"cn","u":"https://www.cls.cn/detail/2532979","p":1794473400,"a":1794489708,"t":"摩根大通预计美国人形机器人2030年产量达40万台 2035年市场规模或逼近300亿美元","su":"① JP모건 Chase는 미국의 휴머노이드 로봇의 연간 생산량이 2030년까지 300,000~400,000대에 도달하고, 2035년까지 약 150만 대까지 증가할 것이라고 보고했습니다. ② 은행은 액츄에이터, 모터, 비전 시스템 등 핵심 부품 시장 규모가 2035년까지 300억 달러에 육박할 것으로 전망하고 있다. 파이낸셜뉴스에이전시, 11월 12일(편집자 니우잔린) JP모건 Chase는 목요일 보고서를 통해 업계가 기술 시연에서 상용화로 전환함에 따라 미국 내 휴머노이드 로봇의 연간 생산량이 2035년까지 30만~40만대에 달할 것이라고 밝혔다. 2030년에는 약 150만 개로 늘어날 것이며, 2035년에는 약 150만 개로 늘어날 것입니다. 은행은 노동력 부족, 비용 효율성 개선, 제조 능력 향상이 시장 성장의 주요 원동력이 될 것이라고 믿습니다."},{"s":"SoftBank와 엔비디아가 협력하여 85억 달러 가치의 독일 로봇 스타트업에 투자","so":"财联社","tm":"11/12 17:50","c":1,"r":"cn","u":"https://www.cls.cn/detail/2532982","p":1794473400,"a":1794489709,"t":"软银、英伟达联手押注 德国机器人初创公司估值达85亿美元","su":"① 독일 로봇 제조업체 Agile Robots SE는 SoftBank Group이 주도하는 새로운 자금조달 라운드를 완료하여 회사 가치가 85억 달러에 달했습니다. ② Agile은 2026년에 약 2,000대의 휴머노이드 로봇을 생산할 것으로 예상되며, 이를 기반으로 2027년 생산량은 2배, 심지어 3배까지 늘어날 것으로 예상된다. Financial News Agency는 11월 12일(자오 하오 편집장) 독일의 로봇 제조업체인 Agile Robots SE가 소프트뱅크 그룹이 주도하는 새로운 자금 조달을 완료했으며 회사 가치는 85억 달러에 달했다고 보도했습니다. 이번 자금 조달은 스타트업에 인공지능(AI) 기반 로봇 생산 규모를 확대하기 위한 새로운 자금을 제공할 것입니다."},{"s":"로브로스, 휴머노이드 AI 자체 개발…내년 오픈소스 공개 목표","so":"이데일리","tm":"11/12 17:31","c":1,"r":"kr","u":"https://www.edaily.co.kr/News/Read?newsId=04532966645645064&mediaCodeNo=257","p":1794472316,"a":1794489702,"su":"로브로스가 자체 휴머노이드용 인공지능(AI) 모델을 개발하고 내년 오픈소스 공개를 추진한다. 실제 작업 환경을 가상공간에 구현해 로봇을 학습시키고 이를 실제 기체에서 검증하는 방식으로 산업 현장 적용을 준비한다. 로브로스는 지난 9~10일 열린 ‘엔비디아 AI 데..."},{"s":"주요 정책 발표: 베이징은 연간 200,000대의 휴머노이드 로봇 생산 능력을 목표로 하고 있습니다! 로봇 ETF 차이나 유니버셜(159213) 지수가 4% 이상 하락했고, 이러한 추세에 반하는 자금이 쏟아졌습니다! 휴머노이드 로봇은 판매 초기 단계에 있으며, 매출은 지속적으로 가시화되고 있습니다.","so":"Jiemian.com","tm":"11/12 17:25","c":1,"r":"cn","u":"https://www.jiemian.com/article/15326332.html","p":1794471907,"a":1794489711,"t":"重磅政策发布，北京锚定20万台人形机器人年产能！机器人ETF汇添富(159213)指数跌超4%，资金逆势涌入！人形机器人放量初期，收入持续兑现","su":"로봇ETF(여러 주식을 묶어 파는 상품) 차이나유니버셜(159213) 기초지수는 4% 넘게 하락했다. 이러한 추세를 거스르고 고성장하는 휴머노이드 로봇 트랙에 자금이 쏟아졌습니다. 로봇ETF 차이나유니버셜(159213)이 하루종일 소액의 돈을 모았습니다!"},{"s":"지능형 로봇 산업의 새로운 길을 개척하기 위해 많은 곳에서 경쟁하고 있습니다.","so":"第一财经","tm":"11/12 17:20","c":1,"r":"cn","u":"https://www.yicai.com/news/103438536.html","p":1794471600,"a":1794489712,"t":"多地竞相布局智能机器人产业新赛道","su":"{{aisd}} AI 생성 면책 조항 신흥 핵심 산업 중 하나로 지능형 로봇은 다양한 장소가 레이아웃을 놓고 경쟁하는 새로운 트랙이 되고 있습니다. 베이징은 11일 '베이징 구현 지능형 로봇 산업 고품질 발전 실행 계획(2026~2028)'(이하 '실행 계획')을 발표하고 2028년까지 세계 최고 수준의 5개, 국내 선두의 10개 휴머노이드 로봇 기업을 육성하기 위해 노력할 것을 제안했다. 베이징은 세계적 수준의 구현 지능형 로봇 기술의 원천이자 산업 혁신의 고지로 건설될 것이다. 앞서 상하이, 선전, 항저우, 광둥, 장쑤, 후난 등에서는 지능형 로봇 산업 발전을 지원하는 정책 문서를 집중적으로 발표해 왔다. 각 지역은 자신의 장점을 충분히 발휘하고 지역 여건에 따라 지능형 산업 구현을 위한 차별화된 발전 경로를 공식화해야 합니다."},{"s":"Anker Innovation이 투자한 로봇 회사인 Amio는 크게 축소되었습니다. 올해 상반기에는 추가 투자가 없었고 154만 위안의 투자 손실을 확인했다.","so":"Jiemian.com","tm":"11/12 16:49","c":1,"r":"cn","u":"https://www.jiemian.com/article/15325114.html","p":1794469767,"a":1794489714,"t":"安克创新押注的机器人公司阿米奥大幅收缩，今年上半年未追加投资并确认154万元投资损失","su":"지몐 뉴스 기자 | Anker Innovation이 창업하고 주도한 구체화된 정보 회사는 핵심 팀의 이탈을 경험하고 있습니다. 11월 11일, Leifeng.com은 산업 구현 지능 기업인 Amio Robots의 원래 CTO, COO 및 제품 리더가 차례로 사임했다고 보도했습니다. 회사의 팀 규모는 최고조에 달했을 때 약 130명에서 70명 이상으로 줄어들었고, 새로운 인력 최적화 작업이 여전히 진행 중입니다. 내부자는 Anke가 더 이상 Amio에 계속 투자할 의향이 없다고 Leifeng.com에 밝혔습니다. 그 이유는 구체화된 지능의 긴 상용화 주기와 Amio의 현금 흐름에 대한 압박과 관련이 있습니다. 아미오 투자기관은 회사가 여전히 정상적으로 운영되고 있다고 밝혔다. Jiemian News 기자는 Anker Innovation의 재무 보고서를 검토한 결과 2026년 상반기에 Anker가 Amio에 대한 추가 지분 투자를 계속하지 않은 것으로 나타났습니다. 동시에 Amio는 지분법을 적용하여 회계처리하여 당기 동안 약 153.9만 위안의 투자 손실이 확인되었습니다."},{"s":"中 통신사-유비테크 맞손, '휴머노이드' 가정 내 보급키로","so":"로봇신문","tm":"11/12 16:44","c":1,"r":"kr","u":"https://www.irobotnews.com/news/articleView.html?idxno=49552","p":1794469445,"a":1794489702,"su":"중국에서 휴머노이드 로봇을 가정 내에 공급하기 위한 기업 간 협력이 추진된다.11일 중국 로봇 전문 포털 중국로봇망에 따르면 중국 관영 통신사 차이나텔레콤(Chi"},{"s":"美 피규어AI, 휴머노이드 로봇 운영 현장 관리자 채용한다","so":"로봇신문","tm":"11/12 16:08","c":1,"r":"kr","u":"https://www.irobotnews.com/news/articleView.html?idxno=49544","p":1794467334,"a":1794489702,"su":"미국 휴머노이드 로봇 기업 피규어 AI(Figure AI)가 휴머노이드 로봇의 실제 운영을 담당할 현장 관리자를 모집한다. 피규어 AI는 최근 공식 채용 사이트를"},{"s":"[정구민의 테크읽기] 로보월드가 보여준 우리나라 로봇 산업의 현재와 미래","so":"전자신문","tm":"11/12 16:00","c":1,"r":"kr","u":"http://www.etnews.com/20261112000096","p":1794466800,"a":1794467145,"su":"'2026 로보월드'는 우리나라의 로봇과 피지컬 인공지능(AI) 경쟁력을 잘 보여주면서 성황리에 막을 내렸다. 개막식에서 로보티즈는 휴머노이드 AI 사피엔스로 태권도와 K팝 공연을 선보였다. 로보티즈의 태권도와 K팝 공연은 전 세계 태권도 팬들과 K팝 팬들에게 큰 인기를 끌기도 했다. 로보월드에서는 휴머노이드·4족 보행 로봇·배송로봇·제조 로봇을 비롯해 다양한 형태의 로봇을 만날 수 있었다. 제조 응용을 중심으로 물류·조리·서비스·엔터테인먼트 등 적용 분야도 한층 다양해졌다."},{"s":"닛토크는 뒷장에 카이 기배 절상, 휴머노이드 로보 관련 82억엔 수주 획득","so":"株探","tm":"11/12 15:02","c":1,"r":"jp","u":"https://kabutan.jp/news/marketnews/?b=n202611120862","p":1794463320,"a":1794489720,"t":"ＮＩＴＴＯＫは後場にカイ気配切り上げ、ヒューマノイドロボ関連で８２億円の受注獲得"},{"s 요합니다. 2026년 초에 고품질의 실제 물리적 상호 작용 데이터의 전 세계 재고는 약 500,000시간인 반면, 일반 구현 모델 교육에는 최소 1,000만 시간이 필요합니다. 재고는 수요의 5% 미만이다. 중장기적으로 촉각 획득 관련 장비에 대한 수요가 많습니다."},{"s":"[리포트 브리핑]두산로보틱스, 'Automation에서 Autonomy로' 목표가 68,000원 - NH투자증권","so":"뉴스핌","tm":"11/11 13:55","c":1,"r":"kr","u":"https://www.newspim.com/news/view/20261111000950","p":1794372900,"a":1794377578,"su":"[서울=뉴스핌] 로보뉴스 = NH투자증권에서 11일 두산로보틱스(454910)에 대해 'Automation에서 Autonomy로'라며 투자의견 'BUY(신규)'의 신규 리포트를 발행하였고, 목표가 68,000원을 내놓았다. 전일 종가 기준으로 볼 때, 이 종목의 주가는 목표가 대비 34.1%의 추가 상승여력이 있다는 해석이 가능하다. ◆ 두산로보틱스 리포트 주요내용 NH투자증권에서 두산로보틱스(454910)에 대해 '두산로보틱스는 리레이팅을 위한 과도기를 거치는 중."},{"s":"12:54:51 [휴머노이드 로봇 부문이 계속해서 활발한 활동을 펼치고 있으며, 로봇 ETF E펀드(159530) 기초지수가 반나절 만에 1% 상승했다.]","so":"财联社","tm":"11/11 13:54","c":1,"r":"cn","u":"https://www.cls.cn/detail/2531208","p":1794372891,"a":1794403073,"t":"12:54:51【人形机器人板块延续活跃表现，机器人ETF易方达（159530）标的指数半日涨1%】","su":"휴머노이드 로봇 부문이 계속해서 활발한 활동을 펼치고 있으며, 로봇 ETF(여러 주식을 묶어 파는 상품) E펀드(159530) 기초지수가 반나절 만에 1% 상승했다."},{"s":"베이징: '두 세션과 하나의 경쟁'을 위해 로봇 브랜드를 계속해서 연마합니다.","so":"第一财经","tm":"11/11 13:43","c":1,"r":"cn","u":"https://www.yicai.com/brief/103435914.html","p":1794372180,"a":1794377808,"t":"北京：持续擦亮机器人“两会一赛”品牌","su":"베이징경제정보(Beijing Economic Information)에 따르면, '베이징 구현 지능형 로봇 산업 고품질 발전 실행 계획(2026-2028)'이 발표되었으며, 이 계획은 로봇의 '두 세션과 하나의 경쟁' 브랜드를 지속적으로 연마할 것을 제안합니다. 사람을 키우다"},{"s":"일본 ‘제 1회 휴머노이드 로봇 엑스포’, 11일 개막...13일까지 사흘간 열려","so":"로봇신문","tm":"11/11 13:19","c":1,"r":"kr","u":"https://www.irobotnews.com/news/articleView.html?idxno=49527","p":1794370771,"a":1794377578,"su":"일본 ‘제1회 휴머노이드 로봇 엑스포(가을)’가 지바현 마쿠하리 메세 전시장에서 11일 개막했다. 올해 4월 빅사이트 전시장에서 열린 '제1회 휴머노이드 로봇 엑"},{"s":"미디어 코프의 TV 프로그램이 YY 포스의 로봇을 소개[GNW]","so":"時事ドットコム","tm":"11/11 12:39","c":1,"r":"jp","u":"https://www.jiji.com/jc/article?k=2026111100530&g=bnw","p":1794368340,"a":1794377586,"t":"メディアコープのテレビ番組がＹＹフォースのロボットを紹介〔ＧＮＷ〕","su":"【글로브 뉴스와이어】싱가포르에 본사를 두고, 아시아 전역에서 AI를 활용한 워크포스(노동력) 관리 플랫폼의 운영과 통합 시설 관리(IFM) 서비스를 다루는 YY포스는 9일, 동사의 휴머노이드 로봇 트레이닝의 대처가, 미디어 월 11일 초반 거래에서 A주 휴머노이드 로봇 콘셉트가 등락을 보이며 상승했다. Fenglong Shares(002931.SZ)는 일일 한도를 마감하고 3회 연속 보드를 기록했습니다. 이전에는 11월 9일과 10일에 Fenglong 주식이 2거래일 연속 일일 한도에 도달했습니다. 10일 종가는 주당 48.25위안으로, 시가총액(회사 전체 몸값)은 약 105억위안이다. 홍콩 증시 기준으로 로봇 업종은 11월 10일 상승세(오르는 흐름)를 이어갔다. Sagitar Robotics(02498.HK)는 9.50% 마감했고, Horizon Robot-W(09660.HK)는 7.48%, UBTECH(09880.HK)는 6.90% 마감했다."}]}],"auto":{"🇰🇷 한국":["데일리안","아시아투데이","아주경제"]},"breaking_url":"https://raw.githubusercontent.com/inwonc4524-code/Investment_NotiBot/main/breaking.json","show":8}</script>
<script>
var D = JSON.parse(document.getElementById('data').textContent);
var RL = {}; D.regions.forEach(function(r){ RL[r.k] = r.l; });
function $(id){ return document.getElementById(id); }
function esc(t){ return String(t==null?'':t).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
// 휴대폰에 기억해 두는 값 (마지막 탭, 탭별로 마지막에 본 시각, 정렬, 국가)
function load(k, d){ try { var v = localStorage.getItem('nb_'+k); return v===null ? d : JSON.parse(v); } catch(e){ return d; } }
function save(k, v){ try { localStorage.setItem('nb_'+k, JSON.stringify(v)); } catch(e){} }
var S = { tab: 0, seen: load('seen', null), sort: load('sort', 'c'), region: load('region', 'all'), shown: D.show, prev: {} };
function newest(t){ var m = 0; t.items.forEach(function(n){ if(n.a > m) m = n.a; }); return m; }
if(S.seen === null){ S.seen = {}; D.themes.forEach(function(t){ S.seen[t.name] = newest(t); }); save('seen', S.seen); }  // 처음 방문: 레드닷 없이 시작
(function(){ var nm = load('tabname', ''); D.themes.forEach(function(t, i){ if(t.name === nm) S.tab = i; }); })();  // 마지막에 본 탭 (이름으로 기억)
if(location.hash && /^#t\d+$/.test(location.hash)) S.tab = +location.hash.slice(2);
if(S.tab >= D.themes.length) S.tab = 0;

function visible(t){
  return t.items.filter(function(n){ return S.region==='all' || n.r===S.region; });
}
function sorted(list, breaking){
  var k = breaking ? 'p' : S.sort;
  return list.slice().sort(function(x,y){
    var c = y.c - x.c, p = y.p - x.p; return k==='c' ? (c||p) : (p||c);
  });
}
function renderTabs(){
  $('tabs').innerHTML = D.themes.map(function(t, i){
    var dot = newest(t) > (S.seen[t.name] || 0) && i !== S.tab;
    return '<button class="tab'+(i===S.tab?' on':'')+'" onclick="openTab('+i+')">'+esc(t.name)+
           '<b>'+visible(t).length+'</b>'+(dot?'<span class="dot" title="새 뉴스"></span>':'')+'</button>';
  }).join('');
  var on = $('tabs').children[S.tab]; if(on && on.scrollIntoView) on.scrollIntoView({block:'nearest', inline:'center'});
}
function renderCtrl(){
  var br = D.themes[S.tab].breaking;
  var h = '';
  if(!br){
    h += '<button class="'+(S.sort==='c'?'on':'')+'" onclick="setSort(\'c\')">🔥 화제순</button>';
    h += '<button class="'+(S.sort==='p'?'on':'')+'" onclick="setSort(\'p\')">🕒 최신순</button><span class="sep"></span>';
  }
  h += '<button class="'+(S.region==='all'?'on':'')+'" onclick="setRegion(\'all\')">전체</button>';
  D.regions.forEach(function(r){
    h += '<button class="'+(S.region===r.k?'on':'')+'" onclick="setRegion(\''+r.k+'\')">'+esc(r.l)+'</button>';
  });
  $('ctrl').innerHTML = h;
}
function card(n, prev){
  var hot = n.c > 1 ? '<span class="hot'+(n.c>=5?' big':'')+'">🔥 언론 '+n.c+'곳</span>' : '';
  var isNew = prev && n.a > prev ? ' <span class="new">NEW</span>' : '';
  return '<a class="card" href="'+esc(n.u)+'" target="_blank" rel="noopener" data-s="'+esc(n.su||'')+'" data-so="'+esc(n.so)+'">'+
    '<div class="meta">'+hot+esc(RL[n.r]||'')+' · '+esc(n.so)+' · '+esc(n.tm)+isNew+'</div>'+
    '<div class="title">'+esc(n.s)+'</div>'+(n.t?'<div class="orig">'+esc(n.t)+'</div>':'')+'</a>';
}
function renderMain(){
  var t = D.themes[S.tab], list = sorted(visible(t), t.breaking), prev = S.prev[t.name] || 0;
  var h = '<h2>'+esc(t.name)+'</h2>' + (t.note ? '<p class="note">'+esc(t.note)+'</p>' : '');
  var fresh = prev ? list.filter(function(n){ return n.a > prev; }).length : 0;
  if(S.onlyNew){                                // '새 기사만 보기' 중
    list = list.filter(function(n){ return n.a > prev; });
    h += '<button class="newbar" onclick="onlyNew(false)">🆕 새 기사 '+list.length+'개만 보는 중 · 전체 보기</button>';
  } else if(fresh && !t.breaking){              // 새 기사가 정렬 때문에 아래로 밀려도 바로 찾을 수 있게
    h += '<button class="newbar" onclick="onlyNew(true)">🆕 새 기사 '+fresh+'개 · 새 기사만 보기</button>';
  }
  if(!list.length) h += '<p class="none">'+(S.region==='all' ? '최근 ' + (t.breaking?'속보':'기사') + ' 없음' : esc(RL[S.region])+' 기사 없음')+'</p>';
  h += list.slice(0, S.shown).map(function(n){ return card(n, prev); }).join('');
  var extra = list.length - S.shown;
  if(extra > 0) h += '<button class="more" onclick="more()">더보기 ▾  ('+extra+'개 더)</button>';
  else if(S.shown > D.show) h += '<button class="more" onclick="less()">접기 ▴</button>';
  var auto = Object.keys(D.auto);
  h += '<footer>업데이트 '+esc(D.updated)+' · 최근 3일 · 믿을 만한 언론사 기사만 · 기사를 누르면 한국어 요약 → 원문 보기<br>'+
       '🔥 언론 N곳 = 같은 소식을 보도한 언론사 수 (많을수록 화제) · <span style="color:var(--red)">●</span> = 새 뉴스'+
       '<br><br><b>자동으로 추가된 언론사</b> (주요 언론보다 먼저 보도하고, 주요 언론도 함께 다룬 소식이 많은 곳 · 최근 14일)'+
       (auto.length ? auto.map(function(k){ return '<div>'+esc(k)+': '+esc(D.auto[k].join(', '))+'</div>'; }).join('') : '<div>아직 없음</div>')+
       '</footer>';
  $('main').innerHTML = h;
}
function openTab(i){
  var t = D.themes[i];
  S.tab = i; S.shown = D.show; S.onlyNew = false; save('tabname', t.name);
  if(!(t.name in S.prev)) S.prev[t.name] = S.seen[t.name] || 0;     // 이 탭에서 NEW 로 보여줄 기준
  S.seen[t.name] = Math.max(S.seen[t.name] || 0, newest(t)); save('seen', S.seen);  // 탭에 들어오면 레드닷 지움
  history.replaceState(null, '', '#t'+i);
  renderTabs(); renderCtrl(); renderMain(); window.scrollTo(0, 0);
}
function setSort(k){ S.sort = k; save('sort', k); S.shown = D.show; renderCtrl(); renderMain(); }
function setRegion(k){ S.region = k; save('region', k); S.shown = D.show; renderTabs(); renderCtrl(); renderMain(); }
function more(){ S.shown += 20; renderMain(); }
function onlyNew(on){ S.onlyNew = on; S.shown = D.show; renderMain(); }
function less(){ S.shown = D.show; renderMain(); window.scrollTo(0, 0); }
$('upd').textContent = '업데이트 ' + D.updated + ' · 탭을 눌러 테마별 뉴스 보기';

// 🚨 미국 속보 · 🌏 해외 속보는 페이지를 새로 올리지 않아도 최신 내용을 바로 가져옴
function refreshBreaking(){
  if(!window.fetch) return;
  fetch(D.breaking_url + '?t=' + Date.now(), {cache:'no-store'}).then(function(r){ return r.json(); }).then(function(b){
    var all = b.items || [];
    D.themes.forEach(function(t, i){
      if(!t.breaking) return;
      var items = all.filter(function(n){ return n.theme === t.name; }).map(function(n){
        var d = {s:n.show, so:n.source||'', tm:n.time||'', c:n.count||1, r:n.rk||'us', u:n.url||n.link, p:Math.floor(n.pub), a:Math.floor(n.added||n.pub)};
        if(n.show !== n.title) d.t = n.title; if(n.sum) d.su = n.sum; return d;
      });
      if(!items.length && t.items.length) return;
      t.items = items;
      if(S.tab === i){ S.seen[t.name] = Math.max(S.seen[t.name]||0, newest(t)); save('seen', S.seen); renderMain(); }
    });
    renderTabs();
  }).catch(function(){});
}
openTab(S.tab);
refreshBreaking();
setInterval(refreshBreaking, 5 * 60 * 1000);
document.addEventListener('visibilitychange', function(){ if(!document.hidden) refreshBreaking(); });

// 기사를 누르면 먼저 한국어 요약 → 원문 볼지 선택
document.addEventListener('click', function(e){
  var c = e.target.closest('a.card'); if(!c) return;
  if(e.ctrlKey||e.metaKey||e.shiftKey) return;
  e.preventDefault();
  $('s-meta').innerHTML = c.querySelector('.meta').innerHTML;
  $('s-title').textContent = c.querySelector('.title').textContent;
  var o = c.querySelector('.orig'); $('s-orig').textContent = o ? o.textContent : '';
  var sm = c.dataset.s || '';
  $('s-sum').textContent = sm || '이 기사는 요약을 가져오지 못했어요. (사이트가 자동 접속을 막았거나 아직 준비 중)';
  $('s-sum').className = 's-sum' + (sm ? '' : ' empty');
  $('s-go').href = c.href;
  // 외국어 기사면 ✦ Gemini 버튼 보이기 (한국어 기사는 숨김)
  var foreign = !!o || !/[가-힣]/.test(c.querySelector('.title').textContent);   // 번역이 안 됐어도 외국 기사면 버튼 표시
  $('s-cs').hidden = $('s-ct').hidden = $('s-cnote').hidden = !foreign;
  if(foreign){
    // 원문을 열고, Gemini 가 '지금 화면'의 기사를 읽고 답하도록 요청 문장만 복사
    $('s-cs').href = $('s-ct').href = c.href;
    $('s-cs').dataset.q = '이 페이지의 기사 전체를 처음부터 끝까지 읽고 한국어로 요약해 줘. 핵심 내용 3~5줄, 그리고 투자자 입장에서 중요한 숫자와 의미를 짧게 정리해 줘.';
    $('s-ct').dataset.q = "너는 어려운 경제 뉴스를 초등학생도 이해할 수 있게 풀어 주는 친절한 번역가야.\n이 페이지의 뉴스 기사 전체를 쉬운 한국어로 번역해 줘.\n\n[가장 중요한 규칙]\n- 쉽게 쓰더라도 기사 내용은 정확해야 해. 사실을 빼거나, 바꾸거나, 지어내지 마.\n- 기사 순서대로, 빠지는 내용 없이 번역해 줘.\n\n[쉽게 쓰는 방법]\n1. 한 문장에는 한 가지 내용만 써 줘. 문장은 짧게.\n2. \"~습니다/~해요\"체로 친절하게 써 줘.\n3. 어려운 말은 쉬운 말로 바꾸고, 꼭 필요한 전문 용어는 처음 나올 때 괄호로 뜻을 풀어 줘.\n   (예: 금리(돈을 빌릴 때 내는 이자의 비율), 실적(회사가 번 돈과 성과), 주가(회사 주식 한 주의 가격))\n4. 한자어·외래어보다 쉬운 우리말을 먼저 써 줘. (예: 하락 → 떨어졌어요, 상승 → 올랐어요)\n5. 큰 숫자는 읽기 쉽게 바꾸되 정확한 값은 지켜 줘. (예: $2.5 billion → 25억 달러(약 3조 5천억 원쯤))\n   환율로 바꾼 값은 \"약\"을 붙여서 대략이라는 걸 알려 줘.\n6. 회사·사람 이름은 한국에서 부르는 이름으로 쓰고, 처음 나올 때만 괄호에 영어 이름을 적어 줘. (예: 엔비디아(Nvidia))\n7. 누가 한 말인지 분명하게 써 줘. (예: 젠슨 황 대표는 \"…\"라고 말했어요.)\n\n[출력 형식]\n① 한 줄 요약: 이 기사가 무슨 이야기인지 한 문장으로\n② 쉬운 번역: 기사 순서대로\n③ 어려운 말 풀이: 기사에 나온 경제 용어 3~5개를 한 줄씩 쉽게 설명\n④ 그래서 무슨 뜻이야?: 이 소식이 주식 투자하는 사람에게 왜 중요한지 2~3줄\n   (기사에 나온 사실만 근거로, 내 생각이나 예측은 넣지 마)\n\n기사가 길어서 한 번에 다 못 하면, 어디까지 했는지 알려 주고 내가 \"계속\"이라고 하면 이어서 해 줘.";
  }
  $('dim').hidden = false; $('sheet').hidden = false; $('sheet').scrollTop = 0;
  document.body.style.overflow = 'hidden';
});
// ✦ 버튼: Gemini 요청 문장을 복사하고 원문을 엶 → 원문 화면에서 Gemini 를 불러 붙여넣기
function askAI(a){
  var q = a.dataset.q || '';
  try { if(navigator.clipboard) navigator.clipboard.writeText(q); } catch(e){}
  toast('요청 문장을 복사했어요 · 원문에서 측면 버튼 길게 → 「이 페이지에 관해 질문하기」 → 붙여넣기');
  setTimeout(closeSheet, 50);
}
function toast(msg){ var t = $('toast'); t.textContent = msg; t.hidden = false; clearTimeout(toast._t); toast._t = setTimeout(function(){ t.hidden = true; }, 4000); }
function closeSheet(){ $('dim').hidden = true; $('sheet').hidden = true; document.body.style.overflow = ''; }
document.addEventListener('keydown', function(e){ if(e.key==='Escape') closeSheet(); });
</script></body></html>
