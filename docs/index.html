:root{color-scheme:dark;--bg:#262624;--card:#30302e;--card2:#3a3a37;--text:#faf9f5;--sub:#a6a39a;--line:#3e3e3a;--acc:#d97757;--red:#ef4444}

.upd{color:var(--sub);font-size:12.5px}

.tabs{position:sticky;top:0;z-index:3;background:rgba(38,38,36,.96);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}

.tab{position:relative;flex:none;padding:9px 15px;border-radius:12px;border:1px solid var(--line);background:var(--card);

.tab.on{background:var(--acc);border-color:var(--acc);color:#1f1e1d;font-weight:600}.tab.on b{color:#1f1e1d}
.dot{position:absolute;top:-3px;right:-3px;width:11px;height:11px;border-radius:50%;background:var(--red);border:2px solid var(--bg)}

.ctrl .sep{flex:none;width:1px;background:var(--line);margin:2px 4px}
main{padding:6px 12px 48px}

.none{color:var(--sub);margin:24px 4px;text-align:center}

.card:hover{background:var(--card2)}.card:active{opacity:.75}
.meta{color:var(--sub);font-size:12px}
.title{font-weight:500;margin-top:3px}
.orig{color:var(--sub);font-size:12px;margin-top:3px}
.new{margin-left:4px;color:var(--red);font-size:11px;font-weight:700;letter-spacing:.3px}
.hot{display:inline-block;margin-right:6px;padding:0 6px;border-radius:4px;background:rgba(217,119,87,.16);color:var(--acc);font-weight:600}
.hot.big{background:var(--acc);color:#1f1e1d}
.newbar{display:block;width:100%;margin:2px 0 6px;padding:9px;border:0;border-radius:10px;background:rgba(239,68,68,.14);color:#fca5a5;font:inherit;font-size:13px;text-align:left}
.more{display:block;width:100%;margin:4px 0 0;padding:10px;border:1px dashed var(--line);border-radius:12px;background:transparent;color:var(--sub);font:inherit;font-size:13px}
footer{margin:36px 4px 0;padding-top:14px;border-top:1px solid var(--line);color:var(--sub);font-size:12px;line-height:1.7}

/* 요약 창 */
#dim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:5}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:6;max-width:760px;margin:auto;max-height:82vh;overflow-y:auto;
  background:var(--card);border-radius:16px 16px 0 0;padding:10px 18px calc(18px + env(safe-area-inset-bottom));box-shadow:0 -8px 30px rgba(0,0,0,.4)}
.grab{width:38px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 12px}
.s-title{font-size:17px;font-weight:600;margin:4px 0 2px;line-height:1.45}
.s-label{margin:16px 0 4px;color:var(--acc);font-size:12px;font-weight:700;letter-spacing:.5px}
.s-sum{font-size:15px;line-height:1.75}.s-sum.empty{color:var(--sub);font-size:13.5px}
.s-btns{display:flex;gap:8px;margin-top:20px}
.s-btns a{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;padding:11px 6px;border-radius:10px;font:inherit;font-size:13.5px;line-height:1.3;text-decoration:none;
  background:var(--acc);color:#1f1e1d;font-weight:600}
.s-btns a.cl{background:transparent;border:1px solid var(--acc);color:var(--acc)}
.s-close button{width:100%;margin-top:8px;padding:11px;border-radius:10px;background:transparent;border:1px solid var(--line);color:var(--sub);font:inherit;font-size:14px}
.s-cnote{margin-top:8px;color:var(--sub);font-size:11.5px;text-align:center}
#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);z-index:9;max-width:90%;padding:10px 16px;border-radius:10px;background:#faf9f5;color:#1f1e1d;font-size:13.5px;box-shadow:0 6px 20px rgba(0,0,0,.4)}
.seg{display:flex;gap:4px;margin:6px 4px 10px}.seg button{flex:1;min-width:0;border:1px solid var(--line);background:transparent;color:var(--sub);border-radius:8px;padding:7px 0;font:inherit;font-size:12.5px;white-space:nowrap}
.seg.ly{margin-top:-4px}.seg.ly button{padding:5px 0;font-size:12px}.seg.ly button.on{background:var(--card2);border-color:var(--acc);color:var(--text);font-weight:600}
.seg.sm{margin-bottom:8px}.seg.sm button{padding:9px 0;font-size:13px}.seg.sm button.on{background:var(--card2);border-color:var(--acc);color:var(--text)}
.notes{margin:0 4px 10px}.helpl{margin:4px 0 0;padding:8px 10px 8px 26px;border-radius:8px;background:var(--card2);font-size:12.5px;line-height:1.6;color:var(--text)}.helpl li{margin:2px 0}.notes summary{cursor:pointer;font-size:13px;color:var(--sub);padding:6px 10px;border-radius:8px;background:rgba(250,204,21,.08);list-style:none}.notes summary::-webkit-details-marker{display:none}.notes summary:before{content:"▸ ";}.notes[open] summary:before{content:"▾ ";}.notes[open] summary{margin-bottom:6px}.notes .warn{margin:0 0 6px}.warn{margin:0 4px 10px;padding:8px 10px;border-radius:8px;background:rgba(250,204,21,.08);color:var(--sub);font-size:12.5px;line-height:1.5}.warn b{color:var(--text)}
.seg button.on{background:var(--acc);border-color:var(--acc);color:#1f1e1d;font-weight:600}
.tot{margin:2px 4px 10px;color:var(--sub);font-size:13px}.tot b{color:var(--text)}.chgnote{font-size:11px}
.srow{background:var(--card);border-radius:12px;margin:6px 0;padding:10px 12px;cursor:pointer}.srow.open{background:var(--card2)}
.sline{display:flex;align-items:center;gap:8px}
.rk{width:18px;color:var(--sub);font-size:12px;text-align:right;flex:none}

.spark{flex:none}
.det{margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.dt{color:var(--sub);font-size:12px;margin:6px 0 4px}
.bars{width:100%;height:auto;display:block}.bars .ax{fill:var(--sub);font-size:10px}.bars .bar:hover rect+rect{opacity:.8}

 \"과잉생산 징후\"...관세 이어 투자 압박?","so":"YTN","tm":"11/26 19:13","c":3,"r":"kr","u":"https://www.ytn.co.kr/_ln/0102_202611261913285422","p":1795687980,"a":1795689094,"su":"미 무역대표부는 우리 반도체(전자기기 속에서 계산하고 기억하는 작은 부품) 산업 등을 겨냥해 과잉생산 징후가 두드러진다고 지적했습니다. 3대 메가프로젝트 등 정부 정책을 빌미로 추가 관세(수입품에 붙이는 세금) 인상이나 투자 압박 가능성이 있다는 분석도 나옵니다. 김대근 기자가 보도합니다. 미 무역대표부는 한국의 반도체와 자동차, 석유화학 산업에서 구조적인 과잉생산 징후가 두드러진다고 지적했습니다."},{"s":"홍콩 주식의 기술적 반등으로 즉시 213억 달러의 남쪽 자금이 인출되었고 항셍 지수의 하루 상승폭은 260포인트 하락한 22226을 기록했습니다.","so":"etnet 經濟通","tm":"11/26 17:47","c":3,"r":"hk","u":"https://www.etnet.com.hk/www/tc/news/news-article.php?section=features&category=financenews&newsid=418314","p":1795682820,"a":1795683288,"t":"港股技術反彈即引213億北水退出，恒指全日升幅收窄至260點報22226","su":"홍콩 주식의 기술적 반등은 즉시 213억 달러의 남향 펀드의 인출로 이어졌고, 항셍지수의 하루 상승 폭은 260포인트인 22226으로 좁혀졌습니다. 다음날 밤 미국 증시는 V자 반등을 보였습니다. 홍콩 증시는 7연속 하락세를 보이며 22,000선을 돌파했습니다. 전날 14일 RSI 지수는 27까지 하락해 시장이 심각한 과매도(너무 많이 팔려 값이 지나치게 내려간 상태) 상태임을 나타냈다. 항셍지수는 오늘 오전 최대 577포인트 상승하며 강력한 기술적 반등을 촉발했습니다. 그러나 남향 펀드는 상승세(오르는 흐름)를 보이다가 오후에는 압박을 받으며 매도했습니다. 더욱 심화되면서 하루 동안 213억 위안 이상의 순유출이 기록되었는데, 이는 올해 4월 8일 이후 가장 높은 일일 남향 자본 흐름으로 시장의 이익을 끌어내리고 점차 좁아졌습니다. 하루 종일 260포인트(1.2%) 늘어난 22,226건으로 마감했고, 메인보드 거래량은 거의 2,125억 위안에 달했습니다. 항셍중국기업지수는 108포인트(1.5%) 상승한 7,493으로 마감했다. 항셍테크지수는 39포인트(1.2%) 상승한 3417로 마감했다."},{"s":"한은, 금리 3.25%로 인상…내년 1~2차례 더 올릴 듯, ‘이중 긴축’ 우려","so":"중앙일보","tm":"11/26 16:37","c":3,"r":"kr","u":"https://www.joongang.co.kr/article/25482301","p":1795678651,"a":1795678912,"su":"올해 세 차례 금리를 올린 한국은행이 긴축의 출구를 더 멀리 잡았다. 반도체 호황을 등에 업고 내년 경제성장률 전망치를 4.1%로 높이면서, 내년 상반기에만 한두 차례 추가 금리 인상(이자 비율을 올리는 것) 가능성을 열어뒀다. 반도체 호황의 온기가 경제 전반에 퍼지기도 전에 증시 급락과 이자 부담 증가라는 ‘이중 긴축’의 냉기도 밀려오고 있다. 한은 금융통화위원회는 26일 기준금리(중앙은행이 정하는 기본 이자 비율)를 연 3.0%에서 3.25%로 0.25%포인트 올렸다. 지난 7월과 8월에 이어 올해 세 번째 인상이다."},{"s":"[기준금리 3.25%] 반도체 호황 내년 성장률 4.1%…한은 \"성장 한 단계 높일 기회\"","so":"글로벌이코노믹","tm":"11/26 16:30","c":3,"r":"kr","u":"https://www.g-enews.com/article/Finance/2026/11/20261126155929966cd0bfacc1c_1","p":1795678236,"a":1795678915,"su":"한 95467697,"a":1795468355,"su":"11월 소비자 심리 지수(CCSI)는 103.1로 전월(105.4)보다 2.3포인트 하락한 것으로 조사됐다고 한국은행이 24일 밝혔다. 전월에 이어 두 달 연속 하락이다. 국내 증시가 급락한 데다, 대출 금리(돈을 빌릴 때 내는 이자 비율) 상승으로 이자 부담이 늘어나면서 소비 심리가 악화되고 있는 것이다. 소비자 심리 지수는 소비자의 경제 상황에 대한 인식과 향후 전망 등을 조사한 것이다. 이 지수가 100보다 높으면 장기 평균(2003~2025년)보다"},{"s":"[속보] 뉴욕증시, 젠슨 황 CEO 복귀에 상승…나스닥 6%·엔비디아 29%↑","so":"뉴시스","tm":"11/23 23:36","c":4,"r":"kr","u":"https://www.newsis.com/view/NISX20261123_0003880072","p":1795444581,"a":1795445062,"su":"[속보] 뉴욕증시, 젠슨 황 CEO(회사의 가장 높은 책임자) 복귀에 상승…나스닥(미국 기술 회사들이 많이 모인 주식시장) 6%·엔비디아 29%↑"},{"s":"뉴스/젠슨 황이 돌아와 미국 주식을 폭파했습니다! 엔비디아는 32% 급등했고, TSMC ADR은 20% 이상 상승했습니다.","so":"TVBS新聞網","tm":"11/23 23:35","c":1,"r":"tw","u":"https://news.tvbs.com.tw/money/4055128","p":1795444500,"a":1795445069,"t":"快訊／黃仁勳回鍋引爆美股！輝達飆32%、台積電ADR漲逾20%","su":"엔비디아 창립자 젠슨 황이 저녁에 공식적으로 CEO 자리에 복귀하여 월스트리트 매수를 촉발했습니다! 나스닥이 7.3%, S&P500(미국 큰 회사 500곳의 주가를 합쳐 만든 점수)이 4.9%, 다우존스산업평균지수도 2.7%, 필라델피아반도체지수가 14% 급등하는 등 미국 3대 증시가 23일 급등세를 보였다. 이 가운데 엔비디아 주가는 개장시 32.08% 급등했고, TSMC 미국예탁증서(ADR)도 20.78% 급등했다. 시장은 심하게 요동쳤고, 나스닥100 지수선물은 과도한 상승세(오르는 흐름)로 인해 일시적으로 거래를 중단하기도 했습니다. 중단 전 가격은 7.11% 상승했다."},{"s":"뉴스/젠슨황이 돌아왔습니다! 대만 주가지수 선물은 밤사이 씻겨나갔다가 하락세를 이어가며 '4만 돌파'","so":"TVBS新聞網","tm":"11/23 23:28","c":1,"r":"tw","u":"https://news.tvbs.com.tw/money/4055116","p":1795444080,"a":1795444356,"t":"快訊／黃仁勳回來了！台指期夜盤洗三溫暖 翻黑後暴漲「衝破40K」","su":"미국 정계와 재계 지도자들이 엔비디아 젠슨 황 전 CEO에 대한 태도를 누그러뜨릴 것이라는 의혹이 제기되고 있고, 위안부의 국가안보기금 규모 확대 발표 등 긍정적인 소식에 고무돼 오늘(23일) 오후 대만지수선물은 한때 3만7195포인트까지 치솟아 500포인트 이상 급등했다. 그러나 12월 미 연준의 금리 인상(이자 비율을 올리는 것)에 대한 시장의 기대가 높아지면서 대만지수선물도 야간거래에서 상승세(오르는 흐름)를 포기했다. 그러나 저녁 10시쯤 엔비디아는 젠슨 황이 공식적으로 회사에 복귀했음을 확인하는 보도 자료를 발표했습니다. 이 소식이 알려진 후, 대만 지수 선물은 밤새 거래에서 급등했습니다. 오후 10시 20분 현재 4만 포인트를 넘어섰다."},{"s":"Swire는 캐세이퍼시픽 주식을 8.5% 할인된 주당 NT$14.23에 매도하고 NT$36억을 현금화했습니다. (22:01) - 20261123 - 실시간 금융 뉴스","so":"明報財經網","tm":"11/23 23:09","c":1,"r":"hk","u":"https://finance.mingpao.com/fin/instantf/20261123/1795442882201/%E5%A4%AA%E5%8F%A4%E9%85%8D%E5%94%AE%E5%9C%8B% BA%E6%8C%87%E7%8F%BE%E5%83%B9%E6%A5%B5%E5%90%B8%E5%BC%95","p":1795662237,"a":1795662961,"t":"華爾街罕見「 同門內訌」Hedgeye分析師對Anthropic看法兩極 有人籲沽空 另一人指現價極吸引","su":"앤트로픽(ANT)의 주가는 상장(주식시장에 처음 들어오는 것) 이후 큰 폭의 등락을 보였습니다. 미국의 독립 조사기관인 헤지아이(Hedgeye)의 애널리스트 두 명은 주식에 대해 반대 의견을 거의 표현하지 않았다. 블룸버그 보도에 따르면 헤지아이 글로벌 기술 분석가 펠릭스 왕(Felix Wang)은 화요일(24일) 고객에게 보고서를 발행해 앤트로픽 공매도(주식을 빌려서 먼저 파는 것)를 권고하며 주가가 59달러까지 하락할 것으로 예상했다. 앤트로픽 팔로우를 담당하고 있는 통신 및 소프트웨어 분석가인 Andrew Freedman은 현재 가격이 92달러라는 합리적인 가치를 제공할 정도로 장기 투자자들에게 매력적이라고 말했습니다. 펠릭스 여"},{"s":"미국 증시는 기술주 매도 압력 속에 하락 마감 | 글로벌 금융 | 글로벌","so":"UDN","tm":"11/26 06:49","c":5,"r":"tw","u":"https://udn.com/news/story/6811/9902519","p":1795643359,"a":1795646959,"t":"科技股逢賣壓美股多收黑| 全球財經| 全球","su":"미국 추수감사절 연휴 이전에 기술주는 매도 압력을 받았습니다. 미국 주요 증시 대부분이 하락 마감했다. S&P와 나스닥(미국 기술 회사들이 많이 모인 주식시장)은 하락했지만 헐값 사냥이 시장에 진입한 후 장중 저점(가장 낮았던 값)에서 멀리 떨어진 곳에서 마감했습니다."},{"s":"나스닥, S&P500은 하락세를 보였지만 투자자들이 헐값에 매수하면서 저점을 크게 벗어났습니다.","so":"Yahoo Finance","tm":"11/26 07:19","c":4,"r":"us","u":"https://finance.yahoo.com/markets/stocks/articles/nasdaq-futures-slide-over-2-100822079.html","p":1795645170,"a":1795646914,"t":"Nasdaq, S&P 500 end down, but well off lows as investors buy bargains","su":"Caroline Valetkevitch 및 Ragini Mathur 11월 25일 (로이터) - 수요일 S&P500(미국 큰 회사 500곳의 주가를 합쳐 만든 점수)과 나스닥은 AI 관련 매도세(팔려는 힘) 속에서 하락세를 보였지만 당일에는 잘 마무리했습니다."},{"s":"[미국 증시시장 마감] 다우지수는 1,104포인트 하락 후 상승했고, 나스닥지수는 4% 하락했습니다. 애널리스트: 미국 증시는 감정적으로 불안하다","so":"香港經濟日報HKET","tm":"11/26 07:17","c":4,"r":"hk","u":"https://inews.hket.com/article/4229385/%E3%80%90%E7%BE%8E%E8%82%A1%E6%94%B6%E5%B8%82%E3%80%91%E9%81%93%E6%8C%87%E6%9B%BE%E6%8F%921104%E9%BB%9E%E5%BE%8C%E5%80%92%E5%8D%87%20%E7%B4%8D%E6%8C%87%E8%B7%8C%E5%B0%914-%20%E5%88%86%E6%9E%90%E5%93%A1%EF%BC%9A%E7%BE%8E%E8%82%A1%E5%B1%AC%E6%83%85%E7%B7%92%E6%81%90%E6%87%BC?mtc=20037","p":1795645028,"a":1795646982,"t":"【美股收市】道指曾插1104點後倒升 納指跌少4% 分析員：美股屬情緒恐懼"},{"s":"미국 경제는 적당한 속도로 계속 성장하고 있으며 연준의 베이지북은 인플레이션이 여전히 높다고 경고 | 글로벌 금융 | 글로벌","so":"UDN","tm":"11/26 10:10","c search_tag_result","p":1795683388,"a":1795694249,"t":"美股已陷熊市了？資深策略師：流動性觸頂下滑 比特幣、金價跌是前兆","su":"먼저 비트코인(인터넷에서 쓰는 대표 가상화폐) 가격이 급락했고, 금 가격이 하락했고, 이제 주식 시장이 폭락할 차례입니다. 공매도(주식을 빌려서 먼저 파는 것) 시장이 다가오고 있나요? 고위 투자 전략가 Hall은 유동성이 최고점에 도달했다가 하락했으며, 자산 가격이 최고점에서 자연스럽게 하락했기 때문에 그럴 수 있다고 믿습니다."},{"s":"투자자들이 미국 관세 계획을 무시함에 따라 아시아 주식이 상승","so":"WSJ","tm":"11/26 14:22","c":2,"r":"us","u":"https://www.wsj.com/finance/asian-stocks-rise-as-investors-shrug-off-u-s-tariff-plan-f8daa85b","p":1795670520,"a":1795676776,"t":"Asian Stocks Rise as Investors Shrug Off U.S. Tariff Plan"},{"s":"iQIYI: 나스닥으로부터 비준수 통지를 받았으며 180일 이내에 시정할 것입니다.","so":"Jiemian.com","tm":"11/26 13:52","c":2,"r":"cn","u":"https://www.jiemian.com/article/15376738.html","p":1795668737,"a":1795676778,"t":"爱奇艺：收到纳斯达克不合规通知，180日内整改","su":"iQiyi는 회사가 나스닥(미국 기술 회사들이 많이 모인 주식시장)으로부터 서면 통지를 받았다고 발표했습니다. 본 공지는 나스닥 상장(주식시장에 처음 들어오는 것) 규칙에 따른 일상적인 절차적 의사소통입니다. 이는 단지 비준수 통지일 뿐이며 회사의 ADS(American Depositary Notes)가 즉시 상장 폐지되거나 거래가 중단되는 결과를 가져오지는 않습니다. 회사의 ADS는 현재 기존 종목 기호로 나스닥에 계속 상장되고 거래될 것입니다. 회사가 이 통지를 받은 것은 회사의 사업 운영에 영향을 미치지 않으며 미국 증권거래위원회에 대한 회사의 정보 공개 의무는 변경되지 않습니다. 회사는 현재 180일 이내에 나스닥의 지속적인 상장 요구 사항을 다시 준수하고 상장 상태를 유지하기 위해 다양한 실행 가능한 옵션을 평가하고 있습니다. 향후 관련 개발 사항은 공식 발표를 참조하시기 바랍니다."},{"s":"미국 증시는 V자 반등, 홍콩 증시는 단기 바닥세 예상 | 루이스 구","so":"Sing Tao Daily 星島日報加拿大","tm":"11/26 13:20","c":2,"r":"hk","u":"https://www.singtao.ca/googleamp/amp.php?region=toronto_hk&cat=144&post_id=7695228","p":1795666832,"a":1795676796,"t":"美股V型大反彈 港股有望見短期底｜古天后","su":"11월 26일, 대체로 흐리고 낮에는 부분적으로 맑음. 마이클 버리는 이날 나스닥(미국 기술 회사들이 많이 모인 주식시장) 100 지수 풋옵션(정해진 값에 팔 권리) 포지션의 나머지 절반을 매도했다고 밝혔다. 다우존스산업평균지수는 장중 548포인트 하락한 뒤 급락해 가장 큰 폭의 하락세를 기록했습니다."},{"s":"\"장중 분석\" 미국 주식 및 대만 지수 선물은 V로 전환되었습니다. 대만 주식은 장 초반 39,000포인트로 반등하여 10일 이동 평균 상장 OTC 주식에 도전했습니다.","so":"旺得富理財網","tm":"11/26 12:02","c":2,"r":"tw","u":"https://wantrich.chinatimes.com/news/20261126900139-420101","p":1795662123,"a":1795694251,"t":"《盤中解析》美股、台指期V轉 台股早盤重返39000點挑戰10日均線- 上市櫃","su":"[타임스 좡빙농 기자 타이페이 보도] 미국 증시는 추수감사절을 앞두고 큰 반전을 보였다. 10월 PCE 인플레이션(물건값이 계속 오르는 것) 데이터는 예상보다 높았으며 트럼프 행정부는 14개 무역 파트너에 새로운 관세를 부과할 것을 제안했습니다. AI와 반도체(전자기기 속에서 계산하고 기억하는 작은 부품)주는 개장 후 매도했고, 다우존스 지수는 한때 1,100포인트 이상 하락했습니다. 그러나 염가 사냥은 이후 시장에 진입하여 추세에 반등했습니다. 결국 다우존스는 164.25포인트 상승했다. 대만지수선물도 야간장에서 큰 반전을 보이며 장중 2,190포인트 급락하며 하락세를 보였습니다."},{"s":"AI 주식은 장기간 하락 후 수렴. 월스트리트, AI 붐의 재정적 위험 재검토","so":"經濟日報","tm":"11/26 11:54","c":2,"r":"tw","u":"https://money.udn.com/money/story/123398/9902970","p":1795661675,"a":1795662953,"t":"AI股跌勢擴大後收斂　華爾街重新檢視AI熱潮財務風險","su":"월스트리트의 인공지능(AI) 테마주(같은 유행(주제)으로 함께 오르내리는 주식들)들은 오늘 장 초반 급락세를 보였지만 오후 들어 반등(내렸다가 다시 오르는 것)하며 올 가을 시장에서 또 한번의 롱숏 대결을 보였다. 한편, 투자자들은 비용 상승을 우려하고 있습니다."},{"s":"기술이 법정을 장악함에 따라 아시아 주식은 또 다른 반등을 즐깁니다.","so":"France 24","tm":"11/26 11:33","c":2,"r":"us","u":"https://www.france24.com/en/live-news/20261126-asian-stocks-enjoy-another-bounce-as-tech-holds-court","p":1795660398,"a":1795662935,"t":"Asian stocks enjoy another bounce as tech holds court"},{"s":"\"미국 주식\"뉴스 : 젠슨 황 사건 조사, Rashomon, 트럼프, Vans는 다른 의견을 가지고 있습니다 - 국제","so":"旺得富理財網","tm":"11/26 11:31","c":2,"r":"tw","u":"https://wantrich.chinatimes.com/news/20261126900131-420201","p":1795660277,"a":1795694252,"t":"《美股》消息面：調查黃仁勳事件羅生門川普、范斯說法迥異- 國際","su":"[타임즈 컴파일러 류지강 종합외신보도] 뉴스: ● 밴스 미국 부통령은 25일 법무부 최고 책임자인 토드 블랑쉬(Todd Blanche) 법무장관에게 질문한 뒤 상대방이 엔비디아 젠슨 황 CEO(회사의 가장 높은 책임자)는 조사를 받고 있지 않다고 답했다고 밝혔습니다. Vance는 젠슨 황이 조사 대상이 아니라고 확신하는 이유를 묻는 질문에 법무부와 국가 안보국 관리들이 황이..."},{"s":"월스트리트저널: 미국 정보국은 젠슨 황의 혼외 관계가 낭만적인 관계였으며 간첩 활동에 연루되지 않았다고 평가합니다.","so":"自由時報","tm":"11/26 10:37","c":2,"r":"tw","u":"https://news.ltn.com.tw/news/world/breakingnews/5653669","p":1795657061,"a":1795662954,"t":"華爾街日報：美情報評估黃仁勳婚外情是戀愛關係未涉間諜行動","su":"월스트리트저널은 25일 이 문제에 정통한 소식통을 인용해 엔비디아 CEO(회사의 가장 높은 책임자) 젠슨 황과 혼외 관계를 가졌던 중국 기술업계 여성 임원이 중국 정보기관으로부터 젠슨 황에 대한 간첩 활동을 지시받았다는 증거는 현재로서는 없다고 보도했다. 두 사람의 관계는 단지 남자와 여자의 사랑일 수도 있다. 로이터 통신은 이번 브리핑이 이번 주 초 트럼프 대통령이 젠슨 황의 복직 길을 열어 엔비디아 CEO가 미국 국가 안보에 위협을 가하지 않는다고 확신시킨 후에 나왔다고 보도했습니다."},{"s":"'미국 주식 스캔' 연휴 앞두 7:31","c":1,"r":"tw","u":"https://money.udn.com/money/story/123398/9903930","p":1795681877,"a":1795694257,"t":"美股26日休市 因為這個假期…","su":"미국 증시 뉴욕증권거래소(NYSE)와 나스닥(미국 기술 회사들이 많이 모인 주식시장)이 추수감사절 연휴로 인해 오늘(26일) 하루 종일 휴장한다. 유통업계 '블랙프라이데이' 최대 세일데이인 내일(27일) 마켓은 개장하지만 오후 1시에 조기 마감된다. 동부 시간."},{"s":"블룸버그 전략가: 금은 여전히 \"떨어지는 칼\"이며 비트코인의 하락은 미국 주식에 경고","so":"鉅亨網","tm":"11/26 17:00","c":1,"r":"tw","u":"https://news.cnyes.com/news/id/6672907","p":1795680011,"a":1795699342,"t":"彭博策略師：黃金仍是「下落的刀」，比特幣下跌警示美股"},{"s":"미국 증시의 반등은 '숏 커버링'의 환상입니다! Chen Jiawei는 대만 주식이 내일 탈출할 마지막 기회를 갖게 될 것이라고 선언합니다. 나쁜 소식은 선거 이후 12월에도 계속될 것입니다","so":"UDN","tm":"11/26 16:36","c":1,"r":"tw","u":"https://udn.com/news/story/12806/9903783","p":1795678591,"a":1795699344,"t":"美股反彈是「空頭回補」假象！陳嘉偉喊明天台股最後逃命機會：選後12月利空不斷","su":"미국 증시의 반등은 '숏 커버링'의 환상입니다! Chen Jiawei는 대만 주식이 내일 탈출할 마지막 기회를 가질 것이라고 선언합니다. 선거 이후 12월에도 나쁜 소식이 계속될 것입니다. 대만 주식은 오늘(26일) 956포인트 급등했으며 장중 반등이 강했습니다. 그러나 증권 분석가 Chen Jiawei는 시간외(정규 시간이 끝난 뒤 하는 거래) 오디오 및 비디오 프로그램에서 대만 지수 선물(미래 값을 미리 정해 사고파는 거래)이 어제 밤새 거래에서 2,000포인트 하락했다가 오늘 상승하여 시가를 더 높게 이끌었다고 솔직하게 말했습니다. 주된 이유는 추수감사절 연휴를 앞두고 미국 증시에서 '숏 커버링' 매수 주문이 있었던 것뿐이며, 대만 주식시장은 현재 대선을 앞두고 정부의 적극적인 시장 보호 단계에 있으며, 헤아릴 수 없는 반등으로 외국인 투자자들이 상황을 이용해 주식을 매도할 수 있게 됐다. 그는 27일이 선거 전 마지막 거래일이자 투자자들이 탈출할 수 있는 마지막 기회이기도 한다고 경고했다. 선거가 끝나면 12월에는 나쁜 소식이 뒤따를 것이고, 시장은 하락세를 가속화하여 이전 최저치인 35,542포인트 아래로 떨어질 수도 있습니다."},{"s":"밸류에이션 버블이 아니라 실적 버블이다","so":"Financial Times","tm":"11/26 16:30","c":1,"r":"world","u":"https://www.ft.com/content/511cf4f3-36ea-47a8-9c0b-96e0f8137a9f?syn-25a6b1a6=1","p":1795678210,"a":1795694268,"t":"It’s an earnings bubble, not a valuation bubble"},{"s":"핫파이낸스 | 미국 증시는 \"롤러코스터\"의 밤을 경험했고, A주는 오늘 아침 상승세를 보이며 분기를 이루었습니다.","so":"21财经","tm":"11/26 16:25","c":1,"r":"cn","u":"https://www.21jingji.com/article/20261126/herald/a3b127e8c6fd37a562f80e3cba8ff92d.html","p":1795677900,"a":1795694246,"t":"热财经｜美股经历“过山车”一夜，今晨A股高开分化","su":"현지 시간으로 11월 25일 미국 증시는 급등세를 보이다가 서서히 상승하며 '롤러코스터' 시장에 돌입했습니다. 다우지수는 164.25포인트, 즉 0.33% 상승한 50182.95포인트로 마감했으며 하루 종일 진폭은 2.96%였습니다. 나스닥은 0.62% 하락한 23585.80포인트를 기록했고 장중 4.5% 이상 하락했습니다. S&P500(미국 큰 회사 500곳의 주가를 합쳐 만든 점수)은 0.25% 하락한 7182.78포인트로 마감했으며, 하루 진폭은 3.18%였습니다. 11월 26일 A주는 밤새 미국 증시 반등으로 인해 오전 거래에서 상승세(오르는 흐름)로 출발했습니다. 창업판(차이넥스트) 지수는 장중 한때 2% 이상 상승한 후 상승폭이 축소되었습니다. 정오 마감시 상하이종합지수는 0.03% 하락한 3475.46포인트를 기록했다. 선전 구성요소 지수는 10101.72포인트로 0.15% 상승했다. 창업판지수는 0.06% 상승한 2184.99포인트를 기록했다. 수산물, 귀금속, 비철 텅스텐, 6G, 석탄 채굴 및 기타 부문이 가장 큰 상승세를 보였습니다."},{"s":"미국 증시는 반도체주가 V자형 반전을 경험했다. 엔비디아는 다시 거의 4% 하락했습니다. 금은 $3,500를 잃었고 회수되었습니다. 중국 기업 미국 상장주가 폭등했다.","so":"第一财经","tm":"11/26 15:26","c":1,"r":"cn","u":"https://www.yicai.com/news/103454503.html","p":1795674364,"a":1795694247,"t":"美股巨震芯片股V型反转，英伟达再跌近4%，黄金3500美元失而复得，中概股爆发","su":"*3대 주가지수는 다우존스 산업평균지수가 0.33% 상승하는 등 서로 다른 모습을 보였습니다. *중장기 미국 국채 금리는 하락했습니다. *연준의 베이지북은 인플레이션(물건값이 계속 오르는 것) 압력을 반복했습니다. 미국 증시는 트럼프 행정부가 계획한 무역관세의 영향을 저울질하는 가운데 기술주 등 고성장 부문에서 투자자들이 자금을 끌어들이는 가운데 수요일 바닥을 친 후 혼조세를 보였습니다. 마감 기준 다우존스산업평균지수는 164.25포인트(0.33%) 오른 50182.95포인트를 기록했다. 나스닥종합지수는 0.62% 하락한 23585.80포인트, S&P500(미국 큰 회사 500곳의 주가를 합쳐 만든 점수)지수는 0.25% 하락한 7182.78포인트에 마감했다. [인기주 성과] 스타기술주는 상승보다 하락폭이 더 컸는데, 메타가 3% 이상 상승하며 선두를 달리고 있는 반면, 테슬라, 마이크로소프트, 구글은 1% 이상 하락했다."},{"s":"AI 버블 | 골드만삭스 전략가들은 2018년 말과 같은 시장 상황이 반복돼 경제를 끌어내릴 것을 우려해 지금은 미국 주식의 바닥을 찾을 때가 아니라고 경고했다.","so":"etnet 經濟通","tm":"11/26 15:08","c":1,"r":"hk","u":"https://www.etnet.com.hk/www/tc/us-stocks/news-article/418298/AI%E6%B3%A1%E6%B2%AB+%7C+%E9%AB%98%E7%9B%9B%E7%AD%96%E7%95%A5%E5%B8%AB%E8%AD%A6%E5%91%8A%E7%8F%BE%E9%9D%9E%E7%BE%8E%E8%82%A1%E6%92%88%E5%BA%95%E6%99%82%E6%A9%9F%EF%BC%8C%E6%86%82%E9%87%8D%E6%BC%942018%E5%B9%B4%E6%9C%AB%E5%B8%82%E6%B3%81%E6%8B%96%E7%B4%AF%E7%B6%93%E6%BF%9F","p":1795673280,"a":1795676798,"t":"AI泡沫 | 高盛策略師警告現非美股撈底時機，憂重演2018年末市況拖累經濟"},{"s":"미국 주식을 암호화폐 시장에 도입하는 것이 정말 나쁜 일인가요?","so":"鉅亨網","tm":"11/26 15:01","c":1,"r":"tw","u":"https://news.cnyes.com/news/id/6672800","p":1795672867,"a":1795676787,"t":"加密市場引入美股真的是壞事嗎？","su":"미국 주식을 암호화폐 시장에 도입하는 것이 정말 나쁜 일인가요? Golden Finance 저자: Blockchain Knight; 출처: 결국 미국 증시는 암호화폐에 비해 사용자 기반이 더 크고 거래 수요가 상대적으로 안정적입니다. 그러나 저자는 이 문제에 대해 또 다른 각도가 있다고 생각합니다. 암호화 플랫폼은 미국 주식에만 의존하여 새로운 수입원을 찾는 것이 아니라 전통 금융 시장에 적극적으로 침투하고 있습니다. 이러한 작업의 논리는 실제로 간단합니다. 사용자는 이미 플랫폼에서 비트코인(인터넷에서 쓰는 대표 가상화폐)을 거래하고 있는데 왜 엔비디아와 애플을 구매할 수 없습니까?"},{"s":"비트코인은 냉담하다: 80억 개가 넘는 자금이 ETF에서 빠져나갔다: 월스트리트는 더 이상 그것을 감당할 수 없다?","so":"鉅亨網","tm":"11/26 15:00","c":1,"r":"tw","u":"https://news.cnyes.com/news/id/6672788","p":1795672855,"a":1795676790,"t":"比特幣寒意逼人：超80億資金逃離ETF：華爾街也扛不住了？","su":"비트코인(인터넷에서 쓰는 대표 가상화폐)은 냉담하다: 80억 개가 넘는 자금이 ETF에서 빠져나갔다: 월스트리트는 더 이상 그것을 감당할 수 없다? Golden Finance 작성자: Nancy, PANews 비트코인은 계속 하락하고 있으며 시장 냉각은 계속 확산되고 있습니다. 한때 시장에 적극적으로 참여했던 월스트리트 기관들은 이제 이를 감당할 수 없게 됐다. 한때 암호화폐 시장에 상승 모멘텀을 불어넣었던 현물 ETF는 이제 시장의 출혈 포인트가 되었습니다. 지난 두 달 동안 비트코인과 이더리움 현물 ETF는 계속 순유출을 겪었고, 기관 자금 인출 추세는 아직 반전되지 않았다. 그 중 비트코인 현물 ETF는 11월 역사상 최대 한 달 순유출 기록을 세웠다. 기관 자금의 지속적인 철수는 시장의 점진적인 매수세(사려는 힘)를 약화시켰을 뿐만 아니라, 투자자의 신뢰를 더욱 약화시켜 이미 위축된 시장 심리를 더욱 악화시켰습니다."},{"s":"연준 Beige Book: 미국 소비는 거의 변동이 없으며 데이터 센터는 칩 배송 시간을 연장합니다.","so":"鉅亨網","tm":"11/26 15:00","c":1,"r":"tw","u":"https://news.cnyes.com/news/id/6672727","p":1795672815,"a":1795699346,"t":"聯準會褐皮書：美國消費近乎持平資料中心拉長晶片交期","su":"연준(미국의 중앙은행) Beige Book: 미국 소비는 거의 정체 상태이고, 데이터 센터는 칩 배송 시간을 연장하고 있습니다. Uanalyze 2026년 11월 26일(Uanalyze/Industrial Data Center 보고서) ⸺ 연방준비제도(연준)는 25일 11월 베이지북을 발표했는데, 12개 지역 중 8개 지역에서 경제 성장이 보고되었는데 이는 이전 기간에 9 미만이었고 나머지 4개 지역은 대략 동일했습니다. 미국 전역의 소비자 지출은 크게 변하지 않았으며, 가계는 여전히 가격에 민감합니다. 대조적으로, 데이터 센터 건설은 일부 지역에서 제조 수요를 주도했습니다. 클리블랜드 지역 고객들은 칩 및 전기 부품의 배송 시간 연장으로 인해 미리 주문을 해왔습니다. 베이지북은 11월 16일 이전에 수집된 정보를 바탕으로 작성됐다. 전체 제조업 부문은 소폭 성장했는데, 일부 산업 부문의 강한 수요가 소비재와 주택 관련 제품의 약세를 상쇄했다. 리치몬드 연방준비제도(Richmond 연준) 관할 항구의 전체 화물량은 소폭 감소했지만, 데이터센터(컴퓨터 수만 대를 모아 둔 건물) 건설에 필요한 전기 장비, 컴퓨터 하드웨어, 특수 자재 수입은 올해 9% 증가해 지역 전체 수입에서 작은 비중을 차지했다."},{"s":"들어오는 주식 데이터 | 미국 증시는 단기적으로 바닥을 치고 조정을 마친 것으로 보이며 홍콩 주식은 일시적으로 선두를 따르고 있습니다.","so":"信報網站","tm":"11/26 14:28","c":1,"r":"hk","u":"https://www.hkej.com/instantnews/stock/article/4574919/%E7%9B%A4%E6%88%BF%E4%BE%86%E6%96%99%E4%B8%A8%E7%BE%8E%E8%82%A1%E4%BC%BC%E7%9F%AD%E6%9C%9F%E8%A6%8B%E5%BA%95%E7%B5%90%E6%9D%9F%E8%AA%BF%E6%95%B4+%E6%B8%AF%E8%82%A1%E6%9A%AB%E7%B7%8A%E9%9A%A8%E5%85%B6%E6%AD%A5%E4%BC%90","p":1795670907,"a":1795676799,"t":"盤房來料丨美股似短期見底結束調整 港股暫緊隨其步伐","su":"마이클 버리는 이날 나스닥(미국 기술 회사들이 많이 모인 주식시장) 100 지수 풋옵션(정해진 값에 팔 권리) 포지션의 나머지 절반을 매도했다고 밝혔다. 다우지수는 548포인트 하락한 뒤 급락해 1,104포인트나 떨어져 최저치인 48,913포인트를 기록했습니다. 그 후 376포인트 상승한 50,395를 기록했습니다."},{"s":"스페이스 X 주식, 공개 가격 균열 계속 스페이스X Stock Has an 앤트로픽 Problem｜【일간】2026년 11월 26일호","so":"バロンズ・ダイジェスト","tm":"11/26 13:55","c":1,"r":"jp","u":"https://barrons.jiji.com/article/9131","p":1795668938,"a":1795676806,"t":"スペースX株、公開価格割れ続く SpaceX Stock Has an Anthropic Problem｜【日刊】2026年11月26日号","su":"스페이스X <SPCX> 주식은 월가의 애널리스트에 의한 칭찬의 목소리와 연속 호조 분기 결산에도 불구하고 신규 주식 공개(IPO(회사가 주식시장에 처음 들어오는 것)) 가격 균열이 이어지고 있다. 그 이유는 인공지능(AI)을 둘러싼 우려다. 앤트로픽 <ANT> 균주의 기업공개(IPO) 후의 주가의 움직임도 지원되지 않는다. 실업가 엘론 마스크 씨가 이끄는 로켓과 AI를 다루는 스페이스 X의 주가는 25일 거래 시간 중에 6.8% 싼 117.25달러(역주=종가는 127.44달러). 24일 종가는 125.81달러로, 6월 공개가격 135달러를 약 7%…"},{"s":"AI 투자가 대중화되면서 금융시장은 더욱 취약해질 것인가? JP모건체이스는 \"연준 금리가 내년에 5%에 도달할 수 있다\"고 경고했다.","so":"天下雜誌","tm":"11/26 13:50","c":1,"r":"tw","u":"https://www.cw.com.tw/article/5143905","p":1795668600,"a":1795676791,"t":"AI投資愈熱，金融市場愈脆弱？摩根大通預警：明年聯準會利率恐衝上5%"},{"s":"[글로벌 금융] 연준의 '베이지북': 높은 물가로 인해 미국 소비자들은 예산에 민감해진다","so":"经济观察网","tm":"11/26 13:21","c":1,"r":"cn","u":"http://www.eeo.com.cn/2026/1126/1103602.shtml","p":1795666860,"a":1795676779,"t":"【环球财经】美联储“褐皮书”：高物价促使美国消费者精打细算","su":"뉴욕 신화파이낸스, 11월 25일(류옌안 기자) 미국 연준(FRB)가 25일 발표한 국민경제상황조사 보고서에 따르면 최근 보고 기간인 10월 6일부터 11월 16일까지 미국 경제가 전체적으로 완만한 성장세를 보였으며 물가(물건값 전체의 수준)도 전반적으로 완만하게 상승했다. 소비자 가격이 높은 상황에서 소비자들은 비필수 상품에 대한 지출에 대해 \"점점 더 조심스러워지고 있습니다\". 미국 연방준비제도(미국의 중앙은행)법(연준 Act)에 따르면 미국은 12개의 연방준비제도 구역(연준 District)으로 나누어져 있으며, 각 구역마다 연준(연준 Bank)이 설립되어 있습니다. '베이지북'으로도 알려진 이 보고서는 12개 연준의 최신 조사를 바탕으로 작성됐다. 연준은 연준을 통해 미국 경제 상황에 대한 철저한 평가를 실시하기 위해 1년에 8차례 '베이지북'을 발표한다."},{"s":"[뉴스프레소] 뉴욕증시 혼조… '숏의 전설' AI 하락 베팅 접고 상승에 걸었다 - 머니투데이","so":"머니투데이","tm":"11/26 13:03","c":1,"r":"kr","u":"https://www.mt.co.kr/world/2026/11/26/2026112612377085343","p":1795665809,"a":1795676775,"su":"▶ 나스닥(미국 기술 회사들이 많이 모인 주식시장) 장중 4.6% 급락…코어위브 45억 달러 조달 오라클과 코어위브의 CDS 프리미엄이 뛰면서 AI 기업들이 데이터센터(컴퓨터 수만 대를 모아 둔 건물) 투자 자금을 계속 확보할 수 있을지에 대한 우려가 커졌습니다."},{"s":"미국 증시는 V자 반격을 펼쳤지만 채권시장은 경고음을 울렸다! Xiaomo, 4,500억 달러 규모의 AI 채권 발행에 대해 경고","so":"鉅亨網","tm":"11/26 12:40","c":1,"r":"tw","u":"https://news.cnyes.com/news/id/6672021","p":1795664405,"a":1795676793,"t":"美股上演深V反攻 債市卻拉警報！小摩示警4500億美元AI發債巨浪","su":"Xiaomo는 AI 투자 등급 채권 발행이 2027년에 4,500억 달러에 달하고 AI 자본 지출(공장·장비 등에 쓰는 큰돈)이 거의 1조 4천억 달러에 이를 것으로 추정합니다. 주식시장은 깊은 V자 형태로 반등했고, 코어위브와 엔비디아 CDS 간의 스프레드는 최고치를 기록했으며, AI 차입 위험 프리미엄(위험을 감수하는 대가로 더 바라는 이익)도 상승했습니다. 파이낸싱 비용이 계속 증가하면 먼저 AI 데이터 센터 확장, GPU 및 HBM 주문이 억제될 수 있습니다."},{"s":"'이동주' 남부 레버리지 하이닉스 7% 이상 상승, 미국 증시 안정, 한국 증시 대외 반등","so":"etnet 經濟通","tm":"11/26 12:40","c":1,"r":"hk","u":"https://www.etnet.com.hk/mobile/tc/news/categorized_news_detail.php?newsid=20261126323","p":1795664400,"a":1795694262,"t":"《異動股》南方槓桿海力士升逾7%，美股靠穩韓股隨外圍反彈","su":"2026-11-26 13:17 \"이동주\" 난팡 레버리지(빌린 돈까지 써서 크게 투자하는 것) 하이닉스가 7% 이상 상승했고, 미국 증시는 안정되었고 한국 주식은 외부 세계와 함께 반등했습니다. XL Ernan Hynix (07709)는 7.3% 상승한 11.59위안을 기록했습니다. 목요일은 미국의 추수감사절로, 미국 증시는 하루 종일 휴장합니다. 금요일(27일) 시장은 정상 오픈되나, 3시간 일찍 마감, 즉 오후 1시에 거래가 종료됩니다. 금요일 동부 표준시(홍콩 시간 토요일 오전 2시). 미국 증시는 먼저 하락했다가 수요일(25일) 안정세를 보였다. 다우존스산업평균지수는 장중 1,100포인트 이상 급락한 뒤 낮은 매수세로 하락폭을 만회해 결국 164포인트 상승했다. S&P500(미국 큰 회사 500곳의 주가를 합쳐 만든 점수) 지수와 나스닥 종합지수는 여전히 하락세를 보였지만 손실액 대부분을 회복했습니다."},{"s":"Vernacular Finance EP200｜미국 AI주 폭풍은 아직 수그러들지 않고 있다. 투자자들은 재배치 기회를 어떻게 기다려야 합니까?","so":"聯合報數位版","tm":"11/26 12:24","c":1,"r":"tw","u":"https://vip.udn.com/vip/story/122242/9901590","p":1795663440,"a":1795676794,"t":"白話財經EP200｜美股AI股風暴未歇 投資人要如何等待時機重新布局？","su":"엔비디아 CEO(회사의 가장 높은 책임자) 젠슨 황의 후계 위기가 11일 동안 글로벌 시장에 영향을 미쳤습니다. 젠슨 황이 엔비디아로 돌아온 지금도 미국 기술주는 계속 폭락하고 있으며 이로 인해 대만 주식도 매 턴마다 1,000포인트 이상 하락했습니다. 정부는 또한 지난 10년 동안 최대 규모의 구조 계획을 시작했습니다. 그렇다면 대만 주식은 언제 안정될 것인가? 투자자들은 새로운 조치를 취할 기회를 어떻게 기다릴 수 있습니까?"},{"s":"미국 주식의 극심한 변동에는 위험이 숨어 있습니다. 미국 선거 정치 및 경제 분석 기사 - 특별 주제","so":"信報網站","tm":"11/26 12:12","c":1,"r":"hk","u":"https://www.hkej.com/features/article/%E7%BE%8E%E5%9C%8B%E5%A4%A7%E9%81%B8%E6%94%BF%E7%B6%93%E5%88%86%E6%9E%90%E6%96%87%E7%AB%A0/2671592842/%E7%BE%8E%E8%82%A1%E6%A5%B5%E7%AB%AF%E6%B3%A2%E5%8B%95%E6%9A%97%E8%97%8F%E5%8D%B1%E6%A9%9F","p":1795662768,"a":1795676802,"t":"美股極端波動暗藏危機 美國大選政經分析文章 - 專題","su":"최근 월스트리트 주식시장은 이례적인 변동을 경험하고 있습니다. 트럼프 미국 대통령의 개입과 창업자 젠슨 황의 엔비디아 복귀로 시장의 큰 불확실성이 일시적으로 해소되면서 월요일(23일) 미국 증시에 '보복' 반등(내렸다가 다시 오르는 것)이 자극됐다. 그러나 최근 미국 주식의 일련의 극단적인 가격 성과는 금융 위기 또는 대규모 시장 충격의 특성을 보여주었습니다. 과거 통계 및 기타 자산 관찰에 따르면 이번 반등 라운드는 안정적이지 않을 수 있으며 단기적으로 다시 바닥을 칠 위험을 무시할 수 없습니다. 젠슨 황의 조기 사임으로 인해 엔비디아의 주가가 거의 절반으로 떨어졌을 뿐만 아니라 월스트리트 주식 시장 전체가 하락하여 심한 매도 압력을 받게 되었습니다. 지난 금요일(20일) 기준 S&P500(미국 큰 회사 500곳의 주가를 합쳐 만든 점수) 지수는"},{"s":"미국 증시는 충격적인 반전을 보였습니다. 나스닥은 하락장에 접근한 후 손실을 회복했지만 여전히 시장에는 삼중 구름이 걸려 있습니다.","so":"财联社电报","tm":"11/26 12:11","c":1,"r":"cn","u":"https://m.cls.cn/detail/2545022","p":1795662690,"a":1795662940,"t":"美股上演惊魂反转：纳指逼近熊市后收复失地，但三重阴云仍笼罩市场","su":"차이롄서, 11월 26일자(편집자 Liu Rui) 수요일(11월 25일) 동부 표준시로 미국 증시는 짜릿한 장중 반전을 보였습니다. AI 부문 매도세, 관세 정책 우려, 미국의 완고한 인플레이션(물건값이 계속 오르는 것) 데이터 등 복합적인 요인에 영향을 받아 미국 3대 주가지수가 장 초반 크게 하락했다. 다우존스 산업평균지수는 장 초반 1,100포인트 이상 급락해 2.2% 하락한 바 있다. 기술주가 주도하는 나스닥 지수의 장중 하락폭은 한때 4.6%까지 확대됐다. 역사상 최고 종가에서 잠시 20% 하락하며 기술적 약세장에 접근했습니다. S&P500(미국 큰 회사 500곳의 주가를 합쳐 만든 점수) 지수도 최대 3.2% 하락했다. 수요일 나스닥 지수 동향입니다. 그러나 시장의 매도 심리가 점차 완화되고 저가 사냥이 시장에 진입하기 시작하면서 미국 증시는 정오 무렵부터 점차 하락세를 회복했다. 3대 주가지수는 모두 늦은 거래에서 장중 저점을 벗어났으며 시장 추세는 뚜렷한 V자형 회복 특성을 보였습니다."},{"s":"[월스트리트원음] 美 억만장자, 러시아 루코일 해외자산 인수 계획","so":"财新数据","tm":"11/26 11:57","c":1,"r":"cn","u":"https://database.caixin.com/2026-11-26/102508839.html","p":1795661820,"a":1795662941,"t":"【华尔街原声】美国亿万富豪拟收购俄罗斯卢克石油海外资产","su":"해외 석유 및 가스 자산을 동결된 Lukoil 주식으로 대체할 계획이며, 이번 거래는 여전히 미국 규제 당국의 승인을 받아야 합니다."},{"s":"\"미국 주식\" 분석: AI에 대한 투자 수익에 대한 우려가 커지고 있으며 시장은 투자자 신뢰를 반복적으로 테스트했습니다.","so":"旺得富理財網","tm":"11/26 11:52","c":1,"r":"tw","u":"https://wantrich.chinatimes.com/news/20261126900137-420201","p":1795661575,"a":1795699347,"t":"《美股》分析：AI投資報酬率疑慮升溫市場反覆考驗投資人信心- 國際","su":"[타임즈 장차오친 외신종합보도] 미국 증시 분석: ●미국 증시는 새로운 관세 제안의 영향으로 수요일 개장 후 급락세를 보였지만 점차 하락세를 수렴하며 혼조세(오르는 것과 내리는 것이 섞인 모습)로 마감했다. 다우존스 지수는 1,100포인트 하락을 반전하고 소폭 상승세(오르는 흐름)로 마감했습니다. 기타주가지수는 1% 미만 하락했다. ..."},{"s":"골드만삭스 \"미국 증시, 아직 바닥치 않아 바닥권 매수하기 이르다\"","so":"21财经","tm":"11/26 11:51","c":1,"r":"cn","u":"https://www.21jingji.com/article/20261126/herald/bdaa2f8d5494e1fd0049d528f60fe91c.html","p":1795661460,"a":1795676780,"t":"高盛：美股尚未触底，现在抄底过早","su":"골드만삭스 Group의 자산 배분 연구 책임자인 Christian Mueller-Glissmann은 최근 투자자들이 AI 인프라에 대한 수조 달러의 투자에서 실제 이익을 볼 필요가 있다고 말했습니다. 그는 또한 미국 주식을 사기에는 너무 이르다고 경고했습니다. Muller-Griesmann은 인터뷰에서 시장이 현재 \"매우 취약한 메커니즘\"에 있다고 말했습니다. 그는 시장은 투자된 자본에 대한 수익에 대해 우려하고 있으며 자본 비용은 여전히 높다고 덧붙였습니다. 그는 현재 시장 포지셔닝이 아직 시장 바닥을 선언하는 데 필요한 낮은 수준에 도달하지 못했다고 지적했습니다. 그는 골드만삭스의 종합 위험 선호 지표가 \"펀더멘털의 도움 없이는 시장이 바닥을 쳤다고 쉽게 알 수 있는 수준에 실제로 도달하지 못했다\"고 지적했습니다."},{"s":"'이동주' 알리바바 4% 이상 상승, 텐센트 3% 상승, 미국 증시는 연휴 전 약세를 보이다 안정세를 보였으며 홍콩 증시는 반등했다.","so":"etnet 經濟通","tm":"11/26 11:50","c":1,"r":"hk","u":"https://www.etnet.com.hk/mobile/tc/news/categorized_news_detail.php?newsid=20261126321","p":1795661400,"a":1795699349,"t":"《異動股》阿里升逾4%騰訊升3%，美股節前偏軟後回穩港股見反彈","su":"2026년 11월 26일 10:50 \"특징주\" 알리바바는 4% 이상 상승했고, 텐센트는 3% 상승했습니다. 미국 증시는 연휴 전에 약세를 보인 후 안정세를 보였습니다. 홍콩 증시는 반등했습니다. 알리바바(09988)는 4.4% 상승한 84.8위안을 기록했다. 텐센트(00700)는 3.1% 오른 347.8위안을 기록했다. 다른 기술주와 인터넷 주식도 좋은 성과를 냈습니다. 샤오미(01810)는 2.9% 상승한 27.34위안을 기록했다. 징둥닷컴(09618)은 2.2% 상승한 102.5위안을 기록했습니다. 콰이쇼우(01024)는 4.1% 상승했다. 목요일은 미국의 추수감사절로, 미국 증시는 하루 종일 휴장합니다. 금요일(27일) 시장은 정상 오픈되나, 3시간 일찍 마감, 즉 오후 1시에 거래가 종료됩니다. 금요일 동부 표준시(홍콩 시간 토요일 오전 2시). 미국 증시는 먼저 하락했다가 수요일(25일) 안정세를 보였다. 다우존스 산업평균지수는 장중 한때 1,100포인트 이상 급락한 뒤, 낮은 수준의 매수세(사려는 힘)에 힘입어 하락폭을 만회해 결국 164포인트 상승했습니다. S&P500(미국 큰 회사 500곳의 주가를 합쳐 만든 점수) 지수와 나스닥 종합지수는 여전히 하락세를 보였지만 손실액 대부분을 회복했습니다."},{"s":"월스트리트의 밤새 매도세 이후 아시아 시장은 상승세를 보였고 STI의 관세 소식은 0.5% 상승했습니다.","so":"The Business Times","tm":"11/26 11:33","c":1,"r":"sg","u":"https://www.businesstimes.com.sg/companies-markets/capital-markets-currencies/asia-markets-open-higher-after-wall-streets-overnight-selloff-tariff-news-sti-0-5","p":1795660380,"a":1795662979,"t":"Asia markets open higher after Wall Street’s overnight selloff, tariff news with STI up 0.5%","su":"[싱가포르] 아시아 주식 시장은 불안정한 미국 야간 거래와 새로운 관세(수입품에 붙이는 세금) 소식 이후 소폭 상승세(오르는 흐름)로 출발했으며 대부분의 지역 지수는 목요일(11월 26일) 오전에 상승했습니다. 더 비즈니스 타임즈(The Business Times)에서 자세한 내용을 읽어보세요."},{"s":"젠슨 황의 \"귀환\": 미국 기술주에 숨겨진 위험은 무엇입니까? |재정모닝체크","so":"21财经","tm":"11/26 11:32","c":1,"r":"cn","u":"https://www.21jingji.com/article/20261126/herald/295bac1a7518c0c09bd667e7f9f8933e.html","p":1795660320,"a":1795662943,"t":"黄仁勋“回归”：美股科技还有什么隐藏风险？|财经早察","su":"요즘 미국 증시의 가장 큰 뉴스는 단연 젠슨 황의 복귀인데, 엔비디아의 주가는 급락세를 보이고 있다. 그렇다면 미국 칩과 인공지능 분야의 이익 전망에 대한 시장의 우려는 완화될 것인가? 이 치열한 게임 뒤에는 보이지 않는 위험이 있을까요? 먼저 타임라인을 살펴보겠습니다. 11월 23일, 엔비디아 이사회는 설립자 젠슨 황의 사장, CEO 및 이사로서의 직무를 즉시 재개하기로 만장일치로 투표했습니다. 이 소식에 힘입어 엔비디아 주가는 하루 만에 31.48% 상승해 하루 만에 시가총액(회사 전체 몸값) 증가 기준으로 미국 주식 역사상 최고치를 경신했다. 열흘 전 미국 증시과 엔비디아는 매우 급격한 조정을 경험했습니다. 이 \"트리거\"는 의심할 여지없이 젠슨 황의 개인적인 문제와 그에 따른 규정 준수 검토 폭풍이었습니다. 글로벌 반도체(전자기기 속에서 계산하고 기억하는 작은 부품) 산업의 벤치마크 기업으로서 엔비디아의 모든 움직임은 글로벌 시장에 영향을 미칠 것입니다. 회사 창립자 겸 CEO가 이사회에서 해임되면서 회사 주가는 고점 대비 약 40% 하락하는 직접적인 원인이 되었지만, 그에 따른 '반환'으로 인해 주가는 30%나 급등했습니다. 황 Jensen은 엔비디아에 대체할 수 없는 영향력을 갖고 있는 것 같습니다."},{"s":"AI 하락 시세를 극복하는 하이테크 주식 5종목 - These 5 Tech Stocks are Sidestepping the AI Downturn","so":"バロンズ・ダイジェスト","tm":"11/26 11:30","c":1,"r":"jp","u":"https://barrons.jiji.com/article/9130","p":1795660220,"a":1795694267,"t":"AI下落相場を乗り切るハイテク株5銘柄 - These 5 Tech Stocks are Sidestepping the AI Downturn","su":"하이테크 주식의 거래에는 어려운 몇 개월이지만, 이 섹터의 모든 유명 상표가 팔린 것은 아니다. 하이테크 주식은 최근 주식시장의 역사적인 상승으로 주요 견인역이 되어 왔다. 인공지능(AI) 개발을 둘러싼 열광과 AI의 혜택을 받는 기업에 대한 기대가 주가의 대폭 상승에 기여했다. 투자자의 신뢰감은 하이테크 균주의 비중이 큰 나스닥(미국 기술 회사들이 많이 모인 주식시장) 종합지수가 엔비디아 <NVDA> 등 개별 종목과 함께 종가 기준 과거 최고치를 붙인 10월 6일 피크를 맞았다. 그 이후는 하락 경사… AI 하락 시세를 극복하는 하이테크 주식 5종목"},{"s":"Lam Ka-hang: 미국 증시 폐쇄는 홍콩 증시 전망에 도움이 될 것이며 항셍 지수는 오늘 꾸준히 반등했습니다","so":"etnet 經濟通","tm":"11/26 11:30","c":1,"r":"hk","u":"https://www.etnet.com.hk/www/tc/news/news-article.php?newsid=418285","p":1795660200,"a":1795676803,"t":"林家亨：美股休市有利港股後市，恒指今日穩實反彈","su":"Lin Jiaheng: 미국 증시의 하락세는 홍콩 주식 시장 전망에 긍정적이며 항셍 지수는 오늘 확고하게 반등했습니다. 손님: 중국농업증권 전무이사 Lin Jiaheng. 미국 전체 PCE(미국 사람들이 쓴 돈으로 본 물가 숫자)는 10월 3.8%까지 상승해 12월 8~9일 연준의 금리 회의에서 금리를 0.25% 인상하고 내년 초 긴축을 이어갈 것이라는 시장의 기대가 더욱 커졌습니다. 항셍지수는 어제(25일) 오후 253포인트 하락한 21,966포인트에 마감하며 7일 연속 하락세를 보이며 22,000선을 넘으며 1년 반여 만에 최저치를 기록했다. 리오토(02015)는 3분기에 납품량이 전년 대비(작년 같은 때와 비교해서) 거의 100,000대까지 증가하면서 순손실이 줄어들었지만 차량 총이익률은 소폭 하락했다고 발표했습니다. 경영진은 모델 업데이트 속도를 2년에 한 번 정도로 조정했으며, 유럽 해외 진출과 공장 내 로봇 비용 절감에 주력하고 있다. 시장에서는 샤오미(01810)의 4분기 자동차 제조사의 물량 증가가 보관 비용에 대한 압박을 상쇄할 수 있을지 여부와 실용적인 경로에 주목하고 있다."},{"s":"미국 주식 23시간 거래》낮에도 미국 주식을 살 수 있습니다! 주문 신청은 어떻게 하나요? 대만 시간 비교, 재위임 처리 수수료 완전 안내, 주의할 '이것들'","so":"工商時報","tm":"11/26 11:28","c":1,"r":"tw","u":"https://www.ctee.com.tw/news/20261125701041-430201","p":1795660080,"a":1795662959,"t":"美股23小時交易》白天也能買美股！如何申請下單？台灣時間對照、複委託手續費全攻略 還有「這些事情」要注意","su":"이 기사의 초점은 대만 시간에 해당하는 시간은 몇시입니까? 미국 주식 재위탁이란 무엇입니까? 국내 중개 전자주문 요금과 취급수수료도 절약하자! 비용은 수십 배 다를 수 있습니다. 초보자라면 꼭 봐야 할 작품! 계좌를 개설하고 여러 주문으로 주문하는 6단계. 거래에 가장 적합한 통화는 무엇입니까? 대만 달러와 미국 달러 배송 비교 \"지정 주문\"을 사용해야하는 이유는 무엇입니까? 마진거래나 공매도(주식을 빌려서 먼저 파는 것)를 할 수 있나요? 미국 주식 거래 시스템에 큰 변화가 일어나고 있습니다! 나스닥(미국 기술 회사들이 많이 모인 주식시장)거래소(나스닥)는 올해 12월 6일…"},{"s":"엔비디아(NVDA.US)는 미국 주식의 \"롤러코스터\" 추세를 주도하며 시장 신호에 대한 연준의 의존도를 테스트합니다.","so":"AAStock","tm":"11/26 11:25","c":1,"r":"hk","u":"https://www.aastocks.com/tc/usq/news/comment.aspx?source=AAFN&id=NOW.1556686&catg=1","p":1795659900,"a":1795694264,"t":"英偉達(NVDA.US)牽引美股「過山車」走勢 考驗聯儲局依賴市場訊號主張","su":"지난 주 동안의 급격한 시장 변동성(값이 크게 출렁이는 정도)과 엔비디아(NVDA.US)를 둘러싼 사건은 워시 연준 의장이 직면한 딜레마를 부각시켰습니다. 지난 금요일(20일) 증시가 하락하자 연준의 금리 인상(이자 비율을 올리는 것) 가능성에 대한 시장의 기대도 낮아졌다. 월요일(23일) 젠슨 황이 사무실로 복귀하면서 시장은 강하게 반등하며 연준이 금리를 두 배 더 인상할 것이라는 자신감을 회복했다. 한편으로는 일일 시장 변동을 무시하고 장기적인 발전에 초점을 맞추는 것이 연준 개혁을 촉진하려는 워시의 열망의 핵심 측면 중 하나입니다. 한편, 그는 시장이 예측에 더 뛰어나며 정책 수립에 예측보다는 시장 지표를 더 많이 사용하기를 희망한다는 점도 분명히 했습니다. 그러나 이러한 지표는 극심한 변동을 경험할 수 있습니다."},{"s":"주변경제 | 미국 증시는 목요일 추수감사절 휴장, 금요일 반나절 거래 개시, 3시간 일찍 마감 | 전체 - 뉴스 - 미국 주식","so":"etnet 經濟通","tm":"11/26 11:10","c":1,"r":"hk","u":"https://www.etnet.com.hk/www/tc/us-stocks/news-article/418275/%E5%A4%96%E5%9C%8D%E7%B6%93%E6%BF%9F+%7C+%E7%BE%8E%E8%82%A1%E5%91%A8%E5%9B%9B%E6%84%9F%E6%81%A9%E7%AF%80%E4%BC%91%E5%B8%82%E4%B8%80%E5%A4%A9%EF%BC%8C%E5%91%A8%E4%BA%94%E9%96%8B%E5%8D%8A%E6%97%A5%E5%B8%82%EF%BC%8C%E6%8F%90%E6%97%A93%E5%B0%8F%E6%99%82%E6%94%B6%E5%B8%82","p":1795659000,"a":1795662963,"t":"外圍經濟 | 美股周四感恩節休市一天，周五開半日市，提早3小時收市 | 全部 - 新聞 - 美股"},{"s":"월스트리트저널 \"AI 데이터센터 건설 중단하면 대만 경제 침체에 빠질 수도\"","so":"自由財經","tm":"11/26 10:46","c":1,"r":"tw","u":"https://ec.ltn.com.tw/article/breakingnews/5653655","p":1795657608,"a":1795662959,"t":"AI資料中心建設若停擺 華爾街日報：台灣經濟恐陷衰退","su":"[금융채널/종합리포트] AI 버블(실제 값어치보다 너무 부푼 값)이 터지면 2000년 인터넷 버블보다 그 영향이 더 심각할 수도 있다! 월스트리트저널(WSJ)은 주식시장 부의 감소, 데이터센터(컴퓨터 수만 대를 모아 둔 건물) 투자 동결, 금융사슬 효과를 촉발할 수 있는 AI 관련 부채 등 미국 경제가 직면한 3가지 주요 위험을 분석했다."},{"s":"아시아 주식 반등, AI 및 관세가 배경에 숨어 있습니다.","so":"Reuters","tm":"11/26 10:35","c":1,"r":"us","u":"https://www.reuters.com/world/china/global-markets-global-markets-2026-11-26/","p":1795656900,"a":1795662935,"t":"Asia shares bounce, AI and tariffs lurk in background"},{"s":"시판 전 전략 | 미국 증시는 연휴를 앞두고 대규모 V폭탄을 일으켰고, 홍콩 주식 강세 포지션은 반격할 여력이 없지만 추가 하락 여지는 별로 없다.","so":"etnet 經濟通","tm":"11/26 10:20","c":1,"r":"hk","u":"https://www.etnet.com.hk/mobile/tc/news/topic_news_detail.php?category=focus&newsid=418267","p":1795656000,"a":1795662966,"t":"盤前攻略 | 美股節前上演大V彈，港股牛倉毫無還擊之力惟再下殺空間不多","su":"시판 전 전략 | 미국 증시는 연휴를 앞두고 큰 V반등을 펼쳤고, 홍콩 증시는 강세장(주가가 오랫동안 오르는 시기)에 반격할 여력이 없었지만 추가 하락 여지는 많지 않았다. 미국 증시는 약세를 유지했고, 수요일(25일)에도 7%E6%BA%AB%E5%85%BC%E9%97%9C%E7%A8%85%E5%A4%BE%E6%93%8A%E3%80%80%E7%BE%8E%E8%82%A1V%E5%BD%88%E7%B5%95%E8%99%95%E9%80%A2%E7%94%9F%EF%BC%9F%E6%81%92%E6%8C%87%E5%A4%B12%E8%90%AC2%E8%A6%8B%E5%BA%95%E6%9C%AA%EF%BC%9F%E7%BA%8C%E6%8D%A7%E6%B6%88%E8%B2%BB%E8%82%A1%EF%BC%9F","p":1795653725,"a":1795662968,"t":"PCE升溫兼關稅夾擊 美股V彈絕處逢生？恒指失2萬2見底未？續捧消費股？"},{"s":"美 증시 조정에 낮아지는 월가 눈높이…내년 전망치 ‘뚝’","so":"매일경제 마켓","tm":"11/26 09:37","c":1,"r":"kr","u":"https://stock.mk.co.kr/news/view/1206305","p":1795653465,"a":1795662934,"su":"주식으로 돈 벌기, 내년에도 쉽지 않다...눈높이 확 낮춰버린 월가 정재원 기자(jeong.jaewon@mk.co.kr) 입력 : 2026.11.26 09:37:45 I 수정 : 2026.11.26 10:15:17 美 주가 조정 반영해 내년 ‘신중론’ S&P500(미국 큰 회사 500곳의 주가를 합쳐 만든 점수) 목표치 8200 전망 확산 월가 금융기관들이 최근 주가 조정을 반영해 조심스런 내년 전망을 제시하고 있다. 지난 25일 JP모건 전략팀은 내년 말 스탠더드앤드푸어스(S&P)500지수 목표치를 8200으로 제시했다."},{"s":"미국이 부과하는 관세 제안은 어떤 영향을 미칠까요? 경제학자: 연준은 더 오랫동안 높은 금리를 유지할 수도 있습니다!","so":"财联社","tm":"11/26 09:30","c":1,"r":"cn","u":"https://www.cls.cn/detail/2544812","p":1795653015,"a":1795676781,"t":"美国拟加征关税影响几何？经济学家：美联储高利率恐维持更长时间！","su":"① 윌리엄스 뉴욕 연준 총재를 포함한 많은 연준 위원들은 이전에 관세가 인플레이션(물건값이 계속 오르는 것)에 미치는 영향이 크게 줄어들었다고 낙관해 왔습니다. ② 그러나 윌리엄스는 새로운 관세가 시행되면 인플레이션 전망이 바뀔 수 있다고 이번 주에 경고했습니다. 차이롄서, 11월 26일(Editor Xiaoxiang) 경제학자들은 일반적으로 트럼프 행정부가 계획하는 새로운 관세 정책으로 인해 연준이 수입 관세로 인한 인플레이션 압력에 대처하기 위해 금리를 인상하고 높은 금리를 장기간 유지해야 할 가능성이 크게 높아질 것으로 예상합니다. 보도에 따르면 미국 정부는 무역 조사를 마친 후 12개 이상의 미국 주요 무역 상대국의 상품에 새로운 관세를 부과할 것을 제안했습니다. 이와 관련하여 언스트 앤 영(Ernst & Young)의 수석 이코노미스트인 그렉 다코(Greg Daco)는 인플레이션이 3년 만에 최고 수준으로 상승했다는 점을 감안할 때 새로운 관세로 인해 \"연준이 더욱 매파적(금리를 올리자는 쪽)인 반응\"을 보일 위험이 커진다고 믿습니다."},{"s":"미국 증시는 한때 충격을 받았습니다.","so":"21财经","tm":"11/26 09:29","c":1,"r":"cn","u":"https://www.21jingji.com/article/20261126/herald/1b1c39a0c9a857518b8978b9545d2174.html","p":1795652940,"a":1795662949,"t":"美股，一度惊魂","su":"추수감사절을 앞두고 미국 증시는 급락세를 보였다. AI 관련 주식 매도는 한때 나스닥을 큰 하락세로 이끌었다. 그러나 헐값 사냥이 개입해 주요 지수가 크게 반등했다. '빅쇼트' 마이클 버리의 블로그 글이 시장에 돌고 있다. 그는 현재 자신의 포트폴리오의 롱포지션이 숏포지션을 초과하고 있으며 당분간은 거의 모두 롱포지션이라고 말했다. 미국 10월 개인소비지출(PCE) 물가지수를 보면 인플레이션(물건값이 계속 오르는 것)이 아직 둔화되지 않은 모습을 보여 연준의 12월과 1월 금리 인상(이자 비율을 올리는 것)에 대한 시장 기대가 다시 한 번 강세를 보였고 투자자들은 위험회피 성향으로 전환했다. 미국 3대 주가지수는 혼조세를 보였다. 수요일 동부시간에는 미국 3대 주가지수가 엇갈렸습니다. 나스닥 100 지수가 한때 역사적 종가 대비 20% 하락하는 등 세션 동안 전체적으로 급락했습니다."},{"s":"설문 조사: 경제학자의 80% 이상이 연준이 이번 주와 내년 3월 말 전에 다시 금리를 인상할 것으로 예상합니다!","so":"财联社","tm":"11/26 09:28","c":1,"r":"cn","u":"https://www.cls.cn/detail/2483155","p":1795652939,"a":1795699339,"t":"调查：逾八成经济学家预计美联储本周加息 明年3月底前有望再出手！","su":"① 인플레이션(물건값이 계속 오르는 것)이 여전히 완고하다는 것을 보여주는 지난 금요일 공식 미국 CPI 데이터의 영향을 받은 최근 업계 조사에 따르면, 이번 달 금리를 동결하지 않겠다는 이전의 상대적 주류 연준의 약한 합의는 \"붕괴를 선언\"했습니다. ② 현재 조사에 참여한 대부분의 경제학자들은 연준이 수요일에 금리 인상(이자 비율을 올리는 것)을 발표하고 내년 3월 말 이전에 적어도 한 번 금리를 인상할 것이라고 믿고 있습니다. 차이롄서, 9월 15일(편집자 Xiaoxiang) 인플레이션이 여전히 완고하다는 것을 보여주는 지난 금요일 공식 미국 CPI 데이터의 영향을 받은 최근 업계 조사에 따르면, 이전에는 상대적으로 주류였던 연준이 이번 달 금리를 동결하지 않겠다는 강력한 합의가 \"붕괴를 선언\"했습니다. 조사에 참여한 대부분의 경제학자들은 현재 연준이 수요일에 금리 인상을 발표하고 내년 3월 말 이전에 적어도 한 번 더 금리 인상을 발표할 것으로 믿고 있습니다."},{"s":"[외환] 뉴욕증시 반등에 오름세 진정…1,340원대 중반","so":"연합인포맥스","tm":"11/26 09:23","c":1,"r":"kr","u":"https://news.einfomax.co.kr/news/articleView.html?idxno=4446616","p":1795652638,"a":1795662934,"su":"달러-원 환율이 1,340원 중반대를 나타냈다.뉴욕증시가 개장 초 급락세를 보이며 위험회피 분위기에 한때 1,350원 부근까지 올랐으나 저가매수가 유입돼 주가가 반등함에 따라 달러-원 상승세(오르는 흐름)도 진정됐다.26일 외환시장에 따르면 오전 7시 기준 달러-원 환율은 전거래일 서울장 종가(1,343.20원) 대비 1.10원 오른 1,344.30원을 기록했다.하루 전인 25일 오전 7시 종가(1,343.00) 대비로는 1.30원 올랐다.달러-원은 전날 1,340원에 장을 출발했다. 코스피(한국 큰 회사들 주가를 합쳐 만든 점수)가 급락세를 보인 가운데 외국인 투매가 나오면서 오전"},{"s":"닛케이는 칩, 금속주 주도로 1.3% 상승","so":"WSJ","tm":"11/26 09:19","c":1,"r":"us","u":"https://www.wsj.com/finance/stocks/nikkei-rises-1-3-led-by-chip-metals-stocks-3b7004c9","p":1795652340,"a":1795676776,"t":"Nikkei Rises 1.3%, Led by Chip, Metals Stocks"},{"s":"S&P500, 나스닥은 하락 마감했지만 거래자가 AI에서 회전함에 따라 다우는 반등했습니다 — NVDA, SPCX, PANW 초점","so":"Yahoo Finance","tm":"11/26 09:09","c":1,"r":"us","u":"https://finance.yahoo.com/markets/stocks/articles/p-500-nasdaq-end-lower-000950299.html","p":1795651740,"a":1795699333,"t":"S&P 500, Nasdaq End Lower But Dow Rebounds As Traders Rotate Out Of AI — NVDA, SPCX, PANW In Focus","su":"나스닥(미국 기술 회사들이 많이 모인 주식시장) 100은 수요일 잠시 하락장(주가가 오랫동안 내리는 시기) 영역에 닿다가 약간의 손실을 입었습니다."},{"s":"연준은 최근 몇 주 동안 대부분의 관할권이 약간에서 중간 정도의 경제성장을 달성했으며 기업들은 임금 압박이 증가하고 있다고 지적했습니다.","so":"TVB","tm":"11/26 09:02","c":1,"r":"hk","u":"https://news.tvb.com/sc/1208502-%E7%BE%8E%E8%81%AF%E5%84%B2%E6%8C%87%E8%BF%91%E5%B9%BE%E5%91%A8%E5%A4%9A%E6%95%B8%E8%BD%84%E5%8D%80%E7%B6%93%E6%BF%9F%E5%AF%A6%E7%8F%BE%E8%BC%95%E5%BE%AE%E8%87%B3%E6%BA%AB%E5%92%8C%E5%A2%9E%E9%95%B7%E4%BC%81%E6%A5%AD%E5%8F%8D%E6%98%A0%E8%96%AA%E9%87%91%E5%A3%93%E5%8A%9B%E4%B8%8A%E5%8D%87","p":1795651320,"a":1795662970,"t":"美聯儲指近幾周多數轄區經濟實現輕微至溫和增長 企業反映薪金壓力上升","su":"미국 연준(미국의 중앙은행)은 베이지북을 발표했는데, 이 보고서에 따르면 대부분의 관할 지역의 경제가 최근 몇 주 동안 소폭에서 중간 정도의 성장을 달성했으며 기업들은 임금 압박이 증가하고 있다고 보고했습니다. 관련 조사에 따르면 12개 관할 구역 중 8개 관할 구역에서 경제 성장이 보고되었으며 4개 관할 구역에서는 변화가 없었습니다. 고용 수준도 소폭 상승했고 물가(물건값 전체의 수준)도 전반적으로 완만하게 상승했습니다. 보고서에서는 주로 채용이 어려운 공석으로 인해 급여와 복리후생이 소폭 증가했으며 이전 보고서의 소폭 증가보다 더 빠른 속도로 증가했다고 언급했습니다."},{"s":"미국 주식과 금이 V자형 반등을 보였습니다! 원유 급등! 중국 기업 미국 상장주가 폭등했고 엔비디아의 시가총액은 하룻밤 사이에 거의 1조 위안 증발했습니다.","so":"每日经济新闻","tm":"11/26 08:55","c":1,"r":"cn","u":"http://www.nbd.com.cn/rss/fenghuang/articles/4659238.html","p":1795650900,"a":1795676784,"t":"美股、黄金，上演V字大反弹！原油大涨！中概股爆发，英伟达市值一夜蒸发近1万亿元","su":"기자 | 루샹용 편집자 | 장진허 장이밍 두보 교정자 | Duan Lian 베이징 시간으로 11월 26일, 미국 3대 주가지수는 짜릿한 'V자 반등' 장세를 보였습니다. 다우존스산업평균지수와 나스닥(미국 기술 회사들이 많이 모인 주식시장)종합지수는 한때 장중 1,000포인트 넘게 하락했으나 이후 반등해 손실폭을 크게 줄였고, 다우존스산업평균지수는 적자로 전환했다가 적자로 마감했다. 미국 증시 마감 현재 다우지수는 164.25포인트, 즉 0.33% 상승한 50182.95포인트로 마감했는데, 이는 이날 저점보다 1269.21포인트 오른 것이다. 나스닥은 147.74포인트(0.62%) 하락해 당일 최저치보다 953.40포인트 오른 23585.80포인트로 마감했다. S&P500(미국 큰 회사 500곳의 주가를 합쳐 만든 점수) 지수는 18.31포인트(0.25%) 하락한 7182.78포인트로 마감했는데, 이날 저점 대비 212.67포인트 상승했다."},{"s":"SK증권 \"미국 증시, 조정과 약세장 가를 단서는 11월 신용잔고\"","so":"팝콘뉴스","tm":"11/26 08:42","c":1,"r":"kr","u":"https://www.popcornnews.net/news/articleView.html?idxno=141582","p":1795650133,"a":1795651293,"su":"(팝콘뉴스=이현주 기자) SK증권은 26일 미국 증시에 대해 \"최근 주가 하락이 일시적인 조정에 그칠지, 본격적인 약세장(주가가 오랫동안 내리는 시기)으로 이어질지 판단하려면 11월 신용잔고를 확인할 필요가 있다\"고 분석했다.주가가 떨어지는 동안 투자자들이 빚을 내 투자한 금액까지 줄였는지가 두 국면을 구분하는 단서라는 설명이다.강대승 SK증권 연구원은 이날 발간한 보고서에서 \"11월 들어 스탠더드앤드푸어스(S&P)500 지수가 한때 10월 초 사상 최고치보다 10% 이상 하락해 기술적 조정 국면(많이 오른 뒤 주가가 10% 넘게 내려온 때)에 진입했다\"고 짚었다. 다만 지수 하락 폭만으로는 약세장의 시작을"},{"s":"홍콩 주식 모닝 포스트 │ 미국 주가 '롤러코스터' 탄다, 테하이인터내셔널 3분기 모회사 순이익 전년 동기 대비 158% 증가","so":"财联社","tm":"11/26 08:41","c":1,"r":"cn","u":"https://www.cls.cn/detail/2544301","p":1795650060,"a":1795651303,"t":"港股早报｜美股坐“过山车” 特海国际三季度归母净利润同比增158%","su":"① 외교부는 관세전쟁과 무역전쟁은 어느 쪽에도 이익이 되지 않는다고 답했다. ② 미국의 무역조사 이후 EU산 제품에 최대 20% 관세를 부과하고, 일본과 한국에 대해서는 최혜국 관세 15%를 부과하자고 제안했다. 주식은 하락했다가 반등했고, 다우 지수는 적자로 변했고, 가장 인기 있는 중국 테마 주식은 강세를 보였습니다. ④월스트리트의 \"빅 숏\"이 나스닥(미국 기술 회사들이 많이 모인 주식시장) 100 풋 옵션을 청산했습니다. 채권(나라나 회사에 돈 빌려준 증서)수익률은 전반적으로 하락해 2개월 만에 최저치를 기록했습니다. Hotspot focus 1. 미국이 중국을 포함해 12개국 이상에 관세를 부과할 것으로 알려졌습니다. 외교부는 관세전쟁과 무역전쟁은 어느 한쪽의 이익에 부합하지 않으며, 양측은 평등과 존중, 호혜주의를 바탕으로 관련 문제를 협상하고 해결해야 한다고 답했다. 2. 미국 무역조사 이후 EU산 제품에 최대 20%의 관세를 부과하고, 일본과 한국에 대해서는 최혜국 관세 15%를 추가로 부과하자고 제안했다."},{"s":"테슬라 Robotaxi의 발전은 월스트리트 곰들에게 깊은 인상을 남겼습니다! 분석가들은 처음으로 매수를 요구했으며 목표주가는 25% 상승을 제안했습니다.","so":"鉅亨網","tm":"11/26 08:41","c":1,"r":"tw","u":"https://news.cnyes.com/news/id/6671208","p":1795650060,"a":1795651315,"t":"特斯拉Robotaxi進展打動華爾街空頭！分析師首度喊買、目標價暗示還有25%漲幅","su":"항만 분석가인 Ron Jewishikow는 Robotaxi가 수조 달러의 잠재력을 가지고 있으며 주가는 여전히 약 25% 상승 여력이 있다고 말하면서 테슬라를 \"매수\"로 평가했습니다. 그는 로보택시(운전자 없이 다니는 택시)가 2027년 말까지 연간 20억~40억 달러의 ARR을 창출할 수 있고, 2040년 기업 가치는 4조~5조 달러에 이를 것으로 추산하고 있다. 그러나 확장에는 여전히 1조 달러의 자본 요구 사항과 규제 및 보안 위험이 있습니다."},{"s":"AI주 매도세 심화되나 오후 반등으로 피해 제한","so":"Reuters","tm":"11/26 08:39","c":1,"r":"us","u":"https://www.reuters.com/business/ai-stocks-slide-fears-over-infrastructure-buildout-costs-2026-11-25/","p":1795649948,"a":1795662935,"t":"AI stock rout deepens but damage is limited by afternoon bounce"},{"s":"브라질 정부는 대사를 아르헨티나로 돌려보내지 않기로 결정했다. 세는 크게 줄어들었고 다우존스 산업평균지수는 상승세로 돌아섰습니다. 나스닥 100 지수는 장 초반 역사적 종가 대비 20% 하락해 기술적 약세장 영역에 접근했습니다. 마감 기준 S&P500(미국 큰 회사 500곳의 주가를 합쳐 만든 점수) 지수는 0.25% 하락한 7182.78포인트를 기록했습니다. 나스닥 종합지수는 0.62% 하락한 23585.8포인트를 기록했습니다. 다우존스 산업평균지수는 0.33% 상승한 50182.95포인트를 기록했습니다."},{"s":"[모닝포스트] 심야 미 증시는 '롤러코스터'를 타고 있다. 월스트리트의 \"빅쇼트\": 나스닥 100 풋옵션 청산; Zhuhai Duty Free Group과 Shanying International은 오늘부터 거래를 재개합니다","so":"财联社","tm":"11/26 07:23","c":1,"r":"cn","u":"https://www.cls.cn/detail/2544754","p":1795645380,"a":1795651305,"t":"【早报】深夜，美股坐“过山车”；华尔街“大空头”：清空纳指100看跌期权；珠免集团、山鹰国际，今起复牌","su":"① 미국이 중국 등 국가에 추가 관세(수입품에 붙이는 세금)를 부과할 계획이고, 외교부가 이에 응했다. ② 미국은 무역 조사 후 EU산 제품에 최대 20%의 관세 부과를 제안했다. ③ 미국 3대 주가지수는 하락세를 보였다가 반등(내렸다가 다시 오르는 것)했다. ④ 연구시간: 컴퓨팅 파워 공급은 '급격'을 피해야 한다. ⑤ 주하이면세그룹과 산잉인터내셔널은 오늘 거래를 재개할 예정이다. 매크로뉴스 1. 궈자쿤 외교부 대변인이 어제 정례 기자회견을 주최했습니다. 한 기자는 미국이 중국 등 관련 국가에 추가 관세를 부과할 계획에 대해 물었다. 궈자쿤은 중미 경제무역 문제를 다루는 데 있어서 중국의 입장은 늘 명확하다고 말했다. 관세 전쟁과 무역 전쟁은 어느 쪽에게도 이익이 되지 않습니다. 쌍방은 평등, 존중, 호혜의 기초 위에서 관련 문제를 협상하고 해결해야 한다. 소위 '과잉 생산력'은 잘못된 주장이며, 중국은 이를 정치적 조작의 빌미로 삼는 것에 반대한다."},{"s":"엔비디아는 거버넌스 문제로 인해 S&P의 등급 하락 위험에 처해 있습니다.","so":"The Business Times","tm":"11/26 07:22","c":1,"r":"sg","u":"https://www.businesstimes.com.sg/companies-markets/nvidia-risk-rating-cut-sp-over-governance-concerns","p":1795645320,"a":1795647021,"t":"Nvidia at risk of rating cut by S&P over governance concerns","su":"이는 자본에 대한 접근이 중요한 AI 부문에서 우려되는 차입 비용을 증가시킬 수 있습니다. The Business Times에서 자세히 읽어보세요."},{"s":"할인 상품을 찾고 계십니까? S&P500 기업들은 공격적으로 자사주를 매입하고 있습니다.","so":"Barron's","tm":"11/26 07:16","c":1,"r":"us","u":"https://www.barrons.com/articles/bargains-s-p-500-companies-aggressively-buy-back-stock-ameriprise-gm-howmet-99e3611f","p":1795644960,"a":1795646922,"t":"Looking for Bargains? These S&P 500 Companies Are Aggressively Buying Back Stock."},{"s":"미국 경제는 3분기에 큰 호황을 누리고 있으며, 10월에도 인플레이션은 여전히 높은 수준을 유지하고 있습니다.","so":"Reuters","tm":"11/26 07:06","c":1,"r":"world","u":"https://www.reuters.com/business/us-inflation-rises-further-octob &P500(미국 큰 회사 500곳의 주가를 합쳐 만든 점수)이 다양한 할인 가격을 제공하는 가운데 Mark Hartley는 전 세계에서 가치와 소득 기회를 모색합니다. 2027년에 반등(내렸다가 다시 오르는 것)할 수 있을 것으로 생각되는 하락세를 보인 S&P500 주식 3개(그리고 저는 피하고 있는 1개)가 The Twelfth Magpie에 처음 등장했습니다."},{"s":"트럼프의 계정은 올해 엔비디아 주식을 44번 거래했다고 기록에 따르면","so":"BBC","tm":"11/26 01:42","c":1,"r":"world","u":"https://www.bbc.com/news/articles/cq772vk664yvo","p":1795624931,"a":1795647039,"t":"Trump’s accounts traded Nvidia shares 44 times this year, records show","su":"미국 대통령의 재무 공개를 검토한 결과 도널드 트럼프의 투자 포트폴리오가 거대 기술 기업의 주식을 정기적으로 거래해 온 것으로 나타났습니다."},{"s":"AI 매도, 관세 제안으로 월스트리트를 뒤흔들면서 나스닥은 4% 하락","so":"The Business Times","tm":"11/26 01:00","c":1,"r":"sg","u":"https://www.businesstimes.com.sg/companies-markets/capital-markets-currencies/nasdaq-slides-4-ai-sell-tariff-proposals-rattle-wall-street","p":1795622400,"a":1795647030,"t":"Nasdaq slides 4% as AI sell-off, tariff proposals rattle Wall Street","su":"기술 부문에 대한 규제 조사 강화에 대한 우려 속에서 반도체(전자기기 속에서 계산하고 기억하는 작은 부품) 회사가 하락세를 주도하고 있습니다."},{"s":"JP모건은 AI 슈퍼사이클로 인해 S&P500이 내년에 8,200까지 오를 것이라고 말했다.","so":"CNBC","tm":"11/26 00:46","c":1,"r":"us","u":"https://www.cnbc.com/2026/11/25/jpmorgan-sp-500-8200-2027-ai.html","p":1795621560,"a":1795676776,"t":"JPMorgan says the S&P 500 will rise to 8,200 next year because of the AI supercycle","su":"전략가 Dubravko Lakos-Bujas는 \"우리는 AI 슈퍼사이클이 그대로 유지된다는 견해를 유지합니다\"라고 썼습니다."},{"s":"NY 주식시장 나스닥 일시 4% 초과 하락 하이테크 주식 매출이 다시","so":"NHKニュース","tm":"11/26 00:45","c":1,"r":"jp","u":"https://news.web.nhk/newsweb/na/nd-20261126de81556","p":1795621544,"a":1795647018,"t":"NY株式市場 ナスダック 一時4％超の下落 ハイテク株売りが再び","su":"[NHK] 25일 뉴욕 주식시장에서는 'AI 붐'의 지속성에 대한 우려가 뿌리 깊은 가운데 반도체(전자기기 속에서 계산하고 기억하는 작은 부품) 등의 종목에 판매 주문이 퍼지고, 하이테크 주식의 비율이 높은 나스닥(미국 기술 회사들이 많이 모인 주식시장)의 주가지수는 일시, 4%를 넘는 대폭적인 하락이 되었습니다."},{"s":"미국 핵심 PCE의 전년 동기 대비 증가율이 3년 만에 최고치를 기록하면서 연준이 12월 금리를 인상할 가능성이 고정되었습니다.","so":"财联社","tm":"11/26 00:38","c":1,"r":"cn","u":"https://www.cls.cn/detail/2544617","p":1795621080,"a":1795646939,"t":"美国核心PCE同比涨幅创近三年新高 锁定美联储12月再加息前景","su":"① 미국 근원 PCE 가격지수는 10월 전년 동기 대비 3.1%에서 3.3%로 상승해 2023년 11월 이후 최고 수준에 도달했습니다. 애널리스트들은 당초 3.2%까지 상승할 것으로 예상했습니다. ② 연준이 12월 8~9일 금리회의에서 금리를 0.25%포인트 인상할 것이라는 기대감이 시장에 거의 반영됐고, 2027년 1분기에도 금리 인상(이자 비율을 올리는 것)이 이어질 것으로 예상된다. 차이롄서, 11월 25일(자오하오 편집자) 미국의 최근 주요 인플레이션(물건값이 계속 오르는 것) 지표가 연준의 2% 목표에서 더욱 벗어나, 은행이 2027년 1분기에 다시 금리를 인상할 것이라는 시장의 기대가 더욱 강해졌다. 12월에는 인플레이션을 억제하기 위해 2027년에 금리 인상이 얼마나 더 필요한지 시장이 더 많은 관심을 갖게 됩니다. 미국 경제분석국(BEA)이 수요일 발표한 보고서에 따르면 미국 10월 PCE 물가지수는 전월 대비 0.3%, 전년 대비 3.8% 상승해 예상치에 부합했다. 9월 수치는 각각 0.5%와 3.7%였다."},{"s":"인공지능 매도세·관세 우려에... 뉴욕증시 하락 출발","so":"Chosunbiz","tm":"11/26 00:30","c":1,"r":"kr","u":"https://biz.chosun.com/international/international_general/2026/11/26/O5O2QZIPPFCWXDVA4A7KE7IKQU/","p":1795620600,"a":1795646912,"su":"뉴욕증시 3대 지수가 인공지능(AI) 관련주 매도세(팔려는 힘)와 관세 우려로 하락 출발했다. 26일(현지시각) 오전 9시 43분 다우존스30산업평균지수는 전 거래일보다 1002.71포인트(2.00%) 하락한 4만9015.99를 기록했다. 스탠더드앤드푸어스(S&P)500지수는 213.71포인트(2.97%) 내린 6987.38에 거래됐다. 나스닥(미국 기술 회사들이 많이 모인 주식시장)지수는 전 거래일보다 1032.16포인트(4.35%) 하락한 2만2701.38을 가리켰다."},{"s":"BOE의 Bailey는 에너지 가격이 현재 수준에 머물면 인플레이션의 정점이 낮아질 것으로 예상합니다.","so":"WSJ","tm":"11/26 00:24","c":1,"r":"us","u":"https://www.wsj.com/pro/central-banking/boes-bailey-sees-lower-peak-for-inflation-if-energy-prices-stay-where-they-are-8678fd4f","p":1795620240,"a":1795699334,"t":"BOE’s Bailey Sees Lower Peak for Inflation if Energy Prices Stay Where They Are"},{"s":"2008년 이후 가장 긴 침체 이후 주택건설업체 주식 불황 지속","so":"Bloomberg","tm":"11/26 00:01","c":1,"r":"world","u":"https://www.bloomberg.com/news/articles/2026-11-25/homebuilder-stock-woes-to-persist-after-longest-slump-since-2008","p":1795618899,"a":1795647041,"t":"Homebuilder Stock Woes to Persist After Longest Slump Since 2008"},{"s":"S&P500 지수는 3% 이상 하락했습니다.","so":"第一财经","tm":"11/25 23:47","c":1,"r":"cn","u":"https://www.yicai.com/brief/103454445.html","p":1795618020,"a":1795646951,"t":"标普500指数跌超3%","su":"2026/11/25 22:47 [S&P500(미국 큰 회사 500곳의 주가를 합쳐 만든 점수) 지수 3% 이상 하락] S&P500 지수는 3% 이상 하락, 나스닥(미국 기술 회사들이 많이 모인 주식시장)은 4.2%, 다우존스산업평균지수는 2% 이상 하락하는 등 미국 증시의 하락세는 더욱 확대됐다."},{"s":"요약: 미국 주식 하락; 젠슨 황이 복귀를 옹호합니다.","so":"The Economist","tm":"11/25 23:43","c":1,"r":"world","u":"https://www.economist.com/the-world-in-brief/2026/11/25/0698a881-094a-47d1-883c-1227dee7e5e0","p":1795617838,"a":1795647044,"t":"World in Brief: American stocks retreat; Jensen Huang defends his return"},{"s":"미국 증시는 하락세를 보이며 하락세를 이어갔고 나스닥도 하락폭을 4%까지 확대했습니다.","so":"ThePaper.cn","tm":"11/25 23:39","c":1,"r":"cn","u":"https://www.thepaper.cn/newsDetail_forward_34559190","p":1795617576,"a":1795651306,"t":"美股低开低走，纳指跌幅扩大至4%","su":"11월 25일, 미국 증시는 하락세로 출발했다가 하락세를 보였으며 나스닥(미국 기술 회사들이 많이 모인 주식시장)의 하락 폭은 4%로 확대되었습니다. 필라델피아 반도체(전자기기 속에서 계산하고 기억하는 작은 부품) 지수는 7% 이상 하락했다. 개별 종목 기준으로는 마이크론 테크놀로지와 ARM이 8% 이상 하락했고, 엔비디아와 AMD는 7% 이상 하락했고, 인텔, TSMC, 브로드컴, 테슬라도 7% 이상 하락했다."},{"s":"월가 Capital은 NBA가 수백억 유로를 활용하여 새로운 유럽 리그를 구성할 계획을 돕습니다.","so":"财联社","tm":"11/25 23:38","c":1,"r":"cn","u":"https://www.cls.cn/detail/2544606","p":1795617499,"a":1795646955,"t":"华尔街资本助阵 NBA拟撬动百亿欧元布局欧洲新联赛","su":"① NBA는 수요일에 FIBA와 함께 준비하고 있는 새로운 유럽 리그를 지원하기 위해 최소 100억 유로의 경기장 자금 조달(사업에 쓸 돈을 모으는 것) 계획을 발표했습니다. ②자본 지원 외에도 기존 유럽 농구 세력을 조율하고 모든 당사자가 인정하는 상업적 계약을 형성하는 방법은 여전히 프로젝트 실행에 영향을 미칩니다. 차이롄서, 11월 25일(편집자 Shi Zhengcheng) 미국프로농구연맹(NBA)은 NBA와 국제농구연맹(FIBA)이 준비 중인 새로운 유럽 리그에 대한 인프라 지원을 제공하기 위해 최소 100억 유로의 자금 조달 목표를 가진 투자 계획을 추진할 계획이라고 수요일 발표했습니다. 발표에 따르면, 모금될 자금은 유럽 농구 경기장의 건설 및 개조는 물론 주변 스포츠 및 오락 지구 개발에 사용될 예정입니다. NBA는 Apollo Sports Capital, Ares Management, 블랙스톤, JP모건을 비롯해 KKR, 블랙록 산하 기관 등 유럽 시장 및 인프라 투자 경험이 있는 글로벌 기관들이 참여할 그룹을 구성하고 있습니다."},{"s":"미국 증시가 개장하기 전 지난주 미국에서 실업수당을 신청한 사람은 18만9000명에 달했고 나스닥 선물은 3% 가까이 하락했다.","so":"第一财经","tm":"11/25 22:38","c":1,"r":"cn","u":"https://www.yicai.com/brief/103454368.html","p":1795613880,"a":1795651308,"t":"美股盘前丨美国上周初请失业金人数为18.9万人 纳指期货跌近3%","su":"[시사뉴스] ① 지난주 미국 실업수당 신청자는 18만9천명으로 종전 20만3천명보다 크게 늘었다. ② 10월 미국 핵심 PCE(미국 사람들이 쓴 돈으로 본 물가 숫자) 물가(물건값 전체의 수준)지수는 전년 동기 대비 3.3% 증가해 이전 수치인 3.1%에 비해 증가했습니다. ③ 특별"},{"s":"조정장 한복판에 나온 ‘25% 상승론’…도이체방크 “S&P500 9000”｜Global Money Club","so":"중앙일보","tm":"11/25 21:42","c":1,"r":"kr","u":"https://www.joongang.co.kr/gmc/article/25481962","p":1795610574,"a":1795651293,"su":"도이체방크의 빈키 차다 전략가가 2027년 말 S&P500(미국 큰 회사 500곳의 주가를 합쳐 만든 점수) 목표치를 9000으로 제시했습니다. 현재 수준에서 약 25% 더 오를 수 ..."},{"s":"인프라 구축 비용에 대한 우려로 AI 주가 하락","so":"CNA","tm":"11/25 21:17","c":1,"r":"sg","u":"https://www.channelnewsasia.com/business/ai-stocks-slide-fears-over-infrastructure-buildout-costs-6581691","p":1795609028,"a":1795647033,"t":"AI stocks slide on fears over infrastructure buildout costs","su":"11월 25일: AI 관련 주식은 수요일 초반 급락했지만 오후 반등(내렸다가 다시 오르는 것)을 시작했습니다. 최근 가을 충돌로 인해 비용 상승에 대한 투자자의 우려가 커지고 가격 급락으로 인해 강한 매수 관심에 대한 부채(갚아야 할 빚) 역학이 금지되었습니다. AI 연구소 앤트로픽은 O 직후 73.85달러에 거래되었습니다."},{"s":"엔비디아는 개장 전 5% 하락했고, 미국 증시 패닉지수는 12% 급등했다. 거의 1,000명에 가까운 사람들이 엔비디아를 고소하기를 원했고, 관련 변호사들이 이에 응했습니다.","so":"21财经","tm":"11/25 21:05","c":1,"r":"cn","u":"https://www.21jingji.com/article/20261125/herald/e9c343dddd2b81c80f84030a6ee5c470.html","p":1795608330,"a":1795651309,"t":"英伟达盘前大跌5%，美股恐慌指数飙升12%，近1000人想告英伟达，相关律师回应","su":"21 Financial Radar 데이터에 따르면 11월 25일 미국 3대 주가지수 선물이 시장 개장 전에 종합적으로 하락했습니다. 베이징 시간 18시 30분 현재 다우 선물은 0.86% 하락했고, 나스닥 선물은 2.68% 하락해 600포인트 이상 하락했고, S&P500(미국 큰 회사 500곳의 주가를 합쳐 만든 점수) 선물은 1.58% 하락했다. 미국 증시 패닉지수 VIX는 이날 12% 이상 상승해 29를 넘어섰다. 엔비디아의 시장 출시 전 하락폭은 주당 147.07달러로 5%로 확대되었습니다. 엔비디아는 11월 12일 젠슨 황이 사장, CEO 및 이사직을 사임했다고 발표한 이후 11월 24일 거래가 마감될 때까지 엔비디아는 10% 이상 하락했으며 가장 큰 되돌림은 26%를 초과했습니다. 젠슨 황이 돌아온 날 급등을 경험한 후 미국 AI 산업 체인의 좋은 시절은 단 하루만 머물렀습니다. 지난 24일 미국 반도체(전자기기 속에서 계산하고 기억하는 작은 부품) 업종이 전반적으로 급락했고, 25일에도 미국 AI 하드웨어 주가는 시장 개장 전부터 하락세를 이어갔다."},{"s":"골드만삭스: 시장 심리 지표가 최저 수준으로 떨어졌고, 미국 증시는 훌륭한 매수 기회를 맞이했습니다.","so":"财联社","tm":"11/25 19:03","c":1,"r":"cn","u":"https://www.cls.cn/detail/2544309","p":1795600980,"a":1795651311,"t":"高盛：市场情绪指标跌至低位 美股迎来绝佳买入时机","su":"① 골드만삭스가 모니터링하는 '심리지수'는 지난해 4월 '광복절' 이후 최저치인 36%대로 떨어졌다. ② 지표가 30~40번째 백분위수 범위에 있으면 어떤 시간 차원에 관계없이 S&P500(미국 큰 회사 500곳의 주가를 합쳐 만든 점수)의 후속 수익률은 평균 수준보다 높습니다. 차이롄서, 11월 25일(편집자 Liu Rui) 동부 표준시 기준 화요일에 골드만삭스는 고객에게 골드만삭스가 모니터링하는 \"감정 및 포지션 지표\"가 작년 4월 \"광복절\" 이후 가장 낮은 수준인 36번째 백분위수로 떨어졌다는 연구 보고서를 발표했습니다. 역사적 관점에서 볼 때 지표가 이 범위에 속할 때마다 S&P500의 후속 수익률은 평균보다 높은 경향이 있습니다. 골드만삭스 분석가 Christian Mueller-Glissmann은 이번 라운드에서 시장 심리 및 포지션 지표가 하락한 것은 주로 시장 변동성(값이 크게 출렁이는 정도) 증가, 옵션 매수 포지션 축소, 위험 선호도 냉각 및 투자자 신뢰도 조사 약화 때문이라고 말했습니다."},{"s":"유럽 증시 지수는 산업재, 사치품 상승으로 대부분 상승","so":"WSJ","tm":"11/25 17:35","c":1,"r":"us","u":"https://www.wsj.com/finance/stocks/nikkei-falls-2-8-dragged-by-chip-related-stocks-79ef7a34","p":1795595700,"a":1795676777,"t":"European Stock Indexes Mostly Higher as Industrials, Luxuries Gain"}]},{"name":"🧬 나스닥 바이오","note":"보유: TIGER 미국나스닥바이오","breaking":false,"items":[{"s":"머스크 뉴럴링크, 뇌-컴퓨터 연결장치 임상시험 FDA 승인","so":"YTN","tm":"11/26 11:44","c":3,"r":"kr","u":"https://www.ytn.co.kr/_ln/0104_202611261144005780","p":1795661040,"a":1795662989,"su":"일론 머스크가 설립한 스타트업 뉴럴링크가 사람 두뇌와 컴퓨터를 연결하는 뇌-컴퓨터 연결장치, BCI 임상시험(새 약을 사람에게 시험하는 것)에 대해 미국 당국의 승인을 받았습니다. 현지시간 25일 블룸버그 통신에 따르면, 뉴럴링크는 미국 식품의약국, FDA(미국에서 약을 허가해 주는 정부 기관)의 승인을 받아 근위축성 측삭경화증, 이른바 루게릭병 환자를 대상으로 BCI 이식의 안전성과 효과를 평가할 예정입니다."},{"s":"Neuralink, 뇌 임플란트에 대한 중요한 ALS 시험에 대해 FDA 승인 획득","so":"Startup Fortune","tm":"11/26 17:25","c":2,"r":"us","u":"https://startupfortune.com/neuralink-wins-fda-approval-for-a-pivotal-als-trial-of-its-brain-implant/","p":1795681521,"a":1795694278,"t":"Neuralink Wins FDA Approval for a Pivotal ALS Trial of Its Brain Implant","su":"가까운 사람이 ALS를 앓고 있는 경우, 이 임플란트가 판매하기에 충분한지 알아보기 위한 미국 연구가 현재 진행 중입니다. 여기에 참여하는 것은 완성된 제품을 얻는 것과 같지 않으며 답변을 받는 데 몇 년이 걸릴 것입니다."},{"s":"초기 거래에서 조정된 혁신적인 약물 개념","so":"第一财经","tm":"11/26 10:49","c":2,"r":"cn","u":"https://www.yicai.com/brief/103454869.html","p":1795657740,"a":1795662990,"t":"创新药概念早盘调整","su":"2026/11/26 09:49 [초기 거래 혁신신약(세상에 처음 나온 새로운 약) 개념 조정] 니어쇼어 단백질이 10% 이상 하락했고, 완방제약, 시야오징펑, 계림산진, 라이메이제약, 포인세티아도 5% 이상 하락했다."},{"s":"국내 최초 AKT 억제제 3상 결과 발표! 항셍 지수는 상승했다가 하락했고, 홍콩 증권 연결 혁신 의약품 ETF 차 페이스에 대한 중요한 연구를 시작하기 위해 FDA 승인을 받았습니다.","so":"香港經濟日報HKET","tm":"11/26 18:10","c":1,"r":"hk","u":"https://inews.hket.com/article/4231557/%E9%86%AB%E7%99%82%E7%A7%91%E6%8A%80%EF%BD%9CNeuralink%E7%8D%B2FDA%E6%89%B9%E5%87%86%E3%80%80%E5%95%9F%E5%8B%95%E7%BE%8E%E9%A6%96%E5%80%8B%E6%A4%8D%E5%85%A5%E5%BC%8F%E8%85%A6%E6%A9%9F%E4%BB%8B%E9%9D%A2%E9%97%9C%E9%8D%B5%E7%A0%94%E7%A9%B6?mtc=20040","p":1795684230,"a":1795694289,"t":"醫療科技｜Neuralink獲FDA批准 啟動美首個植入式腦機介面關鍵研究"},{"s":"Fosun Pharma: HLX109 주사제 임상시험 승인","so":"Jiemian.com","tm":"11/26 17:48","c":1,"r":"cn","u":"https://www.jiemian.com/article/15378202.html","p":1795682937,"a":1795694281,"t":"复星医药：HLX109注射液临床试验获批","su":"Fosun Pharma는 최근 회사의 지배 자회사(다른 회사가 주인인 회사)인 Shanghai Henlius Biotechnology와 그의 지배 자회사가 국가 의약품 관리국(중국 국가약품감독관리국)이 발행한 \"약물 임상(새 약을 사람에게 시험하는 것) 시험 승인 통지\"를 받았으며, 이는 전신 농포성 건선 치료를 위해 HLX109 주사(즉, IL1RAP를 표적으로 하는 단일클론 항체)의 1상 임상 시험을 수행하기로 합의했다고 발표했습니다."},{"s":"'생각'만으로 물건 움직인다…머스크 뇌 이식칩 임상평가 돌입 - 머니투데이","so":"머니투데이","tm":"11/26 17:04","c":1,"r":"kr","u":"https://www.mt.co.kr/amp/world/2026/11/26/2026112616150525617","p":1795680294,"a":1795694277,"su":"일론 머스크 스페이스X·테슬라 최고경영자(CEO(회사의 가장 높은 책임자))가 세운 스타트업 뉴럴링크가 뇌-컴퓨터 연결장치(BCI) 임상(새 약을 사람에게 시험하는 것) 시험 승인을 받았다. 뉴럴링크는 마비 환자들이 생각만으로 전자 기기를 쓸 수 있는 뇌 이식 장치를 개발해 왔다."},{"s":"3년간의 운영, 글로벌 데뷔: 인내심 있는 자본과 혁신적인 제약회사 간의 양방향 여정","so":"21财经","tm":"11/26 16:51","c":1,"r":"cn","u":"https://www.21jingji.com/article/20261126/herald/54ab6a3b75d7741200c382a02ec220d4.html","p":1795679460,"a":1795694283,"t":"三年陪跑、全球首发：耐心资本与创新药企的双向奔赴","su":"홍반성 루푸스, 류마티스 관절염...장기적인 약물 치료가 필요한 이러한 자가면역 질환은 수천만 가족을 괴롭혔습니다. '면역치료의 이정표'로 알려진 CAR-T 기술을 통해 일부 환자는 약물 중단 후 장기간 관해를 달성할 수 있었지만 대부분의 환자에게는 수십만에서 수백만의 가격이 감당하기 어려울 정도였습니다. 2021년 12월 설립된 선전 기업 홍신바이오테크놀로지(Hongxin Biotechnology)는 이 문턱을 '허물기' 위해 노력하고 있다. 그들은 인간 임상(새 약을 사람에게 시험하는 것) 시험에 들어간 세계 최초의 \"세포 표적 LNP 약물\"을 개발했습니다. 기존 CAR-T의 '고도화된 민간 맞춤화'를 언제든지 복용하고 사용할 수 있는 '표준화된 대량생산 의약품'으로 탈바꿈할 것으로 예상되며, 치료비도 1만원 수준으로 인하될 전망이다."},{"s":"다이이치산쿄(Daiichi Sankyo)의 혁신신약 Viftai®(퀴자티닙 염산염 정제)가 중국에서 공식 출시되었습니다.","so":"Jiemian.com","tm":"11/26 15:48","c":1,"r":"cn","u":"https://www.jiemian.com/article/15377277.html","p":1795675716,"a":1795676824,"t":"第一三共创新药物维复泰®（盐酸奎扎替尼片）正式在中国商业上市","su":"11월 26일, Daiichi Sankyo China의 소식에 따르면, Daiichi Sankyo의 혁신적인 약물 Vivotec®(퀴자티닙 염산염 정제)이 FLT3-ITD 돌연변이가 있는 새로 진단된 급성 골수성 백혈병(AML) 성인 환자의 치료를 위해 중국에서 공식 출시되었습니다. Weifutai®는 곧 전국의 병원과 약국에 공급되어 중국 의사와 AML 환자에게 새로운 치료 옵션(정해진 값에 사거나 팔 권리)을 제공할 예정입니다."},{"s":"의료보험의 이중 카탈로그가 공식적으로 출시되었으며 혁신 의약품의 지불 측면이 집중적으로 현금화되었습니다. 홍콩 스톡커넥트 혁신신약 ETF인 Harvest(520970)는 홍콩 혁신 의약품 산업의 발전 기회를 포착합니다.","so":"Jiemian.com","tm":"11/26 13:00","c":1,"r":"cn","u":"https://www.jiemian.com/article/15376335.html","p":1795665620,"a":1795694284,"t":"医保双目录正式落地，创新药支付端兑现密集，港股通创新药ETF嘉实(520970)把握港股创新药产业发展机会","su":"2026년 11월 26일 10시 45분 현재 CSI 홍콩 스톡커넥트(홍콩과 중국 본토 주식을 서로 사고팔 수 있게 한 길) Innovative Drug Index는 2.71% 크게 상승했으며, 구성주인 Zhaoyan New Drug은 5.27%, GenScript Biotech은 5.26%, China Biopharmaceutical은 5.14% 상승하고 우시앱텍 및 Insilicon Intelligent와 같은 주식이 뒤따랐습니다."},{"s":"Cipla, Teva, FDA 승인 천식 흡입기 Flovent 획득","so":"ETPharma","tm":"11/26 12:07","c":1,"r":"us","u":"https://pharma.economictimes.indiatimes.com/amp/news/drug-approvals-and-launches/cipla-teva-win-fda-nod-asthma-inhaler-flovent/136177077","p":1795662465,"a":1795694279,"t":"Cipla, Teva win FDA nod asthma inhaler Flovent","su":"- 약물 승인 및 출시 - 1분 읽기 Cipla, Teva, FDA(미국에서 약을 허가해 주는 정부 기관) 천식 흡입기 Flovent 승인 이스라엘의 Teva Pharmaceuticals와 협력하여 개발된 이 제품은 GSK의 Flovent와 동등한 최초의 제네릭(특허가 끝난 약을 똑같이 만든 복제약) 제품으로 명시되어 있습니다."},{"s":"NASDAQ Biotechnology Total Retu (^XNBIJPY) 계절별 수익률 차트 - 야후 파이낸스","so":"Yahoo! Finance Canada","tm":"11/26 01:54","c":1,"r":"us","u":"https://ca.finance.yahoo.com/quote/%5EXNBIJPY/seasonality/","p":1795625657,"a":1795694279,"t":"NASDAQ Biotechnology Total Retu (^XNBIJPY) Seasonal Returns Chart - Yahoo Finance","su":"NASDAQ Biotechnology Total Retu(^XNBIJPY) 계절 수익률(넣은 돈에 비해 얻는 이익 비율) 차트는 투자 전략을 알리기 위해 월별 평균 및 중간 수익률을 제공합니다."},{"s":"410억 달러 규모의 사노피/인스메드 거래가 M&A 희망을 되살리면서 주목해야 할 5개 생명공학 주식","so":"Yahoo Finance","tm":"11/26 00:31","c":1,"r":"us","u":"https://finance.yahoo.com/healthcare/articles/5-biotech-stocks-watch-41b-153100426.html","p":1795620660,"a":1795647062,"t":"5 Biotech Stocks to Watch as $41B Sanofi/Insmed Deal Revives M&A Hopes","su":"인스메드를 인수하기로 한 사노피의 합의는 생명공학에 대한 투자자의 관심을 다시 불러일으켰고 잠재적인 인수 목표에 대한 광범위한 부문 상승세(오르는 흐름)와 추측을 촉진하는 데 도움이 되었습니다. 이번 거래는 대형 제약사의 성장 전망을 강화할 수 있는 차별화된 의약품과 유망 파이프라인(개발하고 있는 신약 후보 목록)의 전략적 가치를 강조합니다."},{"s":"'중국 혁신' 해외 진출 | 생명을 지키는 의학의 '새로운 힘'","so":"新华网","tm":"11/25 22:58","c":1,"r":"cn","u":"https://www.news.cn/tech/20261125/a77a0741fd924d98b82a3b4452c699ec/c.html","p":1795615135,"a":1795647069,"t":"“中国创新”出海记丨守护生命的医药“新力量”","su":"혁신적인 의약품과 같은 신제품은 빠르게 해외 시장을 개척하고 있으며 중국의 대외 무역을 위한 새로운 명함이 되고 있습니다. 데이터에 따르면 올해 3분기까지 중국의 혁신 의약품에 대한 외부 라이센스 거래는 약 1,300억 달러로 지난해 전체 수준에 가깝습니다. 혁신신약(세상에 처음 나온 새로운 약)의 외부 라이센싱은 혁신제약사가 특허나 기술, 제품 등을 해외 기업에 라이센싱하는 거래 형태다. 이는 중국의 지적재산권과 독창적인 연구개발 역량의 특별한 수출이다. 실험실에서의 독립적 연구개발부터 글로벌 시장에서의 협력과 경쟁에 이르기까지 점점 더 많은 중국 혁신 의약품이 해외 시장에 진출하고 글로벌 의약품 연구 개발 협력에 참여하며 혁신 의약품 해외 진출의 새로운 이야기를 쓰고 있습니다. Rongchang Biopharmaceutical (Yantai)가 독자적으로 개발한 새로운 항종양 약물은 전 세계적으로 3상 임상시험(새 약을 사람에게 시험하는 것)을 진행하고 있습니다. 현재 Rongchang Biotechnology는 다양한 핵심 제품에 대한 외부 라이센스 협력을 완료했으며 종양, 자가면역, 안과 등 분야를 포함하여 총 협력 금액이 126억 달러가 넘습니다."},{"s":"ETF 선택 | 3대 지수는 등락세를 보이며 약세를 보인 반면, 한약, 홍콩 소비재, 홍콩 혁신의약품 등 ETF는 추세를 거스르며 강세를 보였다.","so":"Jiemian.com","tm":"11/25 21:44","c":1,"r":"cn","u":"https://www.jiemian.com/article/15373949.html","p":1795610664,"a":1795612518,"t":"ETF甄选 | 三大指数震荡走弱，中药、港股消费、港股创新药等ETF逆势走强","su":"2026년 11월 25일 A주 시장은 하루 종일 등락과 약세(내리는 흐름)를 보이며 3대 지수가 종합적으로 마감됐다. 장을 마감한 현재 상하이증권거래소지수는 2.03%, 선전부품지수는 3.24%, 차이넥스트지수는 4.19% 하락했다. ETF(여러 주식을 묶어 파는 상품) 측면에서는 한의학, 홍콩소비자주, 홍콩혁신의약품 등 관련 ETF가 추세를 거스르고 강세를 보였습니다!"},{"s":"410억 달러 규모로 최근 몇 년간 제약 업계 최대 규모의 인수합병이 완료되었습니다! 520880 기초 지수가 3% 이상 상승하고 주요 가중치가 공동 노력을 기울이는 등 홍콩 증시 연계의 혁신 의약품에 대한 분위기가 뜨거워지고 있습니다.","so":"Jiemian.com","tm":"11/25 20:02","c":1,"r":"cn","u":"https://www.jiemian.com/article/15373502.html","p":1795604521,"a":1795608159,"t":"410亿美元，制药行业近年最大并购落定！港股通创新药情绪升温，520880标的指数摸高逾3%，权重龙头集体发力","su":"11월 25일(수요일) 홍콩 증시는 상승했다가 하락하며 항셍지수가 1.14% 하락했습니다. 혁신적인 약물은 시장 추세를 거스르는 몇 안 되는 약물 중 하나였습니다. 100% 혁신의약품 연구개발 목표인 홍콩주식연계 혁신약품 ETF(여러 주식을 묶어 파는 상품) 화바오(520880) 추적지수(항셍홍콩주식연계 혁신약물선택지수)가 0.4% 상승을 마감했다."},{"s":"넥셀라가 상가 지향 강화해 연초 고가 갱신, 금기 영업 흑자 예상 바이오 주식에 개인 투자자가 매입 공세","so":"株探","tm":"11/25 19:30","c":1,"r":"jp","u":"https://kabutan.jp/news/marketnews/?b=n202611250709","p":1795602659,"a":1795676825,"t":"ネクセラが上値指向強め年初来高値更新、今期営業黒字予想のバイオ株に個人投資家が買い攻勢"},{"s":"방금 생명공학주로 1억 6천만 달러를 벌었습니다! 장준닝(Junning Chang)은 대만 증시 충격에 직면해 AI 주식을 알아보고 '오로라'를 보았다.","so":"噓！星聞","tm":"11/25 18:12","c":1,"r":"tw","u":"https://stars.udn.com/star/story/10089/9901613","p":1795597967,"a":1795608162,"t":"才靠生技股賺1.6億！張鈞甯遇台股震盪認了AI股慘見「極光」","su":"2022년에는 장준닝이 생명공학 주식 '야오화제약(Yaohua Pharmaceutical)'을 NT$6016만에 매입한 것으로 밝혀졌습니다. 그녀는 최소 NT$1억 6천만 달러를 벌어들인 것으로 알려졌고, 그녀는 단번에 \"여성 주식의 신\"이라는 별명을 얻었습니다. 그러나 그녀는 지난달 한 행사에서 자신의 주식을 모두 매진했고 여전히 일부 AI 주식을 보유하고 있다고 담담하게 밝혔다. 최근 대만 증시는 지속적인 변동세를 보이고 있습니다. 그녀는 어제 한 금 주얼리 브랜드 행사에 참석해 현재 투자 상황에 대한 질문을 받았다. 그녀는 최근 주식시장이 '오로라'(증시 붕괴의 청신호)였다고 인정했다. 그녀는 “다른 사람들도 마찬가지”라며 웃었다. 그녀는 자신의 투자 생각도 밝혔습니다."},{"s":"Jiuzhitang: 전액 출자 자회사가 개발한 신약이 중국에서 임상 시험 승인을 받았습니다.","so":"第一财经","tm":"11/25 17:16","c":1,"r":"cn","u":"https://www.yicai.com/news/103453853.html","p":1795594596,"a":1795647073,"t":"九芝堂：全资子公司研发新药在国内获得临床试验批准","su":"제일재경 2026-11-25 16:13:57 편집자: Gao Mingyan Jiuzhitang은 자사의 전액 출자 자회사(다른 회사가 주인인 회사)인 Youbo Pharmaceutical에서 개발한 신약 재조합 MG53 돌연변이 단백질 젤(YB001 젤)이 최근 국가 식품의약국으로부터 승인 및 발행된 \"약물 임상 시험 승인 고시\"를 받았으며 적응증 범위 내에서 임상 시험을 수행하는 데 동의했다고 발표했습니다. \"조기 상처 치유를 촉진하고 다양한 유형의 만성 치유가 어려운 상처(당뇨병성 족부 궤양, 정맥 정체 궤양, 욕창 등 포함)에 사용됩니다.\" 드디어 상장(주식시장에 처음 들어오는 것) 신청 단계에 이르렀으나 과정이 순조롭지는 않았습니다."},{"s":"‘먹는 유방암약’ 美 FDA 승인…100조 시장 노린 신약 쏟아진다","so":"Chosunbiz","tm":"11/25 16:11","c":1,"r":"kr","u":"https://biz.chosun.com/science-chosun/science/2026/11/25/HBSWEODEGJRGGOLGGZRGEY3GHE/?outputType=amp","p":1795590660,"a":1795608158,"su":"먹는 유방암약 美 FDA 승인(미국에서 이 약을 팔아도 된다는 허가)100조 시장 노린 신약 쏟아진다 먹는 약부터 ADC(암세포만 골라 약을 전달하는 항암제) 치료제까지 中 기업도 맹추격"},{"s":"ST 렌푸가 19년 넘게 개발한 신약은 폐기됐고, 4억 달러의 자금이 낭비됐다.","so":"第一财经","tm":"11/25 15:08","c":1,"r":"cn","u":"https://www.yicai.com/news/103454004.html","p":1795586935,"a":1795612520,"t":"ST人福研发了19年以上的新药宣告放弃，4亿资金打水漂了","su":"19년 넘게 개발해온 신약, ST 렌푸(600079.SH)가 결국 무산됐다. 11월 25일 저녁, ST Renfu는 R&D 프로젝트 종료 및 자산 손상 조항 제공에 대한 발표를 발표했습니다. 이번에 종료된 연구개발은 생체치료제 1종 신약인 재조합 플라스미드-간세포 성장인자 주사제(이하 'pUDK-HGF')이다. 에스티휴먼푸의 자회사(다른 회사가 주인인 회사)인 우한옵틱스밸리휴먼푸바이오팜(이하 '옵티컬밸리휴먼푸', 지분 81.30% 보유)이 개발한 제품으로, 중증 하지 허혈성 질환으로 인한 사지 안정 통증 치료에 사용된다. 이 약은 2007년 4월 '의약품임상시험(새 약을 사람에게 시험하는 것) 승인'을 획득하고 1상 임상시험이 허가됐다. 2013년 3월에는 '의약품 임상시험 승인'을 획득하고 2상 임상시험을 실시할 수 있게 되었습니다. 2017년 9월에는 '의약품 임상시험 승인'을 획득해 3상 임상시험을 실시할 수 있게 됐다. 2024년 12월 Optics Valley Renfu는 국가 식품의약국에 판매 등록 신청서를 제출하고 승인되었습니다."},{"s":"바이오의약품에 대한 정책 지원이 크게 늘었고, 과학기술제약 ETF Harvest(588700)도 계속 수혜를 입을 것으로 예상된다.","so":"Jiemian.com","tm":"11/25 14:31","c":1,"r":"cn","u":"https://www.jiemian.com/article/15372010.html","p":1795584660,"a":1795589883,"t":"政策端对生物医药的支持力度显著增强，科创医药ETF嘉实(588700)有望持续受益","su":"2026년 11월 25일 13시 31분 현재 상하이 과학기술혁신위원회 생물의학지수는 0.74% 하락했다. Baili Tianheng이 5.54% 상승을 주도하고 Shengxiang Biotech이 1.52% 상승하고 Zejing Pharmaceutical이 1.51% 상승하는 등 구성 종목이 혼조세(오르는 것과 내리는 것이 섞인 모습)를 보였습니다. 메디실론이 하락세를 주도했고, MGI와 하이타이싱광이 그 뒤를 이었다."},{"s":"직장‧결장 수술부위 감염증 항생제 FDA 승인","so":"약업신문","tm":"11/25 14:01","c":1,"r":"kr","u":"http://m.yakup.com/news/?mode=view&cat=16&cat2=&cat3=0&nid=335707","p":1795582860,"a":1795589880},{"s":"FDA 승인으로 BridgeBio 주식에 대한 사례가 바뀔 수 있음","so":"Yahoo Finance","tm":"11/25 12:19","c":1,"r":"us","u":"https://finance.yahoo.com/healthcare/articles/fda-approval-may-change-case-031915636.html","p":1795576740,"a":1795582099,"t":"FDA Approval May Change The Case For BridgeBio Stock","su":"브리지바이오는 1차 및 주요 2차 평가변수를 충족한 3상 FORTIFY 시험 데이터를 기반으로 체중이 30kg 이상인 LGMD2I/R9 성인 및 소아 환자를 위한 경구 치료제인 Welgemda에 대해 기존 FDA 승인(미국에서 이 약을 팔아도 된다는 허가)을 받았습니다. Welgemda는 모든 형태의 사지 근이영양증에 대해 최초로 승인된 치료법이며 BridgeBio에 희귀 소아 질환 우선 검토 바우처를 제공합니다."},{"s":"美브릿지, '경구 리비톨' LGMD 첫 치료제 \"FDA 승인\"","so":"바이오스펙테이터","tm":"11/25 10:56","c":1,"r":"kr","u":"https://www.biospectator.com/news/view/30508","p":1795571760,"a":1795574626,"su":"미국 브릿지바이오파마(BridgeBio Pharma)의 경구 리비톨(ribitol) ‘BBT-418’이 체중 30kg 이상인 성인 및 소아 지대근이영양증 2I/R9형(LGMD2I/R9) 치료제로 미국에서 승인받았다."},{"s":"Alembic, 백혈병 치료제의 추가 효능에 대해 FDA 승인 획득","so":"ETPharma","tm":"11/25 10:41","c":1,"r":"world","u":"https://pharma.economictimes.indiatimes.com/amp/news/drug-approvals-and-launches/alembic-gets-fda-nod-for-additional-strength-of-leukemia-drug/136145441","p":1795570893,"a":1795608163,"t":"Alembic gets FDA nod for additional strength of leukemia drug","su":"Alembic Pharmaceuticals는 일반 백혈병 치료제 Bosutinib의 새로운 400mg 용량에 대해 FDA 승인(미국에서 이 약을 팔아도 된다는 허가)을 받아 혈액암 치료 분야에서 시장 입지를 확대했습니다."},{"s":"눈으로 심장질환 위험 읽는다…메디웨일, 美 FDA 승인 획득","so":"한스경제","tm":"11/25 10:18","c":1,"r":"kr","u":"http://www.hansbiz.co.kr/news/articleView.html?idxno=886970","p":1795569505,"a":1795574626,"su":"| 서울=한스경제 김동주 기자 | 망막 촬영만으로 심혈관질환 발생 위험을 예측하는 국내 인공지능(AI) 의료기기가 미국 시장 진출을 위한 규제 관문을 넘었다. 메디웨일은 망막 기반 심혈관질환 위험 예측 AI 소프트웨어 ‘닥터눈 CVD’가 미국 식품의약국(FDA(미국에서 약을 허가해 주는 정부 기관)) 510(k) 승인을 획득했다고 25일 밝혔다.닥터눈 CVD는 안저카메라로 촬영한 망막 이미지를 AI로 분석해 심혈관질환 발생 위험을 예측하는 의료기기다. 이번 FDA 승인(미국에서 이 약을 팔아도 된다는 허가)을 통해 향후 10년 내 첫 죽상경화성 심혈관질환(ASCVD)이 발생할 위험을 추정하는 기능을 인정받았다"},{"s":"애브비, 비분절성 백반증 치료제 린보크(린버크)에 대해 FDA 승인 획득","so":"Yahoo Finance","tm":"11/24 23:50","c":1,"r":"us","u":"https://finance.yahoo.com/healthcare/articles/abbvie-gets-fda-approval-rinvoq-145000786.html","p":1795531800,"a":1795560804,"t":"AbbVie Gets FDA Approval for Rinvoq in Nonsegmental Vitiligo","su":"애브비는 비분절성 백반증(피부 색이 하얗게 빠지는 병)에 대한 린버크에 대해 FDA 승인(미국에서 이 약을 팔아도 된다는 허가)을 받아 미국에서 이 질환에 대해 승인된 최초이자 유일한 전신 치료제가 되었습니다."},{"s":"'반제약' 민주당이 생명공학 주식의 큰 승리를 앗아갈 것인가?","so":"Investor's Business 안이다. 위에서 언급한 거래 대상에는 Tianqi Group, Tianqi Minmetals 및 Ying'anjia가 포함됩니다. 처음 두 개는 톈치리튬의 실제 컨트롤러인 Jiang Weiping이 제어합니다. Ying'anjia는 톈치리튬의 회장인 Jiang Anqi가 통제합니다. 본 거래는 관련 거래를 구성합니다. 올해 상반기 기준으로 Tianqi Xingyu는 Tianqi Group에 9억 2100만 위안의 대출금 원금과 이자를 갚아야 합니다. 합의 후 톈치리튬은 대출금을 상환해야 하므로 이번 거래에 대한 실제 대가는 77억 9300만 위안으로 증가했습니다."},{"s":"'Broker Insights' CITIC Lyon은 CATL(03750)의 4분기 실적이 부진하다고 지적하며 내년 실적에 대한 회사의 견해에 주목","so":"etnet 經濟通","tm":"11/26 11:30","c":2,"r":"hk","u":"https://www.etnet.com.hk/www/tc/news/news-article.php?section=categorized&category=latest&newsid=20261121382","p":1795660200,"a":1795663002,"t":"《券商精點》中信里昂指寧德時代(03750)第四季績弱，關注公司對明年業績看法","su":"2026-11-26 10:30 \"Broker Focus\" CITIC Lyon은 CATL(03750)이 4분기 실적(회사가 번 돈 성적표)이 부진하다고 지적하며 내년 실적에 대한 회사의 견해에 주목했습니다. CITIC Lyon은 CATL(03750)의 \"우수\" 등급을 유지했으며 H주와 A주의 목표 주가는 각각 HK$585와 RMB 400입니다. CATL의 2026년 4분기 실적이 예상보다 나쁠 수 있다는 우려가 시장에서 다시 불붙자 최근 CATL의 주가가 다시 조정을 받았다. 은행은 비용 전달 지연과 연말 컴퓨팅 비용 집중으로 인해 회사의 4분기 실적이 하락할 수 있다는 연구 보고서를 발표했습니다. 하지만 은행은 현 단계에서 더 중요한 것은 CATL이 2027년 단위당 순이익(모든 비용을 빼고 남은 돈) 실적을 어떻게 보는가라고 지적했다. 불행하게도 시장은 회사로부터 보다 명확한 지침을 얻기 위해 2027년 1분기까지 기다려야 할 수도 있다. 그럼에도 불구하고 은행은 CATL에 대한 투자등급을 재차 밝혔습니다."},{"s":"[특징주] 美, 한국 관세 15% 유지 전망에…이차전지주 동반 강세","so":"Chosunbiz","tm":"11/26 09:48","c":2,"r":"kr","u":"https://biz.chosun.com/stock/stock_general/2026/11/26/IC5DVVTVNZGPZOKZ5CMYNY55AI/","p":1795654080,"a":1795663000,"su":"미국이 한국에 대한 관세(수입품에 붙이는 세금) 상한을 기존 15%로 유지할 것이란 소식에 국내 이차전지 관련주가 장 초반 강세를 보이고 있다. 추가 관세 부과에 대한 우려가 완화되면서 투자심리가 개선된 것으로 풀이된다. 26일 오전 9시 44분 삼성SDI(006400)는 유가증권시장(한국 큰 회사들이 모인 주식시장(코스피))에서 전 거래일 대비 1만4000원(3.35%) 오른 43만2000원에 거래되고 있다. 포스코퓨처엠도 5800원(3.54%) 오른 16만9500원을 기록 중이다."},{"s":"도쿠시마현 현내 6시읍면에서 리튬 이온 전지 회수의 실증 사업","so":"NHKニュース","tm":"11/26 06:00","c":2,"r":"jp","u":"https://news.web.nhk/newsweb/na/nd-20261126de81555","p":1795640418,"a":1795647101,"t":"徳島県 県内6市町村でリチウムイオン電池回収の実証事業","su":"【NHK】리튬(배터리에 꼭 들어가는 아주 가벼운 금속) 이온 전지가 관계하는 화재가 뒤를 끊지 않는 가운데, 도쿠시마현은, 11월부터 현내의 공공 시설 내에 전용의 박스를 설치해 전지의 회 으로 개장했다.장 초반 유가증권시장 시가총액(회사 전체 몸값) 상위 10개 종목은 대체로 강세를 나타내고 있다. 대장주 삼성전자가 전일 대비 1,700원(1.00%) 오른 17만 2,400원에 거래되고 있으며, SK하이닉스는 2만 5,000원(2.43%) 상승한 105만 5,000원을 기록 중이다. 삼성전자우 역시 200원(0.15%) 오른 13만 5,000원으로 출발했다"},{"s":"중국 배터리 거대 기업, 미국과 유럽연합(EU)의 구속을 우회하기 위해 한국 소재 기업으로 눈을 돌림","so":"Korea JoongAng Daily","tm":"11/26 07:04","c":1,"r":"us","u":"https://www.koreajoongangdaily.com/business/chinese-battery-giants-turn-to-korean-materials-firms-in-an-attempt-to-bypass-us-and-eu-straightjacket/12982976","p":1795644299,"a":1795647087,"t":"Chinese battery giants turn to Korean materials firms in an attempt to bypass U.S. and EU straightjacket","su":"미국과 유럽연합(EU)이 중국산 전기차 배터리(전기차를 움직이는 큰 충전 배터리) 의존도를 낮추려는 움직임에 따라 CATL 등 중국 배터리 제조사들이 한국 소재 공급업체, 서구 자동차 제조사들과 손잡고 해외 진출에 나선다."},{"s":"세 명의 시애틀 엔지니어가 리튬을 식염의 원소로 대체하려고 하여 거의 110만 달러를 모금했습니다.","so":"The Economic Times","tm":"11/26 06:28","c":1,"r":"us","u":"https://m.economictimes.com/world/us/three-seattle-engineers-want-to-replace-lithium-with-the-element-in-table-salt-raise-nearly-1-1-million-to-take-on-china-plan-60-kwh-battery-system-for-washington-community-hub/articleshow/136172253.cms","p":1795642102,"a":1795676835,"t":"Three Seattle engineers want to replace lithium with the element in table salt, raise nearly $1.1 million","su":"나트륨 이온 배터리(리튬 대신 소금 성분을 쓰는 배터리) 기술 설명: Emerald Battery Labs는 나트륨 이온 배터리 기술로 에너지 저장에 혁명을 일으키고 있습니다. 110만 달러 미만의 자금을 지원받은 이 스타트업은 비용을 절감하고 배터리 성능을 향상시켜 잠재적으로 전기 자동차 산업을 변화시키는 것을 목표로 하고 있습니다."},{"s":"세키스이 화학·니시다 전무, 페로브스카이트 태양전지 「기술 혁신으로 투자 억제」","so":"日本経済新聞","tm":"11/26 05:00","c":1,"r":"jp","u":"https://www.nikkei.com/article/DGXZQOUC047YD0U6A101C2000000/","p":1795636800,"a":1795647104,"t":"積水化学･西田専務、ペロブスカイト太陽電池「技術革新で投資抑制」","su":"세키스이화학공업은 차세대 기술인 페로브스카이트 태양전지를 올봄 발매해 9월까지 8건 납품(만든 물건을 주문한 곳에 넘기는 것)했다. 2027년 4월부터는 제1탄 양산(공장에서 많이 만들어 내는 것)설비를 가동시킬 예정이다. 태양전지 사업을 이끄는 니시다 타츠야 대표 이사 전무 집행 임원에게 향후 전망을 들었다. ――페로브스카이트 태양전지 「SOLAFIL(소라필)」판매 개시로부터 반년이 경과했습니다. “26년도 상반기에 8건 납입해, 하반기에도 증가할 전망이다. 인수는 매우 많아지고"},{"s":"CATL 주가, EU 하이브리드 억제로 수요 우려가 가중되면서 리튬 가격 하락","so":"Fastmarkets","tm":"11/26 01:10","c":1,"r":"us","u":"https://www.fastmarkets.com/insights/catl-shares-lithium-prices-fall-as-eu-hybrid-curbs-add-to-demand-concerns/","p":1795623040,"a":1795647091,"t":"CATL shares, lithium prices fall as EU hybrid curbs add to demand concerns","su":"시장 변동, 배터리 부문에 영향을 미치는 주요 평가 등 리튬(배터리에 꼭 들어가는 아주 가벼운 금속) 가격에 대한 최신 통찰력을 얻으세요."},{"s":"Huajing은 2027년에 CATL 배터리 교체 전기 SUV를 계획하고 있다고 합니다.","so":"AutoTechInsight","tm":"11/25 23:56","c":1,"r":"world","u":"https://autotechinsight.spglobal.com/news/5291596/huajing-reportedly-plans-catl-battery-swapping-electric-suv-for-2027","p":1795618589,"a":1795647111,"t":"Huajing reportedly plans CATL battery-swapping electric SUV for 2027","su":"계획된 차량은 현재 플러그인 하이브리드로만 판매되는 모델에 배터리-전기 옵션(정해진 값에 사거나 팔 권리)을 추가할 것입니다."},{"s":"탄산리튬이 60% 이상 떨어졌는데, 자동차 회사들은 왜 아직까지 좋은 삶을 누리지 못하는 걸까? -36Kr","so":"36kr","tm":"11/25 22:06","c":1,"r":"cn","u":"https://www.36kr.com/p/4084993668180356","p":1795611978,"a":1795612532,"t":"碳酸锂跌幅超六成，车企咋还没过上好日子-36氪","su":"탄산리튬(배터리 재료로 쓰는 리튬 가루)이 60% 이상 떨어졌는데, 자동차 회사들은 왜 잘 살지 못하는 걸까? 현재 탄산리튬 가격은 계속해서 하락세를 보이고 있다. 동력 배터리의 핵심 원자재(물건의 재료(석유·구리 등))인 탄산리튬 가격은 전체 신에너지 자동차 산업 체인의 민감한 신경에 영향을 미칩니다. 최근 10만 위안/톤, 9만 위안/톤이라는 두 가지 중요한 bp이 잇달아 사라지며 비관론이 확산됐다. 불과 반년 만에 탄산리튬 가격이 약 60% 하락한 셈이다. 이에 자동차 회사들은 탄산리튬이 주는 배당금을 제대로 거두지 못한 것 같지만, 기대와는 많이 다른 그들의 삶은 더욱 어려워지고 있다. 산업체인의 이익 재편으로 인해 자동차 회사는 왜 그렇게 어려운가? 수요가 미리 초과되어 공급이 계속 증가합니다. 신에너지 차량이 대다수가 되었습니다."},{"s":"리튬 배터리 수출은 첫 10개월 동안 137% 급증했으며, 창저우의 아프리카 무역은 30% 증가했습니다.","so":"中国新闻网","tm":"11/25 18:50","c":1,"r":"cn","u":"https://www.chinanews.com.cn/cj/2026/11-25/10737655.shtml","p":1795600233,"a":1795612533,"t":"前十月锂电池出口大增137% 常州对非洲贸易增三成","su":"리튬 배터리 수출은 첫 10개월 동안 137% 증가했으며, 창저우의 아프리카와의 무역은 30% 증가했습니다. 중국신보사, 창저우, 11월 25일(탕환 기자) 25일 창저우 세관 통계에 따르면 2026년 10월까지 창저우의 대외 무역 수출입 총액은 3325억6000만 위안으로 전년 대비(작년 같은 때와 비교해서) 8.9% 증가해 규모와 성장률 측면에서 장쑤성에서 5위를 차지했다. 그 중 리튬전지 수출액은 93억9000만 위안으로 동기 대비 137.2% 증가했다. 아프리카 수출입액은 146억 2천만 위안으로 동기 대비 30.8% 증가했습니다. 신에너지 제품의 수출과 신흥 시장의 발전은 창저우 대외 무역의 가장 두드러진 성장 포인트가 되었습니다. 4분기에 들어서면서 창저우의 대외 무역은 크게 가속화되었습니다. 10월 월 수출입액은 371억7000만 위안으로 전년 동기 대비 34.5% 증가했다. 대외무역 규모는 1분기 이후 분기별로 증가했다. 구조적으로 일반무역 수출입액은 2,807.5억 위안으로 대외무역 총액의 84.4%를 차지하며 지배적 지위는 안정적이었다. 가공무역 수출입액은 425억 위안으로 동기 대비 21.6% 증가했고 그 비중은 전년 동기 대비 1.3% 증가했다. 가공무역 비중의 반등은 국내 기업의 국제 수주(일감 주문을 받는 것) 능력이 지속적으로 향상되고 있음을 반영한다."},{"s":"CATL 주가 급락, 기관에서는 리튬 배터리 이익 및 생산 일정 기대가 압박을 받고 있다고 말합니다.","so":"第一财经","tm":"11/25 18:32","c":1,"r":"cn","u":"https://www.yicai.com/news/103454142.html","p":1795599178,"a":1795608190,"t":"宁德时代股价大跌，机构称锂电盈利、排产预期承压","su":"11월 25일, CATLA 주가는 8.33% 하락한 208.42위안으로 마감했으며, 총 시가총액(회사 전체 몸값)은 약 9,644억 위안으로 1조 위안 아래로 떨어졌습니다. 이는 2025년 4월 14일 이후 최저치이며 올해 5월 초 최고 수준에서 거의 55% 되돌린 수치입니다. H주는 12.23% 하락한 HK$295.6에 마감했으며, 올해 6월 초 고점 대비 누적 하락폭은 약 62%다. 같은 날 플러시배터리 업종지수(881281)도 6.12% 하락하며 큰 폭 하락했다. CATL과 리튬 배터리 업계를 둘러싼 여러 소식도 기관들이 배터리 재고 이익 전망을 낮추고, 11월 생산 일정을 낮추고, 탄산리튬(배터리 재료로 쓰는 리튬 가루) 선물 가격이 급락하는 등 시장의 주목을 받고 있다."},{"s":"논평: CATL에서 사업을 다각화하는 EV 제조사에게 낮은 가격이 항상 더 낮은 비용은 아닙니다.","so":"Caixin Global","tm":"11/25 17:57","c":1,"r":"us","u":"https://www.caixinglobal.com/2026-11-25/commentary-for-ev-makers-diversifying-from-catl-a-lower-price-isnt-always-a-lower-cost-102508665.html","p":1795597020,"a":1795608187,"t":"Commentary: For EV-Makers Diversifying From CATL, a Lower Price Isn’t Always a Lower Cost","su":"배터리는 자동차 재료비의 30% 이상을 차지하기 때문에 자동차 제조사에게는 더 저렴한 셀이 중요합니다. 그러나 보증 비용, 리콜 및 브랜드 손상은 절감액이 적립된 지 몇 년 후에 발생할 수 있습니다."},{"s":"<시간외 홍콩 증시> 항셍지수는 1.14% 하락하며 22,000선을 무너뜨렸다. 칩·리튬배터리 주가 급락","so":"鉅亨網","tm":"11/25 17:32","c":1,"r":"tw","u":"https://news.cnyes.com/news/id/6671683","p":1795595556,"a":1795608192,"t":"〈港股盤後〉恒指跌1.14% 失守22000點關口 晶片與鋰電池股重挫","su":"<시간외(정규 시간이 끝난 뒤 하는 거래) 홍콩 증시> 항셍지수는 1.14% 하락하며 2만2000선을 하회했다. 칩과 리튬 배터리 주가가 급락했다. 거형망(Anue) 뉴스센터 홍콩 주요 주가지수는 수요일(25일) 종합적으로 마감했고 항셍지수는 '7연속 하락'을 기록했습니다. 항셍지수는 장 초반 33포인트 상승한 뒤 288포인트나 오른 22,507포인트를 기록했다. 오후에는 하락세로 돌아서 22,000포인트 아래로 하락해
