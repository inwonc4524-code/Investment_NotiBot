<style>

:root{color-scheme:dark;--bg:#262624;--card:#30302e;--card2:#3a3a37;--text:#faf9f5;--sub:#a6a39a;--line:#3e3e3a;--acc:#d97757;--red:#ef4444}

.wrap{max-width:760px;margin:auto}
header{padding:20px 16px 8px}

.upd{color:var(--sub);font-size:12.5px}
/* 테마 탭 */
.tabs{position:sticky;top:0;z-index:3;background:rgba(38,38,36,.96);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.tabrow{display:flex;gap:8px;overflow-x:auto;padding:12px 16px 10px;scrollbar-width:none}.tabrow::-webkit-scrollbar{display:none}
.tab{position:relative;flex:none;padding:9px 15px;border-radius:12px;border:1px solid var(--line);background:var(--card);
  color:var(--sub);font:inherit;font-size:14px;cursor:pointer}
.tab b{margin-left:5px;color:var(--sub);font-weight:400;font-size:12px}
.tab.on{background:var(--acc);border-color:var(--acc);color:#1f1e1d;font-weight:600}.tab.on b{color:#1f1e1d}
.dot{position:absolute;top:-3px;right:-3px;width:11px;height:11px;border-radius:50%;background:var(--red);border:2px solid var(--bg)}
/* 정렬·국가 */
.ctrl{display:flex;gap:6px;overflow-x:auto;padding:0 16px 10px;scrollbar-width:none}.ctrl::-webkit-scrollbar{display:none}
.ctrl button{flex:none;border:1px solid var(--line);background:transparent;color:var(--sub);border-radius:8px;padding:5px 11px;font:inherit;font-size:12.5px}
.ctrl button.on{background:var(--card2);border-color:var(--card2);color:var(--text)}
.ctrl .sep{flex:none;width:1px;background:var(--line);margin:2px 4px}
main{padding:6px 12px 48px}

.note{margin:0 4px 10px;color:var(--sub);font-size:12px}
.none{color:var(--sub);margin:24px 4px;text-align:center}
.card{display:block;background:var(--card);border-radius:12px;padding:12px 14px;margin:8px 0;color:var(--text);text-decoration:none;transition:background .15s}
.card:hover{background:var(--card2)}.card:active{opacity:.75}
.meta{color:var(--sub);font-size:12px}
.title{font-weight:500;margin-top:3px}
.orig{color:var(--sub);font-size:12px;margin-top:3px}
.new{margin-left:4px;color:var(--red);font-size:11px;font-weight:700;letter-spacing:.3px}
.hot{display:inline-block;margin-right:6px;padding:0 6px;border-radius:4px;background:rgba(217,119,87,.16);color:var(--acc);font-weight:600}
.hot.big{background:var(--acc);color:#1f1e1d}
.newbar{display:block;width:100%;margin:2px 0 6px;padding:9px;border:0;border-radius:10px;background:rgba(239,68,68,.14);color:#fca5a5;font:inherit;font-size:13px;text-align:left}
.more{display:block;width:100%;margin:4px 0 0;padding:10px;border:1px dashed var(--line);border-radius:12px;background:transparent;color:var(--sub);font:inherit;font-size:13px}
footer{margin:36px 4px 0;padding-top:14px;border-top:1px solid var(--line);color:var(--sub);font-size:12px;line-height:1.7}
footer b{color:var(--text);font-weight:600}
/* 요약 창 */
#dim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:5}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:6;max-width:760px;margin:auto;max-height:82vh;overflow-y:auto;
  background:var(--card);border-radius:16px 16px 0 0;padding:10px 18px calc(18px + env(safe-area-inset-bottom));box-shadow:0 -8px 30px rgba(0,0,0,.4)}
.grab{width:38px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 12px}
.s-title{font-size:17px;font-weight:600;margin:4px 0 2px;line-height:1.45}
.s-label{margin:16px 0 4px;color:var(--acc);font-size:12px;font-weight:700;letter-spacing:.5px}
.s-sum{font-size:15px;line-height:1.75}.s-sum.empty{color:var(--sub);font-size:13.5px}
.s-btns{display:flex;gap:8px;margin-top:20px}
.s-btns a{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;padding:11px 6px;border-radius:10px;font:inherit;font-size:13.5px;line-height:1.3;text-decoration:none;
  background:var(--acc);color:#1f1e1d;font-weight:600}
.s-btns a.cl{background:transparent;border:1px solid var(--acc);color:var(--acc)}
.s-close button{width:100%;margin-top:8px;padding:11px;border-radius:10px;background:transparent;border:1px solid var(--line);color:var(--sub);font:inherit;font-size:14px}
.s-cnote{margin-top:8px;color:var(--sub);font-size:11.5px;text-align:center}
#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);z-index:9;max-width:90%;padding:10px 16px;border-radius:10px;background:#faf9f5;color:#1f1e1d;font-size:13.5px;box-shadow:0 6px 20px rgba(0,0,0,.4)}
.seg{display:flex;gap:4px;margin:6px 4px 10px}.seg button{flex:1;min-width:0;border:1px solid var(--line);background:transparent;color:var(--sub);border-radius:8px;padding:7px 0;font:inherit;font-size:12.5px;white-space:nowrap}
.seg.ly{margin-top:-4px}.seg.ly button{padding:5px 0;font-size:12px}.seg.ly button.on{background:var(--card2);border-color:var(--acc);color:var(--text);font-weight:600}
.seg.sm{margin-bottom:8px}.seg.sm button{padding:9px 0;font-size:13px}.seg.sm button.on{background:var(--card2);border-color:var(--acc);color:var(--text)}
.notes{margin:0 4px 10px}.helpl{margin:4px 0 0;padding:8px 10px 8px 26px;border-radius:8px;background:var(--card2);font-size:12.5px;line-height:1.6;color:var(--text)}.helpl li{margin:2px 0}.notes summary{cursor:pointer;font-size:13px;color:var(--sub);padding:6px 10px;border-radius:8px;background:rgba(250,204,21,.08);list-style:none}.notes summary::-webkit-details-marker{display:none}.notes summary:before{content:"▸ ";}.notes[open] summary:before{content:"▾ ";}.notes[open] summary{margin-bottom:6px}.notes .warn{margin:0 0 6px}.warn{margin:0 4px 10px;padding:8px 10px;border-radius:8px;background:rgba(250,204,21,.08);color:var(--sub);font-size:12.5px;line-height:1.5}.warn b{color:var(--text)}
.seg button.on{background:var(--acc);border-color:var(--acc);color:#1f1e1d;font-weight:600}
.tot{margin:2px 4px 10px;color:var(--sub);font-size:13px}.tot b{color:var(--text)}.chgnote{font-size:11px}
.srow{background:var(--card);border-radius:12px;margin:6px 0;padding:10px 12px;cursor:pointer}.srow.open{background:var(--card2)}
.sline{display:flex;align-items:center;gap:8px}
.rk{width:18px;color:var(--sub);font-size:12px;text-align:right;flex:none}
.mv .gap{display:inline-block;width:3px}.mv{width:30px;flex:none;font-size:11px;font-weight:600;text-align:left;font-variant-numeric:tabular-nums;margin-right:-4px}.mv.up{color:#f87171}.mv.dn{color:#60a5fa}.mv.same{color:#a8a29e;font-size:15px;font-weight:700;line-height:1;padding-left:3px}

.sc{width:54px;flex:none;text-align:right;font-size:14px;font-variant-numeric:tabular-nums}

.chg{width:48px;flex:none;text-align:right;font-size:11.5px;color:var(--sub)}.chg.up{color:#f87171}.chg.dn{color:#60a5fa}
.spark{flex:none}
.det{margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.dt{color:var(--sub);font-size:12px;margin:6px 0 4px}
.bars{width:100%;height:auto;display:block}.bars .ax{fill:var(--sub);font-size:10px}.bars .bar:hover rect+rect{opacity:.8}
.crow{display:flex;align-items:center;gap:8px;margin:3px 0;font-size:12.5px}.cl{width:86px;flex:none}.cb{flex:1;height:8px;background:rgba(255,255,255,.05);border-radius:4px;overflow:hidden}
.cb i{display:block;height:100%;background:var(--acc);opacity:.8;border-radius:0 3px 3px 0}.cn{width:50px;text-align:right;flex:none;font-variant-numeric:tabular-nums}
@media(max-width:400px){.spark{display:none}.sn{width:74px}}

닥지수는 1.42% 하락했으며 S&P500(미국 큰 회사 500곳의 주가를 합쳐 만든 점수) 지수는 0.72% 하락했다. 엔비디아는 거의 6% 하락했고, 시가총액(회사 전체 몸값)은 거의 2,500억 달러 증발했습니다. 전 거래일에 주가는 30% 이상 올랐고, 시가총액은 1조 달러 이상 증가했다. Strategy Asset Managers의 CEO인 Tom Herlick은 황이 \"지금 당장\" 엔비디아를 이끌 적임자일 수 있다고 말했습니다. 하지만 회사는 거버넌스 측면에서 여전히 “걱정할 부분이 많다”고 말했다."},{"s":"국제 금, 은, 유가가 종합적으로 하락했고, 미국 광통신과 칩 주가도 개장 전에 하락했습니다.","so":"21财经","tm":"11/24 19:45","c":9,"r":"cn","u":"https://www.21jingji.com/article/20261124/herald/d2720c0669bae183318f95881bcc7f35.html","p":1795517100,"a":1795521486,"t":"国际金银油价集体下跌，美股光通信、芯片股盘前下挫","su":"미국 증시가 개장하기 전인 11월 24일, 3대 주가지수선물이 종합적으로 하락했다. 베이징 시간 17시 3분 현재 다우 선물은 0.08%, 나스닥 선물은 1.02%, S&P500(미국 큰 회사 500곳의 주가를 합쳐 만든 점수) 선물은 0.38% 하락했습니다. 시장 개장 전 엔비디아가 4% 이상 하락하고, 테슬라, 메타, 구글이 소폭 하락하고, 마이크로소프트, 애플, 아마존이 소폭 상승하는 등 대형 기술주들이 엇갈리는 모습을 보였습니다. 광통신주는 시장 개장 전 집단 하락했다. 루멘텀, 마벨 Technology, Coherent, Applied Optoelectronics는 4% 이상 하락했으며 Corning은 거의 3% 하락했습니다. AMD, ARM, 샌디스크, 웨스턴디지털 등이 3% 이상 하락했고, 인텔과 SK하이닉스도 4% 이상 하락하는 등 시장 개장 전 반도체(전자기기 속에서 계산하고 기억하는 작은 부품)주가 하락했다. 국제 금, 은, 석유 가격이 전체적으로 하락했습니다. 보도 시간 현재 WTI 원유는 0.99%, 브렌트유는 0.74% 하락했습니다. 현물 금은 0.44% 하락했고, 현물 은은 2% 이상 하락했습니다."},{"s":"미국 증시가 강하게 반등했습니다! 젠슨 황의 복귀로 AI 시장 점화, 월스트리트의 뜨거운 논의 바닥이 나타났습니까?","so":"鉅亨網","tm":"11/24 12:00","c":7,"r":"tw","u":"https://news.cnyes.com/news/id/6670636","p":1795489227,"a":1795490266,"t":"美股強彈！黃仁勳回歸點燃AI行情 華爾街熱議底部已浮現？","su":"엔비디아는 젠슨 황을 CEO로 복귀시켰다고 발표했으며, 이로 인해 월요일 미국 증시가 급등했습니다. S&P500(미국 큰 회사 500곳의 주가를 합쳐 만든 점수)은 4.73%, 나스닥은 6.51%, 다우존스는 3.01% 상승했습니다.\n이번 '패닉 안도 반등' 물결 이전에는 3개 주요 지수가 이미 지난 금요일 조정 범위에 진입했고, S&P500 지수는 11월 12일 이후 9% 이상 하락했습니다.\n전략가들은 서로 다른 견해를 가지고 있습니다. 일부는 AI 투자와 시장 바닥이 형성되었다고 믿습니다. 다른 사람들은 자본 지출(공장·장비 등에 쓰는 큰돈) 및 데이터 센터 승인과 같은 해결되지 않은 문제에 대해 우려하고 있습니다."},{"s":"JP모간, 2027년 S&P500 목표치 8200 제시…시장 전망 밑돌아","so":"뉴스핌","tm":"11/25 10:23","c":5,"r":"kr","u":"https://www.newspim.com/news/view/20261125000410","p":1795569780,"a":1795574585,"su":"[시드니=뉴스핌] 권지언 특파원 = JP모간이 인공지능(AI) 수요에 힘입어 미국 증시가 2027년 말까지 상승세를 이어갈 것으로 전망하면서도, S&P50 번주 투자자들 기다려…"},{"s":"미국 반도체 주가 더 많이 하락: AMD는 9% 이상 하락, 마이크론은 거의 9% 하락","so":"Jiemian.com","tm":"11/24 23:43","c":2,"r":"cn","u":"https://www.jiemian.com/article/15369775.html","p":1795531427,"a":1795560759,"t":"美股半导体股跌幅扩大：AMD跌逾9%，美光跌近9%","su":"미국 반도체 업종은 필라델피아 반도체 지수가 6.17% 하락한 8996.18포인트를 기록하는 등 급락했다. 개별 종목별로 보면 AMD 9.55% 하락, 샌디스크 8.93% 하락, 마이크론 테크놀로지 8.75% 하락, 루멘텀 7.23% 하락, SK하이닉스 6.61% 하락, 코히런트 6.46% 하락, 어플라이드 머티리얼즈 6.24% 하락, 마벨 테크놀로지 6.23%, 램그룹 6.18% 하락, 엔비디아 6.02% 하락, 인텔은 5.80%, 브로드컴은 4.35%, TSMC는 3.47% 하락했다. 3배 롱 반도체 ETF(SOXL)는 18.97% 하락했다. 미국 반도체주 하락세가 확대됐다. AMD는 9% 이상 하락했고, 마이크론은 9% 가까이 하락했다. 원본 뉴스 출처: Jiemian News AMD 4.9k - Philadelphia Semiconductor Index는 한때 9% 이상 하락했습니다. - 주문이 지원을 위해 자금 조달(사업에 쓸 돈을 모으는 것)에 의존합니까? 엔비디아 이후 AMD도 공매도(주식을 빌려서 먼저 파는 것)를 당해 주가가 거의 8% 하락했습니다."},{"s":"미국 주식 조기 거래/엔비디아 카니발 썰물, 필라델피아 반도체 지수는 전날 상승폭의 거의 절반을 포기했고, VIX 지수는 한때 21% 급등 | 미국 증시 동향 | 국제","so":"經濟日報","tm":"11/24 23:42","c":2,"r":"tw","u":"https://money.udn.com/money/story/123398/9899680?from=edn_newest_index","p":1795531323,"a":1795560775,"t":"美股早盤／輝達狂歡退潮 費半回吐前日近半漲幅 VIX 指數一度飆升21% | 美股動態 | 國際","su":"미국 증시는 24일 오전 거래에서 하락세로 출발했다. 전날 젠슨 황의 엔비디아 복귀 격려에 힘입은 카니발 분위기는 사라졌습니다. 하루의 소화 끝에 시장은 점차 AI 투자가 계속해서 반등(내렸다가 다시 오르는 것)할 수 있을지 의심하기 시작했습니다. 또 블룸버그통신 등 미국 언론들은 미국이 이르면 이번 주부터 중국 본토와 유럽연합(EU) 등 12개국 이상에 대한 관세(수입품에 붙이는 세금)를 인상해 23일 인상폭이 일부 철회될 것이라고 보도했다."},{"s":"젠슨 황이 드라마틱하게 컴백했습니다! 엔비디아가 상승세를 주도한 후 칩 주가가 식은 후 미국 주식 선물이 하락 | 글로벌 금융 | 글로벌","so":"UDN","tm":"11/24 22:37","c":2,"r":"tw","u":"https://udn.com/news/story/6811/9899558?from=udn-ch1_breaknews-1-0-news","p":1795527465,"a":1795530460,"t":"黃仁勳戲劇性回鍋！輝達領漲後晶片股降溫美股期貨走跌| 全球財經| 全球","su":"엔비디아가 미국 주식을 놀라운 상승세로 이끈 후 오늘 반도체(전자기기 속에서 계산하고 기억하는 작은 부품)주가 냉각되어 미국 주식 선물이 하락했습니다. 한편, 투자자들은 연방 정부가 발표한 인플레이션(물건값이 계속 오르는 것) 데이터를 이번 주 말에 기다리고 있었습니다."},{"s":"S&P500 주식 시장 지수는 지난 금요일 조정 국면에 진입했습니다. 다음에 일어날 수 있는 일은 다음과 같습니다.","so":"The Globe and Mail","tm":"11/24 22:37","c":2,"r":"us","u":"https://www.theglobeandmail.com/investing/markets/markets-news :"미국 증시가 급등하고 있는데 조심해야 할까요? 과거 데이터에 따르면 하락장에서는 일일 급등이 흔합니다 | 글로벌 금융 | 글로벌","so":"UDN","tm":"11/24 15:45","c":2,"r":"tw","u":"https://udn.com/news/story/6811/9898769","p":1795502755,"a":1795503009,"t":"美股暴漲反而要小心？歷史數據顯示：單日大漲常見於熊市| 全球財經| 全球","su":"미국 증시가 급등하고 있는데 조심해야 할까요? 과거 데이터에 따르면 하락장에서는 하루에 큰 상승폭을 보이는 것이 일반적입니다. 미국 증시는 월요일에 급격히 반등했고 많은 강세론자들은 조정이 끝났다고 생각했습니다. 그러나 역사적 데이터에 따르면 주식 시장의 하루 급등은 약세장(주가가 오랫동안 내리는 시기)의 전형적인 특징입니다. 금융 칼럼니스트인 마크 헐버트(Mark Hulbert)는 1971년 나스닥 종합지수가 출시된 이래로 나스닥 종합지수의 성과를 조사한 결과 하루 7% 이상 증가한 거래일의 76.5%가 약세장에서 발생했다는 사실을 발견했습니다. 일일 5% 이상의 상승 중 66%는 약세장에서 발생했습니다. 약세장은 전체 거래일의 24%만을 차지합니다. 그는 S&P500(미국 큰 회사 500곳의 주가를 합쳐 만든 점수)도 비슷한 패턴을 보였다고 지적했다. 이는 투자심리와 관련이 있다. 약세장은 종종 \"희망의 경사면\"으로 미끄러집니다. 투자자들은 하락세가 끝나길 바라며 주식이 상승하면 서둘러 매수에 나서며, 이는 결국 일일 상승률을 높입니다."},{"s":"가전업체 샤크닌자가 신제품으로 S&P500에 합류한다.","so":"工商時報","tm":"11/24 13:04","c":2,"r":"tw","u":"https://www.ctee.com.tw/news/20261124701162-430702","p":1795493040,"a":1795499008,"t":"家電製造商SharkNinja產品夯 將加入標普500指數","su":"닌자 크리미(Ninja Creami) 아이스크림 기계 등 인기 제품을 생산하는 미국 소형가전 브랜드 그룹 샤크닌자(SN.US)가 12월 2일 발효 예정인 S&P500(미국 큰 회사 500곳의 주가를 합쳐 만든 점수) 지수에 신규 편입된다. S&P 다우존스 지수는 종합 외신들에 따르면 샤크닌자가 인수될 유틸리티 및 전력 생산업체인 AES를 대신해 12월 2일 S&P500 지수에 편입될 예정이라고 23일 밝혔다. 이번 종목 선정..."},{"s":"\"미국 주식\" 분석: AI 리더 복귀, 시장 환호 젠슨 황 2.0 데뷔","so":"旺得富理財網","tm":"11/24 11:51","c":2,"r":"tw","u":"https://wantrich.chinatimes.com/news/20261124900152-420201","p":1795488692,"a":1795499010,"t":"《美股》分析：AI教主回歸、市場歡呼 黃仁勳2.0登場","su":"[타임즈 장차오친(Zhang Chaoqin) 및 종합 외신보도 편집] 미국 주식 분석: ● 엔비디아 이사회는 월요일 개장 전 젠슨 황을 CEO 및 기타 직책에 재임명해 미국 4대 주가지수가 전반적으로 상승세를 보였으며 필라델피아 반도체 지수는 14% 상승했다. 엔비디아는 31.5% 상승했고, 주가는 매각 전 수준으로 회복되었으며, 시가총액(회사 전체 몸값)은 거의 1조 달러 증가했습니다. 미국 주식공포지수(사람들이 주식시장을 얼마나 겁내는지 보여 주는 숫자)는 35.89에서 26.62로 25.8% 하락했다. ..."},{"s":"모건스탠리는 펀더멘털이 안정적이고 하락세로 인해 우수한 매수 포인트를 얻게 되면서 미국 주식에 대해 낙관적입니다 - 뉴스 내용 - 펀드","so":"MoneyDJ","tm":"11/24 11:45","c":2,"r":"tw","u":"https://www.moneydj.com/funddj/ya/yp050000.djhtm?a={5856CC65-C2CB-467E-816F-8255F5E9CCD9}","p":1795488300,"a":1795490267,"t":"大摩看多美股 基本面穩、回檔帶來絕佳買點-新聞內容-基金","su":"모건스탠리는 펀더멘털이 안정적이고 하락세가 탁월한 매수 포인트를 제공하기 때문에 미국 주식에 대해 낙관적입니다. 모건스탠리의 미국 주식 전략가 마이크 윌슨이 이끄는 팀은 지난주 매도세(팔려는 힘)로 인해 S&P500(미국 큰 회사 500곳의 주가를 합쳐 만든 점수)지수와 다우존스 산업평균지수가 20일 조정 범위에 빠졌지만 기업 펀더멘털은 악화되지 않았다고 지적했다. 지난 주의 급격한 하락은 향후 반등의 토대를 마련했습니다. 윌슨 팀"},{"s":"\"미국 주식\" 뉴스: 젠슨 황의 번개 같은 복귀: 트럼프는 세간의 이목을 끄는 방식으로 신용을 주장하고 양당의 미국 국회의원들은 그를 공격합니다 - 국제","so":"旺得富理財網","tm":"11/24 11:07","c":2,"r":"tw","u":"https://wantrich.chinatimes.com/news/20261124900133-420201","p":1795486054,"a":1795490261,"t":"《美股》消息面：黃仁勳閃電回歸：川普高調邀功、美兩黨議員砲轟- 國際","su":"[타임스컴파일러 류지강 종합외신보도] 뉴스: ●트럼프 미국 대통령은 23일 엔비디아의 CEO(회사의 가장 높은 책임자)로 젠슨 황의 복귀를 직접 개입해 촉진했다고 밝혔다. 트럼프 대통령은 미국 금융매체 CNBC에 엔비디아 이사회가 마음을 바꾸고 젠슨 황을 군대에 복귀시키기로 결정하기 전에 이들과 소통했다고 밝혔습니다. 그래서 트럼프는 엔비디아 이사들을 설득해서 이번 거래를 스스로 성사시켰다고 하는데..."},{"s":"'미국 주식 스캔' 젠슨 황 복귀, 필라델피아 반도체 지수 14% 급등, 한국 증시 프로그램 거래 중단 지점까지 급등 - 증권","so":"工商時報","tm":"11/24 10:02","c":2,"r":"tw","u":"https://www.ctee.com.tw/news/20261124700747-430201","p":1795482120,"a":1795490264,"t":"《美股掃瞄》黃仁勳回歸費半暴漲14% 韓股飆到暫停程式交易- 證券","su":"[Ke Wanxiu 및 종합 외국 보도 편집] 젠슨 황은 엔비디아의 CEO로 복귀했습니다. 월요일(11월 23일) 미국 주요 4대 주가지수가 급등했습니다. S&P500(미국 큰 회사 500곳의 주가를 합쳐 만든 점수) 지수와 나스닥 지수는 트럼프 대통령이 2025년 4월 '해방절' 관세를 중단한다고 발표한 이후 하루 최대 상승폭을 달성했습니다. 필라델피아 반도체(전자기기 속에서 계산하고 기억하는 작은 부품) 지수는 14% 급등했습니다. 엔비디아 테마주, AI 관련주, 반도체주 등이 축하 행사를 벌였다. 대만지수선물은 야간거래에서 3,170포인트(8.65%) 급등해 398에 마감했습니다."},{"s":"월스트리트는 S&P500의 7일 하락 이후 급등세를 보였습니다.","so":"Yahoo Finance","tm":"11/24 01:30","c":2,"r":"us","u":"https://finance.yahoo.com/markets/stocks/articles/wall-street-opens-sharply-higher-163000554.html","p":1795451400,"a":1795490247,"t":"Wall Street Opens Sharply Higher After the S&P 500's Seven-Day Slide","su":"Oil Market Daily News Commentary - 월스트리트는 훨씬 더 밝은 분위기로 추수감사절 주간을 시작했습니다. 월요일 미국 주요 3대 주가지수 모두 급등세를 기록했다."},{"s":"미국 증시는 \"역대 가장 추악한 크리스마스\"를 맞이하게 될까요? JP모건은 10대 위험에 대해 경고합니다. 주식 시장은 연준이 고개를 숙일 정도로 하락할 수 있습니다.","so":"工商時報","tm":"11/25 11:07","c":1,"r":"tw","u":"https://w :"11월 25일, 대체로 흐리고 몇 차례 소나기가 내림. 아침 저녁으로 시원함. 시장은 엔비디아 창립자인 젠슨 황의 복귀 소식을 소화하고 미국 무역전쟁과 관세에 대한 우려를 다시 불러일으켰습니다. 다우지수는 화요일 개별 상승세(오르는 흐름)를 유지했지만 S&P500(미국 큰 회사 500곳의 주가를 합쳐 만든 점수)과 나스닥은 후퇴했습니다. 다우지수는 423포인트(0.85%) 오른 50,018에 마감했고, S&P500은 35포인트(0.5%) 하락한 7,201에 마감했고, 나스닥은 356포인트(1.48%) 하락한 23,733에, 나스닥 100 지수는 531포인트(1.99%) 하락했습니다. 2,6214. 인공지능(AI) 거대 A씨가 출시 4일째를 맞았다."},{"s":"미국 소비자주가 전반적으로 상승했고, 나이키는 5.89% 상승 | 미국 주식 마감 리뷰","so":"经济观察网","tm":"11/25 10:07","c":1,"r":"cn","u":"http://www.eeo.com.cn/2026/1125/1101670.shtml","p":1795568820,"a":1795574589,"t":"美股消费板块全线上涨，耐克涨5.89%丨美股复盘","su":"동부 표준시 기준 11월 24일에는 소비자 소매 부문이 상승했습니다. 나이키는 약 6% 상승했고, 코카콜라와 월마트는 약 2% 상승했습니다. 이날 AI 하드웨어 업종은 약세를 보이며 필라델피아 반도체(전자기기 속에서 계산하고 기억하는 작은 부품) 지수는 8% 가까이 하락했다. 다우존스산업평균지수는 암젠, 나이키, 세일즈포스 등 구성종목의 상승으로 상승세(오르는 흐름)를 보였다. 11월 24일 마감 기준, Nike는 5.89% 상승한 $35.75로 마감했습니다. 월마트는 2.11% 상승한 $132.31로 마감했습니다. 코스트코는 2.23% 오른 $1,091.71에 마감했습니다. Home Depot은 2.20% 오른 $353.69에 마감되었습니다. 코카콜라는 1.81% 상승한 $97.62로 마감했습니다. Pepsi-Cola 1.76% 상승한 $142.68로 마감했습니다. Procter & Gamble은 1.69% 오른 $172.47에 마감했습니다. 맥도날드는 1.56% 상승한 $280.7로 마감했습니다. Adobe는 3.62% 오른 $232.08에 마감했습니다. 넷플릭스는 1.33% 오른 $58.87에 마감했습니다. 스타벅스는 0.02% 상승한 $106.38에 마감했습니다."},{"s":"삼성전자 SK하이닉스 주가 장중 6%대 내려, 미국 증시 하락에 반도체주 약세","so":"비즈니스포스트","tm":"11/25 10:05","c":1,"r":"kr","u":"https://www.businesspost.co.kr/BP?command=article_view&num=452863","p":1795568745,"a":1795574585},{"s":"젠슨 황의 리포 마켓은 하루 동안만 진행됩니다! 엔비디아는 거의 5.9% 급락했고, AI 주식은 또 다른 피바다를 겪었고, 월스트리트는 3개의 주요 불발탄이 해체되지 않았다고 경고했습니다.","so":"工商時報","tm":"11/25 09:59","c":1,"r":"tw","u":"https://www.ctee.com.tw/news/20261125700564-430702","p":1795568340,"a":1795574605,"t":"黃仁勳回鍋行情僅一天！輝達重挫近5.9％、AI股再遭血洗華爾街警告三大未爆彈全沒拆- 國際","su":"젠슨 황의 팟 복귀가 정말로 AI 주식 시장의 붕괴를 막을 수 있을까요? 시장은 재빨리 답을 내놓았습니다. 유감스럽게도 그렇게 간단하지는 않습니다! 젠슨 황이 엔비디아의 CEO(회사의 가장 높은 책임자)로 복귀하여 미국 기술주에 대한 본격적인 카니발을 이끌었습니다. 엔비디아 주가는 하루 만에 31.5% 급등했고, 필라델피아 반도체(전자기기 속에서 계산하고 기억하는 작은 부품) 지수도 약 14% 급등했다. 예상외로 이 축하 행사는 단 하루만 지속되었고, AI 테마 주식은 다음날 다시 매도되었습니다. 엔비디아는 5.9% 가까이 하락했고, 마이크론과 샌디스크는 10% 이상 하락해 투자자들이 점차 그 사실을 깨닫고 있음을 보여줍니다."},{"s":"순자산은 261억 달러로 13억 달러만 남았습니다! '월스트리트의 늑대왕' 부채 부담 44억 달러, 내년 위기로 이어질 수도","so":"自由財經","tm":"11/25 09:54","c":1,"r":"tw","u":"https://ec.ltn.com.tw/article/breakingnews/5652380","p":1795568092,"a":1795574606,"t":"261億美元身價慘剩13億美元！「華爾街狼王」44億美元債務壓頂 明年恐爆危機","su":"[금융채널/종합리포트] 한때 월스트리트를 석권하며 순자산 261억 달러(약 NT$8594억7300억), '월스트리트의 늑대왕'을 보유했던 행동주의 투자자 칼 아이칸이 지금 그의 경력 중 가장 혹독한 재정 위기에 직면해 있다. 자회사 투자 제국 부채(갚아야 할 빚)"},{"s":"AI 우려 재점화+관세전쟁 임박, 미국 증시 반등했다가 무너질까? 3분기 매출과 이익이 모두 감소했습니다. 샤오미의 실적이 갈릴까?","so":"香港經濟日報HKET","tm":"11/25 09:49","c":1,"r":"hk","u":"https://inews.hket.com/article/4230509/AI%E7%96%91%E6%85%AE%E9%87%8D%E7%87%83-%E9%97%9C%E7%A8%85%E6%88%B0%E6%AE%BA%E5%88%B0%E3%80%80%E7%BE%8E%E8%82%A1%E5%BD%88%E5%AE%8C%E5%8F%88%E6%95%A3%EF%BC%9FQ3%E7%87%9F%E6%94%B6%E5%8F%8A%E7%8D%B2%E5%88%A9%E9%9B%99%E6%B8%9B%E3%80%80%E5%B0%8F%E7%B1%B3%E6%A5%AD%E7%B8%BE%E9%BB%9E%E6%8B%86%EF%BC%9F","p":1795567792,"a":1795574613,"t":"AI疑慮重燃+關稅戰殺到 美股彈完又散？Q3營收及獲利雙減 小米業績點拆？"},{"s":"미국 증시는 의료 및 건강 부동산과 레스토랑 체인 부문에서 좋은 성과를 냈습니다. 어떤 A주가 번영의 전달을 공유할 것으로 예상됩니까? | 은행 전체에서 상승세를 지켜보세요","so":"21财经","tm":"11/25 09:36","c":1,"r":"cn","u":"https://www.21jingji.com/article/20261125/herald/da39a8c63a573fa174e2481637eae82c.html","p":1795566960,"a":1795574590,"t":"美股医疗健康不动产与连锁餐饮方向表现亮眼，哪些A股有望共享景气传导？丨隔岸观涨","su":"1. 디스크 익스프레스(Disk Express): 미국 증시는 11월 24일 마감되었습니다. 전체 시장은 \"상승과 하락이 혼합되고 방어 우위가 있는\" 차별화된 패턴을 보였습니다. 세 가지 주요 지수는 서로 다른 성과를 보였습니다. 다우존스 산업평균지수는 0.85% 상승한 50018.70포인트로 마감했습니다. S&P500(미국 큰 회사 500곳의 주가를 합쳐 만든 점수)은 0.50% 하락한 7201.09포인트로 마감했습니다. 나스닥종합지수는 1.48% 하락한 23733.54포인트로 마감했다. 깊은 조정을 거쳐 지난 20일 동안 10.36% 하락했습니다. 기술 부문에 대한 전반적인 압박을 배경으로 자금은 분명히 부동산 및 요식업 소비와 같은 현금 흐름 지원을 통해 방어 쪽으로 이동했습니다. 시장온도계에 따르면 마감 현재 미국 증시는 총 140개 종목이 신고가를 경신했다. 지난 20일 기준 일일 평균 거래액이 1억 달러 미만인 소형주와 초소형주를 제외하고 시가총액(회사 전체 몸값) 기준으로 분류하면 주목할만한 핵심 유동성 목표가 61개다. 그중 단기 자본 흐름의 보다 확실한 방향은 의료 및 건강 부동산, 체인 레스토랑 및 소매 부동산입니다."},{"s":"미국 주식의 AI 하드웨어 부문은 급격히 하락했으며, 엔비디아는 거의 6% 하락했습니다. 내년에는 돼지 가격 변곡점이 올 수도 있습니다 | 사전 시장 정보","so":"21财经","tm":"11/25 09:35","c":1,"r":"cn","u":"https://www.21jingji.com/article/20261125/herald/2e178f9e81041273161f118d2985ba64.html","p":1795566900,"a":1795574592,"t":"美股AI硬件板块大跌，英伟达跌近6%；明年或迎猪价拐点丨盘前情报","su":"A주 재개: 시장은 전체적으로 상승세로 출발하고 하락세로 움직였습니다. Shenzhen Component Index와 ChiNext Index는 마감되었습니다. ChiNext 지수는 한때 4% 이상 상승했습니다. 상하이·선전 증시 거래액은 1조6600억원으로 전 거래일보다 1022억원 늘었다. 시장 전체에서 3,400개 이상의 주식이 하락했습니다. 시중에는 휴머노이드 로봇(사람을 닮은 로봇) 테마가 강하고, AI 숏드라마 컨셉이 반복적으로 활발하며, 반도체(전자기기 속에서 계산하고 기억하는 작은 부품) 장비 분야도 시장에서 활발히 활동하고 있다. 단점으로는 귀금속 개념이 변동 및 조정되고 PCB 개념이 상승했다가 하락했으며 Yihao New Materials, Aohong Electronics, Baoding Technology 등이 전체적으로 하락했습니다. 11월 24일 마감 기준으로 상하이증권거래소지수는 0.27% 상승했고, 선전부품지수는 0.29% 하락했으며, 차이넥스트지수는 0.05% 하락했다."},{"s":"'AI 거품' 우려에도 월가 '낙관론'…\"S&P500 8000 넘는다\"","so":"한국경제","tm":"11/25 09:22","c":1,"r":"kr","u":"https://www.hankyung.com/article/2026112585427","p":1795566177,"a":1795574585,"su":"AI 추천 뉴스 'AI 거품' 우려에도 월가 '낙관론'…\"S&P500(미국 큰 회사 500곳의 주가를 합쳐 만든 점수) 8000 넘는다\" 월가의 투자 전략들은 인공지능(AI) 거래 우려로 최근 격동기를 겪은 미국 증시가 내년 말까지 두 자릿수 상승률을 기록할 것으로 전망했다. 24일(현지시간) 블룸버그통신에 따르면 JP모건은 이날 보고서를 통해 미국 대형주 500개로 구성된 스탠더드앤드푸어스(S&P)500지수의 내년 말 목표치를 8200으로 제시했다."},{"s":"미국 주식 반등을 위한 하루 여행? 젠슨 황의 복귀 썰물 효과와 시장은 더욱 현실적인 테스트에 직면","so":"第一财经","tm":"11/25 09:17","c":1,"r":"cn","u":"https://www.yicai.com/news/103452996.html","p":1795565861,"a":1795574593,"t":"美股反弹一日游？黄仁勋回归效应退潮，市场面临更多现实性考验","su":"화요일 현지 시간으로 미국 증시는 월요일의 격렬한 반등을 연장하지 못했습니다. 나스닥(미국 기술 회사들이 많이 모인 주식시장)이 1.48% 하락하는 등 3대 주가지수가 엇갈렸다. 시장의 성과는 단기적인 열광적인 매수에 찬물을 끼얹었고, 시장 반전은 보다 실질적인 테스트에 직면해야 할 수도 있습니다. 기술적 반등 지난 주의 급격한 하락 이후 많은 시장 참여자들은 주말 논평에서 주가 하락으로 인해 과매도 상태와 긴급 헤징이 발생했다고 썼습니다. 이러한 상황은 일반적으로 최소한 빠른 반등의 물결을 불러일으키며, 일부 지표는 너무 극단적이어서 2025년 4월 관세 패닉 이후 최저치에 가까워졌습니다. 실제로 시장은 이미 상당한 반등을 기대하고 있었습니다. 월요일 개장 전 젠슨 황의 복귀 소식이 전해지기 전에도 S&P500(미국 큰 회사 500곳의 주가를 합쳐 만든 점수) 선물은 2% 이상 상승할 것으로 예상하고 있었습니다."},{"s":"젠슨 황이 팟으로 돌아가는 것은 쓸모가 없나요? 대만 지수선물, 익일 거래에서 1,800포인트 폭락, 미국 증시 폭락의 4가지 이유 밝혀","so":"TVBS新聞","tm":"11/25 09:14","c":1,"r":"tw","u":"https://news.tvbs.com.tw/money/4055681","p":1795565640,"a":1795574607,"t":"黃仁勳回鍋沒用？台指期夜盤崩跌1800點 美股大跌4原因曝","su":"사랑과 국가 안보의 혼란을 겪은 후 젠슨 황이 엔비디아의 CEO(회사의 가장 높은 책임자)로 드라마틱하게 복귀하면서 월요일 엔비디아의 주가가 31% 이상 급등했습니다. 대만 증시는 어제(24일) 기념식을 가졌다. '파워왕' TSMC가 600개 이상의 기업을 상한가(하루에 오를 수 있는 가장 높은 값)로 이끌었다. 어젯밤 대만지수선물은 예상치 못하게 1,842포인트 하락해 38,482포인트에 마감했다. 미국 증시의 영향이다. 투자자들은 오늘(25일) 대만 증시가 급락해 시장이 크게 요동칠 것을 우려하고 있다."},{"s":"짐 크레이머는 수익을 기준으로 6개의 소매 주식을 평가하고 자신이 가장 좋아하는 두 주식을 지정합니다.","so":"CNBC","tm":"11/25 09:04","c":1,"r":"us","u":"https://www.cnbc.com/2026/11/24/jim-cramer-retail-stocks-earnings.html","p":1795565040,"a":1795574587,"t":"Jim Cramer sizes up six retail stocks after earnings — and names his two favorites","su":"짐 크레이머가 화요일 수익 보고 후 상승세(오르는 흐름)를 펼친 6개 소매업체와 그가 가장 좋아하는 두 곳을 소개합니다."},{"s":"\"귀금속/금속\" 연준은 매파적이며 미국 증시는 하락세, 금, 은, 구리는 올 가을 - 뉴스 내용 - Funds","so":"MoneyDJ","tm":"11/25 08:50","c":1,"r":"tw","u":"https://www.moneydj.com/funddj/ya/yp050000.djhtm?a=B910A8FE-26D7-4607-8AC9-475EBBD6B239","p":1795564200,"a":1795565151,"t":"《貴金屬/金屬》Fed偏鷹+美股拉回 金銀銅全挫-新聞內容-基金","su":"\"귀금속/금속\" 연준은 매파적(금리를 올리자는 쪽)이며 미국 증시는 하락했고 금, 은, 구리는 모두 하락했습니다. oneyDJ News 2026-11-25 07:15:24 Guo Yanxi의 발표는 연준 관리들의 매파적 신호와 12월 금리(돈을 빌릴 때 내는 이자 비율) 인상에 대한 기대감 상승의 영향을 받았습니다. 다양한 자산의 광범위한 환매를 촉발한 미국 주식의 약세와 함께 24일 귀금속 및 금속 선물이 모두 하락했습니다."},{"s":"열기 전에 꼭 읽어야 할 내용 | 미국 기술주는 전반적으로 하락했습니다. Fii Industrial은 수백억 달러의 현금 배당 계획을 추가로 발표했습니다.","so":"第一财经","tm":"11/25 08:47","c":1,"r":"cn","u":"https://www.yicai.com/news/103452997.html","p":1795564030,"a":1795574596,"t":"盘前必读丨美股科技股全线下跌；工业富联再推百亿现金分红方案","su":"[재정 달력] 10월 미국 핵심 PCE 가격 지수의 연율 샤오펑 Technology Day 신규 주식 청약: Tianguangshi 실적(회사가 번 돈 성적표) 보고서 발표: 리오토 ►► 중앙 은행 발표: 11월 25일 8000억 위안 규모의 중기 대출 시설(MLF) 운영이 고정 수량, 이자율 입찰 및 다중 가격 낙찰 입찰로 진행되며 기간은 1년입니다. 5000억 위안 규모의 7일 역환매작업은 정액, 금리(돈을 빌릴 때 내는 이자 비율)입찰, 다중낙찰방식으로 진행된다. ►►공업정보화부는 상하이에서 6G 혁신개발부-지방 협력 파일럿을 공식적으로 시작했으며, 베이징, 허베이, 상하이, 장쑤성, 저장성, 안휘, 후베이, 광둥 등 8개 성 및 시에서 6G 파일럿 작업을 수행하도록 승인되었습니다. 6G 부처-지방 조정 파일럿의 주요 임무는 국가 수준 시스템 레이아웃을 기반으로 현지 상황에 적응하고 새로운 단말기, 핵심 칩 장치, 계측 및 위성 인터넷과 같은 6G 관련 산업에 초점을 맞추고 몰입형 통신, 산업 제조, 저고도 경제 및 해양 경제와 같은 6G 잠재적 응용 시나리오에 대한 연구를 강화하고 국가 6G \"원 게임\" 개발 패턴을 형성하는 것입니다."},{"s":"애크먼 “연준 금리 올리면 내년 침체올수도”","so":"매일경제","tm":"11/25 08:44","c":1,"r":"kr","u":"https://www.mk.co.kr/news/business/12217729","p":1795563893,"a":1795565135,"su":"불앤베어 플러스 젠슨황의 엔비디아 CEO(회사의 가장 높은 책임자) 복귀이후 시장의 관심은 다시 연준으로 쏠리고 있습니다. 빌 애크먼은 “연준이 금리(돈을 빌릴 때 내는 이자 비율) 올리면 내년 침체가 올수 있다”며 으름장을 놓고 있습니다. 존 윌리엄스 뉴욕 연은 총재는 “미국 경제는 강하지만 둔화되는 지점도 보인다”고 발언했습니다. ◆ 유의사항 : 본 영상은 2026.11.25(수)에 녹화되었으며, 영상 용량으로 인해 약간의 버퍼링이 있을 수 있습니다."},{"s":"미국 증시가 2018년 급락을 반복할 가능성이 있나요? Castle Securities는 연준의 금리 인상과 AI 투자 냉각으로 인해 이중 압력이 발생한다고 경고합니다.","so":"鉅亨網","tm":"11/25 08:44","c":1,"r":"tw","u":"https://news.cnyes.com/news/id/6670834","p":1795563890,"a":1795565151,"t":"美股恐重演2018年暴跌？城堡證券示警：Fed升息、AI投資降溫形成雙重壓力","su":"시타델증권 전략가들은 미국 달러 강세, 호황 주식 하락, 연준의 긴축 기조가 지속되면서 시장이 2018년 말 위험 자산 매도 이전 환경을 반복하고 있다고 경고했습니다.\n트레이더들은 연준이 다음 달 금리를 인상할 것으로 예상하고 있습니다. 지난 9월 3년 만에 처음으로 금리를 인상했고 지난주 두 명의 관계자는 차입 비용을 다시 인상해야 한다고 말했습니다.\nS&P500(미국 큰 회사 500곳의 주가를 합쳐 만든 점수)은 월요일 반등했지만 여전히 10월 최고치보다 약 7% 낮습니다. 전략가들은 AI 투자 둔화, 수익률(넣은 돈에 비해 얻는 이익 비율) 곡선 평탄화, 위험 자산에 대한 지속적인 압박을 우려하고 있습니다."},{"s":"홍콩 주식 모닝 포스트 │ 미국 나스닥은 1% 이상 하락, 저우다푸의 중간 순이익은 거의 두 배 증가","so":"财联社","tm":"11/25 08:44","c":1,"r":"cn","u":"https://www.cls.cn/detail/2542939","p":1795563884,"a":1795565140,"t":"港股早报｜美股纳指跌超1% 周大福中期净利近翻番","su":"① 중앙은행은 오늘 8000억 위안 규모의 MLF 운영을 시작했습니다. ② 상무부는 미국 규제 발표 2항 시행을 중단했습니다. ③ 유럽연합은 하이브리드 자동차에 대한 임시 세이프가드 조치를 채택했습니다. ④ 미국 3대 주가지수가 엇갈리고, 중국 인기 테마주(같은 유행(주제)으로 함께 오르내리는 주식들)가 엇갈린 추세를 보였습니다. ⑤ 헬스케어 및 소비자 소매주는 추세를 역전하고 상승했습니다. ⑥ 국제 유가 결산가격이 2% 이상 반등했습니다. 은행 시스템의 충분한 유동성(시장에 도는 돈의 양)을 유지하기 위해 8000억 위안 규모의 MLF 운영이 2026년 11월 25일에 시작되며 기간은 1년입니다. 2. 2024년 상무부 고시 제46호(\"미국에 대한 관련 이중용도 품목의 수출 통제 강화에 관한 고시\")의 두 번째 단락이 유예됩니다. 3. 유럽연합은 하이브리드 차량에 대한 임시 보호 조치를 발표했습니다. 중국 상무부는 중국 관련 산업의 정당한 권익을 단호히 수호하겠다고 밝혔다."},{"s":"뉴욕 다우 연일 상승, 5만 달러대 회복 미국 경기에 낙관론, 구매 주문 우세","so":"毎日新聞","tm":"11/25 08:37","c":1,"r":"jp","u":"https://mainichi.jp/articles/20261125/kyd/00m/020/002000c","p":1795563438,"a":1795565166,"t":"NYダウ続伸、5万ドル台回復 米景気へ楽観論、買い注文優勢","su":"24일 뉴욕 주식시장 다우공업주 30종 평균은 연일 상승해 전날 대비 423·39달러 높이인 5만0018·70달러로 거래를 마치고 4영업일 만에 5만달러대를 회복했다. 미국 경기에 대한 낙관론이 퍼져 구매 주문이 우세했다."},{"s":"[GAM] 월가 트레이더들, 내년 말 연준 금리인하 가능성에 베팅","so":"뉴스핌","tm":"11/25 08:30","c":1,"r":"kr","u":"https://www.newspim.com/news/view/20261125000133","p":1795563000,"a":1795565135,"su":"이 기사는 11월 25일 오전 08시26분 '해외 주식 투자의 도우미' GAM(Global Asset Management)에 출고된 프리미엄 기사입니다. GAM에서 회원 가입을 하면 9000여 해외 종목의 프리미엄 기사를 보실 수 있습니다. [서울=뉴스핌] 이홍규 기자 = 월가의 채권 트레이더들이 미국 연방준비제도(연준(미국의 중앙은행))의 정책금리(돈을 빌릴 때 내는 이자 비율) 인상과 주가 하락으로 경기가 크게 둔화할 위험에 대비해 헤지를 서두르고 있다."},{"s":"젠슨 황이 돌아왔고 2018년에도 마찬가지입니다! 골드만삭스 \"미국 증시 급등은 하락장 반등일 뿐\" 경고","so":"鉅亨網","tm":"11/25 08:22","c":1,"r":"tw","u":"https://news.cnyes.com/news/id/6671180","p":1795562567,"a":1795565153,"t":"黃仁勳回來了 2018也回來了！高盛警告：美股暴漲只是熊市反彈","su":"젠슨 황이 엔비디아의 CEO로 복귀하면서 미국 증시는 강한 반등을 보였고 나스닥 100 지수는 약 7% 상승했습니다. 그러나 골드만삭스는 이번 파동이 숏커버링의 약세장 반등에 가깝다고 말했다.\n골드만삭스는 투자 등급 회사채 스프레드가 약 0.13%포인트(퍼센트끼리 뺀 차이)만큼 확대되고 2년 인플레이션(물건값이 계속 오르는 것) 스왑 금리가 2.09%로 하락하는 등 신용 시장이 주식보다 뒤처졌다고 말했습니다.\n씨티는 2026년을 2018년과 비교하며 순환주, 기술주, 의료주가 약세를 보였으며 시장 압력이 계속 확산될 수 있다고 밝혔습니다."},{"s":"국제 금값, 하루 만에 하락 전환⋯연준 금리인상 전망에 2.5%↓","so":"이투데이","tm":"11/25 08:22","c":1,"r":"kr","u":"https://www.etoday.co.kr/news/view/2652535","p":1795562520,"a":1795565135,"su":"▲서울 종로구 한국금거래소에서 직원이 골드바를 들어보이고 있다. 고성준 기자 joonko1@국제금값이 24일(현지시간) 하락했다. 미국 연방준비제도(Fed"},{"s":"EJFQ Letter Analysis | 미국 증시는 충분히 하락하지 않았으며 위험 프리미엄이 \"수정\"되어 시장에 진입하기를 기다리고 있습니다.","so":"信報網站","tm":"11/25 08:19","c":1,"r":"hk","u":"https://www.hkej.com/instantnews/stock/article/4573696/EJFQ%E4%BF%A1%E6%9E%90%E4%B8%A8%E7%BE%8E%E8%82%A1%E6%9C%AA%E8%B7%8C%E5%A4%A0+%E5%80%99%E9%A2%A8%E9%9A%AA%E6%BA%A2%E5%83%B9%E3%80%8C%E6%AD%B8%E6%AD%A3%E3%80%8D%E5%85%A5%E5%B8%82","p":1795562390,"a":1795565158,"t":"EJFQ信析丨美股未跌夠 候風險溢價「歸正」入市","su":"엔비디아 황의 창립자인 'AI 주식 왕' Jensen은 11일 만에 사임한 후 CEO 및 기타 직위로 드라마틱하게 복귀하여 AI 부문에 대한 시장의 신뢰를 즉시 다시 불러일으켰습니다. 월요일(23일) 회사 주가는 시가총액(회사 전체 몸값) 1조 달러에 가까운 31.48% 급등해 필라델피아 반도체 지수가 14.03% 상승했고, S&P500(미국 큰 회사 500곳의 주가를 합쳐 만든 점수) 지수도 4.76% 상승했다. 그러나 AI 평가 하락이 마무리되고 미국 증시가 다시 상승세를 이어갈 것으로 기대하는 것은 지나치게 낙관적일 수 있다. S&P500지수는 고점에서 하락했고, 이익수익률도 월초 약 3.8%에서 4.42%로 올랐지만 여전히 낮은 수준이다."},{"s":"<시간외 귀금속> 금은 반등했지만 2% 이상 하락에는 실패했다. 연준 관계자들은 12월 금리 인상에 대한 기대를 강화하기 위해 매파적인 입장을 표명했습니다.","so":"鉅亨網","tm":"11/25 07:45","c":1,"r":"tw","u":"https://news.cnyes.com/news/id/6670959","p":1795560333,"a":1795560776,"t":"〈貴金屬盤後〉黃金反彈無力下挫逾2% Fed官員放鷹強化12月升息預期","su":"연준 관계자들의 매파적(금리를 올리자는 쪽)인 신호는 12월 금리 인상에 대한 기대감을 강화했습니다. 화요일 금값은 2% 넘게 하락했고, 미국 증시 하락도 각종 자산의 매도세(팔려는 힘)로 이어졌다.\n현물 금은 US$3,558.25였으며, 12월 금 선물은 US$3,557.80이었습니다. 거래자들은 12월 금리가 0.25% 포인트 인상되는 것을 완전히 가격에 반영했습니다.\n주식 시장이 하락하고 은, 백금, 팔라듐이 동시에 하락하자 투자자들은 마진을 충당하기 위해 금과 은 포지션을 마감했습니다."},{"s":"Centuri Holdings, S&P SmallCap 600 편입 예정","so":"S&P Global","tm":"11/25 07:34","c":1,"r":"us","u":"https://press.spglobal.com/2026-11-24-Centuri-Holdings-Set-to-Join-S-P-SmallCap-600","p":1795559690,"a":1795565135,"t":"Centuri Holdings Set to Join S&P SmallCap 600","su":"Centuri Holdings Inc.(NYSE: CTRI)는 12월 1일 화요일 거래 개시 이전부터 S&P SmallCap 600 지수에서 DoubleVerify Holdings Inc.(NYSE: DV)를 대체합니다. Nielsen Holdings는..."},{"s":"트럼프 추가관세·젠슨 황 복귀효과 소진에 미국 증시 부진···엔트로픽 공모가 밑돌아","so":"경향신문","tm":"11/25 07:20","c":1,"r":"kr","u":"https://www.khan.co.kr/article/202611250720001/?utm_source=khan_rss&utm_medium=rss&utm_campaign=total_news","p":1795558800,"a":1795565135,"su":"미국 뉴욕증시의 3대 주요 주가지수가 24일 인공지능 관련 기술주를 중심으로 차익실현 매물이 출회되면서 혼조세로 마감했다. 도널드 트럼프 미 행정부의 추가 관세(수입품에 붙이는 세금) 부과 가능성과 젠슨 황 엔비디아 최고경영자를 둘러싼 우려도 투자심리를 짓눌렀다. 이날 스탠더드앤드푸어스500지수는 전 거래일보다 36.08포인트 내린 7201.09에, 기술주 중심의 나스닥(미국 기술 회사들이 많이 모인 주식시장) 종..."},{"s":"미국 증시 동향 | 마이크로소프트는 엔지니어링 시스템과 사고 대응 메커니즘을 개혁하기 위해 최고 수준의 \"빨간색 경고\"를 활성화합니다.","so":"etnet 經濟通","tm":"11/25 07:10","c":1,"r":"hk","u":"https://www.etnet.com.hk/www/tc/us-stocks/news-article/418069/%E7%BE%8E%E8%82%A1%E5%8B%95%E5%90%91+%7C+%E5%BE%AE%E8%BB%9F%E5%95%9F%E5%8B%95%E6%9C%80%E9%AB%98%E7%B4%9A%E5%88%A5%E3%80%8C%E7%B4%85%E8%89%B2%E8%AD%A6%E5%A0%B1%E3%80%8D%EF%BC%8C%E6%94%B9%E9%9D%A9%E5%B7%A5%E7%A8%8B%E7%B3%BB%E7%B5%B1%E5%8F%8A%E4%BA%8B%E6%95%85%E6%87%89%E8%AE%8A%E6%A9%9F%E5%88%B6","p":1795558200,"a":1795560780,"t":"美股動向 | 微軟啟動最高級別「紅色警報」，改革工程系統及事故應變機制"},{"s":"나스닥 하락 반전 엔비디아 기업지배구조에 우려","so":"NHKニュース","tm":"11/25 07:09","c":1,"r":"jp","u":"https://news.web.nhk/newsweb/na/nd-20261125de80932","p":1795558194,"a":1795560788,"t":"ナスダック 一転下落 エヌビディア企業統治に懸念","su":"[NHK] 24일 뉴욕 주식시장은 전날 급등한 하이테크 주식의 비율이 높은 나스닥의 주가지수가 반도체(전자기기 속에서 계산하고 기억하는 작은 부품) 대기업인 엔비디아의 기업지배구조(회사를 누가 어떻게 이끌고 감시하는지)를 둘러싼 우려가 나온 것 등에서 하락으로 돌아섰습니다. 24일 새"},{"s":"AI 열풍의 미래는 불투명하다. 미국 증시는 하락세로 마감했고 엔비디아의 주가는 거의 6% 하락했습니다.","so":"中央社 CNA","tm":"11/25 07:09","c":1,"r":"tw","u":"https://www.cna.com.tw/news/afe/202611250011.aspx","p":1795558140,"a":1795560778,"t":"AI熱潮前景不明 美股多收跌、輝達股價下挫近6%","su":"인공지능(AI) 열풍의 불투명한 전망으로 인해 다시 한번 투자자들이 기술주를 매도했다. 오늘 미국 4대 증시 지수가 하락세로 마감했습니다. 이 중 거대 칩 엔비디아의 주가는 5.86% 하락한 155.38달러를 기록했습니다."},{"s":"미국 증시는 처음에는 폭발했다가 급락해 투자자들을 딜레마에 빠뜨렸다. 추세 반전 신호는 언제 나타날까요?","so":"鉅亨網","tm":"11/25 07:01","c":1,"r":"tw","u":"https://news.cnyes.com/news/id/6670739","p":1795557681,"a":1795560779,"t":"美股先爆衝又急跌令投資人陷進退兩難 趨勢反轉訊號何時出現？","su":"엔비디아 이사회는 월요일 젠슨 황이 CEO로 즉시 복귀하여 하루 만에 S&P500(미국 큰 회사 500곳의 주가를 합쳐 만든 점수) 지수가 4.73%, 나스닥 지수가 6.51%, 엔비디아 지수가 31.48% 상승할 것이라고 발표했습니다.\nVIX는 급락했고, 숏커버링과 레버리지 ETF의 늦은 리밸런싱으로 인해 매수세가 늘어났습니다. 노무라는 하루에 약 410억 달러가 될 것으로 추산했고, CTA 모델도 크게 뒤집혔다.\n월스트리트는 반등이 바닥을 확인하지 못할 수도 있다고 믿고 있습니다. 금융 여건의 긴축과 AI 자본 지출(공장·장비 등에 쓰는 큰돈)에 대한 수익률은 여전히 검증이 필요합니다. 더 높은 가격을 쫓는 것을 피하기 위해 할당을 다양화하는 것이 좋습니다."},{"s":"미국 주식 일기 │ 다우 지수는 50,000 포인트로 복귀하고 기술주는 하루 만에 반등 및 붕괴","so":"星島頭條","tm":"11/25 06:59","c":1,"r":"hk","u":"https://www.stheadline.com/stock-market/3640872/%E7%BE%8E%E8%82%A1%E6%97%A5%E8%AA%8C%E9%81%93%E6%8C%87%E9%87%8D%E8%BF%945%E8%90 었습니다."},{"s":"Allianz Tang Jicheng과의 독점 인터뷰: 연준의 금리 인상은 아직 끝나지 않았으며 AI 배당금은 아시아 태평양 지역의 지형을 바꿀 것입니다","so":"21财经","tm":"11/24 17:33","c":1,"r":"cn","u":"https://www.21jingji.com/article/20261124/herald/14c791cfc8d654a5003937f053d22897.html","p":1795509180,"a":1795565146,"t":"专访安联汤继成：美联储加息未至终点，AI红利重塑亚太格局","su":"21세기 비즈니스 헤럴드 Feng Zitong 기자 2026년 세계 경제는 탄력성과 위험 사이에서 흔들리게 될 것입니다. 미국 경제는 하락세에 저항하고 있지만 인플레이션(물건값이 계속 오르는 것) 경직성은 해소하기 어려운 상황이다. 중동 지역의 지정학적 갈등으로 인해 국제 유가가 상승했습니다. 미국, 유럽, 일본의 장기 국채 금리(나라가 돈 빌릴 때 내는 이자 비율)는 지속적으로 상승했다. AI 산업이 중요한 글로벌 성장 동력이 된 반면, 시장에서는 업계의 막대한 자본 지출이 그에 상응하는 이익 수익을 제공할 수 있는지 의문을 제기하기 시작했습니다. 대외 유동성이 지속적으로 부족해지면서 아시아 태평양 경제 간의 차별화가 더욱 심화되었습니다. 다양한 변수가 얽혀 있는 거시적 환경에 직면하여 2027년 글로벌 및 아시아 태평양 시장의 기회와 과제를 어떻게 분석할 것인가? 최근 21세기 비즈니스 헤럴드는 Allianz Investment Asia Pacific의 선임 이코노미스트 Tang Jicheng과 단독 인터뷰를 진행했습니다. 그는 2027년에도 세계 경제 전체는 회복력을 유지하겠지만 유동성 마진은 줄어들 것이라고 말했습니다."},{"s":"나스닥 급등이 더 불안…긴축 우려에 AI 4대 암초, 랠리 재개 확신 어려워[오미주] - 머니투데이","so":"머니투데이","tm":"11/24 16:46","c":1,"r":"kr","u":"https://www.mt.co.kr/amp/world/2026/11/24/2026112416223689923","p":1795506374,"a":1795521477,"su":"젠슨 황이 엔비디아 최고경영자(CEO)로 복귀하면서 23일(현지시간) 나스닥지수가 6.5%, S&P500(미국 큰 회사 500곳의 주가를 합쳐 만든 점수)지수가 4.7% 급등했다. 일각에서는 지난주 금요일(20일) 나스닥지수가 5.3% 급락하고 공포지수(사람들이 주식시장을 얼마나 겁내는지 보여 주는 숫자)라 불리는 시카고 옵션거래소(CBOE)의 변동성지수(VIX)가 35를 넘어선 것이 투매의 절정이었다며 미국 증시가 단기 저점을 형성한 것으로 보인다는 의견이 나온다."},{"s":"젠슨 황의 복귀 첫날! 월스트리트의 광속 재평가: 4개 기업이 목표주가를 올렸고, 1개 기업이 목표주가를 올렸고, 6개 기업이 목표주가를 유지했다. 엔비디아의 \"할인된 가격\"을 계산하세요.","so":"鉅亨網","tm":"11/24 16:40","c":1,"r":"tw","u":"https://news.cnyes.com/news/id/6670949","p":1795506003,"a":1795521500,"t":"黃仁勳回鍋首日！華爾街光速重估：4家上調、1提高目標價、6家維持 給輝達算出「打折價」","su":"젠슨 황이 다시 시장에 복귀한 후 NVDA는 하루 만에 31.48% 상승한 US$165.05를 기록했으며, 시가총액(회사 전체 몸값)은 US$9,520억으로 2003년 이후 가장 큰 증가폭을 기록했습니다.\n11개 기관이 연구 보고서를 업데이트했고, 4개 기관이 등급을 올렸고, 1개 기관이 목표주가(전문가가 예상한 앞날의 주가)를 올렸습니다. 목표주가는 200달러에서 280달러 사이였으며 평균은 233달러였다.\n월스트리트는 젠슨 황의 복귀를 인정하지만 여전히 SEC 조사, 12월 3일 의회 증언, 중국의 수출 통제 등 거버넌스 위험을 기다리고 있습니다."},{"s":"CBOE S&P500 ps://news.ltn.com.tw/news/life/breakingnews/5651447","p":1795492326,"a":1795499011,"t":"AI假照片曾引發美股波動 教育部推影像辨識教案","su":"'미 국방부 폭발' 사진이 소셜 플랫폼에 유포돼 증시에도 일시적인 변동이 빚어졌다. 나중에 알고 보니 AI가 생성한 가짜 사진이었습니다! AI가 생성한 이미지의 진위 여부를 구별하기 어려운 상황에 대해 교육부는 대만 사실 확인 교육 재단(Taiwan Fact Checking Education Foundation)의 교육 전문가인 Zhang Yuteng을 초청하여 대학 교사들이 허위 정보에 현혹되지 않도록 학생들이 \"먼저 의심하고 관찰한 다음 확인하는\" 습관을 기르도록 지도하는 데 사용할 \"AI 시대의 이미지 생성 및 인식\"에 대한 강의 계획을 작성했습니다. 정수진 교육부 기술부장은 오늘(24일) 디지털 기술의 대중화로 각종 정보와 뉴스의 전파 속도가 빨라져 진위 여부를 구별하기 어렵다고 설명했다. 새로운 수업 계획은 AI 이미지 생성의 원리, 식별 방법 및 검증 프로세스를 사례 분석, 도구 작동 및 상황별 연습과 결합하여 학생들이 AI 기술의 가능성과 한계를 이해하고 AI를 책임감 있게 사용하는 방법에 대해 생각할 수 있도록 합니다."},{"s":"광다선물 Wang Na: 미국 주식 반등, 원자재 시장 심리 회복 | 필수품","so":"第一财经","tm":"11/24 12:17","c":1,"r":"cn","u":"https://www.yicai.com/video/103451779.html","p":1795490278,"a":1795530457,"t":"光大期货王娜：美股反弹商品市场情绪回暖| 大宗商品"},{"s":"'미국 주식' 집중주: 젠슨 황의 복직을 위해 AI 경고가 해제됐나? 엔비디아의 시가총액은 하루 만에 거의 1조 달러로 증가했습니다.","so":"旺得富理財網","tm":"11/24 12:11","c":1,"r":"tw","u":"https://wantrich.chinatimes.com/news/20261124900169-420201","p":1795489888,"a":1795499014,"t":"《美股》焦點股：黃仁勳復職AI警報已解除？NVIDIA市值1天增近1兆美元- 國際","su":"[타임즈 편집: Liu Jigang 및 종합 외신 보도] 포커스 주식: ●23일 미국 주식에서 엔비디아의 주가는 급등하며 마침내 31.5%를 기록하며 23년 만에 최대 일일 상승률을 기록했습니다. 이는 주로 젠슨 황이 엔비디아의 수장으로 복귀했기 때문입니다. 외신들은 이 소식을 계기로 반등(내렸다가 다시 오르는 것)파가 계속될 수도 있지만 엔비디아를 비롯한 AI 테마주(같은 유행(주제)으로 함께 오르내리는 주식들)에 대해서는 여전히 조심스러운 태도를 유지할 필요가 있다고 지적했습니다. 왜냐하면 엔비디아가 다음과 같은 일에 관여하고 있기 때문입니다."},{"s":"젠슨 황의 복직 이후 미국 증시는 이팡다(E Fund) AI ETF(03489)의 주요 보유업체인 엔비디아가 하루 만에 31.48% 급등하는 등 들끓고 있다.","so":"Jiemian.com","tm":"11/24 12:04","c":1,"r":"cn","u":"https://m.jiemian.com/article/15366346.html","p":1795489453,"a":1795490250,"t":"黄仁勋复职美股沸腾，易方达AI ETF(03489)重仓股英伟达单日飙涨31.48%","su":"동부 표준시 기준 11월 23일, 엔비디아는 젠슨 황이 CEO(회사의 가장 높은 책임자) 자리를 재개할 것이라고 공식 발표했으며, 미국 기술 및 반도체(전자기기 속에서 계산하고 기억하는 작은 부품) 부문의 위험 선호도는 빠르게 회복되었습니다. 필라델피아 반도체 지수(SOXX)는 밤새 13.67% 상승했고, 엔비디아(NVDA)는 하루 만에 31.48% 상승했습니다."},{"s":"월 100억엔 이상의 자금유입투신 S&P500 연동형이 75개월 연속","so":"日本経済新聞","tm":"11/24 12:00","c":1,"r":"jp","u":"https://www.nikkei.com/article/DGXZQOUB192UP0Z11C26A1000000/","p":1795489200,"a":1795499029,"t":"月100億円以上の資金流入投信 S&P500連動型が75カ月連続","su":"개인 투자자의 인기를 모으고 있는 펀드는 어느 것인가. 2026년 10월까지 월 100억엔 이상의 자금유입이 연속한 월수로 랭킹했다. 선두는 'eMAXIS Slim 미국 주식(S&P500(미국 큰 회사 500곳의 주가를 합쳐 만든 점수))'의 75개월이었다. 2위는 동 시리즈의 「전세계 주식(올 컨트리)」의 71개월. 상위에는 저비용으로 미국주나 전 세계주에 투자할 수 있는 인덱스(지수연동)형이 두드러진다."},{"s":"실시간 업데이트: 황의 엔비디아 복귀로 인한 주가 상승 및 국회의원 회의론","so":"The New York Times","tm":"11/24 11:58","c":1,"r":"us","u":"https://www.nytimes.com/live/2026/11/23/technology/nvidia-jensen-huang-reinstated","p":1795489098,"a":1795490245,"t":"Live Updates: Huang’s Return to Nvidia Sparks Stock Rally and Lawmaker Skepticism"},{"s":"트럼프 2.0이 젠슨 황 2.0과 힘을 합친다. 월스트리트의 드라마는 어떻게 끝날 것인가?","so":"工商時報","tm":"11/24 11:49","c":1,"r":"tw","u":"https://www.ctee.com.tw/news/20261124700979-430801","p":1795488540,"a":1795499015,"t":"川普2.0聯手黃仁勳2.0 華爾街大戲將如何收場？","su":"Lian Junwei/뉴스 분석 트럼프 미국 대통령의 지휘 하에 젠슨 황은 강력한 세력을 이끌고 엔비디아로 돌아왔습니다. 동시에 민주당과 공화당 기관은 젠슨 황을 놓지 않을 것이라고 강조했습니다. 트럼프 2.0이 젠슨 황 2.0과 힘을 합치면 정치적 분쟁, 중국 정책, AI 규제, 심지어 인종 드라마까지 포함하는 이 드라마가 계속 펼쳐질 것입니다. 그러나 1라운드에서는 트럼프와 젠슨 황이 우위를 점한 것이 분명했습니다. 우선, 젠슨 황에 대한 조사에서 트럼프가 아무리 멍청해도 그는 할 수 없습니다 ..."},{"s":"머스크 환호, 무 양은 헛된 것, 월스트리트는 \"황 런순의 복귀\"가 내부 거래를하고 있다고 의심합니다","so":"36氪","tm":"11/24 11:14","c":1,"r":"cn","u":"https://m.36kr.com/p/4083118330238083","p":1795486472,"a":1795490250,"t":"马斯克欢呼、木头姐踏空，华尔街质疑“黄仁勋回归”有内幕交易"},{"s":"나스닥, 다우, S&P500 선물은 젠슨 황의 엔비디아 복귀로 3조 달러 시장 상승세를 촉발합니다: SOXS, IBRX, HPE, TSM In Focus","so":"Yahoo Finance","tm":"11/24 11:13","c":1,"r":"us","u":"https://finance.yahoo.com/markets/stocks/articles/nasdaq-dow-p-500-futures-021343688.html","p":1795486380,"a":1795490246,"t":"Nasdaq, Dow, S&P 500 Futures Gain As Jensen Huang’s Return To Nvidia Sparks $3T Market Rally: SOXS, IBRX, HPE, TSM In Focus","su":"엔비디아가 황이 회사의 사장, CEO(회사의 가장 높은 책임자) 및 이사회 구성원으로 복귀할 것이라고 발표한 후 월스트리트에 대한 낙관론이 치솟았습니다."},{"s":"S&P500 ETP 증권 3배 매수(SPY3.L) 레버리지","so":"Yahoo! Finance Canada","tm":"11/24 10:57","c":1,"r":"us","u":"https://ca.finance.yahoo.com/quote/SPY3.L/holdings/","p":1795485455,"a":1795498996,"t":"Leverage Shares 3x Long S&P 500 ETP Securities (SPY3.L)"},{"s":"연준의 윌리엄스 신호 금리 인상: 경제는 여전히 강하고 인플레이션은 여전히 너무 높습니다.","so":"ThePaper.cn","tm":"11/24 10:42","c":1,"r":"cn","u":"https://www.thepaper.cn/newsDetail_forward_34544868","p":1795484533,"a":1795490252,"t":"美联储威廉姆斯释放加息信号：经济依然强劲、通胀率仍然过高","su":"현지 시간으로 11월 23일, 존 윌리엄스 뉴욕 연준(미국의 중앙은행) 총재는 연준이 단계별 조치를 취해야 한다고 말했습니다. \"우리는 인플레이션(물건값이 계속 오르는 것)이 현재 수준까지 유지되도록 단계별 조치를 취해야 합니다."},{"s":"닛케이 평균 주가, 일시 2800엔 고 미국주 급신으로 5만 9000엔대 회복","so":"日本経済新聞","tm":"11/24 10:35","c":1,"r":"jp","u":"https://www.nikkei.com/article/DGXZQOUB240EV0U6A121C2000000/","p":1795484149,"a":1795490278,"t":"日経平均株価、一時2800円高 米国株急伸で5万9000円台回復","su":"휴장 새벽 24일 도쿄 주식시장에서 닛케이 평균 주가는 일시 전 주말 대비 2800엔 높았다. 5만9000엔대까지 상승했다. 23일 미국 증시에서는 하이테크 주비율이 높은 나스닥(미국 기술 회사들이 많이 모인 주식시장) 종합주가지수가 전주말 대비 7% 높다고 급반발해 일본주에도 매입이 파급됐다. 미국 엔비디아주는 23일 최고경영책임자(CEO(회사의 가장 높은 책임자))를 사임한 젠슨 황씨의 CEO 복귀를 발표해 30% 초 급신했다. 도쿄 시장에서도 단기적으로 투자자 심리"},{"s":"뉴욕 연준 윌리엄스: 인플레이션을 막기 위해 아직 해야 할 일이 남아 있어 추가 긴축 가능성이 있음을 암시","so":"鉅亨網","tm":"11/24 10:30","c":1,"r":"tw","u":"https://news.cnyes.com/news/id/6670394","p":1795483820,"a":1795490269,"t":"紐約Fed威廉斯：抗通膨仍有工作要做 暗示可能進一步緊縮","su":"윌리엄스 뉴욕 연준 총재는 인플레이션(물건값이 계속 오르는 것)이 여전히 너무 높기 때문에 연준은 계속해서 긴축 통화 정책을 추진해야 한다고 말했습니다.\n그는 물가상승률이 연말 3.5%, 내년에는 2%를 소폭 웃돌 것으로 내다봤다. 12/8~9 회의 자료를 토대로 조치를 취할 예정입니다.\n시장에서는 연준이 다음 달 금리를 0.25%포인트(퍼센트끼리 뺀 차이) 인상할 것으로 예상하고 있습니다. 윌리엄스는 에너지, 관세, 지정학이 가격을 상승시켰지만 아직 확산되지는 않았다고 말했습니다."},{"s":"엔비디아 상승세가 흐지부지되고 달러가 하락하면서 미국 증시가 하락했습니다.","so":"Reuters","tm":"11/24 10:29","c":1,"r":"world","u":"https://www.reuters.com/world/china/global-markets-global-markets-2026-11-24/","p":1795483740,"a":1795560794,"t":"US stocks slide as Nvidia rally fizzles out, dollar falls"},{"s":"[숏폼] 뉴욕증시, 젠슨 황 복귀에 '환호' 월가 매도세 '당장은' 멈춰","so":"SBS Biz","tm":"11/24 10:19","c":1,"r":"kr","u":"https://biz.sbs.co.kr/amp/article/20000348420","p":1795483140,"a":1795490245,"su":"[숏폼] 뉴욕증시, 젠슨 황 복귀에 '환호' 월가 \"매도세(팔려는 힘) '당장은' 멈춰\" SBS Biz 입력2026.11.24 10:19 수정2026.11.24 10:19 ⓒ SBS Medianet & SBSi 무단복제-재배포 금지"},{"s":"해외시장뷰&미국주 픽업(11월 24일)","so":"日本経済新聞","tm":"11/24 10:17","c":1,"r":"jp","u":"https://www.nikkei.com/prime/veritas/article/DGXZQOKC2418I0U6A121C2000000","p":1795483026,"a":1795499030,"t":"海外市場ビュー&米国株ピックアップ（11月24日）","su":"팬 CEO(회사의 가장 높은 책임자) 복귀로 지난 주말의 급락으로부터의 환매 가속 도카이 도쿄 증권 미국 나카가와 지요씨 미국을 비롯한 해외 시장의 동향을 점검합니다. 화요일부터 금요일은 뉴욕 시장 관계자와 중계를 맺었다."},{"s":"시판 전 전략 | 젠슨 황은 미국 주식에서 격렬한 반등을 재개하고 홍콩 주식은 반등을 따라갈 것으로 예상되며 먼저 22800의 저항을 살펴 봅니다.","so":"etnet 經濟通","tm":"11/24 10:15","c":1,"r":"hk","u":"https://www.etnet.com.hk/www/tc/news/news-article.php?section=features&category=focus&newsid=417908","p":1795482900,"a":1795490270,"t":"盤前攻略 | 黃仁勳復辟美股暴力反彈，港股料跟彈先望阻力22800","su":"시판 전 전략 | 젠슨 황은 미국 주식에서 격렬한 반등을 재개하고, 홍콩 주식은 22800에서 반등을 따라가며 저항을 찾을 것으로 예상됩니다. 엔비디아는 젠슨 황이 즉시 CEO 자리를 재개할 것이라고 발표했습니다. 그는 미국 정부의 의견을 들었다고 인정했다. 트럼프 미국 대통령도 젠슨 황을 복직시키기 위해 이사회를 설득했다고 인정했다. 엔비디아의 주가는 밤새 31.5% 급등했고, 젠슨 황의 복귀로 미국 증시 전체가 이익을 얻었습니다. 특히 마이크론(US.MU)이 19%, 샌디스크(US.SNDK)가 10%, SK하이닉스ADR(US.SKHY)이 20% 급등하는 등 반도체(전자기기 속에서 계산하고 기억하는 작은 부품)주가 전반적으로 급등하며 필라델피아반도체지수는 1,179포인트(14.03%) 급등했다. (자료사진) 3대 지수가 모두 폭발했다. 다우지수는 1,447포인트(3.01%) 오른 49,595에, 나스닥(미국 기술 회사들이 많이 모인 주식시장)은 1,471포인트(6.51%) 오른 24,089에, S&P는 326포인트(4.73%) 오른 7,237에 장을 마감했습니다."},{"s":"도쿄 주식시장, 일시 5만 8000엔 회복","so":"産経ニュース","tm":"11/24 10:13","c":1,"r":"jp","u":"https://www.sankei.com/article/20261124-OGJYXKGYLRNWLFJIV7IEZ6JXPM/","p":1795482807,"a":1795490279,"t":"東証、一時5万8000円回復 米国株高が追い風、AIや半導体関連銘柄に買い注文優勢","su":"연휴 24일 오전 도쿄 주식시장은 닛케이 평균 주가(225종)가 반발했다. 인상폭은 한때 2200엔을 넘어 5만8000엔을 회복했다. 전날 미국 주식 고가 몰래 바뀌고 ..."},{"s":"연준의 \"서열 3위\"는 다음과 같이 말했습니다: 인플레이션은 계속해서 너무 높으며 필요하다면 금리가 지속적으로 인상될 수 있습니다!","so":"财联社","tm":"11/24 10:10","c":1,"r":"cn","u":"https://www.cls.cn/detail/2542480","p":1795482659,"a":1795530815,"t":"美联储“三把手”放话：通胀持续过高，必要时或连续加息！","su":"① 윌리엄스 뉴욕 연준 총재는 중앙은행이 인플레이션(물건값이 계속 오르는 것)에 대해 \"미래를 내다볼\" 필요가 있으며 물가를 낮추는 데 아직 해야 할 일이 많다고 말했습니다. ② 그는 필요하다면 FOMC가 지속적으로 금리(돈을 빌릴 때 내는 이자 비율)를 인상할 가능성을 배제하지 않으며, 향후 여러 회의에서 어떤 옵션도 배제하지 않을 것입니다. ③ 그는 연준의 10월 정책 회의 이후의 데이터가 인플레이션율이 계속해서 너무 높다는 것을 보여줄 것으로 기대합니다. 차이롄서, 11월 24일(편집자 황준지) 월요일(23일) 동부시간 뉴욕 연준의 존 윌리엄스 총재는 중앙은행이 인플레이션 문제에 대해 '미래지향적' 자세를 유지해야 하며 물가를 낮추기 위해서는 아직 해야 할 일이 많다고 말했습니다. 그는 필요하다면 FOMC가 지속적으로 금리를 인상할 가능성도 배제하지 않았고, 향후 (여러) 회의에서도 어떤 옵션도 배제하지 않았습니다."},{"s":"\"너무 충격을 받아서 의자에서 떨어졌어요!\" 젠슨 황이 돌아오는 날 월스트리트는 미쳐간다","so":"财联社","tm":"11/24 10:09","c":1,"r":"cn","u":"https://www.cls.cn/detail/2542543","p":1795482540,"a":1795490255,"t":"“惊得我从椅子上摔下来”！黄仁勋回归日 华尔街也癫狂了","su":"① 월요일 뉴욕 시간 오전 9시 직전에 엔비디아는 젠슨 황이 회사의 수장으로 복귀한다고 발표했는데, 이는 AI 건설 관련 주식에 대한 월스트리트의 열광에 거의 즉시 불을 붙였습니다. ② 이번 '젠슨 황 복귀일' 시장의 미친 성과는 많은 월스트리트 사람들에게 오랫동안 기억될 운명이다. 차이롄서, 11월 24일(Editor Xiaoxiang) 일요일 저녁 Credent Wealth Management의 최고 투자 책임자인 Edison Byzyka는 지난주 급격한 시장 매도 이후 가능한 시장 동향에 대해 동료들과 논의하기 위해 Zoom 회의에 참여하여 1시간 30분을 보냈습니다. 그와 그의 팀은 인공 지능 개념 주식의 지속적인 하락에 따른 영향에 대처하기 위해 오랫동안 \"종말 시장\"에 정신적으로 준비되어 왔습니다. 그러나 그들이 예상하지 못한 것은 거래의 \"핵심 인물\"인 젠슨 황이 엔비디아의 CEO(회사의 가장 높은 책임자)로 곧 복귀할 것이라는 것과 그의 복귀가 미국 주식의 엄청난 반등(내렸다가 다시 오르는 것)을 촉발할 것이라는 점이었습니다."},{"s":"미국 증시가 급등했습니다! 젠슨 황이 돌아오고 엔비디아 주가가 급등합니다! 국제 유가는 폭락했고 미국 원유는 80달러에 육박했으며 금과 은은 모두 상승했습니다.","so":"21财经","tm":"11/24 10:03","c":1,"r":"cn","u":"https://www.21jingji.com/article/20261124/herald/e80c0b83cb50be210995f039c4894379.html","p":1795482180,"a":1795499004,"t":"美股大涨！黄仁勋回归，英伟达股价暴涨！国际油价大跌，美油逼近80美元，黄金白银齐涨","su":"11월 23일 동부 표준시, 나스닥, S&P500(미국 큰 회사 500곳의 주가를 합쳐 만든 점수) 지수, 필라델피아 반도체(전자기기 속에서 계산하고 기억하는 작은 부품) 지수는 모두 2025년 4월 이후 최대 일일 상승폭을 기록했습니다. 마감 기준 S&P500 지수는 4.73% 상승한 7237.17포인트를 기록했습니다. 나스닥 종합지수는 6.51% 상승한 24089.56포인트를 기록했습니다. 다우존스산업평균지수는 3.01% 오른 49595.31포인트를 기록했다. 테슬라는 11.46%, 메타는 6.55%, 구글은 6.34%, 아마존은 3.47%, 애플은 1.9%, 마이크로소프트는 1.65% 상승하는 등 미국 7대 기술 대기업이 전반적으로 급등했다. 앤트로픽 주가는 이날 1.43% 하락하며 약세를 보였다. 지난 주, 앤트로픽이 역사상 최대 규모의 기업공개(IPO)를 마무리했음에도 불구하고 AI 지출 속도에 대한 우려로 인해 혼란이 촉발되었습니다."},{"s":"머스크 AI(머스크 AI) 뒤의 생명보험 금융업자는 월스트리트를 복잡한 금융망으로 불안하게 만든다 | 뉴욕타임스 정치","so":"聯合報數位版","tm":"11/24 10:00","c":1,"r":"tw","u":"https://vip.udn.com/vip/story/124852/9896498?from=vipudn_newest_index","p":1795482000,"a":1795503012,"t":"馬斯克AI背後的壽險金主讓華爾街緊張的複雜融資鏈| 紐時政經","su":"테슬라 CEO 머스크는 올해 AI 칩을 구입하기 위해 수십억 달러가 필요하며, 월스트리트는 그를 위해 예상치 못한 자금 조달(사업에 쓸 돈을 모으는 것)자를 찾았습니다. 바로 생명 보험 정책과 퇴직 연금을 관리하는 보험 회사입니다. 이것은 고립된 사례가 아닙니다. 늘 보수적인 투자자로 여겨져 왔던 미국 생명보험업계는 AI 열풍에 점점 더 많은 자금을 투자하고 있으며, 거대 기술기업의 데이터센터(컴퓨터 수만 대를 모아 둔 건물) 확장에 막대한 자금을 지원하기까지 한다. 이러한 투자는 안전해 보이지만 월스트리트의 일부 대형 금융 기관으로부터 경고를 받았습니다. AI 거대 기업이 확장을 서두르고 보험 업계가 자금을 제공하기 위해 안간힘을 쓰는 가운데 이러한 거래를 의심스럽게 만드는 것은 정확히 무엇입니까?"},{"s":"미국 증시 급락이 개입을 촉발했다? 트럼프: 젠슨 황은 뇌에 다른 누구도 모르는 칩을 갖고 있다","so":"鉅亨網","tm":"11/24 09:58","c":1,"r":"tw","u":"https://news.cnyes.com/news/id/6670389","p":1795481886,"a":1795504048,"t":"美股暴跌促成介入？川普：黃仁勳腦中還有別人不知道的晶片","su":"트럼프 대통령은 자신이 엔비디아 이사회를 설득해 젠슨 황을 CEO(회사의 가장 높은 책임자)로 복귀시키는 것이 국가 안보에 위협이 될 것이라고 말했다.\n엔비디아는 젠슨 황이 사임한 지 불과 11일 만에 사장, CEO 및 이사로 복귀했다고 발표했습니다. 이사회는 정부로부터 국가 안보 보장을 받았다고 밝혔다.\n복직 후에도 수사가 계속되면서 의회 내에서는 양당의 비난이 거세졌다. 젠슨 황은 비공개 인터뷰를 수락하고 12월 1일 이후 의회에서 증언할 예정입니다."},{"s":"이익 전망은 탄탄한데…미국 증시 발목잡는 유동성","so":"아시아경제","tm":"11/24 09:53","c":1,"r":"kr","u":"https://www.asiae.co.kr/article/2026112314483465278","p":1795481580,"a":1795490245,"su":"미국 증시 조정의 배경으로 기업 실적 우려와 함께 긴축 정책에 따른 유동성(시장에 도는 돈의 양) 부담이 지목되고 있다. 일부 투자자들이 신규 매수보다 보유 비중 축소를 우선하면서 매도 물량을 받아낼 수요가 충분하지 않다는 분석이다. 기업 이익과 회사채 시장이 버팀목으로 거론되는 가운데, 향후 물가(물건값 전체의 수준) 흐름과 통화정책 방향이 투자심리 회복의 주요 변수가 될 전망이다. 신용·미수 이용자는 이러한 시장 변화와 별개로 계좌의 담보비율과 상환 일정, 누적 금융 비용을 확인할 필요가 있다."},{"s":"\"선물\" 젠슨 황이 사무실로 복귀하여 미국 주식을 폭발시켰습니다! 대만지수선물 3400포인트 이상 급등, 전자선물 상한가 - 증권","so":"工商時報","tm":"11/24 09:52","c":1,"r":"tw","u":"https://www.ctee.com.tw/news/20261124700735-430201","p":1795481520,"a":1795503014,"t":"《期貨》黃仁勳回任炸裂美股！ 台指期飆逾3400點、電子期觸漲停- 證券","su":"[타임스 궈홍휘 기자] 엔비디아는 젠슨 황이 CEO로 복귀했다고 발표하며 AI 투자 열풍을 다시 불러일으켰다. 미국 증시는 월요일 강한 반등세를 보이며 4개 주요 지수가 모두 27","c":1,"r":"cn","u":"https://www.21jingji.com/article/20261124/herald/5dba91bedab38c44d13a3da8dd3789e8.html","p":1795480020,"a":1795490256,"t":"美股AI存储板块大幅上涨，SK海力士大涨20%丨美股复盘","su":"동부 표준시 기준 11월 23일에는 AI 스토리지 부문이 급등했다. 젠슨 황의 복귀는 AI 관련 주식의 전반적인 상승으로 이어졌고, 스토리지 개념이 전반적으로 상승했습니다. 마감 현재 SK하이닉스는 20.00% 상승한 $124.28로 마감했습니다. 마이크론는 19.04% 상승한 $707.70에 마감했습니다. 스토리지 개념이 전반적으로 상승했습니다. 젠슨 황의 복직은 AI 관련 주식의 광범위한 상승으로 이어졌습니다. 필라델피아 반도체(전자기기 속에서 계산하고 기억하는 작은 부품) 지수는 14% 상승해 2025년 이후 최대 일일 상승폭을 기록했습니다. 엔비디아는 주당 미화 165.05달러로 31% 이상 급등했으며, 시가총액(회사 전체 몸값)은 하루 만에 9,520억 달러 증가했습니다. 마이크론 테크놀로지는 19%, 인텔은 16% 이상, TSMC는 14% 상승했다. 스토리지 개념이 전반적으로 떠오르고 있습니다. SK하이닉스는 20%, 희롱기술은 18.01%, 램버스는 14.06% 상승했다."},{"s":"미국 증시가 급격하게 반등했습니다! 월스트리트에서는 '젠슨 황의 복귀'에 대해 뜨거운 논의를 하고 있다. 단기 바닥이 확립됐는가?","so":"财联社","tm":"11/24 09:25","c":1,"r":"cn","u":"https://www.cls.cn/detail/2542457","p":1795479900,"a":1795490257,"t":"美股暴力反弹！华尔街热议“黄仁勋回归” ：短期底部已确立？","su":"① 월요일, 엔비디아가 젠슨 황의 CEO 복귀를 발표하자 미국 주요 주가 지수가 격렬하게 반등했습니다. ② 젠슨 황이 왕으로 돌아오면서 월스트리트 분석가들은 이러한 매도 물결이 적어도 일시적으로 끝날 수 있다고 믿습니다. ③ 그러나 엔비디아와 이러한 강세장(주가가 오랫동안 오르는 시기)을 뒷받침하는 '인공지능 거래'를 둘러싼 몇 가지 핵심적인 해결되지 않은 문제가 여전히 남아 있습니다. 차이롄서, 11월 24일(편집장 전천) 월요일 미국 주요 증시가 급등했다. 젠슨 황을 CEO로 복귀시키겠다는 엔비디아의 발표는 투자자들에게 지난 주의 끊임없는 매도 압력이 적어도 일시적으로 가라앉을 수 있다는 희망을 줍니다. 그러나 전략가들은 상승세(오르는 흐름)가 얼마나 오래 지속될 수 있는지에 대해 의견이 분분합니다. 일부에서는 주식시장 조정이 끝났다고 믿는 반면, 다른 일부에서는 황 총리가 퇴임하기 전에 남아 있는 문제들이 하락세에 영향을 미쳤다고 우려합니다."},{"s":"월스트리트 상승세로 S&P500과 다우 지수는 조정 국면에서 빠져나옴","so":"Fox Business","tm":"11/24 09:24","c":1,"r":"us","u":"https://www.foxbusiness.com/video/6408788167112","p":1795479894,"a":1795490247,"t":"S&P 500 and Dow exit correction territory as Wall Street rallies","su":"US Bank Asset Management Group의 수석 투자 전략가인 Robert Haworth는 'The Claman Countdown'에서 하이퍼스케일러(데이터센터를 아주 크게 운영하는 회사(구글·아마존 등)), 반도체(전자기기 속에서 계산하고 기억하는 작은 부품) 회사, 생명공학 및 의료 기술주 중 최고 상승주를 분석했습니다."},{"s":"CITIC Securities: 미국 주식의 23×5 거래가 개시되어 증권사에 글로벌 서비스를 위한 새로운 기회가 열림","so":"第一财经","tm":"11/24 09:14","c":1,"r":"cn","u":"https://m.yicai.com/news/103451269.html","p":1795479267,"a":1795499006,"t":"中信证券：美股23×5交易开启，开拓券商全球服务新机遇","su":"CITIC 증권 조사 보고서에 따르면 미국 증시는 새로운 7시간 야간 거래를 추가할 계획이며 일광 절약 시간은 A주 및 H주와 각각 4시간 및 5.5시간 겹칠 것이라고 밝혔습니다. 야간거래의 유동성(시장에 도는 돈의 양)과 거래비용도 개선될 것으로 예상된다. 미국 주식의 거래 연장 이후 익일 거래량은 미국 주식의 일부 고시장 스타 타겟에 집중될 것입니다. 홍콩 주식의 기술 및 임의 소비재 산업은 강력한 자본 전환 압력에 직면해 있습니다. 금융 및 유틸리티 산업은 매우 방어적이며 A주의 직접적인 전환은 제한되어 있습니다. 홍콩의 주요 중국 증권사는 \"연구 서비스 - 거래 실행 - 기관 서비스\"의 풀체인 서비스를 형성할 것으로 예상됩니다. 온라인 브로커는 거래량 증가와 ETF(여러 주식을 묶어 파는 상품) 배정 수요 증가로 수혜를 입을 것으로 예상되며, 수수료 수익도 증가할 것으로 예상된다. ROE가 높고 다양한 해외 자회사를 활용하는 브로커와 강력한 자산 관리 기능을 갖춘 온라인 브로커를 권장합니다."},{"s":"\"미국 주식\" 마감 보고서: 트럼프가 추수감사절 전에 큰 선물을 줍니다! 젠슨 황의 AI 주식 및 반도체주로의 복귀 - 국제","so":"旺得富理財網","tm":"11/24 09:11","c":1,"r":"tw","u":"https://wantrich.chinatimes.com/news/20261124900068-420201","p":1795479084,"a":1795503017,"t":"《美股》收盤速報：感恩節前川普送大禮！老黃回鍋AI股晶片股狂噴- 國際","su":"[타임즈-타이페이] 젠슨 황이 엔비디아의 CEO로 복귀했습니다. 월요일(23일) 4대 지수가 급등했다. S&P500(미국 큰 회사 500곳의 주가를 합쳐 만든 점수)과 나스닥은 트럼프 대통령이 2025년 4월 '해방절' 관세를 중단한 이후 하루 최대 상승폭을 기록했다. 필라델피아 반도체(전자기기 속에서 계산하고 기억하는 작은 부품) 지수는 14% 급등했다. 엔비디아는 31.5% 상승해 2003년 5월 9일 이후 최대 일일 상승률을 기록했습니다. 엔비디아 테마 주식, AI 관련 주식 및 반도체주가 축하 행사를 열었습니다. 마이크론 19% 상승, SK하이닉스 20% 상승, 인텔 상승…"},{"s":"중국은 가족들이 집이 아닌 주식에 저축하기를 원했지만 시장은 하락했습니다.","so":"Financial Times","tm":"11/24 09:11","c":1,"r":"world","u":"https://www.ft.com/content/45c49a84-53cc-44ed-9aab-0dc79f564278?syn-25a6b1a6=1","p":1795479074,"a":1795490282,"t":"China wanted families to put savings in shares not homes — then markets fell"},{"s":"T모닝포스트 | 젠슨 황이 엔비디아로 복귀합니다. 미국 증시 AI 업종 급증; 미국, 해외 데이터센터 건설 제한할 계획","so":"财新网","tm":"11/24 09:10","c":1,"r":"cn","u":"https://m.caixin.com/m/2026-11-24/102508156.html","p":1795479000,"a":1795499007,"t":"T早报｜黄仁勋重返英伟达；美股AI板块大涨；美拟限制海外建数据中心","su":"권장사항: 유럽은 TikTok을 통제하려고 합니다. 아프리카 스마트폰 출하량 급감 Zhipu, 순환 변압기(전기의 세기(전압)를 바꿔 주는 기계) 아키텍처를 사용하는 차세대 플래그십 모델 GLM-5.4 출시"},{"s":"중앙은행의 금 구매 냉각과 연준의 금리 인상 기대가 금 가격에 압력을 가중시키고 있습니다.","so":"MoneyDJ","tm":"11/24 09:05","c":1,"r":"tw","u":" tnet 經濟通","tm":"11/24 02:05","c":1,"r":"hk","u":"https://www.etnet.com.hk/www/tc/us-stocks/news-article/417845/%E7%BE%8E%E8%82%A1%E5%8B%95%E5%90%91%7C%E6%A8%99%E6%8C%87%E6%98%8E%E5%B9%B4%E7%9C%8B%E9%A3%8645%25%E8%87%B3%E8%90%AC%E9%BB%9E%EF%BC%8C%E6%95%B8%E6%93%9A%E4%B8%AD%E5%BF%83%E5%BB%BA%E8%A8%AD%E6%94%BE%E7%B7%A9%E5%8F%8D%E5%88%A9%E9%95%B7%E9%81%A0","p":1795453500,"a":1795503249,"t":"美股動向｜標指明年看飆45%至萬點，數據中心建設放緩反利長遠"},{"s":"댓글 21개 | 초대형 기업공개(IPO)에 따른 미국 주식의 유동성 테스트","so":"21财经","tm":"11/24 01:45","c":1,"r":"cn","u":"https://www.21jingji.com/article/20261124/3c46cae95766bea7c092d67a60946633.html","p":1795452359,"a":1795504046,"t":"21评论丨超级IPO背后的美股流动性考验","su":"특별평론가 구징웨이(Gu Jingwei) 지난 11월 19일 미국의 대형 인공지능 모델 기업인 앤트로픽이 나스닥(미국 기술 회사들이 많이 모인 주식시장)에 상장하며 공모자금 813억 달러를 유치했다. 다음 날, 보험업자들은 초과 배정 권리를 행사하여 미화 122억 달러를 추가로 조달했습니다. 또한 7개 거대 기술 기업이 동시에 260억 달러 규모의 사모펀드 주식을 인수했습니다. 총 모금액은 1,195억 달러에 달해 다시 한번 새로운 글로벌 기업공개(IPO) 자금조달 한도를 설정했습니다. 이미지 출처 : 투총 이번은 불과 5개월 만에 미국 증시 역대 최고 기록을 경신한 두 번째 초대형 기업공개(IPO)다. 앞서 2026년 6월 12일 우주탐사 기술 기업 스페이스X가 나스닥에 상장해 기본자본금 750억 달러를 조달했다. 발행 가격(\"그린슈 메커니즘\")으로 인수업체가 발행한 추가 초과 할당 주식을 합치면 총 조달 금액은 약 862억 달러에 달해 2019년 Saudi Aramco가 세운 글로벌 기업공개(IPO) 자금 조달(사업에 쓸 돈을 모으는 것) 기록인 294억 달러를 넘어섰습니다."},{"s":"미국 증시 동향 | 엔비디아·인텔 등 급등, AI 물결 거침없다는 분석가들","so":"etnet 經濟通","tm":"11/24 01:45","c":1,"r":"hk","u":"https://www.etnet.com.hk/www/tc/news/news-article.php?section=categorized&category=us&newsid=417838","p":1795452300,"a":1795503250,"t":"美股動向｜英偉達、英特爾等飆升，分析師指AI浪潮勢不可擋","su":"2026년 11월 24일 00:45 미국 증시 동향 | 엔비디아, 인텔 등이 급등하면서 AI 물결은 막을 수 없다는 분석이 나온다. 엔비디아가 급등하면서 기술주는 격동의 한 주 이후 강하게 반등(내렸다가 다시 오르는 것)했습니다. 애널리스트 댄 아이브스(댄 아이브스)는 AI의 과대평가(실제 값어치보다 비싸게 매겨진 것)에 대한 시장의 우려에도 불구하고 인공지능 혁명의 물결은 막을 수 없다고 강조했다. 엔비디아는 지난 주 23% 하락해 2008년 9월 이후 최대 주간 하락폭을 기록했다. 요크빌 아이브스(Yorkville Ives) 분석가 댄 아이브스(댄 아이브스)는 소셜 미디어에 \"단유가 단기적으로 시장 서사를 지배할 것이지만 AI 기술 혁명은 계속해서 빠른 속도로 발전할 것\"이라고 게시했다. 그는 2029년까지 전 세계 AI 수요가 기존 생산능력 계획을 훨씬 뛰어넘는 160GW에 달할 것으로 전망하며 “4차 산업혁명은 규제나 지정학에 의해 막히지 않을 것”이라고 강조했다. ttps://m.jiemian.com/article/15362854.html","p":1795424096,"a":1795434986,"t":"海西新药：HX9428治疗糖尿病性黄斑水肿获国家药监局批准开展II期临床试验","su":"11월 23일, Haixi New Drug은 당뇨병성 황반부종(\"DME\") 치료를 위해 자체 개발한 혁신적인 약물 프로젝트 HXP056의 후보 약물 분자 HX9428이 최근 중국 국가 의약품 관리국(NMPA) 약물 평가 센터(CDE)의 승인을 받고 2상 임상(새 약을 사람에게 시험하는 것) 시험을 실시하기로 동의했다고 홍콩 증권 거래소에서 발표했습니다. DME는 HX9428이 발전하는 두 번째 적응증이다."},{"s":"엔웨이제약(Enwei Pharmaceutical): 자체 자금 1억 위안으로 전액 출자 자회사 설립 계획","so":"Jiemian.com","tm":"11/23 17:54","c":1,"r":"cn","u":"https://m.jiemian.com/article/15362889.html","p":1795424086,"a":1795434987,"t":"恩威医药：拟以1亿元自有资金设立全资子公司","su":"엔웨이제약(Enwei Pharmaceutical)은 11월 23일 자사 자금 1억 위안을 투자해 전액 출자 자회사를 설립할 계획이라고 발표했다. 신설법인은 여성건강 분야의 미충족 임상(새 약을 사람에게 시험하는 것)수요 해결과 여성건강 분야의 첨단 방향에 집중할 예정이다. 산부인과 분야에서 회사의 기존 브랜드, 제품 및 산업 기반을 결합하여 신기술 연구 개발 플랫폼(혁신적인 약물 연구 개발 플랫폼, 협력 연구 개발 플랫폼 등 포함) 구축, 산업 투자 및 인수 합병 통합을 통해 전 세계적으로 기술 혁신 역량과 산업 시너지 가치를 갖춘 고품질 프로젝트를 모색할 것입니다. 회사의 여성 건강 산업 배치를 지속적으로 개선 및 통합하고 장기적인 혁신 역량과 지속 가능한 개발 역량을 강화할 것입니다. 발표에 따르면 설립될 전액 출자 자회사의 중국 이름은 Chengdu Enwei Jieryinta Health Technology Co., Ltd.이고 등록 주소는 쓰촨성 청두시 하이테크 존 Tianfu Avenue, Middle Section, Building 2, No. 666, 3406, 34th Floor입니다. 기업형은 총투자액과 등록자본금이 1억위안인 유한책임회사입니다. 엔웨이메디슨은 회사 지분(회사를 나눠 가진 몫) 100%를 보유하고 있으며 자금의 출처는 자체 자금으로 금전적 자금 형태로 투자되고 있습니다."},{"s":"Science and Technology Innovation 200 ETF Penghua(588240)의 기초지수는 5.2% 상승했습니다. 로봇공학, 의료, 반도체 등이 종합적으로 상승했고, 업종이 강한 반등을 이끌었습니다.","so":"Jiemian.com","tm":"11/23 16:40","c":1,"r":"cn","u":"https://www.jiemian.com/article/15362284.html","p":1795419636,"a":1795423999,"t":"科创200ETF鹏华(588240)标的指数上涨5.2%，机器人、医药、半导体集体拉升，板块迎来强势反弹","su":"뉴스: 1. 물리적 AI/휴머노이드 로봇(사람을 닮은 로봇): 가사 현장 검증, 대량 생산 첫 해의 분위기 설정: (1) 11월 22일 체화된 지능형 데이터에 대한 국가 표준 개발이 공식적으로 시작되었으며, '15차 5개년 계획' 기간 동안 20개 이상의 특별 국가 표준이 형성될 예정입니다."},{"s":"13:33:38 [해외시장에 진출하는 혁신의약품이 검증기간에 진입하였습니다. 홍콩증권연계 혁신의약품 ETF 이팡다(E Fund)(159316)의 배분가액에 주목하세요]","so":"财联社","tm":"11/23 14:33","c":1,"r":"cn","u":"https://www.cls.cn/detail/2541425","p":1795412018,"a":1795414337,"t":"13:33:38【创新药出海进入验证期，关注港股通创新药ETF易方达（159316）配置价值】","su":"해외시장에 진출하는 혁신신약(세상에 처음 나온 새로운 약)이 검증기간에 돌입했습니다. 홍콩 스톡커넥트(홍콩과 중국 본토 주식을 서로 사고팔 수 있게 한 길) Innovative Drug ETF E Fund(159316)의 할당 가치에 주목하세요. 정오 마감 기준으로 항셍 홍콩 주식연계 혁신의약품지수는 0.2% 상승, CSI 홍콩증권연계 헬스케어 종합지수는 1.0% 상승, CSI 혁신의약산업지수는 0.6% 상승, CSI 생명공학 테마지수는 0.4% 상승, CSI 300 헬스케어 지수는 0.1% 하락했다. CITIC 증권은 2027년을 바라보며 해외 임상시험과 혁신 신약 등록이 검증 기간에 돌입하고 각 기술 경로가 차별화되고 촉매 집약적일 것이라고 지적했습니다. 해외 수출의 증가와 전략적 제휴의 증가로 인해 우리는 기회와 위험이 공존하는 더 큰 시장과 더 복잡해진 경쟁 환경에 직면하게 될 것입니다. 혁신과 국제화를 중심으로 기회를 포착하는 동시에 한계 개선의 주요 라인에 더 많은 관심을 기울이는 것이 좋습니다. 전반적인 성장 유연성과 현금 지급 능력을 고려하고 차별화된 파이프라인, 세계화 역량 및 운영 개선의 확실성을 갖춘 부문 리더를 선택합니다."},{"s":"[모닝포스트] 우칭이 발언합니다! 비정상적인 시장 변동을 효과적으로 방지하기 위해 시장 안정성을 위한 장기 메커니즘에 대한 심층 연구를 수행합니다. 51종의 1류 혁신신약이 국가의료보험 목록 새 버전에 포함되었습니다.","so":"财联社","tm":"11/23 14:02","c":1,"r":"cn","u":"https://www.cls.cn/detail/2534592","p":1795410163,"a":1795474272,"t":"【早报】吴清发声！深化市场稳定长效机制研究，有效防范市场异常波动；51个一类创新药进入新版国家医保目录","su":"① 우칭: 시장 안정을 위한 장기적인 메커니즘에 대한 연구를 심화하고 비정상적인 시장 변동을 효과적으로 방지합니다. ② 중국과 미국은 중미 무역 협의회 첫 회의를 개최했습니다. 경제 및 무역 협의 메커니즘 ③ 젤렌스키: 미국은 우크라이나가 NATO에 가입하는 대가로 돈바스 지역을 포기할 것을 제안했습니다. ④ 51개의 클래스 I 혁신신약(세상에 처음 나온 새로운 약)이 새 버전의 국가 의료 보험 카탈로그에 포함되었습니다. ⑤ BYD 네트워크 보고 센터는 \"특정 디지털 에너지가 BYD에 팔렸다\"는 온라인 소문이 사실이 아니라는 문서를 발행했습니다. 매크로 뉴스 1. 중국 증권감독관리위원회 위원장 Wu Qing은 제1회 중국 자본시장 학술 연차 회의에서 시장 안정을 위한 장기적인 메커니즘에 대한 연구를 더욱 심화하고 비정상적인 시장 변동을 효과적으로 방지할 것이라고 말했습니다. Wu Qing은 또한 투자자의 정당한 권익을 효과적으로 보호하기 위해서는 양적 거래, 지분(회사를 나눠 가진 몫) 축소 등 제도적 규칙의 최적화와 공정하고 합리적인 규제 조치에 대한 심층적인 연구와 평가가 필요하다고 말했습니다."},{"s":"홍콩 혁신 의약품 ETF Invesco(513780) 추적 지수 CSI 홍콩 스톡커넥트 Innovative Drug Index는 1.29% 상승했으며 추적 지수는 지난 1년 동안 최저 평가에 도달했습니다.","so":"Jiemian.com","tm":"11/23 12:37","c":1,"r":"cn","u":"https://www.jiemian.com/article/15360892.html","p":1795405055,"a":1795408841,"t":"港股创新药ETF景顺(513780)跟踪指数中证港股通创新药指数上涨1.29%，跟踪指数已处近1年估值低位","su":"2026년 11월 23일 11시 22분 기준, 홍콩 혁신의약품 ETF(여러 주식을 묶어 파는 상품) Invesco(513780) 추적지수 CSI 홍콩 스톡커넥트(홍콩과 중국 본토 주식을 서로 사고팔 수 있게 한 길) Innovative Drug Index는 1.29% 상승했으며, 지난 1년간 추적지수는 낮은 평가를 받았습니다."},{"s":"홍콩 스톡커넥트 Pharmaceutical ETF Penghua(513700)와 항셍 Biotech ETF Penghua(159130)가 활발하게 거래되고 있으며, 정책 및 산업 공조가 부문 시장을 촉진합니다.","so":"Jiemian.com","tm":"11/23 12:01","c":1,"r":"cn","u":"https://www.jiemian.com/article/15360535.html","p":1795402887,"a":1795408844,"t":"港股通医药ETF鹏华(513700)、恒生生物科技ETF鹏华(159130)交投活跃，政策产业共振催化板块行情","su":"뉴스에 따르면 11월 23일 2026년 의료보험과 상업보험의 '이중 카탈로그'가 공식 발표되어 결제 시스템이 '다층 결제, 가치 중심'으로 실질적 전환을 나타냈다. 또한, 글로벌 뇌-컴퓨터 인터페이스 기업 수는 2026년 800개 이상에서 1,175개로 증가해 2025년 대비 빠른 성장을 이룰 전망이다. 중국의 뇌-컴퓨터 인터페이스 산업은 베이징-천진-허베이, 장강 삼각주, 광둥, 홍콩, 마카오 등 3대 도시 집합체에 집중되어 있으며, 총 190개 이상의 기업이 전체 시장의 77.4%를 차지한다. 나라 전체. 종타이증권은 연준의 금리 인상에 대한 기대가 높아지고 임상 데이터 검증의 차이로 인해 장기 혁신의약품 자산의 가치 평가가 압박을 받았지만 업계의 번영은 근본적으로 변하지 않았다고 밝혔다. 현재 수익 예측 데이터를 활용해 계산하면 우시앱텍 등 일부 선두 CDMO의 벤치마크 시장가치 PER(주가가 회사가 1년에 번 돈의 몇 배인지)은 약 14.1배에 불과해 조정 밸류에이션(주가가 비싼지 싼지 따진 값) 수준이 매력적이다. 해외 금리 변동의 주기적 교란을 무시하고, 세계 최고의 역량을 갖춘 선도적인 CDMO와 거래량 및 가격 회복 리듬이 뚜렷한 선도적인 임상 CRO에 집중하고, 과매도 이후 가치 회복의 기회를 포착하는 것이 좋습니다."},{"s":"평가 1점: TROP2 ADC가 다시 임상 3상 성공을 달성하며, Kelun의 글로벌 약물 로직이 확고해졌습니다.","so":"第一财经","tm":"11/23 10:36","c":1,"r":"cn","u":"https://www.yicai.com/news/103449638.html","p":1795397812,"a":1795403779,"t":"壹评级：TROP2 ADC再获临床三期成功，科伦全球大药逻辑夯实","su":"11월 20일, 머크는 콜롬보트의 허가를 받은 TROP2 ADC 약물 sac-TMT가 위식도 선암종에 대한 3상 연구에서 전체 생존율(OS)의 1차 평가변수를 달성했다고 발표했습니다. 중국 비즈니스 네트워크(China Business Network)의 'One Rating'은 자궁내막암에 이어 난치성 위장관 종양에 대한 하드 엔드포인트를 통해 약효가 다시 한 번 검증되었으며, 이는 '글로벌 의약품'으로서의 잠재력이 확률적 판단에서 사실 확인으로 더욱 전환되었으며, 가치 평가의 확실성이 크게 향상되었음을 의미한다고 믿습니다. 원레이팅(One Rating)은 3차 위식도 선암종 환자들이 다제제 내성을 경험한 사례가 있으며, 중앙생존기간은 일반적으로 1년 미만이라고 지적했다. 이처럼 매우 이질적인 집단에서 임상(새 약을 사람에게 시험하는 것)적으로 의미 있는 전체 생존(OS) 이점을 달성하는 것은 sac-TMT가 강력하고 광범위한 항종양 활성을 가지고 있음을 입증합니다. 특정 바이오마커에 의존하지 않고 종양 유형 전반에 걸쳐 전체 생존(OS)을 개선하는 이러한 능력은 적응증 경계를 확장하는 혁신적인 약물에 대한 핵심 지원입니다. 본 연구의 2차 평가변수인 무진행 생존율(PFS)은 통계적으로 유의미한 수준에 도달하지 못했지만, 후기 치료와 의사의 화학요법 대조군 선택 측면에서 OS는 규제 기관에서 가장 중요하게 여기는 최적 기준이며, 긍정적인 결과는 핵심 적용 논리를 확립하기에 충분합니다."},{"s":"큐리언트 아드릭세티닙, 급성 골수성 백혈병 1차 치료로 임상 확대… FDA 승인 - 머니투데이","so":"머니투데이","tm":"11/23 08:50","c":1,"r":"kr","u":"https://www.mt.co.kr/index.php/stock/2026/11/23/2026112308460781755","p":1795391403,"a":1795392914,"su":"혁신신약(세상에 처음 나온 새로운 약) 개발기업 큐리언트는 미국 MD앤더슨 암센터가 주관하는 급성 골수성 백혈병(AML) 임상의 임상시험(새 약을 사람에게 시험하는 것)계획 변경이 미국 식품의약국(FDA)으로부터 승인됐다고 23일 밝혔다. 앞선 용량증가 단계에서는 베네토클락스를 포함한 표준 치료에 실패한 R/R AML 환자를 대상으로 Ven/Aza에 아드릭세티닙을 더한 3중 병용요법을 평가했으며, 연구진은 Ven/Aza와 병용할 때 아드릭세티닙의 임상 2상 권장용량을 120mg(1주 투여·1주 휴약)으로 결정했다."},{"s":"주가 방어 위해 생명공학업계, 자사주 희생 - Daily News","so":"工商時報","tm":"11/23 04:00","c":1,"r":"tw","u":"https://www.ctee.com.tw/news/20261123700180-439901","p":1795374000,"a":1795389899,"t":"捍衛股價生技業祭出庫藏股- 日報","su":"3분기부터 자사주(회사가 가진 자기 회사 주식)를 도입한 바이오기업들이 주가를 방어하는 모습을 보였다. 잇따라 자사주를 공모하거나 대주주들이 적극적으로 지분을 늘리고, 경영진이 지분 보유 락업 기간을 연장하는 등의 조치를 취하고 있다. 이로 인해 시장 보호의 물결이 시작되었습니다! 3분기 이후 Kangpei*, Handa, Quanyu-KY, Changjia 등 8개 회사가 자사주를 공모했으며, 총 계획 자사주는 12,814주, 최대 자사주 매입(회사가 자기 주식을 다시 사는 것) 규모는 약 11억 7천만 위안입니다. 또 라멕스 회장은 지분을 늘리기 위해 약 820만 위안을 투자한 한강KY..."},{"s":"16개 바이오기업 대주주, 2개월 연속 자사주 매입 - 매일경제","so":"工商時報","tm":"11/23 04:00","c":1,"r":"tw","u":"https://www.ctee.com.tw/news/20261123700183-439901","p":1795374000,"a":1795389900,"t":"16家生技公司大股東連兩月買進自家股票- 日報","su":"최근 생명공학주 하락세가 심화되고 있으며, 대주주들은 시장 수호에 만만치 않습니다! 9월과 10월 거래통계에 따르면 생명공학기업 주주는 총 16명이다. 청예메디칼의 리디아잉 회장이 누적 1,208주를 매입해 1위에 올랐고, 우딩의 대주주인 산양공업이 766주를 매입해 뒤를 이었다. 이 밖에도 린옌성 공동회장과 린더젠 총지배인은 총 544장의 티켓을 추가했고, 바오타이 투자회사와 송호린 회장 등 3명이 총 166장의 티켓을 구매해 향후 운영에 대한 낙관적인 입장을 내비쳤다."},{"s":"보고서: 희민보험 시장은 규모 확대에서 구조 조정으로 전환했으며, 혁신적인 약품 보호 구현은 여전히 청구 막힘을 해소해야 합니다.","so":"ThePaper.cn","tm":"11/22 19:31","c":1,"r":"cn","u":"https://www.thepaper.cn/newsDetail_forward_34534647","p":1795343515,"a":1795351405,"t":"报告：惠民保市场由规模扩张转向结构调整，创新药保障落地仍需打通理赔堵点","su":"희민바오 시장은 초기 급격한 성장을 경험한 후 주가조정 단계에 진입하고 있다. 11월 21일, 푸단대학교 경제대학 부학장이자 위험 관리 및 보험학과장인 Xu Xian 교수팀이 '2026년 도시 맞춤형 상업 의료'를 발표했습니다."},{"s":"생명공학 개척자, 상장 시작을 위해 영국 자본 이득세 감면 요구","so":"Financial Times","tm":"11/22 14:00", r/news/articleView.html?idxno=4446373","p":1795564139,"a":1795565195,"su":"이차전지 업종이 내년에는 이익을 확인하는 국면에 들어설 것이라는 분석이 나왔다.미국 에너지저장장치(ESS)가 이익 개선세를 이끌고, 부진했던 유럽 전기차 배터리(전기차를 움직이는 큰 충전 배터리) 납품도 바닥을 통과하고 있다는 판단에서다.박진수 신영증권 연구원은 25일 보고서에서 \"2027년 이차전지 업종은 반등의 기대에서 이익 확인으로 넘어가는 시점\"이라며 \"LG에너지솔루션과 삼성SDI의 2027년 합산 영업이익(장사해서 남긴 돈)은 올해 대비 199% 증가할 전망\"이라고 설명했다.이 가운데 ESS 사업부가 약 70%를 차지할 것이라는 분석이다.박 연구원은 \"지난 3년간 실적 부진의"},{"s":"태성, 복합동박 공장 준공…이차전지 소재 경쟁력 강화","so":"한스경제","tm":"11/25 08:08","c":1,"r":"kr","u":"http://www.hansbiz.co.kr/news/articleView.html?idxno=886883","p":1795561709,"a":1795574635,"su":"| 서울=한스경제 김종효 기자 | 코스닥(한국 중소·기술 회사들이 모인 주식시장) 상장(주식시장에 처음 들어오는 것)사 태성이 24일 경기도 안산시 성곡동 복합동박 신소재공장에서 준공식을 열고 차세대 이차전지 소재사업을 넓히기 위한 생산 기반을 마련했다고 25일 밝혔다.준공된 안산 신소재공장은 종전 1512평 규모 건물을 증축하고 개조해 총 2818평 규모의 생산 시설로 탈바꿈했다. 회사는 이곳을 복합동박 소재 생산의 핵심 기지로 삼고, 앞으로 늘어날 고객사 수요에 맞춘 생산체계를 갖춰갈 예정이다.태성은 기존 인쇄회로기판(PCB) 습식공정 장비사업에서 축적한 정밀 표면처리 및 도금 기술을 토대로 복합동"},{"s":"축전지 산업, 성장의 기둥에… 도쿠시마 배터리 밸리 구상의 지금","so":"ニュースイッチ by 日刊工業新聞社","tm":"11/25 06:01","c":1,"r":"jp","u":"https://newswitch.jp/p/50905","p":1795554060,"a":1795560817,"t":"蓄電池産業、成長の柱に…徳島バッテリーバレイ構想の今","su":"도쿠시마현이 축전지 산업을 지역 경제의 기둥으로 키우려고 하고 있다. 2024년 7월에 책정한 「도쿠시마 배터리 밸리 구상」을 축으로, 현내에 집적하는 전지 재료나 부재, 제조 설비 등의 강점을 살리면서, 기업 유치와 현내 기업의 육..."},{"s":"배터리 재활용 사업 매각 계획, 바스프는 양극재로 초점 전환","so":"第一财经","tm":"11/25 04:32","c":1,"r":"cn","u":"https://www.yicai.com/news/103452333.html","p":1795548747,"a":1795560815,"t":"拟出售电池回收业务，巴斯夫将重心转向正极材料","su":"5년 전 독일 화학 대기업 바스프가 배터리 소재 사업에 최대 45억유로(약 4조원) 규모의 투자 계획을 제안했다. 이제 글로벌 전기 자동차 및 배터리 시장 환경이 변화함에 따라 바스프는 배터리 소재 사업 레이아웃을 더욱 조정하고 양극 활물질 분야에 자원을 집중했습니다. 제일재경 기자는 오늘 바스프 공식 웹사이트를 통해 바스프가 11월 20일 독일 배터리 재활용 회사인 Cylib와 유럽과 북미 지역의 배터리 재활용 사업을 Cylib에 매각하기로 계약을 체결했다는 사실을 알게 되었습니다. 이번 거래에는 독일 슈바르츠하이데에 위치한 흑색 화약 생산 공장과 배터리 재활용 프로토타입 공장뿐만 아니라 관련 지적 재산, 고객 계약 및 파트너십도 포함됩니다. 이번 거래는 관련 규제 당국의 승인과 기존 마감 조건 충족을 거쳐 2027년 2분기~3분기에 완료될 것으로 예상된다. 당사자들은 거래 금액을 공개하지 않았습니다."},{"s":"서머셋 전기 배터리 기가팩토리 건설사 탈락","so":"BBC","tm":"11/25 01:22","c":1,"r":"world","u":"https://www.bbc.com/news/articles/cx30g8005684o","p":1795537359,"a":1795560818,"t":"Somerset electric battery gigafactory builder drops out","su":"TSL은 2026년 브리지워터 인근에 기가팩토리(배터리 등을 아주 많이 만드는 거대한 공장) 외관을 건설하는 계약을 체결했다."},{"s":"바스프, CATL 공급: Schwarzheide에서 CAM 선적 시작","so":"electrive.com","tm":"11/24 21:30","c":1,"r":"us","u":"https://www.electrive.com/2026/11/24/basf-supplies-catl-cam-shipments-from-schwarzheide-have-begun/","p":1795523400,"a":1795530504,"t":"BASF supplies CATL: CAM shipments from Schwarzheide have begun","su":"바스프가 CATL에 납품을 시작했습니다. 공급 계약에는 슈바르츠하이데에 있는 바스프 공장의 고성능 양극재(배터리에서 전기를 내보내는 쪽의 핵심 재료) 공급이 포함됩니다."},{"s":"정부는 전기차 공급업체에 배터리 재활용 부담금을 사전 부과할 계획이다. 의원들은 그 비용이 소비자에게 전가될 것을 우려하고 있다.","so":"Now 新聞","tm":"11/24 21:10","c":1,"r":"hk","u":"https://news.now.com/home/local/player?newsId=670794","p":1795522233,"a":1795530507,"t":"政府擬向電動車供應商預先徵收電池循環再造徵費 議員憂費用轉嫁消費者","su":"[나우뉴스채널] 정부는 2029년부터 전기차 공급업체로부터 배터리 재활용 부담금을 배터리 중량 기준으로 1kg당 6위안부터 시작해 매년 인상할 계획이다. 일부 회원들은 부과금이 소비자에게 전가될지 여부를 우려하고 있습니다."},{"s":"한 가지 평가: 솔트레이크 주식의 취소형 자사주 매입은 리튬 채굴 부문의 가치 회복으로 이어질 수 있다.","so":"第一财经","tm":"11/24 20:33","c":1,"r":"cn","u":"https://www.yicai.com/news/103451336.html","p":1795520007,"a":1795521527,"t":"壹评级：盐湖股份注销式回购，带动锂矿板块估值修复可期","su":"솔트레이크는 11월 23일 저녁 15억~20억 위안을 들여 A주를 매입해 소각에 모두 사용할 계획이라고 밝혔다. 티안치리튬 회장도 4억~8억 위안을 환매하겠다고 제안했다. China Business Network의 \"One Rating\"은 현재 자원 순환 부문의 가치 평가에 대한 주기적인 압력이 있는 상황에서 선두 기업의 취소형 자사주 매입(회사가 자기 주식을 다시 사는 것)은 산업 자본이 현재 낮은 수준을 인식하고 있음을 보여준다고 믿습니다. 이번 조치로 인해 단기적으로 개별 종목 실적이 개선되고 업종 심리가 회복될 것으로 예상되며, 장기적 배분 가치도 점차 부각되고 있다. \"One Rating\"은 이전에 탄산리튬 가격이 90,000위안/톤 이하로 떨어져 일부 고비용 생산 능력이 청산 압력을 받았으며 시장의 비관적인 기대가 업계 평가에 상당한 압력을 가했다고 지적했습니다. 이번 자사주 매입은 순환주식자본을 직접적으로 감소시킬 뿐만 아니라 시장에 강력한 신뢰 신호를 보냅니다. 솔트레이크 자사주 매입 자금 상한액을 기준으로 계산하면, 전체 주식자본금의 1% 이상인 약 5,942만주를 자사주 매입할 수 있어 주당순이익(주식 한 주가 번 돈) 가치가 크게 높아질 것으로 예상된다."},{"s":"우링 Bingo Pro CATL 배터리판 출시","so":"Jiemian.com","tm":"11/24 18:46","c":1,"r":"cn","u":"https://www.jiemian 동기 대비 14.25% 감소했으며 거래금액은 937억9700만 위안으로 집계됐다. 2026년 1월부터 10월까지 중고차 누적 거래량은 1587만1200대로 전년 동기 대비 3.76% 감소해 전년 동기 대비 61만9500대가 감소했고, 누적 거래금액은 10억3019만8000만 위안을 기록했다."},{"s":"에너지 모닝 뉴스 │ 간펑리튬 Industry는 3억 6 천만 위안 이하의 주식 환매에 대한 특별 대출 확약서를 받았습니다. 솔트레이크 주식은 회사 주식을 20억 위안 이하로 환매할 계획입니다.","so":"Jiemian.com","tm":"11/24 09:09","c":1,"r":"cn","u":"https://www.jiemian.com/article/15364158.html","p":1795478958,"a":1795490305,"t":"能源早报｜赣锋锂业取得不超3.6亿元股票回购专项贷款承诺函；盐湖股份拟不超过20亿元回购公司股份","su":"간펑리튬(배터리에 꼭 들어가는 아주 가벼운 금속) Industry는 3억 6천만 위안 이하의 주식 환매에 대한 특별 대출 확약서를 받았습니다. 11월 23일, 간펑리튬 Industry는 최근 회사가 중국공상은행 Xinyu 첨단기술 지점에서 발행한 대출 금액이 3억 6천만 위안 이하(대출 금액은 이번 환매 총액의 90%를 초과하지 않음)인 '대출 약정서'를 받았다고 발표했습니다. 대출기간은 36개월을 초과하지 않으며, 대출목적은 구체적으로 회사 주식을 환매하는 데 사용됩니다. 구체적인 대출사항은 회사와 은행이 정식으로 체결한 주식환매대출계약에 따릅니다. 앞서 회사는 2026년 11월 19일 제24차 제6기 이사회를 열고 '회사 A주(중국 본토(상하이·선전) 주식시장의 주식) 매입 방안에 관한 제안'을 심의, 승인했으며, 회사가 자체 자금 및/또는 자체 조달 자금 중 일부를 총액 2억 위안(포함) 이상 4억 위안(포함) 이하로 사용하기로 합의했습니다. 회사는 회사의 가치와 주주 권리를 보호하기 위해 중앙 집중식 입찰 방식으로 RMB 보통주(A주)를 발행했습니다."},{"s":"CATL, 젠샤워 리튬 광산 재개, 불확실성은 여전히 남아","so":"Benchmark Mineral Intelligence","tm":"11/24 09:00","c":1,"r":"us","u":"https://source.benchmarkminerals.com/article/catl-restarts-jianxiawo-lithium-mine-uncertainty-remains","p":1795478400,"a":1795560814,"t":"CATL restarts Jianxiawo lithium mine, uncertainty remains","su":"CATL은 10월 30일 개정된 환경 영향 평가가 승인된 후 젠샤워 리튬(배터리에 꼭 들어가는 아주 가벼운 금속) 광산에서의 활동을 신속하게 재개했습니다."},{"s":"키움증권 \"이차전지, 내년부터 실적회복…업종 투자의견 상향\"","so":"연합뉴스","tm":"11/24 08:37","c":1,"r":"kr","u":"https://www.yna.co.kr/view/AKR20261124029600008","p":1795477035,"a":1795478659,"su":"(서울=연합뉴스) 김유향 기자 = 키움증권은 \"내년에는 이차전지 산업의 실적(회사가 번 돈 성적표) 회복이 가능할 것이라고 판단한다\"면서 24일 업종에 대한 투자의견(전문가가 사라·팔라고 내는 의견)을..."},{"s":"제일재경 앵커가 말했다 | 아프리카 코발트 수출이 중단됐고 이틀 만에 가격이 20% 급등했다. 휴대폰과 전기차 가격이 다시 오를까?","so":"第一财经","tm":"11/24 06:28","c":1,"r":"cn","u":"https://www.yicai.com/video/103451871.html","p":1795469324,"a":1795530506,"t":"一财主播说｜非洲钴出口被叫停 价格两天大涨20% 你的手机和电动车又要涨价了吗？"},{"s":"올해 중국서 전기트럭 60만대 팔려…리튬 수요 견인","so":"www.dt.co.kr","tm":"11/24 06:00","c":1,"r":"kr","u":"https://www.dt.co.kr/article/12096797","p":1795467600,"a":1795499049,"su":"고유가 여파로 최근 중국에서 전기트럭 판매가 급증하면서 리튬(배터리에 꼭 들어가는 아주 가벼운 금속) 수요가 늘고 있다. 공급 과잉 우려로 침체기를 겪어온 리튬 시장에 예상치 못한 호재가 나타났다는 평가다. 23일(현지시간) 뱅크오브아메리카(BofA) 글로벌 리서치에 따르면, 세계 최대 전기차 시장이자 배터"},{"s":"CNA938 Rewind - #TalkBack: 작업장에서 EV 화재를 처리하기 위해 정비사가 얼마나 잘 훈련되고 준비되어 있습니까?","so":"CNA","tm":"11/23 22:43","c":1,"r":"sg","u":"https://www.channelnewsasia.com/listen/cna938-rewind/talkback-how-well-trainedprepared-are-mechanics-dealing-ev-fires-in-their-workshops-6575101","p":1795441406,"a":1795447022,"t":"CNA938 Rewind - #TalkBack: How well trained/prepared are mechanics for dealing with EV fires in their workshops?","su":"목요일(11월 19일) 신밍에 있는 작업장에서 포르쉐 타이칸의 EV 배터리에 불이 붙은 것으로 알려졌습니다. 직원들이 차량에서 배터리를 제거하던 중이었습니다. 연기를 흡입한 2명이 병원으로 이송됐다. 더 많은 EV가 싱가포르 도로를 주행함에 따라 기계공은 고전압 배터리를 사용하여 작업하게 될 것입니다."},{"s":"리오토의 'CATL 의존 줄이기'는 치열하다","so":"36Kr","tm":"11/23 21:44","c":1,"r":"cn","u":"http://www.36kr.com/p/4082286201181830","p":1795437851,"a":1795490305,"t":"理想“去宁德化”凶猛","su":"리오토의 'CATL 의존 줄이기'가 격렬하다 지난 9월 리샹과 마둥휘는 젱위췬과 한웨이를 만나기 위해 푸젠성 닝더로 갔다. 양측은 5년간의 포괄적 전략 협력 협정을 체결했습니다. 당시 CATL 배터리를 탑재한 릴리스 자동차의 누적 납품량은 100만 대가 조금 넘었다. 계약 체결 직후 배터리 공급 부족으로 릴리 i6 배송이 지연됐다. 올해 11월에는 채권(나라나 회사에 돈 빌려준 증서)추심과 MEGA 리콜 논란이 확산됐다. 이상형은 두 회사가 여전히 전략적 파트너로 남아 있다고 답했습니다. CATL은 로펌에 편지를 보내도록 의뢰했는데, 그 이메일은 정상적인 화해 및 지불 알림 이메일이었고 MEGA 리콜 개입도 거부했습니다. 두 배터리 공장의 고객 목록을 보면 이상적인 레이아웃과 위치가 변경되었습니다. 중국승용차협회가 수집한 고객 설치 데이터에 따르면, Ideal은 올해 6월에도 여전히 CATL의 4번째로 큰 고객으로 CATL 설치 용량의 6.8%를 차지했다. 같은 기간 순완다 고객사 중 6.4%로 5위를 차지했다. 8월까지 Ideal은 CATL의 상위 5개 고객사에서 사라졌으며 Sunwanda 설치 용량의 39%를 차지하고 Sunwanda 고객 목록에서 1위를 차지했습니다."},{"s":"승용차협회지부 최동수 : 2026년 파워배터리 시장은 \"두 영웅의 점유율이 완화되고, 2세대는 상승세를 가속화한다\"는 추세를 보일 것이다.","so":"Jiemian.com","tm":"11/23 18:04","c":1,"r":"cn","u":"https://www.jiemian.com/article/15362947.html","p":1795424688,"a":1795434999,"t":"乘联分会崔东树：2026年动力电池市场呈现“双雄份额松动，二线梯队加速崛起”态势","su":"11월 23일, Cui Dongshu 승용차협회 사무총장은 \"신에너지 자동차 리튬(배터리에 꼭 들어가는 아주 가벼운 금속) 배터리 시장 분석 - 2026년 10월\"을 발표했습니다. 최동수 분석에 따르면 2026년 파워 배터리 시장은 '두 영웅의 주가는 하락세를 보이고, 2위권은 상승세(오르는 흐름)를 가속화'하는 추세를 보일 것으로 보인다. CATL은 여전히 44.0%의 점유율로 시장을 선도하고 있지만, 분기 대비 감소했습니다(4분기에는 40.5%로). BYD는 19.1%로 소폭 상승했다. 동시에 궈쉬안(6.1%), EVE에너지(5.5%), Geely Yaoning(2.5%) 등 2위 기업의 주가가 크게 상승했습니다. 후발 기업(Doufuoduo, Funeng Technology 등)의 주식은 기본적으로 청산되었습니다. 전체적인 산업집중도는 낮아지고 경쟁은 더욱 다양해졌습니다."},{"s":"중국의 전기 트럭 붐으로 리튬 수요 증가","so":"Reuters","tm":"11/23 16:31","c":1,"r":"world","u":"https://www.reuters.com/business/autos-transportation/chinas-electric-truck-boom-lifts-demand-lithium-2026-11-23/","p":1795419060,"a":1795424011,"t":"China's electric truck boom lifts demand for lithium"},{"s":"단말측 AI 폭발이 배터리 수요 확대와 기술 발전을 견인하고 있다! Sanhua Intelligent Control과 Kedali는 7% 이상 상승했고, 배터리 ETF China Universal(159796) 지수는 2.5% 이상 상승했으며, CATL은 거의 60억 위안을 환매했습니다!","so":"Jiemian.com","tm":"11/23 16:19","c":1,"r":"cn","u":"https://m.jiemian.com/article/15362201.html","p":1795418376,"a":1795424010,"t":"端侧AI爆发，推动电池需求扩容与技术进步！三花智控、科达利涨超7%，电池ETF汇添富(159796)指数涨超2.5%，宁德时代回购近60亿元！","su":"11월 23일 오후 A주(중국 본토(상하이·선전) 주식시장의 주식) 시장은 급등했고 상하이 주가지수는 하락폭을 줄였습니다! 보도시간 현재 배터리 ETF(여러 주식을 묶어 파는 상품) 차이나유니버셜(159796)의 기초지수가 반격하며 2.5% 이상 상승하며 7년 연속 마이너스 행진을 마감할 것으로 예상된다."},{"s":"[단독] 한진, 에코프로와 합작사 설립…배터리 물류 사업 본격화","so":"서울경제","tm":"11/23 16:10","c":1,"r":"kr","u":"https://www.sedaily.com/article/20117841","p":1795417845,"a":1795424008,"su":"단독한진, 배터리 물류 드라이브...에코프로와 합작법인 설립 에코한진물류 지분(회사를 나눠 가진 몫) 49% 확보 7월부터 가동…사업영역 확대 한진이 에코프로그룹과 손잡고 배터리 물류 합작법인을 설립했다. 이차전지 제조설비 운송과 항공운송 인증 취득 등으로 배터리 관련 역량을 쌓은 데 이어 이차전지 소재 기업과 공동 사업에 나서며 배터리 물류사업을 확대하는 모습이다. 23일 물류업계에 따르면 한진은 에코프로 자회사 에코로지스틱스와 공동 출자해 에코한진물류센터를 설립하고 지분 49%를 확보했다."},{"s":"포스코퓨처엠 \"차세대 음극재, 매달 수백건 테스트\"","so":"한국경제","tm":"11/23 16:08","c":1,"r":"kr","u":"https://www.hankyung.com/article/202611234670i","p":1795417694,"a":1795424008,"su":"포스코퓨처엠 \"차세대 음극재(충전할 때 전기를 받아 모아 두는 쪽 재료), 매달 수백건 테스트\", 세종기술연구소 현장 가보니 저팽창 천연흑연 2세대 연내 출시 실리콘 음극재 양산도 초읽기 \"탈중국 공급망(부품·재료가 오가는 연결망) 수요 적극 대응\""},{"s":"'산업자료' 승용차협회 : 10월 파워배터리 생산량은 245.1GWh로 전년 동기 대비 44% 증가","so":"etnet 經濟通","tm":"11/23 15:44","c":1,"r":"hk","u":"http://www.etnet.com.hk/www/tc/news/news-article.php?section=categorized&category=china&newsid=20261123755","p":1795416240,"a":1795417554,"t":"《行業數據》乘聯分會：10月動力電池產量245.1GWh，同比增44%","su":"2026-11-23 14:44 \"업계 자료\" 승용차협회지부: 10월 파워 배터리 생산량은 245.1GWh로 전년 동기 대비 44% 증가했습니다. 승용차협회 지부 Cui Dongshu는 10월 전력 배터리 생산량이 245.1GWh로 전년 대비 44% 증가했다고 밝혔습니다. 이 중 인산철리튬(배터리에 꼭 들어가는 아주 가벼운 금속)은 213.1GWh로 전년 동기 대비 56% 증가했고, 삼원리튬은 31.7GWh로 전년 동기 대비 6% 감소했다. 1~10월 누적 생산량은 2078.1GWh로 전년 동기 대비 61% 증가했으며, 인산철리튬 누적 생산량은 1736.4GWh로 전년 대비 70% 증가했다. 2026년 10월에는 전년 대비 18% 증가한 99GWh의 전기차 배터리(전기차를 움직이는 큰 충전 배터리)가 차량에 장착될 예정입니다. 구조는 극도로 차별화됐다. 인산철리튬은 86GWh(87%)로 전년 대비 28% 증가했다. 삼원리튬은 13GWh에 불과해 전년 대비 22% 감소했다. 1월부터 10월까지 총 676GWh가 설치돼 전년 동기 대비 17% 증가했는데, 이 중 인산철리튬이 564GWh(83% 차지)에 달했고 삼원계는 111GWh에 불과했다."},{"s":"LG엔솔, 배터리사 최초 UN 주도 ‘지속가능발전 선도기업’ 선정","so":"Chosunbiz","tm":"11/23 15:40","c":1,"r":"kr","u":"https://biz.chosun.com/industry/company/2026/11/23/QG25EIWP6FEP7C77OZVI5CBMEI/","p":1795416000,"a":1795417549,"su":"LG에너지솔루션이 국내 배터리 기업 가운데 최초로 유엔글로벌콤팩트(UNGC) 한국협회 리드(LEAD) 기업에 선정됐다고 23일 밝혔다. UNGC는 국제연합(UN)이 주도하는 지속가능경영 협의체로, 지속가능발전목표(SDGs) 달성에 기여한 회원사를 대상으로 선도기업을 선정해왔다. LG에너지솔루션은 2022년 4월 UNGC에 가입한 이후 기후변화 대응, 환경·사회·지배구조(ESG) 경영, 지속가능성 의제와 관련한 협회 주요 활동과 프로그램에 적극 참여해왔다."},{"s":"중국 흑연 수출 통제에 실리콘 전지소재 부각, 김종우 SK넥실리스 실리콘 음극재용 동박 선점 나서","so":"비즈니스포스트","tm":"11/23 15:26","c":1,"r":"kr","u":"https://www.businesspost.co.kr/BP?command=article_view&num=452663","p":1795415205,"a":1795424008,"su":"실리콘 음극재(충전할 때 전기를 받아 모아 두는 쪽 재료)는 기존 흑연 음극재보다 에너지밀도가 약 10배 높아, 배터리 성능을 높일 수 있는 차세대 소재로 불린다. 다만 현재 충·방전 과정에서 음극재가 부풀어오르는 기술적 걸림돌로 상용화(실제로 팔고 쓰이기 시작하는 것)가 늦어지고 있다. SK넥실리스는 이같은 기술적 허들을 넘을 수 있는 실리콘 음극재용 전용 동박을 최근 개발하는 데 성공했다. 김종우 SK넥실리스 대표이사 사장은 실리콘 음극재용 동박 시장을 선점해 오랜 실적 부진에서 벗어난다는 계획이다."},{"s":"배터리ETF 인베스코(159757) 추적지수 중국증권 신에너지차 배터리지수는 2.22% 진입을 단호히 방지 ⑤ CATL, Tianyue Advanced, Yunnan Germanium Industry, CSSC Special Gas의 3분기 보고서가 공개된다. 매크로뉴스 1. 국무원의 승인을 받아 국립데이터그룹주식회사가 설립되었습니다. 국무원 국유자산감독관리위원회는 국무원을 대신하여 투자자의 직무를 수행한다. 국무원 국유자산감독관리위원회가 투자자의 임무를 수행하는 기업 목록에 포함될 것이다. 2. 미국 국토안보부는 10월 19일 미국 연방정부의 민간행정기관이 중국 인공지능 기업 딥서치(Deep Search) 및 그 계열사가 개발한 제품 및 서비스를 구매하는 것을 금지하고 관련 제품 및 서비스를 관련 기관의 정보시스템에서 제거하도록 요구한다고 발표했다. 상무부는 이에 대해 중국측은 강한 불만을 표하며 단호히 반대한다고 밝혔습니다. 미국은 양국 정상이 달성한 중요한 공감대를 진지하게 이행하고, 중국과 중간 협력하고, 중미 인공지능 대화 메커니즘을 잘 활용하고, 상호 신뢰를 강화하고, 차이를 관리하며, 인공지능을 공동으로 추진하기를 희망합니다."},{"s":"태양광전기자동차 양산버전이 납품되었습니다! 충전 없이 하루 60km 출퇴근 가능","so":"自由電子報汽車頻道","tm":"11/23 13:46","c":1,"r":"tw","u":"https://auto.ltn.com.tw/news/33527/3","p":1795409160,"a":1795411384,"t":"太陽能電動車量產版完成交車！日常通勤 60 公里不需充電","su":"작년에 새로운 브랜드인 Aptera는 태양광 세발자전거 출시 버전을 출시했습니다. 당시 양산(공장에서 많이 만들어 내는 것) 준비가 완료됐다고 발표됐다. 올해 미국 환경보호청(EPA)으로부터 적합 인증서를 획득했다. 첫 번째 출시 에디션은 브랜드의 초기 투자자인 마틴 하토노(Martin Hartono)에게 공식적으로 전달되었습니다. 이는 태양전지를 사용하여 하루 60km를 제공하는 이 세발자전거가 곧 대량 생산되어 출시된다는 의미이기도 합니다."},{"s":"DK-1788W 무선 2D 바코드 스캐너, 작업 중단 없이 교체 가능한 배터리 설계로 시장 판도를 뒤집다 | 인기 하이라이트 | 사업정보","so":"經濟日報","tm":"11/23 11:02","c":1,"r":"tw","u":"https://money.udn.com/money/story/5635/9894613","p":1795399365,"a":1795403790,"t":"DK-1788W無線二維條碼掃描器 以可換電池設計顛覆市場讓作業不中斷 | 熱門亮點 | 商情","su":"요즘에는 많은 제품이 첨단 기술을 강조하지만 일부 업계 관계자는 \"첨단 기술이 없고 인간의 요구와 작동 관성에 부응하는\" 매우 간단한 제품인 DK-1788W 무선 2D 바코드 스캐너를 출시했습니다. 리모콘만큼 조작하기 쉽고, 심지어 아야(Aya)도 사용할 수 있을 만큼 간단하다고 합니다. 많은 기업과 가맹점이 기존의 무선 바코드 스캐너를 사용하다 보면 내장 배터리의 노후화, 수리의 어려움, 심지어 배터리 하나의 손상으로 기기 전체를 폐기해야 하는 딜레마에 직면하는 경우가 많습니다. 사용자의 문제점을 완전히 해결하기 위해 업계에서 \"스캐너 최고의 전문가\"로 알려진 Huangwei International Company는 \"교체 가능한 배터리\" 디자인으로 시장을 뒤집고 가정용 TV 리모컨처럼 사용하기 쉬운 새로운 \"DK-1788W 무선 2D 바코드 스캐너\"를 출시했습니다. \"교체 가능한 AAA 배터리\" 설계는 제조업체가 설정한 숨겨진 비용 함정을 깨고 비용 효율적이고 임계값이 없는 새로운 옵션을 시장에 출시하여 사용자가 배터리 노후화에 대한 불안과 높은 유지 관리 비용에 작별을 고할 수 있도록 약속합니다. 본 제품은 공식 채널을 통해 출시되었으며, 시장에 충격과 반향을 불러일으킬 것으로 예상됩니다. 회사는 DK-1788W의 핵심 하이라이트는 다음과 같다고 밝혔습니다. 1. 배터리 수명을 기다리는 시간이 전혀 없고 몇 초 만에 전체 체력이 부활한
